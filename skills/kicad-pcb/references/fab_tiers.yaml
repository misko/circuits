# Fab capability model — the tiers a board can be ordered at, as DATA.
#
# Consumed by scripts/escape_check.py (package escape feasibility) and
# scripts/policy_audit.py (P-ESC / P-TIER). A part.yaml `escape.tier_required`
# and a nets.yaml `fab_tier:` both name entries from this file.
#
# Canon M6: the fab's PUBLISHED capability page overrides these numbers at
# order time — this file records the values the pipeline has actually proven
# by ordering (provenance on each entry) plus the fab's published floors.
# `rank` orders tiers by cost: escape_check reports the LOWEST-rank feasible
# tier; raising a board's fab_tier above a brief's cost ceiling requires an
# ADR (D-TIER).
#
# Numbers are mm.
#
# SILK floors (min_silk_text_height / min_silk_stroke), identical across
# tiers — silkscreen is the same inkjet process at every JLC copper tier:
#   * JLC capability page publishes 1.0mm min character height and 0.15mm
#     min line width as the LEGIBILITY guarantee — "verify at order time"
#     (canon M6); text below that prints, it just may print badly.
#   * The ENFORCED height floor here is 0.45mm: what the pipeline has
#     actually PROVEN by ordering — cook-loadcell / crow-array-pod shipped
#     legible 0.6mm refdes with a 0.45mm de-collision fallback. Raising the
#     floor to the published 1.0mm would retroactively outlaw those shipped
#     boards; heights in [0.45, 1.0) are a documented legibility risk, not
#     a fab reject.
#   * THE TWO FLOORS ARE COUPLED, and until 2026-07-29 they contradicted each
#     other (found by G-SELFCON, ADR-0007). KiCad clamps a text stroke to
#     <= 0.25 x height, so 0.45mm text can carry AT MOST 0.1125mm of stroke:
#     a 0.15 stroke floor beside a 0.45 height floor is UNSATISFIABLE and no
#     board could ever have met both. smc0985-cooksense then shipped SIX
#     SAFETY designators (J_ESTOP, J_DOOR, J_MODE, D_DOOR, R_DOORPD,
#     D_COILEN) below the stroke floor, and the waiver written the same day
#     called 0.13 acceptable. Nothing could have passed; nothing said so.
#     `min_silk_stroke` is therefore now the stroke the ENFORCED height can
#     actually carry (0.25 x 0.45 = 0.1125), consistent with the same
#     proven-by-ordering evidence that set the height — those shipped boards
#     printed at 0.1125 by construction. It is NOT a claim that JLC's
#     published 0.15 has been relaxed.
#   * THE COUPLING HAS TWO BOUNDS, NOT ONE, and the first version of this
#     paragraph (2026-07-29 morning) modelled only the upper one and got the
#     corollary WRONG. Both bounds are now stated, and both are MACHINE-CHECKED
#     by G-SELFCON against `generate_board_generic.silk_stroke` itself:
#       - UPPER (KiCad): a plotted stroke is clamped to <= 0.25 x text height.
#       - LOWER (this pipeline): the generator emits
#             stroke = max(min_silk_stroke, HARD, RATIO x height)
#         with (HARD, RATIO) = (0.13, 0.16) for board silk text and
#         (0.09, 0.20) for the refdes de-collision path — two DIFFERENT pairs,
#         which is why one hand-derived number could not cover both.
#     `min_silk_stroke` is therefore pinned: it must equal what the generator
#     actually emits at this tier's own `min_silk_text_height`, in BOTH
#     directions. A published floor ABOVE that is unsatisfiable (the ad487df
#     defect); a published floor BELOW it is a fiction, since no board can be
#     built thinner than the generator's own hard floor.
#   * TO REACH THE PUBLISHED 0.15 STROKE, TEXT MUST BE >= 0.9375mm — NOT the
#     0.60mm this file claimed for one day. At 0.60 the generator emits
#     max(0.1125, 0.13, 0.096) = 0.13; 0.70 and 0.80 also emit 0.13; only
#     0.16 x h >= 0.15 gets there, i.e. h >= 0.9375. MEASURED, not derived:
#     pluto-rx2-8way's port captions print 0.152 at h=0.95 and its 0.60mm
#     safety captions print 0.130, and pluto-cal-switch reached 0.16/0.192 by
#     going to 1.0/1.2mm. Both boards had to measure the generator after
#     following the 0.60 sentence and finding it did not hold.
#     That threshold is the rule for anything a human reads under stress:
#     connector and safety designators, polarity marks, terminal legends. It is
#     carried per tier as `published_stroke_min_height` so it is CHECKED rather
#     than believed — a prose corollary is exactly what went wrong here.

tiers:
  jlc_2layer_default:
    rank: 0
    layers: 2
    min_track: 0.127          # 5mil, conservative floor used by shipped 2-layer boards
    min_space: 0.127
    min_via_diameter: 0.6     # the value the route.yaml templates carry
    min_via_drill: 0.3
    max_pth_aspect_ratio: 10.0  # board thickness / mechanical drill; JLC published 2026-04-22
    min_hole_to_hole: 0.5     # JLC published hole-to-hole floor — the binding
                              # constraint for adjacent-pin escape vias
                              # (ADR-0008: 0.65mm pitch - 0.3 drill = 0.35 < 0.5)
    via_in_pad: false
    min_silk_text_height: 0.45  # proven by ordering; JLC page says 1.0 — see header
    min_silk_stroke: 0.1125    # what the generator EMITS at the 0.45 height
                               # floor, = KiCad's 0.25 x height clamp there.
                               # G-SELFCON pins both directions; see header.
    published_silk_stroke: 0.15         # JLC's published legibility floor (M6)
    published_stroke_min_height: 0.9375  # ... first height the generator
                               # actually reaches it at (0.16 x h >= 0.15).
                               # NOT 0.60: at 0.60 the emitted stroke is 0.13.
    provenance: "cook-loadcell / crow-array-pod shipped at these floors"

  jlc_4layer_standard:
    rank: 1
    layers: 4
    min_track: 0.127
    min_space: 0.127
    min_via_diameter: 0.45    # JLC no-fee multilayer via 0.45/0.3
    min_via_drill: 0.3
    max_pth_aspect_ratio: 10.0  # board thickness / mechanical drill; JLC published 2026-04-22
    min_hole_to_hole: 0.5     # JLC published — binds adjacent-pin escape vias
                              # (usb-pwr-hub-3s ADR-0008, 2026-07-21)
    via_in_pad: false
    min_silk_text_height: 0.45  # proven by ordering; JLC page says 1.0 — see header
    min_silk_stroke: 0.1125    # what the generator EMITS at the 0.45 height
                               # floor, = KiCad's 0.25 x height clamp there.
                               # G-SELFCON pins both directions; see header.
    published_silk_stroke: 0.15         # JLC's published legibility floor (M6)
    published_stroke_min_height: 0.9375  # ... first height the generator
                               # actually reaches it at (0.16 x h >= 0.15).
                               # NOT 0.60: at 0.60 the emitted stroke is 0.13.
    provenance: >
      JLC published no-fee multilayer floor. The clean-room 3S run's 2
      drill_out_of_range violations (2026-07-20) were router-emitted vias
      below this floor — the ADVANCED requirement surfacing as DRC.

  jlc_4layer_advanced:
    rank: 2
    layers: 4
    min_track: 0.09
    min_space: 0.09
    min_via_diameter: 0.25
    min_via_drill: 0.15
    max_pth_aspect_ratio: 10.0  # board thickness / mechanical drill; JLC published 2026-04-22
    min_hole_to_hole: 0.25    # JLC advanced-option floor — verify at order time
    via_in_pad: true          # POFV: resin-filled + capped, paid option
    min_silk_text_height: 0.45  # proven by ordering; JLC page says 1.0 — see header
    min_silk_stroke: 0.1125    # what the generator EMITS at the 0.45 height
                               # floor, = KiCad's 0.25 x height clamp there.
                               # G-SELFCON pins both directions; see header.
    published_silk_stroke: 0.15         # JLC's published legibility floor (M6)
    published_stroke_min_height: 0.9375  # ... first height the generator
                               # actually reaches it at (0.16 x h >= 0.15).
                               # NOT 0.60: at 0.60 the emitted stroke is 0.13.
    order_readme: "ADVANCED option REQUIRED: min via 0.25/0.15 mm (<reason>)"
    provenance: >
      usb-power-3s v1.0-v1.3 ordered with exactly this line ("VQFN fanout");
      0.09mm track floor used by the 3s-cleanroomv2 advanced-tier grind.

  jlc_6layer_standard:
    rank: 3
    layers: 6
    min_track: 0.127
    min_space: 0.127
    min_via_diameter: 0.45    # JLC no-fee multilayer via 0.45/0.3
    min_via_drill: 0.3
    max_pth_aspect_ratio: 10.0  # board thickness / mechanical drill; JLC published 2026-04-22
    min_hole_to_hole: 0.5     # JLC published — binds adjacent-pin escape vias
    via_in_pad: false
    min_silk_text_height: 0.45  # proven by ordering; JLC page says 1.0 — see header
    min_silk_stroke: 0.1125    # what the generator EMITS at the 0.45 height
                               # floor, = KiCad's 0.25 x height clamp there.
                               # G-SELFCON pins both directions; see header.
    published_silk_stroke: 0.15         # JLC's published legibility floor (M6)
    published_stroke_min_height: 0.9375  # ... first height the generator
                               # actually reaches it at (0.16 x h >= 0.15).
                               # NOT 0.60: at 0.60 the emitted stroke is 0.13.
    order_readme: "6-layer stackup selected in the order form (<reason>)"
    provenance: >
      JLC published 6L standard floor (same via geometry as 4L standard;
      the layer count is what you pay for). Named by crow-array-central
      ADR-0008 (6L escalation) — whose "no small-via option needed" claim
      ADR-0009 then falsified for 0.4mm via-in-pad escapes; kept as the
      rank step between 4L-advanced and 6L-small-via.

  jlc_6layer_smallvia:
    rank: 4
    layers: 6
    min_track: 0.09
    min_space: 0.09
    min_via_diameter: 0.30
    min_via_drill: 0.15
    max_pth_aspect_ratio: 10.0  # board thickness / mechanical drill; JLC published 2026-04-22
    min_hole_to_hole: 0.2     # crow-array-central DRU floor (TDO/TDI pair
                              # re-dogboned to clear it); verify at order time
    via_in_pad: true          # ADR-0009: 0.30/0.15 via-in-pad on 0.4mm pitch
                              # keeps 0.10mm copper gap — resin fill + cap
    min_silk_text_height: 0.45  # proven by ordering; JLC page says 1.0 — see header
    min_silk_stroke: 0.1125    # what the generator EMITS at the 0.45 height
                               # floor, = KiCad's 0.25 x height clamp there.
                               # G-SELFCON pins both directions; see header.
    published_silk_stroke: 0.15         # JLC's published legibility floor (M6)
    published_stroke_min_height: 0.9375  # ... first height the generator
                               # actually reaches it at (0.16 x h >= 0.15).
                               # NOT 0.60: at 0.60 the emitted stroke is 0.13.
    order_readme: "6 layers + \"advanced\" SMALL-VIA option REQUIRED: min via 0.30/0.15 mm (<reason>)"
    provenance: >
      crow-array-central v1.0-2026-07-18 SEALED at these floors (ADR-0009:
      0.30/0.15 via-in-pad TQFP-128 0.4mm escape; DRU 0.09 track/clearance,
      0.2 hole-to-hole, DRC 0/0/0) and adopted by crow-recorder-central
      (ADR-0011/0012). Design-proven, NOT yet ordered (archive order was
      gated on field tests) — verify every floor against the JLC capability
      page at order time (canon M6).
