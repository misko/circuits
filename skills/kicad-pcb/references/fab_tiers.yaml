# Fab capability model — the tiers a board can be ordered at, as DATA.
#
# Consumed by scripts/escape_check.py (package escape feasibility) and
# scripts/policy_audit.py (P-ESC / P-TIER). A part.yaml `escape.tier_required`
# and a nets.yaml `fab_tier:` both name entries from this file.
#
# Canon M6: the fab's PUBLISHED capability page overrides these numbers at
# order time — this file records the values the pipeline has actually proven
# by ordering (provenance on each entry) plus the fab's published floors.
# `rank` orders tiers by cost: escape_check reports the LOWEST-rank feasible
# tier; raising a board's fab_tier above a brief's cost ceiling requires an
# ADR (D-TIER).
#
# Numbers are mm.
#
# SILK floors (min_silk_text_height / min_silk_stroke), identical across
# tiers — silkscreen is the same inkjet process at every JLC copper tier:
#   * JLC capability page publishes 1.0mm min character height and 0.15mm
#     min line width as the LEGIBILITY guarantee — "verify at order time"
#     (canon M6); text below that prints, it just may print badly.
#   * The ENFORCED height floor here is 0.45mm: what the pipeline has
#     actually PROVEN by ordering — cook-loadcell / crow-array-pod shipped
#     legible 0.6mm refdes with a 0.45mm de-collision fallback. Raising the
#     floor to the published 1.0mm would retroactively outlaw those shipped
#     boards; heights in [0.45, 1.0) are a documented legibility risk, not
#     a fab reject.

tiers:
  jlc_2layer_default:
    rank: 0
    layers: 2
    min_track: 0.127          # 5mil, conservative floor used by shipped 2-layer boards
    min_space: 0.127
    min_via_diameter: 0.6     # the value the route.yaml templates carry
    min_via_drill: 0.3
    via_in_pad: false
    min_silk_text_height: 0.45  # proven by ordering; JLC page says 1.0 — see header
    min_silk_stroke: 0.15       # JLC capability page — verify at order time
    provenance: "cook-loadcell / crow-array-pod shipped at these floors"

  jlc_4layer_standard:
    rank: 1
    layers: 4
    min_track: 0.127
    min_space: 0.127
    min_via_diameter: 0.45    # JLC no-fee multilayer via 0.45/0.3
    min_via_drill: 0.3
    via_in_pad: false
    min_silk_text_height: 0.45  # proven by ordering; JLC page says 1.0 — see header
    min_silk_stroke: 0.15       # JLC capability page — verify at order time
    provenance: >
      JLC published no-fee multilayer floor. The clean-room 3S run's 2
      drill_out_of_range violations (2026-07-20) were router-emitted vias
      below this floor — the ADVANCED requirement surfacing as DRC.

  jlc_4layer_advanced:
    rank: 2
    layers: 4
    min_track: 0.09
    min_space: 0.09
    min_via_diameter: 0.25
    min_via_drill: 0.15
    via_in_pad: true          # POFV: resin-filled + capped, paid option
    min_silk_text_height: 0.45  # proven by ordering; JLC page says 1.0 — see header
    min_silk_stroke: 0.15       # JLC capability page — verify at order time
    order_readme: "ADVANCED option REQUIRED: min via 0.25/0.15 mm (<reason>)"
    provenance: >
      usb-power-3s v1.0-v1.3 ordered with exactly this line ("VQFN fanout");
      0.09mm track floor used by the 3s-cleanroomv2 advanced-tier grind.
