# grind_fixes — the mechanical DRC grind table, as DATA.
#
# Consumed by scripts/grind_driver.py: each cycle's classified findings are
# looked up HERE, class by class. `action: auto` fixes are applied by the
# driver without a human/agent in the loop; `action: escalate` classes stop
# the loop with a compact report (06_build/grind_escalation.md) — real
# design work must never be "fixed" mechanically. A class with NO entry is
# NOVEL and escalates immediately: an auto-fixer guessing at an unknown
# finding class is worse than none.
#
# Canon M4/M6 discipline: every entry carries PROVENANCE — the measured
# incident it came from. The founding composition is the v4 usb-hub-3s
# clean-room canary's FIRST full DRC on a fresh 112-part board
# (2026-07-21, 648 findings): 157 track_width + 116 lib_footprint_issues +
# 112 text_height were BATCH classes owned by the generators (all three
# since fixed at generation: 4f280de, b5bdae4, dad8993 — the auto entries
# below exist to RERUN those fixes when a stale board still carries the
# class), while 141 clearance + 41 unconnected were real routing/placement
# work whose loop `quick` cheapens and this driver bounds.
#
# `run` names a driver-known procedure, not a shell string:
#   rebuild — rerun the project's rebuild chain (03_src/rebuild_all.sh):
#             regeneration + promoted-route re-import + rules-LAST. The v1
#             conservative set is rebuild-only, because all three shipped
#             auto fixes live in the generators.

fixes:
  # ---------------------------------------------------------- AUTO ------
  - class: track_width
    detect: "Track width (rule '<CLASS>_width' min width X; actual Y)"
    action: auto
    fix: >
      wave-width/class alignment rerun: wave track_width now DERIVES from
      the netclass floors and sub-floor waves die at prep (4f280de). A
      rebuild re-imports the route and re-runs rules-LAST at the derived
      widths. If the class persists, the PROMOTED chain itself was routed
      thin — that needs a re-route, which D-BACK will surface within 3
      cycles.
    run: rebuild
    provenance: >
      v4 usb-hub-3s first DRC 2026-07-21: 157/648 findings; residual
      sample in its gate.json: 5VA at 0.5mm under PWR_RAIL 0.8mm floor.

  - class: text_height
    detect: "Text height out of range (board setup constraints silk text height ...)"
    action: auto
    fix: >
      silk floor normalization rerun: the board's silk DRC constraint and
      footprint-internal text heights both derive from the fab tier since
      dad8993 (KiCad's fresh-board 0.8mm default vs the 0.6mm emitted
      refdes was the whole class). Regeneration via rebuild empties it.
    run: rebuild
    provenance: >
      v4 usb-hub-3s first DRC 2026-07-21: 112/648 findings, one per
      visible Reference field (0.6mm vs the 0.8mm pcbnew default).

  - class: text_thickness
    detect: "Text thickness out of range (silk constraints)"
    action: auto
    fix: same normalization as text_height — emitted and footprint-internal
      silk strokes are floored at the tier's min_silk_stroke (dad8993).
    run: rebuild
    provenance: "same incident family as text_height (v4, 2026-07-21)"

  - class: lib_footprint_issues
    detect: "The current configuration does not include the footprint library 'X'"
    action: auto
    fix: >
      fp-lib-table emission rerun: the table is emitted by default beside
      the board since b5bdae4, with the env var matched to the running
      KiCad major. A rebuild regenerates it.
    run: rebuild
    provenance: >
      v4 usb-hub-3s first DRC 2026-07-21: 116/648 findings (112 parts + 4
      mounting holes), all "configuration does not include the library";
      measured 0 with the table present.

  - class: silk_overlap
    detect: "Silkscreen overlaps another silk item / refdes collision"
    action: auto
    fix: >
      refdes de-collision rerun: add_silk's nudge search is order-dependent
      and a regeneration re-runs it against the current obstacle set.
    run: rebuild
    provenance: >
      v4 gate.json carried 1; the de-collision pass is the shipped fix for
      the esp32 v1.0 refdes incident (cfbc83b) — rerunning it is safe, it
      only moves text.

  - class: unconnected_zone_islands
    detect: >
      unconnected_items where BOTH sides read "Zone [X]" of the SAME net —
      a pour that FILLED as two or more disconnected islands (classify_gate
      splits this out of `unconnected`, which stays escalate-only).
    action: auto
    fix: >
      rerun stitch with the `heal_islands` pass (route_and_stitch_generic):
      on the FILLED board it groups each pour net's islands with pcbnew
      connectivity, bridges the narrowest collision-clear gap with a track
      at the net-class width (zone-min-width fallback) or a via through a
      shared same-net plane, then refills and RE-VERIFIES — a heal that
      does not reduce the island count is a hard error. The rebuild chain
      reruns stitch, which runs heal_islands wherever the project's
      stitch.passes includes it (the template default; a project without it
      re-presents the class and D-BACK surfaces the config gap in 3 cycles).
    run: rebuild
    provenance: >
      v4 usb-hub-3s clean-room canary 2026-07-21: 4 of the last 7 gate
      findings were this class (nets LX1, LX2, VIN_S, VBUSA3 — priority-2
      F.Cu converter hot-loop pours sliced by escape tracks), each bridged
      BY HAND by an expensive agent before heal_islands existed.

  - class: zones_intersect_same_net
    detect: >
      a `zones_intersect` DRC violation ("Copper zones intersect —
      intersecting zones must have distinct priorities") whose BOTH items
      name the SAME net (classify_gate splits this out of the escalate-only
      `zones_intersect`, which stays cross-net = short = real work).
    action: auto
    fix: >
      rerun stitch with the `unify_zone_priorities` pass
      (route_and_stitch_generic): it finds same-net same-priority overlapping
      pours, bumps the SMALLER zone to a distinct higher priority so KiCad
      sees a legal NESTING instead of an intersection (same net => identical
      copper union, only the priority integer changes), then refills and
      RE-VERIFIES. A rebuild reruns stitch, which runs this pass wherever the
      project's stitch.passes includes it (the template default, after the
      last fill / before heal_islands; a project without it re-presents the
      class and D-BACK surfaces the config gap within 3 cycles).
    run: rebuild
    safety:
      reduce: >
        after the bump + refill the pass re-measures same-net same-priority
        overlaps and DIES if any remain — a unify that does not clear the
        intersection is an error, never a silent no-op.
      no_new_violations: >
        a CROSS-net zone overlap (a short) is REFUSED loudly, never
        priority-bumped; and the refill is checked with the heal_islands
        grouping so a bump that slices a pour into MORE islands (trading
        zones_intersect for unconnected) is a hard error.
      idempotent: >
        once the overlapping zones carry distinct priorities nothing matches
        the same-net same-priority predicate, so a rerun is a no-op.
      refuse: >
        the cross-net case dies (escalate to the shorting_items owner) rather
        than mechanically merging nets — an auto-fixer must never guess a
        short away.
    boards: [usb-hub-3s-v1.0, usb-hub-3s-v1.1]
    provenance: >
      usb-hub-3s v1.0 hand-fixed as the "P3-union" (bump overlapping same-net
      P2 pours to P3); RE-LEARNED by hand on v1.1 (2026-07-22 routing journal
      iterate 1-2: "3 zones_intersect (KiCad flags SAME-net same-priority
      overlaps)" — LX1 union rects -> priority 3, VIN strip P3 over pool).
      Second board = canon M8 promote.

  # ---- PROMOTED BUILD-STEP PASSES (canon M8) ---------------------------
  # Config-driven passes/mechanisms the REBUILD chain runs, not DRC-class
  # matches: classify_gate emits no `seed_stubs`/`tap_reattempt` class (they
  # are build-time robustness, not DRC findings — the pour-fed-pin open they
  # prevent stays the escalate-only `unconnected`, whose report now names
  # these as the deterministic remedies). They live in the table as the
  # canonical registry of promoted mechanical fixes + the two-strike
  # occurrence record the self-harvest hook reads.
  - class: seed_stubs
    detect: >
      NOT a DRC class. The symptom is a pour-fed chip pin (pad<->zone same
      net) that stays open because its connection weaves across a dense
      escape field KRT excludes and taps are too short to thread.
    action: auto
    fix: >
      the `seed_stubs` stitch pass (route_and_stitch_generic, runs BEFORE
      fill) places EXPLICIT stub geometry from stitch.seed_stubs, verified
      against the live board's exact copper with collision REFUSAL, then the
      pour fills around it and bonds the pin. Generalises the hand-written
      per-board emitter (usb-hub-3s plan_seed_stubs.py + add_seed_stubs.py).
      A rebuild reruns stitch, which runs it wherever stitch.passes lists it.
    run: rebuild
    safety:
      reduce: >
        each stub declares the `pin` (REF.PAD) it serves and the pass PROVES
        the placed copper reaches that pad — a stub that connects nothing is
        a hard error.
      no_new_violations: >
        every segment/via is exact-collision-checked against foreign copper
        at the stub clearance; a stub grazing another net is REFUSED whole,
        never shaved.
      idempotent: >
        identical same-net copper already on the board is skipped, so a rerun
        emits nothing.
      refuse: >
        a colliding stub is recorded as a gate failure (escalate) rather than
        placed thin, and a `pin` on the wrong net dies — a seed stub must
        never bridge nets.
    boards: [usb-hub-3s-v1.0, usb-hub-3s-v1.1]
    provenance: >
      usb-hub-3s v1.0 west-column pour-pin drops, then v1.1 (2026-07-22
      journal iterate 3-4): LX1/VOUT_PDS/VOUT_PD long U1 south-row runs, hand
      emitted deterministically after threaded taps proved order-fragile.
      Same emitter shape as prior boards' via-farm emitters. Second board =
      canon M8 promote.

  - class: tap_reattempt
    detect: >
      NOT a DRC class. The symptom is a `taps` build-step FAILURE on long
      pour-net pins (the tap threader hugs KRT escape-field lane edges, so a
      long tap's corridor is order-fragile).
    action: auto
    fix: >
      the bounded reattempt in `cmd_taps` (route_and_stitch_generic): on a
      tap failure, retry the still-failed taps LONGEST-first (seed-stubs-first
      ordering — the most-constrained long runs claim the corridor before
      shorter taps box them in), benefiting from the copper the successes
      laid. Config: taps.reattempt.max_retries (default 2). A rebuild reruns
      taps with the reattempt in force.
    run: rebuild
    safety:
      reduce: >
        each retry must strictly reduce the failed-tap count; a retry that
        makes no progress stops immediately (the ordering is deterministic —
        spinning cannot help).
      no_new_violations: >
        every emitted tap segment/via still goes through the exact
        collision-checked _route_one_tap strategies — reattempt only changes
        ORDER, never the emit discipline.
      idempotent: >
        a fully-routed tap set does zero retries; the loop is bounded by
        max_retries AND progress-gated, so it always terminates.
      refuse: >
        after the bound with failures remaining the step DIES naming the
        stuck taps and pointing at seed_stubs / placement (D-ADJ) — it never
        ships a silent open.
    boards: [cook-hub, usb-pwr-hub-3s, usb-hub-3s-v1.1]
    provenance: >
      cook-hub u7 taps + usb-pwr-hub-3s route_taps.py were the taps
      promotion; the U1 pour-pin tap failures RECURRED on usb-hub-3s v1.1
      (2026-07-22 journal iterate 1 & 3: "4/33 taps FAILED — all long U1
      pour-net pin runs"). Bounded reattempt is the mechanical response.

  # ------------------------------------------------------- ESCALATE -----
  # Real work. An auto-"fix" here would be the muted-gate failure mode
  # (spf 96785a0): the driver must hand these to a designer/agent with the
  # counts and samples, not negotiate with them mechanically.
  - class: zones_intersect
    action: escalate
    why: >
      a CROSS-net zone overlap is a SHORT — net-identity work, never a
      mechanical priority bump (the same-net case is the auto
      zones_intersect_same_net above; classify_gate splits them by whether
      both items name one net).
    boards: [usb-hub-3s-v1.1]
    provenance: "cross-net class of the XT60 short family (spf fa0b9c1)"
  - class: clearance
    action: escalate
    why: >
      spacing is placement/routing judgement — the D-BACK ladder maps a
      persistent clearance cluster to a PLACEMENT backtrack, not a tweak.
      The driver still classifies real (< fab floor, cross-net) vs margin.
    provenance: "v4 first DRC: 141/648; 24 remained at snapshot 16:08"

  - class: hole_clearance
    action: escalate
    why: drill-to-copper spacing is routing/via-plan work (KRT clearance
      budget, tap sites); see the npth fencing note in route-prep.
    provenance: "v4 gate.json snapshot 16:08: 79 findings"

  - class: unconnected
    action: escalate
    why: >
      opens are the actual routing work: wave coverage, taps for boxed-in
      pads, pour service. quick names the nets; the fix is design, and
      3 stalled cycles of it must retreat up the D-BACK ladder. A pad<->zone
      (pour-fed pin) open has PROMOTED deterministic remedies the escalation
      report names — stitch seed_stubs and the bounded tap reattempt.
    boards: [usb-hub-3s-v4, spf, usb-hub-3s-v1.1]
    provenance: "v4 first DRC: 41/648; 40 at snapshot 16:08; recurred on spf
      and usb-hub-3s v1.1 (pour-fed U1 pins)"

  - class: starved_thermal
    action: escalate
    why: pad/pour thermal relief needs zone or pad_override judgement
      (crow-array-pod J1 precedent — solid connection was a design call).
    provenance: "v4 gate.json snapshot 16:08: 14 findings"

  - class: silk_edge_clearance
    action: escalate
    why: text near the edge needs a placement decision (move or waive with
      evidence) — auto-nudging could push refdes onto pads.
    provenance: "v4 gate.json snapshot 16:08: 4 findings"

  - class: isolated_copper
    action: escalate
    why: an island is either missing stitching (design) or dead copper to
      remove — island_rescue config, not a mechanical retry.
    provenance: "crow-array-pod island incidents, 2026-07-20"

  - class: copper_sliver
    action: escalate
    why: pour geometry artifact; fixed by zone outline/clearance config.
    provenance: "v4 gate.json snapshot 16:08: 1 finding"

  - class: hole_to_hole
    action: escalate
    why: drill packing is via-plan work (ADR-0008 escape budgets); the
      stitch hole_to_hole pass already nudges what is safely nudgeable.
    provenance: "jlc 0.5mm floor incidents, ADR-0008 2026-07-21"

  - class: solder_mask_bridge
    action: escalate
    why: mask webbing between different-net pads is footprint/placement
      geometry, sometimes a legitimate waiver — evidence required.
    provenance: "seen on the sealed cook-loadcell bare-copy DRC, 2026-07-21"

  - class: track_dangling
    action: escalate
    why: >
      the stitch passes (drop_dangling / split_t_junctions) own this class
      and are already conservative — a residual dangle means the passes'
      config needs judgement (cook-loadcell T-stub incident: deleting one
      disconnected TP3).
    provenance: "cook-loadcell 2026-07-20 (8 pads eaten by an over-eager pass)"

  - class: via_dangling
    action: escalate
    why: prune_stitch_dangling owns stitch-emitted vias; a dangling
      imported/footprint via is somebody's design intent — a finding, not
      a deletion.
    provenance: "3S clean-room cleanup_vias.py post-hoc deletions, 2026-07-20"

  - class: courtyards_overlap
    action: escalate
    why: overlap is a floorplan defect (audit_template I6c is the gate) —
      the fix is placement, not regeneration.
    provenance: "audit_template stacked-parts incident (tests/README)"

  - class: shorting_items
    action: escalate
    why: a short is never mechanical — net identity work, stop everything.
    provenance: "XT60 polarity class of defect (spf fa0b9c1)"

  - class: tracks_crossing
    action: escalate
    why: crossed copper means the route input was not track-free or an
      import doubled — both are chain-order violations to diagnose.
    provenance: "KRT routes through pre-existing copper (400+ crossings, x2)"

  - class: drill_out_of_range
    action: escalate
    why: sub-floor drills in a PROMOTED chain need a re-route or a tier
      ADR (D-TIER) — tier-derived geometry prevents new ones (f4a4fd3).
    provenance: "clean-room 3S 2 drill_out_of_range, 2026-07-20"

  - class: schematic_parity
    action: escalate
    why: board/sheet disagreement is upstream (03_tscircuit) — grinding
      the board cannot fix the netlist.
    provenance: "spf bed8ace: a part in the schematic never reached the board"
