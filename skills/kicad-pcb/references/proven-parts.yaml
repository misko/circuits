# Proven-parts ledger — part selection as COMPOUNDING CAPITAL.
#
# One entry per FUNCTION; candidates are parts this pipeline has actually
# paid to verify. Consulted FIRST at D-SPEC (sourcing spike) and D-ESC
# (part selection); every newly verified part is harvested back at release.
#
# Rules that keep this honest:
# - Entries require PROVENANCE: status is one of
#     shipped        — ordered/released on a named board
#     designed-in    — schematic+escape verified on a named board, not yet
#                      ordered
#     incident       — a NEGATIVE entry: verified to be a trap; the caveat
#                      is the value
#     unresolved     — the function has no verified answer yet; the next
#                      board that needs it runs the sourcing spike and
#                      founds the entry
# - Provenance names boards (allowed) — NEVER projects/ paths (C-ISO).
# - NO stock counts or prices here — they rot in hours; jlc_stock checks
#   freshness at order time. The ledger stores IDENTITY + judgment.
# - escape blocks use the same schema as part.yaml (escape_check emits
#   them); tier names come from fab_tiers.yaml.
# - layout_refs: routed precedents consulted for the part's LOCAL layout
#   (datasheet layout-example section, manufacturer EVM, OSHWLab project) —
#   named so the next board starts from the same references instead of
#   re-searching. Study-then-re-derive; never imported copper (M3).

