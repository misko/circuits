# Vetted LCSC -> MPN/value ledger for fleet passives (leg C of bom_source_check).
#
# WHY: the fab BOM ships a BLANK MPN column and basic-library passives carry no
# 02_parts/<MPN>/part.yaml, so on a real board leg C's first two resolution
# sources (BOM MPN column, vendored dir name) yield NOTHING — the sealed
# usb-hub-3s-v3 v1.2 R12 defect (C2933210 = 3.74k labeled 4.12k) was invisible
# to both (measured 2026-07-23). This ledger is the third source: pay the
# catalog verification ONCE per code, ever; leg C then verifies offline forever.
#
# SCHEMA:  <LCSC>: {mpn: <catalog MPN>, value: <catalog value>, verified: <provenance>}
#   value uses the same notation the BOM Comment column uses (parse shared with
#   the gate's label parsers): resistors "3.74k" / "33" / "0.01" (ohms),
#   caps "100nF" / "10uF". The value is the CATALOG's truth, never the label's:
#   C2933210 says 3.74k here BECAUSE the catalog does, even though every BOM
#   labeled it 4.12k — the ledger exists to catch exactly that.
# RULES:
#   - append-only per code; NEVER copy a value from a BOM label — only from the
#     JLC/LCSC catalog record (verify once, cite the date+source in `verified`).
#   - an R/C row whose code is in none of {BOM MPN, part.yaml, this ledger}
#     FAILS the gate as UNVERIFIABLE-VALUE: verify + append, then it is quiet.
#
# Seeded 2026-07-23 from the JLC parts API (selectSmtComponentList, exact
# componentCode match, describe field) for every R/C-designated LCSC code on
# every projects/ + archived_projects/ fab BOM; cross-checked against the fleet
# labels — exactly two mismatches found, both real defects (C2933210, C2933195).

