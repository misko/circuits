# P-MOD module-first architecture contract. Fill at commission/architecture.
schema: 1
default: prefer_module

# One row for every used complex subsystem dossier (compute/control, radio,
# interface or switching-power controller, precision AFE/transceiver).
selections:
  - function: <subsystem function>
    part: <exact 02_parts directory or part.yaml mpn>
    implementation: module
    rationale: <why this module satisfies the locked requirements with the lowest total complexity>

# If this board genuinely has no applicable subsystem, replace `selections`
# with `selections: []` and uncomment a specific declaration:
# no_applicable_functions: This passive board has no programmable, radio,
#   interface-control, switching-power-control, or complex sensing subsystem.

# Bare-IC exception form (modules are the default; cost/area alone is not proof):
