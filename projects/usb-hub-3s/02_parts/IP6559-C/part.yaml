gotchas:
  - "IP6559_C variant = single C port 100W PD w/ path NMOS (DS p.4 table);
     port-2 path pins (VOUT2G/VOUTI/VOUT2) drive the VBUS path FET (Fig.8)"
  - "R7 on GPIO0 selects PDO set; value table is app-note-only (ADR 0004):
     ship DNP = variant-default 100W; verify PDO list at first power"
  - "output CC limits: 5/9/12V->3A, 20V->5A ONLY with e-marked cable (DS p.6)"
  - "Vconn for e-marker: external 5V->D->PFET switches to CC1/CC2 driven by
     GPIO22(CC1)/GPIO21(CC2) via NFETs, 10k pulls (DS Fig.9)"
  - "5mOhm sense lines are Kelvin: CSP/CSN pairs + PCIN/PCON leave from the
     resistor ends, parallel, away from LX (DS p.18 rule 5)"
  - "input UVP fixed 3.6V - NOT a pack protector; board UVLO comes from
     LM5116+5VA divider into GPIO18/EN (ADR 0001)"
  - "gate drive ~5V (VCC5V) - power FETs must be logic-level (Rds spec at 4.5V)"
