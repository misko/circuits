# usb-hub-3s route + stitch — input for route_and_stitch_generic.py
# v1.1: PD region re-floorplanned (X2/X18/X19/X20) -> the v1.0 promoted chain
# is INVALID there; route runs fresh and the winning chain gets re-promoted.
# Trunk power (VBAT*, VIN*, 5VA, VOUT_PD*, VBUSC, VBUSA*, SW/LX) is
# POUR/PLANE-owned and EXCLUDED from KRT; KRT routes gates, sense, data/CC,
# aux. GND = pours + In1 + stitch. Via program (X22/X23) = 03_src/via_farms.yaml.

project:
  name: usb_hub_3s
  board: 04_kicad/usb_hub_3s.kicad_pcb
  build_dir: 06_build/route

prep:
  out: r0.kicad_pcb
  keepouts:
    layers: [User.2]
    mounting_holes: {radius: 3.0}
    edge_band: 0.7
    rects:
      # via-in-pad plane-drop sites (U1 pins 27/28, 30, 11; U2 pin 17) - unchanged (U1/U2 unmoved)
      - {x0: 70.9, y0: 65.05, x1: 72.2, y1: 66.05}
      - {x0: 70.9, y0: 64.0, x1: 72.2, y1: 64.5}
      - {x0: 63.8, y0: 65.6, x1: 65.1, y1: 66.9}
      - {x0: 58.2, y0: 36.4, x1: 59.5, y1: 37.7}
      # SW_A sense-tap lane (U2.20 -> C18.2): east runway at the SW pin row
      - {x0: 59.5, y0: 31.2, x1: 64.5, y1: 32.5}
      # the J5 data/CC tap runway (row escape strip north of the pads)
      - {x0: 104.5, y0: 101.3, x1: 118.5, y1: 104.5}
      # v1.1 kelvin stub runways at the shunt pad ends (taps thread these)
      - {x0: 88.4, y0: 75.3, x1: 90.2, y1: 78.4}     # RS2.1 -> R14.1
      - {x0: 82.5, y0: 75.3, x1: 84.1, y1: 79.2}     # RS2.2 -> R15.1
      - {x0: 43.6, y0: 74.6, x1: 47.9, y1: 78.6}     # RS3.1 -> R18.1
      - {x0: 42.8, y0: 83.7, x1: 47.9, y1: 85.9}     # RS3.2 -> R19.1
      # LX gate-return spurs (chip LX pin + BST cap -> island): short south lanes
      - {x0: 68.9, y0: 67.6, x1: 69.6, y1: 70.9}     # U1.21 LX2 spur
      - {x0: 71.1, y0: 69.35, x1: 73.9, y1: 70.9}    # C21.2 -> LX2 island NW
      - {x0: 67.4, y0: 67.6, x1: 68.1, y1: 69.0}     # U1.18 LX1 spur start
      - {x0: 60.2, y0: 70.0, x1: 68.1, y1: 70.55}    # LX1 spur west run to the finger (with U1.18/C22.2)
  waves:
    exclude: ["GND", "VBAT", "VBAT_F", "VIN", "VIN_S", "SW_A", "CS_A",
              "5VA", "VOUT_PD", "VOUT_PDS", "VBUSC",
              "VBUSA1", "VBUSA2", "VBUSA3", "LX1", "LX2", "unconnected-*"]
    groups:
      # hardest first: FET-side gate drives + bootstraps (coarse pads)
      gate: [HO_A, LO_A, BOOT_A, SNB1, SNB2]
      # QFN-attached hard nets + the v1.1 gate-R slot nets (R pad -> FET gate)
      qfngate: [LG1, LG2, HG1, HG2, QG4, QG5, QG6, QG7, BST1, BST2,
                SNS_OUT_P, SNS_OUT_N, PATH_G]
      emk: [EMK2, EMK1, PDO_CFG]
      sense: [SNS_IN_P, SNS_IN_N, CSF_A,
              CSGF_A, FB_A, COMP_A, CMZ_A, RAMP_A, RT_A, SS_A, UVLO_A,
              EN_A, VOUT2_SNS, RPP_G]
      dataa: [DP_A1, DM_A1, DP_A2, DM_A2, DP_A3, DM_A3]
      datac: [CC2, DPC, DMC, CC1]
      sig: rest

route:
  krt: ~/gits/KiCadRoutingTools
  common:
    layers: [F.Cu, B.Cu]
    fab_tier: advanced
    via_size: 0.35
    via_drill: 0.15
    no_stub_layer_swap: true
    keepout: true
    keepout_layer: User.2
    clearance: 0.21
  waves:
    - {name: gate,    group: gate,    track_width: 0.4,  max_iterations: 400000}
    - {name: qfngate, group: qfngate, track_width: 0.3,  clearance: 0.15,
       via_size: 0.25, via_drill: 0.15, max_iterations: 800000,
       max_probe_iterations: 60000, max_ripup: 30}
    - {name: emk,     group: emk,     track_width: 0.25, clearance: 0.15,
       via_size: 0.25, via_drill: 0.15, max_iterations: 400000}
    - {name: sense,   group: sense,   track_width: 0.25, clearance: 0.15,
       via_size: 0.25, via_drill: 0.15, max_iterations: 500000}
    - {name: dataa,   group: dataa,   track_width: 0.25, clearance: 0.15,
       max_iterations: 400000}
    - {name: datac,   group: datac,   track_width: 0.2,  clearance: 0.15,
       via_size: 0.25, via_drill: 0.15, grid_step: 0.05,
       max_iterations: 800000, max_probe_iterations: 60000}
    - {name: sig,     group: sig,     track_width: 0.25, clearance: 0.15,
       max_iterations: 800000, max_probe_iterations: 60000, max_ripup: 30}
  # canon M3: after the v1.1 route goes green, promote the imported chain to
  # 03_src/route/ and restore a `final:` line here. (v1.0's chain retired.)

taps:
  clearance: 0.13
  via: {size: 0.25, drill: 0.15}   # POFV-class (advanced tier)
  connections:
    # --- v1.1 Kelvin stubs (X19): dedicated copper off the shunt pad ENDS ---
    - {net: VIN,      from: RS2.1, to: R14.1, width: 0.25, layer: F.Cu, hop_layer: B.Cu}
    - {net: VIN_S,    from: RS2.2, to: R15.1, width: 0.25, layer: F.Cu, hop_layer: B.Cu}
    - {net: VOUT_PDS, from: RS3.1, to: R18.1, width: 0.25, layer: F.Cu, hop_layer: B.Cu}
    - {net: VOUT_PD,  from: RS3.2, to: R19.1, width: 0.25, layer: F.Cu, hop_layer: B.Cu}
    # --- chip pour-net taps (pour-fed nets are excluded from KRT) ---
    - {net: VOUT_PDS, from: U1.15, to: [51.0, 72.5], width: 0.25, layer: F.Cu, hop_layer: B.Cu}
    - {net: VOUT_PD,  from: U1.12, to: U1.10, width: 0.25, layer: F.Cu, hop_layer: B.Cu}
    - {net: VOUT_PD,  from: U1.10, to: [55.8, 85.5], width: 0.3, layer: F.Cu, hop_layer: B.Cu}
    - {net: LX1, from: U1.18, to: [60.5, 70.3], width: 0.25, layer: F.Cu, hop_layer: B.Cu}
    - {net: LX1, from: C22.2, to: [60.5, 70.3], width: 0.25, layer: F.Cu, hop_layer: B.Cu}
    - {net: LX2, from: U1.21, to: [73.6, 71.3], width: 0.25, layer: F.Cu, hop_layer: B.Cu}
    - {net: LX2, from: C21.2, to: [73.6, 71.3], width: 0.25, layer: F.Cu, hop_layer: B.Cu}
    - {net: VIN_S, from: U1.24, to: [79.0, 70.2], width: 0.3, layer: F.Cu, hop_layer: B.Cu}
    # --- J5 data/CC (unchanged region) ---
    - {net: CC1, from: J5.A5, to: Q9.3, width: 0.25, layer: F.Cu, hop_layer: B.Cu}
    - {net: CC2, from: J5.B5, to: [106.5, 104.15], width: 0.25, layer: F.Cu, hop_layer: B.Cu}
    - {net: CC2, from: Q11.3, to: [106.5, 104.15], width: 0.25, layer: F.Cu, hop_layer: B.Cu}
    - {net: DPC, from: J5.A6, to: D8.1, width: 0.25, layer: F.Cu, hop_layer: B.Cu}
    - {net: DPC, from: J5.B6, to: D8.1, width: 0.25, layer: F.Cu, hop_layer: B.Cu}
    - {net: DMC, from: J5.A7, to: D9.1, width: 0.25, layer: F.Cu, hop_layer: B.Cu}
    - {net: DMC, from: J5.B7, to: D9.1, width: 0.25, layer: F.Cu, hop_layer: B.Cu}
    - {net: VBUSC, from: J5.A4, to: [111.85, 106.8], width: 0.3, layer: F.Cu, hop_layer: B.Cu}
    # --- plane drops (U1/U2 unmoved from v1.0) ---
    - {net: VIN, from: U1.27, to: [71.54, 65.75], width: 0.3, plane: true}
    - {net: GND, from: U1.28, to: [71.54, 65.25], width: 0.25, plane: true}
    - {net: GND, from: U1.30, to: [71.54, 64.25], width: 0.25, plane: true}
    - {net: GND, from: U1.11, to: [64.46, 66.25], width: 0.25, plane: true}
    - {net: GND, from: U2.17, to: [58.86, 37.02], width: 0.25, plane: true}
    # --- buck SW sense (unchanged) ---
    - {net: SW_A, from: U2.20, to: C18.2, width: 0.5, layer: F.Cu, hop_layer: B.Cu}
    - {net: SW_A, from: C18.2, to: [74.0, 32.5], width: 0.5, layer: F.Cu, hop_layer: B.Cu}
    # --- island bonders (port region unchanged) ---
    - {net: VBUSA1, from: U8.5, to: [106.0, 38.5], width: 0.3, layer: F.Cu, hop_layer: B.Cu}
    - {net: VBUSA2, from: U9.5, to: [110.5, 59.0], width: 0.3, layer: F.Cu, hop_layer: B.Cu}
    - {net: VBUSA2, from: C37.1, to: [103.5, 48.2], width: 0.3, layer: F.Cu, hop_layer: B.Cu}
    - {net: VBUSA3, from: U10.5, to: [106.0, 72.5], width: 0.3, layer: F.Cu, hop_layer: B.Cu}
    # --- 5VA feeds (D2.2 now sits IN the 5VA column - tap dropped) ---
    - {net: 5VA, from: U2.10, to: [87.0, 29.5], width: 0.4, layer: F.Cu, hop_layer: B.Cu}
    - {net: 5VA, from: R2.1, to: [86.5, 28.5], width: 0.5, layer: F.Cu, hop_layer: B.Cu}

stitch:
  clearance: 0.15
  via: {size: 0.35, drill: 0.15, spacing: 0.85, pth_margin: 0.3}
  keepin: {inset: 0.8}
  passes: [dedupe_vias, normalize_vias, drop_micro_fragments, drop_dangling,
           split_t_junctions, reload, hole_to_hole, pad_rescue, stub_fallback,
           astar_fallback, stitch_grid, fill, island_rescue, dedupe_vias,
           hole_to_hole, fill, prune_stitch_dangling, gate]
  dedupe_vias: {radius: 0.28, metric: box}
  normalize_vias: {below_width: 0.24, size: 0.35, drill: 0.15}
  drop_micro_fragments: {max_length: 0.16, require_free_end: true}
  drop_dangling: {max_length: 1.0, tol: 0.05, sweeps: 4}
  split_t_junctions: {tol: 0.05}
  hole_to_hole: {min_gap: 0.25, mode: nudge, prefer_keep: [GND]}
  pad_rescue:
    nets:
      - {net: GND, layer: In1.Cu}
      - {net: VIN, layer: In2.Cu}
    via_in_pad: true
    served_within: 1.6
    rings: [0.75, 0.95, 1.2, 1.6, 2.1, 2.7]
    stub_width: 0.3
    require: none
  stub_fallback: {net: GND, min_dist: 0.2, max_dist: 8.0, width: 0.3}
  astar_fallback: {net: GND, width: 0.25, window: 3.0, attempts: 3}
  stitch_grid:
    net: GND
    x: [24, 126, 8]
    y: [24, 106, 8]
  island_rescue: {min_bbox: 0.8, layers: [F.Cu, B.Cu], require: all}
  prune_stitch_dangling: {tol: 0.05, min_layers: 2}
