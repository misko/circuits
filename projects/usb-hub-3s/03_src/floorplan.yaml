# usb-hub-3s floorplan — input for skills/kicad-pcb/scripts/generate_board_generic.py
# 110x90 4-layer (In1=GND plane, In2=VIN plane). West: XT60 + protection chain.
# North: LM5116 5VA buck (UNCHANGED from v1.0). East: 3x USB-A (UNCHANGED).
# South: IP6559 PD stage — RE-FLOORPLANNED in v1.1 (reviews X2/X18/X19/X20/
# X22/X23): two tight half-bridges in one row (VOUT_PDS|Q6|LX1|Q7|GND ...
# GND|Q5|LX2|Q4|VIN_S), L1 directly between the LX strips, HF ceramic banks
# ON the bridge rails inside each hot loop, shunts outside the HF loop with
# Kelvin stubs off their pad ends, LX copper F.Cu-ONLY minimum islands.

project:
  name: usb_hub_3s
  netlist: 06_build/netlists/usb_hub_3s.net
  output: 04_kicad/usb_hub_3s.kicad_pcb
  parts_dir: 02_parts
  fp_lib_table: 04_kicad/fp-lib-table

board:
  outline: {x0: 20.0, y0: 20.0, x1: 130.0, y1: 110.0}
  edge_width: 0.1
  layers: 4
  mounting_holes:
    footprint: MountingHole:MountingHole_3.2mm_M3
    at: [[24.0, 24.0], [126.0, 24.0], [24.0, 106.0], [126.0, 106.0]]

libraries: [/usr/share/kicad/footprints, 03_src/lib]

placement:
  anchors:
    # ---- input west ----
    J1: [28.0, 56.0, 90]        # XT60 mouth WEST; pad2 (+ / VBAT) at (28,48.8)
    F1: [31.0, 75.0, 270]       # vertical: pad1 (31,75)=VBAT, pad2 (31,84.9)=VBAT_F
    Q1: [39.0, 80.0, 180]       # P-FET: D west (38.3)=VBAT_F, S east (41.7)=VIN
    C1: [39.0, 88.5, 0]         # VIN polymer bulk (moved to SW pool - v1.1 PD cell owns the old spot)
    C2: [39.0, 94.5, 0]         # VIN polymer bulk
    D1: [41.5, 101.5, 0]        # v1.1 X1 FIX: input TVS now on VIN (K pad 39.5,101.5 in the VIN pool AFTER Q1)
    # ---- 5VA buck north (v1.0 positions, region verified working) ----
    U2: [56.0, 38.0, 0]
    Q2: [72.0, 28.0, 180]       # HS: D west (Cin side), S east (SW)
    Q3: [72.0, 36.0, 0]         # LS: S west (CS_A), D east (SW)
    RS1: [68.0, 43.0, 270]      # pad1 (CS_A) NORTH into the CS_A patch
    L2: [84.0, 32.0, 0]
    # ---- USB-A ports east (v1.0 positions) ----
    U3: [100.0, 33.0, 0]
    U4: [100.0, 51.0, 0]
    U5: [100.0, 69.0, 0]
    J2: [118.2, 38.5, 90]
    J3: [118.2, 56.5, 90]
    J4: [118.2, 74.5, 90]
    # ---- PD stage south: v1.1 compact reference cell ----
    U1: [68.0, 64.0, 0]         # QFN-48, power row faces SOUTH (pins 13-24 at y 67.45)
    # FET row y=73: [VOUT_PDS]Q6(180)[LX1]Q7(180)[GND] .. [GND]Q5(0)[LX2]Q4(0)[VIN_S]
    Q6: [51.5, 73.0, 180]       # out HS: D tab west = VOUT_PDS, S pins east (54.17) = LX1
    Q7: [60.0, 73.0, 180]       # out LS: D tab west (57.4-61.2) = LX1, S pins east (62.67) = GND
    Q5: [71.0, 73.0, 0]         # in LS: S pins west (68.33) = GND, D tab east (69.8-73.6) = LX2
    Q4: [78.5, 73.0, 0]         # in HS: S pins west (75.83) = LX2, D tab east = VIN_S
    L1: [65.5, 85.6, 180]       # YSPI1770Y pads 3.8x13 @ ±8.1: pad1 (73.6)=LX2, pad2 (57.4)=LX1
    # shunts OUTSIDE the HF loops, Kelvin stubs off the pad ends (X19)
    RS2: [86.3, 73.5, 180]      # pad1 east (89.26)=VIN in the east pool, pad2 west (83.34)=VIN_S
    RS3: [47.5, 79.5, 270]      # pad1 north (76.54)=VOUT_PDS, pad2 south (82.46)=VOUT_PD
    R14: [89.3, 77.5, 90]       # kelvin: stub from RS2.1 pad END (89.26,75.17)
    R15: [83.3, 78.4, 90]       # kelvin: stub from RS2.2 pad END (83.34,75.17)
    R18: [44.0, 78.2, 90]       # kelvin: stub from RS3.1 pad END (47.5,74.9)
    R19: [43.2, 85.5, 90]       # kelvin: stub from RS3.2 pad END (47.5,84.1)
    C20: [75.5, 65.0, 90]       # CSP2/CSN2 filter near U1 east col
    C25: [64.6, 69.9, 90]       # CSP1/CSN1 filter near U1 south-west pins
    # bridge-rail HF banks (X18): ceramics ON VIN_S / VOUT_PDS hard at the FETs
    C46: [78.8, 68.7, 90]       # 10u: south pad (70.175) in VIN_S zone, north pad GND
    C47: [82.3, 68.7, 90]       # 10u
    C48: [82.55, 64.9, 0]       # 100n: east pad in the VIN_S north finger, west pad GND
    C49: [45.35, 71.1, 0]       # 10u: east pad (46.8) in VOUT_PDS zone, west pad GND
    C50: [45.35, 74.7, 0]       # 10u
    C51: [44.8, 68.6, 0]        # 100n
    # PD-stage local VIN capacitance at the cell (X27)
    C44: [89.5, 61.0, 90]       # 100uF/35V polymer bulk, east pool
    C3:  [85.9, 68.3, 90]       # 10u
    C45: [89.4, 68.3, 90]       # 10u (the DETAIL-promised second one)
    C4:  [91.8, 68.5, 90]       # 100n
    # gate-R slots AT the gates (X4)
    R28: [80.2, 77.7, 0]        # HG2 -> Q4.G (75.83,75.905)
    R29: [66.4, 77.8, 90]       # LG2 -> Q5.G (68.33,75.905)
    R30: [56.3, 69.3, 0]        # HG1 -> Q6.G (54.17,71.1)
    R31: [62.6, 68.7, 90]       # LG1 -> Q7.G (62.67,71.1)
    # BST caps near the chip BST/LX pins
    C21: [70.6, 69.2, 0]        # BST2: pad1 (69.775) under U1.22, pad2 (71.425) -> LX2 spur
    C22: [67.3, 69.2, 0]        # BST1: pad1 (66.475) under U1.17, pad2 (68.125) -> LX1 spur
    # snubbers + per-node TVS (ADR 0007) on the LX islands
    R16: [77.0, 80.9, 90]       # LX2 snubber R: pad1 north (80.125) in the LX2 south rect
    C23: [77.0, 84.6, 90]       # LX2 snubber C -> GND
    D6:  [79.7, 84.0, 90]       # SMAJ15A: K pad north (82.0) in the LX2 south rect
    R17: [59.6, 69.3, 180]      # LX1 snubber R: pad1 east (60.425) in the LX1 north finger
    C24: [58.7, 66.9, 90]       # LX1 snubber C -> GND
    D7:  [53.4, 83.4, 90]       # SMAJ24A: K pad north (81.4) in the LX1 west bridge
    # output pool + path FET
    C26: [46.5, 90.0, 0]        # VOUT_PD polymer
    C27: [54.3, 88.6, 90]       # VOUT_PD 100n
    Q8:  [52.5, 94.3, 90]       # path: D tab north = VOUT_PD, S pins south = VBUSC
    R20: [48.0, 99.5, 0]        # VOUT2 sense 10R off VBUSC
    # EN divider on the 5VA column
    R21: [97.2, 70.0, 0]
    R22: [97.2, 72.0, 0]
    # Vconn feed on the 5VA column (D2.2 = 5VA sits IN the column now)
    D2:  [97.0, 79.5, 0]        # K pad (95.0) = VCONN5V west, A pad (99.0) = 5VA in-column
    C32: [93.5, 82.5, 0]
    # USB-C corner (v1.0 positions, region verified working)
    D8: [116.8, 100.5, 0]
    D9: [116.8, 98.0, 0]
    Q11: [106.5, 99.5, 180]
    J5: [114.0, 107.0, 0]
  seeds:
    # input
    D5: [46.0, 71.0]
    R13: [45.0, 76.0]
    # buck hot loop + control (v1.0)
    C5: [58.0, 26.0]
    C6: [61.2, 26.0]
    C7: [64.4, 26.0]
    C8: [67.6, 26.0]
    C9: [69.5, 24.2]
    C10: [90.0, 28.0]
    C11: [93.2, 28.0]
    C12: [96.4, 28.0]
    C13: [90.0, 31.5]
    R1: [52.0, 34.2]
    C14: [52.0, 36.0]
    C17: [52.0, 38.0]
    R2: [49.0, 40.0]
    R3: [49.0, 42.2]
    R4: [49.0, 44.4]
    C15: [46.5, 40.0]
    C16: [46.5, 42.2]
    R5: [46.5, 44.4]
    R6: [44.2, 44.4]
    R9: [51.5, 44.4]
    R7: [63.0, 41.0]
    R8: [63.0, 42.8]
    D4: [62.0, 34.7]
    C18: [62.0, 33.0]
    C19: [62.0, 38.0]
    # ports (v1.0)
    R10: [97.0, 37.0]
    C33: [97.0, 29.5]
    C36: [104.0, 31.0]
    C39: [104.0, 33.4]
    U8: [107.0, 41.5]
    R11: [97.0, 55.0]
    C34: [97.0, 47.5]
    C37: [104.0, 49.0]
    C40: [104.0, 51.4]
    U9: [107.0, 59.5]
    R12: [97.0, 73.0]
    C35: [97.0, 65.5]
    C38: [104.0, 67.0]
    C41: [104.0, 69.4]
    U10: [107.0, 77.5]
    U6: [96.0, 43.0]
    C42: [96.0, 45.4]
    U7: [96.0, 61.0]
    C43: [96.0, 63.4]
    # PD stage misc
    C30: [74.0, 60.0]
    C31: [74.0, 58.0]
    R25: [72.0, 56.0]
    C28: [94.0, 103.0]
    C29: [97.5, 103.0]
    D3: [101.0, 103.0]
    # Vconn cluster (between 5VA column and J5)
    Q9: [109.0, 96.0]
    Q10: [109.0, 93.0]
    R23: [106.0, 96.0]
    R24: [106.0, 93.0]
    Q12: [104.0, 97.5]
    R26: [102.5, 99.8]
    R27: [101.5, 97.5]
  legalize: {enable: true, clearance: 0.25, edge_margin: 1.0, hole_keepout: 2.6, ring_max: 60}

design_rules:
  track_min_width: 0.127
  min_clearance: 0.09   # advanced tier min_space (J5 0.5mm row + QFN escape)
  via_min_size: 0.25
  min_through_drill: 0.15
  via_min_annulus: 0.05
  hole_clearance: 0.2
  hole_to_hole: 0.25
  copper_edge_clearance: 0.3
  solder_mask_min_width: 0.0
  solder_mask_expansion: 0.0

zones:
  # planes
  - {net: GND, layers: [In1.Cu], priority: 0, min_thickness: 0.3, clearance: 0.3, connect: thermal}
  - {net: VIN, layers: [In2.Cu], priority: 0, min_thickness: 0.3, clearance: 0.3, connect: full}   # v1.1 X22: solid connects on the trunk plane
  # outer GND pours
  - {net: GND, layers: [F.Cu, B.Cu], priority: 0, min_thickness: 0.3, clearance: 0.3, connect: full}
  # F.Cu power patches (priority 2, tight)
  - {net: VBAT,   layers: [F.Cu], priority: 2, rect: [22.5, 46.0, 34.0, 76.5], connect: full}
  - {net: VBAT_F, layers: [F.Cu, B.Cu], priority: 2, rect: [24.0, 77.5, 40.5, 87.0], connect: full}
  # VIN pools: Q1-source strip -> south-west pool (bulk C1/C2 + D1), east PD-input pool
  - {net: VIN,    layers: [F.Cu], priority: 2, rect: [41.0, 78.7, 44.5, 84.2], connect: full}   # Q1.S strip (gate pad excluded: y>78.6)
  - {net: VIN,    layers: [F.Cu], priority: 2, rect: [35.0, 83.8, 43.0, 102.3], connect: full}  # SW pool: C1/C2/D1 + In2 farm
  - {net: VIN,    layers: [F.Cu], priority: 2, rect: [84.6, 56.5, 93.5, 75.3], connect: full}   # east pool: C44/C3/C45/C4 + RS2.1 + In2 farm
  - {net: VIN,    layers: [F.Cu], priority: 2, rect: [56.0, 22.5, 71.0, 31.0], connect: full}   # buck Cin (v1.0)
  # PD bridge rails (v1.1)
  - net: VIN_S
    layers: [F.Cu]
    priority: 2
    connect: full
    points: [[77.1, 69.9], [82.0, 69.9], [82.0, 63.5], [84.2, 63.5], [84.2, 76.3], [77.1, 76.3]]
  - {net: VIN_S,  layers: [B.Cu], priority: 2, rect: [77.6, 70.5, 83.6, 76.5], connect: full}   # thermal spreader under Q4 tab (X23)
  - {net: VOUT_PDS, layers: [F.Cu], priority: 2, rect: [45.5, 68.4, 53.2, 76.8], connect: full}
  - {net: VOUT_PDS, layers: [B.Cu], priority: 2, rect: [47.5, 70.5, 53.5, 76.5], connect: full} # thermal spreader under Q6 tab (X23)
  # LX islands — F.Cu ONLY, minimum size (X2/X20): FET pads + L1 pad + snubber/TVS/BST landings
  - net: LX2
    layers: [F.Cu]
    priority: 2
    connect: full
    points: [[69.7, 70.9], [77.5, 70.9], [77.5, 75.3], [74.6, 75.3], [74.6, 79.0], [80.7, 79.0],
             [80.7, 82.9], [73.3, 82.9], [73.3, 75.3], [69.7, 75.3]]
  - {net: LX1, layers: [F.Cu], priority: 2, rect: [53.4, 71.9, 61.3, 75.3], connect: full}      # strip: Q6.S pins + Q7.D tab
  - {net: LX1, layers: [F.Cu], priority: 2, rect: [57.4, 75.3, 59.3, 79.5], connect: full}      # drop to L1 pad2
  - {net: LX1, layers: [F.Cu], priority: 2, rect: [59.9, 69.6, 61.3, 71.9], connect: full}      # R17 snubber finger
  - {net: LX1, layers: [F.Cu], priority: 2, rect: [52.6, 80.4, 56.0, 82.4], connect: full}      # D7 TVS bridge (bonds L1 pad2 west edge)
  # output pool
  - net: VOUT_PD
    layers: [F.Cu]
    priority: 2
    connect: full
    points: [[45.3, 80.5], [49.7, 80.5], [49.7, 84.4], [56.2, 84.4], [56.2, 95.7],
             [43.4, 95.7], [43.4, 84.4], [45.3, 84.4]]
  - {net: VOUT_PD, layers: [B.Cu], priority: 2, rect: [49.0, 89.5, 56.0, 95.5], connect: full}  # thermal spreader under Q8 tab (X23)
  # buck region (v1.0, verified working)
  - {net: SW_A,     layers: [B.Cu], priority: 2, rect: [71.5, 33.5, 75.5, 39.0], connect: full}
  - {net: SW_A,   layers: [F.Cu], priority: 2, rect: [72.5, 24.0, 80.5, 40.0], connect: full}
  - {net: CS_A,   layers: [F.Cu, B.Cu], priority: 2, rect: [62.0, 33.0, 71.5, 44.0], connect: full}
  # 5VA: wide north trunk + narrowed east column (frees the PD input pool - v1.1)
  - net: 5VA
    layers: [F.Cu, B.Cu]
    priority: 2
    connect: full
    points: [[86.0, 24.0], [99.0, 24.0], [99.0, 80.5], [95.0, 80.5], [95.0, 56.0], [86.0, 56.0]]
  - {net: VBUSA1, layers: [F.Cu, B.Cu], priority: 2, rect: [100.0, 29.0, 120.2, 42.5], connect: full}
  - {net: VBUSA2, layers: [F.Cu, B.Cu], priority: 2, rect: [100.0, 47.0, 120.2, 60.5], connect: full}
  - {net: VBUSA3, layers: [F.Cu, B.Cu], priority: 2, rect: [100.0, 65.0, 120.2, 78.5], connect: full}
  - net: VBUSC
    layers: [F.Cu]
    priority: 2
    connect: full
    points: [[46.0, 97.5], [49.5, 97.5], [49.5, 96.2], [53.9, 96.2], [53.9, 97.5],
             [124.0, 97.5], [124.0, 108.5], [46.0, 108.5]]

keepouts:
  # PERMISSIVE named areas (deny nothing) - anchors for scoped_floors relaxations.
  - {name: pd_sense, deny: [], layers: [F.Cu, B.Cu], rect: [42.0, 56.0, 94.0, 104.0]}
  - {name: sw_sense, deny: [], layers: [F.Cu, B.Cu], rect: [44.0, 22.5, 87.0, 47.0]}
  - {name: vconn_feed, deny: [], layers: [F.Cu, B.Cu], rect: [92.0, 64.0, 101.0, 90.0]}
  - {name: port_bond, deny: [], layers: [F.Cu, B.Cu], rect: [100.0, 29.0, 116.0, 78.5]}
  - {name: j5_bond, deny: [], layers: [F.Cu, B.Cu], rect: [108.5, 100.5, 118.5, 108.0]}
  - {name: vbat_therm, deny: [], layers: [F.Cu, B.Cu], rect: [37.3, 78.9, 40.4, 81.1]}

silk:
  min_text_height: 0.6
  refdes: {size: 0.6, min_size: 0.45, fab_copy: true, clearance: 0.16, priority_prefixes: "UJQL"}
  captions:
    - ["PROTECTED 3S PACK", 32.0, 48.5, 0.8]    # v1.1 X14: UVLO guards the pack AVERAGE only
    - ["ONLY - 9-12.6V IN", 32.0, 50.5, 0.8]
    - ["XT60 IN", 32.0, 52.5, 0.8]
    - ["FUSE 20A MINI", 37.0, 70.0, 0.8]
    - ["USB-A 2A", 115.5, 50.5, 0.7]
    - ["USB-A 2A", 115.5, 68.5, 0.7]
    - {text: "USB-C PD 5A", at: [107.0, 106.0], size: 0.7, nudge: false}
    - ["USB-A 5V 2A (2.5A BURST)", 108.0, 26.0, 0.8]
    - ["USB-C PD 5-20V 5A MAX", 100.0, 95.8, 0.8]
    - ["usb-hub-3s v1.1", 30.0, 104.5, 0.8]

asserts:
  pad_net:
    - {ref: J1, pad: 1, net: GND}          # XT60 pad1 IS '-' (part fact)
    - {ref: J1, pad: 2, net: VBAT}
    - {ref: Q1, pad: 5, net: VBAT_F}       # rev-pol P-FET drain = battery side
    - {ref: D1, pad: 1, net: VIN}          # v1.1 X1: TVS cathode on VIN, AFTER Q1
    - {ref: D2, pad: 1, net: VCONN5V}
    - {ref: D3, pad: 1, net: VBUSC}
    - {ref: D4, pad: 1, net: BOOT_A}
    - {ref: D5, pad: 1, net: VIN}
    - {ref: D6, pad: 1, net: LX2}          # SMAJ15A (ADR 0007)
    - {ref: D7, pad: 1, net: LX1}          # SMAJ24A (ADR 0007)
    - {ref: C1, pad: 1, net: VIN}
    - {ref: C2, pad: 1, net: VIN}
    - {ref: C44, pad: 1, net: VIN}         # v1.1 stage bulk polymer
    - {ref: C26, pad: 1, net: VOUT_PD}
    - {ref: U1, pad: 49, net: GND}
    - {ref: U2, pad: 21, net: GND}
    - {ref: Q8, pad: 5, net: VOUT_PD}      # path FET drain = converter side
    - {ref: RS2, pad: 2, net: VIN_S}       # shunt orientation (kelvin stubs depend on it)
    - {ref: RS3, pad: 1, net: VOUT_PDS}
    - {ref: R28, pad: 2, net: QG4}         # gate-R slots present + oriented (X4)
    - {ref: R29, pad: 2, net: QG5}
    - {ref: R30, pad: 2, net: QG6}
    - {ref: R31, pad: 2, net: QG7}
  body_offset:
    - {ref: J1, axis: x, sign: "-"}        # XT60 mouth faces WEST
    - {ref: J2, axis: x, sign: "+"}
    - {ref: J3, axis: x, sign: "+"}
    - {ref: J4, axis: x, sign: "+"}
    - {ref: J5, axis: y, sign: "+"}        # USB-C mouth faces SOUTH
