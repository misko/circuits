      - {layer: B.Cu, width: 0.3,  pts: [[67.75, 68.75], [67.62, 69.9], [67.37, 70.15], [60.7, 70.15]]}
      - {layer: F.Cu, width: 0.25, pts: [[67.62, 69.9], [67.625, 69.25]]}
    vias: [[67.75, 68.75], [67.62, 69.9], [60.7, 70.15]]
  - net: VOUT_PDS   # U1.15 (PCON) -> VOUT_PDS zone
    segments:
      - {layer: F.Cu, width: 0.25, pts: [[66.25, 67.45], [66.25, 68.3]]}
      - {layer: B.Cu, width: 0.3,  pts: [[66.25, 68.3], [66.0, 68.35], [53.25, 68.35], [53.0, 68.6]]}
    vias: [[66.25, 68.3], [53.0, 68.6]]
