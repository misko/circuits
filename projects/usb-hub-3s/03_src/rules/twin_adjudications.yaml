# -- PowerPAK SO-8 merged-drain family: our footprint (KiCad official
#    PowerPAK_SO-8_Single) merges drain leads+paddle into one pad '5'; JLC
#    splits 5,6,7,8 + EP 9. Same copper region; the 1<->5 distance delta
#    (5.39 vs 6.97) is the merged-pad CENTROID vs JLC's corner lead pin 5 -
#    an artifact of merging, not a land-pattern disagreement. AOS PowerPAK
#    SO-8 recommended pattern = single drain paddle (AON6354/AON6403 DS,
#    verified at parts stage; escape_check 2026-07-21).
- {lcsc: C404363, refs: [Q2, Q3], status: PAD-MISMATCH,
   why: "merged drain '5' vs JLC 5-9 split; same copper, AOS recommended pattern is the single paddle."}
- {lcsc: C404363, refs: [Q2, Q3], status: PAD-GEOM,
   why: "1<->5 delta = merged-pad centroid vs JLC pin-5 lead; copper regions coincide."}
