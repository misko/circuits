# -- J2: USB4105-GF-A on the vendored NUMERIC-pad footprint; JLC names pads
#    A1..B12. Pad-NAMING-convention clash (pod LS1 class; alias tool has a
#    known 2-way-swap bug, so direct adjudication with hand-verified data).
- lcsc: C3020560
  refs: [J2]
  status: PAD-MISMATCH
  why: &j2_why >
    Naming-convention mismatch, not a land defect: our vendored footprint
    (USB4105_GCT_16P_TopMnt_num, built numeric 1..17 at parts stage from
    the GCT USB4105 datasheet land pattern because the tscircuit converter
    needs numeric pins) vs JLC's TYPE-C-SMD_SBC-160S1A-20-S412 which names
    the SAME 16 signal pads A1-A12/B1-B12 (+4 shell pads 1-4 vs our 4x
    "17" shell). Zero common pad NAMES -> best=none/poor fit and a
    meaningless pad1<->2 "d7.84mm" (our signal pad 1 vs their SHELL pad 2).
    Independent correctness evidence: pin-net map verified at schematic
    stage (S-VER, GCT datasheet pin table; CC1/CC2 on A5/B5 with 5.1k Rd,
    VBUS/GND rows per netlist dump), P-ESC escape green, DRC 0/0/0, and the
    twin's own MODEL-REG places the JLC body area-ratio 0.70 ON our
    courtyard with the JLC .kicad_mod's authoritative rotation. Order-
    preview eyeball required (ORDER_README).
- lcsc: C3020560
  refs: [J2]
  status: PAD-GEOM
  why: *j2_why
- lcsc: C3020560
  refs: [J2]
  status: MODEL-REG
  why: >
    Body center 3.5mm off courtyard INCLUDING pad_geom_delta=7.84mm from
    the naming clash above (the decomposition rule: the "delta" is the
    shell-vs-signal pad artifact, not a mount error). JLC's own .kicad_mod
    mounts this model at its stated rotation (authoritative per skill:
    NEVER blind-flip); asymmetric connector mouth offsets the bbox metric.
    Render eyeball: leads on pads, mouth over the north edge. Order-preview
    confirm.

