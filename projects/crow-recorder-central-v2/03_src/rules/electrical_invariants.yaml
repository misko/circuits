# electrical invariants — crow-recorder-central-v2
# Design INTENT made executable against the exported netlist (canon E-INV).
# Graded by electrical_invariants.py; E-ADR requires every protection/topology
# ADR to emit >=1. Refdes: Q1=RPP P-FET, U2/U3=PCM1865 ADCs.

invariants:
  # ---- ADR-0001 input protection ----
  - assert: series_chain
    chain: [VIN_RAW, Q1, 5V]
    through: {Q1: [D, S]}
    adr: 0001
    why: "high-side RPP P-FET in series between the raw barrel jack and the 5V rail (drain=input, source=5V rail); reverse plug leaves it off"

  - assert: net_has_part
    net: VIN_RAW
    part_type: diode
    min: 1
    adr: 0001
    why: "SMAJ5.0A TVS clamps surge on the raw input ahead of the RPP FET"

  - assert: net_has_part
    net: 5V
    part_type: capacitor
    min: 1
    adr: 0001
    why: "bulk decoupling on the protected 5V rail"

  # ---- ADR-0004 shared clock (the PCM1865 XI abs-max-2.1V trap) ----
  - assert: pin_on_net
    pin: "U2.10"
    net: GND
    adr: 0004
    why: "PCM1865 U2 XI (pin 10) tied to GND — abs-max 2.1V, MUST NOT see the 3.3V MCLK"

  - assert: pin_on_net
    pin: "U3.10"
    net: GND
    adr: 0004
    why: "PCM1865 U3 XI (pin 10) tied to GND — abs-max 2.1V"

  - assert: pin_on_net
    pin: "U2.15"
    net: MCLK_A1
    adr: 0004
    why: "PCM1865 U2 SCKI (pin 15) driven by the buffered master clock leg 1 (via 33R), not XI"

  - assert: pin_on_net
    pin: "U3.15"
    net: MCLK_A2
    adr: 0004
    why: "PCM1865 U3 SCKI (pin 15) driven by the buffered master clock leg 2 (via 33R)"
