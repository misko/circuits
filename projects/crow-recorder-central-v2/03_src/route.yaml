# crow-recorder-central-v2 route + stitch — the whole per-board input to
# skills/kicad-pcb/scripts/route_and_stitch_generic.py.
#
#   /usr/bin/python3 ~/.claude/skills/kicad-pcb/scripts/route_and_stitch_generic.py prep   03_src/route.yaml
#   ~/gits/KiCadRoutingTools/.venv/bin/python \
#       ~/.claude/skills/kicad-pcb/scripts/route_and_stitch_generic.py route 03_src/route.yaml
#   /usr/bin/python3 ~/.claude/skills/kicad-pcb/scripts/route_and_stitch_generic.py import  03_src/route.yaml
#   /usr/bin/python3 ~/.claude/skills/kicad-pcb/scripts/route_and_stitch_generic.py quick   03_src/route.yaml
#   /usr/bin/python3 ~/.claude/skills/kicad-pcb/scripts/route_and_stitch_generic.py taps    03_src/route.yaml
#   /usr/bin/python3 ~/.claude/skills/kicad-pcb/scripts/route_and_stitch_generic.py stitch  03_src/route.yaml
#
# 170x120 6-layer: F / In1(GND plane) / In2(sig) / In3(sig) / In4(GND plane) /
# B. GND is NOT routed — F/In1/In4/B pours + stitch vias own it. Signal
# routing layers are F.Cu, In2.Cu, In3.Cu, B.Cu (In1/In4 stay solid planes).
# fab_tier jlc_6layer_smallvia (skills/kicad-pcb/references/fab_tiers.yaml):
# via 0.30/0.15, track/space floor 0.09, hole-to-hole 0.20, via-in-pad.

project:
  name: crow_recorder_central_v2
  board: 04_kicad/crow_recorder_central_v2.kicad_pcb
  build_dir: 06_build/route

prep:
  out: r0.kicad_pcb
  keepouts:
    layers: [User.2]
    # 4x M3 mounting holes (H1-H4), refdes-scoped so the radius-3.2 fence
    # does not also swallow the RJ45 signal pads near the port-bank NPTH
    # posts (those are fenced separately by npth_pads below, at a much
    # tighter margin so pin 1 stays clear).
    mounting_holes: {radius: 3.2, refdes_prefix: "H"}
    # RJ45 (J3..J10) board-lock NPTH posts (o3.25mm, local (-2.79,-2.54) /
    # (9.91,-2.54)) — DRC hole-clearance is stricter than routed-copper
    # clearance, so KRT needs its own fence or it grazes the barrels.
    npth_pads: {margin: 0.6}
    edge_band: 0.7
  waves:
    exclude: ["GND", "unconnected-*"]
    groups:
      # HARDEST FIRST (golden rule 4): balanced audio + shared ADC data +
      # clocks + the USB HS pair claim their lanes before anything else.
      an_clk: [
          AUDIO1P, AUDIO1M, AUDIO2P, AUDIO2M, AUDIO3P, AUDIO3M, AUDIO4P, AUDIO4M,
          AUDIO5P, AUDIO5M, AUDIO6P, AUDIO6M, AUDIO7P, AUDIO7M, AUDIO8P, AUDIO8M,
          ADC1P, ADC1M, ADC2P, ADC2M, ADC3P, ADC3M, ADC4P, ADC4M,
          ADC5P, ADC5M, ADC6P, ADC6M, ADC7P, ADC7M, ADC8P, ADC8M, ADC_DIN,
          MID1P, MID1M, MID3P, MID3M, MID4P, MID4M, MID5P, MID5M,
          MID6P, MID6M, MID7P, MID7M, MID8P, MID8M,
          MCLK, MCLK_A1, MCLK_A2, MCLK_B1, MCLK_B2, BCLK, BCLK_SRC, LRCK, LRCK_SRC,
          USB_DP, USB_DM
        ]
      pwr: [
          5V, VIN_RAW, JACK_IN, 3V3, 0V9, 1V8, 3V3A, PLUS5V_BEEP,
          P5VA_1, P5VA_2, P5VA_3, P5VA_5, P5VA_6, P5VA_7, P5VA_8,
          SW1, SW2, PG_3V3, BEEP_RETURN
        ]
      sig: rest

route:
  krt: ~/gits/KiCadRoutingTools
  race: 3
  common:
    layers: [F.Cu, In2.Cu, In3.Cu, B.Cu]
    # NOTE: this is KRT's OWN internal geometry preset (route.py only knows
    # {standard,advanced}), NOT this project's declared fab_tier — that one
    # (jlc_6layer_smallvia, nets.yaml) is resolved automatically from
    # 03_src/rules/nets.yaml and drives the via_size/via_drill/clearance
    # floor derivation below regardless of this key. 'advanced' = KRT's
    # tighter 0.25/0.15 built-in preset, the closer of the two to our
    # 0.30/0.15 via-in-pad tier.
    fab_tier: advanced
    # PINS the via floor to our declared 0.30/0.15 (neither KRT built-in
    # preset matches — advanced alone let 33 vias auto-escalate DOWN to
    # 0.25mm in the XU316 escape field, below our tier floor; measured
    # 2026-07-23, see the file's own header for detail).
    # absolute (route.common values are NOT project-root-resolved like
    # project.board/route.final are — a relative path here depends on
    # whatever cwd the KRT subprocess inherits).
    fab_overrides: /home/mouse9911/gits/circuits/projects/crow-recorder-central-v2/03_src/fab_overrides.txt
    # via_size / via_drill OMITTED -> tier-derived 0.30/0.15 (matches the
    # XU316 EP's existing via-in-pad thermal grid geometry).
    # 0.10, matching nets.yaml default_clearance/per-class clearance
    # (2026-07-23 fix — see nets.yaml header comment: matches this tier's
    # own ADR-0009 "~0.10mm copper gap" expectation at the via-in-pad
    # escape). 0.2 (the pre-fix generate_rules_generic hardcoded default)
    # produced 500 clearance findings routing at 0.13, 158 at 0.15 produced
    # 53 (all at U1/XU316 vias-vs-pads) — measured, r0 quick.json each time.
    clearance: 0.10
    no_stub_layer_swap: true
    keepout: true
    keepout_layer: User.2
  waves:
    # track_width OMITTED on an_clk -> derives from the largest member
    # netclass floor (ANALOG_IN/CLOCK = 0.25mm, nets.yaml).
    - {name: an_clk, group: an_clk, max_iterations: 400000}
    # track_width OMITTED on pwr -> derives from PWR_IN 0.5mm (5V/VIN_RAW
    # trunk), the largest floor among this wave's members. no_power_tap_
    # neckdown: KRT's default power-tap neckdown intentionally thins stub
    # taps (e.g. down to 0.0762mm, its advanced-tier 4L track floor) below
    # the wave's blanket width — legitimate for an unclassed net, but a
    # hard track_width violation against every member's OWN netclass floor
    # here (every pwr-wave net is netclassed). Measured 2026-07-23: 14
    # track_width findings, all PWR_IN/PWR class, several at exactly
    # 0.0762mm (the advanced-tier neckdown floor).
    - {name: pwr, group: pwr, max_iterations: 400000,
       no_power_tap_neckdown: true}
    - {name: sig, group: sig, track_width: 0.15, max_iterations: 800000,
       max_probe_iterations: 60000, max_ripup: 30}
  # canon M3: promoted chain (r3 race winner on the legalize=0.35 /
  # scoped-floor placement, + thin reconciliation for VREF3 with its
  # blockers ripped and re-routed at THEIR proper widths — see
  # 01_docs/journal/routing.md). Promoted to 03_src/route/ below.
  final: 03_src/route/rv2_final.kicad_pcb

# TAPS: not needed this round. The two single-pin escapes that survived
# reconciliation at their full netclass floor (U3 pad 25 / 3V3, U1 pad 5 /
# 0V9) got a scoped_floors relaxation (nets.yaml) + a matching permissive
# rule area (floorplan.yaml keepouts: u3_3v3_tap, u1_0v9_pin5) instead of a
# manual tap — same "single-pin drop, not trunk current" reasoning, but
# config-level so generate_rules_generic emits it and re-routing at 0.15mm
# is a normal KRT pass rather than a hand-verified stub.

stitch:
  # matches route.common.clearance / nets.yaml default_clearance (0.10).
  clearance: 0.10
  # via size/drill via an EXPLICIT tiers list so try_via reads hole_to_copper
  # (2026-07-23 FRESH-lead fix, the D-BACK reframe): try_via's auto-built tier
  # (route_and_stitch_generic ~L1154) carries only {size,drill} and falls back
  # to via_site_ok's hole_to_copper=0.205 DEFAULT — 0.055mm STRICTER than this
  # board's actual 0.15mm hole_clearance DRC floor (floorplan.yaml
  # design_rules.hole_clearance). That over-conservatism, NOT placement
  # density, was why 7 of the 8 "unstitchable" GND decoupler pads stayed open:
  # each has a DRC-legal 0.30/0.15 via site within 0.2-0.8mm that try_via
  # refused at 0.205. Proven empirically 2026-07-23 (scratch test: adding GND
  # vias at 0.15-legal sites -> unc 8->1, 0 new clearance/hole findings).
  # hole_to_copper 0.155 = the 0.15 floor + a 5um cushion (try_via checks the
  # SAME 2-decimal-rounded coord it then places, against the same floor DRC
  # uses, so >=0.15 is self-consistently DRC-safe; the cushion covers
  # collide-vs-DRC arithmetic). spacing 0.6 c-c -> 0.45mm drill-edge gap,
  # comfortably above this tier's 0.20mm hole-to-hole floor.
  via: {spacing: 0.6, pth_margin: 0.3,
        tiers: [{size: 0.30, drill: 0.15, hole_to_copper: 0.155}]}
  keepin: {inset: 0.8}
  passes: [seed_stubs, dedupe_vias, normalize_vias, drop_micro_fragments,
           drop_dangling, split_t_junctions, width_floor, reload, hole_to_hole,
           pad_rescue, stub_fallback, astar_fallback, stitch_grid, fill,
           island_rescue, fill, unify_zone_priorities, heal_islands,
           prune_stitch_dangling, gate]
  unify_zone_priorities: {min_bbox: 0.8}
  dedupe_vias: {radius: 0.5, metric: box}
  # size/drill EXPLICIT (this block is NOT tier-derived — derive=False in
  # _stitch_tier_geometry, it only validates explicit values against the
  # floor). Leaving them out silently fell back to the pass's OWN hardcoded
  # 0.6/0.3 default and blew every one of our 0.30mm tier vias up to 0.6mm
  # diameter — a huge, uncollision-checked size jump that reintroduced
  # clearance violations across the board (measured 2026-07-23: 323/323
  # vias "normalized" up, immediately before 902 DRC violations appeared).
  # below_width 0.29 catches genuinely sub-floor vias only, never our
  # correctly-sized 0.30mm ones.
  normalize_vias: {below_width: 0.29, size: 0.30, drill: 0.15}
  drop_micro_fragments: {max_length: 0.12, require_free_end: true}
  drop_dangling: {max_length: 1.0, tol: 0.05, sweeps: 4}
  split_t_junctions: {tol: 0.05}
  # KRT's power-tap neckdown (even with no_power_tap_neckdown on the pwr
  # wave) can still leave a few short via-transition segments a shade under
  # their netclass floor. Routers have no ampacity concept (SKILL.md golden
  # rule 3); this lifts those specific segments to their netclass floor so
  # the gate passes for the right reason, same values nets.yaml declares.
  # NOTE: 3V3 is deliberately OMITTED — it is routed directly at its 0.4mm
  # floor (--track-width 0.4) with ONE intentional exception (the
  # u3_3v3_tap scoped floor, 0.15mm) that this blind net-wide lift would
  # otherwise clobber back to 0.4mm and violate hole/clearance geometry it
  # was specifically routed thin to avoid (measured 2026-07-23: this exact
  # blind-widen pattern — via normalize_vias's missing size/drill first,
  # then width_floor's blanket net lift — reintroduced 902 then 203 DRC
  # violations by growing existing copper with NO collision check).
  # 5V:0.501 (not 0.5): width_floor's lift condition is `width < floor*1e6
  # - 1000` (a 1um skip tolerance), but DRC compares EXACT nanometres. The
  # promoted chain carries a KRT-emitted 5V trunk segment at 0.4998mm
  # (95.1,63.1) — WITHIN the 1um tolerance at the bare 0.5 floor, so width_floor
  # skipped it and DRC flagged track_width. Raising the floor value 1um lifts
  # it over the DRC floor with margin. 0V9 is deliberately OMITTED: its one
  # sub-floor segment (0.3498mm at 93.2,94.3, a decoupler-pin tap to U1.103)
  # was routed thin ON PURPOSE to clear U1 pad 103 — a blanket width_floor lift
  # to 0.4 clipped that pad to 0.0745mm clearance (measured 2026-07-23,
  # exactly the risk the pre-existing comment warned of). It is handled instead
  # by the u1_0v9_tap103 scoped floor (nets.yaml + floorplan.yaml keepouts),
  # which lowers the DRC min-width rule to 0.34 there so the thin tap passes
  # track_width WITHOUT widening it.
  width_floor:
    nets: {5V: 0.501, VIN_RAW: 0.5, 1V8: 0.4, 3V3A: 0.4,
           PLUS5V_BEEP: 0.4, SW1: 0.35, SW2: 0.35}
  hole_to_hole: {min_gap: 0.2, mode: nudge, prefer_keep: [GND]}
  # 6-layer / TWO plane layers (In1, In4 both carry GND) — rescue pads on
  # BOTH plane layers, not one.
  pad_rescue:
    nets:
      - {net: GND, layer: In1.Cu}
      - {net: GND, layer: In4.Cu}
    via_in_pad: true
    served_within: 1.6
    # CLOSE-IN rings prepended (2026-07-23 FRESH-lead fix): the 8 open GND
    # decoupler pads have their nearest legal via site 0.2-0.8mm from the pad
    # CENTRE (a signal track crosses the pad, so via_in_pad at ring 0 is
    # blocked, but an offset site on the clear side is legal). The old floor
    # ring of 0.75mm (measured from the pad EDGE) overshot those close sites
    # entirely. angle_step 12 (30 samples/ring) densely covers the annulus so
    # the clear-side site is found.
    rings: [0.1, 0.2, 0.3, 0.45, 0.6, 0.75, 0.95, 1.2, 1.6, 2.1, 2.7]
    angle_step: 12
    stub_width: 0.3
    require: none
  stub_fallback: {net: GND, min_dist: 0.2, max_dist: 8.0, width: 0.3}
  astar_fallback: {net: GND, width: 0.25, window: 3.0, attempts: 3}
  stitch_grid:
    net: GND
    x: [16, 174, 10]
    y: [16, 124, 10]
  # min_bbox back to 0.8 (a 2.5mm exclusion tried 2026-07-23 also skipped
  # OTHER, smaller, genuinely-servable pockets — U8.2/U3.26/R_fb2b.2/
  # C_micb2.2/C_d1.2/C_c3.2/C_d4.2 all surfaced as NEW real unconnected
  # pads at the full DRC gate once excluded from island_rescue's attempt,
  # confirming the docstring's warning: skipping the search only hides the
  # problem, it does not fix it). require: pads (not "all"): the two
  # confirmed-unstitchable fragments (1.34x2.40mm near U8, 1.73x1.94mm near
  # U3 — exhaustive pcb_toolkit via_site_ok scans at 0.03mm found zero
  # legal sites in either, both pad-less) should not hard-crash the stitch
  # gate; every OTHER pocket still gets island_rescue's full attempt.
  island_rescue: {min_bbox: 0.8, layers: [F.Cu, In1.Cu, In4.Cu, B.Cu], require: pads}
  # heal_islands min_bbox 1.8 (its OWN "smaller slivers are the
  # isolated_copper class, not heal work" design intent): island_rescue
  # above (min_bbox 0.8, require: pads) already serves every genuinely
  # servable pocket, including several smaller than 1.8mm (measured: 9
  # island_rescue vias + 3 astar recoveries land BELOW this size). What's
  # STILL split after that + fill is exactly the 2 confirmed-unstitchable
  # pad-less fragments (1.34x2.40mm, 1.73x1.94mm) — 1.8 excludes both from
  # heal_islands' own die()-on-no-progress check without hiding anything
  # that pad-serving passes could actually fix.
  heal_islands: {min_bbox: 1.8}
  prune_stitch_dangling: {tol: 0.05, min_layers: 2}
