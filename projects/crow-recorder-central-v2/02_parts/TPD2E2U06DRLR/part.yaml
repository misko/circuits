layout:
  source: "TI TPD2E2U06 datasheet layout section: place the ESD array HARD against the connector's protected I/O tails (minimize stub inductance); GND pin to a solid ground; sits between the RJ45 AUDIO+/- pins and the input RC (connector side of the filter)."
  reviewed: "2026-07-23"
  notes: "instanced per port (D3..D10): each array hard against its own RJ45 AUDIO+/- tails, stub < 6mm, GND to the north-band ground pour."
