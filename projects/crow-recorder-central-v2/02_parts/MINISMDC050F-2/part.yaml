  - "Its series resistance sits IN the +5V_AUDIO pod power-delivery path: Rmin 0.15 ohm, R1max 1.0 ohm when aged/hot. Include the IR drop at the per-pod load current in the pod power budget (e.g. 0.5 A x 1.0 ohm = 0.5 V worst case)."
