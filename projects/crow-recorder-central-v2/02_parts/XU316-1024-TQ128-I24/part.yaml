limits:
  vdd_core: "0.9V nominal (0.855 / 0.900 / 0.945 V) -- needs a buck; also feeds PLL_AVDD (0.9V) and MIPI_VDD09 (0.9V)"
  vddio: "VDDIOL/R/T selectable 3.3V (2.97/3.30/3.63, AMR 3.63) or 1.8V (1.62/1.80/1.98, AMR 1.98); set by LV_L/T/R_N straps"
  vddiob18: "1.8V FIXED (1.62/1.80/1.98, AMR 1.98) -- bottom bank; hosts JTAG + XIN/XOUT"
  usb_vdd33: "3.30V (3.00/3.30/3.60)"
  usb_vdd18: "1.80V (1.62/1.80/1.98)"
  temp_grade: "-I24 = Industrial -40..+85C, 2400 MIPS (C24 = Commercial 0..70C)"
  xi_note: "24 MHz crystal, +/-500 ppm or better, 12pF load, ESR<=60R. Circuit: Rf=1M across XIN/XOUT, Rd=680R series to XOUT, CL1=CL2=22pF (datasheet lists FA-238 exactly). Alt: drive 1.8V low-jitter clock into XIN (must run before reset released). For USB, clock must be 12 or 24 MHz."
gotchas:
  - "STOCK: JLC assembly stock chronically 0 -- CONSIGNMENT/global-sourcing line (ADR-0003)."
  - "Escape GEOMETRY tier is jlc_4layer_advanced (escape_check, 27 escapes worst side); the BOARD is fabbed at jlc_6layer_smallvia (ADR-0002) because full 128-pin routing closure needs 6L + 0.30/0.15 via-in-pad on the EP + inner rings -- a routing-proven aggregate need, not the isolated escape geometry."
  - "0.4mm TQFP-128 needs 6L + SMALL-VIA (0.30/0.15) via-in-pad on the EP + inner rings for closure."
  - "EP (pin 129) = VSS/GND: stock KiCad TQFP-128_14x14mm_P0.4mm has NO exposed pad -- footprint must add a 4.70mm nom EP + a 4x4 (16) thermal-via grid, equally spaced, per datasheet 14.4. Keep other vias out from under/around the device for a solid ground plane (checklist I.1)."
  - "Pin 55 = NC -- must NOT be connected to any net (datasheet Fig.2); it is absent from the Signal List for this reason."
  - "Power domains: VDD core 0.9V (buck) also feeds PLL_AVDD(41)+MIPI_VDD09(27); VDDIOB18(35,56)=1.8V FIXED; VDDIOL/R/T selectable 3.3V vs 1.8V. LV_L_N(40)/LV_T_N(43)/LV_R_N(52) straps: FLOAT (or drive high AT 1V8)=3V3 mode, tie LOW(to GND)=1V8 mode -- MUST match the VDDIOx rail you actually supply. WARNING: 'high' here is the IOB bank level (1.8V, the bank is FIXED 1.8V) -- NEVER tie these to 3V3 (AMR VDDIO+0.5=2.3V; the misread of HIGH-as-3V3 shipped in v1.0, caught by the v1.1 pin review, PR2-P0-1)."
  - "JTAG (TDI36/TDO37/TMS44/TCK51) + RST_N(38) + crystal XIN/XOUT(34/33) all sit on the bottom VDDIOB18 bank = 1.8V FIXED (abs-max 1.98V) -- bring-up/programming must use a 1.8V-level probe (xSYS2/XTAG), never a 3.3V JTAG dongle."
  - "QSPI boot pins are HARDCODED in boot ROM (cannot change w/o OTP): CS_N=X0D01(pin2), D0=X0D04(127), D1=X0D05(128), D2=X0D06(1), D3=X0D07(3), SCLK=X0D10(4) -- all on VDDIOL, so the boot flash (W25Q16) Vcc must match the VDDIOL rail. Boot flash must be QSPI-ready within 300us of power-up (Quad-READ 0xEB, CPOL/CPHA=0) or hold RST_N until it settles; must NOT be left in QPI mode."
  - "Boot-mode straps X0D06(1)/X0D05(128)/X0D04(127) sampled at reset: all-LOW (default) = QSPI-flash boot. These share the QSPI data lines; external pull-ups pick alternate boot sources. X0D04..X0D07 are output-only during/after reset (checklist H.7) -- do not fight them with strong external drivers."
  - "No dedicated USB_VBUS pin on TQ128 -- VBUS is sensed via a spare GPIO through a divider (330K-to-gnd for a 3.3V IO domain, 100K for 1.8V) + 220K series + 1-10uF (2.2uF typ) VBUS cap + 47K bleeder (datasheet Fig.15). USB_ID(58) is the OTG ID pin."
  - "PLL_AVDD(41) needs a dedicated LC filter close to the pin: 1uF MLCC + 600R@100MHz ferrite (DCR<1R, e.g. Taiyo Yuden BKH1005LM601-T), kept separate from noisy supplies (checklist I.3)."
  - "Decoupling: multiple decouplers per supply spaced around the device with the GND side taking the shortest path back to the EP/centre ground; >=10uF bulk on VDD and on VDDIO (datasheet 14 / H.2). MIPI_VDD09/18 need 1uF close to pin (or tie to GND if MIPI unused)."
  - "Power sequencing: VDDIOL/R/T must be VALID before RST_N is released (boot pins live on VDDIOL). Ramp VDD and VDDIO monotonically, within ~50ms of each other. For a 3.3V VDDIO system: while VDDIOB18 is off the 3.3V rail must not exceed 1.98V unless VDD is off -- simplest fix is to NOT power VDDIOB18 last. A single 1.8V VDDIO lets the on-chip POR handle sequencing on its own."
verified: "128 of 128 pins + EP(pin129) mapped from datasheet Table 4 (Appendix E 'TQ128 signal list', sorted by pin number, pp.81-84) cross-checked against Fig.2 'TQ128 pin configuration' (Section 3, p.7). Pin 55 = NC confirmed from Fig.2 render (skipped in Table 4). Power-pin numbers (VDD/VDDIOx/VSS, marked 'mult' in Section 4) resolved by pin-number elimination and confirmed against Fig.2 (e.g. pins 49-64 read directly). EP=VSS=pin129 from Table 4 final row. Package dims (EP 4.70mm, 14x14 body, 0.40 pitch) from Fig.22 (Section 16, p.41). No pin conflicts; 0 gaps. -- 2026-07-23"
layout:              # datasheet Section 14 (Integration) + Appendix H/I checklists
  source: "XMOS XU316-1024-TQ128 datasheet (XM-014532-PC 2.0.0), Section 14 Integration (14.1 diff-pair routing, 14.4 ground/thermal vias), Section 7.3 Oscillator Circuit, Appendix H (design checklist) + Appendix I (PCB layout checklist)"
  reviewed: "2026-07-23"
  keep_short:
    - {net: PLL_AVDD, max_span_mm: 5, why: "PLL needs a very clean supply; 1uF + 600R ferrite LC filter cap must sit right at pin 41, isolated from noisy rails (checklist I.3)"}
    - {net: XIN, max_span_mm: 8, why: "24MHz crystal loop: keep XIN/XOUT(34/33), Rd=680R, CL=22pF, Rf=1M compact and close to the pins; guard from switching nets"}
    - {net: XOUT, max_span_mm: 8, why: "crystal drive node -- short, low-stray-capacitance routing"}
    - {net: VDD, max_span_mm: 3, why: "0.9V core decouplers close to each VDD pin, GND return shortest path to EP centre ground (14 / I.2)"}
    - {net: USB_DP, max_span_mm: 30, why: "USB HS diff pair: DP/DM(60/59) tightly length-matched, controlled ~90R differential impedance, coupled+isolated (14.1)"}
    - {net: USB_DN, max_span_mm: 30, why: "USB HS diff pair partner of USB_DP -- match length/impedance"}
