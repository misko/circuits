mpn: FA-238_24.0000MD50Y-AC   # underscore for tooling; Epson catalog notation uses a space: 'FA-238 24.0000MD50Y-AC'
manufacturer: Seiko Epson
type: crystal                 # 24.000 MHz fundamental xtal for the XU316 xcore.ai XI/XO
datasheet:
  doc_id: FA-238
  revision: Q22FA23801845     # Epson per-ordering-code sheet id (in PDF filename)
  url: https://download.epsondevice.com/td/pdf/td_xtal_mhz/FA-238_Q22FA23801845_en.pdf
  sha256: d27e91a1eea6d408143c974a6c9c592784baa911bfb35a6fbf18001383a86b0f
  fetched: 2026-07-23
  note: >-
    Epson publishes a sheet per ordering code. The committed PDF is the FA-238
    SERIES sheet (code Q22FA23801845 = 25.000 MHz / CL 8 pF example). The 4-pad
    'Internal connection (TOP VIEW)' figure, external dimensions and land pattern
    are SERIES-INVARIANT and are what is cited below. The 24 MHz / CL 9 pF
    electricals are the ordering-code parameters for -MD50Y-AC per LCSC C7190380
    parametrics; CONFIRM against the exact Q22 code sheet before release.
package: SMD3225-4Pin 3.2x2.5x0.7mm (4-pad ceramic SMD)
footprint: Crystal:Crystal_SMD_SeikoEpson_FA238-4Pin_3.2x2.5mm
escape:                        # trivial coarse-pad escape
  style: passive
  pitch: 1.6                   # worst pad-pad: pads 1&4 both x=-1.1, y=+/-0.8 -> 1.6 mm
  tier_required: jlc_2layer_default
  checked: escape_check 2026-07-23
pins:                          # from datasheet Internal connection (TOP VIEW), p.1
  1: {name: XTAL_IN,  note: "crystal electrode (XI). Pads 1/3 are symmetric/interchangeable"}
  2: {name: GND, tie: GND, note: "case-ground pad — connected to the metal cover"}
  3: {name: XTAL_OUT, note: "crystal electrode (XO)"}
  4: {name: GND, tie: GND, note: "case-ground pad — connected to the metal cover"}
limits:
  frequency: 24.000MHz
  load_capacitance_CL: 9pF     # LCSC parametric for -MD50Y-AC; sets the two loading caps
  frequency_tolerance: "+/-30ppm @25C"
  frequency_stability: "+/-50ppm -40..+85C"
  esr_max: 60ohm               # LCSC for -MD50Y-AC (series sheet shows R1<=50ohm for the 8pF/25MHz code)
  drive_level_max: 200uW
  aging: "+/-5ppm/yr (first year)"
  t_op: "-40..+85C"
loading_caps:
  formula: "C_cap = 2*(CL - C_stray), C_stray ~= 3pF"
  value_each: 12pF             # = 2*(9 - 3); two matched caps, one on XI and one on XO to GND
gotchas:
  - "Load-cap value is DERIVED from CL: C_cap = 2*(CL - Cstray) = 2*(9 - 3) = 12 pF each. Recompute if a different CL variant is ordered."
  - "Pads 2 & 4 are the metal case ground (datasheet: '#2 and #4 are connected to the cover') — tie BOTH into the guard ground, never float."
  - "XTAL_IN/XTAL_OUT (pads 1,3) traces must be short, length-matched and GND-guarded; the two electrodes are electrically interchangeable (symmetric)."
  - "Committed PDF is the FA-238 series ordering-code sheet (Q22FA23801845, an 8 pF/25 MHz example); CL=9 pF is the -MD50Y-AC parameter per LCSC. Verify exact CL against the ordered Q22 code."
  - "LCSC C7190380 was showing OUT OF STOCK at fetch (2026-07-23); confirm availability or substitute an in-stock 24 MHz FA-238 with a matched CL."
verified: >-
  4-pad map read from FA-238 datasheet 'Internal connection (TOP VIEW)' figure in
  Section 3 External dimensions, p.1 (#1/#3 = crystal electrodes XI/XO on the
  diagonal; #2/#4 = case-ground pads tied to the cover). Package + land pattern
  per Section 3 and Section 4 'Footprint (Recommended)', p.1. 2026-07-23.
layout:                        # REQUIRED: type crystal is P-LAYOUT scoped
  source: >-
    FA-238 datasheet Sec.3/4 (external dims + recommended land) + standard xtal-osc
    practice for the XU316 xcore.ai clock input: place the crystal and BOTH load
    caps hard against the XU316 XI/XO pins; short, symmetric, length-matched XI/XO
    traces; solid GND guard ring and GND pour under the part; keep high-di/dt and
    switching nets away from XI/XO.
  reviewed: "2026-07-23"
  keep_short:
    - {net: XTAL_IN,  max_span_mm: 6, why: "XI from XU316 clock pin to xtal pad + its 12 pF load cap; short and guarded"}
    - {net: XTAL_OUT, max_span_mm: 6, why: "XO from XU316 clock pin to xtal pad + its 12 pF load cap; length-matched to XI"}
layout_refs:
  - "FA-238 datasheet Sec.4 Recommended footprint (mfr land pattern), p.1"
  - "XMOS xcore.ai (XU316) hardware design checklist — crystal oscillator guidance"
  - "KiCad Crystal_SMD_SeikoEpson_FA238-4Pin_3.2x2.5mm land pattern"
sourcing:
  lcsc: C7190380
  alternates: ["Q22FA23800065 (FA-238 24 MHz, CL 12 pF)", "FA-238 24.0000MB-C3 (CL 18 pF)"]
