# crow-array-pod net architecture — source of truth for netclasses + DRU
# floors. generate_rules.py emits these into 04_kicad/*.kicad_pro and
# .kicad_dru. Defined BEFORE routing (kicad-pcb golden rule 3).

fab_tier: jlc_2layer_default  # standard 0.6/0.3 vias — no advanced option

classes:
  PWR:
    intent: >
      5V feed (2x paralleled Cat5e pairs) and the RC-filtered 5VF bias
      rail. Total pod draw ~6mA; 0.4mm floor is ~1A-class copper — pure
      robustness margin, NOT an ampacity requirement (hence below the
      R-POUR 0.5 pour-trigger: no pour needed at these currents).
    nets: [5V, 5VF]
    current: 0.006A
    min_width: 0.4mm
    routing: F.Cu trunks; B.Cu crossings short (GND plane priority)
    verify: DRC floor

  BEEP:
    intent: >
      Beeper pair: 150mA 4kHz bursts, inductive. 0.4mm floor = ~1A
      ampacity, >6x margin. Kept in the SW corner away from the mic/amp;
      loop area minimized (feed and return adjacent).
    nets: [BEEP_5V, BZ_P, BEEP_RET]
    current: 0.15A
    min_width: 0.4mm
    routing: short J1->R12->BZ1 run with adjacent return; clamp at BZ1
    verify: DRC floor + audit separation check

  AUDIO:
    intent: >
      Balanced output pair + amp nodes + the 2.5V midpoint reference.
      0.3mm floor keeps them off any thin-pass; routed over continuous
      B.Cu GND; pair legs kept adjacent.
    nets: [AUDIO_P, AUDIO_N, AUD_P_I, AUD_N_I, A_OUT, B_OUT, VMID]
    current: signal
    min_width: 0.3mm
    routing: F.Cu preferred, AUDIO_P/N as a pair, VMID star from C4/C5
    verify: audit checks mic-node length + beeper separation

# Default 0.25mm: MIC, AIN, FB_A, FB_B, SHIELD. The MIC/AIN nodes are the
# high-impedance (3.9k/100k) nodes — kept SHORT (audit I-MIC) rather than
# wide. GND is not routed: F+B pours + stitch vias (stitch_and_fill.py).
