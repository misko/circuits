# Twin adjudications — known-different findings between our footprints and
# JLC's EasyEDA CAD, each with verification evidence. Gate: zero
# UNadjudicated criticals. Format (top-level YAML list):
#   - {lcsc: Cxxxx, refs: [U1], status: <finding status>, why: "<evidence>"}
# Optional per-part render override: model_rot_z.
- lcsc: C400894
  refs: [Q1]
  status: MODEL-REG
  why: >
    DPAK body-bbox asymmetry, not a mis-mount. Pixel-measured twin_top.png
    against the 4 mounting holes (10.487 px/mm, H4 cross-check exact,
    2026-07-16): tab metal centered x=124.1mm on our 6.4mm tab pad
    (center 124.0), both gull-wing lead groups on the pin pads
    (121.35/125.95 vs pads 121.72/126.28 — the 0.4mm is the reported
    pad-fit residual, fit=0.43mm), pin-1 dot at pad 1 (PFET_G). Rendered
    body 6.3x5.7mm matches the TO-252 6.6x6.1 spec, so not a wrong-model
    swap. The 1.3mm bbox-center delta decomposes as the WRL bbox's
    inherent lead-axis asymmetry (x range -4.19..+2.39mm, 0.9mm
    off-center: leads protrude one side, exposed tab the other) plus the
    courtyard center sitting between tab and lead spans; the script's own
    180-flip probe did NOT bring it under 1mm, confirming it is not a
    flipped model.
    ADDENDUM 2026-07-16 (post-audit decomposition): the original why
    mis-filed part of this delta - it is ~0.9mm WRL bbox asymmetry PLUS
    ~0.4mm of REAL land-pattern disagreement (the same 0.37mm systematic
    lead shift measured above; see the C400894 PAD-GEOM entry). Render
    seating restored via model_dx there; MODEL-REG now 1.1mm.
- lcsc: C400894
  refs: [Q1]
  status: PAD-GEOM
  model_dx: 0.4
  why: >
    KiCad TO-252-2 vs JLC DPAK land-pattern style delta, not a part
    mismatch: tab-to-lead pad-center distance 6.70mm (ours) vs 7.31mm
    (JLC), dominated by differing pad extents (our lead pads 2.2mm long
    vs JLC 2.5mm; tab pads differ in body-side reach). Physical fit
    verified: DPAK foot span sits fully on our lead pads under either
    interpretation; fresh-context reviewer confirmed copper at design
    positions (east anon-pad edge 126.97 vs expected 126.90). Render
    seating restored with model_dx +0.4mm east, chosen from pixel
    measurement (tab metal was centered, both gull leads 0.37mm west;
    +0.4 splits metal deviation across tab and leads - MODEL-REG
    1.3mm -> 1.1mm). AOS package drawing not in 02_parts (electrical-only
    datasheet) - noted as parts-stage gap; JEDEC TO-252 geometry used.
