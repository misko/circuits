description: >
  2.2 uF +/-10% 16 V X5R MLCC, 0603 (1608 metric). SY8368QNC VCC decoupling
  (datasheet calls for 2.2 uF ceramic on VCC, an internal ~3.3 V LDO rail).
  MPN decode per the Samsung catalog numbering table: CL 10 A 225 K O 8 NNNC
  = 0603 size, X5R dielectric, 2.2 uF, +/-10%, 16 V, 0.8 mm height.
  Chosen because C23630 is the JLC BASIC 2.2uF 0603 with deep stock
  (4.17M at check time, 2026-07-16).
