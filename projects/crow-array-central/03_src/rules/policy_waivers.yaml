# Policy-audit waivers — crow-array-central v1.0 (2026-07-18).
# Evidence-backed per canon M4; a waiver without a why is itself a FAIL.

- id: R-DRC
  why: >
    ADR-0010: the DRC gate reports 0 violations / 0 parity and EXACTLY 2
    unconnected items, both `Zone [GND] <-> Zone [GND]` micro-slivers
    (sub-1.4mm isolated GND pour fill deposited by the headless fill
    engine in the dense escape pockets). No component pad, track, or via
    is unconnected — all 234 parts' GND pads are plane-bonded. Exhaustive
    generator-side remediation (island-removal mode, in-sliver bonding
    vias, keepouts, min-thickness, pour removal, 405-via infill) all fail
    to change the headless count; the copper is electrically and
    manufacturally inert. Full evidence: 01_docs/decisions/0010. The
    rebuild gate (rebuild_all.sh) enforces this shape strictly: only
    Zone[GND]-vs-Zone[GND], max 2 — anything else fails.
- id: R-POUR
  why: >
    D15 (BRIEF): on this 6-layer board power is deliberately carried as
    DRU-floored TRACKS on the 4 signal layers, not pours — In2/In3 carry
    routed signals and rail patches and a 5V pour there would fragment
    under the XU316 into unstitchable islands (same reason In2/In3 have
    no GND pour, ADR-0008). Ampacity: the PWR5 class (5V/5V_P/5V_IN) has
    a 0.50mm DRU width floor (generate_rules; enforced at DRC 0); worst
    trunk current 1.2A (both bucks + 6 pods + one beeper, rules/nets.yaml)
    is within a 0.5mm 1oz outer trace's ~1.2-1.4A @10C IPC-2152 rating,
    and every branch (buck VIN <=0.45A, port PTC <=0.15A) is far below.
    The entry path J9 -> F1 PTC (2A hold) -> D9 TVS -> Q9 FET additionally
    current-limits the trunk. The necked exceptions (D25) carry their own
    margin math in the DRU comment.
- id: R-THERM
  why: >
    The single flagged pad is U1.129 — the XU316 exposed pad. Its thermal
    vias are FOOTPRINT PADS, not board vias, so the R-THERM board-via
    counter sees 0: make_lib.py bakes a 4x4 grid of 16 PTH thermal-via
    pads (0.3mm drill) into the vendored TQFP-128 EP4.7 footprint per
    XU316 datasheet 14.4 p.32, all numbered 129/VSS into the In1/In4
    planes. Machine-checked every rebuild by audit_board I11 (>=2 EP PTH
    vias; currently 16) and independently confirmed by the fresh-context
    pin review (U1 EP finding: "16 vias in a 4x4 grid — MATCH").
