  - assert: pin_on_net
    pin: "U_HUB.2"
    net: MGMT_N
    adr: "0007"
    why: With PRT_SWP1 high, management D- must occupy physical downstream-port-1 DP to preserve a coupled route.
  - assert: pin_on_net
    pin: "U_HUB.3"
    net: P1_HUB_N
    adr: "0007"
    why: With PRT_SWP2 low, external-port-1 D- must occupy physical downstream-port-2 DM.
  - assert: pin_on_net
    pin: "U_HUB.4"
