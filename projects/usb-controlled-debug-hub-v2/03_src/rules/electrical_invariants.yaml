  # FSUSB42 is an electrically symmetric dual-SPDT analog switch.  For the
  # outward-facing receptacle geometry, logical D+ deliberately uses the
  # package's conventional minus channel (6->4) and logical D- uses its plus
  # channel (7->3).  Bind both ends so this is an explicit lane assignment,
  # never an accidental net-name swap.
  - {assert: pin_on_net, pin: "U_DATA1.6", net: P1_PORT_P, adr: "0007", why: "port 1 D+ enters symmetric FSUSB42 channel 6"}
  - {assert: pin_on_net, pin: "U_DATA1.4", net: P1_HUB_P, adr: "0007", why: "port 1 D+ exits the same FSUSB42 channel at common pin 4"}
  - {assert: pin_on_net, pin: "U_DATA1.7", net: P1_PORT_N, adr: "0007", why: "port 1 D- enters symmetric FSUSB42 channel 7"}
  - {assert: pin_on_net, pin: "U_DATA1.3", net: P1_HUB_N, adr: "0007", why: "port 1 D- exits the same FSUSB42 channel at common pin 3"}
  - {assert: pin_on_net, pin: "U_DATA2.6", net: P2_PORT_P, adr: "0007", why: "port 2 D+ enters symmetric FSUSB42 channel 6"}
  - {assert: pin_on_net, pin: "U_DATA2.4", net: P2_HUB_P, adr: "0007", why: "port 2 D+ exits the same FSUSB42 channel at common pin 4"}
  - {assert: pin_on_net, pin: "U_DATA2.7", net: P2_PORT_N, adr: "0007", why: "port 2 D- enters symmetric FSUSB42 channel 7"}
  - {assert: pin_on_net, pin: "U_DATA2.3", net: P2_HUB_N, adr: "0007", why: "port 2 D- exits the same FSUSB42 channel at common pin 3"}
  - {assert: pin_on_net, pin: "U_DATA3.6", net: P3_PORT_P, adr: "0007", why: "port 3 D+ enters symmetric FSUSB42 channel 6"}
  - {assert: pin_on_net, pin: "U_DATA3.4", net: P3_HUB_P, adr: "0007", why: "port 3 D+ exits the same FSUSB42 channel at common pin 4"}
  - {assert: pin_on_net, pin: "U_DATA3.7", net: P3_PORT_N, adr: "0007", why: "port 3 D- enters symmetric FSUSB42 channel 7"}
  - {assert: pin_on_net, pin: "U_DATA3.3", net: P3_HUB_N, adr: "0007", why: "port 3 D- exits the same FSUSB42 channel at common pin 3"}
  - {assert: pin_on_net, pin: "U_DATA4.6", net: P4_PORT_P, adr: "0007", why: "port 4 D+ enters symmetric FSUSB42 channel 6"}
  - {assert: pin_on_net, pin: "U_DATA4.4", net: P4_HUB_P, adr: "0007", why: "port 4 D+ exits the same FSUSB42 channel at common pin 4"}
  - {assert: pin_on_net, pin: "U_DATA4.7", net: P4_PORT_N, adr: "0007", why: "port 4 D- enters symmetric FSUSB42 channel 7"}
  - {assert: pin_on_net, pin: "U_DATA4.3", net: P4_HUB_N, adr: "0007", why: "port 4 D- exits the same FSUSB42 channel at common pin 3"}
