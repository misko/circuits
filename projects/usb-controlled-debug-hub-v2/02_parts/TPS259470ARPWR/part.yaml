gotchas:
  - "The complete 0A suffix matters: TPS259470A actively current-limits and auto-retries. The retained aggregate U_AGG remains the distinct TPS259474L circuit-breaker/latch-off variant."
  - "Pin 4 is active-low open-drain FLT on the 0x variants and connects directly to USB2517I OCS_N. Pins 3 and 10 may remain open; pin 2 is grounded where 5V OVLO is intentionally disabled."
  - "External ports use 5.90k 1% RILM. TI's 3334/R equation with +/-10% ILIM error and resistor tolerance gives 0.503..0.628A before TCR; the exact bound is owned by power_tree.yaml."
  - "U_PD_IN uses the same part ahead of the buck. Its three-resistor UVLO/OVLO string disconnects the 20uF buck bank until a negotiated voltage is present; C_PD_IN_DVDT controls attach inrush."
