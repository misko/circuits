# USB controlled debug hub — evidence-backed JLC twin dispositions.
#
# This register accepts measured detector limitations only. It never overrides
# CPL rotation; jlc_lcsc_rotations.csv remains the sole rotation authority.

- lcsc: C86462
  refs: [J_UP]
  status: MODEL-REG
  render_model_extension: step
  plan_bbox_expand_mm: 1.52
  why: >-
    Measured 2026-08-16 for the exact TE 292304-1 / JLC C86462 upstream
    receptacle. The numbering-free pad fit is non-mirrored at 0 degrees with
    0.17 mm residual, and the native registration gate passes all six drilled
    attachment centres plus signed-Z side profiles against the exact
    manufacturer STEP. The easyeda2kicad WRL generated from that same catalog
    solid renders its bulk below the PCB and occludes the bottom-side upstream
    ESD device; the catalog STEP is byte-identical to the independently proven
    project-native STEP and renders on the declared top side. A same-camera
    isolated comparison measured the STEP plan envelope 1.52 mm beyond the WRL
    parser envelope on each side, with only 0.016 mm centre delta. Select STEP
    and expand only the independent expected envelope; the ordinary 1.00 mm
    centre and outward tolerances remain active. This does not change CPL
    position, rotation, land pattern, pin mapping, or connector orientation.

- lcsc: C17700166
  refs: [L_PD]
  status: PAD-MISMATCH
  why: >-
    Manufacturer-authoritative land pattern. Sunlord MWSA-S catalog revision
    2025-05-29 p.2 specifies MWSA0804S I=2.75 mm pad width, J=4.00 mm inner
    gap and H=5.50 mm pad height. The exact source footprint implements
    2.75 x 5.50 mm pads at +/-3.375 mm; the JLC/EasyEDA library's 2.10 mm
    pads at +/-3.90 mm are deliberately rejected. Exact part identity is
    MWSA0804S-3R3MT / C17700166.

- lcsc: C17700166
  refs: [L_PD]
  status: PAD-GEOM
  why: >-
    Same manufacturer-backed disposition as the C17700166 PAD-MISMATCH row:
    Sunlord's exact recommended land, not the JLC library land, owns the PCB.

- lcsc: C207257
  refs: [D_PD_TVS]
  status: PAD-MISMATCH
  why: >-
    Manufacturer-authoritative land pattern. Littelfuse SMF datasheet revision
    2020-05-15 p.5 specifies SOD-123FL lands 1.60 x 1.40 mm with a 1.30 mm
    inner gap (2.90 mm centres). The exact source footprint implements those
    dimensions; the JLC/EasyEDA C207257 library's 3.34 mm spacing is rejected.

- lcsc: C207257
  refs: [D_PD_TVS]
  status: PAD-GEOM
  why: >-
    Same manufacturer-backed disposition as the C207257 PAD-MISMATCH row:
    Littelfuse's exact SOD-123FL mounting-pad recommendation owns the PCB.

- lcsc: C165948
  refs: [J_DATA, J_POWER]
  status: MODEL-REG
  why: >-
    Detector false positive for the asymmetric HRO TYPE-C-31-M-12 body. The
    exact JLC land fit is 0.00 mm at the measured 0-degree LCSC rotation, the
    exact HRO drawing and project-native registration agree with all sixteen
    SMT contacts and four shield/retention holes, and the fresh top, west-edge
    and northwest-isometric twin views show both receptacle mouths outboard
    with contacts seated on their lands. The 1.7 mm body-to-courtyard centre
    delta is the connector's intentional asymmetric shell, not a placement
    nudge. No rotation, position, model offset, or pad mapping is overridden.
