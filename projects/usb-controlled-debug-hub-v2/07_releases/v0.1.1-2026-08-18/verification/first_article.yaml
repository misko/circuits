rails:
  - name: VBUS_PD
    resistance: {probe: "C_PD_IN_HF.1 to C_PD_IN_HF.2", min_ohm: 1000, max_ohm: 1000000}
    voltage: {probe: "C_PD_IN_HF.1 to C_PD_IN_HF.2", min_v: 14.25, max_v: 15.75}
    no_load_current: {probe: inline_PD_analyzer, min_a: 0, max_a: 0.20}
    supply: {probe: "qualified 15 V / 3 A USB-C PD source through a 0.30 A current-limited first-power fixture",
             min_v: 14.25, max_v: 15.75, max_current_limit_a: 0.30}
  - name: VBUS_PD_SW
    resistance: {probe: "C_PD_IN1.1 to C_PD_IN1.2", min_ohm: 1000, max_ohm: 1000000}
    voltage: {probe: "C_PD_IN1.1 to C_PD_IN1.2", min_v: 14.0, max_v: 15.75}
    no_load_current: {probe: inline_PD_analyzer, min_a: 0, max_a: 0.20}
    supply: {probe: "qualified 15 V / 3 A USB-C PD source through a 0.30 A current-limited first-power fixture",
             min_v: 14.25, max_v: 15.75, max_current_limit_a: 0.30}
  - name: P5V_REG
    resistance: {probe: "C_PD_OUT1.1 to C_PD_OUT1.2", min_ohm: 20, max_ohm: 1000000}
    voltage: {probe: "C_PD_OUT1.1 to C_PD_OUT1.2", min_v: 5.04, max_v: 5.22}
    no_load_current: {probe: inline_PD_analyzer, min_a: 0, max_a: 0.20}
    supply: {probe: "qualified 15 V / 3 A USB-C PD source through a 0.30 A current-limited first-power fixture",
             min_v: 14.25, max_v: 15.75, max_current_limit_a: 0.30}
  - name: P5V_PROTECTED
    resistance: {probe: "C_TRUNK_USB.1 to C_TRUNK_USB.2", min_ohm: 20, max_ohm: 1000000}
    voltage: {probe: "C_TRUNK_USB.1 to C_TRUNK_USB.2", min_v: 4.90, max_v: 5.25}
    no_load_current: {probe: inline_PD_analyzer, min_a: 0, max_a: 0.20}
    supply: {probe: "qualified 15 V / 3 A USB-C PD source through a 0.30 A current-limited first-power fixture",
             min_v: 14.25, max_v: 15.75, max_current_limit_a: 0.30}
  - name: 3V3_MAIN
    resistance: {probe: "C_CTRL_VDD.1 to C_CTRL_VDD.2", min_ohm: 20, max_ohm: 1000000}
    voltage: {probe: "C_CTRL_VDD.1 to C_CTRL_VDD.2", min_v: 3.20, max_v: 3.40}
    no_load_current: {probe: inline_PD_analyzer, min_a: 0, max_a: 0.20}
    supply: {probe: "qualified 15 V / 3 A USB-C PD source through a 0.30 A current-limited first-power fixture",
             min_v: 14.25, max_v: 15.75, max_current_limit_a: 0.30}
