service: "JLCPCB double-sided SMT assembly plus post-through-hole assembly for the upstream, downstream, and power connectors"
sides: [top, bottom]
fiducials: "3 top-side global fiducials"
build_quantity: 5

pcb_process: "JLC four-layer advanced; copper-paste-filled and copper-capped via-in-pad process on the complete 0.20 mm drill family"
via_process:
  ipc_4761: type_vii_filled_and_capped
  fill_material: copper_paste
  selection: drill_family_order_selector
  source: "03_src/floorplan.yaml thermal_vias plus 03_src/route.yaml stitch.protect_via_family over the realized routed board"
  protected_geometry: {via_diameter_mm: 0.46, drill_mm: 0.20}
  fabricator_selector:
    kind: drill_family
    protected_drill_mm: 0.20
    ordinary_drill_mm: [0.35]
  ordinary_vias: "0.35 mm power-transfer drill family only; no fill/cap treatment"
  order_remark: >-
    Copper-paste fill and copper cap the complete 0.20 mm drill family:
    every 0.46/0.20 mm via is IPC-4761 Type VII, including every realized
    via-in-pad barrel. The v0.1.1 exact-board census is 502 protected
    0.46/0.20 mm vias and 11 ordinary 0.70/0.35 mm vias. Do not fill or cap
    the ordinary 0.35 mm drill family. Confirm both counts and this selective
    drill-family process in the
    manufacturing review before payment.
  uploader_confirmation_required: true

through_hole:
  process: >
    JLCPCB mixed-technology / post-through-hole connector assembly for the two
    USB-C receptacles and four USB-A receptacles.
  refs: [J_DATA, J_POWER, J_PORT1, J_PORT2, J_PORT3, J_PORT4]
  evidence: >
    Measured 2026-08-18 from the exact v2 source and placed board: J_DATA and
    J_POWER are HRO TYPE-C-31-M-12 / JLC C165948 receptacles with SMT contacts
    and plated shield/retention holes; J_PORT1 through J_PORT4 are
    KH-AF90DIP-112 / JLC C503996 with plated connector holes. All six refs are
    present in the BOM and CPL. The JLC uploader and mixed/THT assembly preview
    must retain each exact ref, code, side, rotation, and hole population before
    payment; otherwise stop and move the affected refs to an evidence-backed
    hand-assembly disposition.

