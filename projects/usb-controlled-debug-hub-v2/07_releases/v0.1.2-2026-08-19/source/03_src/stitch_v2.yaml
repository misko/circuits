# Final-ground stage contract for the v2 two-USB-C design.  The input board is
# regenerated by the deterministic signal-prefix chain before every run; this
# file owns only GND pad rescue, plane stitching, zone-island healing and the
# final fill.  It does not generate firmware.
project:
  name: usb_controlled_debug_hub
  board: 03_src/route/ground_prefix.kicad_pcb
  build_dir: 06_build/stitch_v2

flow:
  heartbeat_s: 10
  timeouts_s: {default: 600, stitch: 1200}

stitch:
  clearance: 0.30
  via:
    size: 0.46
    drill: 0.20
    spacing: 0.80
    pth_margin: 0.25
    tiers:
      - {size: 0.46, drill: 0.20, hole_to_copper: 0.255}
  keepin: {inset: 0.8}
  passes: [dedupe_vias, drop_micro_fragments,
           split_t_junctions, reload, hole_to_hole, pad_rescue, stub_fallback,
           stitch_grid, fill, island_rescue, fill,
           fresh_reload, heal_islands,
           prune_stitch_dangling, protect_via_family, gate]
  dedupe_vias: {radius: 0.5, metric: box}
  drop_micro_fragments: {max_length: 0.12, require_free_end: true}
  split_t_junctions: {tol: 0.05}
  hole_to_hole: {min_gap: 0.25, mode: nudge, prefer_keep: [GND]}
  pad_rescue:
    net: GND
    via_in_pad: true
    skip_refs: [C_HUB_A4, C_HUB_18PLL]
    served_within: 1.4
    rings: [0.7, 0.9, 1.2, 1.6, 2.1]
    stub_width: 0.25
    stub_scope: {min_track_width: 0.18}
    require: none
  stub_fallback: {net: GND, min_dist: 0.2, max_dist: 7.0, width: 0.25}
  stitch_grid:
    net: GND
    x: [24, 146, 8]
    y: [24, 112, 8]
    avoid:
      # Preserve the reviewed PD, buck and aggregate-eFuse routing cell.  Its
      # component returns are handled by pad rescue; a coarse grid must not
      # puncture the high-current B.Cu spines or their sense corridors.
      - {x0: 20.0, y0: 88.0, x1: 96.0, y1: 119.3, margin: 0.8}
      - {x0: 87.5, y0: 31.5, x1: 88.5, y1: 32.5, margin: 0.0}
      - {x0: 143.5, y0: 31.5, x1: 144.5, y1: 32.5, margin: 0.0}
  island_rescue:
    min_bbox: 0.8
    layers: [F.Cu, In1.Cu, In2.Cu, B.Cu]
    require: all
  heal_islands:
    min_bbox: 0.1
    layers: [F.Cu, In1.Cu, In2.Cu, B.Cu]
    sample_step: 0.05
    max_gap_candidates: 2000
    clear_rescue_failures: true
  prune_stitch_dangling: {tol: 0.05, min_layers: 2, scope: emitted}
  protect_via_family:
    via: {size: 0.46, drill: 0.20}
    via_protection: {capping: yes, filling: yes}
    min: 1
