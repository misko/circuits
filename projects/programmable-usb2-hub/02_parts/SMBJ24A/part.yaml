gotchas:
  - "This is the unidirectional A part, not SMBJ24CA. Incoming inspection should find the cathode band and Littelfuse marking code LZ."
  - "24.0 V is the maximum reverse stand-off, not a nominal-supply target with tolerance left over. The commission's 24.0 V input limit is an absolute value at J1 including supply accuracy, line regulation, ripple and wiring rise. A nominal 24 V +/-5% source is prohibited."
  - "Install after the LM74810 reverse-blocking MOSFET so reverse input cannot forward-bias the unidirectional TVS. The replaceable fuse remains upstream of the protection chain."
  - "38.9 V is characterized only at 15.5 A on the 10/1000 us pulse waveform. The board makes no automotive load-dump claim. Protected-rail qualification must verify <=38.9 V at the TVS terminals and <=40.0 V at U4 VIN for <=1 ms; a wider or longer event is outside the design envelope."
  - "The 600 W rating assumes 5.0 x 5.0 mm copper at each terminal. Extend copper beyond the bare KiCad D_SMB pads and minimize the clamp loop."
verified: "Littelfuse SMBJ series v4 Electrical Characteristics table p.2, exact SMBJ24A row; DO-214AA polarity/dimensions and environmental data p.5; part-number/marking system p.6. The p.5 solder-pad envelope requires I>=2.26, J>=2.16, K<=2.74, L>=2.16 mm; KiCad D_SMB's 2.50 x 2.30 mm pads with 1.80 mm inner gap satisfy it. Checked 2026-08-01."
sourcing:
