  alternates: []
  note: "Exact Littelfuse SMBJ24A had LCSC stock 22,705 on 2026-08-01; assembly class and unidirectional marking must be rechecked at order time."
layout:
  source: "Littelfuse SMBJ series v4 Maximum Ratings note 2 and DO-214AA solder-pad guidance, with clamp placement re-derived for the LM74810 protected-side rail."
  notes:
    - "Place directly across the protected rail and input ground, immediately after the reverse-blocking MOSFETs. Keep both legs broad and the out-and-back loop very short."
    - "Provide at least 5 x 5 mm connected copper at each terminal if relying on the 600 W rating; avoid thermal spokes in the surge path."
