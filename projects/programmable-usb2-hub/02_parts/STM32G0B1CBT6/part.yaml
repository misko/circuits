gotchas:
  - "This exact MPN is the GP LQFP48 variant. It has PC7 on pin 31 and PC6 on pin 30; it does not have the N-variant VDDIO2/VSS pair at those pins. Do not use the _CxTxN pinout."
  - "USB device data is PA11 pin 33 = DM and PA12 pin 34 = DP by default. PA9/PA10 remap exists but must not be enabled for this board."
  - "Crystal-less USB device operation is supported by HSI48 plus CRS synchronized from USB SOF. It is valid in device mode; firmware must enable automatic trimming before attaching."
  - "Connect VDD/VDDA pin 6 to 3.3 V and VSS/VSSA pin 7 to ground. Fit 100 nF ceramic plus 4.7 uF at pin 6/7. Tie VREF+ pin 5 to VDDA for ADC use and decouple it with 100 nF; add 1 uF only if VREFBUF is enabled."
  - "With no backup battery, tie VBAT pin 4 to VDD. Leave the 32 kHz and HSE oscillator pins unpopulated when internal clocks are used."
  - "Expose SWDIO pin 35, SWCLK pin 36, NRST pin 10, 3V3 and GND on a programming header. PA14 is also BOOT0; hold the boot policy deterministic with option bytes and/or a weak pulldown while preserving SWCLK."
  - "Unused GPIO may be left electrically open but firmware must not leave floating digital inputs enabled; configure unused pins to analog mode or a defined output/pull state."

verified: "CITED: complete 1-48 map read from DS13560 Rev 6 Figure 5 'STM32G0B1CxT LQFP48 pinout', PDF p38, and cross-checked against Table 12 PDF pp47-57 and live JLC C2847904 symbol. 2026-07-31."

layout:
  source: "ST DS13560 Rev 6 Section 5.1.6 Figure 15 and General PCB design guidelines PDF pp65,106; AN5096 Rev 4 hardware design guidance"
  reviewed: 2026-07-31
  notes:
    - "Place the 100 nF ceramic and 4.7 uF bulk directly at the combined VDD/VDDA pin 6 and VSS/VSSA pin 7; place VREF+ decoupling at pin 5."
    - "Route PA11/PA12 as a short 90 ohm differential pair to the internal hub port with a continuous ground reference, matched geometry, no stubs, and minimal layer changes."
    - "Keep SWD and reset accessible. Reserve an outward escape corridor on each 0.5 mm-pitch side; the loaded sides carry up to eleven non-supply signals."
    - "Keep ADC sense traces away from the high-current buck switching nodes and reference their dividers to the quiet MCU analog ground region tied into the solid plane."

