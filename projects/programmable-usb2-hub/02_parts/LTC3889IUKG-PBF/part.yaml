gotchas:
  - "Do not ground ASEL0/ASEL1: Table 6 maps that selection to address bits 000/0000, producing reserved address 0x00. Both pins are deliberately open so MFR_ADDRESS controls the full address; startup forces 0x4F through write-only global address 0x5A before any device read."
  - "Factory OPERATION is PWM off, but release safety also requires hardware RUN0/RUN1 inhibition; EEPROM state is not the sole safety control."
  - "5.215 V is not exactly representable: encode and verify Linear16 word 0x14DC = 5.21484375 V."
  - "AUX_6V must supply EXTVCC above the 5.6 V maximum takeover threshold; do not credit takeover at the 5.215 V output."
  - "Each 4 A rail uses one 6.8 uH inductor. At the -20% inductance corner, 24 V input and 250 kHz, ripple is 3.001 A peak-to-peak and the full-load peak is 5.501 A."
  - "Program and read back IOUT_CAL_GAIN Linear11 0xD280 = 10 mOhm and IOUT_OC_FAULT_LIMIT Linear11 0xCBC0 = 7.5 A, selecting the datasheet's explicit 75 mV full-scale tier rather than an interpolated threshold."
  - "At the guaranteed 68/82 mV threshold and +/-1% shunt corners the peak limit spans 6.733-8.283 A. The low corner exceeds the 5.501 A load-plus-ripple peak by 22.4%; the high corner remains below the inductor's 15.2 A Isat(-20%) rating."
  - "At the high threshold corner the 10 mOhm shunt dissipates 0.686 W, below its 1 W rating; qualify temperature at 4 A continuous load."
  - "Use the 30 ohm/1 nF differential current-sense filters shown in the LTC3889 application circuit and true Kelvin routing to each 10 mOhm shunt."
  - "Bootstrap capacitance is at least 330 nF per phase and each external bootstrap diode is rated at least 60 V."
  - "Unused TSNS pins go to ground; unused input-current-sense pins IIN+/IIN- are shorted to VIN as specified."
