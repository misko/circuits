  junction_temperature: -40 to +150 C
  ideal_diode_forward_regulation: 9.1 mV typ
  ideal_diode_reverse_threshold: -4 mV typ
  msl: Level-2-260C-1 YEAR
  design_topology: "common-drain back-to-back N-FETs: VIN_FUSED -> Q1 source; Q1 drain = Q2 drain = FET_MID; Q2 source -> VIN_PROTECTED"
  design_ov_divider: "90.9 kOhm 1% from SW to OV; 4.64 kOhm 0.1% from OV to GND; VSNS senses VIN_FUSED"
  design_ov_thresholds: "25.34 V rising / 23.27 V falling typical; 24.345 V conservative minimum rising and 26.390 V conservative maximum rising using TI's 1.195/1.267 V threshold limits, resistor corners, and 200 nA OV-pin leakage on the high corner"
  design_uvlo_divider: "90.9 kOhm 1% from VIN_FUSED to EN/UVLO; 11.5 kOhm 1% from EN/UVLO to GND"
  design_uvlo_thresholds: "10.96 V rising / 10.08 V falling typical; conservative rising range 10.44-11.51 V and falling range 9.53-10.53 V including TI threshold limits, worst 1% resistor ratios, and 200 nA EN/UVLO-pin leakage"
  design_charge_pump_capacitor: "220 nF X7R, 25 V minimum, CAP-to-VS; exceeds 10 x the two BSC016N06NS Ciss total (about 104 nF)"
  design_vs_bypass: "100 nF X7R, 100 V, VS-to-GND, at pins 10/7"
  design_input_bypass: "100 nF X7R, 100 V, VIN_FUSED-to-GND, adjacent to the FET/controller path"
gotchas:
  - "The exposed pad is named RTN but must be left electrically floating. This overrides normal WSON thermal-pad instincts; no thermal vias or GND pour connection."
  - "This controller supplies reverse-input blocking plus UVLO/OVLO-controlled disconnect through two external N-channel MOSFETs. It is not an electronic current-limit eFuse; the replaceable 10 A input fuse provides sustained overcurrent protection."
  - "The selected 60 V MOSFETs rely on the protected-side SMBJ24A clamp (38.9 V max at 15.5 A). Do not omit or move that clamp without repeating the absolute-maximum analysis."
  - "The OV divider senses VIN_FUSED through VSNS/SW. Its 24.345 V worst-low rising trip is above the commission's absolute 24.0 V connector maximum, while its 26.390 V worst-high trip remains below SMBJ24A's 26.7 V minimum breakdown. The protected AP63203 input and all downstream converters connect only to VIN_PROTECTED, after Q2 and the TVS."
verified: "TI SNOSD98A Figure 5-1 and Table 5-1 p.3 for pins 1-13; RTN floating instruction repeated in section 9 p.26; DRR0012E package/land pattern in package addendum; checked 2026-07-31."
sourcing:
  lcsc: C3215601
  alternates: []
  note: "JLC catalog class was Expand on 2026-07-31; order-day allocation and MSL handling remain mandatory."
layout:
  source: "TI SNOSD98A section 11 Layout Guidelines and Figure 11-1 PCB Layout Example, p.29."
  notes:
    - "Wire common-drain back-to-back FETs exactly: A and Q1 source to VIN_FUSED; C, VS, Q1 drain and Q2 drain to FET_MID; OUT and Q2 source to VIN_PROTECTED; DGATE/HGATE to the corresponding gates. Keep both gate traces short and the current path broad and straight."
    - "Put 100 nF/100 V VS-to-GND at pins 10/7 and 220 nF/25 V CAP-to-VS at pins 11/10, with the charge-pump capacitor away from MOSFET heat."
    - "Connect VSNS to VIN_FUSED, SW to the 90.9 kOhm OV-divider top, 4.64 kOhm 0.1% OV-to-GND, and use a separate 90.9 kOhm/11.5 kOhm VIN_FUSED-to-EN/UVLO divider."
    - "Place input/transient suppression close to the power-entry path and keep its high-current return out of the controller's quiet GND sense."
