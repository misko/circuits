gotchas:
  - "Use the exact L variant. The O variant is a circuit breaker and is not the adopted response."
  - "dVdt/BGATE drives the external common-source AON6354 fully on in steady state and low whenever the eFuse turns off; this is the specified disabled reverse-block path."
  - "The eFuse without the external blocking FET does not guarantee output-to-input isolation."
  - "RETRY_DLY is grounded for latch-off; ILIM and OVLO must never float."
  - "The RGE package has separate IN pad 25 and GND pad 26; a one-EP generic RGE footprint is electrically wrong."
