service: "standard SMT (top side) plus JLCPCB post-through-hole assembly for J1, J2, and J7"
sides: [top]
fiducials: "3 local top-side global fiducials"
build_quantity: 5

through_hole:
  process: >
    JLCPCB through-hole / wave-selective post-assembly, selected for this
    order for J1, J2, and J7.
  refs: [J1, J2, J7]
  evidence: >
    Exact JLC catalog records checked 2026-07-31 classify C3819953 / Phoenix
    1935161, C86462 / TE 292304-1, and C19191796 / Samtec
    FTSH-105-01-L-D-K as Plugin parts and set allowPostFlag=true. Their live
    stocks were respectively 1,127, 13,342, and 1,371. The order uploader must
    retain all three refs in the post-through-hole population and its visual
    preview must be accepted before payment.

not_assembled:
  - refs: [F1]
    reason: process_incompatible
    on_bom: false
    twin_body:
      source: part
      dossier: "3568"
    evidence: >
      F1 is one electrical reference with four plated pads for the complete
      insulated Keystone 3568 MINI blade-fuse holder. JLC code C5249699 was
      visually rechecked and is a single loose clip, not the complete holder;
      it is therefore a near-match with no authority over this footprint or
      twin. The generated F1 footprint is excluded from position files and
      its assembly BOM row is suppressed.
    disposition: >
      Procure and hand-solder one exact complete Keystone 3568 holder per
      board after PCBA, then install one exact Littelfuse 0297010.H red 10 A,
      32 V MINI blade fuse. Do not substitute loose clips, a 20 A fuse, a wire
      link, or another fuse family without a reviewed footprint/protection
      change. F1 remains one electrical reference for the complete holder;
      the replaceable fuse element is a manually installed consumable.
  - refs: [J3, J4, J5, J6]
    reason: not_in_catalog
    on_bom: false
    twin_body:
      source: part
      dossier: "USB1130-15-A"
    evidence: >
      Exact GCT USB1130-15-A search in LCSC/JLC catalog on 2026-07-31 found
      no code; common catalog USB-A receptacles were not accepted because their
      >=3 A continuous contact rating was not evidenced.
    disposition: >
      Procure four exact USB1130-15-A receptacles per board and install after
      PCBA, or obtain written JLC consignment acceptance and move these refs to
      consigned before release. No substitution is authorized.

consigned:
  - refs: [Q1, Q2, Q3, Q4, Q5, Q6]
    lcsc: null
    msl: >
      Level-1-260C-UNLIM (TI SLPS399 packaging-information row for exact
      CSD18533Q5AT, read 2026-08-02).
    evidence: >
      CSD18533Q5AT has no credited exact JLC catalog line. The 2026-08-01
      dual-source recheck found 124 exact parts at Mouser and 950 at DigiKey,
      satisfying Q-2SOURCE independently of the assembler.
    disposition: >
      Buy six exact CSD18533Q5AT per board plus process/yield spares from
      Mouser or DigiKey, retain the manufacturer reel/traceability and ship
      them dry/ESD protected with the PCBA order. JLC places Q1-Q6 using the
      exact TI DQJ/Q5A land and local body witness; no Infineon BSC016 or
      generic PowerPAK substitution is authorized.
  - refs: [U4]
    lcsc: C5248536
    msl: >
      MSL 1 (unlimited floor life under J-STD-020 conditions). The exact
      AP63203QWU-7 distributor classification was checked 2026-07-31.
    evidence: >
      JLC catalog stock measured 0 on 2026-07-31 for C5248536. The exact MPN
      was active and immediately orderable at two independent authorized
      pools: Mouser stock 4,344 and DigiKey stock 2,685.
    disposition: >
      Buy AP63203QWU-7 from Mouser or DigiKey, ship it dry/ESD protected with
      the PCBA order, and have JLC place U4. U4 remains on the BOM and CPL;
      no electrical or pin-compatible substitution is authorized.

sourcing_plan:
  - lcsc: C5248536
    measured_stock: 0
    measured_on: 2026-07-31
    order_status: PLANNED
    plan: >
      CONSIGNED — JLC catalog stock is irrelevant to procurement because we
      supply exact AP63203QWU-7 for U4 from Mouser or DigiKey and JLC only
      places it. See consigned: U4 above for stock and MSL handling evidence.

exempt_prefixes: [H, TP, FID, MH]
