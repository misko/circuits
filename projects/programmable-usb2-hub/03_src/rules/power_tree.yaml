schema: 1
source_type: external 12-24 V SELV DC supply
off_control: "remove or switch the external feed (BRIEF A2); no battery is present"
quiescent_ua: 0
input_trunk_class: PWR_IN
ir_floor_mohm: 70

rails:
  - &usb_port
    name: USB_PORT_1
    vin_min: 12.0
    vin_max: 24.0
    vout_min: 5.075
    vout_max: 5.225
    iout_max_A: 2.0
    converter: TPSM63606RDLR
    eff: 0.90
    external_output: true
    claim_id: usb_downstream_ports
    load_uv_threshold: 4.75
    ir_budget_mohm: 130.0
    margin: 0.10
    ir_budget_components_mohm: &port_path
      protection_switch:
        value: 45.0
        basis: maximum
        evidence: "TPS259470A maximum RON over -40 to 125 C"
      pcb_copper_vias_joints:
        value: 5.0
        basis: budgeted_max
        evidence: "four-layer power pours; confirm by extraction and hot four-wire first-article measurement"
      mated_power_contacts:
        value: 80.0
        basis: qualified_max
        evidence: "USB1130 maximum 40 mOhm for each VBUS and GND mated contact"
    feedback: &usb_feedback
      vref: 1.0
      vref_tol_pct: 1.1
      fb_bias_current_min_nA: -10
      fb_bias_current_max_nA: 10
      r_top_ohm: 4150
      r_top_tol_pct: 0.22
      r_bottom_ohm: 1000
      r_bottom_tol_pct: 0.213

  - <<: *usb_port
    name: USB_PORT_2
    ir_budget_components_mohm: *port_path
    feedback: *usb_feedback
  - <<: *usb_port
    name: USB_PORT_3
    ir_budget_components_mohm: *port_path
    feedback: *usb_feedback
  - <<: *usb_port
    name: USB_PORT_4
    ir_budget_components_mohm: *port_path
    feedback: *usb_feedback

  - name: LOGIC_3V3
    vin_min: 12.0
    vin_max: 24.0
    vout_min: 3.27
    vout_max: 3.33
    iout_max_A: 0.8
    converter: AP63203QWU-7
    eff: 0.85
    external_output: false

# The 5.15 V setpoint calculation includes TPSM63606 +/-1% full-temperature
# feedback accuracy, 0.1% load regulation, divider initial tolerance, bounded
# resistor TCR to a 70 C local body temperature, and +/-10 nA bias sensitivity.
# It computes 5.0756-5.2249 V. The complete 130 mOhm maximum path at 2 A plus
# 10% residual margin drops 0.286 V, leaving 4.7896 V at the mated plug.
