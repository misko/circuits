      - {net: P4_CONN_P, pin: U20.6, segments: [{layer: F.Cu, width: 0.25, pts: [[137.1375, 31.0500], [138.1000, 31.0500]]}]}
      - {net: P4_CONN_N, pin: U20.4, segments: [{layer: F.Cu, width: 0.25, pts: [[137.1375, 32.9500], [138.1000, 32.9500]]}]}
      # Reserve the fine-pitch controller launches that the completed broad
