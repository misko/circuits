      - {net: 5V_B, pin: U2.35, segments: [{layer: F.Cu, width: 0.25, pts: [[107.4000, 87.2500], [108.1000, 87.2500]]}, {layer: B.Cu, width: 0.25, pts: [[108.1000, 87.2500], [109.3000, 87.2500]]}], vias: [[108.1000, 87.2500]]}
      - {net: TSNS_B, pin: U2.36, segments: [{layer: F.Cu, width: 0.18, pts: [[107.4000, 86.7500], [108.1000, 86.7500]]}, {layer: B.Cu, width: 0.18, pts: [[108.1000, 86.7500], [109.3000, 86.7500]]}], vias: [[108.1000, 86.7500]]}
