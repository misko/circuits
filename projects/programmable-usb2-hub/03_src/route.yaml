      - {net: P1_HUB_N, pin: U6.1, segments: [{layer: F.Cu, width: 0.25, pts: [[91.5875, 55.2500], [90.3000, 55.2500]]}]}
      - {net: P1_HUB_P, pin: U6.2, segments: [{layer: F.Cu, width: 0.25, pts: [[91.5875, 55.7500], [90.3000, 55.7500]]}]}
      - {net: P2_HUB_N, pin: U6.3, segments: [{layer: F.Cu, width: 0.25, pts: [[91.5875, 56.2500], [90.3000, 56.2500]]}]}
      - {net: P2_HUB_P, pin: U6.4, segments: [{layer: F.Cu, width: 0.25, pts: [[91.5875, 56.7500], [90.3000, 56.7500]]}]}
