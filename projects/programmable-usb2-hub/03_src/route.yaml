      - {net: P1_CONN_N, pin: U17.4, segments: [{layer: F.Cu, width: 0.25, pts: [[51.1375, 32.9500], [52.1000, 32.9500]]}]}
      - {net: P2_CONN_P, pin: U18.6, segments: [{layer: F.Cu, width: 0.25, pts: [[81.1375, 31.0500], [82.1000, 31.0500]]}]}
