project:
  name: programmable_usb2_hub
  board: 04_kicad/programmable_usb2_hub.kicad_pcb
  build_dir: 06_build/route

flow:
  pre_route_reviews:
    board: 04_kicad/programmable_usb2_hub.kicad_pcb
    netlist: 06_build/netlists/programmable_usb2_hub.net
    topology: 08_reviews/pre-route_topology.md
    pin: 08_reviews/pre-route_pin.md
    layout: 08_reviews/pre-route_layout.md
    render: 08_reviews/pre-route_render.md
    a_render: 06_build/pre_route/twin_overlay.md
  owner:
    stage: routing
    files: [03_src/route.yaml, 03_src/floorplan.yaml]
  copper:
    # Reviewed USB geometry, pour-fed escapes, and the promoted route are
    # replayable source.  Only a deliberate re-route of waves is stochastic.
    deterministic: [prep.seed_stubs]
    stochastic: [route.waves]
  budgets_s:
    escape_packages: 60
    escape_lands: 300
    tier_preflight: 20
    grind: 1200
    rebuild: 1800
    layout_drc: 180
  blockers:
    - USB1130-15-A needs JLC-approved consignment or post-assembly
    - order-day THT/extended-part assembly and stock confirmation remain open

prep:
  out: r0.kicad_pcb
  keepouts:
    layers: [User.2, User.3]
    mounting_holes: {radius: 3.0}
    edge_band: 0.7
    rects:
      # USB-only exclusion over all three switching-power islands.
      - {x0: 25.0, y0: 79.0, x1: 147.0, y1: 106.0, layer: User.3}
      # Reserve the short deterministic GND escapes emitted by seed_stubs on
      # BOTH router keepout layers.  Without these small corridors, later
      # ILIM/DVDT/USB routes occupy the only legal 0.25/0.15 mm via sites and
      # the fill leaves real pad-bearing GND islands.
      - {x0: 46.68, y0: 37.20, x1: 47.65, y1: 37.85} # U13.2
      - {x0: 51.15, y0: 44.92, x1: 51.72, y1: 45.56} # U9.8
      - {x0: 75.50, y0: 38.68, x1: 76.10, y1: 39.32} # C422.2
      - {x0: 76.68, y0: 37.20, x1: 77.65, y1: 37.85} # U14.2
      - {x0: 81.15, y0: 44.92, x1: 81.72, y1: 45.56} # U10.8
      - {x0: 87.40, y0: 56.93, x1: 88.00, y1: 57.57} # C32.2
      - {x0: 92.18, y0: 64.80, x1: 92.82, y1: 65.40} # C34.2
      - {x0: 106.68, y0: 37.20, x1: 107.65, y1: 37.85} # U15.2
      - {x0: 116.50, y0: 38.68, x1: 117.10, y1: 39.32} # C432.2
      - {x0: 133.00, y0: 95.68, x1: 133.60, y1: 96.32} # C201.2
      - {x0: 137.15, y0: 44.92, x1: 137.72, y1: 45.56} # U12.8
      - {x0: 133.40, y0: 101.98, x1: 134.00, y1: 102.62} # C207.2
      - {x0: 124.50, y0: 80.88, x1: 125.10, y1: 81.52} # C211.2
  # Short switch-to-ESD pairs are deterministic F.Cu copper.  They remain on
  # the outer layer with no through-vias, and the P conductor skirts the ESD
  # ground land instead of crossing it.
  seed_stubs:
    clearance: 0.149
    via: {size: 0.30, drill: 0.20}
    stubs:
      - {net: P1_PORT_P, pin: U13.7, segments: [{layer: F.Cu, width: 0.25, pts: [[52.1, 38.5], [52.1, 38.55], [53.4, 38.55], [53.4, 35.619], [49.7, 33.619], [47.5, 33.619], [47.5, 29.8], [48.8625, 29.8], [48.8625, 31.05]]}]}
      - {net: P1_PORT_N, pin: U13.6, segments: [{layer: F.Cu, width: 0.25, pts: [[52.1, 39.0], [52.1, 38.95], [53.8, 38.95], [53.8, 35.381], [50.1, 33.381], [50.1, 32.95], [48.8625, 32.95]]}]}
      - {net: P2_PORT_P, pin: U14.7, segments: [{layer: F.Cu, width: 0.25, pts: [[82.1, 38.5], [82.1, 38.55], [83.4, 38.55], [83.4, 35.619], [79.7, 33.619], [77.5, 33.619], [77.5, 29.8], [78.8625, 29.8], [78.8625, 31.05]]}]}
      - {net: P2_PORT_N, pin: U14.6, segments: [{layer: F.Cu, width: 0.25, pts: [[82.1, 39.0], [82.1, 38.95], [83.8, 38.95], [83.8, 35.381], [80.1, 33.381], [80.1, 32.95], [78.8625, 32.95]]}]}
      - {net: P3_PORT_P, pin: U15.7, segments: [{layer: F.Cu, width: 0.25, pts: [[112.1, 38.5], [112.1, 38.55], [113.4, 38.55], [113.4, 35.619], [109.7, 33.619], [107.5, 33.619], [107.5, 29.8], [108.8625, 29.8], [108.8625, 31.05]]}]}
      - {net: P3_PORT_N, pin: U15.6, segments: [{layer: F.Cu, width: 0.25, pts: [[112.1, 39.0], [112.1, 38.95], [113.8, 38.95], [113.8, 35.381], [110.1, 33.381], [110.1, 32.95], [108.8625, 32.95]]}]}
      - {net: P4_PORT_P, pin: U16.7, segments: [{layer: F.Cu, width: 0.25, pts: [[138.1, 38.5], [138.1, 38.55], [139.4, 38.55], [139.4, 35.619], [135.7, 33.619], [133.5, 33.619], [133.5, 29.8], [134.8625, 29.8], [134.8625, 31.05]]}]}
      - {net: P4_PORT_N, pin: U16.6, segments: [{layer: F.Cu, width: 0.25, pts: [[138.1, 39.0], [138.1, 38.95], [139.8, 38.95], [139.8, 35.381], [136.1, 33.381], [136.1, 32.95], [134.8625, 32.95]]}]}
  waves:
    exclude: ["GND", "unconnected-*"]
    groups:
      preseeded_usb:
        - P1_PORT_P
        - P1_PORT_N
        - P2_PORT_P
        - P2_PORT_N
        - P3_PORT_P
        - P3_PORT_N
        - P4_PORT_P
        - P4_PORT_N
      # Solve every hub/MCU-side pair together on the same reference layer.
      usb_internal:
        - P1_HUB_P
        - P1_HUB_N
        - P2_HUB_P
        - P2_HUB_N
        - P3_HUB_P
        - P3_HUB_N
        - P4_HUB_P
        - P4_HUB_N
        - MGMT_P
        - MGMT_N
      usb_upstream:
        - UP_HUB_P
        - UP_HUB_N
      usb_external:
        - UP_CONN_P
        - UP_CONN_N
        - P1_CONN_P
        - P1_CONN_N
        - P2_CONN_P
        - P2_CONN_N
        - P3_CONN_P
        - P3_CONN_N
        - P4_CONN_P
        - P4_CONN_N
      usb_recover:
        - UP_CONN_P
        - UP_CONN_N
        - UP_HUB_P
        - UP_HUB_N
        - P1_CONN_P
        - P1_CONN_N
        - P2_CONN_P
        - P2_CONN_N
        - P3_CONN_P
        - P3_CONN_N
        - P4_CONN_P
        - P4_CONN_N
      switch: [SW_3V3]
      port_power: [P1_VBUS, P2_VBUS, P3_VBUS, P4_VBUS]
      rail_power: [5V_A, 5V_B]
      vin_protected_pre: [VIN_PROTECTED]
      input_control_pre: [CAP, HGATE]
      input_power: [VIN_RAW, VIN_FUSED, FET_MID]
      input_recover: [VIN_RAW, VIN_FUSED, FET_MID, VIN_PROTECTED]
      final_recover: [CAP, FB_B, HGATE, XTAL1]
      analog:
        - P1_ILIM
        - P2_ILIM
        - P3_ILIM
        - P4_ILIM
        - P1_VBUS_SENSE
        - P2_VBUS_SENSE
        - P3_VBUS_SENSE
        - P4_VBUS_SENSE
        - ADC_P1_IMON
        - ADC_P2_IMON
        - ADC_P3_IMON
        - ADC_P4_IMON
        - ADC_P1_VBUS
        - ADC_P2_VBUS
        - ADC_P3_VBUS
        - ADC_P4_VBUS
        - RBIAS
        - XTAL1
        - XTAL2
      logic_power: [3V3_LOGIC]
      signal: rest

route:
  krt: ~/gits/KiCadRoutingTools
  kicad_python: /usr/bin/python3
  preflight_critical_pairs:
    - {name: P1_PORT, p: P1_PORT_P, n: P1_PORT_N, source: seed_stubs, group: preseeded_usb, allowed_layers: [F.Cu], no_vias: true}
    - {name: P2_PORT, p: P2_PORT_P, n: P2_PORT_N, source: seed_stubs, group: preseeded_usb, allowed_layers: [F.Cu], no_vias: true}
    - {name: P3_PORT, p: P3_PORT_P, n: P3_PORT_N, source: seed_stubs, group: preseeded_usb, allowed_layers: [F.Cu], no_vias: true}
    - {name: P4_PORT, p: P4_PORT_P, n: P4_PORT_N, source: seed_stubs, group: preseeded_usb, allowed_layers: [F.Cu], no_vias: true}
    - {name: MGMT, p: MGMT_P, n: MGMT_N, wave: usb_internal, allowed_layers: [F.Cu], no_vias: true}
    - {name: P1_HUB, p: P1_HUB_P, n: P1_HUB_N, wave: usb_internal, allowed_layers: [F.Cu], no_vias: true}
    - {name: P2_HUB, p: P2_HUB_P, n: P2_HUB_N, wave: usb_internal, allowed_layers: [F.Cu], no_vias: true}
    - {name: P3_HUB, p: P3_HUB_P, n: P3_HUB_N, wave: usb_internal, allowed_layers: [F.Cu], no_vias: true}
    - {name: P4_HUB, p: P4_HUB_P, n: P4_HUB_N, wave: usb_internal, allowed_layers: [F.Cu], no_vias: true}
    - {name: UP_HUB, p: UP_HUB_P, n: UP_HUB_N, wave: usb_upstream, allowed_layers: [F.Cu], no_vias: true}
    - {name: UP_CONN, p: UP_CONN_P, n: UP_CONN_N, wave: usb_external, allowed_layers: [F.Cu], no_vias: true}
    - {name: P1_CONN, p: P1_CONN_P, n: P1_CONN_N, wave: usb_external, allowed_layers: [F.Cu], no_vias: true}
    - {name: P2_CONN, p: P2_CONN_P, n: P2_CONN_N, wave: usb_external, allowed_layers: [F.Cu], no_vias: true}
    - {name: P3_CONN, p: P3_CONN_P, n: P3_CONN_N, wave: usb_external, allowed_layers: [F.Cu], no_vias: true}
    - {name: P4_CONN, p: P4_CONN_P, n: P4_CONN_N, wave: usb_external, allowed_layers: [F.Cu], no_vias: true}
  common:
    layers: [F.Cu, In2.Cu, B.Cu]
    via_size: 0.45
    via_drill: 0.20
    fab_tier: advanced
    clearance: 0.15
    no_stub_layer_swap: true
    keepout: true
    keepout_layer: User.2
  waves:
    - name: usb_internal
      engine: diff
      group: usb_internal
      track_width: 0.25
      clearance: 0.15
      diff_pair_gap: 0.15
      layers: [F.Cu]
      keepout_layer: User.3
      length_match_group:
        - [P1_HUB_P, P1_HUB_N]
        - [P1_PORT_P, P1_PORT_N]
        - [P2_HUB_P, P2_HUB_N]
        - [P2_PORT_P, P2_PORT_N]
        - [P3_HUB_P, P3_HUB_N]
        - [P3_PORT_P, P3_PORT_N]
        - [P4_HUB_P, P4_HUB_N]
        - [P4_PORT_P, P4_PORT_N]
        - [MGMT_P, MGMT_N]
      length_match_tolerance: 0.5
      meander_amplitude: 0.3
      max_iterations: 1200000
      max_probe_iterations: 80000
      max_ripup: 50
    - name: usb_upstream
      engine: diff
      group: usb_upstream
      track_width: 0.25
      clearance: 0.15
      diff_pair_gap: 0.15
      layers: [F.Cu]
      keepout_layer: User.3
      length_match_group: [[UP_HUB_P, UP_HUB_N]]
      length_match_tolerance: 0.5
      meander_amplitude: 0.3
      max_iterations: 1200000
      max_probe_iterations: 80000
      max_ripup: 10
    - name: usb_external
      engine: diff
      group: usb_external
      track_width: 0.25
      clearance: 0.15
      diff_pair_gap: 0.15
      layers: [F.Cu]
      keepout_layer: User.3
      length_match_group:
        - [UP_CONN_P, UP_CONN_N]
        - [P1_CONN_P, P1_CONN_N]
        - [P2_CONN_P, P2_CONN_N]
        - [P3_CONN_P, P3_CONN_N]
        - [P4_CONN_P, P4_CONN_N]
      length_match_tolerance: 0.5
      meander_amplitude: 0.3
      max_iterations: 1200000
      max_probe_iterations: 80000
      max_ripup: 50
    # Single-ended recovery is F.Cu-only: it may complete a failed launch but
    # may not conceal an unreferenced layer transition.
    - {name: usb_recover, group: usb_recover, track_width: 0.25,
       clearance: 0.15, layers: [F.Cu], max_iterations: 900000,
       max_probe_iterations: 80000, max_ripup: 40}
    - {name: switch, group: switch, track_width: 0.25,
       via_size: 0.80, via_drill: 0.40,
       power_nets: [SW_3V3],
       power_nets_widths: [1.0],
       neckdown_length: 0.5, neckdown_taper_length: 0.5,
       no_power_tap_neckdown: true,
       layers: [F.Cu], max_iterations: 500000}
    - {name: port_power, group: port_power, track_width: 0.25,
       via_size: 0.70, via_drill: 0.35,
       power_nets: [P1_VBUS, P2_VBUS, P3_VBUS, P4_VBUS],
       power_nets_widths: [1.5, 1.5, 1.5, 1.5],
       neckdown_length: 0.5, neckdown_taper_length: 0.5,
       no_power_tap_neckdown: true, max_iterations: 600000}
    - {name: rail_power, group: rail_power, track_width: 0.25,
       via_size: 0.80, via_drill: 0.40,
       power_nets: [5V_A, 5V_B], power_nets_widths: [2.5, 2.5],
       neckdown_length: 0.5, neckdown_taper_length: 0.5,
       no_power_tap_neckdown: true, max_iterations: 700000}
    - {name: vin_protected_pre, group: vin_protected_pre, track_width: 0.25,
       via_size: 0.80, via_drill: 0.40,
       power_nets: [VIN_PROTECTED], power_nets_widths: [3.0],
       neckdown_length: 0.5, neckdown_taper_length: 0.5,
       no_power_tap_neckdown: true,
       max_iterations: 900000, max_probe_iterations: 80000, max_ripup: 10}
    - {name: input_control_pre, group: input_control_pre, track_width: 0.18,
       max_iterations: 700000, max_probe_iterations: 80000, max_ripup: 5}
    - {name: input_power, group: input_power, track_width: 0.25,
       via_size: 0.80, via_drill: 0.40,
       power_nets: [VIN_RAW, VIN_FUSED, FET_MID],
       power_nets_widths: [3.0, 3.0, 3.0],
       neckdown_length: 0.5, neckdown_taper_length: 0.5,
       no_power_tap_neckdown: true, max_iterations: 500000}
    - {name: analog, group: analog, track_width: 0.18,
       max_iterations: 700000, max_ripup: 35}
    - name: signal
      group: signal
      track_width: 0.18
      max_iterations: 1200000
      max_probe_iterations: 80000
      max_ripup: 20
      rip_existing_nets:
        - HUB_*
        - P?_DATA_ISO
        - P?_FLT_N
        - P?_PWR_CMD
        - P?_PWR_EN
        - VDD18*
        - ADC_*
        - CAP
        - UV_SENSE
        - OV_TOP
        - FB_B
        - SWDIO
    - name: input_recover
      group: input_recover
      track_width: 0.25
      via_size: 0.80
      via_drill: 0.40
      power_nets: [VIN_RAW, VIN_FUSED, FET_MID, VIN_PROTECTED]
      power_nets_widths: [3.0, 3.0, 3.0, 3.0]
      neckdown_length: 0.5
      neckdown_taper_length: 0.5
      no_power_tap_neckdown: true
      max_iterations: 900000
      max_probe_iterations: 80000
      max_ripup: 25
    - name: final_recover
      group: final_recover
      track_width: 0.18
      max_iterations: 1200000
      max_probe_iterations: 80000
      max_ripup: 40
      rip_existing_nets:
        - RT_B
        - CAP
        - HGATE
        - XTAL1
    - name: logic_power
      group: logic_power
      track_width: 0.18
      power_nets: [3V3_LOGIC]
      power_nets_widths: [0.50]
      neckdown_length: 0.5
      neckdown_taper_length: 0.3
      no_power_tap_neckdown: true
      max_iterations: 1200000
      max_probe_iterations: 80000
      max_ripup: 5
      rip_existing_nets: [ADC_*]
stitch:
  clearance: 0.15
  # A 0.20 mm finished drill respects the 8:1 aspect-ratio floor on the
  # nominal 1.6 mm JLC stackup.  Stitch and rescue vias share one geometry.
  via:
    size: 0.30
    drill: 0.20
    spacing: 0.50
    pth_margin: 0.25
    tiers:
      - {size: 0.30, drill: 0.20, hole_to_copper: 0.255}
  keepin: {inset: 0.8}
  # This source now owns a fresh autorouter candidate, so run the complete
  # rescue/refill chain.  Obsolete promoted-route seed escapes are omitted.
  passes: [dedupe_vias, normalize_vias, drop_micro_fragments, drop_dangling,
           split_t_junctions, reload, hole_to_hole, pad_rescue, stub_fallback,
           astar_fallback, stitch_grid, fill, island_rescue, fill,
           unify_zone_priorities, heal_islands, prune_stitch_dangling, gate]
  unify_zone_priorities: {min_bbox: 0.8}
  dedupe_vias: {radius: 0.4, metric: box}
  normalize_vias: {below_width: 0.24, size: 0.30, drill: 0.20}
  drop_micro_fragments: {max_length: 0.12, require_free_end: true}
  drop_dangling: {max_length: 1.0, tol: 0.05, sweeps: 4}
  split_t_junctions: {tol: 0.05}
  hole_to_hole: {min_gap: 0.25, mode: nudge, prefer_keep: [GND]}
  pad_rescue:
    net: GND
    via_in_pad: true
    served_within: 1.4
    rings: [0.7, 0.9, 1.2, 1.6, 2.1]
    stub_width: 0.25
    # The named area may overlap reviewed 0.18 mm default-class escapes; it
    # is an exception floor, not a reason to strengthen those tracks to the
    # 0.25 mm geometry used by the automatically emitted rescue stubs.
    stub_scope: {min_track_width: 0.18}
    require: none
  stub_fallback: {net: GND, min_dist: 0.2, max_dist: 7.0, width: 0.25}
  astar_fallback:
    net: GND
    # GND is in the board's 0.18 mm default class.  Using the unrelated
    # 0.25 mm power floor stranded three thermal islands in the dense hub
    # fanout even though a fabrication-legal default-width escape exists.
    width: 0.18
    # Ground pads and every target barrel are already on the solid F.Cu
    # plane.  Constrain the graph to that layer: a through-via transition is
    # unnecessary here and doubles the state space on this dense board.
    layers: [F.Cu]
    via: {size: 0.30, drill: 0.20, hole_to_copper: 0.255}
    # Dense ground pads often cannot reach the single nearest barrel because
    # a signal escape lies between them.  Search several independent plane
    # barrels before declaring the pad stranded.
    window: 4.0
    attempts: 3
    targets: 12
    max_dist: 12.0
  stitch_grid:
    net: GND
    x: [24, 146, 8]
    y: [24, 106, 8]
    avoid:
      - {x0: 78.0, y0: 80.0, x1: 147.0, y1: 106.0, margin: 0.8}
  island_rescue: {min_bbox: 0.8, layers: [F.Cu, In1.Cu, B.Cu], require: all}
  # KiCad reports even the 0.29 mm-tall ground fragments around eFuse pin 8
  # as real zone-to-zone opens.  Include them in the authoritative heal;
  # the denser sampling found legal POFV sites where the former fixed seeds
  # violated hole-to-copper clearance.
  heal_islands: {min_bbox: 0.1, layers: [F.Cu, In1.Cu, B.Cu],
                 sample_step: 0.05, max_gap_candidates: 2000,
                 clear_rescue_failures: true}
  prune_stitch_dangling: {tol: 0.05, min_layers: 2}
