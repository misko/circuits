project:
  name: programmable_usb2_hub
  board: 04_kicad/programmable_usb2_hub.kicad_pcb
  build_dir: 06_build/route

flow:
  pre_route_reviews:
    board: 04_kicad/programmable_usb2_hub.kicad_pcb
    netlist: 06_build/netlists/programmable_usb2_hub.net
    topology: 08_reviews/pre-route_topology.md
    pin: 08_reviews/pre-route_pin.md
    layout: 08_reviews/pre-route_layout.md
    render: 08_reviews/pre-route_render.md
    a_render: 06_build/pre_route/twin_overlay.md
  owner:
    stage: routing
    files: [03_src/route.yaml, 03_src/floorplan.yaml]
  copper:
    # Reviewed USB geometry, pour-fed escapes, and the promoted route are
    # replayable source.  Only a deliberate re-route of waves is stochastic.
    deterministic: [prep.seed_stubs]
    stochastic: [route.waves]
  budgets_s:
    escape_packages: 60
    escape_lands: 300
    tier_preflight: 20
    grind: 1200
    rebuild: 1800
    layout_drc: 180
  blockers:
    - USB1130-15-A needs JLC-approved consignment or post-assembly
    - order-day THT/extended-part assembly and stock confirmation remain open

prep:
  out: r0.kicad_pcb
  # Reserve every collision-legal plane drop on the track-free board.  The
  # post-route pad_rescue remains a safety net, but routing must not consume
  # the only via/stub sites of small GND pads before their plane bond exists.
  pad_rescue: true
  keepouts:
    layers: [User.2, User.3]
    mounting_holes: {radius: 3.0}
    edge_band: 0.7
    rects:
      # USB-only exclusion over all three switching-power islands.
      - {x0: 25.0, y0: 79.0, x1: 147.0, y1: 106.0, layer: User.3}
      # Reserve the short deterministic GND escapes emitted by seed_stubs on
      # BOTH router keepout layers.  Without these small corridors, later
      # ILIM/DVDT/USB routes occupy the only legal 0.25/0.15 mm via sites and
      # the fill leaves real pad-bearing GND islands.
      - {x0: 46.68, y0: 37.20, x1: 47.65, y1: 37.85} # U13.2
      - {x0: 46.98, y0: 44.78, x1: 47.58, y1: 45.42} # C426.2
      - {x0: 51.15, y0: 44.92, x1: 51.72, y1: 45.56} # U9.8
      - {x0: 75.50, y0: 38.68, x1: 76.10, y1: 39.32} # C422.2
      - {x0: 76.68, y0: 37.20, x1: 77.65, y1: 37.85} # U14.2
      - {x0: 81.15, y0: 44.92, x1: 81.72, y1: 45.56} # U10.8
      - {x0: 87.40, y0: 56.93, x1: 88.00, y1: 57.57} # C32.2
      - {x0: 92.18, y0: 65.30, x1: 92.82, y1: 65.95} # C34.2
      - {x0: 100.30, y0: 57.95, x1: 101.85, y1: 58.55} # U6.42
      - {x0: 106.68, y0: 37.20, x1: 107.65, y1: 37.85} # U15.2
      - {x0: 111.15, y0: 44.92, x1: 111.72, y1: 45.56} # U11.8
      - {x0: 116.50, y0: 38.68, x1: 117.10, y1: 39.32} # C432.2
      - {x0: 133.00, y0: 95.68, x1: 133.60, y1: 96.32} # C201.2
      - {x0: 137.15, y0: 44.92, x1: 137.72, y1: 45.56} # U12.8
      - {x0: 133.40, y0: 101.98, x1: 134.00, y1: 102.62} # C207.2
      - {x0: 124.50, y0: 80.88, x1: 125.10, y1: 81.52} # C211.2
  # Short switch-to-ESD pairs are deterministic F.Cu copper.  They remain on
  # the outer layer with no through-vias, and the P conductor skirts the ESD
  # ground land instead of crossing it.
  seed_stubs:
    clearance: 0.149
    via: {size: 0.30, drill: 0.20}
    stubs:
      - {net: P1_PORT_P, pin: U13.7, segments: [{layer: F.Cu, width: 0.25, pts: [[52.1, 38.5], [52.1, 38.55], [53.4, 38.55], [53.4, 35.619], [49.7, 33.619], [47.5, 33.619], [47.5, 29.8], [48.8625, 29.8], [48.8625, 31.05]]}]}
      - {net: P1_PORT_N, pin: U13.6, segments: [{layer: F.Cu, width: 0.25, pts: [[52.1, 39.0], [52.1, 38.95], [53.8, 38.95], [53.8, 35.381], [50.1, 33.381], [50.1, 32.95], [48.8625, 32.95]]}]}
      - {net: P2_PORT_P, pin: U14.7, segments: [{layer: F.Cu, width: 0.25, pts: [[82.1, 38.5], [82.1, 38.55], [83.4, 38.55], [83.4, 35.619], [79.7, 33.619], [77.5, 33.619], [77.5, 29.8], [78.8625, 29.8], [78.8625, 31.05]]}]}
      - {net: P2_PORT_N, pin: U14.6, segments: [{layer: F.Cu, width: 0.25, pts: [[82.1, 39.0], [82.1, 38.95], [83.8, 38.95], [83.8, 35.381], [80.1, 33.381], [80.1, 32.95], [78.8625, 32.95]]}]}
      - {net: P3_PORT_P, pin: U15.7, segments: [{layer: F.Cu, width: 0.25, pts: [[112.1, 38.5], [112.1, 38.55], [113.4, 38.55], [113.4, 35.619], [109.7, 33.619], [107.5, 33.619], [107.5, 29.8], [108.8625, 29.8], [108.8625, 31.05]]}]}
      - {net: P3_PORT_N, pin: U15.6, segments: [{layer: F.Cu, width: 0.25, pts: [[112.1, 39.0], [112.1, 38.95], [113.8, 38.95], [113.8, 35.381], [110.1, 33.381], [110.1, 32.95], [108.8625, 32.95]]}]}
      - {net: P4_PORT_P, pin: U16.7, segments: [{layer: F.Cu, width: 0.25, pts: [[138.1, 38.5], [138.1, 38.55], [139.4, 38.55], [139.4, 35.619], [135.7, 33.619], [133.5, 33.619], [133.5, 29.8], [134.8625, 29.8], [134.8625, 31.05]]}]}
