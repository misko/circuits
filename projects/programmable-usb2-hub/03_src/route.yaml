      - {net: ITH_A, pin: U2.12, segments: [{layer: F.Cu, width: 0.18, pts: [[100.6000, 90.2500], [99.9000, 90.2500]]}, {layer: B.Cu, width: 0.18, pts: [[99.9000, 90.2500], [98.7000, 90.2500]]}], vias: [[99.9000, 90.2500]]}
      - {net: LTC_FAULT_N, pin: U2.17, segments: [{layer: F.Cu, width: 0.18, pts: [[102.2500, 91.9000], [102.2500, 92.6000]]}]}
