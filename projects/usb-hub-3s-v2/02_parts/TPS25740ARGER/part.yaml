strap_config_5v_5a:      # fixed 5V-only + 5A (SLVSDG8B Tables 1-5; EVM jumper H3)
  EN9V:  "tie HIGH to DVDD -> suppresses 9V/15V PDOs, 5V is the ONLY PDO (EN9V LOW would ENABLE 9V — the trap)"
  HIPWR: "100k +-1% Rsel to GND (the 'GND-via-Rsel' state) -> 5V-only voltage group AND 5A current group; matches EVM H3"
  PSEL:  "100k +-1% Rsel to GND -> Pmax 65W (>>25W needed for 5V/5A, so 5A always advertised)"
  PCTRL: "tie to VAUX (always-high) -> power never halved"
  GD:    "tie to VAUX -> gate driver permanently enabled"
  CTL1_CTL2: "no-connect (only toggle for higher PDOs; 5V-only never leaves both-HiZ)"
  VDD:   "tie to GND (device powered from VPWR)"

external_power_path:
  topology: "back-to-back dual N-FET (RECEPTACLE + VBUS bulk >10uF requires reverse-blocking pair; SLVSDG8B Fig 19). Common source = GDNS = PDSRC; common gate = GDNG via 10R."
  sense: "Rs 5mR 2512 between VPWR(5VC) and ISNS(RSNS) node; Kelvin layout (Fig 67)"
  discharge: "R(DSCG) ~120R from VBUS to DSCG pin"

layout_refs:
  - "SLVSDG8B Sec 6 Pin Configuration/Functions p.4-5 (pinout)"
  - "SLVSDG8B Fig 19 (back-to-back dual-FET receptacle config) + Fig 36 (basic schematic w/ BOM: Rs 5mR, R_DSCG 120R, C_PDIN 6.8uF, D_VBUS B340A)"
  - "SLVSDG8B Fig 63/66 (power-hub on external buck rail — this project's topology)"
  - "SLVSDG8B Sec 11 Layout Fig 67 (Kelvin ISNS) / Fig 68 (placement)"
  - "SLVUAP7A EVM Fig 2/3 + Table 3 strap jumper truth (H3 = 5V-only/5A)"

gotchas:
  - "NRND lifecycle (all TPS2574x RGE marked NRND, Jan-2026 addendum). ~2974 stock 2026-07-22; order-day recheck MANDATORY. TI migration path TPS65987D is architecturally different (integrated PD3.x/DC-DC, needs config tool) — NOT a pin-swap; budget redesign if a respin is needed."
  - "STRAP TRAP (voltage): EN9V is active-LOW for enable-9V. 5V-only REQUIRES EN9V tied HIGH (DVDD). A naive 'ground the unused pin' silently advertises 9V the 5V buck cannot supply."
  - "STRAP TRAP (current+voltage share pins): HIPWR/PSEL are 4-STATE ADC pins. 'direct-to-GND' != 'via-100k-Rsel-to-GND' — both are 5A current group but only the via-Rsel state gives single-5V. Verify vs Tables 1-5, not intuition."
  - "GATE DRIVER: GDNG/GDNS use an internal CHARGE PUMP (drives gate above VBUS/source) — a genuine high-side driver. GD (pin15) master-enable has an internal ~6M pulldown: float => driver disables. Tie GD HIGH (VAUX)."
  - "RECEPTACLE => BACK-TO-BACK dual FETs (Fig 19) for reverse-blocking + >10uF VBUS bulk. A single FET is only for captive-cable/plug designs (Fig 20)."
  - "OVP/UVP WINDOW IS TIGHT at 5V: fast-OVP 5.8-6.3V (typ 6.05), slow-UVP 3.5-3.9V. The external buck's transient overshoot/droop must stay inside ~[3.9, 5.8]V or the chip faults (hard-reset + VBUS discharge + 765ms retry). Verify buck transient response."
  - "VQFN-24 0.5mm 4-sided + 2.7mm sq EP => jlc_4layer_advanced (via-in-pad for EP thermal/GND vias). EP must be soldered (mech note 3)."
  - "ESD: CC1/CC2 have built-in +-8kV protection (no external TVS). VBUS/ISNS/DSCG do NOT — add the Fig 37 network if system-level ESD exposure."

# Datasheet LAYOUT-section compliance (P-LAYOUT / P-ADJ). The THIRD dimension
# after verified: (pinout) and escape: (package) — read the Layout section, not
# just the pin table. This block would have FAILED v2's floorplan at placement.
layout:
  source: "TI SLVSDG8B Sec.11 Layout + EVM SLVUAP7A PCB-layout section: mount the
    external pass FET + VBUS current-sense R + VBUS bulk caps HARD against the
    power-stage pin edge (19-24); Kelvin-sense ISNS/VPWR back to the chip; short
    DSCG trace on the VBUS copper. (Web-confirmed 2026-07-22.)"
  reviewed: "2026-07-22 — supersedes the earlier pinout-only datasheet read"
  power_stage_edge: "pins 19-24 (ISNS/VPWR/VBUS/GDNG/GDNS/DSCG): the whole
    external power stage mounts against THIS edge, each link a 1-2mm short shot"
  keep_short:                       # P-ADJ measures these net pad-spans on the board
    - {net: RSNS,  max_span_mm: 5, why: "Kelvin sense R (RS3) adjacent to ISNS/VPWR"}
    - {net: PDSRC, max_span_mm: 5, why: "pass-FET source common node at GDNS pin"}
    - {net: GDNG,  max_span_mm: 5, why: "gate drive to the pass FET"}
  notes: "Do NOT place the FET row across an escape channel. v2 D-BACK: FET row
    7mm north -> four QFN escapes could not coexist (~8 rebuilds). Reference
    design hugs the edge -> every link short, nothing crosses."
