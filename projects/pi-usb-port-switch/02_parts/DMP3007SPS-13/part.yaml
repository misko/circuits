gotchas:
  - "For reverse-polarity service, drain goes to fused raw +5V and source goes to protected +5V. The body diode initially conducts only in the allowed source-to-load direction and blocks a reversed input."
  - "The 16mOhm maximum is specified at VGS=-4.5V and 25C. The VBUS budget uses 25mOhm as a conservative hot design allocation and requires a hot four-wire first-article measurement; 25mOhm is an engineering allocation, not a relabeled datasheet maximum."
  - "Gate uses 100kOhm to GND and 1MOhm to source. At the admitted 5.25V maximum this keeps |VGS| far below 25V, so no gate clamp is needed."
  - "PowerDI5060-8 is not an SO-8 footprint. Pin 1 is gate, pins 2-4 are source, and pins 5-8 plus the exposed drain land are drain; the footprint/pad audit must preserve that physical map."
