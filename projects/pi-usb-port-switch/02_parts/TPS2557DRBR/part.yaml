gotchas:
  - "TPS2557 EN is active HIGH. Each channel has a physical pulldown and PWR_EN drives it directly, so an unpowered/disconnected Pi defaults VBUS off without an inverter. TPS2556 is the active-low sibling and must not be substituted silently."
  - "Use 100kOhm 1% at ILIM. Including resistor tolerance conservatively shifts the characterized range to about 0.926-1.273A: above the 0.9A load claim and below the USB-A connector's 1.5A rating."
  - "At 0.9A, guaranteed 35mOhm consumes 31.5mV, recovering 90mV of VBUS margin versus the rejected TPS2552. Use all IN/OUT pins and the full PowerPAD land."
  - "FAULT is active-low open-drain and goes to a labeled test point/pullup only; it does not create an undocumented automatic retry or firmware dependency."
verified: "TI SLVS931B DRB top-view figure and pin table, printed p.3, confirm pins 1 GND, 2-3 IN, 4 active-high EN, 5 ILIM, 6-7 OUT, 8 FAULT and PowerPAD GND; electrical table and current-limit row re-read 2026-08-14."
