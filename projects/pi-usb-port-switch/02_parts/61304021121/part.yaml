gotchas:
  - "This is a cable-connected sidecar, not a HAT. It mates a standard 40-way female-to-female Raspberry Pi GPIO extension cable and does not impose Pi 4 versus Pi 5 mechanical stacking geometry."
  - "Pins 1/17 (3.3V) and 2/4 (5V) are NC. The board never powers from or backfeeds the Pi header. Ground pins 6,9,14,20,25,30,34,39 join board ground."
  - "The unshrouded connector can be reversed. Mark pin 1 conspicuously on top and bottom silkscreen and require a pin-1-striped cable."
  - "Control mapping: pin11 GPIO17=PWR1, pin13 GPIO27=DATA1, pin15 GPIO22=PWR2, pin16 GPIO23=DATA2, pin18 GPIO24=PWR3, pin22 GPIO25=DATA3, pin29 GPIO5=PWR4, pin31 GPIO6=DATA4. All other GPIO are NC."
verified: "Wurth exact sheet 61304021121 p.1 DIMENSIONS and RECOMMENDED HOLE PATTERN drawings confirm 2x20 vertical THT, 2.54mm pitch and row spacing, 6mm mating length, 3mm tails, 3A and -40C to 105C; Raspberry Pi physical pin mapping is from the official 40-pin header map, reviewed 2026-08-14."
