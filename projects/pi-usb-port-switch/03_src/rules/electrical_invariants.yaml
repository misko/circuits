# pi-usb-port-switch — executable electrical intent.
# Generated as an explicit review denominator from ADRs 0001/0002/0003/0006.
# It binds function, values and pin direction independently of ERC/parity.
supplies:
  3V3: 3.3
  P5V_PROTECTED: 5.2

invariants:
  - assert: series_chain
    chain: [EXT_5V_RAW, F1, EXT_5V_FUSED, Q1, P5V_PROTECTED]
    through: {Q1: [D1, S1]}
    adr: "0006"
    why: "The removable fuse holder and P-channel reverse-polarity FET must be in the only shared 5.2 V delivery path."
  - assert: pin_on_net
    pin: "Q1.5"
    net: EXT_5V_FUSED
    adr: "0006"
    why: "Q1 drain-side lands face the fused input; reversing the MOSFET defeats the intended reverse-polarity behavior."
  - assert: pin_on_net
    pin: "Q1.2"
    net: P5V_PROTECTED
    adr: "0006"
    why: "Q1 source-side lands feed the protected distribution rail."
  - assert: pin_on_net
    pin: "U1.3"
    net: P5V_PROTECTED
    adr: "0006"
    why: "The local 3.3 V regulator input is powered only after fuse and reverse-polarity protection."
  - assert: pin_on_net
    pin: "U1.2"
    net: 3V3
    adr: "0006"
    why: "The TLV76133 output is the board-local 3.3 V rail and never a Raspberry Pi power pin."
  - assert: part_value
    part: R65
    equals: 100000
    tolerance_pct: 5
    adr: "0006"
    why: "Q1 gate-to-ground bias must turn the reverse-protection FET on only with the external input architecture."
  - assert: part_value
    part: R70
    equals: 1000000
    tolerance_pct: 5
    adr: "0006"
    why: "The gate-to-source bleed bounds the undriven Q1 gate rather than leaving it floating."
  - assert: net_has_part
    net: P5V_PROTECTED
    part_type: capacitor
    min: 2
    adr: "0006"
    why: "The shared protected rail requires both bulk and local high-frequency bypassing before four switched branches."

  # Channel 1: GPIO defaults, hard DATA_OK interlock, USB2 disconnect and VBUS.
  - assert: series_chain
    chain: [GPIO17_RAW, R41, PWR_EN1]
    adr: "0001"
    why: "Channel 1 power command must pass through its dedicated 1 kohm GPIO series resistor."
  - assert: series_chain
    chain: [GPIO27_RAW, R42, DATA_EN1]
    adr: "0001"
    why: "Channel 1 data command must pass through its dedicated 1 kohm GPIO series resistor."
  - assert: part_value
    part: R41
    equals: 1000
    tolerance_pct: 5
    adr: "0001"
    why: "Channel 1 GPIO source resistor value is part of the hardware-only control contract."
  - assert: part_value
    part: R42
    equals: 1000
    tolerance_pct: 5
    adr: "0001"
    why: "Channel 1 GPIO source resistor value is part of the hardware-only control contract."
  - assert: part_value
    part: R49
    equals: 100000
    tolerance_pct: 5
    adr: "0001"
    why: "Channel 1 power-enable fail-safe pull-down value is part of the hardware-only control contract."
  - assert: part_value
    part: R50
    equals: 100000
    tolerance_pct: 5
    adr: "0001"
    why: "Channel 1 data-enable fail-safe pull-down value is part of the hardware-only control contract."
  - assert: pin_on_net
    pin: "U7.1"
    net: PWR_EN1
    adr: "0001"
    why: "Channel 1 AND input A is the power command."
  - assert: pin_on_net
    pin: "U7.2"
    net: DATA_EN1
    adr: "0001"
    why: "Channel 1 AND input B is the data command."
  - assert: pin_on_net
    pin: "U7.4"
    net: DATA_OK1
    adr: "0001"
    why: "Channel 1 DATA_OK can assert only when both hardware inputs assert."
  - assert: pin_on_net
    pin: "U2.5"
    net: DATA_OK1
    adr: "0002"
    why: "Channel 1 SuperSpeed redriver enable is driven by the hard interlock, not firmware alone."
  - assert: pin_on_net
    pin: "Q2.1"
    net: DATA_OK1
    adr: "0002"
    why: "Channel 1 USB2 enable pull-down MOSFET gate follows the same hard interlock."
  - assert: pin_on_net
    pin: "Q2.2"
    net: GND
    adr: "0002"
    why: "Channel 1 USB2 control MOSFET source must return to ground."
  - assert: pin_on_net
    pin: "Q2.3"
    net: USB2_OE1
    adr: "0002"
    why: "Channel 1 MOSFET pulls active-high USB2 disconnect low only when DATA_OK is true."
  - assert: pin_on_net
    pin: "R57.1"
    net: 3V3
    adr: "0002"
    why: "Channel 1 USB2 OE has a local high/disconnected default."
  - assert: pin_on_net
    pin: "R57.2"
    net: USB2_OE1
    adr: "0002"
    why: "Channel 1 USB2 OE pull-up is on the actual switch-control node."
  - assert: part_value
    part: R57
    equals: 100000
    tolerance_pct: 5
    adr: "0002"
    why: "Channel 1 USB2 OE pull-up must establish a deterministic high-impedance reset state."
  - assert: pin_on_net
    pin: "R61.1"
    net: USB2_SEL1
    adr: "0002"
    why: "Channel 1 TS3USB221 select is strapped to the populated 1D throw."
  - assert: pin_on_net
    pin: "R61.2"
    net: GND
    adr: "0002"
    why: "Channel 1 TS3USB221 select strap is a physical pull-down."
  - assert: part_value
    part: R61
    equals: 100000
    tolerance_pct: 5
    adr: "0002"
    why: "Channel 1 USB2 select pull-down value is deterministic without Raspberry Pi software."
  - assert: pin_on_net
    pin: "U4.2"
    net: P5V_PROTECTED
    adr: "0006"
    why: "Channel 1 power switch first IN pin is on the protected trunk."
  - assert: pin_on_net
    pin: "U4.3"
    net: P5V_PROTECTED
    adr: "0006"
    why: "Channel 1 power switch second IN pin is also used for current and thermal capacity."
  - assert: pin_on_net
    pin: "U4.4"
    net: PWR_EN1
    adr: "0006"
    why: "Channel 1 TPS2557 active-high enable is the fail-low power command."
  - assert: pin_on_net
    pin: "U4.6"
    net: VBUS1_SW
    adr: "0006"
    why: "Channel 1 first TPS2557 output land feeds only its downstream VBUS."
  - assert: pin_on_net
    pin: "U4.7"
    net: VBUS1_SW
    adr: "0006"
    why: "Channel 1 second TPS2557 output land is also used."
  - assert: pin_on_net
    pin: "J4.1"
    net: VBUS1_SW
    adr: "0003"
    why: "Channel 1 downstream receptacle receives protected VBUS without any charging-port advertisement."
  - assert: part_value
    part: R66
    equals: 100000
    tolerance_pct: 2
    adr: "0006"
    why: "Channel 1 100 kohm ILIM programs the characterized approximately 0.926-1.273 A limit around the 0.9 A load claim."
  - assert: part_value
    part: R71
    equals: 10000
    tolerance_pct: 5
    adr: "0006"
    why: "Channel 1 open-drain fault indication has its intended local 3.3 V pull-up."
  - assert: net_has_part
    net: VBUS1_SW
    part_type: capacitor
    min: 2
    adr: "0006"
    why: "Channel 1 VBUS requires both local high-frequency and 150 uF bulk output capacitance."

