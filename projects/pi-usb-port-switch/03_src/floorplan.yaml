# Pi-controlled four-port USB 3 bench disconnect board.
# Four isolated left-to-right channels keep every SuperSpeed pair in a
# straight, crossover-free corridor. Upstream Type-B cable entries are on the
# west edge; downstream Type-A receptacles are on the east edge. Control,
# power switching and bulk capacitance sit outside the high-speed corridors.
project:
  name: pi_usb_port_switch
  netlist: 06_build/netlists/pi_usb_port_switch.net
  output: 04_kicad/pi_usb_port_switch.kicad_pcb
  parts_dir: 02_parts
  fp_lib_table: 04_kicad/fp-lib-table

board:
  outline: {x0: 20.0, y0: 20.0, x1: 170.0, y1: 140.0}
  edge_width: 0.1
  layers: 4
  stackup:
    nominal_thickness_mm: 1.6
    thickness_tolerance_mm: 0.10
    copper_finish: ENIG
    dielectric_constraints: true
    mask_thickness_mm: 0.0254
    copper_thickness_mm: [0.035, 0.0152, 0.0152, 0.035]
    dielectrics:
      - {type: prepreg, thickness_mm: 0.2104, material: "7628", epsilon_r: 4.4, loss_tangent: 0.02}
      - {type: core, thickness_mm: 1.0650, material: "FR4", epsilon_r: 4.4, loss_tangent: 0.02}
      - {type: prepreg, thickness_mm: 0.2104, material: "7628", epsilon_r: 4.4, loss_tangent: 0.02}
  mounting_holes:
    footprint: MountingHole:MountingHole_3.2mm_M3
    refdes_prefix: H
    at: [[25.0, 25.0], [165.0, 25.0], [75.0, 135.0], [100.0, 136.0]]
  fiducials:
    footprint: Fiducial:Fiducial_1mm_Mask2mm
    refdes_prefix: FID
    at: [[28.0, 56.5], [160.0, 54.5], [88.0, 136.0]]

# DRC-derived plane drops for the only 19 pad-bearing F.Cu GND islands that
# remain after route and fill.  Each 0.35/0.25 mm via is wholly inside its
# named land and is explicitly filled and copper-capped (JLC advanced POFV /
# IPC-4761 Type VII) so solder cannot wick into the barrel.  The 0.25 mm drill
# is reserved for this protected family; ordinary routing/stitch vias use the
# disjoint 0.20 mm or 0.30 mm families so the Gerber order can select the
# process without relying on KiCad-only item flags.
thermal_vias:
  protection: {capping: yes, filling: yes}
  fields:
    - {refs: [C1, C2], pad: 2, size: 0.35, drill: 0.25, at: [[2.70, 0.00]]}
    - {refs: [C3, C17, C18, C34, C50, C66], pad: 2, size: 0.35, drill: 0.25, at: [[0.48, 0.00]]}
    - {refs: [R49, R63, R66, R67, R68, R69], pad: 2, size: 0.35, drill: 0.25, at: [[0.51, 0.00]]}
    - {refs: [U3, U9, U15, U21], pad: 5, size: 0.35, drill: 0.25, at: [[0.00, 0.86]]}
    - {refs: [U2, U8, U14, U20], pad: 25, size: 0.35, drill: 0.25, at: [[0.00, -0.50], [0.00, 0.50]]}
    - {ref: U1, pad: 2, size: 0.35, drill: 0.25, at: [[3.15, -0.60], [3.15, 0.60]]}

libraries:
  - {lib: pi_usb_port_switch, path: 03_src/lib/pi_usb_port_switch.pretty}
  # KiCad 10 renamed the canonical DCK/SC70-5 land to
  # SOT-353_SC-70-5. Expose the exact vendored legacy-name copy under a unique
  # nickname so it cannot shadow KiCad's complete Package_TO_SOT_SMD library.
  - {lib: pi_usb_port_switch_compat, path: 03_src/lib/Package_TO_SOT_SMD.pretty}
  - {lib: Package_SON, path: 03_src/lib/Package_SON.pretty}
  - /usr/share/kicad/footprints

placement:
  require_anchor: true
  patterns:
    # The eight Wurth USB receptacles have no JLC/LCSC catalog line and are
    # installed after PCBA.  F1 is one electrical footprint for two separate
    # Keystone clips, so one centroid cannot express its physical population.
    # assembly.yaml is the population authority; these native KiCad attributes
    # keep the same refs out of every generated CPL.
    - {match: [F1, J4, J6, J8, J10], attrs: [exclude_from_pos_files]}
    # Filled-board DRC proves that these package-local ground pads cannot form
    # a legal four-spoke relief in the routed escape geometry.  Use solid
    # connection only for the named pads; all other GND pads retain the
    # source-controlled 0.20/0.20 mm thermal relief below.
    - match: [C1, C2, C3, C4, C14, C17, C18, C30, C34, C46, C47, C50, C51, C62, C63, C66, C67]
      pad_overrides:
        - {pads: [2], zone_connection: full}
    - match: [R36, R39, R40, R49, R50, R52, R62, R63, R64, R66, R67, R68, R69, R76, R77, R78, R79, R80]
      pad_overrides:
        - {pads: [2], zone_connection: full}
    - match: [J4, J6, J8, J10]
      pad_overrides:
        - {pads: [7], zone_connection: full}
    - match: J2
      pad_overrides:
        - {pads: [9, 25], zone_connection: full}
    - match: U7
      pad_overrides:
        - {pads: [3], zone_connection: full}
    - match: [U2, U8, U14, U20]
      pad_overrides:
        - {pads: [25], zone_connection: full}
    - match: [U3, U9, U15, U21]
      pad_overrides:
        - {pads: [5], zone_connection: full}
    - match: [U4, U10, U16, U22]
      pad_overrides:
        - {pads: [1, 9], zone_connection: full}
    - match: [J3, J4, J5, J6, J7, J8, J9, J10]
      pad_overrides:
        - {pads: [10], zone_connection: full}
    - match: "Q1"
      pad_overrides:
        - {pads: [5, 6, 7, 8], zone_connection: full}
    - match: "R65"
      pad_overrides:
        - {pads: [2], zone_connection: full}
  anchors:
    C1: [46.50, 37.50, 0]
    C2: [88.00, 27.00, 0]
    C3: [95.00, 33.00, 0]
    C4: [98.00, 33.00, 0]
    C5: [101.00, 33.00, 0]
    C6: [76.00, 43.40, 0]
    C7: [76.00, 42.20, 0]
    C8: [115.00, 43.40, 0]
    C9: [115.00, 42.20, 0]
    # RX coupling parts use pad 2 on one side and pad 1 on the other.  Rotate
    # them so the pad on each named source-side net faces that source; these
    # are nonpolar ceramics and the electrical mapping is unchanged.
    C10: [76.00, 45.80, 180]
    C11: [76.00, 44.60, 180]
    C12: [115.00, 45.80, 180]
    C13: [115.00, 44.60, 180]
    C14: [91.25, 45.96, 0]
    C15: [99.15, 42.04, 0]
    C16: [99.15, 47.00, 0]
    C17: [110.00, 53.50, 0]
    C18: [136.00, 55.00, 0]
    C19: [119.00, 52.50, 0]
    # Switched-output HF bypass: keep pad 1 immediately beside the TPS2557
