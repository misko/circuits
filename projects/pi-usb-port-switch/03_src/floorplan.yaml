    R68: [139.00, 105.55, 0]
    R69: [139.00, 133.55, 0]
    # Reverse-polarity gate pull-up belongs on the protected side of Q1.  The
    # former location below Q1 trapped its P5V pad behind the fused-input pad
    # bank and created a real, disconnected protected-rail island.
    R70: [73.00, 27.00, 180]
    R71: [130.00, 54.00, 0]
    R72: [130.00, 82.00, 0]
    R73: [130.00, 110.00, 0]
    R74: [130.00, 138.00, 0]
    # Shared TUSB522 strap pulls are ordered to match their six B.Cu buses.
    # This makes the one-to-four fan-out planar and deterministic instead of
    # asking the general router to solve a six-net permutation repeatedly.
    R79: [122.00, 33.00, 0]  # OS1
    R77: [124.00, 33.00, 0]  # DE1
