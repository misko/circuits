  legalize: {enable: true, clearance: 0.58, edge_margin: 0.30, hole_keepout: 2.6, ring_max: 48}

design_rules:
  track_min_width: 0.127
  min_clearance: 0.127
  # Advanced-tier deterministic USB transitions use 0.30/0.20 mm vias.
  # Ordinary router/stitch vias remain larger; these are the DRC capability
  # floors, not the default routing geometry.
  via_min_annulus: 0.05
  hole_clearance: 0.20
  hole_to_hole: 0.25
  copper_edge_clearance: 0.30
  via_min_size: 0.30
  min_through_drill: 0.20
  solder_mask_min_width: 0.0
  solder_mask_expansion: 0.0

zones:
  # Deterministic high-current copper exists at placement time so the launch
  # gate grades the actual architecture: package-limited lands enter a pour
  # immediately; the 2.5 mm input-trunk rule remains the routed backstop.
  - {net: EXT_5V_RAW, layers: [F.Cu], priority: 4, rect: [31.0, 26.4, 49.2, 32.9], connect: full}
  - {net: EXT_5V_RAW, layers: [F.Cu], priority: 5, rect: [41.5, 32.8, 51.5, 41.3], connect: full}
  - {net: EXT_5V_FUSED, layers: [F.Cu], priority: 4, rect: [56.5, 26.5, 70.8, 32.8], connect: full}
  - {net: P5V_PROTECTED, layers: [F.Cu], priority: 3, rect: [65.5, 24.2, 96.2, 34.2], connect: full}
  # Top-side protected rail drops through an eight-via current bank into this
  # B.Cu header, which overlaps the vertical per-port distributor below.
  - {net: P5V_PROTECTED, layers: [B.Cu], priority: 4, rect: [89.8, 24.2, 139.5, 34.2], connect: full}
  # U1's large 3V3 output tab uses two filled/capped vias.  Give their B.Cu
  # ends a local heat-spreading collector so they are electrically useful on
  # both layers instead of becoming decorative/dangling via-in-pad barrels.
  # Priority 6 deliberately clears the overlapping protected-5-V header.
  - {net: 3V3, layers: [B.Cu], priority: 6, rect: [99.8, 24.6, 102.5, 29.4], connect: full}
  # Bottom-layer protected-5-V spine; each short top-layer port island is
  # via-bonded into this spine during the deterministic power-tap stage.
  - {net: P5V_PROTECTED, layers: [B.Cu], priority: 3, rect: [128.0, 26.0, 139.5, 139.5], connect: full}
  - {net: P5V_PROTECTED, layers: [F.Cu], priority: 3, rect: [134.2, 48.8, 137.8, 56.5], connect: full}
  - {net: P5V_PROTECTED, layers: [F.Cu], priority: 3, rect: [134.2, 76.8, 137.8, 84.5], connect: full}
  - {net: P5V_PROTECTED, layers: [F.Cu], priority: 3, rect: [134.2, 104.8, 137.8, 112.5], connect: full}
  - {net: P5V_PROTECTED, layers: [F.Cu], priority: 3, rect: [134.2, 132.8, 137.8, 139.7], connect: full}
  # Each switched output uses two joined F.Cu islands: a short package
  # collector and a bulk-cap/via collector.  Priority 4 keeps VBUS distinct
  # from the adjacent priority-3 protected-input island at the TPS2557.
  - {net: VBUS1_SW, layers: [F.Cu], priority: 4, rect: [134.4, 48.0, 143.3, 51.0], connect: full}
  - {net: VBUS1_SW, layers: [F.Cu], priority: 5, rect: [139.2, 50.8, 143.6, 53.8], connect: full}
  - {net: VBUS2_SW, layers: [F.Cu], priority: 4, rect: [134.4, 76.0, 143.3, 79.0], connect: full}
  - {net: VBUS2_SW, layers: [F.Cu], priority: 5, rect: [139.2, 78.8, 143.6, 81.8], connect: full}
  - {net: VBUS3_SW, layers: [F.Cu], priority: 4, rect: [134.4, 104.0, 143.3, 107.0], connect: full}
  - {net: VBUS3_SW, layers: [F.Cu], priority: 5, rect: [139.2, 106.8, 143.6, 109.8], connect: full}
  - {net: VBUS4_SW, layers: [F.Cu], priority: 4, rect: [134.4, 132.0, 143.3, 135.0], connect: full}
  - {net: VBUS4_SW, layers: [F.Cu], priority: 5, rect: [139.2, 134.8, 143.6, 137.8], connect: full}
  - {net: GND, layers: [In1.Cu, In2.Cu], priority: 0, min_thickness: 0.20, clearance: 0.20, connect: full}
  - {net: GND, layers: [F.Cu, B.Cu], priority: 0, min_thickness: 0.20, clearance: 0.20, thermal_gap: 0.20, thermal_spoke_width: 0.20, connect: thermal}

keepouts:
  # These permissive rule areas deny nothing.  They bind the 3V3 width-floor
  # exceptions in rules/nets.yaml to the package-local necks only.  Separate
  # channel boxes keep KiCad's overlap-based insideArea() semantics from
  # accidentally relaxing the vertical 0.40 mm trunk between channels.
  - {name: u2_3v3_pin1_neck, layers: [F.Cu], deny: [], rect: [96.10, 41.82, 96.82, 42.25]}
  - {name: u8_3v3_pin1_neck, layers: [F.Cu], deny: [], rect: [96.10, 69.82, 96.82, 70.25]}
  - {name: u14_3v3_pin1_neck, layers: [F.Cu], deny: [], rect: [96.10, 97.82, 96.82, 98.25]}
  - {name: u20_3v3_pin1_neck, layers: [F.Cu], deny: [], rect: [96.10, 125.82, 96.82, 126.25]}
  - {name: u2_3v3_pin13_neck, layers: [F.Cu], deny: [], rect: [93.50, 45.78, 93.95, 46.18]}
  - {name: u8_3v3_pin13_neck, layers: [F.Cu], deny: [], rect: [93.50, 73.78, 93.95, 74.18]}
  - {name: u14_3v3_pin13_neck, layers: [F.Cu], deny: [], rect: [93.50, 101.78, 93.95, 102.18]}
  - {name: u20_3v3_pin13_neck, layers: [F.Cu], deny: [], rect: [93.50, 129.78, 93.95, 130.18]}
  - {name: u3_3v3_pin10_neck, layers: [F.Cu], deny: [], rect: [107.82, 50.68, 108.18, 51.22]}
  - {name: u9_3v3_pin10_neck, layers: [F.Cu], deny: [], rect: [107.82, 78.68, 108.18, 79.22]}
  - {name: u15_3v3_pin10_neck, layers: [F.Cu], deny: [], rect: [107.82, 106.68, 108.18, 107.22]}
  - {name: u21_3v3_pin10_neck, layers: [F.Cu], deny: [], rect: [107.82, 134.68, 108.18, 135.22]}
  # Two short TS3USB221 supply escapes have no 0.40 mm path between the
  # adjacent USB pair and control trace.  These boxes cover only the exact
  # escape segments; the 3V3 rail outside them retains its 0.40 mm floor.
