gotchas:
  - "TPS259827O is the circuit-breaker, no-OVLO variant; it must not be represented as active overvoltage cutoff."
  - "Tie LDSTRT to GND when handshake is unused. RETRY_DLY to GND selects latch-off; cycling upstream U1 with SW1 resets the fault."
  - "R26=210ohm programs a nominal 7.062A threshold. TI Equation 4 includes a +0.11A offset; applying that offset before scaling the adverse full-temperature 300ohm row, then charging +/-0.1% initial tolerance and +/-25ppm/C over 100C, gives 6.160253-8.066419A. This retains 0.160A above 6A normal service and 0.481A below the 8.547A downstream worst-high fault. The 0.066A possible excursion above U1's 8A continuous rating is timer-bounded to 45.962ms, below U1's 10A peak rating, and requires hot first-article qualification."
  - "C29=47nF +/-5% C0G, the +/-30ppm/C class bound over 100C, Delta-VITIMER=0.7-1.3V and IITIMER=1.4-2.8uA give a full-limit 11.129-45.962ms blanking interval: the declared <=10ms coincident peak passes before a persistent aggregate overload disconnects."
  - "C30=3.3nF +/-5% C0G with the same 100C temperature bound closes TI Equation 6 at the shortest charged corner: its capacitor term alone keeps tGHI above 4.253ms, permitting 80.260nF maximum ITIMER capacitance versus C29's 49.498nF maximum."
