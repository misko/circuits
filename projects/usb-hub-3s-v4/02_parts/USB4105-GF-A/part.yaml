gotchas:
  - "A6/B6, A7/B7 and A8/B8 receive explicit no-connect flags: v4 has neither USB data nor alternate-mode signaling."
  - "CC1 and CC2 route separately through the connector-side ESD clamp to TPS25810; do not short them or replace attach control with static Rp resistors."
  - "The 40mOhm connector figure is a maximum initial contact-resistance requirement; the Pi cable/mated-pair budget remains a first-article qualification item."
  - "The four duplicated outer GND lands retain GCT's 0.60 x 1.15 mm envelope but use a 50% chamfer only on the locator-peg-facing corner: the drawing's datum leaves only 0.1944 mm to the original rounded corner, below JLC's 0.20 mm NPTH-to-copper floor and the project's 0.25 mm floor; the relief removes no copper under the terminal and is exact-DRC graded without moving or narrowing the contact land."
