# Commission-stage route contract. It names the bounded execution machinery
# and exact-artifact witnesses without pretending that a route exists.
project:
  name: usb_hub_3s_v4
  board: 04_kicad/usb_hub_3s_v4.kicad_pcb
  build_dir: 06_build/route

flow:
  heartbeat_s: 10
  pre_route_reviews:
    board: 04_kicad/usb_hub_3s_v4.kicad_pcb
    netlist: 06_build/netlists/usb_hub_3s_v4.net
    topology: 08_reviews/pre-route_topology.md
    pin: 08_reviews/pre-route_pin.md
    layout: 08_reviews/pre-route_layout.md
    render: 08_reviews/pre-route_render.md
    a_render: 06_build/pre_route/twin_overlay.md
  owner:
    stage: routing
    files: [03_src/route.yaml, 03_src/floorplan.yaml]
  copper:
    deterministic: [prep.seed_stubs, taps.connections, stitch.seed_stubs, route.final]
    stochastic: [route.waves]
  budgets_s:
    tscircuit_build: 60
    escape_packages: 30
    escape_lands: 120
    tier_preflight: 15
    grind: 900
    rebuild: 1200
    layout_drc: 120
  timeouts_s:
    default: 600
    tscircuit_build: 180
    route_wave: 900
    route_race: 2400
    route_evaluate: 180
    route_import: 300
    stitch: 900
    rebuild: 1500
    layout_drc: 180
  blockers:
    - "Final routed pin/layout/render and manufacturing reviews incomplete"

prep:
  out: r0.kicad_pcb
  keepouts:
    layers: [User.2, User.3]
    mounting_holes: {radius: 3.0}
    edge_band: 0.7
    rects: []
  # The 0.30 mm-wide USB-C CC lands are boxed in by the adjacent 0.50 mm-pitch
  # connector row. KRT reaches the controller and ESD lands but cannot leave
  # J5.A5/J5.B5 (both candidates stopped with all eight start cells blocked).
  # These reviewed, collision-checked F.Cu launches own the short connections
  # from the connector lands to the ESD device; KRT sees the completed pad
  # pairs before every routing wave and owns the remaining U3-to-D6 routes.
  seed_stubs:
    clearance: 0.18
    via: {size: 0.50, drill: 0.20}
    stubs:
      - {net: CC1, pin: J5.A5,
         segments: [{layer: F.Cu, width: 0.18,
                     pts: [[113.75, 102.32], [113.75, 101.30],
                           [114.90, 99.925]]}]}
      - {net: CC2, pin: J5.B5,
         segments: [{layer: F.Cu, width: 0.18,
                     pts: [[116.75, 102.32], [116.75, 101.30],
                           [115.60, 99.925]]}]}
      # U5/U6 output lands sit behind their control-pin escape fields. Two
      # parallel filled/capped via-in-pad drops per 2 A port establish the
      # B.Cu plane path before KRT can consume that corridor. The 0.50/0.20
      # geometry is the adopted advanced via tier and each 0.8 mm join is
      # collision-checked by the generic seed emitter.
      - {net: VBUSA2, pin: U5.6,
         segments: [{layer: B.Cu, width: 0.80,
                     pts: [[111.45, 56.325], [112.50, 56.325]]}],
         vias: [[111.45, 56.325]]}
      - {net: VBUSA2, pin: U5.7,
         segments: [{layer: B.Cu, width: 0.80,
                     pts: [[111.45, 55.675], [112.50, 55.675]]}],
         vias: [[111.45, 55.675]]}
      - {net: VBUSA3, pin: U6.6,
         segments: [{layer: B.Cu, width: 0.80,
                     pts: [[111.45, 80.325], [112.50, 80.325]]}],
         vias: [[111.45, 80.325]]}
      - {net: VBUSA3, pin: U6.7,
         segments: [{layer: B.Cu, width: 0.80,
                     pts: [[111.45, 79.675], [112.50, 79.675]]}],
         vias: [[111.45, 79.675]]}
  waves:
    # Pours/planes own every high-current rail. KRT routes only the named
    # local signal nets; deterministic taps below bond the isolated 5VA islands.
    exclude: [GND, BAT_POS, VBAT_FUSED, VIN, 5VA, 5VC_RAW,
              VBUSA1, VBUSA2, VBUSA3, VBUSC, "unconnected-*"]
    groups:
      typec: [CC1, CC2, REF_C, REF_RTN_C]
      module: [BOOT_A_R, BOOT_A_C, BOOT_C_R, BOOT_C_C,
               FB_A, FB_C, RT_A, RT_C, SPSP_A]
      charge: [DM_A1, DP_A1, DM_A2, DP_A2, DM_A3, DP_A3]
      control: rest

route:
  import_source: promoted
  final: 03_src/route/r4.kicad_pcb
  krt: ~/gits/KiCadRoutingTools
  preflight_critical_pairs: []
  no_critical_routes: "D1 excludes USB data and RF; no timing-, impedance-, or phase-critical signal route is commissioned"
  race: 2
  common:
    layers: [F.Cu, B.Cu]
    fab_tier: advanced
    via_size: 0.60
    via_drill: 0.30
    clearance: 0.18
    grid_step: 0.05
    no_stub_layer_swap: true
    keepout: true
    keepout_layer: User.2
  waves:
    - {name: typec, group: typec, track_width: 0.18,
       max_iterations: 250000, max_probe_iterations: 30000, max_ripup: 10}
    - {name: module, group: module, track_width: 0.30,
       max_iterations: 300000, max_probe_iterations: 30000, max_ripup: 10}
    - {name: charge, group: charge, track_width: 0.18,
       max_iterations: 300000, max_probe_iterations: 30000, max_ripup: 15}
    - {name: control, group: control, track_width: 0.18,
       max_iterations: 500000, max_probe_iterations: 60000, max_ripup: 30}

taps:
  clearance: 0.18
  via: {size: 0.60, drill: 0.30, hole_to_copper: 0.255}
  connections:
    # Source-side drops make each dual-layer regulator/output pour a real
    # path rather than two same-net islands that only appear connected.
    - {net: VIN, from: Q1.1, to: [60.00, 39.00], width: 1.00,
       layer: F.Cu, hop_layer: B.Cu, plane: true}
    - {net: 5VA, from: U1.9, to: [75.00, 57.70], width: 1.00,
       layer: F.Cu, hop_layer: B.Cu, plane: true}
    - {net: 5VC_RAW, from: U2.8, to: [91.50, 93.00], width: 1.00,
       layer: F.Cu, hop_layer: B.Cu, plane: true}
    - {net: VBUSC, from: C13.1, to: [108.00, 97.00], width: 1.00,
       layer: F.Cu, hop_layer: B.Cu, plane: true}
    # The modules' auxiliary output lands are intentionally narrow, local
    # branches; the named DRU areas own their measured tapers into the full
    # output pours.  Leaving them to the pour cannot work because their pad
    # centres sit just outside the main zone outline.
    - {net: 5VA, from: U1.5, to: [73.75, 57.85], width: 1.00,
       layer: F.Cu}
    - {net: 5VC_RAW, from: U2.5, to: [89.75, 93.25], width: 0.30,
       layer: F.Cu}
    # Three TPS2557 input islands and two TPS2513 supply islands bond to the
    # B.Cu 5VA distributor at one explicit, collision-checked via each.
    # These lands already sit directly over the continuous B.Cu 5VA
    # distributor. A single filled/capped, collision-checked pad drop is the
    # complete bond; adding a second via plus a short neck only spent copper
    # and holes inside the same pour. The 0.80 mm width is used only if the
    # via ladder must leave a pad; all five exact pad sites currently pass.
    - {net: 5VA, from: U4.4, width: 0.80, layer: F.Cu,
       plane: true, drop: true}
    - {net: 5VA, from: U5.4, width: 0.80, layer: F.Cu,
       plane: true, drop: true}
    - {net: 5VA, from: U6.4, width: 0.80, layer: F.Cu,
       plane: true, drop: true}
    - {net: 5VA, from: U7.5, width: 0.80, layer: F.Cu,
       plane: true, drop: true}
    - {net: 5VA, from: U8.5, width: 0.80, layer: F.Cu,
       plane: true, drop: true}
    # These low-current supply/test lands lie over their B.Cu distributors
    # but are SMD-only.  A filled/capped via at the exact clear pad site makes
    # the electrical bond explicit; relying on copper underneath an SMD pad
    # produced nine real ratsnest opens after the authoritative refill.
    - {net: 5VA, from: R7.1, width: 0.50, layer: F.Cu,
       plane: true, drop: true}
    - {net: 5VA, from: TP2.1, width: 0.50, layer: F.Cu,
       plane: true, drop: true}
    - {net: 5VA, from: C14.1, width: 0.50, layer: F.Cu,
       plane: true, drop: true}
    - {net: 5VA, from: R17.1, width: 0.50, layer: F.Cu,
       plane: true, drop: true}
    - {net: 5VA, from: C15.1, width: 0.50, layer: F.Cu,
       plane: true, drop: true}
    - {net: 5VA, from: R19.1, width: 0.50, layer: F.Cu,
       plane: true, drop: true}
    - {net: 5VA, from: C16.1, width: 0.50, layer: F.Cu,
       plane: true, drop: true}
    - {net: 5VA, from: R21.1, width: 0.50, layer: F.Cu,
       plane: true, drop: true}
    - {net: 5VC_RAW, from: R11.1, width: 0.30, layer: F.Cu,
       plane: true, drop: true}

stitch:
  clearance: 0.18
  via:
    size: 0.60
    drill: 0.30
    spacing: 0.85
    pth_margin: 0.30
    tiers: [{size: 0.60, drill: 0.30, hole_to_copper: 0.255}]
  keepin: {inset: 0.8}
  passes: [dedupe_vias, normalize_vias, drop_micro_fragments, drop_dangling,
           split_t_junctions, reload, hole_to_hole, pad_rescue,
           stub_fallback, astar_fallback, fill, island_rescue, dedupe_vias,
           hole_to_hole, fill, fresh_reload, heal_islands,
           prune_stitch_dangling, gate]
  dedupe_vias: {radius: 0.35, metric: box}
  # Only repair geometry below the advanced-tier via floor. KRT and all
  # project-owned emitters already place the preferred 0.60/0.30 mm vias.
  normalize_vias: {below_width: 0.24, size: 0.25, drill: 0.15}
  drop_micro_fragments: {max_length: 0.12, require_free_end: true}
  drop_dangling: {max_length: 1.0, tol: 0.05, sweeps: 4}
  split_t_junctions: {tol: 0.05}
  hole_to_hole: {min_gap: 0.25, mode: nudge, prefer_keep: [GND]}
  pad_rescue:
    nets:
      - {net: GND, layer: In1.Cu}
    via_in_pad: true
    served_within: 1.6
    rings: [0.75, 0.95, 1.20, 1.60, 2.10]
    stub_width: 0.30
    require: none
  stub_fallback: {net: GND, min_dist: 0.20, max_dist: 8.0, width: 0.30}
  astar_fallback:
    net: GND
    width: 0.30
    window: 3.0
    attempts: 3
    via: {size: 0.60, drill: 0.30, hole_to_copper: 0.255}
  island_rescue: {min_bbox: 0.8, layers: [F.Cu, B.Cu, In1.Cu, In2.Cu], require: all}
  # The final fresh-process grouping is authoritative for same-net pour
  # fragments.  Include sub-millimetre USB-switch slivers because KiCad's DRC
  # reports them as real opens; every bridge is collision-checked and the pass
  # refills/re-verifies before it can claim success.
  heal_islands: {min_bbox: 0.1, layers: [F.Cu, B.Cu], sample_step: 0.05,
                 max_gap_candidates: 2000, clear_rescue_failures: true}
  prune_stitch_dangling: {tol: 0.05, min_layers: 2}
