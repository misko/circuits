schema: 1

source_type: 3S-LiPo pack
off_control: "enable-gated master shutdown controlling every converter; implementation pending Stage 2 (BRIEF A2)"
quiescent_ua: 1000
ir_floor_mohm: 100

# `pending_selection` is deliberately unresolved. It makes E-TOPO fail closed
# until Stage 1 creates cited part dossiers and selects the architecture.
rails:
  - name: VBUSA1
    vin_min: 9.0
    vin_max: 12.6
    vout_min: 5.05
    vout_max: 5.25
    iout_max_A: 2.0
    converter: pending_selection
    eff: 0.9
    external_output: true
    claim_id: usb_a_charge_ports
    load_uv_threshold: 4.75
    ir_budget_mohm: 100
    ir_budget_components_mohm:
      protection_switch: {value: 15, basis: budgeted_max, evidence: "Commission budget; Stage 1 must replace with selected-part worst case"}
      pcb_copper_vias_joints: {value: 50, basis: budgeted_max, evidence: "Commission budget; Stage 1 must derive from stackup and geometry"}
      connector_contacts: {value: 35, basis: budgeted_max, evidence: "Commission budget; Stage 1 must cite selected connector rating/data"}
    margin: 0.2

