# Reviewed jlc_twin findings, accepted with evidence. Each entry silences ONE
# (lcsc, status) finding class - never add one without the verification note.
- lcsc: C2913204    # ESP32-S3-WROOM-1-N8R2 (U1)
  status: PAD-MISMATCH
  why: >-
    best=none is an EP-naming artifact: JLC's CAD models the thermal pad as a
    GRID of small paste pads all named "41" (multi-position name breaks the
    1:1 pad-correspondence fit), while ours is the single 3.7x3.7 EP per
    Espressif fig 11-1. The 40 perimeter leads match EXACTLY: measured
    JLC-vs-ours deltas pad1/14/15/26/27/40 are a uniform translation
    (dx=0, dy=-3.63mm = origin choice), rotation 0, no mirror — columns at
    x=+-8.75mm, 1.27mm pitch, bottom row y-pitch identical (2026-07-17,
    06_build/twin/easyeda/C2913204 vs 03_src/lib vendored footprint; vendored
    footprint = KiCad std RF_Module minus EP micro-holes + silk, pads
    untouched). Winding verified against datasheet fig 3-1 (part.yaml).
- lcsc: C6186       # AMS1117-3.3 (U2) — SOT-223 tab-naming family
  status: PAD-MISMATCH
  pad_alias: {"4": "2"}
  why: >-
    KiCad SOT-223-3_TabPin2 merges the tab into pad "2" (tab = VOUT = same
    net as lead 2; part.yaml "TAB IS OUTPUT", ds1117 p.8). JLC's CAD names
    the tab pad "4". Without an alias the fitter finds no correspondence
    (PAD-MISMATCH best=none), the 3D body never mounts, and every
    model-side check silently skips. pad_alias 4->2 renames JLC's tab so
    correspondence is restored — validated 2026-07-17: U2 -> OK
    fit=0.27mm, body mounts on our pads. Nets agree at every location:
    lead col 1=GND 2=VOUT 3=VIN, tab=VOUT=3V3. Supersedes the earlier
    PAD-GEOM/PAD-MISMATCH waivers (which hid the part instead of mounting
    it); the 3.90-vs-2.30 PAD-GEOM was an artifact of the same merged-tab
    numbering and disappears once the alias aligns the pad sets.
- lcsc: C318884     # TS-1187A-B-A-B (SW1, SW2)
  status: PAD-GEOM
  why: >-
    "pad1<->2 ours 3.75 vs JLC 6.00" is pad-NAME mapping, not geometry: the
    KiCad XKB footprint numbers the two TOP pads "1" (internally common A-B
    rail) and the two BOTTOM pads "2" (C-D rail); JLC numbers all four 1..4.
    Physical grids match: ours (+-3.0, +-1.875) vs JLC (+-3.0, +-1.85) —
    0.025mm pad-center delta on 1.0x0.75 pads. Internal pairing verified from
    the drawing rev A0 circuit diagram (02_parts/TS-1187A-B-A-B): top rail
    common, bottom rail common — our numbering puts one net per rail, JLC's
    1,2 (top) get the signal and 3,4 (bottom) get GND identically.
- lcsc: C318884
  status: PAD-MISMATCH
  why: >-
    Same naming artifact as the PAD-GEOM entry above: 2 merged names vs 4
    distinct numbers over an identical 4-pad grid; electrically equivalent by
    the internal A-B / C-D pairing (drawing rev A0 + EasyEDA symbol,
    2026-07-17).
- lcsc: C165948     # HRO TYPE-C-31-M-12 USB-C (J1) — model-orientation fix
  refs: [J1]
  status: MODEL-REG
  model_rot_z: 180
  why: >-
    JLC's 3D model for this USB-C is drawn 180deg rotated vs the footprint,
    so the twin rendered the receptacle mouth facing INBOARD (east) with the
    body 2.1mm off courtyard (area ratio 0.69). PAD fit is perfect
    (fit=0.00mm, 22/22 pads = JLC CAD) so copper is unaffected — this is a
    render-only model-orientation issue. model_rot_z 180 confirmed correct
    TWO ways (metric + eye, since the flip-hint was a red herring on a DPAK
    earlier): MODEL-REG 2.1mm -> 0.09mm on courtyard, AND the corrected
    render shows the mouth + shell brackets facing WEST toward the board
    edge (courtyard front 50.01mm = board edge 50.00mm, flush). Present
    since v1.0; corrected in v1.2 renders.
