# usb-hub-3s-v2 route + stitch — input for route_and_stitch_generic.py
#
# Power is POUR/PLANE-owned and EXCLUDED from KRT: GND (In1 plane + outer pours
# + stitch), VIN (In2 plane + local F.Cu pools + pad_rescue drops), and the
# regional F.Cu/B.Cu pours 5VA/5VC/VBUSA*/VBUSC/SW*/CS*/RSNS/PDSRC. KRT routes
# only the SIGNAL nets: gate drives + bootstraps, buck control/sense, PD config,
# USB data/CC. Pour-fed sense/power pins that sit outside their pour get a
# collision-checked TAP. The v2 win (4 self-contained cells, no shared hot loop)
# should keep this far below v1's congestion.

project:
  name: usb_hub_3s_v2
  board: 04_kicad/usb_hub_3s_v2.kicad_pcb
  build_dir: 06_build/route

prep:
  out: r0.kicad_pcb
  keepouts:
    layers: [User.2]
    # v1.6: 3.0 -> 4.2. The floorplan now states a board rule -- within r <= 4.00 mm
    # of any mounting hole, ALL outer copper is ONE net and that net is GND -- and a
    # zone notch only enforces it for POURS. A KRT signal wave could still lay a
    # 0.2 mm track 3.5 mm from a hole and quietly re-create the H3 defect on a
    # different net. 4.2 gives the rule 0.2 mm of routing margin.
    mounting_holes: {radius: 4.2}
    edge_band: 0.7
    # v1.2 discrete redesign: the eFuse-era escape-lane keepouts are GONE (the QFN
    # eFuse and its west-pin escape wall are removed).

  waves:
    exclude: ["GND", "VBAT", "VBAT_F", "VIN", "5VA", "5VC", "VBUSC", "PMID",
              "VBUSA1", "VBUSA2", "VBUSA3",
              "SW_A", "SW_C", "CS_A", "CS_C", "SNUB_A", "SNUB_C",
              # J5 USB-C corner: CC + interleaved D+/D- edge pads defeat KRT
              # (v1 finding) -> deterministic taps own them (see taps:).
              "CC1", "CC2", "DPC", "DMC",
              "unconnected-*"]
    groups:
      # hardest first: FET gate drives + bootstraps (both bucks)
      gate: [HO_A, LO_A, BOOT_A, HO_C, LO_C, BOOT_C]
      # buck control/sense (both bucks) + VCC local decouple
      sense: [FB_A, COMP_A, CMZ_A, RAMP_A, RT_A, SS_A, UVLO_A, CSF_A, CSGF_A, VCC_A,
              FB_C, COMP_C, CMZ_C, RAMP_C, RT_C, SS_C, UVLO_C, CSF_C, CSGF_C, VCC_C,
              ENKILL,                          # v1.2 master-off bus (SW1.COM -> both bucks' EN + Q7 gate)
              QG]                              # v1.2 Q6 P-FET gate node (Q7.D + R30 pull-up)
      # USB-A data + current-limit
      dataa: [DP_A1, DM_A1, DP_A2, DM_A2, DP_A3, DM_A3, ILIM1, ILIM2, ILIM3]
      sig: rest

route:
  # Promoted KRT chain (canon M3): the deterministic signal-route result. When
  # no fresh build/FINAL marker exists, `import` uses this. rebuild_all.sh runs
  # `route` (fresh KRT) which supersedes it; re-promote after a good roll.
  final: 03_src/route/final_chain.kicad_pcb
  krt: ~/gits/KiCadRoutingTools
  # race N concurrent KRT chains, keep the best — beats per-roll variance
  # (usb-hub-3s-v2 handoff: KRT is stochastic; race the roll).
  race: 6
  common:
    layers: [F.Cu, B.Cu]
    fab_tier: standard          # v3: QFN gone -> jlc_4layer_standard (0.45/0.3 vias)
    via_size: 0.45
    via_drill: 0.3
    no_stub_layer_swap: true
    keepout: true
    keepout_layer: User.2
    clearance: 0.18
  waves:
    - {name: gate,  group: gate,  track_width: 0.3, clearance: 0.15,
       via_size: 0.45, via_drill: 0.3, max_iterations: 500000}
    - {name: sense, group: sense, track_width: 0.2, clearance: 0.15,
       via_size: 0.45, via_drill: 0.3, max_iterations: 500000}
    - {name: dataa, group: dataa, track_width: 0.2, clearance: 0.15,
       via_size: 0.45, via_drill: 0.3, max_iterations: 500000}
    - {name: sig,   group: sig,   track_width: 0.2, clearance: 0.15,
       via_size: 0.45, via_drill: 0.3,
       max_iterations: 800000, max_probe_iterations: 60000, max_ripup: 30}

taps:
  clearance: 0.13   # >= STANDARD tier min_space 0.127; USB_DATA short paired escapes
  via: {size: 0.45, drill: 0.3}   # STANDARD tier (jlc_4layer_standard)
  connections:
    # --- 5VA / 5VC output-sense taps (FB divider top + VOUT sense pin) ---
    # PWR_RAIL floor is 0.6mm -> these pour-connection stubs must be 0.6 too.
    - {net: 5VA, from: U2.10, to: R3.1, width: 0.4, layer: F.Cu, hop_layer: B.Cu}   # VOUT sense -> local FB-top (both 5VA, ~6mm); R3.1's own tap reaches the pour. Avoids the roll-fragile 38mm cross-buck run.
    - {net: 5VA, from: R3.1, to: [98.0, 46.0], width: 0.4, layer: F.Cu, hop_layer: B.Cu,
       escape: true, escape_grid: 0.25, escape_window: 9.0, escape_viacost: 5, escape_attempts: 20}   # FB-top sense; escape A* keeps 0.15 clr (via_hop B.Cu run clipped a COMP_A via)
    # v1.2 buck-C output sense — MIRROR buck-A (U2.10->R3.1->pour). The v1.1 direct
    # U11.10->[95,76] tap is a 38mm cross-buck run that is roll-fragile: buck-A hit
    # this exact wall and was retargeted to its FB-top (journal routing_v1.1 item 2).
    # v1.2 does the same on buck-C: U11.10 (VOUT) -> R12.1 (FB-top, both 5VC, ~9mm
    # local link); R12.1 then escape-taps into the buck-C 5VC pour (single escape,
    # not two competing ones). Also serves the LOCAL-SENSE FB (R12.1 on 5VC).
    - {net: 5VC, from: U11.10, to: R12.1, width: 0.4, layer: F.Cu, hop_layer: B.Cu}
    # v1.6: R42 (the DNP setpoint-trim strap) is in PARALLEL with R12, so its pin 1
    # is on 5VC -- a POUR net that KRT deliberately excludes from its waves. Without
    # an explicit tap it would have no path at all. Short local link to R12.1, the
    # same pattern as U2.10->R3.1; declared BEFORE the escape below so the escape
    # still owns R12.1's via-in-pad site.
    - {net: 5VC, from: R42.1, to: R12.1, width: 0.4, layer: F.Cu, hop_layer: B.Cu}
    - {net: 5VC, from: R12.1, to: [96.0, 86.0], width: 0.4, layer: F.Cu, hop_layer: B.Cu,
       escape: true, escape_grid: 0.25, escape_window: 14.0, escape_viacost: 5, escape_attempts: 40}   # SOUTH route: [96,86] is F.Cu+B.Cu SOLID and BELOW the SW_C island (y65-79), so R12.1 no longer crosses the U11.20/C22.2 SW_C taps ([79,74]/[81,72]). ([95,80] was F.Cu-void; [95,72] boxed the SW_C tap.)
    # v1.2 discrete cell: Q6/F2/D5 power pins pour-bond (5VC notch / PMID / VBUSC);
    # QG (Q6.4, Q7.3, R30.2) + ENKILL route as KRT signals; GND pins (Q7.2, D5.2)
    # pad_rescue. No eFuse IN_SYS/set-pin taps (the eFuse is gone).
    # v1.1 SW-node RC snubbers (DNP-populate): SW pour tap + SNUB link (SWITCH_NODE 0.6)
    - {net: SW_A,   from: R34.1, to: [85.0, 40.0], width: 0.6, layer: F.Cu, hop_layer: B.Cu}
    - {net: SNUB_A, from: R34.2, to: C53.1,        width: 0.6, layer: F.Cu, hop_layer: B.Cu}
    - {net: SW_C,   from: R35.1, to: [85.0, 78.0], width: 0.6, layer: F.Cu, hop_layer: B.Cu}
    - {net: SNUB_C, from: R35.2, to: C54.1,        width: 0.6, layer: F.Cu, hop_layer: B.Cu}
    # (v3: the PD power-pin taps — U1.20/U1.19/C44 — are gone with the PD cell.)
    # --- chip pins that sit outside their pour island -> bond to the island ---
    - {net: SW_A,  from: U2.20,  to: [79.0, 34.0], width: 0.6, layer: F.Cu, hop_layer: B.Cu}
    - {net: SW_A,  from: C7.2,   to: [81.0, 34.0], width: 0.6, layer: F.Cu, hop_layer: B.Cu}  # deeper in SW island, y34 clears Q2.5 VIN pads so 0.6 fits (was [79,31] -> joinpath fell back to 0.2 -> track_width)
    - {net: SW_C,  from: U11.20, to: [79.0, 74.0], width: 0.6, layer: F.Cu, hop_layer: B.Cu}
    - {net: SW_C,  from: C22.2,  to: [81.0, 72.0], width: 0.6, layer: F.Cu, hop_layer: B.Cu}  # deeper in SW_C island so 0.6 fits (mirror of C7.2 fix; [79,69] -> joinpath fell to 0.2)
    # PD QFN north-edge escapes: pins 21 VBUSC / 23 PDSRC are WEST pins whose nets
    # sit EAST (crossing the RSNS/5VC west escapes). Stub on the pad layer (F.Cu)
    # so via_hop drops a via-in-pad AT the QFN pad, then thread B.Cu east. Order:
    # PDSRC first (shorter, Q6-constrained), then VBUSC (longer run to bulk).
    # PD QFN north-edge EAST escapes (FET row moved to y88 -> clear F.Cu channel
    # y91-96). 21 VBUSC / 23 PDSRC are west pins whose nets sit east; they escape
    # EAST on F.Cu while 19 RSNS / 20 5VC go west on B.Cu -> no same-layer crossing.
    # via_hop drops a via-in-pad at the QFN pad; F.Cu stub, F.Cu run through channel.
    # STILL STUCK: KRT fills the widened channel with GDNG/DSCG_N/PDGATE (pins 22/24
    # + FET gate) before taps run, and the 0.5mm-pitch via-in-pad sites collide.
    # - {net: PDSRC, from: U1.23, to: [109.7, 92.3], width: 0.2, layer: F.Cu, hop_layer: B.Cu}
    # - {net: VBUSC, from: U1.21, to: [110.6, 93.7], width: 0.2, layer: F.Cu, hop_layer: B.Cu}
    # --- TPS2557 OUT2(pin7) bond to OUT1(pin6) (pour can't thread 0.65mm gap) ---
    - {net: VBUSA1, from: U3.7, to: U3.6, width: 0.5, layer: F.Cu, hop_layer: B.Cu}
    - {net: VBUSA2, from: U4.7, to: U4.6, width: 0.5, layer: F.Cu, hop_layer: B.Cu}
    - {net: VBUSA3, from: U5.7, to: U5.6, width: 0.5, layer: F.Cu, hop_layer: B.Cu}
    # TPS2557 OUT (x~109) -> its VBUSAn pour (starts x118): the OUT pins sit WEST
    # of the pour, so bond OUT1 across to a point inside the pour/connector rail.
    - {net: VBUSA1, from: U3.6, to: [123.0, 34.0], width: 0.8, layer: F.Cu, hop_layer: B.Cu}
    - {net: VBUSA2, from: U4.6, to: [123.0, 56.0], width: 0.8, layer: F.Cu, hop_layer: B.Cu}
    - {net: VBUSA3, from: U5.6, to: [123.0, 78.0], width: 0.8, layer: F.Cu, hop_layer: B.Cu}
    # --- J5 USB-C CC + data escape (deterministic; KRT cannot thread these) ---
    # HARD in-chip pass-through joins FIRST (route the U12 3-4 / 1-6 south channel
    # while it is empty), then the J5-edge legs. CC1/CC2 split onto opposite layers.
    - {net: DMC, from: U12.3, to: U12.4, width: 0.2, layer: F.Cu, hop_layer: B.Cu}
    - {net: DPC, from: U12.1, to: U12.6, width: 0.2, layer: F.Cu, hop_layer: B.Cu}
    - {net: DMC, from: U12.4, to: R27.2, width: 0.2, layer: F.Cu, hop_layer: B.Cu}
    - {net: DPC, from: U12.6, to: R27.1, width: 0.2, layer: F.Cu, hop_layer: B.Cu}
    # CC1/CC2 Rp pull-ups (v3): J5 CC pad -> the pull-up resistor. The resistor's
    # other pad (5VC) auto-bonds to the SE 5VC pour. Short runs in the clear
    # x118.2-122.3 CC column (kept pour-free), before the J5 data legs crowd it.
    - {net: CC1, from: J5.A5, to: R28.1, width: 0.15, layer: F.Cu, hop_layer: B.Cu}
    - {net: CC2, from: J5.B5, to: R29.1, width: 0.15, layer: F.Cu, hop_layer: B.Cu}
    # J5 data legs: interleaved DPC/DMC at the edge (W->E: B7 DMC, A6 DPC, A7 DMC,
    # B6 DPC) must split across two layers. STUB on the pad layer (F.Cu) so via_hop
    # drops the bonding via; the A-pair claims F.Cu first, the crossing B-pair is
    # forced onto the B.Cu hop by the collision checker.
    - {net: DPC, from: J5.A6, to: U12.6, width: 0.15, layer: F.Cu, hop_layer: B.Cu}
    - {net: DMC, from: J5.A7, to: U12.4, width: 0.15, layer: F.Cu, hop_layer: B.Cu}
    - {net: DPC, from: J5.B6, to: U12.6, width: 0.15, layer: F.Cu, hop_layer: B.Cu}
    - {net: DMC, from: J5.B7, to: U12.4, width: 0.15, layer: F.Cu, hop_layer: B.Cu}

stitch:
  clearance: 0.15
  via: {size: 0.45, drill: 0.3, spacing: 0.85, pth_margin: 0.3}   # STANDARD tier 0.45/0.3
  keepin: {inset: 0.8}
  passes: [dedupe_vias, normalize_vias, drop_micro_fragments, drop_dangling,
           split_t_junctions, reload, hole_to_hole, pad_rescue, stub_fallback,
           astar_fallback, stitch_grid, fill, island_rescue, dedupe_vias,
           hole_to_hole, fill, prune_stitch_dangling, gate]
  dedupe_vias: {radius: 0.28, metric: box}
  normalize_vias: {below_width: 0.44, size: 0.45, drill: 0.3}   # STANDARD tier
  drop_micro_fragments: {max_length: 0.16, require_free_end: true}
  drop_dangling: {max_length: 1.0, tol: 0.05, sweeps: 4}
  split_t_junctions: {tol: 0.05}
  hole_to_hole: {min_gap: 0.5, mode: nudge, prefer_keep: [GND]}   # STANDARD hole-to-hole 0.5
  pad_rescue:
    nets:
      - {net: GND, layer: In1.Cu}
      - {net: VIN, layer: In2.Cu}
    via_in_pad: true
    served_within: 1.6
    rings: [0.75, 0.95, 1.2, 1.6, 2.1, 2.7]
    stub_width: 0.3
    require: none
  stub_fallback: {net: GND, min_dist: 0.2, max_dist: 8.0, width: 0.3}
  astar_fallback: {net: GND, width: 0.25, window: 3.0, attempts: 3}
  stitch_grid:
    net: GND
    # x26 (not 24): J1 XT60 has no-net alignment posts at x24. Stop at x114: the
    # east strip (x>=118) is VBUS/5VC pours + connectors -> no GND on outer layers,
    # so grid vias there only dangle on In1 (pad_rescue bonds the connector GND pins).
    x: [26, 116, 8]
    y: [26, 108, 8]
  # v1.6, from tier-preflight PF-LAYER: this scanned only the OUTER layers on a
  # board that declares TWO INNER PLANES (In1 GND, In2 VIN). An orphaned fill
  # island on In1 or In2 was structurally invisible to the rescue pass -- the same
  # F/B-only blindness that cost crow-recorder-central-v2 200 shorting + 501
  # clearance findings on 2026-07-23. A plane is exactly where an unbonded island
  # is most likely AND least likely to be noticed by eye.
  island_rescue: {min_bbox: 0.8, layers: [F.Cu, B.Cu, In1.Cu, In2.Cu], require: all}
  prune_stitch_dangling: {tol: 0.05, min_layers: 2}
