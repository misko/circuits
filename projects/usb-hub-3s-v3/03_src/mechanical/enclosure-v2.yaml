verification_scopes:
  - id: shell
    description: Floor-down foundation, isolated PCB bosses, four independent closure posts, and one 3.2 mm roof whose main service edges stop at the exact PCB outline with four D10.8 tapered closure ears rooted through D16 inboard pads.
    required: true
    depends_on: []
  - id: board_retention
    description: PCB seats only on H1-H4 bosses and remains fastened to the base while the complete roof and all case screws are removed.
    required: true
    depends_on: [shell]
  - id: connector_access
    description: Full 40 mm vertical roof install and removal over the populated PCB with no vertical skirt barrier along J1-J5 mating axes, plus simultaneous connector, termination, cable, grip, tool, and top-service access still awaiting exact evidence.
    required: true
    depends_on: [shell, board_retention]
  - id: thermal
    description: Roof-covered, open-sided PETG enclosure behavior at the declared combined output load and ambient.
    required: true
    depends_on: [shell, connector_access]
