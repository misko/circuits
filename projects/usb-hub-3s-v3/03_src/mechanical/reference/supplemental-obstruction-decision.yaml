decision:
  conservative_candidate_possible: true
  exact_supplement_possible_from_current_inputs: false
  current_schema_composition_supported: false
  disposition: defer_composite_authority
  rationale: >-
    The immutable footprint fabrication bounds and reviewed opening gauges can
    produce conservative obstruction candidates, but they do not establish
    received-part height, connector overmold, plug, fuse-element, or switch
    actuator geometry. The deployed v1 CAD/collision contract binds one sealed
    STEP and has no typed way to compose that STEP with a mixed-authority
    supplemental assembly while preserving per-solid authority. Replacing the
    STEP with such a candidate would overstate exact coverage.
  governing_rule: >-
    Keep STEP coverage FAIL and all affected scopes non-ready. Do not use a
    collision check against only present STEP solids as a release gate.
  future_unblock: >-
    Add reviewed schema support for a hash-bound composite obstruction set with
    per-solid authority and status ceilings, then bind exact vendor geometry or
    traceable measurements of the received F2, J1-J5, Q1-Q6, U3-U5, SW1,
    installed fuse, and intended mating hardware.
excluded_claims:
  - exact_geometry
  - complete_step_geometry
  - physical_fit
  - cad_ready
  - production_readiness
