# usb-hub-3s-v3 POWER-TREE TOPOLOGY (canon E-TOPO).
#
# Identical rails to v2: both USB-A and USB-C are 5 V outputs from a 9-12.6 V
# battery, so both are step-DOWN bucks (Vout_max 5 < Vin_min 9 => BUCK).
#
# v3 change is DOWNSTREAM of the USB-C buck, not in the tree: v2 fed the 5VC
# buck output into a TPS25740A PD source controller; v3 brings 5VC straight to
# the USB-C VBUS (plain 5 V; load is a Pi 4 at 3 A — ADR-0004 corrects ADR-0001's
# Pi-5 `PSU_MAX_CURRENT=5000` premise, which does not exist on a Pi 4).
# The PD controller was never a converter, so the tree is unchanged and E-TOPO
# still PASSes all-buck.

input_trunk_class: PWR_IN

# --- E-OFF: de-energization + stored quiescent draw (canon E-OFF) ---
# This is a self-contained energy source (3S-LiPo, net VBAT), so it must document
# HOW it is switched off in storage and its bounded stored draw. v1.1 ADDED the
# master-off switch SW1 that v1.0 lacked (the red-team miss the E-OFF gate harvested).
source_type: "3S LiPo battery pack, 9.0-12.6 V, XT60 input"
off_control: "EN-gating master switch SW1 (ENKILL bus) - slide to T1 grounds
  ENKILL, driving BOTH LM5116 bucks (U2.4 + U11.4, re-merged onto ENKILL) to
  ~9 uA shutdown AND opening the VBUS reverse-block P-FET Q6 (Q7 BSS138 gate
  inverter: ENKILL low -> Q7 off -> Q6 gate floats to source -> Q6 OFF, VBUS
  isolated + back-feed blocked). 5VC then collapses. (ADR-0002; discrete
  redesign; E-INV asserts ENKILL == {U2.4, U11.4, SW1.2, Q7.1, R8.2, R17.2})"
quiescent_ua: 271   # OFF-state pack draw: ~252 uA switch sink (VIN 12.6 V through
                    # R8||R17 = 50 k pull-ups into the grounded ENKILL bus, both
                    # bucks' EN re-merged) + ~18 uA (2x LM5116 ~9 uA shutdown Iq)
                    # + <=1 uA (v1.6 pack-LED gate Q8, below). Q6 off (Q7 pulldown
                    # released), VBUS isolated, no eFuse. No pack_capacity_mah
                    # (external pack) -> self-drain-days is advisory-N-A, but the
                    # draw is BOUNDED and documented.
                    #
                    # v1.6 STATUS-LED DERIVATION (270 -> 271), and why the +1 uA is
                    # the WHOLE story rather than +1504 uA:
                    #   Five indicators are added. The FOUR RAIL LEDs (D9/D10/D11 on
                    #   VBUSA1/2/3, D12 on VBUSC) contribute EXACTLY ZERO to this
                    #   number: with SW1 at T1 the ENKILL bus is grounded, both
                    #   LM5116s are in shutdown and Q6 is open, so 5VA, 5VC, VBUSA*
                    #   and VBUSC are all collapsed. They are dark by construction,
                    #   not by budget.
                    #   The PACK LED D8 is the one that could have killed the pack.
                    #   It sits on VIN, which is HOT whenever the XT60 is mated --
                    #   SW1 switches ENABLE (pad1=GND, pad2=ENKILL, pad3=NC), not
                    #   power, and neither VBAT nor VBAT_F reaches any switch pole.
                    #   UNGATED it would draw (12.6 - 2.1)/6980 = 1.504 mA typ
                    #   (0.946-1.547 mA over VIN 9.0-12.6 V x Vf 1.8-2.4 V), taking
                    #   the OFF-state to 1.775 mA = 6.6x this budget and flattening a
                    #   3S 5000 mAh pack in ~117 days (~94 days to the 20% LiPo floor).
                    #   GATED by Q8 (BSS138, gate on ENKILL, source GND, drain on the
                    #   D8 cathode LEDPKK) the adder is Q8's off-state drain leakage
                    #   only: BSS138 I_DSS 0.5 uA max at V_DS 50 V / 25 C, and here
                    #   V_DS <= 10.5 V, so <= 0.5 uA. Q8's gate loads the ENKILL bus
                    #   by I_GSS <= 100 nA -> <= 5 mV droop on the 50 k pull-up bus,
                    #   which does not approach either LM5116's EN threshold.
                    #   Rounded UP to a whole 1 uA: 270 + 1 = 271 uA.
                    # THE DATASHEET IS NOT THE QUALIFICATION. 0.5 uA is a 25 C
                    # maximum and MOSFET leakage climbs roughly an order of magnitude
                    # per 40-50 C. Nothing on this board has ever MEASURED the
                    # OFF-state draw. v1.6 therefore adds bench gate Q7 in
                    # ORDER_README (user decision D7): LEDs fitted, SW1 OFF, measure
                    # pack current with a uA meter and record it WITH the ambient.
                    # PASS <= 300 uA. That measurement, not this line, qualifies the
                    # number.

rails:
  # USB-A rail: LM5116 buck -> 5VA -> 3x TPS2557 (2 A cont each) -> 3x USB-A.
  - name: USB-A
    vin_min: 9.0
    vin_max: 12.6
    vout_min: 5
    vout_max: 5
    iout_max_A: 6
    converter: LM5116MHX-NOPB
    eff: 0.9

  # USB-C rail: LM5116 buck -> 5VC -> Q6 (AON6403 reverse-block P-FET) -> PMID
  # -> F2 (SMD2920-700 PPTC polyfuse) -> VBUSC -> USB-C VBUS. Fixed 5 V out => BUCK.
  # v1.3 (ADR-0002): the v1.1 TPS26631 eFuse is REMOVED; the discrete Q6/F2/D5 chain
  # is the protection. Q6/F2 are PROTECTION elements, NOT converters -> the E-TOPO
  # tree is unchanged (still all-buck). 5 A to the Pi via the firmware override
  # v1.6: 3 A to a Pi 4, which needs neither PD nor an EEPROM override (ADR-0004).
  - name: USB-C
    vin_min: 9.0
    vin_max: 12.6
    # v1.2 LOCAL-SENSE (kept): buck-C FB senses the LOCAL 5VC output, so the loop
    # regulates 5VC (not the connector) to Vref*(1+R12/R13) = 1.215*(1+4.12/1.21) =
    # 5.352 V nominal. SUPERSEDED BY THE SYNC BELOW: this used to read
    # "worst-case regulated 5VC = Vref-1.5% = 5.27 V; no-load high = Vref+1.5% =
    # 5.43 V", which is the Vref-ONLY window. The tolerance-inclusive window is
    # 5.227-5.479 V; the D5 TVS Vwm-6.0V standoff is checked against 5.479 V
    # (521 mV of standoff margin), not 5.43 V. R12 = C2984354 (AR03BTCX4121, 4.12k 0.1%), CATALOG-VERIFIED 2026-07-23
    # and BAKED in the tsx (v1.2 undervoltage bug was R12 value-resolving to 3.74k).
    # v1.5 (2026-07-25) TOLERANCE-INCLUSIVE SYNC. These were 5.27/5.43 = the
    # Vref-ONLY corners, which UNDER-STATE the window: R13/R4 = C5126242 =
    # FRC0603F1211TS is 1.21k +-1%, and that tolerance belongs in the corners
    # (external review EXT13-3, fixed in the v1.4 paperwork but never synced
    # back into this file — the harvest item v1.4's STATUS carried, closed here
    # after the v1.5 fresh lens re-raised it as P2-2).
    #   min = 1.215*0.985 * (1 + 4.12*0.999 / 1.21*1.01) = 5.227 V
    #   max = 1.215*1.015 * (1 + 4.12*1.001 / 1.21*0.99) = 5.479 V
    # E-MARGIN with the HONEST corner: headroom 5.227 - 4.63 = 597 mV vs the
    # DERATED budget 88 mOhm x 5 A x 1.2 = 528 mV -> PASS, but the slack is
    # 69 mV, NOT the 157 mV that comparing against the un-derated 440 mV gives.
    # 69 mV is the number the bench gates Q2/Q5 exist to replace with a
    # measurement (ORDER_README; DETAIL_DESIGN sec.4).
    vout_min: 5.227
    vout_max: 5.479
    # v1.6 CORRECTION, 5 -> 3. THE LOAD IS A RASPBERRY PI 4, NOT A PI 5
    # (user-confirmed 2026-07-25). The 5 A figure came from a Pi-5 premise: that
    # the Pi could be told to skip PD negotiation and draw 5 A via the bootloader
    # EEPROM setting PSU_MAX_CURRENT=5000. THAT SETTING IS A PI 5 FEATURE AND HAS
    # NO EQUIVALENT ON A PI 4. A Pi 4's USB-C input does not negotiate PD for
    # power at all -- it is a plain 5 V sink with CC pull-downs, officially rated
    # 5 V / 3 A (15 W). So 3 A is not a de-rating of the requirement, it IS the
    # requirement, and always was.
    #
    # THE BOARD STAYS PROVISIONED FOR 5 A AND THAT IS DELIBERATE. buck-C, the F2
    # SMD2920-700 polyfuse (7 A hold), the VBUSC via count and every pour width in
    # the delivery corner were sized for 5 A and are NOT being reduced. This is
    # over-provisioning: it is safe, the copper is already spent, and unwinding it
    # would be a re-route for no gain. It is stated here in as many words so that a
    # 5 A number sitting beside a 3 A load is never read as an unresolved
    # contradiction by the next person -- or by a gate.
    iout_max_A: 3
    # ---- DECLARED NON-GOAL, not an assumption -------------------------------
    # A RASPBERRY PI 5 AT 5 A IS OUT OF SCOPE FOR THIS BOARD AS SPECIFIED. Stated
    # as a non-goal rather than left implicit because THE +247.8 mV MARGIN IS
    # CONTINGENT ON THE LOAD, NOT ON THE HARDWARE: the copper below is bit-identical
    # to the copper that measured +15.0 mV of slack while the target was believed to
    # be a Pi 5. Nothing was strengthened. The load got smaller.
    # So anyone who later retargets a Pi 5 (or any 5 A sink) must find the 5 A
    # arithmetic waiting for them instead of rediscovering it:
    #     5 A: 98 mOhm x 5 A x 1.2 = 588.0 mV -> 4.639 V ->  +9.0 mV slack  (thin)
    #     3 A: 98 mOhm x 3 A x 1.2 = 352.8 mV -> 4.874 V -> +244.2 mV slack (shipped)
    # Retargeting a 5 A load therefore does NOT need a copper change to be legal --
    # E-MARGIN still PASSES at 5 A -- but it puts the board back on 15 mV of paper
    # slack, which is the posture v1.5's ORDER_README correctly refused to ship on.
    # The lever, if it is ever wanted, is the CABLE (see ir_budget_mohm below): ~45
    # of the 97 mOhm is cable, so a shorter/heavier cable buys far more than copper.
    # A Pi 5 also brings its OWN over-voltage story: it browns out nearer 4.25 V
    # (more headroom) but this file's 4.63 V threshold and ADR-0003's 6.00 V
    # absolute-maximum chain are PI 4 FIGURES and would both need re-deriving.
    converter: LM5116MHX-NOPB
    eff: 0.9
    # E-MARGIN (v1.3 re-derivation, against the ACTUAL Q6+F2 delivery path - the eFuse
    # 34/48 mOhm model is GONE). vout_min = the true worst-case regulated 5VC node
    # (now the TOLERANCE-INCLUSIVE 5.227 V, not the Vref-only 5.27 V).
    # ir_budget_mohm is the FULL delivery path 5VC->Pi:
    #   Q6 AON6403 Rds_on   ~4.3 mOhm (max @Vgs=-4.5V; actual Vgs~5.3V -> lower)
    #   F2 SMD2920-700      R1max 18 mOhm cold (JLC C6165170 catalog-VERIFIED),
    #                       ~31 mOhm hot at 5 A steady (self-heat ~1.7x R1max)
    #   board traces+pours  ~12 mOhm  MEASURED 2026-07-25 by the v1.5 layout
    #                       red-team lens (RL-2), NOT the ~3 mOhm this line
    #                       carried since v1.3. Numerical mesh solve (SOR, 0.3mm
    #                       cells, F.Cu+B.Cu+vias, solver validated against
    #                       analytic bars and found to read 10-20% LOW):
    #                         5VC  L2.2 -> Q6 tab    2.198 mOhm
    #                         PMID Q6.S -> F2.1      4.914 mOhm
    #                         VBUSC F2.2 -> J5       2.209 mOhm
    #                                       total >= 9.32 mOhm, true ~10.4-11.6
    #                       Taken CONSERVATIVELY as 12 mOhm here.
    #                       v1.6 COMPLETENESS FIX: those three segments are all
    #                       FORWARD PATH (high side). The GND RETURN from J5 back to
    #                       the buck was ABSENT from this budget -- not measured and
    #                       judged negligible, simply missing, which in a budget
    #                       looks exactly like zero. At 5 A even 2 mOhm is 12 mV, so
    #                       "small" and "uncounted" must not be indistinguishable.
    #                       SOLVED 2026-07-26 on the v1.6 board, same method as the
    #                       forward path (SOR relaxation on FILLED copper, 0.8mm
    #                       cells, F.Cu + In1.Cu + In2.Cu + B.Cu, 178 GND vias
    #                       coupling the layers at ~0.5 mOhm each, source = J5's GND
    #                       pads, sink = U11's EP + RS2's GND end, converged on the
    #                       one-port resistance itself over 10350 sweeps):
    #   GND return J5 -> buck-C     0.956 mOhm   MEASURED (not asserted)
    #                       Cell occupancy confirms why it is small: In1.Cu carries
    #                       17520 of 18908 GND cells (a near-solid plane), B.Cu
    #                       12105 and F.Cu 9438 in parallel with it. 2.87 mV at 3 A;
    #                       4.78 mV at 5 A -- which is exactly why it had to be
    #                       counted rather than called negligible: at 5 A it is a
    #                       third of the old 15 mV slack.
    #   GND RETURN          0.956 mOhm  MEASURED 2026-07-26 (was ABSENT -- see the
    #                       board-copper note above. A term that is missing from a
    #                       budget is indistinguishable from a term that is zero,
    #                       and this one is neither.)
    #   USB-C connector     ~5 mOhm   (paralleled VBUS pins A4/B4/A9/B9)
    #   short 5A USB-C cable ~45 mOhm  (0.3-0.5 m e-marked; REQUIRED per ORDER_README)
    #   ------------------------------ TOTAL ~= 98 mOhm (97 + the 0.956 return,
    #                       rounded UP; was 88 before RL-2's board-copper measurement)
    # ------------------------------------------------------------------
    # v1.6 RE-GRADE AT THE PI 4's 3 A. THE MARGIN IMPROVES 16.5x.
    #   headroom = vout_min - load_uv_threshold = 5.227 - 4.63 = 597.0 mV
    #   derated budget = 98 mOhm x 3 A x 1.2 = 352.8 mV
    #   SLACK = 597.0 - 352.8 = +244.2 mV   (was +15.0 mV at the mistaken 5 A)
    # The delivered connector voltage goes 4.645 V -> 4.878 V at the worst
    # corner. NOTHING IN THE HARDWARE CHANGED -- the load did, because we now
    # know what it is. This is the single biggest change to this board's risk
    # posture in v1.6, and it retires the caveat that has followed the release
    # since v1.5: "15 mV of paper slack is not a margin you ship on" was true and
    # is no longer the situation. The bench gates below still MEASURE it (a
    # computed margin is still a computed margin), but they are now judged
    # against the 3 A number, not the 5 A one.
    # NOTE the cable term dominates: ~45 of the 97 mOhm is the USB-C cable, so at
    # 3 A it costs 135 mV rather than 225 mV. A short, well-made cable is still
    # the single highest-leverage thing the user controls.
    # ------------------------------------------------------------------
    # SUPERSEDED (kept for the record): at the mistaken 5 A Pi-5 load, E-MARGIN
    # graded headroom 597 mV vs 97 mOhm x 5 A x 1.2 = 582 mV -> PASS, slack 15 mV.
    # History of this figure, all on the SAME rail: 112 mV (Vref-only corner,
    # 88 mOhm) -> 69 mV (tolerance-inclusive corner, 88 mOhm) -> 15 mV
    # (tolerance-inclusive corner + the MEASURED 12 mOhm board copper, RL-2).
    # Each step removed an optimistic assumption; none changed the hardware.
    # The gate still PASSES, but 15 mV of paper slack is not a margin you ship
    # on -- ORDER_README gates Q2/Q5 MEASURE the delivered cable-end voltage and
    # that measurement, not this line, is what qualifies the board. The v1.2 3.74k bug gave 5VC 4.97 V
    # nominal (4.90 V at Vref-1.5%) -> headroom 265 mV < 528 mV -> would FAIL here.
    # FLAGGED (bench-verify, ORDER_README gate): the quadruple-worst corner
    # (Vref-1.5% AND F2 fully hot AND a marginal/long cable) is thin - qualify the
    # connector voltage at the END of the ACTUAL 5A cable. Mitigation lever if bench
    # shows it marginal: R12 4.12k->4.22k (5VC 5.453 V) at the cost of the D5-Vwm /
    # no-load-OV margin. F2 and D5 are SECONDARY protection (see ADR-0002 honesty).
    ir_budget_mohm: 98   # RL-2's measured board copper + the v1.6 GND-return solve.
                         # History, each step removing an optimistic assumption and
                         # none changing the hardware: 88 (guessed ~3 mOhm copper)
                         # -> 97 (RL-2 measured 12 mOhm FORWARD path) -> 98 (v1.6
                         # measured the 0.956 mOhm RETURN the forward-only solve had
                         # silently omitted). At the Pi 4's 3 A: 98 x 3 x 1.2 =
                         # 352.8 mV against 597 mV of headroom -> slack +244.2 mV.
    # 4.63 V is and always was the RASPBERRY PI 4 undervoltage-detect threshold,
    # so it is LEFT UNCHANGED by the Pi 5 -> Pi 4 correction -- but it is recorded
    # here that it is a Pi 4 figure now that we know which board it is. It was
    # previously a Pi-4 number being applied to a Pi 5 by inference, which happened
    # to be conservative (a Pi 5 browns out nearer 4.25 V).
    # Pi 4 ABSOLUTE MAXIMUM INPUT: +6.0 V (Raspberry Pi 4 datasheet p.8, Absolute
    # Maximum Ratings, stated in terms to be "a stress rating only"). This is a
    # DOCUMENTED SPEC for the actual target, not an inference. See ADR-0003 for
    # what it means for the D5/U12 clamp order: worst-case operating VBUSC 5.479 V,
    # Pi absolute max 6.00 V, U12 guaranteed non-conduction floor 6.00 V, D5
    # breakdown minimum 6.67 V -> D5 CANNOT protect the Pi.
    load_uv_threshold: 4.63
