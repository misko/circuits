# usb-hub-3s-v3 POWER-TREE TOPOLOGY (canon E-TOPO).
#
# Identical rails to v2: both USB-A and USB-C are 5 V outputs from a 9-12.6 V
# battery, so both are step-DOWN bucks (Vout_max 5 < Vin_min 9 => BUCK).
#
# v3 change is DOWNSTREAM of the USB-C buck, not in the tree: v2 fed the 5VC
# buck output into a TPS25740A PD source controller; v3 brings 5VC straight to
# the USB-C VBUS (plain 5 V/5 A, Pi PSU_MAX_CURRENT=5000 override — ADR-0001).
# The PD controller was never a converter, so the tree is unchanged and E-TOPO
# still PASSes all-buck.

input_trunk_class: PWR_IN

# --- E-OFF: de-energization + stored quiescent draw (canon E-OFF) ---
# This is a self-contained energy source (3S-LiPo, net VBAT), so it must document
# HOW it is switched off in storage and its bounded stored draw. v1.1 ADDED the
# master-off switch SW1 that v1.0 lacked (the red-team miss the E-OFF gate harvested).
source_type: "3S LiPo battery pack, 9.0-12.6 V, XT60 input"
off_control: "EN-gating master switch SW1 (ENKILL bus) - slide to T1 grounds
  ENKILL, driving buck-A (U2.4) to ~9 uA shutdown DIRECTLY and buck-C (U11.4, on
  the un-merged EN_C net) via the D6 EN_C->ENKILL coupling diode; 5VC then
  collapses so the eFuse SHDN divider turns U13 off too (ADR-0001; journal
  03_schematic_v1.2 Fixes 2-3; E-INV asserts ENKILL == {U2.4, R8.2, SW1.2, D6.1}
  and EN_C == {U11.4, R17.2, U13.15(FLT), D6.2})"
quiescent_ua: 265   # OFF-state pack draw: ~126 uA (buck-A R8 100k pull-up to VIN
                    # 12.6 V into grounded ENKILL) + ~121 uA (buck-C R17 100k
                    # pull-up through D6 into ENKILL) + ~18 uA (2x LM5116 ~9 uA
                    # shutdown Iq). eFuse off (SHDN low, no input current). v1.2
                    # un-merged EN_C so the two 100k pull-ups now sink separately
                    # (was ~252 uA through the merged 50 k in v1.1). No
                    # pack_capacity_mah (external pack) -> self-drain-days is
                    # advisory-N-A, but the draw is BOUNDED and documented.

rails:
  # USB-A rail: LM5116 buck -> 5VA -> 3x TPS2557 (2 A cont each) -> 3x USB-A.
  - name: USB-A
    vin_min: 9.0
    vin_max: 12.6
    vout_min: 5
    vout_max: 5
    iout_max_A: 6
    converter: LM5116MHX-NOPB
    eff: 0.9

  # USB-C rail: LM5116 buck -> 5VC -> (v1.1) TPS26631 eFuse + reverse-block FET
  # -> VBUSC -> USB-C VBUS. Fixed 5 V out => BUCK. The eFuse is a PROTECTION
  # element (current limit / input-OV cutoff / soft-start / reverse-current
  # block), NOT a converter, so the E-TOPO tree is unchanged (still all-buck).
  # 5 A to the Pi via the firmware override (PSU_MAX_CURRENT=5000), not PD.
  - name: USB-C
    vin_min: 9.0
    vin_max: 12.6
    # v1.2 LOCAL-SENSE (journal 03_schematic_v1.2, fixes the post-eFuse RUNAWAY
    # blocker): buck-C FB senses the LOCAL 5VC output, so the loop regulates 5VC
    # (not the connector) to 1.215*(1+4.12/1.21) = 5.352 V. The connector is then
    # 5VC minus the eFuse+FET IR (~34 mOhm typ / ~48 mOhm hot), i.e. it now VARIES
    # with load: no-load 5.352 V (vout_max) down to ~5.18 V typ / ~5.11 V hot at
    # 5 A (vout_min = the full-load delivered connector, the E-MARGIN value).
    vout_min: 5.18
    vout_max: 5.352
    iout_max_A: 5
    converter: LM5116MHX-NOPB
    eff: 0.9
    # E-MARGIN: Pi undervoltage supervisor trips ~4.63 V. Delivered connector
    # 5.18 V - 4.63 V = 550 mV headroom = 110 mOhm cable IR budget at 5 A, which
    # clears the 100 mOhm default board+connector+cable floor (better than v1.1's
    # 104 mOhm). TRADE-OFF DOCUMENTED: unlike v1.1 connector-sense (which
    # regulated the eFuse+FET IR OUT of the loop), local-sense leaves that ~34-48
    # mOhm in the un-regulated delivery path; the 3.92k->4.12k setpoint bump
    # (+201 mV) covers it. At the QUADRUPLE-worst corner (Vref -1.5% AND hot eFuse
    # AND 5 A) the connector is ~5.03 V -> only ~80 mOhm cable budget: FLAGGED for
    # the v1.2 red-team + bench-verify the real cable IR. Mitigation lever if the
    # bench shows it marginal: R12 4.12k->4.22k (5VC 5.453 V, connector ~5.21 V @5A)
    # at the cost of tightening the eFuse-OVP no-load margin (5.535 V vs 5.91 V).
    load_uv_threshold: 4.63
