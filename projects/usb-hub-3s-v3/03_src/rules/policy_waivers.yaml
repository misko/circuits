# usb-hub-3s-v3 policy_audit waivers — evidence-backed only.
- id: R-THERM
  why: >
    The R-THERM-flagged power-FET / EP pads are FALSE POSITIVES, adjudicated by
    the zero-context layout red-team (08_reviews/2026-07-22_v1.0_redteam_layout.md,
    verdict ORDER); PROSE UPDATED for the v1.2 DISCRETE-PROTECTION FET set
    (ADR-0002; journal 04_board 2026-07-23 — the eFuse is GONE). MEASURED: the
    4-layer stack has only TWO internal-plane nets (In1=GND, In2=VIN), so the
    power-FET pads on NON-plane nets have NO plane to via into — the heuristic
    (>=2 same-net PLANE vias) is unsatisfiable by design. Those pads: Q1.5/VBAT_F
    (RPP P-FET drain), Q3.5/SW_A (buck-A LS drain), Q5.5/SW_C (buck-C LS drain),
    and — the v1.2 discrete VBUS P-FET — Q6.5/5VC (AON6403 drain-tab) and
    Q6.1-3/PMID (AON6403 source): 5VC and PMID are both pour-fed, NEITHER a plane
    net. Confirmed by control pads Q2.5/Q4.5 (VIN drains) which PASS with 3 In2
    vias each. RE-MEASURED 2026-07-27 ON THE v1.9 BOARD, at the CURRENT load
    envelope: the dissipation figures this waiver used to carry were the
    SUPERSEDED 15.5 A Q1 / 5 A Q6 envelope. Q1 at the 7 A worst-case trunk =
    0.14 W; Q3 (buck-A LS drain) 0.11 W at the 4.66 A LS-FET RMS; Q5 (buck-C LS)
    0.05 W; Q6 AON6403 at the Pi 4's ACTUAL 3 A (ADR-0004, not the provisioned
    5 A) = 3^2 x 4.3 mOhm = 0.039 W. All <0.15 W, into 14.9mm^2 DFN5x6 pads on
    170-390mm^2 pours; dTj ~6-9C. (Q7 = BSS138 SOT-23 signal FET, no thermal path
    — not R-THERM-relevant.)
    ---- EP VIA COUNTS: THE OLD PROSE DESCRIBED A BOARD THAT NO LONGER EXISTS.
    Raised as P2-4 by the v1.9 fix lens, and before that as RL-11 by the v1.5
    layout lens, where rewriting it was DEFERRED. It should not have been: a
    stale waiver is an inherited defect, and this one outlived four releases.
    THIS WAIVER USED TO SAY "U11.21 IS on the In1 GND plane with 1 direct via
    (vs 3 on the sister EP U2.21)" and carried "Next-rev work order: add a >=4x
    0.3mm via array under BOTH LM5116 EPs". BOTH ARE FALSE ON THIS BOARD.
    MEASURED by exact polygon containment (via centre inside the pad polygon) on
    the sealed v1.9 copper: U2.21 = 7 GND vias, U11.21 = 7 GND vias (3x2 +
    centre, at +-0.85 / +-2.1 mm). THE WORK ORDER IS DONE, and was done some
    revisions ago without ever being marked done — which is exactly how a waiver
    comes to describe a board that no longer exists. Thermal check at the real
    dissipation: the LM5116 internal LDO burns (12.6-7.4) x ~43 mA = 224 mW into
    a 22.1 mm^2 EP with 7 vias, ~8 C rise. A non-issue, now for a MEASURED
    reason instead of an asserted one.
    ---- ALSO COVERED, AND PREVIOUSLY UNNAMED: U3.9 / U4.9 / U5.9, the three
    TPS2557 VSON-8 exposed pads, have EXACTLY 1 via each. They sat inside this
    waiver's blast radius without ever being named in it, against
    02_parts/TPS2557DRBR/part.yaml's own gotcha ("EP needs thermal vias
    (R-THERM; TPS2557-class EPs shipped with zero once)"). Named now, with the
    number that makes them acceptable rather than with silence: at the 2 A port
    budget P = 2^2 x 35 mOhm (rDS(on) max over -40..125 C, SLVS931B) = 140 mW;
    at the guaranteed-non-trip 2.72 A hardware ceiling (nets.yaml VBUS), 259 mW.
    VSON-8 DRB ~48.7 C/W gives 7-13 C onto the F.Cu GND pour the EP sits on.
    ACCEPTABLE, and well below TI's own layout example. NEXT-REV WORK ORDER,
    this one genuinely OPEN: take the three TPS2557 EPs to a >=4x 0.3 mm array
    like the LM5116 EPs already have.
    NB VERIFIED on the v1.2 discrete board (DRC 0/0/0; policy_audit R-THERM WAIVED):
    the flagged pads are the pour-carried FET drains/source above, all fab-legal.
    Re-verified 2026-07-27 on v1.9: DRC 0/0/0, and every via count above is a
    measurement on THIS release's copper, not an inherited sentence.

- id: R-POUR
  why: >
    SNUB_A / SNUB_C are FALSE POSITIVES by MECHANISM, independent of populate
    state. They are the R-C junction mid-nodes of the two SW-node RC snubbers
    (R34+C53 on buck-A, R35+C54 on buck-C). They sit in the SWITCH_NODE netclass
    (>=0.5 mm min_width) only for dV/dt CLEARANCE association with the adjacent SW
    pour island — NOT because they carry trunk current. A snubber mid-node carries
    ONLY the HF damping current through the 1 nF cap (I = C*dV/dt, milliamp-scale),
    NEVER the 7 A switch trunk; that trunk rides the SW pour (net SW_A / SW_C,
    which IS poured). MEASURED span 2.55 mm each (R34.2<->C53.1 / R35.2<->C54.1):
    a sub-3 mm local stub between two side-by-side passives on the SW island,
    directly abutting the poured SW_A/SW_C F.Cu. A pour on a 2-pad R-C junction is
    neither needed nor meaningful. Design intent is DNP/optional-populate (journal
    03_schematic_v1.1 Fix 5; tsx + floorplan comments) — NB: that intent is not yet
    encoded on the board (no doNotPopulate), a separate pre-order BOM finding; the
    waiver holds either way because even fully populated the mid-node carries no
    trunk current. The high-current SWITCH_NODE members SW_A / SW_C are poured.
