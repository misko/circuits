# usb-hub-3s-v3 policy_audit waivers — evidence-backed only.
- id: R-THERM
  why: >
    The R-THERM-flagged power-FET / EP pads are FALSE POSITIVES, adjudicated by
    the zero-context layout red-team (08_reviews/2026-07-22_v1.0_redteam_layout.md,
    verdict ORDER); PROSE UPDATED for the v1.2 FET set (journal
    03_schematic_v1.2). MEASURED: the 4-layer stack has only TWO internal-plane
    nets (In1=GND, In2=VIN), so the power-FET pads on NON-plane nets have NO
    plane to via into — the heuristic (>=2 same-net PLANE vias) is unsatisfiable
    by design. Those pads: Q1.5/VBAT_F (RPP P-FET drain), Q3.5/SW_A (buck-A LS
    drain), Q5.5/SW_C (buck-C LS drain), and — NEW in v1.1/v1.2 — Q6.5/EFINC and
    Q6.1-3/5VC (the AON6354 eFuse reverse-blocking FET: drain on EFINC, source on
    5VC, NEITHER a plane net). Confirmed by control pads Q2.5/Q4.5 (VIN drains)
    which PASS with 3 In2 vias each. Datasheet-Rds dissipation <0.15W each
    (Q1 0.14W, Q3 0.11W, Q5 0.08W, and Q6 3.3mOhm x 5A^2 = 0.083W) into 14.9mm^2
    DFN5x6 pads on 170-390mm^2 pours; dTj ~6-9C. (Q7 = BSS138 SOT-23 signal FET,
    no thermal path — not R-THERM-relevant.) U11.21 (LM5116 buck-C GND EP) IS on
    the In1 GND plane with 1 direct via (vs 3 on the sister EP U2.21 — stitch-grid
    luck from the STANDARD-tier non-ThermalVias footprint swap) PLUS 11 GND vias
    within 5mm; controller-grade ~0.15-0.20W, thermally a non-issue. Next-rev work
    order: add a >=4x 0.3mm via array under BOTH LM5116 EPs. Not a copper defect.
    NB the exact v1.2 flagged-pad list is re-derived at the board regen (this is a
    schematic-stage prose fix; R-THERM is a copper/board-stage check).

- id: R-POUR
  why: >
    SNUB_A / SNUB_C are FALSE POSITIVES by MECHANISM, independent of populate
    state. They are the R-C junction mid-nodes of the two SW-node RC snubbers
    (R34+C53 on buck-A, R35+C54 on buck-C). They sit in the SWITCH_NODE netclass
    (>=0.5 mm min_width) only for dV/dt CLEARANCE association with the adjacent SW
    pour island — NOT because they carry trunk current. A snubber mid-node carries
    ONLY the HF damping current through the 1 nF cap (I = C*dV/dt, milliamp-scale),
    NEVER the 7 A switch trunk; that trunk rides the SW pour (net SW_A / SW_C,
    which IS poured). MEASURED span 2.55 mm each (R34.2<->C53.1 / R35.2<->C54.1):
    a sub-3 mm local stub between two side-by-side passives on the SW island,
    directly abutting the poured SW_A/SW_C F.Cu. A pour on a 2-pad R-C junction is
    neither needed nor meaningful. Design intent is DNP/optional-populate (journal
    03_schematic_v1.1 Fix 5; tsx + floorplan comments) — NB: that intent is not yet
    encoded on the board (no doNotPopulate), a separate pre-order BOM finding; the
    waiver holds either way because even fully populated the mid-node carries no
    trunk current. The high-current SWITCH_NODE members SW_A / SW_C are poured.
