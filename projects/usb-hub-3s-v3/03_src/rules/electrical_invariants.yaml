# usb-hub-3s-v3 — electrical invariants (E-INV / E-ADR).
#
# Emitted by ADR-0001 (drop the PD cell -> plain 5V/5A USB-C + Pi override) and
# re-derived for the v1.2 DISCRETE-PROTECTION redesign (BRIEF A2/D2, user
# decision). Machine-checkable against the exported netlist
# (06_build/netlists/usb_hub_3s_v2.net).
#
# v1.2 DISCRETE redesign: the TPS26631 eFuse (U13) + its OVP/SHDN/dVdT/ILIM
# control passives are DROPPED (over-built for a 5V/5A Pi rail; root cause of the
# routing wall + v1.1's two blockers). The USB-C VBUS is now protected by a simple
# discrete chain reusing the on-BOM FETs:
#
#   5VC (buck-C out) -> Q6 (AON6403 P-FET, reverse-block, ENKILL-gated via Q7)
#                    -> PMID -> F2 (PPTC polyfuse, over-current)
#                    -> VBUSC (protected connector, D5 TVS over-voltage clamp) -> J5
#
# buck-C FB STAYS on LOCAL 5VC (v1.1 fix). buck-C EN is RE-MERGED to ENKILL (the
# eFuse FLT->EN_C un-merge + D6 coupling diode are reverted). The invariants below
# positively assert this chain, so a returning eFuse/PD-PHY (different net on J5
# VBUS, active CC, or a broken reverse-block gate) still breaks them.

invariants:
  # --- #1: J5 USB-C VBUS pads are the PROTECTED connector rail VBUSC ---
  - {assert: pin_on_net, pin: "J5.A4", net: "VBUSC", adr: 0001,
     why: "USB-C VBUS pad A4 is the discretely-protected rail (polyfuse OUT + TVS), not 5VC direct nor a PD-gated node"}
  - {assert: pin_on_net, pin: "J5.B4", net: "VBUSC", adr: 0001,
     why: "USB-C VBUS pad B4 on the protected rail VBUSC"}
  - {assert: pin_on_net, pin: "J5.A9", net: "VBUSC", adr: 0001,
     why: "USB-C VBUS pad A9 on the protected rail VBUSC"}
  - {assert: pin_on_net, pin: "J5.B9", net: "VBUSC", adr: 0001,
     why: "USB-C VBUS pad B9 on the protected rail VBUSC"}

  # --- #2: the discrete protection power path 5VC -> Q6 -> PMID -> F2 -> VBUSC ---
  - {assert: series_chain, chain: ["5VC", "Q6", "PMID", "F2", "VBUSC"],
     through: {Q6: ["5", "1"], F2: ["1", "2"]}, adr: 0002,
     why: "v1.2 discrete VBUS: buck rail 5VC -> AON6403 reverse-block P-FET Q6 (D=pad5 on 5VC, S=pad1 on PMID) -> PPTC polyfuse F2 (pad1 PMID -> pad2 VBUSC) -> protected connector VBUSC. A returning eFuse/PD pass-FET would break this exact chain."}
  - {assert: pin_on_net, pin: "F2.2", net: "VBUSC", adr: 0002,
     why: "polyfuse output is the protected connector rail VBUSC"}

  # --- #3: Q6 reverse-block P-FET is ENABLE-GATED by Q7 off ENKILL ---
  - {assert: pin_on_net, pin: "Q6.5", net: "5VC", adr: 0002,
     why: "Q6 DRAIN (pad5) on 5VC; body diode anode=D=5VC / cathode=S=PMID BLOCKS PMID->5VC reverse back-feed when Q6 is off"}
  - {assert: pin_on_net, pin: "Q6.4", net: "QG", adr: 0002,
     why: "Q6 GATE (pad4) on the gate node QG"}
  - {assert: pin_on_net, pin: "Q7.1", net: "ENKILL", adr: 0002,
     why: "Q7 (BSS138) GATE on ENKILL -> inverter: board ON (ENKILL high) -> Q7 on -> QG low -> Q6 on (forward); master-off -> Q7 off -> Q6 off -> body diode blocks back-feed (RT-T4 OFF-state)"}
  - {assert: pin_on_net, pin: "Q7.3", net: "QG", adr: 0002,
     why: "Q7 DRAIN pulls the Q6 gate node QG to GND when ENKILL is high (enable)"}
  - {assert: pin_on_net, pin: "R30.1", net: "PMID", adr: 0002,
     why: "Q6 gate pull-up R30 to its SOURCE (PMID) -> holds Q6 OFF (Vgs~0) when Q7 is off, so a back-feed keeps the body diode blocking"}
  - {assert: pin_on_net, pin: "R30.2", net: "QG", adr: 0002,
     why: "R30 pulls the gate node QG toward the source (PMID) in the disabled state"}

  # --- #4: over-voltage TVS clamp on the connector rail VBUSC ---
  - {assert: pin_on_net, pin: "D5.1", net: "VBUSC", adr: 0002,
     why: "D5 TVS CATHODE (pad1) on VBUSC -> clamps a buck-fail-high; with F2 upstream, crowbars -> polyfuse trips -> Pi protected (replaces the eFuse OVP cutoff)"}
  - {assert: pin_on_net, pin: "D5.2", net: "GND", adr: 0002,
     why: "D5 TVS anode (pad2) on GND"}
  - {assert: net_has_part, net: "VBUSC", part_type: "diode", adr: 0002,
     why: "VBUSC carries an over-voltage clamp diode (D5 TVS)"}

  # --- #5: buck-C FB senses LOCAL 5VC, NOT a post-protection node (v1.1 fix, kept) ---
  - {assert: pin_on_net, pin: "R12.1", net: "5VC", adr: 0001,
     why: "buck-C FB-top (R12) senses the LOCAL 5VC buck output (v1.1 runaway fix) -> 5VC unconditionally regulated; a return to connector-sense would put R12.1 on VBUSC and break this"}

  # --- #6: CC1/CC2 each terminate on a passive Rp pull-up to the protected rail ---
  - {assert: pin_on_net, pin: "R28.1", net: "CC1", adr: 0001,
     why: "CC1 Rp pull-up (source-present advertisement) lands on CC1"}
  - {assert: pin_on_net, pin: "R28.2", net: "VBUSC", adr: 0001,
     why: "CC1 Rp pulls up to the protected 5V source rail (VBUSC)"}
  - {assert: pin_on_net, pin: "R29.1", net: "CC2", adr: 0001,
     why: "CC2 Rp pull-up lands on CC2"}
  - {assert: pin_on_net, pin: "R29.2", net: "VBUSC", adr: 0001,
     why: "CC2 Rp pulls up to the protected 5V source rail (VBUSC)"}
  - {assert: net_has_part, net: "CC1", part_type: "resistor", adr: 0001,
     why: "CC1 carries a passive Rp resistor, not a PD-controller CC driver"}

  # --- #7: MASTER-OFF merges both LM5116 EN pins onto ENKILL (EN_C un-merge reverted) ---
  - {assert: pin_on_net, pin: "U2.4", net: "ENKILL", adr: 0001,
     why: "buck-A EN on the master-off bus (SW1 grounds it -> both bucks off + Q6 gate opens)"}
  - {assert: pin_on_net, pin: "U11.4", net: "ENKILL", adr: 0001,
     why: "buck-C EN re-merged onto ENKILL (the eFuse-era EN_C un-merge is reverted; no per-buck fault flag exists in the discrete design)"}
  - {assert: pin_on_net, pin: "SW1.2", net: "ENKILL", adr: 0001,
     why: "master switch COM on ENKILL -> grounding it shuts both bucks AND opens Q6 (Q7 off -> Q6 off -> VBUS isolated + back-feed blocked)"}
