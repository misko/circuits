# usb-hub-3s-v3 — electrical invariants (E-INV / E-ADR).
#
# Emitted by ADR-0001 (drop the PD cell -> plain 5V/5A USB-C + Pi override) and
# re-derived for the v1.2 DISCRETE-PROTECTION redesign (BRIEF A2/D2, user
# decision). Machine-checkable against the exported netlist
# (06_build/netlists/usb_hub_3s_v2.net).
#
# v1.2 DISCRETE redesign: the TPS26631 eFuse (U13) + its OVP/SHDN/dVdT/ILIM
# control passives are DROPPED (over-built for a 5V/5A Pi rail; root cause of the
# routing wall + v1.1's two blockers). The USB-C VBUS is now protected by a simple
# discrete chain reusing the on-BOM FETs:
#
#   5VC (buck-C out) -> Q6 (AON6403 P-FET, reverse-block, ENKILL-gated via Q7)
#                    -> PMID -> F2 (PPTC polyfuse, over-current)
#                    -> VBUSC (protected connector, D5 TVS over-voltage clamp) -> J5
#
# buck-C FB STAYS on LOCAL 5VC (v1.1 fix). buck-C EN is RE-MERGED to ENKILL (the
# eFuse FLT->EN_C un-merge + D6 coupling diode are reverted). The invariants below
# positively assert this chain, so a returning eFuse/PD-PHY (different net on J5
# VBUS, active CC, or a broken reverse-block gate) still breaks them.

invariants:
  # --- #1: J5 USB-C VBUS pads are the PROTECTED connector rail VBUSC ---
  - {assert: pin_on_net, pin: "J5.A4", net: "VBUSC", adr: 0001,
     why: "USB-C VBUS pad A4 is the discretely-protected rail (polyfuse OUT + TVS), not 5VC direct nor a PD-gated node"}
  - {assert: pin_on_net, pin: "J5.B4", net: "VBUSC", adr: 0001,
     why: "USB-C VBUS pad B4 on the protected rail VBUSC"}
  - {assert: pin_on_net, pin: "J5.A9", net: "VBUSC", adr: 0001,
     why: "USB-C VBUS pad A9 on the protected rail VBUSC"}
  - {assert: pin_on_net, pin: "J5.B9", net: "VBUSC", adr: 0001,
     why: "USB-C VBUS pad B9 on the protected rail VBUSC"}

  # --- #2: the discrete protection power path 5VC -> Q6 -> PMID -> F2 -> VBUSC ---
  - {assert: series_chain, chain: ["5VC", "Q6", "PMID", "F2", "VBUSC"],
     through: {Q6: ["5", "1"], F2: ["1", "2"]}, adr: 0002,
     why: "v1.2 discrete VBUS: buck rail 5VC -> AON6403 reverse-block P-FET Q6 (D=pad5 on 5VC, S=pad1 on PMID) -> PPTC polyfuse F2 (pad1 PMID -> pad2 VBUSC) -> protected connector VBUSC. A returning eFuse/PD pass-FET would break this exact chain."}
  - {assert: pin_on_net, pin: "F2.2", net: "VBUSC", adr: 0002,
     why: "polyfuse output is the protected connector rail VBUSC"}

  # --- #3: Q6 reverse-block P-FET is ENABLE-GATED by Q7 off ENKILL ---
  - {assert: pin_on_net, pin: "Q6.5", net: "5VC", adr: 0002,
     why: "Q6 DRAIN (pad5) on 5VC; body diode anode=D=5VC / cathode=S=PMID BLOCKS PMID->5VC reverse back-feed when Q6 is off"}
  - {assert: pin_on_net, pin: "Q6.4", net: "QG", adr: 0002,
     why: "Q6 GATE (pad4) on the gate node QG"}
  - {assert: pin_on_net, pin: "Q7.1", net: "ENKILL", adr: 0002,
     why: "Q7 (BSS138) GATE on ENKILL -> inverter: board ON (ENKILL high) -> Q7 on -> QG low -> Q6 on (forward); master-off -> Q7 off -> Q6 off -> body diode blocks back-feed (RT-T4 OFF-state)"}
  - {assert: pin_on_net, pin: "Q7.3", net: "QG", adr: 0002,
     why: "Q7 DRAIN pulls the Q6 gate node QG to GND when ENKILL is high (enable)"}
  - {assert: pin_on_net, pin: "R30.1", net: "PMID", adr: 0002,
     why: "Q6 gate pull-up R30 to its SOURCE (PMID) -> holds Q6 OFF (Vgs~0) when Q7 is off, so a back-feed keeps the body diode blocking"}
  - {assert: pin_on_net, pin: "R30.2", net: "QG", adr: 0002,
     why: "R30 pulls the gate node QG toward the source (PMID) in the disabled state"}

  # --- #4: over-voltage TVS clamp on the connector rail VBUSC ---
  - {assert: pin_on_net, pin: "D5.1", net: "VBUSC", adr: 0002,
     why: "D5 TVS CATHODE (pad1) on VBUSC -> clamps a buck-fail-high; with F2 upstream, crowbars -> polyfuse trips (SECONDARY/best-effort OV mitigation, NOT a guaranteed fail-high cutoff -- ADR-0002 honest limitation; replaces the eFuse OVP)"}
  - {assert: pin_on_net, pin: "D5.2", net: "GND", adr: 0002,
     why: "D5 TVS anode (pad2) on GND"}
  - {assert: net_has_part, net: "VBUSC", part_type: "diode", adr: 0002,
     why: "VBUSC carries an over-voltage clamp diode (D5 TVS)"}

  # --- #5: buck-C FB senses LOCAL 5VC, NOT a post-protection node (v1.1 fix, kept) ---
  - {assert: pin_on_net, pin: "R12.1", net: "5VC", adr: 0001,
     why: "buck-C FB-top (R12) senses the LOCAL 5VC buck output (v1.1 runaway fix) -> 5VC unconditionally regulated; a return to connector-sense would put R12.1 on VBUSC and break this"}

  # --- #6: CC1/CC2 each terminate on a passive Rp pull-up to the protected rail ---
  - {assert: pin_on_net, pin: "R28.1", net: "CC1", adr: 0001,
     why: "CC1 Rp pull-up (source-present advertisement) lands on CC1"}
  - {assert: pin_on_net, pin: "R28.2", net: "VBUSC", adr: 0001,
     why: "CC1 Rp pulls up to the protected 5V source rail (VBUSC)"}
  - {assert: pin_on_net, pin: "R29.1", net: "CC2", adr: 0001,
     why: "CC2 Rp pull-up lands on CC2"}
  - {assert: pin_on_net, pin: "R29.2", net: "VBUSC", adr: 0001,
     why: "CC2 Rp pulls up to the protected 5V source rail (VBUSC)"}
  - {assert: net_has_part, net: "CC1", part_type: "resistor", adr: 0001,
     why: "CC1 carries a passive Rp resistor, not a PD-controller CC driver"}

  # --- #6b: v1.6 STATUS-LED cell — the parts, the tap points, AND THE VALUES ---
  # An invariant that pins EXISTENCE does not pin VALUE (cooksense, 2026-07-25:
  # a watchdog pull-down existed, passed three E-INV assertions, and was 100k
  # instead of 1k, which silently disabled the watchdog). This board has already
  # been bitten twice by the same class through a different door -- R12 shipped
  # as 3.74k when the design said 4.12k, R30 as 3.09k when the design said 100k --
  # both times because a bare value string was resolved by the toolchain and
  # nobody asserted the number. So the ballasts are asserted, not just placed.
  - {assert: part_value, part: R37, equals: 6.98k, tolerance_pct: 2, adr: 0003,
     why: "pack-LED ballast. Sets the ONLY current this board draws while switched
       OFF that is not a leakage: (VIN - Vf)/R37, 0.946-1.547 mA over VIN 9.0-12.6 V
       x Vf 1.8-2.4 V. Drop it to 698R by accident and the pack LED pulls 15 mA,
       which is 55x the entire declared 271 uA OFF-state budget and flattens a 3S
       5000 mAh pack in under 12 days. 6.98k also keeps R37 at 15.8 mW = 16% of the
       0603 0.1 W rating at the 12.6 V corner."}
  - {assert: part_value, part: R38, equals: 6.98k, tolerance_pct: 2, adr: 0003,
     why: "USB-A port 1 indicator ballast: 0.282-0.377 mA from VBUSA1, negligible
       against the port's 2 A budget. A wrong value here either kills the indicator
       or loads the port rail."}
  - {assert: part_value, part: R39, equals: 6.98k, tolerance_pct: 2, adr: 0003,
     why: "USB-A port 2 indicator ballast; see R38."}
  - {assert: part_value, part: R40, equals: 6.98k, tolerance_pct: 2, adr: 0003,
     why: "USB-A port 3 indicator ballast; see R38."}
  - {assert: part_value, part: R41, equals: 6.98k, tolerance_pct: 2, adr: 0003,
     why: "USB-C indicator ballast on VBUSC. This one is on the 15 mV E-MARGIN rail,
       so its value is also a margin statement: at 6.98k the LED costs
       0.346 mA x 42.4 mOhm = 14.7 uV = 0.098% of the slack. At 698R it would cost
       147 uV and at 69.8R 1.47 mV -- still small, but the whole point of asserting
       it is that nobody has to re-derive that to know it is safe."}
  - {assert: pin_on_net, pin: "Q8.1", net: "ENKILL", adr: 0003,
     why: "the pack LED is FET-GATED, and this pin is the entire reason it is safe.
       SW1 switches ENABLE, not power (SW1 pads are GND / ENKILL / NC; neither VBAT
       nor VBAT_F reaches a switch pole), so there is NO switched node to tap and an
       ungated pack LED sits across a permanently hot VIN. Q8's gate on ENKILL is
       what makes master-off actually dark: 1.504 mA -> <=0.5 uA."}
  - {assert: pin_on_net, pin: "Q8.2", net: "GND", adr: 0003,
     why: "Q8 is LOW-SIDE (source to GND). A high-side arrangement would need a
       P-FET referenced to VIN and would not turn fully off from a 0-12.6 V ENKILL."}
  - {assert: pin_on_net, pin: "D8.1", net: "LEDPKK", adr: 0003,
     why: "pack-LED CATHODE (pad 1) on the Q8 drain. Asserted because a reversed
       indicator LED never lights and is indistinguishable from a dry joint -- and
       JLC numbers this part's pad 1 as the ANODE, the opposite of KiCad, so the
       reversal is one silent table row away."}
  - {assert: pin_on_net, pin: "R41.1", net: "VBUSC", adr: 0003,
     why: "the USB-C indicator taps the PROTECTED rail (post Q6, post F2), NOT 5VC.
       This is the difference between an LED that says 'the buck is running' and one
       that says 'the ADR-0002 protection chain is intact'. If this pin ever moves to
       5VC the indicator stops being able to report the fault it exists to report."}
  - {assert: pin_on_net, pin: "R38.1", net: "VBUSA1", adr: 0003,
     why: "PER-PORT indication is tapped POST-TPS2557. On 5VA instead, a port that
       had latched off into current limit would look identical to a working one --
       which is the whole reason there are three of these and not one."}
  - {assert: pin_on_net, pin: "R39.1", net: "VBUSA2", adr: 0003, why: "see R38.1"}
  - {assert: pin_on_net, pin: "R40.1", net: "VBUSA3", adr: 0003, why: "see R38.1"}

  # --- #6c: v1.6 DNP setpoint-trim strap R42 — PIN THE VALUE ---
  - {assert: part_value, part: R42, equals: 160k, tolerance_pct: 5, adr: 0004,
     why: "R42 is a DNP strap in PARALLEL with R12 (the buck-C FB top, 4.12k). Its
       VALUE is the entire specification -- it does nothing until someone fits it,
       and then it sets the rail. 160k gives Rtop 4.017k -> 5.249 V, landing on
       U12's 5.25 V V_RWM. A 'helpful' substitution is a rail error, and the error
       is NOT gentle because the parallel combination is nonlinear in the strap:
       16k would give Rtop 3.271k -> 4.500 V, straight through the Pi 4's 4.63 V
       undervoltage threshold and into a board that browns out at no load. Pinned
       here so the number survives the next person's tidy-up."}
  - {assert: pin_on_net, pin: "R42.1", net: "5VC", adr: 0004,
     why: "the trim must sit ACROSS THE FB TOP (5VC to FB_C), never in series with
       the rail. A series resistor has the wrong transfer function: over-voltage is
       a light-load phenomenon and IR drop is a heavy-load one, so a series part
       does nothing at 0 A -- the exact case it would be added for -- and removes
       voltage at full load when the rail is already lowest. This assert is what
       stops the idea coming back as copper."}
  - {assert: pin_on_net, pin: "R42.2", net: "FB_C", adr: 0004,
     why: "the strap's low side lands on the buck-C feedback node, in parallel with
       R12; that is what makes the trim load-INDEPENDENT and free of dissipation."}

  # --- #7: MASTER-OFF merges both LM5116 EN pins onto ENKILL (EN_C un-merge reverted) ---
  - {assert: pin_on_net, pin: "U2.4", net: "ENKILL", adr: 0001,
     why: "buck-A EN on the master-off bus (SW1 grounds it -> both bucks off + Q6 gate opens)"}
  - {assert: pin_on_net, pin: "U11.4", net: "ENKILL", adr: 0001,
     why: "buck-C EN re-merged onto ENKILL (the eFuse-era EN_C un-merge is reverted; no per-buck fault flag exists in the discrete design)"}
  - {assert: pin_on_net, pin: "SW1.2", net: "ENKILL", adr: 0001,
     why: "master switch COM on ENKILL -> grounding it shuts both bucks AND opens Q6 (Q7 off -> Q6 off -> VBUS isolated + back-feed blocked)"}
