# usb-hub-3s-v3 net architecture — netclasses + DRU floors source.
#
# fab_tier = STANDARD (jlc_4layer_standard). v3 = v2 MINUS the PD cell (ADR-0001):
# the ONLY part that forced advanced tier was the TPS25740A VQFN-24 0.5mm (via-in-
# pad escape), now GONE. escape_check grades every remaining part at
# jlc_2layer_default; the board stays 4-layer only for the GND/VIN planes, at
# STANDARD copper rules (0.127 track/space, 0.45/0.3 vias, no POFV). The USB-C
# port is a plain 5V/5A rail (J5 VBUS poured on 5VC) — no fine-pitch escape.
fab_tier: jlc_4layer_standard

classes:
  SWITCH_NODE:
    intent: >
      The two buck switch nodes SW_A / SW_C (HS drain -> inductor). High dV/dt;
      trunk current rides the F.Cu pour islands, the floor is the backstop for
      any routed segment. Keep loop area minimal.
    nets: [SW_A, SW_C, SNUB_A, SNUB_C]   # v1.1: + optional RC-snubber mid-nodes
    current: "7 A pulsed"
    min_width: 0.6mm   # switch current rides the F.Cu SW pour island; the only
                       # routed SW track is the LM5116 SW-pin driver-return stub
    clearance: 0.15mm
    routing: pours (floorplan islands); KRT only for short joins
    verify: DRC floor + R-THERM

  PWR_IN:
    intent: >
      Battery input trunk: XT60 -> fuse -> reverse-polarity P-FET -> VIN, then
      fanned to BOTH buck inputs. Worst case ~7 A at 9.0 V (E-TOPO derived:
      55 W / 0.9 / 9 V = 6.8 A). Trunk = F.Cu pour + In2 VIN plane; the floor
      backstops short routed stubs. (v1 carried 15.5 A here for the buck-boost.)
    nets: [VBAT, VBAT_F, VIN]
    current: "7 A worst case"
    min_width: 0.6mm
    clearance: 0.15mm
    routing: pours + In2 plane; pad_rescue vias drop VIN pads to In2
    verify: DRC floor

  PWR_RAIL:
    intent: >
      Buck output trunks: 5VA (6 A) and 5VC (5 A). Pour-fed (floorplan
      islands); floor is the backstop.
    nets: [5VA, 5VC, VBUSC, PMID]   # 5VA/5VC authored N5VA/N5VC (N-guard stripped).
                                    # v1.2 discrete: VBUSC = protected USB-C VBUS (5A,
                                    # F2 out); PMID = Q6.S -> F2 node (5A short, pour-fed)
    current: "6 A / 5 A"
    min_width: 0.4mm   # POUR-carried power; the only routed 5VA/5VC tracks are
                       # Kelvin VOUT/FB sense stubs (no current) -> 0.4 backstop
    clearance: 0.13mm  # v1.2: was 0.15; the power TRUNKS ride pours, the only
                       # ROUTED PWR_RAIL copper is quiet FB/VOUT sense stubs +
                       # link vias -> 0.13 (= the signal classes, >= STANDARD
                       # 0.127 fab floor) is correct & clears the fab-legal
                       # sense-stub margin items (5V, no creepage concern)
    routing: pours
    verify: DRC floor

  VBUS:
    intent: >
      Port power: three limited USB-A VBUS nets (2 A cont / 2.5 A burst limit
      each). The USB-C VBUS is VBUSC in v1.1 (the eFuse-PROTECTED 5A rail, in
      PWR_RAIL), no longer 5VC direct. Pour-fed.
    nets: [VBUSA1, VBUSA2, VBUSA3]
    current: "2.5 A"
    min_width: 0.5mm
    clearance: 0.15mm
    routing: pours
    verify: DRC floor

  GATE:
    intent: >
      Gate drives + bootstraps for the 4 buck FETs (LM5116 HO/LO/HB pairs, both
      bucks). Amps of pulse current, short runs.
    nets: [HO_A, LO_A, BOOT_A, HO_C, LO_C, BOOT_C]   # v1.2: eFuse reverse-block
           # gate nets (BGATEC/DRVC) removed with the eFuse
    current: "gate pulses (~2 A pk)"
    min_width: 0.3mm
    clearance: 0.13mm  # >= STANDARD tier min_space 0.127
    routing: KRT (short, same-layer preferred)
    verify: DRC floor

  SENSE:
    intent: >
      Kelvin current-sense + control analog for both bucks: CS/CSG kelvin,
      FB/COMP/RAMP/RT/SS, UVLO/EN dividers. Route sense as pairs off the shunt
      ends; never share trunk copper.
    nets: [CS_A, CSF_A, CSGF_A, FB_A, COMP_A, CMZ_A, RAMP_A, RT_A, SS_A,
           UVLO_A, VCC_A,
           CS_C, CSF_C, CSGF_C, FB_C, COMP_C, CMZ_C, RAMP_C, RT_C, SS_C,
           UVLO_C, VCC_C,
           ENKILL,                       # v1.2: master-off EN bus (SW1.COM -> both bucks' EN + Q7 gate)
           QG]                           # v1.2: Q6 P-FET gate node (Q7.D + R30 pull-up); slow DC gate control
    current: "<50 mA"
    min_width: 0.2mm
    clearance: 0.13mm  # >= STANDARD tier min_space 0.127
    routing: KRT
    verify: DRC floor + pin review

  USB_DATA:
    intent: >
      Port data / CC: DCP advertisement lines (TPS2513), C-port D+/D- and
      CC1/CC2 (PD BMC). Short, paired, ESD at the connector.
    nets: [DP_A1, DM_A1, DP_A2, DM_A2, DP_A3, DM_A3, DPC, DMC, CC1, CC2]
    current: signal
    min_width: 0.15mm   # J5 USB-C 0.5mm-pitch escapes need 0.15 (KRT waves still 0.2)
    clearance: 0.13mm  # >= STANDARD tier min_space 0.127
    routing: KRT
    verify: DRC floor + render review

  # AUX_5V and PD_NET classes removed with the PD cell (v3, ADR-0001): their nets
  # (VCONN/VCC_PD/EN_PD, HIPWR/PSEL/VAUX/DVDD/VTX/DSCG_N/GDNG/PDGATE/RSNS/PDSRC)
  # no longer exist. The USB-C CC1/CC2 sense lines are in USB_DATA below.

  NC_PADS:
    intent: >
      Sanctioned no-connect pads (NC-flagged pins). Grades NC pads at the class
      clearance instead of Default's 0.2.
    nets: ["unconnected-*"]
    current: none
    min_width: 0.2mm
    clearance: 0.13mm  # >= STANDARD tier min_space 0.127
    routing: none (no copper)
    verify: S4 no_connect flags

  GND_RET:
    intent: >
      GND return: pours + In1 plane + stitch vias own the copper; the class
      grades GND copper at the tier clearance so signal vias route legally next
      to GND stitch copper.
    nets: [GND]
    current: "return (planes)"
    min_width: 0.25mm
    clearance: 0.13mm  # >= STANDARD tier min_space 0.127
    routing: pours + stitch
    verify: DRC unconnected gate
