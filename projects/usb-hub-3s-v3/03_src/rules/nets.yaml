# usb-hub-3s-v3 net architecture — netclasses + DRU floors source.
#
# fab_tier = STANDARD (jlc_4layer_standard). v3 = v2 MINUS the PD cell (ADR-0001):
# the ONLY part that forced advanced tier was the TPS25740A VQFN-24 0.5mm (via-in-
# pad escape), now GONE. escape_check grades every remaining part at
# jlc_2layer_default; the board stays 4-layer only for the GND/VIN planes, at
# STANDARD copper rules (0.127 track/space, 0.45/0.3 vias, no POFV). The USB-C
# port is a plain 5V/5A rail (J5 VBUS poured on 5VC) — no fine-pitch escape.
fab_tier: jlc_4layer_standard

# v1.6, from the tier-preflight gate PF-RULES-CLR (a gate that did not exist when
# v1.5 sealed). Without this line the Default netclass silently rode
# generate_rules' HARDCODED 0.2 mm clearance while route.yaml routes at 0.18 mm --
# i.e. the router was free to lay copper under a DRC floor nobody had declared,
# and the only reason v1.5 got away with it is that every net on this board
# happens to be in an explicit class. Declared at 0.18 mm to MATCH the router
# (>= the STANDARD tier min_space of 0.127 mm) so the two can no longer disagree.
default_clearance: 0.18mm

# ---- SCOPED FLOOR: the one place the v1.6 VBUS 0.8 mm floor cannot be met ----
# MEASURED on sealed v1.5, per port: VBUSA{1,2,3} each carry EXACTLY TWO routed
# segments and nothing else --
#     13.554 mm of 0.500 mm on B.Cu  (TPS2557 OUT -> the port pour: the ampacity
#                                     case, and the reason the floor goes to 0.8)
#      0.650 mm of 0.500 mm on F.Cu  (the intra-chip OUT1<->OUT2 bond)
# The second one CANNOT be widened. U3/U4/U5 are TPS2557 VSON-8 on a 0.650 mm
# pitch; OUT1 (pin 6) and OUT2 (pin 7) are 0.650 mm apart with ILIM (pin 5) and
# FAULT (pin 8) flanking them at the same pitch. An 0.8 mm track between pins 6
# and 7 has round caps reaching y +-0.725 mm from centre, against pin 5's pad
# edge at 0.800 mm -- a 0.075 mm gap versus the VBUS class clearance of 0.150 mm.
# The geometry is not tight, it is IMPOSSIBLE: the track is wider than the pitch.
# So the floor is relaxed to 0.500 mm ONLY inside three 2.0 x 3.0 mm rule areas
# pinned to those three pin pairs, and ONLY for the three VBUSA nets. Ampacity
# consequence, stated rather than waved past: 2 A through 0.500 mm of 1 oz outer
# copper over a 0.650 mm span between two 0.8 x 0.35 mm copper pads, which are
# themselves the heat sink. IPC-2152's ~22 C figure is a STEADY-STATE, long-trace
# number; it does not apply to a 0.65 mm segment terminated on copper at both
# ends. The 13.554 mm run, where it DOES apply, is what goes to 0.8 mm.
scoped_floors:
  - zone: usba_out_bond
    nets: [VBUSA1, VBUSA2, VBUSA3]
    min_width: 0.5mm
    why: >
      MEASURED 2026-07-25 on the sealed v1.5 board. TPS2557 VSON-8 pitch is
      0.650 mm; an 0.8 mm track from OUT1 (pin 6) to OUT2 (pin 7) leaves 0.075 mm
      to the flanking ILIM (pin 5) and FAULT (pin 8) pads against a 0.150 mm class
      clearance, so the width the class demands cannot physically exist there.
      Scope is three 2.0 x 3.0 mm F.Cu rule areas over exactly those pin pairs and
      only the three VBUSA nets; the 13.554 mm B.Cu port feed -- the segment the
      0.8 mm floor exists for -- is entirely OUTSIDE the relaxation and carries
      the full new width.

classes:
  SWITCH_NODE:
    intent: >
      The two buck switch nodes SW_A / SW_C (HS drain -> inductor). High dV/dt;
      trunk current rides the F.Cu pour islands, the floor is the backstop for
      any routed segment. Keep loop area minimal.
    nets: [SW_A, SW_C, SNUB_A, SNUB_C]   # v1.1: + optional RC-snubber mid-nodes
    current: "7 A pulsed"
    min_width: 0.6mm   # switch current rides the F.Cu SW pour island; the only
                       # routed SW track is the LM5116 SW-pin driver-return stub
    clearance: 0.15mm
    routing: pours (floorplan islands); KRT only for short joins
    verify: DRC floor + R-THERM

  PWR_IN:
    intent: >
      Battery input trunk: XT60 -> fuse -> reverse-polarity P-FET -> VIN, then
      fanned to BOTH buck inputs. Worst case ~7 A at 9.0 V (E-TOPO derived:
      55 W / 0.9 / 9 V = 6.8 A). Trunk = F.Cu pour + In2 VIN plane; the floor
      backstops short routed stubs. (v1 carried 15.5 A here for the buck-boost.)
    nets: [VBAT, VBAT_F, VIN]
    current: "7 A worst case"
    min_width: 0.6mm
    clearance: 0.15mm
    routing: pours + In2 plane; pad_rescue vias drop VIN pads to In2
    verify: DRC floor

  PWR_RAIL:
    intent: >
      Buck output trunks: 5VA (6 A) and 5VC (5 A). Pour-fed (floorplan
      islands); floor is the backstop.
    nets: [5VA, 5VC, VBUSC, PMID]   # 5VA/5VC authored N5VA/N5VC (N-guard stripped).
                                    # v1.2 discrete: VBUSC = protected USB-C VBUS (5A,
                                    # F2 out); PMID = Q6.S -> F2 node (5A short, pour-fed)
    current: "6 A / 5 A"
    min_width: 0.4mm   # POUR-carried power; the only routed 5VA/5VC tracks are
                       # Kelvin VOUT/FB sense stubs (no current) -> 0.4 backstop
    clearance: 0.13mm  # v1.2: was 0.15; the power TRUNKS ride pours, the only
                       # ROUTED PWR_RAIL copper is quiet FB/VOUT sense stubs +
                       # link vias -> 0.13 (= the signal classes, >= STANDARD
                       # 0.127 fab floor) is correct & clears the fab-legal
                       # sense-stub margin items (5V, no creepage concern)
    routing: pours
    verify: DRC floor

  VBUS:
    intent: >
      Port power: three limited USB-A VBUS nets (2 A cont / 2.5 A burst limit
      each). The USB-C VBUS is VBUSC in v1.1 (the eFuse-PROTECTED 5A rail, in
      PWR_RAIL), no longer 5VC direct. Pour-fed.
    nets: [VBUSA1, VBUSA2, VBUSA3]
    current: "2.5 A"
    # v1.6 AMPACITY FIX 0.5 -> 0.8 mm. "pours" above was true of the CONNECTOR
    # end and false of the feed: MEASURED on the sealed v1.5 board, each of
    # VBUSA1/2/3 runs a ROUTED track from its TPS2557 OUT pin east to the port
    # pour, and every one of those tracks sits at EXACTLY the old 0.5 mm class
    # floor -- i.e. the floor was not a backstop here, it was the design.
    # 2 A continuous through 0.5 mm of 1 oz OUTER copper is ~22 C rise
    # (IPC-2152 external, 0.0331 mm^2); 0.8 mm halves the current density and
    # brings it to ~11 C. The port limit is 2 A continuous / 2.5 A burst set by
    # R20/R21/R22 = 36.5 k on the TPS2557 ILIM pin, so 2 A is not a peak, it is
    # the steady state a charging phone actually draws.
    min_width: 0.8mm
    clearance: 0.15mm
    routing: pours + a routed OUT-pin feed per port (see scoped_floors)
    verify: DRC floor

  INDICATOR:
    intent: >
      v1.6 status-LED cell: the four ballast->LED links (LEDVA1/2/3, LEDVC) and
      the ENKILL-gated pack-LED return pair (LEDPK, LEDPKK). Sub-milliamp DC,
      no dV/dt, no analog reference, no Kelvin obligation.
      DELIBERATELY NOT FOLDED INTO SENSE. SENSE's stated intent is Kelvin
      current-sense and buck control analog ("never share trunk copper"); an
      indicator net has none of those duties and inheriting them would make the
      class intent a lie for six nets. Keeping them separate also means the LED
      copper shows up as its own population in the DRC classification instead of
      hiding inside the 22-net SENSE group.
    nets: [LEDPK, LEDPKK, LEDVA1, LEDVA2, LEDVA3, LEDVC]
    current: "<1.6 mA (pack LED 0.946-1.547 mA; rail LEDs 0.275-0.405 mA)"
    min_width: 0.2mm
    clearance: 0.13mm  # >= STANDARD tier min_space 0.127
    routing: KRT
    verify: DRC floor

  GATE:
    intent: >
      Gate drives + bootstraps for the 4 buck FETs (LM5116 HO/LO/HB pairs, both
      bucks). Amps of pulse current, short runs.
    nets: [HO_A, LO_A, BOOT_A, HO_C, LO_C, BOOT_C]   # v1.2: eFuse reverse-block
           # gate nets (BGATEC/DRVC) removed with the eFuse
    current: "gate pulses (~2 A pk)"
    min_width: 0.3mm
    clearance: 0.13mm  # >= STANDARD tier min_space 0.127
    routing: KRT (short, same-layer preferred)
    verify: DRC floor

  SENSE:
    intent: >
      Kelvin current-sense + control analog for both bucks: CS/CSG kelvin,
      FB/COMP/RAMP/RT/SS, UVLO/EN dividers. Route sense as pairs off the shunt
      ends; never share trunk copper.
    nets: [CS_A, CSF_A, CSGF_A, FB_A, COMP_A, CMZ_A, RAMP_A, RT_A, SS_A,
           UVLO_A, VCC_A,
           CS_C, CSF_C, CSGF_C, FB_C, COMP_C, CMZ_C, RAMP_C, RT_C, SS_C,
           UVLO_C, VCC_C,
           ENKILL,                       # v1.2: master-off EN bus (SW1.COM -> both bucks' EN + Q7 gate)
           QG]                           # v1.2: Q6 P-FET gate node (Q7.D + R30 pull-up); slow DC gate control
    current: "<50 mA"
    min_width: 0.2mm
    clearance: 0.13mm  # >= STANDARD tier min_space 0.127
    routing: KRT
    verify: DRC floor + pin review

  USB_DATA:
    intent: >
      Port data / CC: DCP advertisement lines (TPS2513), C-port D+/D- and
      CC1/CC2 (PD BMC). Short, paired, ESD at the connector.
    nets: [DP_A1, DM_A1, DP_A2, DM_A2, DP_A3, DM_A3, DPC, DMC, CC1, CC2]
    current: signal
    min_width: 0.15mm   # J5 USB-C 0.5mm-pitch escapes need 0.15 (KRT waves still 0.2)
    clearance: 0.13mm  # >= STANDARD tier min_space 0.127
    routing: KRT
    verify: DRC floor + render review

  # AUX_5V and PD_NET classes removed with the PD cell (v3, ADR-0001): their nets
  # (VCONN/VCC_PD/EN_PD, HIPWR/PSEL/VAUX/DVDD/VTX/DSCG_N/GDNG/PDGATE/RSNS/PDSRC)
  # no longer exist. The USB-C CC1/CC2 sense lines are in USB_DATA below.

  NC_PADS:
    intent: >
      Sanctioned no-connect pads (NC-flagged pins). Grades NC pads at the class
      clearance instead of Default's 0.2.
    nets: ["unconnected-*"]
    current: none
    min_width: 0.2mm
    clearance: 0.13mm  # >= STANDARD tier min_space 0.127
    routing: none (no copper)
    verify: S4 no_connect flags

  GND_RET:
    intent: >
      GND return: pours + In1 plane + stitch vias own the copper; the class
      grades GND copper at the tier clearance so signal vias route legally next
      to GND stitch copper.
    nets: [GND]
    current: "return (planes)"
    min_width: 0.25mm
    clearance: 0.13mm  # >= STANDARD tier min_space 0.127
    routing: pours + stitch
    verify: DRC unconnected gate
