  # pd_escape corridor removed with the PD cell (v3). The buck sense areas remain
  # (permissive DRU anchors; the bucks are unchanged).
  - {name: buckA_sense, deny: [], layers: [F.Cu, B.Cu], rect: [50.0, 22.0, 92.0, 50.0]}
  - {name: buckC_sense, deny: [], layers: [F.Cu, B.Cu], rect: [50.0, 60.0, 92.0, 88.0]}

  # ---- v1.6: keep the 9-12.6 V In2 VIN PLANE off every mounting drill ----
  # MEASURED on sealed v1.5: In2.Cu VIN reaches r = 1.850 mm at ALL FOUR holes
  # (H3 1.851, faceting noise) against a 1.600 mm drill = 0.250 mm of laminate.
  # JLC's NPTH position tolerance is +-0.13 mm and the drill itself wanders; a
  # 0.250 mm standoff to a 12.6 V plane, buried where no inspection will ever see
  # it, is a screw-shank short waiting for a slightly deep hole. GND on In1 at the
  # same radius is deliberately LEFT ALONE: a grounded fastener touching GND is
  # the benign case, and thinning the return plane would cost more than it buys.
  # 12-gon, circumradius 2.150 -> inradius 2.077 mm, so VIN copper stops at
  # >= 2.077 mm (0.477 mm of laminate, 1.9x the old figure) for a ~14 mm^2 bite
  # out of an 11310 mm^2 plane per hole.
  - {name: hole_vin_H1, deny: [pours], layers: [In2.Cu],
     points: [[28.150, 26.000], [27.862, 27.075], [27.075, 27.862], [26.000, 28.150],
