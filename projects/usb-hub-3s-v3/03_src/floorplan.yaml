# usb-hub-3s-v3 floorplan — input for skills/kicad-pcb/scripts/generate_board_generic.py
# (board name stays usb_hub_3s_v2 for source continuity; v3 = v2 MINUS the PD cell)
#
# power-hub ARCHETYPE (references/floorplan-archetypes.md). The v2 win: 4
# SELF-CONTAINED cells, NO shared hot loop (v1's IP6559 buck-boost is gone).
#   - Input protection  : west column (XT60 -> F1 -> revpol P-FET Q1 -> VIN)
#   - Buck A (LM5116)    : north band -> 5VA (USB-A rail, <=6 A)
#   - Buck C (LM5116)    : south band -> 5VC (USB-C VBUS rail, <=5 A)  [IDENTICAL to A]
#   - USB-A x3           : east column (TPS2557 + USBLC6 + KH-AF90DIP, mouths east)
#   - USB-C port         : south-east (v3: PLAIN 5V/5A — J5 + U12 ESD + CC Rp; NO PD)
# 4-layer: In1 = GND plane, In2 = VIN plane. Board 130 x 92 (roomy on purpose).
# LM5116 HTSSOP-20 @ rot0: control pins 1-10 on the LEFT, power pins 12-20
# (CS/PGND/LO/VCC/HB/HO/SW) on the RIGHT -> FET pair sits EAST of the chip.
# PowerPAK SO-8 @ rot0: S(1-3)/G(4) on the LEFT, D-tab(5) on the RIGHT.

project:
  name: usb_hub_3s_v2
  netlist: 06_build/netlists/usb_hub_3s_v2.net
  output: 04_kicad/usb_hub_3s_v2.kicad_pcb
  parts_dir: 02_parts
  fp_lib_table: 04_kicad/fp-lib-table

board:
  outline: {x0: 20.0, y0: 20.0, x1: 150.0, y1: 112.0}
  edge_width: 0.1
  layers: 4
  mounting_holes:
    # east edge is owned by the 18mm-tall USB-A connector column (y26-87,
    # overhanging) with only ~4.6mm inter-connector gaps -> the two non-west
    # holes go to clear board: north gap (x100-113) and south of J4.
    footprint: MountingHole:MountingHole_3.2mm_M3
    at: [[26.0, 26.0], [26.0, 106.0], [106.0, 24.0], [144.0, 92.0]]
  # v1.6: THREE GLOBAL FIDUCIALS. v1.0-v1.5 shipped with NONE, on a board whose
  # minimum machine-placed pad pitch is 0.500 mm (J5, the USB-C receptacle -- and
  # J5 IS on the CPL, so it IS machine-placed). Without fiducials the placer has
  # only the board edge to register against, and JLC's routed-edge tolerance is
  # +-0.2 mm; on a 0.5 mm pitch that is 40% of the pitch spent before the machine
  # has done anything. A fiducial costs one copper dot and is IMPOSSIBLE to add
  # after the panel is made, which is why it must land in this spin.
  # Placed non-collinear and asymmetric, one per board region, each in open GND
  # pour and >= 5 mm from the routed edge:
  #   FID1 NW (33,29)   -- near the input cell / H1
  #   FID2 NE (140,25)  -- above the USB-A column, north of the VBUSA1 pour (y29)
  #   FID3 SE (145,105) -- the corner nearest J5, the part that actually needs it
  # Triangle area = 0.5*|cross| = 1943 mm^2, i.e. emphatically not collinear.
  fiducials:
    footprint: Fiducial:Fiducial_1mm_Mask2mm
    at: [[33.0, 29.0], [140.0, 25.0], [145.0, 105.0]]

libraries: [03_src/lib, /usr/share/kicad/footprints]   # v1.1: project dir first so vendored SW1 fp maps correctly (fp-lib-table)

placement:
  anchors:
    # ---------------- INPUT cell (west column) ----------------
    J1: [30.0, 44.0, 90]      # XT60 mouth WEST; pad1=GND pad2=VBAT
    F1: [35.0, 56.0, 0]       # fuse holder pads (30,56)=VBAT (40,56)=VBAT_F
    Q1: [36.0, 66.0, 180]     # revpol P-FET: D-tab WEST=VBAT_F, S EAST=VIN
    D2: [33.0, 73.0, 0]       # Vgs zener: K(pad1)=VIN, A=RPP_G
    R1: [41.0, 72.0, 0]       # RPP_G gate pulldown -> GND
    D1: [44.0, 66.0, 0]       # input TVS SMBJ15A: K(pad1)=VIN, A=GND (on VIN, after Q1)
    C1: [26.5, 60.0, 90]      # VIN bulk polymer (pad1=VIN)
    C2: [26.5, 72.0, 90]      # VIN bulk polymer

    # ---------------- BUCK A (north band) -> 5VA ----------------
    U2:  [60.0, 38.0, 0]      # LM5116; EP(21)=GND
    Q2:  [76.0, 30.0, 180]    # HS: D-tab WEST=VIN, S EAST=SW_A, G=HO_A
    Q3:  [76.0, 38.0, 0]      # LS: S WEST=CS_A, D-tab EAST=SW_A, G=LO_A
    RS1: [72.0, 46.0, 270]    # 10m shunt: pad1(CS_A) NORTH, pad2 GND
    L1:  [90.0, 34.0, 0]      # 6.8uH SW_A -> 5VA
    D3:  [66.0, 30.0, 0]      # boot diode: K(pad1)=BOOT_A, A=VCC_A

    # ---------------- BUCK C (south band) -> 5VC  [identical to A] ----------------
    U11: [60.0, 76.0, 0]
    Q4:  [76.0, 68.0, 180]    # HS: D-tab WEST=VIN, S EAST=SW_C
    Q5:  [76.0, 76.0, 0]      # LS: S WEST=CS_C, D-tab EAST=SW_C
    RS2: [72.0, 84.0, 270]
    L2:  [90.0, 72.0, 0]
    D4:  [66.0, 68.0, 0]

    # ---------------- USB-A x3 (east column, mouths EAST) ----------------
    U3: [108.0, 34.0, 0]
    U4: [108.0, 56.0, 0]
    U5: [108.0, 78.0, 0]
    U8: [131.0, 41.0, 0]      # D+/D- ESD near connector J2
    U9: [131.0, 63.0, 0]
    U10: [131.0, 85.0, 0]
    J2: [139.0, 38.0, 90]     # KH-AF90DIP mouth EAST
    J3: [139.0, 60.0, 90]
    J4: [139.0, 82.0, 90]

    # ---------------- DCP advertisement (in the 5VA column, feeds port data) ----
    U6: [111.0, 49.0, 0]      # TPS2513A ports 1+2 (DP/DM_A1, DP/DM_A2)
    U7: [111.0, 72.0, 0]      # TPS2513A port 3 (DP/DM_A3)

    # ---------------- USB-C PORT (south-east) — v3: PLAIN 5V/5A, NO PD ----------
    # v3 = v2 MINUS the PD cell (ADR-0001): RS3/Q6/Q7/U1 removed. VBUS == the 5VC
    # buck output, poured directly to J5 (5VC zone reaches the whole SE corner).
    # Kept: U12 C-port data ESD, J5 receptacle. C49/C50 VBUS bulk + R28/R29 CC Rp
    # pull-ups are seeded below. J5 VBUS pads A4/A9/B4/B9 on 5VC; CC1/CC2 (A5/B5)
    # and DPC/DMC (A6/A7/B6/B7) escape north through the clear x118.2-122.3 column.
    U12: [126.0, 101.7, 180]  # C-port data ESD (rot180: DMC pins 3/4 face N channel); clears J5 courtyard
    J5:  [120.0, 109.0, 0]    # USB-C mouth SOUTH; VBUS pads (A4/A9/B4/B9) on VBUSC (v1.1 eFuse OUT)

    # ---------------- v1.2 DISCRETE VBUS PROTECTION cell (BRIEF A2/D2) ----------
    # eFuse DROPPED. Chain W->E: 5VC -> Q6(P-FET) -> PMID -> F2(polyfuse) -> VBUSC -> J5.
    # Q6 AON6403 (PowerPAK SO-8) rot90: D-tab(5) WEST=5VC (in the buck-C notch),
    # S(1-3)+G(4) EAST=PMID/QG. Q7 BSS138 gate inverter S of Q6. F2 1812 polyfuse
    # in series PMID->VBUSC. (Coarse parts -> the QFN escape wall is gone.)
    Q6:  [104.0, 90.0, 180]   # AON6403 P-FET (rot180, like the input Q1): D-tab(5)=5VC WEST (into the 5VC notch), S(1-3)=PMID EAST (into the PMID pour), G(4)=QG
    Q7:  [104.0, 96.0, 0]     # BSS138 gate inverter: G(1)=ENKILL, S(2)=GND, D(3)=QG (S of Q6)
    F2:  [114.0, 90.0, 0]     # PPTC polyfuse 2920 (7.4x5.1mm, bigger): pad1=PMID(W ~x111), pad2=VBUSC(E ~x117)
    SW1: [66.0, 58.0, 0]      # SS12D07 master-off slide; COM(2)=ENKILL, T1(1)=GND, T2(3)=NC; open board center, accessible

    # ---------------- v1.6 STATUS-LED cell (5 indicators) ----------------
    # ANCHORED, not seeded: an indicator whose position is legalized is an
    # indicator that can end up next to the wrong connector. Each LED is placed
    # to be READ, and each ballast is placed INSIDE the pour it senses so the
    # sense end needs no routed feeder at all.
    # PACK trio sits immediately WEST of SW1 [66,58], in the clear band between
    # the buckA_sense keepout (ends y50) and buckC_sense (starts y60) -- the
    # strongest possible physical association between "the switch" and "the lamp
    # that says what the switch did". All three at rot 0 -> LED cathode WEST.
    R37: [49.5, 53.0, 0]      # pack ballast 6.98k: pin1=VIN (In2 plane via pad_rescue), pin2=LEDPK
    D8:  [53.5, 53.0, 0]      # amber PACK LED: K(pad1,W)=LEDPKK, A(pad2,E)=LEDPK
    Q8:  [57.8, 53.0, 0]      # BSS138 pack-LED gate: G(1)=ENKILL, S(2)=GND, D(3)=LEDPKK
    # Per-port USB-A indicators: ballast INSIDE its own VBUSAk pour (north edge),
    # LED ~4.5mm NORTH of the pour in GND copper. Same offset on all three so the
    # silk reads as a column and a mis-association is visible at a glance.
    R38: [124.0, 30.5, 0]     # in VBUSA1 pour [118,29,143,44]; pin1=VBUSA1, pin2=LEDVA1
    D9:  [124.0, 26.5, 0]     # green port-1 LED, north of the VBUSA1 pour (GND)
    R39: [124.0, 52.5, 0]     # in VBUSA2 pour [118,51,143,66]
    D10: [124.0, 48.0, 0]     # green port-2 LED, in the y44-51 inter-pour GND gap
    R40: [124.0, 74.5, 0]     # in VBUSA3 pour [118,73,143,88]
    D11: [124.0, 70.0, 0]     # green port-3 LED, in the y66-73 inter-pour GND gap
    # USB-C indicator: POST-protection. R41 sits in the VBUSC west J5 leg so the
    # LED reports the CONNECTOR rail, not the buck -- dark means Q6 or F2 opened.
    R41: [112.5, 102.0, 0]    # in VBUSC leg [110.5,99.5,118.2,106.8]; pin1=VBUSC, pin2=LEDVC
    D12: [107.0, 102.0, 0]    # green USB-C LED, west of the VBUSC leg (GND)

  # v1.3 (BRIEF A3/D3): SW1 OFF automated assembly (hand-solder) until the SS12D07
  # VG4-vs-VG6 pin-pitch variant is physically confirmed against the received part
  # (JLC C2939728's exact variant is unverified). Sets FP_EXCLUDE_FROM_POS_FILES ->
  # export_jlc_package drops it from the CPL; it STAYS in the BOM for reference.
  # Fallback if the pitch is wrong: 3-pin 2.54mm header + shunt (ORDER_README).
  patterns:
    - {match: SW1, attrs: [exclude_from_pos_files]}
    # F1 (Keystone 3568 MINI-blade holder): documented hand-solder THT since v1.1
    # (twin adjudication C5249699: "not in the CPL placement set"; ORDER_README
    # hand-solder list) but v1.1/v1.2 CPLs still carried it — v1.3 makes the CPL
    # match the documented status. Stays in the BOM (self-supplied, uncoded at JLC).
    - {match: F1, attrs: [exclude_from_pos_files]}
    # v1.6 R42: the 5VC setpoint-trim strap ships UNPOPULATED (dnp_by_design).
    # DNP keeps it on the BOM as a documented option and off the CPL, so JLC
    # neither sources nor places it; the bench decides whether it is ever fitted.
    # v1.6 R42 ships UNPOPULATED. attrs are `exclude_from_pos_files` ONLY -- the
    # SAME idiom SW1 and F1 already use on this board -- and deliberately NOT the
    # KiCad `dnp` footprint flag. Setting dnp on the FOOTPRINT while the generated
    # symbol does not carry it is a genuine artifact disagreement, and
    # --schematic-parity says so: DRC went 0/0/1 with
    # "footprint_symbol_mismatch: 'Do not populate' settings differ". The board is
    # not the place that fact lives. `03_src/rules/assembly.yaml` not_assembled ->
    # dnp_by_design is this repo's ONE machine-readable home for "who gets placed
    # and why not", it carries the dated evidence, and A-POP grades it. R42 is also
    # deliberately UNCODED, so its BOM row has no LCSC and JLC cannot source it
    # either. Off the CPL + off the sourcing list + declared = unpopulated.
    - {match: R42, attrs: [exclude_from_pos_files]}

  seeds:
    # -------- Buck A control cluster (LEFT/south of U2) --------
    R2: [53.0, 34.0]     # RT
    R6: [53.0, 36.0]     # UVLO top
    R7: [53.0, 38.0]     # UVLO bot
    R8: [53.0, 40.0]     # EN
    C3: [55.0, 44.0]     # RAMP
    C6: [57.0, 44.0]     # SS
    R3: [53.0, 44.0]     # FB top
    R4: [53.0, 46.0]     # FB bot
    R5: [55.0, 46.0]     # comp R
    C4: [57.0, 46.0]     # comp CMZ
    C5: [59.0, 46.0]     # comp hf
    C7: [68.0, 30.0]     # boot cap HB-SW
    C8: [64.0, 32.0]     # VCC cap
    R9: [70.0, 43.0]     # CS kelvin 0R (CSF-CS)
    R10: [74.0, 47.0]     # CSG kelvin 0R (CSGF-GND)
    # Buck A input caps (VIN Cin, north of Q2)
    C9:  [62.0, 26.0]
    C10: [66.0, 26.0]
    C11: [70.0, 26.0]
    C12: [74.0, 26.0]
    C13: [78.0, 26.0]    # 100n
    # Buck A output caps (5VA, east of L1)
    C14: [92.0, 28.0]
    C15: [96.0, 28.0]
    C16: [92.0, 40.0]
    C17: [96.0, 40.0]
    # -------- Buck C control cluster --------
    R11: [53.0, 72.0]
    R15: [53.0, 74.0]
    R16: [53.0, 76.0]
    R17: [53.0, 78.0]
    C18: [55.0, 82.0]
    C21: [57.0, 82.0]
    R12: [53.0, 82.0]
    # v1.6 DNP setpoint-trim strap, electrically PARALLEL with R12 (5VC<->FB_C).
    # MOVED 82.0 -> 87.0 after the first fresh route: seeded immediately beside R12
    # it crowded the buck-C feedback escape and the taps stage failed with
    # 'via-in-pad site blocked at (52.675, 82.0)' -- R12.1's own pad, the anchor the
    # 5VC sense escape has to drop its via into. That escape is already the roll-
    # fragile one on this board (route.yaml records buck-A hitting the same wall).
    # A DNP strap must not be allowed to destabilise a feedback path it is not even
    # fitted on, so it sits clear of the cluster and is fed by an explicit tap.
    R42: [50.5, 87.0]
    R13: [53.0, 84.0]
    R14: [55.0, 84.0]
    C19: [57.0, 84.0]
    C20: [59.0, 84.0]
    C22: [68.0, 68.0]
    C23: [64.0, 70.0]
    R18: [70.0, 81.0]
    R19: [74.0, 85.0]
    C24: [62.0, 64.0]
    C25: [66.0, 64.0]
    C26: [70.0, 64.0]
    C27: [74.0, 64.0]
    C28: [78.0, 64.0]
    C29: [92.0, 66.0]
    C30: [96.0, 66.0]
    C31: [92.0, 78.0]
    C32: [96.0, 78.0]
    # -------- DCP decouple --------
    C33: [113.0, 46.0]
    C34: [113.0, 73.0]
    # -------- USB-A per-port passives --------
    R20: [112.0, 30.0]
    C35: [104.0, 30.0]
    C38: [120.0, 32.0]
    C41: [120.0, 34.0]
    R21: [112.0, 52.0]
    C36: [104.0, 52.0]
    C39: [120.0, 54.0]
    C42: [120.0, 56.0]
    R22: [112.0, 74.0]
    C37: [104.0, 74.0]
    C40: [120.0, 76.0]
    C43: [120.0, 78.0]
    # -------- USB-C port passives (v3) --------
    R27: [132.0, 106.0]   # DCP short DPC-DMC (east of U12, clear of its south channel)
    R28: [116.5, 105.0]   # CC1 Rp 10k: pin(CC1)->J5.A5; 5VC pin in west VBUS pour
    R29: [123.0, 105.0]   # CC2 Rp 10k: pin(CC2)->J5.B5; 5VC pin in east VBUS pour
    C49: [121.0, 91.0]    # VBUS(VBUSC) bulk 10u (in VBUSC pour, F2 OUT side)
    C50: [125.5, 91.0]    # VBUS(VBUSC) bulk 10u (in VBUSC pour)
    # -------- v1.2 discrete-protection passives (gate pull-up + TVS) --------
    R30: [108.0, 93.0]    # Q6 gate pull-up 100k: R30.1=PMID, R30.2=QG (in PMID pour, W of F2)
    D5:  [119.0, 96.0]    # VBUSC over-voltage TVS (SMBJ6.0A, SMB): K(pad1)=VBUSC, A(pad2)=GND (near J5)
    # -------- SW-node RC snubbers (v1.1, DNP-populate); on each buck SW island --
    R34: [86.0, 44.5]     # buck-A snub R 2.2ohm (R34.1=SW_A, R34.2=SNUB_A)
    C53: [88.5, 44.5]     # buck-A snub C 1n  (C53.1=SNUB_A, C53.2=GND)
    R35: [86.0, 82.5]     # buck-C snub R 2.2ohm (R35.1=SW_C, R35.2=SNUB_C)
    C54: [88.5, 82.5]     # buck-C snub C 1n  (C54.1=SNUB_C, C54.2=GND)

  legalize: {enable: true, clearance: 0.25, edge_margin: 1.0, hole_keepout: 2.6, ring_max: 80}

design_rules:
  track_min_width: 0.127
  min_clearance: 0.127      # STANDARD tier (v3: QFN gone -> jlc_4layer_standard)
  via_min_size: 0.45        # JLC no-fee multilayer via 0.45/0.3
  min_through_drill: 0.3
  via_min_annulus: 0.075
  hole_clearance: 0.2
  hole_to_hole: 0.5         # JLC published standard hole-to-hole floor
  copper_edge_clearance: 0.3
  solder_mask_min_width: 0.0
  solder_mask_expansion: 0.0

zones:
  # planes
  - {net: GND, layers: [In1.Cu], priority: 0, min_thickness: 0.3, clearance: 0.3, connect: thermal}
  - {net: VIN, layers: [In2.Cu], priority: 0, min_thickness: 0.3, clearance: 0.3, connect: full}
  # outer GND pours
  - {net: GND, layers: [F.Cu, B.Cu], priority: 0, min_thickness: 0.3, clearance: 0.3, connect: full}
  # ---- input power patches ----
  # VBAT covers J1.2(30,36.8)+F1.1(35,56-59.4); VBAT_F covers F1.2(45,56-59.4)+
  # Q1.5(33-35,64-68). Shaped to NOT overlap each other (different nets).
  - {net: VBAT,   layers: [F.Cu], priority: 2, rect: [23.0, 34.0, 38.0, 60.0], connect: full}
  - {net: VBAT_F, layers: [F.Cu], priority: 2, rect: [39.0, 54.0, 47.0, 62.0], connect: full}   # F1.2 east
  - {net: VBAT_F, layers: [F.Cu], priority: 3, rect: [30.0, 60.5, 47.0, 69.0], connect: full}   # Q1.5 south (P3: legal union)
  # v1.1 thermal fix: mirror VBAT_F onto B.Cu (input-trunk ~7A copper doubling); F<->B stitch vias added post-fill.
  - {net: VBAT_F, layers: [B.Cu], priority: 2, rect: [39.0, 54.0, 47.0, 62.0], connect: full}
  - {net: VBAT_F, layers: [B.Cu], priority: 3, rect: [30.0, 60.5, 47.0, 69.0], connect: full}
  - {net: VIN,    layers: [F.Cu], priority: 2, rect: [23.0, 60.0, 47.0, 80.0], connect: full}   # input VIN pool: Q1.S + C1/C2 + D1
  # ---- buck A / buck C VIN Cin pools ----
  - {net: VIN,    layers: [F.Cu], priority: 2, rect: [58.0, 22.5, 82.0, 32.0], connect: full}   # buck A Cin
  - {net: VIN,    layers: [F.Cu], priority: 2, rect: [58.0, 60.5, 82.0, 70.0], connect: full}   # buck C Cin
  # ---- SW islands (tight, F.Cu+B.Cu) ----
  - {net: SW_A,   layers: [F.Cu, B.Cu], priority: 2, rect: [78.5, 27.0, 92.5, 41.0], connect: full}
  - {net: SW_C,   layers: [F.Cu, B.Cu], priority: 2, rect: [78.5, 65.0, 92.5, 79.0], connect: full}
  # ---- CS patches (cover LS-FET source + shunt + kelvin link) ----
  - {net: CS_A,   layers: [F.Cu], priority: 2, rect: [66.0, 35.0, 78.0, 49.5], connect: full}   # west edge 68->66 covers R9.1 kelvin (67.28)
  - {net: CS_C,   layers: [F.Cu], priority: 2, rect: [66.0, 73.0, 78.0, 87.5], connect: full}   # west edge 68->66 covers R18.1 (67.28)
  # ---- output rails: L-shape (buck out + column down the port/PD feed) ----
  - net: 5VA         # buck A out (x86-98) + column x98-114 feeding U3/U4/U5 IN + DCP
    layers: [F.Cu, B.Cu]
    priority: 2
    connect: full
    # v1.6 H3 NOTCH — the top copper item of this revision.
    # MEASURED on the sealed v1.5 board (filled zones, pcbnew polygon distance):
    # H3 is an NPTH M3 at (106.0, 24.0), drill 3.2 => hole radius 1.600 mm. Both
    # OUTER layers carry TWO DIFFERENT NETS at the same radius:
    #     F.Cu  GND 1.850 mm   and  5VA 1.850 mm
    #     B.Cu  5VA 1.850 mm   and  GND 1.851 mm
    # i.e. 0.250 mm of bare laminate and ~20 um of solder mask are the only things
    # between the 6 A USB-A rail and GND, on BOTH faces. EVERY listed fastener
    # spans both nets -- not just a big washer, the smallest M3 cap head (r 2.75)
    # already bridges. That is a dead short of the pack across a screw.
    # v1.5 shipped a SENTENCE about nylon standoffs in ORDER_README as the only
    # mitigation. A build note survives exactly as long as the person who read it.
    # THE RULE THIS ENCODES: within r <= 4.00 mm of any mounting hole, all OUTER
    # copper is ONE net and that net is GND. 4.00 mm covers cap head (2.75), M3
    # nut across-corners (3.18) and a DIN 125A washer (3.50) with margin.
    # The notch below puts the 5VA boundary at 4.50 mm from H3 (closest point
    # (106.0, 28.5)); GND then pours the gap, so a metal screw sees GND only.
    # Cost: 10 x 3.7 mm of pour in a region that carries no part and no pad
    # (nearest are C35 [104,30] at y>=29.6 and R20 [112,30], both outside).
    points: [[86.0, 24.8], [101.0, 24.8], [101.0, 28.5], [111.0, 28.5], [111.0, 24.8],
             [116.0, 24.8], [116.0, 84.0], [98.0, 84.0], [98.0, 44.0], [86.0, 44.0]]  # east 114->116 covers C34.1; top 26->24.8 covers C14/C15 (legalized to y25.4)
  - net: 5VC         # buck C out (x86-98) + notch reaches Q6.D-tab (5VC->P-FET)
    layers: [F.Cu, B.Cu]
    priority: 2
    connect: full
    points: [[86.0, 62.0], [98.0, 62.0], [98.0, 88.0], [104.5, 88.0], [104.5, 96.5], [92.0, 96.5], [92.0, 82.5], [86.0, 82.5]]  # notch east 103->104.5 reaches Q6 D-tab (rot90, west)
  # ---- USB-A port rails ----
  - {net: VBUSA1, layers: [F.Cu, B.Cu], priority: 2, rect: [118.0, 29.0, 143.0, 44.0], connect: full}
  - {net: VBUSA2, layers: [F.Cu, B.Cu], priority: 2, rect: [118.0, 51.0, 143.0, 66.0], connect: full}
  # v1.6 H4 CHAMFER. MEASURED: VBUSA3 reaches r = 4.152 mm of H4 (144.0, 92.0) on
  # BOTH outer layers. That clears cap head / nut / DIN 125A, but a DIN 9021 large
  # washer (r 4.50) -- the one someone reaches for when a hole is oversized -- lands
  # on VBUSA3 and GND at once and shorts a 2 A port rail. Cutting the SE corner puts
  # the boundary at 5.00 mm. J4's shield hole (~141.6, 88.6) is GND and is unaffected;
  # J4's VBUSA3 contact (~139, 85.5) and C40/C43/R40 all stay inside the pour.
  - {net: VBUSA3, layers: [F.Cu, B.Cu], priority: 2, connect: full,
     points: [[118.0, 73.0], [143.0, 73.0], [143.0, 86.0], [141.0, 88.0], [118.0, 88.0]]}
  # ---- v1.2 DISCRETE VBUS pours: 5VC -> Q6 -> PMID -> F2 -> VBUSC -> J5 ----
  # PMID (Q6.S -> F2.1 -> R30.1) is a short local pour east of the 5VC notch.
  # VBUSC (F2.2 -> J5 VBUS + D5 TVS + C49/C50 + U12.5 + R28/R29 CC-Rp) is the
  # protected connector rail: a main SE block + two J5 legs flanking the pour-free
  # CC/data column (x118.2-122.3 below y100). Different-net zones may overlap; the
  # 5VC notch (p2, ends x104.5) and PMID (p3, starts x105.5) have a 1mm gap.
  - {net: PMID,  layers: [F.Cu, B.Cu], priority: 3, rect: [105.5, 87.5, 113.0, 94.5], connect: full}  # Q6.S(E) -> F2.1(W ~x111) + R30.1
  - {net: VBUSC, layers: [F.Cu, B.Cu], priority: 2, rect: [114.3, 87.5, 128.5, 100.0], connect: full} # F2.2 (OUT) + C49 + C50 + U12.5 + D5 TVS
  - {net: VBUSC, layers: [F.Cu, B.Cu], priority: 3, rect: [110.5, 99.5, 118.2, 106.8], connect: full} # J5 west VBUS (A4/B4 @117.55) + R28.2
  - {net: VBUSC, layers: [F.Cu, B.Cu], priority: 3, rect: [122.3, 99.5, 129.0, 106.8], connect: full} # J5 east VBUS (A9/B9 @122.45) + R29.2

