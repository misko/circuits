    - {text: "9-12.6V XT60 IN", at: [72.0, 50.5], size: 0.7, nudge: true}   # stacked below, de-collide
    - ["FUSE 10A MINI", 35.0, 50.0, 0.7]
    - {text: "F2 VBUS 5A POLYFUSE", at: [111.0, 86.0], size: 0.55, nudge: true}   # functional silk for F2 (P-SILK-FN); N of F2 (114,90)
    - ["USB-A 5V CHG no-data", 130.0, 33.0, 0.7]
    - ["USB-A 5V CHG no-data", 130.0, 55.0, 0.7]
    - ["USB-A 5V CHG no-data", 130.0, 77.0, 0.7]
    - {text: "USB-C 5A Pi-ONLY  NOT USB-PD", at: [135.0, 108.0], size: 0.6, nudge: true}   # SE, off J5.SH pad; de-collide
    - ["usb-hub-3s-v3", 30.0, 100.0, 0.8]
    - ["POWER-DIST BOARD - NOT A USB HUB", 30.0, 96.0, 0.55]   # v1.1 relabel (fix #6)
    # ---- v1.6 status-LED legends (canon P5: plain words, no colour codes) ----
    # An indicator with no legend is a light whose meaning lives in a PDF.
    - {text: "PACK ON", at: [53.5, 56.5], size: 0.6, nudge: true}            # under D8 [53.5,53]
    - {text: "USB-A1 5V", at: [130.0, 26.5], size: 0.55, nudge: true}        # beside D9
    - {text: "USB-A2 5V", at: [130.0, 48.0], size: 0.55, nudge: true}        # beside D10
    - {text: "USB-A3 5V", at: [130.0, 70.0], size: 0.55, nudge: true}        # beside D11
    - {text: "USB-C 5V OK", at: [104.0, 105.5], size: 0.55, nudge: true}     # S of D12 [107,102]
    # THE SAFETY LINE. Every other legend says what a lit LED means; this one
    # says what a DARK board means, because the pack LED is ENABLE-gated (Q8 off
    # ENKILL) and the XT60 stays hot with SW1 off. Without it, "all lights out"
    # reads as "de-energized" -- which is exactly wrong, and is the state someone
    # will be in when they put a screwdriver near the 6 A rail.
    - {text: "LEDS DARK = SWITCH OFF", at: [51.0, 62.8], size: 0.55, nudge: true}
    - {text: "PACK STILL LIVE AT XT60", at: [51.0, 64.4], size: 0.55, nudge: true}

asserts:
  pad_net:
    - {ref: J1, pad: 1, net: GND}
    - {ref: J1, pad: 2, net: VBAT}
    - {ref: Q1, pad: 5, net: VBAT_F}       # revpol P-FET drain = battery side
    - {ref: D1, pad: 1, net: VIN}          # TVS cathode on VIN (after Q1)
    - {ref: D2, pad: 1, net: VIN}          # Vgs zener cathode at source=VIN
    - {ref: C1, pad: 1, net: VIN}
    - {ref: C2, pad: 1, net: VIN}
    - {ref: U2, pad: 21, net: GND}
    - {ref: U11, pad: 21, net: GND}
    - {ref: D3, pad: 1, net: BOOT_A}       # boot diode cathode = HB side
    - {ref: D4, pad: 1, net: BOOT_C}
    - {ref: Q2, pad: 5, net: VIN}          # HS drain = VIN
    - {ref: Q3, pad: 5, net: SW_A}         # LS drain = SW
    - {ref: Q4, pad: 5, net: VIN}
    - {ref: Q5, pad: 5, net: SW_C}
    - {ref: RS1, pad: 1, net: CS_A}
    - {ref: RS2, pad: 1, net: CS_C}
    - {ref: J5, pad: A4, net: VBUSC}       # USB-C VBUS == VBUSC (protected connector)
    - {ref: J5, pad: A9, net: VBUSC}
    # v1.2 DISCRETE-protection polarity/role asserts (5VC->Q6->PMID->F2->VBUSC)
    - {ref: Q6, pad: 5, net: 5VC}          # AON6403 P-FET DRAIN-tab = 5VC (W); body diode blocks PMID->5VC reverse
    - {ref: Q6, pad: 1, net: PMID}         # AON6403 SOURCE = PMID (E)
    - {ref: Q6, pad: 4, net: QG}           # AON6403 GATE = QG
    - {ref: Q7, pad: 1, net: ENKILL}       # BSS138 gate inverter: GATE = ENKILL
    - {ref: Q7, pad: 3, net: QG}           # BSS138 DRAIN = QG (pulls Q6 gate low when ENKILL high)
    - {ref: F2, pad: 2, net: VBUSC}        # polyfuse OUTPUT = protected VBUSC
    - {ref: D5, pad: 1, net: VBUSC}        # TVS cathode(pad1) on VBUSC (over-voltage clamp)
    - {ref: R30, pad: 1, net: PMID}        # Q6 gate pull-up to SOURCE (PMID)
    - {ref: SW1, pad: 2, net: ENKILL}      # slide COM = master-off bus
    - {ref: R12, pad: 1, net: 5VC}         # buck-C FB-top senses LOCAL 5VC (v1.1 runaway fix, kept)
    # ---- v1.6 status-LED polarity + tap-point asserts ----
    # Every LED's pad 1 is its CATHODE (KiCad Device:LED pin1=K; LED_0805_2012Metric
    # pad 1 is the F.Fab-chamfered / silk-banded WEST end). Asserting the cathode NET
    # is what makes a reversed indicator a BUILD failure instead of a bench mystery:
    # a backwards LED never lights and is indistinguishable from a dry joint.
    - {ref: D8,  pad: 1, net: LEDPKK}      # pack LED cathode -> Q8 drain (the gate)
    - {ref: D8,  pad: 2, net: LEDPK}       # pack LED anode <- R37 <- VIN
    - {ref: Q8,  pad: 1, net: ENKILL}      # pack-LED gate FET: GATE on the master-off bus
    - {ref: Q8,  pad: 2, net: GND}         # BSS138 source
    - {ref: Q8,  pad: 3, net: LEDPKK}      # BSS138 drain = the LED's low side
    - {ref: R37, pad: 1, net: VIN}         # pack ballast feeds from VIN (always hot)
    - {ref: D9,  pad: 1, net: GND}
    - {ref: D10, pad: 1, net: GND}
    - {ref: D11, pad: 1, net: GND}
    - {ref: D12, pad: 1, net: GND}
    - {ref: R38, pad: 1, net: VBUSA1}      # PER-PORT tap: post-TPS2557, so a latched
    - {ref: R39, pad: 1, net: VBUSA2}      # port reads DARK. Tapping 5VA instead would
    - {ref: R40, pad: 1, net: VBUSA3}      # make a dead port look identical to a live one.
    - {ref: R41, pad: 1, net: VBUSC}       # C-port tap is POST Q6+F2 (NOT 5VC): dark == the
                                           # ADR-0002 protection chain opened
  body_offset:
    - {ref: J1, axis: x, sign: "-"}        # XT60 mouth WEST
    - {ref: J2, axis: x, sign: "+"}
    - {ref: J3, axis: x, sign: "+"}
    - {ref: J4, axis: x, sign: "+"}
    - {ref: J5, axis: y, sign: "+"}        # USB-C mouth SOUTH
