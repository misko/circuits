# usb-hub-3s-v3 — ASSEMBLY INTENT (canon A-POP / A-STOCK).
# Seeded 2026-07-25 from skills/pcb-design/templates/03_src/rules/assembly.yaml
# for release v1.5-2026-07-25. The KEYS are the contract (03_src/rules/
# contracts.md); the values below are THIS board's, every one measured.
#
# PCBA IS THE DELIVERABLE. This file is the ONE machine-readable home for
# "who gets placed, and why not". The release MANIFEST `not_assembled:` line is
# GENERATED from this file — never hand-written in two places.
#
# MEASURED POPULATION SET (2026-07-25, against 04_kicad/usb_hub_3s_v2.kicad_pcb
# and 07_releases/v1.5-2026-07-25/fab/cpl.csv):
#   114 board footprints
#    -4 H1-H4 mounting holes (FP_EXCLUDE_FROM_BOM; exempt_prefixes below)
#   ---
#   110 BOM parts  =  108 CPL placements  +  2 declared not_assembled (F1, SW1)
#   108/108 CPL rows are `top`; 0 bottom-side placements; 0 bottom footprints.
#
# v1.6 CENSUS (re-measured 2026-07-25 against the regenerated board):
#   125 board footprints
#    -4 H1-H4 mounting holes   (FP_BOARD_ONLY | FP_EXCLUDE_FROM_BOM)
#    -3 FID1-FID3 fiducials    (FP_BOARD_ONLY | FP_EXCLUDE_FROM_BOM |
#                               FP_EXCLUDE_FROM_POS_FILES — NEW in v1.6; a
#                               fiducial on the CPL is a placement instruction
#                               for a part that does not exist)
#   ---
#   122 BOM parts  =  119 CPL placements  +  3 declared not_assembled
#                                              (F1, SW1, and v1.6's R42 strap)
#   119/119 CPL rows `top`; still 0 bottom-side placements.
#   VERIFIED against the fresh v1.6 export 2026-07-25: "BOM: 46 lines (0 without
#   LCSC); CPL: 119 parts" and "A-ROT OK: all 119 CPL rotations are sourced".
#
#   DELTA +11 placements, ALL from the status-LED cell (task#30 D2/D3/D4):
#     D8            C2296  amber PACK indicator          NEW BOM LINE
#     D9  D10  D11  C2297  green per-port USB-A          NEW BOM LINE
#     D12           C2297  green USB-C (post-protection)  (same line as above)
#     R37 R38 R39 R40 R41  C23215 6.98k ballasts   -> already on the BOM (R7/R16)
#     Q8            C78284 BSS138 pack-LED gate    -> already on the BOM (Q7)
#   BOM-LINE DELTA IS EXACTLY +2 (C2296, C2297). Five feeders, five new
#   placements, zero new feeders -- that is why the ballast is 6.98k and the
#   gate FET is a BSS138: both were chosen to reuse a line that is already
#   loaded, because a JLC feeder costs more than the parts on it.

# ---- SERVICE DECLARATION ---------------------------------------------------
# THROUGH-HOLE IS PART OF THE ORDERED SERVICE, not an afterthought (user
# decision 2026-07-25: order JLC THT assembly; J1-J4 STAY on the CPL).
# MEASURED plated-hole census on the sealed board, 2026-07-25:
#   MACHINE-ASSEMBLED THT (on the CPL, JLC solders):
#     J1  AMASS XT60PW-M      4 PTH  (2x 2.7mm blade + 2x 0.6mm anchor)
#     J2  KH-AF90DIP-112      6 PTH  (4x 1.0mm signal + 2x 3.0mm shell)
#     J3  KH-AF90DIP-112      6 PTH
#     J4  KH-AF90DIP-112      6 PTH
#     ----------------------------------  4 refdes / 22 PTH  <- the THT line item
#   HYBRID (on the CPL, counted as SMD): J5 TYPE-C-31-M-12A = 16 SMD contacts
#     + 4x 0.6mm PTH shield legs + 2x 0.65mm NPTH alignment posts. The shield
#     legs need soldering; declare J5 to the fab so the hybrid is not missed.
#   NOT machine-assembled (see not_assembled: below): F1 4 PTH, SW1 3 PTH + 2 NPTH.
# NOTE (recorded, not silently absorbed): this schema has no dedicated
# through_hole: key, so the THT declaration lives here in `service` — the field
# that states what was ORDERED. Raised as a skill/template change in
# 08_reviews/2026-07-25_v1.5_pcba-audit.md (PCBA-9); not invented locally.
service: "standard SMT (top side only) + THROUGH-HOLE assembly (4 refdes / 22 plated holes: J1, J2, J3, J4; plus J5's 4 SMD-hybrid shield legs)"

# ---- THE BOUGHT THROUGH-HOLE PROCESS (v1.6) --------------------------------
# CLOSES the gap this file recorded in prose since v1.5 ("this schema has no
# dedicated through_hole: key ... raised as a skill/template change, PCBA-9").
# A-POP's CPL-NOT-SMT-PLACEABLE check now READS this block instead of only
# interpolating `service:` into its message, so "we paid for the THT line" is a
# checkable declaration rather than a sentence. All three keys are required and
# every exempted ref must be NAMED: silence, an empty refs list, or a ref left
# off the list all still FAIL. That keeps the case this check exists for — the
# crow-recorder-central-v2 v1.4 barrel jack on a top-side-SMT-only CPL, with an
# assembly.yaml asserting in prose that THT parts were off the CPL — failing.
through_hole:
  process: "JLCPCB through-hole assembly, ORDERED (user decision 2026-07-25:
    buy the THT line; J1-J4 STAY on the CPL rather than being hand-soldered)"
  refs: [J1, J2, J3, J4, J5]
  evidence: "MEASURED plated-hole census on the v1.6 board 2026-07-26 (pcbnew pad
    read, drill size > 0, F.Paste coverage per pad): J1 AMASS XT60PW-M 4 PTH
    (2x 2.7mm blade + 2x 0.6mm anchor), J2/J3/J4 KH-AF90DIP-112 6 PTH each
    (4x 1.0mm signal + 2x 3.0mm shell) = 4 refdes / 22 plated holes, and NONE of
    those 22 carries F.Paste, so none can reflow — which is exactly why the
    selective/wave line is bought rather than assumed. J5 is the HYBRID: 16 SMD
    contacts that DO reflow plus 4x 0.6mm plated shield legs that do not, so it is
    named here too; its 2x 0.65mm alignment posts are NPTH and solder nothing.
    Cross-check that this is a purchase and not a hope: the same 4-refdes/22-hole
    figure is in `service:` above and in the ORDER_README order-form section, and
    F1/SW1 — the two THT parts that are NOT bought — are in not_assembled: below
    with their own evidence."

# 108/108 CPL rows measured `top`; the board carries ZERO bottom-side
# footprints (pcbnew census 2026-07-25: 114 top / 0 bottom). Single-sided
# assembly — no second reflow pass, no bottom-side cost line.
sides: [top]

# DELIBERATE `none`. Two facts, both dated 2026-07-25:
#  (a) FAB'S OWN PRACTICE: for SMT assembly orders JLCPCB panelizes the board
#      onto its own rails and puts ITS fiducials on those rails; customer
#      board fiducials are not required for a standard SMT order. Recorded as
#      the fab's general stated practice at seal time, NOT a per-order
#      confirmation — re-read it on the order page before paying.
#  (b) LOCAL fiducials (ours to place, un-addable later) are the caller's job
#      only beside <=0.4mm-pitch parts. MEASURED 2026-07-25, board-wide, over
#      every pad pair with DIFFERENT pad numbers: the smallest non-zero
#      centre-to-centre distance is 0.500 mm, at J5 (TYPE-C-31-M-12_EdgeTrim),
#      pads A5<->B7 and A5<->B8 in the CC/SBU region. Next: 0.600 mm at
#      U3/U4/U5 (VSON-8-1EP_3x3mm_P0.65mm); 0.650 mm is the finest LEADED
#      pitch (VSON-8 + HTSSOP-20).
#      NB some pairs measure 0.000 mm: those are ONE physical pad carrying two
#      pin names (J5's A1/B12, A4/B9, A9/B4, A12/B1; the HTSSOP-20 exposed pad),
#      not two pads, and they are excluded from the criterion.
#      0.500 mm > 0.400 mm -> no local fiducial required. (CORRECTED from an
#      earlier 0.600 mm figure that missed J5 — v1.5 fresh lens, P2-1. The
#      conclusion is unchanged; the number was wrong.)
# Silence would have been the defect; this is the judgement.
# v1.6: WAS `none`, and that is no longer true — THREE global fiducials (FID1-FID3)
# are now on the board. Reasoning (b) below still holds on its own terms: the
# smallest machine-placed pitch measures 0.500 mm > 0.400 mm, so local fiducials
# beside a fine-pitch part are NOT required. What that argument never covered is
# GLOBAL registration: without any fiducial the placer registers against the ROUTED
# BOARD EDGE, and JLC's edge tolerance is +-0.2 mm — 40% of J5's 0.500 mm pitch
# spent before the machine moves. Reasoning (a) is a statement about JLC's PANEL
# rails, not about our board, and it was doing more work in this declaration than it
# could bear. Three fiducials cost one copper dot each and are IMPOSSIBLE to add
# after the panel exists, so v1.6 places them: FID1 (33,29) NW, FID2 (140,25) NE,
# FID3 (145,105) SE — non-collinear (triangle area 1943 mm^2), each in open GND pour
# and >=5 mm from the routed edge. All three are FP_BOARD_ONLY |
# FP_EXCLUDE_FROM_BOM | FP_EXCLUDE_FROM_POS_FILES: a fiducial on the CPL is a
# placement instruction for a part that does not exist.
fiducials: 3

# User decision 2026-07-25. Drives A-STOCK grading (stock >= 5 x per-board qty)
# and the ORDER_README stock table's floor(stock/qty) ceilings.
build_quantity: 5

# ---- NOT ASSEMBLED (the population set) ------------------------------------
# Both refs below carry FP_EXCLUDE_FROM_POS_FILES on the board (verified by
# pcbnew attribute read 2026-07-25: excl_pos = {F1, H1, H2, H3, H4, SW1}), so
# they are genuinely off fab/cpl.csv — the declaration and the machine
# instruction agree.
#
# HONESTY NOTE on `reason:` (PCBA-9 in the v1.5 audit): the closed vocabulary
# has no term for "in the catalog, on the BOM, but hand-fitted after delivery
# because its LAND PATTERN or placement model is unconfirmed" — which is the
# true reason for both entries. The nearest term is used and the exact reason
# is stated in `evidence:`; the vocabulary gap is a deferred skill change, not
# a local invention.
not_assembled:
  - refs: [F1]
    reason: user_supplied
    lcsc: C5249699
    evidence: "Keystone 3568-class MINI-blade fuse HOLDER. jlc_twin measured
               best=none for C5249699 on 2026-07-23 and again 2026-07-25 — JLC
               has NO placement model for the 2-clip THT holder, so there is
               nothing to verify a machine placement against; the land came
               from the Keystone catalog p.42 (02_parts/3568/part.yaml
               verified:). Board attribute FP_EXCLUDE_FROM_POS_FILES set since
               v1.1. Separately, the 10 A MINI (ATM) blade fuse ELEMENT is a
               consumable and is deliberately OFF the BOM entirely — bought
               locally, fitted by hand. Stock check 2026-07-25: C5249699 = 1213
               (holder ships with the order, it is only not PLACED)."
    disposition: "Holder hand-soldered at integration; fuse element on the
                  ORDER_README purchasing list. RE-EXAMINE NEXT REVISION: THT
                  assembly is now being ORDERED (J1-J4), so the v1.1 rationale
                  ('THT holder, no placement model') is weaker than it was.
                  Moving F1 onto the CPL needs a board change (clearing
                  FP_EXCLUDE_FROM_POS_FILES at source) and v1.5 is a
                  NO-COPPER-CHANGE release — deferred, not forgotten
                  (08_reviews DISPOSITIONS PCBA-6)."
  - refs: [R42]
    reason: dnp_by_design
    evidence: "v1.6 5VC SETPOINT-TRIM STRAP, added 2026-07-25 at user request and
               shipped UNPOPULATED BY DESIGN. It is a 160k 0402 in PARALLEL with
               R12 (the buck-C FB top): fitted, Rtop becomes 4.12k||160k = 4.017k
               and the rail moves 5.352 V -> 5.249 V, landing on U12's 5.25 V
               V_RWM. MEASURED basis for leaving it OFF: at the nominal setpoint
               the worst-case operating rail is 5.479 V, which is BELOW both the
               Pi 4's documented +6.0 V absolute maximum (Pi 4 datasheet p.8) and
               U12's 6.0 V guaranteed non-conduction floor -- so there is no
               measurement in hand that says the trim is needed. It is fitted only
               if the bench gate says U12's leakage at 5.352 V is unacceptable
               over temperature. Cost if fitted, at the Pi 4's 3 A: vout_min
               5.227 -> 5.125 V, minus 349 mV of IR = 4.776 V, still +146 mV above
               the 4.63 V undervoltage threshold. Code BAKED as C25757 (UNI-ROYAL
               0402WGF1603TCE, 160k +-1% 0402 62.5mW, MPN decode 1603 -> 160x10^3,
               LCSC-verified 2026-07-25, stock 455,100) AFTER the first export
               value-RESOLVED it unaided — the same mechanism that shipped R12 at
               3.74k when the design said 4.12k and R30 at 3.09k when it said 100k.
               It happened to resolve correctly; that is luck, not a process."
    disposition: "NOT PLACED at assembly — the land ships as bare copper. It DOES
                  stay on the BOM: `not_assembled` here drops a ref from the CPL and
                  KEEPS the BOM row by design (identical treatment to SW1 and F1 on
                  this board), so JLC supplies one 160k 0402 LOOSE with the order.
                  That is the useful outcome for a bench-decidable strap — whoever
                  runs the gate already has the part in the bag and nobody has to
                  source an 0402 to answer a question the board asked. If bench gate
                  Q8 (ORDER_README) finds U12's leakage unacceptable at the nominal
                  5.352 V rail, hand-fit the supplied part at integration; the value
                  is pinned by an E-INV part_value assert. If Q8 passes, the strap is
                  never fitted and that PASS is recorded WITH ITS NUMBERS. Either way
                  the outcome is written down: an unpopulated part is a decision
                  record, not a free outcome."
  - refs: [SW1]
    reason: dnp_by_design
    lcsc: C2939728
    evidence: "SS12D07VG6-087 master-off slide switch. The land is a DUAL-OPTION
               (alt-BOM) land and which part is fitted is decided by a
               measurement on the received part: our land is the standard
               SS-12D07 2.5 mm signal pitch (pad span 5.00 mm, mounting posts
               8.66 mm), while JLC's own EasyEDA model file is named
               'SW-TH_SS12D07VG4' — the VG4 variant at 2.0 mm pitch (span
               4.00 mm), a mislabeled wrong-variant model. The VG6-087
               mechanical drawing was UN-FETCHABLE in-env (LCSC datasheet CDN
               served HTML / blocked to curl+WebFetch, retried 2026-07-23).
               Machine-placing a 2.0 mm part on a 2.5 mm land is a placement
               defect, so the part is left unstuffed and the documented
               alternative for the SAME land is a 2.54 mm 3-pin header + shunt.
               Stock check 2026-07-25: C2939728 = 53036 (part ships with the
               order, it is only not PLACED)."
    disposition: "Hand-fitted after physically confirming the received part's
                  pitch against the land (ORDER_README section 2 + bench gate
                  Q6 continuity check: COM-T1 shunted = OFF, removed = ON). If
                  the pitch is 2.0 mm, fit the header+shunt instead. Resolve
                  the variant at part selection on the next revision so the
                  land is single-option and the switch can be machine-placed."

