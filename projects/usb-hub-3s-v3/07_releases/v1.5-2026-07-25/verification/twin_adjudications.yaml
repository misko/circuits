#    1<->3 ours 5.00mm (2.5mm signal pitch, pads at 63.5/66.0/68.5, mounting
#    posts 8.66mm span) vs JLC 4.00mm (2.0mm pitch). DECISIVE CONTEXT: JLC's
#    EasyEDA model file is named "SW-TH_SS12D07VG4" - the VG4 variant, NOT the
#    ordered VG6-087 - a mislabeled wrong-variant substitution (EasyEDA does this
#    on jellybean mechanical THT parts). Our 2.5mm is the standard SS-12D07 pitch
#    and is geometrically consistent with the 8.7mm body + end mounting posts
#    (LCSC body dims 8.7 x 4.4mm). The exact VG6-087 mechanical drawing was
#    un-fetchable in the sealed build env (LCSC datasheet CDN served HTML/blocked
#    to curl+WebFetch). NOT machine-critical: hand-solder THT master-OFF switch,
#    compliant 1.0mm-drill leads, and a DOCUMENTED jumper fallback (2.54mm header
#    + shunt across ENKILL<->GND, part.yaml). PRE-ORDER ACTION (MANDATORY, already
#    the part.yaml integration plan): confirm the VG6-087 pin pitch on the JLC
#    order preview / vendor drawing before paying; if 2.0mm, drop in the header
#    fallback. Adjudicated as our-pattern-correct with a required confirm, not
#    silently waived.
- {lcsc: C2939728, refs: [SW1], status: PAD-GEOM,
   why: "SS12D07VG6-087 master-off switch: ours 2.5mm signal pitch (span 5.00mm) = the standard SS-12D07 land (8.7mm body + 8.66mm-span mounting posts); JLC's model is the MISLABELED VG4 variant (2.0mm/4.00mm), not authoritative for VG6. Hand-solder THT, jumper fallback exists. VG6 drawing un-fetchable in-env -> order-preview pitch confirm is MANDATORY before order (part.yaml integration item)."}

