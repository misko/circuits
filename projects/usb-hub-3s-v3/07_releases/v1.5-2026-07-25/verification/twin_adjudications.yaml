#    merged-pad CENTROID vs JLC's corner lead pin 5 — a merging artifact, not
#    a land-pattern disagreement. AOS recommended pattern IS the single drain
#    paddle (AON6354/AON6403 datasheets, verified at parts stage). Ordered on
#    usb-hub-3s v1.0-2026-07-21.
