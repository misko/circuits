# reach a placement. Both are new criticals only because v1.6's Stage 0 promoted
# MODEL-REG to blocking and added PAD-MULTIPLICITY; the geometry is unchanged from
# v1.1 and was adjudicated then as PAD-MISMATCH + PAD-GEOM (above).
