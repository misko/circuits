#    machine-readable home for a JUDGEMENT that was otherwise only in prose.
#    The tool itself says "DO NOT blind-flip ... VERIFY leads sit on pads visually;
#    if correct, adjudicate as a false alarm with NO rotation override". That is
#    what was done, twice, independently.
- {lcsc: C98732, refs: [J1], status: MODEL-REG,
   why: "FALSE ALARM, verified as the tool instructs, NO rotation override. The
     metric is bbox-centre-vs-courtyard and is meaningless for this part: the XT60
     housing extends BACK from the blade face, so the WRL body's own bbox centre
     sits 4.10mm from its model origin (bbox x -13.15..+4.95mm in mm) — the tool
     reports that asymmetry itself. Leads-on-pads checked directly 2026-07-25:
     twin_top.png calibrated against the four M3 mounting holes, J1's four pad
     centres overlaid — all four land on the model's own features (2 blade bores on
     pads 1/2, 2 housing posts on the anchor pads). Rotation independently
     re-derived from JLC's own kicad_mod with the pcbnew-verified operator: 4-pad
     fit rms 0.0000mm @270 offset, 12.0mm out at 90, so the anchors break the
     90-vs-270 symmetry GEOMETRICALLY without relying on pad numbering. Confirmed a
     second time by the v1.5 fresh zero-context lens (rms 0.0000mm). CPL 0.0 stands.
     J1 remains a MANDATORY order-preview polarity item (P2) because geometry
     cannot tell which blade is '+': part.yaml records 'PAD 1 IS NEGATIVE' and the
     fleet ledger records a reversed XT60 shipping once."}

# ---- v1.6 STATUS-LED CELL: the POLARITY-FIT alarm is CORRECT, and it agrees ----
# THE TWIN IS RIGHT AND THE PAD FIT IS WRONG. jlc_twin reports, independently of
# anything I measured: "the pad-number fit says offset 180, but the MARKING channel
# disagrees by 180deg: our polarity marking sits at pad 1 (margin 0.69mm) while
# JLC's sits at pad 2 (margin 0.23mm) — the two libraries NUMBER this part's
# terminals oppositely, so the pad fit is 180deg wrong PHYSICALLY". That is the same
# conclusion reached by jlc_rotation_measure's polarity channel and by a hand
# cathode-to-cathode read, via THREE different implementations (canon M1). The
# shipped CPL rotation is 0, taken from the MEASURED per-LCSC row, and all five
# indicators export at 0.0 — verified in the fresh cpl_jlc.csv.
#
# ROT-DB-SUGGEST is the one finding here that is WRONG, and it is a TOOL
# INCONSISTENCY worth naming rather than silently waiving: it proposes
# "add LCSC row C2296,180" from the pad fit alone, contradicting the POLARITY-FIT
# finding printed two lines above it in the same report. Reported upstream. It does
# not touch the export, which resolves from the measured row (src=lcsc, offset 0).
- {lcsc: C2296, refs: [D8], status: POLARITY-FIT,
   why: "CORRECT ALARM, ADJUDICATED TO 0 (not 180). JLC's LED0805-R-RD numbers pad
     1 = ANODE at x=+1.05; KiCad's LED_0805_2012Metric numbers pad 1 = CATHODE at
     x=-0.9375 (Device:LED pin 1 = K, read from /usr/share/kicad/symbols/
     Device.kicad_sym). MEASURED numbering-free channels, both saying 0: (1) the
     unlabelled size-matched PAD CLOUD is 0.1125mm at BOTH 0 and 180 and 1.4076mm
     at 90/270 — it admits {0,180} and refutes {90,270} at 12.5x; (2) POLARITY
     MARKS matched cathode-to-cathode, reading no pad number and no pin-1 marker —
     OURS draws the cathode WEST (F.SilkS full-height band at x=-1.685, F.Fab
     chamfer removed-corner at (-1.000,-0.600)), JLC draws it WEST too (silk
     diode-glyph base x=+0.200 with APEX x=-0.300 — a diode triangle points at its
     cathode — plus the silk body outline chamfered at the WEST end, mean
     x=-2.025, square at the EAST). 0 is the ONLY angle at which both cathode
     marks land on the same side. A 180 row would ship every indicator DARK, which
     on a bench is indistinguishable from a dry joint."}
- {lcsc: C2297, refs: [D9, D10, D11, D12], status: POLARITY-FIT,
   why: "Same adjudication as C2296 above, and it is the SAME MEASUREMENT: the two
     JLC footprints are byte-identical apart from the LCSC property and the model
     path (diffed 2026-07-25), so one polarity read covers both codes. Offset 0."}
- {lcsc: C2296, refs: [D8], status: POLARITY-CHECK,
   why: "Discharged by MEASUREMENT of both libraries' cathode markings rather than
     by eye: see the POLARITY-FIT entry above. ADDITIONALLY on the human gate —
     both LED codes are listed in rotation_human_gate.txt for the JLC
     order-preview check, because no render can prove which physical terminal is
     the cathode on a part whose two libraries number them oppositely."}
- {lcsc: C2297, refs: [D9, D10, D11, D12], status: POLARITY-CHECK,
   why: "As C2296: discharged by the measured cathode-to-cathode channel, and on
     the order-preview human gate."}
- {lcsc: C2296, refs: [D8], status: ROT-DB-SUGGEST,
   why: "REJECTED, not accepted. The tool suggests adding a 180 row from its
