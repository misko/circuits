   why: "UNREACHABLE BY CONSTRUCTION, and the number is explained. The report gives
     'body center 5.0mm off courtyard, area ratio 0.89, incl. pad_geom_delta=
     6.52mm' — i.e. most of the offset IS the 6.52mm land disagreement already
