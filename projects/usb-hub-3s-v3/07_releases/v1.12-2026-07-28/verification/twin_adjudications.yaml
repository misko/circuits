   why: "NAMING, not geometry, and the tool says so itself: ours has pad numbers
     {1:2, 2:2} against JLC's {1:1, 2:1} because our land models each fuse CLIP as
     a PAIR of plated holes (the Keystone catalog p.42 pattern: two barrels per
     clip) while JLC's model carries one pad per terminal. The tool fits these by
     CENTROID, which is the correct handling. Nothing is waived about the land."}
