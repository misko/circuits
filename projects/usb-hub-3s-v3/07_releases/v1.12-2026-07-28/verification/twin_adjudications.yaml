# usb-hub-3s-v3 jlc_twin adjudications. Every entry cites decisive evidence.
# Statuses match the twin finding strings exactly. The AON PowerPAK/DFN5x6
# merged-drain family entries are REUSED VERBATIM (evidence-identical) from
# the SHIPPED usb-hub-3s v1.0-2026-07-21 board's adjudications — the same
# footprint (KiCad Package_SO:PowerPAK_SO-8_Single) that was ORDERED there.

# -- PowerPAK SO-8 / DFN5x6 merged-drain family: our footprint merges the
#    drain leads + paddle into ONE pad '5'; JLC splits 5-8 + EP 9. Same
#    copper region; the 1<->5 distance delta (twin: 5.39 vs 6.97) is the
#    merged-pad CENTROID vs JLC's corner lead pin 5 — a merging artifact, not
#    a land-pattern disagreement. AOS recommended pattern IS the single drain
#    paddle (AON6354/AON6403 datasheets, verified at parts stage). Ordered on
#    usb-hub-3s v1.0-2026-07-21.
# pad_alias REGISTERS the naming convention instead of adjudicating around it
# (v1.6, 2026-07-25). JLC names the four drain leads 5-8 (+EP 9); our KiCad
# footprint merges all of them into one pad "5". Until now that multiplicity
# made `fit_err` return None at EVERY angle, so best_fit was empty, the model
# was never mounted, and the rotation audit + MODEL-REG silently skipped for
# all six FETs — v1.5 sealed with Q1-Q6 rendering NO BODY and its own
# missing-model list claiming the gap was zero. With the alias the fit is
# exact and the parts are audited like everything else. NOT 5->5: an identity
# alias is a no-op the tool now refuses (it used to self-extend the list).
- {lcsc: C404363, refs: [Q2, Q3, Q4, Q5],
   pad_alias: {6: 5, 7: 5, 8: 5, 9: 5},
   why: "NOT A WAIVER — a NUMBERING TRANSLATION, and the evidence is geometric.
     JLC's model numbers the drain as five separate entities 5,6,7,8,9 (one
     exposed paddle plus four peripheral drain leads); the AOS-recommended land
     this board uses merges them into ONE copper region carrying number 5 five
     times over. MEASURED on the sealed board: 9 pad objects per footprint, of
     which exactly 5 report GetNumber()=='5' and 0 report an empty number, and
     the merged paddle is 3.810 x 3.910 mm. Without this alias the two pad sets
     have different lengths, fit_err returns None at EVERY angle, and the
     rotation audit + MODEL-REG are SILENTLY SKIPPED for the part rather than
     failed — which is exactly how v1.5 shipped with six of its power FETs never
     rotation-checked and a 'bodies mounted' line that said zero were missing.
     The alias makes the two sets comparable; it asserts nothing about polarity."}
- {lcsc: C2760089, refs: [Q1, Q6],
   pad_alias: {6: 5, 7: 5, 8: 5, 9: 5},
   why: "Same merged-drain family and the same measured geometry as C404363
     above (AON6403 vs AON6354; identical PowerPAK SO-8 land, 9 pad objects, 5
     numbered '5', 0 empty). Translation only — no fact is waived."}

- {lcsc: C404363, refs: [Q2, Q3, Q4, Q5], status: PAD-MISMATCH,
   why: "AON6354: KiCad single-paddle pad 5 vs JLC 5-8+EP split; AOS DS recommended pattern is the single paddle. Same footprint ordered on usb-hub-3s v1.0. (v1.2: Q6 MOVED to C2760089/AON6403 — the eFuse cell is gone.)"}
- {lcsc: C404363, refs: [Q2, Q3, Q4, Q5], status: PAD-GEOM,
   why: "AON6354: 1<->5 delta is merged-paddle centroid vs JLC corner-lead pin 5; copper regions coincide (5.39 vs 6.97mm family artifact, ordered on v1.0)."}
- {lcsc: C2760089, refs: [Q1, Q6], status: PAD-MISMATCH,
   why: "AON6403: same merged-drain family as C404363; KiCad single-paddle pad 5 vs JLC 5-8+EP9; AOS single-paddle recommended pattern. Q1 ordered on v1.0; Q6 (v1.2 discrete VBUS reverse-block P-FET) is the SAME C2760089/PowerPAK_SO-8_Single -> same adjudication."}
- {lcsc: C2760089, refs: [Q1, Q6], status: PAD-GEOM,
