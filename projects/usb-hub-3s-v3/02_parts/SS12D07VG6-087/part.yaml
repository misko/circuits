type: slide_switch_spdt        # 1P2T slide switch; used SPST as the master EN-gate
datasheet: {doc_id: SS-12D07, revision: series/LCSC-drawing, url: "https://www.lcsc.com/product-detail/C2939728.html", sha256: null, fetched: 2026-07-23}
package: THT slide switch 8.7x4.4mm, 3 signal pins @2.5mm + 2 mounting posts
footprint: Button_Switch_THT:SW_Slide_1P2T_CK-12D07  # SPIKE: verify/vendored land pattern (SS-12D07 3-in-line + 2 posts) at integration
escape: {style: passive, pitch: 2.5, tier_required: jlc_2layer_default, checked: escape_check 2026-07-23}
pins:
  1: {name: T1, note: "throw 1 (position A)"}
  2: {name: COM, note: "common / pole (center pin) - the wiper"}
  3: {name: T2, note: "throw 2 (position B)"}
gotchas:
  - "MASTER EN-GATE wiring: each LM5116 EN(pin4) is pulled to VIN by a 100k
     (R8 buck-A / R17 buck-C), so both converters are always-on by default. Join
     EN_A + EN_C to COM(2); wire T1(1)->GND. Slide to T1 = both EN grounded ->
     both bucks OFF -> kills the mA-level operating Iq (LM5116 drops to ~9uA
     shutdown each). T2(3) = leave open (EN floats up via the 100k pull-ups = ON).
     Switch sinks only ~2 x 12.6V/100k = 252uA - trivial for this 0.3A/50VDC part."
  - "OPTIONAL soft variant: drive COM from a BSS138 gate instead, FET drain pulls
     the EN-kill bus - lets the switch/jumper be remote and logic-level. Not needed
     for the direct pull-to-GND above (prior run stubbed a BSS138 dir for this)."
  - "FALLBACK if a slide switch is unwanted: 2-pin 2.54mm header + jumper shunt
     across EN-kill<->GND (jumper ON = disabled). Same net topology."
  - "MECHANICAL part: throw assignment (which slide direction = OFF) and exact pad
     numbering are a figure-verify at integration (LCSC drawing) - flagged in README."
verified: "3-terminal 1P2T (SPDT) slide from the SS-12D07 mechanical drawing
  (LCSC C2939728): 3 in-line signal pins @2.5mm pitch + 2 mounting posts, CENTER
  pin (2) = COM (pole/wiper), outer pins (1,3) = the two throws - the universal
  SS-12D07/SK-12D07 drawing convention. Used SPST as the master-off: COM(2) ->
  ENKILL, one throw -> GND (slide = OFF/kill), other throw -> NC. The single
  critical electrical fact (COM = centre pin) is standard; the vendor drawing PDF
  is un-fetchable in the sealed env, so WHICH physical slide direction maps to the
  GND throw (OFF) is a silk-label + order-preview mechanical confirm - 2026-07-23"
