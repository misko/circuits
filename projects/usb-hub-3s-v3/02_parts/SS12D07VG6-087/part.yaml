pins:
  1: {name: T1, note: "throw 1 (position A)"}
  2: {name: COM, note: "common / pole (center pin) - the wiper"}
  3: {name: T2, note: "throw 2 (position B)"}
gotchas:
  - "MASTER EN-GATE wiring: each LM5116 EN(pin4) is pulled to VIN by a 100k
     (R8 buck-A / R17 buck-C), so both converters are always-on by default. Join
     EN_A + EN_C to COM(2); wire T1(1)->GND. Slide to T1 = both EN grounded ->
     both bucks OFF -> kills the mA-level operating Iq (LM5116 drops to ~9uA
     shutdown each). T2(3) = leave open (EN floats up via the 100k pull-ups = ON).
     Switch sinks only ~2 x 12.6V/100k = 252uA - trivial for this 0.3A/50VDC part."
  - "OPTIONAL soft variant: drive COM from a BSS138 gate instead, FET drain pulls
     the EN-kill bus - lets the switch/jumper be remote and logic-level. Not needed
     for the direct pull-to-GND above (prior run stubbed a BSS138 dir for this)."
  - "FALLBACK if a slide switch is unwanted: 2-pin 2.54mm header + jumper shunt
     across EN-kill<->GND (jumper ON = disabled). Same net topology."
  - "MECHANICAL part: throw assignment (which slide direction = OFF) and exact pad
     numbering are a figure-verify at integration (LCSC drawing) - flagged in README."
verified: "3-terminal 1P2T slide, center pin = common (standard SS-12D07
  convention); pinout to be figure-confirmed from LCSC C2939728 drawing at
