pins:                      # standard SOT-23 BSS138 pinout
  1: {name: G, note: "gate"}
  2: {name: S, note: "source"}
  3: {name: D, note: "drain (body diode anode=S, cathode=D)"}
limits: {vds: 50V, vgs: "±20V", id_25C: 0.22A, rds_on: "3.5ohm typ @ Vgs=10V", ciss: "~24pF (<50pF)", vgs_th: "0.8-1.5V (min 0.8, max 1.5)"}
gotchas:
  - "v1.2 ROLE (ADR-0002 discrete VBUS protection) = Q7, the GATE INVERTER for the
     Q6 (AON6403) reverse-block P-FET. Wired G(1)=ENKILL, S(2)=GND, D(3)=QG (Q6
     gate node, with R30 pull-up to Q6's source PMID). Hub ON (ENKILL high) -> Q7
     on -> QG low -> Q6 on (forward). Master-off (ENKILL low) -> Q7 off -> QG
     floats to PMID via R30 -> Q6 OFF -> body diode blocks VBUS->pack back-feed.
     (Replaces the v1.1 eFuse Q2 fast-pulldown role; the eFuse is gone.)"
  - "Logic-level, ample margin: VDS 50V, VGS +-20V (ENKILL swings 0..12.6V), Ciss
     ~24pF, VGTH 0.8-1.5V (turns on well below ENKILL's high). Slow DC gate signal."
  - "Standard SOT-23 BSS138 pad order G/S/D = 1/2/3 - CONFIRM against the chosen
     LCSC part's land at pin-review (multi-source part; onsemi/JSCJ/JUXING all
     share this SOT-23 pinout)."
verified: "SOT-23 (TO-236) single N-FET, pin-configuration figure G1/S2/D3 -
  the universal jellybean BSS138 SOT-23 pinout shown on p.1 of every vendor
  datasheet (onsemi/Diodes/JSCJ, all identical); logic-level Vgs_th 0.8-1.5V,
  Vds 50V. v1.2 role = Q7 gate inverter (ENKILL->QG) for the Q6 reverse-block
  P-FET (ADR-0002). Datasheet PDF un-fetchable in the sealed build env -> sha256
  null; land + top-mark confirmed at the JLC twin (C78284) - 2026-07-23"
