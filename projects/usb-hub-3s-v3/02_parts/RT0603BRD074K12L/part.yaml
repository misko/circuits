gotchas:
  - "v1.2 LOCAL-SENSE fix (journal 03_schematic_v1.2): buck-C FB-top moved from
     3.92k (which the v1.1 VBUSC connector-sense used for a 5.151V connector) to
     4.12k, and the FB now senses the LOCAL 5VC node. LM5116 Vref = 1.215V,
     FB-bot R13 = 1.21k (UNCHANGED). Vout = 1.215*(1+Rtop/1.21):
       4.12k -> 5VC = 5.352V (local, regulated). Connector = 5VC - eFuse+FET IR
       (~34mOhm typ) = ~5.18V typ / ~5.11V hot @5A (>=5.03V quadruple-worst)."
  - "WHY 4.12k (not 4.06k nominal for exactly 5.30V): 4.06k is not an E96 0.1%
     value. 4.02k (E96) -> 5.252V (below the 5.30-5.35V target); 4.12k (E96) ->
     5.352V (in target). 4.12k chosen. Do NOT substitute the 3.92k FB (C728591):
     that yields 5.151V local -> connector ~4.98V @5A and RE-OPENS the runaway/low-V
     concern. buck-A R3 STAYS 3.92k (C728591): its 5VA output has no eFuse and a
     tighter USB-A +5% ceiling (5.25V), so raising it would over-volt USB-A."
  - "0.1% (not 1%) preserves connector worst-corner margin: at 1% the Vref-worst-low
     + hot-eFuse connector corner is ~5.00V vs ~5.03V at 0.1%. Vref +-1.5% still
     dominates absolute accuracy. qty 1/board (R12)."
  - "The tsx sets NO EXPLICIT jlcpcb code for R12 (unlike buck-A R3=C728591)
     because JLC 0.1%-4.12k-0603 stock is unverifiable in the sealed env and
     baking the 3.92k code would silently order the wrong value. tscircuit then
     VALUE-resolves R12 (4.12k / 0603) to JLC candidates (C2933210 / C23016 /
     C860375 in circuit.json — all 4.12k, NOT 3.92k), so the BOM already gets the
     correct VALUE. Those candidates are JLC 1% basic parts; FAB should confirm
     whether to hold the 0.1% (this MPN, for the tighter connector corner) or
     accept the auto-picked 1% — see the gotcha above (1% -> ~5.00V worst corner)."
