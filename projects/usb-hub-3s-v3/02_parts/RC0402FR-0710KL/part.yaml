asserts:
  - {assert: value, equals: 10k, tolerance_pct: 1,
     why: "10k on CC1/CC2 IS the USB-C Rp advertisement. USB Type-C R2.0 Table 4-24:
       Rp to 5V = 56k for Default USB, 22k for 1.5A, 10k for 3.0A. A substituted
       22k would silently re-advertise this port as 1.5A; a 56k would advertise
       500mA/900mA. Nothing electrical fails and no gate downstream of the BOM can
       see it — the sink simply draws less than the board can deliver."}
gotchas:
  - "THIS ENTRY EXISTS BECAUSE THE PART IT REPLACES WENT TO ZERO. v1.0-v1.10 shipped
     R28/R29 as C25744 (UNI-ROYAL 0402WGF1002TCE, BASIC library). On 2026-07-27 the
     user's v1.10 BOM upload came back '10 shortfall' on that line, and the JLC parts
     API confirms `stockCount: 0`. C25744 was the ONLY basic-library 10k 0402 in the
     catalog, so EVERY replacement is an Extended part and costs the one-time feeder
     fee. That fee is accepted (ADR/CHANGELOG v1.11); the alternative is a board that
     cannot be assembled."
  - "DROP-IN, AND THE CLAIM IS CHECKABLE RATHER THAN ASSERTED: JLC's catalog
     `describe` string for C60490 is CHARACTER-IDENTICAL to C25744's ---
     `-55C~+155C 10kOhm 50V 62.5mW Thick Film Resistor +-1% +-100ppm/C 0402 Chip
     Resistor - Surface Mount ROHS` (both read live 2026-07-27, compared as strings,
     equal). Same package, value, tolerance, tempco, power and voltage. No copper,
     footprint, netlist or CPL change: the v1.11 board .kicad_pcb is md5-identical to
     v1.10's, 83af8e5a5596a51cf139dd06e8903d47."
  - "EXTENDED-TIER, so the ORDER-DAY STOCK RECHECK IS NOT OPTIONAL on this line the
     way it was for a basic part. It is also the reason the line now needs a feeder:
     `componentLibraryType: expand`. `leastPatchNumber` is 20 --- the SAME as C25744's
     --- so the minimum-order step did not move."
  - "qty 2/board (R28, R29). No alternate is coded: the whole point of this entry is
     that the alternate WAS the basic part and it is gone. If C60490 also runs dry,
     any 10k +-1% 0402 with stock is electrically equivalent --- but bake the code in
     the tsx and re-verify the catalog `describe`, do not let the fab exporter
     value-resolve it (that mechanism shipped R12 as C2933210 and R30 as C2933195,
     both catalog-wrong, on this same board)."
