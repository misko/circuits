gotchas:
  - "v1.2 ROLE = local 5VC ceiling clamp (belt-and-suspenders). D7 cathode on 5VC,
     anode on GND. Caps 5VC below ~6.8V if the buck ever loses regulation (e.g. an
     FB resistor opens), protecting the 100uF/10V output caps (C29-C32) and the
     eFuse IN_SYS/OVP divider. Last-ditch only: under a hard runaway the buck
     current-limits into D7, which will eventually fail SHORT -> 5VC collapses
     (protective). The normal runaway path is already closed by the LOCAL-SENSE FB
     (5VC regulated) + FLT->EN shutdown; D7 is the final layer."
  - "WHY 6.2V (not 5.6V): 5VC normal = 5.352V, no-load worst-high 5.432V (Vref
     +1.5%). BZT52C6V2 Vz(min) 5.8V > 5.432V -> NO nuisance conduction. A 5V6
     (Vz-min 5.2V) would conduct at the 5.432V normal-high and load the rail. 6V2
     clamps ~6.2-6.8V, well under the 10V output-cap rating (3V+ margin)."
