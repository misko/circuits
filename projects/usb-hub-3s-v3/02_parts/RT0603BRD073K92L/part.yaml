gotchas:
  - "REPLACES the v1.0 3.74k FB-top (R3 on 5VA, R12 on 5VC; v1.0 part C304743).
     LM5116 Vref = 1.215V, FB-bot R4/R13 = 1.21k (UNCHANGED). Vout = 1.215 x
     (1 + Rtop/1210). 3.74k -> 4.97V (v1.0). 3.92k -> 5.15V (v1.1)."
  - "WHY 3.92k not the nominal 3.87k: exact 3.87k 0.1% 0603 is NOT in JLC's
     library (Yageo RT0603BRD073K87L / Panasonic ERA-3AEB3871V both absent).
     Nearest stocked 0.1% are 3.92k (this part, C728591) and 3.83k (C861384).
     3.92k is preferred: buck-C 5.15V - eFuse+FET drop ~190mV at 5A = ~4.96V VBUS
     (vs 3.83k -> 5.06V -> ~4.87V); no-load 5.15V < USB 5.25V max. On 5VA the
     bump offsets the 3x TPS2557 switch drop (~43mOhm) so USB-A ports hold ~5V."
  - "0.1% (not 1%) tightens the divider spread so the raised 5.15V no-load setpoint
     stays under 5.25V. For full benefit R4/R13 (1.21k bot) should ALSO go 0.1%
     (currently 1%, C137779) - flagged; Vref +-1.5% still dominates absolute accuracy."
  - "qty 2/board (R3 + R12). ALT 3.83k C861384 (stock 1701) if a lower VBUS wanted."
