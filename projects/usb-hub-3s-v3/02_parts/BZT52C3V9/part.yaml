gotchas:
  - "v1.2 ROLE = eFuse SHDN abs-max clamp (SLVSE94G: V(SHDN) abs-max 5.5V). D5
     cathode on SHDN, anode on GND. Normal SHDN = 5VC*0.554 = 2.97V (R33 40.2k /
     R36 49.9k divider), which is BELOW the ~3.7V knee so D5 is OFF and does not
     load the enable level. On a 12.6V 5VC buck-HS-short the bare divider would
     reach 6.98V; D5 breaks down and CLAMPS SHDN to ~3.7V (<<5.5V, >1.8V margin).
     This is the actual SHDN-blocker fix. It also caps SHDN if R36 opens (mis-stuff)."
  - "WHY 3.9V (not 3.3V or 4.7V): must sit ABOVE the 2.97V normal enable level (no
     nuisance conduction / no eating into the >2V SHUTR enable threshold) and WELL
     BELOW 5.5V abs-max. 3.9V nom clears both with >1V each way. A 3V3 would risk
     conducting at the 2.97V normal level; a 4V7 clamps closer to abs-max."
