verification_scopes:
  - id: shell
    description: Floor-down foundation, isolated PCB bosses, four independent closure posts, and one roof-down lid with four post-clearing side skirts.
    required: true
    depends_on: []
  - id: board_retention
    description: PCB seats only on H1-H4 bosses and remains fastened to the base while the complete wall lid and all case screws are removed.
    required: true
    depends_on: [shell]
  - id: connector_access
    description: Full 40 mm vertical lid install/removal over the populated PCB through five bottom-open connector notches, plus simultaneous connector and top-service access.
    required: true
    depends_on: [shell, board_retention]
  - id: thermal
    description: Closed PETG enclosure behavior at the declared combined output load and ambient.
    required: true
    depends_on: [shell, connector_access]
