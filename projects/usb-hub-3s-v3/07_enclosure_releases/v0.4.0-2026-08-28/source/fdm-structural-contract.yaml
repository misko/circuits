load_cases:
  - id: pcb_clamp_and_service
    description: PCB screw clamp, board insertion, and board-removal loads.
    direction_local: [0, 0, 1]
    application: Applied through the PCB screw and board bearing face.
    reaction: Reacted through each isolated boss root into the foundation floor.
  - id: connector_mating_west_east
    description: Reversible insertion and extraction load at the west XT60 and east USB-A connector axes.
    direction_local: [1, 0, 0]
    application: Applied by a hand-held mating plug at J1-J4; the roof and open sides provide no structural reaction.
    reaction: Reacted by the connector and PCB into the H1-H4 clamp set, then through all four boss roots into the foundation floor; connector and PCB strength remain outside this mesh screen.
  - id: connector_mating_south
    description: Reversible insertion and extraction load at the south USB-C connector axis.
    direction_local: [0, 1, 0]
    application: Applied by a hand-held mating plug at J5; the roof and open sides provide no structural reaction.
    reaction: Reacted by the connector and PCB into the H1-H4 clamp set, then through all four boss roots into the foundation floor; connector and PCB strength remain outside this mesh screen.
  - id: connector_cable_pull_and_bend
    description: Out-of-plane cable pull, rising XT60 termination, and cable-bending moment at J1-J5.
    direction_local: [0, 0, 1]
    application: Applied through the mated plug, termination, heat-shrink, and cable service envelope; magnitude and moment arm remain unmeasured.
    reaction: Reacted by the connector and PCB into all four PCB screws and support bosses; no lid edge, skirt, cable, or connector body is credited as an enclosure support.
  - id: connector_hand_tool_torque_reaction
    description: Hand grip, plug twist, and any permitted connector-service tool reaction at J1-J5.
    direction_local: [0.7071067811865476, 0.7071067811865476, 0]
    application: Applied as a lateral and torsional service reaction at a populated connector while adjacent connectors may be populated.
    reaction: Distributed by the PCB into the H1-H4 clamp set and boss roots; this direction records the enclosure load path but does not certify PCB, solder-joint, connector, hand, or tool capacity.
  - id: case_closure_preload
    description: M3 closure preload including one-corner and uneven tightening.
    direction_local: [0, 0, -1]
    application: Applied at each lid screw bearing land and matching base post.
    reaction: Reacted through the closure member into the roof or foundation.
  - id: lid_twist_and_removal
    description: Free-lid twist and handling after all screws and post sleeves are completely disengaged.
    direction_local: [0.7071067811865476, 0.7071067811865476, 0]
    application: Applied at a closure ear only after the roof is detached from every base post.
    reaction: Reacted through the tapered root into the roof plate.
  - id: closure_joint_lateral_service
    description: Fastened roof twist, warped seating, post-sleeve binding, and the lateral phase of lid service before every sleeve is disengaged.
    direction_local: [0.7071067811865476, 0.7071067811865476, 0]
    application: Applied through the roof and one or more closure ears while screws, sleeves, or posts still constrain the lid.
    reaction: Distributed through all four lid ears, screw/sleeve interfaces, C1-C4 base posts, and their roots into the foundation floor; screw, contact, material, and physical load capacity remain unqualified.
  - id: insert_coupon_press
    description: Cold-press insertion and extraction load on a coupon boss.
    direction_local: [0, 0, -1]
    application: Applied by the insert installation tool at the boss axis.
    reaction: Reacted through the boss root into the coupon slab.

