limits:
  vrm_io: 5.25V (leakage spec point)
  esd: "IEC 61000-4-2 level 4: 15kV air / 8kV contact; MIL-STD-883G 25kV"
  tj_range: -40C to 125C
electrical:
  vbr_vbus_gnd: 6V min @ 1mA
  vcl_1a_8_20us: 12V max (any I/O to GND)
  vcl_5a_8_20us: 17V max
  c_io_gnd: 2.5pF typ / 3.5pF max
  c_io_io: 1.2pF typ / 1.7pF max
  leakage: 150nA max @ 5.25V
wiring:
  charge_only_usb_a: "BC1.2 DCP with D+ shorted to D-: run the shorted D+/D-
    node through ONE flow-through pair (connector D+/D- short -> pin 1, pin 6
    -> nothing further needed), or protect the pair before the short: D+ on
    pins 1->6, D- on pins 3->4, short on the device side. Simplest: tie the
    single shorted DP/DM net to pin 1 (or 3); the paired pin may be left
    tied to the same net. Pin 5 -> 5V_A rail, pin 2 -> GND."
  usb_c_cc_protection: "CC1 -> pins 1..6 pair, CC2 -> pins 3..4 pair (route
    CC1 in pin 1, out pin 6; CC2 in pin 3, out pin 4). Pin 5 -> 5V_C rail,
    pin 2 -> GND. Note Rp pull-ups sit on the same CC nets; USBLC6 leakage
    (150nA) is negligible against Rp 10k."
gotchas:
  - "Pins 1/6 and 3/4 are flow-through PAIRS of the same line (1 and 6 are
    both named I/O1, 3 and 4 both I/O2 in Figure 1). Route the signal in one
    side and out the other for best ESD layout; do NOT treat 4 and 6 as two
    additional independent channels — the device protects exactly 2 lines
    plus VBUS."
  - "VBUS pin 5 must be connected to the 5V rail for the rail-to-rail
    topology to clamp correctly; leaving it floating degrades positive-surge
    clamping."
  - "Keep GND (pin 2) stub to the ground plane short: datasheet section 2.2
    shows 10mm of 0.5mm trace adds ~144V to the clamp during an 8kV strike."
  - "Not suitable as the only protection for rails above 5.25V working
    voltage — this is a 5V-class part."
verified: "pin map read from Figure 1 'Functional diagram (top view)' of Doc
