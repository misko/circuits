gotchas:
  - "Polarity/orientation: P-channel high-side reverse-battery FET goes in
    the +rail with SOURCE toward the load side / DRAIN toward the battery
    (body diode conducts on correct polarity, FET then shorts it out; on
    reversed battery the body diode blocks). Getting D and S swapped defeats
    the protection — the tab (pad 2) is DRAIN."
  - "Gate is pin 1 (left lead, top view), source pin 3 (right lead) — this is
    the JEDEC TO-252 convention but was explicitly re-verified from the
    package figure, not assumed."
  - "Vgs abs max is +/-20V; a 3S pack (12.6V max) gate-to-source is safe
    without a zener, but do not exceed 20V if input range ever grows."
  - "Rds(on) specs are at NEGATIVE Vgs (-10V / -4.5V); gate must be pulled
    toward GND relative to source to enhance."
