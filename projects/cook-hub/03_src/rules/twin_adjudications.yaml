- lcsc: C692429
  refs: [J11]
  status: MIRRORED
  why: >-
    Numbering-CONVENTION disagreement, not a physical mirror: our vendored
    IDC_2x16_Keyed numbers pads in the IDC RIBBON zigzag (pin1 NW, odd row
    north, even row south, columns west->east) which is what the spec's
    "CH n = pins 2n-1,2n" ribbon harness requires (v1.0 connector pin
    review verified all 32 nets against this map). JLC's C692429 CAD
    numbers the same physical grid row-major, which the fit reports as a
    perfect mirror. The part is THT (holes constrain placement) and the
    keyed shroud is centre-symmetric: assembly cannot mirror it. Pin-1
    triangle on our silk marks the NW corner; bring-up checklist includes
    continuity CH1 = pins 1/2 at the shroud key.
