gotchas:
  - "alternate code C51886141 exists for the same MPN"
  - "same MPN TPD2E2U06 is also sold in a 3-pin DCK/SC70 variant (2 pins per Fig, no separate NC pins) — TPD2E2U06DRLR specifically is the 5-pin DRL/SOT-553 variant; do not cross-read the DCK pin table (IO1=1, IO2=2, GND=3) onto this part"
  - "pins 1 and 2 are NC, not a second GND or a VCC rail — do not tie them to ground by default; datasheet allows float/GND/VCC but gives no default, leaving them unconnected (floating) is the conservative choice absent a stated rail"
verified: "pin map cross-checked against datasheet SLLSEG9C Sec. 5 'Pin Configuration and Functions', DRL Package 5-Pin SOT (Top View) figure + the 'Pin Functions' table, both on page 3 — 2026-07-23 (IO1=3, IO2=5, GND=4, NC=1,2). Package mechanical (DRL0005A, SOT-5X3, body 1.5-1.7mm x 1.1-1.3mm nominal 1.6x1.2mm, 0.5mm pitch, 0.6mm max height, JEDEC MO-293 variation UAAD-1) confirmed against Mechanical Data drawing on page 17."
layout:
  source: "datasheet SLLSEG9C Sec. 10.1 'Layout Guidelines' (p.11): place the device as close to the connector as possible (minimizes EMI coupling from the struck trace into other unprotected traces upstream of the TVS); route the protected traces (connector-to-TVS segment) as straight as possible with no sharp corners (large-radius rounds only, to avoid E-field buildup); keep unprotected traces away from the protected segment. Sec. 10.2 'Layout Example' Figure 12 'Routing with DRL Package' (p.12) shows a GND via placed immediately adjacent to the GND pin."
  reviewed: "2026-07-23"
  notes: >
    (net-span budgets not used: IO1=AUDIO_P and IO2=AUDIO_N fan out to the connector,
    the coupling cap AND a test point, and GND is the board plane — their whole-net
    span is not a meaningful local metric, so P-ADJ keep_short would false-fail. The
    connector-proximity intent is a placement rule verified by the render/pin reviews.)
    Datasheet SLLSEG9C §10.1 + Fig 12: place D1 as close to the connector (J1) as
    possible to minimize the unprotected stub; route IO1/IO2 (connector-to-TVS) as
    straight segments; put a GND via immediately adjacent to pin 4. ON THIS BOARD the
    RJ45 is a large THT jack whose contacts sit INSIDE the shell, so D1 lands just
    outside the connector body on the audio-exit side — the achievable ~13mm stub is
    acceptable because AUDIO_P/AUDIO_N are DRIVEN op-amp outputs (low-Z), not sensitive
    inputs, and the TVS still clamps the exposed pins. Pins 1,2 (NC) are FLOATED
    (the datasheet's stated conservative choice): their 0.5mm-pitch inner pads
    can't be reached by the GND pour on 2 layers, and they carry no internal
    connection, so grounding them only created an unroutable open. IO1/IO2/GND
    (pins 3,4,5) carry the ESD function.
layout_refs:
  - "datasheet SLLSEG9C Figure 12, Sec. 10.2 Layout Example (p.12)"
