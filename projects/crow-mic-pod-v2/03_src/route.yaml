# crow-mic-pod-v2 route + stitch — input to route_and_stitch_generic.py.
# 2-layer. GND is NOT routed — F/B pours + stitch vias own it. Analog board:
# both-layer GND pours guard the audio pair; the isolated beep pair routes in
# the SW corner. jlc_2layer_default (0.6/0.3 vias, 0.127 floor).

project:
  name: crow_mic_pod_v2
  board: 04_kicad/crow_mic_pod_v2.kicad_pcb
  build_dir: 06_build/route

prep:
  out: r0.kicad_pcb
  keepouts:
    layers: [User.2]
    mounting_holes: {radius: 3.0}      # H1-H4 M3 heads
    edge_band: 0.5                     # KRT has no edge concept; dru floor 0.3
    rects:
      # J1 RJ45 NPTH board-lock posts (Ø3.25mm, radius 1.625) — fence before KRT
      # (RJHSE-5384 gotcha). Posts at (16.96,34.79) and (16.96,22.09). Keepout
      # sized ~2mm radius (hole + clearance + track); east edge at x19.0 so it
      # does NOT pinch J1.1's (x19.5) southward audio escape.
      - {x0: 14.9, y0: 32.8, x1: 19.0, y1: 36.8, layer: User.2}
      - {x0: 14.9, y0: 20.1, x1: 19.0, y1: 24.1, layer: User.2}
  waves:
    exclude: ["GND", "unconnected-*"]
    groups:
      # hardest/most-constrained first. AUDIO_P/N route in `sig` (default class).
      beep: [5V_BEEP, BEEP_SWITCHED_RETURN]
      pwr:  [5V_AUDIO, VMIC_F]
      sig:  rest

route:
  krt: ~/gits/KiCadRoutingTools
  common:
    layers: [F.Cu, B.Cu]
    via_size: 0.6
    via_drill: 0.3
    fab_tier: standard
    no_stub_layer_swap: true
    keepout: true
    keepout_layer: User.2
    clearance: 0.2
  race: 5      # KRT is stochastic; J1.1 (AUDIO_P) is boxed in by the RJ45 pad
               # field + post keepout — race candidates and keep the measured best
  kicad_python: /usr/bin/python3
  waves:
    # widths OMITTED -> derive from netclass floors (beep 0.5, pwr 0.4)
    - {name: beep, group: beep, max_iterations: 400000}
    - {name: pwr,  group: pwr,  max_iterations: 400000}
    - {name: sig,  group: sig,  track_width: 0.25, max_iterations: 800000,
       max_probe_iterations: 60000, max_ripup: 30}
  # canon M3: the shipped board imports the PROMOTED chain (race winner), not a
  # fresh stochastic route. Delete this to re-route from scratch.
  final: 03_src/route/r3.kicad_pcb

stitch:
  clearance: 0.15
  via: {size: 0.6, drill: 0.3, spacing: 0.85, pth_margin: 0.3}
  keepin: {inset: 0.8}
  passes: [dedupe_vias, normalize_vias, drop_micro_fragments, drop_dangling,
           split_t_junctions, reload, hole_to_hole, pad_rescue, stub_fallback,
           astar_fallback, stitch_grid, fill, island_rescue, fill,
           unify_zone_priorities, heal_islands, gate]
  unify_zone_priorities: {min_bbox: 0.8}
  dedupe_vias: {radius: 0.5, metric: box}
  normalize_vias: {below_width: 0.449, size: 0.6, drill: 0.3}
  drop_micro_fragments: {max_length: 0.12, require_free_end: true}
  drop_dangling: {max_length: 1.0, tol: 0.05, sweeps: 4}
  split_t_junctions: {tol: 0.05}
  hole_to_hole: {min_gap: 0.5, mode: nudge, prefer_keep: [GND]}
  pad_rescue:
    net: GND
    via_in_pad: true
    served_within: 1.6
    rings: [0.75, 0.95, 1.2, 1.6, 2.1, 2.7]
    stub_width: 0.3
    require: none
  stub_fallback: {net: GND, min_dist: 0.2, max_dist: 8.0, width: 0.3}
  astar_fallback: {net: GND, width: 0.25, window: 3.0, attempts: 3}
  stitch_grid:
    net: GND
    x: [14, 88, 8]
    y: [14, 53, 8]
    # keep stitch out of the RJ45 courtyard + its post keepouts
    avoid: [{x0: 10.5, y0: 18.0, x1: 28.5, y1: 39.5, margin: 1.0}]
  island_rescue: {min_bbox: 0.8, layers: [F.Cu, B.Cu], require: all}
  heal_islands: {min_bbox: 0.8}
