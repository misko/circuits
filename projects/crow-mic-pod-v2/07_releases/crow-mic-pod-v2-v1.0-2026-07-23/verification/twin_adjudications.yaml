# JLC digital-twin adjudication register — crow-mic-pod-v2
#
# Every entry here removes a finding from the twin's CRITICAL gate. Each is
# backed by measurement/evidence recorded inline (canon: adjudications need
# evidence, not rationale). Re-running jlc_twin.py with
# `--adjudications 03_src/rules/twin_adjudications.yaml` must read these and
# gate green (exit 0) with zero UNADJUDICATED criticals.

- lcsc: AOM-5024L-HD-R
  refs: [MK1]
  status: NO-CAD
  why: >
    "AOM-5024L-HD-R" is not a valid LCSC id (doesn't start with "C") — it is
    the part's MPN, carried into the BOM's LCSC column because the part has
    NO JLC/LCSC listing at all (02_parts/AOM-5024L-HD-R/part.yaml
    sourcing: {lcsc: null, digikey: "668-1538-ND"}; gotchas: "not in JLC
    catalog — hand-wire (Digi-Key 668-1538-ND)"). Confirmed absent from the
    library, not a transient fetch error: the fetcher's own message
    ("should start with C") never matches the tool's NOCAD/transient
    patterns, so it fails closed as FETCH-FAILED until adjudicated here.
    MK1 is correctly excluded from cpl_jlc.csv (exclude_from_pos_files) —
    it is a hand-solder electret capsule with no SMT footprint at JLC.
    FIXED 2026-07-23 (was: MK1's BOM LCSC column carried the MPN string):
    refdes_codes_from_circuit + the export carry-over now blank any non-C\d+
    supplier code (an MPN is a converter FPID-resolution handle, never an
    LCSC), so MK1's BOM LCSC column is now BLANK. This FETCH-FAILED->NO-CAD
    adjudication still stands (the part is genuinely not in the JLC library).

