- lcsc: C192421
  refs: [U1]
  status: PAD-GEOM
  why: >
    Land-pattern LENGTH difference (SOIC-8, 1.27mm pitch), not a pinout or
    polarity defect. Already characterized in
    02_parts/OPA1678IDR/part.yaml gotchas: "twin PAD-GEOM ~0.47mm vs JLC
    CAD is the KiCad-IPC vs TI-datasheet SOIC-8 pad-length split — leads
    land on both pad shapes; adjudicate at twin, do not re-footprint."
    Measured pad1<->8 distance: ours 4.95mm vs JLC 5.42mm (d0.47mm),
    consistent with that prior characterization. Package family, pad
    count, and pin ordering match (KiCad Package_SO:SOIC-8_3.9x4.9mm
    footprint is the IPC-nominal outline; JLC's own fetched footprint
    (SOIC-8_L5.0-W4.0-P1.27-LS6.0-BL) uses TI's datasheet-specific,
    slightly longer land). Both shapes accept the part's leads; no
    re-footprint warranted. ROT-DB-SUGGEST for this part (fit=0.24mm,
    jlc_offset=90 vs db=270) is a separate, non-fatal finding — per the
    same part.yaml note, KEEP the rotations-db value of 270 (assembly-zero
    truth) and verify pin-1 in the JLC order preview rather than applying
    the suggestion blindly.

- lcsc: C559105
  refs: [D3]
  status: PAD-GEOM
  why: >
    Land-pattern LENGTH difference on a 2-pad SMA/DO-214AC diode (same
    class of finding as U1 above: standard KiCad footprint vs JLC's
    vendor-specific recommended land, not a pinout/polarity issue).
    Measured (2026-07-23): our footprint (Diode_SMD:D_SMA, KiCad stock)
    pad1/pad2 centers at (-2,0)/(2,0) mm -> 4.00mm span; JLC's fetched
    footprint for C559105 (SMA_L4.4-W2.6-LS5.0-RD) pad1/pad2 centers at
    (-2.19,0)/(2.19,0) mm -> 4.38mm span (matches the reported
    "ours 4.00mm vs JLC 4.38mm (d0.38mm)" exactly). Polarity convention
    agrees on both: pad 1 = negative-x = cathode in both our footprint
    (part.yaml verified note: KiCad's D_SMA places the polarity-band
    silkscreen at x=-3.51mm, adjacent to pad 1) and JLC's (same pad-1-at
    -negative-x numbering as their own footprint). JLC's land is simply
    ~0.19mm longer per side (extra solder-fillet margin, common vendor
    practice for DO-214AC); both patterns are valid for the same physical
    SMA body. D3 is POPULATED (ADR-0001 D5, 2026-07-23 — the P0-D fix): it
    is a normal machine-placed SMA part in BOTH the BOM and the CPL, fetched
    as an ordinary BOM code (no longer via --also), and this adjudication
    is the standard land-length PAD-GEOM acceptance for it.
