- lcsc: C22359707
  refs: [LS1]
  status: PAD-MISMATCH
  why: &ls1_why >
    NOT a land-pattern or polarity defect — a pad-NUMBERING-convention
    mismatch between our vendored footprint and JLC's own EasyEDA footprint
    for the same physical 4-pad SMD buzzer (Same Sky/CUI CMT-8504-100-SMT-TR).
    Measured (2026-07-23): our footprint (crow_mic_pod:CMT-8504-100-SMT-TR,
    from 02_parts/CMT-8504-100-SMT-TR/part.yaml land_pattern, datasheet
    rev 1.04 p.2 "Recommended PCB Layout") numbers pads going
    1=top-left(+) 2=bottom-left(-) 3=top-right(NC) 4=bottom-right(NC), pad
    centers at (+/-3.5,+/-3.5)mm. JLC's fetched footprint
    (jlc.pretty/BUZ-SMD_4P-L8.5-W8.5-P8.50-TL-A.kicad_mod) numbers the SAME
    four physical corners 1=bottom-left(-3.6,-3.6) 2=top-left(-3.6,3.6)
    3=top-right(3.6,3.6) 4=bottom-right(3.6,-3.6) — i.e. JLC's pads 1 and 2
    are swapped vs ours (JLC 1 = our 2, JLC 2 = our 1); pads 3/4 already
    agree. This is corroborated exactly by the raw PAD-GEOM number:
    pad1<->3 "ours 7.00mm vs JLC 10.18mm (d3.18mm)" is the diagonal
    distance you get comparing our top-left pad ("1") to JLC's top-right
    pad ("3", unaliased) — sqrt(7.2^2+7.2^2)=10.18mm exactly — not a real
    land-pattern disagreement. Recomputing all 6 pairwise pad-pair
    distances with JLC's pads renumbered by physical position
    (JLC-1->our-2, JLC-2->our-1, JLC-3->our-3, JLC-4->our-4) gives deltas
    of 0.20-0.28mm vs our footprint on every pair — all within the 0.3mm
    PAD_GEOM_TOL (JLC's pad span is 7.2mm vs our 7.0mm, a legitimate small
    land-size difference). Physical polarity is unaffected: our
    footprint's own pin1="+"/pin2="-" mapping (verified against the
    datasheet's POLARITY PAD callout in part.yaml) is untouched by JLC's
    internal numbering choice.
    TOOL NOTE: attempted to encode this as a `pad_alias: {"1":"2","2":"1"}`
    (the documented mechanism for exactly this class of finding) but the
    alias implementation in jlc_twin.py does sequential pop/extend per
    dict-entry, which corrupts a true 2-way swap (it merges pad "1" into
    "2" first, then pops the now-merged "2" into "1", losing one pad
    entirely) — confirmed live: applying it turned a clean PAD-GEOM
    finding into PAD-MISMATCH best=none. Falling back to a direct status
    adjudication with the hand-verified numbers above; the alias mechanism
    needs a true-swap fix (e.g. resolve all renames from a copy of the
    original dict) before it can be trusted for 2-way swaps.

