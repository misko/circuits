  why: >
    Consign-only placeholder code (C99* prefix) for RJHSE-5384 — per
    02_parts/RJHSE-5384/part.yaml gotchas: "C99* code = consign-only
    placeholder, permanently stock 0, NO EasyEDA CAD — twin needs an
    evidence-backed NO-CAD adjudication; hand-solder line". Verified
