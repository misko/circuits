gotchas:
  - "The complete TPS259474L suffix matters: 4 selects circuit-breaker behavior and L selects latch-off. The A suffix auto-retries; 0/2 variants actively current-limit instead."
  - "R_AGG_ILIM=1k 0.1% programs 3.334A nominal. Charging TI's +/-10% ILIM accuracy and the resistor's +/-0.1% plus +/-25ppm/C over 100C gives 2.981..3.679A."
  - "C_AGG_TIMER=3.3nF C0G yields a charged 1.608..5.049ms blanking interval from TI's 1.286..1.741V and 1.2..2.5uA limits. A persistent aggregate overload then latches off until input power is cycled."
  - "C_AGG_DVDT=3.3nF C0G bounds the fastest nominal slew to 0.640V/ms at its charged low-capacitance corner; the effective output bank's startup inrush remains below the aggregate threshold."
  - "The shared 150k/10k/43.2k divider implements TI equations 10/11. PGTH is intentionally grounded and the unused open-drain PG output is left open."
  - "Keep R_AGG_ILIM, C_AGG_TIMER, C_AGG_DVDT and the divider adjacent to their pins. Keep ILM parasitic capacitance below TI's 50pF limit and away from switching copper."
verified: "CITED: exact TPS259474L latch-off/circuit-breaker row in TI SLVSFC9C Device Comparison Table, PDF p.4; RPW 10-pin QFN top view Figure 5-1 and complete Pin Functions Table 5-1, PDF pp.5-6; independently re-read 2026-08-17. Exact JLC/LCSC C2864845 identifies TPS259474LRPWR and the compatible VQFN-HR CAD."
