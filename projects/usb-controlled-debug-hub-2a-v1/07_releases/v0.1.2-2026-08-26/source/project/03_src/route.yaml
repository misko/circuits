      - {net: DATA_CC1, pin: J_DATA.A5, segments: [{layer: F.Cu, width: 0.18, pts: [[27.3200,55.7500],[32.3000,55.7500],[32.3000,53.0000],[34.0000,52.5100]]}]}
      - {net: DATA_CC2, pin: J_DATA.B5, segments: [{layer: F.Cu, width: 0.18, pts: [[27.3200,58.7500],[30.0000,58.7500],[30.0000,62.0000],[33.5000,63.5100]]}]}
      - net: USB_UP_VBUS
        pin: J_DATA.A4
        segments:
          - {layer: F.Cu, width: 0.30, pts: [[27.3200,54.6000],[29.0000,54.6000],[29.0000,51.0000]]}
          - {layer: F.Cu, width: 0.30, pts: [[27.3200,59.4000],[28.0000,59.4000]]}
          - {layer: B.Cu, width: 0.30, pts: [[28.0000,59.4000],[29.5000,60.5000],[29.5000,64.5000],[39.0000,64.5000],[39.0000,63.5100]]}
          - {layer: F.Cu, width: 0.30, pts: [[29.5000,64.5000],[29.4000,64.6000],[24.3000,64.6000],[21.4000,61.7000],[21.4000,61.5000],[21.3000,61.4000],[21.3000,52.4000],[21.8000,51.9000],[22.5000,51.9000],[23.3000,51.1000],[28.9000,51.1000],[29.0000,51.0000]]}
          - {layer: F.Cu, width: 0.30, pts: [[39.0000,63.5100],[38.0000,63.5100]]}
        vias: [[28.0000,59.4000],[29.5000,64.5000],[39.0000,63.5100]]
      - net: PD_CC1
        pin: J_POWER.A5
        segments:
          - {layer: F.Cu, width: 0.18, pts: [[27.3200,116.7500],[28.5000,116.7500]]}
          - {layer: In2.Cu, width: 0.18, pts: [[28.5000,116.7500],[37.0000,117.0000]]}
