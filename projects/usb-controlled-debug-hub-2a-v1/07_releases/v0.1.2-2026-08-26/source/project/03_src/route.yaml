  final: 03_src/route/final.kicad_pcb

# OPTIONAL A-VIA contract for a board whose power path is forced through a
# layer-transition bank. Rectangles must tightly bound the physical series
# boundary; arbitrary same-net stitching is not proof that current crosses it.
# Use a published finished-hole basis, give fill material zero credit, and
# retain loaded first-article thermal validation.
via_ampacity:
  source: "IPC-2152 conservative screening basis; validate temperature on the loaded first article"
  method: "sum conservative 10 C-rise capacity by finished hole; no fill credit"
  temperature_rise_c: 10
  capacity_by_finished_hole_mm: {0.20: 0.55, 0.30: 0.84}
  transfers:
    - {name: pd_output_to_trunk, net: VBUS_PD_PROTECTED, rect: [57.5,119.5,60.9,121.3], minimum_vias: 8, required_continuous_a: 3.0, why: "all negotiated input current enters the shared protected B.Cu trunk here"}
    - {name: trunk_to_buck_a, net: VBUS_PD_PROTECTED, rect: [84.4,118.4,87.6,120.0], minimum_vias: 8, required_continuous_a: 1.5, why: "bank-A converter input transition"}
