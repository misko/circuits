         vias: [[37.5000,129.0000],[33.5000,113.5000]]}
      - {net: VBUS_PD, pin: R_PD_VBUS.1, segments: [{layer: F.Cu, width: 0.18, pts: [[34.9900,122.5000],[35.0000,120.0000]]}]}
      - {net: VBUS_PD, pin: R_PD_UV_TOP_HI.1, segments: [{layer: F.Cu, width: 0.18, pts: [[46.4900,126.5000],[44.0000,124.0000],[40.0000,120.0000]]}]}
      - {net: VBUS_PD, pin: U_PD_IN.13, why: "right-side VBUS sense/supply land loops around adjacent GND/NC pins into the fused-input zone",
         segments: [{layer: F.Cu, width: 0.30, pts: [[54.9700,118.6250],[58.0000,118.6250]]},
                    {layer: B.Cu, width: 0.30, pts: [[58.0000,118.6250],[55.5000,113.0000]]}],
