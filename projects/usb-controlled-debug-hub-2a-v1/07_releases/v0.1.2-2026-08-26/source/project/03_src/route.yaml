# Source-owned route contract for usb-controlled-debug-hub-2a-v1.
#
#   /usr/bin/python3 ../../skills/kicad-pcb/scripts/route_and_stitch_generic.py \
#       prep 03_src/route.yaml
#   ~/gits/KiCadRoutingTools/.venv/bin/python \
#       ../../skills/kicad-pcb/scripts/route_and_stitch_generic.py route 03_src/route.yaml
#   /usr/bin/python3 ... import 03_src/route.yaml
#   /usr/bin/python3 ... quick  03_src/route.yaml   # loop tool: seconds-fast
#       unconnected + clearance/track_width verdict, pre-stitch (exit 1 dirty)
#   /usr/bin/python3 ... stitch 03_src/route.yaml
#
# 150x115 mm, four-layer. GND is not field-routed; the F/B pours, inner
# reference plane, explicit local returns, and stitch vias own it.

project:
  name: usb_controlled_debug_hub_2a
  board: 04_kicad/usb_controlled_debug_hub_2a.kicad_pcb
  build_dir: 06_build/route

# Process contract consumed by kicad-pcb/scripts/pcb_flow.py.  Geometry tools
# ignore this block.  It makes stage ownership, deterministic/stochastic
# copper, and wall-time expectations explicit before an expensive route begins.
flow:
  heartbeat_s: 10
  # Fail-closed independent evidence before the first route. The initial
  # schematic/placement build stops until these exact-artifact witnesses exist.
  pre_route_reviews:
    board: 04_kicad/usb_controlled_debug_hub_2a.kicad_pcb
    netlist: 06_build/netlists/usb_controlled_debug_hub_2a.net
    topology: 08_reviews/pre-route_topology.md
    schematic_pdf: 03_tscircuit/build/schematic.pdf
    schematic_render: 08_reviews/pre-route_schematic_render.md
    pin: 08_reviews/pre-route_pin.md
    layout: 08_reviews/pre-route_layout.md
    render: 08_reviews/pre-route_render.md
    a_render: 06_build/pre_route/twin_overlay.md
  # Single-board defaults: this config, 03_src/rebuild_all.sh, 06_build/.
  # An ADR-0007 multi-board project instead keeps this file at
  # 03_src/<board>/route.yaml and MUST uncomment board-scoped paths/inputs:
  # paths:
  #   board_id: cook_loadcell
  #   state_dir: 06_build/cook_loadcell
  #   rebuild: 03_src/cook_loadcell/rebuild_all.sh
  #   journal: 01_docs/journal/routing_cook_loadcell.md
  # inputs:
  #   include: [03_src/cook_loadcell,
  #             03_tscircuit/src/cook_loadcell.tsx,
  #             03_tscircuit/manifest-cook_loadcell.yaml]
  #   parts: [02_parts/MPN_A, 02_parts/MPN_B]
  #   tools: []  # extra shared/external producers beyond conductor defaults
  owner:
    stage: routing
    files: [03_src/route.yaml, 03_src/floorplan.yaml,
            03_src/route/final.kicad_pcb]
  copper:
    deterministic: [prep.seed_stubs, taps.connections, stitch.seed_stubs,
                    route.final]
    stochastic: [route.waves]
  budgets_s:
    tscircuit_deps: 30
    tscircuit_build: 60
    escape_packages: 30
    escape_lands: 120
    tier_preflight: 15
    grind: 900
    rebuild: 1200
    layout_drc: 120
  # Hard stop conditions are separate from performance budgets. A timed stage
  # is killed as a process group and leaves its last heartbeat in 06_build/.
  timeouts_s:
    default: 600
    source_schema_governance: 60
    adr_bound_governance: 60
    # Schematic autorouting can become combinatorial. Projects may raise this
    # with measured evidence, but the canonical starting point is bounded.
    tscircuit_deps: 120
    tscircuit_build: 180
    route_wave: 900
    route_race: 2400
    route_evaluate: 180
    route_import: 300
    stitch: 900
    rebuild: 1500
    layout_drc: 180
  blockers: []

prep:
  out: r0.kicad_pcb
  keepouts:
    # User.2 owns only board-mechanical exclusions. Critical component escape
    # corridors are declared below and are not inherited from another board.
    layers: [User.2, User.3]
    mounting_holes: {radius: 3.0}      # M3 screw head + margin
    edge_band: 0.7                     # KRT has no edge concept; dru floor 0.3
    rects:
      # RBIAS owns this narrow inner-layer vertical corridor. Through-vias on
      # unrelated nets span In1.Cu and must not pierce the analog route even
      # when their outer-layer clearances look legal.
      - {x0: 81.35, y0: 48.40, x1: 82.65, y1: 54.60, layer: User.3}
  seed_stubs: &deterministic_seed_stubs
    clearance: 0.13
    via: {size: 0.46, drill: 0.20}
    stubs:
      - {net: GND, why: "CH224K exposed pad receives two explicit filled/capped thermal vias in addition to any incidental stitch via; its dossier requires at least two same-net plane returns", vias: [[41.0,117.3],[41.0,118.7]]}
      - {net: GND, why: "TPS259827 input-eFuse exposed pad 21 receives two explicit Type-VII thermal returns independent of heuristic pad rescue", vias: [[51.2,117.0],[52.6,117.0]]}
      - {net: GND, pin: U_PWR2.2, why: "port-2 eFuse GND land uses a bounded west/south dogleg to a filled/capped plane via beyond the protected-input via bank; this avoids package-local clearance exceptions while preserving the 0.15 mm board rule", segments: [{layer: F.Cu, width: 0.18, pts: [[75.0900,53.7700],[74.7500,53.7500],[74.5000,54.0000],[74.5000,56.0000]]}], vias: [[74.5000,56.0000]]}
      - {net: GND, pin: C_AND_DATA.2, why: "the data-interlock decoupler sits inside a dense logic fanout; a deterministic F.Cu dogleg reaches an authenticated plane via instead of leaving a sub-millimetre pad-bearing GND pour island", segments: [{layer: F.Cu, width: 0.18, pts: [[125.4800,84.0000],[125.2500,83.7500],[125.0000,83.5000],[124.7500,83.2500],[124.0000,83.2500]]}], vias: [[124.0000,83.2500]]}
      - {net: VBUS_PD_PROTECTED, why: "PD eFuse output to protected B.Cu trunk", vias: [[58.0,120.0],[58.8,120.0],[59.6,120.0],[60.4,120.0],[58.0,120.8],[58.8,120.8],[59.6,120.8],[60.4,120.8]]}
      - {net: VBUS_PD_PROTECTED, why: "protected trunk to bank-A buck input island", vias: [[84.8,118.8],[85.6,118.8],[86.4,118.8],[87.2,118.8],[84.8,119.6],[85.6,119.6],[86.4,119.6],[87.2,119.6]]}
      - {net: VBUS_PD_PROTECTED, why: "protected trunk to bank-B buck input island", vias: [[128.8,118.8],[129.6,118.8],[130.4,118.8],[131.2,118.8],[128.8,119.6],[129.6,119.6],[130.4,119.6],[131.2,119.6]]}
      - {net: P5V_A_PROTECTED, why: "bank-A aggregate output to protected B.Cu distributor", vias: [[109.0,108.2],[109.8,108.2],[110.6,108.2],[111.4,108.2],[109.0,109.0],[109.8,109.0],[110.6,109.0],[111.4,109.0]]}
      - {net: P5V_A_PROTECTED, why: "bank-A distributor to port-1 switch input island", vias: [[45.6,53.2],[46.4,53.2],[45.6,54.4],[46.4,54.4]]}
      - {net: P5V_A_PROTECTED, why: "bank-A distributor to port-2 switch input island; the fourth barrel is staggered west/south so the adjacent U_PWR2 GND dogleg retains the full board clearance", vias: [[73.6,53.2],[74.4,53.2],[73.6,54.4],[73.6,55.4]]}
      - {net: P5V_B_PROTECTED, why: "bank-B aggregate output to protected B.Cu distributor", vias: [[153.0,108.2],[153.8,108.2],[154.6,108.2],[155.4,108.2],[153.0,109.0],[153.8,109.0],[154.6,109.0],[155.4,109.0]]}
      - {net: P5V_B_PROTECTED, why: "bank-B distributor to port-3 switch input island", vias: [[101.6,53.2],[102.4,53.2],[101.6,54.4],[102.4,54.4]]}
      - {net: P5V_B_PROTECTED, why: "bank-B distributor to port-4 switch input island", vias: [[129.6,53.2],[130.4,53.2],[129.6,54.4],[130.4,54.4]]}

      # The B.Cu port distributors are crossed by fixed USB pairs.  Preserve
      # the pairs' adjacent In2 GND reference and bridge only the severed
      # distributor necks on In1, with four-via banks at both ends.  Each
      # bridge carries one 2 A branch, not the combined 4.1 A bank current.
      - {net: P5V_A_PROTECTED, why: "port-1 distributor crosses the P1 USB corridor on In1 without cutting its In2 reference",
         segments: [{layer: In1.Cu, width: 3.00, pts: [[63.0000,54.6000],[69.0000,64.4000]]}],
         vias: [[62.6000,54.2000],[63.4000,54.2000],[62.6000,55.0000],[63.4000,55.0000],
                [68.6000,62.4000],[69.4000,62.4000],[68.6000,65.0000],[69.4000,65.0000]]}
      - {net: P5V_A_PROTECTED, why: "port-2 distributor crosses the P1 USB corridor on In1 without cutting its In2 reference",
         segments: [{layer: In1.Cu, width: 1.50, pts: [[74.0000,54.4000],[72.0000,57.0000]]},
                    {layer: In1.Cu, width: 3.00, pts: [[72.0000,57.0000],[70.0000,66.0000]]}],
         vias: [[69.6000,65.6000],[70.4000,65.6000],[69.6000,66.4000],[70.4000,66.4000]]}
      - {net: P5V_B_PROTECTED, why: "port-3 distributor crosses the P4 USB corridor on In1 without cutting its In2 reference",
         segments: [{layer: In1.Cu, width: 3.00, pts: [[113.4000,54.4000],[120.0000,56.9000],[122.0000,53.0000],
                                                       [128.0000,53.0000],[128.0000,60.0000],[139.8000,64.4000]]}],
         vias: [[113.0000,54.0000],[113.8000,54.0000],[113.0000,54.8000],[113.8000,54.8000],
                [139.4000,64.0000],[140.2000,64.0000],[139.4000,64.8000],[140.2000,64.8000]]}
      - {net: P5V_B_PROTECTED, why: "port-3 local input island crosses its USB/control corridor on In1 before signal routing spends the channel",
         segments: [{layer: In1.Cu, width: 2.00, pts: [[101.0000,56.0000],[105.0000,56.0000],[106.5000,57.0000],
                                                        [109.0000,57.0000],[111.0000,56.0000],[115.0000,56.0000]]}],
         vias: [[101.0000,56.0000],[102.0000,56.0000],[103.0000,56.0000],
                [111.0000,56.0000],[113.0000,56.0000],[114.0000,56.0000],[115.0000,56.0000]]}

      # A filled zone is not an authenticated conductor until its realized
