                [58.4000,115.6000],[59.2000,115.6000],[60.0000,115.6000],
                [58.4000,116.4000],[59.2000,116.4000]]}
      - {net: VBUS_PD_PROTECTED, why: "bank-A converter input island crosses to its B.Cu trunk landing through a six-via boundary",
