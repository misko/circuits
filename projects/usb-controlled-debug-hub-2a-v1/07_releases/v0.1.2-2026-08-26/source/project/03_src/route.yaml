                [128.4000,116.2000],[129.2000,116.2000],[130.0000,116.2000],
                [128.4000,112.5000],[129.2000,112.5000],[130.0000,112.5000]]}
      - {net: P5V_A_PROTECTED, why: "bank-A protected output reaches its bulk reservoir on B.Cu without slicing the P5V_BANK_A input pour",
