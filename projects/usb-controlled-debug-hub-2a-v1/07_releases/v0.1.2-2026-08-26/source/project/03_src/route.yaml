    - {name: bank_a_port2_drop, net: P5V_A_PROTECTED, rect: [73.2,52.8,74.8,55.8], minimum_vias: 4, required_continuous_a: 2.0, why: "port-2 switch input island transition; the bounded stagger preserves clearance to the adjacent GND dogleg"}
