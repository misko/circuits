         vias: [[84.4000,115.4000],[85.2000,115.4000],[86.0000,115.4000],
                [84.4000,116.2000],[85.2000,116.2000],[86.0000,116.2000],
                [84.4000,112.5000],[85.2000,112.5000],[86.0000,112.5000]]}
      - {net: VBUS_PD_PROTECTED, why: "bank-B converter input island crosses to its B.Cu trunk landing through a six-via boundary",
         segments: [{layer: B.Cu, width: 2.00, pts: [[128.4000,115.4000],[130.0000,115.4000],[130.0000,116.2000],[128.4000,116.2000],[129.6000,118.8000]]},
                    {layer: B.Cu, width: 2.00, pts: [[128.4000,115.4000],[128.4000,112.5000],[130.0000,112.5000]]}],
