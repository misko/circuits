       length_match_tolerance: 0.50, max_iterations: 1200000,
       max_probe_iterations: 80000, max_ripup: 60}
    - {name: usb_hub_ports, engine: diff, group: usb_hub_ports,
       track_width: 0.2332, clearance: 0.30, diff_pair_gap: 0.15,
       layers: [F.Cu, B.Cu], length_match_group: [[P2_HUB_P, P2_HUB_N],
       [P3_HUB_P, P3_HUB_N]], length_match_tolerance: 0.50,
       max_iterations: 1200000, max_probe_iterations: 80000, max_ripup: 60}
    - {name: usb_upstream, engine: diff, group: usb_upstream,
       track_width: 0.2332, clearance: 0.30, diff_pair_gap: 0.15,
       layers: [F.Cu, B.Cu], length_match_group: [[UP_HUB_P, UP_HUB_N]],
       length_match_tolerance: 0.50, max_iterations: 800000,
       max_probe_iterations: 60000, max_ripup: 40}
    - {name: usb_management, engine: diff, group: usb_management,
