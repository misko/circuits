# TAPS (canon M8 promotion: cook-hub u7 taps, then usb-pwr-hub-3s
# route_taps.py). NAMED connections KRT cannot thread — pour-fed sense pins,
# boxed-in connector pads, plane drops. Runs AFTER `import`, BEFORE `stitch`
# (pours fill around the tap copper):
#   /usr/bin/python3 .../route_and_stitch_generic.py taps 03_src/route.yaml
# Strategy 1: same-layer direct/L/Z join; strategy 2: stub -> via ->
# hop_layer join -> via -> stub. EVERY emitted segment/via is verified
# against the live board's exact copper (pcb_toolkit); an unroutable tap is
# a hard error, never a silent skip (a skipped tap resurfaces only as a DRC
# unconnected item after fill). `plane: true` ends at a via AT the `to`
# point (a point inside the net's inner plane, merged by the fill).
#
# A long pour-net pin tap's corridor is ORDER-fragile (KRT hugs the escape-
# field lane edges). `reattempt` re-routes the WHOLE tap set longest-first
# (most-constrained-first) on a fresh board when a tap fails — BOUNDED by
# max_retries (default 2) and progress-gated, so it terminates and escalates
# rather than spinning (the v1.1 U1 pour-pin recurrence, canon M8). A tap
# still stuck after the bound is structurally fragile — promote it to a
# deterministic stitch.seed_stubs (below), or fix placement (D-ADJ).
#
# taps:
#   clearance: 0.15
#   via: {size: 0.6, drill: 0.3}     # tier-derived when omitted
#   reattempt: {max_retries: 2}      # bounded longest-first re-route on fail
#   connections:
#     - {net: VCC,  from: U1.4,  to: C8.1,         width: 0.3}
#     - {net: CC1,  from: J5.A5, to: R10.2,        width: 0.25,
#        layer: F.Cu, hop_layer: B.Cu}
#     - {net: 5V,   from: R6.1,  to: [41.0, 46.5], width: 0.3, plane: true}

stitch:
  clearance: 0.15
  # spacing 0.85 center-to-center = 0.55mm drill-edge gap > the 0.5mm
  # hole-to-hole floor (0.62 gave 0.32mm and a stochastic route tripped it)
  # via size/drill may be OMITTED with a declared fab_tier (tier floors are
  # the default); explicit sub-floor values are a hard error naming the tier.
  # The same floors gate normalize_vias, hole_to_hole.shrink_to and the
  # astar_fallback via pin (whose 0.45/0.2 toolkit default was below a
  # 2-layer standard board's floors — crow-array-pod incident).
  via: {size: 0.46, drill: 0.20, spacing: 0.85, pth_margin: 0.25}
  keepin: {inset: 0.8}
  # seed_stubs runs FIRST (before fill so the pour flows around the stub
  # copper); unify_zone_priorities runs after the last fill, before
  # heal_islands (it needs filled zones to check for pour fragmentation).
  # Every pass emits the same 0.46/0.20 mm family, and the final promotion
  # makes the complete realized family Type VII before the fabrication gate.
  passes: [seed_stubs, dedupe_vias, normalize_vias, drop_micro_fragments,
           drop_dangling, split_t_junctions, reload, hole_to_hole, pad_rescue,
           stub_fallback, dedupe_vias, stitch_grid, fill, island_rescue,
           fill, prune_stitch_dangling, drop_dangling, fresh_reload,
           unify_zone_priorities, heal_islands, protect_via_family, gate]
  # Replay the one authoritative pre-route seed bank after importing an
  # already accepted chain.  The emitter is idempotent: copper embedded in
  # the chain is skipped, while newly source-authored closures are checked
  # against the exact imported route and added (or refused) explicitly.
  seed_stubs: *deterministic_seed_stubs
  # DETERMINISTIC POUR-FED PIN SEED STUBS (canon M8: usb-hub-3s
  # plan_seed_stubs.py + add_seed_stubs.py). The pour-fed nets that leave a
  # dense IC pin row and weave across the escape field to their pour island —
  # KRT excludes them, taps are too short to thread. Runs BEFORE fill (the
  # pour bonds the pin around the stub copper). Each stub is EXPLICIT geometry
  # verified against the live board's exact copper with collision REFUSAL
  # (refuse whole, never shave), declares the `pin` (REF.PAD) it serves (the
  # pass proves the copper reaches it), and is idempotent. Plan the coordinates
  # against the FROZEN promoted chain (a maze router like plan_seed_stubs.py),
  # not by hand — re-plan if the chain is re-promoted. Omit or leave empty on
  # boards without pour-fed-pin opens.
  #   seed_stubs:
  #     clearance: 0.13                  # tighter than stitch clearance
  #     via: {size: 0.25, drill: 0.15}   # tier-derived when omitted
  #     stubs:
  #       - {net: LX1, pin: U1.18,
  #          segments: [{layer: F.Cu, width: 0.25, pts: [[60.6,70.9],[57.6,71.9]]}],
  #          vias: [[57.6,71.9]]}
  # SAME-NET ZONE PRIORITY UNIFY (canon M8: usb-hub-3s v1.0 "P3-union", v1.1
  # re-learn). Two pours of the SAME net overlapping at the SAME priority make
  # KiCad report `zones_intersect` ("intersecting zones must have distinct
  # priorities"). The pass bumps the smaller zone to a distinct higher priority
  # so the union NESTS legally (same net => identical copper), refills, and
  # re-verifies. A CROSS-net overlap is a SHORT and is REFUSED (escalate to
  # shorting_items — never a mechanical bump). `min_bbox` skips slivers.
  unify_zone_priorities: {min_bbox: 0.8}
  dedupe_vias: {radius: 0.5, metric: box}
  normalize_vias: {below_width: 0.24, size: 0.25, drill: 0.15}
  drop_micro_fragments: {max_length: 0.12, require_free_end: true}
  # KRT overshoot tails (one wave left a 0.7mm S_MINUS stub -> track_dangling)
  drop_dangling: {max_length: 1.2, tol: 0.05, sweeps: 4}
  # KRT T-junctions: a stub end landing MID-BODY is continuous copper
  # but unanchored, so KiCad reports track_dangling. Split, never delete.
  split_t_junctions: {tol: 0.05}
  hole_to_hole: {min_gap: 0.25, mode: nudge, prefer_keep: [GND]}
  pad_rescue:
    net: GND                  # single-plane form (2-layer boards)
    # 4-LAYER / TWO INNER PLANES (In1=GND, In2=VIN): rescue BOTH plane-nets'
    # pads, not one. Use `nets` (per-pad via to EACH plane) instead of `net`:
    #   nets:
    #     - {net: GND, layer: In1.Cu}
    #     - {net: VIN, layer: In2.Cu}
    # or auto-detect every solid inner-plane pour:  auto: true
    via_in_pad: true          # B.Cu is a solid GND pour under the whole board
    served_within: 1.6
    rings: [0.75, 0.95, 1.2, 1.6, 2.1, 2.7]
    stub_width: 0.3
    # GAP-B SUB-FLOOR SCOPING (default ON): each adjacent-via+stub is a plane
    # drop, not a trunk, so it is exempted from the netclass ampacity floor by
    # a named rule area (`pad_rescue_stubs`) + a relaxed insideArea track_width
    # rule appended to the board's .kicad_dru (KiCad last-match precedence).
    # Set `stub_scope: false` to disable, or tune it:
    #   stub_scope: {area_name: pad_rescue_stubs, min_track_width: 0.3,
    #                layers: [F.Cu, B.Cu]}
    # NOTE: if your generate_rules-LAST rewrites .kicad_dru, it must preserve
    # (or re-emit) the pad_rescue_stubs rule, else the exemption is lost.
    # NON-FATAL: a pad whose via sites are blocked by a B.Cu track underneath
    # is still served by top-pour thermal spokes at fill. The DRC unconnected
    # gate is the arbiter.
    # NOTE: a pad already served by its footprint's OWN thermal via grid
    # (same-net PTH pads inside the SMD pad outline — HTSSOP/QFN EPs) is
    # SKIPPED automatically: a rescue via stacked on the grid is a
    # hole_to_hole clash (3S clean-room cleanup_vias.py part 1 incident).
    require: none
  stub_fallback: {net: GND, min_dist: 0.2, max_dist: 8.0, width: 0.3}
  # `layers` may constrain the search to one or two reviewed corridors; this
  # is substantially faster than searching the whole default F/B space.  The
  # A* via pin inherits a matching stitch.via.tiers hole_to_copper value, or
  # it may declare one explicitly.
  # A* is a bounded last resort for a small named residual, never the default
  # continuation after direct rescue. Larger residuals stop immediately for
  # explicit dogbones instead of spending minutes in a silent local search.
  astar_fallback: {net: GND, width: 0.30, window: 3.0, attempts: 3,
                   max_pending: 8, budget_s: 30,
                   layers: [F.Cu, B.Cu],
                   via: {size: 0.46, drill: 0.20}}
  stitch_grid:
    net: GND
    x: [24, 74, 8]
    y: [24, 64, 8]
    # OUT of the guarded analog rect — the bridge corner stays quiet
    avoid: [{x0: 20.0, y0: 26.0, x1: 44.0, y1: 58.0, margin: 1.0}]
  island_rescue: {min_bbox: 0.8, layers: [F.Cu, B.Cu], require: all}
  # POUR-ISLAND AUTO-HEAL (after the last fill): a same-net zone that FILLS
  # as >=2 disconnected islands is the DRC unconnected class "Zone [X] <->
  # Zone [X]" — the v4 usb-hub-3s tail was 4/7 exactly this (LX1/LX2/VIN_S/
  # VBUSA3 priority-2 F.Cu pours sliced by escape tracks, 2026-07-21), each
  # bridged by hand before this pass existed. heal_islands groups each pour
  # net's islands with pcbnew connectivity, bridges the narrowest
  # collision-clear gap with a track at the NET-CLASS width (zone-min-width
  # fallback) or a via through a shared same-net plane (every segment/via
  # pcb_toolkit-verified, taps discipline), then REFILLS and RE-VERIFIES:
  # a heal that does not reduce the island count is a hard error, a healed
  # board re-runs as a no-op (idempotent), and different nets are never
  # bridged. `layers` limits which copper layers are inspected (default:
  # all); min_bbox skips slivers (those are isolated_copper -> escalate).
  # Dense USB/control copper splits several long high-current distributors.
  # Sample enough of each exact filled outline to find a legal same-net
  # bridge; every candidate still passes the normal collision/net guards and
  # the post-refill group-count reduction remains mandatory.
  heal_islands: {min_bbox: 0.2, sample_step: 0.4,
                 max_gap_candidates: 400, clear_rescue_failures: true,
                 via: {size: 0.46, drill: 0.20}}
  # Gerbers cannot carry KiCad's per-via fill/cap flags.  Promote the complete
  # 0.20 mm drill family after every geometry-changing pass so the native
  # board, release census, and fabricator drill-family selector all describe
  # the same IPC-4761 Type-VII population.  The distinct 0.30 mm family stays
  # ordinary and must never inherit this process.
  protect_via_family:
    via: {size: 0.46, drill: 0.20}
    via_protection: {capping: yes, filling: yes}
    min: 1
  # EPILOGUE (recommended for 4-layer/plane boards): after the final fill,
  # prune vias THE STITCHER ITSELF emitted that ended up with same-net copper
  # on <2 layers — the `via_dangling` DRC class. Tests the FILLED polys
  # (via_janitor only credits zone OUTLINES, so a via in a fill void passes
  # janitor and still dangles — 3S clean-room cleanup_vias.py stray-via
  # deletions). Never touches imported-route or footprint vias. Add it to
  # `passes` after the last `fill`:
  #   passes: [..., fill, island_rescue, fill, prune_stitch_dangling, gate]
  prune_stitch_dangling: {tol: 0.05, min_layers: 2, scope: all}
