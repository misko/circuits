         vias: [[121.2000,119.6000],[122.0000,119.6000],[122.8000,119.6000],
                [121.2000,120.4000],[122.0000,120.4000],[122.8000,120.4000],
                [121.2000,121.2000],[122.0000,121.2000]]}
      - {net: P5V_B_PROTECTED, why: "bank-B aggregate output island reaches its bulk reservoir",
         segments: [{layer: F.Cu, width: 1.00, pts: [[162.4984,109.1614],[163.1264,109.5732]]}],
         vias: [[161.0500,109.5000]]}
      - {net: SW_A, why: "bank-A buck switch land reaches the inductor without relying on two touching pour fragments",
         segments: [{layer: F.Cu, width: 0.30, pts: [[89.2000,118.1000],[89.8000,119.5000]]}]}
      - {net: SW_B, why: "bank-B translation of the explicit buck switch-node closure",
