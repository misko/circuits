      # Each port eFuse output is a narrow 0.30 x 2.40 mm land boxed by its
      # control/ILIM pads.  Neck at pad width until outside the package, then
      # widen to the 0.80 mm port-power rule and terminate on the local bulk
      # capacitor.  The general power wave owns only the open-field remainder.
      - {net: VBUS1_SW, pin: U_PWR1.6, segments: [{layer: F.Cu, width: 0.30, pts: [[48.2600,54.0000],[48.2600,55.5000],[49.5000,56.0000]]},{layer: F.Cu, width: 0.80, pts: [[49.5000,56.0000],[53.0250,56.0000]]}]}
      - {net: VBUS2_SW, pin: U_PWR2.6, segments: [{layer: F.Cu, width: 0.30, pts: [[76.2600,54.0000],[76.2600,55.5000],[77.5000,56.0000]]},{layer: F.Cu, width: 0.80, pts: [[77.5000,56.0000],[81.0250,56.0000]]}]}
      - {net: VBUS3_SW, pin: U_PWR3.6, segments: [{layer: F.Cu, width: 0.30, pts: [[104.2600,54.0000],[104.2600,55.5000],[105.5000,56.0000]]},{layer: F.Cu, width: 0.80, pts: [[105.5000,56.0000],[109.0250,56.0000]]}]}
