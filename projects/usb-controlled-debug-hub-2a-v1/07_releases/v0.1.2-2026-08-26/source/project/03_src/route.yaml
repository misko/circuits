    exclude: ["GND", "unconnected-*", SW_3V3,
              VBUS_PD_RAW, VBUS_PD, VBUS_PD_PROTECTED,
              SW_A, P5V_BANK_A, P5V_A_PROTECTED,
              SW_B, P5V_BANK_B, P5V_B_PROTECTED]
    groups:
      usb_upstream: [UP_HUB_P, UP_HUB_N]
      # Reserve the longest outer-port corridor before the three interior
      # hub pairs.  Treating all four as one stochastic wave repeatedly left
      # P4 behind otherwise-valid P1..P3 copper.
      usb_hub_edge: [P4_HUB_P, P4_HUB_N]
      usb_hub_left: [P1_HUB_P, P1_HUB_N]
      usb_hub_ports: [P2_HUB_P, P2_HUB_N, P3_HUB_P, P3_HUB_N]
      usb_port_segments: [P1_PORT_P, P1_PORT_N, P2_PORT_P, P2_PORT_N,
                          P3_PORT_P, P3_PORT_N, P4_PORT_P, P4_PORT_N]
      usb_management: [MGMT_P, MGMT_N]
      port_power: [VBUS1_SW, VBUS2_SW, VBUS3_SW, VBUS4_SW]
      # Reserve the four hub-control nets whose QFN exits share the narrow
      # north-side channel. Routing them before the generic remainder prevents
      # low-priority GPIO/config copper from boxing in their package vias.
      # Keep each congested hub escape wave bounded.  A single 30-net cleanup
      # pass proved it could silently prune source-owned bank-A bridge copper;
      # three independently graded waves route the same set while preserving
      # every prepared power segment and via under P-ROUTEBASE.
      hub_control_core: [HUB_BOOST0, HUB_VBUS_SENSE, HUB_NONREM0,
                         HUB_CFG0, HUB_CFG2, HUB_NONREM1, HUB_SWAP1,
                         HUB_SWAP2, HUB_SWAP3, HUB_SWAP4]
      hub_control_config: [HUB_SWAP5, HUB_SWAP6, HUB_SWAP7, HUB_GANG,
                           HUB_VDD18, HUB_DIS6_N, HUB_DIS7_P, HUB_DIS7_N,
                           HUB_DIS6_P, HUB_VDD18PLL]
      hub_control_ports: [HUB_CFG1, HUB_RESET_N, HUB_OCS1_N, HUB_OCS2_N,
                          HUB_OCS3_N, HUB_OCS4_N, HUB_OCS5_N, HUB_PRTPWR1,
                          HUB_PRTPWR2, HUB_PRTPWR3, HUB_PRTPWR4, HUB_PRTPWR5]
      # The shared 3V3 rail has 43 pads, including four tightly boxed hub
      # supply/bypass lands. Give it the next complete-board pass while the
      # local hub channels are still open; generic GPIO fanout follows it.
      power_3v3: [3V3_MAIN]
      control_bus: [ILIM_CTRL, VBUS_CTRL, I2C_SDA, I2C_SCL,
                    CTRL_RESET_N, CTRL_VUSB_3V3, EXP_RESET_N, ILIM2, ILIM3]
      power_commands: [PWR_CMD1, PWR_CMD2, PWR_CMD3, PWR_CMD4]
      power_enable1: [PWR_EN1]
      power_enable2: [PWR_EN2]
      power_enable3: [PWR_EN3]
      power_enable4: [PWR_EN4]
      data_ok1: [DATA_OK1]
      data_ok2: [DATA_OK2]
      data_ok3: [DATA_OK3]
      data_ok4: [DATA_OK4]
      data_cmd1: [DATA_CMD1]
      data_cmd2: [DATA_CMD2]
      data_cmd3: [DATA_CMD3]
      data_cmd4: [DATA_CMD4]
      remaining: rest

route:
  # The exact reviewed chain is source-promoted at route.final. Rebuilds must
  # consume that immutable route instead of whichever build candidate happens
  # to remain under 06_build/route/.
  import_source: promoted
  krt: ~/gits/KiCadRoutingTools
  # Cheap topology/ownership decisions happen before KRT. This is N-A on an
  # ordinary point-to-point board; many-pad pour/wide nets and shared critical
  # corridors require the progressive route.ownership declarations below.
  ownership_preflight: {mode: enforce}
  ownership:
    nets:
      VBUS_PD_RAW: {topology: pour, owner: zone, allow_generic_router: false, why: "local receptacle-to-fuse copper is source-authored as a power zone"}
      VBUS_PD: {topology: pour, owner: zone, allow_generic_router: false, why: "post-fuse PD input copper is source-authored as a power zone"}
      VBUS_PD_PROTECTED: {topology: pour, owner: zone, allow_generic_router: false, why: "protected 20 V distribution is source-authored as linked F/B power zones"}
      P5V_BANK_A: {topology: pour, owner: zone, allow_generic_router: false, why: "bank-A converter output is source-authored as a local power zone"}
      P5V_A_PROTECTED: {topology: pour, owner: zone, allow_generic_router: false, why: "bank-A two-port distributor is source-authored as linked F/B power zones"}
      P5V_BANK_B: {topology: pour, owner: zone, allow_generic_router: false, why: "bank-B converter output is source-authored as a local power zone"}
      P5V_B_PROTECTED: {topology: pour, owner: zone, allow_generic_router: false, why: "bank-B two-port distributor is source-authored as linked F/B power zones"}
  # Every promoted wave is regraded under r0's exact .kicad_pro/.kicad_dru in
  # a fresh, relocatable workspace. Candidate-owned sidecars are never rule
  # authority. Existing projects opt in explicitly; new projects start safe.
  candidate_grade: {mode: enforce}
  # Re-running a stochastic search is allowed only while the unresolved
  # denominator or semantic finding/frontier changes. Coordinates and file
  # hashes are deliberately not novelty.
  exploration_guard:
    mode: enforce
    plateau_attempts: 2
    max_attempts: 5
    max_novel_signatures: 3
    max_operation_amplification: 8
  # Progressive-disclosure examples (uncomment only when applicable):
  # ownership:
  #   multipad_threshold: 8
  #   nets:
  #     VBUS_PROTECTED:
  #       topology: wide_trunk
  #       owner: prep.seed_stubs
  #       why: reviewed high-current trunk with named package launches
  #   corridors:
  #     oscillator_escape:
  #       claim_order: [crystal, usb, control]
  #       why: single-layer crystal owns the only legal package escape
  # REQUIRED decision. Fill one row per USB/RF/timing-critical pair, or leave
  # [] and replace no_critical_routes with a specific true reason.
  preflight_critical_pairs:
    - {name: UP_HUB, p: UP_HUB_P, n: UP_HUB_N, wave: usb_upstream, allowed_layers: [F.Cu, B.Cu], no_vias: false}
    - {name: P1_HUB, p: P1_HUB_P, n: P1_HUB_N, wave: usb_hub_left, allowed_layers: [F.Cu, B.Cu], no_vias: false}
    - {name: P2_HUB, p: P2_HUB_P, n: P2_HUB_N, wave: usb_hub_ports, allowed_layers: [F.Cu, B.Cu], no_vias: false}
    - {name: P3_HUB, p: P3_HUB_P, n: P3_HUB_N, wave: usb_hub_ports, allowed_layers: [F.Cu, B.Cu], no_vias: false}
    - {name: P4_HUB, p: P4_HUB_P, n: P4_HUB_N, wave: usb_hub_edge, allowed_layers: [F.Cu, B.Cu], no_vias: false}
    - {name: P1_PORT, p: P1_PORT_P, n: P1_PORT_N, wave: usb_port_segments, allowed_layers: [B.Cu], no_vias: true}
    - {name: P2_PORT, p: P2_PORT_P, n: P2_PORT_N, wave: usb_port_segments, allowed_layers: [B.Cu], no_vias: true}
    - {name: P3_PORT, p: P3_PORT_P, n: P3_PORT_N, wave: usb_port_segments, allowed_layers: [B.Cu], no_vias: true}
    - {name: P4_PORT, p: P4_PORT_P, n: P4_PORT_N, wave: usb_port_segments, allowed_layers: [B.Cu], no_vias: true}
    - {name: MGMT, p: MGMT_P, n: MGMT_N, wave: usb_management, allowed_layers: [F.Cu, B.Cu], no_vias: false}
  critical_branch_allowlist:
    - {net: UP_HUB_P, at: [28.2000, 56.7500], layer: B.Cu, degree: 3,
       why: "the two reversible USB-C D+ contacts merge here before the single upstream path"}
  no_critical_routes: null
  # - {name: USB_UP, p: USB_UP_P, n: USB_UP_N, wave: usb,
  #    allowed_layers: [F.Cu], no_vias: true}
  # Routability is an admission contract, not a router. It closes physical
  # lane order, series/shunt USB topology and the complete high-current path
  # before stochastic routing begins.
  routability:
    require_topology: true
    require_connector_lanes: true
    require_series_power_paths: true
    layer_roles: {F.Cu: signal, In1.Cu: reference_plane,
                  In2.Cu: mixed_signal_pour, B.Cu: signal}
    class_layers:
      usb_hs: [F.Cu, B.Cu]
      low_speed: [F.Cu, B.Cu]
    connector_lanes:
      - {ref: J_DATA, lanes: [{pad: A6, net: UP_HUB_P}, {pad: A7, net: UP_HUB_N}, {pad: B6, net: UP_HUB_P}, {pad: B7, net: UP_HUB_N}], why: "both reversible USB-C rows preserve D+/D- identity"}
      - {ref: J_PORT1, lanes: [{pad: "2", net: P1_PORT_N}, {pad: "3", net: P1_PORT_P}], why: "USB-A port 1 physical D-/D+ order"}
      - {ref: J_PORT2, lanes: [{pad: "2", net: P2_PORT_N}, {pad: "3", net: P2_PORT_P}], why: "USB-A port 2 physical D-/D+ order"}
      - {ref: J_PORT3, lanes: [{pad: "2", net: P3_PORT_N}, {pad: "3", net: P3_PORT_P}], why: "USB-A port 3 physical D-/D+ order"}
      - {ref: J_PORT4, lanes: [{pad: "2", net: P4_PORT_N}, {pad: "3", net: P4_PORT_P}], why: "USB-A port 4 physical D-/D+ order"}
    topology:
      - {ref: U_ESD_UP, part_mpn: PESD2USB5UX-TR, kind: shunt, signal_pads: ["1", "2"], return_pads: ["3"], pairs: [UP_HUB], why: "upstream connector clamp lands directly on the continuous pair"}
      - {ref: U_ESD1, part_mpn: PESD2USB5UX-TR, kind: shunt, signal_pads: ["1", "2"], return_pads: ["3"], pairs: [P1_PORT], why: "port-1 clamp lands directly on the continuous pair"}
      - {ref: U_ESD2, part_mpn: PESD2USB5UX-TR, kind: shunt, signal_pads: ["1", "2"], return_pads: ["3"], pairs: [P2_PORT], why: "port-2 clamp lands directly on the continuous pair"}
      - {ref: U_ESD3, part_mpn: PESD2USB5UX-TR, kind: shunt, signal_pads: ["1", "2"], return_pads: ["3"], pairs: [P3_PORT], why: "port-3 clamp lands directly on the continuous pair"}
      - {ref: U_ESD4, part_mpn: PESD2USB5UX-TR, kind: shunt, signal_pads: ["1", "2"], return_pads: ["3"], pairs: [P4_PORT], why: "port-4 clamp lands directly on the continuous pair"}
      - {ref: U_DATA1, part_mpn: FSUSB42MUX, kind: series_directional, signal_pads: ["3", "4", "6", "7"], common_signal_pads: ["3", "4"], selected_signal_pads: ["6", "7"], unused_signal_pads: ["8", "9"], pairs: [P1_HUB, P1_PORT], why: "port-1 common and selected switch banks are explicit; unused bank remains copper-free"}
      - {ref: U_DATA2, part_mpn: FSUSB42MUX, kind: series_directional, signal_pads: ["3", "4", "6", "7"], common_signal_pads: ["3", "4"], selected_signal_pads: ["6", "7"], unused_signal_pads: ["8", "9"], pairs: [P2_HUB, P2_PORT], why: "port-2 common and selected switch banks are explicit; unused bank remains copper-free"}
      - {ref: U_DATA3, part_mpn: FSUSB42MUX, kind: series_directional, signal_pads: ["3", "4", "6", "7"], common_signal_pads: ["3", "4"], selected_signal_pads: ["6", "7"], unused_signal_pads: ["8", "9"], pairs: [P3_HUB, P3_PORT], why: "port-3 common and selected switch banks are explicit; unused bank remains copper-free"}
      - {ref: U_DATA4, part_mpn: FSUSB42MUX, kind: series_directional, signal_pads: ["3", "4", "6", "7"], common_signal_pads: ["3", "4"], selected_signal_pads: ["6", "7"], unused_signal_pads: ["8", "9"], pairs: [P4_HUB, P4_PORT], why: "port-4 common and selected switch banks are explicit; unused bank remains copper-free"}
    series_power_paths:
      - {id: port1, transitions: [{kind: copper, from: J_POWER.A4, to: F_PD.1}, {kind: component, from: F_PD.1, to: F_PD.2}, {kind: copper, from: F_PD.2, to: U_PD_IN.1}, {kind: component, from: U_PD_IN.1, to: U_PD_IN.18}, {kind: copper, from: U_PD_IN.18, to: U_BUCK_A.8}, {kind: component, from: U_BUCK_A.8, to: U_BUCK_A.6}, {kind: copper, from: U_BUCK_A.6, to: L_BUCK_A.1}, {kind: component, from: L_BUCK_A.1, to: L_BUCK_A.2}, {kind: copper, from: L_BUCK_A.2, to: U_AGG_A.1}, {kind: component, from: U_AGG_A.1, to: U_AGG_A.17}, {kind: copper, from: U_AGG_A.17, to: U_PWR1.5}, {kind: component, from: U_PWR1.5, to: U_PWR1.6}, {kind: copper, from: U_PWR1.6, to: J_PORT1.1}], why: "complete port-1 path crosses fuse, input protection, buck, aggregate eFuse and per-port eFuse"}
      - {id: port2, transitions: [{kind: copper, from: U_AGG_A.17, to: U_PWR2.5}, {kind: component, from: U_PWR2.5, to: U_PWR2.6}, {kind: copper, from: U_PWR2.6, to: J_PORT2.1}], why: "bank-A branch to port 2 cannot bypass its per-port eFuse"}
      - {id: port3, transitions: [{kind: copper, from: U_PD_IN.18, to: U_BUCK_B.8}, {kind: component, from: U_BUCK_B.8, to: U_BUCK_B.6}, {kind: copper, from: U_BUCK_B.6, to: L_BUCK_B.1}, {kind: component, from: L_BUCK_B.1, to: L_BUCK_B.2}, {kind: copper, from: L_BUCK_B.2, to: U_AGG_B.1}, {kind: component, from: U_AGG_B.1, to: U_AGG_B.17}, {kind: copper, from: U_AGG_B.17, to: U_PWR3.5}, {kind: component, from: U_PWR3.5, to: U_PWR3.6}, {kind: copper, from: U_PWR3.6, to: J_PORT3.1}], why: "bank-B port-3 path crosses buck, aggregate eFuse and per-port eFuse"}
      - {id: port4, transitions: [{kind: copper, from: U_AGG_B.17, to: U_PWR4.5}, {kind: component, from: U_PWR4.5, to: U_PWR4.6}, {kind: copper, from: U_PWR4.6, to: J_PORT4.1}], why: "bank-B branch to port 4 cannot bypass its per-port eFuse"}
  # race: 3      # KRT is stochastic — run N wave-chains CONCURRENTLY in
  #   isolated temp dirs (06_build/route/race/cN), import each candidate
  #   into a copy of the track-free board, evaluate each with `quick`, and
  #   promote the MEASURED best: fewest routed-net unconnected, tie-break
  #   fewest copper violations. Per-candidate numbers + the choice land in
  #   06_build/route/race_log.json (auditable, never vibes). CLI --race N
  #   overrides. Candidates see ROUTE_RACE_CANDIDATE in their environment.
  # kicad_python: /usr/bin/python3   # interpreter race uses for import+quick
  common:
    layers: [F.Cu, B.Cu]
    # via_size / via_drill / clearance may be OMITTED: with a nets.yaml
    # fab_tier declared they default to that tier's published floors
    # (min_via_diameter / min_via_drill / min_space, fab_tiers.yaml).
    # Explicit values below the tier floor are a hard error naming the tier
    # — the clean-room 3S board routed 0.6/0.3 template vias on a tier whose
    # floor was 0.45/0.3 and only DRC noticed (drill_out_of_range x2).
    via_size: 0.46
    via_drill: 0.20
    fab_tier: advanced
    no_stub_layer_swap: true
    keepout: true
    keepout_layer: User.2
    # 0.21 not 0.15: 0.6/0.3 vias at 0.15 pack drills to ~0.45 < the 0.5
    # hole-to-hole fab floor; 0.21 forces centres to 0.81 -> drill gap 0.51
    clearance: 0.15
    hole_to_hole_clearance: 0.25
    # ---- OPTIONAL, per-wave or common. Both blocks are REAL KRT capability
    # this driver could not express until 2026-07-29, which cost pluto-rx2-8way
    # a hand-routed chain it then (correctly) refused to promote.
    #
    # LENGTH MATCHING IS SINGLE-ENDED AND INTER-NET. KRT matches a GROUP of
    # ordinary nets against each other, not just diff-pair P/N. MEASURED on the
    # nine-arm AoA star: `length_match_group: ['ANT*', RX2_OUT]` with
    # tolerance 0.15 printed "8 nets (0 diff pairs, 8 single-ended),
    # target=19.83mm" and took the group spread 2.237 -> 1.1586 mm (29.5 ->
    # 15.28 deg at 6 GHz), 11/11 routed, min_clearance_used 0.2 — no clearance
    # relaxation. The residual IS the tolerance passed in.
    # A flat list is ONE group; a list of lists is several.
    # length_match_group: ['ANT*', RX2_OUT]
    # length_match_tolerance: 0.15    # mm of acceptable in-group variance
    # meander_amplitude: 1.0          # meander height perpendicular to trace
    #
    # NECK-DOWN is the answer to a launch whose vendor land cannot carry the
    # impedance width (PE42482A-X: 0.60 x 0.30 land at 0.50 pitch leaves
    # 0.350 mm to the GND land edge, a 0.36 mm trace needs 0.380 — deficit
    # 0.030). Relaxing clearance instead detunes the microstrip the width was
    # derived from; narrowing near the pad does not.
    # neckdown_length: 2.5            # mm of narrow track from the target pad
    # neckdown_taper_length: 0.5      # mm of stepped narrow->wide taper (0=abrupt)
  waves:
    # Placement-stage route contracts only. Width/gap remain provisional until
    # the JLC order-time 90-ohm differential solve is captured.
    - {name: usb_port_segments, engine: diff, group: usb_port_segments,
       track_width: 0.2332, clearance: 0.30, diff_pair_gap: 0.15,
       layers: [B.Cu], length_match_group: [[P1_PORT_P, P1_PORT_N], [P2_PORT_P, P2_PORT_N],
       [P3_PORT_P, P3_PORT_N], [P4_PORT_P, P4_PORT_N]], length_match_tolerance: 0.50,
       max_iterations: 800000, max_probe_iterations: 60000, max_ripup: 40}
    - {name: usb_hub_edge, engine: diff, group: usb_hub_edge,
       track_width: 0.2332, clearance: 0.30, diff_pair_gap: 0.15,
       layers: [F.Cu, B.Cu], length_match_group: [[P4_HUB_P, P4_HUB_N]],
       length_match_tolerance: 0.50, max_iterations: 1200000,
       max_probe_iterations: 80000, max_ripup: 60}
    - {name: usb_hub_left, engine: diff, group: usb_hub_left,
       track_width: 0.2332, clearance: 0.30, diff_pair_gap: 0.15,
