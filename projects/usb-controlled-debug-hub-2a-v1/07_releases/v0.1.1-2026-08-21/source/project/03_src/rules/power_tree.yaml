    vin_max: 21.0
    vout_min: 3.27
    vout_max: 3.33
    iout_max_A: 0.60
    converter: AP63203QWU-7
    eff: 0.85
    external_output: false
  - name: VBUS1_SW
    input_parent: P5V_BANK_A
    stage: distribution
    vin_min: 4.965
    vin_max: 5.25
    vout_min: 4.965
    vout_max: 5.25
    iout_max_A: 2.0
    eff: 0.99
    external_output: true
    claim_id: usb_downstream_ports_2a
    load_uv_threshold: 4.75
    ir_budget_mohm: 90
    ir_budget_components_mohm:
      protection_switch: {value: 49.5, basis: maximum, evidence: "TPS259470A 45 mOhm catalog maximum plus TPS259827O 4.5 mOhm maximum at 125 C"}
      pcb_copper_vias_joints: {value: 10.5, basis: budgeted_max, evidence: "pre-layout allocation; four-wire first-article measurement and post-route resistance extraction required"}
      mated_power_contacts: {value: 30, basis: qualified_max, evidence: "GCT USB1130 Revision E maximum initial contact resistance"}
    margin: 0.18
    distribution: {series_devices: [TPS259827ONRGET, TPS259470ARPWR], path_resistance_max_mohm: 90, current_limit_min_A: 2.080, current_limit_max_A: 2.646, reverse_current_policy: "TPS259470A true reverse-current blocking at all times"}
