schema: 1
status: architecture_candidate_values_not_part_freeze
source_type: usb_c_pd_20v_hardware_sink_dual_local_5v_regulators
off_control: "unplug USB-C POWER; USB-C DATA VBUS is detector-only and cannot energize the board"
input_trunk_class: PWR_PD
ir_floor_mohm: 90

pd_input:
  controller: CH224K
  requested_fixed_pdo_V: 20
  required_source_power_W: 60
  required_source_current_A: 3
  accepted_source_voltage_V: [19.0, 21.0]
  default_5v_operation: forbidden_by_uvlo
  input_protection_status: open_D4
  evidence: "40 W external output plus conversion and management losses exceeds a 15 V/3 A 45 W contract; dual TPS56637 cells and AP63203Q remain within their operating range at 20 V"

bank_delivery:
  - id: bank_a
    source_net: P5V_BANK_A
    destination_net: P5V_A_PROTECTED
    load_current_A: 4.1
    rails: [VBUS1_SW, VBUS2_SW, VBUS_CTRL]
    aggregate_part: TPS259804ONRGER
    evidence: "two 2 A ports plus <=0.1 A internal management VBUS; exact breaker and IR corners pending"
  - id: bank_b
    source_net: P5V_BANK_B
    destination_net: P5V_B_PROTECTED
    load_current_A: 4.0
    rails: [VBUS3_SW, VBUS4_SW]
    aggregate_part: TPS259804ONRGER
    evidence: "two 2 A ports; exact breaker and IR corners pending"

rails:
  - name: P5V_BANK_A
    stage: conversion
    vin_min: 19.0
    vin_max: 21.0
    vout_min: 5.01464
    vout_max: 5.18565
    iout_max_A: 4.1
    converter: TPS56637RPAR
    eff: 0.90
    external_output: false
    feedback: {vref_min: 0.591, vref_max: 0.609, r_top_ohm: 75000, r_top_tol_pct: 0.1, r_bottom_ohm: 10000, r_bottom_tol_pct: 0.1, r_top_tcr_ppm_per_C: 25, r_bottom_tcr_ppm_per_C: 25, resistor_temperature_delta_C: 0}
    margin: 0.05
    steady_state_ceiling_V: 5.25
    steady_state_variation_high_mV: 50
    steady_state_variation_basis: engineering_allocation
    steady_state_variation_evidence: "50 mV reserved above the 5.18565 V feedback corner for ripple and load release; first article must capture all-port release"
  - name: P5V_BANK_B
    stage: conversion
    vin_min: 19.0
    vin_max: 21.0
    vout_min: 5.01464
    vout_max: 5.18565
    iout_max_A: 4.0
    converter: TPS56637RPAR
    eff: 0.90
    external_output: false
    feedback: {vref_min: 0.591, vref_max: 0.609, r_top_ohm: 75000, r_top_tol_pct: 0.1, r_bottom_ohm: 10000, r_bottom_tol_pct: 0.1, r_top_tcr_ppm_per_C: 25, r_bottom_tcr_ppm_per_C: 25, resistor_temperature_delta_C: 0}
    margin: 0.05
