# Authored first-pass four-layer floorplan for the 2 A-per-port USB debug hub.
# The validated USB/control island is retained from usb-controlled-debug-hub-v2.
# The south power row contains the
# 20 V PD/input-protection cell, a dedicated 3.3 V buck, and two independent
# 5 V / 6 A buck-plus-aggregate-eFuse banks. The user-approved 150 x 115 mm
# compaction preserves that row as one rigid cluster with a routing/thermal
# corridor north of it. This is placement intent only;
# no signal or power routing from the predecessor is carried over.
#
# Board generation remains a pre-route artifact. Exact footprint/model
# registration, placement gates, DRC, USB corridor review, and thermal/current
# density review must pass before route.yaml may be adopted.
project:
  name: usb_controlled_debug_hub_2a
  netlist: 06_build/netlists/usb_controlled_debug_hub_2a.net
  output: 04_kicad/usb_controlled_debug_hub_2a.kicad_pcb
  parts_dir: 02_parts
board:
  outline:
    x0: 20.0
    y0: 20.0
    x1: 170.0
    y1: 135.0
  edge_width: 0.1
  layers: 4
  stackup:
    nominal_thickness_mm: 1.6
    thickness_tolerance_mm: 0.1
    copper_finish: ENIG
    dielectric_constraints: true
    mask_thickness_mm: 0.01
    copper_thickness_mm:
    - 0.035
    - 0.0152
    - 0.0152
    - 0.035
    dielectrics:
    - type: prepreg
      thickness_mm: 0.2104
      material: '7628'
      epsilon_r: 4.4
      loss_tangent: 0.02
    - type: core
      thickness_mm: 1.065
      material: FR4
      epsilon_r: 4.4
      loss_tangent: 0.02
    - type: prepreg
      thickness_mm: 0.2104
      material: '7628'
      epsilon_r: 4.4
      loss_tangent: 0.02
  mounting_holes:
    footprint: MountingHole:MountingHole_3.2mm_M3
    refdes_prefix: H
    at:
    - - 24.0
      - 24.0
    - - 166.0
      - 44.0
    - - 24.0
      - 131.0
    - - 166.0
      - 131.0
  fiducials:
    footprint: Fiducial:Fiducial_1mm_Mask2mm
    refdes_prefix: FID
    at:
    - - 28.0
      - 28.0
    - - 164.0
      - 101.0
    - - 45.0
      - 131.0
libraries:
- lib: usb_controlled_debug_hub
  path: 03_src/lib/usb_controlled_debug_hub.pretty
- lib: usb_controlled_debug_hub_2a
  path: 03_src/lib/usb_controlled_debug_hub_2a.pretty
- /usr/share/kicad/footprints
