schema: 2
kind: pcb-enclosure-mechanical-intent-v2
name: usb-controlled-debug-hub-2a-v1-enclosure-redesign
desired_release:
  lifecycle: draft
  readiness: CAD_READY
requirements:
  pcb_retained_with_lid_removed: true
  cabled_parts: []
states:
  - id: empty_base
    purpose: initial
    present_parts: [base]
    secured_fastener_groups: []
    enclosure_closed: false
    pcb_retained: false
  - id: lid_removed_service
    purpose: lid_removed
    present_parts: [base, pcb]
    secured_fastener_groups: [pcb_screws]
    enclosure_closed: false
    pcb_retained: true
  - id: installed
    purpose: installed
    present_parts: [base, pcb, lid]
    secured_fastener_groups: [pcb_screws, case_screws]
    enclosure_closed: true
    pcb_retained: true
operations:
  - id: insert_complete_pcb
    kind: linear_insert
    from_state: empty_base
    to_state: lid_removed_service
    moving_parts: [pcb]
    direction: [0, 0, -1]
    travel_mm: 45.0
    cable_condition: not_applicable
    threading_permitted: false
    bending_permitted: false
    disconnecting_permitted: false
    clearance_case: pcb_drop_in
  - id: install_complete_lid
    kind: linear_insert
    from_state: lid_removed_service
    to_state: installed
    moving_parts: [lid]
    direction: [0, 0, -1]
    travel_mm: 45.0
    cable_condition: not_applicable
    threading_permitted: false
    bending_permitted: false
    disconnecting_permitted: false
    clearance_case: lid_installation
  - id: remove_complete_lid
    kind: linear_remove
    from_state: installed
    to_state: lid_removed_service
    moving_parts: [lid]
    direction: [0, 0, 1]
    travel_mm: 45.0
    cable_condition: not_applicable
    threading_permitted: false
    bending_permitted: false
    disconnecting_permitted: false
    clearance_case: lid_removal
  - id: remove_complete_pcb
    kind: linear_remove
    from_state: lid_removed_service
    to_state: empty_base
    moving_parts: [pcb]
    direction: [0, 0, 1]
    travel_mm: 45.0
    cable_condition: not_applicable
    threading_permitted: false
    bending_permitted: false
    disconnecting_permitted: false
    clearance_case: pcb_removal
unknowns:
  - id: current_assembly_step
    scope: shell
    question: Generate and bind a complete whole-board STEP for sealed PCB v0.1.2, including all four USB-A bodies, then prove fitted-reference coverage.
    blocks_readiness: CAD_READY
  - id: independent_case_axes
    scope: board_retention
    question: Select separate case-post axes that clear the complete PCB, all six connectors, board insertion, and tool access without excessive connector recess.
    blocks_readiness: CAD_READY
  - id: actual_mating_hardware
    scope: connector_access
    question: Measure the intended two USB-C and four USB-A plug overmolds, simultaneous straight exits, bend radii, and strain relief.
    blocks_readiness: CAD_READY
  - id: first_article_board_support
    scope: board_retention
    question: Prove all intended PCB supports seat simultaneously and no connector, solder tail, component, wall, rail, or closure post bears on the PCB.
    blocks_readiness: PRINT_VERIFIED
  - id: insert_process_fit
    scope: shell
    question: Qualify every insert pilot with the exact printer, material, slicer, orientation, and insert lot.
    blocks_readiness: PRINT_VERIFIED
  - id: simultaneous_six_cable_fit
    scope: connector_access
    question: Mate both USB-C cables and all four USB-A cables simultaneously without the enclosure becoming an insertion stop or forcing the PCB.
    blocks_readiness: PRINT_VERIFIED
  - id: closed_case_thermal
    scope: thermal
    question: Run the commissioned closed-case full-load soak at the hottest expected ambient and record component, connector, air, and case temperatures.
    blocks_readiness: THERMALLY_VERIFIED
excluded_claims:
  - exact_component_clearance
  - cad_ready
  - physical_fit
  - print_verified
  - thermal_performance
  - production_readiness
  - order_readiness
