# pluto-cal-switch — net architecture: netclasses + DRU floors source.
#
# Read alongside 01_docs/ARCHITECTURE.md §9 (net domains) and §10 (critical
# geometries). Widths live HERE, not in the prose; the prose links back.
#
# TWO THINGS ABOUT THIS BOARD THAT MAKE IT UNLIKE THE OTHERS IN THIS FLEET:
#
# 1. THE DOMINANT WIDTH CONSTRAINT IS IMPEDANCE, NOT AMPACITY. The RF classes
#    below are 0.35 mm because that is 50 ohm on the ordered stackup
#    (JLC04161H-7628, 0.2104 mm top prepreg — DETAIL_DESIGN section 1), NOT
#    because of current. A "safety" widening of an RF class is a DEFECT, not a
#    conservative choice: it detunes the line. Both directions are wrong.
#    Every such class therefore declares `current: signal` EXPLICITLY, and its
#    `intent:` says what the width really is.
#
# 2. `current:` IS A TYPED DECLARATION, NOT PROSE. A-AMP (rules_audit.py) now
#    FAILS an unreadable value instead of filing it under OKS — measured
#    2026-07-27, A-AMP had been grading 10 of 57 declared currents fleet-wide
#    because any qualifier made the parser return None. Every class here reads
#    as either a bare "<n> A" or the literal word "signal". Qualifying prose
#    goes in `intent:`, where it cannot silence the gate.

fab_tier: jlc_4layer_advanced
# D-TIER (ADR-0010). Raised from the default, justified TWICE independently:
#   (a) RP2040 QFN-56 at 0.40 mm pitch computes jlc_4layer_advanced
#       UNCONDITIONALLY (56 pins is far outside escape_check's <=12-pin
#       outward-only rescue class);
#   (b) BGS12WN6 pin 2 is the SOLE ground on a part with no exposed pad. A
#       standard-tier 0.45 mm via centred on its 0.25 mm land leaves 0.050 mm
#       to pins 1 and 3, under the 0.127 mm floor; offsetting it onto a stub
#       adds ~0.2-0.3 nH = 7-11 ohm at 6 GHz, attacking the tightest spec on
#       the board (21 dB min isolation). At advanced a 0.25 mm via fits AT the
#       land with 0.150 mm clearance.
# Because (b) stands alone, removing or re-picking the MCU does NOT license
# dropping back to standard.
#
# ORDER_README line required by D-TIER:
#   "ADVANCED option REQUIRED: min via 0.25/0.15 mm (BGS12WN6 pin-2 ground via
#    at the land + RP2040 QFN-56 0.40 mm escape). 4-layer JLC04161H-7628,
#    IMPEDANCE CONTROL REQUESTED."

# DECLARED 2026-07-29 BECAUSE THE HARDCODE ITSELF WAS THE DEFECT. Until now no
# class here declared a `clearance:` at all, so all seven rode
# generate_rules_generic's HARDCODED 0.2 mm while the router derived its own
# clearance from the tier's 0.09 mm min_space. tier_preflight PF-RULES-CLR failed
# on exactly that gap and names the precedent: crow-rv2 (2026-07-23) produced 500
# phantom clearance findings from a router that routed tighter than the DRC floor
# nobody had written down.
#
# THE NUMBER IS 0.15 mm, AND IT IS SET BY A DATASHEET LAND, NOT BY TASTE OR BY
# THE FAB FLOOR. tier_preflight's suggested fix is 0.09 (the tier's min_space);
# that is the wrong direction on an RF board, where gap is free isolation and
# nothing needs 0.09 to fit. But 0.20 — the value this file carried for the first
# hour of the fix — is UNBUILDABLE HERE, and DRC said so: 16 clearance violations,
# every single one INSIDE a footprint and every single one at exactly 0.150 mm.
#   * 14 of them are the two BGS12WN6 lands. Infineon's Figure 5 'Footprint
#     recommendation' puts six 0.25 mm lands on a 0.40 mm grid — a 0.150 mm
#     land-to-land gap. We do not get to choose it; it is the part.
#   * 2 are the TPD2E2U06's SOT-553 land, same story.
# A DRC floor stricter than a land the board is REQUIRED to use is a floor that
# can never pass, and no amount of routing or placement fixes it. 0.15 is
# therefore the tightest DATASHEET-MANDATED gap on the board, still 1.67x the
# tier's 0.09 etch floor, and route.yaml's route.common.clearance matches it so
# the router is held to the number DRC will check. What this does NOT do is let
# the router route at 0.15 by preference: a class clearance is a floor, and the
# board has open area everywhere outside the two switch lands.
default_clearance: 0.15mm

classes:
  RF50:
    intent: >
      Every 50 ohm single-ended RF net. 0.35 mm on L1 over a SOLID L2 ground is
      50 ohm on the ordered stackup (Hammerstad-Jensen: 0.30 -> 55.2 ohm,
      0.35 -> 51.0 ohm, 0.40 -> 47.5 ohm). THIS IS AN IMPEDANCE WIDTH, NOT AN
      AMPACITY WIDTH — widening it is as wrong as narrowing it. Fenced with
      ground vias at <=2.0 mm (lambda_g/12 at 6 GHz); L2 unbroken underneath
      everywhere; no vias, no layer changes. Current is negligible and is NOT
      what sets this width: at the CITED +8 dBm TX MAXIMUM (AD9363 Rev. D
      p.4 of 32 — 1 dB above the +7 dBm this board carried until 2026-07-27)
      it is 22 mA rms into 50 ohm, and even at the declared +27 dBm board abuse
      ceiling it is 63 mA rms.
    nets: [RX_ANT1, RX_ANT2, RX_PLUTO1, RX_PLUTO2, TX_PLUTO,
           SW1_ANT, SW2_ANT, LOOP_SPLIT,
           PAD_A1_1, PAD_A1_2, PAD_A1_3, PAD_A1_4]
    current: signal
    min_width: 0.35mm
    # EXPLICIT, not inherited: generate_rules' unexamined 0.2 mm hardcode is
    # itself the defect tier_preflight PF-RULES-CLR names, and 0.2 is
    # unbuildable against the BGS12WN6 / SOT-553 land gaps. See
    # default_clearance at the top of this file for the derivation.
    clearance: 0.15mm
    routing: KRT, L1 only, no vias
    verify: DRC floor + P-ADJ spans + the measured VNA sweep at bring-up
    # CORRECTED AT STAGE 4 (2026-07-28), three changes, all forced by authoring
    # the netlist rather than reading the prose:
    #  * `LOOP_IN` RETIRED. It and LOOP_SPLIT were TWO NAMES FOR ONE NODE —
    #    PAD_A1's output IS the delta's input vertex (nothing sits between them;
    #    DETAIL_DESIGN section 2 calls the run "PAD_A1 out -> splitter vertex,
    #    22 mm"). A netlist cannot carry both, so the name that appears in more
    #    places (LOOP_SPLIT: here, three E-INV chains, and the 49.9 ohm part's
    #    keep_short) survives.
    #  * PAD_A1_1..4 ADDED. A9 turned PAD_A1 from one chip into a FIVE-chip
    #    cascade (2x YAT-10A+ + 3x YAT-2A+, ADR-0016) and the four internal
    #    nets between those chips were never declared. They are 50 ohm RF
    #    segments, 3 mm each (DETAIL_DESIGN section 2, "4 x 3 mm between the
    #    five chips"); without this line they fall to the 0.25 mm default class,
    #    which is ~55 ohm on this stackup. A netclass omission is an IMPEDANCE
    #    DEFECT, and no schematic gate can see it.
    #  * RX_ANT1/2 and SW1_ANT/SW2_ANT are now the two SEPARATE halves of each
    #    antenna run, split by the DC block: jack -> RX_ANTn -> C_DCBLKn ->
    #    SWn_ANT -> switch RF1. Both halves were already in this class; what
    #    changed is that they are no longer aliases (E-INV used a third name,
    #    RX_ANTn_EXT, that was declared in no netclass at all).

  RF_LOOP_MATCH:
    intent: >
      The D4 PAIR (ADR-0011). Same 50 ohm geometry as RF50, but split out as
      its own class so the two length-matched loopback arms are visible to the
      router and to the rules gate AS A PAIR rather than as two unrelated nets.
      Mirror-symmetric about the splitter axis, identical bend for bend, same
      layer, no vias, arm attenuators at IDENTICAL (not mirrored) rotation.
      Inter-arm separation >= 3x dielectric height plus a via fence: two
      parallel 50 ohm microstrips on a 0.21 mm prepreg couple at roughly -25 to
      -35 dB over a few mm at 6 GHz, which is AT OR ABOVE the 29.9 dB isolation
      the arm pads buy — the routing can undo the pads' work. NOTE A9 did NOT
      relax this: the 18 dB attenuation increase went entirely PRE-SPLIT, so
      the arm pads are unchanged at 11.9 dB and so is the coupling budget they
      have to survive. Current: signal, same reasoning as RF50.
    nets: [LOOP_ARM1, LOOP_ARM2,
           PAD_A2A_1, PAD_A2B_1,
           LOOP_ARM1_SW, LOOP_ARM2_SW]
    current: signal
    min_width: 0.35mm
    clearance: 0.15mm
    routing: KRT, L1 only, mirrored pair, no vias
    verify: DRC floor + the PUBLISHED per-arm length and delta (ADR-0011)
    # CORRECTED AT STAGE 4 (2026-07-28). THE MATCHED PAIR IS THE WHOLE RUN FROM
    # THE SPLITTER VERTEX TO THE SWITCH, NOT JUST ITS FIRST SEGMENT. Each arm
    # is three nets, because the 11.9 dB arm pad is TWO chips (YAT-10A+ +
    # YAT-2A+): LOOP_ARMn (vertex -> pad in, 8 mm) -> PAD_A2x_1 (between the two
    # chips, 3 mm) -> LOOP_ARMn_SW (pad out -> switch RF2, 8 mm). DETAIL_DESIGN
    # section 2 budgets all three ("splitter arm -> PAD_A2 in", "PAD_A2 out ->
    # switch RF2", both "x2, mirrored"). Only the first was declared here, so
    # two thirds of the D4 published pair would have routed at the 0.25 mm
    # default width — and the arm-to-arm DELTA this board exists to publish is
    # measured across the WHOLE run, so a class that covers only its first
    # segment cannot make the pair visible to the router "AS A PAIR", which is
    # this class's stated reason for existing.

  USB_DP:
    intent: >
      USB 2.0 full-speed differential pair, ~89 ohm at 0.33 mm with a 0.25 mm
      gap, on the same layer and the same reference as the RF. Full speed does
      NOT require a controlled pair on a run this short (critical length at a
      4 ns edge is ~170 mm; this run is under 30 mm), but the stackup the RF
      forces delivers it at essentially the same trace width, so it is routed
      properly for free. THE BINDING RULE IS THE REFERENCE, NOT THE IMPEDANCE:
      solid, uninterrupted L2 ground for the ENTIRE length, never crossing an
      RF trace or a plane split. Current: signal.
    nets: [USB_DP, USB_DM, USB_DP_MCU, USB_DM_MCU]
    current: signal
    min_width: 0.33mm
    clearance: 0.15mm
    routing: KRT, L1, matched pair, 27 ohm series at the MCU
    verify: DRC floor + no plane split under the pair (R-PLANE)
    # STAGE 4 (2026-07-28): the pair is FOUR nets, not two, because the 27 ohm
    # series terminators split it. USB_DP/USB_DM are the long controlled run
    # (micro-USB -> USBLC6 -> the terminators); USB_DP_MCU/USB_DM_MCU are the
    # short stubs from the terminators to the RP2040, which the vendor requires
    # to be "placed close to the chip". The stubs are added to this class rather
    # than left at the 0.25 mm default so the whole pair carries ONE width — a
    # width step inside a differential pair is a discontinuity, and at full
    # speed it is harmless but there is no reason to author one.
    # NOTE the USBLC6-2SC6 does NOT split these nets: its pins 1/6 are ONE
    # internal node and its 3/4 are the other (Figure 1, Doc ID 11265 Rev 5).
    # "Route through the part with no stub" is a COPPER instruction; the netlist
    # sees a shunt clamp, not a series element.

  CTRL:
    intent: >
      The shared control net and the GPIO-header nets. Slow edges, 2 mA drive,
      1 kohm series + 1 nF shunt AT each switch CTRL pin. Routed on an inner
      layer under ground where it crosses the RF region, and NEVER parallel to
      a loopback arm — 25 mm of this stackup's microstrip is lambda/4 at
      ~1.5 GHz, mid-band, so an undamped control trace entering the RF section
      is a resonator, not a wire. Current: signal — I_Ctrl is 2 nA typ / 10 nA
      max per switch (BGS12WN6 Table 2), and the only real current is 0.66 mA
      into the two 10 kohm pull-downs.
    nets: [RF_CTRL, RF_CTRL_SW1, RF_CTRL_SW2, HDR_CTRL_IN, HDR_CTRL_ADC,
           HDR_STATE_OUT, HDR_STATE_GPIO]
    # STAGE 4: HDR_STATE_GPIO added — the MCU-side half of the emulated
    # open-drain state output, separated from HDR_STATE_OUT by the 1 kohm series
    # (ADR-0008 section 3). The resistor is the whole protection, so the two
    # halves must be distinct nets or it is not in the path.
    current: signal
    min_width: 0.2mm
    clearance: 0.15mm
    routing: KRT, inner layer under ground across the RF region
    verify: DRC floor + I-AN separation from RF_LOOP_MATCH

  QSPI:
    intent: >
      RP2040 execute-in-place bus. Short and direct, flash hugging the MCU. On
      this board it is also the only CONTINUOUS in-band spur source (tens of
      MHz, sub-ns edges, harmonics past 6 GHz), so "short" is an EMI rule here,
      not only a signal-integrity one. Current: signal.
    nets: [QSPI_SCLK, QSPI_CSN, QSPI_SD0, QSPI_SD1, QSPI_SD2, QSPI_SD3]
    current: signal
    min_width: 0.2mm
    clearance: 0.15mm
    routing: KRT, kept inside the digital corner
    verify: DRC floor + P-ADJ span budget from the RP2040 layout block

  PWR:
    intent: >
      VBUS in, the protected VBUS node, the 3V3 rail and the ferrite-isolated
      switch-bias branch. 0.4 mm is far above the ampacity need — it is chosen
      for IR drop and robustness. The declared current is the DESIGN ENVELOPE,
      not the typical: RP2040 ~50 mA worst case + flash ~5 mA + two switches at
      125 uA max + two LEDs at 1.9 mA gives ~60 mA typical. 0.10 A is declared
      so the LDO's thermal margin is graded against the envelope — at the USB
      high limit of 5.25 V that is 195 mW in a SOT-23 rated 300 mW (65%), and
      above ~120 mA the LDO choice is WRONG (ADR-0009).
    nets: [VBUS, VBUS_PF, VBUS_F, 3V3, 3V3_SW, VREG_VOUT]
    current: 0.10 A
    min_width: 0.4mm
    clearance: 0.15mm
    routing: KRT
    verify: DRC floor + A-AMP
    # STAGE 4 (2026-07-28), two nets added because the ARCHITECTURE section 5
    # power tree has FOUR series elements on the USB entry, not three:
    #   VBUS --[F1 PPTC]-- VBUS_PF --[FB1 ferrite]-- VBUS_F --[U_LDO]-- 3V3
    # `VBUS_PF` is the node BETWEEN the polyfuse and the ferrite. It was never
    # named, and E-INV's `series_chain [VBUS, F1, VBUS_F]` implied the ferrite
    # did not exist. The chain is now [VBUS, F1, FB1, VBUS_F] — STRONGER, since
    # it pins the ferrite in the path too.
    # `VREG_VOUT` is the RP2040's internal 1.1 V core rail, which the datasheet
    # requires to be linked to both DVDD pins OFF-CHIP (section 2.9.7.1,
    # Figure 16). It carries the whole core current, so it belongs in a declared
    # class rather than the 0.25 mm default.

# Default class (0.25 mm): status LEDs and anything else unlisted.
# GND is pours + stitching on L2/L4 and carries no netclass width.

# ===========================================================================
# scoped_floors — THREE LAND TAPERS. THIS FILE PREVIOUSLY DECLARED "NO SCOPED
# FLOORS, DELIBERATELY"; THAT SENTENCE WAS RIGHT ABOUT THE REASONING AND WRONG
# ABOUT THE BOARD, AND THE MEASUREMENT IS WHY.
# ===========================================================================
# The old text read: "A width relaxation inside a zone would break the impedance
# of any RF class it touched, and canon M4 requires evidence for one anyway.
# Declared absent rather than omitted." Both halves stand — a BROAD relaxation
# on an RF class IS an impedance defect, and canon M4 does require evidence.
# What was missing was the evidence, and it arrived at the top of stage 6, before
# a single track existed, from a question nothing in this pipeline had asked:
#
#   FOR EVERY PAD ON A CLASS WITH A WIDTH FLOOR, WHAT IS THE WIDEST TRACK THAT
#   CAN LAND ON IT AT THIS BOARD'S OWN 0.15 mm CLEARANCE FLOOR?
#
# Measured from pad geometry only — 48 approach directions x a 30 um grid of
# landing points inside each land, every other-net F.Cu pad within 2.5 mm as an
# obstacle, no router involved. ELEVEN PADS ANSWER "LESS THAN MY OWN CLASS
# MINIMUM":
#
#   pad                 net          class    needs   max landable   short by
#   U_SW1.5             RX_PLUTO1    RF50     0.350       0.250        0.100
#   U_SW2.5             RX_PLUTO2    RF50     0.350       0.250        0.100
#   U_MCU.47            USB_DP_MCU   USB_DP   0.330       0.300        0.030
#   U_MCU.46            USB_DM_MCU   USB_DP   0.330       0.300        0.030
#   U_MCU.10/22/26/33   3V3          PWR      0.400       0.300        0.100
#   U_MCU.23/45/50      VREG_VOUT    PWR      0.400       0.300        0.100
#
# and the arithmetic behind the search is one line: for a 0.250 mm land on
# 0.400 mm pitch the neighbouring land's copper edge sits 0.275 mm from the
# centre, so w/2 <= 0.275 - 0.150 gives w <= 0.250; for the RP2040's 0.200 mm
# land on the same pitch it is 0.300 mm, so w <= 0.300.
#
# THE PITCH IS THE PART, SO NEITHER ROUTING NOR PLACEMENT CAN FIX IT.
# U_SW1.5/U_SW2.5 are the BGS12WN6's RFC port — the MIDDLE pad of its second
# row, with 3V3_SW and RF_CTRL_SW at +-0.400 mm on either side. The RP2040 pins
# are QFN-56 at 0.400 mm, the same pitch that forced ADR-0010's tier. The pads
# that are NOT hemmed in need nothing at all: U_SW.1 (LOOP_ARMn_SW), U_SW.3
# (SWn_ANT) and U_SW.4 all measure 0.460 mm landable, so the two published
# loopback arms and both antenna runs land at their full 0.35 mm impedance width
# with 0.200 mm of clearance to spare, and no relaxation touches them.
#
# NO GATE ASKED THIS. placement_gates PASSED, tier_preflight is 0 FAIL / 2 WARN,
# and `escape_check` (D-ESC) models escape as a VIA-RING / outward-pad
# feasibility question — it never compares a netclass track width against the
# land the track has to terminate on. Left alone the board would have routed and
# produced clearance violations that read as ROUTER defects, on a board whose
# rules were unsatisfiable before the router started.
#
# WHY A TAPER IS NOT AN IMPEDANCE DEFECT, WHICH IS THE ONLY REASON THIS IS
# ALLOWED. The relaxation is bounded in SPACE by a rule area drawn around the
# land, so the necked copper is at most ~1 mm long. At 6 GHz lambda_g on this
# stackup is 27.29 mm, so 1 mm is lambda_g/27 and 0.45 mm (what RX_PLUTOn
# actually needs) is lambda_g/61 — a discontinuity that short is a lumped
# reactance, not a transmission line, and the reflection it causes is far below
# the 0.4 dB the SMA launch itself contributes. The alternative — widening the
# LAND, or narrowing the whole RF class to 0.25 mm (about 63 ohm on this
# stackup) — would be the real impedance defect. This is the standard fine-pitch
# answer, written down and machine-checked instead of left to the router.
#
# WHY THE PWR RELAXATION IS NOT AN AMPACITY DEFECT. This file's own PWR block
# says 0.4 mm "is far above the ampacity need — it is chosen for IR drop and
# robustness", against a DESIGN ENVELOPE of 0.10 A. At 0.25 mm on 1 oz copper
# IPC-2152 gives well over 1 A for a 10 degC rise, and the necked length is
# under 1 mm, so the added IR drop is microvolts. A-AMP grades the CLASS, which
# is unchanged at 0.4 mm.
#
# EACH FLOOR IS SET BELOW THE MEASURED MAXIMUM, NOT AT IT, so the number is not
# riding on the grid search's resolution: 0.22 against a 0.250 ceiling
# (0.165 mm realized clearance) and 0.25 against a 0.300 ceiling (0.175 mm).
# Both are far above jlc_4layer_advanced's 0.127 mm min_track, which
# generate_rules_generic checks independently and would refuse.
scoped_floors:
  - zone: taper_u_sw1
    nets: [RX_PLUTO1, RF_CTRL_SW1]
    min_width: 0.15
    why: >
      MEASURED 2026-07-29 on the placed board: the widest track that can land on
      U_SW1.5 (BGS12WN6 RFC, the middle pad of the 0.400 mm second row, between
      3V3_SW on pad 4 and RF_CTRL_SW1 on pad 6) at the 0.15 mm clearance floor is
      0.250 mm, against this net's RF50 minimum of 0.350 mm. Exactly: the
      neighbouring 0.250 mm land's copper edge is 0.275 mm from the RFC land
      centre, so w <= 2*(0.275-0.150) = 0.250. 0.22 mm realizes 0.165 mm of
      clearance. The neck runs 0.45 mm — lambda_g/61 at 6 GHz on JLC04161H-7628
      (lambda_g 27.29 mm) — and the line is back at its 0.35 mm impedance width
      for the remaining 8.55 mm to J_SMA_RX1. Not a placement finding: the pitch
      is the part.
      SECOND MEASUREMENT, 2026-07-29, AFTER THE FIRST ROUTED BOARD, and it is
      why this floor is 0.15 and not 0.22: RF_CTRL_SW2 could not escape U_SW2.6
      at its CTRL class minimum of 0.200 mm either. KRT necked it to 0.1498 mm
      of its own accord, and the geometry says why — leaving pad 6 north-east,
      the track passes 0.225 mm from U_SW2.1's land, which admits 2*(0.225-0.150)
      = 0.150 mm and no more. Its channel-1 twin RF_CTRL_SW1 found a 0.200 mm
      path in the same land field, so this is a real per-channel asymmetry in the
      CONTROL copper, not a symmetric one: harmless, because RF_CTRL_SWn is a DC
      logic level behind a 1 kohm series and a 1 nF shunt (nets.yaml CTRL:
      "2 nA typ / 10 nA max per switch"), and 0.15 mm carries that with five
      orders of magnitude to spare. The floor is stated as 0.15 for BOTH nets so
      the two channels are licensed identically even though only one used it.
      0.15 is 1.18x the tier's 0.127 mm min_track.
  - zone: taper_u_sw2
    nets: [RX_PLUTO2, RF_CTRL_SW2]
    min_width: 0.15
    why: >
      The arm-2 twin of taper_u_sw1, MEASURED INDEPENDENTLY rather than inherited
      (canon: a waiver copied from a sibling is an inherited defect). U_SW2.5
      measures the same 0.250 mm landable maximum against the same 0.350 mm RF50
      floor, and U_SW2 is U_SW1 translated by exactly +14.500 mm at identical
      rotation, so the two necks are congruent and the taper is common-mode
      between the two receive channels rather than a new asymmetry.
  - zone: taper_u_mcu
    nets: [3V3, VREG_VOUT, USB_DP_MCU, USB_DM_MCU]
    min_width: 0.25
    why: >
      MEASURED 2026-07-29: nine RP2040 QFN-56 pads cannot accept their own class
      minimum at the 0.15 mm floor — 3V3 on pins 10/22/26/33 and VREG_VOUT on
      23/45/50 need 0.400 mm (PWR) and USB_DP_MCU/USB_DM_MCU on 47/46 need
      0.330 mm (USB_DP), against a landable maximum of 0.300 mm on every one of
      them (0.200 mm land on 0.400 mm pitch: w <= 2*(0.300-0.150)). 0.25 mm
      realizes 0.175 mm. Bounded to U_MCU's own escape field (the pad ring
      +~1.1 mm) so no trunk is relaxed: PWR's 0.4 mm is an IR-drop choice against
      a 0.10 A envelope, not an ampacity one (this file's PWR block says so), and
      0.25 mm on 1 oz copper carries over 1 A at a 10 degC rise, so a sub-1 mm
      neck costs microvolts. On the USB pair the width is not even required —
      the pair's own intent block records that full speed needs no controlled
      impedance over a run this short and that 0.33 mm was taken because the
      stackup gave it for free; a 0.25 mm neck at the die end is free too.

# ===========================================================================
# length_match — canon R-LEN. THE ONLY PLACE THIS BOARD'S RELEASE ARTIFACT IS
# GRADED ON COPPER.
# ===========================================================================
# AUTHORED 2026-07-29, AT THE TOP OF STAGE 6, BEFORE ANY TRACK EXISTED — and
# that order is the point. Without this block `copper_length_audit.py` reports
# `R-LEN-UNREACHED`, which is honest but means the board could be routed and
# then have no gate at all on the one property it exists to publish (ADR-0011,
# BRIEF D4). The netclass RF_LOOP_MATCH above makes the pair visible to the
# ROUTER; this block makes the pair visible to a GATE, measured off the shipped
# `.kicad_pcb`. They are not the same job: a netclass constrains WIDTH, and
# phase is a property of LENGTH.
#
# WHY THIS BOARD'S OWN AUDIT WAS NOT ALREADY ENOUGH. `03_src/audit_board.py`
# publishes A-SYM at PASS — "11 arm pairs, exact translation, worst error
# 0.0 um" — from footprint `GetPosition()`, and A-SEG sums PAD-TO-PAD straight
# lines. Both are PLACEMENT metrics wearing electrical names. Two
# mirror-perfect placements joined by two differently-meandered traces have
# identical A-SYM and different phase, and KRT is stochastic by contract.
#
# THE TWO NUMBERS BELOW HAVE DIFFERENT JOBS AND CONFLATING THEM IS THE WHOLE
# JUDGEMENT:
#   * `max_spread_mm` is a DRIFT ceiling, DERIVED not chosen. The static delta
#     is calibrated out in software (ADR-0011: "as long as distance is
#     precisely known it will be software offset"); what is NOT calibrated out
#     is how the delta MOVES with temperature, and that term scales with the
#     length DIFFERENCE: dtau = TC*dT*dL*t_pd. At the estimated +100 ppm/degC
#     for FR-4 over 40 degC, dL = 1 mm drifts 0.024 ps = 0.05 deg at 6 GHz,
#     while dL = 20 mm (a naive rectangular fan-out) drifts 1.05 deg — the size
#     of a whole phase budget. 1.0 mm is therefore the defensible ceiling, and
#     it is also ~1x the BGS12WN6-class part-to-part insertion-phase window
#     (13.2 deg at 6 GHz = 1.00 mm of copper), so matching tighter than this
#     buys a quantity that cannot be distinguished from the switch we bought.
#   * `pin:` is the REPRODUCIBILITY check and it is the one that guards the
#     release. It records the spread the published artifact CLAIMS and FAILS
#     when the copper moves off it, because a re-route silently turns every
#     published picosecond into fiction.
#
# THE PIN IS 0.000 mm AND IT IS NOT A HOPE — IT IS AN ARITHMETIC CONSEQUENCE
# OF HOW THE ARM COPPER IS GENERATED. `03_src/arm_copper.py` routes arm 1 and
# emits arm 2 as arm 1 REFLECTED ABOUT y = 55.000 mm, in integer nanometres
# (y' = 110000000 - y), so the two arms are congruent by construction and the
# spread is exactly zero, not approximately zero. A reflection is an isometry;
# the transform cannot change a length.
#
# **THE TRANSFORM IS A REFLECTION, NOT THE "+14.5 mm TRANSLATION" A-SYM
# REPORTS, AND THE DIFFERENCE IS MEASURED.** A-SYM's translation is true for
# every arm part sitting at y = 47.750 / 62.250 — but only because
# 62.250 = 2*55.000 - 47.750, i.e. for THOSE parts the two maps coincide. The
# splitter resistors are not at those y's and there the maps disagree:
#   LOOP_ARM1  R_DELTA1.2 (64.000, 53.670)   R_DELTA3.1 (62.400, 54.550)
#   LOOP_ARM2  R_DELTA2.2 (64.000, 56.330)   R_DELTA3.2 (62.400, 55.450)
# +14.5 sends 53.670 -> 68.170, where there is no pad. y -> 110.0 - y sends
# 53.670 -> 56.330 and 54.550 -> 55.450, EXACTLY, and maps all 11 arm-net pads
# onto their partners at 0.000 mm. ADR-0011's own words are "mirror images
# about the splitter axis". Generating arm 2 by the translation A-SYM published
# would have missed arm 2 entirely.
#
# `tol_mm` IS 0.010, TIGHTER THAN THE 0.05 THE CANON ROW SUGGESTS, AND THE
# REASON IS THAT IT IS NOT A PHYSICS TOLERANCE. A tolerance tighter than
# ~0.5 mm would be meaningless as a MATCHING target: etch tolerance moves trace
# WIDTH (impedance), not centreline length, and the fab length terms — outline
# route +-0.2 mm, Dk spread +-1.7% on t_pd — are COMMON MODE across two arms
# cut by one tool path on one panel. But the pin does not grade the process; it
# grades whether the FILE still has the property the release published, and
# copper length in a `.kicad_pcb` is exact to the nanometre and free to check.
# 0.010 mm = 0.13 deg at 6 GHz is 10x the reader-vs-pcbnew agreement floor
# (1 um) and small enough that ANY re-route which abandons the reflection —
# which would move the spread by whole millimetres — trips it immediately.
#
# WHAT THE ABSOLUTE PER-ARM NUMBER INCLUDES, STATED SO IT IS NOT A SURPRISE:
# LOOP_ARMn is a THREE-pad net, because R_DELTA3 (the delta's bridge leg,
# ADR-0003) lands on it. Its tap is real copper on a member net and is counted.
# It is laid as a DAISY CHAIN terminating on the R_DELTA1.2 / R_DELTA2.2 land
# (R_DELTA3.n -> R_DELTAn.2 -> U_PAD_A2x1.2) so the copper graph has ZERO
# branch vertices and `topology: chain` is satisfiable — a T here would make
# the group R-LEN-UNREACHED, which is the correct verdict for an ambiguous
# number and not one worth earning. The tap is mirror-symmetric, so it cancels
# in the delta exactly as the pad-entry term does.
length_match:
  RF_LOOP_D4:
    adr: "0011"          # QUOTED: bare 0011 is OCTAL 9 in YAML 1.1, and the
                        # gate then prints "ADR-9". The schema in
                        # copper_length_audit.py --schema shows it unquoted.
    intent: >
      The two loopback arms are the board's RELEASE ARTIFACT: BRIEF D4 ships
      the routed electrical length per arm and the arm-to-arm delta, converted
      to picoseconds at a constant pinned to the ordered stackup, so the
      Pluto's AoA calibration can software-offset a KNOWN number. What the
      match buys is therefore not accuracy but CALIBRATABILITY — an unpublished
      delta is exactly the error this board exists to remove. Graded across the
      WHOLE run from the splitter's series resistor to the switch RF2 pin,
      because the 11.9 dB arm attenuator is TWO chips and each series part
      splits the run into another net.
    members:
      ARM1: [LOOP_ARM1, PAD_A2A_1, LOOP_ARM1_SW]
      ARM2: [LOOP_ARM2, PAD_A2B_1, LOOP_ARM2_SW]
    topology: chain
    congruent_pads: true
    # EARNED, not asserted: the reflection y -> 110.0 - y maps all 11 arm-net
    # pads onto their partners at 0.000 mm (audit_board A-SYM measures the
    # footprint side of the same fact), the parts are the same MPNs from the
    # same reel, and the two arm attenuator chips are at IDENTICAL rotation as
    # ADR-0011 sec.3 requires. So the unmeasured pad-entry copper is the same
    # length on both members and cancels in the delta.
    no_vias: true
    # ADR-0011's "no vias in either arm, no layer changes" made executable.
    # MEASURED 2026-07-29: this is the ONLY place that intent is graded
    # anywhere — route.yaml and route_and_stitch_generic.py have no per-net via
    # ban, only a per-WAVE `layers:` restriction that nothing re-checks. One
    # via on one arm is a pure DIFFERENTIAL error on a published delta.
    max_spread_mm: 1.0
    pin:
      spread_mm: 0.000
      tol_mm: 0.010
      measured_on: stage-6 route, pre-release (no version sealed yet)
    phase:
      # ADR-0011 pins 6.0 ps/mm; the canon R-LEN row re-derives 6.105 ps/mm
      # from this same stackup (eps_eff 3.350 at w/h = 1.711) and the two agree
      # within 2%. The gate's own constant is 6.105, so this block states the
      # ADR's number for traceability rather than to override anything — and
      # because the spread is 0.000 the two constants give the same answer.
      t_pd_ps_per_mm: 6.0
      f_ghz: 6.0
      stackup: JLC04161H-7628
    # NO `stackup_mm:` DELIBERATELY. It exists only to price via barrels, and
    # `no_vias: true` means a via here is a FAIL, not a length to price.
    # Declaring it would create a path on which a via could be silently costed
    # instead of refused.
