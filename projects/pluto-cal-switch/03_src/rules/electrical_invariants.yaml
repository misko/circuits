# pluto-cal-switch — ELECTRICAL INVARIANTS (canon E-INV, phase E1).
#
# Design INTENT made EXECUTABLE against the exported netlist. Every other gate
# proves SELF-CONSISTENCY; this one proves the netlist matches what the ADRs
# decided. Graded by electrical_invariants.py PROJECT_DIR; E-ADR
# (--adr-coverage) flags any protection/topology ADR that emits none.
#
# THE ONE THING THIS BOARD MUST NEVER DO is come up in LOOPBACK. Everything in
# the first block below exists to make that a machine-checked fact rather than
# a sentence in ADR-0001. NOTE the shape of the assertions: three of them pin
# TOPOLOGY (a resistor exists, on the right nets) and one pins VALUE — because
# an invariant that pins a component's EXISTENCE does not pin its value, and
# the smc0985-cooksense watchdog incident shipped a pull-down at 100k where the
# datasheet bounded it at 5.2k with all three topology assertions passing.

invariants:

  # ---- ADR-0001: the power-on state is ANTENNA, in hardware ---------------
  # The wiring, not the firmware, is what makes OFF = antenna. Get RF1 and RF2
  # backwards and the board still passes ERC, DRC, parity and every render —
  # it just boots into loopback while the user believes they are receiving
  # off-air, which is undetectable because the receiver still sees signal.
  - assert: pin_on_net
    pin: "U_SW1.3"            # BGS12WN6 pin 3 = RF1
    net: SW1_ANT
    adr: "0001"
    why: "truth table CTRL=0 -> RFIN-RF1 (BGS12WN6 Table 12, PDF p11). RF1 MUST
      face the ANTENNA so the power-on/undriven state is antenna mode. Swapping
      RF1 and RF2 inverts the SAFE STATE, not just the feature, and no
      self-consistency gate can see it"

  - assert: pin_on_net
    pin: "U_SW1.1"            # pin 1 = RF2
    net: LOOP_ARM1
    adr: "0001"
    why: "RF2 MUST face the loopback arm — the other half of the same fact"

  - assert: pin_on_net
    pin: "U_SW2.3"
    net: SW2_ANT
    adr: "0001"
    why: "channel 2, same reasoning. Both channels must switch together and in
      the same sense"

  - assert: pin_on_net
    pin: "U_SW2.1"
    net: LOOP_ARM2
    adr: "0001"
    why: "channel 2, loopback throw"

  - assert: net_has_part
    net: RF_CTRL_SW1
    part_type: resistor
    min: 2                    # the 1k series AND the 10k pull-down
    adr: "0001"
    why: "the CTRL node must carry BOTH the 10k pull-down that defines the
      state when nothing drives it (I_Ctrl is 2 nA typ, so an undriven CTRL has
      NO defined state) and the 1k series that de-RFs the shared control net"

  - assert: net_has_part
    net: RF_CTRL_SW2
    part_type: resistor
    min: 2
    adr: "0001"
    why: "channel 2, same"

  - assert: part_value
    part: R_CTRL_PD1
    max: 45k
    adr: "0001"
    why: "THE VALUE, NOT JUST THE EXISTENCE. The pull-down must hold CTRL below
      V_Ctrl,L = 0.45 V against I_Ctrl max 10 nA, so R_max = 0.45/10n = 45k.
      10k is fitted, for noise immunity and because two in parallel present 5k
      to the MCU (0.66 mA at 3.3 V, inside even the 2 mA drive setting). A
      pull-down that EXISTS at the wrong value passes every topology assertion
      above and silently disables the property it was fitted for — that is the
      smc0985-cooksense watchdog class, where a 100k where 5.2k was required
      left a safety supervisor disabled with three topology assertions green"

  - assert: part_value
    part: R_CTRL_PD2
    max: 45k
    adr: "0001"
    why: "channel 2, same bound, same reason"

  - assert: net_has_part
    net: RF_CTRL_SW1
    part_type: capacitor
    min: 1
    adr: "0001"
    why: "1 nF shunt AT the CTRL pin. Infineon's own measurement board carried
      1 nF CTRL-GND (Table 6 fn 2), and without it 25 mm of this stackup's
      microstrip is lambda/4 at ~1.5 GHz — mid-band — so the shared control net
      is a resonator radiating into the calibration path, not a wire"

  - assert: net_has_part
    net: RF_CTRL_SW2
    part_type: capacitor
    min: 1
    adr: "0001"
    why: "channel 2, same"

  # ---- ADR-0002: the switch VDD rail, and the 34 mV margin it avoids ------
  - assert: pin_on_net
    pin: "U_SW1.4"            # BGS12WN6 pin 4 = VDD
    net: 3V3_SW
    adr: "0002"
    why: "the switch VDD must be the FERRITE-ISOLATED 3V3 branch, not raw 3V3
      and NEVER the 5 V USB rail. BGS12WN6 VDD absolute max is 4.2 V and
      BGS12P2L6's is 3.6 V; a 5 V rail destroys either. The ferrite branch also
      keeps the LDO's dead PSRR above a few hundred kHz off the switch bias"

  - assert: pin_on_net
    pin: "U_SW2.4"
    net: 3V3_SW
    adr: "0002"
    why: "channel 2, same"

  # ---- ADR-0005: DC coupling posture ------------------------------------
  # The switches' RF ports are DC-connected through the die and V_RFDC must be
  # 0 V. Two things make that true, and both are checkable.
  - assert: series_chain
    chain: [RX_ANT1_EXT, C_DCBLK1, RX_ANT1]
    adr: "0005"
    why: "the DC block must be IN SERIES with the antenna port, not shunted
      across it. RX_ANT1 is the only user-facing port where an unknown DC
      source (an active antenna, a bias-tee'd LNA) can appear; without the
      block that bias is shorted to ground through the switch die and the YAT
      pads, driving fault current through a 0.7 x 1.1 mm part"

  - assert: series_chain
    chain: [RX_ANT2_EXT, C_DCBLK2, RX_ANT2]
    adr: "0005"
    why: "channel 2, same"

  - assert: part_value
    part: C_DCBLK1
    equals: 1n
    tolerance_pct: 20
    adr: "0005"
    why: "1 nF is the compromise across an 85.7:1 band: Xc = 2.27 ohm at 70 MHz
      (RL 32.9 dB) and, with an 0402's ~0.4 nH ESL, +j15.0 ohm at 6 GHz
      (RL 16.5 dB). 100 pF would give 22.7 ohm at 70 MHz — RL 12.9 dB and
      0.22 dB of loss, materially worse at the bottom. A wrong-value 0402 fits
      perfectly and is invisible on any render. NB the SI decoder reads m as
      MILLI and M as MEGA"

  - assert: part_value
    part: C_DCBLK2
    equals: 1n
    tolerance_pct: 20
    adr: "0005"
    why: "channel 2, same — and the two MUST match, because an asymmetric block
      lands directly in the arm-to-arm comparison the board exists to make"

  # ---- ADR-0003: the splitter is a DELTA, and its value is the topology ---
  # A star and a delta are both "three resistors on three nets". They differ
  # only in VALUE (16.9 vs 49.9 ohm) and in which pairs they bridge — and the
  # star is 9.3 dB worse at 6 GHz with identical parts. Nothing but these
  # assertions can tell the two apart in a netlist.
  - assert: series_chain
    chain: [LOOP_SPLIT, R_DELTA1, LOOP_ARM1]
    adr: "0003"
    why: "R12 bridges the input vertex to arm 1. In a STAR the same three
      resistors would each run from a port to a common node instead, and the
      netlist would be self-consistent either way"

  - assert: series_chain
    chain: [LOOP_SPLIT, R_DELTA2, LOOP_ARM2]
    adr: "0003"
    why: "R13 bridges the input vertex to arm 2"

  - assert: series_chain
    chain: [LOOP_ARM1, R_DELTA3, LOOP_ARM2]
    adr: "0003"
    why: "R23 bridges the two ARMS — this is the leg that exists ONLY in a
      delta. Under symmetric excitation it carries zero current, which is why
      the delta's through path crosses ONE chip body where a star's crosses
      two. Its absence would BE the star topology"

  - assert: part_value
    part: R_DELTA1
    equals: 49.9
    tolerance_pct: 1
    adr: "0003"
    why: "the delta value must EQUAL Z0. The port-2 match reduces to
      Rb^2 + 50*Rb - 5000 = 0 => Rb = 50 ohm UNIQUELY, so 50/50/50 is the ONLY
      all-ports-matched resistive 3-port. 16.9 ohm here would be a star built
      on delta wiring: every port mismatched, and no gate but this one sees it"

  - assert: part_value
    part: R_DELTA2
    equals: 49.9
    tolerance_pct: 1
    adr: "0003"
    why: "the same 50-ohm uniqueness argument as R_DELTA1, and R_DELTA1/R_DELTA2
      must additionally MATCH EACH OTHER: amplitude imbalance is 4.339 dB per
      unit fractional mismatch, so 2% differential between two independent 1%
      parts is 0.087 dB landing straight in the arm-to-arm comparison the board
      exists to make. Specify both from the same reel"

  - assert: part_value
    part: R_DELTA3
    equals: 49.9
    tolerance_pct: 1
    adr: "0003"
    why: "the isolation leg. It carries ZERO current under symmetric excitation,
      so its value never shows up in the through response and a wrong part here
      is invisible on the bench until one RX cable is unplugged — at which point
      it sets the +3.52 dB error on the surviving channel"

  # ---- ADR-0004: the attenuation is SPLIT, not all pre-split -------------
  # The whole four-reason argument of ADR-0004 collapses if the arm pads are
  # omitted or moved ahead of the split. Three consequences follow silently:
  # inter-channel isolation falls 6.02 + 2*A2 -> 6.02 dB; an unplugged RX
  # cable adds +3.52 dB to the OTHER channel with no error indication; and in
  # antenna mode the splitter presents Zin = infinity to TX (Gamma = +1).
  - assert: series_chain
    chain: [TX_PLUTO, U_PAD_A1, LOOP_IN]
    through: {U_PAD_A1: ["2", "5"]}
    adr: "0004"
    why: "the 10 dB pre-split pad sits between the TX port and the splitter
      input — this is what keeps the TX port's return loss set by the pad,
      which is the one surviving argument of the pre-split position"

  - assert: series_chain
    chain: [LOOP_ARM1, U_PAD_A2A, LOOP_ARM1_SW]
    through: {U_PAD_A2A: ["2", "5"]}
    adr: "0004"
    why: "THE ARM PAD MUST BE IN THE ARM. Omitting it or relocating it ahead of
      the split costs ~24 dB of inter-channel isolation, unmasks the
      loose-connector +3.52 dB error, and leaves the splitter facing two
      reflective shorts in antenna mode"

  - assert: series_chain
    chain: [LOOP_ARM2, U_PAD_A2B, LOOP_ARM2_SW]
    through: {U_PAD_A2B: ["2", "5"]}
    adr: "0004"
    why: "channel 2, same reasoning as arm 1 — and the two arms must be
      topologically IDENTICAL, because the published D4 delta is only meaningful
      if the only difference between them is geometry"

  # ---- ADR-0015: the three Pluto-facing ports are SMA JACKS, cable-fed ------
  # A8 (2026-07-27) replaced the SMA->SMP adapter interface with SMA cables, so
  # these three refdes change from J_SMP_* to J_SMA_*. The ASSERTIONS DO NOT
  # WEAKEN — they get stronger, because the mechanical cue that used to make a
  # transposition semi-visible (a non-uniform 11.60 / 11.98 mm pitch that only
  # mated one way) is GONE. With five identical SMA jacks on our own pitch,
  # NOTHING physical distinguishes RX1 from RX2: plugging a cable into the
  # wrong one is silent, and swapping them in the netlist is silent too.
  # A cabled board needs this check MORE than a push-on board did.
  - assert: pin_on_net
    pin: "J_SMA_RX1.1"
    net: RX_PLUTO1
    adr: "0015"
    why: "the three Pluto-facing jacks map to specific Pluto ports (port_order,
      MEASURED, consumed via mates.yaml). Swapping RX1 and RX2 in the netlist
      produces a board that assembles perfectly, cables perfectly, and reports
      the two channels TRANSPOSED — invisible to every geometric gate, and the
      whole product of this board is which channel is which"

  - assert: pin_on_net
    pin: "J_SMA_RX2.1"
    net: RX_PLUTO2
    adr: "0015"
    why: "channel 2. This jack is also one half of the D4 arm-to-arm pair, so a
      transposition moves the mirror axis the loopback layout is built around
      as well as relabelling the channels"

  - assert: pin_on_net
    pin: "J_SMA_TX.1"
    net: TX_PLUTO
    adr: "0015"
    why: "TX feeds PAD_A1 and nothing else — that single connection is what
      makes the ENTIRE pad chain upstream of both switches (ADR-0016 §7.2), so
      no switch state and no switch fault can present raw TX to a receiver. A
      transposition here would feed the splitter from an RX port AND break that
      property"

  - assert: series_chain
    chain: [TX_PLUTO, U_PAD_A1, LOOP_IN]
    through: {U_PAD_A1: ["2", "5"]}
    adr: "0016"
    why: "THE PAD MUST BE UPSTREAM OF THE SWITCH, and this is the netlist half
      of that guarantee. If TX_PLUTO ever reached a switch RF port without
      crossing PAD_A1, a stuck or shorted switch would put the transmitter on a
      receiver at the splitter's 6.02 dB alone — RX at +2 dBm from a +8 dBm TX,
      i.e. AT the AD936x absolute maximum. The 40 dB total would still read
      correct on a sweep, because a sweep measures the intact path"

  # ---- ADR-0011: the two arms are the SAME CIRCUIT, part for part ---------
  # The published length/amplitude delta is only meaningful if the two arms are
  # topologically identical. This is the netlist half of that; the geometric
  # half (mirror symmetry, identical rotation, no vias) is named at the bottom
  # of this file as OUT OF REACH.
  - assert: net_has_part
    net: LOOP_ARM1
    part_type: resistor
    min: 2
    adr: "0011"
    why: "arm 1 sees exactly the two delta legs that terminate on it (R_DELTA1
      and R_DELTA3). A third resistor on one arm and not the other is an
      asymmetry that lands directly in the published D4 delta"

  - assert: net_has_part
    net: LOOP_ARM2
    part_type: resistor
    min: 2
    adr: "0011"
    why: "arm 2, the mirror of the above. The pair of assertions is the point:
      either arm alone proves nothing about the match"

  # ---- ADR-0012: the MCU's strapping and control pins ---------------------
  - assert: pin_on_net
    pin: "U_MCU.19"           # TESTEN
    net: GND
    adr: "0012"
    why: "RP2040 Table 619 states TESTEN plainly: 'Test enable (connect to
      Gnd)'. Left floating on a 0.4 mm-pitch QFN-56 it is unprobeable and
      unreworkable"

  - assert: pin_on_net
    pin: "U_MCU.40"           # GPIO28 / ADC2
    net: HDR_CTRL_ADC
    adr: "0012"
    why: "the header input MUST land on an ADC-capable pin (GPIO26-29 only).
      On any other GPIO it becomes a digital input with a flat 2.0 V VIH, which
      a 1.8 V PlutoPlus output cannot reach — the board would read the header
      as permanently LOW, fail-safe and therefore invisible to any bench test
      that only asks whether it can spuriously enter loopback"

  # ---- ADR-0008: the header can never drive the Pluto ---------------------
  - assert: series_chain
    chain: [HDR_CTRL_IN, R_HDR_S, HDR_CTRL_ADC]
    adr: "0008"
    why: "the header input reaches the MCU ONLY through the series resistor.
      Direct connection is BOTH non-functional (PlutoPlus IO is 1.8 V against
      RP2040's flat 2.0 V VIH — it would read permanently LOW, fail-safe and
      therefore invisible to any 'can it enter loopback' bench test) AND a
      hazard in reverse (RP2040 VOH 2.62-3.3 V into a Zynq pin whose absolute
      max is ~2.35 V)"

  - assert: part_value
    part: R_HDR_S
    min: 1k
    adr: "0008"
    why: "the series resistor is the FAULT-CURRENT BOUND, not just a divider
      leg. At 2.2k a firmware bug driving 3.3 V into a clamped 1.8 V Zynq pin
      sources (3.3-2.3)/2200 = 0.45 mA. Below ~1k that bound stops protecting
      the user's Pluto, and the divider ratio also stops matching the 0.36 V
      firmware threshold"

  - assert: net_has_part
    net: HDR_CTRL_ADC
    part_type: resistor
    min: 2
    adr: "0008"
    why: "series AND shunt. The shunt is also the pull-down that makes an
      UNCONNECTED header read 0 V = antenna mode"

  # ---- ADR-0009: input protection ----------------------------------------
  - assert: series_chain
    chain: [VBUS, F1, VBUS_F]
    adr: "0009"
    why: "the PPTC must be genuinely IN SERIES with VBUS. It protects the HOST,
      not this board — a shorted rail here must not kill the laptop USB port —
      and a part that exists but is not in the path protects nothing"

  - assert: pin_on_net
    pin: "U_LDO.3"            # ME6211 SOT-23-5 pin 3 = CE
    net: VBUS_F
    adr: "0009"
    why: "CE MUST be tied to the VIN node explicitly. The ME6211 datasheet
      never states whether the C series has an internal pull-up or pull-down,
      so a floating CE is UNDEFINED power-up behaviour — it may not come up, or
      may come up intermittently. Its Figure 2 typical application (p.2) shows
      CE tied to VIN, and that is the only guidance that exists"

  - assert: net_has_part
    net: VBUS
    part_type: capacitor
    min: 1
    adr: "0009"
    why: "VBUS bulk at the connector. NOTE the binding constraint here is a
      CEILING, not a floor: USB 2.0 sec 7.2.4.1 caps downstream bulk at 10 uF
      without surge limiting, and this board budgets 6.8 uF total. No netlist
      gate can check a ceiling across nets — it is a review item"

  - assert: net_has_part
    net: USB_DP
    part_type: ic
    min: 1
    adr: "0009"
    why: "the ESD array must be ON the data lines, not merely near them. ST's
      own layout section makes trace inductance a TERM IN THE CLAMP VOLTAGE
      (VCL+ = VTRANSIL + VF + L_IO*di/dt + L_GND*di/dt), so the pair must route
      THROUGH the part with zero stubs"

# ---------------------------------------------------------------------------
# label_survival — the schematic NET-MERGE gate (S-NETMERGE). The generic
# check (every schematic global_label survives to the exported netlist) is
# ALWAYS ON and needs no config. No exemptions are declared: every label on
# this board is intended to reach the netlist.
#
# A pin_map block is NOT declared. It is the right tool for a repeated
# connector array (the crow-recorder 8-port RJ45 case); this board's five RF
# ports are individually asserted above, which is stronger, and the SMP/SMA
# pin maps are single-signal-plus-grounds where a merge would be caught by the
# generic check anyway.
label_survival: {}

# ---------------------------------------------------------------------------
# WHAT THIS FILE CANNOT REACH, STATED SO IT IS NOT MISTAKEN FOR COVERAGE.
# E1 is netlist-only. The following are REAL invariants of this design that no
# assertion here can express, and each is assigned to a human gate:
#
#   * the 34 mV / 234 mV VDD headroom question (ADR-0002) — needs a rail
#     tolerance vs a part's rated MAXIMUM. E-MARGIN grades the LOW corner
#     against a brownout; nothing grades the HIGH corner against an abs max.
#     -> red-team topology lens.
#   * the arm-to-arm MIRROR SYMMETRY and identical (non-mirrored) rotation of
#     the arm attenuators (ADR-0011) — geometric, and partly a CPL fact.
#     -> placement audit + A-ROT.
#   * inter-arm coupling >= 3x dielectric height (ADR-0004) — geometric.
#     -> placement audit.
#   * "no via, no layer change in either loopback arm" — geometric.
#     -> routing gate.
#   * the 10 uF USB bulk CEILING (ADR-0009) — a sum across nets, not a
#     per-net minimum. -> red-team topology lens.
