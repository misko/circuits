# ---- EXEMPT REFDES CLASSES -------------------------------------------------
# Kept short deliberately: a hardcoded/over-broad exemption is how the
# refdes-on-silk waiver became an inherited defect across three boards.
exempt_prefixes: [H, TP, FID, MH]
