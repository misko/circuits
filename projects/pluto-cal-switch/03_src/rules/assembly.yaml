# pluto-cal-switch — the ASSEMBLY gate battery's input (A-POP / A-STOCK, and
# A-ROT once it lands). PCBA is the deliverable: an unpopulated part is a
# DEFECT WITH A DECISION RECORD, never a free outcome.
#
# STATE: authored at the end of stage 3. NO BOARD EXISTS YET, so `not_assembled`
# and `consigned` are DECLARED EMPTY rather than left as template comments —
# an empty declaration is a claim ("every footprint is placed") that A-POP will
# grade against the real board. If that turns out to be false, the entry gets
# added here with evidence; it does not get discovered at the CPL.

# ---- SERVICE DECLARATION ---------------------------------------------------
service: standard
# NOT Economic, and the reason is decided rather than defaulted. TWO
# independent things force Standard PCBA:
#   (a) THT parts — 5x SMA vertical flange jacks (was 2x; A8/ADR-0015 made all
#       five ports true SMA) and the micro-USB's two PCB LEG slots. THT is
#       Standard-only.
#   (b) the stackup. JLC's published capability for Economic PCBA is "Standard
#       stack-up only, special stack-up is not supported", and this board
#       orders 4-layer JLC04161H-7628 WITH IMPEDANCE CONTROL (ADR-0010).
# Assembly adder for the THT: ~$3.50 setup + ~$0.0173/joint (5x5 SMA + 2 USB
# legs = 27 joints ~= $0.47) + $3.00 per extended component. The joint count
# more than doubled and the adder moved by ~$0.26 — stated rather than left
# stale, because a number nobody re-derives is a number nobody trusts.

sides: [top]
# Single-sided placement, deliberately. The RF section occupies L1 and the
# bottom side stays free so L4 can be an uninterrupted ground pour under the
# whole board. Adding `bottom` would be a cost AND an RF decision, not a
# layout convenience.

fiducials: none
# Declared, not defaulted. JLC adds its own fiducials on the SMT rails. LOCAL
# fiducials beside <=0.4mm-pitch parts are OUR job and cannot be added later —
# and this board has TWO parts at 0.40 mm pitch (RP2040 QFN-56, BGS12WN6
# PG-TSNP-6-10). REVISIT AT PLACEMENT: if JLC's DFM flags either, local
# fiducials must be added before the board is routed, not after.

build_quantity: 5
# A prototype run. The binding stock ceiling is the attenuator, NOT the board —
# and A9 MOVED WHICH attenuator binds: YAT-2A+ (C5205333) at 103 pieces /
# 5 per board = 20 boards, taking over from YAT-10A+ (150 / 4 per board =
# 37 boards). It was YAT-10A+ at 50 boards under the 30 dB build.

# ---- NOT ASSEMBLED ---------------------------------------------------------
# EMPTY BY DECLARATION. Every footprint on this board is intended to be machine
# placed. One candidate was considered and it is POPULATED:
#   * the SMA and micro-USB THT parts — JLC hand-solders them as part of
#     Standard PCBA; they are populated, they stay on the CPL, and their cost
#     is in the service declaration above.
#
# A8/ADR-0015 CLOSED THE ONLY REAL RISK THAT USED TO SIT HERE, and it is worth
# recording how. This block previously carried a two-branch contingency for
# SMP-MSLD-PCE-5T (C6297051): an EDGE-LAUNCH part straddling a routed outline
# notch and demanding 0.13 mm coplanarity, where "in the JLC library and
# purchasable" is not "placeable", and where a DFM refusal would have forced
# either a three-footprint re-spin or a `not_assembled` entry whose only honest
# `reason` did not exist in the closed vocabulary. **The part is deleted.**
# Five conventional THT SMA flange jacks replace it, and JLC places those
# routinely. Note the shape of the closure: an open DFM question was retired by
# a design change, not by getting an answer — if edge-launch SMP ever returns,
# the question returns with it, unanswered.
not_assembled: []

# ---- CONSIGNED -------------------------------------------------------------
# EMPTY. Nothing is supplied from stock on hand. Note this is a POPULATION
# claim as well as a sourcing one: a consigned part is PLACED and stays on the
# CPL, so listing one under not_assembled would conflate the two classes.
consigned: []

# ---- SOURCING PLAN ---------------------------------------------------------
# A-STOCK fails any coded, placed line whose stock evidence is not OK unless it
# appears here with a MEASURED number and a date. Nothing is planned yet
# because no BOM has been exported; the numbers below are the design-time
# state and MUST be re-measured at seal.
sourcing_plan: []
