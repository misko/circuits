#             SINCE A9 (it was 2/board => 51 before the pad went to 40 dB).
#   C5839318  YAT-10A+   150  -> 4/board => 37 boards (was 3/board => 50)
#   C504007   KH-SMA-KE-Z 19252 -> 5/board => 3850 boards
#   C534203   BGS12WN6  2448  -> 2/board => 1224 boards
#   C82317    W25Q16    8927  -> 1/board. FRAGILE: 4 of 6 16-Mbit SKUs read
#             out of stock the same day, and the in-stock fallback
#             (C2843335, USON-8) is a DIFFERENT FOOTPRINT — a stockout here is
#             a re-spin, not a re-BOM.
#   OWED BEFORE THE SCHEMATIC: stock on the mid-value YAT parts (15A+ / 12A+ /
#             5A+ / 3A+). A single 15 dB chip would collapse PAD_A1 from five
#             parts to two, save ~$7/board and lift the 20-board ceiling. Any
#             substitute's own datasheet MIN column must be READ — ADR-0016's
