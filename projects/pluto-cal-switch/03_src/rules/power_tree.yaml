# pluto-cal-switch — the E-TOPO / E-MARGIN / E-OFF input.
#
# Graded by skills/kicad-pcb/scripts/power_topology.py.
#
# ============================================================================
# READ THIS FIRST — A GATE GAP, REPORTED RATHER THAN WORKED AROUND
# ============================================================================
# E-TOPO CANNOT EXPRESS A LINEAR REGULATOR, AND THIS BOARD'S ONLY CONVERTER IS
# ONE.
#
#   power_topology.py normalize_type() (line ~155) maps a part.yaml `type:` to
#   exactly one of buck / boost / buck_boost, by substring. Anything else
#   returns None, and resolve_converter() then raises LoadError:
#     "converter ... part.yaml type 'ldo_regulator_fixed_3v3' does not classify
#      as buck/boost/buck_boost"
#   which power_topology.py reports as a CONFIG error and exits 2.
#
#   `converter:` is also REQUIRED per rail (line ~343), so the rail cannot be
#   declared without naming one.
#
# THE THREE WAYS OUT, AND WHY ONLY ONE IS HONEST:
#   (a) omit power_tree.yaml entirely -> the checker returns N-A and exits 0.
#       REJECTED: that is the M-COVER silent-skip class. The board would have
#       an ungraded, undeclared power tree and the gate would print OK.
#   (b) label the LDO `..._buck` so the substring match fires. REJECTED: it is
#       a false statement in a part.yaml, and canon M4 calls a rationale
#       without evidence an inherited defect. It would also make E-TOPO grade
#       the wrong thing — a linear regulator is not a switching buck.
#   (c) DECLARE THE RAIL TRUTHFULLY, let the gate fail on ITS OWN gap, and
#       report the gap upstream. CHOSEN.
#
# THE TOPOLOGY IS DERIVED ANYWAY, BY HAND, TO THE SAME RULE THE GATE USES:
#   Vout_max (3.30) < Vin_min (4.40) ALWAYS  =>  STEP-DOWN REQUIRED.
#   A boost or buck-boost stage would be over-engineering (the usb-hub-3s
#   class). A LINEAR step-down is the correct implementation at 60 mA and
#   1.7 V of drop: 117 mW in a SOT-23 rated 300 mW, against a switching
#   converter's inductor, its switching-node radiation, and its spurs — on a
#   board whose entire product is a clean 70 MHz-6 GHz measurement, a switcher
#   would be the WORSE engineering choice, not merely a costlier one.
#
# PROPOSED FIX FOR THE SKILL (not made here — skills/ is out of scope for this
# change and two other agents are working in it): give normalize_type() a
# LINEAR class, derive it as a legitimate implementation of a STEP-DOWN
# requirement, and grade its DROPOUT and DISSIPATION instead of its topology.
# An LDO-only board is not exotic; it is the majority of small boards.
# ============================================================================

# ---- E-OFF: N-A, and stated deliberately rather than omitted ---------------
# The board's ONLY energy source is the USB host. Unplugging the cable
# de-energizes it completely: no cell, no pack, no stored charge beyond
# ~6.8 uF of ceramic. There is nothing to self-drain in storage, so E-OFF's
# battery-detection path does not fire and no off_control/quiescent_ua
# declaration is required. See ADR-0009.
source_type: usb

# OPTIONAL: the shared input trunk's netclass. Declared so an under-built
# trunk is a FAIL rather than an advisory.
input_trunk_class: PWR

rails:
  - name: 3V3
    # Vin is the USB VBUS envelope at OUR connector, taken from the SPEC and
    # not from "5 V": USB 2.0 Table 7-7 "DC Electrical Characteristics" p.178
    # gives 4.75-5.25 V at a high-power port and 4.40-5.25 V at a low-power
    # port. 4.40 V is the worst realistic steady state. (The 4.070 V transient
    # floor is NOT used as vin_min — it is a transient, and the LDO still has
    # 0.77 V of headroom there.)
    vin_min: 4.40
    vin_max: 5.25
    # Fixed 3.3 V output. The window is the regulator's own +/-2% accuracy.
    # NOTE the E-MARGIN `feedback:` block does NOT apply: this is a FIXED
    # output with no external divider, so there are no divider tolerances to
    # stack. Declared absent deliberately.
    vout_min: 3.234
    vout_max: 3.366
    # THE DESIGN ENVELOPE, not the typical. RP2040 ~50 mA worst case + flash
    # ~5 mA + two BGS12WN6 at 125 uA max + two LEDs at 1.9 mA ~= 60 mA typical.
    iout_max_A: 0.10
    converter: ME6211C33M5G-N
    eff: 1.0    # a linear regulator's "efficiency" is Vout/Vin, not a
                # converter figure; 1.0 makes the derived input-trunk current
                # equal the output current, which is the physically correct
                # answer for a linear pass element (Iin = Iout + Iq).
    # E-MARGIN: `load_uv_threshold` is DELIBERATELY ABSENT. The 3V3 loads are
    # an MCU, a flash and two RF switches with no published brownout voltage
    # that this rail must clear — unlike the Pi5-on-5V case that motivated
    # E-MARGIN. The number that DOES matter here is not headroom but
    # DISSIPATION, and the gate has no field for it:
    #   PD = (Vin_max - Vout) * Iout = (5.25 - 3.30) * 0.10 = 195 mW
    #   SOT-23 rating 300 mW (no ambient stated) => 65% at the envelope,
    #   39% at the realistic 60 mA.
    # ABOVE ~120 mA THIS PART IS WRONG and must escalate to SOT-89
    # (XC6227C331PR-G, C6035451, 500 mW) or to a buck. See ADR-0009.

# ---- THE ONE MARGIN THAT IS NOT ON THIS RAIL ------------------------------
# The tightest supply-vs-part margin on the board is NOT a brownout, it is an
# OVER-voltage against an absolute maximum, and it is the reason ADR-0002
# picked BGS12WN6 over BGS12P2L6:
#   this rail's worst-case HIGH corner            3.366 V
#   BGS12P2L6 VDD operating maximum               3.400 V   =>  34 mV margin
#   BGS12WN6  VDD operating maximum               3.600 V   =>  234 mV margin
# E-MARGIN grades the LOW corner against a load's brownout; nothing in the
# power-tree schema grades the HIGH corner against a load's rated maximum.
# Recorded here so it is visible, and asserted in electrical_invariants.yaml
# as far as a netlist gate can reach it.
