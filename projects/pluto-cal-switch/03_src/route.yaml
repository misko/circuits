  # DETERMINISTIC POUR-FED PIN SEED STUBS (canon M8: usb-hub-3s
  # plan_seed_stubs.py + add_seed_stubs.py). The pour-fed nets that leave a
  # dense IC pin row and weave across the escape field to their pour island —
  # KRT excludes them, taps are too short to thread. Runs BEFORE fill (the
  # pour bonds the pin around the stub copper). Each stub is EXPLICIT geometry
  # verified against the live board's exact copper with collision REFUSAL
  # (refuse whole, never shave), declares the `pin` (REF.PAD) it serves (the
  # pass proves the copper reaches it), and is idempotent. Plan the coordinates
  # against the FROZEN promoted chain (a maze router like plan_seed_stubs.py),
  # not by hand — re-plan if the chain is re-promoted. Omit or leave empty on
  # boards without pour-fed-pin opens.
  #   seed_stubs:
  #     clearance: 0.13                  # tighter than stitch clearance
  #     via: {size: 0.25, drill: 0.15}   # tier-derived when omitted
  #     stubs:
  #       - {net: LX1, pin: U1.18,
  #          segments: [{layer: F.Cu, width: 0.25, pts: [[60.6,70.9],[57.6,71.9]]}],
  #          vias: [[57.6,71.9]]}
  # SAME-NET ZONE PRIORITY UNIFY (canon M8: usb-hub-3s v1.0 "P3-union", v1.1
  # re-learn). Two pours of the SAME net overlapping at the SAME priority make
  # KiCad report `zones_intersect` ("intersecting zones must have distinct
  # priorities"). The pass bumps the smaller zone to a distinct higher priority
  # so the union NESTS legally (same net => identical copper), refills, and
  # re-verifies. A CROSS-net overlap is a SHORT and is REFUSED (escalate to
  # shorting_items — never a mechanical bump). `min_bbox` skips slivers.
  unify_zone_priorities: {min_bbox: 0.8}
  dedupe_vias: {radius: 0.5, metric: box}
  # RE-AIMED 2026-07-29 TO THE TIER FLOOR. At below_width 0.449 this pass would
  # have caught EVERY via on a track narrower than 0.449 mm — which on this board
  # is every tier via that is already correct at 0.25/0.15 — and inflated it to
  # 0.6/0.3 without a collision check. That is not a hypothetical: crow-rv2
  # (2026-07-23) inflated 323/323 vias this way and produced 902 DRC findings.
  # The pass now only touches vias BELOW the tier floor, which is what
  # "normalize" was ever supposed to mean (tier_preflight PF-NORM).
  normalize_vias: {below_width: 0.24, size: 0.25, drill: 0.15}
  drop_micro_fragments: {max_length: 0.12, require_free_end: true}
  # KRT overshoot tails (one wave left a 0.7mm S_MINUS stub -> track_dangling)
  drop_dangling: {max_length: 1.0, tol: 0.05, sweeps: 4}
  # KRT T-junctions: a stub end landing MID-BODY is continuous copper
  # but unanchored, so KiCad reports track_dangling. Split, never delete.
  split_t_junctions: {tol: 0.05}
  hole_to_hole: {min_gap: 0.5, mode: nudge, prefer_keep: [GND]}
  pad_rescue:
    net: GND                  # single-plane form (2-layer boards)
    # 4-LAYER / TWO INNER PLANES (In1=GND, In2=VIN): rescue BOTH plane-nets'
    # pads, not one. Use `nets` (per-pad via to EACH plane) instead of `net`:
    #   nets:
    #     - {net: GND, layer: In1.Cu}
    #     - {net: VIN, layer: In2.Cu}
    # or auto-detect every solid inner-plane pour:  auto: true
    via_in_pad: true          # B.Cu is a solid GND pour under the whole board
    served_within: 1.6
    rings: [0.75, 0.95, 1.2, 1.6, 2.1, 2.7]
    stub_width: 0.3
    # GAP-B SUB-FLOOR SCOPING (default ON): each adjacent-via+stub is a plane
    # drop, not a trunk, so it is exempted from the netclass ampacity floor by
    # a named rule area (`pad_rescue_stubs`) + a relaxed insideArea track_width
    # rule appended to the board's .kicad_dru (KiCad last-match precedence).
    # Set `stub_scope: false` to disable, or tune it:
    #   stub_scope: {area_name: pad_rescue_stubs, min_track_width: 0.3,
    #                layers: [F.Cu, B.Cu]}
    # NOTE: if your generate_rules-LAST rewrites .kicad_dru, it must preserve
    # (or re-emit) the pad_rescue_stubs rule, else the exemption is lost.
    # NON-FATAL: a pad whose via sites are blocked by a B.Cu track underneath
    # is still served by top-pour thermal spokes at fill. The DRC unconnected
    # gate is the arbiter.
    # NOTE: a pad already served by its footprint's OWN thermal via grid
    # (same-net PTH pads inside the SMD pad outline — HTSSOP/QFN EPs) is
    # SKIPPED automatically: a rescue via stacked on the grid is a
    # hole_to_hole clash (3S clean-room cleanup_vias.py part 1 incident).
    require: none
  stub_fallback: {net: GND, min_dist: 0.2, max_dist: 8.0, width: 0.3}
  astar_fallback: {net: GND, width: 0.25, window: 3.0, attempts: 3}
  stitch_grid:
    net: GND
    x: [24, 74, 8]
    y: [24, 64, 8]
    # OUT of the guarded analog rect — the bridge corner stays quiet
    avoid: [{x0: 20.0, y0: 26.0, x1: 44.0, y1: 58.0, margin: 1.0}]
  island_rescue: {min_bbox: 0.8, layers: [F.Cu, B.Cu], require: all}
  # POUR-ISLAND AUTO-HEAL (after the last fill): a same-net zone that FILLS
  # as >=2 disconnected islands is the DRC unconnected class "Zone [X] <->
  # Zone [X]" — the v4 usb-hub-3s tail was 4/7 exactly this (LX1/LX2/VIN_S/
  # VBUSA3 priority-2 F.Cu pours sliced by escape tracks, 2026-07-21), each
  # bridged by hand before this pass existed. heal_islands groups each pour
  # net's islands with pcbnew connectivity, bridges the narrowest
  # collision-clear gap with a track at the NET-CLASS width (zone-min-width
  # fallback) or a via through a shared same-net plane (every segment/via
  # pcb_toolkit-verified, taps discipline), then REFILLS and RE-VERIFIES:
  # a heal that does not reduce the island count is a hard error, a healed
  # board re-runs as a no-op (idempotent), and different nets are never
  # bridged. `layers` limits which copper layers are inspected (default:
  # all); min_bbox skips slivers (those are isolated_copper -> escalate).
  heal_islands: {min_bbox: 0.8}
  # EPILOGUE (recommended for 4-layer/plane boards): after the final fill,
  # prune vias THE STITCHER ITSELF emitted that ended up with same-net copper
  # on <2 layers — the `via_dangling` DRC class. Tests the FILLED polys
  # (via_janitor only credits zone OUTLINES, so a via in a fill void passes
  # janitor and still dangles — 3S clean-room cleanup_vias.py stray-via
  # deletions). Never touches imported-route or footprint vias. Add it to
  # `passes` after the last `fill`:
  #   passes: [..., fill, island_rescue, fill, prune_stitch_dangling, gate]
  # prune_stitch_dangling: {tol: 0.05, min_layers: 2}
