      - {net: LOOP_SPLIT, pin: R_DELTA1.1,
         segments: [{layer: F.Cu, width: 0.35, pts: [[69.503, 55.000], [64.000, 55.000], [64.000, 54.570]]}]}
      - {net: LOOP_SPLIT, pin: R_DELTA2.1,
         segments: [{layer: F.Cu, width: 0.35, pts: [[64.000, 55.000], [64.000, 55.430]]}]}
      - {net: LOOP_ARM1, pin: U_PAD_A2A1.2,
         segments: [{layer: F.Cu, width: 0.35, pts: [[62.400, 54.550], [64.000, 53.670], [64.500, 53.670], [64.900, 53.270], [64.900, 48.150], [64.500, 47.750], [64.000, 47.750]]}]}
      - {net: LOOP_ARM2, pin: U_PAD_A2B1.2,
