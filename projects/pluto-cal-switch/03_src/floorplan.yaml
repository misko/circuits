# pluto-cal-switch — floorplan config for the SHARED generic backend
# (skills/kicad-pcb/scripts/generate_board_generic.py). This board writes ZERO
# board-specific generation Python: this file IS the placement source.
#
# =============================================================================
# STATE 2026-07-28: IDENTITY ONLY. NO PLACEMENT IS AUTHORED YET.
# =============================================================================
# The schematic gate is a DECLARED HANDOFF BOUNDARY (skills/pcb-design/SKILL.md).
# Stage 4 finished there; placement and routing are the NEXT session's work.
#
# WHY THIS FILE WAS TOUCHED AT ALL AT STAGE 4, when placement is not stage 4's
# job: it was still carrying the cook-loadcell TEMPLATE VERBATIM — `project.name:
# cook_loadcell`, a 55x45 two-layer outline, and 29 anchors/seeds for a load-cell
# board. `03_src/rebuild_reuse.sh` derives the BOARD NAME from `project.name`
# here, and `generate_board_generic.py` writes to `project.output`. Left as it
# was, a rebuild would have quietly emitted `04_kicad/cook_loadcell.kicad_pcb`
# from this board's netlist. The foreign values are therefore PURGED and the
# identity is set; the placement is left EMPTY, which is an honest "not authored"
# rather than a wrong answer that looks like an answer.
#
# WHAT STAGE 5 MUST DO HERE, and the constraints are already derived — they are
# not open questions:
#   * ARCHITECTURE sec.10 lists eight critical geometries. The three that drive
#     the floorplan: LOOP_ARM1/LOOP_ARM2 mirror-symmetric about the splitter
#     axis (identical bend-for-bend, same layer, no vias, arm attenuators at
#     IDENTICAL — not mirrored — rotation); inter-arm separation >= 3x dielectric
#     height plus a via fence; and RP2040 + micro-USB at the far end from all
#     five SMA jacks.
#   * DETAIL_DESIGN sec.2 gives the target segment lengths the loss budget
#     assumes (TX jack -> PAD_A1 10 mm, the PAD_A1 five-chip cascade 4 x 3 mm,
#     PAD_A1 -> vertex 22 mm, vertex -> arm pad 8 mm x2, arm pad -> switch
#     8 mm x2, switch -> RX jack 5 mm x2, switch -> antenna jack 20 mm x2).
#   * 03_src/lib/pluto_cal_switch.pretty/ MUST EXIST FIRST. Nine non-stock land
#     patterns are named by 02_parts and none is authored yet; without them
#     generate_board_generic has nothing to place.
#   * fab tier is jlc_4layer_advanced (rules/nets.yaml), forced independently
#     twice: the BGS12WN6 pin-2 ground via AT the 0.25 mm land, and the RP2040
#     QFN-56 0.40 mm escape.
# =============================================================================

project:
  name: pluto_cal_switch
  netlist: 06_build/netlists/pluto_cal_switch.net
  output: 04_kicad/pluto_cal_switch.kicad_pcb
  parts_dir: 02_parts

board:
  # PLACEHOLDER outline, NOT a decision. It matches the envelope the tsx
  # <board> declares so tscircuit can render; the real outline is stage 5's and
  # is driven by the five SMA jacks' wrench access (ADR-0015: they sit on OUR
  # pitch, chosen for the RF and for a spanner, not on a foreign edge pitch).
  outline: {x0: 20.0, y0: 20.0, x1: 90.0, y1: 75.0}
  edge_width: 0.1
  layers: 4              # JLC04161H-7628 — L1 RF / L2 SOLID GND / L3 pours / L4 GND
  # mounting_holes: OWED. ARCHITECTURE sec.11 says a bare board with mounting
  # holes and a stiffener is advisable — five connectors with three cables
  # hanging off them is a lever-arm problem. Declared absent, not forgotten.

libraries:
  - /usr/share/kicad/footprints
  # - 03_src/lib/pluto_cal_switch.pretty   # OWED — stage 5

placement:
  anchors: {}   # NOT AUTHORED — stage 5. See the banner above.
  seeds: {}     # NOT AUTHORED — stage 5.

design_rules:
  # jlc_4layer_advanced floors (ADR-0010). These are the TIER's numbers, and
  # they are the one part of this file that is already a decision: the tier was
  # chosen at stage 3 and rules/nets.yaml declares it.
  track_min_width: 0.127
  min_clearance: 0.127
  via_min_annulus: 0.05
  hole_clearance: 0.25
  hole_to_hole: 0.5
  copper_edge_clearance: 0.3
  via_min_size: 0.25
  min_through_drill: 0.15
  solder_mask_min_width: 0.0
  solder_mask_expansion: 0.0

zones:
  # L2 IS ONE UNBROKEN GROUND PLANE AND THAT IS THE SINGLE MOST IMPORTANT RULE
  # ON THIS BOARD (ARCHITECTURE sec.8): no split, no routing channel and no
  # keepout under any RF trace, under the splitter, under either attenuator, or
  # under the USB differential pair. The USB requirement and the RF requirement
  # are the SAME requirement here, not competing ones.
  - {net: GND, layers: [In1.Cu], priority: 0, min_thickness: 0.3, clearance: 0.3, connect: solid}
  - {net: GND, layers: [In2.Cu], priority: 0, min_thickness: 0.3, clearance: 0.3, connect: solid}
  - {net: GND, layers: [F.Cu, B.Cu], priority: 0, min_thickness: 0.3, clearance: 0.3, connect: thermal}

silk:
  min_text_height: 0.6
  refdes: {size: 0.6, min_size: 0.45, fab_copy: true, clearance: 0.16, priority_prefixes: "UJQ"}
  # captions: OWED — stage 5. Three are already REQUIRED rather than optional:
  #   * every SMA port's function (ANT1 / ANT2 / RX1 / RX2 / TX). Five identical
  #     jacks on our own pitch means NOTHING PHYSICAL distinguishes them, and
  #     plugging a cable into the wrong one is silent.
  #   * the header's 5.0 V CEILING and its pin order (GND / CTRL / STATE / GND).
  #     A user cannot infer a ceiling from a bare 4-pin header (ADR-0008).
  #   * which LED is PWR and which is LOOPBACK — they are the same red device.

# asserts: OWED — stage 5 (pad_net polarity asserts). Note the NETLIST half of
# this board's polarity intent is already machine-checked and GREEN:
# rules/electrical_invariants.yaml, 40/40 at the schematic gate 2026-07-28.
