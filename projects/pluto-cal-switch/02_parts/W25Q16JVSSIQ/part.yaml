mpn: W25Q16JVSSIQ
manufacturer: Winbond
type: flash_qspi_16mbit
datasheet:
  doc_id: W25Q16JV
  revision: "H"               # printed "Publication Release Date: April 08,
                              # 2019 / Revision H" in the page footer
  url: https://www.winbond.com/resource-files/w25q16jv%20spi%20revh%2004082019%20plus.pdf
  sha256: 81af3f69b0bff95fd1097949a1005431dc5b3a6ecb5f1947e695a17298e7cf1b
  fetched: 2026-07-28
  pages: 75
package: SOIC-8 208mil        # ordering decode sec.12, printed p.71: the "SS"
                              # field of W25Q16JV-SS-IQ = "8-pin SOIC 208-mil"
footprint: Package_SO:SOIC-8_5.3x5.3mm_P1.27mm
escape:
  style: leaded
  pitch: 1.27
  escapes_worst_side: 4
  tier_required: jlc_2layer_default
  checked: escape_check 2026-07-27
pins:                         # Figure 1a "Pin Assignments, 8-pin SOIC150-mil/
  1: CSN                      # 208-mil (Package Code SN, SS)", Rev H printed
  2: {name: SD1, note: "DO (IO1)"}     # p.5, cross-checked against the section
  3: {name: SD2, note: "/WP (IO2)"}    # 3.3 "Pin Description" table on the SAME
  4: {name: GND, tie: GND}             # page. Datasheet names on the right;
  5: {name: SD0, note: "DI (IO0)"}     # the `name:` is the RP2040-side QSPI
  6: SCLK                              # role, because that is what the netlist
  7: {name: SD3, note: "/HOLD or /RESET (IO3)"}   # and nets.yaml key on.
  8: {name: VCC, tie: 3V3}
limits:
  vcc: "2.7 to 3.6 V"                  # sec.1 General Descriptions, printed p.4
  density: "16 Mbit / 2 MByte"
  clock_max: "133 MHz"                 # sec.1
  interface: "standard SPI / Dual SPI / Quad SPI (IO0..IO3)"
gotchas:
  - "FOOTPRINT ADOPTED FROM THE KiCad STOCK LIBRARY UNDER A DIFFERENT NAME,
     AND HERE IS THE COMPARISON (2026-07-28). Winbond Rev H sec.11.3 '8-Pin
     SOIC 208-mil (Package Code SS)': e 1.27 BSC, H (lead span)
     7.70/7.90/8.10, b 0.35/0.42/0.48, L 0.50/0.65/0.80, D1 = E1
     5.13/5.23/5.33 (body), D = E 5.18/5.28/5.38 (with flash). KiCad
     Package_SO:SOIC-8_5.3x5.3mm_P1.27mm -- whose own descr reads 'JEITA/EIAJ
     ED-7311-19 variation 08-001-BBA and Atmel/Microchip, 208 mils width' --
     lands 1.625 x 0.65 at x +/-3.5875, y +/-1.905/+/-0.635: pitch 1.27 EXACT,
     pad span 2.775..4.400 against a nominal lead foot of 3.30..3.95 (heel
     +0.525, toe +0.450), side fillet +0.115 on b nominal. THE NAME DIFFERS
     FROM THE part.yaml's ORIGINAL 'SOIC-8_5.23x5.23mm_P1.27mm' ONLY IN WHICH
     BODY NUMBER IT QUOTES (KiCad rounds the with-flash D/E 5.28 to 5.3;
     Winbond's 5.23 is D1/E1); the land is driven by H and e, which are
     identical."
  - "PIN-MAP DEVIATION CLOSED 2026-07-28. This entry was `pins: {}` /
     `verified: OWED` at the end of stage 3. The Winbond PDF was fetched
     (sha256 81af3f...), Figure 1a read, and the PDF vendored here."
  - "QE MUST BE SET FOR QUAD MODE, and that is a FIRMWARE fact with a HARDWARE
     consequence. Pins 3 and 7 are /WP and /HOLD in standard SPI and only
     become IO2/IO3 once the Quad Enable bit is set (sec.3.3 notes 1-2, p.5).
     They are therefore driven ACTIVE by the flash in quad mode: they must NOT
     be tied high with a hard pull-up. The RP2040 bootrom drives them as bus
     lines, and the board leaves them as plain point-to-point nets."
  - "THE FLASH IS THE FRAGILE SUPPLY LINK ON THIS BOARD, NOT THE MCU. Four of
     six 16-Mbit QSPI SKUs read OUT OF STOCK at LCSC on 2026-07-27: P25Q16H-SSH-IR
     (C559216), P25Q16H-SSH-IT (C194871), P25Q16H-UXH-IR (C559220) and
     W25Q16JVSNIQ (C115407). C82317 has 8,927 pieces and costs $0.76 @100 —
     MORE THAN THE RP2040 ITSELF."
  - "THE IN-STOCK FALLBACK IS A DIFFERENT FOOTPRINT. W25Q16JVUXIQ (C2843335,
     21,960 in stock, $1.33 @100) is USON-8, so a C82317 stockout is a RE-SPIN,
     not a re-BOM. Re-check C82317 stock at order time; consider carrying the
     USON alternate as a documented non-drop-in in the ORDER_README."
  - "QSPI ROUTING IS AN RF PROBLEM ON THIS BOARD. The RP2040 executes in place,
     so this bus runs continuously at tens of MHz with sub-ns edges inside the
     70 MHz-6 GHz band the board exists to measure. The vendor guide's rule
     ('wired directly to the flash, using short connections to maintain signal
     integrity and to also reduce crosstalk in surrounding circuits',
     hardware-design-with-rp2040 sec 2.2 p.9) is a spur rule here, not just an
     SI rule. Flash hugs the MCU, both far from every SMA/SMP."
  - "The 1 kohm QSPI_SS-to-USB_BOOT resistor and the DNF 10 kohm QSPI_SS pull-up
     must both be 'placed close to the flash chip' (same section)."
verified: "pin map read from Figure 1a 'Pin Assignments, 8-pin SOIC150-mil/
  208-mil (Package Code SN, SS)', W25Q16JV Rev H (April 08, 2019) printed p.5,
  and cross-checked line by line against the section 3.3 'Pin Description'
  table printed on the SAME page (1 /CS, 2 DO(IO1), 3 /WP(IO2), 4 GND,
  5 DI(IO0), 6 CLK, 7 /HOLD or /RESET (IO3), 8 VCC). Package code confirmed
  from the sec.12 ordering decode, printed p.71: SS = 8-pin SOIC 208-mil.
  NOTE the WLCSP ball map (sec.3.4/3.5) is a DIFFERENT numbering and is not
  the one used here. 2026-07-28"
layout:
  source: "Winbond publishes no PCB layout section for this part. The governing
    layout rules come from the SYSTEM vendor instead: Raspberry Pi
    `hardware-design-with-rp2040` sec.2.2 p.9. Labelled as such — this is a
    derived-from-the-host rule set, not a Winbond instruction."
  reviewed: "2026-07-28"
  keep_short:
    - {net: QSPI_SCLK, max_span_mm: 12, why: "vendor sec.2.2 p.9: the flash is
       'wired directly to the flash, using short connections to maintain signal
       integrity and to also reduce crosstalk in surrounding circuits'. On THIS
       board the crosstalk half is the binding half — the XIP bus is the only
       continuous in-band spur source against a 70 MHz-6 GHz measurement"}
    - {net: QSPI_CSN, max_span_mm: 12, why: "same bus"}
    - {net: QSPI_SD0, max_span_mm: 12, why: "same bus"}
    - {net: QSPI_SD1, max_span_mm: 12, why: "same bus"}
    - {net: QSPI_SD2, max_span_mm: 12, why: "same bus"}
    - {net: QSPI_SD3, max_span_mm: 12, why: "same bus"}
  notes:
    - "FLASH HUGS THE MCU, AND BOTH SIT AT THE FAR END FROM EVERY SMA
       (ARCHITECTURE sec.10.5). This is an EMI placement rule on this board,
       not only an SI one."
    - "The 1 kohm QSPI_CSN-to-BOOTSEL resistor and the DNF 10 kohm QSPI_CSN
       pull-up are both 'placed close to the flash chip' (same vendor section)."
    - "100 nF decoupler at pin 8, at the pad."
sourcing:
  lcsc: C82317
  alternates: [C2843335]      # W25Q16JVUXIQ, USON-8 — NOT a drop-in footprint
