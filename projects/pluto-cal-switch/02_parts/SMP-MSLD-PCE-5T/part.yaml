layout:
  source: "Drawing SMP-MSLD-PCE-5X Rev A sheet 2, 'RECOMMENDED PCB LAYOUT':
    edge notch 7.65 mm overall x 6.4 mm deep with a 4.12 mm mouth; centre signal
    trace 0.83 mm wide; two side ground pads 1.84 mm; surfaces coplanar within
    0.13 mm. The 0.83 mm centre trace is WIDER than this stackup's 0.35 mm
    50 ohm line, so a short deliberate taper is required at each launch."
  reviewed: "2026-07-27"
  keep_short:
    - {net: RX_PLUTO1, max_span_mm: 8, why: "switch RFin hugs its SMP; every mm
       here is 0.036 dB at 6 GHz and sits inside the length-matched pair"}
    - {net: RX_PLUTO2, max_span_mm: 8, why: "the mirror of the above"}
    - {net: TX_PLUTO, max_span_mm: 14, why: "TX SMP to PAD_A1; longer because TX
       is at one END of the three SMP ports, not on the mirror axis"}
  notes:
    - "Taper 0.83 mm -> 0.35 mm at each launch. Under ~1.4 mm long is under
       lambda_g/20 at 6 GHz, so electrically invisible — but it must be DRAWN,
       not left as a router artifact."
    - "Ground-via fence at <=2.0 mm pitch alongside the notch and down both sides
       of the trace for the first ~10 mm."
    - "The three notches are placed at the MEASURED PlutoPlus pitches
       (11.60 / 11.98 mm scaled to the 34.88 mm midpoint span, ADR-0014), NOT at
       a uniform pitch."
layout_refs:
  - "Amphenol drawing SMP-MSLD-PCE-5X Rev A (24-Oct-18) sheet 2, RECOMMENDED PCB
     LAYOUT + note 3 (durability/forces). SHEET 1 OF 3 NOT OBTAINED"
  - "Cinch SMP/SMPM catalog ca-ccs-john-smp-smpm-catalog.pdf pp.3-4, 7 —
     interface design per MIL-STD-348A, the three detent classes and their
     forces/cycles, and the male-interface bore/groove table that proves the
     detent is an internal undercut"
  - "MIL-STD-348A SMP interface (the governing standard for the mated pair's
     0.254 mm axial and ~+/-0.25-0.3 mm radial allowances)"
