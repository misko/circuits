gotchas:
  - "THE GENDER WORDS ARE A TRAP AND THE CONTACT IS THE ONLY DISCRIMINATOR.
     Amphenol and Cinch use OPPOSITE plug/jack words for the same physical SMP
     half. This part is the SHROUD: detent bore + MALE PIN. The adapter's SMP end
     must be the insertable barrel with a FEMALE SOCKET. Two parts both labelled
     'SMP Jack' by a distributor do in fact mate. Proof the detent is a bore and
     not a bead: Cinch SMP/SMPM catalog p.7 'SMP Male Connector Interface' gives
     bore G = 2.90-3.10 mm and groove H = 3.15-3.20 mm — a groove LARGER in
     diameter than the bore is an internal undercut."
  - "THE PART NAMED IN THIS PROJECT'S MATING HANDOFF IS THE WRONG GENDER.
     Amphenol AD-SMAJSMPP-2 is SMA JACK -> SMP PLUG: its Pluto-facing end is an
     SMA JACK, the same gender as the Pluto's own connectors, so IT CANNOT SCREW
     ONTO THE PLUTO. Its mirror AD-SMAPSMPJ-2 has the right SMA end but its SMP
     end is a male-pin limited-detent jack — identical gender to THIS part; two
     shrouds need a bullet between them. Cinch 134-1019-441 fails the same way.
     The correct adapter is Cinch 134-1019-451 (SMA Plug, Male Pin -> SMP Jack,
     Female Socket). See ADR-0006."
  - "LIMITED DETENT is both the right class and the only stocked one. Full detent
     (SMP-MSFD-*) reads 0 across all 5 SKUs and smooth bore reads 2. LD gives
     500 cycles vs full detent's 100 and 27 N total retention vs smooth bore's
     6.7 N; Cinch's own guidance (catalog p.3) names LD as the PCB-mount /
     blind-mate class."
  - "ENGAGEMENT FORCE IS A USABILITY COST: up to 3 x 45 N = 135 N to push the
     board on. EDGE-LAUNCH takes that IN THE BOARD PLANE as shear rather than as
     PEEL on SMT pads, which is the main reason it beat the vertical part. No
     vendor guidance exists on the maximum permissible in-plane force for this
     footprint."
  - "A DETENTED MATE LOCATES AXIALLY, so three in parallel are axially
     OVER-CONSTRAINED. All three adapters must be the SAME MPN. MIL-STD-348
     permits 0.254 mm of mated axial misalignment."
  - "EDGE-LAUNCH PUTS THE RF REFERENCE PLANE ON THE ROUTED BOARD OUTLINE. The
     three notches are cut by the SAME tool path, so the arm-to-arm term is the
     router's WITHIN-BOARD repeatability rather than JLC's +/-0.2 mm
     board-to-board figure — but that is an argument, not a measurement, and the
     published D4 delta (ADR-0011) is measured on the real board and includes it
     either way."
  - "IN-LIBRARY AND PURCHASABLE IS NOT PLACEABLE. It straddles a routed outline
     notch, needs copper to the routed edge, and its own drawing demands
     coplanarity within 0.13 mm. SUBMIT THE REAL GERBERS + CPL TO JLC DFM REVIEW
     BEFORE COMMITTING. Fallback: SMP-MSLD-PCS20T (C3175159, vertical, 546 in
     stock, conventional SMT footprint) — pre-designed, and the swap must be a
     recorded assembly.yaml decision with the catalog query and its date, not a
     discovery at fab time."
  - "THREE NOTCHES AT 11.60 / 11.98 mm PITCH leave only ~3.95 mm of board web
     between adjacent ones (notch is 7.65 mm wide). A floorplan constraint and a
     mechanical one."
  - "Every SMP RF connector in the JLC library is EXTENDED; there is no Basic
     SMP part."
