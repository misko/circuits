  doc_id: SMP-MSLD-PCE-5X
  revision: "RevA"            # drawing SMP-MSLD-PCE-5X Rev A, 24-Oct-18
  url: https://www.lcsc.com/product-detail/C6297051.html
  sha256: "PENDING — amphenolrf.com returns HTTP 403 to automated fetch and the
    LCSC PDF is missing sheet 1 of 3. See 02_parts/README.md deviations register."
  fetched: 2026-07-27
package: SMP straight jack, limited detent, EDGE MOUNT
