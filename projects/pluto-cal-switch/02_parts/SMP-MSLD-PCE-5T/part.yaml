  lcsc: C6297051
  alternates: [C3175159, C5900820]   # PCS20T vertical fallback; PCS17T
asserts:
  - assert: value
    equals: SMP-MSLD-PCE-5T
    why: "the SMP family differs by DETENT CLASS (full / limited / smooth bore),
      which changes engagement force by 7x and mating cycles by 10x while looking
      identical on a render and fitting the same land. Full-detent SKUs also read
      stock 0. The BOM Comment must name the exact model."
