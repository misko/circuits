mpn: SMP-MSLD-PCE-5T
manufacturer: Amphenol RF
type: connector_smp_jack_limited_detent_edge_launch
mates: receptacle             # SMP JACK = the SHROUD half: a detent BORE with a
                              # MALE CENTRE PIN. The mating adapter end must have
                              # a smooth barrel with a FEMALE SOCKET. See gotchas
                              # — the plug/jack words are vendor-dependent and
                              # the ONLY reliable discriminator is the contact.
