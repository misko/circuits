gotchas:
  - "PIN-MAP DEVIATION CLOSED 2026-07-28. This entry was `pins: {}` / `verified:
     OWED` because the cached file was an HTML error page saved with a .pdf
     extension. A VALID ST PDF (Doc ID 11265 Rev 5, sha256 8ba7ab...) was
     located, its Figure 1 read, and the PDF vendored here. st.com refused an
     automated re-fetch (HTTP/2 INTERNAL_ERROR, and its CCC mirror times out);
     the copy used is the byte-identical one already vendored in this repo at
     projects/usb-hub-3s-v3/02_parts/USBLC6-2SC6/, whose sha256 matches the one
     recorded above. Provenance stated rather than implied."
  - "PINS 1/6 AND 3/4 ARE PAIRS OF THE SAME NODE, and this is the one thing a
     schematic can get wrong here in a way no gate sees. Binding pin 6 to a
     DIFFERENT net from pin 1 (e.g. `USB_DP_CON` -> `USB_DP`) would draw a
     part that does not exist and would make the ESD clamp look like a series
     element. The through-routing demand of section 2.3 is satisfied in COPPER,
     by where the pads sit, not by splitting the net."
  - "ITS LAYOUT SECTION IS THE STRONGEST DEMAND OF ANY PART ON THE USB SIDE and
     must be honoured once the pin map is verified. ST sec 2.3 'How to ensure
     good ESD protection', verbatim: 'While the USBLC6-2 provides high immunity
     to ESD surge, efficient protection depends on the layout of the board. In
     the same way, with the rail to rail topology, the track from data lines to
     I/O pins, from VCC to VBUS pin and from GND plane to GND pin must be as
     short as possible to avoid overvoltages due to parasitic phenomena.'
     Its Figure 6 gives the physics — VCL+ = VTRANSIL + VF + L_IO*di/dt +
     L_GND*di/dt — i.e. PARASITIC TRACE INDUCTANCE ADDS TO THE CLAMP VOLTAGE at
     1 ns rise times. Concretely: the part sits IMMEDIATELY at the micro-USB,
     upstream of everything else on D+/D-; the pair routes THROUGH it with ZERO
     stubs (a stub is series inductance in the clamp path); GND gets its OWN via
     directly at the pad into L2, never a trace to a via elsewhere; VBUS short
     and direct."
  - "IT IS AN ESD DIODE, NOT A POWER TVS. It clamps hot-plug transients and will
     NOT survive 12 V fed into the micro-B. That exposure is taken KNOWINGLY
     (ADR-0009) — surviving it needs an SMBJ5.0A-class TVS *and* the PPTC to
     crowbar, because a 5 V TVS clamps around 10.3 V, above a 5 V load's ceiling,
     so the clamp alone does not disconnect."
verified: "pin map read from Figure 1 'Functional diagram (top view)', printed
  p.1 of 14, USBLC6-2 Doc ID 11265 Rev 5 (October 2011) — the figure prints the
  six pin numbers with their labels in two columns (1 I/O1 / 2 GND / 3 I/O2 on
  the left, 6 I/O1 / 5 VBUS / 4 I/O2 on the right). Cross-checked against
  Figure 7 'ESD behavior: layout optimization' p.5, which draws the same
  numbering with the data line entering pin 1 and leaving pin 6. Electrical
  limits from Table 1 (Absolute ratings) and Table 2 (Electrical
  characteristics), p.1-2. 2026-07-28"
layout:
  source: "ST section 2.3 'How to ensure good ESD protection' (p.5) + Figure 6
    (p.4) + Figure 7 (p.5). This is a real layout section with PHYSICS in it,
    not boilerplate: section 2.2 works a numeric example in which 10 mm x 0.5 mm
    tracks (~6 nH each) raise the clamp voltage from +31.2 V to +319.2 V at a
    1 ns edge. The rules below are the vendor's own, quoted."
  reviewed: "2026-07-28"
  keep_short:
    - {net: USB_DP, max_span_mm: 6, why: "section 2.3 verbatim: 'the track from
       data lines to I/O pins ... must be as short as possible to avoid
       overvoltages due to parasitic phenomena'. Section 2.2 quantifies it:
       L_IO*dI/dt at 24 A/ns is 144 V per 6 nH"}
    - {net: USB_DM, max_span_mm: 6, why: "same, the other line"}
    - {net: VBUS, max_span_mm: 6, why: "section 2.3: 'from VCC to VBUS pin ...
       as short as possible'"}
  notes:
    - "PLACE IT AT THE CONNECTOR. Section 2.3 note, verbatim: 'A good precaution
       to take is to put the protection device as close as possible to the
       disturbance source (generally the connector).' It sits UPSTREAM of
       everything else on D+/D-, including the 27 ohm series terminators."
    - "THE PAIR ROUTES THROUGH THE PART WITH ZERO STUBS — Figure 7 contrasts an
       'Unsuitable layout' (stubbed) with the correct one (in-line). A stub is
       series inductance IN the clamp path, and section 2.2's arithmetic is what
       it costs."
    - "GND (pin 2) gets its OWN via AT the pad into the L2 plane — never a trace
       to a via elsewhere. L_GND*dI/dt is the second of the two 144 V terms."
sourcing:
