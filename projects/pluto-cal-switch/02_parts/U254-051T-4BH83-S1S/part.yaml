  doc_id: U254-05XX-4BH83-XXS
  revision: "RevA0"           # printed "REVISION A0, SHEET 1/1" in the title block
  url: https://datasheet.lcsc.com/datasheet/pdf/e0d66bd620348eb3993f422158b3cb5b.pdf
