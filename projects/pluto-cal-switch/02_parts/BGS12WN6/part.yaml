asserts:
  - assert: value
    equals: BGS12WN6
    why: "the BOM Comment must name the PART, not the function. BGS12P2L6 shares
      this land pattern and is a legitimate alternate, but the two differ in
      guaranteed band coverage (P2L6 has no row at 70 MHz or at 6.000 GHz) and in
      VDD operating maximum (3.4 V vs 3.6 V, against a 3.366 V worst-case rail).
      A silent substitution changes what the board is guaranteed to do."
