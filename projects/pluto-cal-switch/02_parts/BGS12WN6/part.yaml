layout:
  source: "Section 4 'Application information' (PDF p11) contains NO transmission-
    line geometry, NO ground-via guidance, NO keepout and NO application
    schematic — reported honestly rather than invented. What the document DOES
    mandate is Figure 5 'Footprint recommendation' (PDF p13 / printed p11):
    NSMD land pattern, six 0.25 x 0.25 mm copper lands on 0.40 mm pitch in BOTH
    axes (0.15 mm land-to-land gap), a SINGLE solder-mask opening spanning all
    six lands, stencil apertures 0.25 mm on the same grid at 100 um stencil
    thickness. The mask rule is also a FAB rule, not a preference: a 0.15 mm gap
    is below JLCPCB's 0.2 mm minimum solder-mask dam, so per-pad openings are
    unmanufacturable. Everything below the keep_short list is DERIVED from the
    pin map, and is labelled as such."
  reviewed: "2026-07-27"
  keep_short:
    # SPLIT INTO PER-INSTANCE NETS 2026-07-29. `RF_CTRL_SW` was one entry naming a
    # net that does not exist: this part is placed TWICE and the board names the
    # control nets RF_CTRL_SW1 / RF_CTRL_SW2. policy_audit P-ADJ-UNREACHED caught
    # it — "0 pad(s) on this board" — which means the tightest RF constraint on
    # the part was being graded by NOTHING while looking like a declared rule.
    # (audit_board's A-PROX resolved it by unique prefix and did measure it, at
    # 2.48 mm; two checkers, and only one of them was fooled. That is the point
    # of having two.)
    - {net: RF_CTRL_SW1, max_span_mm: 4, why: "series 1k + 1nF shunt must sit AT
       the CTRL pin. A control trace entering the RF section is a resonator —
       25 mm of this stackup's microstrip is lambda/4 at ~1.5 GHz, mid-band"}
    - {net: RF_CTRL_SW2, max_span_mm: 4, why: "the mirror of the above, on the
       arm-2 switch"}
    - {net: "3V3_SW", max_span_mm: 4, why: "100 nF + 1 nF at the VDD pad. Table 6
       footnote 2 records that Infineon's own measurement board carried 1 nF from
       VDD to GND and 1 nF from VCTRL to GND — that is the configuration the
       published harmonic/IMD numbers were taken in"}
  notes:
    - "DERIVED (my reading, not the datasheet's words): RF1 (pin 3) and RF2
       (pin 1) sit on one column with GND (pin 2) BETWEEN them, so the two throws
       come with a ground land already separating them. RFIN (pin 5) is on the
       OPPOSITE column, flanked by VDD (pin 4) and CTRL (pin 6) — the RF common
       is boxed in by two DC pins, so turn VDD and CTRL away from the RFIN launch
       immediately and bypass them at the pad."
    - "PIN-2 GROUND VIA ESCAPES OUTWARD, and it is the reason for the fab tier.
       A jlc_4layer_standard 0.45 mm via centred on the 0.25 mm land leaves only
       0.050 mm to the pin-1 and pin-3 lands, under the 0.127 mm floor. Offsetting
       it onto a stub adds ~0.2-0.3 nH = 7-11 ohm of common ground-return
       impedance at 6 GHz, attacking the spec that is ALREADY tightest (21 dB min
       isolation). At jlc_4layer_advanced a 0.25 mm via fits at the land with
       0.150 mm clearance. See ADR-0010."
    - "The 50 ohm microstrip on this stackup is 0.35 mm wide against a 0.25 mm
       land, so RFIN/RF1/RF2 each need a short deliberate taper into the pad.
       Under 0.3 mm long = under lambda/20 at 6 GHz, so electrically invisible —
       but it must be DRAWN, not left as a router artifact."
    - "No exposed pad and IDD is 63 uA typ, so thermal is a non-issue."
