gotchas:
  - "TRUTH TABLE (Table 12, PDF p11 / printed p9): CTRL=0 -> RFIN-RF1, CTRL=1 ->
     RFIN-RF2. Board wiring MUST be RF1=RX_ANTn, RF2=loopback arm — that is what
     makes the brief's ON=loopback polarity fall out with ZERO logic (ADR-0001).
     Swapping RF1/RF2 inverts the SAFE STATE, not just the feature."
  - "CTRL FLOATS. I_Ctrl is 2 nA typ, so an undriven CTRL has NO defined state.
     A 10k external pull-down at the pin is MANDATORY (ADR-0001) — without it the
     RF path is undefined during supply ramp, MCU reset, and on an unprogrammed
     board."
  - "CTRL has NO absolute-maximum row anywhere in the datasheet — only an
     OPERATING max of VDD (Table 2). Nothing is clamped; beyond VDD is simply
     undefined with no damage threshold to reason about. The GPIO header must
     NEVER reach CTRL directly (ADR-0008)."
  - "ALL RF PORTS ARE DC-CONNECTED THROUGH THE DIE. Table 1 footnote 1, verbatim:
     'There is also a DC connection between switched paths. The DC voltage at RF
     ports V_RFDC has to be 0 V.' Combined with the resistive splitter this makes
     every RF port on BOTH switches one galvanic node — a single DC fault
     violates the rating everywhere at once. Satisfied here by derivation: the
     YAT pads DC-reference the node to ground (~70 ohm/port). See ADR-0005."
  - "REFLECTIVE: 'The isolated port is a reflective short' (Description, PDF p1).
     The deselected throw is a SHORT, not 50 ohm. Consequence worked in ADR-0004:
     without arm pads the splitter sees Zin = infinity in antenna mode."
  - "IL AND RL ARE PROBER-STATION NUMBERS. Table 4 footnote 1: 'Measured on
     prober station to exclude board effects, without any matching components.'
     They are NOT a board-level budget. Isolation (Table 5) IS application-board
     and is comparable. No board-level IL/RL exists for this part anywhere."
  - "ISOLATION CHARACTERIZATION HOLES inside our band: 960-1200, 2690-3300,
     4200-4400 and 5000-5150 MHz have NO published row."
  - ">25 dB isolation is NOT met on the guaranteed MINIMUM above ~5 GHz
     (21 dB min / 28 typ at 5150-5925). No cheap stocked SPDT meets it."
  - "NO APPLICATION SCHEMATIC EXISTS. Section 4 'Application information'
     (PDF p11) contains ONLY the pin figure, pin table and truth table — no
     reference circuit, no decoupling value, no DC-block value."
  - "ROTATION AUTHORITY IS FIGURE 2, not the package outline and not the pin-1
     glyph. The BGS12WN6 and BGS12P2L6 outline drawings are drawn 180 deg apart
     on the page, and their pin-1 glyphs DIFFER (WN6 = lasered X for
     PG-TSNP-6-10 / triangle for PG-TSNP-6-2; P2L6 = filled triangle). Figure 2
     is byte-identical in both datasheets. A CPL rotation error on a 0.4 mm-pitch
     leadless part is invisible until the board is dead, and this fleet has
     already shipped a board killed that way (interposer v1.0)."
  - "0.4 mm pitch, leadless, terminals entirely under the body: NO hand rework,
     NO visual solder inspection, X-ray only. PCBA-only part."
  - "LCSC serves the STALE Rev 2.2 (2020) PDF, which says 0.05-6 GHz and names
     the package TSLP-6-4. Both are wrong for the current part. Use the Infineon
     URL above; Infineon returns HTTP 202 without a browser User-Agent."
