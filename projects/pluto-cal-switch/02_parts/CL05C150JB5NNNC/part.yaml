layout:
  source: "No manufacturer layout section. The governing rule is the system
    vendor's: Raspberry Pi `hardware-design-with-rp2040` sec.2.3 p.10 — keep the
    oscillator loop short, with a local ground return."
  reviewed: "2026-07-28"
  keep_short:
    - {net: XIN, max_span_mm: 8, why: "the load cap is part of the oscillator
       loop; stray C adds to the 3 pF the 15 pF value was derived against"}
    - {net: XOUT_R, max_span_mm: 8, why: "same, the damped side"}
  notes:
    - "Both cap returns join the ground plane AT the crystal, not elsewhere on
       the board — a split return turns the two load caps into a loop antenna
       right next to the board's most sensitive high-impedance node."
