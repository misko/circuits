gotchas:
  - "FOOTPRINT ADOPTED FROM THE KiCad STOCK LIBRARY, WITH THE COMPARISON
     DECLARED PARTIAL (2026-07-28). No manufacturer PDF is vendored for this
     series-sheet passive, so NO vendor land drawing was compared -- the
     adoption rests on the 1005-metric chip envelope (1.00 x 0.50 mm, 0.25 mm
     termination band) and KiCad's IPC-7351 NOMINAL land, which the 32 other
     stock 0402/0805 passives on this board already use. NOTE THE DELIBERATE
     SPLIT: parts that sit in the 50 ohm RF path do NOT use this land -- they
     use the project's own pluto_cal_switch:{R,C}_0402_1005Metric_RF (IPC
     LEAST, -32% pad area, -0.0206 pF of shunt C per pad on the 0.2104 mm
     prepreg). This part is not in that path."
  - "TWO PER BOARD — the 12 MHz crystal's load capacitors (C_XIN / C_XOUT).
     THE VALUE IS DERIVED FROM THE CRYSTAL, NOT COPIED FROM THE PICO:
     CL = (C1.C2)/(C1+C2) + Cstray with the ABM8-272-T3's CL = 10 pF and
     Cstray ~ 3 pF gives C1 = C2 = 2 x (10 - 3) = 14 pF -> E24 15 pF. It
     coincides with Raspberry Pi's reference value because the reference
     crystal has the same 10 pF load — NOT because the value is universal.
     ADR-0012 records the arithmetic for the JLC Basic 20 pF crystal C9002,
     where the same formula gives 34 pF -> 33 pF: fitting 15 pF against a
     20 pF crystal pulls the frequency high and can stop it starting, and a
     crystal that does not start means USB never enumerates."
  - "C0G IS MANDATORY AND IS ALSO AUTOMATIC AT THIS VALUE — no X7R part exists
     at 15 pF. Pinning the code anyway costs nothing and removes catalog drift."
  - "JLC EXTENDED, stockCount 98 309 (read 2026-07-28)."
  - "WHY THIS MPN AND NOT THE CHEAPER/BASIC ONE — AND IT IS A GATE REASON, NOT
     AN ENGINEERING ONE, WHICH IS WORTH SAYING OUT LOUD. The FH `0402CG###J500NT`
     C0G series is electrically equivalent and one of its members is JLC BASIC.
     It is the ALTERNATE and not the primary because `bom_source_check`'s
     `mpn_capacitance` decoder CANNOT PARSE IT: the decoder anchors on a 3-digit
     code immediately followed by a tolerance letter and then a NON-digit
     (regex `(\\d{2})([0-8])[JKMDFGZ](?![0-9])`), and in `...CG102J500NT` the
     `J` is followed by the voltage digits `500`, so the lookahead rejects it and
     leg C reports UNVERIFIABLE-VALUE. The vetted ledger already works around
     this three times (C1546/C1547/C1549 all carry an explicit `value:`), which
     is the evidence that it is a decoder gap and not this part. The Samsung
     `CL05C###JB5NNNC` form decodes cleanly, so choosing it makes the value
     MACHINE-VERIFIABLE from the part dossier alone. A PROPOSED patch to the
     decoder is reported with this board's stage-4 findings; if it lands, the FH
     part becomes a legitimate primary again."
