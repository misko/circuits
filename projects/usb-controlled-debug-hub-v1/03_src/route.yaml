        vias: [[115.7500, 84.9000]]
      - net: DATA_OK2
        pin: U_AND_DATA.6
        segments:
          - {layer: F.Cu, width: 0.18, pts: [[117.1375, 87.3000], [116.2000, 87.3000], [115.7500, 87.7500]]}
        vias: [[115.7500, 87.7500]]
      # Command/control fanout changes layer only after leaving the named
      # package land.  The first complete command wave connected every net but
      # proposed eleven ordinary through-vias in SMD lands; these reviewed
      # dogbones make that manufacturing decision explicit and repeatable.
      - {net: PWR_EN4, pin: U_AND_DATA.12, segments: [{layer: F.Cu, width: 0.18, pts: [[122.8625, 85.3500], [120.0000, 85.3500]]}], vias: [[120.0000, 85.3500]]}
      - {net: PWR_EN3, pin: U_AND_PWR.8, segments: [{layer: F.Cu, width: 0.18, pts: [[106.8625, 87.9500], [106.8625, 88.4000]]}], vias: [[106.8625, 88.4000]]}
      - {net: PWR_CMD2, pin: U_AND_PWR.5, segments: [{layer: F.Cu, width: 0.18, pts: [[101.1375, 86.6500], [104.0000, 86.6500]]}], vias: [[104.0000, 86.6500]]}
      - {net: DATA_CMD1, pin: U_EXP.25, segments: [{layer: F.Cu, width: 0.18, pts: [[126.5000, 73.7250], [128.0000, 73.7250], [128.3000, 73.7250]]}], vias: [[128.3000, 73.7250]]}
      - {net: PWR_EN1, pin: U_AND_PWR.3, segments: [{layer: F.Cu, width: 0.18, pts: [[101.1375, 85.3500], [104.0000, 85.3500]]}], vias: [[104.0000, 85.3500]]}
      - {net: DATA_CMD4, pin: U_AND_DATA.13, segments: [{layer: F.Cu, width: 0.18, pts: [[122.8625, 84.7000], [120.0000, 84.7000]]}], vias: [[120.0000, 84.7000]]}
      - {net: DATA_OE4_N, pin: U_DATA4.10, segments: [{layer: B.Cu, width: 0.18, pts: [[128.1000, 45.5000], [129.4000, 45.5000], [129.7000, 45.5000]]}], vias: [[129.7000, 45.5000]]}
      - {net: DATA_OE4_N, pin: R_DATA_OE4.2, segments: [{layer: F.Cu, width: 0.18, pts: [[121.0100, 38.5000], [121.5000, 37.4000]]}], vias: [[121.5000, 37.4000]]}
      - {net: DATA_OE3_N, pin: Q_DATA3.3, segments: [{layer: F.Cu, width: 0.18, pts: [[101.0000, 42.0000], [101.0000, 40.8000]]}], vias: [[101.0000, 40.8000]]}
      - {net: DATA_CMD2, pin: U_AND_DATA.5, segments: [{layer: F.Cu, width: 0.18, pts: [[117.1375, 86.6500], [120.0000, 86.6500]]}], vias: [[120.0000, 86.6500]]}
  waves:
    exclude: [GND, "unconnected-*"]
    groups:
      usb_bottom:
        [P1_PORT_P, P1_PORT_N,
         P2_PORT_P, P2_PORT_N,
         P3_PORT_P, P3_PORT_N,
         P4_PORT_P, P4_PORT_N]
      usb_transition_ports:
        [P1_HUB_P, P1_HUB_N, P2_HUB_P, P2_HUB_N,
         P3_HUB_P, P3_HUB_N, P4_HUB_P, P4_HUB_N]
      usb_upstream: [UP_HUB_P, UP_HUB_N]
      usb_top: [MGMT_P, MGMT_N]
      power_input: [P5V_RAW, P5V_FUSED, P5V_PROTECTED]
      power_port: [VBUS1_SW, VBUS2_SW, VBUS3_SW, VBUS4_SW, VBUS_CTRL]
      power_3v3: [3V3_MAIN, SW_3V3, BST_3V3, CTRL_VUSB_3V3]
      # The former 71-net `control: rest` wave repeatedly ripped up the same
      # hub exits (177 queued operations in 70 s) and eventually attempted a
      # crystal via-in-pad.  Partition by physical ownership so failures stay
      # local, each checkpoint is reviewable, and the crystal is F.Cu-only.
      control_crystal: [XTAL1, XTAL2]
      control_agg_threshold: [AGG_UV, AGG_OV]
      control_local:
        [AGG_DVDT, AGG_ILIM, AGG_TIMER,
         ILIM1, ILIM2, ILIM3, ILIM4, ILIM_CTRL,
         HUB_VDD18]
      # Both hub analog bias routes cross the promoted USB field and therefore
      # belong to the strict-clearance analog wave, not the package-local
      # 0.15 mm control wave.
      control_hub_analog: [HUB_VDD18PLL, RBIAS]
      # Route straps by physical QFN edge.  A single 19-net wave caused 51
      # internal reroutes and still stranded 11 nets; edge ownership gives
      # each bank one breakout direction and keeps rip-up local.
      control_hub_straps_top_outer: [HUB_BOOST0, HUB_SWAP1, HUB_SWAP2]
      control_hub_straps_top_central:
        [HUB_DIS7_N, HUB_DIS7_P, HUB_DIS6_N, HUB_DIS6_P]
      control_hub_straps_top_dis6: [HUB_DIS6_N, HUB_DIS6_P]
      control_hub_straps_top_dis7: [HUB_DIS7_N, HUB_DIS7_P]
      control_hub_straps_top:
        # Exact left-to-right source and target order.  Routing in logical
        # register order created avoidable crossings and rip-up churn.
        [HUB_DIS7_P, HUB_DIS7_N, HUB_DIS6_P, HUB_DIS6_N,
         HUB_SWAP1, HUB_BOOST0, HUB_SWAP2]
      # SWAP3 owns the only P4-safe remote corridor. Give it a dedicated wave
      # before the remaining right-edge bank; KRT expands a multi-net group in
      # board/net order, so list order alone cannot make SWAP3 route first.
      control_hub_swap3: [HUB_SWAP3]
      # SWAP6's bottom-edge QFN launch is enclosed by SWAP3 and the two power
      # collectors if deferred. Give it the first post-USB field claim; its
      # source-owned F.Cu stub keeps the package exit deterministic.
      control_hub_swap6: [HUB_SWAP6]
      control_hub_straps_right:
        [HUB_CFG1, HUB_CFG0, HUB_BOOST1, HUB_GANG,
         HUB_NONREM0, HUB_NONREM1, HUB_SWAP4]
      control_hub_straps_bottom: [HUB_SWAP5]
      control_hub_straps_left: [HUB_CFG2, HUB_SWAP7]
      control_hub_ports:
        [HUB_OCS1_N, HUB_OCS2_N, HUB_OCS3_N, HUB_OCS4_N, HUB_OCS5_N,
         HUB_PRTPWR1, HUB_PRTPWR2, HUB_PRTPWR3, HUB_PRTPWR4, HUB_PRTPWR5]
      control_commands:
        [DATA_CMD1, DATA_CMD2, DATA_CMD3, DATA_CMD4,
         DATA_OE1_N, DATA_OE2_N, DATA_OE3_N, DATA_OE4_N,
         DATA_OK1, DATA_OK2, DATA_OK3, DATA_OK4,
         PWR_CMD1, PWR_CMD2, PWR_CMD3, PWR_CMD4,
         PWR_EN1, PWR_EN2, PWR_EN3, PWR_EN4]
      control_misc:
        [CTRL_RESET_N, EXP_RESET_N, HUB_RESET_N, I2C_SCL, I2C_SDA,
         HUB_VBUS_SENSE, USB_UP_VBUS]

route:
  import_source: build
  krt: ~/gits/KiCadRoutingTools
  kicad_python: /usr/bin/python3
  forbid_new_via_in_pad: true
  # The authenticated prefix retains the exact prepared base, all critical
  # USB copper, the revised P4 detour, and the independently reconciled ten-net
  # OCS/PRTPWR bank, plus the bounded pin-24/PLL 3V3 collector. It materializes
  # after usb_upstream so later waves can route around the already-owned USB
  # corridors. Earlier waves whose nets are already connected are authenticated
  # by P-ROUTEBASE and skipped. Placement or deterministic-copper edits
  # intentionally invalidate both hashes.
  prefix:
    board: 03_src/route/critical_prefix.kicad_pcb
    through_wave: usb_upstream
    r0_sha256: 897479ffbee4fee7ce2240216bda1ff8947564a6bf848c9c36ca3148ab33e6f1
    board_sha256: 4c001688273281e1eb487e237c7862615ff8b637708943456eb03ab54683257f
  # Authenticate each partial route against physical DRC. Opens, dangling
  # preparation copper and library-context notices remain deferred until
  # stitch; shorts, clearances, widths, holes, edges and USB uncoupled-length
  # findings can never be promoted to the next wave.
  wave_drc: true
  preflight_critical_pairs:
    - {name: UP_HUB, p: UP_HUB_P, n: UP_HUB_N, wave: usb_upstream, allowed_layers: [F.Cu, B.Cu], no_vias: false}
    - {name: MGMT, p: MGMT_P, n: MGMT_N, source: seed_stubs, group: usb_top, allowed_layers: [F.Cu], no_vias: true}
    - {name: P1_HUB, p: P1_HUB_P, n: P1_HUB_N, wave: usb_transition_ports, allowed_layers: [F.Cu, B.Cu], no_vias: false}
    - {name: P1_PORT, p: P1_PORT_P, n: P1_PORT_N, source: seed_stubs, group: usb_bottom, allowed_layers: [B.Cu], no_vias: true}
    - {name: P2_HUB, p: P2_HUB_P, n: P2_HUB_N, wave: usb_transition_ports, allowed_layers: [F.Cu, B.Cu], no_vias: false}
    - {name: P2_PORT, p: P2_PORT_P, n: P2_PORT_N, source: seed_stubs, group: usb_bottom, allowed_layers: [B.Cu], no_vias: true}
    - {name: P3_HUB, p: P3_HUB_P, n: P3_HUB_N, wave: usb_transition_ports, allowed_layers: [F.Cu, B.Cu], no_vias: false}
    - {name: P3_PORT, p: P3_PORT_P, n: P3_PORT_N, source: seed_stubs, group: usb_bottom, allowed_layers: [B.Cu], no_vias: true}
    - {name: P4_HUB, p: P4_HUB_P, n: P4_HUB_N, wave: usb_transition_ports, allowed_layers: [F.Cu, B.Cu], no_vias: false}
    - {name: P4_PORT, p: P4_PORT_P, n: P4_PORT_N, source: seed_stubs, group: usb_bottom, allowed_layers: [B.Cu], no_vias: true}
  common:
    layers: [F.Cu, B.Cu]
    via_size: 0.46
    via_drill: 0.20
    fab_tier: advanced
    fab_overrides: /home/mouse9911/gits/circuits/projects/usb-controlled-debug-hub-v1/03_src/fab_overrides.txt
    clearance: 0.15
    no_stub_layer_swap: true
    keepout: true
    keepout_layer: User.2
    grid_step: 0.05
    # Match the selected JLC advanced tier.  Staggered hub-breakout vias retain
    # about 0.41 mm realized hole gap, comfortably above this 0.25 mm floor.
    hole_to_hole_clearance: 0.25
  waves:
    # Route the oscillator before any high-speed or bulk copper.  Its two
    # short F.Cu-only nets have no legal layer transition and therefore own
    # their local escape corridor; later USB routing must route around them.
    - name: control_crystal
      group: control_crystal
      layers: [F.Cu]
      track_width: 0.19
      clearance: 0.15
      max_iterations: 250000
      max_probe_iterations: 50000
      max_ripup: 0
    - name: usb_transition_ports
      engine: diff
      group: usb_transition_ports
      track_width: 0.2332
      realized_width: {nominal: 0.2332, minimum: 0.09,
                       max_subnominal_length_per_net: 0.85,
                       max_subnominal_segments_per_net: 2}
      clearance: 0.30
      diff_pair_gap: 0.15
      layers: [F.Cu, B.Cu]
      keepout_layer: User.3
      length_match_group:
        - [P1_HUB_P, P1_HUB_N]
        - [P2_HUB_P, P2_HUB_N]
        - [P3_HUB_P, P3_HUB_N]
        - [P4_HUB_P, P4_HUB_N]
      length_match_tolerance: 0.50
      meander_amplitude: 0.30
      # A P/N length_match_group alone does not invoke KRT's conductor-level
      # matcher for a coupled route.  The independent R-LEN audit caught a
      # 1.4837 mm port-4 end-to-end spread without this flag (ceiling 1.0 mm).
      diff_pair_intra_match: true
      max_iterations: 1600000
      max_probe_iterations: 100000
      max_ripup: 70
    - name: usb_upstream
      engine: diff
      group: usb_upstream
      track_width: 0.2332
      realized_width: {nominal: 0.2332, minimum: 0.09,
                       max_subnominal_length_per_net: 0.85,
                       max_subnominal_segments_per_net: 2}
      # The deterministic J_UP dual-conductor F.Cu fanout owns the local tight
      # geometry. Carry a grid guard band over the 0.30 mm USB field floor;
      # the first oscillator-aware candidate measured one 0.2921 mm rail
      # approach when the search used the exact downstream boundary.
      clearance: 0.32
      diff_pair_gap: 0.15
      layers: [F.Cu, B.Cu]
      keepout_layer: User.3
      length_match_group: [[UP_HUB_P, UP_HUB_N]]
      length_match_tolerance: 0.50
      meander_amplitude: 0.30
      # Source-owned compensation above is graded by R-LEN.  A generic
      # one-conductor field meander meets total length but turns 30+ mm of an
      # otherwise coupled USB run into KiCad-measured uncoupled copper.
      diff_pair_intra_match: false
      max_iterations: 1600000
      max_probe_iterations: 100000
      max_ripup: 40
    - name: control_hub_swap6
      group: control_hub_swap6
      track_width: 0.18
      clearance: 0.15
      keepout_layer: User.4
      max_iterations: 900000
      max_probe_iterations: 100000
      max_ripup: 0
    - name: control_hub_swap3
      group: control_hub_swap3
      track_width: 0.18
      # The former User.6 envelope encoded the superseded pre-control P4
      # corridor and forced this otherwise local strap through the upstream
      # and P3 USB pairs.  Route against the ordinary User.2 component/edge
      # keepouts instead.  The 0.15 mm control search remains local on the
      # right side and exact wave DRC independently enforces 0.30 mm wherever
      # a USB-class item is actually approached.
      clearance: 0.15
      keepout_layer: User.2
      max_iterations: 900000
      max_probe_iterations: 100000
      max_ripup: 0
    # Connect the distributed 3.3 V islands after SWAP3 claims its only
    # P4-safe crossing, but before the remaining right/top banks claim the
    # hub-spine exits. The deterministic spine neck makes the local bypass
    # cell one component, so this wave has a single accessible hub target.
    - name: power_3v3
      group: power_3v3
      track_width: 0.4
      clearance: 0.32
      power_nets: [3V3_MAIN, SW_3V3, BST_3V3, CTRL_VUSB_3V3]
      power_nets_widths: [0.4, 0.4, 0.4, 0.4]
      neckdown_length: 0.5
      neckdown_taper_length: 0.3
      no_power_tap_neckdown: true
      max_iterations: 900000
    - name: control_hub_straps_right
      group: control_hub_straps_right
      track_width: 0.18
      clearance: 0.15
      keepout_layer: User.4
      ordering: original
      max_iterations: 700000
      max_probe_iterations: 75000
      max_ripup: 8
    - name: control_hub_straps_top
      group: control_hub_straps_top
      track_width: 0.18
      # The 0.5 mm-pitch source fanout owns a scoped 0.15 mm launch; physical
      # DRC remains authoritative where the field route approaches USB.
      clearance: 0.25
      layers: [F.Cu, B.Cu]
      layer_costs: [10.0, 1.0]
      ordering: original
      keepout_layer: User.4
      max_iterations: 1800000
      max_probe_iterations: 125000
      max_ripup: 70
    - name: power_port
      group: power_port
      track_width: 0.5
      # These branches cross the already-promoted USB field.  Route them at
      # the USB class clearance plus a small grid/diagonal guard band so the
      # stochastic geometry cannot land a few microns below the 0.30 mm DRC
      # boundary (the first replay measured 0.2918 mm at two vias).
      clearance: 0.32
      via_size: 0.70
      via_drill: 0.35
      power_nets: [VBUS1_SW, VBUS2_SW, VBUS3_SW, VBUS4_SW, VBUS_CTRL]
      power_nets_widths: [0.5, 0.5, 0.5, 0.5, 0.5]
      neckdown_length: 0.5
      neckdown_taper_length: 0.3
      no_power_tap_neckdown: true
      max_iterations: 900000
    - name: control_agg_threshold
      group: control_agg_threshold
      layers: [F.Cu]
      track_width: 0.18
      clearance: 0.15
      max_iterations: 500000
      max_probe_iterations: 50000
      max_ripup: 4
    - name: control_local
      group: control_local
      track_width: 0.18
      clearance: 0.15
      max_iterations: 500000
      max_probe_iterations: 50000
      max_ripup: 8
    - name: control_hub_straps_bottom
      group: control_hub_straps_bottom
      track_width: 0.18
      # This long strap crosses the management USB corridor.  The first
      # 0.15 mm search completed but produced five 0.16--0.21 mm approaches
      # to MGMT_N, so the route itself must own the full USB field clearance.
      clearance: 0.30
      keepout_layer: User.4
      max_iterations: 700000
      max_probe_iterations: 75000
      max_ripup: 2
    - name: control_hub_straps_left
      group: control_hub_straps_left
      track_width: 0.18
      clearance: 0.15
      keepout_layer: User.4
      max_iterations: 700000
      max_probe_iterations: 75000
      max_ripup: 2
    - name: control_hub_analog
      group: control_hub_analog
      track_width: 0.18
      # Route the dense QFN strap banks first.  The package-local PLL escape
      # is deterministic; its strict-clearance field route must not form a
      # back-layer wall across those exits before they claim their channels.
      clearance: 0.32
      max_iterations: 700000
      max_probe_iterations: 75000
      max_ripup: 12
    - name: control_hub_ports
      group: control_hub_ports
      track_width: 0.18
      clearance: 0.15
      max_iterations: 700000
      max_probe_iterations: 75000
      max_ripup: 12
    - name: control_commands
      group: control_commands
      track_width: 0.18
      clearance: 0.15
      max_iterations: 900000
      max_probe_iterations: 75000
      max_ripup: 20
    - name: control_misc
      group: control_misc
      track_width: 0.18
      clearance: 0.15
      max_iterations: 700000
      max_probe_iterations: 75000
      max_ripup: 10

stitch:
  clearance: 0.30
  via:
    size: 0.46
    drill: 0.20
    spacing: 0.80
    pth_margin: 0.25
    tiers:
      - {size: 0.46, drill: 0.20, hole_to_copper: 0.255}
  keepin: {inset: 0.8}
  passes: [dedupe_vias, drop_micro_fragments, drop_dangling,
           split_t_junctions, reload, hole_to_hole, pad_rescue, stub_fallback,
           astar_fallback, stitch_grid, fill, island_rescue, fill,
           fresh_reload, unify_zone_priorities, heal_islands,
           prune_stitch_dangling, gate]
  dedupe_vias: {radius: 0.5, metric: box}
  drop_micro_fragments: {max_length: 0.12, require_free_end: true}
  drop_dangling: {max_length: 1.0, tol: 0.05, sweeps: 4}
  split_t_junctions: {tol: 0.05}
  hole_to_hole: {min_gap: 0.25, mode: nudge, prefer_keep: [GND]}
  pad_rescue:
    net: GND
    via_in_pad: true
    # These pads sit over deliberately preserved routing corridors.  A forced
    # through-barrel blocks the only legal signal path; their source-owned
    # F.Cu spokes are connected directly by the top-layer GND pour at fill.
    # C_HUB_18PLL.2 is specifically over P3_HUB_P/N on B.Cu.
    skip_refs: [C_HUB_A4, C_HUB_18PLL]
    served_within: 1.4
    rings: [0.7, 0.9, 1.2, 1.6, 2.1]
    stub_width: 0.25
    stub_scope: {min_track_width: 0.18}
    require: none
  stub_fallback: {net: GND, min_dist: 0.2, max_dist: 7.0, width: 0.25}
  astar_fallback:
    net: GND
    width: 0.18
    layers: [F.Cu, B.Cu]
    via: {size: 0.46, drill: 0.20, hole_to_copper: 0.255}
    window: 4.0
    attempts: 3
    targets: 12
    max_dist: 12.0
  stitch_grid:
    net: GND
    x: [24, 146, 8]
    y: [24, 106, 8]
    avoid:
      - {x0: 20.0, y0: 88.0, x1: 86.0, y1: 110.0, margin: 0.8}
  island_rescue: {min_bbox: 0.8, layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], require: all}
  unify_zone_priorities: {min_bbox: 0.8}
  heal_islands: {min_bbox: 0.1, layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], sample_step: 0.05, max_gap_candidates: 2000, clear_rescue_failures: true}
  prune_stitch_dangling: {tol: 0.05, min_layers: 2}
