# USB-controlled debug hub routing contract. Critical USB pairs are routed
# first against dual adjacent GND planes; all other copper follows.
project:
  name: usb_controlled_debug_hub
  board: 04_kicad/usb_controlled_debug_hub.kicad_pcb
  build_dir: 06_build/route

flow:
  heartbeat_s: 10
  pre_route_reviews:
    board: 04_kicad/usb_controlled_debug_hub.kicad_pcb
    netlist: 06_build/netlists/usb_controlled_debug_hub.net
    topology: 08_reviews/pre-route_topology.md
    schematic_pdf: 03_tscircuit/build/schematic.pdf
    schematic_render: 08_reviews/pre-route_schematic_render.md
    pin: 08_reviews/pre-route_pin.md
    layout: 08_reviews/pre-route_layout.md
    render: 08_reviews/pre-route_render.md
    a_render: 06_build/pre_route/twin_overlay.md
  owner:
    stage: routing
    files: [03_src/route.yaml, 03_src/floorplan.yaml,
            03_src/rules/nets.yaml,
            03_src/route/critical_prefix.kicad_pcb,
            03_src/route/final.kicad_pcb]
  copper:
    deterministic: [prep, route.prefix, stitch, route.final]
    stochastic: [route.waves]
  budgets_s:
    tier_preflight: 30
    route_wave: 900
    grind: 1800
    rebuild: 1800
    layout_drc: 180
  timeouts_s:
    default: 600
    route_wave: 900
    route_race: 2400
    route_import: 300
    stitch: 1200
    rebuild: 1800
    layout_drc: 240
  blockers:
    - order-time JLC 90-ohm impedance-calculator result and coupon selection
    - order-time JLC/LCSC stock and USB-A THT assembly confirmation

prep:
  out: r0.kicad_pcb
  pad_rescue: true
  keepouts:
    layers: [User.2, User.3, User.4, User.5, User.6]
    mounting_holes: {radius: 3.0}
    edge_band: 0.7
    rects:
      # USB waves stay clear of the input/buck cell and their switching loops.
      - {x0: 20.0, y0: 88.0, x1: 86.0, y1: 110.0, layer: User.3}
      # Hub straps must not detour upward through the four promoted port
      # channels.  The full-width barrier ends above the hub strap pins so
      # KRT can still use the physical pads as endpoints; a second, deeper
      # barrier protects the upstream launch immediately left of the hub.
      - {x0: 20.7, y0: 20.7, x1: 149.3, y1: 55.0, layer: User.4}
      - {x0: 74.0, y0: 48.0, x1: 92.0, y1: 70.0, layer: User.4}
      # SWAP3-specific P4 corridor envelope. A dedicated layer is required:
      # the other right-edge strap endpoints sit inside this geometry and
      # must remain reachable in their later User.4 wave. The stepped boxes
      # follow the lower horizontal, diagonal and central horizontal P4 runs.
      - {x0: 87.80, y0: 67.05, x1: 96.80, y1: 68.95, layer: User.6}
      - {x0: 95.40, y0: 66.20, x1: 99.00, y1: 68.95, layer: User.6}
      - {x0: 97.50, y0: 64.20, x1: 101.00, y1: 67.60, layer: User.6}
      - {x0: 99.50, y0: 62.00, x1: 103.00, y1: 65.60, layer: User.6}
      - {x0: 101.50, y0: 62.00, x1: 109.90, y1: 63.80, layer: User.6}
      # Central top-edge straps leave four adjacent QFN pins through the
      # open strip below the upper USB barrier, then pass to the left of the
      # existing P4_HUB pair.  Protect only that pair's occupied field here:
      # broad left/right walls made the otherwise valid endpoints unreachable.
      - {x0: 20.7, y0: 20.7, x1: 149.3, y1: 55.0, layer: User.5}
      - {x0: 74.0, y0: 48.0, x1: 92.0, y1: 70.0, layer: User.5}
      - {x0: 84.9, y0: 60.95, x1: 111.0, y1: 69.5, layer: User.5}
  # Deterministic package escapes carry the local 0.15 mm clearance only
  # across the named launch areas.  The four connector-side pairs are short,
  # no-via spans whose three-terminal ESD topology cannot be represented as a
  # two-ended KRT pair.  Their complete coupled geometry is therefore owned
  # here; stochastic routing starts at usb_transition_ports and retains the
  # 0.30 mm field clearance.  The upstream connector/shunt path is a separate
      # topology class and therefore a separately authenticated wave.
  seed_stubs:
    clearance: 0.15
    via: {size: 0.46, drill: 0.20}
    stubs:
      # Close the short receptacle-to-shunt branch deterministically.  This
      # makes each three-pad protected USB net two connected copper islands
      # before the differential router sees it: connector+ESD, then the long
      # ESD-to-switch/hub span.  The router must never demote that topology to
      # two unrelated single-ended routes.
      - {net: P1_PORT_N, pin: J_PORT1.2, segments: [{layer: B.Cu, width: 0.2332, pts: [[52.5000, 33.7000], [52.4500, 35.4625]]}]}
      - {net: P1_PORT_P, pin: J_PORT1.3, segments: [{layer: B.Cu, width: 0.2332, pts: [[50.5000, 33.7000], [50.5500, 35.4625]]}]}
      - {net: P2_PORT_N, pin: J_PORT2.2, segments: [{layer: B.Cu, width: 0.2332, pts: [[80.5000, 33.7000], [80.4500, 35.4625]]}]}
      - {net: P2_PORT_P, pin: J_PORT2.3, segments: [{layer: B.Cu, width: 0.2332, pts: [[78.5000, 33.7000], [78.5500, 35.4625]]}]}
      - {net: P3_PORT_N, pin: J_PORT3.2, segments: [{layer: B.Cu, width: 0.2332, pts: [[108.5000, 33.7000], [108.4500, 35.4625]]}]}
      - {net: P3_PORT_P, pin: J_PORT3.3, segments: [{layer: B.Cu, width: 0.2332, pts: [[106.5000, 33.7000], [106.5500, 35.4625]]}]}
      - {net: P4_PORT_N, pin: J_PORT4.2, segments: [{layer: B.Cu, width: 0.2332, pts: [[136.5000, 33.7000], [136.4500, 35.4625]]}]}
      - {net: P4_PORT_P, pin: J_PORT4.3, segments: [{layer: B.Cu, width: 0.2332, pts: [[134.5000, 33.7000], [134.5500, 35.4625]]}]}
      # Convert each package's native pad pitch to the controlled 0.3832 mm
      # pair spacing before the field router.  The hub uses a short straight
      # runway clear of port 1; the controller's 1.27 mm-pitch USB pins use a
      # bounded asymmetric escape and finish as an aligned pair.  KRT routes
      # from these copper-island free ends rather than trying to start inside
      # either package courtyard.
      - {net: MGMT_P, pin: U_HUB.1, segments: [{layer: F.Cu, width: 0.2332, pts: [[88.5875, 61.2500], [87.8000, 61.2500], [87.3000, 61.3084], [86.5000, 61.3084]]}]}
      - {net: MGMT_N, pin: U_HUB.2, segments: [{layer: F.Cu, width: 0.2332, pts: [[88.5875, 61.7500], [87.8000, 61.7500], [87.3000, 61.6916], [86.5000, 61.6916]]}]}
      # The management pair's controller launch is boxed by its I2C pullups,
      # while the stochastic port routes consume the only obvious hub-side
      # corridor.  Own the complete pair deterministically instead of asking
      # independent route waves to negotiate the same narrow field.  The
      # 57.770/58.1532 mm horizontal section is the explicit 0.3832 mm-centre
      # channel between C_PORT2_BULK and R_VBUS_TOP.  The paired chamfers keep
      # P/N equal in realized copper, stay entirely on F.Cu, and introduce no
      # vias.  This geometry was replayed against the routed four-port field,
      # not merely checked on an empty r0 board.
      - net: MGMT_N
        pin: U_CTRL.12
        segments:
          - {layer: F.Cu, width: 0.2332, pts: [[76.4750, 74.7300], [77.2000, 74.7300], [77.6434, 74.2866], [78.2000, 74.2866], [78.7916, 74.2866], [78.9916, 74.0866], [78.9916, 64.8916], [79.1916, 64.6916], [80.0000, 64.6916]]}
          - {layer: F.Cu, width: 0.2332, pts: [[80.0000, 64.6916], [80.5584, 64.6916], [80.7500, 64.5000], [80.7500, 58.3616], [80.9416, 58.1700], [85.1416, 58.1700], [85.3332, 58.3616], [85.3332, 61.5000], [85.5248, 61.6916], [86.5000, 61.6916]]}
      - net: MGMT_P
        pin: U_CTRL.13
        segments:
          - {layer: F.Cu, width: 0.2332, pts: [[76.4750, 73.4600], [77.2000, 73.4600], [77.6434, 73.9034], [78.2000, 73.9034], [78.4084, 73.9034], [78.6084, 73.7034], [78.6084, 64.5084], [78.8084, 64.3084], [80.0000, 64.3084]]}
          - {layer: F.Cu, width: 0.2332, pts: [[80.0000, 64.3084], [80.1084, 64.3084], [80.3000, 64.1168], [80.3000, 58.0116], [80.5416, 57.7700], [85.6314, 57.7700], [85.8230, 57.9616], [85.8230, 61.1168], [86.0146, 61.3084], [86.5000, 61.3084]]}
      # Give KRT a straight, already-coupled runway after each package fanout.
      # Without this deterministic transition its default 0.7664 mm setback
      # converges and turns at the same point, forcing the pair-partner cleanup
      # to neck both terminal segments to 0.1637 mm.  The final 0.5 mm here is
      # parallel at the exact 0.3832 mm centre spacing, so stochastic routing
      # begins at full impedance width rather than manufacturing a hidden
      # launch exception.
      - {net: P1_HUB_N, pin: U_HUB.3, segments: [{layer: F.Cu, width: 0.2332, pts: [[88.5875, 62.2500], [87.8000, 62.2500], [87.3000, 62.3084], [86.5000, 62.3084]]}]}
      - {net: P1_HUB_P, pin: U_HUB.4, segments: [{layer: F.Cu, width: 0.2332, pts: [[88.5875, 62.7500], [87.8000, 62.7500], [87.3000, 62.6916], [86.5000, 62.6916]]}]}
      - {net: P2_HUB_N, pin: U_HUB.6, segments: [{layer: F.Cu, width: 0.2332, pts: [[88.5875, 63.7500], [87.8000, 63.7500], [87.3000, 63.8084], [86.5000, 63.8084]]}]}
      - {net: P2_HUB_P, pin: U_HUB.7, segments: [{layer: F.Cu, width: 0.2332, pts: [[88.5875, 64.2500], [87.8000, 64.2500], [87.3000, 64.1916], [86.5000, 64.1916]]}]}
      - {net: P3_HUB_N, pin: U_HUB.8, segments: [{layer: F.Cu, width: 0.2332, pts: [[88.5875, 64.7500], [87.8000, 64.7500], [87.3000, 64.8084], [86.5000, 64.8084]]}]}
      - {net: P3_HUB_P, pin: U_HUB.9, segments: [{layer: F.Cu, width: 0.2332, pts: [[88.5875, 65.2500], [87.8000, 65.2500], [87.3000, 65.1916], [86.5000, 65.1916]]}]}
      - {net: P4_HUB_N, pin: U_HUB.11, segments: [{layer: F.Cu, width: 0.2332, pts: [[88.5875, 66.2500], [87.8000, 66.2500], [87.3000, 66.3084], [86.5000, 66.3084]]}]}
      - {net: P4_HUB_P, pin: U_HUB.12, segments: [{layer: F.Cu, width: 0.2332, pts: [[88.5875, 66.7500], [87.8000, 66.7500], [87.3000, 66.6916], [86.5000, 66.6916]]}]}
      - net: UP_HUB_N
        pin: U_HUB.58
        segments:
          - {layer: F.Cu, width: 0.2332, pts: [[92.2500, 60.5875], [92.2500, 56.6000], [93.0000, 55.8500]]}
      - net: UP_HUB_P
        pin: U_HUB.59
        segments:
          - {layer: F.Cu, width: 0.2332, pts: [[91.7500, 60.5875], [91.7500, 55.8500]]}

      # The upstream PESD2USB3UX is a three-terminal shunt on the SAME two
      # signal nets, not a series two-port.  Deterministically join connector
      # and shunt, then converge the two connected source islands into a short
      # coupled runway.  The separate usb_upstream wave starts at those free
      # ends, so its router sees exactly two pair components rather than trying
      # to infer a three-pad chain.  No logical polarity swap is permitted.
      - net: UP_HUB_N
        pin: U_ESD_UP.1
        segments:
          # The bottom-side shunt sits on the signal-row side of the USB-B
          # VBUS/GND row.  Both short, via-free branches therefore reach the
          # protector without crossing through-hole power copper.
          - {layer: B.Cu, width: 0.2332, pts: [[34.1500, 53.7875], [34.2000, 55.7500]]}
          - {layer: B.Cu, width: 0.2332, pts: [[34.2000, 55.7500], [35.6000, 57.1500], [35.6000, 59.3885], [38.1000, 59.3885], [38.1000, 57.7700]]}
          - {layer: F.Cu, width: 0.2332, pts: [[38.1000, 57.7700], [39.6000, 57.7700], [40.2000, 57.3000]]}
        vias: [[38.1000, 57.7700]]
      - net: UP_HUB_P
        pin: U_ESD_UP.2
        segments:
          - {layer: B.Cu, width: 0.2332, pts: [[32.2500, 53.7875], [32.2000, 55.7500]]}
          # The USB-B and hub expose opposite physical P/N order around the
          # route corridor.  N remains on B.Cu after its shunt branch while P
          # leaves the plated connector land on F.Cu; the two cross locally,
          # then N returns to F.Cu at the paired runway.  Each conductor has
          # one B-to-F transition in the end-to-end path, and no logical
          # polarity swap is hidden in the router.
          # The direct two-segment finish is shorter than the original
          # three-segment dogleg while still clearing the N signal via by
          # 0.655 mm centre-to-line.  P transitions through J_UP's plated
          # pad; N transitions through its explicit signal via, so matching
          # their planar copper (not counting only N's barrel) is the
          # physically symmetric comparison.
          - {layer: F.Cu, width: 0.2332, pts: [[32.2000, 55.7500], [32.2000, 54.4000], [34.6000, 54.4000], [35.6000, 55.4000], [37.3159, 57.8262], [37.7915, 58.4916], [37.8300, 58.5200], [39.2000, 58.1540], [39.6000, 58.1540], [40.2000, 58.5500]]}
      # The N conductor changes reference planes at (38.100,57.770).  Own a
      # nearby GND return via explicitly instead of hoping the later coarse
      # stitch grid happens to serve this high-speed transition.  The 0.87 mm
      # centre spacing clears both signal conductors at the contracted 0.30 mm
      # field clearance and gives the displacement current a local path.
      - {net: GND, why: "UP_HUB N layer-transition return path", vias: [[38.1000, 56.9000]]}
      - {net: P1_HUB_N, pin: U_DATA1.3, segments: [{layer: B.Cu, width: 0.2332, pts: [[59.1000, 44.5000], [60.2000, 44.5000], [60.7000, 44.5584], [61.2000, 44.5584]]}]}
      - {net: P1_HUB_P, pin: U_DATA1.4, segments: [{layer: B.Cu, width: 0.2332, pts: [[59.1000, 45.0000], [60.2000, 45.0000], [60.7000, 44.9416], [61.2000, 44.9416]]}]}
      - {net: P1_PORT_P, pin: U_DATA1.6, segments: [{layer: B.Cu, width: 0.2332, pts: [[54.9000, 45.5000], [53.8000, 45.5000]]}]}
      - {net: P1_PORT_N, pin: U_DATA1.7, segments: [{layer: B.Cu, width: 0.2332, pts: [[54.9000, 45.0000], [53.8000, 45.0000]]}]}
      - {net: P2_HUB_N, pin: U_DATA2.3, segments: [{layer: B.Cu, width: 0.2332, pts: [[84.1000, 44.5000], [85.2000, 44.5000], [85.7000, 44.5584], [86.2000, 44.5584]]}]}
      - {net: P2_HUB_P, pin: U_DATA2.4, segments: [{layer: B.Cu, width: 0.2332, pts: [[84.1000, 45.0000], [85.2000, 45.0000], [85.7000, 44.9416], [86.2000, 44.9416]]}]}
      - {net: P2_PORT_P, pin: U_DATA2.6, segments: [{layer: B.Cu, width: 0.2332, pts: [[79.9000, 45.5000], [78.8000, 45.5000]]}]}
      - {net: P2_PORT_N, pin: U_DATA2.7, segments: [{layer: B.Cu, width: 0.2332, pts: [[79.9000, 45.0000], [78.8000, 45.0000]]}]}
      - {net: P3_HUB_N, pin: U_DATA3.3, segments: [{layer: B.Cu, width: 0.2332, pts: [[102.9000, 44.5000], [101.8000, 44.5000], [101.3000, 44.4416], [100.8000, 44.4416]]}]}
      - {net: P3_HUB_P, pin: U_DATA3.4, segments: [{layer: B.Cu, width: 0.2332, pts: [[102.9000, 44.0000], [101.8000, 44.0000], [101.3000, 44.0584], [100.8000, 44.0584]]}]}
      - {net: P3_PORT_P, pin: U_DATA3.6, segments: [{layer: B.Cu, width: 0.2332, pts: [[107.1000, 43.5000], [108.2000, 43.5000]]}]}
      - {net: P3_PORT_N, pin: U_DATA3.7, segments: [{layer: B.Cu, width: 0.2332, pts: [[107.1000, 44.0000], [108.2000, 44.0000]]}]}
      - {net: P4_HUB_N, pin: U_DATA4.3, segments: [{layer: B.Cu, width: 0.2332, pts: [[123.9000, 44.5000], [122.8000, 44.5000], [122.3000, 44.4416], [121.8000, 44.4416]]}]}
      - {net: P4_HUB_P, pin: U_DATA4.4, segments: [{layer: B.Cu, width: 0.2332, pts: [[123.9000, 44.0000], [122.8000, 44.0000], [122.3000, 44.0584], [121.8000, 44.0584]]}]}
      - {net: P4_PORT_P, pin: U_DATA4.6, segments: [{layer: B.Cu, width: 0.2332, pts: [[128.1000, 43.5000], [129.2000, 43.5000]]}]}
      - {net: P4_PORT_N, pin: U_DATA4.7, segments: [{layer: B.Cu, width: 0.2332, pts: [[128.1000, 44.0000], [129.2000, 44.0000]]}]}

      # Complete connector-side pairs.  PESD2USB3UX is a three-pin shunt, not
      # a series/flow-through part: the connector traces land directly on
      # pins 1/2 and continue along either side of pin 3, never branch to the
      # protector.  They couple at 0.384 mm centres (0.1508 mm copper gap) as
      # soon as the grounded land is cleared.  One 0.4 mm package-side dogleg
      # compensates the unavoidable 90-degree coupled-bend offset; calculated
      # route-only skew is 0.305 mm per pair.  The independently owned
      # USB_HS_PROTECTED class bounds the DRC-measured connector/package
      # discontinuity at 7.50 mm without weakening the internal USB pairs.
      - net: P1_PORT_N
        pin: U_ESD1.2
        segments:
          - {layer: B.Cu, width: 0.2332, pts: [[52.450, 35.462], [52.850, 35.862], [52.850, 38.120], [52.450, 38.520], [51.692, 39.278], [51.692, 43.170], [53.580, 45.058], [53.742, 45.058], [53.800, 45.000]]}
      - net: P1_PORT_P
        pin: U_ESD1.1
        segments:
          - {layer: B.Cu, width: 0.2332, pts: [[50.550, 35.462], [50.550, 38.520], [51.308, 39.278], [51.308, 43.330], [53.420, 45.442], [53.742, 45.442], [53.800, 45.500]]}
      - net: P2_PORT_N
        pin: U_ESD2.2
        segments:
          - {layer: B.Cu, width: 0.2332, pts: [[80.450, 35.462], [80.850, 35.862], [80.850, 38.120], [80.450, 38.520], [79.692, 39.278], [79.692, 40.080], [78.192, 41.580], [78.192, 44.570], [78.680, 45.058], [78.742, 45.058], [78.800, 45.000]]}
      - net: P2_PORT_P
        pin: U_ESD2.1
        segments:
          - {layer: B.Cu, width: 0.2332, pts: [[78.550, 35.462], [78.550, 38.520], [79.308, 39.278], [79.308, 39.920], [77.808, 41.420], [77.808, 44.730], [78.520, 45.442], [78.742, 45.442], [78.800, 45.500]]}
      - net: P3_PORT_N
        pin: U_ESD3.2
        segments:
          - {layer: B.Cu, width: 0.2332, pts: [[108.450, 35.462], [108.450, 38.520], [107.692, 39.278], [107.692, 39.920], [109.192, 41.420], [109.192, 43.230], [108.480, 43.942], [108.258, 43.942], [108.200, 44.000]]}
      - net: P3_PORT_P
        pin: U_ESD3.1
        segments:
          - {layer: B.Cu, width: 0.2332, pts: [[106.550, 35.462], [106.150, 35.862], [106.150, 38.120], [106.550, 38.520], [107.308, 39.278], [107.308, 40.080], [108.808, 41.580], [108.808, 43.070], [108.320, 43.558], [108.258, 43.558], [108.200, 43.500]]}
      - net: P4_PORT_N
        pin: U_ESD4.2
        segments:
          - {layer: B.Cu, width: 0.2332, pts: [[136.450, 35.462], [136.450, 38.520], [135.692, 39.278], [135.692, 40.080], [131.830, 43.942], [129.258, 43.942], [129.200, 44.000]]}
      - net: P4_PORT_P
        pin: U_ESD4.1
        segments:
          - {layer: B.Cu, width: 0.2332, pts: [[134.550, 35.462], [134.150, 35.862], [134.150, 38.120], [134.550, 38.520], [135.308, 39.278], [135.308, 39.920], [131.670, 43.558], [129.258, 43.558], [129.200, 43.500]]}

      # Source-owned 5 V input distribution.  A multi-load power rail is not
      # a point-to-point route wave: the aggregate eFuse launch, B.Cu trunk,
      # branch drops and package collectors are explicit reviewed geometry.
      # The two internal GND planes remain unbroken USB references.
      - net: P5V_RAW
        pin: J_PWR.1
        segments:
          - {layer: F.Cu, width: 1.5, pts: [[25.500, 98.000], [31.000, 98.000], [33.000, 99.000], [37.000, 99.000], [37.000, 102.400]]}
      - net: P5V_FUSED
        pin: F_IN.2
        segments:
          - {layer: F.Cu, width: 1.5, pts: [[46.920, 102.400], [46.920, 99.000], [48.000, 96.000], [50.500, 96.000]]}
          - {layer: F.Cu, width: 0.35, pts: [[50.500, 96.000], [51.520, 96.000], [51.770, 97.500]]}
          - {layer: F.Cu, width: 0.30, pts: [[51.770, 97.500], [51.770, 99.000]]}
          - {layer: F.Cu, width: 0.35, pts: [[47.175, 94.000], [47.175, 95.500], [48.000, 96.000]]}
      - net: P5V_PROTECTED
        pin: U_AGG.6
        why: "3 A continuous / 5 A bounded-transient protected trunk; ten source barrels and two per branch retain the two solid internal GND planes"
        segments:
          - {layer: F.Cu, width: 0.30, pts: [[52.260, 99.000], [52.260, 100.500], [53.250, 101.500]]}
          - {layer: F.Cu, width: 0.80, pts: [[53.250, 101.500], [54.000, 102.250], [54.000, 103.000]]}
          - {layer: F.Cu, width: 1.50, pts: [[54.000, 103.000], [59.300, 103.000], [59.300, 104.000]]}
          - {layer: F.Cu, width: 0.50, pts: [[59.520, 96.000], [59.520, 103.000]]}
          - {layer: F.Cu, width: 1.00, pts: [[62.525, 96.000], [62.525, 99.500], [59.300, 103.000]]}
