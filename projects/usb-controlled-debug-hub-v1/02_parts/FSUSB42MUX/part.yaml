  source: "onsemi mechanical case 846AP, JEDEC MO-187 MSOP-10, final datasheet page"
  body_nominal_mm: [3.0, 3.0]
  pitch_mm: 0.5
  note: "KiCad stock MSOP-10_3x3mm_P0.5mm is the matching no-exposed-pad leaded land pattern."
verified: >
  MSOP pin map read from Figure 3 "10-Lead MSOP (Top-Through View)" and
  cross-checked against the MSOP column of the pin-description table, PDF p.2;
  exact FSUSB42MUX suffix cross-checked in the ordering table, PDF p.7.
  2026-07-31.
gotchas:
  - >
    OE IS ACTIVE HIGH DISCONNECT: OE=HIGH disconnects every switch path;
    OE=LOW connects the throw selected by SEL. For this board tie SEL LOW,
    connect hub-side Pn_HUB_P/Pn_HUB_N to common pins 3/4, connect the USB-A
    connector side to HSD1 pins 7/6, and emit explicit NC flags on HSD2 pins
    9/8. A 10k pull-up on OE makes management reset fail physically disconnected.
  - >
    There is no hardware status output. Host control software may report the
    commanded OE state, while actual connection/enumeration remains a host
    OS/hub-controller fact. Do not label command readback as attached or enumerated.
  - >
    SEL and OE must never float (datasheet Recommended Operating Conditions
    note 5). 3.3 V GPIO levels are valid with a 3.3 V VCC; VIH is 1.3 V min and
    VIL is 0.5 V max over the 2.4-3.6 V supply range.
  - >
    Power-off tolerance prevents a powered USB data pin from parasitically
    powering an unpowered switch, but it does not replace connector-side ESD
    protection or controlled-impedance differential routing.
  - >
    FSUSB42MUX was selected over TS3USB221ARSER: both provide a single OE and
    USB 2.0 bandwidth, but FSUSB42 offers a leaded 0.5 mm MSOP, 3.7 pF typical
    on-capacitance and 3.9 ohm typical RON. TS3USB221A is only available in a
    tiny 0.5 mm UQFN and has 6 pF typical on-capacitance and 6 ohm maximum RON.
  - >
    Keep the unused HSD2 throw copper-free. A named dangling net or test pad on
    that throw creates an RF stub even though the functional truth table still
    looks correct.
layout:
  source: >
    onsemi FSUSB42/D Figures 1-3, AC tables and truth table. The datasheet has
    no routed PCB example; the inline pair routing below is DERIVED from the
    specified 480 Mbps use, bidirectional DPDT topology, 3.7 pF CON, and 2 pF
    COFF. Place each switch inline between hub and connector-side ESD, with an
    unbroken reference plane and no stubs on common or HSD1.
  reviewed: 2026-07-31
  keep_short:
    - {net: P1_HUB_P, max_span_mm: 50, anchor_pins: ["3"], why: "DERIVED: 50 mm FR-4 flight time is about 300 ps, under 15 percent of a 480 Mbps bit cell; stubless impedance and plane continuity govern"}
    - {net: P1_HUB_N, max_span_mm: 50, anchor_pins: ["4"], why: "DERIVED: 50 mm FR-4 flight time is about 300 ps, under 15 percent of a 480 Mbps bit cell; stubless impedance and plane continuity govern"}
    - {net: P2_HUB_P, max_span_mm: 50, anchor_pins: ["3"], why: "DERIVED: 50 mm FR-4 flight time is about 300 ps, under 15 percent of a 480 Mbps bit cell; stubless impedance and plane continuity govern"}
    - {net: P2_HUB_N, max_span_mm: 50, anchor_pins: ["4"], why: "DERIVED: 50 mm FR-4 flight time is about 300 ps, under 15 percent of a 480 Mbps bit cell; stubless impedance and plane continuity govern"}
    - {net: P3_HUB_P, max_span_mm: 50, anchor_pins: ["3"], why: "DERIVED: 50 mm FR-4 flight time is about 300 ps, under 15 percent of a 480 Mbps bit cell; stubless impedance and plane continuity govern"}
    - {net: P3_HUB_N, max_span_mm: 50, anchor_pins: ["4"], why: "DERIVED: 50 mm FR-4 flight time is about 300 ps, under 15 percent of a 480 Mbps bit cell; stubless impedance and plane continuity govern"}
    - {net: P4_HUB_P, max_span_mm: 50, anchor_pins: ["3"], why: "DERIVED: 50 mm FR-4 flight time is about 300 ps, under 15 percent of a 480 Mbps bit cell; stubless impedance and plane continuity govern"}
    - {net: P4_HUB_N, max_span_mm: 50, anchor_pins: ["4"], why: "DERIVED: 50 mm FR-4 flight time is about 300 ps, under 15 percent of a 480 Mbps bit cell; stubless impedance and plane continuity govern"}
    - {net: P1_PORT_P, max_span_mm: 12, anchor_pins: ["7"], why: "DERIVED: short HSD1+ run to connector-side ESD, with no stub"}
    - {net: P1_PORT_N, max_span_mm: 12, anchor_pins: ["6"], why: "DERIVED: short HSD1- run to connector-side ESD, with no stub"}
    - {net: P2_PORT_P, max_span_mm: 12, anchor_pins: ["7"], why: "DERIVED: short HSD1+ run to connector-side ESD, with no stub"}
    - {net: P2_PORT_N, max_span_mm: 12, anchor_pins: ["6"], why: "DERIVED: short HSD1- run to connector-side ESD, with no stub"}
    - {net: P3_PORT_P, max_span_mm: 12, anchor_pins: ["7"], why: "DERIVED: short HSD1+ run to connector-side ESD, with no stub"}
    - {net: P3_PORT_N, max_span_mm: 12, anchor_pins: ["6"], why: "DERIVED: short HSD1- run to connector-side ESD, with no stub"}
    - {net: P4_PORT_P, max_span_mm: 12, anchor_pins: ["7"], why: "DERIVED: short HSD1+ run to connector-side ESD, with no stub"}
    - {net: P4_PORT_N, max_span_mm: 12, anchor_pins: ["6"], why: "DERIVED: short HSD1- run to connector-side ESD, with no stub"}
  notes:
    - "Route each D+/D- pair through the switch pads without necking into a stub; keep pair geometry and reference-plane continuity through the whole cell."
    - "Place USBLC6-2SC6 at the connector, then the FSUSB42 behind it; the ESD clamp must see the disturbance before a longer trace reaches the switch or hub."
    - "Keep the OE pull-up adjacent to pin 10 so reset cannot leave a half-selected data path."
