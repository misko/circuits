  product_page: https://www.onsemi.com/products/interfaces/analog-switches/fsusb42
  local: FSUSB42-D_Rev3.pdf
  sha256: a3fbf9747541f510188d649c1f37a082d5d15430963e98d8c192dc7036e4fe9a
  fetched: 2026-07-31
  pages: 10
  provenance: "Downloaded directly from onsemi.com; current English datasheet."
