  on_capacitance: 3.7 pF typ
  off_capacitance: 2.0 pF typ
  propagation_delay: 0.25 ns typ
  turn_on: 13 ns typ / 30 ns max at VCC=3.0 to 3.6 V
  turn_off: 12 ns typ / 25 ns max at VCC=3.0 to 3.6 V
  total_jitter: 200 ps typ at 480 Mbps
  operating_temperature: -40 C to 85 C
  usb_pin_system_esd: 15 kV air / 8 kV contact IEC 61000-4-2
