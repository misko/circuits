electrical:
  source: "DS20001952D DC characteristics and pin descriptions"
  vdd: 5.0
  vdd_net: VBUS_CTRL
gotchas:
  - "All I/O pins default to inputs. The eight external command pull-downs are the safety authority; host initialization is not."
  - "Pins 11 and 14 are NC on the I2C part. Do not wire them using the MCP23S17 SPI variant map."
  - "Tie A0/A1/A2 directly low for address 0x20 and pull RESET_N high locally; RESET_N has no internal pull-up."
  - "INTA/INTB and GPB0..7 are unused on this board and remain explicitly unconnected. Faults go directly from TPS2557 to USB2517 OCS inputs."
verified: "CITED: DS20001952D Package Types figure p2 and pin description table pp14-15; SSOP map cross-checked pin-by-pin and tape/reel T-E/SS identity checked in ordering information, 2026-08-15."
