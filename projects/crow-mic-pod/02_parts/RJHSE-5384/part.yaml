note: >-
  CUSTOM NON-ETHERNET PINOUT on this board: 1/2 = AUDIO_P/AUDIO_N (T568B orange pair),
  3/6 = BEEP_5V / BEEP_RET (green pair), 4/5 = 5V/GND (blue pair), 7/8 = 5V/GND
  (brown pair). Contact-for-contact IDENTICAL to the crow-array-central v1.0 sealed
  port map (its D28) and to the pod v1.0 screw-terminal map (terminal n = RJ45 pin n).
  Never plug into real Ethernet gear — 5V on 3-8.
gotchas:
  - "BRIEF SAID 'no LEDs' — WRONG. Part-number decode (catalogue p.3 ordering info + p.69 LED table): RJHS-E / 5=right-angle 8-pos 50u gold / 3=shield (single port: top tabs only) / 8=8 contacts / 4=LED code 4 = GREEN left + YELLOW right. Digi-Key confirms 'Green - Yellow'. The truly LED-less part is RJHSE-5380."
  - "Because it has LEDs, the PCB needs the 4 LED tail holes (pins 9-12): use RJ45_Amphenol_RJHSE538X (16 pads: 1-8 + 9-12 LED + 2 SH + 2 NPTH posts). KiCad's RJ45_Amphenol_RJHSE5380 (no LED holes) will NOT accept this part — LED tails have nowhere to go."
  - "KiCad 10 footprint check: RJ45_Amphenol_RJHSE538X geometry matches catalogue p.4 layout — contact stagger 1.02mm x-pitch/2.03mm row pitch/1.78mm row offset, LED pair spacing 2.29mm, LED pairs 9.14mm apart, shield holes o1.57 at 16.26mm, NPTH posts o3.25 at 12.70mm. Contact/LED numbering agrees with the drawing (drawing is the same pattern rotated 180 deg). No mismatch found."
  - "MATING-FACE SIDE (CORRECTED 2026-07-19, v1.1 fresh pin review): the mating face is on the SNAP-POST side of the hole pattern (footprint local -y), NOT the LED-tail side. Proof from the catalogue p.4 side-view dim chain (600dpi re-measure): face->snap-post centerline .215 [5.46]; every bottom feature then closes against the footprint (post -2.54 = face@-8.0 +5.46; shield tail measured 8.83 from face ~ pad +0.89; far tail 14.73 ~ LED +6.6) => LED tails sit 1.15mm from the REAR. The earlier note here (and in crow-array-central's copy) claimed 'LED tails mark the mating face' — INVERTED; it pointed the pod v1.1 jack backwards until the fresh-context review caught it. Central's boards are unaffected (their rot-0 'openings north' placement is correct)."
  - "PIN-1 CONVENTION: looking INTO the jack opening (mounted, latch/tab UP, contacts at bottom of opening), contact 1 is on the RIGHT (standard 8P8C convention for contacts-down jacks; consistent with the front view's LED1=9/10 on the pin-1 end). Sanity-check on first article before soldering."
  - "LED pin polarity (which of 9/10, 11/12 is anode) is NOT given in the catalogue; per-part customer drawing RJHSE538X.pdf at amphenolcanada.com is dead/bot-blocked (re-checked 2026-07-17). Irrelevant here (LEDs unconnected) but blocks ever driving them without a bench check."
  - "Catalogue has no dedicated single-port RJHSE-538X drawing page; hole pattern verified against RJHSE-548X single-port (p.4, identical layout, different shield-tab count) and RJHSE-538X-04 multi-port (p.6). Deviation noted per S3 audit."
  - "TOP EMI TABS (shield option 3 = top tabs only) arc ABOVE the 13.46 body top and are the tallest feature; inside the 1551WY they press the polycarbonate lid and compress — see ADR-0004 clearance math + first-article check."
