# Datasheet LAYOUT-section compliance (P-LAYOUT). Adopted-forward backfill 2026-07-22.
# NOTE: this part is DNP (footprint reserve) — 0R R13/R14 bridge the winding pads.
layout:
  source: "Wuerth 744227S datasheet rev 009.003 (2023-04-12): the datasheet publishes a
    Recommended Land Pattern + electricals only — NO prose Layout-Guidelines section for a
    passive SMT common-mode line filter. General CM-choke practice governs: place the choke
    directly in the differential pair path with the two lines symmetric and the stubs short,
    so common-mode rejection is not spoiled by an asymmetric or long approach."
  reviewed: "2026-07-22 — datasheet reviewed end-to-end; confirmed land pattern + electricals only, no Layout section exists for this passive"
  adjacency:
    - "L1 sits in-line in the AUDIO_P/AUDIO_N pair between the J1 entry (+D1 ESD) and the R13/R14 bridges / downstream input Rs — a common-mode choke belongs IN the pair path"
  notes: "L1 is DNP (A3 reserve): 0R R13 bridges pins 1-4 (AUDIO_P<->AUD_P_I) and R14 bridges
    2-3 (AUDIO_N<->AUD_N_I), so the pair passes straight through when the choke is not fitted;
    populate only if field EMI demands it. No datasheet keep_short net-span budget exists
    (Wuerth gives a land pattern, not a span); the real constraint is PAIR SYMMETRY, which is
    tracked by R-LEN (v1.0 internal-side stubs AUD_P_I/AUD_N_I are 12.2/13.0mm, symmetric to
    ~0.8mm). Recorded as adjacency + notes rather than an invented budget."
