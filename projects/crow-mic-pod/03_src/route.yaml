# crow-mic-pod route + stitch — the whole per-board input to
# skills/kicad-pcb/scripts/route_and_stitch_generic.py, replacing the
# 79-line route_prep.py + 37-line route_waves.sh + 493-line stitch_and_fill.py.
#
# 2-layer, JLC standard tier (0.6/0.3 vias), R6.25 concave corner cuts.
# GND is NOT routed — F/B pours + stitch vias own it.

project:
  name: crow_mic_pod
  board: 04_kicad/crow_mic_pod.kicad_pcb
  build_dir: 06_build/route

prep:
  out: r0.kicad_pcb
  keepouts:
    layers: [User.2]
    mounting_holes: {radius: 2.8, refdes_prefix: H}   # #2 screw head + margin
    # J1's RJ45 board-lock posts: DRC hole clearance is 0.25 but KRT only
    # knows the 0.15 copper clearance (v1.1: 12x hole_clearance violations)
    npth_pads: {margin: 0.6}
    rects:
      # GND escape corridor for J1 pad 5 (odd-row centre): signal escapes
      # otherwise wall it in on both layers with no via room (v1.1 lesson)
      - {x0: 75.6, y0: 66.2, x1: 77.2, y1: 67.7}
      # corner cutouts — keep the router off the concave arcs
      - {x0: 50.0,  y0: 50.0, x1: 56.8,  y1: 56.8}
      - {x0: 137.7, y0: 50.0, x1: 144.5, y1: 56.8}
      - {x0: 50.0,  y0: 87.7, x1: 56.8,  y1: 94.5}
      - {x0: 137.7, y0: 87.7, x1: 144.5, y1: 94.5}
  waves:
    exclude: ["GND", "unconnected-*"]
    groups:
      # HARDEST FIRST: the RJ45 tail-field INTERIOR pads have ONE escape
      # lane each — 5V on pads 4/7, BEEP on 3/6. v1.0 shipped 5V pad 4
      # unroutable because power went last.
      pwr:   [5V, 5VF, SHIELD]
      beep:  [BEEP_5V, BZ_P, BEEP_RET]
      audio: [MIC, AIN, A_OUT, B_OUT, FB_A, FB_B, VMID, AUD_P_I, AUD_N_I,
              AUDIO_P, AUDIO_N]

route:
  krt: ~/gits/KiCadRoutingTools
  common:
    layers: [F.Cu, B.Cu]
    clearance: 0.15
    via_size: 0.6
    via_drill: 0.3
    fab_tier: standard
    no_stub_layer_swap: true
    keepout: true
    keepout_layer: User.2
  waves:
    - {name: pwr,   group: pwr,   track_width: 0.5, max_iterations: 300000}
    - {name: beep,  group: beep,  track_width: 0.6, max_iterations: 300000}
    - {name: audio, group: audio, track_width: 0.3, max_iterations: 400000}
  final: 03_src/route/r3.kicad_pcb          # canon M3 promoted chain

stitch:
  clearance: 0.15
  via: {size: 0.6, drill: 0.3, spacing: 0.85, pth_margin: 0.75}
  keepin: {rect: {x0: 50.0, y0: 50.0, x1: 144.5, y1: 94.5},
           inset: 1.2, corner_cut: 6.25}
  passes: [dedupe_vias, dedupe_tracks, drop_micro_fragments, drop_dangling,
           split_t_junctions, width_floor, reload,
           pad_rescue, stub_fallback, astar_fallback, hole_to_hole,
           stitch_grid, via_janitor,
           fill, island_rescue, fill, gate]
  dedupe_vias: {radius: 0.45, metric: box}
  drop_micro_fragments: {max_length: 0.05, require_free_end: true}
  drop_dangling: {max_length: 0.3, tol: 0.05, sweeps: 3}
  split_t_junctions: {tol: 0.05}
  width_floor:
    nets: {5V: 0.4, 5VF: 0.4, BEEP_5V: 0.4, BZ_P: 0.4, BEEP_RET: 0.4,
           AUDIO_P: 0.3, AUDIO_N: 0.3, AUD_P_I: 0.3, AUD_N_I: 0.3,
           A_OUT: 0.3, B_OUT: 0.3, VMID: 0.3}
  pad_rescue:
    net: GND
    via_in_pad: false        # 0.6 barrels in 0402 pads bridge to neighbours
    served_within: 2.5       # every GND pad needs a return within 2.5mm
    rings: [0.8, 1.0, 1.3, 1.7, 2.1]
    stub_width: 0.3
    require: none
  stub_fallback: {net: GND, min_dist: 0.2, max_dist: 6.0, width: 0.3}
  # PIN the via geometry: the toolkit's A* defaults to 0.45/0.2, below this
  # 2-layer standard-tier board's floors (2x drill_out_of_range + 1x
  # hole_to_hole from a single rescue before this was config).
  astar_fallback: {net: GND, width: 0.25, window: 3.0, attempts: 4,
                   max_dist: 10.0, via: {size: 0.6, drill: 0.3}}
  stitch_grid: {net: GND, x: [53, 143, 6], y: [53, 93, 6], min: 40}
  hole_to_hole: {min_gap: 0.5, mode: nudge, prefer_keep: [GND]}
  via_janitor: {min_layers: 2, pad_window: 2.5}
  # 1.5mm floor, not 4.5: two ~2mm pour pockets in J1's hole field had
  # no via and DRC counts an island-to-island gap as unconnected even
  # when the island holds no pad.
  island_rescue: {min_bbox: 1.5, layers: [F.Cu, B.Cu], require: all}
