    Four clip pins per terminal in the KiCad footprint vs consolidated pads in
    JLC's; blade positions verified identical against the 178.6165 drawing.
- lcsc: C98732      # XT60PW-M
  status: PAD-MISMATCH
  why: >-
    Blade pads 1/2 fit at rot 90; JLC names the mounting pegs 3/4, ours are
    unnamed. Polarity fact (pad1 = '-') verified in 02_parts/XT60PW-M.
