# usb-power-3s net architecture — source of truth for netclasses + DRU floors.
# generate_rules.py emits these into 04_kicad/usb_power_3s.kicad_pro and .kicad_dru.
# Defined BEFORE routing (kicad-pcb golden rule 3).

fab_tier: jlc_4layer_advanced  # KRT fanout emits 0.25/0.15 vias -> JLC advanced small-via option REQUIRED

classes:
  SWITCH_NODE:
    intent: >
      Buck half-bridge to inductor. Highest dV/dt, full inductor current
      (6A rail A / 7.5A rail B). Primary EMI aggressor.
    nets: [SW_A, SW_B]
    current: 7.5A
    min_width: 0.3mm          # backstop; trunk is a POUR
    routing: >
      F.Cu pour above the GND pour, minimal area, tight FET-inductor loop.
      Controller SW-sense/BST/ILIM taps route thin inside named tap areas.
    verify: >
      pour covers FET source pads + inductor pad; single island (check
      island-to-island unconnected); no gate trace slicing the pour.
    exemptions:
      - {area: SW_TAP_A, min_width: 0.15mm, why: gate-drive/sense taps incl. grid-A tap runs, not trunk}
      - {area: SW_TAP_B, min_width: 0.15mm, why: same, rail B}

  PWR_RAIL:
    intent: >
      Battery path and 5V rails. Trunk on In2 planes / F.Cu pours; these
      nets also carry mA sense taps (FB dividers, UVLO ladder), hence the
      low floor. 5V_C carries 6A to the USB-C pads; 5V_A carries 7.5A to
      the TPS2557 bank.
    nets: [VBATT_RAW, VBATT_F, FE_MID, VSW, 5V_A, 5V_C]
    current: 9A max (VBATT_F worst case)
    min_width: 0.25mm
    routing: planes for distribution; F.Cu pours for FE and rail necks
    verify: walk each net end-to-end for min cross-section; DRC floor
    exemptions:
      - {area: SW_TAP_A, min_width: 0.15mm, why: controller VIN/sense necks, mA-scale}
      - {area: SW_TAP_B, min_width: 0.15mm, why: same, rail B}
      - {area: FE_TAP, min_width: 0.15mm, why: LM74800 FE_MID sense joins; trunk is the pour+B bond}

  VBUS:
    intent: USB-A port power, limited to 2.5A by its TPS2557.
    nets: [VBUS1, VBUS2, VBUS3]
    current: 2.5A
    min_width: 0.5mm
    routing: short direct runs switch->connector, 1.2mm nominal
    verify: DRC floor

# Everything else is Default (signals). Any net >1A outside a class is a bug.
