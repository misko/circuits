  18: AGNDP
  19: VCCP2I                # internal PLL reg out - 1u
  20: XTO
  21: XTI
  22: AGNDX
  23: VCCXI                 # internal osc reg out - 1u
  24: TEST0                 # tie GND
  25: TEST1                 # leave OPEN
  26: DGND
  27: VDDI                  # internal digital reg out - 1u; also the D+ pullup + SEL0/1 reference
