load_cases:
  - id: pcb_retention
    description: PCB bearing, handling, and M3 retention load normal to the base.
    direction_local: [0, 0, -1]
    application: PCB bearing lands and screw heads.
    reaction: Four tapered H1-H4 standoff roots into the foundation deck.
  - id: case_preload
    description: Axial preload from one or more case screws.
    direction_local: [0, 0, -1]
    application: Lid screw-head seats.
    reaction: Lid webs, base posts, inserts, and foundation.
  - id: case_twist
    description: One-corner tightening or chassis twist.
    direction_local: [1, 0, 0]
    application: Roof and one closure ear.
    reaction: Remaining closure webs and base-post roots.
  - id: lid_removal
    description: Sleeve binding, post misalignment, or manual lid-pry load.
    direction_local: [0, 1, 0]
    application: Lid roof and D9.8 post sleeves.
    reaction: Tangent closure webs and D9 base posts.
  - id: connector_mate_unmate_ns
    description: Repeated axial mate/unmate reaction from the north SMA bank and south USB-C port while the PCB is clamped to H1-H4; connector and PCB capacity remain unquantified.
    direction_local: [0, 1, 0]
    application: J1-J4 and J9-J10 connector bodies, solder joints, and ground tabs through the PCB.
    reaction: Opposed H1-H4 screw clamps and tapered PCB-pillar roots only; no open enclosure wall or connector body is credited as a case support.
  - id: connector_mate_unmate_ew
    description: Repeated axial mate/unmate reaction from the east/west SMA banks while the PCB is clamped to H1-H4; connector and PCB capacity remain unquantified.
    direction_local: [1, 0, 0]
    application: J5-J8 connector bodies, solder joints, and ground tabs through the PCB.
    reaction: Opposed H1-H4 screw clamps and tapered PCB-pillar roots only; no open enclosure wall or connector body is credited as a case support.
  - id: connector_cable_pull_bend
    description: Conservative out-of-plane cable pull, bend, and handling moment from simultaneously serviced SMA/USB-C leads; cable, connector, and PCB capacity remain unquantified.
    direction_local: [0, 0, 1]
    application: Representative mated J1-J10 cable and strain-relief reactions transmitted through the PCB.
    reaction: Mixed bearing, shear, and uplift at all four H1-H4 screw clamps and tapered PCB-pillar roots; open connector edges provide no reaction.
  - id: sma_hand_tool_torque
    description: Hand-tightening and wrench/tool torque at J2-J10 represented by the resulting PCB twist/uplift couple; the direction is informational and no connector, solder, or PCB strength is inferred.
    direction_local: [0, 0, 1]
    application: Coupling-nut and tool reaction at the nine SMA launches transmitted into the PCB.
    reaction: Opposed H1-H4 clamp and tapered pillar-root reactions only; the roof-only case contributes no connector-side wall support.
  - id: print_warp
    description: Differential FDM shrink/warp represented as a root-separating load case.
    direction_local: [0, 0, 1]
    application: Broad deck/roof faces.
    reaction: Printed pillars, posts, bosses, and closure-web roots.
  - id: antenna_reaction
    description: Axial reaction from the two-screw RX2 antenna hood.
    direction_local: [0, 0, 1]
    application: Hood screw columns and lid insert bosses.
    reaction: Lid roof, four closure webs, four base case-post roots, and foundation.
  - id: antenna_lateral
    description: Lateral antenna/cable handling reaction.
    direction_local: [1, 0, 0]
    application: Antenna hood, locator rails, and screw columns.
    reaction: Hood roof, lid bosses, roof plate, four closure webs, four base case-post roots, and foundation.
  - id: antenna_insertion
    description: Straight bottom-loading and removal force at the compliant locator keys while the hood is detached from the lid and both antenna-mount screws are absent.
    direction_local: [0, 0, -1]
    application: Roof-hung locator/key rails.
    reaction: Detached hood roof and screw columns only; no lid closure or base-post reaction is credited during this operation.
