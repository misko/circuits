external_subjects:
  - id: antenna_candidate_contract
    role: antenna_envelope_candidate
    source:
      path: source/reference/antenna-adapter-candidate-contract.json
      sha256: 7216c66e11570ef15cae2ddbce997de38267b7aa436a46bf0531abc7bc66dc5c
      size: 6293
    authority:
      grade: conservative_candidate
      basis: Reviewed machine contract for the pillar-only base, conservative L-shaped antenna envelope, and user-requested D8.50 key/D9.55 aperture fit candidate; none measures the production antenna.
      excluded_claims: [exact_geometry, physical_fit]
  - id: fit_adjustment_request
    role: antenna_fit_adjustment
    source:
      path: source/reference/fit-adjustment-2026-08-27.json
      sha256: a862d5d7eaf339b9589780eb9d3f39cfc15eeb077b8483f37ce8b2eba5d1f315
      size: 1158
    authority:
      grade: conservative_candidate
      basis: User-requested 1.25 mm total reductions from the predecessor key gap, mouth, and upright-hole diameter; elastic insertion and physical fit are not established.
      excluded_claims: [exact_geometry, physical_fit]
  - id: holder_reference_stl
    role: holder_design_inspiration
    source:
      path: source/reference/user-antenna-holder-reference.stl
      sha256: a1e74e1611c6b9027d5c63d88bc9293ca1ad833619e40cb52d8556bd1cd1030f
      size: 14303684
    authority:
      grade: inspiration_only
      basis: User-supplied compliant holder used only to understand bottom loading and an L-shaped retention topology; it is not an antenna solid.
      excluded_claims:
        - exact_geometry
        - clearance
        - physical_fit
        - manufacturing_dimensions
  - id: holder_measurement
    role: holder_derived_measurement
    source:
      path: source/reference/antenna-holder-measurement.json
      sha256: 7c096deaa74e1234206329f3040c67124715363128a0dd763aa832a369139194
      size: 8172
    authority:
      grade: derived_measurement
      basis: Reproducible measurements of the supplied holder mesh and its compliant D9.75 grip, D11.75 mouth, and R1 lead-in; dimensions do not measure the production antenna.
      excluded_claims: [physical_fit]
verification_scopes:
  - id: shell
    description: Pillar-only open base and roof-only lid bound to the immutable PCB/STEP; four full-height tangent closure webs use D14 south and collision-limited D12 north roots while J1-J10 keep continuously open connector-facing edges, J11/J12 keep an edge-open notch, and the fabricated board's intrinsic flush SMA faces and dense pitch remain unsolved.
    required: true
    depends_on: []
  - id: board_retention
    description: Four PCB screws retain a board seated on four dedicated supports independently of four external case screws/posts.
    required: true
    depends_on: [shell]
  - id: antenna_accessory
    description: Separately printed top adapter accepts the full prewired right-angle antenna through its rectangular underside and uses the tightened D8.50 key plus D9.55 upright aperture as intentional physical-fit candidates before two-screw mounting.
    required: true
    depends_on: [shell]
  - id: thermal
    description: Installed enclosure behavior under the representative RF-switching and USB-powered load case.
    required: true
    depends_on: [shell]
installed_parts:
  - id: pcb
    role: pcb
    source: {kind: subject, id: pcb}
    scopes: [shell, board_retention, thermal]
  - id: base
    role: base
    source: {kind: generated, id: base}
    scopes: [shell, board_retention, antenna_accessory, thermal]
  - id: lid
    role: lid
    source: {kind: generated, id: lid}
    scopes: [shell, antenna_accessory, thermal]
  - id: antenna_mount
    role: accessory
    source: {kind: generated, id: rx2_antenna_mount}
    scopes: [antenna_accessory]
  - id: antenna
    role: accessory
    source: {kind: external_subject, id: antenna_candidate_contract}
    scopes: [antenna_accessory]
fastener_policy:
  axis_disjoint_tolerance_mm: 0.1
  pcb_retained_with_lid_removed: true
fastener_groups:
  - id: pcb_screws
    role: board_retention
    axes:
      - {id: h1, origin_mm: [-40.0, 27.5, 0.0], direction: [0, 0, 1]}
      - {id: h2, origin_mm: [40.0, 27.5, 0.0], direction: [0, 0, 1]}
      - {id: h3, origin_mm: [-40.0, -27.5, 0.0], direction: [0, 0, 1]}
      - {id: h4, origin_mm: [40.0, -27.5, 0.0], direction: [0, 0, 1]}
    retained_parts: [pcb, base]
    hardware:
      thread: M3-0.5
      screw_length_mm: 6.0
      minimum_engagement_mm: 4.0
      minimum_tip_clearance_mm: 0.2
  - id: case_screws
    role: case_closure
    axes:
      - {id: c1, origin_mm: [-49.0, -36.5, 0.0], direction: [0, 0, 1]}
      - {id: c2, origin_mm: [49.0, -36.5, 0.0], direction: [0, 0, 1]}
      - {id: c3, origin_mm: [-49.0, 36.5, 0.0], direction: [0, 0, 1]}
      - {id: c4, origin_mm: [49.0, 36.5, 0.0], direction: [0, 0, 1]}
    retained_parts: [base, lid]
    hardware:
      thread: M3-0.5
      screw_length_mm: 6.0
      minimum_engagement_mm: 4.0
      minimum_tip_clearance_mm: 0.2
  - id: antenna_mount_screws
    role: accessory
    axes:
      - {id: m1, origin_mm: [-22.0, 8.0, 0.0], direction: [0, 0, 1]}
      - {id: m2, origin_mm: [22.0, 8.0, 0.0], direction: [0, 0, 1]}
    retained_parts: [lid, antenna_mount]
    hardware:
      thread: M3-0.5
      screw_length_mm: 8.0
      minimum_engagement_mm: 4.0
      minimum_tip_clearance_mm: 0.2
clearance_cases:
