schema: 1

product:
  function: receive_only_one_of_eight_rf_selector
  source_port_count: 1
  antenna_port_count_selected: 8
  maximum_simultaneously_selected_antennas: 1
  switch_part: PE42482A-X
  switch_class: true_absorptive_solid_state_sp8t
  architecture_status: approved_D8

locked:
  rf_band_hz: [100000000, 5900000000]
  impedance_ohm: 50
  rf_connector:
    family: SMA
    gender: female_jack
    orientation: right_angle_through_hole
    part: 901-143-6RFX
    status: agent_assumption_D9_review_before_footprint_freeze
  pcb_fabricator: JLCPCB
  receive_only: true
  operating_rf_input_dbm_max: 0
  survival_rf_input_dbm_max: 2.5
  survival_limit_basis: AD9363_absolute_max_damage_ceiling_not_operating_target
  control:
    controller_location: onboard
    controller_part: STM32C011F4P6
    controller_supply_V: 3.3
    operation: autonomous
    live_pluto_control_link_assumed: false
    state_inference: downstream_from_dwell_timing
    firmware_update: SWD_target_power_sense_no_power_injection
    manual_override_required: false
    status_output_required: false
  power_input:
    connector_family: USB_Type_C
    connector_part: USB4105-GF-A-120
    operating_voltage_V: [4.75, 5.5]
    nominal_voltage_V: 5
    load_budget_A: 0.020
    independent_from_pluto_plus: true
    usb_data: false
    usb_pd: false
    active_overvoltage_cutoff: false_by_user_requirement
  fabrication:
    tier: jlc_4layer_advanced
    stackup: JLC04161H-7628
    thickness_mm: 1.6
    reason: PE42482A-X_0.5mm_QFN_three_worst_side_escapes_fail_standard_escape_gate

control_protocol:
  status: approved_agent_lock_at_D8_checkpoint
  adr: 01_docs/decisions/0002-autonomous-dwell-coded-control.md
  fixed_order: [ANT1, ANT2, ANT3, ANT4, ANT5, ANT6, ANT7, ANT8]
  active_dwell_ms: {ANT1: 80, ANT2: 105, ANT3: 135, ANT4: 170, ANT5: 210, ANT6: 255, ANT7: 305, ANT8: 360}
  active_duration_tolerance_pct: 5
  all_off_guard_ms: 5
  frame_marker: {state: ALL_OFF, body_nominal_ms: 500, contiguous_pre_ANT1_guard_ms: 5, observable_nominal_ms: 505, decoder_min_ms: 475}
  nominal_cycle_ms: 2160
  downstream_observation_window_ms_min: 4320
  downstream_observation_window_ms_recommended: 4500
  startup: "passive ALL_OFF throughout reset; first active ANT1 follows a 500ms marker body plus its contiguous 5ms guard"
  watchdog_brownout: "IWDG enabled; BOR level 4; reset/tri-state returns to passive ALL_OFF"
  decoder_failure_state: unknown

rf_acceptance_targets:
  grade: provisional_engineering_targets_not_part_guarantees
  selected_path_insertion_loss_db_max: {at_or_below_1GHz: 2.0, at_5_9GHz: 3.5}
  path_balance_db_max: 1.5
  common_to_off_isolation_db_min: {at_or_below_4GHz: 30, at_5_9GHz: 25}
  active_return_loss_db_min: 10
  validation_required: VNA_first_article_all_paths_and_required_off_states

open_requirements:
  - exact_board_outline_mounting_holes_and_enclosure
  - exact_Pluto_RX_port_cable_length_and_loss
  - final_SMA_edge_order_and_operator_labels
  - order_quantity_and_JLC_uploader_allocation_echo
  - final_impedance_solver_geometry_and_coupon
  - available_VNA_fixture_calibration_kit_and_retained_data_format

power_claims: []
no_external_power_outputs: true

pipeline_gate:
  architecture_approved: true
  exact_parts_approved: true
  interface_contracts_complete: true
  schematic_generation_permitted_after_stage_pause: true
  pcb_generation_permitted: false
