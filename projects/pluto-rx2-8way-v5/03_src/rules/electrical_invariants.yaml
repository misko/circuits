invariants:
  - id: E-ONEHOT
    requirement: "U1 control word may select zero or one RF throw, never more than one"
    enforcement: "PE42482 binary truth table plus firmware state table; transitions pass through ALL_OFF"
  - id: E-RESET-SAFE
    requirement: "U1 is ALL_OFF while U2 is reset, unpowered, brownout-reset, watchdog-reset, programming or tri-stated"
    enforcement: "R3 pulls V4 high; R4-R6 pull V1-V3 low; LS is hard-tied GND; BOR4 resets U2 above U1's 2.3V minimum"
    caveat: "switch state below 2.3V VDD is not guaranteed and no RF performance is claimed while unpowered"
  - id: E-GPIO-ORDER
    requirement: "firmware preloads PA3..PA0=1000 before those pins become outputs"
    enforcement: firmware_review_and_logic_analyzer_test
  - id: E-TYPEC-SINK
    requirement: "CC1 and CC2 each have one independent 5.1k Rd to GND"
    enforcement: schematic_exact_net_assertion
  - id: E-NO-USB-DATA
    requirement: "J1 D+, D-, SBU1 and SBU2 contacts are no-connect"
    enforcement: schematic_explicit_no_connect_and_netlist_review
  - id: E-NO-BACKFEED
    requirement: "No board net carries power to or from Pluto; SWD cannot inject operating power"
    enforcement: interface_and_connector_review
  - id: E-RF-DC
    requirement: "every U1 RF pin and external SMA center is 0V DC"
    enforcement: schematic_connectivity_and_bringup_DMM_check

