schema: 1
rf:
  enabled: true
  rationale: "receive-only one-of-eight 50ohm selector covering the requested 100MHz-5.9GHz band"
  risk_tier: microwave
  risk_basis: "5.9GHz performance depends on the QFN escape, nine SMA launches, stackup, return paths and coupling"
  process:
    profile: rf-module-v1
    context_policy: clean_room
    geometry_policy: blocking

  topology:
    direction: receive_only
    common_ports: 1
    selected_throws: 8
    maximum_active_throws: 1
    legal_selected_count: [0, 1]
    switch_part: PE42482A-X
    class: true_absorptive_solid_state_sp8t
    status: approved_D8

  ports:
    - id: PLUTO_RX_COMMON
      nets: [RF_COMMON]
      band_hz: [100000000, 5900000000]
      z0_ohm: 50
      launch: "901-143-6RFX right-angle through-hole SMA launch at J2"
      termination: "selected PE42482 RFC path into the external 50ohm Pluto RX interface"
      reference_layer: "solid In1.Cu L2 ground"
      reference_plane: SMA_mating_plane
    - id: ANTENNA_THROWS
      nets: [RF_ANT1, RF_ANT2, RF_ANT3, RF_ANT4, RF_ANT5, RF_ANT6, RF_ANT7, RF_ANT8]
      band_hz: [100000000, 5900000000]
      z0_ohm: 50
      launch: "identical 901-143-6RFX right-angle through-hole SMA launches at J3-J10"
      termination: "one selected PE42482 absorptive throw; seven off-state ports terminated internally by the switch"
      reference_layer: "solid In1.Cu L2 ground"
      reference_plane: SMA_mating_planes

  cross_sections:
    - id: RF_50R_TOP_CPWG
      status: locked
      stackup_source: "JLCPCB JLC04161H-7628 published four-layer stackup; order-time stackup echo remains required"
      solver: "official JLCPCB impedance calculator returned 49.971863887ohm for the locked geometry; retained inputs/results are in 06_build/impedance/jlc04161h-7628-rf-50r-cpwg.json and require order-time field-solver confirmation"
      copper_layer: F.Cu
      reference_layer: In1.Cu
      dielectric_height_mm: 0.2104
      dk: 4.4
      target_z0_ohm: 50
      width_mm: 0.295
      gap_mm: 0.2

  layout_constraints:
    route:
      nets: [RF_COMMON, RF_ANT1, RF_ANT2, RF_ANT3, RF_ANT4, RF_ANT5, RF_ANT6, RF_ANT7, RF_ANT8]
      layer: F.Cu
      reference_layer: In1.Cu
      width_mm: 0.295
      gap_to_top_ground_mm: 0.20
      maximum_vias_per_net: 0
      maximum_stubs_per_net: 0
      length_matching: "not required; selected paths are used one at a time and first-article loss balance, not phase equality, is the acceptance metric"
      geometry: "one shortest collision-clean line/arc centreline per switch-to-SMA connection; tangent rounded turns, no meanders and no unnecessary parallel runs"
      bend_policy:
        minimum_radius_width_multiple: 3.0
        source_claim_ids: [ADI-RF-BEND-RADIUS-3W]
        exceptions: []
    ground_fence:
      status: "required after the actual RF centrelines exist; ordinary rectangular board stitching is not proof"
      source: "Analog Devices Layout Guidelines for MMIC Components states that CPWG ground holes should be separated by lambda/20 or less; Analog Devices RF & Mixed-Signal PCB Layout Guidelines recommends fences on both sides of CPWG and an unbroken underlying ground plane"
      source_urls:
        - https://www.analog.com/media/en/technical-documentation/application-notes/layout_guidelines_for_mmic_components.pdf
        - https://www.analog.com/en/resources/technical-articles/pcbs-layout-guidelines-for-rf--mixedsignal.html
      wavelength_basis: "guided wavelength from the retained JLC calculator effective dielectric constant: 299.792458/(5.9*sqrt(3.13660852672)) = 28.691 mm"
      maximum_along_route_pitch_mm: 1.40
      pitch_derivation: "round down from lambda_g/20 = 1.435 mm"
      nominal_via_mm: {size: 0.45, drill: 0.20}
      nominal_lateral_center_offset_mm: 0.70
      maximum_lateral_center_offset_mm: 1.10
      lateral_offset_basis: "clears the 0.295-mm trace by more than the adopted 0.20-mm copper gap while retaining close top-ground-to-L2 bonds; exact accepted offsets must be measured and, if treated as part of the impedance model, field-solved"
      endpoint_structures:
        - refs: [U1]
          maximum_along_route_span_mm: 1.60
          basis: "measured saved copper: every RF land exits package-normal for at most 1.60mm beside alternating U1 perimeter GND lands, each joined directly into pad 25 and its filled/capped 3x3 ground-via field; the route-following hole fence begins at the end of this package-owned return field"
        - refs: [J2, J3, J4, J5, J6, J7, J8, J9, J10]
          maximum_along_route_span_mm: 3.94
          basis: "901-143-6RFX realized footprint geometry: the inward pair of 2.80mm plated GND pads is centered 2.54mm along the package-normal RF centreline from the signal-pin centre and its copper continues another 1.40mm inward, so the exact connector-owned span ends at 3.94mm; external fence aperture grading begins at that saved copper edge rather than inventing vias inside the footprint"
      coverage: "both flanks from each SMA ground-post launch to the U1 ground-via/ground-pad field, allowing only geometry-proven package/connector return structures as fence elements"
      verify: "saved-board route-aware fence gate; declared pitch or attempted-via count cannot certify collision-rejected realized geometry"

  performance_claims:
    - id: RF-IL
      claim: "each assembled selected path meets the provisional insertion-loss envelope"
      acceptance: "S21 loss <=2.0dB through 1GHz and <=3.5dB at 5.9GHz"
      evidence: "first-article calibrated VNA S21 measurement for all eight selected paths at SMA mating planes"
    - id: RF-BALANCE
      claim: "selected-path loss remains sufficiently balanced for downstream comparison"
      acceptance: "maximum insertion-loss spread across the eight paths <=1.5dB at each retained test frequency"
      evidence: "first-article all-path VNA sweep and machine-readable path-balance calculation"
    - id: RF-ISOLATION
      claim: "off-state coupling remains below the provisional receiver-analysis limit"
      acceptance: "common-to-off isolation >=30dB through 4GHz and >=25dB at 5.9GHz in every required state"
      evidence: "first-article calibrated VNA isolation sweeps with unused ports terminated in 50ohm"
    - id: RF-RETURN
      claim: "every active assembled signal path has an acceptable impedance match"
      acceptance: "active-path input and output return loss >=10dB across 100MHz-5.9GHz"
      evidence: "first-article calibrated VNA S11 and S22 sweeps for all eight paths"

  first_article:
    measurements:
      - "calibrated S21 for every selected path from 100MHz through 5.9GHz"
      - "calibrated S11 and S22 for every selected path"
      - "common-to-off isolation for all required switch states and antenna-to-antenna spot checks"
      - "path-balance calculation from retained Touchstone data"
      - "control-state timing captured with an independent timebase"
    acceptance:
      - "all four performance_claims pass at the SMA mating-plane reference planes"
      - "no unmeasured path or required off state may be inferred from another path"
      - "results outside the official AD9363 band are article-specific and never described as ADI-guaranteed"

  reviews:
    schematic:
      path: 08_reviews/rf_schematic.md
      artifact: 04_kicad/pluto_rx2_8way_v5.kicad_sch
      requirements: [RF-SCH-TOPOLOGY, RF-SCH-PINMAP, RF-SCH-DC, RF-SCH-DEFAULT]
      evidence:
        - {role: rf_source_bundle, path: 06_build/rf/source/bundle.json}
    pcb:
      path: 08_reviews/rf_pcb.md
      artifact: 04_kicad/pluto_rx2_8way_v5.kicad_pcb
      requirements: [RF-PCB-STACKUP, RF-PCB-IMPEDANCE, RF-PCB-LAUNCHES, RF-PCB-RETURN, RF-PCB-COUPLING]
      evidence:
        - {role: rf_realized_bundle, path: 06_build/rf/realized/bundle.json}
    fab:
      path: 08_reviews/rf_fab.md
      artifact: 06_build/fab/pluto_rx2_8way_v5_gerbers.zip
      requirements: [RF-FAB-STACKUP, RF-FAB-COPPER, RF-FAB-DRILLS, RF-FAB-FIRST-ARTICLE]

  switch_interface:
    mode: binary_LS_low
    mcu_mapping: {PA0: V1, PA1: V2, PA2: V3, PA3: V4}
    gpio_nibble_order: PA3_PA2_PA1_PA0_equals_V4_V3_V2_V1
    passive_default: {V4: pull_up_10k, V3: pull_down_10k, V2: pull_down_10k, V1: pull_down_10k, result: ALL_OFF_1000}
    transition: "write ALL_OFF, wait 5ms guard, write exactly one approved antenna code"
    caveat: "passive ALL_OFF is guaranteed only while U1 VDD remains inside 2.3V-5.5V"

  receiver_rating_tension:
    physical_transceiver_silicon: AD9363
    software_profile: AD9361
    official_ad9363_rating_hz: [325000000, 3800000000]
    desired_selector_band_hz: [100000000, 5900000000]
    official_ad9363_rx_absolute_max_dbm: 2.5
    out_of_official_ad9363_band_operation: user_accepted_D5
    prior_5_8GHz_use: user_reported_inherited_not_independently_measured
    complete_system_ADI_guarantee_claim: forbidden
