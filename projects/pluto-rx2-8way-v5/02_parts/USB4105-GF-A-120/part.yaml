gotchas:
  - "This board is a sink-only power consumer: use separate 5.1k Rd resistors on CC1 and CC2; never short the two CC pins."
  - "A6/B6, A7/B7 and A8/B8 remain explicit no-connects because v5 has no USB data or alternate mode."
  - "Retain all duplicated VBUS/GND contacts and all shell stakes in the custom footprint."
