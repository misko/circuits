gotchas:
  - "RF pins require 0 VDC. No blocking capacitors are required only because this receive-only board deliberately supplies 0 VDC at every RF port."
  - "LS has an internal 1Mohm pull-up; tie LS directly to GND for the four-bit binary truth table."
  - "Use an external V4 pull-up and V1/V2/V3 pull-downs so tri-stated controls produce ALL_OFF. The passive guarantee applies only while switch VDD is within 2.3V-5.5V."
  - "At 4-6GHz the data-sheet maximum insertion loss is path-dependent and reaches 2.3dB; board launches and traces add to it."
