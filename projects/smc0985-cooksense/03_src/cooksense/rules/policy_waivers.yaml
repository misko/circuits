- id: P-SILK-OWN
  why: >-
    FIVE misowned labels reported, and ALL FIVE are an artifact of the gate's
    CENTROID-TO-TEXT-CENTRE metric on parts with large bodies. Re-measured
    2026-07-29 on 04_kicad/cooksense.kicad_pcb by an INDEPENDENT method — box
    EDGE-TO-EDGE gap, text bounding box against footprint bounding box (pads +
    graphics, GetBoundingBox(False, False)) — which is the distance a human
    reading the fabricated board actually judges by, and which the gate's own
    text acknowledges it wants ("waive with the measured pair of distances").
    Every number below is from that re-measure, and the gate's own numbers are
    quoted beside them so the disagreement is visible rather than hidden.
      (1) J_ISOLOOP / 'ISO 30V' — gate: 9.641 mm own vs J_DOOR 7.844 mm.
          EDGE: own **0.561 mm** vs J_DOOR **1.060 mm** -> J_ISOLOOP OWNS IT by
          +0.499 mm. Same for 'NOT SELV': EDGE own 1.936 vs J_DOOR 2.092. The
          centroid measure is wrong here BY CONSTRUCTION: J_ISOLOOP is a KF350
          4-pole block whose body spans x[191.57, 199.22], so its centroid sits
          ~4 mm from the edge the caption is printed against. THE ONE HAZARD
          LABEL ON THIS BOARD IS OWNED BY ITS OWN TERMINAL, and that is the
          finding that matters in this row.
      (2) TP_RKEY / 'KEYPAD ISOLATION COMB   >=6mm creepage   NO GND BOND' —
          gate: 5.701 own vs TP_DSEL 5.408. EDGE: own **0.000 mm** (the boxes
          overlap) vs TP_DSEL **2.406 mm** -> TP_RKEY OWNS IT by +2.406 mm.
      (3) TP_USEL / 'cooksense  SMC0985KS  sidecar v1.7' — gate: 6.946 own vs
          TP_DSEL 4.610. EDGE: **1.304 mm to BOTH** — an exact tie, because this
          is the BOARD-IDENTIFICATION caption centred on the north edge between
          the two select test points. It names the board, not a connector; there
          is no "own part" for it to be nearer to, and nobody wires anything by
          reading a revision string.
      (4) TP_PGOOD / '5V SELV IN' — gate: 8.429 own vs F1 3.833. EDGE: own
          4.472 vs F1 **1.008**. F1 IS THE CORRECT SUBJECT: the caption names
