# policy_audit waivers — cooksense. Each REQUIRES measured evidence in `why`
# (>=40 chars; canon M4). Read by skills/kicad-pcb/scripts/policy_audit.py.
# Schema: list of {id, why}.

- id: P-ADJ
  why: >-
    BOARD-WIDE-RAIL keep_short budgets are geometrically unreachable by P-ADJ's
    max-pairwise-pad-span metric, which charges the ENTIRE rail net to the
    budget declared for a LOCAL decoupling cap. Three violations, all measured on 04_kicad/cooksense.kicad_pcb 2026-07-23
    (spans ~150mm, +-2mm across stochastic legalize runs; pad COUNTS are stable):
      (1) 3V3 span ~149-151mm > 5mm (AMS1117-3.3 layout: "COUT >=22uF hard against
          VOUT") — 3V3 is the whole-board digital rail feeding 60 pads across
          the 154mm sidecar (every 595/238/HC14/1G-family/MCP23017/watchdog/
          one-shot VCC + decoupler + the AMS output). No placement shrinks it.
      (2) 3V3 span ~149-151mm > 5mm (SN74HC238DR layout: "0.1uF VCC-GND bypass hard
          against the package") — same 60-pad rail; the budget is the per-'238
          bypass, not the rail.
      (3) 5V_PROTECTED span ~150mm > 8mm (AMS1117-3.3 layout: "CIN local to
          VIN") — 5V_PROTECTED is the whole-board protected rail (14 pads: eFuse
          OUT, bulk CE1, LDO IN, Q_COIL source, comparator VCC, loadcell feed,
          TP), spanning power(NW) to analog(SW).
    The ELECTRICAL INTENT each budget encodes — the local cap mounted hard
    against the pin — IS honoured, verified pad-to-pad on the board:
      * AMS1117 COUT C_LDOOUT(3V3) <-> U_LDO VOUT(pad2/4) = 3.12mm  (<5mm)
      * AMS1117 CIN  C_LDOIN(5V_P) <-> U_LDO VIN(pad3)     = 3.00mm  (<8mm)
      * '238 bypass  C_DECU/C_DECD(3V3) <-> U_DECU/D VCC   = 4.89mm  (<5mm)
      * every IC 0.1uF decoupler sits 2-5mm from its package (audit_board.py
        I-PROX gate, PASS: 26 proximity checks).
    The span metric cannot distinguish the 3mm local cap from the rail's 151mm
    reach; there is no per-IC input/output net to measure a local span on (the
    same limitation crow-recorder-central recorded for its board-wide buck VIN,
    07_releases/v1.0/.../redteam_layout L2). The rails ride the generate_rules
    DRU floors (PWR_3V3 0.3mm, PWR_IN 0.5mm) and pours, not a keep-short trace.

- id: P-ADJ-UNREACHED
  why: >-
    A SEPARATE waiver with its OWN evidence, deliberately NOT folded into the
    P-ADJ waiver above — `policy_audit.py` says in its own source that letting
    the existing P-ADJ waiver absorb these would be "a waiver silently widening
    past its evidence", and that is exactly what this entry refuses to do.
    THE COMPLETE CENSUS, MEASURED on 04_kicad/cooksense.kicad_pcb 2026-07-28:
    **37 keep_short budgets declared across 02_parts, 12 graded, 25 unreached.**
    Every row is enumerated in verification/padj_unreached_census.md — no
    sampling, no "and others". The 25 split into exactly three causes:
      (A) RAIL-PIN BUDGETS, 13 of 25 (`VCC` x4, `VDD` x2, `VREF`, `N3V3`,
          `3V3_DIGITAL`, `+5V`, `5V_SELV`, and the two MCP entries). These are
          per-instance LOCAL budgets ("0.1uF bypass hard against THIS package")
          written as a PIN name. Renaming them to this board's rail is NOT a
          fix, it is a FAKE GRADE, and that is measured rather than asserted:
          the rail they would resolve to is `3V3` at **76 pads / ~150 mm span**,
          which the P-ADJ waiver above already documents as geometrically
          unreachable by a max-pairwise-pad-span metric. Renaming would convert
          13 honest "never evaluated" into 13 instant violations absorbed by an
          existing waiver — strictly worse evidence than saying so here.
      (B) REFERENCE-DESIGN NET NAMES on FITTED parts, 7 of 25 (`HS_GATE` x2,
          `OPTO_LED`, `EN_OVLO_N`, `ILM`, `dVdt`, `T_PLUS`/`T_MINUS`/`BIAS`).
          These name a genuinely LOCAL relationship that this board DOES have
          under a different net name. MEASURED, so the reader can see exactly
          what the rename would have scored: HS_GATE -> `HS_GATE_COIL` 10.169mm,
          `SWG_A` 4.128, `SWG_B` 6.445, `SWG_RHA` 6.445, `SWG_RHE` 7.429 (budget
          6); OPTO_LED -> `OPTO_LED_A` 5.722 (budget 6, PASSES); EN_OVLO_N ->
          `EF_OVLO` 8.473, ILM -> `EF_ILM` 6.982, dVdt -> `EF_DVDT` 4.524
          (budgets 5); +5V -> `5V_IN` 18.106 (budget 10); 5V_SELV -> `5V_RPP`
          15.581 (budget 3); T_PLUS/T_MINUS -> `TC_POS` 13.640 / `TC_NEG` 8.967
          (budget 5, and the SAME two nets already grade PASS against
          PCC-SMP-K's 20 mm budget). NOT renamed in this release: a rename
          without a re-place trades 7 unreached for 10 violations on a placement
          this revision did not author, and re-placing invalidates a route that
          measures DRC 0/0/0 — that is a design pass, not a seal step.
      (C) PARTS NOT FITTED on this board, 5 of 25 (`AQY212GS`, `SN74HC138DR`,
          `SN74HC139DR`, `LM393DR`, `SN74LVC1G123DCTR` x2). Their budgets cannot
          resolve because the part is not on the board. `LM393DR` is the
          superseded comparator (v1.3 moved to the LMV393, whose IDENTICAL
          budgets DO grade and PASS); `SN74LVC1G123DCTR` is the superseded
          one-shot (v1.7 uses the CD74HC221's second section instead).
    THE ELECTRICAL INTENT IS VERIFIED BY A DIFFERENT INSTRUMENT (canon M1), so
    this is not an unmeasured hole: `audit_board.py`'s I-PROX gate PASSES 28
    proximity checks over this board, measuring every IC decoupler 2-5 mm from
    its own package pin, pad-to-pad — which is the fact the class-(A) budgets
    were written to assert and which a whole-rail span metric structurally
    cannot see. The class-(B) local spans are given above, measured.
    OWED, and reported rather than applied (this agent may not edit skills/):
    P-ADJ needs a per-INSTANCE budget form (`<ref-pattern> pin <n> -> <part>
    within <x> mm`) so a local decoupling rule stops being expressed as a net
    name. Until it exists, class (A) cannot be stated truthfully in the schema.

- id: P-PLANE
  why: >-
    The 6 tracks on the In1 reference plane are ALL net=GND — same-net GND-pour
    island BRIDGES emitted by stitch heal_islands, not foreign-net intrusions that
    would SPLIT the plane. MEASURED on 04_kicad/cooksense.kicad_pcb 2026-07-23
    (all six: net=GND, w=0.30mm, len 0.66-0.69mm, on In1.Cu, clustered x102-139
    y94-97): each bridges two GND fill islands the pour left separated by a
    <=0.30mm neck (heal gaps 0.26-0.29mm), reconnecting the ONE GND plane net.
    P-PLANE's intent is that a reference plane must not be cut by SIGNAL copper
    (which raises return-path impedance / splits the plane); a GND-on-GND bridge is
    the OPPOSITE — it heals the plane. There is no cross-net track on In1 (verified:
    0 non-GND In1 tracks). DRC is 0 shorts / 0 unconnected with these present, and
    the GND net is a single connected body (heal_islands: GND 7->1 island).

- id: R-POUR
  why: >-
    The four PWR_IN-class 5V nets (5V_IN, 5V_FUSED, 5V_PROTECTED, 5V_RPP) are
    distributed as TRACKS, not pours, and that is ampacity-sufficient. MEASURED
    min widths on 04_kicad/cooksense.kicad_pcb 2026-07-23: 5V_IN / 5V_FUSED /
    5V_PROTECTED = 0.500mm (the PWR_IN DRU floor); 5V_RPP = 0.250mm ONLY at the
    TPS259573 WSON-8 0.5mm-pitch pad entry (scoped floor efuse_padentry — the eFuse
    PIN is the current bottleneck, not the trace; the 5V_RPP trunk is 0.5mm outside
    that neck). Ampacity of 0.5mm @ 1oz(35um) external copper (IPC-2221): ~1.4A at
    10C rise, ~1.9A at 20C rise. Worst-case CONTINUOUS board draw is <1A: the safety
    interlock energizes at most 1 U-coil + 1 D-coil + PRESS at once (5V_KEY_RELAY
    iout_max 0.15A per power_tree.yaml) + logic 0.3A + sensors 0.05A ~= 0.5A; the
    2.0A figure in power_tree is the un-reachable absolute ceiling (all 12 coils, which
    the interlock forbids). The TPS259573 eFuse programmable ILIM current-limits and
    caps any fault. R-POUR expects power POURS as an ampacity heuristic; here the 5V
    runs are short hops from the NW power-entry cluster to local loads at >=0.5mm,
    for which a pour is not required. (GND + 3V3 DO ride inner planes; only the 5V
    protected-input branch is track-distributed.)

# --- SILK SEVERITY: transparency, not a silent blanket ignore (runbook step 5,
#     2026-07-23). The .kicad_pro carries silk_over_copper / silk_edge_clearance /
#     silk_overlap / text_thickness = `ignore` (so R-DRC = 0/0/0). This is NOT the
#     fleet standard (which is silk DE-COLLISION + evidenced per-class waivers); this
#     seal carries an EVIDENCED exception, each class documented below, backstopped by
#     the fresh-context RENDER + POLARITY review (orchestrator verify stage) which must
#     confirm NO functional/movable silk remains after the ANALOG SENSE relocation.
#     NOTE: these SILK-* ids are DOCUMENTATION (policy_audit has no per-class DRC-warning
#     waiver yet — fleet harvest #44); they make the ignore transparent + auditable.
- id: SILK-OVER-COPPER
  why: >-
    silk_over_copper ignored: the reed-relay DIP body-outline silk overlays the THT
    reed pads inherent to the DIP05-1A72-13L footprint (12 relays) — the outline is
    the assembly body marker, unavoidable over the part's own pads; no OTHER-part or
    functional silk is over copper. Real silk-over-PAD was caught + fixed separately
    (ANALOG SENSE label relocated off U_ADC pads 1&16). Render-review backstops.
- id: SILK-EDGE-CLEARANCE
  why: >-
    silk_edge_clearance ignored: the 252x92mm board packs dense edge connectors
    (Micro-Fit, JST-GH x N, Pi header, terminal blocks) whose refdes/functional silk
    sits near the milled edge by necessity; all labels remain legible and inside the
    board. Render-review confirms no clipped/off-board text.
- id: SILK-OVERLAP
  why: >-
    silk_overlap ignored: residual refdes/label overlaps in the dense connector +
    ADC-cluster regions after the de-collision pass; none obscures a polarity/pin-1
    or functional marker (render-review backstop). Cosmetic legibility only.
- id: SILK-TEXT-THICKNESS
  why: >-
    text_thickness ignored. THE ORIGINAL TEXT OF THIS WAIVER ("0.15mm stroke =
    JLCPCB's silk floor") WAS TRUE OF JLC'S PUBLISHED PAGE AND FALSE OF THIS
    BOARD, and the gap is exactly what let six safety designators ship at
    0.130 mm: `fix_silk_placement.py` was emitting `max(0.13, height * 0.2)`,
    and `text_thickness` being `ignore` meant nothing measured it.
    WHAT IS TRUE, ADR-0007 (2026-07-29): KiCad clamps silk stroke to
    <= 0.25 x text height, so JLC's published 0.150 mm REQUIRES >= 0.600 mm
    text; `fab_tiers.yaml`'s enforced height floor is 0.45 mm and its stroke
    floor is therefore **0.1125 mm**, which is what 0.45 mm text actually
    prints at. Both numbers now come from the same evidence (boards ordered at
    these floors), instead of being two floors that could not both be met.
    THE CLASS IS NOW MEASURED, NOT WAIVED: `fix_silk_placement.py` sets every
    silk stroke to 0.25 x height and re-measures all of it from the saved
    board — 249/249 texts at or above 0.1125 mm, 0 storing an unachievable
    stroke, and 10/10 SAFETY texts at h 0.600 / stroke 0.150. The DRC class
    stays `ignore` because KiCad grades it against the .kicad_pro's own
    `min_text_thickness` rather than against the fab tier, but the property it
    would have tested is now gated in source and fails the build loudly.

- id: S-OCCL
  refs: ["03_tscircuit/kicad/cooksense.kicad_sch"]
  why: >-
    The occlusions (count varies run-to-run — 77/78/79 observed, because the
    converter mints fresh UUIDs and label bboxes shift; it is NOT a stable
    figure and should not be quoted as one) are label-vs-reference/label bbox
    overlaps in the tscircuit
    CONVERTER .kicad_sch — per ADR-0002 + the 03_tscircuit contract that file is
    the MACHINE artifact (ERC / netlist / --schematic-parity; "need not be
    pretty"); the HUMAN schematic this board ships is tscircuit's own
    collision-free render (03_tscircuit/build/schematic.pdf -> release
    pdf/schematic.pdf). Same waiver class as sealed crow-recorder-central-v2 and
    crow-mic-pod-v2. Evidence, not rationale: the fresh-context RENDER REVIEW
    (06_build/verification/render_review.md, 2026-07-23) inspected ALL 77
    pre-batch occlusion sites individually at 12 px/mm — zero dangerous
    (wrong-wire-attachment) instances. The pre-seal batch re-layout shifted the
    set 77 -> 78 (21 added / 20 removed, same three cosmetic classes on
    unchanged circuitry); the only two pairs owned by NEW batch parts were
    re-MEASURED with the audit's own bbox model: label DECU_G1 x Ref R_DECUPD
    and label DECD_G1 x Ref R_DECDPD are both 4.17 x 0.04 mm edge-kisses — the
    review's "pure noise" class (~28 of the 77 were identical 0.04 mm kisses).
    Readability is NOT waived — it is graded on the shipped tscircuit render.

- id: S-VER
  refs: ["06_build/verification/pin_review.md"]
  why: >-
    The 8 flagged part.yaml entries carry verified: notes without a
    figure/page citation string. The waiver rests on the MACHINE pin checks
    recorded in 06_build/verification/pin_review.md (v1.3, 2026-07-26):
    pin_audit.py over 74 dossiers, audit_board I-POL 18 polarity checks,
    kicad-cli schematic-parity 0, and E-INV 83/83 — NOT on a narrative group
    review. That file is EXPLICIT that its narrative review is
    INCOMPLETE/carried-from-v1.0 and "should not be read as" coverage; this
    waiver does not claim otherwise (an earlier revision of this text cited a
    "5/5 groups, 0 confirmed pin-map defects" pin review that the file it names
    does not contain — corrected here). On top of those machine checks, each
    pinout is re-DERIVED against the named source per part:
    SN74HC595DR (TI SCLS041J, SER/SRCLK/RCLK + QH' daisy chain), 2N7002
    (Diodes DS11303 G/S/D, 5 instances), AO3401A (S/D/G re-derived, 6
    instances incl. reverse-block orientation), ULN2803ADWR (IN/OUT
    corner-pairing all 8ch, COM rail), SN74HC14DR (all 6 inverters traced),
    LTV-817S-TA1 (817-family invariant pinout, vendor-invariant basis stated
    in the review), X9555WV IDC (standard 2.54 2x16 odd/even grid + jlc_twin
    pad-grid check vs JLC CAD), GZ2012D601TF (2-pad unpolarized ferrite;
    polarity N-A, asserted by audit I9). The commodity 2/3-pad entries
    (2N7002/AO3401A/GZ2012) additionally ride the board-generator + audit_board
    I-POL polarity gate (18 checks PASS).

