- id: P-SILK-FN
  refs: [J_ISOLOOP, J_THERM_B, J_LOADCELL, J_TC, J_KEY_MATRIX, J_PWR,
         J_ESTOP, J_RH_AMBIENT, J_RH_EXHAUST,
         TP_3V3, TP_5VKR, TP_5VP, TP_ALLOW, TP_ENCL, TP_ESTOP, TP_FAULT,
         TP_SPARE, TP_TCDRDY, TP_TCFAULT, TP_TCTH, TP_TEMPOK, TP_WDOK]
  why: >-
    NEW FAILURE ON A NEWLY-SIGHTED GATE, AND THAT IS THE POINT. Until
    2026-07-28 P-SILK-FN's default pattern was `^(J|F|TP)[0-9]`, which demands a
    DIGIT immediately after the prefix; this board names its touchpoints
    `J_ESTOP` / `TP_WDOK`, so the gate matched exactly ONE ref of 36 (`F1`) and
    could only ever report PASS. The pattern is now `^(J|F|TP)([0-9]|_)`, the
    graded set went 1 -> 31, and the gate immediately FAILED on 23 of them. A
    gate that has just learned to see is exactly the wrong moment to assume its
    complaint is noise — so the complaint was MEASURED before being waived.

    WHAT THE CHECK ACTUALLY TESTS: it looks only at board-level `PCB_TEXT` on a
    silk layer and asks whether one lies within `8 mm + half the part diagonal`
    of each connector/fuse/test point. It CANNOT SEE FOOTPRINT REFERENCE TEXT.
    Its premise is a board whose designators are opaque (`J1`, `TP7`), where a
    separate caption is the only thing that says what the touchpoint is. That
    premise is INVERTED here: this board's designator IS the functional label,
    which is the same naming convention that made the old pattern blind.

    MEASURED on the v1.7 board (`04_kicad/cooksense.kicad_pcb`), all 23:
      * 23 of 23 carry a VISIBLE refdes ON A SILK LAYER. **THE STROKE CLAUSE
        OF THIS WAIVER WAS FALSE AND IS CORRECTED HERE RATHER THAN QUIETLY
        REWRITTEN.** As first written on 2026-07-28 it said the refs carry
        "a 0.13-0.15 mm stroke — at or above the `jlc_4layer_advanced`
        legibility floor". They did not, and there was no floor they could
        have been at or above: `fab_tiers.yaml` then declared
        `min_silk_text_height: 0.45` AND `min_silk_stroke: 0.15` together,
        which KiCad makes UNSATISFIABLE (it clamps stroke to <= 0.25 x height,
        so 0.45 mm text carries at most 0.1125 mm). Six SAFETY designators on
        this very board were sitting at 0.130 mm while this sentence called
        that acceptable. ADR-0007 (2026-07-29) set `min_silk_stroke` to
        **0.1125** and stated the corollary: reaching JLC's published 0.150
        needs >= 0.60 mm text.
        RE-MEASURED on the v1.7 board after the ADR-0007 silk pass, and this
        time against a floor that can be met: **249 of 249 visible silk texts
        carry stroke = 0.25 x height exactly, 0 below the 0.1125 mm tier floor,
        0 storing a stroke KiCad would clamp away**, and all 10 members of the
        SAFETY-TEXT class (the four safety connectors, every label printed
        within 8 mm of a safety housing, and the ADR-0018 interlock parts) are
        at h 0.600 / stroke 0.1500 — JLC's published floor. Of the 23 refs
        here, 13 sit at h 0.60 and the rest at h 0.45 / 0.1125.
        Refs NOT legibly on silk: **NONE**.
      * 11 of 23 name a net the part physically touches, matched
        underscore-insensitively against the netlist: TP_3V3->3V3,
        TP_5VP->5V_PROTECTED, TP_ESTOP->ESTOP_OK, TP_FAULT->FAULT,
        TP_TEMPOK->TEMP_OK, TP_WDOK->WD_OK, TP_TCDRDY->TC_DRDY_N,
        TP_TCFAULT->TC_FAULT_N, J_ESTOP->ESTOP_RAW, J_TC->TC_NEG_IN.
        (v1.8/ADR-0025: `J_DOOR->DOOR_RAW` is struck — J_DOOR is removed from the
        netlist, so 10 of 22 now name a net they touch. The DENOMINATOR MOVED and
        is restated rather than left stale: the graded set drops from 23 refs to
