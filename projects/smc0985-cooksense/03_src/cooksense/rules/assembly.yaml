# cooksense (MAIN board) — ASSEMBLY intent. Canon A-POP + A-STOCK.
# Seeded from skills/pcb-design/templates/03_src/rules/assembly.yaml (2026-07-25).
#
# THE INCIDENT THIS FILE CLOSES IS THIS BOARD'S OWN. cooksense v1.0 AND v1.1
# both sealed with 13 CPL placement rows whose BOM line carries a BLANK LCSC
# (J_TC + the twelve K_* Standex reed relays): JLC was told to machine-place 13
# parts it cannot source, while the v1.1 MANIFEST declared 12 of the 13
# `not_assembled` and J_TC nowhere at all. The machine instruction and the
# paperwork contradicted each other and every gate was green, because until
# A-POP landed nothing compared them. v1.2 fixes it in SOURCE: the 13 refs
# carry `exclude_from_pos_files` (floorplan.yaml placement pattern), they are
# declared here with a DATED catalog measurement, and the release MANIFEST's
# `not_assembled:` line is GENERATED from this file as a bare refdes list.

# ---- SERVICE DECLARATION ----------------------------------------------------
service: standard          # JLC standard SMT assembly, as ordered for v1.0/v1.1.
sides: [top]               # MEASURED on the v1.2 board: 220 footprints, 0 on
                           # B.Cu (placement histogram, assembly_coverage.py).
                           # Single-sided assembly is a deliberate cost choice;
                           # the isolation comb and the plane band both assume
                           # a clear bottom side.
fiducials: none            # DELIBERATE, not silence. JLC adds panel fiducials on
                           # their own rails for SMT orders. No LOCAL fiducials
                           # are placed because the finest pitch on this board is
                           # 0.5 mm (TPS259573 WSON-8) / 0.65 mm (MCP23017 SSOP-28)
                           # — both well above the <=0.4 mm pitch at which local
                           # fiducials stop being optional. Nothing on the board
                           # is a fine-pitch BGA/QFN of that class.
build_quantity: 5          # JLCPCB's minimum PCB fabrication quantity for this
                           # 188x92 mm 4-layer board. A-STOCK grades every coded,
                           # placed line at stock >= qty x 5. v1.0/v1.1 declared
                           # "quantity: 1 (prototype bring-up)"; grading at 5 is
                           # the strictly more conservative bar and matches what
                           # the fab actually produces.

