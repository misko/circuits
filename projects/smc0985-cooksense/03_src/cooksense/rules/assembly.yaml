#      FP_EXCLUDE_FROM_BOM; no pads, no part). MEASURED: H1..H4.
# TP = bare probe pads, no part. MEASURED: 17 (TP_3V3 TP_5VKR TP_5VP TP_ALLOW
#      TP_DSEL TP_ENCL TP_ESTOP TP_FAULT TP_PGOOD TP_RKEY TP_SPARE TP_TCDRDY
#      TP_TCFAULT TP_TCTH TP_TEMPOK TP_USEL TP_WDOK).
