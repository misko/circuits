           TAB PAD SIZE, the term the residual is blind to (RG-P2-2).
           *** THE 'MATCHES THE CLONE EXACTLY' READING IS REFUTED. CORRECTED
           2026-07-30, ADR-0028 pass, from a MEASURED sweep of JLC's cached CAD
           plus a live EasyEDA fetch. DO NOT RESTORE IT. ***

             pad set        board            genuine C265111   clone C42376901
             8 signal       0.600 x 1.700    0.600 x 1.700     0.700 x 1.800
             2 tabs         1.000 x 2.700    1.210 x 2.700     1.000 x 2.500

           The board DISAGREES with the clone on all eight signal pads AND on
           tab LENGTH (2.700 vs 2.500). It matches the clone on tab WIDTH alone
           — 1 of 10 pads' full geometry — so the old sentence had it backwards:
           the board is the GENUINE land on 8 of 10 pads and differs from BOTH
           vendors on the tabs.
           CLASS SWEEP, which is what settles it: JLC's own models for the
           sibling JST GH parts C189896 (SM05B) and C2683602 (SM10B) are
           1.000 x 2.700 — EXACTLY our land. Two of three vendor models in the
           same family agree with this board; only C265111 differs, by 0.210 mm
           of tab width. **THE OUTLIER IS JLC'S MODEL, NOT OUR BOARD.**
           WHAT SURVIVES THE CORRECTION, unchanged: the tab is 17.4 % narrower
           than JLC's C265111 land, and that is a RETENTION derate on a pad
           whose function is mechanical strain relief, not a connection. It
           stays UNRESOLVED and it stays shippable as UNRESOLVED. What does NOT
           survive is the RATIONALE — 'we match the clone, so choosing the clone
           is free' was the sentence doing the reassuring, and it was false. A
           refuted rationale under a correct verdict is exactly the shape canon
           M4 calls an inherited defect.
           WHAT IS **NOT** MEASURED, stated plainly because it is the part that
           matters: pad correspondence is not MATE compatibility. The pods are
           third-party SHT45 modules on genuine GH pigtails, and the SHOU HAN
           describe string differs from JST's on body material (LCP vs PA9T),
           colour (beige vs white) and voltage rating (125 V vs 50 V — higher,
           so not a concern in itself). **Whether a genuine GHR-08V plug seats
           and RETAINS in a SHOU HAN shroud is UNVERIFIED**, on the two
           connectors that carry the thermistor pods, and ADR-0024's pod-mismate
           analysis is written about the GH FAMILY's geometry — a clone shroud is
           outside what it measured.
           THE SEAL POSITION, DECIDED (B30-01, user, 2026-07-30): **the sealed
           BOM names the GENUINE C265111 and the substitution is documented as
           an ORDER-TIME PATH.** The reasoning, so it is not re-litigated:
             - Choosing the clone NOW would bake an UNVERIFIED mechanical
               retention risk into a sealed, immutable release, on the
               thermistor-pod connectors, and buy nothing — nobody is ordering
               today.
             - Choosing not_assembled forces a BOARD REGENERATION for a sourcing
               problem: `exclude_from_pos_files` plus a new copper revision's
               worth of verification, on a 1.25 mm 8-circuit SMD header that is a
               harder hand-solder than any of the 14 refs already hand-fit.
             - Naming the genuine part preserves BOTH options at zero cost,
               because the fab set does not move under either.
           So the line stays ON the CPL with its genuine JST code, ORDER_README
           section 5-0 carries the buyer-facing block (live numbers, the MOQ-
           exceeds-stock fact, the measured drop-in AND the unverified retention
           check), and A-STOCK is satisfied by THIS ENTRY'S MEASURED NUMBER AND
           DATE — never by the claim that stock will return."

# ---- EXEMPT REFDES CLASSES -------------------------------------------------
