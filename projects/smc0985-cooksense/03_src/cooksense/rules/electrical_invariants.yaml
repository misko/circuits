    why: "THE FREEWHEEL PATH, ASSERTED. The twelve DIP05-1A72-13L coils have NO external flyback diode — the driver's internal OUTPUT->COMMON clamp (datasheet p.2 equivalent circuit, anode at OUTPUT, cathode at COMMON, VF <= 2.0 V at 350 mA p.5) is their ONLY clamp. It was verified from the FIGURE, not inferred from the pin name, because a DMOS array WITHOUT it would have made this a topology change and not a drop-in. COMMON must sit on the SWITCHED coil rail, not on 5V_PROTECTED, so a gated-off rail still clamps coil kick: put this pin on the ungated rail and every energised coil's kick returns through a diode into a rail the safety chain has just deliberately killed"
