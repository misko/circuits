# cooksense ELECTRICAL-INVARIANTS (canon E-INV, phase E1 = netlist-only).
#
# Design INTENT made EXECUTABLE against the exported netlist. Every other gate proves
# self-consistency; THIS proves the netlist matches what the ADRs decided. Graded by
# electrical_invariants.py against 06_build/netlists/cooksense.net. Net names are the
# CANONICAL KiCad names (the TSX author-prefix N is stripped: N5V_* -> 5V_*). Pins are
# REF.PAD (physical pad number). Each invariant cites the ADR that emitted it (E-ADR).
#
# Protection/topology ADRs that MUST be covered (E-ADR): 0001 (topology), 0002
# (topology+protection), 0006 (protection). All three are cited below.

invariants:

  # ===== ADR-0001 — input protection topology + eFuse OVLO (power chain) =========
  - assert: series_chain
    chain: [5V_IN, F1, 5V_FUSED, Q_REV, 5V_RPP]
    through: {Q_REV: [3, 2]}          # AO3401A pad3=DRAIN (input side) -> pad2=SOURCE (load side)
    adr: "0001"
    why: "5V SELV input -> polyfuse F1 -> reverse-polarity P-FET Q_REV (DRAIN->SOURCE) -> reverse-protected input 5V_RPP"

  - assert: pin_on_net
    pin: "U_EFUSE.5"                   # TPS259573 pad5 = OUT
    net: 5V_PROTECTED
    adr: "0001"
    why: "the eFuse OUTput is the 5V_PROTECTED rail — the protection stage sits in the power path, not a stub"

  - assert: pin_on_net
    pin: "D_REVCLAMP.1"                # SS34 pad1 = CATHODE
    net: 5V_FUSED
    adr: "0001"
    why: "reverse-crowbar cathode DOWNSTREAM of the polyfuse (pin review Q2, 2026-07-23): the reverse fault current path supply->J_PWR->F1->clamp->GND must pass THROUGH F1 so the polyfuse trips; on 5V_IN (upstream) the clamp current bypassed the fuse and was bounded only by the supply"

  - assert: pin_on_net
    pin: "U_EFUSE.6"                   # TPS259573 pad6 = FLT_N (open-drain, LOW=fault)
    net: EFUSE_FLT_N
    adr: "0001"
    why: "the eFuse fault flag rides the HONESTLY-NAMED net EFUSE_FLT_N (renamed from PWR_GOOD_N, pin review Q1 2026-07-23: FLT_N is LOW=fault i.e. HIGH=power-good, so a _N power-good name inverted the sense; consumers are software-read only — R_PG pullup, TP_PGOOD, expander GPA0)"

  - assert: net_has_part
    net: DECU_G1_RAW
    part_type: resistor
    min: 1
    adr: "0006"
    why: "the U-decoder's enable REQUEST line has a pull-DOWN (pin review Q4 2026-07-23; v1.2 moved it to the RAW net, ADR-0011 §5b): when SR_OE_N tri-states the 595s it is the RAW net that floats — out-of-spec for CMOS inputs and a phantom-select hazard; the gated DECU_G1 is driven push-pull by U_DECUEN and cannot float"

  - assert: net_has_part
    net: DECD_G1_RAW
    part_type: resistor
    min: 1
    adr: "0006"
    why: "the D-decoder's enable REQUEST line has a pull-DOWN — same phantom-select hazard closure as DECU_G1_RAW (v1.2: moved to the RAW net, ADR-0011 §5b)"

  - assert: net_has_part
    net: EF_OVLO
    part_type: resistor
    min: 2
    adr: "0001"
    why: "the TPS259573 programmable OVLO divider EXISTS on EN_OVLO_N (R_OVT + R_OVB) — this is the brief §3.5 over-voltage CUTOFF (flag 2)"

  - assert: net_has_part
    net: 5V_PROTECTED
    part_type: capacitor
    min: 1
    adr: "0001"
    why: "the protected rail carries bulk + ceramic decoupling (CE1 220uF + C_IN1/C_IN2)"

  # ===== ADR-0002 — safety AND-chain gates the coil rail (no-MCU HW enforcement) =
  - assert: pin_on_net
    pin: "U_AND3.4"                    # SN74LVC1G11 pad4 = Y (final AND output)
    net: KEY_RELAY_ALLOWED
    adr: "0002"
    why: "the 3rd cascaded 3-input AND (AND1·AND2·FAULT_LATCH_CLEAR) OUTPUT is KEY_RELAY_ALLOWED — the whole 7-condition chain terminates here"

  - assert: series_chain
    chain: [5V_PROTECTED, Q_COIL, 5V_KEY_RELAY]
    through: {Q_COIL: [2, 3]}          # AO3401A pad2=SOURCE (5V_PROTECTED) -> pad3=DRAIN (coil rail)
    adr: "0002"
    why: "the coil rail 5V_KEY_RELAY is reachable ONLY through the high-side switch Q_COIL (SOURCE->DRAIN); ANY AND-chain condition false turns Q_COIL off and the rail dies"

  - assert: pin_on_net
    pin: "Q_COILDRV.1"                 # 2N7002 pad1 = GATE
    net: COIL_EN
    adr: "0002"
    why: "the coil-rail switch driver Q_COILDRV is gated by COIL_EN = KEY_RELAY_ALLOWED THROUGH the Manual/Auto DPDT pole A (physical MANUAL rail cut, brief §3)"

  - assert: pin_on_net
    pin: "U_ONESHOT.13"                # CD74HC221 pad13 = 1Q (v1.2, ADR-0011 §6)
    net: PRESS_TIMED
    adr: "0002"
    why: "the one-shot Q output is PRESS_TIMED — the hardware <=436ms worst-case (<500ms) PRESS cap, independent of the Pi; v1.2 swapped the RETRIGGERABLE 1G123 for the NON-retriggerable CD74HC221 so the cap is a HARD bound"

  - assert: pin_on_net
    pin: "U_ULNB.3"                    # ULN2803 #B pad3 = IN3 (K_PRESS channel input)
    net: PRESS_TIMED
    adr: "0002"
    why: "the K_PRESS coil driver input is driven ONLY by the one-shot output PRESS_TIMED — a hung Pi cannot hold PRESS beyond the one-shot window"

  - assert: pin_on_net
    pin: "U_WD.1"                      # TPS3823 pad1 = RESET_N (push-pull, high=OK)
    net: WD_OK
    adr: "0002"
    why: "the external watchdog supervisor RESET_N is WD_OK — heartbeat loss / brown-out drops it (flag 1: TPS3823 is the coarse ~1.6s WD, not the fast PRESS timer)"

  - assert: pin_on_net
    pin: "U_AND1.3"                    # SN74LVC1G11 #1 pad3 = B
    net: WD_OK
    adr: "0002"
    why: "WD_OK is an input of the AND-chain (U_AND1.B) — the watchdog directly gates the coil rail"

  - assert: pin_on_net
    pin: "K_U1.4"                      # DIP05 reed relay tsx pad4 = CONTACT_A (keypad side)
    net: U_SEL_BUS
    adr: "0002"
    why: "the reed-relay CONTACT (keypad side) sits on the ISOLATED keypad net U_SEL_BUS, while its COIL (pad1) sits on the SELV-logic rail 5V_KEY_RELAY — the two domains meet ONLY across the relay's 1.5kV coil/contact barrier, no shared copper (brief §7, ADR-0001). Full >=6mm creepage + no-shared-GND is the geometric/audit half (E2)"

  # ===== ADR-0006 — reed relay matrix: K_PRESS bridges U_SEL -> D_SEL via RKEY ====
  - assert: series_chain
    chain: [U_SEL_BUS, K_PRESS, RKEY_MID, R_KEY, D_SEL_BUS]
    through: {K_PRESS: [4, 3]}         # DIP05 tsx pad4=CONTACT_A (U side) -> pad3=CONTACT_B (RKEY side)
    adr: "0006"
    why: "K_PRESS bridges the selected U bus to the selected D bus THROUGH the RKEY solder-select resistor (0R default, field 0/22/47/100/220/470/1k) — the emulation-resistance path of the matrix selector (T1)"

  # ===== ADR-0010 — Pi 5 native-I2C pin map (v1.2, review F1) ====================
  # Every I2C net pinned to its VERIFIED header pin (RP1 datasheet fsel table +
  # kernel i2c*-pi5 overlays, 2026-07-24). A silent remap fails the schematic gate.
  - assert: pin_on_net
    pin: "J_PI.3"                      # phys 3 = GPIO2 = I2C1_SDA
    net: I2C_SDA
    adr: "0010"
    why: "MCP23017 control bus on I2C1 SDA (GPIO2, the arm I2C default)"
  - assert: pin_on_net
    pin: "J_PI.5"                      # phys 5 = GPIO3 = I2C1_SCL
    net: I2C_SCL
    adr: "0010"
    why: "MCP23017 control bus on I2C1 SCL (GPIO3)"
  - assert: pin_on_net
    pin: "J_PI.7"                      # phys 7 = GPIO4 = I2C2_SDA
    net: SDA_A
    adr: "0010"
    why: "bus A (cam A 0x33 + ambient SHT45 0x44) SDA on the RP1 I2C2 SDA pin"
  - assert: pin_on_net
    pin: "J_PI.29"                     # phys 29 = GPIO5 = I2C2_SCL
    net: SCL_A
    adr: "0010"
    why: "bus A SCL on the RP1 I2C2 SCL pin (this pin was KEY_DATA in <=v1.1)"
  - assert: pin_on_net
    pin: "J_PI.8"                      # phys 8 = GPIO14 = I2C3_SDA
    net: SDA_B
    adr: "0010"
    why: "bus B (cam B 0x33 + exhaust SHT45 0x44) SDA on the RP1 I2C3 SDA pin (dtoverlay i2c3-pi5,pins_14_15; UART0 console disabled)"
  - assert: pin_on_net
    pin: "J_PI.10"                     # phys 10 = GPIO15 = I2C3_SCL
    net: SCL_B
    adr: "0010"
    why: "bus B SCL on the RP1 I2C3 SCL pin"
  - assert: pin_on_net
    pin: "J_PI.36"                     # phys 36 = GPIO16 (no I2C/boot function)
    net: KEY_DATA
    adr: "0010"
    why: "KEY_DATA re-homed off GPIO5/phys29 (now bus A SCL) onto a plain GPIO"
  - assert: pin_on_net
    pin: "J_PI.37"                     # phys 37 = GPIO26 (no I2C function)
    net: STOP_REQ
    adr: "0010"
    why: "STOP_REQ is a DIRECT Pi GPIO (ADR-0011 §5): it must not sit behind the frozen KEY_LATCH or a tri-stated 595"
  - assert: pin_on_net
    pin: "J_RH_AMBIENT.3"
    net: SDA_A
    adr: "0010"
    why: "the ambient SHT45 pod SHARES bus A with camera A (addresses 0x33/0x44 disjoint) — the RH nets SDA_RHA/SCL_RHA are deleted"
  - assert: pin_on_net
    pin: "J_RH_EXHAUST.3"
    net: SDA_B
    adr: "0010"
    why: "the exhaust SHT45 pod SHARES bus B with camera B"

  # ===== ADR-0011 — v1.2 safety-chain corrections (reviews F2/F3/F4/F5) ==========
  - assert: pin_on_net
    pin: "U_FAULTAND.6"                # 1G11 pad6 = C input
    net: TEMP_OK
    adr: "0011"
    why: "TEMP_OK is IN the fault-latch SET condition (was tied N3V3 in <=v1.1): a thermal trip LATCHES until temps drop + manual re-arm, it cannot silently self-clear"
  - assert: pin_on_net
    pin: "U_CAND2.4"                   # 1G11 pad4 = Y
    net: CONTACTOR_DRV
    adr: "0011"
    why: "the contactor opto LED is driven by the GATED CONTACTOR_DRV, not raw CONTACTOR_REQ"
  - assert: pin_on_net
    pin: "R_OPTOLED.1"
    net: CONTACTOR_DRV
    adr: "0011"
    why: "the LED series resistor hangs off the gate output — CONTACTOR_REQ alone can no longer light the opto"
  - assert: pin_on_net
    pin: "U_CAND1.1"
    net: WD_OK
    adr: "0011"
    why: "contactor permission requires WD_OK (hardware)"
  - assert: pin_on_net
    pin: "U_CAND1.3"
    net: ESTOP_OK
    adr: "0011"
    why: "contactor permission requires ESTOP_OK (redundant with the physical contact-B loop break)"
  - assert: pin_on_net
    pin: "U_CAND1.6"
    net: TEMP_OK
    adr: "0011"
    why: "contactor permission requires TEMP_OK — a thermal fault now drops the external contactor in hardware (review F3b's core demand)"
  - assert: pin_on_net
    pin: "U_CAND2.3"
    net: FAULT_LATCH_CLEAR
    adr: "0011"
    why: "a LATCHED fault holds contactor permission off until manual re-arm"
  - assert: pin_on_net
    pin: "K_STOP.1"                    # DIP05 tsx pad1 = COIL_A (+)
    net: 5V_STOP
    adr: "0011"
    why: "K_STOP's coil rides the ALWAYS-AVAILABLE 5V_STOP rail, NOT the fault-gated 5V_KEY_RELAY — the one relay that answers a fault must survive the fault (review F3c). Asserting the pin ON 5V_STOP also proves it is NOT on the key-relay rail"
  - assert: series_chain
    chain: [5V_PROTECTED, R_STOPRAIL, 5V_STOP]
    adr: "0011"
    why: "5V_STOP derives from 5V_PROTECTED through its own link — present whenever the board is powered, gated by nothing"
  - assert: pin_on_net
    pin: "Q_STOPDRV.1"                 # 2N7002 pad1 = GATE
    net: STOP_REQ
    adr: "0011"
    why: "K_STOP has a DEDICATED driver from STOP_REQ (not a ULN channel whose COM/flyback sits on the switched key rail)"
  - assert: pin_on_net
    pin: "U_ONESHOT.3"                 # CD74HC221 pad3 = 1R_N (reset)
    net: OS_CLR_N
    adr: "0011"
    why: "the PRESS one-shot clear is the GATED OS_CLR_N = DOOR_OK · STOP_REQ_N — STOP preemption clears an in-flight press (was DOOR_OK only in <=v1.1, review F4)"
  - assert: pin_on_net
    pin: "U_OSCLR.1"
    net: DOOR_OK
    adr: "0011"
    why: "door-open still aborts the press (brief §3: open => abort, release PRESS)"
  - assert: pin_on_net
    pin: "U_OSCLR.3"
    net: STOP_REQ_N
    adr: "0011"
    why: "STOP_REQ (inverted) is the second clear condition"
  - assert: pin_on_net
    pin: "U_DECUEN.4"
    net: DECU_G1
    adr: "0011"
    why: "the U-decoder enable passes through the STOP gate: DECU_G1 = DECU_G1_RAW · STOP_REQ_N — STOP force-disables the U selector"
  - assert: pin_on_net
    pin: "U_DECDEN.4"
    net: DECD_G1
    adr: "0011"
    why: "the D-decoder enable passes through the STOP gate — STOP force-disables the D selector"
  - assert: pin_on_net
    pin: "U_LATCHG.4"
    net: KEY_LATCH_G
    adr: "0011"
    why: "the 595 RCLK is the FROZEN latch KEY_LATCH_G = KEY_LATCH · PRESS_TIMED_N: selector addresses cannot change while K_PRESS is closed (review F5b)"
  - assert: pin_on_net
    pin: "U_SR1.12"                    # 595 pad12 = RCLK
    net: KEY_LATCH_G
    adr: "0011"
    why: "the register latches ONLY through the freeze gate"
  - assert: pin_on_net
    pin: "U_ONESHOT.4"                 # CD74HC221 pad4 = 1Q_N
    net: PRESS_TIMED_N
    adr: "0011"
    why: "PRESS_TIMED_N comes from the one-shot's own Q-bar — the freeze window is exactly the press window by construction"
  # --- §7 deterministic pulls, with DIRECTION proven by the resistor's far pin ---
  - assert: pin_on_net
    pin: "R_HOSTAUTHPD.2"
    net: GND
    adr: "0011"
    why: "HOST_AUTH pulls DOWN (authorization false) while the Pi is un-driven"
  - assert: pin_on_net
    pin: "R_HOSTAUTHPD.1"
    net: HOST_AUTH
    adr: "0011"
    why: "the pull-down actually sits on HOST_AUTH"
  - assert: pin_on_net
    pin: "R_MCUENPD.1"
    net: MCU_RELAY_ENABLE
    adr: "0011"
    why: "MCU_RELAY_ENABLE pulled down — AND-chain false + SR_OE_N high at boot"
  - assert: pin_on_net
    pin: "R_MCUENPD.2"
    net: GND
    adr: "0011"
    why: "direction: DOWN"
  - assert: pin_on_net
    pin: "R_KRSTPD.1"
    net: KEY_RESET_N
    adr: "0011"
    why: "KEY_RESET_N pulled down = SRCLR asserted: registers held CLEARED during Pi boot (was noted as floating in the v1.1 order instructions)"
  - assert: pin_on_net
    pin: "R_KRSTPD.2"
    net: GND
    adr: "0011"
    why: "direction: DOWN"
  - assert: pin_on_net
    pin: "R_RAENAPD.1"
    net: RAIL_EN_A
    adr: "0011"
    why: "sensor rail A enable pulled down (rail off) while the expander is in reset"
  - assert: pin_on_net
    pin: "R_RAENBPD.1"
    net: RAIL_EN_B
    adr: "0011"
    why: "sensor rail B enable pulled down"
  - assert: pin_on_net
    pin: "R_RAENRHAPD.1"
    net: RAIL_EN_RHA
    adr: "0011"
    why: "RH-A rail enable pulled down"
  - assert: pin_on_net
    pin: "R_RAENRHEPD.1"
    net: RAIL_EN_RHE
    adr: "0011"
    why: "RH-E rail enable pulled down"
  - assert: pin_on_net
    pin: "R_CTRREQPD.1"
    net: CONTACTOR_REQ
    adr: "0011"
    why: "CONTACTOR_REQ pulled down — contactor request false while the expander is un-driven"
  - assert: pin_on_net
    pin: "R_CTRREQPD.2"
    net: GND
    adr: "0011"
    why: "direction: DOWN"
  - assert: pin_on_net
    pin: "R_STOPPD.1"
    net: STOP_REQ
    adr: "0011"
    why: "STOP_REQ pulled down — STOP relay open, decoders/one-shot ungated at boot"
  - assert: pin_on_net
    pin: "R_REARMPU.1"
    net: REARM_N
    adr: "0011"
    why: "REARM_N pulled UP — a floating re-arm line must NOT clear the fault latch (REARM_N is active-low)"
  - assert: pin_on_net
    pin: "R_REARMPU.2"
    net: 3V3
    adr: "0011"
    why: "direction: UP (to 3V3) — the one pull whose direction inverts the others'"

  # --- §8 THE WATCHDOG MUST BITE WHEN THE PI IS ABSENT (P0, 2026-07-25) --------
  # This is the invariant whose ABSENCE was the P0. The de-energization intent
  # ("Pi crash (WD) -> contactor DROPPED", ADR-0011 truth table) lived only in ADR
  # prose; no gate could see it, so a WD_PET net with exactly two nodes (J_PI.11
  # and U_WD.4) passed every check while the board held the cooking contactor
  # energised forever with the Pi unplugged. An ADR that emits no invariant is the
  # E-ADR failure the canon names — so the intent is pinned here THREE ways: the
  # net carries a resistor at all, and both of that resistor's pins are named, so
  # the DIRECTION (down, not up) is proven and a future edit cannot quietly make
  # it a pull-UP (which would restore the fault exactly).
  - assert: net_has_part
    net: WD_PET
    part_type: resistor
    min: 1
    adr: "0011"
    why: "WD_PET (the TPS3823 WDI heartbeat) MUST carry a pull resistor, and it MUST be 1k — SLVS165O §7.3.4 names that value explicitly ('place a 1kOhm resistor from WDI to ground') because §6.5 gives I_IL at WDI = 140 typ / 190 max uA: the pin SOURCES that much, so a 100k pull-down cannot hold it low and the supervisor keeps petting itself. E-INV phase E1 has no part_value kind, so this assertion pins the resistor's EXISTENCE and (below) its DIRECTION; the VALUE is guarded by ADR-0011 §8, the tsx comment, and a mandatory bring-up bench check (GPIO17 to input -> TP_WDOK must fall within 2.5 s). TPS3823-33DBVR part.yaml pin 4: 'if left floating the device self-pulses (WD effectively disabled)'. With J_PI unplugged or the Pi off, a bare WD_PET floats -> the supervisor never times out -> WD_OK stays HIGH -> U_CAND1(WD_OK,ESTOP_OK,TEMP_OK) and U_CAND2(...,CONTACTOR_REQ) both hold, the MCP23017 CONTACTOR_REQ latch retains its last written value (EXP_RST_N has no driver), and the EXTERNAL COOKING CONTACTOR STAYS ENERGISED INDEFINITELY. That falsifies ADR-0011 §3 and BRIEF C10 on a cooking-safety interlock"
  - assert: pin_on_net
    pin: "R_WDPETPD.1"
    net: WD_PET
    adr: "0011"
    why: "the pull actually sits on WD_PET — the WDI node, not a neighbouring watchdog net (WD_MR_N already has its own R_MR pull-UP, so a mis-wired pull here would be invisible to a net-name-only check)"
  - assert: pin_on_net
    pin: "R_WDPETPD.2"
    net: GND
    adr: "0011"
    why: "direction: DOWN, and the rail is asserted rather than merely the resistor's presence. WDI held at a defined LOW produces NO edge, so the fixed 0.9/1.6/2.5 s watchdog EXPIRES and RESET_N asserts — that is the whole safety argument. DOWN specifically (not UP, which would also be edge-free and would also bite): WD_PET terminates on J_PI.11, a Pi GPIO. A pull-UP to this board's 3V3 would source current into an UNPOWERED Pi through its GPIO ESD clamp — partially back-feeding the very host whose absence this invariant covers. DOWN is quiet in exactly the case that matters, and matches every other §7 authorization pull"

  # ===== v1.3 — the two FAIL-PERMISSIVE safety defects, made executable ========
  # Both were found by red-team lenses on v1.2 and both had the same shape as the
  # WD_PET P0: a safety input that reads SAFE when its wire is broken. Pinning
  # them here is the whole point — the fix is a DIRECTION and a PRESENCE, and
  # neither is visible to DRC, ERC or parity.
  - assert: pin_on_net
    pin: "R_DOORPD.1"
    net: DOOR_RAW
    adr: "0011"
    why: "the door pull sits on DOOR_RAW (v1.3: this resistor was R_DOORPU and pulled UP)"
  - assert: pin_on_net
    pin: "R_DOORPD.2"
    net: GND
    adr: "0011"
    why: "DIRECTION: DOWN, and this is the entire v1.3 P1-2 fix. Until now DOOR_RAW was the ONLY external safety input pulled to the PERMISSIVE rail — a broken or unplugged door cable read DOOR-CLOSED, so the door abort silently never happened; and with the pull-up-consistent harness a normal magnet-closes reed made DOOR_OK=0 whenever the door was SHUT, so K_PRESS could never fire at all. Pulled DOWN it matches R_ESTOPPD/R_MODEPD: open circuit => DOOR_OK=0 => door treated as OPEN. If this ever reverts to 3V3 the interlock silently becomes documentation again"
  - assert: net_has_part
    net: TCAM_OPEN
    part_type: resistor
    min: 2
    adr: "0011"
    why: "the OPEN-THERMISTOR detect threshold divider (R_OPENT 62k / R_OPENB 100k -> 2.0370V) must exist. VALUES CORRECTED 2026-07-26: this said '6.2k -> 3.107V', which is the DEFECT, written into the file whose job is preventing it — 3.107V is above the LMV393's 2.500V common-mode ceiling, which is exactly why the second design pass rejected it. An assert describing the bug it was meant to catch reads as coverage and is worse than no assert. An open, broken or unplugged camera thermistor pulls its sense node to 3.3V, which the over-temp comparator reads as COLD — so one unplugged JST-GH cable removed the only firmware-independent over-temperature protection, from BOTH the fault-latch SET term and the contactor gate. A bias resistor provably cannot fix this: in a 2-terminal divider an open sensor IS an infinitely cold sensor, so cold and open sit on the SAME side of any single threshold. The fix is a SECOND threshold, and this net is it"
  - assert: pin_on_net
    pin: "U_COMP2.2"
    net: TH_CAM_A
    adr: "0011"
    why: "open-detect channel 1 watches camera A's sense node. NOTE the inputs are deliberately swapped vs U_COMP: IN- is the SENSE node and IN+ is the threshold, so the output goes LOW when the node rises ABOVE 2.0370V (was written 3.107V — the pre-fix value; corrected 2026-07-26)"
  - assert: pin_on_net
    pin: "U_COMP2.6"
    net: TH_CAM_B
    adr: "0011"
    why: "open-detect channel 2 watches camera B's sense node"
  - assert: pin_on_net
    pin: "U_COMP2.1"
    net: TEMP_OK
    adr: "0011"
    why: "the open-detect outputs join the SAME wired-AND as the over-temp outputs, so TEMP_OK is now hot(A).hot(B).open(A).open(B) — an open head de-energizes exactly like an over-temperature"
  - assert: pin_on_net
    pin: "U_COMP2.7"
    net: TEMP_OK
    adr: "0011"
    why: "channel 2's output on the same wired-AND"
  - assert: pin_on_net
    pin: "U_COMP2.8"
    net: 3V3_ANALOG
    adr: "0011"
    why: "both comparators run from 3V3_ANALOG, not 5V_PROTECTED. CORRECTION (2026-07-25): an earlier version of this why: claimed 'the LMV393 is rail-to-rail on the input'. IT IS NOT, and asserting something the datasheet denies is worse than asserting nothing — SLCS136V sec.6.3/7.2.2.1 put the common-mode ceiling at VCC-0.7, i.e. 2.50-2.60V at VCC 3.3V. What the swap actually buys is that sec.7.2.2.1 SPECIFIES the output state for all four out-of-common-mode cases where the LM393 specifies none above VCC-2V: an UNDEFINED broken-sensor response becomes a DOCUMENTED one. The 22k bleed (R_CLMPA/R_CLMPB) then keeps every reading INCLUDING open below 2.2829V worst-case, inside VICR with 217mV to spare, so the case table is a backstop rather than the mechanism. ABS MAX VCC is 5.5V, not the LM393's 36V — this part must never be re-fitted to a 5V rail"
  - assert: pin_on_net
    pin: "U_COMP.8"
    net: 3V3_ANALOG
    adr: "0011"
    why: "the over-temp comparator moves to the same rail for the same reason; TEMP_OK is now a single-rail 3V3 node instead of mixing 5V and 3V3"
  # ===== v1.3 — the isolated contactor loop leaves the SELV connector ==========
  - assert: pin_on_net
    pin: "J_ISOLOOP.1"
    net: CONTACTOR_C
    adr: "0011"
    why: "the opto-isolated loop lands on J_ISOLOOP, the ONE 4-pole 3.5mm KF350 block that carries the WHOLE isolated domain (v1.3 P0-A merged J_ESTOPLOOP+J_CONTACTOR into it; both only ever carried isolated nets, so one body needs one moat instead of two). Until v1.3 J_ESTOP carried ESTOP_RAW (SELV) on pin 2 and CONTACTOR_C (isolated secondary) on pin 3 — ADJACENT pads on a 1.25mm-pitch JST-GH, 0.650mm apart, in ONE field harness, which made a single damaged or contaminated harness a common-cause failure ACROSS the isolation boundary"
  - assert: pin_on_net
    pin: "J_ISOLOOP.2"
    net: CONTACTOR_LOOP
    adr: "0011"
    why: "loop return; J_ESTOP pins 3/4 are now GND so that housing is SELV-ONLY. J_ISOLOOP.3 is the SAME net (the on-board link the old inter-connector CONTACTOR_LOOP made) and is a SEPARATE SCREW deliberately: on a safety interlock one loosening screw must not drop both the E-stop return and the contactor feed"
  # ===== v1.3 P0-A: the merged isolated block, and the two poles that are ONE net
  - assert: pin_on_net
    pin: "J_ISOLOOP.3"
    net: CONTACTOR_LOOP
    adr: "0011"
    why: "pins 2 and 3 are the SAME board net — this is the on-board link that used to be the CONTACTOR_LOOP run between J_ESTOPLOOP and J_CONTACTOR. Asserting it pins the merge: if a future edit re-pins pin 3 to anything else, the E-stop loop stops feeding the contactor circuit and the interlock silently becomes a permanent CLOSED loop"
  - assert: pin_on_net
    pin: "J_ISOLOOP.4"
    net: CONTACTOR_E
    adr: "0011"
    why: "opto EMITTER out to the external contactor. With pins 1/4 on the two opto terminals and 2/3 on the loop link, every pole of this block is on the far side of the LTV-817S barrier — which is what lets ONE moat and ONE pour keepout defend the whole isolated domain"
  # ===== v1.3 top_v13_gate_item: VALUE invariants (an EXISTENCE assert is not a VALUE assert)
  - assert: part_value
    part: R_WDPETPD
    equals: "1k"
    adr: "0011"
    why: "THE 100k VERSION OF THIS PART PASSED ALL THREE WD_PET TOPOLOGY ASSERTS. R_WDPETPD holds WD_PET low when the Pi tri-states it, so the watchdog BITES on a dead host; the value is derived from I_IL x R < V_IL on the CD74HC221 trigger input, and at 100k the leakage drop leaves the node floating while every existence/topology invariant still reads GREEN. The VALUE is the fix"
  - assert: part_value
    part: R_OS
    equals: "510k"
    adr: "0011"
    why: "the one-shot timing resistor: R_OS x C_OS sets the PRESS_TIMED non-retriggerable pulse the press interlock is built on. A substituted decade changes the pulse width, and no topology assert can see it"
  # ===== v1.6 (adversarial audit 2026-07-27, A1/A3): the two resistor VALUES the
  # ===== board's two documented cross-plug / re-arm bounds are COMPUTED FROM.
  # ===== Both already had EXISTENCE + DIRECTION asserts, and both bounds are
  # ===== published as numbers in ORDER_README; a silent decade change would move
  # ===== the published number and leave every other invariant green.
  - assert: part_value
    part: R_COILENPD
    equals: "100k"
    adr: "0011"
    why: "COIL_EN's ONLY hold. The net has three nodes — J_MODE.4 (a FIELD pin on an unkeyed housing shared with four identical siblings), Q_COILDRV.1 and this resistor — with no ESD device and no series element, so this value alone sets how weak an external pull-up has to be before it energises the relay coil rail with all seven AND-chain terms AND the Manual rail-cut bypassed. ORDER_README section 10.2 publishes the bound derived from it: solving 3.3*100k/(100k+R) >= 1.2 V gives R <= 175 kOhm, and an SHT45 pod's 10k module pull-up cross-plugged into J_MODE puts 3.000 V on that gate. Raising the value widens the hazard, lowering it narrows the published bound — either way the DOCUMENT and the BOARD must move together, and no topology assert can see it"
  - assert: part_value
    part: R_REARMPU
    equals: "100k"
    adr: "0011"
    why: "the re-arm line's only restraint. REARM_N = {R_REARMPU.1, U_EXP.26 (MCP23017 GPA5), U_LATCHB.1} — ONE driver, no button, no connector pin, no test point — so this pull-up is the entire reason a dead or un-initialised expander cannot clear the fault latch. It is load-bearing twice: DS20001952C gives IODIR POR = 1111 1111, so at every power-up GPA5 is an INPUT and this resistor is what holds REARM_N high while WD_OK is still low in the TPS3823 reset delay — the property that makes the coil rail unable to come up after a power interruption without an explicit re-arm (ORDER_README section 7a-1). EXP_RST_N has no driver, so nothing else on this board can restore that state"
  - assert: pin_on_net
    pin: "R_CLMPA.2"
    net: GND
    adr: "0011"
    why: "the camera-A sense-node BLEED. Without it an open thermistor reads the bare 3.3V rail, which is ABOVE the LMV393's 2.50-2.60V common-mode ceiling, so the open-detect comparator never actually compares against its threshold and the effective trip point collapses to the ceiling (~+1.6C of head temperature — a cold kitchen nuisance-trips the interlock). 22k bounds the open reading to 2.2687V, inside VICR. This resistor is what makes the open-detect real; deleting it as 'an unnecessary load on a sensor node' silently restores the defect"
  - assert: pin_on_net
    pin: "R_CLMPA.1"
    net: TH_CAM_A
    adr: "0011"
    why: "the bleed is on the sense node itself, not on the threshold"
  - assert: pin_on_net
    pin: "R_CLMPB.2"
    net: GND
    adr: "0011"
    why: "camera-B sense-node bleed, same argument"
  - assert: pin_on_net
    pin: "R_CLMPB.1"
    net: TH_CAM_B
    adr: "0011"
    why: "the bleed is on the sense node itself"
  - assert: pin_on_net
    pin: "C_COMP.1"
    net: 3V3_ANALOG
    adr: "0011"
    why: "U_COMP's bypass must sit on the rail U_COMP actually runs from. It was left on 5V_PROTECTED when the part moved, so it bypassed nothing. SLCS136V sec.8 p.12: supply variation 'cause temporary fluctuations in the comparator's input common mode range' — and the open-detect threshold is referenced to this same rail, so this 100nF is a safety component, not hygiene"

