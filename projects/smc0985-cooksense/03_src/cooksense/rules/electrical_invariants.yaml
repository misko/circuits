# NET NAMES HERE ARE THE CANONICAL KiCad NAMES, NOT THE TSX AUTHOR NAMES.
# 2026-07-29: this line read `N3V3: 3.3` — the tsx author-prefix form. No net
# called N3V3 exists in the netlist (the converter strips the N), so the 3V3
# rail was INVISIBLE to every `node_level` grade, and the checker's rail search
# silently had one rail instead of two. It did not misreport the P0-b divider
# (that network genuinely hangs off 5V_PROTECTED) but it would have reported
# UNREACHED on the ADR-0022 fix. Found by reading the netlist, not by the gate.
supplies: {5V_PROTECTED: 5.0, 3V3: 3.3}

# cooksense ELECTRICAL-INVARIANTS (canon E-INV, phase E1 = netlist-only).
#
# Design INTENT made EXECUTABLE against the exported netlist. Every other gate proves
# self-consistency; THIS proves the netlist matches what the ADRs decided. Graded by
# electrical_invariants.py against 06_build/netlists/cooksense.net. Net names are the
# CANONICAL KiCad names (the TSX author-prefix N is stripped: N5V_* -> 5V_*). Pins are
# REF.PAD (physical pad number). Each invariant cites the ADR that emitted it (E-ADR).
#
# Protection/topology ADRs that MUST be covered (E-ADR): 0001 (topology), 0002
# (topology+protection), 0006 (protection). All three are cited below.

invariants:

  # ===== ADR-0001 — input protection topology + eFuse OVLO (power chain) =========
  - assert: series_chain
    chain: [5V_IN, F1, 5V_FUSED, Q_REV, 5V_RPP]
    through: {Q_REV: [3, 2]}          # AO3401A pad3=DRAIN (input side) -> pad2=SOURCE (load side)
    adr: "0001"
    why: "5V SELV input -> polyfuse F1 -> reverse-polarity P-FET Q_REV (DRAIN->SOURCE) -> reverse-protected input 5V_RPP"

  - assert: pin_on_net
    pin: "U_EFUSE.5"                   # TPS259573 pad5 = OUT
    net: 5V_PROTECTED
    adr: "0001"
    why: "the eFuse OUTput is the 5V_PROTECTED rail — the protection stage sits in the power path, not a stub"

  - assert: pin_on_net
    pin: "D_REVCLAMP.1"                # SS34 pad1 = CATHODE
    net: 5V_FUSED
    adr: "0001"
    why: "reverse-crowbar cathode DOWNSTREAM of the polyfuse (pin review Q2, 2026-07-23): the reverse fault current path supply->J_PWR->F1->clamp->GND must pass THROUGH F1 so the polyfuse trips; on 5V_IN (upstream) the clamp current bypassed the fuse and was bounded only by the supply"

  - assert: pin_on_net
    pin: "U_EFUSE.6"                   # TPS259573 pad6 = FLT_N (open-drain, LOW=fault)
    net: EFUSE_FLT_N
    adr: "0001"
    why: "the eFuse fault flag rides the HONESTLY-NAMED net EFUSE_FLT_N (renamed from PWR_GOOD_N, pin review Q1 2026-07-23: FLT_N is LOW=fault i.e. HIGH=power-good, so a _N power-good name inverted the sense; consumers are software-read only — R_PG pullup, TP_PGOOD and expander pad 1 = GPB0, all three DIRECTLY on the node. v1.7's first cut inserted a 10k/22k divider here; ADR-0022 deleted it and moved R_PG's pull-up to 3V3 instead, which fixes the same abs-max problem at the root and leaves the node at a valid logic high. See the ADR-0022 block at the end of this file)"

  - assert: net_has_part
    net: DECU_G1_RAW
    part_type: resistor
    min: 1
    adr: "0006"
    why: "the U-decoder's enable REQUEST line has a pull-DOWN (pin review Q4 2026-07-23; v1.2 moved it to the RAW net, ADR-0011 §5b): when SR_OE_N tri-states the 595s it is the RAW net that floats — out-of-spec for CMOS inputs and a phantom-select hazard; the gated DECU_G1 is driven push-pull by U_DECUEN and cannot float"

  - assert: net_has_part
    net: DECD_G1_RAW
    part_type: resistor
    min: 1
    adr: "0006"
    why: "the D-decoder's enable REQUEST line has a pull-DOWN — same phantom-select hazard closure as DECU_G1_RAW (v1.2: moved to the RAW net, ADR-0011 §5b)"

  - assert: net_has_part
    net: EF_OVLO
    part_type: resistor
    min: 2
    adr: "0001"
    why: "the TPS259573 programmable OVLO divider EXISTS on EN_OVLO_N (R_OVT + R_OVB) — this is the brief §3.5 over-voltage CUTOFF (flag 2)"

  - assert: net_has_part
    net: 5V_PROTECTED
    part_type: capacitor
    min: 1
    adr: "0001"
    why: "the protected rail carries bulk + ceramic decoupling (CE1 220uF + C_IN1/C_IN2)"

  # ===== ADR-0002 — safety AND-chain gates the coil rail (no-MCU HW enforcement) =
  - assert: pin_on_net
    pin: "U_AND3.4"                    # SN74LVC1G11 pad4 = Y (final AND output)
    net: KEY_RELAY_ALLOWED
    adr: "0002"
    why: "the 3rd cascaded 3-input AND (AND1·AND2·FAULT_LATCH_CLEAR) OUTPUT is KEY_RELAY_ALLOWED — the whole 7-condition chain terminates here"

  - assert: series_chain
    chain: [5V_PROTECTED, Q_COIL, 5V_KEY_RELAY]
    through: {Q_COIL: [2, 3]}          # AO3401A pad2=SOURCE (5V_PROTECTED) -> pad3=DRAIN (coil rail)
    adr: "0002"
    why: "the coil rail 5V_KEY_RELAY is reachable ONLY through the high-side switch Q_COIL (SOURCE->DRAIN); ANY AND-chain condition false turns Q_COIL off and the rail dies"

  - assert: pin_on_net
    pin: "Q_COILDRV.1"                 # 2N7002 pad1 = GATE
    net: COIL_EN
    adr: "0002"
    why: "the coil-rail switch driver Q_COILDRV is gated by COIL_EN = KEY_RELAY_ALLOWED THROUGH the Manual/Auto DPDT pole A (physical MANUAL rail cut, brief §3). v1.7: COIL_EN is now the GATE-SIDE node only — it reaches the field solely through R_COILENS, and the field pin is COIL_EN_IN (ADR-0018)"

  # ===== ADR-0018 — the J_MODE front end (v1.7) ================================
  - assert: pin_on_net
    pin: "J_MODE.4"                    # S4B-ZR-SM4A-TF pad4 = pole-A return
    net: COIL_EN_IN
    adr: "0018"
    why: "THE CONNECTOR PIN IS ON THE INPUT SIDE OF THE SERIES ELEMENT, NEVER ON THE GATE. This is the assert that catches a 'simplification' that deletes R_COILENS and reunites the two nets: the divider and the clamp would still EXIST, R_COILENPD would still measure 680R, and the hazard would be back because the pin would again be the gate"
  - assert: net_has_part
    net: COIL_EN_IN
    part_type: diode
    min: 1
    adr: "0018"
    why: "D_COILEN (PESD5V0S1BA) — the ESD device J_DOOR (D_DOOR) and J_ESTOP (D_ESTOP) carry and J_MODE did not, on the one field pin whose job is to arm a cooking machine"
  - assert: net_has_part
    net: COIL_EN_IN
    part_type: resistor
    min: 2
    adr: "0018"
    why: "both R_COILENPD (the divider leg to GND) and R_COILENS (the series element out to COIL_EN) are on the pin node; a pull-down alone would leave the gate on the connector"

  - assert: pin_on_net
    pin: "U_ONESHOT.13"                # CD74HC221 pad13 = 1Q (v1.2, ADR-0011 §6)
    net: PRESS_TIMED
    adr: "0002"
    why: "the one-shot Q output is PRESS_TIMED — the hardware <=436ms worst-case (<500ms) PRESS cap, independent of the Pi; v1.2 swapped the RETRIGGERABLE 1G123 for the NON-retriggerable CD74HC221 so the cap is a HARD bound"

  - assert: pin_on_net
    pin: "U_ULNB.3"                    # ULN2803 #B pad3 = IN3 (K_PRESS channel input)
    net: PRESS_TIMED
    adr: "0002"
    why: "the K_PRESS coil driver input is driven ONLY by the one-shot output PRESS_TIMED — a hung Pi cannot hold PRESS beyond the one-shot window"

  - assert: pin_on_net
    pin: "U_WD.1"                      # TPS3823 pad1 = RESET_N (push-pull, high=OK)
    net: WD_OK
    adr: "0002"
    why: "the external watchdog supervisor RESET_N is WD_OK — heartbeat loss / brown-out drops it (flag 1: TPS3823 is the coarse ~1.6s WD, not the fast PRESS timer)"

  - assert: pin_on_net
    pin: "U_AND1.3"                    # SN74LVC1G11 #1 pad3 = B
    net: WD_OK
    adr: "0002"
    why: "WD_OK is an input of the AND-chain (U_AND1.B) — the watchdog directly gates the coil rail"

  - assert: pin_on_net
    pin: "K_U1.4"                      # DIP05 reed relay tsx pad4 = CONTACT_A (keypad side)
    net: U_SEL_BUS
    adr: "0002"
    why: "the reed-relay CONTACT (keypad side) sits on the ISOLATED keypad net U_SEL_BUS, while its COIL (pad1) sits on the SELV-logic rail 5V_KEY_RELAY — the two domains meet ONLY across the relay's 1.5kV coil/contact barrier, no shared copper (brief §7, ADR-0001). Full >=6mm creepage + no-shared-GND is the geometric/audit half (E2)"

  # ===== ADR-0006 — reed relay matrix: K_PRESS bridges U_SEL -> D_SEL via RKEY ====
  - assert: series_chain
    chain: [U_SEL_BUS, K_PRESS, RKEY_MID, R_KEY, D_SEL_BUS]
    through: {K_PRESS: [4, 3]}         # DIP05 tsx pad4=CONTACT_A (U side) -> pad3=CONTACT_B (RKEY side)
    adr: "0006"
    why: "K_PRESS bridges the selected U bus to the selected D bus THROUGH the RKEY solder-select resistor (0R default, field 0/22/47/100/220/470/1k) — the emulation-resistance path of the matrix selector (T1)"

  # ===== ADR-0010 — Pi 5 native-I2C pin map (v1.2, review F1) ====================
  # Every I2C net pinned to its VERIFIED header pin (RP1 datasheet fsel table +
  # kernel i2c*-pi5 overlays, 2026-07-24). A silent remap fails the schematic gate.
  - assert: pin_on_net
    pin: "J_PI.3"                      # phys 3 = GPIO2 = I2C1_SDA
    net: I2C_SDA
    adr: "0010"
    why: "MCP23017 control bus on I2C1 SDA (GPIO2, the arm I2C default)"
  - assert: pin_on_net
    pin: "J_PI.5"                      # phys 5 = GPIO3 = I2C1_SCL
    net: I2C_SCL
    adr: "0010"
    why: "MCP23017 control bus on I2C1 SCL (GPIO3)"
  - assert: pin_on_net
    pin: "J_PI.7"                      # phys 7 = GPIO4 = I2C2_SDA
    net: SDA_A
    adr: "0010"
    why: "bus A (cam A 0x33 + ambient SHT45 0x44) SDA on the RP1 I2C2 SDA pin"
  - assert: pin_on_net
    pin: "J_PI.29"                     # phys 29 = GPIO5 = I2C2_SCL
    net: SCL_A
    adr: "0010"
    why: "bus A SCL on the RP1 I2C2 SCL pin (this pin was KEY_DATA in <=v1.1)"
  - assert: pin_on_net
    pin: "J_PI.8"                      # phys 8 = GPIO14 = I2C3_SDA
    net: SDA_B
    adr: "0010"
    why: "bus B (cam B 0x33 + exhaust SHT45 0x44) SDA on the RP1 I2C3 SDA pin (dtoverlay i2c3-pi5,pins_14_15; UART0 console disabled)"
  - assert: pin_on_net
    pin: "J_PI.10"                     # phys 10 = GPIO15 = I2C3_SCL
    net: SCL_B
    adr: "0010"
    why: "bus B SCL on the RP1 I2C3 SCL pin"
  - assert: pin_on_net
    pin: "J_PI.36"                     # phys 36 = GPIO16 (no I2C/boot function)
    net: KEY_DATA
    adr: "0010"
    why: "KEY_DATA re-homed off GPIO5/phys29 (now bus A SCL) onto a plain GPIO"
  - assert: pin_on_net
    pin: "J_PI.37"                     # phys 37 = GPIO26 (no I2C function)
    net: STOP_REQ
    adr: "0010"
    why: "STOP_REQ is a DIRECT Pi GPIO (ADR-0011 §5): it must not sit behind the frozen KEY_LATCH or a tri-stated 595"
  - assert: pin_on_net
    pin: "J_RH_AMBIENT.3"
    net: SDA_A
    adr: "0010"
    why: "the ambient SHT45 pod SHARES bus A with camera A (addresses 0x33/0x44 disjoint) — the RH nets SDA_RHA/SCL_RHA are deleted"
  - assert: pin_on_net
    pin: "J_RH_EXHAUST.3"
    net: SDA_B
    adr: "0010"
    why: "the exhaust SHT45 pod SHARES bus B with camera B"

  # ===== ADR-0011 — v1.2 safety-chain corrections (reviews F2/F3/F4/F5) ==========
  - assert: pin_on_net
    pin: "U_FAULTAND.6"                # 1G11 pad6 = C input
    net: TEMP_OK
    adr: "0011"
    why: "TEMP_OK is IN the fault-latch SET condition (was tied N3V3 in <=v1.1): a thermal trip LATCHES until temps drop + manual re-arm, it cannot silently self-clear"
  - assert: pin_on_net
    pin: "U_CAND2.4"                   # 1G11 pad4 = Y
    net: CONTACTOR_DRV
    adr: "0011"
    why: "the contactor opto LED is driven by the GATED CONTACTOR_DRV, not raw CONTACTOR_REQ"
  - assert: pin_on_net
    pin: "R_OPTOLED.1"
    net: CONTACTOR_DRV
    adr: "0011"
    why: "the LED series resistor hangs off the gate output — CONTACTOR_REQ alone can no longer light the opto"
  - assert: pin_on_net
    pin: "U_CAND1.1"
    net: WD_OK
    adr: "0011"
    why: "contactor permission requires WD_OK (hardware)"
  - assert: pin_on_net
    pin: "U_CAND1.3"
    net: ESTOP_OK
    adr: "0011"
    why: "contactor permission requires ESTOP_OK (redundant with the physical contact-B loop break)"
  - assert: pin_on_net
    pin: "U_CAND1.6"
    net: TEMP_OK
    adr: "0011"
    why: "contactor permission requires TEMP_OK — a thermal fault now drops the external contactor in hardware (review F3b's core demand)"
  - assert: pin_on_net
    pin: "U_CAND2.3"
    net: FAULT_LATCH_CLEAR
    adr: "0011"
    why: "a LATCHED fault holds contactor permission off until manual re-arm"
  - assert: pin_on_net
    pin: "K_STOP.1"                    # DIP05 tsx pad1 = COIL_A (+)
    net: 5V_STOP
    adr: "0011"
    why: "K_STOP's coil rides the ALWAYS-AVAILABLE 5V_STOP rail, NOT the fault-gated 5V_KEY_RELAY — the one relay that answers a fault must survive the fault (review F3c). Asserting the pin ON 5V_STOP also proves it is NOT on the key-relay rail"
  - assert: series_chain
    chain: [5V_PROTECTED, R_STOPRAIL, 5V_STOP]
    adr: "0011"
    why: "5V_STOP derives from 5V_PROTECTED through its own link — present whenever the board is powered, gated by nothing"
  - assert: pin_on_net
    pin: "Q_STOPDRV.1"                 # 2N7002 pad1 = GATE
    net: STOP_REQ
    adr: "0011"
    why: "K_STOP has a DEDICATED driver from STOP_REQ (not a ULN channel whose COM/flyback sits on the switched key rail)"
  - assert: pin_on_net
    pin: "U_ONESHOT.3"                 # CD74HC221 pad3 = 1R_N (reset)
    net: OS_CLR_N
    adr: "0011"
    why: "the PRESS one-shot clear is the GATED OS_CLR_N = DOOR_OK · STOP_REQ_N — STOP preemption clears an in-flight press (was DOOR_OK only in <=v1.1, review F4)"
  - assert: pin_on_net
    pin: "U_OSCLR.1"
    net: DOOR_OK
    adr: "0011"
    why: "door-open still aborts the press (brief §3: open => abort, release PRESS)"
  - assert: pin_on_net
    pin: "U_OSCLR.3"
    net: STOP_REQ_N
    adr: "0011"
    why: "STOP_REQ (inverted) is the second clear condition"
  - assert: pin_on_net
    pin: "U_DECUEN.4"
    net: DECU_G1
    adr: "0011"
    why: "the U-decoder enable passes through the STOP gate: DECU_G1 = DECU_G1_RAW · STOP_REQ_N — STOP force-disables the U selector"
  - assert: pin_on_net
    pin: "U_DECDEN.4"
    net: DECD_G1
    adr: "0011"
    why: "the D-decoder enable passes through the STOP gate — STOP force-disables the D selector"
  - assert: pin_on_net
    pin: "U_LATCHG.4"
    net: KEY_LATCH_G
    adr: "0011"
    why: "the 595 RCLK is the FROZEN latch KEY_LATCH_G = KEY_LATCH · PRESS_TIMED_N: selector addresses cannot change while K_PRESS is closed (review F5b)"
  - assert: pin_on_net
    pin: "U_SR1.12"                    # 595 pad12 = RCLK
    net: KEY_LATCH_G
    adr: "0011"
    why: "the register latches ONLY through the freeze gate"
  - assert: pin_on_net
    pin: "U_ONESHOT.4"                 # CD74HC221 pad4 = 1Q_N
    net: PRESS_TIMED_N
    adr: "0011"
    why: "PRESS_TIMED_N comes from the one-shot's own Q-bar — the freeze window is exactly the press window by construction"
  # --- §7 deterministic pulls, with DIRECTION proven by the resistor's far pin ---
  - assert: pin_on_net
    pin: "R_HOSTAUTHPD.2"
    net: GND
    adr: "0011"
    why: "HOST_AUTH pulls DOWN (authorization false) while the Pi is un-driven"
  - assert: pin_on_net
    pin: "R_HOSTAUTHPD.1"
    net: HOST_AUTH
    adr: "0011"
    why: "the pull-down actually sits on HOST_AUTH"
  - assert: pin_on_net
    pin: "R_MCUENPD.1"
    net: MCU_RELAY_ENABLE
    adr: "0011"
    why: "MCU_RELAY_ENABLE pulled down — AND-chain false + SR_OE_N high at boot"
  - assert: pin_on_net
    pin: "R_MCUENPD.2"
    net: GND
    adr: "0011"
    why: "direction: DOWN"
  - assert: pin_on_net
    pin: "R_KRSTPD.1"
    net: KEY_RESET_N
    adr: "0011"
    why: "KEY_RESET_N pulled down = SRCLR asserted: registers held CLEARED during Pi boot (was noted as floating in the v1.1 order instructions)"
  - assert: pin_on_net
    pin: "R_KRSTPD.2"
    net: GND
    adr: "0011"
    why: "direction: DOWN"
  - assert: pin_on_net
    pin: "R_RAENAPD.1"
    net: RAIL_EN_A
    adr: "0011"
    why: "sensor rail A enable pulled down (rail off) while the expander is in reset"
  - assert: pin_on_net
    pin: "R_RAENBPD.1"
    net: RAIL_EN_B
    adr: "0011"
    why: "sensor rail B enable pulled down"
  - assert: pin_on_net
    pin: "R_RAENRHAPD.1"
    net: RAIL_EN_RHA
    adr: "0011"
    why: "RH-A rail enable pulled down"
  - assert: pin_on_net
    pin: "R_RAENRHEPD.1"
    net: RAIL_EN_RHE
    adr: "0011"
    why: "RH-E rail enable pulled down"
  - assert: pin_on_net
    pin: "R_CTRREQPD.1"
    net: CONTACTOR_REQ
    adr: "0011"
    why: "CONTACTOR_REQ pulled down — contactor request false while the expander is un-driven"
  - assert: pin_on_net
    pin: "R_CTRREQPD.2"
    net: GND
    adr: "0011"
    why: "direction: DOWN"
  - assert: pin_on_net
    pin: "R_STOPPD.1"
    net: STOP_REQ
    adr: "0011"
    why: "STOP_REQ pulled down — STOP relay open, decoders/one-shot ungated at boot"
  - assert: pin_on_net
    pin: "R_REARMPU.1"
    net: REARM_N
    adr: "0011"
    why: "REARM_N pulled UP — a floating re-arm line must NOT clear the fault latch (REARM_N is active-low)"
  - assert: pin_on_net
    pin: "R_REARMPU.2"
    net: 3V3
    adr: "0011"
    why: "direction: UP (to 3V3) — the one pull whose direction inverts the others'"

  # ===== ADR-0019 — a restrictive default on every safety-chain net (v1.7) ====
  # v1.6 measured 11 of the 18 nets feeding a permission/gating input carrying NO
  # default at all. Each is driven by exactly ONE push-pull CMOS output, so the
  # pull is invisible while the board is healthy and decisive when the driver is
  # absent. Hardware is the ONLY place these can live: all four permissions are
  # read back on MCP23017 port B, one GPPUB write pulls them UP with 100k
  # (DS20001952C 3.5.7) turning an indeterminate float into a DETERMINISTIC
  # PERMISSIVE, and there is NO software way to add a pull-DOWN.
  # DIRECTION IS DERIVED PER NET, NOT BLANKET-FITTED — see the two asserts at the
  # end of this block, which pin the two that run against habit.
  - assert: net_has_part
    net: WD_OK
    part_type: resistor
    min: 1
    adr: "0019"
    why: "R_WDOKPD — the supervisor verdict, consumed by FOUR gates (U_AND1.B, U_CAND1.A, U_FAULTAND.A, U_OENAND.B). Restrictive = LOW"
  - assert: net_has_part
    net: ESTOP_OK
    part_type: resistor
    min: 1
    adr: "0019"
    why: "R_ESTOPOKPD — restrictive = LOW = E-stop pressed. A dead U_SCHM floats this AND MODE_AUTO_HW AND DOOR_OK at once, and U_EXP.3/2/4 read back the SAME nets so software has no independent cross-check"
  - assert: net_has_part
    net: MODE_AUTO_HW
    part_type: resistor
    min: 1
    adr: "0019"
    why: "R_MODEHWPD — restrictive = LOW = not in AUTO"
  - assert: net_has_part
    net: DOOR_OK
    part_type: resistor
    min: 1
    adr: "0019"
    why: "R_DOOROKPD — restrictive = LOW = door open -> OS_CLR_N low -> the PRESS one-shot is held clear"
  - assert: net_has_part
    net: AND1
    part_type: resistor
    min: 1
    adr: "0019"
    why: "R_AND1PD — an INTERMEDIATE node, and it needs its own default for the same reason: if U_AND1 is missing, U_AND3 can still publish KEY_RELAY_ALLOWED from AND2 . FAULT_LATCH_CLEAR alone, and the pull-downs on U_AND1's INPUTS do nothing about a dead U_AND1. Every rung of a cascade needs its own default or the cascade has a hole one part wide"
  - assert: net_has_part
    net: AND2
    part_type: resistor
    min: 1
    adr: "0019"
    why: "R_AND2PD — same argument as AND1, one gate over"
  - assert: net_has_part
    net: CTR_SAFE
    part_type: resistor
    min: 1
    adr: "0019"
    why: "R_CTRSAFEPD — U_CAND1's verdict into U_CAND2.A — restrictive = LOW = no external contactor"
  - assert: net_has_part
    net: FAULT_LATCH_CLEAR
    part_type: resistor
    min: 1
    adr: "0019"
    why: "R_FLCPD — the highest-value of the eleven: ONE 5-pin part (U_LATCHB) drives it into BOTH U_AND3.6 (coil rail) and U_CAND2.3 (external contactor). Restrictive = LOW"
  - assert: net_has_part
    net: STOP_REQ_N
    part_type: resistor
    min: 1
    adr: "0019"
    why: "R_STOPREQNPD — restrictive = LOW = STOP asserted -> OS_CLR_N low -> the press is aborted. A dead U_STOPINV means the machine cannot press, which is the safe direction"
  - assert: net_has_part
    net: FAULT_SET_N
    part_type: resistor
    min: 1
    adr: "0019"
    why: "R_FSETNPD — AN ACTIVE-LOW NET WITH A PULL-DOWN, i.e. its default is ASSERTED: a dead U_FAULTAND leaves the latch permanently SET and the machine unable to arm. That is the OPPOSITE convention from REARM_N (active-low, pulled UP) in the same latch, and both are right, because the derivation is over WHICH LEVEL IS RESTRICTIVE AT THE CONSUMER, not over the net's name"
  - assert: net_has_part
    net: FAULT
    part_type: resistor
    min: 1
    adr: "0019"
    why: "R_FAULTPU — the eleventh, and THE ONE THAT RUNS THE OTHER WAY. FAULT is Q of the /S-/R latch and its only consumer is U_LATCHB.B"
  - assert: pin_on_net
    pin: "R_FAULTPU.2"
    net: 3V3
    adr: "0019"
    why: "DIRECTION, and this assert is the point of the whole ADR. A blanket pull-DOWN here would be ACTIVELY HARMFUL: with U_LATCHA dead and FAULT low, FAULT_LATCH_CLEAR = NAND(REARM_PULSE_N=1, FAULT=0) = 1 = PERMISSIVE at both U_AND3.6 and U_CAND2.3. Pulled HIGH the same dead part gives 0 = restrictive. net_has_part alone would pass a pull-down soldered onto FAULT, so the DIRECTION is what is checked"
  - assert: pin_on_net
    pin: "R_FSETNPD.2"
    net: GND
    adr: "0019"
    why: "DIRECTION on the other non-obvious one: an ACTIVE-LOW net defaulting to ASSERTED. Pulling FAULT_SET_N UP by habit (because the name ends in _N) would leave a dead U_FAULTAND unable to set the latch at all"

  # ===== ADR-0020 — REARM_N is an EDGE, and the expander reset HAS a driver ====
  - assert: pin_on_net
    pin: "U_LATCHB.1"                  # SN74LVC1G00 pad1 = A, the latch's /R
    net: REARM_PULSE_N
    adr: "0020"
    why: "THE WHOLE FIX IN ONE ASSERT. Until v1.7 this pin sat on the RAW REARM_N, so a driver that took the line low and left it there forced FAULT_LATCH_CLEAR permissive at U_AND3.6 and U_CAND2.3 forever, put the latch in its forbidden state (Q=/Q=1) with a fault present, and degenerated U_LATCHA into a combinational repeater: the live terms still gated but THE MEMORY WAS GONE. /R is now the 7ms one-shot output, so only a TRANSITION clears the latch. Re-wiring this pin back to REARM_N restores the defect and nothing else would notice"
  - assert: pin_on_net
    pin: "U_ONESHOT.9"                 # CD74HC221 pad9 = 2A_N, negative-edge trigger
    net: REARM_N
    adr: "0020"
    why: "the edge-detect is fed by the raw line — section 2 of the dual one-shot that had been tied off unused since v1.2, so this costs ZERO new ICs"
  - assert: pin_on_net
    pin: "U_ONESHOT.12"                # CD74HC221 pad12 = 2Q_N
    net: REARM_PULSE_N
    adr: "0020"
    why: "and its inverted output is the pulse; A_N->2Q_N is the negative-edge path, so a HIGH->LOW transition on REARM_N yields ONE low pulse and nothing else"
  - assert: pin_on_net
    pin: "U_ONESHOT.11"                # CD74HC221 pad11 = 2R_N
    net: WD_OK
    adr: "0020"
    why: "NOT a tie-off. Holding section 2 reset while the TPS3823 asserts (a) forbids a spurious power-up pulse, which is what PRESERVES the power-up-forced-SET property (WD_OK low -> FAULT_SET_N low -> latch SET, so the coil rail cannot come up after any power interruption without an explicit re-arm), and (b) makes a re-arm attempt during a watchdog fault ignored IN HARDWARE. With R_WDOKPD a dead U_WD also holds it reset — the latch then can never be cleared, which is the restrictive direction"
  - assert: part_value
    part: C_OS2
    equals: "1uF"
    adr: "0020"
    why: "with R_OS2 this IS the 7ms: tw = K*Rx*Cx = 0.7*10k*1uF. A substituted decade makes the re-arm pulse 0.7ms or 70ms — still a pulse, so every topology assert stays green, but the value is what the ADR and ORDER_README publish"
  - assert: part_value
    part: R_OS2
    equals: "10k"
    adr: "0020"
    why: "the other half of tw = 7ms. Until v1.7 this was the 'never hard-tie the RC node' resistor on an UNUSED half of the package and its value was arbitrary; it is now load-bearing"
  - assert: pin_on_net
    pin: "U_EXP.18"                    # MCP23017 pad18 = RESET_N
    net: WD_OK
    adr: "0020"
    why: "THE EXPANDER RESET HAS A DRIVER. It sat on EXP_RST_N = {R_EXPRST.1, U_EXP.18} — a net NOTHING on this board could drive — so the registers held until 3V3 dropped and a held-low REARM_N survived every Pi reboot. On WD_OK, power-up / brown-out / watchdog timeout each return every expander GPIO to POR (all INPUTS), where the eleven ADR-0019 pull-downs and R_REARMPU take over: the expander's outputs CANNOT persist across a watchdog timeout, which is exactly the retained-CONTACTOR_REQ hazard ADR-0011 section 8 could only mitigate. R_EXPRST is DELETED and must stay deleted — a 10k pull-up on this net is now a pull-up on WD_OK and beats R_WDOKPD's 100k (3.3*100/110 = 3.0 V)"

  # --- §8 THE WATCHDOG MUST BITE WHEN THE PI IS ABSENT (P0, 2026-07-25) --------
  # This is the invariant whose ABSENCE was the P0. The de-energization intent
  # ("Pi crash (WD) -> contactor DROPPED", ADR-0011 truth table) lived only in ADR
  # prose; no gate could see it, so a WD_PET net with exactly two nodes (J_PI.11
  # and U_WD.4) passed every check while the board held the cooking contactor
  # energised forever with the Pi unplugged. An ADR that emits no invariant is the
  # E-ADR failure the canon names — so the intent is pinned here THREE ways: the
  # net carries a resistor at all, and both of that resistor's pins are named, so
  # the DIRECTION (down, not up) is proven and a future edit cannot quietly make
  # it a pull-UP (which would restore the fault exactly).
  - assert: net_has_part
    net: WD_PET
    part_type: resistor
    min: 1
    adr: "0011"
    why: "WD_PET (the TPS3823 WDI heartbeat) MUST carry a pull resistor, and it MUST be 1k — SLVS165O §7.3.4 names that value explicitly ('place a 1kOhm resistor from WDI to ground') because §6.5 gives I_IL at WDI = 140 typ / 190 max uA: the pin SOURCES that much, so a 100k pull-down cannot hold it low and the supervisor keeps petting itself. E-INV phase E1 has no part_value kind, so this assertion pins the resistor's EXISTENCE and (below) its DIRECTION; the VALUE is guarded by ADR-0011 §8, the tsx comment, and a mandatory bring-up bench check (GPIO17 to input -> TP_WDOK must fall within 2.5 s). TPS3823-33DBVR part.yaml pin 4: 'if left floating the device self-pulses (WD effectively disabled)'. With J_PI unplugged or the Pi off, a bare WD_PET floats -> the supervisor never times out -> WD_OK stays HIGH -> U_CAND1(WD_OK,ESTOP_OK,TEMP_OK) and U_CAND2(...,CONTACTOR_REQ) both hold, the MCP23017 CONTACTOR_REQ latch retains its last written value (EXP_RST_N has no driver), and the EXTERNAL COOKING CONTACTOR STAYS ENERGISED INDEFINITELY. That falsifies ADR-0011 §3 and BRIEF C10 on a cooking-safety interlock"
  - assert: pin_on_net
    pin: "R_WDPETPD.1"
    net: WD_PET
    adr: "0011"
    why: "the pull actually sits on WD_PET — the WDI node, not a neighbouring watchdog net (WD_MR_N already has its own R_MR pull-UP, so a mis-wired pull here would be invisible to a net-name-only check)"
  - assert: pin_on_net
    pin: "R_WDPETPD.2"
    net: GND
    adr: "0011"
    why: "direction: DOWN, and the rail is asserted rather than merely the resistor's presence. WDI held at a defined LOW produces NO edge, so the fixed 0.9/1.6/2.5 s watchdog EXPIRES and RESET_N asserts — that is the whole safety argument. DOWN specifically (not UP, which would also be edge-free and would also bite): WD_PET terminates on J_PI.11, a Pi GPIO. A pull-UP to this board's 3V3 would source current into an UNPOWERED Pi through its GPIO ESD clamp — partially back-feeding the very host whose absence this invariant covers. DOWN is quiet in exactly the case that matters, and matches every other §7 authorization pull"

  # ===== v1.3 — the two FAIL-PERMISSIVE safety defects, made executable ========
  # Both were found by red-team lenses on v1.2 and both had the same shape as the
  # WD_PET P0: a safety input that reads SAFE when its wire is broken. Pinning
  # them here is the whole point — the fix is a DIRECTION and a PRESENCE, and
  # neither is visible to DRC, ERC or parity.
  - assert: pin_on_net
    pin: "R_DOORPD.1"
    net: DOOR_RAW_IN
    adr: "0011"
    why: "the door pull sits on the CONNECTOR-SIDE node (v1.3: this resistor was R_DOORPU and pulled UP; v1.8/ADR-0024 split the net at R_DOORS and moved the pull to DOOR_RAW_IN, which is where a divider against an injected pull-up can act at all). If this ever moves back to DOOR_RAW, downstream of the series element, the pull-down still gives the right DEFAULT and stops rejecting injection entirely — the rejection is a property of WHERE the pull sits, not of its value"
  - assert: pin_on_net
    pin: "R_DOORPD.2"
    net: GND
    adr: "0011"
    why: "DIRECTION: DOWN, and this is the entire v1.3 P1-2 fix. Until now DOOR_RAW was the ONLY external safety input pulled to the PERMISSIVE rail — a broken or unplugged door cable read DOOR-CLOSED, so the door abort silently never happened; and with the pull-up-consistent harness a normal magnet-closes reed made DOOR_OK=0 whenever the door was SHUT, so K_PRESS could never fire at all. Pulled DOWN it matches R_ESTOPPD/R_MODEPD: open circuit => DOOR_OK=0 => door treated as OPEN. If this ever reverts to 3V3 the interlock silently becomes documentation again"
  - assert: net_has_part
    net: TCAM_OPEN
    part_type: resistor
    min: 2
    adr: "0011"
    why: "the OPEN-THERMISTOR detect threshold divider (R_OPENT 62k / R_OPENB 100k -> 2.0370V) must exist. VALUES CORRECTED 2026-07-26: this said '6.2k -> 3.107V', which is the DEFECT, written into the file whose job is preventing it — 3.107V is above the LMV393's 2.500V common-mode ceiling, which is exactly why the second design pass rejected it. An assert describing the bug it was meant to catch reads as coverage and is worse than no assert. An open, broken or unplugged camera thermistor pulls its sense node to 3.3V, which the over-temp comparator reads as COLD — so one unplugged JST-GH cable removed the only firmware-independent over-temperature protection, from BOTH the fault-latch SET term and the contactor gate. A bias resistor provably cannot fix this: in a 2-terminal divider an open sensor IS an infinitely cold sensor, so cold and open sit on the SAME side of any single threshold. The fix is a SECOND threshold, and this net is it"
  - assert: pin_on_net
    pin: "U_COMP2.2"
    net: TH_CAM_A
    adr: "0011"
    why: "open-detect channel 1 watches camera A's sense node. NOTE the inputs are deliberately swapped vs U_COMP: IN- is the SENSE node and IN+ is the threshold, so the output goes LOW when the node rises ABOVE 2.0370V (was written 3.107V — the pre-fix value; corrected 2026-07-26)"
  - assert: pin_on_net
    pin: "U_COMP2.6"
    net: TH_CAM_B
    adr: "0011"
    why: "open-detect channel 2 watches camera B's sense node"
  - assert: pin_on_net
    pin: "U_COMP2.1"
    net: TEMP_OK
    adr: "0011"
    why: "the open-detect outputs join the SAME wired-AND as the over-temp outputs, so TEMP_OK is now hot(A).hot(B).open(A).open(B) — an open head de-energizes exactly like an over-temperature"
  - assert: pin_on_net
    pin: "U_COMP2.7"
    net: TEMP_OK
    adr: "0011"
    why: "channel 2's output on the same wired-AND"
  - assert: pin_on_net
    pin: "U_COMP2.8"
    net: 3V3_ANALOG
    adr: "0011"
    why: "both comparators run from 3V3_ANALOG, not 5V_PROTECTED. CORRECTION (2026-07-25): an earlier version of this why: claimed 'the LMV393 is rail-to-rail on the input'. IT IS NOT, and asserting something the datasheet denies is worse than asserting nothing — SLCS136V sec.6.3/7.2.2.1 put the common-mode ceiling at VCC-0.7, i.e. 2.50-2.60V at VCC 3.3V. What the swap actually buys is that sec.7.2.2.1 SPECIFIES the output state for all four out-of-common-mode cases where the LM393 specifies none above VCC-2V: an UNDEFINED broken-sensor response becomes a DOCUMENTED one. The 22k bleed (R_CLMPA/R_CLMPB) then keeps every reading INCLUDING open below 2.2829V worst-case, inside VICR with 217mV to spare, so the case table is a backstop rather than the mechanism. ABS MAX VCC is 5.5V, not the LM393's 36V — this part must never be re-fitted to a 5V rail"
  - assert: pin_on_net
    pin: "U_COMP.8"
    net: 3V3_ANALOG
    adr: "0011"
    why: "the over-temp comparator moves to the same rail for the same reason; TEMP_OK is now a single-rail 3V3 node instead of mixing 5V and 3V3"
  # ===== v1.3 — the isolated contactor loop leaves the SELV connector ==========
  - assert: pin_on_net
    pin: "J_ISOLOOP.1"
    net: CONTACTOR_C
    adr: "0011"
    why: "the opto-isolated loop lands on J_ISOLOOP, the ONE 4-pole 3.5mm KF350 block that carries the WHOLE isolated domain (v1.3 P0-A merged J_ESTOPLOOP+J_CONTACTOR into it; both only ever carried isolated nets, so one body needs one moat instead of two). Until v1.3 J_ESTOP carried ESTOP_RAW (SELV) on pin 2 and CONTACTOR_C (isolated secondary) on pin 3 — ADJACENT pads on a 1.25mm-pitch JST-GH, 0.650mm apart, in ONE field harness, which made a single damaged or contaminated harness a common-cause failure ACROSS the isolation boundary"
  - assert: pin_on_net
    pin: "J_ISOLOOP.2"
    net: CONTACTOR_LOOP
    adr: "0011"
    why: "loop return; J_ESTOP pins 3/4 are now GND so that housing is SELV-ONLY. J_ISOLOOP.3 is the SAME net (the on-board link the old inter-connector CONTACTOR_LOOP made) and is a SEPARATE SCREW deliberately: on a safety interlock one loosening screw must not drop both the E-stop return and the contactor feed"
  # ===== v1.3 P0-A: the merged isolated block, and the two poles that are ONE net
  - assert: pin_on_net
    pin: "J_ISOLOOP.3"
    net: CONTACTOR_LOOP
    adr: "0011"
    why: "pins 2 and 3 are the SAME board net — this is the on-board link that used to be the CONTACTOR_LOOP run between J_ESTOPLOOP and J_CONTACTOR. Asserting it pins the merge: if a future edit re-pins pin 3 to anything else, the E-stop loop stops feeding the contactor circuit and the interlock silently becomes a permanent CLOSED loop"
  - assert: pin_on_net
    pin: "J_ISOLOOP.4"
    net: CONTACTOR_E
    adr: "0011"
    why: "opto EMITTER out to the external contactor. With pins 1/4 on the two opto terminals and 2/3 on the loop link, every pole of this block is on the far side of the LTV-817S barrier — which is what lets ONE moat and ONE pour keepout defend the whole isolated domain"
  # ===== v1.3 top_v13_gate_item: VALUE invariants (an EXISTENCE assert is not a VALUE assert)
  - assert: part_value
    part: R_WDPETPD
    equals: "1k"
    adr: "0011"
    why: "THE 100k VERSION OF THIS PART PASSED ALL THREE WD_PET TOPOLOGY ASSERTS. R_WDPETPD holds WD_PET low when the Pi tri-states it, so the watchdog BITES on a dead host; the value is derived from I_IL x R < V_IL on the CD74HC221 trigger input, and at 100k the leakage drop leaves the node floating while every existence/topology invariant still reads GREEN. The VALUE is the fix"
  - assert: part_value
    part: R_OS
    equals: "510k"
    adr: "0011"
    why: "the one-shot timing resistor: R_OS x C_OS sets the PRESS_TIMED non-retriggerable pulse the press interlock is built on. A substituted decade changes the pulse width, and no topology assert can see it"
  # ===== v1.6 (adversarial audit 2026-07-27, A1/A3): the two resistor VALUES the
  # ===== board's two documented cross-plug / re-arm bounds are COMPUTED FROM.
  # ===== Both already had EXISTENCE + DIRECTION asserts, and both bounds are
  # ===== published as numbers in ORDER_README; a silent decade change would move
  # ===== the published number and leave every other invariant green.
  - assert: part_value
    part: R_COILENPD
    equals: "680"
    adr: "0018"
    why: "THE REJECTION BOUND IS COMPUTED FROM THIS NUMBER, and it was 100k until 2026-07-28. R_COILENPD now sits on COIL_EN_IN (the J_MODE pole-A field pin), NOT on the gate: the gate draws no DC, so the series R_COILENS drops ZERO volts on the legitimate path while this resistor divides an injected source in full. At 680R -- legitimate AUTO drive 3.201 V (power_tree vout_min) x 680/(680+50R, the SN74LVC1G11 Ron floor) = 2.982 V against the 2N7002 V_GS(th) MAX 2.5 V, +482 mV of margin; an injected pull-up gives 0.210 V at 10k, 0.417 V at 4.7k and 0.779 V at 2.2k (this board's OWN I2C pull-up value), all under V_GS(th) MIN 1.0 V; general bound R >= 1564 ohm. At 100k the same bound was R >= 230 kOhm, i.e. NOTHING realistic was rejected, and an SHT45 pod's 10k module pull-up cross-plugged into J_MODE put 3.000 V on that gate and armed the relay coil rail with all seven AND-chain terms AND the Manual rail-cut bypassed (v1.6 ORDER_README section 10). Raise this value and the hazard returns; raise it far enough and the published bound in ADR-0018 becomes a lie while every topology assert stays green"
  - assert: part_value
    part: R_COILENS
    equals: "680"
    adr: "0018"
    why: "the SERIES element the v1.6 audit found MISSING on this pin (J_DOOR and J_ESTOP have one, J_MODE had neither a series element nor an ESD device). It carries no DC — Q_COILDRV's gate leakage through 680R is microvolts — so its value is free on the legitimate path and is chosen to share R_COILENPD's line: ONE new BOM line covers both refs. It bounds ESD/fault current into the gate together with D_COILEN, and it is what makes COIL_EN a node that reaches the field ONLY through a resistor"
  - assert: part_value
    part: R_REARMPU
    equals: "100k"
    adr: "0011"
    why: "the re-arm line's only restraint. REARM_N = {R_REARMPU.1, U_EXP.26 (MCP23017 GPA5), U_LATCHB.1} — ONE driver, no button, no connector pin, no test point — so this pull-up is the entire reason a dead or un-initialised expander cannot clear the fault latch. It is load-bearing twice: DS20001952C gives IODIR POR = 1111 1111, so at every power-up GPA5 is an INPUT and this resistor is what holds REARM_N high while WD_OK is still low in the TPS3823 reset delay — the property that makes the coil rail unable to come up after a power interruption without an explicit re-arm (ORDER_README section 7a-1). EXP_RST_N has no driver, so nothing else on this board can restore that state"
  - assert: pin_on_net
    pin: "R_CLMPA.2"
    net: GND
    adr: "0011"
    why: "the camera-A sense-node BLEED. Without it an open thermistor reads the bare 3.3V rail, which is ABOVE the LMV393's 2.50-2.60V common-mode ceiling, so the open-detect comparator never actually compares against its threshold and the effective trip point collapses to the ceiling (~+1.6C of head temperature — a cold kitchen nuisance-trips the interlock). 22k bounds the open reading to 2.2687V, inside VICR. This resistor is what makes the open-detect real; deleting it as 'an unnecessary load on a sensor node' silently restores the defect"
  - assert: pin_on_net
    pin: "R_CLMPA.1"
    net: TH_CAM_A
    adr: "0011"
    why: "the bleed is on the sense node itself, not on the threshold"
  - assert: pin_on_net
    pin: "R_CLMPB.2"
    net: GND
    adr: "0011"
    why: "camera-B sense-node bleed, same argument"
  - assert: pin_on_net
    pin: "R_CLMPB.1"
    net: TH_CAM_B
    adr: "0011"
    why: "the bleed is on the sense node itself"
  - assert: pin_on_net
    pin: "C_COMP.1"
    net: 3V3_ANALOG
    adr: "0011"
    why: "U_COMP's bypass must sit on the rail U_COMP actually runs from. It was left on 5V_PROTECTED when the part moved, so it bypassed nothing. SLCS136V sec.8 p.12: supply variation 'cause temporary fluctuations in the comparator's input common mode range' — and the open-detect threshold is referenced to this same rail, so this 100nF is a safety component, not hygiene"


  # ===== ADR-0021 — THE OV CUTOFF SETPOINT. TWO NUMBERS, AND NOTHING ELSE ON
  # ===== THIS BOARD CAN SEE THEM. ===========================================
  # v1.2-v1.6 and the BLOCKED v1.7 staging shipped R_OVT 100k / R_OVB 15k, and
  # EVERY topology assert on this divider was green the whole time: the divider
  # existed, both legs were on the right nets, the tap reached pin 2. What was
  # wrong was arithmetic — ratio 0.130435 x V_OVLO(R) 1.20 V = a 9.200 V cutoff
  # (8.492-9.933 worst case) on a rail feeding thirteen 7.5 V reed coils and a
  # TVS whose V_BR starts at 6.40 V. BOTH v1.7 red-team lenses found it and
  # NEITHER of their fixes was correct. A value assert is the only kind of gate
  # that can see this class.
  - assert: part_value
    part: R_OVT
    equals: "100k"
    adr: "0021"
    why: "OV cutoff = V_OVLO(R) x (R_OVT + R_OVB)/R_OVB (SLVSE57C EC table, ENABLE/OVERVOLTAGE LOCKOUT (EN/OVLO) - TPS2595x3: 1.13 / 1.20 / 1.27 V rising). With 26.1k below, 100k gives 5.798 V NOMINAL and, worst case over -20..+70 C with +-0.5% legs, +-100 ppm/C TCR and I_EN +-0.1 uA across the 20.698k source, CANNOT trip below 5.3682 V (+118 mV over the ADR-0021 supply ceiling 5.25) and HAS tripped by 6.2394 V (+161 mV under the SMBJ5.0A V_BR min 6.40 at 25 C, +43 mV under the 6.2819 V that the TVS's own +0.041 %/C gives at -20 C, +1261 mV under the DIP05 coil's 7.5 V max). Both legs are ALSO code-pinned in the tsx (C270658 +-0.5%) because an auto-picked passive code is a catalog snapshot and this one sets a protection threshold"
  - assert: part_value
    part: R_OVB
    equals: "26.1k"
    adr: "0021"
    why: "THE LEG THAT WAS WRONG. At 15k the cutoff was 9.200 V nominal / 9.996 V worst case, where the SMBJ5.0A passes ~6.6 A and dissipates ~66 W — a 600 W TRANSIENT part asked to be a DC regulator — and every DIP05 coil is 2.5 V over its 7.5 V maximum. Both previously proposed values are REFUTED and must not return: 22k gives a 7.223 V latest trip (above the TVS) and 57.6k-on-the-top-leg nuisance-trips inside the old 5.5 V envelope. At 26.1k the TVS conducts at most 7.5 mA / 47 mW (25 C) or 9.3 mA / 58 mW (-20 C) before the eFuse cuts off, from Littelfuse's own two published points (I_R 800 uA at V_R 5.00 V, I_T 10 mA at V_BR 6.40 V). NOTE that this value is only admissible BECAUSE the supply is specified 4.85-5.25 V: at a 5.5 V ceiling no divider satisfies both bounds once TCR is carried"
  - assert: series_chain
    chain: [5V_RPP, R_OVT, EF_OVLO, R_OVB, GND]
    adr: "0021"
    why: "the divider is ACROSS the reverse-protected input with its tap at U_EFUSE.2 (EN/OVLO). This is the topology half of the setpoint: a 'simplification' that re-homes R_OVT to 5V_PROTECTED (the eFuse OUTPUT) would make the sense node collapse the instant the FET turns off, converting a clean hysteretic cutoff into an oscillator, and the two part_value asserts above would stay green through it"

  # ===== ADR-0020 §CORRECTION — GPB7 IS ISOLATED FROM WD_OK BY 10k ===========
  # The v1.7 P0 that this revision's OWN previous fix created: ADR-0020 moved
  # U_EXP.18 (RESET_N) onto WD_OK, where U_EXP.8 (GPB7, a BIDIRECTIONAL 25 mA
  # MCP23017 I/O) already sat beside U_WD.1 (TPS3823 RESET_N, specified only to
  # I_OL 1.2 mA). One I2C write (IODIRB.7=0, OLATB.7=1) then held the board's
  # most-consumed permission HIGH, and because the ONLY thing that stops the
  # drive is the expander's own RESET — which needs <0.660 V — the defeat was
  # SELF-SUSTAINING until the 3V3 rail dropped.
  - assert: part_value
    part: R_WDOKSER
    equals: "10k"
    adr: "0020"
    why: "THE ENTIRE BOUND IS THIS NUMBER. At 0 ohm (or a 0R link 'because it is only a readback') the P0 returns and every topology assert stays green. TPS3823-33 V_OL <= 0.4 V at I_OL = 1.2 mA (SLVS165O 6.5) => guaranteed sink impedance <= 333.3 ohm; GPB7 at 3.3 V through 9.90k (10k at -1%) into 333.3||100k = 332.2 ohm holds WD_OK at 0.107 V, 0.114 V once 21 uA of aggregate input leakage (4 x SN74LVC +-5 uA + MCP23017 +-1 uA) is added — against MCP23017 RESET V_IL = 0.2*VDD = 0.660 V (DS20001952C D031) and SN74LVC V_IL = 0.800 V: margins 546 mV and 686 mV. Contention current 0.323 mA = 27% of the V_OL spec point and 6.5% of the +-5 mA abs max. THIS IS WHAT MAKES ADR-0020 DECISION B TRUE: the forced-high node now falls below the reset threshold, the expander IS reset, GPB7 returns to an input, and the drive ends"
  - assert: pin_on_net
    pin: "U_EXP.8"                     # MCP23017 pad8 = GPB7 (watchdog readback)
    net: WD_OK_EXP
    adr: "0020"
    why: "GPB7 sits on the FAR side of R_WDOKSER and NOWHERE ELSE. This is the assert that catches the 'simplification' that deletes the resistor and reunites the two nets: R_WDOKSER would still measure 10k on the BOM, R_WDOKPD would still be 100k, U_EXP.18 would still be on WD_OK, and the self-sustaining watchdog defeat would be back"
  - assert: pin_on_net
    pin: "R_WDOKSER.1"
    net: WD_OK
    adr: "0020"
    why: "and the other end is on the RAW net, so the resistor is genuinely IN SERIES between GPB7 and the permission rather than a stub hanging off either side. Direction matters here for the same reason it mattered on R_WDPETPD: both pins named = the topology cannot be quietly re-drawn"

  # ===== v1.7 / TOPO P0-1 — THE OTHER FIVE MCP23017 PINS =====================
  # R_WDOKSER above isolated GPB7.  It was ONE of SIX pins carrying the same
  # defect, and the review battery that found it said so: GPB1-GPB5 sat DIRECTLY
  # on MODE_AUTO_HW / ESTOP_OK / DOOR_OK / TEMP_OK / FAULT.  Every one of those
  # is a bidirectional 25 mA MCP23017 I/O on an open-drain wired-AND permission
  # node, so a single I2C transaction (IODIRB=0, OLATB=0xff) forces FOUR of the
  # seven KEY_RELAY_ALLOWED terms permissive at once — and unlike GPB7 there was
  # no resistor to make the contention lose.  Measured contention without the
  # resistor: 0.863 V at the WEAKEST pull-down and 2.055 V at the realistic one,
  # against SN74LVC1G11 V_IL = 0.800 V, i.e. NO datasheet corner guarantees a
  # LOW.  TEMP_OK was the worst at 2.48 V and is the only term with no
  # independent physical backup.
  #
  # The fix is deliberately the SAME 10k line already on the BOM for R_WDOKSER
  # (C60490) — one existing line covers all six refs, so "it is only a readback,
  # make it a 0R link" has no cost argument behind it.  The bound is the same
  # arithmetic as R_WDOKSER's: a 3.3 V drive through 9.90k (10k at -1%) into the
  # consumer's pull-down cannot lift the node past V_IL, whereas a direct
  # connection is a hard 3.3 V.
  #
  # Each pin gets THREE asserts and the third one is the load-bearing one:
  # value (the bound), FAR-side pin (the expander is on the isolated node), and
  # NEAR-side pin (the resistor is genuinely IN SERIES, not a stub).  Deleting
  # the resistor and reuniting the nets leaves the first two green on their own.
  - assert: part_value
    part: R_MODEHWSER
    equals: "10k"
    adr: "0020"
    why: "the bound on GPB1. MODE_AUTO_HW is the J_MODE hardware-mode permission and it is an INPUT to U_AND1; at 0 ohm one I2C write asserts AUTO mode with the harness unplugged, which is the exact state ADR-0018 hardened the connector against. 10k (C60490, the R_WDOKSER line) keeps the forced node under SN74LVC1G11 V_IL = 0.800 V against the consumer pull-down; a 0R link restores a hard 3.3 V drive and every topology assert stays green"
  - assert: pin_on_net
    pin: "U_EXP.2"                     # MCP23017 pad2 = GPB1 (mode readback)
    net: MODE_AUTO_HW_EXP
    adr: "0020"
    why: "GPB1 sits on the FAR side of R_MODEHWSER and nowhere else. Without this the expander is back on the raw permission"
  - assert: pin_on_net
    pin: "R_MODEHWSER.1"
    net: MODE_AUTO_HW
    adr: "0020"
    why: "and the near end is on the RAW permission, so the resistor is IN SERIES rather than a stub hanging off either side. Both pins named = the topology cannot be quietly re-drawn"
  - assert: part_value
    part: R_ESTOPOKSER
    equals: "10k"
    adr: "0020"
    why: "the bound on GPB2, and this is the E-STOP term. A forced-permissive ESTOP_OK is software overriding the one control a human reaches for when the appliance is already doing the wrong thing. 10k holds the contention below V_IL; 0R does not"
  - assert: pin_on_net
    pin: "U_EXP.3"                     # MCP23017 pad3 = GPB2 (E-STOP readback)
    net: ESTOP_OK_EXP
    adr: "0020"
    why: "GPB2 sits on the FAR side of R_ESTOPOKSER and nowhere else"
  - assert: pin_on_net
    pin: "R_ESTOPOKSER.1"
    net: ESTOP_OK
    adr: "0020"
    why: "and the near end is on the RAW ESTOP_OK, so the isolation is a series element and not a stub"
  - assert: part_value
    part: R_DOOROKSER
    equals: "10k"
    adr: "0020"
    why: "the bound on GPB3. DOOR_OK is the interlock; forcing it permissive is running the cook cycle with the door open. 10k holds the contention below V_IL; 0R does not"
  - assert: pin_on_net
    pin: "U_EXP.4"                     # MCP23017 pad4 = GPB3 (door readback)
    net: DOOR_OK_EXP
    adr: "0020"
    why: "GPB3 sits on the FAR side of R_DOOROKSER and nowhere else"
  - assert: pin_on_net
    pin: "R_DOOROKSER.1"
    net: DOOR_OK
    adr: "0020"
    why: "and the near end is on the RAW DOOR_OK, so the isolation is a series element and not a stub"
  - assert: part_value
    part: R_TEMPOKSER
    equals: "10k"
    adr: "0020"
    why: "the bound on GPB4 and the WORST-MEASURED of the six: 2.48 V of contention without the resistor, 3.1x SN74LVC1G11 V_IL. TEMP_OK gates the coil rail AND the contactor AND the fault SET, and it is the only one of the seven permission terms with NO independent physical backup — there is no second device that opens if this one lies. 10k is what makes the forced node lose"
  - assert: pin_on_net
    pin: "U_EXP.5"                     # MCP23017 pad5 = GPB4 (over-temp readback)
    net: TEMP_OK_EXP
    adr: "0020"
    why: "GPB4 sits on the FAR side of R_TEMPOKSER and nowhere else"
  - assert: pin_on_net
    pin: "R_TEMPOKSER.1"
    net: TEMP_OK
    adr: "0020"
    why: "and the near end is on the RAW TEMP_OK, so the isolation is a series element and not a stub"
  - assert: part_value
    part: R_FAULTSER
    equals: "10k"
