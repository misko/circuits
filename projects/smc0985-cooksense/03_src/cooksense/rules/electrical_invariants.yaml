  # ===== ADR-0022 — U_EXP.1 (GPB0) READS A REAL, VALID LOGIC LEVEL ==========
  # TWO defects, one root, one fix.
  #
  # (a) PIN P0-b, 2026-07-28: EFUSE_FLT_N is the TPS259573's OPEN-DRAIN /FLT
  #     flag.  Pulled up to 5V_PROTECTED through R_PG 100k it idled at 5.0 V
  #     into an MCP23017 whose abs-max input is VDD+0.3 = 3.6 V — ~14 uA of
  #     continuous injection into 3V3, forever, on the part that carries five
  #     safety readbacks.
  # (b) PIN-P0-1 / TOPO P1-1, 2026-07-28: the 10k/22k divider v1.7 added to fix
  #     (a) was sized as if EFUSE_FLT_N were a STIFF 5 V source.  Its only
  #     source of high is R_PG itself, so the real chain is 100k+10k over 22k,
  #     ratio 22/132 not 22/32, and the tap sat at 0.833 V against the
  #     MCP23017 V_IH(min) of 0.8 x VDD = 2.640 V.  The fault readback was
  #     DEAD.  At R_PG = 100k no R_top > 0 solution exists — this was a design
  #     choice, not a value tweak.
  #
  # THE FIX (chosen 2026-07-29): move R_PG's top end from 5V_PROTECTED to 3V3
  # and DELETE both divider resistors.  /FLT is open-drain and indifferent to
  # the pull-up rail (SLVSE57C states no minimum; pin abs-max 20 V), so the
  # node idles at exactly the rail — 3.300 V, which is simultaneously inside
  # the MCP23017 abs-max and above V_IH.  Two parts leave the BOM.
  #
  # WHAT THE OLD ASSERTS PROVED, AND WHY IT WAS NOT ENOUGH:  the deleted block
  # asserted part_value on both divider legs and pin_on_net on all four of
  # their ends.  Every one of those PASSED on the broken board, because they
  # graded the MECHANISM (two resistors exist, at these values, on these nets)
  # and nobody graded the OUTCOME (what voltage the pin sees).  That is exactly
  # ADR-0007's M-ENTRY / claims-become-checks finding, and the `node_level`
  # assert at the bottom of this block is the remedy.  It is the LAST assert
  # here on purpose: it is the only one that can fail for an arithmetic reason.
  #
  # TP_PGOOD IS BACK ON THE NODE THE FIRMWARE READS.  The v1.7 draft kept it on
  # the raw node with the rationale "the instrument must see the real node".
  # That rationale was FALSE AS BUILT: R_FLTDIVT+R_FLTDIVB (32k) loaded the
  # 100k pull-up, so the "raw" node a probe would have seen rested at
  # 5.000 x 32/132 = 1.212 V, not 5 V.  The claim is recorded as refuted rather
  # than deleted.
  - assert: part_value
    part: R_PG
    equals: "100k"
    adr: "0022"
    why: "the ONLY source of logic-high on EFUSE_FLT_N. 100k against the MCP23017's +-1 uA input leakage costs at most 100 mV of the 660 mV headroom (3.300 - 2.640); the eFuse's own /FLT leakage is 1 uA max, so worst case 200 mV and the node still clears V_IH by 460 mV. Raise this much further and leakage, not the rail, sets the high level"
  - assert: pin_on_net
    pin: "R_PG.2"
    net: 3V3
    adr: "0022"
    why: "THE FIX, IN ONE ASSERT. Put this end back on 5V_PROTECTED and the node idles at 5.0 V into a 3.6 V abs-max input — PIN P0-b restored — while every other assert in this file, including U_EXP.1's own pin_on_net, still passes. This is the assert that distinguishes the fixed board from the broken one"
  - assert: pin_on_net
    pin: "R_PG.1"
    net: EFUSE_FLT_N
    adr: "0022"
    why: "and the pull-up's other end is on the flag node itself. A pull-up dangling on some other net leaves EFUSE_FLT_N floating: an open-drain output with no pull-up has NO defined high, and the readback would report whatever the input pin's leakage decides"
  - assert: pin_on_net
    pin: "U_EXP.1"                     # MCP23017 pad1 = GPB0 (NOT GPA0 — pad 21 is GPA0)
    net: EFUSE_FLT_N
    adr: "0022"
    why: "GPB0 reads the flag DIRECTLY now that the node is a 3.3 V node. Pad 1 is GPB0; every document in the v1.7 P0-b work called it GPA0, which is pad 21 and carries RAIL_EN_A, an OUTPUT (PIN Q-1). The copper was always right; this comment is the paperwork catching up"
  - assert: pin_on_net
    pin: "TP_PGOOD.1"
    net: EFUSE_FLT_N
    adr: "0022"
    why: "the test point and the firmware now read the SAME node, which is what the v1.7 rationale claimed and the v1.7 build did not deliver (the divider made the probed node 1.212 V). ORDER_README's bring-up table can state one number for both"

  - assert: node_level
    net: EFUSE_FLT_N
    receiver: U_EXP.1
    driver_state: released
    must_be: logic_high
    adr: "0022"
    why: >-
      THE OUTCOME, ASSERTED. With the eFuse released, U_EXP.1 must read a valid
      logic HIGH or the power-good readback is dead however correct the parts
      list looks. R_PG 100k to 3V3, no resistive path to GND, so the node is
      pulled to the rail: 3.300 V against V_IH(min) 2.640 V. The v1.7 divider
      that this replaces gave 0.833 V and passed six mechanism asserts while
      doing it.


  # ===== ADR-0023 — the reed-coil driver is a DMOS array, not a Darlington ====
  #
  # WHY THIS BLOCK EXISTS.  The ULN2803A's saturation drop (0.67 V TYP / ~0.88 V
  # worst case at the ~7 mA coil) WAS the entire reed pull-in deficit:
  #     margin(T) = 4.740 - V_driver - 3.500 x (1 + 0.004 x (T - 20))
  # crossed zero at 60.7 C typical and 45.7 C worst case — the latter BELOW the
  # brief's own <=50 C NORMAL enclosure band.  TBD62083AFWG (C165895) is a
  # pin-identical DMOS array whose EC table guarantees R_ON <= 3.25 ohm at all
  # three published current points, so 7 mA x 6.50 ohm (2x, hot bound) = 46 mV
  # and the margin is +0.774 V at +50 C / +0.424 V at +75 C.
  #
  # WHAT THESE ASSERTS ARE FOR, AND WHAT THEY ARE NOT.  Three of the four facts
  # the swap turns on are gradeable from the netlist and are graded here.  THE
  # FOURTH — THE ARITHMETIC MARGIN ITSELF — IS NOW GRADED TOO, AND THAT IS NEW
  # ON 2026-07-29.  It could not be, until this week: `_load_part_electrical()`
  # joined a dossier to a component through an LCSC CODE ONLY, and the twelve
  # reed relays are SELF-SUPPLIED — JLC stocks none of them, so their netlist
  # `value` is the MPN `DIP05-1A72-13L` and no LCSC code identifies them.  Every
  # `node_level` assert on the coil driver came back UNREACHED, i.e. the gate
  # could not express the very margin the board was re-spun to fix.  The checker
  # now ALSO joins on `mpn:` and on the dossier directory name (de58693), so the
  # eleven asserts below are LANDED rather than quoted in an ADR.
  #
  # (Forcing the join by writing the MPN into `sourcing.alternates:` was
  # considered and REJECTED: that field means "pin-compatible substitute", this
  # relay is DO-NOT-SUBSTITUTE (spec 15.4), and its own note already records an
  # alternate WITHDRAWN for being a different pin-out code.  Making a gate green
  # by writing something false into a dossier is the failure mode this repo keeps
  # paying for.  The fix went into the CHECKER, where the defect was.)
  #
  # HOW THE ARITHMETIC BECOMES ONE ASSERTION.  `v_il_max: 0.540` on the DIP05
  # dossier's pad 2 is THE PULL-IN BUDGET, not a logic threshold:
  #     node <= 0.540 V   <=>   coil sees >= 4.740 - 0.540 = 4.200 V = V_PI(+70 C)
  # where 4.740 V is `5V_KEY_RELAY`'s vout_min (power_tree.yaml) and V_PI(+70 C)
  # is the datasheet's 3.500 V MAX pull-in walked out at its own published
  # 0.4 %/K.  The equivalence is EXACT, so the whole ADR-0023 margin table
  # collapses into one inequality the checker evaluates from the netlist.
  # The contention model is the checker's own: with the coil as the pull-UP leg
  # (r_on_ohm_max 540 ohm = 450 ohm at -10 % x 1.20 at +70 C, the LOWEST coil R
  # and so the worst case for the driver's share) against the DMOS channel
  # (6.50 ohm = 2x the 25 C EC-table max, no tempco published),
  #     4.740 x 6.50 / (540 + 6.50) = 0.056 V  <=  0.540 V     PASS
  # and with the superseded Darlington's drop expressed as its equivalent
  # resistance at the same 7 mA coil current (0.67 V / 7 mA = 95.7 ohm typical,
  # 0.88 V / 7 mA = 125.7 ohm worst case),
  #     4.740 x  95.7 / (540 +  95.7) = 0.714 V  >  0.540 V     FAIL
  #     4.740 x 125.7 / (540 + 125.7) = 0.895 V  >  0.540 V     FAIL
  # RED-VERIFIED IN PLACE, both of those, by putting each Darlington-equivalent
  # resistance into the TBD62083AFWG dossier's channel rows and re-running this
  # gate: 11 FAILs each time, restored to GREEN after.  Numbers, commands and
  # verbatim failure lines: `01_docs/journal/verify_cooksense.md`, 2026-07-29.
  #
  # ELEVEN ASSERTS, NOT ONE (canon M-WIDTH).  Eleven reeds hang off the two DMOS
  # arrays and each one is its own coil, its own channel and its own net.  The
  # twelfth reed, K_STOP, is driven by a 2N7002 whose 0.10 V V_DS is an ESTIMATE
  # from a datasheet this tree has NOT committed, so it is deliberately EXCLUDED
  # and named as excluded — not silently absent.  (It is also the one with room
  # to spare: even at 0.50 V its +70 C margin is +0.054 V.)
  #
  # The COM assert below is the one whose loss would have made ADR-0023 a
  # TOPOLOGY change instead of a part swap, so it is the one worth pinning.
  - assert: node_level
    net: COIL_U1_N
    receiver: K_U1.2                  # DIP05 tsx pad2 = COIL_B, the DRIVEN end
    driver_state: contended
    aggressor: K_U1.1                 # the coil itself, pulling UP to 5V_KEY_RELAY
    defender: U_ULNA.18              # the DMOS channel, pulling DOWN
    must_be: logic_low
    adr: "0023"
    why: >-
      THE PULL-IN MARGIN, ASSERTED AS AN OUTCOME (ADR-0007's own worked example
      is this margin). The driven end of the coil must sit at or below the
      0.540 V PULL-IN BUDGET, or this reed is not guaranteed to close at the top
      of the board's own declared +70 C envelope — and a reed that does not close
      hot is a cooking appliance that silently stops switching a load, at the one
      temperature a bench test at room temperature will never reach. The
      superseded ULN2803A FAILED this at both its typical (0.714 V) and its
      worst-case (0.895 V) drop; the DMOS array reads 0.056 V. This is the assert
      the part change exists for, and until 2026-07-29 no checker could reach it.

  - assert: node_level
    net: COIL_U2_N
    receiver: K_U2.2                  # DIP05 tsx pad2 = COIL_B, the DRIVEN end
    driver_state: contended
    aggressor: K_U2.1                 # the coil itself, pulling UP to 5V_KEY_RELAY
    defender: U_ULNA.17              # the DMOS channel, pulling DOWN
    must_be: logic_low
    adr: "0023"
    why: >-
