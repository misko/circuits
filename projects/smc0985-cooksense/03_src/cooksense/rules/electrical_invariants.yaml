    why: "the bound on GPB5. FAULT is the latch output; driving it from the expander lets software CLEAR a latched fault by brute force instead of through the 7 ms REARM_N one-shot, which is the whole point of the latch having memory. 10k holds the contention below V_IL; 0R does not"
  - assert: pin_on_net
    pin: "U_EXP.6"                     # MCP23017 pad6 = GPB5 (fault readback)
