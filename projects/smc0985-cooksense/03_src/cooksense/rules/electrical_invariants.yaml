    why: "the second driver's source return, same claim"

  # ===== ADR-0024 — pod-mateable safety inputs are hardened AT THE PINOUT =========
  # THE DEFECT: `J_DOOR.4` was `DOOR_RAW`. On the two POD housings that are the
  # SAME PART (C189896 SM05B-GHS-TB, so physically cross-mateable) pin 4 is
  # `SCL_*`, which a sensor pod holds HIGH through its own module pull-up; on
  # `J_ESTOP` pin 4 is GND. `J_DOOR` alone put a safety sense node on the one pin
  # a cross-mated pod actively drives, and against `R_DOORPD` = 10k that landed
  # 2.705 V (at this board's own 2.2k I2C pull-up value) on an SN74HC14 running
  # on 3V3 — above the INTERPOLATED V_T+ MAX of 2.348 V, i.e. a guaranteed HIGH.
  # The door read CLOSED with no door attached.
  #
  # THESE ASSERTS ARE THE STRUCTURE, AND THE STRUCTURE IS THE FIX. ADR-0024
  # decision A removes the injection PATH rather than attenuating it, so the
  # load-bearing claim is a PINOUT claim and every pin of all four cross-mateable
  # housings is pinned — not just the one a lens happened to look at. That
  # denominator is the point: the defect was ONE pin out of twenty, and nothing
  # in the tree asserted the other nineteen either.
  - assert: pin_on_net
    pin: "J_DOOR.4"
    net: GND
    adr: "0024"
    why: "*** THE ASSERT THAT WOULD HAVE CAUGHT IT. *** Pin 4 was DOOR_RAW until v1.8 and it was the ONE asymmetric pin in the four-housing C189896 family. A cross-mated SHT45 pod lands its pulled-up SCL wire here: 3.3 x 10/12.2 = 2.705 V at the 2.2k corner against SCLS085L's interpolated V_T+ MAX 2.348 V = GUARANTEED HIGH = door reads CLOSED with no door attached, on a cooking appliance's interlock. On GND the pod's pull-up lands on ground and the only pin that reaches a safety node is the pod's own GND pin, which drives DOOR_RAW_IN RESTRICTIVE. The door harness never used pin 4 (3V3 on pin 1 -> Form-A reed -> pin 2), so nothing is lost"
  - assert: pin_on_net
    pin: "J_DOOR.2"
    net: DOOR_RAW_IN
    adr: "0024"
    why: "the field pin sits on the INPUT side of the series element R_DOORS, never on U_SCHM's pin — the ADR-0018 decision-D form, carried across (canon M-WIDTH)"
  - assert: pin_on_net
    pin: "J_DOOR.3"
    net: GND
    adr: "0024"
    why: "a cross-mated pod's SDA pin lands here and must land on ground"
  - assert: pin_on_net
    pin: "J_DOOR.5"
    net: GND
    adr: "0024"
    why: "shell/shield pin; a pod's SHIELD_DRAIN pin lands here"
  - assert: pin_on_net
    pin: "J_DOOR.1"
    net: 3V3
    adr: "0024"
    why: "the harness feed. It is the pin a cross-mated pod POWERS FROM, and that is deliberate: a pod that powers up normally puts its GND on pin 2 and its pull-ups on pins 3/4, which is the whole reason the enumeration comes out restrictive"
  - assert: pin_on_net
    pin: "J_ESTOP.2"
    net: ESTOP_RAW_IN
    adr: "0024"
    why: "same split as the door. J_ESTOP was ALREADY safe against the pod cross-plug and ONLY because its pins 3/4/5 are GND — a property of the pinout, not of its front end, so it survived a cross-plug and not a mis-built harness"
  - assert: pin_on_net
    pin: "J_ESTOP.3"
    net: GND
    adr: "0024"
    why: "SELV-ONLY housing (v1.3 P0-2 moved the isolated loop off it); also the pod's SDA landing pin"
  - assert: pin_on_net
    pin: "J_ESTOP.4"
    net: GND
    adr: "0024"
    why: "the pod's SCL landing pin. This pin is the reason J_ESTOP was already safe where J_DOOR was not, and it is now asserted rather than incidental"
  - assert: pin_on_net
    pin: "J_ESTOP.5"
    net: GND
    adr: "0024"
    why: "shell/shield pin"
  - assert: pin_on_net
    pin: "J_ESTOP.1"
    net: 3V3
    adr: "0024"
    why: "the harness feed for the NC E-stop contact"
  - assert: pin_on_net
    pin: "J_RH_AMBIENT.2"
    net: GND
    adr: "0024"
    why: "the OTHER half of the enumeration, and it is asserted because the hazard is SYMMETRIC: a door or E-stop harness plugged into a pod socket lands its dry contact between pin 1 and pin 2. With pin 1 = a SWITCHED sensor rail and pin 2 = GND that is a current-limited short which kills the rail loudly and, via a 3V3 droop, trips the TPS3823. Re-pin either one and that cell stops being loud"
  - assert: pin_on_net
    pin: "J_RH_AMBIENT.1"
    net: 3V3_SW_RHA
    adr: "0024"
    why: "the pod rail is SWITCHED (ADR-0004 phantom-power rule) — which is also what bounds the reverse cross-plug cell above"
  - assert: pin_on_net
    pin: "J_RH_AMBIENT.4"
    net: SCL_A
    adr: "0024"
    why: "pin 4 is SCL on the POD housings and that asymmetry against J_DOOR's old pin 4 IS the defect this ADR closes. Asserted on both sides so the pair cannot silently converge again"
  - assert: pin_on_net
    pin: "J_RH_AMBIENT.5"
    net: SHIELD_DRAIN
    adr: "0024"
    why: "shield, single-point R_SHIELD to GND"
  - assert: pin_on_net
    pin: "J_RH_EXHAUST.2"
    net: GND
    adr: "0024"
    why: "as J_RH_AMBIENT.2, second instance — two housings, two asserts"
  - assert: pin_on_net
    pin: "J_RH_EXHAUST.1"
    net: 3V3_SW_RHE
    adr: "0024"
    why: "as J_RH_AMBIENT.1, second instance"
  - assert: pin_on_net
    pin: "J_RH_EXHAUST.4"
    net: SCL_B
    adr: "0024"
    why: "as J_RH_AMBIENT.4, second instance"
  - assert: pin_on_net
    pin: "J_RH_EXHAUST.5"
    net: SHIELD_DRAIN
    adr: "0024"
    why: "shield, second instance"

  # ---- decision B: the second layer, and its VALUE is the safety figure --------
  - assert: part_value
    part: R_DOORPD
    equals: "470"
    adr: "0024"
    why: "*** 680 OHM DOES NOT TRANSFER, AND THIS NUMBER IS WHY THE ASSERT EXISTS. *** ADR-0018 rejected an injected pull-up on COIL_EN_IN with 680R because its receiver is a 2N7002 whose V_GS(th) MIN is 1.000 V. THIS receiver is an SN74HC14 on 3V3, whose lowest possible switching point is bounded WITHOUT interpolation by SCLS085L sec.5.5's V_CC = 2.0 V row: V_T+(MIN) = 0.700 V (V_T+ rises monotonically with V_CC). At 686.8R worst case the injected 2.2k gives 0.791 V and FAILS by 91 mV; 470R gives 0.591 V, 0.608 V at the 3V3 ceiling, +92 mV. The general bound is R <= 592 ohm. A silent decade change here would move a published safety figure while every existence assert stayed green — R_WDPETPD and R_OPENT were both nearly shipped exactly that way"
  - assert: part_value
    part: R_ESTOPPD
    equals: "470"
    adr: "0024"
    why: "the same bound on the E-stop input. Two field-fed inputs, two asserts — a single-instance assert on a two-instance fact is the M-WIDTH defect ADR-0020 shipped"
  - assert: part_value
    part: R_DOORS
    equals: "680"
    adr: "0024"
    why: "the series element, and it is asserted while being HONEST that it contributes ZERO to the rejection arithmetic: the HC14 input draws no DC, so it drops no volts. Its job is ADR-0018 decision D's other half — keep the field pin off the logic pin, and limit current into the HC14's own input clamp (abs max +-20 mA, SCLS085L sec.5.1) after D_DOOR clamps, because the PESD5V0S1BA's clamping voltage is far above the HC14's V_CC+0.5 V input abs-max. Without it the ESD device protects the connector and not the receiver. Shares R_COILENPD/R_COILENS's C137948 line: zero new BOM lines"
  - assert: part_value
    part: R_ESTOPS
    equals: "680"
    adr: "0024"
    why: "the E-stop series element, same claim, second instance"
  - assert: net_has_part
    net: DOOR_RAW_IN
    part_type: diode
    min: 1
    adr: "0024"
    why: "D_DOOR must sit on the CONNECTOR side of R_DOORS. An ESD device downstream of a 680R series element is protecting a node that is already current-limited and leaving the field pin bare — the moved-not-added distinction matters, so it is asserted on the net rather than merely on the part's existence"
  - assert: net_has_part
    net: ESTOP_RAW_IN
    part_type: diode
    min: 1
    adr: "0024"
    why: "D_ESTOP on the connector side, same claim"
  # THE 2.2k PULL-UPS ARE A SAFETY NUMBER ON THIS BOARD, NOT AN I2C DETAIL.
  # 2.2k is the declared worst-case injected impedance in BOTH ADR-0018's and
  # ADR-0024's tables, on the stated reasoning that a field-built pod harness
  # carries the value this shop uses. Change these and every cross-plug figure
  # published in two ADRs moves, silently, while every existence assert stays
  # green. Codes are pinned in the tsx for the same reason.
  - assert: part_value
    part: R_SCLA
    equals: "2.2k"
    adr: "0024"
    why: "the SOURCE of the worst-case injection value used by ADR-0018 and ADR-0024. Not asserted for the I2C bus (2.2k vs 4.7k would both work electrically); asserted because two safety derivations are computed FROM it"
  - assert: part_value
    part: R_SDAA
    equals: "2.2k"
    adr: "0024"
    why: "same claim; four pull-ups, four asserts, because the worst case is 'whichever value this board uses' and one drifting ref is enough to make the published figure wrong"
  - assert: part_value
    part: R_SCLB
    equals: "2.2k"
    adr: "0024"
    why: "same claim, bus B"
  - assert: part_value
    part: R_SDAB
    equals: "2.2k"
    adr: "0024"
    why: "same claim, bus B"

  # ---- BLOCKER 2: the eFuse input capacitor, which did not exist --------------
  # MEASURED before adding it: 5V_IN / 5V_FUSED / 5V_RPP carried ZERO capacitors;
  # C_IN1 and C_IN2 are both on 5V_PROTECTED, the OUTPUT. The keep_short budget
  # written to hold this named `5V_SELV`, which is not a net on this board, so
  # P-ADJ could never grade it and the row read as covered. An unenforceable
  # budget is not a weak check — it is a check that CANNOT FAIL.
  - assert: net_has_part
    net: 5V_RPP
    part_type: capacitor
    min: 1
    adr: "0001"
    why: "SLVSE57C sec.10 Fig.67 + sec.11 Fig.68: '0.01uF+ Cin between IN and GND with MINIMAL loop area at the IN/GND terminals'. Eq.18 names the function — it bounds the SHORT-CIRCUIT INTERRUPT TRANSIENT, i.e. the spike the input-side inductance produces when the eFuse's current limit slams shut. This board has MORE series inductance ahead of the part than the EVM does (J_PWR harness + F1 polyfuse + Q_REV), not less, and the IN pins' abs max is 20 V. For five releases there was no capacitor on ANY of the three input-side nets and the gate that should have caught it was addressed to a net that does not exist"
