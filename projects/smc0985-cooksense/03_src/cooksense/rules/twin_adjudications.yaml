# -- J_PI 2x20 THT pin socket (KiCad PinSocket_2x20_P2.54mm_Vertical vs JLC
#    HDR-TH_40P-P2.54-V-F-R2-C20). MIRRORED here is a NUMBERING-WIND convention,
#    not a mirrored land pattern. MEASURED pad maps (footprint-local): ours winds
#    odd/even as two COLUMNS x={0,-2.54} advancing +y (pad1 (0,0), pad2 (-2.54,0),
#    pad39 (0,48.26), pad40 (-2.54,48.26)); JLC winds odd/even as two ROWS
#    y={+1.27,-1.27} advancing +x (pad1 (-24.13,+1.27), pad2 (-24.13,-1.27)).
#    Rotating either into the other's frame lands the odd/even columns SWAPPED ->
#    mirror fit 0.00mm, i.e. the PHYSICAL 2x20 2.54mm hole grids are IDENTICAL
#    and only the pad-number assignment winds oppositely. The part is a
#    shroudless, keyless, symmetric 40-contact THT socket: each contact connects
#    ONLY to the hole it sits in — there is no internal die/pin identity to
#    mirror (unlike the VQFN incident this check exists for). Assembly is
#    hole-constrained; electrical pin-1 is defined by OUR footprint numbering +
#    netlist + silk, which the Pi mates to by physical position. Backstop: JLC
#    order-preview rotation check in ORDER_README (THT rotation is operator
#    instruction only).
- {lcsc: C35165, refs: [J_PI], status: MIRRORED,
   why: "Numbering-wind convention on a symmetric keyless 2x20 THT socket: hole grids identical (mirror fit 0.00mm), ours winds by column (+y), JLC by row (+x); no internal pin identity to mirror, hole-constrained assembly; pin-1 defined by our netlist+silk."}
