#    JLC center 1.15 len 1.00 = [0.65..1.65] -> JLC pad is a near-SUBSET of ours
#    (overlap 1.00mm/side). The 2.10-vs-2.49 pad1<->3 span = 2x the 0.212mm center
#    delta from pad-length difference; lead lands on both.
