   why: "SOT-23 pad-length class: ours [0.20..1.68] vs JLC [0.65..1.65] per side, overlap 1.00mm (JLC near-subset of ours); pitch 1.90 identical, fit non-mirrored. KiCad official IPC pattern vs EasyEDA house fillet."}

