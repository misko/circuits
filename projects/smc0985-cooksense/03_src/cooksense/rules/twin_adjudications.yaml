# successor lead). Every entry cites MEASURED evidence (canon M4). Statuses match
# the twin's finding strings exactly.
#
# METHOD for the PAD-GEOM class (22 refs, 12 footprint classes): our pad geometry
# extracted from 04_kicad/cooksense.kicad_pcb (footprint-local frame), JLC's from
# the twin's fetched jlc.pretty/*.kicad_mod (scratchpad cook_twin/easyeda/<code>).
# In EVERY case the pitch and pad TOPOLOGY are identical and the pad-NUMBER fit is
# non-mirrored (twin status PAD-GEOM, not MIRRORED); the pairwise-span delta is
# pad LENGTH / fillet-style preference along the across-body axis: KiCad official
# (IPC/JEDEC nominal) vs EasyEDA house style. For each class the HEEL..TOE extents
# of both patterns are given plus their shared landing-zone OVERLAP — the lead
# lands on copper in both patterns. This is the same adjudicated class as
# usb-hub-3s C83846/C148222 ("KiCad-vs-EasyEDA fillet-length preferences on JEDEC
# bodies"); the SMB numbers there (4.30 vs 4.72) are byte-identical to D_TVS here.
# Render check (twin_top.png): every body below mounts centered on its pads;
# U_OPTO pin-1 dot top-left = our pad 1; audit_board polarity gate (18 checks,
# incl. pad1=cathode vs footprint marker for every 2-pad polarized part) PASS.

