      # 284 / 183 legal points respectively, and the site taken is the one nearest
      # the pad centre in each case (three ARE the centre).
      - {x0: 169.25, y0: 70.11, x1: 170.35, y1: 71.21, layer: User.2}  # R_AND2PD.2  GND@169.800,70.660
