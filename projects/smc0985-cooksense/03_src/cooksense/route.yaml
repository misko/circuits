      # Coords = MEASURED pad centres.
      - {x0: 78.47, y0: 65.45, x1: 79.57, y1: 66.55, layer: User.2}  # C_DECU.1  3V3@79.02 (both C_DECU pads plane; box W of C_DECU.2 GND@79.98)
      - {x0: 121.96, y0: 85.87, x1: 123.06, y1: 86.97, layer: User.2}  # R_BID1.2  3V3@122.51 (BOARD_ID1 signal pad1@121.49 W; E-biased)
      - {x0: 182.288, y0: 72.8, x1: 183.388, y1: 73.9, layer: User.2}  # U_LATCHB.5 3V3@182.84 (top-R corner pin; pin4 GND-domain@74.65 S)
      - {x0: 127.815, y0: 91.055, x1: 128.96, y1: 92.155, layer: User.2}  # R_RAENRHEPD.2 GND@128.51 (RAIL_EN_RHE signal pad1@127.49 W; E-biased). WIDENED 0.70->0.90 (task#21, 2026-07-25): at +-0.35 the box does not cover via_r 0.125 + gap 0.155 + track_half 0.125 = 0.405 and KRT enforces rects on the track CENTRELINE, so this site REFUSED on the race-3 chain. 0 foreign pads inside the wider box (MEASURED).
      # PLACEMENT-FIX plane-bond via RESERVATIONS (D-BACK, task#21, 2026-07-25).
      # The 3cd2ac7 reuse-stitch left exactly 3 hard-unconnected plane pads + 1
      # illegally-served one; ALL FOUR were PLACEMENT-trapped, not stitch noise
      # (measured on-pad best via gaps, via r0.125 / cu-cu floor 0.150):
      #   R_SHIELD.2 GND  -0.056 (ADC_CH5/TH_CAM_B B.Cu crossing the pad)
      #   R_DECUPD.2 GND  -0.014 (SEL_U6 B.Cu)
      #   U_SCHM.14  3V3  -0.035 (SEL_D3 B.Cu; pad_rescue's 4mm detour through the
      #                           isolation-comb keepout = all 51 items_not_allowed)
      #   R_STOPPD.2 GND  +0.325 (CLEAR — needs only a deterministic bond)
      # The first three are FIXED UPSTREAM in floorplan.yaml (R_SHIELD + R_DECUPD
