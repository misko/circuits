      # Coords = via sites DERIVED from the new anchors (verified after rebuild).
      - {x0: 61.525, y0: 92.15, x1: 62.625, y1: 93.35, layer: User.2}   # R_SHIELD.2  GND@62.075,92.50 (SHIELD_DRAIN pad1@60.425 W, 0.90mm clear)
      - {x0: 74.69, y0: 56.95, x1: 75.79, y1: 58.05, layer: User.2}   # R_DECUPD.2  GND@75.240,57.50 (DECU_G1_RAW pad1@76.26 E, 0.40mm clear)
      - {x0: 175.925, y0: 55.745, x1: 177.025, y1: 56.845, layer: User.2} # U_SCHM.14   3V3@176.475,56.19 (pad13 DOOR_NI y57.16 S, 0.62mm clear)
      - {x0: 170.975, y0: 63.26, x1: 172.075, y1: 64.36, layer: User.2} # U_SCHM.7    GND@171.525,63.81 (pad6 MODE_NI y62.84 N, 0.62mm clear)
      - {x0: 146.96, y0: 91.45, x1: 148.06, y1: 92.55, layer: User.2} # R_STOPPD.2  GND@147.510,92.00 (STOP_REQ pad1@146.49 W, 0.40mm clear)
