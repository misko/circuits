      - {net: 3V3, min: 0, sites: [[25.15, 68.9]]}
      # U_EFUSE EP thermal vias (P1-A): 2 GND via-in-pad in the WSON EP outline
      # (0.9x1.6 @60,45), top+bottom, connecting the EP -> In1 GND plane (the heat
      # path). Needs the EP reservation keepout (prep) to have cleared the
      # 5V_PROTECTED B.Cu trunk + tie_efuse_ep.py to have GND-ed the unnamed EP
      # sub-pads. If both sites refuse (dense escape), the fallback ladder is in
      # the routing journal (route 5V_PROTECTED south / F.Cu-pour EP bond).
      - {net: GND, min: 0, sites: [[60.0, 56.4], [60.0, 57.6]]}
      # ---- J_PI-FIELD GND ISLAND TIES (task#21 re-derived, 2026-07-25) ----
      # THE 16 REALIZATION-COUPLED SITES THAT USED TO LIVE HERE ARE DELETED. They
      # were treating a symptom: the In1/B.Cu planes were being shredded into
      # ~2.3mm squares by J_PI's own 2.54mm-pitch antipads at the old 0.30mm zone
      # clearance (neck 0.24mm < min_thickness 0.30). floorplan.yaml now pours at
      # 0.20mm clearance (neck 0.44mm) and the plane stays CONTINUOUS — MEASURED:
      # GND island groups 22 -> 6. Every coordinate below is re-derived against
      # THIS v1.2 promoted chain, and there are far fewer of them because the
      # structural cause is gone. Still realization-coupled by nature (they tie
      # pockets that ROUTED TRACKS carve) — re-derive on any re-race.
  # ANALOG_SENSE width floor (task#21, 2026-07-25, MEASURED). KRT necked ONE
  # segment of TH_CAM_B to 0.1709mm at a pad entry (1 of 3661 tracks on the
  # promoted chain; every other analog segment is 0.25) -> DRC track_width vs the
  # ANALOG_SENSE_width 0.249 floor. Routers have no netclass concept, so the
  # declarative fix is the width_floor pass, exactly as its docstring intends:
  # lift KRT's thin-pass output to the floor so the gate passes for the RIGHT
  # reason (rather than relaxing an ampacity floor to accommodate a router
  # artifact). Covers the whole ANALOG_SENSE class so any realization's neck is
  # lifted; a race that emits no neck makes this a no-op ("lifted 0 segments").
  width_floor:
    nets: {TH_CAM_A: 0.249, TH_CAM_B: 0.249, TH_MOUNT_A: 0.249, TH_MOUNT_B: 0.249,
           TH_PORT_A: 0.249, TH_PORT_B: 0.249, TH_ENCLOSURE: 0.249, TH_SPARE: 0.249,
           TC_POS: 0.249, TC_NEG: 0.249, TCAM_THRESH: 0.249}
  dedupe_vias: {radius: 0.5, metric: box}
  drop_micro_fragments: {max_length: 0.12, require_free_end: true}
  drop_dangling: {max_length: 1.0, tol: 0.05, sweeps: 4}
  split_t_junctions: {tol: 0.05}
  # ---- hole_to_hole floor: 0.5 -> 0.25 (task#21, 2026-07-25, MEASURED) -------
  # 0.5 was the TEMPLATE DEFAULT (skills/pcb-design/templates/03_src/route.yaml),
  # carried in uncommented and never reconciled with the tier THIS board
  # declares. It is not a fab number here and it never was:
  #   nets.yaml            fab_tier: jlc_4layer_advanced
  #   fab_tiers.yaml       jlc_4layer_advanced -> min_hole_to_hole: 0.25
  #   generate_rules       writes min_hole_to_hole 0.25 into cooksense.kicad_pro
  #                        BEFORE routing (canon R1) -- that is the number the
  #                        kicad-cli DRC gate actually judges against
  #   via_site_ok          (6fcf647) now checks the BOARD'S OWN m_HoleToHoleMin,
  #                        i.e. 0.25 -- so at 0.5 the repair pass was hunting for
  #                        violations the site check does not consider violations
  #   fleet                usb-hub-3s and usb-hub-3s-v2 (advanced) declare 0.25;
  #                        usb-hub-3s-v3 declares 0.5 and says "STANDARD" in the
  #                        same line. cooksense is advanced.
  # THE 0.5 WAS NEVER SATISFIED ON THIS BOARD, measured on the copper that
  # already shipped and on the copper that already passed DRC 0/0/0:
  #   v1.1 SEALED board (07_releases/.../source)  901 vias, 29 pairs < 0.50mm,
  #                                               0 pairs < 0.25mm, tightest 0.350
  #   v1.2 promoted chain (git HEAD final_chain)  757 vias, 82 pairs < 0.50mm,
  #                                               0 pairs < 0.25mm, tightest 0.297
  # Until 6fcf647 the repair pass could give up SILENTLY, so a floor that no
  # realization has ever met printed "gate: clean" over all 82. Making it fatal
  # (correctly) exposed the wrong number, not new copper. 0.25 is the honest
  # floor: it is the declared tier's published advanced-option value, it is what
  # the DRC gate enforces, and the ORDER_README already carries the order-day
  # check that the ADVANCED 0.25/0.15 via option is selected (section 3).
  hole_to_hole: {min_gap: 0.25, mode: nudge, prefer_keep: [GND]}
  # GND (In1) + 3V3 (In2) inner planes: rescue BOTH plane-nets' boxed pads.
  # NOTE: stitch_grid + pad_rescue only touch the SOUTH planes (y>=40); the
  # keypad band has no plane and no GND/3V3 pad, so nothing is rescued there.
  pad_rescue:
    nets:
      - {net: GND, layer: In1.Cu}
      - {net: 3V3, layer: In2.Cu}
    via_in_pad: true
    served_within: 1.6
    rings: [0.5, 0.7, 0.9, 1.1, 1.4, 1.8, 2.2, 2.7]
    angle_step: 15
    # stub_width 0.2 -> 0.3 (v1.2, 2026-07-24, MEASURED): 13 pad_rescue 3V3
    # stubs at 0.2 tripped the PWR_3V3 0.3 floor. The stub_scope exemption
    # rule-areas do not survive the canon-R1 generate-rules-LAST step (the
    # regenerated .kicad_dru drops appended rules), so emit stubs AT the floor
    # instead of relaxing the floor around them.
    stub_width: 0.3
    stub_scope: {min_track_width: 0.3}
    require: none
  stub_fallback: {net: [GND, 3V3], min_dist: 0.2, max_dist: 8.0, width: 0.3}
  # window 4->6, attempts 3->5 (2026-07-24): C_ULNB.2/C_SWB.2 GND sit in
  # dense escape fields where the 4mm window exhausted (C_ULNB additionally
  # north of the plane band, its only GND service a threaded path south).
  astar_fallback: {net: [GND, 3V3], width: 0.3, window: 6.0, attempts: 5, max_dist: 8.0}
  stitch_grid:
    net: GND
    x: [20, 196, 8]     # span the SOUTH logic band (board x12..200)
    y: [58, 98, 8]      # inside the GND plane (y53..102), clear of the comb edge
    # ISOLATION: no GND stitch vias north of the plane band (would bridge the comb)
    avoid: [{x0: 12.0, y0: 9.0, x1: 200.0, y1: 54.0, margin: 1.0}]
  # layers cover the declared planes per R-PREFLIGHT PF-LAYER (2026-07-24):
  # islands on an unscanned In1/In2 plane are invisible to an F/B-only scan.
  island_rescue: {min_bbox: 0.8, layers: [F.Cu, B.Cu, In1.Cu, In2.Cu], require: pads}
  unify_zone_priorities: {min_bbox: 0.8}
  heal_islands: {min_bbox: 1.5}
  prune_stitch_dangling: {tol: 0.05, min_layers: 2}
