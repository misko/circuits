  waves:
    exclude: ["GND", "3V3", "unconnected-*"]   # In1 GND plane + In2 3V3 plane own these
    groups:
      # With 0 N/S crossings these are ordinary same-side signal groups, routed
      # hardest/densest-first. safety = AND-chain + relay-control signals (all
      # SOUTH, around U_SCHM/AND-chain/U_EXP); pi = Pi-interface signals (J_PI
      # to the 595s / watchdog / expander, all SOUTH).
      # eFuse WSON-8 (0.5mm pitch) dense escape -- routed FIRST so the sandwiched
      # signal pins (esp. EF_ILM, pin 7) claim their via-in-pad escape lanes
      # before the power pins (5V_RPP/5V_PROTECTED, pwr wave) box them in.
      efuse: [EF_DVDT, EF_OVLO, EF_ILM, EFUSE_FLT_N]   # EFUSE_FLT_N renamed from PWR_GOOD_N (pin review Q1, 2026-07-23)
      # ESTOP_RAW/MODE_RAW/DOOR_RAW promoted from `rest` (v1.2d, 2026-07-24,
      # MEASURED: with the new sig-wave edge clearance ESTOP_RAW lost its
      # corridor into U_SCHM.1 in ALL 3 chains when routed last; the raw
      # safety-contact nets belong with their cleaned outputs in the early wave)
      # DECU_G1_RAW/DECD_G1_RAW also promoted (v1.2e, MEASURED: DECU_G1_RAW
      # failed "preexisting_blockers" in all chains when routed in the last
      # wave — U_SR1.3's escape walled in by earlier tracks; these are the
      # decoder-enable REQUEST lines, safety-adjacent by function).
      # ESTOP_NI/MODE_NI/DOOR_NI promoted from `sig` (task#21, 2026-07-25, MEASURED):
      # these are the 74HC14 (U_SCHM) Schmitt-conditioned intermediates of the raw
      # safety contacts. DOOR_NI links U_SCHM.10<->.13, an intra-package net that
      # must route PAST pins 11/12 (DOOR_RAW/DOOR_OK). With those raw nets in the
      # early safety wave and the _NI intermediates left for the last sig wave, the
      # _NI escape channel was already taken -> DOOR_NI stranded DETERMINISTICALLY
      # in every chain. Routing the whole conditioning chain in ONE wave frees it.
      # TC_FAULT_N promoted from `sig` (task#21 D-BACK, 2026-07-25, MEASURED): with
      # the 4 new trapped-pad reservations the sig field re-congested and TC_FAULT_N
      # (U_TC MAX31856 fault -> U_EXP.7) walled DETERMINISTICALLY in ALL 3 race
      # candidates — its long U_TC->U_EXP span lost every channel and U_EXP.7's escape
      # was boxed by FAULT (N) + BOARD_ID0/WD_OK (S). It routes to U_EXP alongside
      # FAULT (pin6) / WD_OK (pin8), so grouping it in the early safety wave lets KRT
      # order all three expander-fault escapes together, BEFORE the sig-wave BOARD_ID0
      # walls pin7. SAFETY-relevant: TC over-temp fault flag. (wave PROMOTION is the
      # journal's durable fix for walled late-wave pads.)
      safety: [TEMP_OK, WD_OK, ESTOP_OK, FAULT, TC_FAULT_N, MODE_AUTO_HW,
               DOOR_OK, REARM_N, STOP_REQ, PRESS_TIMED,
               KEY_RELAY_ALLOWED, ESTOP_RAW, MODE_RAW, DOOR_RAW,
               DECU_G1_RAW, DECD_G1_RAW, ESTOP_NI, MODE_NI, DOOR_NI]
      # THE ISOLATED DOMAIN gets its OWN wave (task#21, 2026-07-25). CONTACTOR_C
      # was sitting in `safety` at track_width 0.2 while the v1.3 ISO_CONTACTOR
      # netclass declares min_width 0.3 — prep's netclass-floor validator dies on
      # that before a single KRT cycle is spent, so the v1.3 board could not be
      # routed at all. CONTACTOR_E/CONTACTOR_LOOP were in `sig` (0.25) and would
      # have died on the next validator pass. Raising `safety` to 0.3 instead
      # would be the wrong repair: it widens 19 SELV logic nets through the
      # densest escape field on the board to fix three nets in a corner.
      # These three are the FAR side of the LTV-817S barrier. They must also hold
      # the opto_isolation_2mm DRU rule (2.0mm to every other named net), which a
      # KRT wave cannot express — the moat has to come from placement + a pour
      # keepout around the isolated corner, NOT from the router. See the P0-A
      # note in floorplan.yaml: that keepout cannot be written until the isolated
      # connectors have a legal home.
      iso: [CONTACTOR_C, CONTACTOR_E, CONTACTOR_LOOP]
      # INT_ALERT PROMOTED from `sig: rest` (2026-07-28, MEASURED), and it belongs
      # here by this group's OWN definition three lines up — "J_PI to the 595s /
      # watchdog / EXPANDER". INT_ALERT is J_PI.13 <-> U_EXP.20, the MCP23017
      # interrupt to the Pi; it was in `rest` by omission, not by a decision.
      # WHY IT HAD TO MOVE: the v1.7 reroute left it the board's ONLY unconnected
      # net — 0 copper items, ~34 mm unrouted — and that is the `sig` wave's known
      # last-net signature, which this file already records ("the 74-net sig wave
      # still left exactly 1 net stranded per chain (a DIFFERENT net...)").
      # IT IS NOT A HARD BLOCK, and that is measured rather than hoped: the SEALED
      # v1.6 board routes this same net with 19 copper items. So the net is
      # routable and the fix is to stop asking the most-congested wave to place it
      # last. Same remedy, same justification, as the ESTOP_RAW/MODE_RAW/DOOR_RAW,
      # DECU_G1_RAW/DECD_G1_RAW and ESTOP_NI/MODE_NI/DOOR_NI promotions above.
      pi: [HOST_AUTH, WD_PET, MCU_RELAY_ENABLE, KEY_CLOCK, KEY_LATCH,
           KEY_RESET_N, KEY_DATA, INT_ALERT]
      # keypad-iso domain: routes WITHIN the north band (User.3 keepout open north)
      keypad: [KP_U1, KP_U2, KP_U3, KP_U4, KP_U5, KP_U6, KP_D1, KP_D2, KP_D3,
               KP_D4, U_SEL_BUS, D_SEL_BUS, RKEY_MID, RSTOP_MID]
      # coil selects + drives: decoders/ULN (south) -> reed coil pads (y37.81).
      # ALL now on ONE side (ULN_A + ULN_B both south) -- SEL_D3/D4 + COIL_D1/D2
      # are NO LONGER crossers, they join the coil group.
      coil: [SEL_U1, SEL_U2, SEL_U3, SEL_U4, SEL_U5, SEL_U6,
             SEL_D1, SEL_D2, SEL_D3, SEL_D4,
             COIL_U1_N, COIL_U2_N, COIL_U3_N, COIL_U4_N, COIL_U5_N, COIL_U6_N,
             COIL_D1_N, COIL_D2_N, COIL_D3_N, COIL_D4_N, COIL_PRESS_N,
             COIL_STOP_N, 5V_KEY_RELAY]
      pwr: [5V_PROTECTED, 5V_IN, 5V_FUSED, 5V_RPP, 5V_STOP, 3V3_ANALOG,
            3V3_SW_A, 3V3_SW_B, 3V3_SW_RHA, 3V3_SW_RHE]
      # analog COMPARATOR nets promoted out of `sig` (task#21, 2026-07-25, MEASURED):
      # TH_CAM_B routed as part of the 84-net `sig` wave in the promoted-era chain,
      # but under current KRT it DETERMINISTICALLY strands (8/8 race chains, both
      # with and without the plane reservations — a pre-existing marginality the
      # earlier lucky race masked). The over-temp comparator nets span the whole
      # dense SW analog field (U_COMP x21 -> R_SER0/R_REF3 x58 -> J_THERM y95) and
      # lose their channels to SDA_A/SCL_A/ADC/TC when routed last. Promoting them
      # to a dedicated wave (routes BEFORE the sensor-I2C nets congest the field)
      # is the durable fix the journal harvested ("wave PROMOTION is the durable
      # fix for walled late-wave pads"). SAFETY-relevant: these are the camera
      # hard-stop sense lines (reviewer fix #2).
      # The thermistor-connector nets all DROP vertically from the SW analog
      # cluster (x21-60) to J_THERM_A/B/J_TC at y95-97, while SDA/SCL/SHIELD_DRAIN
      # run HORIZONTALLY at y92-95 straight across those drops — a structural
      # crossing conflict. Routing the vertical drops FIRST (analog wave) lets the
      # horizontal buses find the free layer around them (whack-a-mole confirmed:
      # promoting only TH_CAM shifted the fail to TH_MOUNT_A). Promote the whole
      # thermistor/comparator reach-group.
      # TC_POS promoted too (task#21): C_TCPA nudged S of U_TC's SPI fan into the
      # thermistor-drop field; its TC_POS pad is reachable only if TC_POS routes
      # WITH the analog wave (in `sig` it was walled off by the already-placed
      # analog drops). TC_POS is a thermocouple analog net — belongs here anyway.
      # ADC_CH0-7 promoted too (task#21): the failure kept landing on the single
      # "loser" net in the fully-utilised SW analog region (ADC_CH4->C_FLT4). Route
      # the WHOLE analog front-end (thermistors + TC + comparator + the 8 ADC
      # channel filters) as ONE early wave, leaving `sig` for the digital nets — a
      # clean analog/digital split that gives every analog net priority in its own
      # congested cluster.
      # ADC SPI BUS promoted from `sig` (task#21 D-BACK iterate 1, 2026-07-25,
      # MEASURED). The MCP3208 is a WALL by construction: its 8 analog inputs
      # (pads 1-8) face WEST while their C_FLT filter caps sit EAST/SE at x52-59,
      # and its SPI port (pads 10-13) faces EAST toward J_PI — so BOTH pad columns
      # need east-bound corridors and the ADC_CH nets must wrap the package. With
      # ADC_CH0-7 in the analog wave and the SPI nets left for the last `sig` wave,
      # the analog wave laid ADC_CH3 B.Cu straight across y76.000 (x40->47.5) and
      # ADC_CH4 B.Cu across y76.600 (x40.5->45.8) — sealing pads 10/11/12. Result:
      # ADC_CS_N + SPI_MISO + SPI_MOSI failed in ALL 6 race chains (deterministic,
      # not stochastic; the aa6659a race cleared them only by luck of layout).
      # Routing the SPI bus IN THE SAME WAVE lets KRT's rip-up optimizer negotiate
      # the two demands against each other instead of freezing ADC_CH first — the
      # journal's harvested rule ("wave PROMOTION is the durable fix for walled
      # late-wave pads"), applied to the pad column rather than a single net.
      # SPI_SCLK joins them: it shares the same escape column, and leaving it in
      # `sig` would just move the wall to pad 13.
      # MAX31856 status/select + cold-junction inputs promoted too (task#21 D-BACK
      # iterate 2, 2026-07-25, MEASURED). Promoting the ADC SPI bus fixed U_ADC
      # (3 fails -> 0) and the wall moved ONE package east: TC_DRDY_N failed
      # "preexisting_blockers" at U_TC.7 in all 6 chains, because the SPI bus now
      # claims U_TC's escape lanes in the analog wave while TC_DRDY_N was still
      # waiting in `sig`. Chasing it net-by-net is the whack-a-mole this file has
      # already paid for twice, so close the group by RULE instead of by symptom:
      # EVERY signal net on U_ADC or U_TC routes in the analog wave. That is what
      # the paragraph above always intended ("route the WHOLE analog front-end as
      # ONE early wave, leaving `sig` for the digital nets") — TC_CS_N/TC_DRDY_N/
      # TC_NEG/TC_NEG_IN were simply never moved. (TC_FAULT_N stays in `safety`:
      # it is an over-temp fault flag and was promoted there for U_EXP's escape.)
      analog: [TH_CAM_A, TH_CAM_B, TCAM_THRESH, TH_MOUNT_A, TH_MOUNT_B,
               TH_PORT_A, TH_PORT_B, TH_ENCLOSURE, TH_SPARE, TC_POS_IN, TC_POS,
               TC_NEG_IN, TC_NEG,
               ADC_CH0, ADC_CH1, ADC_CH2, ADC_CH3, ADC_CH4, ADC_CH5, ADC_CH6, ADC_CH7,
               ADC_CS_N, SPI_MISO, SPI_MOSI, SPI_SCLK, TC_CS_N, TC_DRDY_N]
      sig: rest

route:
  krt: ~/gits/KiCadRoutingTools
  race: 3            # KRT is stochastic: 3 concurrent chains, quick-measured best wins
  kicad_python: /usr/bin/python3
  common:
    layers: [F.Cu, B.Cu]
    fab_tier: advanced          # via/clearance floors from nets.yaml fab_tier
    no_stub_layer_swap: true
    keepout: true
    keepout_layer: User.2
    # 0.15 -> 0.18 (v1.7 SEAL PASS, 2026-07-28, MEASURED). KRT routed to its
    # 0.15mm target and TWO INDEPENDENT RACES, six candidates, all landed the
    # SAME 0.1191mm cross-net gap: ADC_CH4's B.Cu diagonal (58.410,84.9687) ->
    # (58.021,85.358) against the TH_CAM_A B.Cu stub (59.300,85.400) ->
    # (58.500,85.400) into R_SER0.1, in the dense MCP3208 filter field. 0.1191 is
    # BELOW the Default netclass rule (0.1200) and the gate is 0, not "0 real".
    # The offset is systematic — KRT's own model measured 0.15 where kicad-cli
    # measures 0.1191, i.e. ~0.031mm optimistic on a 45-degree crossing — so the
    # fix is to give the router that much headroom rather than re-race a lottery
    # that has now come up the same way six times. At 0.18 the same artefact
    # lands at ~0.149. This is the router's SEARCH clearance, not a fab or
    # netclass floor: nets.yaml still declares 0.12 and DRC still grades 0.12.
    #
    # AND 0.18 WAS TOO MUCH, MEASURED (same day, one race): at 0.18 the copper
    # violations went to ZERO on all three candidates and FIVE routed nets went
    # UNCONNECTED on all three — the router bought the margin out of coverage.
    # The shortfall being repaired is 0.0009 mm (0.1191 vs 0.1200), so 0.16 is
    # the right size of lever: it adds 0.010 mm of headroom, eleven times the
    # miss, and perturbs the search by a third of what 0.18 did.
    #   0.15 -> 0 unconnected, 1 clearance at 0.1191   (six candidates, two races)
    #   0.16 -> 0 clearance,   3 unconnected           (5V_PROTECTED, 5V_RPP, RAIL_EN_B)
    #   0.18 -> 0 clearance,   5 unconnected           (three candidates)
    #
    # AND 0.16 GLOBALLY WAS STILL THE WRONG SHAPE OF FIX. Raising the efuse/pwr/
    # sig wave effort (ripup 50->120 / none->80 / 120->170) did NOT recover the
    # three nets, so the cost is structural, not budgetary — and NONE of the three
    # nets it costs is in the wave that has the problem. The clearance miss is
    # entirely inside the `analog` wave (TH_CAM_A and ADC_CH4 are both its nets),
    # so the headroom belongs THERE and nowhere else: `common.clearance` returns to
    # 0.15, where six candidates over two races routed with ZERO unconnected, and
    # the `analog` wave alone carries `clearance: 0.16` (KRT takes a per-wave
    # --clearance). pwr/efuse/sig never see the tighter search.
    clearance: 0.15
  waves:
    # iso FIRST: three short nets in the SE corner that need a 2.0mm moat from
    # everything else (opto_isolation_2mm). Routing them before any SELV copper
    # exists is the only ordering under which KRT cannot wall them in. 0.3mm is
    # the ISO_CONTACTOR netclass floor, not a preference.
    - {name: iso, group: iso, track_width: 0.3, board_edge_clearance: 0.35,
       max_iterations: 200000, keepout_layer: User.4}
    # effort RAISED (v1.7 SEAL PASS, 2026-07-28, MEASURED): at the new 0.16 search
    # clearance this wave left `5V_RPP` one ratsnest short on all three
    # candidates — the same "ran out of ripup budget on the last net" signature
    # the sig wave showed at task#21, not a hard block. 50 -> 120 / 0.8M -> 1.5M.
    - {name: efuse, group: efuse, track_width: 0.2, max_iterations: 1500000,
       max_ripup: 120}
    - {name: safety, group: safety, track_width: 0.2,
       max_iterations: 600000, max_ripup: 40}
    - {name: pi, group: pi, track_width: 0.2, max_iterations: 600000}
    - {name: keypad, group: keypad, track_width: 0.3, keepout_layer: User.3,
       board_edge_clearance: 0.35, max_iterations: 400000}   # sel-bus rails cross the inter-reed slots (y30.5) -> keep 0.35mm
    - {name: coil, group: coil, track_width: 0.4, board_edge_clearance: 0.35, max_iterations: 500000}   # coil rail/drops pass the slots (y37.5) -> keep 0.35mm
    # effort RAISED + a ripup budget ADDED (v1.7 SEAL PASS, 2026-07-28, MEASURED):
    # this wave had NO max_ripup at all, so it could not back out of a bad
    # ordering. At 0.16 it left `5V_PROTECTED` one ratsnest short on all three
    # candidates.
    - {name: pwr,  group: pwr,  max_iterations: 1200000, max_ripup: 80}
    # analog comparator nets FIRST-served among the sensor field (task#21): route
    # before the sig wave so TH_CAM_A/B/TCAM_THRESH claim channels through the
    # dense SW cluster before SDA/SCL/ADC/TC fill it. track 0.25 (sig class).
    # ripup 120 -> 160 (task#21): the wave grew 19 -> 27 nets when the ADC/TC SPI
    # bus joined it, and it now carries the two hardest escape fields on the board.
    # clearance 0.16 ON THIS WAVE ONLY (v1.7 SEAL PASS, 2026-07-28, MEASURED).
    # TH_CAM_A and ADC_CH4 are both analog-wave nets and their 0.1191 mm crossing
    # (0.0009 mm under the 0.1200 Default rule) is the board's only copper
    # violation. KRT routed it to its own 0.15 target, i.e. its model is ~0.031 mm
    # optimistic on a 45-degree crossing; 0.16 gives 0.010 mm of headroom, eleven
    # times the miss. Applying it globally cost three routed nets in OTHER waves
    # (see common.clearance above) — this is the same fix without that bill.
    # ripup 160 -> 230 (v1.7 SEAL PASS, second measurement): with the per-wave
    # 0.16 clearance the copper violation went to ZERO on all three candidates and
    # the wave landed ONE net short — `TH_PORT_B`, the same one on all three. That
    # is the last-net budget signature, inside the wave whose search just got
    # tighter, so the budget is the thing to raise. (Raising it on the OTHER waves
    # at a global 0.16 did nothing, which is how we know this one is different.)
    - {name: analog, group: analog, track_width: 0.25, board_edge_clearance: 0.35,
       clearance: 0.16,
       max_iterations: 2000000, max_probe_iterations: 150000, max_ripup: 230}
    # board_edge_clearance added to sig (v1.2, 2026-07-24, MEASURED): SDA_B ran
    # ON the south edge (y101.9 vs edge y102, 0.00mm DRC edge clearance x3) —
    # the prep edge_band did not stop the sig wave.
    # sig effort RAISED (task#21, MEASURED): after the analog-wave promotion the
    # 74-net sig wave still left exactly 1 net stranded per chain (a DIFFERENT net
    # each race — RAIL_EN_RHA/SR_OE_N/... — i.e. KRT ran out of ripup budget on the
    # last net, not a hard block; ~24 chains never reached 0). More ripup +
    # iterations lets it clear the final net.
    - {name: sig, group: sig, track_width: 0.25, board_edge_clearance: 0.35,
       max_iterations: 1500000, max_probe_iterations: 100000, max_ripup: 170}   # 120 -> 170 (v1.7 SEAL PASS): at 0.16 the wave left RAIL_EN_B one ratsnest short on all three candidates — the identical last-net signature that 120 was chosen to cure at 0.15
  # Promoted converged chain (canon M3): 0 routed-net unconnected, 0-crossing
  # topology. `import` uses this when there is no fresh 06_build FINAL marker, so
  # `rebuild_all.sh --reuse-route` (and a fresh clone / CI) is DETERMINISTIC.
  final: 03_src/cooksense/route/final_chain.kicad_pcb

stitch:
  clearance: 0.15
  via: {spacing: 0.85, pth_margin: 0.3}    # size/drill tier-derived (advanced)
  # KEEP advanced via-in-pad size (0.25/0.15). The pass default 0.6/0.3 shorts a
  # via-in-pad board (818 DRC finds when it fired at 0.6): KRT already emits 0.25/0.15.
  # below_width per R-PREFLIGHT PF-NORM (2026-07-24): without it the pass
  # default (0.449) would resize every correctly-sized 0.25 tier via.
  normalize_vias: {size: 0.25, drill: 0.15, below_width: 0.24}
  keepin: {inset: 0.8}
  # via_janitor DROPPED (2026-07-23, successor lead; runbook step-2 option B).
  # via_janitor removes ANY via with same-net copper on <2 layers, crediting a
  # zone by its OUTLINE (fill-blind). In the dense MCP3208 ADC cluster that pruned
  # legit GND plane-bond via-in-pads whose only 2nd layer is the In1 plane ->
  # whack-a-mole cap opens (C_FLT1 before fill / C_FLT6 after fill: a different
  # marginal cap per fill state). Its one durable purpose was deleting the STOCHASTIC
  # 5V_RPP dead-end KRT detour via, which the promoted race/c0/r7 realization does
  # NOT contain (0 5V_RPP vias — MEASURED). prune_stitch_dangling (final pass) is the
  # correct cleaner: it runs AFTER fill, tests the FILLED polys (a via-in-pad in the
  # filled In1 GND counts In1 -> 2 layers -> KEPT), and only touches THIS run's
  # stitch-emitted vias. Verified: DRC 0 via_dangling.
  passes: [dedupe_vias, normalize_vias, drop_micro_fragments, drop_dangling,
           split_t_junctions, width_floor, reload, hole_to_hole, seed_stubs, pad_rescue,
           stub_fallback, astar_fallback, dedupe_vias, stitch_grid, power_stitch,
           fill, island_rescue, fill, unify_zone_priorities,
           heal_islands, prune_stitch_dangling, gate]
  # TPS259573 has TWO adjacent 5V_RPP input pins (pad 3 @59.05,45.25 + pad 4
  # @59.05,45.75, 0.5mm pitch). KRT routes the trunk to pad 3 (via-in-pad) but
  # stochastically left pad 4 as a bare pad + a dead-end detour via -- KRT's own
  # connectivity metric treats the net as served, so the race cannot select it
  # out. A DETERMINISTIC 0.25mm F.Cu bridge pad4->pad3 closes it (canon M8);
  # via_janitor then removes the orphan detour via (5V_RPP has no pour, so a via
  # touching only 1 layer connects nothing). Both run BEFORE fill.
  seed_stubs:
    clearance: 0.13
    stubs:
      - {net: 5V_RPP, pin: U_EFUSE.4,
         segments: [{layer: F.Cu, width: 0.25, pts: [[59.05, 57.75], [59.05, 57.25]]}]}
      # ADC-CLUSTER GND PLANE-BOND via-in-pads (DETERMINISM fix, 2026-07-23,
      # successor lead). The dense MCP3208 filter/vref cluster is congested enough
      # that the pad_rescue -> stub_fallback -> astar_fallback stochastic rescue
      # chain (+ heal_islands set-iteration order across SWIG re-exec) left a
      # DIFFERENT marginal cap open per reuse-rebuild realization (C_FLT1/C_FLT6
      # flipped between two consecutive reuse rebuilds -> M-REPRO fail). ROOT fix:
      # a DETERMINISTIC via-in-pad at each cap GND pad centre, placed HERE (before
      # fill AND before pad_rescue). Effect: (1) the via bonds pad -> In1 GND plane
      # directly once filled; (2) pad_rescue.has_via() then finds it (barrel in pad
      # bbox) and marks the cap SERVED, so no competing ring via is dropped by any
      # rescue pass -> no non-deterministic churn. via_site_ok-checked (refused-not-
      # -guessed) + `pin` proof (must reach the pad) + idempotent. Coords = exact
      # GND pad centres (anchored caps; measured from the board).
      - {net: GND, pin: C_ADCV.2,  vias: [[48.775, 76.000]]}
      - {net: GND, pin: C_ADCV2.2, vias: [[37.480, 76.000]]}
      - {net: GND, pin: C_FLT0.2,  vias: [[56.680, 89.200]]}
      - {net: GND, pin: C_FLT1.2,  vias: [[54.280, 89.200]]}
      - {net: GND, pin: C_FLT2.2,  vias: [[54.280, 84.800]]}
      # C_FLT3.2 nudged (56.680,84.800) -> (56.560,84.700) (task#21, 2026-07-25,
      # MEASURED). At the pad CENTRE the site clears ADC_CH4 B.Cu by only 0.055mm
      # (< the 0.13 seed_stubs floor) and the stub was REFUSED. NOTE the trap this
      # exposed: the raw promoted chain measures +0.270 there — `hole_to_hole`
      # (mode: nudge) runs BEFORE seed_stubs and DRAGS the attached track ends, so a
      # via site must be validated on the POST-NUDGE board, not on the raw chain.
      # The new site is 0.185mm off ADC_CH4 and still inside the 0402 pad.
      - {net: GND, pin: C_FLT3.2,  vias: [[56.560, 84.700]]}
      - {net: GND, pin: C_FLT4.2,  vias: [[58.480, 87.000]]}
      - {net: GND, pin: C_FLT5.2,  vias: [[52.480, 87.000]]}
      - {net: GND, pin: C_FLT6.2,  vias: [[59.280, 88.400]]}
      - {net: GND, pin: C_FLT7.2,  vias: [[57.480, 90.500]]}
      # TC-AREA + PULL-CLUSTER PLANE-BOND via-in-pads (D-BACK, task#21, 2026-07-25).
      # Deterministic bonds for the 5 pads the c0/r7 stitch stranded (2 TRAPPED in
      # every realization). Paired with the User.2 reservation rects above so the
      # site is clear on ANY realization -> single-pass, M-REPRO-stable (no
      # pad_rescue whack-a-mole). `pin` proves the via lands on the pad; the plane
      # (GND=In1 / 3V3=In2) auto-clears an antipad around the barrel so no short.
      - {net: 3V3, pin: C_TCAV.1,    vias: [[63.220, 80.900]]}
      - {net: GND, pin: C_TCAV.2,    vias: [[64.180, 80.900]]}
      - {net: GND, pin: C_TCPA.2,    vias: [[70.980, 84.000]]}
      # v1.3 c0/r9 TRAPPED plane pads (task#21, 2026-07-25). Same mechanism as the
      # TC-area group above: the User.2 reservation keeps the site clear on any
      # re-race, this bonds the pad to In1 GND deterministically, and pad_rescue
      # then finds the via and stops dropping a competing ring via (which is what
      # made C_FLT1/C_FLT6 flip between rebuilds and broke M-REPRO in v1.2).
      - {net: GND, pin: C_SWB.2,     vias: [[46.275, 87.000]]}
      - {net: GND, pin: R_DECDPD.2,  vias: [[115.310, 64.100]]}
      # Round two (see the floorplan note): sites OFF the pad centre, measured as
      # the best of a 41x41 on-pad scan against the promoted copper — the pad
      # centre is not automatically the best site and on C_ULNA.2 it is not even
      # a legal one.
      - {net: 3V3, pin: C_DECUEN.1,  vias: [[83.040, 63.100]]}
      - {net: GND, pin: C_ULNA.2,    vias: [[96.800, 66.190]]}
      - {net: GND, pin: C_DVDT.2,    vias: [[57.480, 60.000]]}
      - {net: 3V3, pin: C_AND3.1,    vias: [[183.020, 70.450]]}   # y70.600 -> y70.450 (task#21, 2026-07-25, MEASURED): the 0.50mm-wide 5V_STOP B.Cu trunk re-routed to y71.100, leaving the pad centre 0.125mm off it (a WIDE track costs twice a signal track's margin) and the stub REFUSED. y70.450 is on-pad (0402 y[70.28,70.92]), inside the existing whole-cap rect, gap 0.275mm.
      # NEW-v1.2 TRAPPED plane-bond via-in-pads (D-BACK, task#21, 2026-07-24). Paired
      # with the User.2 reservation rects above; re-race keeps the sites clear, then
      # these bond the pad to its plane (3V3=In2 / GND=In1). R_REARMPU.2 stub RESTORED
      # (the diagnostic proved it strands trapped). All via-in-pad at MEASURED centres.
      - {net: 3V3, pin: C_DECU.1,     vias: [[79.020, 66.000]]}
      # R_BID1.2 nudged y86.500 -> y86.420 (task#21, 2026-07-25, MEASURED): the pad
      # centre sits 0.150mm off SDA_B B.Cu (y86.900) — dead on the cu-cu floor, the
      # same class that refused R_RAENRHEPD. Moving 0.08mm north (still on-pad,
      # y[86.19,86.81]) opens SDA_B to 0.230 while keeping I2C_SDA F.Cu (y85.800)
      # at 0.370 — centred in the only free window, y[86.18,86.52].
      - {net: 3V3, pin: R_BID1.2,     vias: [[122.510, 86.420]]}
      - {net: 3V3, pin: R_REARMPU.2,  vias: [[122.510, 91.500]]}
      # v1.7 SEAL PASS (2026-07-28) — the four pads the R_WDOKSER reroute stranded.
      # Paired one-for-one with the reservation rects above. Sites measured on the
      # post-stitch board with pcb_toolkit.via_site_ok (0.25/0.15, clearance 0.13);
      # the growth margin quoted is how far the via could grow before the site
      # stops being legal, i.e. how much slack the site has beyond the floor.
      - {net: GND, pin: R_AND2PD.2,   vias: [[169.800, 70.660]]}   # 135 legal on-pad sites, pad centre, growth 0.25
      - {net: GND, pin: R_MODEPD.2,   vias: [[191.750, 63.900]]}   # 125 legal, 0.030 off centre, growth 0.27
      - {net: 3V3, pin: R_FAULTPU.2,  vias: [[169.390, 75.950]]}   # 284 legal, pad centre, growth 0.87
      - {net: 3V3, pin: U_LATCHA.5,   vias: [[170.838, 73.350]]}   # 183 legal, pad centre, growth 0.61 (SOIC-6 pad 1.02x0.35)
