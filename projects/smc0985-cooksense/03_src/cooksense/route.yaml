# cooksense route + stitch — input for skills/kicad-pcb/scripts/route_and_stitch_generic.py
#
# ADR-0007 NESTING: this config lives at 03_src/cooksense/route.yaml, so its
# grandparent is 03_src (NOT the project root). ALL commands MUST pass
# --root <project root>:
#   /usr/bin/python3 $S/route_and_stitch_generic.py prep 03_src/cooksense/route.yaml \
#       --root projects/smc0985-cooksense
# The flat-path lookups (fab_tier_util.resolve, net_class_floors) read
# <root>/03_src/rules/nets.yaml -> symlinked to cooksense/rules/nets.yaml.
#
# ====================== v1.1 ISOLATION COMB (D7, 2026-07-23) ==================
# v1.1 rot0 vertical-relay repack (188x92, pitch 15.24): each relay's coil and
# contact COLUMNS are E-W separated (7.62mm c-c / 6.12mm pad-edge). Pairing
# (rot180|rot0) makes 6 COIL GAPS (logic, within pairs) and 7 KEYPAD POCKETS
# (isolated, between pairs + both board ends). Domain rule enforced here:
#   - LOGIC (User.2 keepout): forbidden north of y29.4 everywhere, and forbidden
#     y29.4..53.0 in every pocket + every intra-relay column. Logic reaches coil
#     pads (y30.38/45.62) ONLY from inside the 6 coil-gap x-windows.
#   - KEYPAD (User.3 keepout): forbidden south of y47.0 everywhere, and
#     forbidden y23.2..47.0 in every coil gap + every intra-relay column.
#     Keypad lives in the north band (copper <=23.2) + the 7 pocket channels.
#   => creepage by construction: band 23.2 vs gap pads 29.63 (6.28mm); pocket
#      pads 46.37 vs logic/planes 53.0 (6.63mm); intra-relay columns 6.12mm;
#      pocket drops vs coil pads 7.62mm horizontal. I-ISO re-MEASURES this.
#   - GND (In1/F/B) + 3V3 (In2) planes confined to y >= 53 (keypad_iso
#     deny-pour covers y<53). Both plane nets are KRT-excluded.
# Relay centers x = 26.00 + n*15.24 (n=0..11), row y=38. Column barriers at
# xc+-3.0; coil gaps g1..g6 = [29.00,38.24] [59.48,68.72] [89.96,99.20]
# [120.44,129.68] [150.92,160.16] [181.40,190.64]; pockets = west [12,23.00],
# p1..p5 = [44.24,53.48] [74.72,83.96] [105.20,114.44] [135.68,144.92]
# [166.16,175.40], east [196.64,200].

project:
  name: cooksense
  board: 04_kicad/cooksense.kicad_pcb
  build_dir: 06_build/route

prep:
  out: r0.kicad_pcb
  keepouts:
    layers: [User.2, User.3, User.4]  # U.2 = logic keepout (north band); U.3 = keypad keepout (south band); U.4 = the `iso` wave's own layer (v1.3 P0-A) — it carries the MIRROR of the moat: no SELV-side rects (so the iso wave may route inside the moat every other wave is excluded from) plus the two rects that keep the iso wave from leaving it
    mounting_holes: {radius: 3.0}
    edge_band: 0.7
    rects:
      # ===== v1.3 P0-A: KEEP SELV COPPER OUT OF THE ISOLATED CORNER =========
      # The opto_isolation_2mm DRU rule is 2.0mm from ISO_CONTACTOR copper to
      # every other named net. The pours are handled by the iso_moat keepouts in
      # floorplan.yaml; TRACKS are handled here. These rects are the SAME 2.0mm
      # offset of the isolated copper, on User.2 — so every wave sees them and
      # routes around the corner — while the `iso` wave runs on User.4 and is
      # free to route INSIDE its own moat. Without this a single SELV signal
      # detouring through the SE corner re-opens the barrier the whole v1.3
      # revision exists to close (v1.2 measured 82 violations, worst 0.199mm).
      - {x0: 192.20, y0: 86.65, x1: 200.10, y1: 102.10, layer: User.2}  # J_ISOLOOP pads + 2.0mm (== floorplan iso_moat_block)
      - {x0: 186.70, y0: 85.80, x1: 192.80, y1: 94.20, layer: User.2}   # U_OPTO isolated pads + 2.0mm / the run east (== iso_moat_opto)
      # ===== AND THE ISO WAVE NEEDS THE MIRROR OF THAT, ON ITS OWN LAYER =======
      # The rects above keep SELV copper OUT of the isolated corner. They do
      # nothing to keep the ISOLATED copper IN it, and the first v1.3 route proved
      # that is not a theoretical gap: KRT ran CONTACTOR_C east along y88.300 and
      # kicad-cli returned 2 clearance violations, `opto_isolation_2mm` 2.0000mm
      # required / 1.9078mm actual, CONTACTOR_C F.Cu vs J_DOOR pad MP [GND]. The
      # moat is symmetric and so is its enforcement. These two rects are the
      # complement — the region the iso wave may NOT enter — derived, not chosen:
      #   U4-a  J_DOOR's south GND shell tab is x[197.0,199.7] y[85.61,86.61]; its
      #         2.0mm dilation reaches y88.61. KRT enforces rects on the track
      #         CENTRELINE, so the edge is set 0.24mm beyond that (88.85) to cover
      #         half a 0.3mm iso track plus margin: a centreline at y88.86 puts
      #         copper at 88.71, which measures 2.13mm to the tab corner and
      #         2.06mm to the moat's own north boundary (86.65). J_ISOLOOP.4's pad
      #         CENTRE is y89.75, so the pad stays reachable.
      #   U4-b  the block moat's west boundary is x192.20, so iso copper must sit
      #         at x>=194.20 wherever the opto lobe does not cover it (y>94.20).
      #         Edge at 194.40 by the same centreline argument; J_ISOLOOP's pad
      #         centre x195.30 stays reachable, and U_OPTO's isolated pads end at
      #         y92.16, north of the rect, so the opto is not walled in.
      # Together they leave exactly the corridor the moat can defend: the y[88.85,
      # 92.40] band from U_OPTO east, then the x[194.40,200.10] column south to
      # J_ISOLOOP.1. That is the ONLY path, which is what determinism looks like.
      - {x0: 194.00, y0: 83.60, x1: 200.10, y1: 88.85, layer: User.4}   # U4-a: J_DOOR MP tab + 2.0mm, centreline-corrected
      - {x0: 186.00, y0: 92.40, x1: 194.40, y1: 102.10, layer: User.4}  # U4-b: west of the block moat's 2.0mm interior
      # ---- TRAPPED PLANE-PAD RESERVATIONS (task#21, 2026-07-25, MEASURED) -----
      # C_SWB.2 and R_DECDPD.2 were the two GND pads the c0/r9 stitch stranded
      # (GND union-find over filled copper: 5 clusters, these two the singletons;
      # kicad-cli: 2 unconnected_items). Both are now ANCHORED (floorplan.yaml) and
      # seeded below. Rects are the +-0.55mm reservation-sizing rule above, applied
      # to the pad CENTRE; neither box touches a foreign pad (nearest is each
      # part's own pin 1, 0.20mm and 0.55mm clear).
      - {x0: 45.725,  y0: 86.450, x1: 46.825,  y1: 87.550, layer: User.2}  # C_SWB.2 GND via site
      - {x0: 114.760, y0: 63.550, x1: 115.860, y1: 64.650, layer: User.2}  # R_DECDPD.2 GND via site
      - {x0: 82.490,  y0: 62.550, x1: 83.590,  y1: 63.650, layer: User.2}  # C_DECUEN.1 3V3 via site
      - {x0: 96.250,  y0: 65.640, x1: 97.350,  y1: 66.740, layer: User.2}  # C_ULNA.2 GND via site
      # ---- EDGE BANDS (User.2, v1.2f MEASURED): the sig wave's
      # board_edge_clearance flag did NOT stop SDA_B from routing ON the south
      # edge (track+via at y101.9-102.0, DRC copper_edge x3, two consecutive
      # realizations). Explicit deny rects are the mechanism KRT provably
      # respects (the comb). 0.8mm bands, clear of every pad (checked: south
      # connectors end y98.4, east connectors' pads x<=198). North band is
      # already fully denied (y<29.4). ----
      - {x0: 12.0,  y0: 101.2, x1: 200.0, y1: 102.1, layer: User.2}
      - {x0: 12.0,  y0: 29.4,  x1: 12.8,  y1: 102.1, layer: User.2}
      - {x0: 199.2, y0: 29.4,  x1: 200.0, y1: 102.1, layer: User.2}
      # ============ RESERVATION-RECT SIZING RULE (task#21, 2026-07-25) ==========
      # EVERY pin-proved seed_stub via site below is reserved with at least
      # 0.55mm of margin from the site to its rect edge, in BOTH axes. That
      # number is derived, not chosen:
      #     KRT enforces these rects on the track CENTRELINE (MEASURED — a
      #     0.5mm 5V_STOP track sat with its centreline exactly ON the R_OS2.2
      #     rect edge y55.90, putting 0.25mm of copper inside and refusing the
      #     stub). So the half-box must cover
      #         hole-to-copper 0.28  +  half the WIDEST track that can run there
      #     = 0.28 + 0.25 (PWR_IN 0.5mm) = 0.53mm.  0.55 with rounding.
      # The earlier +-0.35 and +-0.45 boxes cover only a 0.14mm and a 0.34mm
      # track respectively, which is why "reserved" pads kept refusing across
      # re-races while the whole cluster looked protected. FOUR consecutive
      # races each refused a DIFFERENT 2-4 stubs, always ones whose rect was
      # undersized; the +-0.45 group never refused against a signal track and
      # only ever failed against a 0.5mm power track. This pass widened 46
      # rects to the 0.55 rule, clipped 0.10mm off any foreign pad (VERIFIED:
      # 0 rects overlap a pad they do not own) — 51/51 sites now clear.
      # If you add a seed_stub, add its rect at >= 0.55 or it WILL refuse
      # eventually; the audit that finds violations is:
      #   for every stubs[].vias site, min distance to its containing rect edge
      # ---- LOGIC keepout (User.2): the isolation-comb keypad domain ----
      # Full north band: no logic track above y29.4 anywhere (coil pads at
      # y30.38 are still reachable from the south).
      - {x0: 12.0, y0: 9.9, x1: 200.0, y1: 29.4, layer: User.2}
      # 7 keypad pockets + 12 intra-relay columns: logic excluded down to y53.45.
      # SOUTH EDGE 53.0 -> 53.45 (task#21, 2026-07-25, MEASURED). KRT honours these
      # User.2 rects on the track CENTRELINE, but the DRC rule areas that actually
      # enforce the isolation comb (floorplan.yaml iso_col_*/iso_pktS_*) end at
      # y52.9 and are tested against COPPER. A 0.40mm coil track whose centreline
      # sat at y53.05 therefore put its edge (and its 0.2mm round end-cap) at y52.85
      # — 0.05mm INSIDE the rule area: COIL_D3_N tripped items_not_allowed on both
      # layers at the full gate while KRT considered itself compliant. 53.45 keeps a
      # centreline-compliant 0.4mm track's copper at y>=53.25, i.e. 0.35mm clear of
      # the 52.9 rule-area edge. (The physical creepage was never breached — 52.85
      # vs the pocket pads at 46.37 is still 6.48mm > 6.0mm — but the machine-checked
      # barrier is the gate, and a safety barrier is not a thing to run at 0.05mm.)
      - {x0: 12.00,  y0: 29.4, x1: 23.00,  y1: 53.45, layer: User.2}   # west end
      - {x0: 44.24,  y0: 29.4, x1: 53.48,  y1: 53.45, layer: User.2}   # p1 r2r3
      - {x0: 74.72,  y0: 29.4, x1: 83.96,  y1: 53.45, layer: User.2}   # p2 r4r5
      - {x0: 105.20, y0: 29.4, x1: 114.44, y1: 53.45, layer: User.2}   # p3 r6r7
      - {x0: 135.68, y0: 29.4, x1: 144.92, y1: 53.45, layer: User.2}   # p4 r8r9
      - {x0: 166.16, y0: 29.4, x1: 175.40, y1: 53.45, layer: User.2}   # p5 r10r11
      - {x0: 196.64, y0: 29.4, x1: 200.0,  y1: 53.45, layer: User.2}   # east end
      # 12 intra-relay column barriers (coil<->contact, 6.12mm pad-edge).
      - {x0: 23.00,  y0: 29.4, x1: 29.00,  y1: 53.45, layer: User.2}   # r1
      - {x0: 38.24,  y0: 29.4, x1: 44.24,  y1: 53.45, layer: User.2}   # r2
      - {x0: 53.48,  y0: 29.4, x1: 59.48,  y1: 53.45, layer: User.2}   # r3
      - {x0: 68.72,  y0: 29.4, x1: 74.72,  y1: 53.45, layer: User.2}   # r4
      - {x0: 83.96,  y0: 29.4, x1: 89.96,  y1: 53.45, layer: User.2}   # r5
      - {x0: 99.20,  y0: 29.4, x1: 105.20, y1: 53.45, layer: User.2}   # r6
      - {x0: 114.44, y0: 29.4, x1: 120.44, y1: 53.45, layer: User.2}   # r7
      - {x0: 129.68, y0: 29.4, x1: 135.68, y1: 53.45, layer: User.2}   # r8
      - {x0: 144.92, y0: 29.4, x1: 150.92, y1: 53.45, layer: User.2}   # r9
      - {x0: 160.16, y0: 29.4, x1: 166.16, y1: 53.45, layer: User.2}   # r10
      - {x0: 175.40, y0: 29.4, x1: 181.40, y1: 53.45, layer: User.2}   # r11
      - {x0: 190.64, y0: 29.4, x1: 196.64, y1: 53.45, layer: User.2}   # r12
      # ---- KEYPAD keepout (User.3): the logic domain ----
      # Full south band: no keypad track below y47.0 (pocket contact pads at
      # y45.62 are still reachable from the north).
      - {x0: 12.0, y0: 47.0, x1: 200.0, y1: 102.1, layer: User.3}
      # 6 coil gaps: keypad excluded from the logic windows (band cap y23.2
      # keeps keypad-band copper >=6.28mm from the gap coil pads at y29.63).
      - {x0: 29.00,  y0: 23.2, x1: 38.24,  y1: 47.0, layer: User.3}   # g1
      - {x0: 59.48,  y0: 23.2, x1: 68.72,  y1: 47.0, layer: User.3}   # g2
      - {x0: 89.96,  y0: 23.2, x1: 99.20,  y1: 47.0, layer: User.3}   # g3
      - {x0: 120.44, y0: 23.2, x1: 129.68, y1: 47.0, layer: User.3}   # g4
      - {x0: 150.92, y0: 23.2, x1: 160.16, y1: 47.0, layer: User.3}   # g5
      - {x0: 181.40, y0: 23.2, x1: 190.64, y1: 47.0, layer: User.3}   # g6
      # 12 intra-relay column barriers (keypad side).
      - {x0: 23.00,  y0: 23.2, x1: 29.00,  y1: 47.0, layer: User.3}   # r1
      - {x0: 38.24,  y0: 23.2, x1: 44.24,  y1: 47.0, layer: User.3}   # r2
      - {x0: 53.48,  y0: 23.2, x1: 59.48,  y1: 47.0, layer: User.3}   # r3
      - {x0: 68.72,  y0: 23.2, x1: 74.72,  y1: 47.0, layer: User.3}   # r4
      - {x0: 83.96,  y0: 23.2, x1: 89.96,  y1: 47.0, layer: User.3}   # r5
      - {x0: 99.20,  y0: 23.2, x1: 105.20, y1: 47.0, layer: User.3}   # r6
      - {x0: 114.44, y0: 23.2, x1: 120.44, y1: 47.0, layer: User.3}   # r7
      - {x0: 129.68, y0: 23.2, x1: 135.68, y1: 47.0, layer: User.3}   # r8
      - {x0: 144.92, y0: 23.2, x1: 150.92, y1: 47.0, layer: User.3}   # r9
      - {x0: 160.16, y0: 23.2, x1: 166.16, y1: 47.0, layer: User.3}   # r10
      - {x0: 175.40, y0: 23.2, x1: 181.40, y1: 47.0, layer: User.3}   # r11
      - {x0: 190.64, y0: 23.2, x1: 196.64, y1: 47.0, layer: User.3}   # r12
      # ADC-FRONT-END GND-VIA RESERVATIONS (D-ADJ, routing D-BACK 2026-07-23).
      # The dense MCP3208 filter/vref cluster covers cap GND via sites with signal
      # tracks on BOTH layers (astar exhausted a 4mm window -> stitch cannot drop a
      # via-in-pad). WHICH cap opens is whack-a-mole across route/legalize seeds,
      # so ALL 10 cluster caps are reserved: each rect fences OTHER-net tracks off
      # the GND pad + its via site (User.2 blocks BOTH F.Cu and B.Cu); the caps are
      # ANCHORED (floorplan) so these coords stay on-pad. GND (In1 plane) is
      # KRT-excluded, so nothing legit routes to the pad; the signal pad (pad 1)
      # escapes WEST, clear of each rect's west edge (>=0.2mm). rects = GND pad
      # centre-biased east: [gx-0.48 .. gx+0.52] x [gy-0.65 .. gy+0.65] (small
      # caps); C_ADCV/C_ADCV2 sized for their 0.90mm pad.
      # (v1.1: ADC cluster translated RIGIDLY +6y with its floorplan anchors)
      - {x0: 48.15, y0: 75.35, x1: 49.75, y1: 76.65, layer: User.2}   # C_ADCV  GND@48.77,76.00
      - {x0: 36.93, y0: 75.35, x1: 38.03, y1: 76.65, layer: User.2}   # C_ADCV2 GND@37.48,76.00
      - {x0: 56.13, y0: 88.55, x1: 57.23, y1: 89.85, layer: User.2}   # C_FLT0  GND@56.68,89.20
      - {x0: 53.73, y0: 88.55, x1: 54.83, y1: 89.85, layer: User.2}   # C_FLT1  GND@54.28,89.20
      - {x0: 53.73, y0: 84.15, x1: 54.83, y1: 85.45, layer: User.2}   # C_FLT2  GND@54.28,84.80
      - {x0: 56.01, y0: 84.15, x1: 57.2, y1: 85.45, layer: User.2}   # C_FLT3  GND@56.68,84.80
      - {x0: 57.93, y0: 86.35, x1: 59.03, y1: 87.65, layer: User.2}   # C_FLT4  GND@58.48,87.00
      - {x0: 51.93, y0: 86.35, x1: 53.03, y1: 87.65, layer: User.2}   # C_FLT5  GND@52.48,87.00
      - {x0: 58.73, y0: 87.75, x1: 59.83, y1: 89.05, layer: User.2}   # C_FLT6  GND@59.28,88.40
      - {x0: 56.93, y0: 89.85, x1: 58.03, y1: 91.15, layer: User.2}   # C_FLT7  GND@57.48,90.50
      # U_EFUSE EP thermal-via RESERVATION (P1-A, 2026-07-23): a 5V_PROTECTED B.Cu
      # trunk was routing UNDER the EP (x59.9), blocking every GND thermal via. This
      # User.2 keepout fences non-GND routing off the EP so the EP keeps clear GND
      # via sites (GND is plane-owned/KRT-excluded, so it is not blocked). Signal
      # pins 1-8 sit at x<=59.05 and x>=60.95, OUTSIDE this rect, so their escapes
      # are untouched; 5V_PROTECTED (pad5) re-routes via the efuse_escape corridor.
      # (v1.1: power block translated RIGIDLY +12y; U_EFUSE now @60,57)
      - {x0: 59.35, y0: 56.0, x1: 60.65, y1: 58.0, layer: User.2}     # U_EFUSE EP @60,57
      # TC-AREA + PULL-CLUSTER PLANE-BOND via RESERVATIONS (D-BACK, Opus task#21,
      # 2026-07-25). The c0/r7 stitch stranded 5 NEW-v1.2 plane pads: C_TCAV.2/
      # C_TCPA.2 were TRAPPED in EVERY race realization (placement-deterministic —
      # re-racing alone can't free them). Same mechanism as the ADC cluster above:
      # a User.2 rect fences OTHER-net tracks off BOTH F.Cu and B.Cu at the plane
      # pad + its via site (plane nets are KRT-excluded, so nothing legit routes
      # there); the deterministic seed_stubs via-in-pad (below) then bonds the pad
      # to its plane. Coords = MEASURED pad centres on the placed board.
      #  - C_TCAV: BOTH pads plane (pad1 3V3@63.22, pad2 GND@64.18) — no signal
      #    escape, so reserve the WHOLE cap; this also pushes the 5V_PROTECTED B.Cu
      #    trunk off the under-pad (the trap the journal flagged), no nudge needed.
      #  - C_AND3: BOTH pads plane (pad1 3V3@183.02, pad2 GND@183.98) — reserve whole.
      #  - C_TCPA/R_REARMPU/C_DVDT: pad1 is a SIGNAL escaping WEST — reserve
      #    east-biased, clear of the signal pad's east edge.
      # RECT SIZING (task#21, MEASURED): the first pass used whole-pad+0.5 rects;
      # the sig wave then FAILED TH_CAM_A/B (1-unc all 3 chains) — the 1.3mm-tall
      # windows at C_TCAV/C_TCPA cut the horizontal B.Cu/F.Cu channels the dense SW
      # analog field (SDA/SCL/TC/TH_CAM) routes through. Shrunk to TIGHT via-site
      # boxes (~0.8mm y) — just enough to keep the seed_stub via site clear of
      # other-net copper (and push 5V_PROTECTED off C_TCAV's B.Cu under-pad),
      # leaving the routing channels open.
      - {x0: 62.67, y0: 80.35, x1: 64.73, y1: 81.45, layer: User.2}   # C_TCAV  3V3@63.22 + GND@64.18 (both plane; tight y)
      - {x0: 70.43, y0: 83.45, x1: 71.53, y1: 84.55, layer: User.2}   # C_TCPA  GND@70.98,84.0 via site (E of SPI fan, clear corridor; TC_POS@70.02 W)
      # R_REARMPU WIDENED 0.70 -> 0.90mm (task#21 P0 re-race, 2026-07-25). At
      # +-0.35 the box does not cover via_r 0.125 + gap 0.155 + track_half 0.125
      # = 0.405, and KRT enforces rects on the track CENTRELINE — so a legal
      # 0.25mm track hugging the box edge still reaches the via site. MEASURED on
      # the c0/r8 chain: the pad-centre site REFUSED, and only 24 of 48 scanned
      # on-pad points were legal at all. +-0.45 is the size the rest of the pull
      # cluster already uses and none of those refused.
      - {x0: 121.96, y0: 90.95, x1: 123.06, y1: 92.05, layer: User.2} # R_REARMPU.2 3V3@122.51,91.50 (REARM_N pad1@121.49 W)
      - {x0: 56.93, y0: 59.45, x1: 58.03, y1: 60.55, layer: User.2}   # C_DVDT  GND@57.48 via site (EF_DVDT@56.52 W)
      # v1.7 SEAL PASS (2026-07-28). The reroute that carries R_WDOKSER stranded
      # FOUR plane pads — GND at R_AND2PD.2 / R_MODEPD.2, 3V3 at R_FAULTPU.2 /
      # U_LATCHA.5 — the same TRAPPED class as every group above, and the same
      # remedy: reserve the via site so ANY re-race leaves it clear, then bond it
      # deterministically in seed_stubs. All four sites were MEASURED on the
      # post-stitch board with the pass's own primitive (pcb_toolkit.via_site_ok,
