# cooksense route + stitch — input for skills/kicad-pcb/scripts/route_and_stitch_generic.py
#
# ADR-0007 NESTING: this config lives at 03_src/cooksense/route.yaml, so its
# grandparent is 03_src (NOT the project root). ALL commands MUST pass
# --root <project root>:
#   /usr/bin/python3 $S/route_and_stitch_generic.py prep 03_src/cooksense/route.yaml \
#       --root projects/smc0985-cooksense
# The flat-path lookups (fab_tier_util.resolve, net_class_floors) read
# <root>/03_src/rules/nets.yaml -> symlinked to cooksense/rules/nets.yaml.
#
# ====================== v1.1 ISOLATION COMB (D7, 2026-07-23) ==================
# v1.1 rot0 vertical-relay repack (188x92, pitch 15.24): each relay's coil and
# contact COLUMNS are E-W separated (7.62mm c-c / 6.12mm pad-edge). Pairing
# (rot180|rot0) makes 6 COIL GAPS (logic, within pairs) and 7 KEYPAD POCKETS
# (isolated, between pairs + both board ends). Domain rule enforced here:
#   - LOGIC (User.2 keepout): forbidden north of y29.4 everywhere, and forbidden
#     y29.4..53.0 in every pocket + every intra-relay column. Logic reaches coil
#     pads (y30.38/45.62) ONLY from inside the 6 coil-gap x-windows.
#   - KEYPAD (User.3 keepout): forbidden south of y47.0 everywhere, and
#     forbidden y23.2..47.0 in every coil gap + every intra-relay column.
#     Keypad lives in the north band (copper <=23.2) + the 7 pocket channels.
#   => creepage by construction: band 23.2 vs gap pads 29.63 (6.28mm); pocket
#      pads 46.37 vs logic/planes 53.0 (6.63mm); intra-relay columns 6.12mm;
#      pocket drops vs coil pads 7.62mm horizontal. I-ISO re-MEASURES this.
#   - GND (In1/F/B) + 3V3 (In2) planes confined to y >= 53 (keypad_iso
#     deny-pour covers y<53). Both plane nets are KRT-excluded.
# Relay centers x = 26.00 + n*15.24 (n=0..11), row y=38. Column barriers at
# xc+-3.0; coil gaps g1..g6 = [29.00,38.24] [59.48,68.72] [89.96,99.20]
# [120.44,129.68] [150.92,160.16] [181.40,190.64]; pockets = west [12,23.00],
# p1..p5 = [44.24,53.48] [74.72,83.96] [105.20,114.44] [135.68,144.92]
# [166.16,175.40], east [196.64,200].

project:
  name: cooksense
  board: 04_kicad/cooksense.kicad_pcb
  build_dir: 06_build/route

prep:
  out: r0.kicad_pcb
  keepouts:
    layers: [User.2, User.3]        # U.2 = logic keepout (north band); U.3 = keypad keepout (south band)
    mounting_holes: {radius: 3.0}
    edge_band: 0.7
    rects:
      # ---- EDGE BANDS (User.2, v1.2f MEASURED): the sig wave's
      # board_edge_clearance flag did NOT stop SDA_B from routing ON the south
      # edge (track+via at y101.9-102.0, DRC copper_edge x3, two consecutive
      # realizations). Explicit deny rects are the mechanism KRT provably
      # respects (the comb). 0.8mm bands, clear of every pad (checked: south
      # connectors end y98.4, east connectors' pads x<=198). North band is
      # already fully denied (y<29.4). ----
      - {x0: 12.0,  y0: 101.2, x1: 200.0, y1: 102.1, layer: User.2}
      - {x0: 12.0,  y0: 29.4,  x1: 12.8,  y1: 102.1, layer: User.2}
      - {x0: 199.2, y0: 29.4,  x1: 200.0, y1: 102.1, layer: User.2}
      # ---- LOGIC keepout (User.2): the isolation-comb keypad domain ----
      # Full north band: no logic track above y29.4 anywhere (coil pads at
      # y30.38 are still reachable from the south).
      - {x0: 12.0, y0: 9.9, x1: 200.0, y1: 29.4, layer: User.2}
      # 7 keypad pockets: logic excluded down to the plane band (y53.0).
      - {x0: 12.00,  y0: 29.4, x1: 23.00,  y1: 53.0, layer: User.2}   # west end
      - {x0: 44.24,  y0: 29.4, x1: 53.48,  y1: 53.0, layer: User.2}   # p1 r2r3
      - {x0: 74.72,  y0: 29.4, x1: 83.96,  y1: 53.0, layer: User.2}   # p2 r4r5
      - {x0: 105.20, y0: 29.4, x1: 114.44, y1: 53.0, layer: User.2}   # p3 r6r7
      - {x0: 135.68, y0: 29.4, x1: 144.92, y1: 53.0, layer: User.2}   # p4 r8r9
      - {x0: 166.16, y0: 29.4, x1: 175.40, y1: 53.0, layer: User.2}   # p5 r10r11
      - {x0: 196.64, y0: 29.4, x1: 200.0,  y1: 53.0, layer: User.2}   # east end
      # 12 intra-relay column barriers (coil<->contact, 6.12mm pad-edge).
      - {x0: 23.00,  y0: 29.4, x1: 29.00,  y1: 53.0, layer: User.2}   # r1
      - {x0: 38.24,  y0: 29.4, x1: 44.24,  y1: 53.0, layer: User.2}   # r2
      - {x0: 53.48,  y0: 29.4, x1: 59.48,  y1: 53.0, layer: User.2}   # r3
      - {x0: 68.72,  y0: 29.4, x1: 74.72,  y1: 53.0, layer: User.2}   # r4
      - {x0: 83.96,  y0: 29.4, x1: 89.96,  y1: 53.0, layer: User.2}   # r5
      - {x0: 99.20,  y0: 29.4, x1: 105.20, y1: 53.0, layer: User.2}   # r6
      - {x0: 114.44, y0: 29.4, x1: 120.44, y1: 53.0, layer: User.2}   # r7
      - {x0: 129.68, y0: 29.4, x1: 135.68, y1: 53.0, layer: User.2}   # r8
      - {x0: 144.92, y0: 29.4, x1: 150.92, y1: 53.0, layer: User.2}   # r9
      - {x0: 160.16, y0: 29.4, x1: 166.16, y1: 53.0, layer: User.2}   # r10
      - {x0: 175.40, y0: 29.4, x1: 181.40, y1: 53.0, layer: User.2}   # r11
      - {x0: 190.64, y0: 29.4, x1: 196.64, y1: 53.0, layer: User.2}   # r12
      # ---- KEYPAD keepout (User.3): the logic domain ----
      # Full south band: no keypad track below y47.0 (pocket contact pads at
      # y45.62 are still reachable from the north).
      - {x0: 12.0, y0: 47.0, x1: 200.0, y1: 102.1, layer: User.3}
      # 6 coil gaps: keypad excluded from the logic windows (band cap y23.2
      # keeps keypad-band copper >=6.28mm from the gap coil pads at y29.63).
      - {x0: 29.00,  y0: 23.2, x1: 38.24,  y1: 47.0, layer: User.3}   # g1
      - {x0: 59.48,  y0: 23.2, x1: 68.72,  y1: 47.0, layer: User.3}   # g2
      - {x0: 89.96,  y0: 23.2, x1: 99.20,  y1: 47.0, layer: User.3}   # g3
      - {x0: 120.44, y0: 23.2, x1: 129.68, y1: 47.0, layer: User.3}   # g4
      - {x0: 150.92, y0: 23.2, x1: 160.16, y1: 47.0, layer: User.3}   # g5
      - {x0: 181.40, y0: 23.2, x1: 190.64, y1: 47.0, layer: User.3}   # g6
      # 12 intra-relay column barriers (keypad side).
      - {x0: 23.00,  y0: 23.2, x1: 29.00,  y1: 47.0, layer: User.3}   # r1
      - {x0: 38.24,  y0: 23.2, x1: 44.24,  y1: 47.0, layer: User.3}   # r2
      - {x0: 53.48,  y0: 23.2, x1: 59.48,  y1: 47.0, layer: User.3}   # r3
      - {x0: 68.72,  y0: 23.2, x1: 74.72,  y1: 47.0, layer: User.3}   # r4
      - {x0: 83.96,  y0: 23.2, x1: 89.96,  y1: 47.0, layer: User.3}   # r5
      - {x0: 99.20,  y0: 23.2, x1: 105.20, y1: 47.0, layer: User.3}   # r6
      - {x0: 114.44, y0: 23.2, x1: 120.44, y1: 47.0, layer: User.3}   # r7
      - {x0: 129.68, y0: 23.2, x1: 135.68, y1: 47.0, layer: User.3}   # r8
      - {x0: 144.92, y0: 23.2, x1: 150.92, y1: 47.0, layer: User.3}   # r9
      - {x0: 160.16, y0: 23.2, x1: 166.16, y1: 47.0, layer: User.3}   # r10
      - {x0: 175.40, y0: 23.2, x1: 181.40, y1: 47.0, layer: User.3}   # r11
      - {x0: 190.64, y0: 23.2, x1: 196.64, y1: 47.0, layer: User.3}   # r12
      # ADC-FRONT-END GND-VIA RESERVATIONS (D-ADJ, routing D-BACK 2026-07-23).
      # The dense MCP3208 filter/vref cluster covers cap GND via sites with signal
      # tracks on BOTH layers (astar exhausted a 4mm window -> stitch cannot drop a
      # via-in-pad). WHICH cap opens is whack-a-mole across route/legalize seeds,
      # so ALL 10 cluster caps are reserved: each rect fences OTHER-net tracks off
      # the GND pad + its via site (User.2 blocks BOTH F.Cu and B.Cu); the caps are
      # ANCHORED (floorplan) so these coords stay on-pad. GND (In1 plane) is
      # KRT-excluded, so nothing legit routes to the pad; the signal pad (pad 1)
      # escapes WEST, clear of each rect's west edge (>=0.2mm). rects = GND pad
      # centre-biased east: [gx-0.48 .. gx+0.52] x [gy-0.65 .. gy+0.65] (small
      # caps); C_ADCV/C_ADCV2 sized for their 0.90mm pad.
      # (v1.1: ADC cluster translated RIGIDLY +6y with its floorplan anchors)
      - {x0: 48.15, y0: 75.35, x1: 49.75, y1: 76.65, layer: User.2}   # C_ADCV  GND@48.77,76.00
      - {x0: 37.00, y0: 75.35, x1: 38.00, y1: 76.65, layer: User.2}   # C_ADCV2 GND@37.48,76.00
      - {x0: 56.20, y0: 88.55, x1: 57.20, y1: 89.85, layer: User.2}   # C_FLT0  GND@56.68,89.20
      - {x0: 53.80, y0: 88.55, x1: 54.80, y1: 89.85, layer: User.2}   # C_FLT1  GND@54.28,89.20
      - {x0: 53.80, y0: 84.15, x1: 54.80, y1: 85.45, layer: User.2}   # C_FLT2  GND@54.28,84.80
      - {x0: 56.20, y0: 84.15, x1: 57.20, y1: 85.45, layer: User.2}   # C_FLT3  GND@56.68,84.80
      - {x0: 58.00, y0: 86.35, x1: 59.00, y1: 87.65, layer: User.2}   # C_FLT4  GND@58.48,87.00
      - {x0: 52.00, y0: 86.35, x1: 53.00, y1: 87.65, layer: User.2}   # C_FLT5  GND@52.48,87.00
      - {x0: 58.80, y0: 87.75, x1: 59.80, y1: 89.05, layer: User.2}   # C_FLT6  GND@59.28,88.40
      - {x0: 57.00, y0: 89.85, x1: 58.00, y1: 91.15, layer: User.2}   # C_FLT7  GND@57.48,90.50
      # U_EFUSE EP thermal-via RESERVATION (P1-A, 2026-07-23): a 5V_PROTECTED B.Cu
      # trunk was routing UNDER the EP (x59.9), blocking every GND thermal via. This
      # User.2 keepout fences non-GND routing off the EP so the EP keeps clear GND
      # via sites (GND is plane-owned/KRT-excluded, so it is not blocked). Signal
      # pins 1-8 sit at x<=59.05 and x>=60.95, OUTSIDE this rect, so their escapes
      # are untouched; 5V_PROTECTED (pad5) re-routes via the efuse_escape corridor.
      # (v1.1: power block translated RIGIDLY +12y; U_EFUSE now @60,57)
      - {x0: 59.35, y0: 56.0, x1: 60.65, y1: 58.0, layer: User.2}     # U_EFUSE EP @60,57
      # TC-AREA + PULL-CLUSTER PLANE-BOND via RESERVATIONS (D-BACK, Opus task#21,
      # 2026-07-25). The c0/r7 stitch stranded 5 NEW-v1.2 plane pads: C_TCAV.2/
      # C_TCPA.2 were TRAPPED in EVERY race realization (placement-deterministic —
      # re-racing alone can't free them). Same mechanism as the ADC cluster above:
      # a User.2 rect fences OTHER-net tracks off BOTH F.Cu and B.Cu at the plane
      # pad + its via site (plane nets are KRT-excluded, so nothing legit routes
      # there); the deterministic seed_stubs via-in-pad (below) then bonds the pad
      # to its plane. Coords = MEASURED pad centres on the placed board.
      #  - C_TCAV: BOTH pads plane (pad1 3V3@63.22, pad2 GND@64.18) — no signal
      #    escape, so reserve the WHOLE cap; this also pushes the 5V_PROTECTED B.Cu
      #    trunk off the under-pad (the trap the journal flagged), no nudge needed.
      #  - C_AND3: BOTH pads plane (pad1 3V3@183.02, pad2 GND@183.98) — reserve whole.
      #  - C_TCPA/R_REARMPU/C_DVDT: pad1 is a SIGNAL escaping WEST — reserve
      #    east-biased, clear of the signal pad's east edge.
      # RECT SIZING (task#21, MEASURED): the first pass used whole-pad+0.5 rects;
      # the sig wave then FAILED TH_CAM_A/B (1-unc all 3 chains) — the 1.3mm-tall
      # windows at C_TCAV/C_TCPA cut the horizontal B.Cu/F.Cu channels the dense SW
      # analog field (SDA/SCL/TC/TH_CAM) routes through. Shrunk to TIGHT via-site
      # boxes (~0.8mm y) — just enough to keep the seed_stub via site clear of
      # other-net copper (and push 5V_PROTECTED off C_TCAV's B.Cu under-pad),
      # leaving the routing channels open.
      - {x0: 62.87, y0: 80.50, x1: 64.53, y1: 81.30, layer: User.2}   # C_TCAV  3V3@63.22 + GND@64.18 (both plane; tight y)
      - {x0: 68.63, y0: 76.65, x1: 69.33, y1: 77.35, layer: User.2}   # C_TCPA  GND@68.98 via site (TC_POS@68.02 escapes W)
      - {x0: 122.16, y0: 91.15, x1: 122.86, y1: 91.85, layer: User.2} # R_REARMPU 3V3@122.51 via site (REARM_N@121.49 W)
      - {x0: 57.13, y0: 59.65, x1: 57.83, y1: 60.35, layer: User.2}   # C_DVDT  GND@57.48 via site (EF_DVDT@56.52 W)
      - {x0: 182.67, y0: 70.25, x1: 184.33, y1: 70.95, layer: User.2} # C_AND3  3V3@183.02 + GND@183.98 (both plane; tight y)
  waves:
    exclude: ["GND", "3V3", "unconnected-*"]   # In1 GND plane + In2 3V3 plane own these
    groups:
      # With 0 N/S crossings these are ordinary same-side signal groups, routed
      # hardest/densest-first. safety = AND-chain + relay-control signals (all
      # SOUTH, around U_SCHM/AND-chain/U_EXP); pi = Pi-interface signals (J_PI
      # to the 595s / watchdog / expander, all SOUTH).
      # eFuse WSON-8 (0.5mm pitch) dense escape -- routed FIRST so the sandwiched
      # signal pins (esp. EF_ILM, pin 7) claim their via-in-pad escape lanes
      # before the power pins (5V_RPP/5V_PROTECTED, pwr wave) box them in.
      efuse: [EF_DVDT, EF_OVLO, EF_ILM, EFUSE_FLT_N]   # EFUSE_FLT_N renamed from PWR_GOOD_N (pin review Q1, 2026-07-23)
      # ESTOP_RAW/MODE_RAW/DOOR_RAW promoted from `rest` (v1.2d, 2026-07-24,
      # MEASURED: with the new sig-wave edge clearance ESTOP_RAW lost its
      # corridor into U_SCHM.1 in ALL 3 chains when routed last; the raw
      # safety-contact nets belong with their cleaned outputs in the early wave)
      # DECU_G1_RAW/DECD_G1_RAW also promoted (v1.2e, MEASURED: DECU_G1_RAW
      # failed "preexisting_blockers" in all chains when routed in the last
      # wave — U_SR1.3's escape walled in by earlier tracks; these are the
      # decoder-enable REQUEST lines, safety-adjacent by function).
      # ESTOP_NI/MODE_NI/DOOR_NI promoted from `sig` (task#21, 2026-07-25, MEASURED):
      # these are the 74HC14 (U_SCHM) Schmitt-conditioned intermediates of the raw
      # safety contacts. DOOR_NI links U_SCHM.10<->.13, an intra-package net that
      # must route PAST pins 11/12 (DOOR_RAW/DOOR_OK). With those raw nets in the
      # early safety wave and the _NI intermediates left for the last sig wave, the
      # _NI escape channel was already taken -> DOOR_NI stranded DETERMINISTICALLY
      # in every chain. Routing the whole conditioning chain in ONE wave frees it.
      safety: [TEMP_OK, WD_OK, ESTOP_OK, FAULT, MODE_AUTO_HW,
               DOOR_OK, REARM_N, STOP_REQ, PRESS_TIMED, CONTACTOR_C,
               KEY_RELAY_ALLOWED, ESTOP_RAW, MODE_RAW, DOOR_RAW,
               DECU_G1_RAW, DECD_G1_RAW, ESTOP_NI, MODE_NI, DOOR_NI]
      pi: [HOST_AUTH, WD_PET, MCU_RELAY_ENABLE, KEY_CLOCK, KEY_LATCH,
           KEY_RESET_N, KEY_DATA]
      # keypad-iso domain: routes WITHIN the north band (User.3 keepout open north)
      keypad: [KP_U1, KP_U2, KP_U3, KP_U4, KP_U5, KP_U6, KP_D1, KP_D2, KP_D3,
               KP_D4, U_SEL_BUS, D_SEL_BUS, RKEY_MID, RSTOP_MID]
      # coil selects + drives: decoders/ULN (south) -> reed coil pads (y37.81).
      # ALL now on ONE side (ULN_A + ULN_B both south) -- SEL_D3/D4 + COIL_D1/D2
      # are NO LONGER crossers, they join the coil group.
      coil: [SEL_U1, SEL_U2, SEL_U3, SEL_U4, SEL_U5, SEL_U6,
             SEL_D1, SEL_D2, SEL_D3, SEL_D4,
             COIL_U1_N, COIL_U2_N, COIL_U3_N, COIL_U4_N, COIL_U5_N, COIL_U6_N,
             COIL_D1_N, COIL_D2_N, COIL_D3_N, COIL_D4_N, COIL_PRESS_N,
             COIL_STOP_N, 5V_KEY_RELAY]
      pwr: [5V_PROTECTED, 5V_IN, 5V_FUSED, 5V_RPP, 5V_STOP, 3V3_ANALOG,
            3V3_SW_A, 3V3_SW_B, 3V3_SW_RHA, 3V3_SW_RHE]
      # analog COMPARATOR nets promoted out of `sig` (task#21, 2026-07-25, MEASURED):
      # TH_CAM_B routed as part of the 84-net `sig` wave in the promoted-era chain,
      # but under current KRT it DETERMINISTICALLY strands (8/8 race chains, both
      # with and without the plane reservations — a pre-existing marginality the
      # earlier lucky race masked). The over-temp comparator nets span the whole
      # dense SW analog field (U_COMP x21 -> R_SER0/R_REF3 x58 -> J_THERM y95) and
      # lose their channels to SDA_A/SCL_A/ADC/TC when routed last. Promoting them
      # to a dedicated wave (routes BEFORE the sensor-I2C nets congest the field)
      # is the durable fix the journal harvested ("wave PROMOTION is the durable
      # fix for walled late-wave pads"). SAFETY-relevant: these are the camera
      # hard-stop sense lines (reviewer fix #2).
      # The thermistor-connector nets all DROP vertically from the SW analog
      # cluster (x21-60) to J_THERM_A/B/J_TC at y95-97, while SDA/SCL/SHIELD_DRAIN
      # run HORIZONTALLY at y92-95 straight across those drops — a structural
      # crossing conflict. Routing the vertical drops FIRST (analog wave) lets the
      # horizontal buses find the free layer around them (whack-a-mole confirmed:
      # promoting only TH_CAM shifted the fail to TH_MOUNT_A). Promote the whole
      # thermistor/comparator reach-group.
      analog: [TH_CAM_A, TH_CAM_B, TCAM_THRESH, TH_MOUNT_A, TH_MOUNT_B,
               TH_PORT_A, TH_PORT_B, TH_ENCLOSURE, TH_SPARE, TC_POS_IN]
      sig: rest

route:
  krt: ~/gits/KiCadRoutingTools
  race: 3            # KRT is stochastic: 3 concurrent chains, quick-measured best wins
  kicad_python: /usr/bin/python3
  common:
    layers: [F.Cu, B.Cu]
    fab_tier: advanced          # via/clearance floors from nets.yaml fab_tier
    no_stub_layer_swap: true
    keepout: true
    keepout_layer: User.2
    clearance: 0.15
  waves:
    - {name: efuse, group: efuse, track_width: 0.2, max_iterations: 800000,
       max_ripup: 50}
    - {name: safety, group: safety, track_width: 0.2,
       max_iterations: 600000, max_ripup: 40}
    - {name: pi, group: pi, track_width: 0.2, max_iterations: 600000}
    - {name: keypad, group: keypad, track_width: 0.3, keepout_layer: User.3,
       board_edge_clearance: 0.35, max_iterations: 400000}   # sel-bus rails cross the inter-reed slots (y30.5) -> keep 0.35mm
    - {name: coil, group: coil, track_width: 0.4, board_edge_clearance: 0.35, max_iterations: 500000}   # coil rail/drops pass the slots (y37.5) -> keep 0.35mm
    - {name: pwr,  group: pwr,  max_iterations: 500000}
    # analog comparator nets FIRST-served among the sensor field (task#21): route
    # before the sig wave so TH_CAM_A/B/TCAM_THRESH claim channels through the
    # dense SW cluster before SDA/SCL/ADC/TC fill it. track 0.25 (sig class).
    - {name: analog, group: analog, track_width: 0.25, board_edge_clearance: 0.35,
       max_iterations: 800000, max_probe_iterations: 60000, max_ripup: 40}
    # board_edge_clearance added to sig (v1.2, 2026-07-24, MEASURED): SDA_B ran
    # ON the south edge (y101.9 vs edge y102, 0.00mm DRC edge clearance x3) —
    # the prep edge_band did not stop the sig wave.
    # sig effort RAISED (task#21, MEASURED): after the analog-wave promotion the
    # 74-net sig wave still left exactly 1 net stranded per chain (a DIFFERENT net
    # each race — RAIL_EN_RHA/SR_OE_N/... — i.e. KRT ran out of ripup budget on the
    # last net, not a hard block; ~24 chains never reached 0). More ripup +
    # iterations lets it clear the final net.
    - {name: sig, group: sig, track_width: 0.25, board_edge_clearance: 0.35,
       max_iterations: 1500000, max_probe_iterations: 100000, max_ripup: 120}
  # Promoted converged chain (canon M3): 0 routed-net unconnected, 0-crossing
  # topology. `import` uses this when there is no fresh 06_build FINAL marker, so
  # `rebuild_all.sh --reuse-route` (and a fresh clone / CI) is DETERMINISTIC.
  final: 03_src/cooksense/route/final_chain.kicad_pcb

stitch:
  clearance: 0.15
  via: {spacing: 0.85, pth_margin: 0.3}    # size/drill tier-derived (advanced)
  # KEEP advanced via-in-pad size (0.25/0.15). The pass default 0.6/0.3 shorts a
  # via-in-pad board (818 DRC finds when it fired at 0.6): KRT already emits 0.25/0.15.
  # below_width per R-PREFLIGHT PF-NORM (2026-07-24): without it the pass
  # default (0.449) would resize every correctly-sized 0.25 tier via.
  normalize_vias: {size: 0.25, drill: 0.15, below_width: 0.24}
  keepin: {inset: 0.8}
  # via_janitor DROPPED (2026-07-23, successor lead; runbook step-2 option B).
  # via_janitor removes ANY via with same-net copper on <2 layers, crediting a
  # zone by its OUTLINE (fill-blind). In the dense MCP3208 ADC cluster that pruned
  # legit GND plane-bond via-in-pads whose only 2nd layer is the In1 plane ->
  # whack-a-mole cap opens (C_FLT1 before fill / C_FLT6 after fill: a different
  # marginal cap per fill state). Its one durable purpose was deleting the STOCHASTIC
  # 5V_RPP dead-end KRT detour via, which the promoted race/c0/r7 realization does
  # NOT contain (0 5V_RPP vias — MEASURED). prune_stitch_dangling (final pass) is the
  # correct cleaner: it runs AFTER fill, tests the FILLED polys (a via-in-pad in the
  # filled In1 GND counts In1 -> 2 layers -> KEPT), and only touches THIS run's
  # stitch-emitted vias. Verified: DRC 0 via_dangling.
  passes: [dedupe_vias, normalize_vias, drop_micro_fragments, drop_dangling,
           split_t_junctions, reload, hole_to_hole, seed_stubs, pad_rescue,
           stub_fallback, astar_fallback, dedupe_vias, stitch_grid, power_stitch,
           fill, island_rescue, fill, unify_zone_priorities,
           heal_islands, prune_stitch_dangling, gate]
  # TPS259573 has TWO adjacent 5V_RPP input pins (pad 3 @59.05,45.25 + pad 4
  # @59.05,45.75, 0.5mm pitch). KRT routes the trunk to pad 3 (via-in-pad) but
  # stochastically left pad 4 as a bare pad + a dead-end detour via -- KRT's own
  # connectivity metric treats the net as served, so the race cannot select it
  # out. A DETERMINISTIC 0.25mm F.Cu bridge pad4->pad3 closes it (canon M8);
  # via_janitor then removes the orphan detour via (5V_RPP has no pour, so a via
  # touching only 1 layer connects nothing). Both run BEFORE fill.
  seed_stubs:
    clearance: 0.13
    stubs:
      - {net: 5V_RPP, pin: U_EFUSE.4,
         segments: [{layer: F.Cu, width: 0.25, pts: [[59.05, 57.75], [59.05, 57.25]]}]}
      # ADC-CLUSTER GND PLANE-BOND via-in-pads (DETERMINISM fix, 2026-07-23,
      # successor lead). The dense MCP3208 filter/vref cluster is congested enough
      # that the pad_rescue -> stub_fallback -> astar_fallback stochastic rescue
      # chain (+ heal_islands set-iteration order across SWIG re-exec) left a
      # DIFFERENT marginal cap open per reuse-rebuild realization (C_FLT1/C_FLT6
      # flipped between two consecutive reuse rebuilds -> M-REPRO fail). ROOT fix:
      # a DETERMINISTIC via-in-pad at each cap GND pad centre, placed HERE (before
      # fill AND before pad_rescue). Effect: (1) the via bonds pad -> In1 GND plane
      # directly once filled; (2) pad_rescue.has_via() then finds it (barrel in pad
      # bbox) and marks the cap SERVED, so no competing ring via is dropped by any
      # rescue pass -> no non-deterministic churn. via_site_ok-checked (refused-not-
      # -guessed) + `pin` proof (must reach the pad) + idempotent. Coords = exact
      # GND pad centres (anchored caps; measured from the board).
      - {net: GND, pin: C_ADCV.2,  vias: [[48.775, 76.000]]}
      - {net: GND, pin: C_ADCV2.2, vias: [[37.480, 76.000]]}
      - {net: GND, pin: C_FLT0.2,  vias: [[56.680, 89.200]]}
      - {net: GND, pin: C_FLT1.2,  vias: [[54.280, 89.200]]}
      - {net: GND, pin: C_FLT2.2,  vias: [[54.280, 84.800]]}
      - {net: GND, pin: C_FLT3.2,  vias: [[56.680, 84.800]]}
      - {net: GND, pin: C_FLT4.2,  vias: [[58.480, 87.000]]}
      - {net: GND, pin: C_FLT5.2,  vias: [[52.480, 87.000]]}
      - {net: GND, pin: C_FLT6.2,  vias: [[59.280, 88.400]]}
      - {net: GND, pin: C_FLT7.2,  vias: [[57.480, 90.500]]}
      # TC-AREA + PULL-CLUSTER PLANE-BOND via-in-pads (D-BACK, task#21, 2026-07-25).
      # Deterministic bonds for the 5 pads the c0/r7 stitch stranded (2 TRAPPED in
      # every realization). Paired with the User.2 reservation rects above so the
      # site is clear on ANY realization -> single-pass, M-REPRO-stable (no
      # pad_rescue whack-a-mole). `pin` proves the via lands on the pad; the plane
      # (GND=In1 / 3V3=In2) auto-clears an antipad around the barrel so no short.
      - {net: 3V3, pin: C_TCAV.1,    vias: [[63.220, 80.900]]}
      - {net: GND, pin: C_TCAV.2,    vias: [[64.180, 80.900]]}
      - {net: GND, pin: C_TCPA.2,    vias: [[68.980, 77.000]]}
      - {net: 3V3, pin: R_REARMPU.2, vias: [[122.510, 91.500]]}
      - {net: GND, pin: C_DVDT.2,    vias: [[57.480, 60.000]]}
      - {net: 3V3, pin: C_AND3.1,    vias: [[183.020, 70.600]]}
      # J_PWR Micro-Fit MECHANICAL RETENTION TABS (R-THERM, 2026-07-23). The two
      # 1MP shell tabs (5.66mm2 each, GND, SMD) trip R-THERM (>4mm2 GND pad, <2
      # vias) though they carry NO current (retention only; the real power path is
      # pad1 5V_IN / pad2 GND, both 3.23mm2 < 4mm2). Rather than waive, deterministically
      # GND-bond each tab to the In1 plane with 2 via-in-pads (also good shell EMI/
      # mechanical grounding for a power-entry connector). No `pin` proof: both pads
      # share number "MP", so the proof is ambiguous — via_site_ok + In1-coverage
      # (both MEASURED clear/covered) are the guard. Sites: tab centre + 0.85mm east,
      # inside each 3.43mm-wide tab, >0.65mm hole gap.
      - {net: GND, vias: [[16.610, 59.720], [17.460, 59.720]]}
      - {net: GND, vias: [[27.390, 59.720], [28.240, 59.720]]}
      # v1.2 RE-RACE (2026-07-24): the three v1.1 realization-coupled 3V3 stubs
      # (C_DECU.1, U_EXP.9, C_OENAND.1 — each explicitly marked "re-derive on any
      # re-race") are RETIRED for the fresh race; if a realization strands one of
      # those pads again, re-derive a measured stub ON THAT chain and restore it
      # here with new coords. Keeping stale coords would either refuse (harmless)
      # or trap the new realization (harmful) — the v1.1 C_ULNB lesson.
      # C_ULNB.2 stub RETIRED (2026-07-24): two successive stub derivations
      # were realization-coupled traps (each re-race collided the last one).
      # PLACEMENT fix instead: C_ULNB is now SEEDED inside the plane band
      # (floorplan 186,67.5) where ordinary pad_rescue serves it.
      # U_EXP.9 (MCP23017 VDD, 3V3) stub RETIRED (v1.1, 2026-07-24). The v1.0
      # deterministic via-in-pad existed because the 252mm placement left
      # pad_rescue unable to serve the plane-fed pad (nearest 3V3 copper 6mm
      # west). On the v1.1 rot0 board the blockage geometry changed: KRT race 2
      # ROUTED pad 9 natively (MEASURED: 3V3 F.Cu escape chain leaves the pad
      # west at (136.50,82.97)->(135.53,82.90)->...), and the rigid-translated
      # stub site (137.2,82.975) collided the EXP_RST_N B.Cu escape — the
      # seed_stub pass correctly REFUSED (refused-not-guessed). A dead stub
      # aimed at moved copper is a trap, not a determinism aid: deleted.
  via_janitor: {min_layers: 2}
  # THERMAL-VIA FLOOR (policy R6): the AMS1117-3.3 tab (U_LDO.4 = 3V3, 7.6mm2)
  # gets its 1st via-in-pad from pad_rescue at the tab CENTER (25.15,58.00); its
  # 2nd nearby 3V3 via sits 2.4mm out (past R-THERM's w/2+1.0=2.0mm window), so
  # the pad counted only 1. power_stitch drops a 2nd via-in-pad 1.1mm north,
  # inside the 3.8mm-tall tab and inside the counting window -> 2 vias. min:0 +
  # overshoot:0 suppresses the plane-crossing auto-vias so ONLY the site is added.
  # U_LDO is anchored [22,58,0] (pinned) so the tab stays at x25.15.
  power_stitch:
    overshoot: 0
    jobs:
      - {net: 3V3, min: 0, sites: [[25.15, 68.9]]}
      # U_EFUSE EP thermal vias (P1-A): 2 GND via-in-pad in the WSON EP outline
      # (0.9x1.6 @60,45), top+bottom, connecting the EP -> In1 GND plane (the heat
      # path). Needs the EP reservation keepout (prep) to have cleared the
      # 5V_PROTECTED B.Cu trunk + tie_efuse_ep.py to have GND-ed the unnamed EP
      # sub-pads. If both sites refuse (dense escape), the fallback ladder is in
      # the routing journal (route 5V_PROTECTED south / F.Cu-pour EP bond).
      - {net: GND, min: 0, sites: [[60.0, 56.4], [60.0, 57.6]]}
      # v1.2f B.Cu GND island under J_PI (MEASURED, 2026-07-24): the re-routed
      # pi/sig field cuts a 27.1x7.5mm B.Cu GND island at (122.1,94.2) that
      # island_rescue/heal_islands cannot serve (stitch gate FAIL). Two sites
      # measured CLEAR on the promoted chain (B.Cu island + In1 plane coverage
      # + 0.45mm radius track/hole clearance scan). Realization-coupled like
      # the 3V3 stubs: re-derive on any re-race.
      - {net: GND, min: 0, sites: [[112.4, 90.3], [129.4, 89.5]]}
  dedupe_vias: {radius: 0.5, metric: box}
  drop_micro_fragments: {max_length: 0.12, require_free_end: true}
  drop_dangling: {max_length: 1.0, tol: 0.05, sweeps: 4}
  split_t_junctions: {tol: 0.05}
  hole_to_hole: {min_gap: 0.5, mode: nudge, prefer_keep: [GND]}
  # GND (In1) + 3V3 (In2) inner planes: rescue BOTH plane-nets' boxed pads.
  # NOTE: stitch_grid + pad_rescue only touch the SOUTH planes (y>=40); the
  # keypad band has no plane and no GND/3V3 pad, so nothing is rescued there.
  pad_rescue:
    nets:
      - {net: GND, layer: In1.Cu}
      - {net: 3V3, layer: In2.Cu}
    via_in_pad: true
    served_within: 1.6
    rings: [0.5, 0.7, 0.9, 1.1, 1.4, 1.8, 2.2, 2.7]
    angle_step: 15
    # stub_width 0.2 -> 0.3 (v1.2, 2026-07-24, MEASURED): 13 pad_rescue 3V3
    # stubs at 0.2 tripped the PWR_3V3 0.3 floor. The stub_scope exemption
    # rule-areas do not survive the canon-R1 generate-rules-LAST step (the
    # regenerated .kicad_dru drops appended rules), so emit stubs AT the floor
    # instead of relaxing the floor around them.
    stub_width: 0.3
    stub_scope: {min_track_width: 0.3}
    require: none
  stub_fallback: {net: [GND, 3V3], min_dist: 0.2, max_dist: 8.0, width: 0.3}
  # window 4->6, attempts 3->5 (2026-07-24): C_ULNB.2/C_SWB.2 GND sit in
  # dense escape fields where the 4mm window exhausted (C_ULNB additionally
  # north of the plane band, its only GND service a threaded path south).
  astar_fallback: {net: [GND, 3V3], width: 0.3, window: 6.0, attempts: 5, max_dist: 8.0}
  stitch_grid:
    net: GND
    x: [20, 196, 8]     # span the SOUTH logic band (board x12..200)
    y: [58, 98, 8]      # inside the GND plane (y53..102), clear of the comb edge
    # ISOLATION: no GND stitch vias north of the plane band (would bridge the comb)
    avoid: [{x0: 12.0, y0: 9.0, x1: 200.0, y1: 54.0, margin: 1.0}]
  # layers cover the declared planes per R-PREFLIGHT PF-LAYER (2026-07-24):
  # islands on an unscanned In1/In2 plane are invisible to an F/B-only scan.
  island_rescue: {min_bbox: 0.8, layers: [F.Cu, B.Cu, In1.Cu, In2.Cu], require: pads}
  unify_zone_priorities: {min_bbox: 0.8}
  heal_islands: {min_bbox: 1.5}
  prune_stitch_dangling: {tol: 0.05, min_layers: 2}
