      # via only 0.165mm (MEASURED at U_SCHM.14) — +-0.45 keeps >=0.30mm against a
      # 0.25mm signal track, which is what these fields actually carry.
      - {x0: 47.46, y0: 92.05, x1: 48.56, y1: 93.15, layer: User.2} # R_SWPUB.2   3V3@48.010,92.60 (SWG_B pad1@46.99 W, 0.30mm clear)
      - {x0: 44.512, y0: 90.4, x1: 45.612, y1: 91.5, layer: User.2} # Q_SWB.2     3V3@45.062,90.95 (SOT-23 pad2; pad1 y89.05 N / pad3 x46.938 E both clear)
      - {x0: 121.96, y0: 88.45, x1: 123.06, y1: 89.55, layer: User.2} # R_CTRREQPD.2 GND@122.510,89.00 (CONTACTOR_REQ pad1@121.49 W, 0.30mm clear)
      - {x0: 124.96, y0: 88.45, x1: 126.06, y1: 89.55, layer: User.2} # R_RAENAPD.2  GND@125.510,89.00 (RAIL_EN_A pad1@124.49 W, 0.30mm clear)
      # THIRD-WAVE + PREEMPTIVE plane-pad reservations (task#21 D-BACK iterate 4,
      # 2026-07-25). Iterate 3 cleared its own four and stranded four MORE
      # (R_EXPRST.2, R_RAENBPD.2, U_EXP.9, U_OENAND.5) — proof that closing these
      # one victim at a time is a LOOP, not a fix: every reservation redirects the
      # copper onto the next unreserved plane pad in the same cluster. So this pass
      # closes the CLUSTER, not the symptom. R_RAENBPD.2 is the clearest case:
      # RAIL_EN_B B.Cu (y88.70) and RAIL_EN_A B.Cu (y89.50) sandwich the pad with a
      # 0.55mm free band, and a 0.25 via needs 0.56mm (2*(0.125 barrel + 0.155)) —
      # trapped by 0.01mm, unreachable by ANY rescue, only a reservation frees it.
      # BOX SIZING: +-0.45mm. KRT enforces these rects on the track CENTRELINE
      # (MEASURED — that is how COIL_D3_N put copper 0.05mm inside a rule area), so
      # the half-box must cover via_r 0.125 + gap 0.155 + track_half 0.125 = 0.405.
      # The two fine-pitch IC pins get what their neighbours allow instead, and are
      # biased onto the free end of the pad.
      - {x0: 121.96, y0: 83.45, x1: 123.06, y1: 84.55, layer: User.2} # R_EXPRST.2   3V3@122.510,84.00 (EXP_RST_N pad1@121.49 W)
      - {x0: 127.96, y0: 88.45, x1: 129.06, y1: 89.55, layer: User.2} # R_RAENBPD.2  GND@128.510,89.00 (RAIL_EN_B pad1@127.49 W)
      - {x0: 135.35, y0: 82.425, x1: 136.45, y1: 83.525, layer: User.2} # U_EXP.9      3V3@136.500,82.975 SSOP-28 0.65 pitch: y box is pad-height+0.15 to pins 8/10; via biased to the pad's WEST end (135.900)
      - {x0: 160.1, y0: 78.8, x1: 161.2, y1: 79.9, layer: User.2} # U_OENAND.5   3V3@160.838,79.35 SOT-353: pad4 SR_OE_N is 0.95mm S; via at 160.650
      # PREEMPTIVE — the rest of the Pi-edge / expander pull-down cluster. Same
      # footprint, same field, same failure mode; each has opened at least once
      # across the v1.2 races. Reserving them together is what ends the whack-a-mole.
      - {x0: 99.96, y0: 87.45, x1: 101.06, y1: 88.55, layer: User.2} # R_HOSTAUTHPD.2 GND@100.510,88.00
      - {x0: 102.96, y0: 87.45, x1: 104.06, y1: 88.55, layer: User.2} # R_MCUENPD.2    GND@103.510,88.00
      - {x0: 105.96, y0: 87.45, x1: 107.06, y1: 88.55, layer: User.2} # R_KRSTPD.2     GND@106.510,88.00
      - {x0: 124.96, y0: 90.95, x1: 126.06, y1: 92.05, layer: User.2} # R_RAENRHAPD.2  GND@125.510,91.50
      - {x0: 124.96, y0: 83.45, x1: 126.06, y1: 84.55, layer: User.2} # R_BID0.2       GND@125.510,84.00
      # P0 FIX plane-bond reservation (ADR-0011 §8, 2026-07-25). R_WDPETPD is the
      # WD_PET pull-down whose ABSENCE was the P0 (the watchdog never bit with the
      # Pi unplugged, so the cooking contactor stayed energised). Its GND pad is
      # therefore a SAFETY bond, and it gets the cluster treatment from the start
      # rather than after it strands: same +-0.45mm box as the pull cluster above.
      # pad1 (WD_PET) spans x[154.82,155.36] and escapes WEST to U_WD.4 — the box's
      # west edge at 155.66 leaves that escape a 0.30mm margin.
      - {x0: 155.56, y0: 80.4, x1: 156.66, y1: 81.5, layer: User.2} # R_WDPETPD.2   GND@156.110,80.95 (WD_PET pad1@155.09 W)
      # FOURTH-WAVE reservations (task#21 P0 re-race, 2026-07-25). The c0/r8 chain
      # (the first race run after R_WDPETPD landed) REFUSED four seed_stubs. These
      # three were the journal's "realization-coupled" class — sites MEASURED clear
      # on an earlier chain, never RESERVED, so the next race rolled copper over
      # them. MEASURED on c0/r8 with the pass's own primitive (pcb_toolkit
      # via_site_ok, via 0.25/0.15, clearance 0.13) over a 0.05mm grid covering
      # every point where a 0.25 barrel still fits inside the pad:
      #   C_FAULTAND.1 (3V3)  0 of 56 on-pad sites legal
      #   C_TCNA.2     (GND)  0 of 56 on-pad sites legal
      #   R_OE.2       (3V3)  0 of 48 on-pad sites legal
      # Zero legal sites anywhere ON the pad means copper crosses the WHOLE pad —
      # a through-via cannot dodge that, so no rescue pass and no re-roll of the
      # same config could ever bond them (the U_SCHM.14 lesson, 8667452). The fix
      # is the same mechanism as every reservation above: fence other-net tracks
      # off the site so the NEXT race routes around it. Reserving is also what
      # stops this being whack-a-mole — an unreserved site is only ever clear by
      # luck. All three are +-0.45 in x / +-0.40 in y (the tight-y rule: 1.3mm-tall
      # boxes here cut the horizontal analog channels and stranded TH_CAM_A/B).
      - {x0: 158.47, y0: 76.05, x1: 160.53, y1: 77.15, layer: User.2} # C_FAULTAND 3V3@159.020 + GND@159.980 (BOTH pads plane -> reserve the whole cap, C_AND3/C_OENAND precedent; no signal escape to protect)
      - {x0: 65.13, y0: 72.55, x1: 66.23, y1: 73.65, layer: User.2} # C_TCNA.2   GND@65.680,73.10 (TC_NEG signal pad1@64.720 W; E-biased, box starts 0.23mm E of pad1's east edge)
      - {x0: 158.76, y0: 81.65, x1: 159.86, y1: 82.75, layer: User.2} # R_OE.2     3V3@159.310,82.20 (SR_OE_N signal pad1@158.290 W; E-biased, 0.63mm channel kept open to C_OENAND's rect at x160.39)
      # THE LAST TWO UNRESERVED SEED_STUB SITES (task#21, 2026-07-25). Closing the
      # class instead of the symptom. Race 2 fixed the four sites race 1 refused and
      # then refused a FIFTH, R_OS.2 — which had never had a rect. An AUDIT of the
      # config (every seed_stub via site vs every User.2 rect) found exactly two
      # pin-proved sites still unreserved: R_OS.2 and U_FAULTAND.5. Both are now
      # reserved, so ALL 49 seed_stub sites are covered and no future race can
      # re-open this loop by rolling copper onto an unprotected one.
      #   R_OS.2: MEASURED on the race-2 chain — 0 legal on-pad sites; the blocker is
      #   ONE B.Cu track, PRESS_TIMED_N (144.300,64.600)->(145.600,63.300) w0.25,
      #   crossing the pad diagonally. The only clear points anywhere near it survive
      #   a via-growth sweep by 0.02mm, which is hand-geometry, not a design — hence
      #   a reservation and a re-race rather than a nudged coordinate.
      - {x0: 144.76, y0: 63.35, x1: 145.86, y1: 64.45, layer: User.2} # R_OS.2       3V3@145.310,63.90 (OS_RC signal pad1@144.290 W, its east edge 144.56 -> 0.30mm clear; U_ONESHOT's west pad column starts x146.55 -> 0.79mm clear)
      - {x0: 158.187, y0: 73.45, x1: 159.287, y1: 74.55, layer: User.2} # U_FAULTAND.5 3V3@159.137,74.00 SOT-363 0.95 pitch: y box is EXACTLY the pad's own span, so pins 4 (y74.95) and 6 (y73.05) keep their full escape gaps; via stays WEST-biased at 158.737
      # FIFTH-WAVE reservations (task#21, 2026-07-25) — the RESCUE-LADDER class,
      # not the seed_stub class. The race-3 stitch put THREE 3V3 vias INSIDE the
      # isolation-comb keepout iso_col_r9 (x144.92-150.92, y23.2-52.9): measured
      # at (147.210,52.980), (147.980,52.580), (145.720,52.880) — 3 DRC
      # items_not_allowed, and copper inside the barrier that holds the 6mm
      # keypad creepage. Root cause: R_OS2.2, C_TCDV.1 and C_EXP.1 are plane pads
      # with NO deterministic seed_stub, so they fall through to
      # pad_rescue -> stub_fallback -> astar_fallback, and that ladder does NOT
      # honour DRC rule areas (route_and_stitch_generic try_via takes an `avoid`
      # list but island_rescue/the fallbacks pass none — a fleet gap, filed for
      # v1.3). MEASURED on the race-3 chain: all THREE pads have ZERO legal
      # on-pad via sites, so the ladder had nothing legal to find near the pad
      # and wandered 2.5mm north into the comb. Reserve + seed_stub takes them
      # off the ladder entirely. C_TCDV and C_EXP have BOTH pads on plane nets
      # (3V3 + GND), so the whole cap is reserved (C_TCAV/C_AND3/C_OENAND
      # precedent); R_OS2's pad1 OS2_RC is a signal escaping WEST, so its box is
      # east-biased and starts 0.30mm east of that pad's edge. All four boxes
      # verified to contain 0 foreign pads.
      - {x0: 146.66, y0: 54.95, x1: 147.76, y1: 56.05, layer: User.2} # R_OS2.2  3V3@147.210,55.50 (OS2_RC signal pad1@146.190 W, east edge 146.46 -> 0.30mm clear)
      - {x0: 59.77, y0: 80.35, x1: 61.855, y1: 81.605, layer: User.2} # C_TCDV   3V3@60.320 + GND@61.280 (both plane; whole cap; 1.14mm channel kept open to C_TCAV's rect at x62.87)
      - {x0: 145.47, y0: 81.405, x1: 147.535, y1: 82.55, layer: User.2} # C_EXP    3V3@146.020 + GND@146.980 (both plane; whole cap)
  waves:
    exclude: ["GND", "3V3", "unconnected-*"]   # In1 GND plane + In2 3V3 plane own these
    groups:
      # With 0 N/S crossings these are ordinary same-side signal groups, routed
      # hardest/densest-first. safety = AND-chain + relay-control signals (all
      # SOUTH, around U_SCHM/AND-chain/U_EXP); pi = Pi-interface signals (J_PI
      # to the 595s / watchdog / expander, all SOUTH).
      # eFuse WSON-8 (0.5mm pitch) dense escape -- routed FIRST so the sandwiched
      # signal pins (esp. EF_ILM, pin 7) claim their via-in-pad escape lanes
      # before the power pins (5V_RPP/5V_PROTECTED, pwr wave) box them in.
      efuse: [EF_DVDT, EF_OVLO, EF_ILM, EFUSE_FLT_N]   # EFUSE_FLT_N renamed from PWR_GOOD_N (pin review Q1, 2026-07-23)
      # ESTOP_RAW/MODE_RAW/DOOR_RAW promoted from `rest` (v1.2d, 2026-07-24,
      # MEASURED: with the new sig-wave edge clearance ESTOP_RAW lost its
      # corridor into U_SCHM.1 in ALL 3 chains when routed last; the raw
      # safety-contact nets belong with their cleaned outputs in the early wave)
      # DECU_G1_RAW/DECD_G1_RAW also promoted (v1.2e, MEASURED: DECU_G1_RAW
      # failed "preexisting_blockers" in all chains when routed in the last
      # wave — U_SR1.3's escape walled in by earlier tracks; these are the
      # decoder-enable REQUEST lines, safety-adjacent by function).
      # ESTOP_NI/MODE_NI/DOOR_NI promoted from `sig` (task#21, 2026-07-25, MEASURED):
      # these are the 74HC14 (U_SCHM) Schmitt-conditioned intermediates of the raw
      # safety contacts. DOOR_NI links U_SCHM.10<->.13, an intra-package net that
      # must route PAST pins 11/12 (DOOR_RAW/DOOR_OK). With those raw nets in the
      # early safety wave and the _NI intermediates left for the last sig wave, the
      # _NI escape channel was already taken -> DOOR_NI stranded DETERMINISTICALLY
      # in every chain. Routing the whole conditioning chain in ONE wave frees it.
      # TC_FAULT_N promoted from `sig` (task#21 D-BACK, 2026-07-25, MEASURED): with
      # the 4 new trapped-pad reservations the sig field re-congested and TC_FAULT_N
      # (U_TC MAX31856 fault -> U_EXP.7) walled DETERMINISTICALLY in ALL 3 race
      # candidates — its long U_TC->U_EXP span lost every channel and U_EXP.7's escape
      # was boxed by FAULT (N) + BOARD_ID0/WD_OK (S). It routes to U_EXP alongside
      # FAULT (pin6) / WD_OK (pin8), so grouping it in the early safety wave lets KRT
      # order all three expander-fault escapes together, BEFORE the sig-wave BOARD_ID0
      # walls pin7. SAFETY-relevant: TC over-temp fault flag. (wave PROMOTION is the
      # journal's durable fix for walled late-wave pads.)
      safety: [TEMP_OK, WD_OK, ESTOP_OK, FAULT, TC_FAULT_N, MODE_AUTO_HW,
               DOOR_OK, REARM_N, STOP_REQ, PRESS_TIMED, CONTACTOR_C,
               KEY_RELAY_ALLOWED, ESTOP_RAW, MODE_RAW, DOOR_RAW,
               DECU_G1_RAW, DECD_G1_RAW, ESTOP_NI, MODE_NI, DOOR_NI]
      pi: [HOST_AUTH, WD_PET, MCU_RELAY_ENABLE, KEY_CLOCK, KEY_LATCH,
           KEY_RESET_N, KEY_DATA]
      # keypad-iso domain: routes WITHIN the north band (User.3 keepout open north)
      keypad: [KP_U1, KP_U2, KP_U3, KP_U4, KP_U5, KP_U6, KP_D1, KP_D2, KP_D3,
               KP_D4, U_SEL_BUS, D_SEL_BUS, RKEY_MID, RSTOP_MID]
      # coil selects + drives: decoders/ULN (south) -> reed coil pads (y37.81).
      # ALL now on ONE side (ULN_A + ULN_B both south) -- SEL_D3/D4 + COIL_D1/D2
      # are NO LONGER crossers, they join the coil group.
      coil: [SEL_U1, SEL_U2, SEL_U3, SEL_U4, SEL_U5, SEL_U6,
             SEL_D1, SEL_D2, SEL_D3, SEL_D4,
             COIL_U1_N, COIL_U2_N, COIL_U3_N, COIL_U4_N, COIL_U5_N, COIL_U6_N,
             COIL_D1_N, COIL_D2_N, COIL_D3_N, COIL_D4_N, COIL_PRESS_N,
             COIL_STOP_N, 5V_KEY_RELAY]
      pwr: [5V_PROTECTED, 5V_IN, 5V_FUSED, 5V_RPP, 5V_STOP, 3V3_ANALOG,
            3V3_SW_A, 3V3_SW_B, 3V3_SW_RHA, 3V3_SW_RHE]
      # analog COMPARATOR nets promoted out of `sig` (task#21, 2026-07-25, MEASURED):
      # TH_CAM_B routed as part of the 84-net `sig` wave in the promoted-era chain,
      # but under current KRT it DETERMINISTICALLY strands (8/8 race chains, both
      # with and without the plane reservations — a pre-existing marginality the
      # earlier lucky race masked). The over-temp comparator nets span the whole
      # dense SW analog field (U_COMP x21 -> R_SER0/R_REF3 x58 -> J_THERM y95) and
      # lose their channels to SDA_A/SCL_A/ADC/TC when routed last. Promoting them
      # to a dedicated wave (routes BEFORE the sensor-I2C nets congest the field)
      # is the durable fix the journal harvested ("wave PROMOTION is the durable
      # fix for walled late-wave pads"). SAFETY-relevant: these are the camera
      # hard-stop sense lines (reviewer fix #2).
      # The thermistor-connector nets all DROP vertically from the SW analog
      # cluster (x21-60) to J_THERM_A/B/J_TC at y95-97, while SDA/SCL/SHIELD_DRAIN
      # run HORIZONTALLY at y92-95 straight across those drops — a structural
      # crossing conflict. Routing the vertical drops FIRST (analog wave) lets the
      # horizontal buses find the free layer around them (whack-a-mole confirmed:
      # promoting only TH_CAM shifted the fail to TH_MOUNT_A). Promote the whole
      # thermistor/comparator reach-group.
      # TC_POS promoted too (task#21): C_TCPA nudged S of U_TC's SPI fan into the
      # thermistor-drop field; its TC_POS pad is reachable only if TC_POS routes
      # WITH the analog wave (in `sig` it was walled off by the already-placed
      # analog drops). TC_POS is a thermocouple analog net — belongs here anyway.
      # ADC_CH0-7 promoted too (task#21): the failure kept landing on the single
      # "loser" net in the fully-utilised SW analog region (ADC_CH4->C_FLT4). Route
      # the WHOLE analog front-end (thermistors + TC + comparator + the 8 ADC
      # channel filters) as ONE early wave, leaving `sig` for the digital nets — a
      # clean analog/digital split that gives every analog net priority in its own
      # congested cluster.
      # ADC SPI BUS promoted from `sig` (task#21 D-BACK iterate 1, 2026-07-25,
      # MEASURED). The MCP3208 is a WALL by construction: its 8 analog inputs
      # (pads 1-8) face WEST while their C_FLT filter caps sit EAST/SE at x52-59,
      # and its SPI port (pads 10-13) faces EAST toward J_PI — so BOTH pad columns
      # need east-bound corridors and the ADC_CH nets must wrap the package. With
      # ADC_CH0-7 in the analog wave and the SPI nets left for the last `sig` wave,
      # the analog wave laid ADC_CH3 B.Cu straight across y76.000 (x40->47.5) and
      # ADC_CH4 B.Cu across y76.600 (x40.5->45.8) — sealing pads 10/11/12. Result:
      # ADC_CS_N + SPI_MISO + SPI_MOSI failed in ALL 6 race chains (deterministic,
      # not stochastic; the aa6659a race cleared them only by luck of layout).
      # Routing the SPI bus IN THE SAME WAVE lets KRT's rip-up optimizer negotiate
      # the two demands against each other instead of freezing ADC_CH first — the
      # journal's harvested rule ("wave PROMOTION is the durable fix for walled
      # late-wave pads"), applied to the pad column rather than a single net.
      # SPI_SCLK joins them: it shares the same escape column, and leaving it in
      # `sig` would just move the wall to pad 13.
      # MAX31856 status/select + cold-junction inputs promoted too (task#21 D-BACK
      # iterate 2, 2026-07-25, MEASURED). Promoting the ADC SPI bus fixed U_ADC
      # (3 fails -> 0) and the wall moved ONE package east: TC_DRDY_N failed
      # "preexisting_blockers" at U_TC.7 in all 6 chains, because the SPI bus now
      # claims U_TC's escape lanes in the analog wave while TC_DRDY_N was still
      # waiting in `sig`. Chasing it net-by-net is the whack-a-mole this file has
      # already paid for twice, so close the group by RULE instead of by symptom:
      # EVERY signal net on U_ADC or U_TC routes in the analog wave. That is what
      # the paragraph above always intended ("route the WHOLE analog front-end as
      # ONE early wave, leaving `sig` for the digital nets") — TC_CS_N/TC_DRDY_N/
      # TC_NEG/TC_NEG_IN were simply never moved. (TC_FAULT_N stays in `safety`:
      # it is an over-temp fault flag and was promoted there for U_EXP's escape.)
      analog: [TH_CAM_A, TH_CAM_B, TCAM_THRESH, TH_MOUNT_A, TH_MOUNT_B,
               TH_PORT_A, TH_PORT_B, TH_ENCLOSURE, TH_SPARE, TC_POS_IN, TC_POS,
               TC_NEG_IN, TC_NEG,
               ADC_CH0, ADC_CH1, ADC_CH2, ADC_CH3, ADC_CH4, ADC_CH5, ADC_CH6, ADC_CH7,
               ADC_CS_N, SPI_MISO, SPI_MOSI, SPI_SCLK, TC_CS_N, TC_DRDY_N]
      sig: rest

route:
  krt: ~/gits/KiCadRoutingTools
  race: 3            # KRT is stochastic: 3 concurrent chains, quick-measured best wins
  kicad_python: /usr/bin/python3
  common:
    layers: [F.Cu, B.Cu]
    fab_tier: advanced          # via/clearance floors from nets.yaml fab_tier
    no_stub_layer_swap: true
    keepout: true
    keepout_layer: User.2
    clearance: 0.15
  waves:
    - {name: efuse, group: efuse, track_width: 0.2, max_iterations: 800000,
       max_ripup: 50}
    - {name: safety, group: safety, track_width: 0.2,
       max_iterations: 600000, max_ripup: 40}
    - {name: pi, group: pi, track_width: 0.2, max_iterations: 600000}
    - {name: keypad, group: keypad, track_width: 0.3, keepout_layer: User.3,
       board_edge_clearance: 0.35, max_iterations: 400000}   # sel-bus rails cross the inter-reed slots (y30.5) -> keep 0.35mm
    - {name: coil, group: coil, track_width: 0.4, board_edge_clearance: 0.35, max_iterations: 500000}   # coil rail/drops pass the slots (y37.5) -> keep 0.35mm
    - {name: pwr,  group: pwr,  max_iterations: 500000}
    # analog comparator nets FIRST-served among the sensor field (task#21): route
    # before the sig wave so TH_CAM_A/B/TCAM_THRESH claim channels through the
    # dense SW cluster before SDA/SCL/ADC/TC fill it. track 0.25 (sig class).
    # ripup 120 -> 160 (task#21): the wave grew 19 -> 27 nets when the ADC/TC SPI
    # bus joined it, and it now carries the two hardest escape fields on the board.
    - {name: analog, group: analog, track_width: 0.25, board_edge_clearance: 0.35,
       max_iterations: 1500000, max_probe_iterations: 100000, max_ripup: 160}
    # board_edge_clearance added to sig (v1.2, 2026-07-24, MEASURED): SDA_B ran
    # ON the south edge (y101.9 vs edge y102, 0.00mm DRC edge clearance x3) —
    # the prep edge_band did not stop the sig wave.
    # sig effort RAISED (task#21, MEASURED): after the analog-wave promotion the
    # 74-net sig wave still left exactly 1 net stranded per chain (a DIFFERENT net
    # each race — RAIL_EN_RHA/SR_OE_N/... — i.e. KRT ran out of ripup budget on the
    # last net, not a hard block; ~24 chains never reached 0). More ripup +
    # iterations lets it clear the final net.
    - {name: sig, group: sig, track_width: 0.25, board_edge_clearance: 0.35,
       max_iterations: 1500000, max_probe_iterations: 100000, max_ripup: 120}
  # Promoted converged chain (canon M3): 0 routed-net unconnected, 0-crossing
  # topology. `import` uses this when there is no fresh 06_build FINAL marker, so
  # `rebuild_all.sh --reuse-route` (and a fresh clone / CI) is DETERMINISTIC.
  final: 03_src/cooksense/route/final_chain.kicad_pcb

stitch:
  clearance: 0.15
  via: {spacing: 0.85, pth_margin: 0.3}    # size/drill tier-derived (advanced)
  # KEEP advanced via-in-pad size (0.25/0.15). The pass default 0.6/0.3 shorts a
  # via-in-pad board (818 DRC finds when it fired at 0.6): KRT already emits 0.25/0.15.
  # below_width per R-PREFLIGHT PF-NORM (2026-07-24): without it the pass
  # default (0.449) would resize every correctly-sized 0.25 tier via.
  normalize_vias: {size: 0.25, drill: 0.15, below_width: 0.24}
  keepin: {inset: 0.8}
  # via_janitor DROPPED (2026-07-23, successor lead; runbook step-2 option B).
  # via_janitor removes ANY via with same-net copper on <2 layers, crediting a
  # zone by its OUTLINE (fill-blind). In the dense MCP3208 ADC cluster that pruned
  # legit GND plane-bond via-in-pads whose only 2nd layer is the In1 plane ->
  # whack-a-mole cap opens (C_FLT1 before fill / C_FLT6 after fill: a different
  # marginal cap per fill state). Its one durable purpose was deleting the STOCHASTIC
  # 5V_RPP dead-end KRT detour via, which the promoted race/c0/r7 realization does
  # NOT contain (0 5V_RPP vias — MEASURED). prune_stitch_dangling (final pass) is the
