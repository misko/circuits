  - {name: iso_pktS_p3, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [105.20, 46.9, 114.44, 52.9]}
  - {name: iso_pktS_p4, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [135.68, 46.9, 144.92, 52.9]}
  - {name: iso_pktS_p5, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [166.16, 46.9, 175.40, 52.9]}
  - {name: iso_pktS_e,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [196.64, 46.9, 200.00, 52.9]}
  # eFuse via-in-pad escape lane (advanced tier), reserved south of U_EFUSE (+12y)
  - {name: efuse_escape, deny: [], layers: [F.Cu, B.Cu], rect: [48.0, 61.0, 62.0, 70.0]}
