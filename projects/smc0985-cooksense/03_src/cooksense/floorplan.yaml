    - {match: "TP_RKEY", region: keypad}
    - {match: "TP_5VKR", region: drive}
    - {match: "TP_ALLOW", region: safety}
    - {match: "TP_FAULT", region: safety}
    - {match: "TP_PGOOD", region: pwr}
    - {match: "TP_WDOK", region: safety}
    - {match: "TP_ESTOP", region: safety}
    - {match: "TP_3V3", region: drive}
    - {match: "TP_5VP", region: pwr}
    - {match: "TP_TEMPOK", region: analog}
    - {match: "TP_ENCL", region: analog}
    - {match: "TP_SPARE", region: analog}
    - {match: "TP_TCDRDY", region: analog}
    - {match: "TP_TCFAULT", region: analog}
    - {match: "TP_TCTH", region: analog}   # v1.2: threshold bring-up point (near U_COMP)
    - {match: "TP_*", region: piedge}
    # ---- NOT ASSEMBLED (canon A-POP; declared in 03_src/rules/assembly.yaml) --
    # These 13 refs have NO LCSC code — they are not in JLC's catalog — yet
    # cooksense v1.0 and v1.1 both SHIPPED them on the CPL, i.e. JLC was told to
    # machine-place 13 parts it cannot source, while the v1.1 MANIFEST declared
    # 12 of the 13 `not_assembled` (J_TC was declared nowhere at all). The two
    # artifacts contradicted each other and every gate was green.
    # `exclude_from_pos_files` is the SOURCE half of the fix: it takes them off
    # the CPL at export. assembly.yaml is the declaration half (reason +
    # DATED evidence + disposition), and the release MANIFEST's not_assembled:
    # line is GENERATED from that file. Placement is UNAFFECTED — all 13 are
    # anchors, and initial_pose() resolves anchors before patterns.
    # DO-NOT-SUBSTITUTE both classes: the reed contact rating IS the safety
    # argument (ADR-0006), and J_TC's Type-K alloy pins are the measurement.
    - {match: ["K_U1", "K_U2", "K_U3", "K_U4", "K_U5", "K_U6",
               "K_D1", "K_D2", "K_D3", "K_D4", "K_PRESS", "K_STOP", "J_TC"],
       attrs: [exclude_from_pos_files]}
    # ---- THE SAME DEFECT, THREE MORE REFS (task#21, 2026-07-25) --------------
    # MEASURED on the v1.3 board: FOUR through-hole parts were still on the CPL
    # (J_CONTACTOR, J_ESTOPLOOP, J_LOADCELL, J_PI) — a 2-pole screw terminal, a
    # JST-XH, and a 40-way 2.54mm pin socket. This board orders JLC STANDARD SMT
    # assembly (assembly.yaml `service: standard`, `sides: [top]`), which does
    # not place through-hole parts AT ALL. That is the block above's OWN stated
    # reason for the twelve relays and J_TC ("the package is THT and standard
    # SMT assembly does not place through-hole") — it was simply never applied
    # to the other four, so v1.0 and v1.1 both shipped a CPL instructing JLC to
    # machine-place parts its ordered service cannot touch.
    # J_CONTACTOR/J_ESTOPLOOP are now the merged J_ISOLOOP, so the surviving
    # three go here and into assembly.yaml with dated package evidence.
    # NOTE this is a POPULATION correction, not a sourcing one: J_LOADCELL
    # (C158012) and J_PI (C2718002) ARE stocked, and stay in the BOM as
    # self-supplied lines — they just stop being machine-placement instructions.
    - {match: ["J_ISOLOOP", "J_LOADCELL", "J_PI"],
       attrs: [exclude_from_pos_files]}
    # ---- catch-all ----
    - {match: "*", region: drive}

  regions:
    keypad:  [40.0, 12.0, 160.0, 21.0]
    pwr:     [16.0, 54.0, 72.0, 74.0]
    drive:   [64.0, 54.0, 160.0, 80.0]
    piedge:  [92.0, 84.0, 146.0, 100.0]
    safety:  [150.0, 54.0, 200.0, 92.0]
    analog:  [14.0, 64.0, 96.0, 100.0]
    swrails: [142.0, 84.0, 200.0, 100.0]

  # clearance 0.3 -> 0.35 (R-PREFLIGHT PF-LEGALIZE WARN, 2026-07-24: crow-rv2
  # measured 0.35 helped rescue-via pockets; the full 0.55 bound is too
  # disruptive on this density — WARN accepted, anchored clusters unaffected).
  legalize: {enable: true, clearance: 0.35, edge_margin: 1.2, hole_keepout: 3.2, ring_max: 120}

design_rules:
  track_min_width: 0.127
  min_clearance: 0.09          # jlc_4layer_advanced (MCP23017 0.65mm + TPS259573 0.5mm)
  via_min_size: 0.25
  min_through_drill: 0.15
  via_min_annulus: 0.05
  hole_clearance: 0.2
  hole_to_hole: 0.25
  copper_edge_clearance: 0.3
  solder_mask_min_width: 0.0
  solder_mask_expansion: 0.0

zones:
  # ALL planes confined to the SOUTH logic band (y >= 53): 6.63mm below the
  # deepest keypad pocket copper (pocket pads end y46.37). The keypad band,
  # relay row, pockets and coil gaps carry NO plane.
  #
  # ZONE CLEARANCE 0.3 -> 0.2 (task#21, 2026-07-25, MEASURED — a ROOT-CAUSE fix
  # for the J_PI plane-shredding class). J_PI is a 2x40 THT header on 2.54mm
  # pitch with 1.70mm round pads. At clearance 0.30 each antipad radius is
  # 0.85+0.30 = 1.15mm, so the copper NECK between two adjacent antipads is
  # 2.54-2*1.15 = 0.24mm — BELOW min_thickness 0.30, so the filler deletes every
  # neck and the plane under the header disintegrates into ~19 isolated
  # 2.27x2.27mm squares per layer. That is why route.yaml had grown 16 hand-
  # measured "sliver tie" via sites, each one realization-COUPLED (re-derived
  # after every re-race, and the stitch hard-errored on them when this v1.2
  # re-race moved the tracks). At clearance 0.20 the antipad radius is 1.05mm
  # and the neck is 2.54-2.10 = 0.44mm > 0.30 — the plane stays CONTINUOUS and
  # the whole class disappears. MEASURED on the stitched board: GND island
  # groups 22 -> 6 (all 13 In1 J_PI squares gone) with no other change.
  # 0.20mm is comfortably above every clearance the DRU enforces (netclasses
  # 0.12mm, tier min_space 0.09mm), so nothing gets tighter than the rules
  # already allow — the pours simply stop being cut by their own antipads.
  - {net: GND, layers: [In1.Cu], priority: 0, min_thickness: 0.3, clearance: 0.2, connect: thermal, rect: [12.0, 53.0, 200.0, 102.0]}
  - {net: GND, layers: [F.Cu, B.Cu], priority: 0, min_thickness: 0.3, clearance: 0.2, connect: thermal, rect: [12.0, 53.0, 200.0, 102.0]}
  # 3V3 logic-supply plane on In2 over the logic band (routing agent rec).
  - {net: 3V3, layers: [In2.Cu], priority: 0, min_thickness: 0.3, clearance: 0.2, connect: full, rect: [12.0, 53.0, 200.0, 102.0]}

keepouts:
  # ===== v1.3 P0-2: THE OPTO ISOLATION BARRIER (layout lens) ==================
  # U_OPTO (LTV-817S) is anchored at [185,90,0]: LED-side pads (OPTO_LED_A, GND)
  # at x180.235, isolated-side pads (CONTACTOR_E, CONTACTOR_C) at x189.765, both
  # 2.00x1.78mm, so the clear strip between the pad columns is x[181.235,188.765].
  # v1.2 filled that strip with GND on F.Cu/In1/B.Cu, 3V3 on In2, FIVE GND vias
  # and the SDA_B / SCL_B / SHIELD_DRAIN / 3V3_SW_RHE tracks — i.e. the entire
  # 5kVrms barrier was shorted out by the pour, and the closest isolated-to-SELV
  # copper measured 0.175mm. The part's own dossier forbids exactly this:
  # 02_parts/LTV-817S-TA1/part.yaml — "Keep INPUT copper (1/2) and OUTPUT copper
  # (3/4) on opposite package edges with NO ground pour or trace crossing beneath
  # the body". This rect denies EVERYTHING on ALL FOUR layers across the full
  # package height, so the barrier is empty by construction. The clearance either
  # side of it is held separately by the ISO_CONTACTOR netclass DRU rule (2.0mm),
  # which is what makes the property machine-checkable rather than incidental.
  - {name: opto_barrier, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [181.4, 85.8, 188.6, 94.2]}
  # ===== v1.3 P0-A: THE ISO_CONTACTOR MOAT, AS A KEEPOUT =====================
  # The opto_isolation_2mm DRU rule says ISO_CONTACTOR copper holds 2.0mm to
  # every other NAMED net (IEC 60664-1 basic insulation, 30V working, pollution
  # degree 3, material group IIIa). Against tracks the router can honour that;
  # against the GND/3V3 PLANES it cannot — a pour fills to its own clearance
  # (0.200mm here) and would sit 0.2mm from the isolated pads. v1.2 measured
  # exactly that: 82 violations, worst 0.199mm. So the moat has to be POUR
  # GEOMETRY, and it could not be written until the isolated connectors had a
  # legal home (they now do: J_ISOLOOP at 195.30,95.00).
  # Rects are the 2.0mm OUTWARD OFFSET of the isolated copper, MEASURED off the
  # built footprints, not guessed:
  #   J_ISOLOOP pads (rot90) x[194.20,196.40] y[88.65,101.35] -> +2.0mm ->
  #     x[192.20,198.40] y[86.65,103.35]. Extended EAST to the board edge
  #     (200.10) so no 1.7mm GND sliver is stranded between the moat and the
  #     edge, and SOUTH past the edge so the clip is the outline, not a number.
  #   U_OPTO isolated pads (3/4) x[188.765,190.765] y[87.84,92.16] -> +2.0mm ->
  #     x[186.765,192.765] y[85.84,94.16]; its WEST half is already denied on
  #     all four layers by opto_barrier, this covers the EAST half and the run
  #     across to J_ISOLOOP.
  # THE NORTH EDGE OF THE BLOCK RECT IS THE TIGHT ONE: 86.65 is exactly
  # J_ISOLOOP.4's pad top (88.65) minus the 2.0mm rule, and J_DOOR's south GND
  # shell tab ends at 86.61 - so the pour still reaches and bonds that tab, with
  # 0.04mm to spare. Move J_DOOR south and the tab falls inside the moat and
  # goes unconnected; move it north and the moat closes. Both are MEASURED
  # failures, which is why the anchor block above says the numbers are solved.
  # deny: [pours] ONLY - the isolated nets themselves are TRACKS and must be
  # able to cross their own moat. The usable ISO track corridor is whatever is
  # left 2.0mm inside these rects: x[194.20,196.40] south of the opto lobe (the
  # pad column itself, on any layer - all four are denied to the pour), and
  # x[188.765,196.40] across the y[87.84,94.16] band. SELV tracks are kept out
  # by the matching User.2 route keepout in route.yaml (the `iso` wave runs on
  # User.4 so it is never blocked by its own moat).
  - {name: iso_moat_block, deny: [pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [192.20, 86.65, 200.10, 102.10]}
  - {name: iso_moat_opto,  deny: [pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [186.70, 85.80, 192.80, 94.20]}
  # NO POURS north of the logic band: keypad band + relay row + pockets + coil
  # gaps all plane-free (isolation held; coil nets are tracks only, as v1.0).
  - {name: keypad_iso, deny: [pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [12.0, 10.0, 200.0, 53.0]}
  # ===== THE ISOLATION COMB (DRC-ENFORCED, v1.1 successor of iso_barrier) =====
  # Deny tracks/vias/pours in every no-man's zone of the comb; a track that
  # collapses the >=6mm keypad creepage FAILS kicad DRC ("items not allowed").
  # (a) 12 intra-relay column barriers: between each relay's coil column and
  #     contact column (pads at xc+-3.81 stay reachable OUTSIDE the rect).
  - {name: iso_col_r1,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [23.00, 23.2, 29.00, 52.9]}
  - {name: iso_col_r2,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [38.24, 23.2, 44.24, 52.9]}
  - {name: iso_col_r3,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [53.48, 23.2, 59.48, 52.9]}
  - {name: iso_col_r4,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [68.72, 23.2, 74.72, 52.9]}
  - {name: iso_col_r5,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [83.96, 23.2, 89.96, 52.9]}
  - {name: iso_col_r6,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [99.20, 23.2, 105.20, 52.9]}
  - {name: iso_col_r7,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [114.44, 23.2, 120.44, 52.9]}
  - {name: iso_col_r8,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [129.68, 23.2, 135.68, 52.9]}
  - {name: iso_col_r9,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [144.92, 23.2, 150.92, 52.9]}
  - {name: iso_col_r10, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [160.16, 23.2, 166.16, 52.9]}
  - {name: iso_col_r11, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [175.40, 23.2, 181.40, 52.9]}
  - {name: iso_col_r12, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [190.64, 23.2, 196.64, 52.9]}
  # (b) 6 coil-gap NORTH strips: no-man's zone between the keypad band
  #     (copper <=23.2) and the coil-gap logic (pads reach y29.63).
  - {name: iso_gapN_g1, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [29.00, 23.2, 38.24, 29.4]}
  - {name: iso_gapN_g2, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [59.48, 23.2, 68.72, 29.4]}
  - {name: iso_gapN_g3, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [89.96, 23.2, 99.20, 29.4]}
  - {name: iso_gapN_g4, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [120.44, 23.2, 129.68, 29.4]}
  - {name: iso_gapN_g5, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [150.92, 23.2, 160.16, 29.4]}
  - {name: iso_gapN_g6, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [181.40, 23.2, 190.64, 29.4]}
  # (c) 7 pocket SOUTH strips: no-man's zone between pocket keypad copper
  #     (pads end y46.37) and the south logic band / planes (y>=53).
  - {name: iso_pktS_w,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [12.00, 46.9, 23.00, 52.9]}
  - {name: iso_pktS_p1, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [44.24, 46.9, 53.48, 52.9]}
  - {name: iso_pktS_p2, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [74.72, 46.9, 83.96, 52.9]}
  - {name: iso_pktS_p3, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [105.20, 46.9, 114.44, 52.9]}
  - {name: iso_pktS_p4, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [135.68, 46.9, 144.92, 52.9]}
  - {name: iso_pktS_p5, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [166.16, 46.9, 175.40, 52.9]}
  - {name: iso_pktS_e,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [196.64, 46.9, 200.00, 52.9]}
  # eFuse via-in-pad escape lane (advanced tier), reserved south of U_EFUSE (+12y)
  - {name: efuse_escape, deny: [], layers: [F.Cu, B.Cu], rect: [48.0, 61.0, 62.0, 70.0]}
  # eFuse WSON-8 0.5mm-pitch pad-entry region (scoped floor marker, +12y)
  - {name: efuse_padentry, deny: [], layers: [F.Cu, B.Cu], rect: [57.0, 55.5, 63.0, 59.5]}

escape_corridors:
  - {ref: U_EXP, side: S, depth_mm: 5.0, layers: [F.Cu, B.Cu]}     # MCP23017 SSOP-28 dense side
  - {ref: U_EFUSE, side: S, depth_mm: 4.0, layers: [F.Cu, B.Cu]}   # TPS259573 WSON-8

silk:
  min_text_height: 0.6
  refdes: {size: 0.6, min_size: 0.45, fab_copy: true, clearance: 0.16, priority_prefixes: "UJKQ"}
  captions:
    - {text: "cooksense  SMC0985KS  sidecar v1.3", at: [106.0, 13.0], size: 0.9, nudge: false}   # BUMPED v1.2 -> v1.3 (2026-07-26): both red-team lenses caught the board silk naming a revision that was never sealed, sitting between two DO-NOT-ORDER releases. v1.3 has real physical deltas (H4 notch, merged J_ISOLOOP) so a field board must not claim to be v1.2.
    - {text: "KEYPAD ISOLATION COMB   >=6mm creepage   GND_ISO ONLY   (contact columns face pockets)", at: [106.0, 21.0], size: 0.8, nudge: false}
    - {text: "5V SELV IN", at: [39.0, 54.3], size: 0.7, nudge: false}
    - {text: "ANALOG SENSE (3V3_ANALOG)", at: [36.0, 84.0], size: 0.7, nudge: false}
    - {text: "PI 40-PIN RIBBON (SIDECAR)", at: [112.0, 90.0], size: 0.7, nudge: false}
    # ===== ADR-0012: THE ENCLOSURE ASSUMPTION, ON THE BOARD ITSELF ============
    # The >=6mm keypad<->SELV creepage is held under the PER-HOLE rule, which is
    # only valid because NO CONDUCTIVE PLATE BONDS TWO MOUNTING HOLES. Bolt this
    # board into a metal bracket and the defect re-opens at 3.000mm on a
    # mains-adjacent cooking interlock. A commit body and an ADR are read by
    # whoever goes looking; the person holding the screwdriver is not looking.
    # So it goes on the silk, once as the full sentence and once per hole as the
    # actual instruction ("NYLON HW") rather than a document reference.
    # Caption sites MEASURED clear on the v1.3 placement: the north band is empty
    # x[27,98] (H1 courtyard ends x26.5, TP_USEL starts x98.7).
    - {text: "MOUNTING HW: NYLON M2.5 -- OR METAL IN A NON-CONDUCTIVE ENCLOSURE ONLY.", at: [62.0, 17.0], size: 0.6, nudge: false}
    - {text: "A PLATE BONDING ANY 2 HOLES BREAKS THE 6mm KEYPAD ISOLATION. ADR-0012", at: [62.0, 18.6], size: 0.6, nudge: false}
    - {text: "NYLON HW", at: [33.0, 14.0], size: 0.5, nudge: false}    # H1 (24,14)
    - {text: "NYLON HW", at: [194.0, 19.6], size: 0.5, nudge: false}   # H2 (194,14)
    - {text: "NYLON HW", at: [17.0, 95.2], size: 0.5, nudge: false}    # H3 (17,90)
    - {text: "NYLON HW", at: [187.0, 51.0], size: 0.5, nudge: false}   # H4 (193,52)
    # ===== v1.3 P0-A: THE ISOLATED BLOCK, NAMED ON THE BOARD =================
    # J_ISOLOOP is the ONLY connector on this board whose poles are on the far
    # side of the opto barrier. Every other east-edge housing is SELV. A field
    # technician holding four wires needs to know that BEFORE landing them, and
    # the refdes alone does not say it.
    # THERE IS NO SILK SITE AT THE BLOCK, and that is MEASURED, not assumed. A
    # full scan of the board for a free F.SilkS box (pads +0.16mm, existing silk
    # +0.08mm, and every COURTYARD, because silk under a body is silk nobody
    # reads) says: the nearest visible site for "ISOLATED 30V" is (165.9,65.2),
    # 41.9mm away, and for the 7-character "ISO 30V" it is (165.5,79.5), 33.6mm
    # away. The SE corner is saturated -- J_RH_AMBIENT / J_RH_EXHAUST /
    # J_ISOLOOP refdes already tile the only clear band (y[100.39,101.61]) and
    # the block's own 14x7mm body covers everything else. Two captions were
    # placed here first and the nudge search pushed BOTH off the south edge
    # entirely (measured at y104.19-106.31, i.e. off the board), which is worse
    # than nothing because it prints nowhere and still counts as done.
    # So the warning goes where it CAN be read, in the north safety-caption
    # stack beside the ADR-0012 enclosure lines, and it names the corner so the
    # reader can find the block. Site MEASURED free at (62.0,15.4), between the
    # title (y13.0) and the mounting-hardware sentence (y17.0). The pole legend
    # (1 LOOP / 2 RET / 3 CTR / 4 CTR) does not fit anywhere on silk at all and
    # lives in the ORDER_README bring-up section + ADR-0013 instead.
    - {text: "J_ISOLOOP (SE CORNER) = ISOLATED 30V CONTACTOR LOOP -- NOT SELV", at: [62.0, 15.4], size: 0.6, nudge: true}

