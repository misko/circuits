zones:
  # ALL planes confined to the SOUTH logic band (y >= 53): 6.63mm below the
  # deepest keypad pocket copper (pocket pads end y46.37). The keypad band,
  # relay row, pockets and coil gaps carry NO plane.
  #
  # ZONE CLEARANCE 0.3 -> 0.2 (task#21, 2026-07-25, MEASURED — a ROOT-CAUSE fix
  # for the J_PI plane-shredding class). J_PI is a 2x40 THT header on 2.54mm
  # pitch with 1.70mm round pads. At clearance 0.30 each antipad radius is
  # 0.85+0.30 = 1.15mm, so the copper NECK between two adjacent antipads is
  # 2.54-2*1.15 = 0.24mm — BELOW min_thickness 0.30, so the filler deletes every
  # neck and the plane under the header disintegrates into ~19 isolated
  # 2.27x2.27mm squares per layer. That is why route.yaml had grown 16 hand-
  # measured "sliver tie" via sites, each one realization-COUPLED (re-derived
  # after every re-race, and the stitch hard-errored on them when this v1.2
  # re-race moved the tracks). At clearance 0.20 the antipad radius is 1.05mm
  # and the neck is 2.54-2.10 = 0.44mm > 0.30 — the plane stays CONTINUOUS and
  # the whole class disappears. MEASURED on the stitched board: GND island
  # groups 22 -> 6 (all 13 In1 J_PI squares gone) with no other change.
  # 0.20mm is comfortably above every clearance the DRU enforces (netclasses
  # 0.12mm, tier min_space 0.09mm), so nothing gets tighter than the rules
  # already allow — the pours simply stop being cut by their own antipads.
  - {net: GND, layers: [In1.Cu], priority: 0, min_thickness: 0.3, clearance: 0.2, connect: thermal, rect: [12.0, 53.0, 200.0, 102.0]}
  - {net: GND, layers: [F.Cu, B.Cu], priority: 0, min_thickness: 0.3, clearance: 0.2, connect: thermal, rect: [12.0, 53.0, 200.0, 102.0]}
  # 3V3 logic-supply plane on In2 over the logic band (routing agent rec).
  - {net: 3V3, layers: [In2.Cu], priority: 0, min_thickness: 0.3, clearance: 0.2, connect: full, rect: [12.0, 53.0, 200.0, 102.0]}

keepouts:
  # ===== v1.3 P0-2: THE OPTO ISOLATION BARRIER (layout lens) ==================
  # U_OPTO (LTV-817S) is anchored at [185,90,0]: LED-side pads (OPTO_LED_A, GND)
  # at x180.235, isolated-side pads (CONTACTOR_E, CONTACTOR_C) at x189.765, both
  # 2.00x1.78mm, so the clear strip between the pad columns is x[181.235,188.765].
  # v1.2 filled that strip with GND on F.Cu/In1/B.Cu, 3V3 on In2, FIVE GND vias
  # and the SDA_B / SCL_B / SHIELD_DRAIN / 3V3_SW_RHE tracks — i.e. the entire
  # 5kVrms barrier was shorted out by the pour, and the closest isolated-to-SELV
  # copper measured 0.175mm. The part's own dossier forbids exactly this:
  # 02_parts/LTV-817S-TA1/part.yaml — "Keep INPUT copper (1/2) and OUTPUT copper
  # (3/4) on opposite package edges with NO ground pour or trace crossing beneath
  # the body". This rect denies EVERYTHING on ALL FOUR layers across the full
  # package height, so the barrier is empty by construction. The clearance either
  # side of it is held separately by the ISO_CONTACTOR netclass DRU rule (2.0mm),
  # which is what makes the property machine-checkable rather than incidental.
  - {name: opto_barrier, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [181.4, 85.8, 188.6, 94.2]}
  # NO POURS north of the logic band: keypad band + relay row + pockets + coil
  # gaps all plane-free (isolation held; coil nets are tracks only, as v1.0).
  - {name: keypad_iso, deny: [pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [12.0, 10.0, 200.0, 53.0]}
  # ===== THE ISOLATION COMB (DRC-ENFORCED, v1.1 successor of iso_barrier) =====
  # Deny tracks/vias/pours in every no-man's zone of the comb; a track that
  # collapses the >=6mm keypad creepage FAILS kicad DRC ("items not allowed").
  # (a) 12 intra-relay column barriers: between each relay's coil column and
  #     contact column (pads at xc+-3.81 stay reachable OUTSIDE the rect).
  - {name: iso_col_r1,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [23.00, 23.2, 29.00, 52.9]}
