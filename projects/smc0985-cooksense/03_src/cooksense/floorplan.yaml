# cooksense floorplan — input for skills/kicad-pcb/scripts/generate_board_generic.py
#
# v1.1 SHRINK (D7, 2026-07-23): 252x92 -> 188x92mm. The v1.0 single-row rot90
# relay row (contacts N / coils S) was pitch-bound at 20mm: the DIP05-1A72-12L
# long axis (body 19.3mm / courtyard 19.90mm) lay ALONG the row, leaving 0.10mm
# courtyard gap — ZERO pitch shrink existed in that orientation (measured,
# BRIEF D7). USER DECISION: rot0 vertical-relay redesign. Relays stand with the
# long axis N-S (6.5mm body / 9.93mm bbox across the row), pitch 15.24mm — the
# EXACT orientation+pitch the part.yaml "super-column pitch" coupling figure was
# vetted in; relays additionally alternate rot180/rot0 in PAIRS (anti-parallel
# adjacent coils = the datasheet's own alternate-orientation mitigation).
#
# THE ISOLATION COMB (replaces the v1.0 straight barrier). At rot0/rot180 each
# relay's coil column and contact column are E-W separated (7.62mm c-c, 6.12mm
# pad-edge — the SAME creepage floor v1.0 measured). Pairing (r1 rot180 contact
# W | r2 rot0 contact E) makes:
#   - COIL GAPS (6, within pairs, x-window 9.24mm): both flanking columns are
#     coil (logic). 5V_KEY_RELAY + COIL_*_N route here, from the south band up
#     to the pads (y30.38/45.62) — logic never crosses a pocket.
#   - KEYPAD POCKETS (7 = 5 inter-pair + west end + east end): both flanking
#     columns are contact (isolated keypad). KP_*/SEL-bus drops run N-S in the
#     6.12mm clear channel between contact pads, joining the NORTH keypad band
#     (copper <= y23.2). J_KEY_MATRIX lives in the WEST end pocket.
#   - Creepage held by construction: keypad band y<=23.2 vs coil-gap pads
#     y>=29.63 (6.28mm); pocket pads y<=46.37 vs logic/planes y>=53 (6.63mm);
#     pocket drops vs coil pads 7.62mm horizontal; intra-relay columns 6.12mm.
#     Milled 0.6mm slots reinforce each coil-gap mouth (y26.0-26.6) and each
#     pocket mouth (y49.3-49.9), per the v1.0 slot pattern.
#   - DRC-enforced comb (deny tracks/vias/pours): 12 intra-relay column rects +
#     6 coil-gap north strips + 7 pocket south strips — a track that collapses
#     the comb FAILS kicad DRC ("items not allowed"), like v1.0's iso_barrier.
# Geometry: 12 relays, centers x=26.00..193.64 (pitch 15.24, span 167.64), row
# center y=38 (bbox y28.0..48.0). Board 188x92 (x 12..200, y 10..102). The
# south logic band (y53..102) absorbs the v1.0 south-band clusters: power block
# translated rigidly +12y (eFuse stubs/keepouts follow in route.yaml), ADC
# cluster rigidly +6y (GND-via reservations follow), U_EXP to (140,82) (3V3
# stub follows). Schematic/netlist UNCHANGED from v1.0 — placement/outline only.

project:
  name: cooksense
  netlist: 06_build/netlists/cooksense.net
  output: 04_kicad/cooksense.kicad_pcb
  parts_dir: 02_parts
  root: ../..
  fp_lib_table: 04_kicad/fp-lib-table

board:
  outline: {x0: 12.0, y0: 10.0, x1: 200.0, y1: 102.0}   # 188 x 92 mm, 4-layer SIDECAR
  edge_width: 0.1
  layers: 4
  mounting_holes:
    footprint: MountingHole:MountingHole_2.7mm_M2.5_ISO14580
    at: [[24.0, 14.0], [194.0, 14.0], [17.0, 90.0], [193.0, 52.0]]
  # ISOLATION milled slots (0.6mm), v1.1 comb pattern:
  #   - 6 coil-gap NORTH slots (y26.0-26.6): lengthen the keypad-band ->
  #     coil-gap-logic surface path across each gap mouth.
  #   - 6 pocket SOUTH slots (y49.3-49.9): lengthen the pocket-keypad ->
  #     south-logic-band surface path across each pocket mouth (east end
  #     pocket skipped: <3mm to the board edge, web too fragile; its single
  #     RSTOP_MID drop is covered by the 6.63mm construction gap).
  cutouts:
    # ===== THE H4 ISOLATION NOTCH — LOAD-BEARING. DO NOT REMOVE. ===============
    # It is what makes the keypad->H4-fastener CREEPAGE 6.5984mm instead of the
    # pre-notch 4.031mm, against a 6.000mm requirement.
    #
    # IT REACHES THE EAST BOARD EDGE (x191.50 -> x200.00, and 200.000 IS the
    # edge), so it is OUTLINE geometry: no router-bit minimum, no JLC internal-
    # cutout surcharge. THAT IS ALSO WHY IT COUNTS. IEC 60664-1's minimum-groove-
    # width rule (X = 1.5mm at pollution degree 3) governs a GROOVE — a channel
    # with material at the bottom, where the question is whether contamination
    # bridges across. A through-notch has no bottom and drains at the open end,
    # so creepage genuinely goes AROUND it. On 2026-07-26 the X rule was applied
    # to this notch, H4 was ruled a FAIL at 4.0286mm, and the ruling was reversed
    # the same day: 4.0286mm is the CLEARANCE (straight line, requirement well
    # under 1mm at 30V/PD3), not the creepage. See ADR-0015.
    #
    # THE CREEPAGE PATH, re-derived independently (canon M1), is NOT the naive
    # one — the 3.000mm fastener disc OVERHANGS the notch (|centre - notch SW
    # corner| = 2.6627mm < 3.000), so a straight run at the NW corner would cross
    # the void. The taut path skirts the west edge:
    #   leg 1  disc boundary at x191.500, y = 52 - sqrt(3^2 - 1.5^2) = 49.4019,
    #          up the notch's west edge to the NW corner        0.6019mm
    #   leg 2  NW corner (191.500,48.800) -> K_STOP.3 pad edge  5.9965mm
    #                                                    TOTAL  6.5984mm
    # matching the I-HW gate's 6.598mm by a different construction.
    #
    # MEASURED to cross NOTHING (v1.3 placement):
    #   COIL_STOP_N -> K_STOP.2 and 5V_STOP -> K_STOP.1 both route WEST of x191.5;
    #   RSTOP_MID -> K_STOP.3 and KP_U6 -> K_STOP.4 route NORTH into the keypad
    #     domain, never south across y49;
    #   the GND/3V3 pours start at y53.0, entirely SOUTH of the cut.
    # An INTERNAL slot here is not manufacturable anyway: the direct corridor
    # between H4's hardware edge (x196.0) and K_STOP.3's pad edge (x196.55) is
    # 0.55mm, narrower than any router bit. The edge notch is the only form.
    #
    # *** DO NOT TRY TO FIX H4 BY MOVING K_STOP. *** It cannot work and it was
    # measured: K_STOP.1's north pad edge (y29.630) IS route.yaml's "gap pads
    # 29.63", which with the keypad band cap at y23.200 sets the PRIMARY
    # keypad<->SELV creepage at 6.430mm by construction. North travel is capped
    # at 0.430mm BY THAT BARRIER; east at 1.500mm by the board edge; and the
    # 1.800mm east corridor is where RSTOP_MID and KP_U6 CLIMB, not slack.
    # Full derivation and the three failed re-races: ADR-0015.
    - {rect: [191.50, 48.8, 200.10, 49.8]}   # H4 keypad-isolation notch (edge-reaching) — LOAD-BEARING, see above
    - {rect: [29.40, 26.0, 37.84, 26.6]}    # coil gap r1r2
    - {rect: [59.88, 26.0, 68.32, 26.6]}    # coil gap r3r4
    - {rect: [90.36, 26.0, 98.80, 26.6]}    # coil gap r5r6
    - {rect: [120.84, 26.0, 129.28, 26.6]}  # coil gap r7r8
    - {rect: [151.32, 26.0, 159.76, 26.6]}  # coil gap r9r10
    - {rect: [181.80, 26.0, 190.24, 26.6]}  # coil gap r11r12
    - {rect: [13.00, 49.3, 22.60, 49.9]}    # west end pocket
    - {rect: [44.64, 49.3, 53.08, 49.9]}    # pocket r2r3
    - {rect: [75.12, 49.3, 83.56, 49.9]}    # pocket r4r5
    - {rect: [105.60, 49.3, 114.04, 49.9]}  # pocket r6r7
    - {rect: [136.08, 49.3, 144.52, 49.9]}  # pocket r8r9
    - {rect: [166.56, 49.3, 175.00, 49.9]}  # pocket r10r11

libraries: [/usr/share/kicad/footprints, 03_src/lib]

placement:
  anchors:
    # ================= KEYPAD DOMAIN (NORTH BAND + POCKETS) =================
    # J_KEY_MATRIX = WEST end pocket (mouth WEST, ribbon to Board C).
    J_KEY_MATRIX: [16.0, 20.0, 270]
    # 12 reeds, single row, VERTICAL (long axis N-S), pitch 15.24mm, row y=38.
    # rot180 = contact column WEST / coil EAST; rot0 = coil WEST / contact EAST.
    # Pairs (r1,r2)(r3,r4)... put coil columns FACING within the pair (logic
    # gap) and contact columns facing the pockets between pairs + board ends.
    # ULN_A drives reeds 1-8 (U1-6,D1,D2); ULN_B drives reeds 9-12.
    K_U1:    [26.00, 38.0, 180]
    K_U2:    [41.24, 38.0, 0]
    K_U3:    [56.48, 38.0, 180]
    K_U4:    [71.72, 38.0, 0]
    K_U5:    [86.96, 38.0, 180]
    K_U6:    [102.20, 38.0, 0]
    K_D1:    [117.44, 38.0, 180]
    K_D2:    [132.68, 38.0, 0]
    K_D3:    [147.92, 38.0, 180]
    K_D4:    [163.16, 38.0, 0]
    K_PRESS: [178.40, 38.0, 180]
    K_STOP:  [193.64, 38.0, 0]   # UNCHANGED — moving it CANNOT fix H4; see the cutouts block
    # keypad solder-selects (isolated domain, north band near their reeds)
    R_KEY:   [170.0, 16.0, 0]        # RKEY_MID @ K_PRESS (pocket r10r11 -> band)
    R_STOP:  [186.0, 16.0, 0]        # RSTOP_MID @ K_STOP (east end pocket -> band; 190->186: H2 courtyard)

    # ============ POWER + PROTECTION (SW, series-current order; v1.0 +12y) ============
    J_PWR:       [22.0, 60.0, 0]     # Micro-Fit vertical (mates top); W edge
    U_LDO:       [22.0, 70.0, 0]     # AMS1117-3.3 4-pad (S of J_PWR)
    D_ESD_IN:    [33.0, 55.0, 0]     # N strip, E of J_PWR body
    F1:          [40.0, 58.0, 0]     # polyfuse 1812
    Q_REV:       [49.0, 58.0, 180]   # revpol P-FET: D=input(west) S=load(east)
    U_EFUSE:     [60.0, 57.0, 0]     # TPS259573 WSON-8 (dense 0.5mm) -- escape corridor SOUTH
    D_REVCLAMP:  [40.0, 64.0, 0]     # SS34 reverse crowbar (K=5V_FUSED, downstream of F1)
    CE1:         [50.0, 66.0, 0]     # 220uF bulk (pad1=+)
    D_TVS:       [63.0, 68.0, 0]     # SMBJ5.0A on 5V_PROTECTED (K=pad1; S of eFuse escape)
    FB1:         [33.0, 70.0, 0]     # ferrite 3V3 -> 3V3_ANALOG (analog-corner boundary)

    # ============ DRIVE CHAIN: 595 -> 238/one-shot -> ULN (under coil gaps) ============
    # ULNs sit under COIL gaps (logic x-windows) with all pads y>=53.
    U_ULNA: [95.0, 59.0, 0]          # ULN2803 A -> reeds 1-8 coils (gaps g1-g4)
    U_ULNB: [184.0, 59.0, 0]         # ULN2803 B -> reeds 9-12 coils (gaps g5-g6; 186->184: H4 courtyard)
    U_DECU: [74.0, 66.0, 0]          # 238 -> SEL_U1..6 (ULN_A up-selects)
    # R_DECUPD PROMOTED from `near: U_DECU` to an explicit anchor (PLACEMENT D-BACK,
    # task#21, 2026-07-25, MEASURED). The near-rule put it at (79.20,67.90), hard
    # against U_DECU's EAST pad column — inside the SEL_U1..U6 output fan, where
    # SEL_U6 B.Cu crosses its GND pad (best on-pad via gap -0.014 = OVERLAP).
    # The adjacency was mis-derived: R_DECUPD pulls DOWN *DECU_G1_RAW*, whose
    # consumer is U_DECUEN.1 @(79.362,59.050) (the STOP-preemption AND gate), NOT a
    # U_DECU pin — the '238's own G1 sees the GATED net DECU_G1. A pull-down belongs
    # at the DRIVEN end so the input is held low when U_SR1 tri-states on a watchdog
    # trip (this resistor IS the ADR-0011 safety fix). rot180 faces the signal pad
    # east, toward that partner. MEASURED: span to U_DECUEN.1 8.88 -> 3.47mm; GND
    # pad2 -> (75.240,57.500) cu-cu +1.475 / h2h +2.818 (open plane-band copper).
    R_DECUPD: [75.75, 57.50, 180]    # pad1 DECU_G1_RAW@76.26 (E, ->U_DECUEN.1) ; pad2 GND@75.24,57.50
    U_DECD: [120.0, 66.0, 0]         # 238 -> SEL_D1/D2 (ULN_A) + SEL_D3/D4 (ULN_B)
    U_ONESHOT: [150.0, 62.0, 0]      # v1.2: CD74HC221 SOIC-16 (was 1G123 SSOP-8) -> PRESS_TIMED (ULN_B)
    U_SR1:  [95.0, 75.0, 0]          # 595 (feeds both decoders + one-shot + Pi serial)
    # U_SR2 DELETED in v1.2 (ADR-0011 §5: STOP_REQ moved to direct Pi GPIO). Its
    # old spot (128,75) hosts the new STOP-preemption gate cluster (seeds below).

    # ================= EXPANDER + WATCHDOG + Pi (CENTER-SOUTH) =================
    U_EXP:  [140.0, 82.0, 0]         # MCP23017 SSOP-28 (dense) -- escape corridor SOUTH; hub
    U_WD:   [152.0, 80.0, 0]         # TPS3823 watchdog (WD_PET from Pi, WD_OK to safety)
    # v1.2 P0 FIX (ADR-0011 §8, safety truth-table review 2026-07-25). ANCHORED,
    # not `near:` — this resistor is the de-energization path, so its plane-bond
    # access is a safety property and must not be re-derived by the legalizer each
    # build (the R_DECUPD lesson, 8667452). MEASURED free window: a 2.0x1.2mm box
    # scan over the courtyards of every part in x[148,166] y[76,90] returns
    # (155.1,81.0) as the nearest free centre to U_WD pad4 (WDI @153.14,80.95);
    # (155.6,80.95) keeps 0.55mm to U_WD's courtyard (right edge 154.09) and
    # 1.26mm to R_OE (left edge 157.82). pad1 (WD_PET) lands WEST at 155.09 —
    # 1.95mm from the WDI pad it holds low. pad2 (GND) at 156.11 sits over the
    # In1 GND plane (zone-collide MEASURED F.Cu/B.Cu/In1 all GND), so the
    # deterministic via-in-pad seed_stub in route.yaml reaches the plane.
    R_WDPETPD: [155.6, 80.95, 0]     # 100k WD_PET -> GND: WDI must not float
    J_PI:   [94.0, 95.0, 90]         # 2x20 Pi header (SIDECAR, body ALONG south edge x92..144)

    # ================= SAFETY AND-CHAIN + COIL GATE (EAST) =================
    # U_SCHM 58.0 -> 60.0 (PLACEMENT D-BACK, task#21, 2026-07-25, MEASURED).
    # At y58 the SOIC-14's NORTH pad row sat at y54.19 — INSIDE the coil-wave's
    # structural E-W distribution lane. That lane is not a routing accident: the
    # coil nets leave U_ULNA/U_ULNB (y59) and must run east-west hugging the north
    # edge of the plane band (y53.0) to reach the coil-gap mouths, so the band
    # y53.2..54.8 carries a 0.4mm-wide B.Cu ladder (MEASURED on the promoted chain:
    # COIL_D4_N y53.30, SEL_D3 y53.90, COIL_D3_N y54.80). Pin 14 (VCC, 3V3 = In2
    # plane) was sandwiched between SEL_D3 and COIL_D3_N with a 0.50mm free window
    # — 0.05mm SHORT of the 0.55mm a 0.25 via needs (2*0.125 barrel + 2*0.15 floor).
    # Result: no via site existed on ANY realization; pad_rescue instead built a
    # ~4mm B.Cu surface detour fragmented into 57 segments THROUGH the keypad
    # isolation-comb keepout = ALL 51 items_not_allowed DRC violations.
    # A through-via cannot dodge copper that crosses the whole pad, so this is a
    # placement defect, not a routing one (canon: "a routing failure is usually a
    # PLACEMENT problem"). +2.0y lifts pin14 to y56.19, clear of the coil lane, and
    # SHORTENS every safety-chain span (ESTOP_OK->U_AND1.6 15.34->14.25mm,
    # ESTOP_RAW->J_ESTOP 30.35->28.6mm, DOOR_OK->U_OSCLR 34.03->32.1mm). Courtyard
    # y[55.38,64.62]: 1.63mm clear of U_AND2/U_AND3 (y66.25), x unchanged (U_ULNB's
    # courtyard at x178.03 is the east wall, same 0.28mm gap as before).
    U_SCHM:     [174.0, 60.0, 0]     # HC14 (E-stop/Mode/Door clean)
    U_AND1:     [158.0, 68.0, 0]
    U_AND2:     [170.0, 68.0, 0]
    U_AND3:     [182.0, 68.0, 0]
    U_FAULTAND: [158.0, 74.0, 0]
    U_LATCHA:   [170.0, 74.0, 0]
    U_LATCHB:   [182.0, 74.0, 0]
    U_OENAND:   [160.0, 80.0, 0]
    Q_COILDRV:  [170.0, 80.0, 0]     # 2N7002 low-side coil-enable
    Q_COIL:     [182.0, 80.0, 0]     # AO3401A HS -> 5V_KEY_RELAY (gated coil rail)
    U_OPTO:     [185.0, 90.0, 0]     # LTV-817S -> J_ISOLOOP (isolated side EAST)
    # v1.2 K_STOP dedicated driver + flyback (ADR-0011 §4): ANCHORED (a floating
    # seed was legalizer-displaced into the comb keepout — measured hard fail;
    # first anchor attempt (166/162,60) was PINCHED: SMA bbox 7.1mm wide +
    # U_SCHM pads at x169.1 + C_SCHM float left no gate-pad approach — measured
    # 9x7mm-clear-window scan places them in the open x130-140/y56-60 band).
    # (spread 134/139 -> 132.5/140.0: at 5.0mm centers the SMA pad2-to-SOT23
    # pad gap measured 0.098mm < 0.12 clearance + courtyard overlap, DRC 3x)
    Q_STOPDRV:  [140.0, 58.5, 0]     # 2N7002 low-side driver
    D_KSTOP:    [132.5, 58.5, 0]     # SS34 flyback (K=5V_STOP, A=COIL_STOP_N)

    # ================= DISCRETE SAFETY INPUTS (EAST EDGE) =================
    # y >= 60: keeps every connector pad >=6mm below the EAST end pocket's
    # keypad copper (pocket pads end y46.37).
    # ===== v1.3 P0-A: THE EAST COLUMN, RE-STACKED FOR ONE ISOLATED BLOCK ======
    # J_ESTOPLOOP + J_CONTACTOR merged into the single 4-pole J_ISOLOOP (user
    # decision 2026-07-25; see the tsx comment on J_ISOLOOP and ADR-0013). Both
    # only ever carried isolated-domain nets, so one body with ONE 2.0mm moat and
    # ONE pour keepout replaces two adjacent bodies each needing their own.
    #
    # THE COLUMN IS AT CAPACITY AND THESE FOUR NUMBERS ARE SOLVED, NOT CHOSEN.
    # The packing is 1-D and every term is MEASURED off the built footprints, so
    # the order of the connectors cannot change the answer:
    #     H4 courtyard bottom                       54.547
    #   + J_MODE / J_ESTOP / J_DOOR courtyards    3 x 10.790
    #   - (J_DOOR courtyard bottom is 0.545 south of its GND shell tab)  -0.545
    #   + the ISO_CONTACTOR moat                     2.000
    #   + J_ISOLOOP pad column (2x5.25 pitch + pad)  12.700
    #   + copper-to-board-edge (board rule)          0.300
    #   ------------------------------------------------------
    #                                              101.372  vs the edge at 102.000
    # => 0.628mm of AGGREGATE slack to spend on FIVE margins at once. The v1.3
    # first attempt spent it before it was counted and landed J_ESTOPLOOP inside
    # J_DOOR; the predecessor solve reached 0.028mm and still measured 1.702mm on
    # the moat (P-COLLIDE + the ISO scan both caught it).
    #
    # WHERE THE 0.628 CAME FROM: the KF350-3.5-4P pad is 2.20mm, not the 2P's
    # 2.60 (annular ring 0.50mm vs a 0.15mm JLC floor — see the part.yaml). At
    # 2.60 the same solve gives ~0.05mm on all five margins simultaneously, which
    # is a number no one can defend; 2.20 is the only lever on this board that
    # costs nothing external. It also lifts pole-to-pole gap 0.90 -> 1.30mm.
    #
    # THE MOAT IS 2-D, NOT VERTICAL. J_DOOR's binding copper is its EAST shell
    # tab (pad MP, GND, x[197.0,199.7]) — not its signal pads, which sit at
    # x[194.3,196.0] and are 4.1mm clear. J_ISOLOOP is pulled 1.70mm west of the
    # SELV column so its pad column x[194.20,196.40] clears the tab in x by
    # 0.600mm and buys that back diagonally. West is bounded by J_RH_EXHAUST's
    # courtyard (right edge 191.395); x195.30 leaves 0.160mm there.
    # MEASURED margins at these anchors (regenerate and re-measure if any move):
    #   H4 courtyard -> J_MODE courtyard            0.058   (fixed; H4 is the wall)
    #   J_MODE -> J_ESTOP courtyard                 0.080
    #   J_ESTOP -> J_DOOR courtyard                 0.090
    #   J_DOOR -> J_ISOLOOP courtyard               0.510
    #   J_ISOLOOP -> J_RH_EXHAUST courtyard         0.160
    #   ISO->SELV copper (J_ISOLOOP.4 <-> J_DOOR.MP) 2.126  (+0.126 on the rule)
    #   J_ISOLOOP.1 copper -> south board edge      0.650   (+0.350 on the rule)
    #   J_ISOLOOP body south face                 102.000   (FLUSH, not proud —
    #     the enclosure wall is the board edge, so the block may not overhang)
    # v1.7 (ADR-0018): J_MODE is now a JST ZH 4-circuit S4B-ZR-SM4A-TF, NOT a
    # 5-circuit GH — a 1.5mm-pitch header a GH plug physically cannot enter, so
    # the one cross-plug that arms the coil rail is an interference rather than
    # a labelling rule. Courtyard 10.500 x 8.000 vs the GH's 10.700 x 6.400:
    # 0.200mm NARROWER in this saturated column and 1.600mm deeper westward.
    # Origin 197.00 -> 195.95 keeps the MOUTH at the board edge (fab body face
    # 199.95 against the x=200.0 edge; courtyard x[192.45, 200.45], the same
    # east limit the GH held at 200.245). MEASURED effect on the column, and it
    # IMPROVES: H4 -> J_MODE 0.058 -> 0.203, J_MODE -> J_ESTOP 0.090 -> 0.235.
    # Nothing else in the column moves and the 2.0mm ISO moat is untouched.
    # Westward the courtyard takes 1.305mm of a strip whose only occupant was
    # R_MODEPD (now anchored, below, with the three COIL_EN front-end parts).
    J_MODE:      [195.95, 60.00, 90]  # mouth EAST (by HC14/AND-chain)
    J_ESTOP:     [197.0, 70.88, 90]  # was 72.0; north 1.12 to open the moat
    J_DOOR:      [197.0, 81.76, 90]  # was 84.0; north 2.24 (the binding shift)
    J_ISOLOOP:   [195.3, 95.00, 90]  # KF350-3.5-4P, the ONE isolated block;
                                     # 1.70 west of the SELV column (2-D moat),
                                     # body y[88.00,102.00] flush to the south
                                     # edge, courtyard 0.755 clear of the east

    # ============ ANALOG SENSE SPINE (SW; ADC cluster = v1.0 +6y rigid) ============
    U_ADC:  [42.0, 76.0, 0]          # MCP3208 (SPI to Pi)
    U_TC:   [63.0, 77.0, 0]          # MAX31856 (SPI to Pi)
    # C_TCPA nudged OUT of U_TC's east SPI escape fan (task#21, 2026-07-25). The
    # `C_TC*` near-rule landed it at (68.5,77) INSIDE the dense SPI_MISO/MOSI/CS_N
    # B.Cu escape field, so its GND plane-bond via-in-pad site collided foreign
    # copper in EVERY realization (stitch seed_stub REFUSED). Pinned here in open
    # GND-plane space south of the fan (density-0 scan; TP_TCTH 2.6mm N is the
    # only neighbour). TC_POS (pad1@64.52) routes down from U_TC.4; GND pad2@65.48
    # gets a clear via site. Explicit anchor overrides the near-rule (pinned).
