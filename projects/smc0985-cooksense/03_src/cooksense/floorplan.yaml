    - {ref: D_REVCLAMP, pad: 1, net: 5V_FUSED}   # moved downstream of F1 (pin review Q2 fix, 2026-07-23)
    - {ref: CE1, pad: 1, net: 5V_PROTECTED}
    - {ref: U_LDO, pad: 3, net: 5V_PROTECTED}
    - {ref: U_LDO, pad: 2, net: 3V3}
    - {ref: U_LDO, pad: 4, net: 3V3}                # tab = VOUT
