    - {match: "TP_TCFAULT", region: analog}
    - {match: "TP_TCTH", region: analog}   # v1.2: threshold bring-up point (near U_COMP)
    - {match: "TP_*", region: piedge}
    # ---- NOT ASSEMBLED (canon A-POP; declared in 03_src/rules/assembly.yaml) --
    # These 13 refs have NO LCSC code — they are not in JLC's catalog — yet
    # cooksense v1.0 and v1.1 both SHIPPED them on the CPL, i.e. JLC was told to
    # machine-place 13 parts it cannot source, while the v1.1 MANIFEST declared
    # 12 of the 13 `not_assembled` (J_TC was declared nowhere at all). The two
    # artifacts contradicted each other and every gate was green.
    # `exclude_from_pos_files` is the SOURCE half of the fix: it takes them off
    # the CPL at export. assembly.yaml is the declaration half (reason +
    # DATED evidence + disposition), and the release MANIFEST's not_assembled:
    # line is GENERATED from that file. Placement is UNAFFECTED — all 13 are
    # anchors, and initial_pose() resolves anchors before patterns.
    # DO-NOT-SUBSTITUTE both classes: the reed contact rating IS the safety
    # argument (ADR-0006), and J_TC's Type-K alloy pins are the measurement.
    - {match: ["K_U1", "K_U2", "K_U3", "K_U4", "K_U5", "K_U6",
               "K_D1", "K_D2", "K_D3", "K_D4", "K_PRESS", "K_STOP", "J_TC"],
       attrs: [exclude_from_pos_files]}
