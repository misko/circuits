# cooksense floorplan — input for skills/kicad-pcb/scripts/generate_board_generic.py
#
# v1.1 SHRINK (D7, 2026-07-23): 252x92 -> 188x92mm. The v1.0 single-row rot90
# relay row (contacts N / coils S) was pitch-bound at 20mm: the DIP05-1A72-12L
# long axis (body 19.3mm / courtyard 19.90mm) lay ALONG the row, leaving 0.10mm
# courtyard gap — ZERO pitch shrink existed in that orientation (measured,
# BRIEF D7). USER DECISION: rot0 vertical-relay redesign. Relays stand with the
# long axis N-S (6.5mm body / 9.93mm bbox across the row), pitch 15.24mm — the
# EXACT orientation+pitch the part.yaml "super-column pitch" coupling figure was
# vetted in; relays additionally alternate rot180/rot0 in PAIRS (anti-parallel
# adjacent coils = the datasheet's own alternate-orientation mitigation).
#
# THE ISOLATION COMB (replaces the v1.0 straight barrier). At rot0/rot180 each
# relay's coil column and contact column are E-W separated (7.62mm c-c, 6.12mm
# pad-edge — the SAME creepage floor v1.0 measured). Pairing (r1 rot180 contact
# W | r2 rot0 contact E) makes:
#   - COIL GAPS (6, within pairs, x-window 9.24mm): both flanking columns are
#     coil (logic). 5V_KEY_RELAY + COIL_*_N route here, from the south band up
#     to the pads (y30.38/45.62) — logic never crosses a pocket.
#   - KEYPAD POCKETS (7 = 5 inter-pair + west end + east end): both flanking
#     columns are contact (isolated keypad). KP_*/SEL-bus drops run N-S in the
#     6.12mm clear channel between contact pads, joining the NORTH keypad band
#     (copper <= y23.2). J_KEY_MATRIX lives in the WEST end pocket.
#   - Creepage held by construction: keypad band y<=23.2 vs coil-gap pads
#     y>=29.63 (6.28mm); pocket pads y<=46.37 vs logic/planes y>=53 (6.63mm);
#     pocket drops vs coil pads 7.62mm horizontal; intra-relay columns 6.12mm.
#     Milled 0.6mm slots reinforce each coil-gap mouth (y26.0-26.6) and each
#     pocket mouth (y49.3-49.9), per the v1.0 slot pattern.
#   - DRC-enforced comb (deny tracks/vias/pours): 12 intra-relay column rects +
#     6 coil-gap north strips + 7 pocket south strips — a track that collapses
#     the comb FAILS kicad DRC ("items not allowed"), like v1.0's iso_barrier.
# Geometry: 12 relays, centers x=26.00..193.64 (pitch 15.24, span 167.64), row
# center y=38 (bbox y28.0..48.0). Board 188x92 (x 12..200, y 10..102). The
# south logic band (y53..102) absorbs the v1.0 south-band clusters: power block
# translated rigidly +12y (eFuse stubs/keepouts follow in route.yaml), ADC
# cluster rigidly +6y (GND-via reservations follow), U_EXP to (140,82) (3V3
# stub follows). Schematic/netlist UNCHANGED from v1.0 — placement/outline only.

project:
  name: cooksense
  netlist: 06_build/netlists/cooksense.net
  output: 04_kicad/cooksense.kicad_pcb
  parts_dir: 02_parts
  root: ../..
  fp_lib_table: 04_kicad/fp-lib-table

board:
  outline: {x0: 12.0, y0: 10.0, x1: 200.0, y1: 102.0}   # 188 x 92 mm, 4-layer SIDECAR
  edge_width: 0.1
  layers: 4
  mounting_holes:
    footprint: MountingHole:MountingHole_2.7mm_M2.5_ISO14580
    at: [[24.0, 14.0], [194.0, 14.0], [17.0, 90.0], [193.0, 52.0]]
  # ISOLATION milled slots (0.6mm), v1.1 comb pattern:
  #   - 6 coil-gap NORTH slots (y26.0-26.6): lengthen the keypad-band ->
  #     coil-gap-logic surface path across each gap mouth.
  #   - 6 pocket SOUTH slots (y49.3-49.9): lengthen the pocket-keypad ->
  #     south-logic-band surface path across each pocket mouth (east end
  #     pocket skipped: <3mm to the board edge, web too fragile; its single
  #     RSTOP_MID drop is covered by the 6.63mm construction gap).
  cutouts:
    - {rect: [29.40, 26.0, 37.84, 26.6]}    # coil gap r1r2
    - {rect: [59.88, 26.0, 68.32, 26.6]}    # coil gap r3r4
    - {rect: [90.36, 26.0, 98.80, 26.6]}    # coil gap r5r6
    - {rect: [120.84, 26.0, 129.28, 26.6]}  # coil gap r7r8
    - {rect: [151.32, 26.0, 159.76, 26.6]}  # coil gap r9r10
    - {rect: [181.80, 26.0, 190.24, 26.6]}  # coil gap r11r12
    - {rect: [13.00, 49.3, 22.60, 49.9]}    # west end pocket
    - {rect: [44.64, 49.3, 53.08, 49.9]}    # pocket r2r3
    - {rect: [75.12, 49.3, 83.56, 49.9]}    # pocket r4r5
    - {rect: [105.60, 49.3, 114.04, 49.9]}  # pocket r6r7
    - {rect: [136.08, 49.3, 144.52, 49.9]}  # pocket r8r9
    - {rect: [166.56, 49.3, 175.00, 49.9]}  # pocket r10r11

libraries: [/usr/share/kicad/footprints, 03_src/lib]

placement:
  anchors:
    # ================= KEYPAD DOMAIN (NORTH BAND + POCKETS) =================
    # J_KEY_MATRIX = WEST end pocket (mouth WEST, ribbon to Board C).
    J_KEY_MATRIX: [16.0, 20.0, 270]
    # 12 reeds, single row, VERTICAL (long axis N-S), pitch 15.24mm, row y=38.
    # rot180 = contact column WEST / coil EAST; rot0 = coil WEST / contact EAST.
    # Pairs (r1,r2)(r3,r4)... put coil columns FACING within the pair (logic
    # gap) and contact columns facing the pockets between pairs + board ends.
    # ULN_A drives reeds 1-8 (U1-6,D1,D2); ULN_B drives reeds 9-12.
    K_U1:    [26.00, 38.0, 180]
    K_U2:    [41.24, 38.0, 0]
    K_U3:    [56.48, 38.0, 180]
    K_U4:    [71.72, 38.0, 0]
    K_U5:    [86.96, 38.0, 180]
    K_U6:    [102.20, 38.0, 0]
    K_D1:    [117.44, 38.0, 180]
    K_D2:    [132.68, 38.0, 0]
    K_D3:    [147.92, 38.0, 180]
    K_D4:    [163.16, 38.0, 0]
    K_PRESS: [178.40, 38.0, 180]
    K_STOP:  [193.64, 38.0, 0]
    # keypad solder-selects (isolated domain, north band near their reeds)
    R_KEY:   [170.0, 16.0, 0]        # RKEY_MID @ K_PRESS (pocket r10r11 -> band)
    R_STOP:  [190.0, 16.0, 0]        # RSTOP_MID @ K_STOP (east end pocket -> band)

    # ============ POWER + PROTECTION (SW, series-current order; v1.0 +12y) ============
    J_PWR:       [22.0, 60.0, 0]     # Micro-Fit vertical (mates top); W edge
    U_LDO:       [22.0, 70.0, 0]     # AMS1117-3.3 4-pad (S of J_PWR)
    D_ESD_IN:    [33.0, 55.0, 0]     # N strip, E of J_PWR body
    F1:          [40.0, 58.0, 0]     # polyfuse 1812
    Q_REV:       [49.0, 58.0, 180]   # revpol P-FET: D=input(west) S=load(east)
    U_EFUSE:     [60.0, 57.0, 0]     # TPS259573 WSON-8 (dense 0.5mm) -- escape corridor SOUTH
    D_REVCLAMP:  [40.0, 64.0, 0]     # SS34 reverse crowbar (K=5V_FUSED, downstream of F1)
    CE1:         [50.0, 66.0, 0]     # 220uF bulk (pad1=+)
    D_TVS:       [63.0, 68.0, 0]     # SMBJ5.0A on 5V_PROTECTED (K=pad1; S of eFuse escape)
    FB1:         [33.0, 70.0, 0]     # ferrite 3V3 -> 3V3_ANALOG (analog-corner boundary)

    # ============ DRIVE CHAIN: 595 -> 238/one-shot -> ULN (under coil gaps) ============
    # ULNs sit under COIL gaps (logic x-windows) with all pads y>=53.
    U_ULNA: [95.0, 59.0, 0]          # ULN2803 A -> reeds 1-8 coils (gaps g1-g4)
    U_ULNB: [186.0, 59.0, 0]         # ULN2803 B -> reeds 9-12 coils (gaps g5-g6)
    U_DECU: [74.0, 66.0, 0]          # 238 -> SEL_U1..6 (ULN_A up-selects)
    U_DECD: [120.0, 66.0, 0]         # 238 -> SEL_D1/D2 (ULN_A) + SEL_D3/D4 (ULN_B)
    U_ONESHOT: [150.0, 62.0, 0]      # 1G123 press one-shot -> PRESS_TIMED (ULN_B)
    U_SR1:  [95.0, 75.0, 0]          # 595 (feeds both decoders + one-shot + Pi serial)
    U_SR2:  [128.0, 75.0, 0]         # 595 (cascade; STOP_REQ -> ULN_B)

    # ================= EXPANDER + WATCHDOG + Pi (CENTER-SOUTH) =================
    U_EXP:  [140.0, 82.0, 0]         # MCP23017 SSOP-28 (dense) -- escape corridor SOUTH; hub
    U_WD:   [152.0, 80.0, 0]         # TPS3823 watchdog (WD_PET from Pi, WD_OK to safety)
    J_PI:   [94.0, 95.0, 90]         # 2x20 Pi header (SIDECAR, body ALONG south edge x92..144)

    # ================= SAFETY AND-CHAIN + COIL GATE (EAST) =================
    U_SCHM:     [174.0, 58.0, 0]     # HC14 (E-stop/Mode/Door clean)
    U_AND1:     [158.0, 68.0, 0]
    U_AND2:     [170.0, 68.0, 0]
    U_AND3:     [182.0, 68.0, 0]
    U_FAULTAND: [158.0, 74.0, 0]
    U_LATCHA:   [170.0, 74.0, 0]
    U_LATCHB:   [182.0, 74.0, 0]
    U_OENAND:   [160.0, 80.0, 0]
    Q_COILDRV:  [170.0, 80.0, 0]     # 2N7002 low-side coil-enable
    Q_COIL:     [182.0, 80.0, 0]     # AO3401A HS -> 5V_KEY_RELAY (gated coil rail)
    U_OPTO:     [185.0, 90.0, 0]     # LTV-817S -> J_CONTACTOR

    # ================= DISCRETE SAFETY INPUTS (EAST EDGE) =================
    # y >= 60: keeps every connector pad >=6mm below the EAST end pocket's
    # keypad copper (pocket pads end y46.37).
    J_MODE:      [197.0, 60.0, 90]   # mouth EAST (by HC14/AND-chain)
    J_ESTOP:     [197.0, 72.0, 90]
    J_DOOR:      [197.0, 84.0, 90]
    J_CONTACTOR: [197.0, 94.0, 90]   # KF350 terminal block

    # ============ ANALOG SENSE SPINE (SW; ADC cluster = v1.0 +6y rigid) ============
    U_ADC:  [42.0, 76.0, 0]          # MCP3208 (SPI to Pi)
    U_TC:   [63.0, 77.0, 0]          # MAX31856 (SPI to Pi)
    # ADC-front-end GND-via RESERVATION anchors (D-ADJ, v1.0 routing D-BACK).
    # Cluster translated RIGIDLY +6y from v1.0 so the route.yaml User.2
    # reservations + stitch GND via-in-pads stay on-pad (all +6y in lockstep).
    # GND is pad 2, EAST (+0.48mm small caps / +0.77mm C_ADCV).
    C_ADCV:  [48.0, 76.0, 0]         # GND@48.77,76.00 ; sig 3V3_ANALOG@47.23
    C_ADCV2: [37.0, 76.0, 0]         # GND@37.48,76.00 ; sig 3V3_ANALOG@36.52
    C_FLT0:  [56.2, 89.2, 0]         # GND@56.68,89.20 ; sig ADC_CH0@55.72
    C_FLT1:  [53.8, 89.2, 0]         # GND@54.28,89.20 ; sig ADC_CH1@53.32
    C_FLT2:  [53.8, 84.8, 0]         # GND@54.28,84.80 ; sig ADC_CH2@53.32
    C_FLT3:  [56.2, 84.8, 0]         # GND@56.68,84.80 ; sig ADC_CH3@55.72
    C_FLT4:  [58.0, 87.0, 0]         # GND@58.48,87.00 ; sig ADC_CH4@57.52
    C_FLT5:  [52.0, 87.0, 0]         # GND@52.48,87.00 ; sig ADC_CH5@51.52
    C_FLT6:  [58.8, 88.4, 0]         # GND@59.28,88.40 ; sig ADC_CH6@58.32
    C_FLT7:  [57.0, 90.5, 0]         # GND@57.48,90.50 ; sig ADC_CH7@56.52
    U_COMP: [24.0, 80.0, 0]          # LM393 (TH_CAM_A/B -> TEMP_OK)
    Q_SWA:  [30.0, 88.0, 0]          # switched 3V3_SW_A -> J_THERM_A
    Q_SWB:  [46.0, 90.0, 0]          # switched 3V3_SW_B -> J_THERM_B
    J_THERM_A: [32.0, 97.0, 0]       # SM08B thermal head A (mouth SOUTH)
    J_THERM_B: [54.0, 97.0, 0]       # SM08B thermal head B (mouth SOUTH)
    J_TC:      [74.0, 96.0, 0]       # PCC-SMP-K thermocouple jack (mouth SOUTH)

    # ================= LOADCELL + RH SWITCHED RAILS (S / SE) =================
    J_LOADCELL:   [148.0, 97.0, 0]   # B5B-XH (mouth SOUTH)
    Q_SWRHA:      [164.0, 90.0, 0]   # switched 3V3_SW_RHA -> J_RH_AMBIENT
    Q_SWRHE:      [176.0, 90.0, 0]   # switched 3V3_SW_RHE -> J_RH_EXHAUST
    J_RH_AMBIENT: [168.0, 97.0, 0]   # mouth SOUTH
    J_RH_EXHAUST: [186.0, 97.0, 0]   # mouth SOUTH

  seeds:
    # eFuse fine-pin locals (outward-only-local, around U_EFUSE @60,57; v1.0 +12y)
    C_DVDT: [57.0, 60.0]
    R_OVT:  [66.0, 58.0]
    R_OVB:  [68.0, 56.0]
    R_ILM:  [67.0, 61.0]
    R_PG:   [64.0, 60.0]
    C_IN1:  [56.0, 55.0]
    C_IN2:  [53.0, 55.0]
    # loadcell locals (clear seeds N of J_LOADCELL @148,97; body top y94)
    R_LCCLK: [143.0, 91.0]
    R_LCDAT: [147.0, 91.0]
    D_LCCLK: [153.0, 91.0]
    D_LCDAT: [157.0, 91.0]
    # analog 3V3 decouplers (post-ferrite)
    C_3V3A1:  [40.0, 68.0]
    C_3V3A2:  [44.0, 68.0]
    # expander reset R, WEST of U_EXP (keep clear of its SOUTH escape corridor)
    R_EXPRST: [130.0, 84.0]

  patterns:
    # ---- decoupling: each cap hard against its IC ----
    - {match: "C_SR1", near: U_SR1}
    - {match: "C_SR2", near: U_SR2}
    - {match: "C_DECU", near: U_DECU}
    - {match: "C_DECD", near: U_DECD}
    - {match: "C_ULNA", near: U_ULNA}
    - {match: "C_ULNB", near: U_ULNB}
    - {match: "C_AND1", near: U_AND1}
    - {match: "C_AND2", near: U_AND2}
    - {match: "C_AND3", near: U_AND3}
    - {match: "C_FAULTAND", near: U_FAULTAND}
    - {match: "C_LATCHA", near: U_LATCHA}
    - {match: "C_LATCHB", near: U_LATCHB}
    - {match: "C_OENAND", near: U_OENAND}
    - {match: "C_SCHM", near: U_SCHM}
    - {match: "C_WD", near: U_WD}
    - {match: "R_MR", near: U_WD}
    - {match: "C_MR", near: U_WD}
    - {match: "R_OE", near: U_OENAND}
    - {match: "C_EXP", near: U_EXP}
    - {match: "R_BID*", near: U_EXP}
    - {match: "R_OS", near: U_ONESHOT}
    - {match: "C_OS", near: U_ONESHOT}
    - {match: "C_OSV", near: U_ONESHOT}
    - {match: "R_HSG", near: Q_COIL}
    - {match: "C_KR", near: Q_COIL}
    - {match: "R_COILENPD", near: Q_COILDRV}
    - {match: "R_DECUPD", near: U_DECU}       # '238 E3 pull-down (pin review Q4)
    - {match: "R_DECDPD", near: U_DECD}       # '238 E3 pull-down (pin review Q4)
    - {match: "R_OPTOLED", near: U_OPTO}
    # ---- power locals ----
    - {match: "C_IN*", region: pwr}
    - {match: "C_LDOIN", near: U_LDO}
    - {match: "C_LDOOUT", near: U_LDO}
    - {match: "C_3V3", near: U_LDO}
    # ---- analog front-end (ch0 TH_CAM_A / ch3 TH_CAM_B -> LM393; rest -> heads) ----
    - {match: "C_ADCV*", near: U_ADC}
    - {match: "R_REF*", region: analog}
    - {match: "R_SER*", region: analog}
    - {match: "R_TH*", near: U_COMP}
    - {match: "R_HYS*", near: U_COMP}
    - {match: "R_TEMPOK", near: U_COMP}
    - {match: "C_COMP", near: U_COMP}
    - {match: "C_FLT*", region: analog}
    - {match: "R_TCP", near: U_TC}
    - {match: "R_TCN", near: U_TC}
    - {match: "C_TC*", near: U_TC}
    # ---- switched sensor rails: A/B thermal (SW), RHA/RHE (SE) ----
    - {match: "Q_SWDRVA", near: Q_SWA}
    - {match: "R_SWPUA", near: Q_SWA}
    - {match: "C_SWA", near: Q_SWA}
    - {match: "R_SDAA", near: J_THERM_A}
    - {match: "R_SCLA", near: J_THERM_A}
    - {match: "Q_SWDRVB", near: Q_SWB}
    - {match: "R_SWPUB", near: Q_SWB}
    - {match: "C_SWB", near: Q_SWB}
    - {match: "R_SDAB", near: J_THERM_B}
    - {match: "R_SCLB", near: J_THERM_B}
    - {match: "R_SHIELD", near: J_THERM_B}
    - {match: "Q_SWDRVRHA", near: Q_SWRHA}
    - {match: "R_SWPURHA", near: Q_SWRHA}
    - {match: "C_SWRHA", near: Q_SWRHA}
    - {match: "R_SDARHA", near: J_RH_AMBIENT}
    - {match: "R_SCLRHA", near: J_RH_AMBIENT}
    - {match: "Q_SWDRVRHE", near: Q_SWRHE}
    - {match: "R_SWPURHE", near: Q_SWRHE}
    - {match: "C_SWRHE", near: Q_SWRHE}
    - {match: "R_SDARHE", near: J_RH_EXHAUST}
    - {match: "R_SCLRHE", near: J_RH_EXHAUST}
    # ---- discrete input locals ----
    - {match: "R_DOORPU", near: J_DOOR}
    - {match: "D_DOOR", near: J_DOOR}
    - {match: "R_ESTOPPD", near: J_ESTOP}
    - {match: "D_ESTOP", near: J_ESTOP}
    - {match: "R_MODEPD", near: J_MODE}
    # ---- test points ----
    - {match: "TP_USEL", region: keypad}
    - {match: "TP_DSEL", region: keypad}
    - {match: "TP_RKEY", region: keypad}
    - {match: "TP_5VKR", region: drive}
    - {match: "TP_ALLOW", region: safety}
    - {match: "TP_FAULT", region: safety}
    - {match: "TP_PGOOD", region: pwr}
    - {match: "TP_WDOK", region: safety}
    - {match: "TP_ESTOP", region: safety}
    - {match: "TP_3V3", region: drive}
    - {match: "TP_5VP", region: pwr}
    - {match: "TP_TEMPOK", region: analog}
    - {match: "TP_ENCL", region: analog}
    - {match: "TP_SPARE", region: analog}
    - {match: "TP_TCDRDY", region: analog}
    - {match: "TP_TCFAULT", region: analog}
    - {match: "TP_*", region: piedge}
    # ---- catch-all ----
    - {match: "*", region: drive}

  regions:
    keypad:  [40.0, 12.0, 160.0, 21.0]
    pwr:     [16.0, 54.0, 72.0, 74.0]
    drive:   [64.0, 54.0, 160.0, 80.0]
    piedge:  [92.0, 84.0, 146.0, 100.0]
    safety:  [150.0, 54.0, 200.0, 92.0]
    analog:  [14.0, 64.0, 96.0, 100.0]
    swrails: [142.0, 84.0, 200.0, 100.0]

  legalize: {enable: true, clearance: 0.3, edge_margin: 1.2, hole_keepout: 3.2, ring_max: 120}

design_rules:
  track_min_width: 0.127
  min_clearance: 0.09          # jlc_4layer_advanced (MCP23017 0.65mm + TPS259573 0.5mm)
  via_min_size: 0.25
  min_through_drill: 0.15
  via_min_annulus: 0.05
  hole_clearance: 0.2
  hole_to_hole: 0.25
  copper_edge_clearance: 0.3
  solder_mask_min_width: 0.0
  solder_mask_expansion: 0.0

zones:
  # ALL planes confined to the SOUTH logic band (y >= 53): 6.63mm below the
  # deepest keypad pocket copper (pocket pads end y46.37). The keypad band,
  # relay row, pockets and coil gaps carry NO plane.
  - {net: GND, layers: [In1.Cu], priority: 0, min_thickness: 0.3, clearance: 0.3, connect: thermal, rect: [12.0, 53.0, 200.0, 102.0]}
  - {net: GND, layers: [F.Cu, B.Cu], priority: 0, min_thickness: 0.3, clearance: 0.3, connect: thermal, rect: [12.0, 53.0, 200.0, 102.0]}
  # 3V3 logic-supply plane on In2 over the logic band (routing agent rec).
  - {net: 3V3, layers: [In2.Cu], priority: 0, min_thickness: 0.3, clearance: 0.3, connect: full, rect: [12.0, 53.0, 200.0, 102.0]}

keepouts:
  # NO POURS north of the logic band: keypad band + relay row + pockets + coil
  # gaps all plane-free (isolation held; coil nets are tracks only, as v1.0).
  - {name: keypad_iso, deny: [pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [12.0, 10.0, 200.0, 53.0]}
  # ===== THE ISOLATION COMB (DRC-ENFORCED, v1.1 successor of iso_barrier) =====
  # Deny tracks/vias/pours in every no-man's zone of the comb; a track that
  # collapses the >=6mm keypad creepage FAILS kicad DRC ("items not allowed").
  # (a) 12 intra-relay column barriers: between each relay's coil column and
  #     contact column (pads at xc+-3.81 stay reachable OUTSIDE the rect).
  - {name: iso_col_r1,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [23.00, 23.2, 29.00, 52.9]}
  - {name: iso_col_r2,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [38.24, 23.2, 44.24, 52.9]}
  - {name: iso_col_r3,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [53.48, 23.2, 59.48, 52.9]}
  - {name: iso_col_r4,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [68.72, 23.2, 74.72, 52.9]}
