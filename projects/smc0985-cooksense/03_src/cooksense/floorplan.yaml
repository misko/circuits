  - {name: iso_col_r4,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [68.72, 23.2, 74.72, 52.9]}
  - {name: iso_col_r5,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [83.96, 23.2, 89.96, 52.9]}
  - {name: iso_col_r6,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [99.20, 23.2, 105.20, 52.9]}
  - {name: iso_col_r7,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [114.44, 23.2, 120.44, 52.9]}
  - {name: iso_col_r8,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [129.68, 23.2, 135.68, 52.9]}
  - {name: iso_col_r9,  deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [144.92, 23.2, 150.92, 52.9]}
  - {name: iso_col_r10, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [160.16, 23.2, 166.16, 52.9]}
  - {name: iso_col_r11, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [175.40, 23.2, 181.40, 52.9]}
  - {name: iso_col_r12, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [190.64, 23.2, 196.64, 52.9]}
  # (b) 6 coil-gap NORTH strips: no-man's zone between the keypad band
  #     (copper <=23.2) and the coil-gap logic (pads reach y29.63).
  - {name: iso_gapN_g1, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [29.00, 23.2, 38.24, 29.4]}
  - {name: iso_gapN_g2, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [59.48, 23.2, 68.72, 29.4]}
  - {name: iso_gapN_g3, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [89.96, 23.2, 99.20, 29.4]}
  - {name: iso_gapN_g4, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [120.44, 23.2, 129.68, 29.4]}
  - {name: iso_gapN_g5, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [150.92, 23.2, 160.16, 29.4]}
  - {name: iso_gapN_g6, deny: [tracks, vias, pours], layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], rect: [181.40, 23.2, 190.64, 29.4]}
  # (c) 7 pocket SOUTH strips: no-man's zone between pocket keypad copper
