# policy_audit waivers — interposer (Board C). Schema: TOP-LEVEL list of
# {id, why}; each why REQUIRES measured evidence (>=40 chars; canon M4).

- id: S-VER
  why: >
    The 8 parts flagged for weak figure citations (2N7002, AO3401A,
    GZ2012D601TF, LTV-817S-TA1, SN74HC14DR, SN74HC595DR, ULN2803ADWR,
    X9555WV-2x16-6TV01) are the SHARED 02_parts library's cooksense-board
    parts — NONE is on the interposer BOM (bom_jlc.csv = 10FDZ-BT + C2683602
    only; both interposer parts carry full page/figure citations: eFDZ p.2/p.3
    2026-07-24, eGH p.1/p.3 2026-07-22). Same disposition as the sealed
    cooksense v1.1 S-VER waiver (03_src/cooksense/rules/policy_waivers.yaml).

- id: E-ADR
  why: >
    E-ADR scans the SHARED 01_docs/decisions/ and flags the OTHER board's
    protection ADRs (0001/0002/0006) against this board's invariants file —
    an ADR-0007 multi-board scoping artifact. Measured project-wide proof
    2026-07-24: electrical_invariants.py --adr-coverage on the MERGED
    cooksense+interposer invariants = "E-ADR OK: every protection/topology
    ADR is cited" (journal 03_schematic_interposer.md). ADR-0009 (this
    board's) emits 50 invariants, all holding against interposer.net.

- id: E-TOPO
  why: >
    ADR-0007 multi-board scoping artifact, in a gate whose independence check
    is otherwise exactly right. E-TOPO deliberately refuses power_tree.yaml's
    own say-so about there being nothing to grade (canon M1) and instead reads
    02_parts for converter dossiers — but 02_parts is PROJECT-scoped in this
    repo, not board-scoped, so on Board C it reads the MAIN board's catalogue.
    The one part it names, AMS1117-3.3 (type: ldo_3v3_1a), is on the SEALED
    cooksense board and is graded there; it is on NO artifact of this board.
    MEASURED on the SHIPPED v1.1 board (07_releases/interposer-v1.1-2026-07-27/
    source/interposer.kicad_pcb, enumerated 2026-07-27): 27 footprints total =
    4x MountingHole_2.7mm_M2.5 (no pads, no part) + 20x TestPoint_Pad_D1.5mm
    (bare probe pads, no part) + EXACTLY THREE real parts — J_MEMBRANE and
    J_CN1_JUMPER (JST 10FDZ-BT, type: connector_zif_membrane_1x10) and
    J_KEY_MATRIX (JST SM10B-GHS-TB, type: connector_wire_to_board_1x10).
    NONE classifies as buck / boost / buck_boost / linear. Corroborated from
    two more artifacts that share no method with the board file: fab/bom.csv
    has 2 rows (10FDZ-BT, SM10B-GHS-TB) and fab/cpl.csv has 1. There is no
    rail, no regulator, no protection element and no stored energy anywhere on
    this board — BRIEF sections 4/5, ADR-0009, and the interposer fact-lock:
    any component on a matrix line would alter the scan the OEM controller
    sees. The board is energized only by the OEM controller's own scan pulses.
    Waiving E-TOPO here does NOT waive it for the project: the cooksense board
    is graded against the same gate with its own power_tree.yaml.

- id: M-REPRO
  why: >
    Shadow-view scoping artifact: the audit runs against the single-board
    shadow root (06_build/interposer/shadow_root — gitignored build cache),
    where every 03_src path resolves through symlinks git does not track.
    The REAL promoted chain IS tracked: `git ls-files
    projects/smc0985-cooksense/03_src/interposer/route/` lists
    final_chain.kicad_pcb (verified 2026-07-24), and the reproducibility
    itself is measured: rebuild_all.sh from the tracked tree reproduces DRC
    0/0/0 (06_build/interposer/drc_repro.json).
