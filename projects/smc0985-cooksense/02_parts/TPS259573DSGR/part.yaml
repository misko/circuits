mpn: TPS259573DSGR
manufacturer: Texas Instruments
type: efuse_ovlo                     # eFuse (integrated hot-swap FET) with PROGRAMMABLE OVERVOLTAGE LOCKOUT + current limit
                                     # + inrush control. Implements the brief 3.5 "OV cutoff/eFuse" on the 5V SELV input
                                     # (-> 5V_PROTECTED rail); complements the polyfuse (MF-MSMF200L-2) + TVS (SMBJ5.0A).
datasheet:
  doc_id: SLVSE57
  revision: SLVSE57C                 # June 2017 - Revised April 2018
  url: https://www.ti.com/lit/ds/symlink/tps2595.pdf
  sha256: c640231b3bf5a5d9ff577c068b57360e6df4eed0186664ab5a0aeeb6f66bb2c1
  fetched: 2026-07-22
  local: SLVSE57C.pdf
package: WSON-8 (DSG) 2.0x2.0mm, exposed pad
footprint: Package_SON:Texas_DSG0008A_WSON-8-1EP_2x2mm_P0.5mm_EP0.9x1.6mm
escape: {style: dfn, pitch: 0.5, escapes_worst_side: 4, tier_required: jlc_2layer_default, conditions: [outward-only-local], checked: escape_check 2026-07-22}
pins:                                # DS Sec.6 Pin Configuration, "TPS2595x3 DSG Package 8-Pin WSON Top View" + Pin Functions table, p.4
  1: {name: dVdt, note: "cap to GND sets output turn-on slew (inrush limit); float = fastest. Size Cdvdt for the 5V_PROTECTED bulk"}
  2: {name: EN_OVLO_N, note: "'x3' variant: ACTIVE-LOW enable WITH adjustable OVERVOLTAGE LOCKOUT. Resistor divider IN->pin2->GND sets the OV cutoff. Do NOT leave floating"}
  3: {name: IN, note: "power input (5V SELV, downstream of polyfuse + reverse-protect FET)"}
  4: {name: IN, note: "power input - same net as pin 3"}
  5: {name: OUT, note: "protected power output -> 5V_PROTECTED rail"}
  6: {name: FLT_N, note: "OPEN-DRAIN fault flag, pulled low on fault; needs external pullup (power-good/fault indication per brief 3.5)"}
  7: {name: ILM, note: "resistor to GND sets the current limit (Rilm 487ohm=4.42A .. 5000ohm); also a load-current monitor. Do NOT leave floating"}
  8: GND
  9: {name: EP, tie: GND, note: "exposed thermal pad = GND; the ONLY heat path - MUST be soldered to the GND plane with thermal vias"}
limits:
  vin: "2.7-18V operating (x3); abs max 20V"
  imax: "4A (Tj<=125C) / 5A (Tj<=105C) continuous IN->OUT"
  ron: "34mohm typ"
  ov_response: "5us typ (fast overvoltage)"
  rilm: "487ohm (4.42A max) .. 5000ohm"
  cdvdt: "<=3300pF"
  ven_abs_max: "7V (EN/OVLO pin)"
  tsd: "auto-retry on thermal shutdown (x3)"
  tj: "-40 to 125C"
gotchas:
  - "'-73' is the PROGRAMMABLE-OVLO die (Device Comparison Table p.3): EN/OVLO (pin 2) is ACTIVE-LOW and the external divider sets a true OV CUTOFF - the FET turns OFF above threshold, it does NOT merely clamp. That is exactly the brief 3.5 'OV cutoff'. Do NOT substitute a 'x1' part (e.g. TPS259571 / C471038) - the x1 has NO OV clamp at all."
  - "For a 5V nominal rail, set the OVLO divider for ~5.5-6V cutoff. Nominal VIN should be limited to the selected option per the EC table; verify divider math + inrush (Cdvdt) in power review."
  - "*** THE SETPOINT ON THIS BOARD, AND THE ONE THAT WAS WRONG FOR FIVE RELEASES (ADR-0021). *** LANDED: R_OVT 100k / R_OVB 26.1k, both +-0.5% and both LCSC-code-pinned, giving V_trip = V_OVLO(R) x 126.1/26.1 = 5.798 V NOMINAL. Worst case over -20..+70 C with +-100 ppm/C TCR and I_EN +-0.1 uA across the 20.698k source: cannot trip below 5.3682 V (ADR-0021's supply ceiling is 5.250 V, +118 mV) and HAS tripped by 6.2394 V (D_TVS SMBJ5.0A V_BR min 6.40 V at 25 C / 6.2819 V at -20 C; DIP05 coil max 7.5 V). WHAT WAS THERE BEFORE: 100k/15k = ratio 0.130435 = 9.200 V nominal, 8.492-9.933 V worst case - ABOVE both the TVS and the coils, so a sustained over-voltage made a 600 W transient part the DC regulator (~6.6 A / 66 W at the top corner). Every TOPOLOGY assert on the divider was green throughout: the value is the fix, which is why E-INV now carries part_value asserts on BOTH legs. THE OVLO IS HYSTERETIC, NOT LATCHING: V_OVLO(F) 1.03/1.10/1.17 V is ~92% of the rising threshold, so a part that trips at 5.80 V re-enables near 5.32 V; after a genuine over-voltage that settles just under the trip point, removing input power is what clears it."
  - "RON MAX IS AN E-TOPO TERM: the EC table's ON-RESISTANCE (IN-OUT) block gives 37 mOhm at TJ 25 C, 47 mOhm over -40..85 C and 53 mOhm over -40..125 C for VIN 4-18 V. The 34 mOhm on the front page is TYPICAL. This part is one of three series elements between J_PWR and the AMS1117 input (F1 70.0 + Q_REV 73.5 + this 47.0 = 190.5 mOhm), and their 95.2 mV at 0.50 A is what the LDO's 55 mV of dropout margin is measured after."
  - "I_EN (EN/OVLO pin leakage) is +-0.1 uA max. On a 100k/26.1k divider (20.698k source) that is +-2.07 mV of threshold error - 0.17% of a 1.20 V threshold, small but INCLUDED in the ADR-0021 worst case, because the admissible window is only ~8% wide."
  - "Exposed pad = GND and is the ONLY thermal path. A generator that omits pad 9 floats the EP and the eFuse overheats at 2-3A load. EP MUST tie the GND plane with thermal vias."
  - "TSD is AUTO-RETRY (hiccup), not latch-off. If a persistent SELV fault must LATCH off, this is the wrong response mode (the latch parts, e.g. TPS259570, have no OV clamp) -> confirm fault-response intent in review."
  - "FLT is OPEN-DRAIN - external pullup required; this is the natural power-good/fault signal for the safety chain."
verified: "pin map from Sec.6 Pin Configuration 'TPS2595x3 DSG Package 8-Pin WSON Top View' + Pin Functions table, p.4; '-73' = Programmable OVLO / active-low EN / auto-retry from Device Comparison Table p.3; EP=GND, abs-max/limits from Sec.7.1-7.3 p.5, SLVSE57C - 2026-07-22"
layout:
  source: "TI SLVSE57C Sec.11 Layout Guidelines + Fig.68 Layout Example + Sec.10 Power Supply Recs Fig.67: 0.01uF+ Cin between IN and GND with MINIMAL loop area at the IN/GND terminals; power path IN->OUT SHORT and sized >=2x full-load current; GND terminal to the plane AT the IC pin; Rilm, Cdvdt and the OVLO-divider resistors LOCAL to their pins with the shortest GND return and NO coupling to switching nodes; TVS/Schottky protection hard against OUT."
  reviewed: "2026-07-22"
  keep_short:
    # v1.8 2026-07-29: this row said `net: 5V_SELV` from the day it was written, and there
    # IS NO NET CALLED 5V_SELV ON THIS BOARD (grep = 0; the IN pins 3/4 are on `5V_RPP`).
    # P-ADJ can only grade a budget whose net RESOLVES, so the row was counted UNREACHED and
    # read as covered — while the thing it was written to hold, the Cin itself, DID NOT
    # EXIST: `5V_IN`/`5V_FUSED`/`5V_RPP` carried ZERO capacitors and both C_IN1/C_IN2 sit on
    # the OUTPUT rail. An unenforceable budget is not a weak check, it is a check that
    # cannot fail, and this is what it hid. `C_EFIN` 100nF is now fitted on 5V_RPP and the
    # budget names the net the datasheet sentence is actually about. It will VIOLATE against
    # P-ADJ's whole-net max-pairwise-pad-span metric (5V_RPP measures 15.581 mm end to end
    # because the same net feeds R_OVT and Q_REV's drain); that violation is carried in
    # policy_waivers.yaml with the LOCAL pad-to-pad measurement, which is the fact this row
    # asserts, exactly as the AMS1117 CIN/COUT rows already are. Renaming it to something
    # that PASSES was refused: the budget names a node, not a score.
    - {net: 5V_RPP,     max_span_mm: 3, why: "Cin 0.01-0.1uF IN->GND loop minimized at the terminals (Fig.68); controls the short-circuit interrupt transient (Eq.18). 5V_RPP IS the IN-pin net on this board (pins 3+4); the row said `5V_SELV` until v1.8 and graded as UNREACHED while no Cin existed at all"}
    # v1.8: these three were REFERENCE-DESIGN PIN NAMES, not nets on this board, and so were
    # UNREACHED for the same structural reason 5V_SELV was. This part has exactly ONE instance
    # and each pin has exactly ONE net, so the real name is unambiguous and the rename is the
    # node the datasheet sentence is about — not a name chosen to score well (EF_OVLO and
    # EF_ILM both VIOLATE the budget once they resolve; see policy_waivers.yaml P-ADJ).
    - {net: EF_OVLO,    max_span_mm: 5, why: "OVLO divider (IN/pin2/GND) local to pin 2, short GND return, no switching coupling - this divider SETS the OV trip point. Was `EN_OVLO_N`, a pin name, until v1.8"}
    - {net: EF_ILM,     max_span_mm: 5, why: "Rilm local to pin 7 / GND - trace resistance adds directly to current-limit error. Was `ILM`, a pin name, until v1.8"}
    - {net: EF_DVDT,    max_span_mm: 5, why: "Cdvdt local to pin 1 / GND - sets the inrush slew. Was `dVdt`, a pin name, until v1.8"}
  notes: >
    OUTWARD-ONLY-LOCAL is the EARNED cheap-tier condition (escape.conditions): the IN/OUT power pins escape
    outward as WIDE copper; every fine pin (dVdt, EN/OVLO, FLT, ILM) terminates in an ADJACENT local passive with
    NO via between pads and NO layer drop (the SY8368-shipped pattern). EP(9)=GND flooded with thermal vias.
    If the floorplan cannot honour outward-only-local for this WSON, RAISE escape.tier_required to
    jlc_4layer_advanced (the unconditional feasible tier from escape_check) - do not silently break the condition.
