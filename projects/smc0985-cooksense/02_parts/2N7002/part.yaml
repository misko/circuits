  source: "Diodes 2N7002 ds11303 Thermal Characteristics + Notes 6/7: theta_JA 348C/W on the
    minimum-recommended-pad vs 241C/W on 1in^2 2oz-Cu FR-4; PD 370mW (min pad) / 540mW (1in^2 2oz);
