  reviewed: "2026-07-22"
  keep_short:
    - {net: HS_GATE, max_span_mm: 6, why: "the Q2 pulldown FET sits local to the AO3401A high-side gate it drives (drain -> P-FET gate); a short drive node = clean turn-off, no coupling"}
  notes: >
    Genuinely layout-agnostic, like the logic-gate case: as the Q2 gate-pulldown driver its load is a
    high-impedance MOSFET gate switched at sub-mA, so the copper-vs-theta_JA table is non-binding (no
    self-heating). The only real rule is placement: sit the FET beside the AO3401A gate node it pulls
    down (drain = P-FET gate, source = GND, gate = logic / AND-chain enable) with a local gate pulldown,
    keeping the drive net short. No thermal copper array, no current-path span budget.
