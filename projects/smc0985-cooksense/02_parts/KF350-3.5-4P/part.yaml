mpn: KF350-3.5-4P
manufacturer: Cixi Kefa
type: screw_terminal_4p
datasheet:
  doc_id: KF350
  url: https://www.lcsc.com/product-detail/C42400616.html
  fetched: 2026-07-25
package: 3.5mm pitch 4P screw terminal, THT
footprint: cooksense:TerminalBlock_KF350_4P
escape: {style: connector, pitch: 3.5, tier_required: jlc_2layer_default, checked: escape_check 2026-07-26}
layout:                          # P-LAYOUT: the ONE isolated terminal block (ADR-0013)
  source: "KF350/350-series 3.5mm terminal-block datasheet (C42400616) + the
    already-fab-proven KF350-3.5-2P on cooksense v1.0/v1.1. The isolation rules
    are NOT the connector's own — they are the ISO_CONTACTOR netclass, the
    `opto_isolation_2mm` DRU rule (IEC 60664-1 basic insulation, 30V working,
    pollution degree 3, material group IIIa) and the LTV-817S dossier."
  reviewed: "2026-07-26"
  notes: |
    Field-wiring interface, but NOT layout-agnostic — it is the only connector on
    this board whose every pole sits on the far side of the opto barrier, so its
    placement IS the isolation argument. Rules, all MEASURED on v1.3:
    (1) place at a board EDGE, poles off-board, and keep the 14.0 x 7.0mm body
        INSIDE the outline (south face flush at y102.000, not proud — the
        enclosure wall is the board edge);
    (2) hold >= 2.000mm of copper from EVERY non-ISO_CONTACTOR net. The binding
        neighbour is not another connector's signal pads but J_DOOR's east GND
        SHELL TAB (pad MP): measured 2.126mm, and the block sits 1.70mm WEST of
        the SELV column so the 2-D moat buys that back diagonally;
    (3) the 2.0mm moat against the GND/3V3 PLANES is POUR GEOMETRY, not a rule a
        router can honour — `iso_moat_block` / `iso_moat_opto` in floorplan.yaml,
        with the matching User.2 (SELV out) and User.4 (ISO in) rects in
        route.yaml. A pour fills to its own 0.200mm clearance otherwise: v1.2
        measured 82 violations, worst 0.199mm;
    (4) poles 2 and 3 are ONE board net on TWO screws deliberately — on a safety
        interlock a single loosening screw must not drop both the E-stop return
        and the contactor feed (asserted in electrical_invariants.yaml);
    (5) THT on an SMT-only order: `not_assembled` / hand-soldered, and off the
        CPL via `exclude_from_pos_files`.
    Escape is trivial (4 poles at 3.5mm pitch, 1.20mm drills, single row, all on
    one netclass at 0.3mm min width) — the constraint is the moat, not the fanout.
pins:
  1: LOOP_OUT      # CONTACTOR_C   — opto collector out to E-stop pole B
  2: LOOP_RET      # CONTACTOR_LOOP — E-stop pole B return
  3: CTR_A         # CONTACTOR_LOOP — same board net as pin 2; contactor circuit
  4: CTR_B         # CONTACTOR_E   — opto emitter, contactor circuit return
# NO `asserts:` BLOCK, AND THE REASON IS A MEASURED GAP RATHER THAN AN OVERSIGHT.
# I declared `not_on_assembly_bom` here first and P-FACT correctly FAILED it: the
# assert means "no ref of this part may carry a non-blank LCSC on the BOM OR sit on
# the CPL", and J_ISOLOOP legitimately does the first. This project runs THREE
# treatments for its 16 not_assembled refs and they are all deliberate:
#   blank LCSC on the BOM   the 12 Standex reeds + J_TC — their part.yaml carries
#                           `lcsc: ""` because NOTHING orderable exists (every
#                           catalog candidate is stock 0 and none is canonical)
#   coded on the BOM,       J_ISOLOOP (this part), J_LOADCELL, J_PI — a real
#   off the CPL             catalog identity exists, so the order sheet should say
#                           what to buy; they are simply not machine-placement
#                           instructions (exclude_from_pos_files)
# P-FACT HAS NO KIND THAT EXPRESSES THE SECOND ROW. `not_on_assembly_bom` conflates
# "not placed" with "not purchased", and this part is not-placed-but-purchased.
# Asserting it would either fail forever or pressure the BOM into dropping a code a
# human needs. RECORDED as the open half of P-FACT alongside `keepout_region`.
# What IS gated here: A-POP (assembly_coverage) owns the population set and passes;
# `exclude_from_pos_files` keeps the ref off the CPL; and the ORDER_README names it
# in the self-supplied list. The v1.3 authoring change that came out of this — the
# tsx now names J_ISOLOOP by MPN rather than by LCSC, matching the reeds and J_TC —
# is kept, because the BOM Comment column now reads `KF350-3.5-4P` instead of a bare
# code, which is what a person reading the order sheet needs.
verified: >
  4 positional screw poles at 3.5mm pitch. The KF350 body is MODULAR at
  3.5mm/pole, so the 4P body is exactly 2x the already-fab-proven 2P
  (TerminalBlock_KF350_2P, C474892, shipped on cooksense v1.0 and v1.1):
  14.0mm wide x 7.0mm deep vs 7.0 x 7.0. The project footprint is that
  BODY geometry extended pole-for-pole — same 1.20mm drill, same body
  depth, same courtyard margin (0.30mm). Pad 1 is RECT as the pole-1
  marker, matching the 2P.
  ONE DELIBERATE DEVIATION FROM THE 2P, and it is measured: the pad is
  2.20mm diameter, not the 2P's 2.60. Annular ring 0.50mm on the 1.20mm
  drill (JLCPCB's THT minimum is 0.15mm; IPC-2221 class 2 is far below
  that), so the ring is ~3x the fab floor and the part is hand-soldered
  anyway. The reason is geometric, not electrical: at 2.60 the pad column
  is 13.10 x 2.60mm and the east connector column solves with ~0.05mm of
  margin on EVERY constraint simultaneously — H4's courtyard, both
  inter-connector courtyard gaps, the ISO_CONTACTOR 2.0mm moat to J_DOOR's
  GND shell tab, and copper-to-board-edge. 2.20 buys 0.40mm along the poles
  and 0.40mm across them, and the same solve lands at 0.09–0.35mm. It also
  raises pole-to-pole copper gap from 0.90 to 1.30mm, which on a 30V
  isolated block is the right direction. Full budget in
  03_src/cooksense/floorplan.yaml, EAST COLUMN block.
orientation:
  # PRESERVED HERE BECAUSE IT CANNOT LIVE IN jlc_lcsc_rotations.csv (coordinator
  # decision 2026-07-26). C42400616 gets NO rotation row: it is off the CPL
  # (exclude_from_pos_files + not_assembled) and it has no MEASURABLE offset,
  # because JLC has no CAD for it at all. A row asserting an offset nobody can
  # measure is an unevidenced authority entry — the `^JST_GH_SM,180` mistake
  # that put eight cooksense connectors 180 deg out through two sealed releases.
  cad_available: false
  cad_probe: >
    MEASURED 2026-07-26, and the CONTROL is what makes it a part fact rather
    than a tool gap. easyeda2kicad against the EasyEDA/JLC API, same minute,
    same tool, same network:
      C474892     KF350-3.5-2P (stocked 9987)  -> FETCHED, 3D model
                                                  CONN-TH_P3.50_KF350-3.5-2P
      C9900026363 KF350 4P alternate           -> [ERROR] Failed to fetch data
                                                  from EasyEDA API
      C42400616   KF350-3.5-4P (this part)     -> [ERROR] Failed to fetch data
                                                  from EasyEDA API
    The API answered for the 2-pole part of the SAME family and refused BOTH
    4-pole codes, which is consistent with stockCount 0 on all three 4P lines.
    So this is genuine library absence, not a transient fetch failure, and
    jlc_twin's FETCH-FAILED on it is adjudicated on that basis. Without the
    control the same evidence reads as "the tool was silent", which is the
    misdiagnosis this fleet has now made five times.
  pole_1_marker: >
    Read as a SHAPE, on both sides, since no model fit is possible:
      OURS 4P   pad 1 is RECT at local (-5.250, 0.000); poles 2/3/4 are circles
                at -1.750 / +1.750 / +5.250. The rect IS the pole-1 marker.
      OURS 2P   pad 1 is RECT at local (-1.750, 0.000), pad 2 circle at +1.750
                — the fab-proven geometry shipped on v1.0 and v1.1. The 4P is
                that convention extended pole-for-pole, same -x end.
      JLC 2P    (C474892, the only KF350 land JLC will serve) pad 1 at
                (-1.75, 0.00), pad 2 at (+1.75, 0.00) — JLC's pole 1 is ALSO at
                -x, so the family agrees with ours at offset 0.
    Inference for the 4P is therefore offset 0 by family convention, but it is
    an INFERENCE and is deliberately not written into the rotation table.
  as_placed: >
    J_ISOLOOP at (195.300, 95.000) rot 90 puts pole 1 SOUTH-most; board
    coordinates measured off 04_kicad/cooksense.kicad_pcb:
      pole 1  CONTACTOR_C     (195.300, 100.250)   opto collector -> E-stop B in
      pole 2  CONTACTOR_LOOP  (195.300,  96.750)   E-stop B return
      pole 3  CONTACTOR_LOOP  (195.300,  93.250)   -> contactor circuit
      pole 4  CONTACTOR_E     (195.300,  89.750)   contactor return -> opto E
    Field wiring runs SOUTH to NORTH. Since the part is hand-soldered and off
    the CPL there is no machine rotation to get wrong: THE WHOLE RISK IS A
    HUMAN LANDING FOUR WIRES, so the ORDER_README pole legend is the gate, not
    a preview tick.
sourcing:
  lcsc: C42400616
  note: >
    JLCPCB parts-library query 2026-07-25 (jlcpcb.com selectSmtComponentList,
    the endpoint jlc_stock_check.py uses): keyword 'KF350-3.5-4P' -> 1 hit,
    C42400616 Cixi Kefa Elec, stockCount 0. Keyword 'KF350 4P' -> 3 hits
    (C9900026363, C42400616, C9900148443), stockCount 0 on all three.
    Control query the same minute: 'KF350-3.5-2P' -> C474892 stockCount 9987,
    so the zeros are the library's answer, not a dead field.
    THIS DOES NOT BLOCK THE BUILD: the part is THT and this board orders
    JLC STANDARD SMT assembly (03_src/cooksense/rules/assembly.yaml
    `service: standard`), which does not place through-hole parts at all.
    It is therefore SELF-SUPPLIED / hand-soldered like J_TC and the twelve
    Standex relays, and is declared in assembly.yaml `not_assembled` with
    this evidence. Commodity part, widely stocked outside LCSC.
  alternates: >
    Any 3.5mm-pitch 4-pole THT screw terminal of the 350 family with a
    14.0 x 7.0mm body footprint (XY350-3.5-4P, DG350-3.5-4P). NOT a
    pluggable 2EDG-family part: those are a header + plug pair with a
    different body and a different pin projection.
