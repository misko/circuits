asserts:
  - {assert: value, equals: 1.2k, tolerance_pct: 1,
     why: "R_ILM IS THE eFUSE CURRENT LIMIT. TPS259573 pin 7 (ILM) takes a resistor to
       GND that PROGRAMS the IN->OUT current limit; the part dossier
       (02_parts/TPS259573DSGR, TI SLVSE57C) records the programmable window as
       `Rilm 487ohm (4.42A max) .. 5000ohm` and states `Do NOT leave floating`. A
       substituted value therefore re-programs the board's INPUT PROTECTION set point
       -- lower R = higher limit (the fuse stops protecting), higher R = lower limit
       (the eFuse trips on the reed-coil inrush and the board browns out mid-cycle).
       Neither failure shows up in DRC, ERC, parity, the twin render or the CPL. The
       exact trip current is NOT restated here: TI's ILIM equation is a curve fit and
       this dossier does not own it -- 02_parts/TPS259573DSGR does, and the power
       review is where the number is derived. What this assert pins is that the value
       on the board is the value the design chose."}
gotchas:
  - "THIS ENTRY EXISTS BECAUSE THE PART IT REPLACES CANNOT BE BOUGHT IN ONES. cooksense
     v1.0-v1.4 shipped R_ILM as C25862 (UNI-ROYAL 0402WGF1201TCE). Read live 2026-07-27
     the code is not out of stock the way C25744 is -- it is UNORDERABLE IN THIS
     QUANTITY: `stockCount` moved 25 -> 65 -> 90 across three reads the same afternoon
     while `minPurchaseNum` is 7463. A line whose minimum purchase is 80x its own stock
     is a line JLC cannot commit against for a 5-board order, and the naive
     `stock >= 5 x qty` test PASSES it (90 >= 5) -- which is exactly why the swap is
     recorded here rather than left to the stock gate."
  - "DROP-IN, AND THE CLAIM IS CHECKABLE RATHER THAN ASSERTED: JLC's catalog `describe`
     string for C138040 is CHARACTER-IDENTICAL to C25862's, compared AS STRINGS (both
     read live 2026-07-27) ---
     `-55C~+155C 1.2kOhm 50V 62.5mW Thick Film Resistor +-1% +-100ppm/C 0402 Chip
     Resistor - Surface Mount ROHS`. Same package (`componentSpecificationEn` 0402 on
     both), value, tolerance, tempco, power and voltage; `leastPatchNumber` 20 on both.
     THE SPEC STRING, NOT THE VALUE, IS WHAT WAS MATCHED: a +-5% 1.2k (C25928, C137910,
     C170376 ...) also reads `1.2k` and would have satisfied a value-only comparison
     while doubling the current-limit tolerance on a protection part."
  - "SAME MANUFACTURER AND SERIES AS THE 10k SWAP IN THIS RELEASE (YAGEO RC0402FR), and
     the same series R_OS already ships (C137961, RC0402FR-07510KL) -- so this is not a
