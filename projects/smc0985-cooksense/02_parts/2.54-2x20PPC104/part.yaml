gotchas:
  - "STACKING part: 12.46mm long male tails pass UP through the PCB; the female socket sits
    on the BOTTOM side and mates the Raspberry Pi 5 J8 male header BELOW the board. Assemble
    socket-down / tails-up (THT, hand- or wave-solder — not SMT-placed)."
  - "SIGNALS ONLY (brief item 11 master connector table: 'J_PI 2x20 stacking (signals only,
    Pi power NC/sense)'): this board is powered from J_PWR (Micro-Fit 5V), NOT from the Pi.
    Treat Pi power pins as NC or sense-only — 5V = pos 2,4; 3V3 = pos 1,17."
  - "GND = positions 6,9,14,20,25,30,34,39 (8 grounds). HAT ID EEPROM reserved: pos 27=GPIO0/
    ID_SD, pos 28=GPIO1/ID_SC — do not repurpose as GPIO."
  - "Pin-1 orientation is board-critical: the footprint is 2-fold symmetric, so a 180deg flip
    silently mis-maps EVERY net. Pin 1 is the 3V3 corner at the Pi board edge (SD-card/USB end)."
verified: "physical 2x20 (40-pos) 2.54mm grid + pin-1 corner + 12.46mm stack tail read from the
  Zhejiang Bomu drawing (LCSC C35165, page 1: front/side/PCB-layout views + 40-position A/B table)
  — 2026-07-22. Female / 2-row / 40P confirmed on LCSC C35165 parametric."
notes: |
  Raspberry Pi 5 40-pin J8 GPIO map (standard, identical to Pi 2/3/4) — the NET assignment the
  board author applies to physical positions 1..40 (this connector part is itself positional):
     1  3V3          2  5V
     3  GPIO2/SDA1    4  5V
     5  GPIO3/SCL1    6  GND
     7  GPIO4/GPCLK0  8  GPIO14/TXD0
     9  GND          10  GPIO15/RXD0
    11  GPIO17       12  GPIO18/PCM_CLK
    13  GPIO27       14  GND
    15  GPIO22       16  GPIO23
    17  3V3          18  GPIO24
    19  GPIO10/MOSI  20  GND
    21  GPIO9/MISO   22  GPIO25
    23  GPIO11/SCLK  24  GPIO8/CE0
    25  GND          26  GPIO7/CE1
    27  GPIO0/ID_SD  28  GPIO1/ID_SC
    29  GPIO5        30  GND
    31  GPIO6        32  GPIO12/PWM0
    33  GPIO13/PWM1  34  GND
    35  GPIO19       36  GPIO16
    37  GPIO26       38  GPIO20
    39  GND          40  GPIO21
  No layout: block — a passive GPIO connector is out of P-LAYOUT scope (not an IC / power /
  sense part). Placement rules that DO matter (board-edge alignment to the Pi mechanical
  outline, pin-1 corner, keep-out under the socket) are Pi-HAT mechanical facts, not connector-
  datasheet facts; they belong in the floorplan, and the pin-1 fact is captured in gotchas above.
sourcing:
  lcsc: C35165
  alternates: [C2977589, C50982]
  note: |
    PRIMARY C35165 = BOOMELE 2.54-2*20PPC104 — 2x20 FEMALE STACKING (12.46mm stack-through
    tails, gold, 3A). Directly matches brief "J_PI 2x20 stacking". In stock at LCSC/JLC
    (Extended) 2026-07-22. THT / hand- or wave-solder.
    ALT C2977589 = ZHOURI 2.54-2*20 — standard-height female (3.2mm tails, NOT stack-through),
    much higher stock + cheaper; use if HAT stack-through above the board is not required.
    ALT C50982 = BOOMELE 2.54-2*20PFemale (canonical short-tail female) — verified OUT OF STOCK
    at LCSC on 2026-07-22; kept for traceability, do not order until restocked.
layout:                          # P-LAYOUT: 40-pin GPIO stacking header (interface, not timing-critical)
  source: "Raspberry Pi 40-pin GPIO / HAT+ mechanical spec (2x20 @2.54mm, J8) +
    ADR-0007 sidecar decision: this board is a 40-pin-ribbon SIDECAR, not a stacked
    HAT (its 138x96 footprint would overhang the Pi 5 and block USB-C/HDMI/fan/
    Ethernet, brief mechanical do-not-block list). Only placement demand is mating
    geometry + the ribbon exit."
  reviewed: "2026-07-23"
  notes: |
    Interface connector, layout-agnostic apart from mechanical mating (honest: no
    keep_short span budget). Rules: (1) place J_PI at a board EDGE with the mouth
    off-board so the 40-way ribbon exits cleanly to the Pi; (2) power pins 1/2/4/17
    and HAT-ID 27/28 are NC/sense only (brief §3, no backfeed) - no wide-copper
    demand; (3) signals run at <=few-MHz SPI/I2C/shift-reg, no controlled impedance
    or length-matching; (4) GND pins (6,9,14,20,25,30,34,39) tie the plane locally.
