  1: IN1
  2: IN2
  3: IN3
  4: IN4
  5: IN5
  6: IN6
  7: IN7
  8: IN8
  9: GND
  10: COM    # flyback common -> RELAY_5V
  11: OUT8
  12: OUT7
  13: OUT6
  14: OUT5
  15: OUT4
  16: OUT3
