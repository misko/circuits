datasheet:
  doc_id: SLRS049
  url: https://www.ti.com/lit/ds/symlink/uln2803a.pdf
  fetched: 2026-07-19 (standard pinout; re-verified in pin review)
package: SOIC-18 wide (DW)
footprint: Package_SO:SOIC-18W_7.5x11.6mm_P1.27mm
escape: {style: leaded, pitch: 1.27, tier_required: jlc_2layer_default, checked: escape_check 2026-07-22}
