mpn: CD74HC221M96
manufacturer: Texas Instruments
type: monostable_multivibrator_nonretriggerable   # DUAL one-shot, NON-retriggerable —
                              # the whole reason this part exists on v1.2: the SN74LVC1G123
                              # it replaces is RETRIGGERABLE (TI: up to 100% duty), so the
                              # claimed <=500ms PRESS bound was not a hard bound
                              # (external review F5, v1.2 priority 6 / ADR-0011).
datasheet:
  doc_id: SCHS166
  revision: SCHS166F
  url: https://www.ti.com/lit/ds/symlink/cd74hc221.pdf
  sha256: 30c3cd71497774eb41f5cfe83da9e24fe66ecbe0c2f072d78163e8e9633453ca
  fetched: 2026-07-24
  local: SCHS166F.pdf
package: SOIC-16 (D, 3.9mm body)
footprint: Package_SO:SOIC-16_3.9x9.9mm_P1.27mm   # same land as SN74HC595DR/SN74HC238DR
escape: {style: leaded, pitch: 1.27, tier_required: jlc_2layer_default, checked: escape_check 2026-07-24}
pins:                       # DS p.1 Pinout (PDIP/SOIC top view) — '221 standard pinout
  1: 1A_N     # section 1 trailing-edge trigger (active-low). Tie GND: B-only triggering
  2: 1B       # section 1 leading-edge trigger, SCHMITT input — PRESS_REQ
  3: 1R_N     # section 1 reset (active-low): LOW terminates/blocks the pulse — OS_CLR_N
  4: 1Q_N     # section 1 Q-bar — PRESS_TIMED_N (latch-freeze + lockout logic)
  # *** SECTION 2 IS IN USE. IT IS THE RE-ARM EDGE DETECTOR (ADR-0020). ***
  # CORRECTED 2026-07-30 (ADR-0028 pass). Every section-2 line below previously
  # read "unused" and prescribed a tie-off, and **FOLLOWED LITERALLY THE
  # PRESCRIPTION DESTROYS THE RE-ARM PATH**: `2R_N` tied GND holds section 2
  # permanently reset, so `REARM_PULSE_N` never fires and the discrete fault
  # latch can never be cleared — the board locks out after its first fault with
  # no way back. MEASURED from `source/cooksense.net`, every pin of U_ONESHOT.
  5: 2Q       # section 2 Q — genuinely unconnected on this board
  6: 2CX      # section 2 Cext — WIRED: `OS2_C` (section-2 timing cap)
  7: 2CXRX    # section 2 Rext/Cext — WIRED: `OS2_RC` (section-2 timing node)
  8: GND
  9: 2A_N     # section 2 trailing-edge trigger (active-low) — WIRED: `REARM_N`.
              # A REARM_N FALLING EDGE is what fires the re-arm pulse.
  10: 2B      # section 2 leading-edge trigger — WIRED: `3V3` (held high so the
              # A_N edge is the sole trigger; NOT tied GND)
  11: 2R_N    # section 2 reset (active-low) — WIRED: `WD_OK`. A watchdog fault
              # holds section 2 in reset, so re-arm is impossible while the
              # watchdog is unhappy. THIS IS A SAFETY INTERLOCK, NOT A TIE-OFF.
  12: 2Q_N    # section 2 Q-bar — WIRED: `REARM_PULSE_N` (clears the fault latch)
  13: 1Q      # section 1 Q — PRESS_TIMED
  14: 1CX     # section 1 Cext
  15: 1CXRX   # section 1 Rext/Cext (timing node: Rx to VCC, Cx between 14-15)
  16: VCC
limits: {vcc: "2-6V", t_op: "-55..125C", rx: "typ 1k-1M per DS curves"}
gotchas:
  - "NON-RETRIGGERABLE is the load-bearing property: DS p.1 'Once triggered, the outputs
    are independent of further trigger inputs on A and B.' Repeated Pi edges on 1B during
    a pulse CANNOT stretch PRESS_TIMED (unlike the '123/'1G123 class it replaces)."
  - "tw = K*Rx*Cx; K = 0.7 at VCC=4.5V (DS p.1), Figure 6 shows K rising to ~0.75 toward
    3V. Design: Rx=510k, Cx=1uF -> tw ~ 357-383ms nominal; worst-case high (K=0.77,
    R+1%, C+10% X5R) ~ 436ms < 500ms hard bound. See DETAIL_DESIGN 'PRESS one-shot'."
  - "RESET-AS-TRIGGER caveat (Truth Table Note 1/3): with A_N low and B high, a LOW->HIGH
    transition on R_N TRIGGERS one bounded pulse. Consequence here: if the Pi holds
    PRESS_REQ high while a STOP/door abort releases (OS_CLR_N rises), ONE bounded ~380ms
    press can re-fire. Bounded and one-hot, accepted + documented (ADR-0011); software
    must drop PRESS_REQ on abort."
  - "Q is LOW at power-up until first valid trigger — relays locked out until the Pi
    deliberately pulses PRESS_REQ (same safe-boot property the 1G123 had)."
  - "*** SECTION 2 IS USED — THE 'UNUSED SECTION 2' GOTCHA WAS DELETED 2026-07-30
    (ADR-0028 pass) AND IS REPLACED BY THIS ONE. DO NOT RESTORE IT. *** It read
    'Unused section 2: 2A_N=VCC, 2B=GND, 2R_N=GND (held reset), 2Q/2Q_N open,
    2CX open, 2CXRX pulled to VCC via 10k'. Every clause is false of this board,
    and one of them is DANGEROUS: tying 2R_N to GND holds section 2 in permanent
    reset, so REARM_PULSE_N never fires, the discrete fault latch can never be
    cleared, and the board is bricked into lockout after its first fault. The
    dossier is what a future agent reads when 'tidying up an unused section'.
    MEASURED from source/cooksense.net (all 16 pins): section 2 is the RE-ARM
    EDGE DETECTOR of ADR-0020 — 2A_N=REARM_N (the trigger, on its FALLING edge),
    2B=3V3 (held high), 2R_N=WD_OK (a watchdog fault inhibits re-arm — a safety
    interlock), 2Q_N=REARM_PULSE_N (clears the latch), 2CX=OS2_C, 2CXRX=OS2_RC,
    2Q genuinely open. The RC-node rule survives and still applies to the
    SECTION-2 timing network: never hard-tie CXRX to a rail."
verified: "pin map from DS p.1 Pinout (CD74HC221 PDIP/SOIC top view) + Functional Diagram
  pin numbers (1CX=14, 1CXRX=15, 1Q=13, 1Q_N=4); non-retriggerable statement + tw formula
  from DS p.1; truth table + Note 1 (reset-triggering) from DS p.2 — SCHS166F, 2026-07-24"
layout:
