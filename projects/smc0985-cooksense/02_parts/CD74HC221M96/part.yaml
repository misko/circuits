       directly at pins 14/15 — an RC I/O node that must not be pulled to a rail; large
       510k impedance makes it noise-sensitive"}
    - {net: N3V3, max_span_mm: 5, why: "100nF VCC(16)-GND(8) bypass tight to package"}
  notes: "SOIC-16 1.27mm — no escape wall. Q(13)->ULN PRESS input and Q_N(4)->gating
    logic are ordinary logic runs."
