  - "BT = TOP/vertical entry (correct for this design); 10FDZ-ST is SIDE entry with a DIFFERENT land pattern — do NOT substitute (ADR-0008 variant discipline)"
  - "SELF-SUPPLIED HAND-SOLDER, DO-NOT-SUBSTITUTE: distributor-stocked (Mouser/RS/DigiKey), NOT confirmed on LCSC/JLC — no LCSC code, keep off the JLC-assembly BOM"
