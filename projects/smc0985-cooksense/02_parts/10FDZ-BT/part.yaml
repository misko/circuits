verified: >
  Land pattern read from eFDZ p.3 'PC board layout and Assembly layout — Top
  entry type' (drawing viewed FROM THE MOUNTING SURFACE, note 1): 10 holes
  phi0.9+-0.05 in ONE row at 2.54+-0.05 pitch, row span A=22.86+-0.05 (p.2
  table, 10 circuits); polarization boss NPTH phi1.8+-0.05 ON the row
  centerline, 2.54+-0.05 outside the first contact hole; row is (2.6) from the
  front housing edge, housing outline edge (5.3) from the first hole, B=36.26
  total. Ratings from p.1 Specifications. 2026-07-24.
  NEEDS-PHYSICAL-CONFIRM (blocks fab ORDER, not the seal — user directive
  2026-07-24 'go ahead assuming 10FDZ-BT'): hole/boss fit, which housing end
  carries circuit 1 vs the boss, and the (2.6) front/rear sense were taken from
  the reference drawing only — verify drill pattern + polarization-peg position
  against a purchased 10FDZ-BT before ordering (ORDER_README bring-up ritual,
  v1.0 J_TC/J_PWR pin-1 class).
layout:
  source: "eFDZ p.3 PC-board layout (top entry) + p.2 outline drawings. Passive ZIF — no signal-timing constraints; the governing rules are mechanical."
  reviewed: "2026-07-24"
  notes: >
    Keep the slider face and tail-entry top clear (tail drops in vertically;
    slider needs finger access). Board C keypad-domain isolation: the whole
    board is a floating net set — no plane, pour, or copper under/around this
    footprint may tie to any SELV/logic/chassis net (BRIEF §5). Both 10FDZ-BT
    on the interposer are placed with pin columns X-ALIGNED so the ten
    pass-through nets route as straight parallel tracks (continuity map G6).
