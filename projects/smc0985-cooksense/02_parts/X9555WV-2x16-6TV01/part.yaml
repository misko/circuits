  notes: |
    Interface/bulk-IO connector, layout-agnostic apart from mating (honest: no
    keep_short span budget). Rules: (1) if populated, place at a board edge with the
    key/notch oriented so the ribbon cannot be reversed and the cable exits off-board;
    (2) 2.54mm THT, no controlled impedance; (3) GND/return pins tie the local plane.
    Not in the cooksense netlist rev (kept in the parts library as the bulk-IO
    breakout option); block present so P-LAYOUT grades the library part.
