mpn: DIP05-1A72-13L
manufacturer: Standex-Meder Electronics
type: reed_relay_spst_no_5v
datasheet:
  doc_id: DIP-series
  revision: "Version 03, 01 Aug 2025"
  url: https://standexdetect.com/wp-content/uploads/sites/2/2025/09/datasheet-reed-relay-series-dip.pdf
  sha256: 7616ace1377d3cc854bfaaabcf2433692ed65adaa2773b9810d2f67f55e75141
  fetched: 2026-07-19
  local: datasheet-reed-relay-series-dip.pdf
package: DIP low profile 19.3 x 6.5 x 5.1mm, 4 leads 0.5x0.25mm on DIP-14 corner grid (pin span 15.24mm, row spacing 7.62mm)
footprint: cooksense:Relay_StandexDIP_1A_pinout13
escape: {style: leaded, pitch: 2.54, tier_required: jlc_2layer_default, checked: escape_check 2026-07-22}
pins:                       # pin-out code 13, DS p.3 "Pin-Out (Top View)" sub-figure 13
  # ===================================================================
  # PART CHANGED -12L -> -13L, 2026-07-28, user decision (route 2).
  #
  # This is a PART-NUMBER correction, not a redesign. The board was
  # always DESIGNED for a row-split relay: ADR-0002 asserts "the
  # isolation boundary runs between the columns", the footprint's own
  # descr said so, and the v1.1 isolation-comb repack is built on it.
  # Sub-figure 13 IS that geometry. Sub-figure 12 -- the code that was
  # specified -- is not, and specifying it is what broke the board.
  #
  # Sub-figure 13, re-rendered at 300 dpi and read directly: FOUR leads.
  #   CONTACT (switch)  14 <-> 8   -- both on the EAST column
  #   COIL              2  <-> 6   -- both on the WEST column
  # Coil-to-contact separation is therefore the 7.62 mm COLUMN spacing,
  # which is what ADR-0002 and every downstream pour-relief and routing
  # rule already assume. Those rules become TRUE rather than void.
  #
  # For contrast, and why -12 had to go: under code 12 the part has
  # EIGHT leads, 1<->14 tied as one CONTACT node and 7<->8 as the other,
  # with the coil on the inner pins. On the old 4-pad land that shorted
  # 5V_KEY_RELAY to U_SEL_BUS and every ULN2803 output to its keypad
  # line, and left the coil with no holes at all.
  # ===================================================================
  2:  COIL_A                  # west column, one pitch in from the pin-1 end
  6:  COIL_B                  # west column, one pitch in from the far end
  8:  CONTACT_B               # east column, far end
  14: CONTACT_A               # east column, pin-1 end
limits: {coil: "5V nom / 7.5V max, 500R +-10%, pull-in <=3.5V, drop-out >=0.75V (DS p.2)", contact: "model 72: 10W, 200V, 0.5A switch / 1.0A carry (DS p.1)", dielectric_coil_contact: "1.5 kVDC min EN60255-27 (DS p.3) -- THE PART's internal rating; see the ISOLATION-GEOMETRY gotcha, the PCB geometry it was paired with was wrong", t_op: "-20..+70C"}
electrical:
  # COIL, DS p.2 "Coil Data (at 20 C)", Contact Form 1A / Switch Model 72 /
  # Pin-Out 10,11,12,13 / 5 VDC row. NOTE THE REFERENCE TEMPERATURE IS 20 C,
  # NOT 25 C — every derate below is anchored there, because that is what the
  # datasheet's own footnote is anchored to.
  coil_v_nom: 5.0
  coil_v_max: 7.5
  coil_r_typ_ohm: 500            # +-10%  -> 450 .. 550 at 20 C
  coil_r_tol_pct: 10
  coil_p_nom_mW: 50
  v_pullin_max_20C: 3.5          # MAX (the must-operate voltage), DS p.2
  v_dropout_min_20C: 0.75        # MIN, DS p.2
  tc_pct_per_K: 0.4              # DS p.2 footnote, VERBATIM: "The Pull-In,
                                 # Drop-Out Voltage and Coil Resistance will
                                 # change at rate of 0.4% per K"
  t_op: [-20, 70]
  source: "Standex DIP-series datasheet Version 03 (01 Aug 2025), p.2 Coil Data
    table + its 0.4%/K footnote; operating temperature p.3 Relay Data."
  # ---- DERIVED, for the ADR-0023 coil-margin node_level assert ---------------
  # These are NOT new datasheet reads; they are the numbers above expressed in
  # the form the checker grades. `v_il_max` on pad 2 is THE PULL-IN BUDGET, not
  # a logic threshold: the driven end of the coil must sit at or below
  #   4.691 (5V_KEY_RELAY vout_min) - V_PI(+70 C) = 4.691 - 4.200 = 0.491 V
  # for the coil to see its worst-case must-operate voltage at the top of the
  # declared envelope. The equivalence is exact, which is what lets the margin
  # be one assertion instead of a table in an ADR.
  #
  # *** RE-DERIVED 2026-07-30 (ADR-0028 Decision 8). THE THREE NUMBERS BELOW
  # WERE 49 mV TOO LOOSE, IN THE PERMISSIVE DIRECTION, ON A SAFETY GATE. ***
  # ADR-0023 (2026-07-29) derived all of them from `5V_KEY_RELAY vout_min =
  # 4.740 V`. ADR-0027 (2026-07-30) RE-DERIVED that rail floor to **4.691 V**
  # — its Decision 7 moved `5V_KEY_RELAY vin_min` 4.754 -> 4.702 once the
  # board's own copper was counted, and vout_min follows it through Q_COIL's
  # 11 mV — AND NOTHING FOLLOWED IT INTO THIS DOSSIER. For one day the
  # invariant would have ACCEPTED a driven node at 0.540 V, i.e. a coil seeing
  # 4.151 V against a 4.200 V must-operate. THE BOARD WAS NEVER AT RISK (the
  # measured node is 0.056 V, 8.8x inside even the corrected budget); THE GATE
  # WAS THE DEFECT — and it is the one invariant ADR-0023 created specifically
  # to abolish a hand-maintained table in an ADR, which is exactly the failure
  # mode a hand-maintained table has.
  # THE RULE THIS BUYS, WRITTEN WHERE THE NEXT EDITOR WILL SEE IT: **A DERIVED
  # CONSTANT MUST NOT BE COPIED WITHOUT A LINK BACK TO THE ADR THAT DERIVED IT,
  # AND WHATEVER IT WAS DERIVED FROM MUST BE NAMED IN THE SAME LINE.** Every
  # number in this block now names `5V_KEY_RELAY vout_min (power_tree.yaml,
  # ADR-0027 Decision 7)` so a future move of that rail is a grep away, not a
  # coincidence away.
  v_pullin_max_70C: 4.200        # 3.500 x (1 + 0.004 x (70 - 20))
  v_pullin_max_75C: 4.270        # the hard limit, for reference only
  coil_r_min_ohm_70C: 540        # 450 (-10%) x 1.20 — the LOWEST coil R, which
                                 # is the worst case for the driver's share
  coil_r_typ_ohm_70C: 600        # 500 x 1.20
  defaults: {vdd: 4.691}         # 5V_KEY_RELAY vout_min (power_tree.yaml,
                                 # ADR-0027 Decision 7; was 4.740 pre-ADR-0027)
  pins:
    "1": {r_on_ohm_max: 540}     # the coil, as the pull-UP leg to the rail
    # v_il_max = vdd 4.691 - v_pullin_max_70C 4.200. Re-derive BOTH if either
    # 5V_KEY_RELAY vout_min or the DS pull-in tempco moves.
    "2": {kind: coil_driven_end, v_il_max: 0.491, v_ih_min: 4.691}

gotchas:
  - "*** PULL-IN MARGIN IS NOW POSITIVE AT EVERY CORNER, AND IT TOOK A PART
     CHANGE (ADR-0023, 2026-07-29). READ THIS ENTRY BEFORE TOUCHING THE COIL
     RAIL OR THE DRIVER. ***
     Driver is a **TBD62083AFWG DMOS array** (was ULN2803A). Its R_ON is a
     GUARANTEED EC-table maximum, 3.25 ohm, identical at all three published
     current points, so it extrapolates down to the coil current legitimately:
     7.0 mA x 6.50 ohm (2x the 25 C max, a deliberately pessimistic hot bound —
     Toshiba publishes no tempco) = 0.046 V.
     *** THE TABLE BELOW IS RE-DERIVED AT THE ADR-0027 RAIL FLOOR 4.691 V.
     ADR-0023 computed it at 4.740; every row is 49 mV lower and every row is
     still POSITIVE. See the `defaults:` block above for why that mattered. ***
       margin(T) = 4.691 - 0.046 - 3.500 x (1 + 0.004 x (T - 20))
         T      V_PI      margin     (ADR-0023's figure at the old 4.740 rail)
        -20 C   2.940 V   +1.705 V   (+1.754)
        +25 C   3.570 V   +1.075 V   (+1.124)
        +50 C   3.920 V   +0.725 V   (+0.774)  <- the BRIEF's normal band
        +70 C   4.200 V   +0.445 V   (+0.494)  <- top of the declared envelope
        +75 C   4.270 V   +0.375 V   (+0.424)  <- hard limit
     Ampere-turn cross-check at +70 C: 4.691/(600+6.5) = 7.734 mA delivered
     against I_PI = 3.5/500 = 7.00 mA required, +10.5% (was +11.6% at 4.740).
     Insensitive to the one
     unpublished number: even 10x the table max (32.5 ohm) drops 0.228 V against
     a 0.491 V budget. HOT IS STILL THE WORST CORNER (coil R up, so V_PI up AND
     current down) and -20 C is still the most comfortable, so a room-temperature
     bench test still proves nothing about the top of the envelope.
     HISTORY, KEPT BECAUSE IT IS WHY THE PART CHANGED — under the ULN2803A the
     margin went NEGATIVE INSIDE THE DECLARED ENVELOPE, and worse, below the
     brief's own NORMAL band:
       (red-team TOPO P1-2, computed 2026-07-29 — before that date this margin was
       computed NOWHERE in the tree.)
     The DS footnote is not decoration: V_PI(T) = 3.500 x (1 + 0.004 x (T - 20)),
     referenced to 20 C, NOT 25 C. The old driver was a ULN2803A low-side
     Darlington whose V_CE(sat) at the ~7 mA coil current is 0.67 V TYP /
     ~0.88 V worst case — a figure that had to be DIGITIZED off SLRS049G Fig.1
     at 900 dpi because that EC table specified V_CE(sat) only at 100/200/350 mA,
     two orders above the coil. Its dossier `02_parts/ULN2803ADWR/` is RETAINED
     (`on_live_board: false`, `superseded_by: TBD62083AFWG`) because 02_parts is
     the MPN authority for six SEALED releases that ship C9683 — deleting it made
     the live release illegible and t1_fleet_regrade caught it. Read it, and
     ADR-0023, before proposing a Darlington here again.
     Rail floor in the table below is the THEN-DECLARED 5V_KEY_RELAY vout_min
     = 4.740 V. It is left at 4.740 ON PURPOSE: this is the historical record of
     WHY the part changed, computed at the rail declared on 2026-07-29, and
     rewriting it would falsify the evidence that forced ADR-0023. At the
     corrected 4.691 V floor every row below is 49 mV WORSE, so the rejection
     of the Darlington is strengthened, not weakened, by the re-derivation.
       margin(T) = 4.740 - V_CE(sat) - V_PI(T)
         T      V_PI     margin @0.67 TYP   @0.88 w-c   @1.10 hard bound
        -20 C   2.940 V      +1.130 V        +0.920 V      +0.700 V
        +25 C   3.570 V      +0.500 V        +0.290 V      +0.070 V
        +50 C   3.920 V      +0.150 V        -0.060 V      -0.280 V
        +70 C   4.200 V      -0.130 V        -0.340 V      -0.560 V
     NEGATIVE AT +70 C EVEN ON THE TYPICAL DRIVER DROP. The 0.4%/K IS the coil's
     copper tempco (+0.39%/K), so the current view is the SAME fact, not a second
     independent derate: pull-in is an ampere-turn condition, I_PI = 3.5/500 =
     7.00 mA and TEMPERATURE-INDEPENDENT, while the delivered current FALLS as
     the copper heats — 9.64 / 7.98 / 7.29 / 6.81 mA at -20/+25/+50/+70 C on
     nominal 500R and the 0.67 V typ drop (8.32 / 6.88 / 6.28 / 5.87 mA on 550R
     and 0.88 V). At +70 C 6.81 mA < 7.00 mA must-operate: the current view and
     the voltage view agree, and BOTH say the relay is not guaranteed to close.
     HOT IS THE WORST CORNER, and it is worst in both terms at once (coil R up,
     so V_PI up AND I down). -20 C is comfortable; do not let a bench test at
     room temperature stand in for the hot corner.
     K_STOP IS THE ONE RELAY THAT IS *NOT* EXPOSED, and it is worth knowing why:
     it does not hang off a Darlington. Its coil sits on the ungated 5V_STOP
     (vout_min **4.702 V** post-ADR-0027 Decision 7, a 0R link; was 4.754) and is
     sunk by a dedicated 2N7002 (Q_STOPDRV),
     whose V_DS at ~7 mA is ~0.10 V — margin +1.662 / +1.032 / +0.682 / +0.402 V
     at -20/+25/+50/+70 C and +0.332 V at +75 C (ADR-0023's figures at the old
     4.754 rail were +1.714 / +1.084 / +0.734 / +0.454; the review's
     '+450 mV at 70 C' is now +402 mV). CAVEAT,
     stated because it is the same class of gap this finding was: the 2N7002
     datasheet is NOT COMMITTED to 02_parts/2N7002 either (its `datasheet.url`
     is an LCSC product page, not a PDF), so that 0.10 V is an ESTIMATE, not a
     cited maximum. AND THE RE-DERIVATION MOVED THIS CLAIM, SO THE OLD WORDING
     IS CORRECTED RATHER THAN CARRIED: at the 4.754 rail an absurd 0.50 V of
     V_DS still left +0.054 V, and at 4.702 the SAME 0.50 V leaves **+0.002 V**.
     The break-even V_DS is **0.502 V** — about 5x the 0.10 V estimate and
     10-35x a realistic 2N7002 at 7 mA with V_GS 3.3 V (R_DS(on) ~2-7 ohm =>
     14-50 mV), so the conclusion is unchanged and the CUSHION IS NOT: this term
     is no longer comfortably non-load-bearing. The number should be
     cited before anyone leans on it.
     THE REMEDY CHOSEN, AND THE TWO THAT WERE REFUTED (ADR-0023): drop the
     DRIVER saturation. (a) Raising the coil rail is refuted arithmetically — the
     margin needed +0.130 V typ / +0.340 V worst at +70 C, i.e. vout_min >=
     5.080 V, and the ADR-0021 supply plus Q_COIL's 11 mV caps vout_min at
     4.839 V, worth +0.099 V; going higher needs a boost and collides with
     ADR-0021's OV divider, which has 118/161 mV of slack between the 5.25 V
     ceiling and the SMBJ5.0A's 6.40 V V_BR. (b) Narrowing the envelope is not
     admissible: the worst-case crossover 45.7 C is BELOW the brief's own <=50 C
     NORMAL band, so it would redefine 'normal' on a cooking appliance.
     DO NOT PUT A DARLINGTON BACK HERE. If a future BOM substitution is ever
     proposed for U_ULNA/U_ULNB, this margin is the acceptance test."
  - "ISOLATION GEOMETRY under code 13 — the claim ADR-0002 makes is TRUE, and it
     is true only because the part changed. COIL_A=DIP2 and COIL_B=DIP6 are both
     on the WEST column; CONTACT_A=DIP14 and CONTACT_B=DIP8 are both on the EAST
     column. Coil-to-contact separation on the land is therefore the 7.62 mm
     COLUMN spacing (6.12 mm pad-edge, track-aware measured), which is exactly
     what ADR-0002, the v1.1 isolation comb, and every downstream pour-relief and
     routing rule already assume. HISTORICAL, and kept because it is the reason
     this part number exists: under the previously-specified code 12 the part has
     EIGHT leads whose coil and contact INTERLEAVE ALONG THE PACKAGE (CONTACT at
     positions 1 and 14 tied, 7 and 8 tied, coil on the inner pins), giving a
     2.54 mm adjacent-pin boundary and NOT a 7.62 mm row boundary — so on the
     4-pad land it shorted 5V_KEY_RELAY to U_SEL_BUS and every ULN2803 output to
     its keypad line, and left the coil with no holes at all. The board's shape
     was designed for code 13 all along; code 12 was the typo."
  - "DO NOT re-map a code-12 part onto this land. -12L and -12D are a DIFFERENT
     pin-out code, not a diode option on this one; the leads are in different
     places. If an internal-diode variant is wanted, the -13-code diode option
     must be read off DS p.4 and confirmed before it is ordered — see
     `sourcing.alternates`, which is WITHDRAWN for exactly this reason."
  - "coil is non-polar on the -13L (a bare reed coil, no internal diode), so
     COIL_A/COIL_B are interchangeable electrically; pin 1 of the LAND
     (= DIP lead 2) is held at +RELAY_5V by convention so that a future polarised
     diode option has a defined orientation to be checked against."
  - "adjacent-relay magnetic coupling: DS p.3 handling note; 15.24mm super-column pitch + one-at-a-time firmware default"
  - "ROW-PITCH GEOMETRY (measured, cooksense v1.1 D7 2026-07-23): the 15.24mm coupling pitch is a rot0/VERTICAL-orientation figure (6.5mm body / 9.93mm bbox across the pitch axis). In a rot90 HORIZONTAL row (contacts N / coils S) the 19.3mm body / 19.90mm courtyard lies ALONG the row: minimum mechanical pitch ~20mm, and 15.24mm overlaps courtyards by 4.66mm — impossible. Do not commission a rot90 row below 20mm pitch."
  - "rot0 ISOLATION COMB (cooksense v1.1): with vertical relays the coil/contact isolation boundary runs N-S BETWEEN the pin columns (7.62mm c-c / 6.12mm pad-edge). Alternate rot180/rot0 in PAIRS so contact columns of adjacent relays face each other: the isolated domain pockets between pairs (and at row ends) while coil-coil gaps carry logic — no logic net ever crosses a pocket; the DS p.3 alternate-orientation note doubles as the coupling mitigation for the anti-parallel adjacent coils."
