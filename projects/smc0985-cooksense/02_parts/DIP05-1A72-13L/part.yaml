pins:                       # pin-out code 13, DS p.3 "Pin-Out (Top View)" sub-figure 13
  # ===================================================================
  # PART CHANGED -12L -> -13L, 2026-07-28, user decision (route 2).
  #
  # This is a PART-NUMBER correction, not a redesign. The board was
  # always DESIGNED for a row-split relay: ADR-0002 asserts "the
  # isolation boundary runs between the columns", the footprint's own
  # descr said so, and the v1.1 isolation-comb repack is built on it.
  # Sub-figure 13 IS that geometry. Sub-figure 12 -- the code that was
  # specified -- is not, and specifying it is what broke the board.
  #
  # Sub-figure 13, re-rendered at 300 dpi and read directly: FOUR leads.
  #   CONTACT (switch)  14 <-> 8   -- both on the EAST column
  #   COIL              2  <-> 6   -- both on the WEST column
  # Coil-to-contact separation is therefore the 7.62 mm COLUMN spacing,
  # which is what ADR-0002 and every downstream pour-relief and routing
  # rule already assume. Those rules become TRUE rather than void.
  #
  # For contrast, and why -12 had to go: under code 12 the part has
  # EIGHT leads, 1<->14 tied as one CONTACT node and 7<->8 as the other,
  # with the coil on the inner pins. On the old 4-pad land that shorted
  # 5V_KEY_RELAY to U_SEL_BUS and every ULN2803 output to its keypad
  # line, and left the coil with no holes at all.
  # ===================================================================
  2:  COIL_A                  # west column, one pitch in from the pin-1 end
  6:  COIL_B                  # west column, one pitch in from the far end
  8:  CONTACT_B               # east column, far end
  14: CONTACT_A               # east column, pin-1 end
limits: {coil: "5V nom / 7.5V max, 500R +-10%, pull-in <=3.5V, drop-out >=0.75V (DS p.2)", contact: "model 72: 10W, 200V, 0.5A switch / 1.0A carry (DS p.1)", dielectric_coil_contact: "1.5 kVDC min EN60255-27 (DS p.3) -- THE PART's internal rating; see the ISOLATION-GEOMETRY gotcha, the PCB geometry it was paired with was wrong", t_op: "-20..+70C"}
electrical:
  # COIL, DS p.2 "Coil Data (at 20 C)", Contact Form 1A / Switch Model 72 /
  # Pin-Out 10,11,12,13 / 5 VDC row. NOTE THE REFERENCE TEMPERATURE IS 20 C,
  # NOT 25 C — every derate below is anchored there, because that is what the
  # datasheet's own footnote is anchored to.
  coil_v_nom: 5.0
  coil_v_max: 7.5
  coil_r_typ_ohm: 500            # +-10%  -> 450 .. 550 at 20 C
  coil_r_tol_pct: 10
  coil_p_nom_mW: 50
  v_pullin_max_20C: 3.5          # MAX (the must-operate voltage), DS p.2
  v_dropout_min_20C: 0.75        # MIN, DS p.2
  tc_pct_per_K: 0.4              # DS p.2 footnote, VERBATIM: "The Pull-In,
                                 # Drop-Out Voltage and Coil Resistance will
                                 # change at rate of 0.4% per K"
  t_op: [-20, 70]
  source: "Standex DIP-series datasheet Version 03 (01 Aug 2025), p.2 Coil Data
    table + its 0.4%/K footnote; operating temperature p.3 Relay Data."

gotchas:
  - "*** PULL-IN MARGIN GOES NEGATIVE INSIDE THE DECLARED -20..+70 C ENVELOPE.
     (red-team TOPO P1-2, computed 2026-07-29 — before that date this margin was
     computed NOWHERE in the tree.) ***
     The DS footnote is not decoration: V_PI(T) = 3.500 x (1 + 0.004 x (T - 20)),
     referenced to 20 C, NOT 25 C. Driver is a ULN2803A low-side Darlington whose
     V_CE(sat) at the ~7 mA coil current is 0.67 V TYP / ~0.88 V worst case
     (02_parts/ULN2803ADWR, SLRS049G Fig.1 digitized — see that dossier's
     gotcha). Rail floor is 5V_KEY_RELAY vout_min = 4.740 V (power_tree.yaml).
       margin(T) = 4.740 - V_CE(sat) - V_PI(T)
         T      V_PI     margin @0.67 TYP   @0.88 w-c   @1.10 hard bound
        -20 C   2.940 V      +1.130 V        +0.920 V      +0.700 V
        +25 C   3.570 V      +0.500 V        +0.290 V      +0.070 V
        +50 C   3.920 V      +0.150 V        -0.060 V      -0.280 V
        +70 C   4.200 V      -0.130 V        -0.340 V      -0.560 V
     NEGATIVE AT +70 C EVEN ON THE TYPICAL DRIVER DROP. The 0.4%/K IS the coil's
     copper tempco (+0.39%/K), so the current view is the SAME fact, not a second
     independent derate: pull-in is an ampere-turn condition, I_PI = 3.5/500 =
     7.00 mA and TEMPERATURE-INDEPENDENT, while the delivered current FALLS as
     the copper heats — 9.64 / 7.98 / 7.29 / 6.81 mA at -20/+25/+50/+70 C on
     nominal 500R and the 0.67 V typ drop (8.32 / 6.88 / 6.28 / 5.87 mA on 550R
     and 0.88 V). At +70 C 6.81 mA < 7.00 mA must-operate: the current view and
     the voltage view agree, and BOTH say the relay is not guaranteed to close.
     HOT IS THE WORST CORNER, and it is worst in both terms at once (coil R up,
     so V_PI up AND I down). -20 C is comfortable; do not let a bench test at
     room temperature stand in for the hot corner.
     K_STOP IS THE ONE RELAY THAT IS *NOT* EXPOSED, and it is worth knowing why:
     it does not hang off a Darlington. Its coil sits on the ungated 5V_STOP
     (vout_min 4.754 V, a 0R link) and is sunk by a dedicated 2N7002 (Q_STOPDRV),
     whose V_DS at ~7 mA is ~0.10 V — margin +1.714 / +1.084 / +0.734 / +0.454 V
     at -20/+25/+50/+70 C, confirming the review's '+450 mV at 70 C'. CAVEAT,
     stated because it is the same class of gap this finding was: the 2N7002
     datasheet is NOT COMMITTED to 02_parts/2N7002 either (its `datasheet.url`
     is an LCSC product page, not a PDF), so that 0.10 V is an ESTIMATE, not a
     cited maximum. It is not load-bearing here — even at an absurdly pessimistic
     0.50 V of V_DS the +70 C margin is still +0.054 V — but the number should be
     cited before anyone leans on it.
     NOT A FIX, JUST THE ARITHMETIC — this gotcha records the finding; the
     remedy (raise the coil rail, drop the driver saturation, or narrow the
     temperature envelope) is a topology decision and is NOT made here."
  - "ISOLATION GEOMETRY under code 13 — the claim ADR-0002 makes is TRUE, and it
     is true only because the part changed. COIL_A=DIP2 and COIL_B=DIP6 are both
     on the WEST column; CONTACT_A=DIP14 and CONTACT_B=DIP8 are both on the EAST
     column. Coil-to-contact separation on the land is therefore the 7.62 mm
     COLUMN spacing (6.12 mm pad-edge, track-aware measured), which is exactly
     what ADR-0002, the v1.1 isolation comb, and every downstream pour-relief and
     routing rule already assume. HISTORICAL, and kept because it is the reason
     this part number exists: under the previously-specified code 12 the part has
     EIGHT leads whose coil and contact INTERLEAVE ALONG THE PACKAGE (CONTACT at
     positions 1 and 14 tied, 7 and 8 tied, coil on the inner pins), giving a
     2.54 mm adjacent-pin boundary and NOT a 7.62 mm row boundary — so on the
     4-pad land it shorted 5V_KEY_RELAY to U_SEL_BUS and every ULN2803 output to
     its keypad line, and left the coil with no holes at all. The board's shape
     was designed for code 13 all along; code 12 was the typo."
  - "DO NOT re-map a code-12 part onto this land. -12L and -12D are a DIFFERENT
     pin-out code, not a diode option on this one; the leads are in different
     places. If an internal-diode variant is wanted, the -13-code diode option
     must be read off DS p.4 and confirmed before it is ordered — see
     `sourcing.alternates`, which is WITHDRAWN for exactly this reason."
  - "coil is non-polar on the -13L (a bare reed coil, no internal diode), so
     COIL_A/COIL_B are interchangeable electrically; pin 1 of the LAND
     (= DIP lead 2) is held at +RELAY_5V by convention so that a future polarised
     diode option has a defined orientation to be checked against."
  - "adjacent-relay magnetic coupling: DS p.3 handling note; 15.24mm super-column pitch + one-at-a-time firmware default"
  - "ROW-PITCH GEOMETRY (measured, cooksense v1.1 D7 2026-07-23): the 15.24mm coupling pitch is a rot0/VERTICAL-orientation figure (6.5mm body / 9.93mm bbox across the pitch axis). In a rot90 HORIZONTAL row (contacts N / coils S) the 19.3mm body / 19.90mm courtyard lies ALONG the row: minimum mechanical pitch ~20mm, and 15.24mm overlaps courtyards by 4.66mm — impossible. Do not commission a rot90 row below 20mm pitch."
  - "rot0 ISOLATION COMB (cooksense v1.1): with vertical relays the coil/contact isolation boundary runs N-S BETWEEN the pin columns (7.62mm c-c / 6.12mm pad-edge). Alternate rot180/rot0 in PAIRS so contact columns of adjacent relays face each other: the isolated domain pockets between pairs (and at row ends) while coil-coil gaps carry logic — no logic net ever crosses a pocket; the DS p.3 alternate-orientation note doubles as the coupling mitigation for the anti-parallel adjacent coils."
