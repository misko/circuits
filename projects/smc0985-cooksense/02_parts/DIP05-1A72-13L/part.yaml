footprint: cooksense:Relay_StandexDIP_1A_pinout13
escape: {style: leaded, pitch: 2.54, tier_required: jlc_2layer_default, checked: escape_check 2026-07-22}
pins:                       # pin-out code 13, DS p.3 "Pin-Out (Top View)" sub-figure 13
  # ===================================================================
  # PART CHANGED -12L -> -13L, 2026-07-28, user decision (route 2).
  #
  # This is a PART-NUMBER correction, not a redesign. The board was
  # always DESIGNED for a row-split relay: ADR-0002 asserts "the
  # isolation boundary runs between the columns", the footprint's own
  # descr said so, and the v1.1 isolation-comb repack is built on it.
  # Sub-figure 13 IS that geometry. Sub-figure 12 -- the code that was
  # specified -- is not, and specifying it is what broke the board.
  #
  # Sub-figure 13, re-rendered at 300 dpi and read directly: FOUR leads.
  #   CONTACT (switch)  14 <-> 8   -- both on the EAST column
  #   COIL              2  <-> 6   -- both on the WEST column
  # Coil-to-contact separation is therefore the 7.62 mm COLUMN spacing,
  # which is what ADR-0002 and every downstream pour-relief and routing
  # rule already assume. Those rules become TRUE rather than void.
  #
  # For contrast, and why -12 had to go: under code 12 the part has
  # EIGHT leads, 1<->14 tied as one CONTACT node and 7<->8 as the other,
  # with the coil on the inner pins. On the old 4-pad land that shorted
  # 5V_KEY_RELAY to U_SEL_BUS and every ULN2803 output to its keypad
  # line, and left the coil with no holes at all.
  # ===================================================================
  2:  COIL_A                  # west column, one pitch in from the pin-1 end
  6:  COIL_B                  # west column, one pitch in from the far end
  8:  CONTACT_B               # east column, far end
  14: CONTACT_A               # east column, pin-1 end
limits: {coil: "5V nom / 7.5V max, 500R +-10%, pull-in <=3.5V, drop-out >=0.75V (DS p.2)", contact: "model 72: 10W, 200V, 0.5A switch / 1.0A carry (DS p.1)", dielectric_coil_contact: "1.5 kVDC min EN60255-27 (DS p.3) -- THE PART's internal rating; see the ISOLATION-GEOMETRY gotcha, the PCB geometry it was paired with was wrong", t_op: "-20..+70C"}
gotchas:
  - "ISOLATION GEOMETRY — THE BOARD-LEVEL CONSEQUENCE, and it is bigger than the
     short. This part's coil and contact INTERLEAVE ALONG THE PACKAGE, they are
     NOT split between the two rows: CONTACT_A at position 1, COIL_A at position
     2, COIL_B at position 6, CONTACT_B at position 7. So the coil-to-contact
     separation on the LAND is 2.54 mm between ADJACENT PINS at each end of the
     package -- NOT the 7.62 mm row separation. ADR-0002 and this file's own
     `layout:` block both asserted 'the isolation boundary runs BETWEEN the rows'
     and every pour-relief and routing rule downstream was built on that. Those
     rules are UNSUPPORTED and must be re-derived. This is why the fix is not a
     footprint swap: the v1.1 isolation-comb repack, which is the shape of the
     whole board, was designed around a 7.62 mm boundary that does not exist."
  - "The 4-lead variant IS real, but it is sub-figure 13 (leads at 14/8/2/6), a
     DIFFERENT pin-out code. If a 4-lead part is wanted, order the -13 code and
     re-derive; do not re-map this one."

  - "pin-out 12 = coil on pins 1/7 row, contact on pins 8/14 row: the isolation boundary runs BETWEEN the rows (ADR-0002)"
  - "coil is non-polar on -12L; keep pin 1 = +RELAY_5V so the -12D alternate (internal diode, cathode at pin 1 side per DS p.4 D(Q) figure) drops in"
  - "adjacent-relay magnetic coupling: DS p.3 handling note; 15.24mm super-column pitch + one-at-a-time firmware default"
  - "ROW-PITCH GEOMETRY (measured, cooksense v1.1 D7 2026-07-23): the 15.24mm coupling pitch is a rot0/VERTICAL-orientation figure (6.5mm body / 9.93mm bbox across the pitch axis). In a rot90 HORIZONTAL row (contacts N / coils S) the 19.3mm body / 19.90mm courtyard lies ALONG the row: minimum mechanical pitch ~20mm, and 15.24mm overlaps courtyards by 4.66mm — impossible. Do not commission a rot90 row below 20mm pitch."
  - "rot0 ISOLATION COMB (cooksense v1.1): with vertical relays the coil/contact isolation boundary runs N-S BETWEEN the pin columns (7.62mm c-c / 6.12mm pad-edge). Alternate rot180/rot0 in PAIRS so contact columns of adjacent relays face each other: the isolated domain pockets between pairs (and at row ends) while coil-coil gaps carry logic — no logic net ever crosses a pocket; the DS p.3 alternate-orientation note doubles as the coupling mitigation for the anti-parallel adjacent coils."
asserts:
  - {assert: not_on_assembly_bom,
     why: "The twelve K_* reeds are the ORIGINAL A-POP defect on this board: cooksense
       v1.0 AND v1.1 both sealed with these as CPL placement rows carrying a BLANK LCSC,
       i.e. JLC was instructed to machine-place a part it cannot source. JLC catalog
       stock is 0 on every DIP05-1A72 variant (measured 2026-07-25) and the package is
       THT on an SMT-only order. Declared not_assembled (not_in_catalog) with
       exclude_from_pos_files; this assert makes the BOM/CPL absence gradeable rather
       than trusting the placement pattern to have been applied."}
verified: "pin map read from DS p.3 Pin-Out sub-figure 13, re-rendered at 300 dpi 2026-07-28 (code 13) + p.4 option figures; coil/contact data p.1-2; dielectric p.3 Relay Data table - 2026-07-19"
layout:                          # P-LAYOUT: reed relay (mains-switching stage, DO-NOT-SUBSTITUTE)
  source: "Standex DIP-series datasheet (Version 03, 01 Aug 2025) p.3 'Handling &
    Assembly Instructions' + p.3 Pin-Out (Top View, code 12) + p.4 Options figures.
    Real rules: (a) external magnetic fields and ADJACENT relays in high-density
    matrices influence the relay's electrical characteristics and must be taken into
    consideration; (b) switching inductive/capacitive loads makes V/I peaks that
    damage the relay - protective circuits required; (c) a coil suppression diode
    reduces total switching cycles, worst at high voltage; (d) wave-solder max
    260C/5s, aqueous rinse OK with proper drying (fully sealed)"
  reviewed: "2026-07-22"
  notes: |
    Datasheet handling rules are MIN-SPACING / ISOLATION / process, not keep-short
    spans, so no keep_short budget (honest):
    (1) Magnetic coupling: space adjacent reed relays apart / alternate orientation.
        This board already fixes the 15.24mm super-column pitch + one-at-a-time
        firmware default (gotcha); a magnetic-shield option (-12M/Q/R/S, p.4) exists
        if a tighter matrix is ever forced. Keep coils clear of other magnetics.
    (2) Isolation boundary runs BETWEEN the rows: coil pins 1/7 vs contact pins 8/14,
        1.5kVDC coil/contact (EN60255-27, ADR-0002) - hold creepage/clearance across
        that gap, route NO net through it, pour reliefs respect the boundary.
    (3) Fly-back: the coil is an inductive load - the ULN2803 COM clamp on RELAY_5V is
        the protective circuit the datasheet demands; keep the coil->driver loop tight.
    (4) Process: THT low-profile DIP on the DIP-14 corner grid; wave/hand-solder within
        the 260C/5s limit, wash-and-dry compatible.
