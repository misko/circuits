mpn: SN74HC14DR
manufacturer: Texas Instruments
type: hex_schmitt_inverter
datasheet:
  doc_id: SCLS085
  url: https://www.ti.com/lit/ds/symlink/sn74hc14.pdf
  fetched: 2026-07-19 (standard pinout; re-verified in pin review)
package: SOIC-14 (D)
footprint: Package_SO:SOIC-14_3.9x8.7mm_P1.27mm
escape: {style: leaded, pitch: 1.27, tier_required: jlc_2layer_default, checked: escape_check 2026-07-22}
pins:
  1: 1A
  2: 1Y
  3: 2A
  4: 2Y
  5: 3A
  6: 3Y
  7: GND
  8: 4Y
  9: 4A
  10: 5Y
  11: 5A
  12: 6A_Y   # placeholder - see gotcha
  13: 6A
  14: VCC
limits: {vcc: "2-6V"}
gotchas:
  - "pin 12 = 6Y (output), pin 13 = 6A (input) - name key kept unique; symbol uses 12=6Y"
  - "ALL SIX GATES ARE USED — corrected 2026-07-28 (v1.6 declared gap 22). This line read
    'unused inputs 3A/4A/5A/6A tied GND, outputs NC' and was a v1.0-era survivor: it was
    already false by v1.2, when the mode and door inputs joined the E-stop on this package.
    As built the part is THREE double-inverter buffers, one per discrete safety input:
      E-STOP  ESTOP_RAW -> 1A(1) , 1Y(2)=ESTOP_NI -> 2A(3) , 2Y(4)  = ESTOP_OK
      MODE    MODE_RAW  -> 3A(5) , 3Y(6)=MODE_NI  -> 4A(9) , 4Y(8)  = MODE_AUTO_HW
      DOOR    DOOR_RAW  -> 5A(11), 5Y(10)=DOOR_NI -> 6A(13), 6Y(12) = DOOR_OK
    THERE IS NO UNUSED INPUT TO TIE and no spare gate to reach for. A future revision needing
    an inverter needs another package. (v1.7 also gives all three OUTPUTS a restrictive
    default — R_ESTOPOKPD / R_MODEHWPD / R_DOOROKPD, ADR-0019 — because a dead or unfitted
    U_SCHM floats all three permissions at once and the expander readbacks sample the SAME
    nets, so software has no independent cross-check.)"
verified: "TI SCLS085 D pin table (standard hex inverter); pin review re-checks - 2026-07-19;
  gate-usage line re-derived from the netlist and corrected - 2026-07-28"
layout:                          # P-LAYOUT: hex Schmitt inverter (E-stop de-bounce chain, ADR-0003) - layout-agnostic apart from VCC bypass + UNUSED-INPUT ties
  source: "TI SN74HC14 datasheet SCLS085L sec.8.2.2 Detailed Design Procedure #1
    (decoupling cap VCC-GND placed physically close to the device and electrically
    close to BOTH the VCC and GND pins) + #2 (keep output cap load <=70pF via short
    traces) + sec.8.2.1.2 Input Considerations (unused inputs terminated to VCC/GND,
    direct or via ~10k; Schmitt inputs have NO transition-rate requirement and reject
    noise by hysteresis) + sec.8.3 PSR (0.1uF bypass as close to the power terminal as
    possible, Fig 8-3) + sec.8.4.1 Layout Guidelines (multi-channel logic inputs must not float)"
  reviewed: "2026-07-22"
  keep_short:
    - {net: VCC, max_span_mm: 5, why: "0.1uF VCC(14)-GND(7) bypass hard against the package, electrically close to BOTH pins (DS sec.8.2.2 #1 / sec.8.3)"}
  notes: "Honest: a jelly-bean hex inverter, layout-agnostic apart from the VCC bypass.
    The sec.8.2.1.2 / sec.8.4.1 unused-input rule is SATISFIED VACUOUSLY on this board —
    all six gates are used (see gotcha), so there is no input to tie and nothing for the
    floorplan to honour beyond the bypass. The Schmitt input is used for exactly its
    hysteresis/slow-edge tolerance - the E-stop chain (raw->1A, 1Y->2A, 2Y=ESTOP_OK)
    cleans a slow/noisy contact, so no input-slew concern. Keep each used output run
    short (<=70pF load, sec.8.2.2 #2). Coarse 1.27mm SOIC-14 - no escape/fanout wall."
sourcing:
  lcsc: C6820
  note: "genuine TI, 89125 stock 2026-07-19. ESTOP_OK path is hardware (ADR-0003)."
