asserts:
  - {assert: value, equals: 10k, tolerance_pct: 1,
     why: "THREE DIFFERENT JOBS RIDE ON THIS ONE VALUE and none of them fails
       loudly if it moves. (1) R_REF0..R_REF7 are the TOP LEG of the eight
       thermistor dividers into the MCP3208 (3V3_ANALOG -> R_REF{n} -> TH_{ch});
       the divider ratio IS the temperature transfer function, so a substituted
       value re-scales every channel's reading and the board reports wrong
       temperatures while every gate stays green. (2) R_DOORPD / R_ESTOPPD /
       R_MODEPD are the DEFAULT-SAFE pull-downs on the door, E-stop and
       mode interlock inputs -- an open contact must read LOW, and these are what
       makes it read LOW; they are sized against the Schmitt input leakage and the
       contact wetting current. (3) R_OE holds the '595 output-enable interlock
       (SR_OE_N) at its safe default. The remaining refs (R_BID0/1 board-ID straps,
       R_EXPRST expander reset, R_OS2 one-shot RC, R_TEMPOK comparator pull-up)
       are logic-level and tolerant, but they share the row."}
gotchas:
  - "THIS ENTRY EXISTS BECAUSE THE PART IT REPLACES WENT TO ZERO. cooksense v1.0-v1.4
     shipped these 17 refs as C25744 (UNI-ROYAL 0402WGF1002TCE, BASIC library). The JLC
     parts API, read live 2026-07-27, returns `stockCount: 0` and `minPurchaseNum: 5268`
     for that code. This is the SAME code and the SAME shortage that forced
     usb-hub-3s-v3 v1.11 hours earlier, on a different board, for a different circuit
     -- so it is a CATALOG event, not a cooksense one. C25744 was the only
     basic-library 10k 0402, so every replacement is an Extended part and the one-time
     feeder fee is a property of the shortage, not of the choice."
  - "DROP-IN, AND THE CLAIM IS CHECKABLE RATHER THAN ASSERTED: JLC's catalog `describe`
     string for C60490 is CHARACTER-IDENTICAL to C25744's, compared AS STRINGS by
     scripts/ident (both read live 2026-07-27) ---
     `-55C~+155C 10kOhm 50V 62.5mW Thick Film Resistor +-1% +-100ppm/C 0402 Chip
     Resistor - Surface Mount ROHS`. Same package (`componentSpecificationEn` 0402 on
     both), value, tolerance, tempco, power and voltage. `leastPatchNumber` is 20 on
     BOTH, so the minimum-order step did not move either. No copper, footprint,
     netlist or CPL change follows: the v1.5 board .kicad_pcb is md5-identical to
     v1.4's, 420445b5141dd1111eccab038c68511b."
  - "PINNED AT SOURCE, NOT LEFT TO THE PARTS ENGINE. v1.0-v1.4 wrote these refs as a
     bare `<resistor resistance=\"10k\" footprint=\"0402\">` and let tscircuit's parts
     engine choose the code -- which is how a catalog snapshot became a BOM line
     nobody decided. The .tsx now carries `supplierPartNumbers={{ jlcpcb: [\"C60490\"] }}`
     on all 17, so a rebuild cannot silently re-choose."
  - "EXTENDED-TIER, so the ORDER-DAY STOCK RECHECK IS NOT OPTIONAL on this line the way
     it was for a basic part. And the recheck is NECESSARY, NOT SUFFICIENT: usb-hub-3s-v3
     v1.10 sealed with C25744 recorded at `\"status\": \"OK\", \"stock\": 291` and JLC's
     ASSEMBLY uploader refused the line hours later. `stockCount` is LCSC CATALOG stock
     and JLC allocates assembly feeders from a different pool."
  - "qty 17/board = 85 for the 5-board order. If C60490 also runs dry, any 10k +-1%
