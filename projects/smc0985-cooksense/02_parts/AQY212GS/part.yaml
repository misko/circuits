gotchas:
  - "1 Form A (SPST-NO): output 3-4 closes (~0.34 ohm) while the LED is driven; the few-ohm Ron is absorbed by RKEY on the selector path (ADR-0006)."
  - "INPUT is polarized (1=anode, 2=cathode); OUTPUT 3/4 is non-polar AC/DC. Do not swap the LED pair."
  - "Product SEAL marks only '212G' (AQY and S omitted per datasheet note); order-time part = AQY212GS(tube)/GSX(reel, picked 1/2 side)/GSZ(reel, picked 3/4 side)."
  - "Maintain the 1500Vrms I/O isolation barrier: keep INPUT (1/2) copper and OUTPUT (3/4) copper apart; no pour/trace crossing under the body."
verified: "pin map + output config 1a read from Panasonic AQY212GS datasheet p.1 FEATURES diagram + p.4 SCHEMATIC AND WIRING DIAGRAMS; ratings p.1, electrical p.2, land p.4 - 2026-07-22"
layout:                     # P-LAYOUT: multi-pin active (SSR). Real rule = isolation
                            # barrier; it is NOT a switching-power part (no I-budget).
  source: "Panasonic AQY212GS datasheet RATING (Viso 1500Vrms) + DIMENSIONS p.4 recommended mounting pad + GU-series application (Form A dry switch)"
  reviewed: "2026-07-22"
  keep_short:
    - {net: LED_DRIVE, max_span_mm: 6, why: "LED series current-limit R adjacent to pin1 anode; IF 5-10mA from the selector driver"}
  notes: >
    Signal-level 1 Form A selector switch (dry contact, Ron absorbed by RKEY) - no
    high-current net-span budget applies. The governing layout rule is the 1500Vrms
    I/O isolation barrier: place input pins 1/2 (LED, logic side) and output pins
    3/4 (MOSFET, switched side) on opposite package edges with NO copper pour or
    trace bridging beneath the body, preserving creepage across the barrier.
    Recommended land: pads 1.2x0.8mm at 2.54mm pitch, ~6.0mm row span (datasheet p.4).
sourcing:
  lcsc: C719745            # AQY212GS (tube); JLCPCB BASIC part, "SOP-4-2.54mm"
  alternates: [C415471, C129283]   # AQY212GSX (reel, picked 1/2-pin side); AQY212GSZ (reel, picked 3/4-pin side)
  note: "SELECTOR-RELAY ALTERNATE (ADR-0006): default selector = DIP05-1A72-13L reed; PRESS & STOP stay reed regardless. AQY212GS is a Panasonic JLC BASIC part (C719745). For JLC SMT reel feed prefer the tape&reel AQY212GSX(C415471)/AQY212GSZ(C129283) over the tube AQY212GS. In stock 2026-07-22 (~$0.73 GS / ~$0.88 GSX; do NOT commit stock). Order-day stock check per ADR-0006."
