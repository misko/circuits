    #      PEAK, both heaters @200 mW coincident       0.4990 A  1297.4   -2.6 FAIL
    #      PEAK, heaters STAGGERED (one at a time)     0.4090 A  1327.0  +27.0 PASS
    #
    #    (The peak rows are built on the TRUE 116.859 mA sum with the two
    #    10 mA duty-averaged heater terms swapped for the real 100 mA ones —
    #    not on the 0.200 declaration, because stacking the x1.5 design margin
    #    on top of a stack of datasheet maxima would be double-counting.)
