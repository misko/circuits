    # from a clone vendor's AMS1117 curve: C6186's componentBrandEn is "Advanced
    # Monolithic Systems" (read live 2026-07-27), so ds1117 is the authoritative
    # document and another die's curve is the adjacent-property error.
    #
    # The number declared is the ONLY CITED one, at 4x this rail's declared load
    # and 6.9x its derived one. It is conservative by an UNQUANTIFIED margin.
    # Under the OLD 4.5 V envelope it FAILED — headroom 4.500 - 3.399 = 1101 mV
