    #    UPWARD: the itemised 3V3 load rose 0.3 -> 116.9 mA of cited terms
    #    (the old 0.30 A was a round number over a list of part FAMILIES,
    #    ~16x the on-board logic it claimed to cover, and it omitted rails
    #    4.6x larger than that logic), and the itemised series resistance rose
