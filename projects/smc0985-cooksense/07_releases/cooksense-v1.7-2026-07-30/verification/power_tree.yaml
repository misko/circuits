    # sum finally counts the board (ADR-0027):
    #   headroom = 4.728 - 3.399 = 1329 mV  vs  dropout 1300 mV  -> PASS by 29 mV
    # on the fully-stacked worst case (lowest sanctioned supply x highest-trimmed
