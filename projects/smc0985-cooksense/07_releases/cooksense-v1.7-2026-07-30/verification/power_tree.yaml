    # *** THE DECLARED OPERATING AMBIENT IS 65 C (ADR-0029, USER DECISION
    # *** 2026-07-30). THE GRADED DERATING BELOW IS DELIBERATELY LEFT AT THE
    # *** 75 C CORNER. THOSE TWO SENTENCES ARE BOTH TRUE AND THE SECOND ONE IS
    # *** INTENTIONAL — READ THE NEXT PARAGRAPH BEFORE "FIXING" EITHER.
    #
    # BRIEF.md line 117, verbatim: "enclosure <=50 / 55 / 65 / 75" (preferred /
    # warn / stop / HARD), and TH_ENCLOSURE is one of the eight monitored ADC
    # channels precisely because the board lives in that enclosure. ADR-0014's
    # OPEN item 2 records that the board's own thermal zone has never been
    # declared. v1.0-v1.7-staging took the enclosure's HARD 75 C rung as the
    # declaration, on the ground that it invents no fact. ADR-0028 then showed
    # that at 75 C the CITABLE 7.92 C margin below is optimistic by a term worth
    # 1.55...4.65 C — 20-59 % of itself — and DELIBERATELY DID NOT CHOOSE an
    # envelope (its Decision 6: an operating restriction on a product belongs to
    # whoever owns the enclosure). **The user chose 65 C — the BRIEF's own
    # `stop` rung — plus a MANDATORY bench gate (ORDER_README §7b). ADR-0029.**
    #
    # THE LADDER, both columns regenerable from the constants above:
    #
    #   Ta      package PD_max = (125-Ta)/90   available to the pass element
    #   50 C          833.3 mW                        775.6 mW
    #   55 C          777.8 mW                        720.0 mW
    #   65 C          666.7 mW                        608.9 mW   <- DECLARED
    #   75 C          555.6 mW                        497.8 mW   <- SURVIVE, and
    #                                                    the GRADED key below
    #
    # **`pdiss_max_mw` STAYS AT 497 AND THAT IS THE POINT (ADR-0029 Decision 4).**
    # At the declared 65 C the arithmetically correct derating is 608 mW. Moving
    # the key there would be defensible and it is NOT DONE, because the gate was
    # never red — PD 409.8 mW against 497 is 82.5 % and E-TOPO PASSES — so the
    # only thing the move would buy is a LOOSER CEILING. This repo has ratchet
    # FLOORS and no CEILINGS; narrowing a declared envelope must not become the
    # mechanism by which a machine gate is weakened, or the envelope is just a
    # knob to reach for when a gate goes red. Holding 497 keeps the gate
    # enforcing Tj <= 125 C at the SURVIVE corner, which is strictly stronger
    # than enforcing it at the declared one. The declared corner is NOT
    # ungraded: ADR-0029's bound `LDO_TJ_DECLARED_AMBIENT` regenerates it from
    # these same keys and prints 999 if the declaration drifts back to 75.
    #
    # THE SECOND COLUMN SUBTRACTS THE LDO'S OWN QUIESCENT BURN, WHICH E-TOPO's
    # PD FORMULA CANNOT SEE. E-TOPO computes PD = (Vin_max - Vout_min) x Iout,
    # i.e. the PASS-ELEMENT dissipation only. The AMS1117's ground-pin current
    # is not in that product and is not small: ds1117 ELECTRICAL
    # CHARACTERISTICS, "Quiescent Current, AMS1117-1.5/-1.8/-2.5/-2.85/-3.3/
    # -5.0, (VIN - VOUT) = 1.5V: 5 mA typ, **11 mA max**". It burns
    # Vin_max x Iq_max = 5.250 x 0.011 = 57.75 mW inside the same package. So
    # the ceiling handed to the gate is the package budget MINUS that term:
    #
    #   pdiss_max_mw = (125 - 75)/90 x 1000 - 5.250 x 11 = 555.6 - 57.8 = 497.8
    #
    # rounded DOWN. Deratings belong here rather than in a new key because
    # `rails[].pdiss_max_mw` is the override power_topology.py documents for
    # exactly this ("a board-specific derating (a hot ambient, no copper under
    # the part)"), and it is the ONLY graded home available — G-ORPHAN fails
    # any key this file declares that no gate reads, and the contract template
    # that would have to carry a `theta_ja:`/`ambient_c:` row lives in skills/.
    # The skill patch that makes the derating first-class is proposed in
    # 06_build/staging/cooksense-v1.7/verification/owed_skill_patches.md.
    #
    # WORKED EXAMPLE — REGENERATED FROM THE GRADED KEYS, NOT TYPED (canon
    # M-BOUND). The `worked_example:` line below is the ONLY second copy of
    # these four numbers anywhere in the tree, and ADR-0028's bound
    # `LDO_TJ_WORKED_EXAMPLE` re-derives all four FROM `rails[3V3]`'s OWN
    # `vin_max` / `vout_min` / `iout_max_A` in this file and prints 999 if the
    # line and the keys disagree. adr_bound_provenance.py then FAILS on B-REGEN.
    #
    # THAT GATE EXISTS BECAUSE THIS EXAMPLE READ THE WRONG KEY FOR FOUR ROUNDS.
    # v1.0-v1.7 computed it at 0.150 A — which is NOT this rail's declared
    # current and NOT its derived one (0.1169 A). It is
    # `linear_rails[5V_KEY_RELAY].iout_max_A`, a key `power_topology.py` does
    # not read, sitting 230 lines below in the section this file itself labels
    # "Documentation-only (ignored by power_topology.py)". So the file published
    # `Tj 107.9 C (17.1 C margin)` while the gate that grades it, ADR-0026,
    # ADR-0027 and `adr_bound_provenance --adr .../0026` all said 117.08 /
    # 7.92 — **the published margin was 2.16x the true one**. It is the SAME
    # ignored key that produced this rail's round-2 P0. A worked example that
    # can read a key the grader does not is a second home for a number, and
    # canon M4 already knows what those do; the bound closes the class.
    #
    #   PD = (vin_max 5.250 - vout_min 3.201) x iout_max_A 0.200 = 409.8 mW
    #        vs pdiss_max_mw 497 -> 82.5 %, PASS
    #   Tj = Ta 75 + (0.4098 + vin_max x Iq_max 0.0578) x theta_JA 90
    #      = 75 + 42.08 = 117.08 C  ->  7.92 C of margin to Tj_max 125 C
    #   worked_example: ta_C=75 iout_A=0.200 pd_mW=409.8 tj_C=117.08 margin_C=7.92
    #
    # ^ THAT LINE IS THE **SURVIVE** CORNER (Ta 75), and `ta_C=75` was added to
    # it 2026-07-30 so it labels its own corner instead of relying on the reader
    # to remember which one it is. ADR-0028's bound LDO_TJ_WORKED_EXAMPLE reads
    # it and is UNCHANGED by the envelope decision, which is exactly why the
    # decision needed no edit to an accepted ADR.
    #
    # THE **DECLARED** CORNER (Ta 65, ADR-0029), same graded keys, same cited
    # constants, regenerated by ADR-0029's bound LDO_TJ_DECLARED_AMBIENT:
    #
    #   Tj = Ta 65 + 42.0795 = 107.0795 C  ->  17.92 C of margin to Tj_max 125 C
    #   declared_envelope_example: ta_C=65 iout_A=0.200 pd_mW=409.8 tj_C=107.08 margin_C=17.92
    #
    # **NEITHER 17.92 NOR 7.92 IS THE HONEST NUMBER — both are the CITABLE form,
    # and the term they omit is named below.** Carrying the board's other
    # 0.958 W (+1.55...+4.65 C, DERIVED by the v1.7 re-gate-3 layout lens across
    # h = 18...6):
    #
    #   Ta 65 (DECLARED):  17.92 citable  ->  16.37 / 15.13 / 13.27  honest
    #   Ta 75 (SURVIVE):    7.92 citable  ->   6.37 /  5.13 /  3.27  honest
    #
    # i.e. **13.3...16.4 C at the declared ambient and 3.3...6.4 C at the survive
    # corner.** That difference — a margin that stays positive at every h in the
    # lens's range versus one that does not clearly do so — is the whole reason
    # the envelope decision was worth taking. The DERIVED term is NOT subtracted
    # from any graded value because it is a model output rather than a citation;
    # it is named here, in ADR-0028 and in ADR-0029, and the bench measurement
    # that retires it is ORDER_README §7b item B5.
    #
    # THE `+3.8 C` DUAL-HEATER EXCURSION THAT USED TO BE ADDED HERE IS DELETED,
    # NOT RE-ARGUED. ADR-0027 Decision 4, shipped in the same directory, says of
    # exactly that figure: "ds1117 publishes no thermal time constant, so the
    # excursion is NOT BOUNDED BY ANY CITED NUMBER and must not be claimed."
    # Its steady-state alternative is +17.8 C (Tj 134.9 C), so the deleted line
    # was the OPTIMISTIC end of an unbounded interval. Decision 3's staggering
    # constraint removes the question instead of answering it: staggered, the
    # peak is +6.6 mA / +0.0135 W over the declaration, i.e. +0.2 C adiabatic /
    # +1.2 C steady state, and Tj stays at 117.1-118.3 C.
    #
    # AND 7.92 C IS ITSELF OPTIMISTIC BY A TERM NOTHING HERE CARRIES — ADR-0028,
    # P1-1 of the v1.7 re-gate-3 layout lens. `Tj = Ta + PD x theta_JA` charges
    # the LDO only its OWN dissipation, but theta_JA is a junction-to-AMBIENT-AIR
    # figure measured with only the device under test dissipating, and ds1117's
    # own Thermal Considerations says "additional heat sources mounted near the
    # device must be considered". This board's other 0.958 W (12 reed coils
    # dominate) raises the copper the tab sinks into by +1.55...+4.65 C, i.e.
    # 20-59 % of the margin above. THE HONEST MARGIN AT Ta 75 C IS 3.3-6.4 C
    # AND AT THE DECLARED Ta 65 C IT IS 13.3-16.4 C (ADR-0029 Decision 2).
    # That term is DERIVED (a lens's thermal-network model), not CITED, so it is
    # NOT subtracted from the graded number here — it is named, ADR-0028 carries
    # the ambient envelope it implies, and **ADR-0029 DECIDES that envelope: the
    # declared operating ambient is 65 C.** The value below is the 75 C derating
    # and is HELD there on purpose — see the ratchet paragraph above.
    pdiss_max_mw: 497

# Documentation-only (ignored by power_topology.py). Each linear rail's envelope.
# 3V3 is NO LONGER LISTED HERE — it moved into `rails:` above, and keeping a
# second copy would be two homes for one fact (they would drift, and the one the
# gate does not read would be the one someone edited).
linear_rails:
  - name: 5V_PROTECTED
    kind: protection_pass          # eFuse pass-through (no conversion)
    vin_min: 4.85                   # ADR-0021 J_PWR spec, AT the connector
    vin_max: 5.25                   # ADR-0021 J_PWR spec, AT the connector
    vout_min: 4.750                 # MEASURED at U_EFUSE.5 by the ADR-0027 nodal
                                    # solve at the declared 0.4024 A board current:
                                    # 4.7502 V, i.e. 99.8 mV below J_PWR (was 4.754
                                    # from a components-only 95.2 mV). The rail is
                                    # NOT one node: at the same instant U_LDO.3 sits
                                    # at 4.7281, J_LOADCELL.1 at 4.7112 and
                                    # Q_COIL.2 / R_STOPRAIL.1 at 4.702 — the spread
                                    # is 48 mV of track between the eFuse output and
                                    # the far end of an unzoned 5V_PROTECTED run.
    vout_max: 5.25                  # unloaded: the series drop is a load term
    ovlo_trip_V: 5.798              # R_OVT 100k / R_OVB 26.1k against SLVSE57C V_OVLO(R)
                                    # 1.20 V typ. WORST CASE over -20..+70 C with +-0.5%
                                    # legs, +-100 ppm/C TCR and I_EN +-0.1 uA: cannot trip
                                    # below 5.3682 V (+118 mV over the 5.25 spec ceiling),
                                    # HAS tripped by 6.2394 V (SMBJ5.0A V_BR min 6.40 at
                                    # 25 C / 6.2819 at -20 C; DIP05 coil max 7.5 V).
                                    # v1.2-v1.6 and the BLOCKED v1.7 staging carried
                                    # 100k/15k = 9.200 V nominal, ABOVE BOTH. ADR-0021.
    iout_max_A: 2.0                # whole-board worst: 12 reed coils ~120mA + logic + sensors
    element: TPS259573DSGR         # eFuse (efuse_ovlo) — current-limit + OVLO cutoff, NOT a converter
    note: "5V SELV in -> polyfuse F1 -> reverse-pol P-FET Q_REV -> eFuse -> 5V_PROTECTED"
  - name: 5V_KEY_RELAY
    kind: gated_load_switch         # AND-chain-gated high-side P-FET (AO3401A Q_COIL)
    vin_min: 4.702                  # MEASURED at Q_COIL.2 (ADR-0027 nodal solve,
                                    # declared 0.4024 A) — NOT 5V_PROTECTED's
                                    # vout_min, because 5V_PROTECTED is track-only
                                    # and 48 mV of it lies between the two nodes
    vin_max: 5.25
    vout_min: 4.691                 # - Q_COIL RDS(on) 73.5 mOhm x 0.15 A = 11 mV
    vout_max: 5.25
    iout_max_A: 0.15               # reed coils ~120mA worst (only 1U+1D+PRESS energised at once)
    element: AO3401A
    note: "5V_PROTECTED -> Q_COIL (gated by the safety AND-chain) -> reed-coil rail"
  - name: 5V_STOP
    kind: always_available_link     # v1.2 (ADR-0011 §4): 0R link, deliberately UNGATED
    vin_min: 4.702                  # MEASURED at R_STOPRAIL.1 (ADR-0027 nodal
                                    # solve, declared 0.4024 A board current)
    vin_max: 5.25
    vout_min: 4.702                 # 0R link
    vout_max: 5.25
    iout_max_A: 0.02               # one DIP05 reed coil (~10mA) + margin
    element: R_STOPRAIL (0R)
    note: "5V_PROTECTED -> R_STOPRAIL -> 5V_STOP: K_STOP's coil rail, present whenever
      the board is powered. NOT gated by the AND-chain/Manual pole — the STOP relay must
      survive the faults that kill 5V_KEY_RELAY (review F3c). Driver = dedicated 2N7002
      Q_STOPDRV from STOP_REQ (100k pull-down), flyback D_KSTOP across the coil."
  - name: 3V3_ANALOG
    kind: ferrite_filtered
    vin_min: 3.201                  # = the 3V3 rail's cited output envelope (`rails:` above)
    vin_max: 3.399
    vout_min: 3.2
    vout_max: 3.399
    iout_max_A: 0.05              # MCP3208 VDD/VREF + thermistor ref dividers + comparator threshold
    element: GZ2012D601TF          # ferrite bead (600R@100MHz) split off 3V3
    note: "3V3 -> ferrite FB1 -> 3V3_ANALOG (ADC ref + thermistor bias, kept off digital noise)"
  # ##########################################################################
  # v1.7 RE-GATE 2: THE FOUR SWITCHED RAILS WERE ONE ENTRY CARRYING ONE ROUND
  # 0.1 A. They are two different loads that differ by 2.8x, and their SUM is
  # now a term of the `rails:` 3V3 entry above (which is what was missing —
  # this key is documentation, and documentation summed by nobody is how the
  # AMS1117 came to be graded on 43 % of its own file's declared load). Every
  # number below is the same cited figure the `rails:` budget uses; if you
  # change one, change both — until the skill patch lands, agreement between
  # these two homes is enforced by nothing but this sentence.
  # ##########################################################################
  - name: 3V3_SW_A / 3V3_SW_B
    kind: switched_load_switch      # per-sensor high-side P-FET (AO3401A) for stuck-I2C power-cycling (ADR-0004)
    vin_min: 3.201                  # = the 3V3 rail's cited output envelope (`rails:` above)
    vin_max: 3.399
    vout_min: 3.2
    vout_max: 3.399
    iout_max_A: 0.0314            # DERIVED per rail, all terms at datasheet max:
                                  # MLX90640 IDD max 25.000 (Melexis rev12 §8 p.8)
                                  # + Adafruit 4407 breakout AP2112K-3.3 IQ max 0.080
                                  #   (EN hard-tied to VIN — never shuts down)
                                  # + breakout power LED, 10k, no switch      0.335
                                  # + breakout level-shifter pullups 4x 4.7k  2.872
                                  # + cooksense 2.2k bus pullups 2x           3.091
                                  #                              = 31.378 mA
    element: AO3401A
    note: "3V3 -> Q_SW{A,B} (enabled by MCP23017) -> camera rail, one Adafruit 4407
      MLX90640 breakout each; bus pullups die with the rail (ADR-0004 N1). Both are ON
      TOGETHER in normal operation — BRIEF §2 commissions two simultaneous MLX90640
      streams, and MEASURED each camera rail also powers its bus's 2.2k pullups, which
      the RH pod on the SAME bus needs (J_RH_AMBIENT.3/.4 = SDA_A/SCL_A)."
  - name: 3V3_SW_RHA / 3V3_SW_RHE
    kind: switched_load_switch      # per-sensor high-side P-FET (AO3401A), ADR-0004
    vin_min: 3.201
    vin_max: 3.399
    vout_min: 3.2
    vout_max: 3.399
    iout_max_A: 0.0112            # DERIVED per rail, all terms at datasheet max:
                                  # SHT45 IDD measuring max 0.500 (Sensirion SHT4x
                                  #   D1 v6.4 §3 p.8) + pod 10k pullups 2x 0.680
                                  # + SHT4x HEATER: IDD max 100 mA at the "200 mW"
                                  #   level, at the datasheet's own <=10 % maximal
                                  #   duty cycle (§4.9 / Table 9; tHeater long pulse
                                  #   0.9/1/1.1 s with automatic shutoff) = 10.000
                                  #                              = 11.180 mA
                                  # PEAK, not continuous: a coincident dual-heater
                                  # pulse is 100 mA per rail for <=1.1 s — carried
                                  # as a junction excursion under `rails:` above.
    element: AO3401A
    note: "3V3 -> Q_SW{RHA,RHE} (enabled by MCP23017) -> SHT45 pod rail. Both are ON
      TOGETHER by construction: the deliverable DELTA_AH = AH_EXHAUST - AH_AMBIENT is a
      DIFFERENCE of the two pods. THE HEATER IS THE UNDECLARED CAPABILITY THIS FILE HAD
      NEVER NAMED — the SHT4x carries a 200/110/20 mW on-package heater whose 200 mW
      level draws up to 100 mA, and the brief commissions the exhaust pod into a
      condensing duct ('short filtered drainable bypass', 'drainable orientation'),
      which is exactly the case Sensirion §4.9 lists the heater FOR. Firmware may use
      it; the board's budget now covers it at the manufacturer's 10 % duty limit."
