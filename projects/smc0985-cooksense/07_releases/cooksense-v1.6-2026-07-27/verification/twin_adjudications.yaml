# -- J_PI 2x20 THT pin socket (KiCad PinSocket_2x20_P2.54mm_Vertical vs JLC
#    HDR-TH_40P-P2.54-V-F-R2-C20). MIRRORED here is a NUMBERING-WIND convention,
#    not a mirrored land pattern. MEASURED pad maps (footprint-local): ours winds
#    odd/even as two COLUMNS x={0,-2.54} advancing +y (pad1 (0,0), pad2 (-2.54,0),
#    pad39 (0,48.26), pad40 (-2.54,48.26)); JLC winds odd/even as two ROWS
#    y={+1.27,-1.27} advancing +x (pad1 (-24.13,+1.27), pad2 (-24.13,-1.27)).
#    Rotating either into the other's frame lands the odd/even columns SWAPPED ->
#    mirror fit 0.00mm, i.e. the PHYSICAL 2x20 2.54mm hole grids are IDENTICAL
#    and only the pad-number assignment winds oppositely. The part is a
#    shroudless, keyless, symmetric 40-contact THT socket: each contact connects
#    ONLY to the hole it sits in — there is no internal die/pin identity to
#    mirror (unlike the VQFN incident this check exists for). Assembly is
#    hole-constrained; electrical pin-1 is defined by OUR footprint numbering +
#    netlist + silk, which the Pi mates to by physical position. Backstop: JLC
#    order-preview rotation check in ORDER_README (THT rotation is operator
#    instruction only).
- {lcsc: C35165, refs: [J_PI], status: MIRRORED,
   why: "Numbering-wind convention on a symmetric keyless 2x20 THT socket: hole grids identical (mirror fit 0.00mm), ours winds by column (+y), JLC by row (+x); no internal pin identity to mirror, hole-constrained assembly; pin-1 defined by our netlist+silk."}
# -- C35165 RE-MEASURED FROM FIRST PRINCIPLES ON BOTH SIDES (2026-07-26). The
#    entry above is correct but states the conclusion; these are the numbers, and
#    they also settle FLEET TASK #31 (the A-POS datum), so they are recorded here
#    rather than in a commit body.
#      JLC land HDR-TH_40P-P2.54-V-F-R2-C20-S2.54-2:
#         pad  1 (-24.13, +1.27)   pad  2 (-24.13, -1.27)   pad 3 (-21.59, +1.27)
#         pad 39 (+24.13, +1.27)   pad 40 (+24.13, -1.27)
#         => array CENTRED on the origin, and JLC winds by ROW (pad 2 is the
#            other row of the SAME column).
#      OURS PinSocket_2x20_P2.54mm_Vertical:
#         pad 1 (0.000, 0.000)  pad 2 (-2.540, 0.000)  pad 3 (0.000, +2.540)
#         => origin AT PAD 1, and we wind by COLUMN (pad 2 is the next column of
#            the SAME row). Our pad span runs 0.000 .. +48.260.
#    THE MIRROR IS THEREFORE A WIND, NOT A REFLECTION: two conventions over an
#    identical symmetric hole grid, which is why the mirror fit is 0.00mm and the
#    non-mirror fit is exactly one pitch (2.54mm) off.
#    A-POS FALLS OUT OF THE SAME GEOMETRY. JLC's CPL datum is the bbox centre of
#    PAD CENTRES; ours is the footprint anchor, which sits on pad 1. So:
#         x-component  48.260 / 2      = 24.130 mm   (pad-array half-span)
#         y-component  2.540  / 2      =  1.270 mm   (half the row pitch)
#         EUCLIDEAN    hypot(24.130, 1.270) = 24.1634 mm
#    BOTH published figures are exact and they are DIFFERENT QUANTITIES: 24.130
#    is the along-the-row component, 24.1634 is the full 2-D anchor->datum shift.
#    The coordinator's earlier 24.16 was not an approximation of 24.13 — it is
#    the exact Euclidean shift. MEASURED on the v1.3 board: J_PI anchor
#    (94.000, 95.000), pad-centre datum (118.130, 96.270), shift 24.1634mm.
#    NOT ON THE CPL any more (v1.3 declares J_PI process_incompatible: 40/40
#    plated drilled pads, F.Paste on none, on a service=standard sides=[top]
#    order), so the datum error is now unreachable on this board as well as
#    fixed in the exporter. Independent A-POS re-derivation over the v1.3 CPL:
#    189/189 rows on-datum, worst deviation 0.0000mm.
#    NO ROTATION ROW for C35165 (coordinator decision 2026-07-26): a wind is not
#    an offset, so there is nothing measurable to assert.

