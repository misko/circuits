  - "SOT-89-5 tab is VSS (pin 2) — pour ground under/around it; it is also the heatsink"
  - "CE is active high WITH internal pull-down (type C): floating CE = regulator OFF. Tie CE to VIN to always-on"
  - "COUT >= 2.2uF is mandatory for stability at 3.3V — 0.1uF alone will oscillate"
  - "Reverse current protection built in: safe to have VOUT held up (e.g. by 3.3V digital rail through analog loads) while VIN is down"
