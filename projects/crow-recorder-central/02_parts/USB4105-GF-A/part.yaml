layout:
  source: >-
    GCT USB4105 receptacle drawing. USB-C (USB2.0) receptacle — mechanical /
    board-edge; CC Rd + ESD placed local; electrically layout-agnostic.
  notes: >-
    Board-edge, mate outward. CC1/CC2 5.1k Rd (R31/R32) to GND placed local
    (Type-C sink presentation, E-INV asserts). VBUS filter local; the HS pair
    runs to the TPD4EUSB30 (D10) ESD then the XU316 PHY — that pair's layer
    continuity is the D10/L1 concern (see TPD4EUSB30). No P-ADJ keep_short.
