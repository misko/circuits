gotchas:
  - 'THIS project is a SINK (UFP): Rd 5.1k pulldown on CC1 AND CC2 (one each, separate resistors — do not common them)'
  - 'SELF-POWERED UAC2 device: system power comes from the external 5V barrel/screw-terminal input, NOT from VBUS. VBUS is used ONLY for host-presence detect via a resistor divider to an XU316 GPIO — do not feed VBUS into the 5V rail, and size the divider so the GPIO stays safe at VBUS = 5.5V'
  - 'Self-powered devices must not back-drive VBUS; with VBUS only on a high-impedance divider this is satisfied by construction'
  - 'Brief specifies MPN USB4105-GF-A-060: the -060 suffix is a tape-and-reel packaging code for the SAME connector; electrically/mechanically identical to USB4105-GF-A'
