gotchas:
  - "Reverse-polarity guard orientation (high-side P-FET): DRAIN to the input (jack/F1/D9), SOURCE to the load, gate to GND via 100k — the body diode (anode=drain=input) conducts input->load at first power, then Vgs=-Vrail enhances the channel and shorts it. Wired backwards (SOURCE=input) it protects nothing. Corrected 2026-07-18 per Q9 datasheet review; agrees with ADR-0007 and the board (pad2/S=5V load, pad3/D=5V_P input)"
