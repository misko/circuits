mpn: TLV70018DDCR
manufacturer: Texas Instruments
type: ldo_regulator_fixed_1v8
role: SOURCING SUBSTITUTE for TCR2LF18,LM(CT) (U12) — D27. The Toshiba part's
  JLC code C150173 is stock 0; this is a pin-compatible 1.8V/200mA SOT-23-5
  LDO at 5k+ JLC stock.
datasheet:
  doc_id: TI SBVS181 (TLV700xx / TLV700xxP 200-mA, Low-IQ LDO)
  url: https://www.ti.com/lit/ds/symlink/tlv700.pdf
  note: pinout + limits from the TI datasheet (DDC/SOT-23-5 pin assignment
    table); electrically judged in the release pin review (fresh-context)
    against the board's U12 nets.
package: DDC (SOT-23-5), 0.95mm pitch
footprint: Package_TO_SOT_SMD:SOT-23-5   # unchanged from TCR2LF18
pins:                       # TI SBVS181, DDC package pin table — SAME
  1: IN                     #   winding as TCR2LF18 (VIN/GND/CE/NC/VOUT)
  2: GND
  3: EN                     # active high; board ties U12.3 high -> always on
  4: NC
  5: OUT
limits:
  vin_abs_max: 6.0V
  vin_operating: 2.5-5.5V   # board input is 3V3 — in range
  vout: 1.8V +/-2% (TCR2LF18 was +/-1% — 1V8 rail is XU316 PLL_AVDD via the
    FB3 ferrite + local decoupling; XU316 PLL supply tolerance is +/-5%, ok)
  iout_max: 200mA           # equals TCR2LF18; 1V8 rail budget <=100mA
  dropout: 250mV max at 200mA (3V3 -> 1V8 headroom 1.5V, ample)
  iq: 31uA typ
  noise: 48uVrms (TCR2LF18 35uVrms; PLL filter FB3 600R + caps dominates)
  en_high_min: 0.9V (VIN>=2.5V) # board drives EN from 3V3 — solid high
gotchas:
  - "EN (pin 3) has NO internal pull-down guarantee usable here — the board
    already ties it high, matching TCR2LF18's CONTROL-high-on wiring."
  - "DDC = SOT-23-5. The DCK suffix (C133796) is SC70-5 — WRONG footprint;
    do not 'upgrade' to it on stock grounds."
sourcing: {lcsc: C79924, note: 'JLC stock 5270 on 2026-07-18 (extended);
  Toshiba TCR2LF18 C150173 stock 0 same date — revert if Toshiba restocks
  and lower noise is wanted'}
verified: "pin map read from the 'DDC Package 5-Pin SOT Top View' figure,
  TI datasheet SLVSA00E p.4 (figure rendered and read by the fresh-context
  U12 reviewer, 2026-07-18: pin 1 IN top-left, 2 GND, 3 EN, 4 N/C, 5 OUT,
  CCW); EN thresholds from the Pin Functions table p.4-5; board-net
  correctness judged pin-for-pin in the release pin review (U12 PASS,
  verification/pin_review.md) — D27"

