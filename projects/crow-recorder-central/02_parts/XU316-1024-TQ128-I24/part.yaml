  msl: "MSL 3, 168h floor life (§14.5 p33)"
  # all electricals: §15 pp34-36 (abs max p34, operating conditions p35)

boot_modes:
  # X0D06/X0D05/X0D04 sampled shortly after reset with internal weak
  # pull-downs enabled (§9 pp20-21 table). 000 = default = QSPI flash.
  "000": QSPI flash (default, no pull resistors needed)
  "001": SPI flash
  "010": SPI slave
  "011": SPI slave (other tiles SPI slave)
  "100": Channel end 0, xlink XL0 2-wire
  "101": Channel end 0, XL1/2/5/6 5-wire
  "110": Channel end 0, XL0-XL3 5-wire
  secure_boot: "OTP secure-boot bit overrides pins; boots from OTP (§9.5 p24)"

gotchas:
  - "Pad 129 (exposed paddle) is VSS and must be grounded — a generator that
    stops at 128 pins floats the ground pad (Table 4 p84, §14.4 p32)."
  - "Pin 55 is NC — 'Any pin marked NC should not be connected to any net'
    (§3 p7)."
  - "VDDIOB18 is 1.8V-only (abs max 1.98V) and powers JTAG, RST_N, XIN/XOUT,
    X0D12/13/22/23, X1D12/23. It 'must not be turned on last': if VDDIOB18 is
    off while VDD is on, the L/R/T banks default to 1.8V mode and a 3.3V VDDIO
    must not exceed 1.98V unless VDD is off (§14 p30)."
  - "Sequencing (§14 p30, Fig 18 p31): VDDIO and VDD may ramp independently but
    preferably within 50ms; VDDIOL/T/R must be valid before the device leaves
    reset (boot straps are on VDDIOL). Single-1.8V-VDDIO designs can rely on
    the on-chip POR; otherwise hold RST_N asserted until VDDIOL/R/T valid.
    All supplies must rise monotonically."
  - "Running any of VDDIOL/T/R at 1.8V requires strapping the matching
    LV_L_N/LV_T_N/LV_R_N pin to GROUND; tie high or float for 3.3V (§4.8 p11).
    On our 3.3V-IO design: leave LV_* unconnected (internal PU) or tie high."
  - "PLL_AVDD needs a filtered 0.9V feed: 600R@100MHz ferrite (e.g. Taiyo
    Yuden BKH1005LM601-T, DCR<1R) + 1uF at the pin (§14 pp29-30)."
  - "Decoupling: at least 12x 100nF low-inductance MLCC on VDD close to the
    chip; one 100nF 0402 per VDDIO supply pin; bulk >=10uF on VDD and VDDIO
    rails (§14 p29-30, checklist H.2 p92)."
  - "Boot straps X0D04/X0D05/X0D06 (pins 127/128/1) are sampled at reset with
    weak internal pull-downs; default 000 = QSPI boot needs no resistors, but
    'care should be taken if other external devices are connected to this
    port' (§9 p20). X0D04..X0D07 are driven high/low during and after reset
    (checklist H.7 p93) — do not hang level-sensitive loads on them."
  - "QSPI boot pins are hardcoded in boot ROM: X0D01=SS, X0D04..07=SPIO0..3,
    X0D10=SCLK; mode 0/0, quad 0xEB read; flash must answer QSPI within 300us
    of power-up or RST_N must be held until it is ready (§9.1 pp21-22). Fit a
    CS_N pull-up to VDDIOL (Fig 12 p22 shows 'external pull-up' on SS; eval
    board uses 10K)."
  - "24MHz crystal (+/-500ppm or better) mandatory for USB; USB PHY clock must
    be 12 or 24MHz (checklist H.4 p93). Crystal circuit: Rf 1M, Rd 680R,
    CL1/CL2 22pF for the recommended 12pF/60R-ESR crystals incl. Epson FA-238
    24.0000MD30X-W5 (§7.3 p19)."
  - "USB self-powered designs MUST sense VBUS on a GPIO to tri-state D+ pull-up
    when host unpowered: 220K series + 330K (3.3V IO) divider + 47K bleed,
    1-10uF on VBUS (§11.1 pp26-27, Fig 15). No series resistors on DP/DM;
    route as 90R differential, W=0.12mm, S1=0.10mm over unbroken plane
    (§14.1 p31 table)."
  - "JTAG runs at 1.8V (VDDIOB18) — a 3.3V debug probe will overstress the
    IOB bank (abs max 1.98V). No TRST pin; reset TAP by 5 TCK clocks with
    TMS high (§13 pp28-29)."
  - "Internal weak pulls are ~11-65uA and must not fight external circuitry;
    use 4K7 externally to overcome an internal pull (§15.3/15.4 notes D,
    pp35-36)."
  - "Do not map inputs and outputs onto the same multi-bit port (§4 p8,
    checklist H.7 p93)."

