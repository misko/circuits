gotchas:
  - "Suffix IQ = QE bit FACTORY FIXED to 1 (datasheet 4.4/8.1: 'factory fixed default for ordering options IQ & JQ') — pins 3 and 7 are permanently IO2/IO3 for quad ops. Do NOT hardwire pin 3 to GND or pin 7 to VCC as /WP//HOLD straps; route them to the QSPI IO2/IO3 lines (XU316 boot QSPI needs all four IOs)"
  - "/HOLD (or /RESET) function on pin 7 only exists in Standard/Dual SPI (QE=0 parts); with QE=1 the pin is IO3, and hold/reset via pin is unavailable"
  - "Pin 7 can be configured as /RESET instead of /HOLD via Status Register-3 HOLD/RST bit — irrelevant on IQ parts in quad mode"
  - "208-mil wide-body SOIC (5.23 mm), NOT the 150-mil 3.9 mm SOIC-8 — the JEDEC SOIC-8_3.9x4.9 footprint will not fit; W25Q16JVSNIQ is the 150-mil variant"
