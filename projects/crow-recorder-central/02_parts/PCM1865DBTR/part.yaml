  fetched: 2026-07-17
package: DBT (TSSOP-30, 4.3-4.5 x 7.75-7.85 mm body, 0.5 mm pitch, MO-153, DBT0030A)
footprint: Package_SO:TSSOP-30_4.4x7.8mm_P0.5mm   # verified vs DBT0030A drawing: 4.4x7.8 nom body, 0.5 pitch, 6.4 lead span
pins:                       # from figure "DBT Package: PCM1862, PCM1863, PCM1864, and PCM1865 — 30-Pin TSSOP, Top View", p.10
  1: VINL2/VIN1M            # analog in 2 L (or diff M of input 1)
  2: VINR2/VIN2M            # analog in 2 R (or diff M of input 2)
  3: VINL1/VIN1P            # analog in 1 L (or diff P of input 1)
  4: VINR1/VIN2P            # analog in 1 R (or diff P of input 2)
  5: MICBIAS                # microphone bias output
  6: VREF                   # ref decouple, ~0.5*AVDD; 1uF to AGND
  7: AGND
  8: AVDD                   # 3.3V analog; 0.1uF + 10uF to AGND
  9: XO                     # crystal oscillator output (leave open if no XTAL)
  10: XI                    # crystal in or 1.8-V CMOS master clock in (abs max 2.1V!)
  11: LDO                   # internal 1.8V LDO decouple OUT, or external 1.8V IN to bypass; 0.1uF + 10uF to DGND
  12: DGND
  13: DVDD                  # 3.3V digital supply; 0.1uF + 10uF to DGND (core 1.8V made by internal LDO on pin 11)
  14: IOVDD                 # I/O supply, 1.8V or 3.3V
  15: SCKI                  # CMOS-level (3.3V) master clock input — the normal MCLK pin
  16: LRCK                  # frame clock I/O (50k pulldown, Schmitt)
  17: BCK                   # bit clock I/O (50k pulldown, Schmitt)
  18: DOUT                  # audio data out (table says "Analog output" — datasheet typo; it is the digital audio output)
  19: GPIO3/INTC
  20: GPIO2/INTB/DMCLK
  21: GPIO1/INTA/DMIN
  22: MISO/GPIO0/DMIN2      # SPI MISO; in I2C mode GPIO0 (DMIN2 only on 1864/1865)
  23: MOSI/SDA              # SPI MOSI / I2C SDA
  24: MC/SCL                # SPI SCK / I2C SCL
  25: MS/AD                 # SPI /CS; in I2C mode = ADDRESS select pin
  26: MD0                   # control method select: low or NC = I2C, high = SPI
  27: VINL4/VIN4M
  28: VINR4/VIN3M
  29: VINL3/VIN4P
  30: VINR3/VIN3P
limits:
  avdd: 3.0-3.6V (3.3 nom), abs max 3.9V
  dvdd: 3.0-3.6V (3.3 nom), abs max 3.9V   # core 1.8V from internal LDO
  iovdd: 1.62-1.98V or 3.0-3.6V, abs max 3.9V
  xi_abs_max: 2.1V to DGND    # XI is a 1.8-V input even when everything else is 3.3V
  vin_analog_abs: -1.7 to +5.0V to AGND
  xtal: 15-35MHz on XI/XO
  ta: -40 to +125C, tj_max 150C
  i2c_addr: "7-bit 0x4A (AD low) / 0x4B (AD high); datasheet writes them 8-bit as 0x94/0x96 (Table 23, 6 MSBs fixed 1001 01)"
gotchas:
  - "Control mode: MD0 (pin 26) low/NC = I2C, high = SPI; I2C address set by MS/AD (pin 25): low = 0x94/0x4A, high = 0x96/0x4B — two PCM1865 share one bus by strapping AD differently"
  - "NO reset pin and no brownout detector — power-on reset only; software reset = write 0xFE to Page 0 register 0x00. Sleep/standby are register-controlled (energysense), not a pin"
  - "Two different MCLK inputs: SCKI (pin 15) is the 3.3-V CMOS master clock input; XI (pin 10) is a 1.8-V input / crystal — driving XI with a 3.3-V clock violates its 2.1-V abs max. For a shared 24.576MHz 3.3V MCLK use SCKI and leave XI grounded/XO open"
  - "DVDD is a 3.3V SUPPLY, not the core rail: internal LDO makes 1.8V on the LDO pin (11) — needs its own 0.1uF+10uF to DGND; may instead be fed 1.8V externally to bypass the LDO (required trick for lowest power / all-1.8V IOVDD TDM setups)"
  - "Pin 18 DOUT is typed 'Analog output' in the Pin Functions table — known datasheet typo, it is the digital audio data output"
  - "Differential inputs pair across the package: VIN1P/VIN1M = pins 3/1, VIN2P/VIN2M = 4/2, VIN3P/VIN3M = 30/28, VIN4P/VIN4M = 29/27 — P and M of one channel are NOT adjacent pins"
  - "TDM: 'DOUT2 not available in TDM mode'; dual-device TDM chaining is documented (two PCM1865 on one TDM bus, offset via TX_TDM_OFFSET); LRCK/BCK have internal 50k pulldowns"
  - "DMIN2 option on pin 22 exists only on PCM1864/PCM1865"
verified: "pin map read from figure 'DBT Package: PCM1862, PCM1863, PCM1864, and PCM1865 — 30-Pin TSSOP (Top View)', p.10, cross-checked against 'Pin Functions: PCM1862...PCM1865' table p.11, SLAS831D; package dims from DBT0030A outline drawing (4220214/B, p.142) — 2026-07-17"
