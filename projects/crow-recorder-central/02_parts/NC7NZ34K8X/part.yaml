  doc_id: DS500494
  revision: "July 2001, revised November 2005 (Fairchild original with onsemi rebrand cover; LCSC mirror of onsemi doc)"
  url: https://www.lcsc.com/datasheet/lcsc_datasheet_2409302136_onsemi-NC7NZ34K8X_C232798.pdf
  sha256: 52f971b7e2334a22b90f54ea52434b7cf7e9fbe6edbd005b1d2b64eba3068d29
  fetched: 2026-07-17
package: US8 (MAB08A, 8-lead, JEDEC MO-187 variation CA; body 2.3x2.0 mm, lead span 3.1±0.1, pitch 0.50 mm)
footprint: Package_SO:VSSOP-8_2.3x2mm_P0.5mm   # KiCad footprint is tagged 'JEDEC-MO-187-CA' — exactly the US8 variation; pads 1.25x0.35 at 0.5 pitch, span 2.8 (Fairchild land rec 1.0x0.3 pads — KiCad IPC pads are slightly longer, fine). No custom footprint needed.
pins:                       # from 'Connection Diagrams ... (Top View)' US8 figure, p.1 (pdf p.2 incl. rebrand cover); pin refs match IEEE logic symbol numbering
  1: A1                     # buffer 1 input
  2: Y3                     # buffer 3 OUTPUT (yes — an output between two inputs on the bottom row)
  3: A2                     # buffer 2 input
  4: GND
  5: Y2                     # buffer 2 output
  6: A3                     # buffer 3 input
  7: Y1                     # buffer 1 output
  8: VCC
limits:
  vcc: 1.65-5.5V operating (abs max 7.0V)
  vin: overvoltage-tolerant to 7V independent of VCC (5V-to-3V translation OK)
  iout: +-24mA drive at VCC=3V (abs max +-50mA per output)
  tpd: 2.4ns typ into 50pF at 5V VCC
  ta: -40 to +85C
gotchas:
  - "TRIPLE buffer, not dual — three independent non-inverting buffers (A1..A3/Y1..Y3), function Y=A"
  - "Pinout is NOT grouped per buffer: buffer-3's OUTPUT is pin 2 (bottom row) while its input A3 is pin 6 (top row) — do not assume in/out pairs are adjacent"
  - "US8 is NOT MSOP-8 (0.65 pitch, 3x3 body) — it is 0.50 mm pitch, 2.3x2.0 body, MO-187 variation CA; KiCad VSSOP-8_2.3x2mm_P0.5mm (a.k.a. TI DCU) is the matching land pattern"
  - "Pin-1 marking: no dot on some lots — datasheet: read top mark ('NZ34') left to right, pin 1 is the LOWER LEFT pin"
  - "I/O are high-impedance when VCC=0 (power-down safe); inputs 7V tolerant, outputs are NOT (VOUT max VCC)"
verified: "pin map read from 'Connection Diagrams (Top View)' US8 figure, datasheet p.1, cross-checked against IEEE logic-symbol pin numbers A1(1)/Y1(7), 2A(3)/2Y(5), 3A(6)/3Y(2), DS500494 rev Nov 2005; package dims from MAB08A physical-dimensions drawing, datasheet p.6 — 2026-07-17"
