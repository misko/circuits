# crow-recorder-central POWER-TREE TOPOLOGY (canon E-TOPO).
#
# GREEN-CASE PROOF. Every regulated rail on this board is STEP-DOWN from the
# ~5 V input trunk (DC-005C 5 V jack / USB 5 V). There is no boost and no
# buck-boost anywhere in the tree, so E-TOPO derives BUCK for every switching
# rail and asserts the chosen part matches — no over-capable converter (the
# usb-hub-3s buck-boost-where-buck-suffices class) can hide here.
#
# THE PHYSICS: Vout_max < Vin_min -> BUCK. Both switching rails clear it by a
# wide margin (3.32 < 4.75 and 0.9 < 4.75), so both derive BUCK and both parts
# are AP61102Z6-7 sync bucks -> PASS.
#
# FULL RAIL TREE (four regulated rails; only the two SWITCHING converters are
# graded by E-TOPO — LDOs are LINEAR post-regulators, inherently step-down and
# outside the buck/boost derivation, same as usb-hub-3s-v2's downstream PD
# controller is not listed here):
#
#   5V --U10 AP61102 buck--> 3V3   (digital 3.3 V, 3.32 V set, <=400 mA)  [GRADED]
#   5V --U11 AP61102 buck--> 0V9   (XU316 core 0.9 V, <=800 mA, PG-seq)   [GRADED]
#   3V3 -U12 TCR2LF18 LDO-> 1V8    (linear step-down 3.3->1.8 V, <=100 mA)  [linear]
#   5V --U13 XC6227  LDO-> 3V3A    (quiet analog 3.3 V, linear 5->3.3, <=60 mA) [linear]
#
# The two LDO rails are step-down by construction (a linear regulator cannot
# boost); their Vin>Vout is documented above and enforced physically by the
# part choice, not by this gate. E-TOPO owns only the SWITCHING topology risk.
#
# input_trunk_class is DELIBERATELY OMITTED: the PWR5 trunk (nets.yaml, 1.2 A)
# carries the 8 pod audio feeds + beeper bursts IN ADDITION to these two bucks
# (~0.45 A summed here), so binding PWR5 as "the buck trunk" would false-fire
# the over-built advisory. Trunk sizing lives in nets.yaml PWR5 intent, not in
# the E-TOPO rail sum. The checker falls back to advisory-only (correct here).
#
# Graded by: power_topology.py <project>   (exit 0 = all rails topology-correct)

rails:
  # Digital 3.3 V rail: U10 AP61102Z6-7 sync buck. VO = 0.6*(1+68/15) = 3.32 V,
  # EN tied to 5V (always-on). Feeds the XU316 I/O banks, flash, clock buffer.
  - name: 3V3_digital
    vin_min: 4.75          # 5 V input trunk, -5 %
    vin_max: 5.25          # +5 % (well under the AP61102 6.3 V input OVP)
    vout_min: 3.32         # fixed output (vout_min == vout_max)
    vout_max: 3.32
    iout_max_A: 0.4        # RAIL class budget (<=400 mA)
    converter: AP61102Z6-7
    eff: 0.9

  # XU316 core 0.9 V rail: U11 AP61102Z6-7 sync buck. VO = 0.6*(1+10/20) =
  # 0.9 V, EN gated off U10's power-good (BK1_PG) for supply sequencing.
  - name: 0V9_core
    vin_min: 4.75
    vin_max: 5.25
    vout_min: 0.9
    vout_max: 0.9
    iout_max_A: 0.8        # RAIL class budget (<=800 mA, the core draw)
    converter: AP61102Z6-7
    eff: 0.9
