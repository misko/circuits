gotchas:
  - "FB_IN IS NOT PROTECTION AND MUST NEVER BE COUNTED AS ANY. ADR-0004 gives
     it exactly one job — attenuate the FAST residual that gets past D_TVS —
     and states in the same breath that 'it does nothing for a sustained
     overvoltage, which is why the CC pull-downs and the LDO rating do that job
     instead'. Quantitatively: at DC this part is 0.06 ohm. Put 20 V on VBUS
     and 20 V arrives at U_LDO.VIN minus 3 mV. A reviewer who sees a ferrite
     between the clamp and the regulator and reads it as a second line of
     defence has misread the schematic, and this line exists so that misreading
     is on the record as wrong."
  - "MURATA IMPEDANCE-CODE TRAP: THE THIRD DIGIT IS A MULTIPLIER, NOT A DIGIT.
     601 = 60 x 10^1 = 600 ohm. 600 = 60 x 10^0 = SIXTY ohm. The fleet has
     already shipped this mistake: a 600R part.yaml was authored on the 60R MPN
     and survived to the M-BOM staging catalog check (crow-recorder-central-v2,
     2026-07-23). The ledger's instruction is to decode against TWO catalog
     rows; done here against EIGHT, all read live 2026-07-28 from the JLC
     assembly library, and the rule is consistent across every one:
       BLM21PG600SN1D  C18305     -> 60 ohm @ 100 MHz   (79974 in stock)
       BLM21PG601SN1D  C41556732  -> 600 ohm @ 100 MHz  (2 in stock)
       BLM21PG300SN1D  C16903     -> 30 ohm
       BLM21PG220SN1D  C88993     -> 22 ohm
       BLM21PG221SN1D  C85840     -> 220 ohm
       BLM21PG331SN1D  C74764     -> 330 ohm
       BLM21BD102SN1D  C37751     -> 1 kohm
       BLM21BD222TN1D  C85838     -> 2.2 kohm
     Note the shape of the trap: BLM21PG600SN1D is ONE CHARACTER from a 600 ohm
     part, is the SAME 0805 footprint, the SAME manufacturer, and has 79974 in
     stock against the 600 ohm PG part's 2. A price- or availability-driven
     substitution lands on 60 ohm and loses 20 dB of attenuation silently. The
     INDEPENDENT confirmation for THIS part is that the committed datasheet is
     titled BLM21SP601SN1# and its own Specifications table says 600 ohm."
  - "IS A 2.3 A POWER-LINE BEAD RIGHT FOR A 0.15 A LEG? YES — BUT NOT BECAUSE
     OF THE 2.3 A, AND THE REASON MATTERS BECAUSE IT IS WHAT REJECTS THE
     'CORRECTLY SIZED' ALTERNATIVES. The current rating is 15.3x the design
     envelope and is irrelevant on its own. What the SP construction BUYS at
     the SAME 600 ohm @ 100 MHz is DCR, and DCR here is LDO headroom. Every
     600 ohm 0805 in the JLC library, read live 2026-07-28:
       BLM21SP601SN1D  2.3 A   60 mohm  ->   9.0 mV at 0.15 A   (6368 stock)
       BLM21PG601SN1D  1.4 A  140 mohm  ->  21.0 mV             (2 stock)
       BLM21AG601SN1D  700 mA 210 mohm  ->  31.5 mV             (131312 stock)
       BLM21AJ601SN1D  200 mA  1.1 ohm  -> 165.0 mV             (10554 stock)
     The AJ part — the one whose current rating actually 'matches' a 0.15 A
     leg — would cost more headroom than F_IN does (165 mV vs 112.5 mV). The
     AG part costs 22.5 mV more than the SP for nothing. SECOND reason, and it
     is the physical one: a bead's impedance falls as DC bias approaches
     saturation, so running at 0.15/2.3 = 6.5 % of rating is what DELIVERS the
     catalogued 600 ohm, while the AJ part at 0.15/0.2 = 75 % of rating does
     not. OVER-RATING A BEAD ON CURRENT IS HOW YOU GET ITS RATED IMPEDANCE; it
     is not waste. THE HONEST CAVEAT: this document publishes NO
     impedance-vs-DC-bias curve — only the temperature derating of rated
     current (PDF p3). The saturation argument is therefore DERIVED from the
     physics, not CITED, and Murata's SimSurfing curve was not fetched."
  - "AND A HIGHER-IMPEDANCE BEAD WAS REJECTED WITH NUMBERS, NOT WITH TASTE.
     BLM21AG102SN1D (C85835, 1 kohm @ 100 MHz, 600 mA, 280 mohm, 85664 stock)
     is the obvious 'more filtering' upgrade. It costs 42 mV at 0.15 A against
     this part's 9.0 mV — 33 mV more, 2.7 % of an LDO dropout budget already
     9 % spent by F_IN. What it buys: the attenuator here is the bead against
     the LDO's input capacitor, and a 1 uF X7R at 100 MHz is far past
     self-resonance at roughly 0.3-0.6 ohm, so the divider goes from
     20log10(600/0.4) = 63.5 dB to 20log10(1000/0.4) = 68.0 dB. 4.5 dB for
     33 mV of headroom on a bus-powered board is a bad trade, and it is a bad
     trade for a REASON that is arithmetic."
  - "THE HONEST LIMIT, AND IT IS THE SAME 85.7:1 ARGUMENT THE REST OF THIS
     BOARD IS BUILT ON. Impedance falls to ~200 ohm at 1 GHz and ~20 ohm at
     3 GHz (PDF p3 curve). ABOVE ROUGHLY 2 GHz THIS BEAD IS NOT A FILTER. The
     received band is 70 MHz - 6 GHz, so the top two thirds of it gets NO
     power-rail filtering from FB_IN at all. No 0805 bead covers 70 MHz -
     6 GHz — the impedance peak is a material resonance and it has one
     location. This is EXACTLY the argument ADR-0002 and ADR-0004 already used
     to refute the directional coupler, the lambda/4 ESD stub, the shunt
     inductor and the per-port DC block on this board, and it applies here too.
     What limits in-band rail noise above 2 GHz is the LDO's own output
     network, the L2 ground plane, and the QSPI-containment rules in
     nets.yaml — not this part."
  - "FB_IN + THE LDO'S INPUT CAP IS AN UNDER-DAMPED LC AND THE PEAKING IS REAL.
     With L ~2.4 uH (DERIVED above) and C_LDI = 1 uF X7R at maybe 0.7 uF after
     DC derating, f0 = 1/(2*pi*sqrt(L*C)) = ~123 kHz, and
     Q = (1/R)*sqrt(L/C) with R = 60 mohm DCR + ~50 mohm cap ESR gives Q ~ 17,
     i.e. roughly +24 dB of gain at 123 kHz. The bead's own resistive loss does
     nothing down there — R is essentially just DCR below 1 MHz (PDF p3, cyan
     curve). CONSEQUENCE ON THIS BOARD, bounded honestly: nothing here
     generates 123 kHz (there is no switcher, deliberately — ARCHITECTURE
     section 3), so the exposure is amplification of a HOST-side supply's
     ripple, against which the LDO still has 40-60 dB of PSRR at 123 kHz. Real
     effect, small consequence. IT IS AN INPUT TO THE U_LDO DOSSIER, WHICH OWNS
     C_LDI: a smaller or lower-ESR input capacitor moves f0 up and Q up
     together, and if that dossier's stability requirement wants a small
     ceramic, the damping question comes back."
  - "THE NET ON FB_IN'S OUTPUT SIDE DOES NOT EXIST YET, AND IT SHOULD.
     03_src/rules/nets.yaml declares PWR as [VBUS, VBUS_F, 3V3]. ADR-0004's
     chain is VBUS -> F_IN -> VBUS_F -> FB_IN -> U_LDO.VIN, so a ferrite is a
     SERIES element and the node between FB_IN and U_LDO.VIN is a fourth power
     node with no name and no netclass. As drawn it will fall to the default
     0.25 mm class instead of PWR's 0.40 mm, and A-AMP will grade it as a
     signal net. The IR consequence is negligible (the run is a few mm) but the
     netclass gap is not, and it is exactly the kind of thing that is invisible
     once the board routes clean. Suggested name VBUS_LDO. FLAGGED, NOT FIXED:
     03_src/ is not this dossier's to edit."
  - "PLACEMENT IS PART OF THE FILTER, NOT DECORATION: a series bead with no
     shunt capacitor on its LOAD side is not a low-pass filter, it is a
     resistor. C_LDI must be at U_LDO.VIN, immediately downstream of FB_IN,
     and the bead-to-cap loop is what sets the attenuation above ~500 MHz where
     the loop's own inductance starts to rival the bead's impedance."
  - "JLC LIBRARY TIER IS 'EXTENDED', SO AN ORDER-DAY STOCK RECHECK IS
     MANDATORY. Live 2026-07-28: C3716677 = 6368 in the assembly pool. Stock is
     never committed to this file (02_parts contract); it lives in
     06_build/cache/."
