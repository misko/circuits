asserts:
  # DECLARED BUT NOT ACTUALLY GRADED TODAY. part_facts_check.py decodes
  # `equals:` through parse_si(), which is NUMERIC-ONLY; an MPN string returns
  # None and the entry is reported P-FACT-CONFIG and grades NOTHING (measured
  # 2026-07-28: six of nine dossiers on this board, both exemplars included).
  # THIS PART IS THE ONE WHERE THAT GAP HAS ALREADY COST THE FLEET SOMETHING:
  # the 601-vs-600 substitution is exactly what a working `value` assert would
  # catch, and it is exactly what got through on crow-recorder-central-v2. Fix
  # belongs in part_facts_check.py (literal-string fallback or an `mpn:` kind);
  # reported, not applied.
  - assert: value
    equals: BLM21SP601SN1D
    why: "the BOM Comment must name the full MPN, because the impedance code's
      third digit is a MULTIPLIER and the fleet has already shipped a 600R
      dossier written on a 60R MPN (crow-recorder-central-v2, 2026-07-23).
      BLM21PG600SN1D is one character away, same 0805 land, same manufacturer,
      79974 in stock against this part's 6368, and it is 60 ohm — a 20 dB loss
      of attenuation that no ERC, DRC, parity or twin check can see, on a board
      whose entire product is the constancy of nine receive paths. The DCR
      siblings at the same 600 ohm (AG at 210 mohm, AJ at 1.1 ohm) are equally
      invisible and cost 22.5 mV and 156 mV of LDO headroom respectively."
