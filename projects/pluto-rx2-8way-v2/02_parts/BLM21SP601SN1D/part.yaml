  EIGHT live JLC assembly-library rows listed in gotchas: (two would satisfy the
  ledger; eight makes the multiplier rule inductive rather than anecdotal).
  2026-07-28"
layout:
  source: "Murata's Product Search Data Sheet publishes NO layout section, NO
    recommended land pattern, NO DC-bias curve and NO S-parameters — it is
    three pages of specifications, one impedance graph, one temperature-derating
    graph and an equivalent circuit. EVERY RULE BELOW IS THEREFORE DERIVED
    ENGINEERING and is labelled DERIVED, in the same posture as
    ../KH-SMA-KE-Z/part.yaml. The two vendor-sourced inputs are the body
    envelope (2.0 +/-0.2 x 1.25 +/-0.2 x 0.85 +/-0.2 mm, PDF p2) and the
    equivalent circuit (PDF p3: series L then R, captioned 'Resistance element
    becomes dominant at high frequencies') — the latter is what says the
    100-500 MHz plateau is DISSIPATIVE rather than reactive, which is why this
    bead damps the residual instead of ringing on it.
    LAND-PATTERN COMPARISON, done numerically rather than assumed:
    Inductor_SMD:L_0805_2012Metric places 0.875 x 1.20 mm pads at x =
    +/-1.0625 mm -> gap 1.25 mm, span 3.00 mm, IPC-7351 nominal. Against the
    body envelope: at max length 2.2 mm the body half-length is 1.10 mm, so the
    pad (spanning |x| 0.625-1.500 mm) covers the termination band and leaves
    0.40 mm of toe; at max width 1.45 mm the termination overhangs the 1.20 mm
    pad by 0.125 mm per side, which is the normal IPC-nominal 0805 condition
    and not a defect. NO VENDOR LAND EXISTS TO COMPARE AGAINST — that is stated
    as an absence, and the fit above is DERIVED from the dimension table."
  reviewed: "2026-07-28"
  keep_short:
    - {net: 3V3_MOD, max_span_mm: 12, why: "DERIVED, AND RE-TARGETED FOR v2 —
       this budget said VBUS_F when the dossier was copied from
       pluto-rx2-8way, where this bead sat on the USB VBUS rail feeding an LDO.
       On v2 there is no VBUS on the board at all (ADR-0002: the module owns
       the only USB), and the bead's input node is 3V3_MOD, shared with C_BULK
       and the module's 3V3 castellation. The PHYSICS is unchanged and so is
       the number: above ~100 MHz a long input node stops being a node, and the
       bead is then filtering against an inductance rather than against the
       bulk cap. E-NETREF caught the stale name — left as VBUS_F it would have
       made P-ADJ grade nothing at all, silently."}
  notes:
    - "DERIVED: the LDO's input capacitor is HALF THIS FILTER. Place C_LDI at
       U_LDO.VIN with the shortest possible loop to the ground pour; the bead
       alone attenuates nothing. This is also the damping element for the
       ~123 kHz LC peaking computed in gotchas:, so its value and ESR are a
       shared decision with the U_LDO dossier, not a plumbing choice."
    - "DERIVED: FB_IN sits at the boundary between the USB/power entry and the
       regulator, and its INPUT side is cable-facing. Do not run the input and
       output copper alongside each other — capacitive coupling across a 600 ohm
       series element is the standard way to lose 20 dB of a filter to layout.
       Keep the crossing-free separation the digital-strip floorplan already
       implies."
    - "DERIVED, and it is a placement constraint the RF side imposes rather than
       the part: this bead's impedance is falling through the entire lower half
       of the received band and is ~20 ohm at 3 GHz. It provides no shielding
       benefit; it must not be treated as one when deciding how close the power
       entry may sit to the nine-arm receive fan (ADR-0007 / nets.yaml QSPI
       containment)."
    - "OWED: Murata's approval sheet ('please review our product specifications
       or consult the approval sheet before ordering' — the vendor's own
       Attention note on all three pages) was NOT obtained, and neither was the
       SimSurfing impedance-vs-DC-bias curve or the S-parameter set. The DC-bias
       argument in gotchas: is DERIVED for exactly that reason. Recorded as not
       done, not as absent."
