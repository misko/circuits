                              # that matters here (BLM21PG601SN1D 140 mohm and
                              # 2 in stock; BLM21AG601SN1D 210 mohm;
                              # BLM21AJ601SN1D 1.1 ohm), and the one part that
                              # IS deeply stocked and one character away —
