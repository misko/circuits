# electrical_invariants.yaml — pluto-rx2-8way-v2
# Design INTENT the exported netlist must satisfy (canon E-INV). Every
# protection/topology ADR emits at least one assertion here, or E-ADR flags it.
#
# WHY THIS BOARD NEEDS THEM MORE THAN MOST: almost nothing this board sells is
# observable in copper. RF8 was chosen by an ISOLATION argument, RF1 is the
# delta reference for the whole published phase table, V1-as-MSB is what stops
# the antenna sweep running backwards (an AoA solver absorbs a reversed sweep as
# a ROTATED ARRAY and reports a plausible wrong answer), and the pickoff's TWO
# resistors are what halve the parasitic. The netlist, DRC, ERC and parity are
# IDENTICAL under every one of those mistakes.
#
# `adr:` IS QUOTED EVERYWHERE BELOW. A bare zero-padded `adr: 0011` is a YAML
# 1.1 OCTAL literal that silently becomes "0009" — the invariant then satisfies
# the WRONG ADR and E-ADR credits a document that emitted nothing.

supplies:
  3V3: 3.3
# Declared with the CANONICAL net name, not the tsx author-prefix form `N3V3`.
# cooksense 2026-07-29 declared `N3V3` here, the grader filtered supplies to
# nets it could see, and the rail was INVISIBLE to every node_level grade on
# the board while the error message told the author to write a block they had
# already written. VERIFIED here against the exported netlist, which carries
# `3V3` and `3V3_MOD` — the converter's canon_net strips the author prefix.

invariants:

  # =====================================================================
  # ADR-0001 — module selection, and the rail that comes with it
  # =====================================================================
  - assert: series_chain
    chain: [3V3_MOD, FB_3V3, 3V3]
    adr: "0001"
    why: "THE FERRITE MUST ACTUALLY BE IN SERIES. FB_3V3 is the only mitigation
      this board carries for the module's RP2040 core and QSPI current
      transients riding its 3V3 rail, and PE42482A-X publishes NO PSRR figure.
      A board that merges 3V3_MOD and 3V3 into one net, or that shunts the
      ferrite, is electrically functional and DELETES THE ONLY FILTER — and
      DRC, ERC and parity all pass. Asserted as a CHAIN rather than as a
      presence, because the failure is about position, not existence"

  - assert: pin_on_net
    pin: "U_SW.8"
    net: 3V3
    adr: "0001"
    why: "U_SW VDD must sit on the FILTERED side of the ferrite, not on
      3V3_MOD. Wiring VDD to the module side would work, pass every gate, and
      quietly move the switch to the unfiltered rail — the exact thing the
      previous assertion exists to prevent, seen from the other end"

  - assert: series_chain
    chain: [RX1_MAIN, R_T1, RX1_TAP_MID, R_T2, RX1_TAP]
    adr: "0001"
    why: "TWO resistors in series, not one, and the middle node is NAMED so the
      assertion can see the difference. A single 440 ohm part satisfies the
      topology in spirit and DESTROYS the property: two 220 ohm 0402s put their
      ~0.04 pF parasitics in series so C_eff halves, the 6 GHz tap tilt drops
      from +1.69 dB to +0.43 dB, and the UNKNOWN band narrows from 2.73 dB to
      0.83 dB. Netlist, DRC, ERC and parity are identical either way"

  - assert: part_value
    part: R_T1
    equals: 220
    tolerance_pct: 5
    adr: "0001"
    why: "The pickoff's three published numbers are all functions of this value:
      main-line insertion loss 0.4322 dB, tap coupling -20.2567 dB, return loss
      26.2773 dB at RX1_MAIN (DETAIL_DESIGN section 2, each with a runnable
      derivation). RX1's sensitivity is a PERMANENT cost paid by this resistor,
      so a substituted value is a substituted instrument"

  - assert: part_value
    part: R_T2
    equals: 220
    tolerance_pct: 5
    adr: "0001"
    why: "As R_T1, and asserted SEPARATELY on purpose: the failure this catches
      is ONE resistor changed, not both. Note the deliberate order-day lever in
      DETAIL_DESIGN section 2 — populating R_T2 as 0 ohm trades RX1 loss for
      reference SIR. If that lever is ever pulled, THIS assertion is what must
      be updated, which is exactly why it lives here and not in prose"

  # ---- the RF port assignment, which nothing in copper can check -------
  - assert: pin_on_net
    pin: "U_SW.24"
    net: ANT1
    adr: "0001"
    why: "RF1 (pin 24) is the DELTA REFERENCE for the entire published phase
      table and the power-on default (select 0000). If RF1 and some other port
      were swapped, every published delta would be silently re-referenced and
      the board would look perfectly correct in every artifact"

  - assert: pin_on_net
    pin: "U_SW.19"
    net: RX1_TAP
    adr: "0001"
    why: "RF8 (pin 19) carries the TAPPED copy of the RX1 antenna and was chosen
      by an ISOLATION argument, not by convenience. Putting the tap on any other
      port silently changes which dwell is the shared-phase reference the host
      correlates against — and the sweep still runs"

  - assert: pin_on_net
    pin: "U_SW.22"
    net: RX2_OUT
    adr: "0001"
    why: "RFC (pin 22) is the switch common and the only path to PlutoSDR RX2.
      It is asserted because it is the one net whose length is COMMON-MODE
      across all eight paths — wired to an RF port instead, the board would
      still switch and every published delta would be wrong by a different
      amount"

  # =====================================================================
  # ADR-0002 — assembly posture, power-entry boundary, control-plane defaults
  # =====================================================================
  - assert: pin_on_net
    pin: "U_SW.1"
    net: GND
    adr: "0002"
    why: "LS carries a 1 Mohm INTERNAL PULL-UP (PE42482A-X Table 5 fn 1, PDF
      p10). Floating it reads as logic 1 and selects the COMPLEMENTED half of
      the truth table — RF1<->RF8, RF2<->RF3, RF4<->RF7, RF5<->RF6. The board
      still sweeps eight antennas, in a plausible-looking WRONG ORDER, and no
      electrical check can see it. Table 3 fn 1 also makes it an RF ground"

  - assert: pin_on_net
    pin: "U_SW.20"
    net: GND
    adr: "0002"
    why: "NC may be grounded or left open (Table 8 fn 2). It sits between RF8
      and GND inside the RF fan, so grounding it closes the via fence there
      instead of leaving an unterminated stub in the middle of a radial star"

  - assert: series_chain
    chain: [SEL_V1, R_S1, SW_V1]
    adr: "0002"
    why: "The 47 ohm source termination must be IN SERIES between the module pin
      and the switch pin. Shunted or omitted, the far-end peak at the RP2040's
      strongest drive is 4.807 V against a 3.6 V digital absolute maximum
      (PE42482A-X Table 1, PDF p2 — the control pins are NOT rated to the
      supply). One chain per line, because one missing resistor is the failure"

  - assert: series_chain
    chain: [SEL_V2, R_S2, SW_V2]
    adr: "0002"
    why: "As R_S1. Asserted per line because the defect being caught is ONE
      termination missing or bridged, which a single representative assertion
      would not see"

  - assert: series_chain
    chain: [SEL_V3, R_S3, SW_V3]
    adr: "0002"
    why: "As R_S1, per line"

  - assert: series_chain
    chain: [SEL_V4, R_S4, SW_V4]
    adr: "0002"
    why: "As R_S1, per line — and V4 is the one that matters most: a floating V4
      selects the ALL-PORTS-TERMINATED state, which SILENTLY MUTES the receiver"

  - assert: pin_on_net
    pin: "R_PD1.1"
    net: SW_V1
    adr: "0002"
    why: "POSITION IS THE WHOLE POINT. The pull-down must sit on the SWITCH side
      of R_S1. On the module side it would still hold a level, but not the one
      that matters: V1..V4 have NO internal pull of any kind (5 uA max input
      current, Table 2 PDF p3), so all four FLOAT through reset and supply ramp,
      and a pull-down upstream of the series resistor does not guarantee the
      switch pin when the module is absent, unpowered, or still in reset"

  - assert: pin_on_net
    pin: "R_PD2.1"
    net: SW_V2
    adr: "0002"
    why: "As R_PD1 — switch side, per line"

  - assert: pin_on_net
    pin: "R_PD3.1"
    net: SW_V3
    adr: "0002"
    why: "As R_PD1 — switch side, per line"

  - assert: pin_on_net
    pin: "R_PD4.1"
    net: SW_V4
    adr: "0002"
    why: "As R_PD1 — switch side, per line. V4 is the bit whose float mutes the
      receiver, so this is the assertion that keeps a silent board from being a
      plausible one"

  - assert: part_value
    part: R_S1
    equals: 47
    tolerance_pct: 10
    adr: "0002"
    why: "PE42482A-X's digital absolute maximum is 3.6 V while its VDD absolute
      maximum is 5.5 V — the control pins are NOT rated to the supply, leaving
      300 mV of headroom on a 3.3 V rail. Unterminated, the far-end peak into
      the ~67 ohm control line at the RP2040's strongest drive is 4.807 V; with
      47 ohm it is 3.181 V. A WRONG VALUE is invisible to every gate that grades
      topology, which is why the VALUE is asserted and not only the part"

  - assert: part_value
    part: R_PD1
    equals: 10000
    tolerance_pct: 10
    adr: "0002"
    why: "Sets the undriven level (5 uA x 10 k = 50 mV, far below V_IL) and the
      driven level (3.3 x 10000/10047 = 3.2846 V, far above V_IH 1.17 V). Too
      large and leakage lifts the pin; too small and it fights the driver. Both
      failures are silent and neither moves any other artifact"

  # =====================================================================
  # ADR-0003 — one stackup, one constant set. NO INVARIANT IS EMITTED, and
  # that is stated rather than left as a gap: ADR-0003 decides a NUMBER
  # (eps_eff and everything descending from it), not a TOPOLOGY. E-INV's four
  # kinds assert netlist facts; a propagation constant is not one. Its
  # machine-checkable home is the `<!-- bound: VIA_FENCE_PITCH -->` block in
  # the ADR itself, which `adr_bound_provenance.py` REGENERATES (canon
  # M-BOUND). Recorded here so that a reader auditing ADR-to-invariant
  # coverage finds the answer instead of a hole. ADR-0003 is not tagged
  # `protection` or `topology`, so E-ADR does not ask it for one.
  # =====================================================================
