# assembly.yaml — pluto-rx2-8way-v2
# The ONE machine-readable home for "who gets placed, and why not"
# (canon A-POP / A-STOCK). The release MANIFEST's `not_assembled:` line is
# GENERATED from this file, never hand-written beside it.

service: standard
sides: [top]
fiducials: none
# Deliberate, not silence. JLC adds their own fiducials on the rails for SMT
# orders. LOCAL fiducials beside a fine-pitch part are OUR job and cannot be
# added later — the finest pitch on this board is PE42482A-X's QFN-24 at
# 0.50 mm, above the <=0.4 mm threshold where local fiducials start to matter.
# NOTE the module changed this answer: v1 carried a 0.400 mm QFN-56 and v2 does
# not, so the case for local fiducials got WEAKER, not stronger. Stated because
# "none" is the same word in both boards and it is not the same decision.
build_quantity: 5

# ---- NOT ASSEMBLED ---------------------------------------------------------
not_assembled:
  - refs: [H1, H2, H3, H4]
    reason: mechanical
    evidence: "M3 mounting holes, no footprint pads with nets (floorplan 2026-07-30)"
    disposition: "n/a"

# ---- CONSIGNED (we supply, JLC PLACES — these stay ON the CPL) --------------
# A consigned part is ASSEMBLED. It is a SOURCING class, not a population class.
consigned:
  - refs: [U_MCU]
    lcsc: C9900173620
    msl: >
      OWED — NOT A NUMBER, AND DELIBERATELY NOT INVENTED. Waveshare publishes no
      MSL rating and no reflow profile for RP2040-Zero: it is a finished
      consumer assembly, not a component sold in a moisture-barrier bag, so
      there is no datasheet line to read. Filling this field with a plausible
      "MSL 3" would be indistinguishable from a datasheet read, and the schema
      exists precisely because crow-recorder-central v1.0 shipped a consigned
      MSL-3 part with zero MSL text in its order paperwork.
      MITIGATION, to be stated in the ORDER_README rather than encoded as a
      fact: treat as unknown-MSL per JEDEC J-STD-033 — bake before shipping, or
      ship in a desiccated bag with a humidity indicator and let JLC bake.
      TO CLOSE THIS: ask Waveshare directly, or accept the bake unconditionally.
    evidence: >
      LIVE JLC catalog read 2026-07-30 via
      POST /api/overseas-pcb-order/v1/shoppingCart/smtGood/selectSmtComponentList
      over 20 keyword forms. RESULT: no Pico-class RP2040 module is
      machine-placeable from JLC stock. The entries WITH stock (Raspberry Pi
      Pico C7203002 at 1499, Pico W C7203003 at 1177) carry NO package field at
      all and sit under "Development Boards & Tools" with an LCSC retail URL —
      they are boards LCSC mails you, not line parts. Every entry that carries a
      real footprint is stock 0: C5159530 (LCC-43), C19193665 (SMD,51x21mm),
      C9900255426, C9900173620 (LCC-23, 18x23.5 — this part), C9900177322.
      Controls confirming the discriminator, same day: C1525 100nF 0402 package
      "0402" stock 46,923,438; C701342 ESP32-WROOM-32E package "SMD,25.5x18mm"
      stock 19,416; C2980306 ESP32-PICO-MINI-02 package "SMD-53P,16.6x13.2mm"
      stock 853; C2040 bare RP2040 package "LQFN-56(7x7)" stock 63,091.
      A placeable part always carries a real package string.
      DECISIVE DETAIL: C9900255426's erpComponentName reads
      "【邮寄专用】PICO" — "mail-in only". JLC's own record says the
      footprint-bearing entries exist to place modules YOU ship them.
      HONEST LIMIT: `assemblyComponentFlag` is false on every record including
      C2040, so it is not the capability flag it appears to be. The conclusion
      is INFERRED from catalog field structure against the four controls above;
      no test order was placed.
      WHY NOT `not_assembled` WITH `reason: not_in_catalog`: that would be
      FALSE. The part IS catalogued, with a real footprint. See ADR-0002.
    disposition: >
      ORDER_README section 1b: buy 5+ RP2040-Zero modules, ship with the order,
      JLC places onto LCC-23(18x23.5). Bake or desiccate per the msl: note.
      FALLBACK, prepared rather than improvised: if consignment is declined at
      order time, this becomes a `not_assembled:` entry with
      `reason: user_supplied` + `on_bom: false` + FP_EXCLUDE_FROM_POS_FILES on
      the board — we supply AND fit it, so JLC is asked neither to place nor to
      source it, and no unmatched row stalls their BOM matcher.

# ---- SOURCING PLAN (justifies a non-OK stock line at seal time) ------------
sourcing_plan:
  - lcsc: C9900173620
    measured_stock: 0
    measured_on: 2026-07-30
    plan: >
      NOT A STOCK-OUT. C99* codes are JLC consigned-sourcing placeholders and
      are permanently stock 0 BY CONSTRUCTION — the skill says so and this read
      confirms it (brand literally "JLCPCB Assembly", isBuyComponent "0",
      minPurchaseNum 444). JLC stock is irrelevant for this line; what must be
      re-checked before ordering is OUR OWN holding, that we have >= 5 modules
      to ship. Retail availability is broad (Waveshare direct, Amazon, Mouser,
      DigiKey) and is not a single-source risk.

# ---- EXEMPT REFDES CLASSES -------------------------------------------------
exempt_prefixes: [H, TP, FID, MH]
