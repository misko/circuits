sourcing:
  lcsc: C7519
  alternates: [C2827638, C1972959] # C2827638 = USBLC6-2P6, ST's OWN SOT-666
                                   # sibling in this same datasheet: identical
                                   # die and identical pin function, 2.9 mm2
                                   # instead of 9 mm2 — but a DIFFERENT land
                                   # (Figure 20, PDF p11) so it is a footprint
                                   # change, never a drop-in. C1972959 =
                                   # TPD2E2U06DRLR (SOT-553), already in the
                                   # proven-parts ledger as
                                   # esd-2ch-bidirectional-sot553 — 2-channel
                                   # like this part but with NO VBUS clamp leg,
                                   # so swapping to it silently DELETES the
                                   # VBUS protection and leaves D_TVS alone on
                                   # that node. Neither alternate's numbers were
                                   # independently read here.
asserts:
  - assert: value
    equals: USBLC6-2SC6
    why: "the BOM Comment must name the full order code. SOT23-6 is the single
      most crowded package on any BOM and the marking on the part is 'UL26'
      (Table 5, PDF p13), which resolves to nothing a human recognises — so the
      BOM Comment is the ONLY place the identity is legible before reflow. The
      near-miss that matters is a 2-channel array WITHOUT the VBUS leg (e.g.
      TPD2E2U06 class, listed as an alternate above): it drops into the same
      six pads, protects D+/D- identically, and silently removes the VBUS clamp
      at the connector — leaving that node to D_TVS alone, which sits behind
      F_IN on VBUS_F and is a different clamp on a different node. The board
      assembles, enumerates and passes every electrical check with a protection
      leg missing."
