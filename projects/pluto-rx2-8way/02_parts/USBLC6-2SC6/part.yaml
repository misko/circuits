layout:
  source: "ST DocID11265 Rev 5 section 2.3 'How to ensure good ESD protection'
    (PDF p5) with its Important note — 'put the protection device as close as
    possible to the disturbance source (generally the connector)' — plus
    Figure 7 'ESD behavior: layout optimization' (PDF p5, the explicit
    unsuitable-vs-optimized pad picture), Figure 18 'USBLC6-2 PCB layout
    considerations' (PDF p9, the CBUS = 100 nF at VBUS), and the arithmetic in
    section 2.2 (PDF p4) that puts a VOLTAGE on every millimetre of track."
  reviewed: "2026-07-28"
  keep_short:
    - {net: USB_DP, max_span_mm: 20, why: "CITED-then-DERIVED. sec 2.2 makes
       track length a clamp-voltage term (6 nH per 10 mm x 0.5 mm => +144 V at
       24 A/ns), so 'short' here is not tidiness. 20 mm is the whole-net pad
       span P-ADJ can measure — J_USB [46.0, 87.0] -> U_ESD [54.0, 84.0] ->
       U_MCU [46.0, 72.0] is ~16 mm on the floorplan as declared — and it is a
       real ceiling: it forbids the pair leaving the digital strip and crossing
       the receive fan. The BINDING sub-constraint is the connector-to-array
       segment; see adjacency:."}
    - {net: USB_DM, max_span_mm: 20, why: "as USB_DP. The pair must be budgeted
       together — Table 2's 0.015 pF I/O-to-GND matching is the reason to buy
       this part, and asymmetric routing throws it away."}
    - {net: VBUS, max_span_mm: 25, why: "pin 5 is where an I/O surge is DUMPED,
       not a bystander: the rail-to-rail topology steers the strike up into the
       Transil, so pin 5's inductance is in series with the clamp exactly like
       pin 2's. It also carries the F_IN/D_TVS/C_BULK/C_LDI chain, which USB 2.0
       sec 7.2.4.1 caps at 10 uF of device-side bypass (this board budgets
       5.7 uF, DETAIL_DESIGN sec 5) — a budget that only means anything if the
       bypass is local to the rail it is bypassing."}
  adjacency:
    - {refdes: [U_ESD, J_USB], max_mm: 2.0, why: "THE rule of this part, and the
       one number worth arguing about. From sec 2.2: 2 mm of 0.5 mm track is
       ~1.2 nH, so the parasitic adder is ~29 V per leg and the clamp the RP2040
       sees stays near 75 V instead of 305 V. sec 2.3's Important note says the
       same thing in words. FINDING, recorded rather than absorbed: the
       floorplan currently has U_ESD at [54.0, 84.0] and J_USB at [46.0, 87.0]
       — about 8 mm lateral, several times this budget. The array belongs
       straddling the D+/D- escape immediately behind the connector pads, with
       the CC resistors beside it, not in a line of parts to one side."}
    - {refdes: [U_ESD, C_ESD], max_mm: 2.0, why: "Figure 18 (PDF p9) puts
       CBUS = 100 nF ON the VBUS pin. OWED: this board's DETAIL_DESIGN sec 5
       passives table does not yet carry that capacitor — it lists C_BULK,
       C_LDI, C_LDO, C_SW1/2, C_MCU1..4 and no VBUS-pin 100 nF. Either it is
       added (it is 0.1 uF and does NOT count against the USB 2.0 10 uF cap in
       the way the bulk does, but it does count in the 6.1 uF total ADR-0004
       quotes) or the omission is dispositioned. Do not let it fall between the
       two dossiers."}
  notes:
    - "DERIVED: pin 2 is the ONLY ground and the return for every clamped
       event. Give it its own via to the L2 solid plane AT the pad — not a
       shared neck, not a trace to the nearest stitch. By sec 2.2's numbers a
       10 mm ground trace alone costs 144 V of clamp."
    - "DERIVED: route D+ IN on pin 1 / OUT on pin 6 and D- IN on pin 3 / OUT on
       pin 4, so the connector-side and MCU-side tracks physically terminate on
       opposite pads. It is the same net either way, so this is invisible to
       every gate on the board and has to be a placement/routing intent that
       someone holds."
    - "OWED: no manufacturer EVM, application note or routed reference layout
       beyond Figures 7 and 18 was fetched — ST publishes AN1236/AN1181-class
       ESD application notes and none were read, because st.com's resource host
       is unreachable (see datasheet.note). Recorded as blocked, not absent.
       No OSHWLab-by-LCSC board was searched for C7519 either."
