gotchas:
  - "WHAT IT PROTECTS, EXHAUSTIVELY: TWO data lines plus the VBUS rail. Figure 1
     (PDF p1) is a rail-to-rail array — two steering diodes per I/O (I/O up to
     VBUS, GND up to I/O) and ONE Transil between VBUS and GND. There are
     exactly two I/O channels: pins 1+6 are one node, pins 3+4 the other. On
     this board that is USB_DP, USB_DM and VBUS.
     WHAT IS THEREFORE LEFT UNPROTECTED ON THE TYPE-C RECEPTACLE:
       CC1 (J_USB.A5), CC2 (J_USB.B5), SBU1 (A8), SBU2 (B8).
     That is ACCEPTABLE HERE, and the reason is a property of THIS board, not a
     property of the part: SBU1/SBU2 carry NO trace at all (explicit
     no-connect — a pad with nothing behind it has no victim), and CC1/CC2
     terminate in R_CC1/R_CC2 5.1 kOhm to GND AND NOTHING ELSE — there is no PD
     controller, no CC mux, no MCU pin, no silicon of any kind on CC. The whole
     CC exposure is a 0402 resistor whose worst failure is going open, which
     stops the board being recognised as a sink; it cannot propagate. Every pin
     with SEMICONDUCTOR behind it — D+/D- into the RP2040 PHY, VBUS into the
     LDO — is covered. THE CONDITION IS FALSIFIABLE AND MUST BE RE-CHECKED IF
     IT CHANGES: the moment anything active is put on CC or SBU (a PD sink
     controller, a debug UART on SBU, even a test point that leads somewhere),
     this conclusion is VOID and a 4-channel array becomes the right answer.
     Named alternates for that day: TPD4E05U06 (4-ch, 0.9 pF, CC-rated) or a
     second USBLC6-2SC6 across CC1/CC2 — NOT a silent swap, a re-decision."
  - "IT DOES NOT PROTECT AGAINST SUSTAINED OVERVOLTAGE, AND ITS SURVIVAL DEPENDS
     ON ADR-0004's CC DECISION. VBR is 6 V MIN at 1 mA (Table 2) and the leakage
     spec is quoted at VRM = 5.25 V — which is EXACTLY this board's declared
     VBUS maximum (ARCHITECTURE sec 3). So the array sits just under its knee in
     normal operation and is off (150 nA max). Put 9 V on VBUS and it conducts
     CONTINUOUSLY into a die rated for microsecond pulses, and it cooks. What
     makes 9 V unreachable is R_CC1/R_CC2 = 5.1 kOhm advertising a plain 5 V
     sink so no PD source ever negotiates up (ADR-0004). Those two resistors are
     part of THIS part's protection story, which is why ADR-0004 calls them a
     PROTECTION decision and machine-asserts their value."
  - "IT IS NOT A SUBSTITUTE FOR D_TVS AND D_TVS IS NOT A SUBSTITUTE FOR IT — THE
     TWO SIT ON DIFFERENT NODES AND DIFFERENT TIME SCALES. This array clamps
     12 V at 1 A / 17 V at 5 A on an 8/20 us pulse: a small die for a fast,
     low-energy ESD strike, and its whole value comes from being AT the
     connector. D_TVS is a 5.0 V-standoff SMAJ5.0A-class part clamping ~9.2 V at
     43.5 A on VBUS_F, downstream of F_IN, for the energy event (ADR-0004).
     Deleting either because 'the other one covers VBUS' is the error."
  - "WHICH NODE PIN 5 SITS ON IS AN OPEN SCHEMATIC DECISION AND IT IS NOT FREE.
     ADR-0004 puts the FUSE UPSTREAM OF THE CLAMP deliberately, so that a TVS
     failing short opens F_IN rather than burning. But the rail-to-rail topology
     means an I/O surge is DUMPED INTO PIN 5, so pin 5 wants the lowest-
     inductance path to the source it can get — i.e. raw VBUS, on the CONNECTOR
     side of F_IN, not VBUS_F behind a PPTC's resistance and inductance.
     The two arms, costed: pin 5 on VBUS_F puts the PPTC in the ESD return path
     and raises the clamp; pin 5 on raw VBUS means a shorted VBUS leg is limited
     only by the HOST's own current limit, not by F_IN. Either is defensible;
     what is NOT defensible is choosing by accident. RAISE IT AT SCHEMATIC
     CAPTURE and record the choice — this dossier deliberately does not silently
     decide something ADR-0004 owns. Whichever node is chosen, Figure 18
     (PDF p9) requires a 100 nF (CBUS) at pin 5."
  - "PINS 1 AND 6 ARE THE SAME NET AND SO ARE 3 AND 4 — 'IN-LINE' IS A LAYOUT
     RULE, NOT A CIRCUIT ONE. Figure 1 shows a straight internal connection.
     Wiring only pin 1 to USB_DP and leaving pin 6 open is electrically
     identical and LAYOUT-WRONG: routing the data line IN on 1 and OUT on 6
     (and IN on 3, OUT on 4) is what forces the trace to physically pass through
     the clamp with a zero-length stub. Figure 7 'ESD behavior: layout
     optimization' (PDF p5) draws exactly this as the unsuitable-vs-optimized
     pair. Same net either way, so no ERC, DRC or parity check can tell them
     apart."
  - "THE INDUCTANCE ARITHMETIC IS THE WHOLE PART. Section 2.2 (PDF p4): a
     10 mm x 0.5 mm track is ~6 nH; at dI/dt = Ip/tr = 24 A/ns that is 144 V on
     the I/O leg AND 144 V on the GND leg, so the clamp the RP2040 actually
     sees goes from 31.2 V to 319.2 V. ST prints those numbers to make the point
     that an unsuitably laid-out USBLC6-2 is worse than none, because the
     designer thinks the port is protected. Pin 2 is the SINGLE ground pin and
     carries the entire return — it gets its own via to the L2 plane at the pad,
     never a trace to a distant stitch."
  - "KICAD SOT-23-6 vs ST FIGURE 22, MEASURED. Figure 22 'SOT23-6L footprint
     dimensions in mm' (PDF p12) gives pad 0.60 wide x 1.20 long, pitch 0.95,
     row centre-to-centre 2.30 (= 1.20 + 1.10 gap), outer span 3.50.
     Package_TO_SOT_SMD:SOT-23-6 gives pads 0.60 x 1.325 at x = +/-1.1375,
     y = 0, +/-0.95:
       pad WIDTH   0.60  vs 0.60   EXACT
       PITCH       0.95  vs 0.95   EXACT
       pad LENGTH  1.325 vs 1.20   +0.125 (IPC toe/heel)
       row centre  2.275 vs 2.30   -0.025
       outer span  3.60  vs 3.50   +0.10
       inner gap   0.95  vs 1.10   -0.15
     Both lands fully cover the lead seating zone, which Table 4 bounds at
     0.75 (E/2 max) to 1.50 (H/2 max) from the centre: ST spans 0.55-1.75,
     KiCad 0.475-1.80. The only differences are the standard IPC expansions.
     DECLARED AS A MATCH — no project-local footprint owed for this part."
  - "MSL / BAKE: the datasheet states NO moisture sensitivity level for
     SOT23-6L. Reported as an ABSENCE, not as MSL 1 — which is why there is no
     `msl` assert below. If the order paperwork needs a level, get it from the
     ECOPACK grade on the reel label, not from this sheet."
  - "USBLC6-4SC6 APPEARS IN THIS DATASHEET (Figure 14, PDF p8) AND IS NOT IN IT.
     Figure 14's lower diagram shows a 4-line sibling on the downstream side.
     There is no pinout, no land drawing and no electrical table for it here —
     if it is ever wanted, that is a different datasheet and a fresh S-VER read,
     not an extrapolation from this one."
