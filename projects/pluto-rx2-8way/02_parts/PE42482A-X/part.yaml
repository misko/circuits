gotchas:
  - "TRUTH TABLE IS A STRAIGHT 3-BIT BINARY MUX WITH V1 AS MSB (Table 5, PDF
     p10). With LS=0 and V4=0: RF_n is selected where n-1 = 4*V1 + 2*V2 + 1*V3.
     That is the whole decode — three PIO lines, no external logic, no decoder.
     V3 is the LSB. Getting V1/V3 backwards silently reverses the antenna sweep
     order, which an AoA solution absorbs as a rotated array and NOTHING on the
     board can detect."
  - "LS HAS A 1 MEGOHM INTERNAL PULL-UP AND MUST BE TIED TO GND (Table 5 fn 1,
     PDF p10). Left floating it reads as logic 1, which selects the SECOND,
     complemented half of the truth table — RF1 and RF8 swap, RF2<->RF3,
     RF4<->RF7, RF5<->RF6. A board that forgets the LS ground still sweeps eight
     antennas in a plausible order. Table 3 fn 1 (PDF p9) additionally says
     'insertion loss and isolation performance can be improved by a good RF
     ground on the LS pin (pin 1)', so the tie must be a SHORT via to the
     ground plane at the pad, not a trace to a distant net."
  - "V1-V4 HAVE NO INTERNAL PULL OF ANY KIND — only 5 uA max input current
     (Table 2, PDF p3). All four FLOAT on an unprogrammed board, during RP2040
     reset and through supply ramp, so the selected antenna is undefined. V4
     is the worst case: V4=1 with V1=V2=V3=0 is the ALL-PORTS-TERMINATED state
     (Table 5 last row, PDF p10), so a floating V4 can silently mute the
     receiver. External pull-downs on all four are MANDATORY."
  - "DIGITAL ABS-MAX IS 3.6 V WHILE VDD ABS-MAX IS 5.5 V (Table 1, PDF p2). The
     control pins are NOT rated to the supply. On a 3.3 V rail this is a 300 mV
     margin, and it forbids ever running this part at 5 V with 5 V logic."
  - "NO DC BLOCKING CAPACITORS ARE REQUIRED, provided every RF pin sits at
     0 VDC (Table 8 fn 1, PDF p20; Product Description, PDF p1). This is what
     removes the 85.7:1-bandwidth DC-block problem from the signal path — no
     single capacitor value spans 70 MHz to 6 GHz. The 0 VDC proviso is a BOARD
     obligation: any antenna port that can see an external DC source still
     needs its own block, and that decision is OWED, not settled here."
  - "ABSORPTIVE, NOT REFLECTIVE. Deselected ports are internally terminated in
     50 ohm (functional diagram Figure 1, PDF p1; 'Return loss (terminated
     port)' rows, Table 3 PDF p7, 15-23 dB typ across the band). For an antenna
     array this is a first-order property, not a nicety: with a reflective
     switch each deselected element is short-circuited, and the mutual coupling
     seen by the SELECTED element then changes with which element is selected.
     Absorptive termination holds every deselected element at ~50 ohm in all
     eight states, which is what makes the per-path phase CONSTANT (brief D4)."
  - "RELATIVE INSERTION PHASE IS PUBLISHED WITH MIN/TYP/MAX (Table 3, PDF p8) —
     RF2-RF1, RF3-RF1, RF4-RF1 at 1/2/4/6/8 GHz, and symmetric for
     RF7-RF8/RF6-RF8/RF5-RF8. At 6 GHz: RF2-RF1 -9.4/-2.8/+3.8 deg,
     RF3-RF1 -11.2/-5.7/-0.3 deg, RF4-RF1 -35.8/-26.3/-16.9 deg. The die's own
     port-to-port phase spread is therefore ~26 deg typ at 6 GHz and the
     unit-to-unit band on the worst term is ~19 deg wide. This is the vendor
     bound the release's measured phase table (brief D4) is checked against —
     no comparable data exists for ANY of the SPDT alternatives."
  - "RETURN LOSS HAS NO MIN COLUMN anywhere (Table 3, PDF pp6-7) — every RL row
     is typ-only, and the port-to-port spread is large: at 4-6 GHz the RFC-port
     RL is 24 dB typ on RF1/8 but 13 dB typ on RF3/6. Insertion loss (max) and
     isolation (min) ARE guaranteed; match is not. Budget accordingly."
  - "PER-PORT IL AND ISOLATION ARE NOT EQUAL AND THE DATASHEET SAYS SO. IL max
     at 4-6 GHz: 1.9 dB (RF1/8), 2.3 (RF2/7), 2.2 (RF3/6), 2.2 (RF4/5). The
     die is a binary tree internally; the ports are not interchangeable. Assign
     the RF1/RF8 pair to the paths whose sensitivity matters most."
  - "MSL1, 24-lead QFN, 0.5 mm pitch with an exposed pad: PCBA part. Reflow
     only; the EP cannot be hand-soldered or visually inspected."
  - "ORDER CODE. Table 9 (PDF p23) lists exactly ONE production code,
     'PE42482A-X', 500 units/T&R. LCSC also carries a bare 'PE42482A'
     (C726151) at a different reel count; treat it as a distributor string for
     the same die+package, but order the -X."
