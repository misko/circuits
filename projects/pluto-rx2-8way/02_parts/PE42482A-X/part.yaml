layout:
  source: "pSemi DOC-75785-4 has NO prose Layout/Application-Information section
    — reported as an absence rather than invented. What it DOES publish is
    Figure 21 'Evaluation Board Layout for PE42482' (PDF p19), and that figure
    is the reference layout: an OCTAGONAL board with U1 at the exact geometric
    CENTRE, nine edge-launch SMA jacks (J0=RFC at 12 o'clock, J1..J8 = RF1..RF8
    around the remaining facets), and nine EQUAL-LENGTH 50 ohm traces radiating
    RADIALLY from the package to the board edge, each flanked by a continuous
    ground-via fence. The digital section (C1-C4 bypass cluster, R1, JP1/JP2
    strap jumpers, J11 control header) is grouped entirely on the pin-7..12
    edge, OUTSIDE the RF fan, and the control nets escape on the BOTTOM layer
    (visible in the p19 bottom-copper view) so they never cross an RF trace.
    Two further placement rules come from the pin table itself: Table 3 fn 1
    (PDF p9) makes LS an RF GROUND, and Table 8 fn 2 permits NC (pin 20) to be
    grounded — pin 20 sits between RF8 and GND inside the RF fan, so grounding
    it closes the fence there. The radial-star archetype is what the AoA
    requirement wants anyway: equal trace length is equal phase by
    construction, and it is the pin-out's natural form because the eight RF
    ports are distributed one per side-pair around the package."
  reviewed: "2026-07-27"
  keep_short:
    - {net: SW_VDD, max_span_mm: 3, why: "bypass at pin 8. The EVK clusters
       C1-C4 immediately against the pin-7..12 edge (Figure 21, PDF p19); IDD
       is 120 uA typ so this is decoupling for control-line transients, not
       for load current, and it must sit at the pad to be that"}
    - {net: SW_LS, max_span_mm: 2, why: "pin 1 is BOTH a logic input with a
       1 Mohm internal pull-up AND, per Table 3 fn 1, an RF ground whose
       quality moves IL and isolation. It has to be a via to plane at the pad;
       any measurable span means it is neither a hard logic 0 nor an RF ground"}
    - {net: SW_V4, max_span_mm: 4, why: "pull-down at pin 12. V4=1 with
       V1..V3=0 mutes every port (Table 5, PDF p10), so this is the pin whose
       float is silent. The resistor belongs at the pad, not at the PIO end"}
  notes:
    - "DERIVED (my reading, not the datasheet's words): the RF ports are
       interleaved with GND on three of four sides (RF2/GND/RF3/GND/RF4,
       RF5/GND/RF6/GND/RF7, RF8/NC/GND/RFC/GND/RF1), so every RF launch already
       has a ground land on at least one flank. The ONE side with no RF at all
       is pins 7-12 — that is where the escape budget of 5 lands, and it is
       also where the whole digital section belongs. Rotating the package so
       that side faces the RP2040 costs nothing and buys a clean split."
    - "DERIVED: RFC (pin 22) is on the TOP side between two GND pins, opposite
       the digital side. On this board RFC is the single output to Pluto RX2,
       so the natural floorplan is Pluto-facing edge at the top, eight antenna
       SMAs around the remaining perimeter, RP2040 at the bottom."
    - "OWED: pSemi publishes an EVK (EK42482-02) and a 'Multi-throw Count RF
       Switch Evaluation Kit (EVK) User's Manual'. Neither was fetched during
       the D-SPEC spike. Fetch before drawing the floorplan — Figure 21 is a
       raster of the EVK, not its dimensions."
