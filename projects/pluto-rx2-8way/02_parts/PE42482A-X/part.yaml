sourcing:
  lcsc: C5121458
  alternates: [C726151, C500479]   # C726151 = 'PE42482A', same die+package per
                                   # Ordering Info Table 9 (which lists only
                                   # -X). C500479 = PE42582A-X, the 9 kHz-8 GHz
                                   # sibling in the same QFN-24 4x4 — SAME
                                   # 3-bit parallel control, but it adds a
                                   # VSS_EXT pin, so it is NOT drop-in and its
                                   # numbers were NOT independently read here.
asserts:
  - assert: value
    equals: PE42482A-X
    why: "the BOM Comment must name the ORDER CODE, not the family. Table 9
      (PDF p23) lists exactly one production code and it carries the -X. The
      neighbouring family parts are throw-count variants in the SAME 24-lead
      4x4 QFN — PE42462 is an SP6T and PE42442 an SP4T — so a substitution that
      looks like a package match silently deletes two or four antennas from an
      eight-element array, and the board would assemble, power up and sweep."
