sourcing:
  lcsc: C20625731                  # JLC **extended** library tier (checked
                                   # 2026-07-28). Extended is accepted here on
                                   # purpose: this board already carries an
                                   # extended part it cannot avoid (RP2040,
                                   # C2040), so the per-order extended-component
                                   # fee is already paid, and the marginal cost of
                                   # a second extended line is a reel setup
                                   # against a crystal that the MCU vendor tuned
                                   # its own silicon reference against.
  alternates: [C50430, C70565]     # C50430 = YXC X322512MMB4SI, 3225, 12 MHz,
                                   # CL 10 pF — the only land-identical part found
                                   # that also matches C_L, so the 15 pF caps
                                   # would carry over. Its ESR and drive level
                                   # were NOT independently read here, so the
                                   # 1 kohm would have to be re-derived, and its
                                   # stock is thin (~1.7k, 2026-07-28).
                                   # C70565 = YXC X322512MOB4SI, CL 12 pF — listed
                                   # because it is deep-stocked and land-identical
                                   # and someone WILL find it; at CL 12 pF the
                                   # caps become 2*(12-3) = 18 pF, so it is a
                                   # BOM-changing swap, not a drop-in.
                                   # DELIBERATELY NOT LISTED: C9002
                                   # X322512MSB4SI, the JLC Basic 12 MHz 3225.
                                   # CL 20 pF. See gotchas — it is the cheap trap,
                                   # not an alternate.
asserts:
  # Same known gate gap as this board's other parts: part_facts_check.py decodes
  # `equals:` with an SI parser and cannot read an alphanumeric MPN, so this
  # prints P-FACT-CONFIG rather than a pass (measured on this project 2026-07-28,
  # before this dossier existed: KH-SMA-KE-Z and PE42482A-X were already in that
  # state). Declared anyway — CONFIG is loud, prose is not.
  - assert: value
    equals: ABM8-272-T3
    why: >
      the BOM Comment must carry the -272 configuration code, because every
      electrical check on this board is blind to the one parameter that matters.
      JLC's basic-library X322512MSB4SI is the same 3.2 x 2.5 land, the same
      12.000 MHz, cheaper and thirteen times deeper in stock, and its C_L is
      20 pF against this part's 10. Fitted against 15 pF capacitors it is loaded
      to about half what it needs; DRC, ERC, schematic parity, the netlist and
      assembly inspection all pass, and the failure surfaces as a clock that is
      tens of ppm off with unknown cold start-up margin. The fleet has already
      written this lesson down once, in proven-parts.yaml under
      crystal-24mhz-3225 — "match CL, not just frequency, when substituting".
