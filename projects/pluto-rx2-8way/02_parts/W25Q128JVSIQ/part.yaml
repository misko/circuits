sourcing:
  lcsc: C97521                     # JLC **base** library tier (checked 2026-07-28)
  alternates: [C113767, C179173]   # C113767 = the IDENTICAL W25Q128JVSIQ at
                                   # EXTENDED tier — same part, worse cost, see
                                   # gotchas. C179173 = W25Q32JVSSIQ, 4 MB, same
                                   # SOIC-8-208mil land and the same -SIQ (QE = 1)
                                   # ordering option, extended tier: the fallback
                                   # if 128 Mbit ever goes short. Its electricals
                                   # were NOT independently read here — treat the
                                   # swap as a new dossier, not a drop-in.
asserts:
  # Same known gate gap as the other parts on this board: part_facts_check.py
  # decodes `equals:` with an SI parser and cannot read an alphanumeric MPN, so
  # this prints P-FACT-CONFIG rather than a pass (measured on this project
  # 2026-07-28, before this dossier existed: KH-SMA-KE-Z and PE42482A-X both
  # already sit in that state). Declared anyway — CONFIG is loud, prose is not.
  - assert: value
    equals: W25Q128JVSIQ
    why: "the last two characters decide whether the board boots. Section 11
      (PDF p75) makes -IQ mean QE = 1 factory-FIXED and -IM mean QE = 0
      programmable; W25Q128JVSIM is the same die, the same SOIC-8 208-mil, the
      same eight functions and the same footprint, and it arrives with IO2/IO3
      disabled. A BOM Comment reading 'W25Q128JV', '16MB QSPI flash' or
      'W25Q128' cannot distinguish them, no DRC, ERC, parity or assembly
      inspection can see the difference, and the board fails at the first XIP
      fetch — after it has already enumerated over USB."
