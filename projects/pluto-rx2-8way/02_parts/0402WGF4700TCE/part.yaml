# ===========================================================================
# STATUS: REJECTED ALTERNATE — NOT ON THE BOARD.  Re-labelled 2026-07-28.
#
# This dossier was written during the D-SPEC spike as the PRIMARY series arm of
# the RX1 resistive pickoff. The user has since CONFIRMED D3 with the SPLIT-ARM
# variant: the arm is 2 x 220 ohm (0402WGF2200TCE, C25091), and this single
# 470 ohm part is the alternate that LOST. See ADR-0002.
#
# It lost on ONE property, and not the one the numbers below emphasise. Its
# arithmetic is CORRECT and its tap/IL/RL figures are strictly fine. What
# beats it is that a single arm carries the full 0402 shunt parasitic, so its
# 6 GHz tap tilt is +1.69 dB with an UNCERTAINTY BAND 2.73 dB WIDE (from the
# +/-0.02 pF bar on C_p), against +0.43 dB and 0.83 dB for the split arm. A
# known tilt calibrates out; an unknown one does not, and this board sells a
# published, bounded path table (ADR-0006).
#
# THE DIRECTORY IS KEPT DELIBERATELY, against the 02_parts contract's usual
# rule that a rejected candidate keeps its reason and not its dossier: this
# one was written first, was PRIMARY for a day, and its numbers are cited in
# 01_docs/journal/02_parts.md. Deleting it would leave those citations
# dangling and would erase the honest record that the primary changed.
# Registered as a deviation in 02_parts/README.md.
#
# NO PDF IS COMMITTED HERE, per the same contract. The datasheet is the UniOhm
# 1-CHIP SERIES sheet, which serves every 0402WGF value; the binary lives with
# the part that IS on the board, ../0402WGF2200TCE/.
# ===========================================================================
