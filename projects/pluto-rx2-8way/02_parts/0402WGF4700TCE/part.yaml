gotchas:
  - "THIS IS AN RF PART IN A PASSIVE PACKAGE. It is the series arm of the RX1
     resistive pickoff (brief T2/D3), so its PARASITICS are load-bearing and its
     resistance tolerance is not the interesting number. Vishay technical note
     60107 'Frequency Response of Thin Film Chip Resistors' (rev 04-Feb-09),
     TABLE 1 page 1, gives an 0402 WRAP-AROUND chip a model internal shunt
     capacitance C = 0.0392 pF and internal inductance L = 0.1209 nH. Uniroyal
     publishes NO high-frequency data for this thick-film part, so those figures
     are CITED FOR THE CLASS and ESTIMATED FOR THIS PART — call it
     0.04 +/- 0.02 pF. Consequence, worked in 01_docs/journal/02_parts.md: the
     -20 dB tap is flat to within 0.5 dB up to ~3 GHz and rises to about
     -18.6 dB at 6 GHz (+1.7 dB tilt). The MAIN-LINE loss is unaffected
     (0.408 dB at DC, 0.433 dB at 6 GHz)."
  - "THE SPLIT ARM WON, AND THIS IS THE ENTRY THAT PROPOSED IT. Two 220 ohm
     0402s in series (C25091, also JLC Basic) put their C_p in series, halving
     it to ~0.0196 pF: tilt +0.431 dB at 6 GHz instead of +1.691 dB, and the
     +/-0.02 pF uncertainty band narrows from 2.73 dB to 0.83 dB. Rs becomes
     440 ohm: tap -19.83 dB, main-line loss 0.432 dB, return loss 26.28 dB.
     The user CONFIRMED that variant on 2026-07-28 (ADR-0002), so this part is
     no longer the primary."
  - "ONE CASE STILL USES THIS VALUE CLASS, AND IT IS NOT THIS PART. ADR-0002
     records an alternate BUILD in which R_T2 is populated as 0 ohm, giving
     Rs = 220 (tap -15.42 dB, RX1 loss 0.769 dB) and +4.84 dB of
     reference-dwell SIR. That is a 0 ohm jumper plus one 220 ohm part — it
     does NOT bring 470 ohm back."
  - "JLC BASIC (library type 'base', live 2026-07-27, stock 1,885,144). Keeping
     it Basic is worth more than the 0.01 dB of accuracy a 0.1% thin-film part
     would buy: the tap ratio is a MEASURED release artifact under brief D4, not
     a design target, so tolerance buys nothing that measurement does not."
verified: "2-pad passive — exempt from the S-VER figure-citation requirement per
  the 02_parts contract. Originally (2026-07-27) read from the LCSC parametric
  record for C25117 with the PDF OWED. UPGRADED 2026-07-28: the series sheet
