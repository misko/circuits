asserts:
  # DECLARED BUT NOT ACTUALLY GRADED TODAY — the same limitation the
  # ../SMBJ6.0A and ../BLM21SP601SN1D dossiers record: part_facts_check.py
  # decodes `equals:` through parse_si(), which is NUMERIC-ONLY, so an MPN
  # string returns None and the entry reports P-FACT-CONFIG and grades NOTHING.
  # Reported, not fixed — part_facts_check.py lives under skills/.
  # A SECOND, BOARD-LEVEL DIVERGENCE the first one is hiding: this board's
  # schematic puts the LCSC CODE in `value`, not the MPN (measured 2026-07-28
  # from 06_build/netlists/pluto_rx2_8way.net — U_ESD "C7519", D_TVS "C83270",
  # U_LDO "C638611", ...), and this part's placeholder reads `__SW_LCSC__`.
  # The full finding is written up once, in ../KT-0603R/part.yaml's asserts:
  # comment; it is a single board-owner decision, not a per-dossier one.
  - assert: value
    equals: TS-1187A-B-A-B
    why: "the BOM Comment must name all four order-code fields, because THREE of
      them are undetectable after assembly and the part carries no marking at
      all. Every height code A..J and every force code A/B/C shares this exact
      land, this exact body and this exact drawing, so a substitution passes DRC,
      schematic parity, the JLC twin check and a pin review — and changes how
      hard the button is to press and whether a 0.3 mm actuator becomes a 4.0 mm
      one. The specific near-miss on this board is a HEIGHT swap: C318887 is
      TS-1187A-C-E-B, one field different, 2.5 mm tall and 260 gf, and it would
      stand 1.0 mm proud of any panel cut-out designed for the 1.5 mm part.
      There is also no `msl` assert here and that is deliberate: the drawing
      states no moisture level and an LCP/SUS/brass mechanical body is not a
      moisture-sensitive package — reported as an absence, not inferred."
  # NO `pad1_net_polarity` ASSERT: an SPST normally-open contact is SYMMETRIC.
  # Pad 1 and pad 2 are electrically interchangeable, so there is no polarity
  # fact to grade and asserting one would be inventing a constraint. On this
  # board pad 2 conventionally goes to GND, but that is a drawing convention and
  # swapping it changes nothing.
