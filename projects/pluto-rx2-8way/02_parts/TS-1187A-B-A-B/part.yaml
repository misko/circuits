package: >-
  SMD-4P gull-wing tact switch. Body 5.1 +/-0.05 x 5.1 +/-0.05 mm (top view),
  6.5 +/-0.25 mm across the terminal tips, terminal foot width 0.5 mm, terminal
  centre-to-centre across the body 3.7 +/-0.05 mm. Round plunger, diameter
  2.0 mm. Overall height H = 1.5 +/-0.05 mm for this order code (height code A),
  against a metal cover top at 1.2 mm — so the plunger stands 0.3 mm proud. Base
  0.9 mm. Weight 1.0 g. Materials, from the drawing's item table: keystake
  PA46/Brass, cover SUS nickel-plated, base LCP, contact fine-silver on SUS
  (natural), terminals brass 0.30 t, silver-plated. THE PART CARRIES NO MARKING
  — nothing on the body identifies the force, the height or the maker.
