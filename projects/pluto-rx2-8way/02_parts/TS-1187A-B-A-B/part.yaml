pins:                          # *** READ THIS BEFORE WIRING THE PART ***
                               # FOUR PHYSICAL PADS, **TWO** ELECTRICAL NODES,
                               # and the KiCad footprint expresses that by
                               # giving TWO pad NUMBERS to FOUR pads:
                               #   pad "1" appears at (-3.000, -1.875) AND
                               #                      (+3.000, -1.875)
                               #   pad "2" appears at (-3.000, +1.875) AND
                               #                      (+3.000, +1.875)
                               # (read from the .kicad_mod text and confirmed
                               # via pcbnew.FootprintLoad — 4 pads, 2 distinct
                               # numbers). `pins:` therefore declares TWO
                               # entries, because pin_audit.py resolves this map
                               # against the footprint's pad NUMBERS and a
                               # 3-or-4-entry map would report
                               # "part.yaml pins with NO pad on the footprint".
  1: {name: SW_A, note: "One side of the contact. = vendor terminals **A + B**,
       which the internal-circuit diagram (top-right of the drawing) joins with
       a plain straight wire. A is the upper-LEFT foot and B the upper-RIGHT
       foot in the body top view; in the KiCad footprint these are the two pads
       at y = -1.875. The two are interchangeable and the node is symmetric with
       pin 2 — an SPST-NO contact has no polarity and no preferred side."}
  2: {name: SW_B, note: "The other side of the contact. = vendor terminals
       **C + D**, likewise joined by a straight wire; C is the lower-LEFT foot,
       D the lower-RIGHT, and in the KiCad footprint these are the two pads at
       y = +1.875. On this board this is the pin that goes to GND for both
       SW_BOOT and SW_RUN — but only by convention, not by any property of the
       part."}
