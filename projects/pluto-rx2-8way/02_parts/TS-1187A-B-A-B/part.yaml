gotchas:
  - "FOUR PADS, TWO NODES, AND KICAD DRC WILL DEMAND COPPER BETWEEN THE PAIRS —
     MEASURED, NOT ASSUMED. The internal-circuit diagram on the drawing joins
     A-B with a straight wire and C-D with a straight wire, with one
     normally-open contact between the two rails; so the part itself already
     shorts each pair. KiCad does NOT take that on trust: the footprint text
     carries `duplicate_pad_numbers_are_jumpers no`, and the consequence was
     MEASURED rather than reasoned — a scratch board carrying only this
     footprint, with both pad-1s on one net and both pad-2s on another and NO
     copper between them, gives
       `kicad-cli pcb drc --severity-all` -> 0 violations, **2 unconnected
       items**, 'Missing connection between items: Pad 1 [N1] of SW1 on F.Cu /
       Pad 1 [N1] of SW1 on F.Cu' and the same for pad 2.
     So the board must route a ~6 mm trace between the left and right foot of
     EACH node. That is not optional tidiness: this project's DRC gate is
     `--severity-all` with **0 unconnected** (CLAUDE.md), so two switches wired
     'one foot each' would fail the gate — and would ALSO be relying on the
     switch's internal strap to carry a board net, which is a jumper the vendor
     never specified as one."
  - "THE ORDER CODE IS FOUR FIELDS AND THREE OF THEM ARE INVISIBLE ON THE PART.
     `TS-1187A-B-A-B` decodes off the title block as family TS-1187A, force
     **B = 160 gf**, height **A = 1.5 mm**, keystake **B = Brass**. Every one of
     the ten height codes and all three forces share the IDENTICAL land, the
     identical body and the identical drawing — so a substitution is a pure BOM
     change with no footprint consequence and no electrical consequence, and
     therefore nothing on the board can detect it. What changes is how the button
     FEELS and whether a finger can reach it. Since the part carries no marking
     at all, the BOM Comment is the only record; see asserts:."
  - "H = 1.5 mm MEANS THE PLUNGER STANDS 0.3 mm PROUD OF THE COVER, AND THAT IS
     A DECISION SOMEBODY SHOULD MAKE ON PURPOSE. From the side view: cover top
     1.2 mm, overall H 1.5 mm, travel 0.25 mm. So the actuator protrudes 0.3 mm
     and travels 0.25 of it — a fingertip will not reliably work it; a fingernail,
     a pen tip or a probe will. For BOOTSEL and RUN on a bench instrument that is
     normal and arguably desirable (neither should be easy to hit by accident).
     IT BECOMES WRONG THE MOMENT AN ENCLOSURE IS INVOLVED: a panel of any
     thickness over a 0.3 mm actuator needs a plunger cap or a through-hole, and
     the fix is a HEIGHT CODE, not a mechanical part. Same land, same everything:
       C318889  TS-1187A-C-C-B  H 1.7 mm  260 gf  extended  169,937 in stock
       C318888  TS-1187A-C-D-B  H 2.0 mm  260 gf  extended   57,739
       C318887  TS-1187A-C-E-B  H 2.5 mm  260 gf  extended  129,623
       C571338  TS-1187A-C-F-B  H 3.0 mm  260 gf  extended   73,209
     (live JLC assembly-library reads, 2026-07-28). All four are `extended`
     tier — the 1.5 mm part is the ONLY height in this family that is `base`,
     which is why it is the primary here and why the trade is stated rather than
     assumed away."
  - "BOUNCE IS NOT SPECIFIED AND ONE OF THE TWO NETS CARES. The drawing has no
     bounce figure at all — no time, no envelope, no test method. A tact switch
     of this class bounces for the order of 1-10 ms, which is DERIVED from the
     class and not from this document.
     BOOTSEL_N does not care: it is sampled once, while the boot ROM reads the
     flash, so the strap only has to be held down across the reset — bounce
     inside a held press is invisible.
     RUN_N DOES care: RUN is the RP2040's reset input, and a bouncing reset can
     produce several resets from one press, or release the core mid-bounce.
     FINDING, RECORDED NOT FIXED, AND RE-CHECKED AGAINST THE AMENDED DOCUMENT:
     DETAIL_DESIGN section 5 gained a `SW_BOOT / SW_RUN` row and an `R_BOOT` row
     on 2026-07-28, and it STILL lists NO capacitor on RUN — the capacitor table
     runs C_BULK, C_LDI, C_LDO, C_SW1/2, C_MCU1..10, C_VREG_IN/OUT, C_XTAL1/2
     and stops, and a grep for C_RUN or 'debounce' across 01_docs/ and
     03_src/floorplan.yaml returns nothing (measured 2026-07-28). The section-5
     row argues, correctly, that RUN's CITED 50-80 kOhm internal pull-up
     (RP2040 Table 625) makes 'a button to GND a complete reset circuit' — which
     is true about the STATIC circuit and says nothing about the DYNAMIC one.
     Either a small capacitor from RUN_N to GND is added (Raspberry Pi's own
     Pico fits 1 uF; anything from 100 nF up damps this) or the omission is
     dispositioned deliberately. 03_src/ and 01_docs/ are not this dossier's to
     edit; this is the flag, not the fix."
  - "IT IS A DRY CIRCUIT — 40 MICROAMPS ON ONE OF THE TWO — AND THE SHEET GIVES
     NO MINIMUM SWITCHING CURRENT. The rating is 50 mA at 12 V: a MAXIMUM. What
     the closed contacts actually carry on this board, from
     DETAIL_DESIGN.md section 5 as it stands 2026-07-28:
       SW_RUN — RUN's internal pull-up is CITED at 50-80 kOhm (RP2040 Table 625)
         and nothing else drives the net, so the contact carries
         3.3 V / 80 k = **41 uA** to 3.3 V / 50 k = **66 uA**.
       SW_BOOT — BOOTSEL_N reaches 3V3 through R_BOOT (1 k) in series with
         R_CSPU (10 k) paralleled by the same 50-80 kOhm internal, so roughly
         3.3 V / (8.6 k + 1 k) = **~0.34 mA**.
     That is **0.08 % of rating** on SW_RUN and 0.7 % on SW_BOOT. The 100 mOhm
     max contact resistance drops 6.6 NANOVOLTS at 66 uA against a V_IL that is
     a volt-class number, so BOTH CITED electrical specs are non-binding by four
     to six orders of magnitude — worth saying plainly so nobody spends time on
     them, and worth saying because the interesting question is the opposite end
     of the range, not this one.
     WHAT IS NOT CITED IS THAT OTHER END, AND 41 uA IS FAR ENOUGH DOWN TO SAY SO
     OUT LOUD: the drawing gives no minimum switching current, no dry-circuit
     qualification, and no gold plating (its item table says fine-silver contacts
     on SUS and silver-plated brass terminals). Silver in a sealed tact switch
     wets reliably at tens of microamps and that is DERIVED from the class, NOT
     from this document — there is no vendor statement behind it. THE
     CONSEQUENCE IF IT IS EVER WRONG IS ASYMMETRIC AND WORTH KNOWING: a
     non-wetting SW_BOOT fails to enter the bootloader and you notice
     immediately; a non-wetting SW_RUN fails to reset and you notice
     immediately too. Neither failure is silent, neither is destructive, and
     both are recoverable by pressing harder — which is why this is recorded as
     an uncited assumption rather than escalated into a part change.
     A DISCREPANCY WORTH RECORDING RATHER THAN RESOLVING SILENTLY: LCSC's
     parametric record for C318884 says the contact plating is 'Gold'; the vendor
     drawing says silver. The drawing wins (canon M-IMPORT: a vendor document
     beats a catalogue parametric), and neither answer changes anything at
     0.3 mA."
  - "BOOTSEL_N IS NOT AN ISOLATED STRAP — IT CARRIES A QSPI LINE. Per
     DETAIL_DESIGN.md section 5 (rows added 2026-07-28) and
     03_src/floorplan.yaml, R_BOOT is a 1 kOhm from QSPI_CSN to BOOTSEL_N with
     R_CSPU 10 kOhm pulling QSPI_CSN to 3V3: SW_BOOT pulls the flash chip-select
     low through that resistor to enter the bootloader, and 1 kOhm rather than
     0 Ohm because QSPI_SS is a DRIVEN OUTPUT in normal operation and a hard
     short to GND through this button would be a drive-fight into the pad. The
     consequence for placement is real and it is the one thing about this part
     that interacts with the rest of the board: BOOTSEL_N is galvanically tied to
     a QSPI net and therefore falls under the QSPI containment rules
     nets.yaml/ADR-0007 impose, and the SW_BOOT track is a stub hanging off the
     flash chip-select for the entire life of the board, not only during boot.
     Keep it short, keep it inside the digital strip, and do not let it wander
     toward the receive fan. SW_RUN has no such coupling — RUN is a dedicated
     reset pin — which is why the two buttons are NOT interchangeable in
     placement even though they are the same part."
  - "KICAD SW_Push_1P1T_XKB_TS-1187A vs XKB 'P.C.B LAYOUT TOP VIEW', MEASURED —
     EXACT MATCH, ZERO DEVIATION. The drawing dimensions the recommended land
     with four numbers: outer edge-to-edge 7.0 and inner edge-to-edge 5.0 across
     the long axis, outer 4.5 and inner 3.0 across the short axis. From those,
     pad 1.00 x 0.75 mm on a 6.00 x 3.75 mm centre grid. KiCad places 1.0 x 0.75
     pads at x = +/-3.0, y = +/-1.875:
       outer edge-to-edge X   7.0000 vs 7.0 CITED   delta 0.0000
       inner edge-to-edge X   5.0000 vs 5.0 CITED   delta 0.0000
       outer edge-to-edge Y   4.5000 vs 4.5 CITED   delta 0.0000
       inner edge-to-edge Y   3.0000 vs 3.0 CITED   delta 0.0000
       pad width              1.0000 vs 1.0 DERIVED delta 0.0000
       pad height             0.7500 vs 0.75 DERIVED delta 0.0000
       pitch X                6.0000 vs 6.0 DERIVED delta 0.0000
       pitch Y                3.7500 vs 3.75 DERIVED delta 0.0000
     Eight of eight exact. This is NOT an IPC-generated land that happens to
     agree — KiCad has copied the vendor's own recommended pattern, and its
     `(descr ...)` names this drawing's URL. Cross-checks: the land's 3.75 mm Y
     pitch sits inside the body view's terminal pitch of 3.7 +/-0.05 (at its
     upper limit, biasing the pads very slightly outward, which is normal for a
     gull-wing foot); the four pads group as two rows of two, matching the
     internal A+B / C+D straps. Re-derived from the .kicad_mod TEXT by a parser
     that shares no code with pcbnew, then confirmed against
     pcbnew.FootprintLoad — two methods, one answer (canon M1).
     NO PROJECT-LOCAL FOOTPRINT IS OWED for this part."
  - "JLC LIBRARY TIER IS **base**, WHICH IS THE POINT. 02_parts/README.md names
     '11 of 12 populated parts are extended' as this board's standing sourcing
     risk. C318884 is base with 1,361,371 in the assembly pool (live 2026-07-28)
     and 1,125,780 on the LCSC retail page — BOTH pools deep, so the C25091 trap
     the README documents (retail 0 against assembly 995,162) was CHECKED HERE
     and does not fire. Stock is never committed to this file (02_parts
     contract); it lives in 06_build/cache/stock_hmi.json."
verified: "Declares TWO pins, so policy_audit's S-VER skips it (<= 2 pins) — the
  citation is written ANYWAY, because the two-node-from-four-pads structure is
  precisely the fact a skipped part would carry unexamined. Read from the
  committed XKB drawing TS-1187A-X-X-X rev A0, sheet 1/1, an image-only PDF
  RENDERED at 200 dpi and read VISUALLY at up to 3x magnification:
  (a) the INTERNAL CIRCUIT DIAGRAM, upper-centre-right of the sheet — four
  circled terminals A, B, C, D, with A joined to B by a plain straight
  conductor, C joined to D by a plain straight conductor, and a single
  normally-open contact blade drawn between the two rails. That is the two-node
  structure, stated by the vendor in a diagram whose only purpose is to state it.
  (b) the BODY TOP VIEW, left of the sheet, which places those labels
  physically: A upper-left, B upper-right, C lower-left, D lower-right, with
  terminal foot width 0.5, body 5.1 +/-0.05 square, tip-to-tip 6.5 +/-0.25 and
  terminal row pitch 3.7 +/-0.05. The A/B row and the C/D row are therefore the
  two nodes, which is exactly how KiCad's footprint numbers its four pads
  (both y = -1.875 pads are '1', both y = +1.875 pads are '2').
  (c) the P.C.B LAYOUT TOP VIEW, centre of the sheet, dimensioned 7.0 / 5.0 /
  4.5 / 3.0 — the land the footprint comparison in gotchas: is measured against.
  (d) the SIDE VIEW (plunger diameter 2.0, TRAVEL 0.2 +/-0.1, cover 1.2, base
  0.9, overall H +/-0.05) and the Code-X height table A..J.
  (e) the TITLE BLOCK: PART NO TS-1187A-X-X-X, Operating Force A:100gf B:160gf
  C:260gf, Height Code-X, Keystake A:PA46 B:Brass — the order-code decode.
  (f) the SPECIFICATION block and the item/material table.
  The KiCad side was re-derived from the .kicad_mod TEXT by an independent
  parser and confirmed against pcbnew.FootprintLoad; the DRC consequence of the
  duplicate pad numbers was MEASURED on a scratch board rather than reasoned
  about (see gotcha 1). 2026-07-28"
layout:                        # NOT in P-LAYOUT scope (2 declared pins, and
                               # `type:` does not match the fet/crystal/inductor
                               # class), so this block is voluntary — same
                               # posture as ../BLM21SP601SN1D/part.yaml. The
                               # vendor publishes NO layout section, so every
                               # rule below is labelled DERIVED.
  source: "The XKB drawing has no layout chapter, no application note and no
    reference design — it is one page of mechanical dimensions plus a
    SPECIFICATION block. Its only layout-relevant content is the P.C.B LAYOUT
    TOP VIEW (compared numerically in gotchas:) and the body envelope
    (5.1 square, 6.5 across the terminals, 1.5 tall). EVERYTHING BELOW IS
    DERIVED ENGINEERING and is labelled as such."
  reviewed: "2026-07-28"
  keep_short:
    - {net: BOOTSEL_N, max_span_mm: 20, why: "DERIVED, and the budget is a
       CONTAINMENT rule rather than a signal-integrity one. As declared in
       03_src/floorplan.yaml on 2026-07-28, BOOTSEL_N reaches QSPI_CSN through
       R_BOOT (1 kOhm), so this net is a permanent stub on the flash chip-select
       and lives inside the QSPI containment that nets.yaml and ADR-0007 impose.
       20 mm is the whole-net pad span P-ADJ can measure and it is chosen to
       FORBID the one thing that matters: the strap leaving the digital strip.
       On the floorplan as declared — U_FLASH region, R_BOOT [57.0, 76.5],
       SW_BOOT [60.5, 76.5] — the realised span is a few millimetres, so this is
       a ceiling with room, not a constraint being fought."}
    - {net: RUN_N, max_span_mm: 20, why: "DERIVED. RUN is the RP2040's reset
       input and the net is HIGH-IMPEDANCE between presses — it sits at 3V3
       through a pull-up with nothing else driving it, which is the classic
       shape for picking up an injected edge and resetting the board at random.
       Same 20 mm ceiling as BOOTSEL_N and for the same containment reason
       (SW_RUN is at [64.5, 76.5], in the same strip). If a capacitor is added to
       RUN_N per the bounce gotcha, THAT capacitor — not this budget — becomes
       the binding placement rule and it belongs at the RP2040 pin."}
  notes:
    - "MEASURED, and it is the rule that will actually bite: ROUTE COPPER BETWEEN
       THE TWO PADS OF EACH NUMBER. `duplicate_pad_numbers_are_jumpers no` in
       the footprint means KiCad will not accept the switch's own internal strap
       as the connection — a scratch-board DRC with the four pads netted and no
       copper between them reports 2 unconnected items (gotcha 1). Two 6 mm
       traces per switch, four in total. Budget the space at placement rather
       than discovering it at the DRC gate."
    - "DERIVED: this is a HUMAN INTERFACE part, so its placement constraint is
       ACCESS, not electricals. The plunger is 2.0 mm across and stands 0.3 mm
       proud (gotcha 3); the courtyard is 7.5 x 5.6 mm. Whatever presses it — a
       fingernail, a pen, a panel plunger — needs a clear approach cone above the
       part, so nothing tall may sit within a couple of millimetres, and the
       two buttons want enough separation to be pressed one at a time. The
       floorplan's 4.0 mm centre spacing between SW_BOOT [60.5, 76.5] and SW_RUN
       [64.5, 76.5] is BELOW the 5.1 mm body width plus any clearance — i.e. the
       two courtyards overlap as declared. FLAGGED, NOT FIXED: 03_src/ is not
       this dossier's to edit, and floorplan legalisation may resolve it, but a
       reader should not assume it has."
    - "DERIVED: BOOTSEL and RUN are pressed TOGETHER during a manual bootloader
       entry (hold BOOTSEL, tap RUN, release BOOTSEL). That is a two-finger
       gesture on a 0.3 mm actuator, and it is the ergonomic case the pair must
       actually satisfy — not 'each button is reachable'. It is another reason
       the spacing note above matters, and another reason a taller height code
       may be the right answer once the enclosure exists."
    - "DERIVED: the metal cover is a floating conductive body 5.1 mm square
       sitting 1.2 mm above the copper, and the drawing gives it no terminal —
       it is not grounded through any pad. Do not treat it as a shield and do
       not route sensitive copper under it expecting isolation; equally, there
       is no ground connection to make. It is simply a floating plate over
       whatever the layout puts underneath."
    - "OWED: no XKB application note, reliability report or reference layout
