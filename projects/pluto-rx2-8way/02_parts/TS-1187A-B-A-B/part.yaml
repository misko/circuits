  alternates: [C318889, C318887]
                               # SAME LAND, SAME FAMILY, DIFFERENT HEIGHT — and
                               # therefore a pure BOM swap with NO footprint
                               # consequence, which is the only reason they are
                               # listed. C318889 = TS-1187A-C-C-B (H 1.7 mm,
                               # 260 gf, extended, 169,937); C318887 =
                               # TS-1187A-C-E-B (H 2.5 mm, 260 gf, extended,
                               # 129,623). BOTH ARE `extended` AND BOTH ARE
                               # STIFFER (260 gf vs 160 gf) — the height and the
                               # force are separate order-code fields but XKB's
                               # base-tier stocking happens to pair 1.5 mm with
                               # 160 gf. Neither alternate's drawing was
                               # separately fetched: the committed sheet IS the
                               # family drawing and covers every code. What is
                               # NOT listed is the wider tact-switch market
                               # (Alps SKRK, Omron B3U, CK KMR2, ...): those are
                               # DIFFERENT lands and a different footprint, so
