                                   # redrawn.
mates: receptacle                  # STATED HONESTLY: the TITLE BLOCK DOES NOT
                                   # CARRY THE GENDER. It reads only
                                   # "PART NO. TYPE-C-31-M-12A" and
                                   # TITLE "高导铜，过6A大电流款" (high-conductivity
                                   # copper, over-6 A high-current type) — there
                                   # is no "AF"/"AM" field to read, and this
                                   # dossier says so rather than pretending
                                   # there was one (usb-hub-3s ADR-0006 is about
                                   # a gender that was never actually READ).
                                   # The gender is settled by the FRONT VIEW
                                   # (sheet 1, lower-left, section marks A-A /
                                   # B-B), rendered at 300 dpi and read
                                   # visually: an oval SHELL RING 8.34 x 2.56
                                   # encloses a 0.70-thick TONGUE that is
                                   # clear of the ring top and bottom, with A1
                                   # ..A12 leadered to the tongue's UPPER face
                                   # and B12..B1 to its LOWER face. A tongue
                                   # inside a cavity is a RECEPTACLE; a plug has
                                   # a hollow shell and no tongue, and 0.70 mm
                                   # is the USB Type-C receptacle tongue
                                   # thickness. Corroborated by the sheet's
                                   # RECOMMEND P.C.B LAYOUT (a board-mount land
                                   # with solder tails — a cable plug has none)
                                   # and by LCSC's own C5337088 description
                                   # string, which reads "Female ... Right Angle
                                   # Type-C SMD" (live 2026-07-28).
