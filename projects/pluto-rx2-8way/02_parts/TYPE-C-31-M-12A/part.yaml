  ('A1 B12 A4 B9 B8 A5 B7 A6 A7 B6 A8 B5 B4 A9 B1 A12', left to right over the
  16-0.20+/-0.05 tail dimension) and against the twelve labelled lands of the
  RECOMMEND P.C.B LAYOUT (component side) view ('A1/B12 A4/B9 B8 A5 B7 A6 A7 B6
  A8 B5 B4/A9 B1/A12'). All three agree. GENDER read from the front view, same
  sheet, lower left (see mates:). LAND PATTERN read from the RECOMMEND P.C.B
  LAYOUT view including its tolerance note 'TOLERANCE FOR PCB LAYOUT IS +/-0.05',
  measured against a 0.50-pitch scale derived from the eight signal pads and
  cross-checked against the base TYPE-C-31-M-12 sheet (C165948, REV A
  2020.12.08). 2026-07-28"
layout:
  source: "THE VENDOR PUBLISHES NO APPLICATION OR LAYOUT SECTION — one sheet,
    six notes, none of them about routing. Reported as an absence, as with
    KH-SMA-KE-Z. The ONE vendor-sourced layout artifact is the RECOMMEND P.C.B
    LAYOUT (COMPONENT SIDE) view and its +/-0.05 tolerance note. Everything else
    below is DERIVED and labelled so, from three CITED external requirements:
    USB 2.0 sec 7.2.4.1 (device VBUS bypass <= 10 uF), the USB Type-C Rd
    requirement carried by this board's ADR-0004 / DETAIL_DESIGN sec 5, and ST
    Doc ID 11265 Rev 5 sec 2.2 (PDF p4) for the ESD-path inductance arithmetic."
  reviewed: "2026-07-28"
  keep_short:
    - {net: USB_CC1, max_span_mm: 5, why: "DERIVED. The net has exactly two pads
       — A5 and R_CC1 — so its span IS the Rd stub length and P-ADJ can measure
       it honestly. 5.1 kOhm to GND is what advertises this board as a plain 5 V
       sink and makes sustained overvoltage UNREACHABLE (ADR-0004); a long CC
       stub adds nothing but antenna and an ESD entry path to the one net on
       this connector that has no clamp behind it. R_CC1 belongs at the pad."}
    - {net: USB_CC2, max_span_mm: 5, why: "DERIVED, and NOT a duplicate of CC1:
       the plug is reversible, so BOTH CC lines need their own Rd. A board with
       one 5.1 kOhm works in exactly one insertion orientation — the same
       invisible half-dead failure as an unstrapped D+/D-."}
    - {net: USB_DP, max_span_mm: 20, why: "DERIVED from the floorplan the board
       already declares: J_USB [46.0, 87.0] -> U_ESD [54.0, 84.0] -> U_MCU
       [46.0, 72.0] is ~16 mm of pad span today. 20 mm is a real ceiling — it
       forbids the pair ever leaving the digital strip (y >~ 65) and crossing
       the receive fan, which ARCHITECTURE sec 4 makes a reference-plane rule
       rather than an impedance one. NOTE the binding sub-constraint is NOT this
       whole-net number: see adjacency: below."}
    - {net: USB_DM, max_span_mm: 20, why: "as USB_DP, and it must track USB_DP —
       the pair's value is its symmetry, and a 20 mm ceiling on one leg with
       none on the other buys nothing."}
    - {net: VBUS, max_span_mm: 25, why: "DERIVED. VBUS runs J_USB -> F_IN ->
       (VBUS_F) and carries U_ESD's clamp leg; USB 2.0 sec 7.2.4.1 caps the
       device-side bypass at 10 uF and this board budgets 5.7 uF of it
       (C_BULK 4.7 + C_LDI 1, DETAIL_DESIGN sec 5), which is what makes 'no
       inrush limiter' a DECISION rather than an omission. That budget is only
       true if the bypass is actually ON this rail and local to it; a VBUS net
       that wanders is a VBUS net whose effective bypass nobody has counted."}
  adjacency:
    - {refdes: [J_USB, U_ESD], max_mm: 2.0, why: "DERIVED, and this is the
       number that actually matters. ST Doc ID 11265 Rev 5 sec 2.2 (PDF p4)
       costs it: a 10 mm x 0.5 mm track is ~6 nH, and at dI/dt = 24 A/ns that
       adds 144 V on the I/O leg AND 144 V on the GND leg, turning a 17 V clamp
       into 305 V. At 2 mm the adder is ~29 V per leg and the clamp stays near
       75 V. sec 2.3 states the rule in words — 'put the protection device as
       close as possible to the disturbance source (generally the connector)'.
       FINDING, recorded not hidden: the floorplan currently places U_ESD at
       [54.0, 84.0] against J_USB at [46.0, 87.0] — roughly 8 mm lateral and
       3 mm down, i.e. several times this budget. Re-place before routing."}
    - {refdes: [J_USB, R_CC1], max_mm: 4.0, why: "DERIVED — the Rd stub rule
       above, expressed where placement can act on it."}
    - {refdes: [J_USB, R_CC2], max_mm: 4.0, why: "DERIVED — as R_CC1."}
  notes:
    - "DERIVED: SHIELD TREATMENT IS SH -> GND DIRECTLY, ALL FOUR LEGS, AT THE
       PADS — no 1 MOhm resistor, no 4.7 nF cap, no split. The R||C shield break
       exists to stop a ground LOOP between a chassis ground and a signal
       ground, and this board has ONE ground: ARCHITECTURE sec 6 pours and
       stitches GND on all four layers and nets.yaml gives GND no netclass at
       all, so there is no second domain to isolate from and the network would
       break nothing. It would however insert an impedance in the ESD path: a
       1 MOhm||4.7 nF is ~34 Ohm at 1 GHz, and by the sec 2.2 arithmetic above
       every ohm and every nanohenry on the return leg is added directly to what
       the D+/D- clamp must survive. Worse for a RECEIVER too, not better: a
       shell tied through 4.7 nF is a floating conductor at the board edge.
       Bond it hard, and give each of the four legs its own via to L2."
    - "DERIVED: the four merged 0.60 lands are TWO nets (VBUS and GND), and they
       are the only pads on this part that carry real current. 0.15 A across two
       VBUS lands is nothing thermally; route them as PWR class (0.40 mm,
       DETAIL_DESIGN sec 8) for IR drop and robustness, not for ampacity."
    - "DERIVED: this connector is at the BOARD EDGE by construction — the
       recommended layout dimensions everything back from a line labelled PCB
       EDGE (5.79 to the pad-row top, 4.18 to the alignment-hole centres). The
       mouth overhangs that edge. So the outline, not the placement, fixes
       J_USB's y; the floorplan's [46.0, 87.0] against an outline top of y=89
       is consistent with that and should be checked against the OWED footprint
       once it exists, because the 0.375 pad-row discrepancy above moves the
       part relative to its own edge."
    - "OWED: no routed reference layout for THIS connector was consulted. HRO
       publishes none, and no OSHWLab-by-LCSC board was searched for C5337088.
       Recorded as not done, not as absent."
