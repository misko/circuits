gotchas:
  - "D+/D- EXIST AS TWO SEPARATE PAIRS AND THE BOARD MUST SHORT THEM. The signal
     table (sheet 1) gives A6=DP1, A7=DN1 AND B6=DP2, B7=DN2 as four distinct
     contacts on four distinct 0.30 mm lands. A Type-C plug is REVERSIBLE: in one
     insertion the cable's D+ lands on A6, in the other on B6. THEREFORE
     A6 must be strapped to B6 (net USB_DP) and A7 to B7 (net USB_DM). A board
     that wires only one pair enumerates when the cable goes in one way round
     and is DEAD the other way — and NOTHING can see it: every pin has a net so
     ERC passes, the copper is legal so DRC passes, and the netlist is
     self-consistent so schematic-parity passes. This is the same defect CLASS
     as the reversed XT60 and the usb-hub-3s D1 cathode. The strap is
     electrically FREE here: RP2040 USB is full-speed 12 Mbit/s with ~4 ns
     edges, so a 3 mm T-stub between the two pads is ~20 ps of skew — nothing.
     Total failure on one side, zero cost on the other."
  - "KICAD'S STOCK FOOTPRINT DOES NOT MATCH THIS LAND, AND IT IS NOT A VARIANT
     DIFFERENCE. Connector_USB:USB_C_Receptacle_HRO_TYPE-C-31-M-12 (KiCad 10,
     descr cites krhro.com/uploads/soft/180320/1-1P320120243.pdf) against the
     RECOMMEND P.C.B LAYOUT on this sheet, measured pad by pad:
       EXACT      signal-pad pitch 0.50; signal-pad width 0.30 (8 off);
                  VBUS/GND pad width 0.60 (4 off); A5<->A8 span 2.50;
                  B8<->B5 span 3.50; alignment holes 5.78 apart;
                  shell slots 8.64 (KiCad) vs 8.65 (sheet); slot drill
                  1.70 tall (KiCad oval 0.6x1.7); shell-slot centre 0.53 above
                  the alignment-hole centre (sheet: 0.51-0.59 measured)
       DIFFERS    A4/B9 <-> B4/A9 centres  KiCad 4.90  vs sheet 4.80  (+0.10)
                  A1/B12 <-> B1/A12        KiCad 6.50  vs sheet 6.40  (+0.10)
                  SMT pad LENGTH           KiCad 1.45  vs sheet 1.14  (+0.31)
                  pad centre to alignment-hole centre
                                           KiCad 1.445 vs sheet 1.07  (+0.375)
                  alignment hole diameter  KiCad 0.65  vs sheet 0.60  (+0.05)
     1.14 is not a pixel estimate: the sheet dimensions pad-TOP-to-hole-centre
     as 1.64 and pad-BOTTOM-to-hole-centre as 0.50, and 1.64 - 0.50 = 1.14; a
     300 dpi render measured 1.14 independently. The 0.375 offset means the
     contact tails land 0.375 off-centre on KiCad's pads, biased toward the
     board edge, leaving only ~0.95 of the sheet's 1.14 pad covered at the heel.
     RULED OUT as an M-12-vs-M-12A difference: the base TYPE-C-31-M-12 sheet
     (C165948, REV A 2020.12.08) was fetched and read and its recommended layout
     is DIMENSION-FOR-DIMENSION IDENTICAL to this one — 1.50/0.50/8-0.30/4-0.60/
     2.50/3.50/4.80/5.78/6.40/8.65/0.50/1.64/4.18/5.79/phi 0.60/2.00/1.70. Two
     HRO sheets two years apart agree with each other and disagree with KiCad.
     So the OWED footprint keeps KiCad's hole pattern verbatim and re-lays the
     pad row: twelve pads, 4x 0.60 and 8x 0.30, all 1.14 long, narrow pitch
     0.50, wide-pad centres at +/-2.40 and +/-3.20, row centre 1.07 from the
     alignment-hole line. KEEP THE PAD NAMES A1..B12 + SH."
  - "PAD NAMES ARE ALPHANUMERIC (A1..A12, B1..B12, SH) AND TSCIRCUIT DROPS THE
     PART SILENTLY. This is the S-COUNT incident of 2026-07-21 (proven-parts
     ledger, usb-c-receptacle-high-current). Run tsx_preflight and map the pads
     in parity_padmap.txt BEFORE the first tsci build — not after, because the
     failure is a MISSING part, not a wrong one, and a missing part is exactly
     what count-parity exists to catch."
  - "THE FOUR VBUS AND FOUR GND CONTACTS SHARE PADS TWO-TO-ONE: A1+B12,
     A4+B9, B4+A9, B1+A12 each land on ONE 0.60 mm pad. The footprint therefore
     carries SIXTEEN pad NAMES on TWELVE pieces of copper (KiCad models this as
     two coincident pads per merged land). Consequence for the netlist: A1 and
     B12 are the same node whether or not the schematic says so, so a symbol
     that puts them on different nets is a hard short that DRC will report as a
     zero-length collision, not as a net error."
  - "SBU1 (A8) AND SBU2 (B8) ARE BROKEN OUT ON THIS PART AND MUST BE LEFT OPEN.
     They are real pads with real contacts, not omitted. The USB Type-C spec
     requires a device with no alternate mode and no audio-accessory support to
     leave SBU unconnected — do NOT ground them (a grounded SBU misdeclares the
     port to an accessory and gives an ESD strike a path INTO the board). Leave
     them with an explicit ERC no-connect and NO trace, NO via, NO test point.
     That is also what makes the ESD-array coverage argument below sound: an
     isolated pad with nothing behind it has no victim."
  - "6 A IS A MATERIALS CLAIM, NOT A BIGGER CONNECTOR — SO IT IS NOT
     OVER-ENGINEERING HERE. The sheet's TITLE is literally the reason for the
     part's existence: 高导铜 = high-conductivity copper. The -12A differs from
     the base TYPE-C-31-M-12 (C165948) in contact ALLOY only: LCSC's own
     parametrics read 16P/20V/6A/7.35mm vs 16P/20V/5A/7.35mm, and the two HRO
     drawings are dimensionally identical including the land. A 16-pin USB 2.0
     receptacle is already the SMALLEST and cheapest Type-C receptacle class
     there is — it physically omits the eight SuperSpeed contacts — so 'high
     current' costs this board zero area, zero extra escapes and zero fab tier.
     At 0.15 A the ampacity is 40x unused and irrelevant; what IS used is Note
     3-3's 10000 mating cycles, which is the number that matters for a bench
     instrument that gets plugged and unplugged all day."
  - "THE ONE-CHARACTER SUBSTITUTION IS LIVE AND IT IS IN KICAD'S OWN LIBRARY.
     Connector_USB:USB_C_Receptacle_HRO_TYPE-C-31-M-17 sits one line below the
     -12 in the same footprint list, in the same HRO family, with the same four
     SH shell legs — and it is a SIX-PIN POWER-ONLY receptacle: its pads are
     A5, A9, A12, B5, B9, B12 and it has NO D+ and NO D- at all. Pick it by
     mistake and the board powers up, the CC pull-downs advertise correctly,
     both LEDs light, the RP2040 runs from flash — and USB enumeration and the
     BOOTSEL/UF2 firmware path simply do not exist. On this board that is the
     ONLY function the port has besides power."
  - "HYBRID SMT+TH: 12 SMT lands + 4 PLATED shell legs + 2 NPTH alignment holes.
     The shell legs need soldering and must be DECLARED to the fab or the hybrid
     is missed (usb-hub-3s-v3 assembly.yaml records exactly this for its J5).
     It adds no NEW cost class to this board — the ten KH-SMA-KE-Z jacks already
     commit it to through-hole assembly — but it adds 4 joints to that line
     item, and the alignment holes are NPTH and must not be plated."
  - "STAINLESS STEEL SHELL AND MID PLATE (Note 1-3, 1-4). Stainless is ~40x the
     resistivity of copper, so the shell METAL is not the ground bond — the four
     plated legs are. Do not rely on the shell to carry return current between
     two ground stitches; give every leg its own via to the L2 plane."
