package: >-
  board-edge horizontal (right-angle) top-mount USB-C 2.0 receptacle, 16
  contacts. Body 8.94 W x 7.35 D, 3.26 above the board; shell aperture
  8.34 (+0.06/-0.02) x 2.56 +/-0.04 with a 0.70 +/-0.05 tongue centred in it.
  16 SMT tails, each 0.20 +/-0.05 wide, standing 0.40 +/-0.10 off the board and
  landing on TWELVE pads (the four VBUS and four GND contacts pair up two-to-a-
  pad); 4 PTH shell/mid-plate legs (2x 0.80 + 2x 1.10 wide, projecting 1.01
  below the board) at 8.64 centres across and 4.18 apart front-to-back (leg
  rows at 2.60 and 6.77 from the mating face); 2 NPTH alignment posts
  2-phi 0.50 at 5.78 centres; seating-plane flatness 0.10. Housing UL94 V-0,
  contacts copper alloy, mid plate and shell stainless steel (drawing Note 1).
footprint: pluto_rx2_8way:USB_C_Receptacle_HRO_TYPE-C-31-M-12A  # OWED — see
                                   # gotchas "KICAD'S STOCK FOOTPRINT DOES NOT
