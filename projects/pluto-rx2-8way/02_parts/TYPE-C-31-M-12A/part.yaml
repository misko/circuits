  insulation_resistance: ">= 100 MOhm"          # Note 4-2
  dielectric_withstand: "AC 100 V for 1 minute" # Note 4-3
  insertion_force: 0.5 - 2.0 kgf   # Note 3-1
  removal_force: 0.8 - 2.0 kgf     # Note 3-2
  durability: 10000 cycles         # Note 3-3
  operating_temperature: -30 to +80 C           # Note 5. LCSC's PARAMETRIC
