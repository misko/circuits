sourcing:
  lcsc: C5337088
  alternates: [C165948]            # C165948 = TYPE-C-31-M-12, the SAME 16P part
                                   # with a lower-conductivity contact alloy:
                                   # 5 A instead of 6 A, and its drawing's
                                   # recommended land is dimension-for-dimension
                                   # IDENTICAL (verified, see layout_refs). At
                                   # 0.15 A the ampacity difference is
                                   # unreachable, so this is a true drop-in —
                                   # and it is the deeper part by three orders
                                   # of magnitude. Check stock at order time;
                                   # never here.
asserts:
  - assert: value
    equals: TYPE-C-31-M-12A
    why: "the BOM Comment must name the exact HRO order code, because the
      substitution that hurts is INSIDE the same family and inside KiCad's own
      footprint list: TYPE-C-31-M-17 is HRO's SIX-PIN POWER-ONLY receptacle in
      the same body with the same four shell legs and NO D+/D- contacts at all.
      Fitted by mistake, the board takes power, the 5.1 kOhm CC pull-downs
      advertise correctly, the rails come up, both LEDs light and the RP2040
      runs — and the USB port's only other job on this board, BOOTSEL/UF2
      firmware load, silently does not exist. No ERC, DRC, parity or twin check
      can see a connector that is electrically fine and functionally half a
      part. (TYPE-C-31-M-12 is a different case and is listed as an alternate:
      same 16 contacts, same land, lower ampacity — a substitution that is
      safe HERE and is recorded as safe rather than forbidden by reflex.)"
