  doc_id: rp2040-datasheet
  revision: 2025-02-20-3184e62   # the document's OWN version, Colophon PDF p1:
                                 # "build-date: 2025-02-20 / build-version:
                                 # 3184e62-clean". Raspberry Pi publishes no
                                 # letter revision; the build string IS the
                                 # revision, and the Documentation Release History
                                 # (PDF p638) confirms 20 February 2025 as the
                                 # most recent entry.
  url: https://datasheets.raspberrypi.com/rp2040/rp2040-datasheet.pdf
