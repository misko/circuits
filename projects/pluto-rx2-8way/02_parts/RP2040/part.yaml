  fetched: 2026-07-28
  pages: 642
package: >
  QFN-56, 7.00 x 7.00 mm body, 0.40 mm pitch, 14 leads/side, exposed centre
  ground pad 3.20 x 3.20 mm. The ePad is DELIBERATELY SMALL — datasheet
  section 5.1 NOTE, PDF p607: "There is no standard size for the central GND pad
  (or ePad) with QFNs. However, the one on RP2040 is smaller than most. This
  means that standard 0.4mm QFN-56 footprints provided with CAD tools may need
  adjusting. This gives the opportunity to route between the central pad and the
  ones on the periphery, which can help with maintaining power and ground
  integrity on cheaper PCBs." Land pattern, Figure 167 'Recommended PCB Footprint
  for the RP2040 QFN-56 package', PDF p608 — 7.75 outer land envelope / 6.00
  inner pad-row opening / 5.40 row span / 3.20 ePad / 0.20 pad width / 0.40
  pitch / 0.875 and 1.175 offsets.
footprint: Package_DFN_QFN:QFN-56-1EP_7x7mm_P0.4mm_EP3.2x3.2mm
  # MEASURED 2026-07-28 (M-IMPORT grade MEASURED — read out of the
  # machine-readable .kicad_mod under /usr/share/kicad/footprints, not off a
  # drawing, and re-measured here rather than taken on trust):
  #   56 peripheral pads 0.875 x 0.200 mm at 0.400 pitch
  #   inner pad-row opening 6.000 mm / outer land envelope 7.750 mm
  #   adjacent-pad copper gap 0.200 mm
  #   pad 57 = EP 3.20 x 3.20 mm, carrying pad_prop_heatsink
  #   EP-to-pad copper gap 1.400 mm
  # Every one of those is the corresponding number in Figure 167 (PDF p608).
  # That is why this is the RIGHT footprint and not merely a fitting one —
  # KiCad's own `descr` cites "rp2040-datasheet.pdf#page=607".
  # TWO CONSEQUENCES A ROUTER NEEDS:
  # (1) the 1.400 mm EP-to-pad gap IS what the section 5.1 NOTE is talking
  #     about — a real routing channel between the pad ring and the centre pad.
  #     The EP4x4 and EP5.6x5.6 siblings in the same library also read
  #     "QFN-56 7x7 P0.4" in their names and would eat it. Never substitute a
  #     QFN footprint on its name.
  # (2) the EP carries FOUR F.Paste-ONLY apertures of 1.29 x 1.29 mm at
  #     (+/-0.8, +/-0.8) — about 65% paste coverage, not 100%. That is
  #     deliberate and must survive any footprint edit: a fully pasted 3.2 mm
  #     EP floats the part on solder volume and lifts the 0.2 mm perimeter
  #     leads.
