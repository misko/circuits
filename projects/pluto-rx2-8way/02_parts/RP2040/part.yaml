gotchas:
  - "THE ONLY GROUND IS THE CENTRE PAD, PIN 57 (Table 621, PDF p614). Fifty-six
     peripheral leads and not one of them is GND. A QFN whose EP is treated as an
     optional thermal feature has no return path: every IO return, the crystal
     return and the core-regulator return all go through that one pad. It needs a
     via ARRAY into L2, not one via."
  - "DVDD IS NOT SUPPLIED BY THIS BOARD — IT IS SUPPLIED BY THE CHIP, THROUGH THE
     BOARD. Section 2.9.2 (PDF p151): 'The connection between the output pin of
     the on-chip regulator (VREG_VOUT) and the DVDD supply pins is made off-chip.'
     So pin 45 must be wired in COPPER to pins 23 and 50. Miss that link and the
     core has no 1.1 V, the chip never leaves reset, and nothing about the
     schematic looks wrong: VREG_VOUT reads as an output nobody uses and DVDD as a
     supply nobody drives. Section 2.7 (PDF p128) makes it a boot dependency —
     the hardware boot sequence waits for DVDD to be stable before the power-on
     state machine even starts."
  - "THE 1.1 V RAIL IS ABSENT FROM THIS BOARD'S RULES. `03_src/rules/nets.yaml`
     declares no net for VREG_VOUT/DVDD (the default-class list runs LED_PWR,
     LED_STAT, RUN_N, BOOTSEL_N, XIN, XOUT, USB_CC1, USB_CC2), and
     `power_tree.yaml` carries no rail for it. It is a real rail in real copper
     with a real 100 mA converter, and it is currently graded by nothing. OWED —
     reported upstream, not fixed here (this dossier does not write 03_src/)."
  - "TWO 1 uF CAPACITORS ARE MANDATORY AND ARE NOT IN DETAIL_DESIGN section 5.
     Section 2.10.1 (PDF p156): 'The regulator must have 1uF capacitors placed
     close to its input (VREG_VIN) and output (VREG_VOUT) pins.' Section 2.9.3
     (PDF p151) repeats the input one. Hardware Design with RP2040 section 2.1.3
     (PDF p9-10) names them C10 (pin 44) and C8 (pin 45) and puts 'Make sure C8 is
     close to pin 45' / 'Make sure C10 is close to pin 44' on the schematic
     itself. The regulator also has an ESR window on these two, met in practice by
     small ceramics. Neither capacitor exists in the value index. OWED."
  - "THE DECOUPLING COUNT IS SHORT BY SIX. The datasheet asks for 100 nF at EACH
     power pin: IOVDD x6 (pins 1, 10, 22, 33, 42, 49) section 2.9.1 PDF p151;
     DVDD x2 (23, 50) section 2.9.2; USB_VDD x1 (48) section 2.9.4; ADC_AVDD x1
     (43) section 2.9.5 — TEN. DETAIL_DESIGN section 5 budgets C_MCU1..4, i.e.
     FOUR. Raspberry Pi's own minimal design runs NINE and says so explicitly
     (pins 48 and 49 share C9, 'as there is not a lot of room on that side of the
     device... This could be overcome if we used... a four layer PCB with
     components on both the top and bottom sides' — Hardware Design section 2.1.2,
     PDF p9). THIS BOARD IS FOUR-LAYER, so the trade-off Raspberry Pi accepted
     under duress is not one we have to inherit. OWED: six more 100 nF."
  - "USB_DP AND USB_DM NEED 27 OHM SERIES RESISTORS AND THEY ARE NOT IN
     DETAIL_DESIGN section 5 EITHER. Table 620 (PDF p615) and Table 614 (PDF p612)
     both state it as a requirement, not a suggestion: '27 ohm series resistor
     required for USB operation'. Raspberry Pi's own schematic fits 27.4 ohm (E96
     1%, R3/R4 in Figure 3/Figure 9 of Hardware Design, PDF p8/p12) with the note
     'Make sure R3 and R4 are close to RP2040'. Use 27.4 ohm 1% — 27 ohm is not an
     E24 value and 27.4 is what the reference design was measured with. Bus
     pull-ups/pull-downs are INTERNAL (Table 614) and must NOT be added. OWED."
  - "THE CRYSTAL NEEDS A 1 kOHM SERIES RESISTOR ON XOUT AND IT IS NOT IN
     DETAIL_DESIGN section 5 EITHER. The RP2040 DATASHEET does not state the value
     — it only alludes to it ('the Abracon crystal and that particular damping
     resistor are tuned for 3.3V operation', section 2.16.1.1 PDF p217). The value
     lives ONLY in Hardware Design with RP2040 section 2.3 (PDF p11): 'We've opted
     for a device with a maximum of 50 ohm [ESR], as we've found that this, along
     with a 1k ohm series resistor (R5), is a good value to prevent the crystal
     being over-driven and being damaged when using an IOVDD level of 3.3V.' The
     rule is CONDITIONAL on both facts — IOVDD = 3.3 V and crystal ESR max 50 ohm
     — and this board satisfies both. The resistor goes between the XOUT PIN and
     the crystal terminal, with the XOUT-side load capacitor on the CRYSTAL side
     of it (Figure 8, PDF p11). OWED as a component; see 02_parts/ABM8-272-T3."
  - "QSPI_SS_N IS ALSO THE BOOT STRAP, AND IT IS SAMPLED ONCE. Section 2.8.1
     (PDF p130): 'Check if SPI CS pin is tied low (\"bootrom button\"), and skip
     flash boot if so.' The strap is a 1 kohm from QSPI_SS to a button/header to
     GND (R1, Hardware Design section 2.2, PDF p10) — 1 kohm and not 0 ohm because
     QSPI_SS is a driven OUTPUT in normal operation and the button would otherwise
     be a hard drive-fight into the pad. Board net `BOOTSEL_N` exists in
     nets.yaml, so the strap is planned; the 1 kohm value is the part fact."
  - "THE QSPI_SS PULL-UP IS A FLASH REQUIREMENT, NOT AN RP2040 ONE, AND IT IS
     CONDITIONAL. Table 616 (PDF p614) says QSPI_CSn's own reset state is Pull-Up
     (50-80 kohm internal, Table 625). Hardware Design section 2.2 (PDF p10):
     'there is a short period of time during switch-on where the state of the
     QSPI_SS pin cannot be guaranteed', so an external 10 kohm (R2) is provided —
     but 'R2 is marked as DNF... with this particular flash device, the external
     pull-up is unnecessary. However, if a different flash is used, it may become
     important'. This board uses that same flash family (W25Q128JV), so R2 is a
     FOOTPRINT WITH NO PART. Fit the pad, leave it unpopulated, and place it close
     to the flash."
  - "RUN HAS AN INTERNAL PULL-UP AND MAY BE LEFT TO IT. Table 619 (PDF p614): RUN
     is pin 26, Digital In (FT), reset state Pull-Up, 'Chip enable / reset'.
     Table 1 (PDF p11): 'Reset when driven low, run when driven high. If no
     external reset is required, this pin can be tied directly to IOVDD.' Note the
     asymmetry with the switch's control pins: HERE the internal pull is real and
     specified (50-80 kohm, Table 625), so a button to GND is a complete reset
     circuit. Do NOT copy ADR-0005's external-pull-down reasoning onto this pin —
     that reasoning exists because PE42482A-X publishes NO internal pull at all."
  - "PAD DRIVE DEFAULT IS 4 mA, NOT 2 mA (Table 614, PDF p612: 'Default Drive
     Strength is 4mA'). ADR-0005 firmware obligation 1 asks for 2 mA + slow slew
     on the four select lines; that is a DEPARTURE FROM RESET STATE, so it is
     firmware that must run, not firmware that must merely not break. The ADR
     already treats it as non-load-bearing (the 47 ohm series value holds the
     3.6 V bound at the strongest setting), which is the right call — this note
     only corrects which way the default points."
  - "THE DATASHEET PUBLISHES NO XIN/XOUT PIN CAPACITANCE. Table 628 (PDF p617)
     gives only VIH/VIL for driving XIN with a square wave. So the C_stray term in
     the load-capacitor formula CANNOT be cited for this chip — it is ESTIMATED,
     and Raspberry Pi's own 3 pF (Hardware Design section 2.3, PDF p11) is the
     only empirically anchored number available, because Pico was tuned with it.
     This is the input DETAIL_DESIGN section 5 carries as 5 pF. See
     02_parts/ABM8-272-T3/part.yaml for the recomputation."
  - "ERRATA: NONE OF THE SIXTEEN ARE BOARD-LEVEL. Appendix B (PDF pp627-635)
     lists E1-E16; all sixteen are bootrom, ROSC/XOSC register, DMA, ADC-input-
     enable, USB-controller, watchdog or XIP-DMA software issues. Checked and
     reported as an ABSENCE rather than skipped. The nearest to a hardware fact is
     RP2040-E5 (GPIO digital inputs not disabled for ADC pins by default), and
     this board uses no ADC pin."
  - "THETA_JA IS 48.00 C/W, NOT ~40 (Table 611, PDF p608). DETAIL_DESIGN section 7
     uses ~40 C/W for a ~165 mW estimate -> 6.6 C rise. At the cited 48.00 the
     same dissipation gives 7.9 C. Still a non-event thermally; recorded because
     the table's number currently has no source and now can have one."
  - "MSL 1 (section 5.4, PDF p611), 0.40 mm pitch, 56 leads plus a 3.2 mm ePad:
     PCBA part. Reflow only. Tin whisker testing is not performed and is not
     applicable — bottom-only termination (section 5.4 NOTE)."
verified: "pin map read from Figure 3 'RP2040 Pinout for QFN-56 7x7mm (reduced
  ePad size)', PDF p12 — page RENDERED at 300 dpi and read VISUALLY, then
  cross-checked pin-by-pin against Table 615 (GPIO pins), Table 616 (QSPI pins),
  Table 617 (crystal oscillator pins), Table 618 (serial wire debug pins),
  Table 619 (miscellaneous pins), Table 620 (USB pins) and Table 621 (power
  supply pins), PDF pp613-615. Independently cross-checked a THIRD time against
  Figure 170 'RP2040 QFN-56 package pinout', PDF p612, also rendered at 200 dpi
  and read visually — the two figures are separately drawn and agree pad for pad.
  Ground pad number 57 from Table 621's own row, not from the footprint.
  Package and land pattern from section 5.1 Figure 166 / Figure 167, PDF
  pp607-608. Rendered from the PDF whose sha256 is recorded above. 2026-07-28"
layout:
  source: "TWO manufacturer sources, in datasheet-first order. (1) RP2040
    datasheet sections 2.9 / 2.10 (PDF pp150-156): 100 nF at EACH IOVDD, DVDD,
    USB_VDD and ADC_AVDD pin; 1 uF at VREG_VIN and 1 uF at VREG_VOUT, both close
    to the pin; VREG_VOUT wired off-chip to both DVDD pins. (2) Hardware Design
    with RP2040 (build 2024-10-15 / 2b6018e, sha256
    6523a2ebf743fcfbcc69bc3901b24ca3a2d23617d8ee50beb5f606b31134f0b5) — the
    manufacturer's OWN routed reference, Figure 6 'Section of layout showing
    RP2040 routing and decoupling', PDF p9, read visually at 200 dpi. What that
    render actually shows: the flash U2 placed hard against the QSPI corner of the
    RP2040 U3 with the QSPI bus as short straight runs and no vias; a tight row of
    0402 decoupling parts (C9/C10 and R3/R4) squeezed into the strip BETWEEN the
    flash and the chip; C11 hard against the left pin row and C15/C16 hard against
    the right pin row, i.e. decoupling distributed AROUND the package rather than
    clustered on one side; escapes fanning outward on the surface layer on a
    two-layer 1 mm board. The accompanying text (PDF p9) states the trade-off
    explicitly and tells you what to do differently on four layers. Schematic-side
    placement directives are printed ON Raspberry Pi's schematic sheet, not only
    in prose: 'Make sure C8 is close to pin 45 of RP2040', 'Make sure C10 is close
    to pin 44 of RP2040', 'Make sure R3 and R4 are close to RP2040' (Figure 3 /
    Figure 5, PDF p8-9), and 'Both R1 and R2 should be placed close to the flash
    chip' (section 2.2, PDF p10)."
  reviewed: "2026-07-28"
  keep_short:
    - {net: XIN, max_span_mm: 6, why: "the load capacitors are sized against a
       TOTAL stray of ~3 pF for both pins plus both tracks (Hardware Design
       section 2.3, PDF p11: 'the parasitic capacitance of the PCB traces are a
       factor, and we therefore need to keep them small so we don't upset the
       crystal'). DERIVED for THIS stackup: a 0.25 mm line on 0.2104 mm prepreg at
       Dk 4.4 is Z0 = 60.6 ohm with eps_eff = 3.245 (Hammerstad-Jensen with the
       thickness correction, DETAIL_DESIGN section 1 method), so t_pd/Z0 =
       6.01 ps/mm / 60.6 ohm = 0.099 pF/mm. Six millimetres is 0.6 pF — a fifth of
       the whole allowance — and that is the budget"}
    - {net: XOUT, max_span_mm: 6, why: "same 0.099 pF/mm arithmetic, and one extra
       reason: the 1 kohm damping resistor sits IN this net, so the pad-to-pad
       span already contains a part. Six millimetres covers MCU pad -> R -> and
       leaves the crystal terminal inside the budget. Beyond that the resistor
       stops being a lumped damping element and the XOUT node starts carrying its
       own delay"}
    - {net: QSPI_SCLK, max_span_mm: 12, why: "'the QSPI pins of RP2040 should be
       wired directly to the flash, using short connections to maintain the signal
       integrity, and to also reduce crosstalk in surrounding circuits' (Hardware
       Design section 2.2, PDF p10). SCLK is the one that matters most: it is the
       only continuously toggling line, so it is the spur source of record. 12 mm
       is what a 7 mm QFN edge-to-edge against a 5.28 mm SOIC body actually needs"}
    - {net: QSPI_SD0, max_span_mm: 12, why: "same source. Data lines toggle only
       on access but they toggle at the same edge rate, and the four of them are
       the loop area"}
    - {net: QSPI_SD1, max_span_mm: 12, why: "same source"}
    - {net: QSPI_SD2, max_span_mm: 12, why: "same source. NOTE the pad order on
       the package is SD3, SCLK, SD0, SD2, SD1, SS_N (pins 51-56) — SD2 does not
       sit next to SD3, so an author who lays the flash out by numerical order
       gets crossings that are not in the reference design"}
    - {net: QSPI_SD3, max_span_mm: 12, why: "same source"}
    - {net: QSPI_CSN, max_span_mm: 15, why: "three parts on one net: the flash
       /CS, the DNF 10 kohm pull-up and the 1 kohm BOOTSEL strap. 'Both R1 and R2
       should be placed close to the flash chip, so we avoid additional lengths of
       copper tracks which could affect the signal' (Hardware Design section 2.2,
       PDF p10). 15 mm is 12 mm plus the resistor pair, not a relaxation of the
       bus budget"}
    - {net: DVDD, max_span_mm: 10, why: "pin 45 -> pins 23 and 50 is an off-chip
       1.1 V link the chip cannot boot without (section 2.9.2, PDF p151), and it
       carries the 1 uF regulator output capacitor that section 2.10.1 (PDF p156)
       makes mandatory. WARNING, recorded rather than discovered: this net does
       NOT EXIST in 03_src/rules/nets.yaml today, so P-ADJ will find fewer than
       two pads and SKIP this budget SILENTLY — the same gate gap ADR-0005 records
       for SW_LS. The budget is written here so that it starts being graded the
       moment the net is declared"}
  notes:
    - "DERIVED, and it is the one layout fact that is about THIS board rather than
       about the RP2040: the QSPI bus is the only continuously switching structure
       on a board that is 270 degrees of receive fan, and nets.yaml already calls
       it 'the only CONTINUOUS in-band spur source... sitting 25 mm from a nine-arm
       receive fan, so \"short\" is an EMI rule here'. The lever is geometric and
       exists only at placement: radiated field from a current loop scales with
       LOOP AREA, so halving the flash-to-MCU distance halves the far-field
       amplitude at every harmonic — 6 dB, at no BOM cost, unavailable later. This
       is why the 12 mm budget above is tighter than signal integrity alone would
       ask for at 31-62 MHz, and why the flash belongs on the same layer, hard
       against pins 51-56, with no vias in the bus."
    - "DERIVED: pins 51-56 (QSPI) and pins 43-49 (all four supply domains plus the
       USB pair) are the SAME side of the package. That side is therefore both the
       escape budget of 14 and the entire decoupling cluster and the flash. Orient
       the RP2040 so that side faces the flash and the digital strip, and the
       opposite side (pins 15-28: XIN, XOUT, TESTEN, SWCLK, SWDIO, RUN and the
       select GPIOs) faces the crystal and the escape corridor. ADR-0007 already
       puts the switch's digital side at 225-315 degrees; the MCU's crystal side
       should point at the switch, not its QSPI side."
    - "DERIVED: the four select lines SEL_V1..SEL_V4 may be assigned to ANY four
       GPIOs — PIO can drive all of bank 0 (Table 3, PDF p13). Choose four
       CONSECUTIVE GPIOs on the side facing the switch, because ADR-0005 firmware
       obligation 2 requires all bits written in ONE PIO instruction, and a PIO
       OUT/SET writes a contiguous pin range. Non-consecutive pins force a
       read-modify-write, which is exactly the transient antenna the ADR forbids."
    - "OWED: the KiCad design files for the minimal design example and for the VGA
       demo board (both linked from Hardware Design with RP2040) were NOT fetched.
       Figure 6 is a raster render, not dimensions. Recorded as not done, not as
       absent."
    - "OWED: no OSHWLab-by-LCSC board was searched for C2040. Recorded as not
       done, not as absent."
