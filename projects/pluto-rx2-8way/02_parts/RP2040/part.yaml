sourcing:
  lcsc: C2040
  alternates: []                 # DELIBERATELY EMPTY, and that is a finding, not
                                 # laziness. BRIEF A4 fact-locks the RP2040 (free-
                                 # running PIO sequencer), and the PIO is the
                                 # reason — ADR-0005 rejects SPI on DETERMINISM,
                                 # which no ordinary MCU peripheral provides. The
                                 # LCSC catalogue's other "RP2040" rows are NOT
                                 # alternates: C2961140, C2761095 and C6855416 are
                                 # the same die at stock 0 (checked 2026-07-28),
                                 # and C5157610 "RP2040CT" is a different orderable
                                 # whose spec was NOT read here. Substituting the
                                 # MCU re-opens ADR-0005 items 1-3 by its own
                                 # closing line.
asserts:
  # KNOWN GATE GAP, stated rather than left to be discovered: `value:` asserts are
  # decoded by part_facts_check.py's SI parser, which cannot read an alphanumeric
  # MPN. Measured on this project 2026-07-28, BEFORE this dossier existed:
  #   P-FACT-CONFIG: KH-SMA-KE-Z: value assert has no decodable `equals:`
  #   P-FACT-CONFIG: PE42482A-X: value assert has no decodable `equals:`
  # So this entry will print CONFIG, not PASS, until the parser learns a string
  # form. It is declared anyway because the alternative is prose — the exact state
  # P-FACT exists to end — and because CONFIG is LOUD, not silent.
  - assert: value
    equals: RP2040
    why: "the BOM Comment must name the chip, not the role. This board's whole
      timing frame is an RP2040 PIO property (ADR-0005: 'a free-running PIO
      writing three pins costs one PIO clock, ~8 ns at 125 MHz, with zero jitter
      by construction'), and a Comment reading 'MCU' or 'RP2xxx' lets a
      sourcing-time substitution into a same-body, same-0.40 mm-pitch sibling pass
      every geometric check on the board while deleting the one guarantee the
      frame marker rests on. The ADR's own closing consequence says it: 'If the
      MCU is ever swapped, items 1-3 above must be re-derived against the new pad
      model.'"
