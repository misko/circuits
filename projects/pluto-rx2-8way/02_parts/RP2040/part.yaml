mpn: RP2040
manufacturer: Raspberry Pi Ltd
type: microcontroller            # NOT a converter. The chip contains an on-chip
                                 # LINEAR core regulator (VREG_VIN -> VREG_VOUT,
                                 # 1.1 V, 100 mA max, section 2.10 PDF p155) and it
                                 # is deliberately NOT typed `linear` here: E-TOPO
                                 # grades a `rails:` entry by its CONVERTER part's
                                 # type, and typing an MCU as a converter would put
                                 # dropout/dissipation gates on a part whose datum
                                 # is the die, not the board. CONSEQUENCE, recorded
                                 # rather than discovered: the 1.1 V rail this board
                                 # really carries in copper (pin 45 -> pins 23, 50)
                                 # is therefore UNGRADEABLE by E-TOPO. See gotchas.
