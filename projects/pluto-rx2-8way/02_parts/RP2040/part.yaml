                                 # DVDD, QSPI_SD3, QSPI_SCLK, QSPI_SD0, QSPI_SD2,
                                 # QSPI_SD1, QSPI_SS_N. FOURTEEN pads, NONE of
                                 # them GND, and on this board every one of the
                                 # fourteen is connected — so the worst side is
