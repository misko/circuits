  doc_id: DS20005160
  revision: DS20005160B         # Appendix A "Revision B (March 2021)", PDF p37;
                                # the string DS20005160B-page N is in the footer
                                # of every page, so the revision is unambiguous.
  url: https://wmsc.lcsc.com/wmsc/upload/file/pdf/v2/lcsc/2210171900_Microchip-Tech-MCP1755S-3302E-DB_C638611.pdf
                                # MICROCHIP'S OWN CDN 403s to a scripted client
                                # (ww1.microchip.com/downloads/... returned 403
                                # on three candidate paths, 2026-07-28). This is
