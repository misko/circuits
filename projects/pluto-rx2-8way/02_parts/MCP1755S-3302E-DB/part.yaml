mpn: MCP1755S-3302E/DB          # directory is MCP1755S-3302E-DB: the MPN carries
                                # a '/' that cannot be a path component. Same
                                # substitution the fleet already uses for
                                # LM5116MHX/NOPB and MCP23017-E/SS.
manufacturer: Microchip Technology Inc.
type: ldo_linear_3v3_fixed      # -> LINEAR for E-TOPO (normalize_type: no
                                # buck/boost substring; _LINEAR_RE matches
                                # "ldo" and "linear"). A CMOS pass element,
                                # not a switcher — which is the whole point on
                                # this board (ARCHITECTURE section 3 REFUSES a
                                # switching regulator on RF grounds).

# ---- LINEAR CONVERTER BLOCK — both required or E-TOPO cannot grade the rail --
dropout_mv: 500                 # DATASHEET MAX at the part's RATED output
                                # current: VDROPOUT = 300 mV typ / 500 mV MAX at
                                # IL = 300 mA (AC/DC Characteristics, PDF p6).
                                # 300 mA is the ENSURED minimum output current
                                # (PDF p5), so this is the conservative reading.
                                # Graded against vin_min - vout_max =
                                # 4.75 - 3.40 = 1350 mV  ->  500 <= 1350, a 2.7x
                                # margin. At THIS board's 0.15 A the real number
                                # is lower still; the datasheet publishes no
                                # separate 150 mA column, so the rated-current
                                # figure is what is cited rather than an
                                # interpolation off a curve (that would be
                                # ESTIMATED, not CITED — canon M-IMPORT).
pdiss_max_mw: 968               # PACKAGE rating, DERATED TO THIS BOARD.
                                # Microchip Equation 5-3 (PDF p21):
                                #   PD(MAX) = (Tj(MAX) - Ta(MAX)) / theta_JA
                                # theta_JA = 62 C/W (SOT-223-3, PDF p8; datum
                                # JESD51-7, named in section 5.3.1 PDF p22).
                                # AMBIENT AND JUNCTION DATUM, stated because a
                                # rating without one is ESTIMATED:
                                #   Ta = 40 C, Tj <= 100 C (= 0.8 x the 125 C
                                #   specified-limit basis DETAIL_DESIGN section
                                #   5 uses) -> (100-40)/62 = 968 mW.
                                # The datasheet's own UNDERATED figure at its
                                # 150 C junction limit is (150-40)/62 = 1774 mW;
                                # 968 is deliberately the stricter number so the
                                # gate cannot pass something the board's own
                                # thermal rule would reject.
                                # Graded: (5.25 - 3.20) x 0.15 = 307.5 mW
                                #   <= 968 mW, a 3.1x margin. Resulting rise is
                                #   307.5 mW x 62 C/W = 19.1 C -> Tj = 59.1 C.
