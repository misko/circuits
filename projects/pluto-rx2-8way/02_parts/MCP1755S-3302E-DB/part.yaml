                                # PDF's internal title is "MCP1755/MCP1755S Data
                                # Sheet", 42 pages, producer Acrobat Distiller
                                # 21.0, footers DS20005160B. Recorded as the URL
                                # actually fetched and hashed, not as a
                                # manufacturer URL that was never retrieved.
  sha256: 4868d8c139ed953bee3106ff3f0f4c7a0e0747ec1d50f7980684e462e61154c3
  fetched: 2026-07-28
  pages: 42
