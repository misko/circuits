sourcing:
  lcsc: C638611
  alternates: [C144220, C512091]
                                # C144220 = MIC5209-3.3YS-TR (Microchip/Micrel,
                                #   DS20005720A: SOT-223-3, VIN abs max
                                #   -20 to +20 V (p4), theta_JA 62 C/W on the
                                #   datasheet's stated "EIA/JEDEC ... 4 Layer
                                #   Board" datum (p8), dropout 300 mV max at
                                #   exactly IL=150 mA / 400 mV over full temp
                                #   (Table 1-1, p6), 500 mA rated). Passes all
                                #   three ADR-0004/DETAIL_DESIGN constraints with
                                #   room and has ~23x the stock. IT IS NOT
                                #   DROP-IN: its tab is pad 2 (a DIFFERENT KiCad
                                #   footprint, SOT-223-3_TabPin2), its IGND is
                                #   1.8 mA typ / 2.5 mA max at 150 mA instead of
                                #   0.3 mA, and it needs ~1 ohm of output-cap
                                #   ESR, so C_LDO changes from ceramic to
                                #   tantalum. A swap re-opens the footprint, the
                                #   dissipation term AND C_LDO. See gotchas.
                                # C512091 = MCP1703-3302E/DB (SOT-223-3, VIN abs
                                #   max 16 V, 250 mA, 2 uA Iq, ceramic-stable at
                                #   1 uF). Same footprint and same pinout family
                                #   as this part and it keeps C_LDO — but its
                                #   published PSRR is 44 dB at 100 Hz against
                                #   this part's 80 dB at 1 kHz, and it was at
                                #   stock 50 on 2026-07-28. Second, not first.
asserts:
  - assert: value
    equals: MCP1755S-3302E/DB
    why: "the BOM Comment must name the ORDER CODE, because three of the five
      failure modes this part has are order-code failures that assemble
      perfectly. (1) MCP1755 without the S is the SOT-223-5 variant: VIN moves
      from pad 1 to pad 2 and VOUT from pad 3 to pad 4 in a package with the
      same outline (Table 3-1 vs Table 3-2, PDF p15). (2) MCP1755ST-3302E/DB is
      the tape-and-reel code for the identical die and was stock 0 on
      2026-07-28, so a 'helpful' substitution to it is a part that cannot ship.
      (3) The Microchip siblings that share the SOT-223-3 land - TC1262-3.3VDB
      (C52507), TC2117-3.3VDB (C98655), TC1108-3.3VDB (C622711) - all fit this
      footprint and all regulate 3.3 V, and LCSC's input-voltage column lists
      every one of them at 6 V against this part's 16 V. That column is the
      OPERATING maximum, not the absolute maximum (it reads 16 V here where the
      datasheet says 17.6 V), so their datasheets must be opened before any
      substitution - but a 6 V OPERATING part is nowhere near ADR-0004's >= 10 V
      ABSOLUTE-MAXIMUM bar, and ADR-0004 disqualifies that class at selection:
      with an SMAJ5.0A-class clamp at ~9.2 V the regulator dies before the
      protection conducts. Such a part in this footprint produces a board that
      passes ERC, DRC, parity, twin and pin review and then fails the first time
      the TVS is asked to do its job."
