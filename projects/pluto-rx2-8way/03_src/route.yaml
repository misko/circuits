# pluto-rx2-8way — route + stitch config for
# skills/kicad-pcb/scripts/route_and_stitch_generic.py.
#
# ============================================================================
# WHY THIS FILE WAS REWRITTEN, 2026-07-28 (stage 4). WHAT WAS HERE BEFORE WAS
# THE SKILL'S SCHEMA EXAMPLE, UNEDITED — cook-loadcell's config, verbatim,
# down to
#     project: {name: cook_loadcell, board: 04_kicad/cook_loadcell.kicad_pcb}
# and a 2-layer `layers: [F.Cu, B.Cu]` with `fab_tier: standard`.
# `rebuild_reuse.sh` derives BOARD from floorplan.yaml (correctly,
# `pluto_rx2_8way`) but EVERY route/stitch step reads THIS file, so the
# routing stage would have opened, routed, stitched and gated a board file
# that does not exist — or, worse on a shared tree, a DIFFERENT board's.
# The same class of leftover was caught on a sibling board a day earlier
# (a stale `project.name` that would have emitted the wrong .kicad_pcb).
#
# ============================================================================
# WHAT IS AUTHORITATIVE HERE AND WHAT IS NOT — read this before trusting a
# number below.
#
#   AUTHORITATIVE (derived at stages 1-3, gated, and NOT to be "tuned"):
#     * project identity + the board path
#     * fab_tier `jlc_4layer_advanced` (ADR-0003; via/drill floors DERIVE
#       from it — explicit sub-floor values are a hard error naming the tier)
#     * the four-layer role assignment: L1 = F.Cu routing, L2 = In1.Cu SOLID
#       GND and NOTHING ELSE, L3 = In2.Cu the digital escape layer,
#       L4 = B.Cu GND (ARCHITECTURE sec 5/6)
#     * the RF wave runs FIRST and on F.Cu ONLY, with NO VIAS anywhere in an
#       arm (nets.yaml RF50 `intent:` — "a via's inductance depends on drill
#       and plating, which are not specified per hole", and ADR-0006 sells
#       CONSTANCY). Widening an RF50 track is as wrong as narrowing it.
#     * track widths are OMITTED so they DERIVE from each wave's member
#       netclass floors in rules/nets.yaml — the same source the .kicad_dru
#       gate is generated from. An explicit width below a member's class
#       floor is a hard error at prep; a silent ride-under is what cost
#       usb-hub-3s 157 track_width findings on its first DRC.
#
# ============================================================================
# THE 17 track_width FINDINGS, CLASSIFIED (2026-07-30, from the promoted
# board). "Classify, never count" — and the count that had been carried was
# WRONG: it read 7 artifact / 10 real. It is 8 / 9, and the misfiled one is
# the tell, because it is the only member of the artifact class that does NOT
# sit at 0.1998.
#
# EVERY ONE OF THE 17 CARRIES THE SAME 0.2 um DEFICIT, and it has a NAME.
# KRT's terminal-graze necker (single_ended_routing.py _neck_terminal_grazes)
# computes
#     allowed_half = d - clearance - 1e-4        # "stay just inside the rule"
#     new_w        = max(fab_floor, 2 * allowed_half)
# so every width it emits is 2 x 1e-4 = 0.0002 mm below the width the geometry
# actually allows. That is the whole of the artifact: the board carries 17
# tracks at 199800 nm and 1 at 399800 nm, and NOTHING else on it is off-grid.
# The same 0.0002 mm signature is on record fleet-wide (crow-mic-pod-v2 v1.0:
# 3 tracks at 0.2498 mm under a 0.25 mm floor — rules_audit's own docstring).
#
#   ARTIFACT, 8 findings — the neck took the 1e-4 margin and NOTHING ELSE, so
#   the copper is at its class floor to within 0.2 um:
#       7 at 0.1998 vs a 0.2 mm floor — SEL_V1 x2, SEL_V2, SEL_V4 (CTRL),
#         QSPI_CSN x2, QSPI_SD3 (QSPI)
#       1 at 0.3998 vs the 0.4 mm PWR floor — 3V3, the 1.4142 mm segment at
#         (39.000, 76.700). THIS is the one the 7/10 count filed as real. It
#         is the same 0.0002 mm, on a different floor.
#   REAL, 9 findings — 3V3 power taps at 0.1998 against the 0.4 mm PWR floor,
#   a 0.2002 mm shortfall = 0.2 mm of genuine neck PLUS the same 0.0002 mm
#   margin. All nine touch U_MCU's 3V3 pads (y 76.438) and all nine are
#   short: 0.0375..1.1314 mm, 3.2936 mm of copper in total.
#
# WHY NEITHER HALF GETS COPPER, and both reasons are measurements.
#   The ARTIFACT half must not be "fixed". This pipeline ALREADY encodes the
#   judgement: the stitcher's own width_floor pass lifts a track only when it
#   is more than 1000 nm under its floor (route_and_stitch_generic
#   p_width_floor) — a dead band FIVE TIMES this deficit. So the pipeline
#   grades 0.2 um as tolerance and the DRC gate grades it as a violation, and
#   the disagreement is between two gates, not on this board. 0.2 um is 0.1%
#   of a 0.2 mm trace and an order of magnitude inside any etch tolerance a
#   fab will quote. Putting copper on it would be answering a tolerance
#   question with geometry.
#   The REAL half must not be lifted BLIND. The neck is what KRT did to hold
#   the 0.2 mm clearance at U_MCU's 3V3 pad field; setting those nine segments
#   back to 0.4 mm re-creates exactly the graze the pass removed, i.e. trades
#   9 track_width findings for an unmeasured number of clearance findings.
#   WHAT THE NECK COSTS, measured rather than feared: 3.2936 mm at 0.1998 mm
#   on 35 um copper is 8.10 mOhm; at the 0.4 mm floor it would be 4.05 mOhm,
#   so the neck costs 4.05 mOhm = 0.61 mV at the PWR class's declared 0.15 A
#   envelope. And 0.4 mm is NOT an ampacity floor — nets.yaml says so in the
#   PWR intent ("far above the ampacity need ... chosen for IR drop and
#   robustness"): IPC-2221 external at 0.15 A, 10 degC rise, 1 oz needs
#   0.0219 mm, so even the NECKED 0.1998 mm is 9.1x the ampacity requirement.
#   The honest remedy is therefore a bounded `scoped_floors:` width relaxation
#   over the U_MCU 3V3 pad field carrying these numbers as its `why:` — the
#   WIDTH twin of the scoped_clearances now in nets.yaml. It is NOT taken here
#   because that pad field is the same MCU congestion that owns the 28
#   unconnected and the 21 digital clearance findings, and that is a stage-5
#   PLACEMENT question: relaxing a floor over copper that is about to be
#   re-placed would bake in a waiver for a geometry that will not survive.
# ============================================================================
#
#   NOT YET MEASURED — STAGE 6 OWNS THESE, and nothing below has been run:
#     keepout rects, per-wave iteration budgets, the stitch pass ORDER and
#     its per-pass parameters, seed stubs, taps, and the stitch grid extent.
#     They are seeded from the schema example's SHAPE with this board's
#     geometry substituted. Treat every one as a hypothesis until
#     `route_and_stitch_generic.py quick` has measured it.
# ============================================================================

project:
  name: pluto_rx2_8way
  board: 04_kicad/pluto_rx2_8way.kicad_pcb
  build_dir: 06_build/route

prep:
  out: r0.kicad_pcb
  keepouts:
    # User.2 = the normal keepout layer. User.3 = User.2 PLUS the RF fan, used
    # by the DIGITAL waves only: the control bus and the QSPI bus must descend
    # through the 225-315 degree escape sector on L3 and must never run
    # parallel to an RF arm (nets.yaml CTRL/QSPI `routing:`).
    layers: [User.2, User.3]
    mounting_holes: {radius: 3.0}       # M3 head + margin, four at the corners
    edge_band: 0.7                      # KRT has no edge concept; dru floor 0.3
    rects:
      # THE RECEIVE FAN IS KEEPOUT FOR THE DIGITAL WAVES. The star centre is
      # (46, 46) and the jack ring radius is 20.0, so the fan occupies
      # roughly x 21..71, y 21..66. The digital strip starts at y ~ 65
      # (below the lowest flange edge at y = 60.14 + 3.25).
      #
      # ----------------------------------------------------------------------
      # THE ESCAPE WEDGE IS CARVED OUT, 2026-07-30. WHAT WAS HERE BEFORE WAS A
      # SINGLE RECT {21, 21, 71, 65} THAT CONTRADICTED THE COMMENT ABOVE IT.
      # The comment says the control and QSPI buses "must descend through the
      # 225-315 degree escape sector"; the rect closed that sector completely.
      #
      # WHAT IT COST, MEASURED: the rect CONTAINED the endpoints of four nets.
      # SW_V1..SW_V4 leave U_SW's SOUTH LEAD ROW (pads 9-12, y 47.900,
      # x 45.75..47.25) and land on R_PD1-4.1 (y 50.690 / 53.090) — all eight
      # pads INSIDE the keepout — while their far ends R_S1-4.2 (y 66.6 / 68.1)
      # sit outside it. KRT's own docstring names this exact failure
      # (obstacle_map.add_user_keepout_obstacles): "a zone drawn over a routed
      # net's pad can make that net unroutable -- zones are meant for open
      # board area, not over pads." The four nets carried 0.000 mm of track
      # copper anywhere on the board and were 8 of the 28 unconnected.
      # It also blocks ALL COPPER LAYERS, so the L3 descent the comment
      # prescribes was blocked too — the keepout layer tags which WAVE sees
      # the zone, never which copper layer it frees.
      #
      # THE WEDGE IS REAL AND IT IS EMPTY BY CONSTRUCTION. The ten jacks sit at
      # 15/45/75/105/135/165/195/225 and 315/345 degrees; 240..300 HAS NO JACK,
      # which is why the escape sector was specified there in the first place.
      # Measured on the PROMOTED chain (03_src/route/r6.kicad_pcb, meanders
      # included): the only RF copper south of y=52 is ANT4 running to J_ANT4
      # at 225 deg and ANT5 running to J_ANT5 at 315 deg, and between them the
      # RF-free channel opens from 1.5 mm at y=47 to 32 mm at y=61.
      #
      # THE STAIRCASE BELOW IS FITTED TO THAT MEASUREMENT, not to a model: each
      # block edge is the measured 0.60 mm offset from the nearest RF track
      # CENTRELINE over its whole band (a linear fit to the arms was tried
      # first and was wrong by 0.65 mm — the trombone meanders push ANT4 out to
      # x=42.5, and the corridor grazed it at 0.0000 mm).
      # VERIFIED after fitting: all 8 SW_V1..V4 pads free (pad BOUNDING BOX,
      # not centre), 0 ctrl/qspi pads still covered, and the newly opened
      # 373.44 mm^2 comes no closer than 0.5000 mm to any RF centreline
      # = 0.320 mm to arm COPPER at the 0.36 mm arm width, against the 0.2 mm
      # Default clearance the DRC gate judges at. That single closest point is
      # U_SW.12's OWN PAD CORNER (47.400, 47.500) — the one band that needed a
      # 0.15 mm clamp off the 0.60 mm fit, and it is forced by the PE42482A-X
      # package (the SW leads sit between the ANT4 and ANT5 launch pads at
      # y=47.25), not chosen.
      #
      # AND THE STAR CANNOT MOVE: these rects are User.3, `route.common`
      # declares `keepout_layer: User.2`, and only the ctrl/qspi/sig waves
      # override it to User.3. The rf wave never reads this geometry.
      - {x0: 21.0, y0: 21.0, x1: 71.0, y1: 47.5,  layer: User.3}
      # the 240-300 deg escape wedge, left open between the ANT4/ANT5 arms
      - {x0: 21.0,  y0: 47.5, x1: 44.65, y1: 48.3, layer: User.3}
      - {x0: 47.5,  y0: 47.5, x1: 71.0,  y1: 48.3, layer: User.3}
      - {x0: 21.0,  y0: 48.3, x1: 44.5,  y1: 50.3, layer: User.3}
      - {x0: 47.5,  y0: 48.3, x1: 71.0,  y1: 50.3, layer: User.3}
      - {x0: 21.0,  y0: 50.3, x1: 42.5,  y1: 53.5, layer: User.3}
      - {x0: 49.5,  y0: 50.3, x1: 71.0,  y1: 53.5, layer: User.3}
      - {x0: 21.0,  y0: 53.5, x1: 39.3,  y1: 57.5, layer: User.3}
      - {x0: 52.7,  y0: 53.5, x1: 71.0,  y1: 57.5, layer: User.3}
      - {x0: 21.0,  y0: 57.5, x1: 35.3,  y1: 60.5, layer: User.3}
      - {x0: 56.7,  y0: 57.5, x1: 71.0,  y1: 60.5, layer: User.3}
      # below y=60.5 both arms have reached their jacks (RF copper ends at
      # y=59.867) and the band to the digital strip is RF-free outright.
  waves:
    exclude: ["GND", "unconnected-*"]
    groups:
      # HARDEST FIRST (golden rule 4). The nine radial arms plus the pickoff
      # cell claim the board before anything else is allowed to exist.
      rf:   [ANT1, ANT2, ANT3, ANT4, ANT5, ANT6, ANT7,
             RX1_MAIN, RX1_TAP_MID, RX1_TAP, RX2_OUT]
      pwr:  [VBUS, VBUS_F, VBUS_LDO, 3V3, DVDD_1V1]
      usb:  [USB_DP, USB_DM, USB_DP_MCU, USB_DM_MCU]
      ctrl: [SEL_V1, SEL_V2, SEL_V3, SEL_V4, SW_V1, SW_V2, SW_V3, SW_V4]
      qspi: [QSPI_SCLK, QSPI_CSN, QSPI_SD0, QSPI_SD1, QSPI_SD2, QSPI_SD3]
      sig:  rest

route:
  krt: ~/gits/KiCadRoutingTools
  common:
    # L2 (In1.Cu) IS ABSENT FROM THIS LIST ON PURPOSE. It is the solid,
    # unbroken reference under every RF arm and under the USB pair, and
    # ARCHITECTURE sec 6 makes that the single most important routing rule on
    # the board: nine arms sharing ONE reference is what makes their phases
    # comparable at all. L4 (B.Cu) is a GND pour and is likewise not a
    # routing layer here.
    layers: [F.Cu, In2.Cu]
    # via_size / via_drill OMITTED -> they default to the
    # jlc_4layer_advanced floors published in fab_tiers.yaml (ADR-0003).
    #
    # clearance IS declared, and it is declared UP, not down. tier_preflight
    # PF-RULES-CLR (2026-07-28) caught the mismatch this key exists to close:
    # generate_rules emits a HARDCODED 0.2 mm clearance for the Default class
    # and for every class in nets.yaml that does not override it, while an
    # omitted route clearance derives from the TIER floor 0.09 — so KRT would
    # have routed at 0.09 under a DRC floor of 0.2 that nobody declared
    # (crow-rv2 paid 500 phantom clearance findings for exactly this).
    # THE FIX LINE THE GATE PRINTS GOES THE OTHER WAY (drop the DRC floor to
    # 0.09) and is REJECTED here: on this board clearance is ISOLATION, not a
    # routability tax — 0.2 mm is what keeps the nine arms, the via fences and
    # the QSPI bus apart, and lowering it to quiet a gate would be an
    # electrical relaxation bought with a warning. 0.2 is 2.2x the tier floor.
    clearance: 0.2
    # `advanced`, NOT `jlc_4layer_advanced`. THIS KEY IS KRT'S OWN PRESET NAME
    # AND ITS ONLY LEGAL VALUES ARE {standard, advanced} — it is NOT this
    # pipeline's fab-tier identifier, which lives in 03_src/rules/nets.yaml and
    # is what `fab_tier(cfg)` reads for every via/clearance floor above. The
    # stage-4 rewrite of this file wrote the repo tier name here (the comment
    # block at the top of this file still explains the tier as though this were
    # that field), and route.py died on its FIRST wave with
    #     route.py: error: argument --fab-tier: invalid choice:
    #     'jlc_4layer_advanced' (choose from 'standard', 'advanced')
    # after prep had already succeeded. `advanced` is the right preset here and
    # needs no `fab_overrides` pin: KRT's internal advanced via floor is 0.25
    # and jlc_4layer_advanced's `min_via_diameter` is also 0.25, so there is
    # nothing for KRT to auto-escalate DOWN past (that is the crow-rv2 hazard
    # PF-KRT warns about, and it fires only when the tier floor is LOOSER than
    # 0.25 — measured here: equal, so no warning and no pin).
    # SKILL PATCH PROPOSED, NOT MADE (skills/ is off-limits this session):
    # tier_preflight.py PF-KRT reads this key and `return`s immediately unless
    # the value is exactly "advanced", so an INVALID value is indistinguishable
    # from "standard" and preflight reported `0 FAIL / 1 WARN — config is
    # tier-consistent` over a value KRT rejects outright. PF-KRT should FAIL a
    # value outside {standard, advanced, absent} — the check owns the only
    # place this string is validated before a KRT cycle is spent.
    fab_tier: advanced
    no_stub_layer_swap: true
    keepout: true
    keepout_layer: User.2
  waves:
    # RF FIRST, F.Cu ONLY, NO VIAS. Equal length is equal phase by
    # construction (ADR-0007); a layer change inside an arm destroys the one
    # property this board sells.
    #
    # ------------------------------------------------------------------------
    # W1 — THE LAUNCH. `clearance: 0.14` + `grid_step: 0.05`, ADDED 2026-07-30.
    # THIS IS THE ONE PLACE ON THE BOARD WHERE CLEARANCE GOES DOWN, and the
    # comment on route.common.clearance above — which rejects a relaxation —
    # is NOT being overruled: re-read it and it rejects relaxing the DRC FLOOR
    # to 0.09 to quiet a preflight warning, and it protects THE VIA FENCE GAP,
    # which is `stitch.clearance` and is STILL 0.2. Nothing about the fence
    # changes. What changes is the router's own budget on this wave only.
    #
    # THE WALL, EXACTLY. PE42482A-X's vendor land is 0.60 x 0.30 on a 0.50 mm
    # pitch, so a neighbouring GND land's near edge is 0.350 mm off the RF
    # centreline. FIVE of the eleven rf nets — ANT2, ANT3, ANT6, ANT7 and
    # RX2_OUT — are exactly the pads with a GND land on BOTH in-row flanks
    # (verified pad by pad off r0: pads 2, 4, 15, 17, 22). They have no escape
    # at all; the other six have one open flank and route at any setting.
    #
    # MEASURED, NOT REASONED — a 20-point (width x clearance) sweep on r0,
    # rf wave alone, nets routed out of 11:
    #             clr 0.20   0.15   0.145  0.14   0.12   0.09
    #     w 0.36      6      6      11     11     11     11
    #     w 0.32      6      11     -      -      11     11
    #     w 0.30      6      11     -      -      11     11
    #     w 0.26      6      11     -      -      11     11
    # and at grid_step 0.1 (KRT's default) NOTHING routes — not 0.30, not
    # 0.25, not 0.20 — because the RF land centres sit at odd multiples of
    # 0.05 (y = 45.25, 46.25, ...) and a 0.1 grid cannot put a centreline on
    # them. THE GRID IS A SEPARATE, FREE HALF OF THIS FIX and the 2026-07-29
    # record misses it: that day's "11/11 at 0.25 mm" is not reproducible at
    # grid 0.1 at ANY width, so the note attributing the wall to width alone
    # would have sent the next reader to the wrong knob.
    #
    # WHY 0.14: it is the LEAST relaxation that routes. 0.145 also routes and
    # 0.15 does not — a 0.005 mm cliff, which is grid quantisation, not
    # physics. Sitting a stochastic router on a measured cliff edge is how a
    # re-race silently loses five nets, so 0.14 buys one step of margin. It is
    # 1.56x the jlc_4layer_advanced min_space floor of 0.09, so it is
    # comfortably FABRICABLE; what it is not is DRC-legal against the 0.2 mm
    # Default clearance generate_rules emits, and that is a bounded, LOCATED
    # consequence rather than a diffuse one — the sub-0.2 copper can only
    # occur where the router had no room, i.e. inside the QFN launch.
    #
    # WHY THIS AND NOT THE OTHER TWO CANDIDATES:
    #   * NECK THE TRACE (neckdown_length/taper). REFUTED BY MEASUREMENT, and
    #     this is the finding worth carrying: KRT's neck-down cannot produce a
    #     wide body from a narrow plan. Run with --track-width 0.25
    #     --power-nets 'ANT*' --power-nets-widths 0.36 --neckdown-length 0.3,
    #     it routes 11/11 and then reports 149.83 mm of RF copper at 0.25 mm,
    #     0.50 mm in taper steps and 0.00 mm at 0.36. The re-widen pass only
    #     restores width where the NARROW-PLANNED path happens to have wide
    #     clearance, and on a radial star leaving a QFN it never does. The keys
    #     are in _KRT_FLAGMAP and they work; on THIS geometry they do not buy
    #     a 50 ohm arm. Do not re-try this without re-reading that number.
    #   * NARROW THE WHOLE ARM to 0.25 mm. That is 58 ohm over the full ~20 mm
    #     of every arm — a mismatch on the entire line, on the one board whose
    #     product is its RF paths. A local 0.6 mm discontinuity is lambda_g/45
    #     and LUMPED; 20 mm of wrong impedance is not.
    # AND THE LOCAL PERTURBATION IS COMMON-MODE: all eight launches are the
    # same vendor land rotated, which is the rotational congruence nets.yaml
    # already claims under `congruent_pads`, so whatever the launch does to
    # phase it does EQUALLY to all eight and cancels in every published delta.
    # HONEST CAVEAT, and it belongs in the file rather than in a report: this
    # repo has NO FIELD SOLVER, so it cannot distinguish "the coplanar GND
    # land at 0.14 mm loads the line" from "the DRC rule says 0.2". The claim
    # made here is the CLEARANCE claim, which is measurable. The RF claim is
    # not made.
    #
    # ------------------------------------------------------------------------
    # length_match_group / length_match_tolerance ADDED 2026-07-30, and they
    # are here because "equal by construction" IS FALSE OF COPPER on an
    # OCTILINEAR router. KRT moves in 8 directions, so the shortest possible
    # pad-to-pad arm is max(dx,dy) + 0.4142*min(dx,dy); only 3 of the 9 radials
    # sit on a 45-degree multiple and the other six pay ~7% of their radius.
    # MEASURED FROM PADS ALONE (copper_length_audit R-LEN-OCT, no router run):
    # Euclidean pad spread 0.3238 mm, OCTILINEAR FLOOR spread 1.4966 mm =
    # 19.74 deg at 6 GHz, against nets.yaml's max_spread_mm 1.0. The ceiling is
    # excluded BY THE MOVE SET, not by router effort — no iteration budget,
    # clearance or placement tuning reaches it.
    #
    # The floor is NOT a bound on the ACHIEVABLE spread, because a router can
    # LENGTHEN a short member. That is what this group does: KRT's
    # length_matching.py adds trombone meanders at the longest straight segment
    # of each member until every member reaches the group target. nets.yaml
    # therefore declares `elongation: meander` on RF_RADIAL_STAR, and the gate
    # CROSS-CHECKS that claim against THIS key — a claim about the recipe is
    # worth the recipe behind it. THE TWO EDITS ARE ONE CHANGE; deleting either
    # one alone re-fails R-LEN-OCT (as R-LEN-OCT-RECIPE if this key goes).
    #
    # THE GROUP IS WRITTEN OUT AS EIGHT LITERAL NET NAMES, not as the proven
    # hand-run's `['ANT*', 'RX2_OUT']`. The flag is fnmatch, so today the glob
    # selects exactly the same 8 nets — but the matched set must be IDENTICAL
    # to nets.yaml's `length_match: RF_RADIAL_STAR` members, and a glob makes
    # that an accident of naming: the ninth radial's nets (RX1_TAP,
    # RX1_TAP_MID, RX1_MAIN) are excluded ON PHYSICS (ADR-0006: a lumped
    # 2x220 ohm pickoff, "unequal by construction"), and if one were ever
    # renamed ANT8 the glob would silently pull it into the matched set and
    # meander a path whose length is not a phase. Literal names cost one line
    # and cannot drift.
    #
    # TOLERANCE 0.15 mm IS CHOSEN AGAINST THE ASSEMBLY, NOT AGAINST A WISH.
    # At 13.19 deg/mm (6 GHz, JLC04161H-7628, eps_eff 3.350) 0.15 mm is
    # 1.98 deg — one solder-fillet's worth of mounting-inductance asymmetry
    # (ADR-0006(d): ~0.1 nH ~ 2 deg per fillet, a CPL/reflow property no router
    # controls). Asking the router for less than the reflow oven can hold buys
    # a quantity that cannot exist on an assembled board; that is exactly the
    # arithmetic that withdrew the old +/-0.10 mm (= 1.3 deg) obligation. It is
    # also the value the 2026-07-29 hand run was MEASURED at: 8 nets,
    # target 19.83 mm, group spread 2.237 -> 1.1586 mm, 11/11 routed, 0 failed,
    # min_clearance_used 0.2 — no clearance relaxation anywhere.
    # AND THE TOLERANCE IS INERT ON THIS BOARD — MEASURED 2026-07-30, and it
    # is recorded here because the 2026-07-29 journal credits it with the
    # improvement it did not cause. Sweeping tolerance over {0.15, 0.10, 0.05}
    # at fixed amplitude moved the realized spread by EXACTLY ZERO at all five
    # amplitudes tried (15 runs). KRT meanders each member toward the group
    # TARGET and stops at a whole meander quantum; the residual is set by that
    # quantum, not by the tolerance band, so the band never binds. 0.15 stays
    # because it is the honest number for what it means (see above) and
    # because a value that does not bind is not a value to tune — but nobody
    # should expect it to buy anything here.
    #
    # meander_amplitude IS THE CONTROLLING KNOB, and this is the whole of the
    # W2 fix. Realized group spread vs amplitude, 11/11 routed at every point,
    # all copper at 0.36 mm:
    #     amp 1.0 -> 1.5586 mm   (WORSE than the 1.4966 mm octilinear floor:
    #                             a 1 mm trombone OVERSHOOTS the target)
    #     amp 0.8 -> 1.1586 mm   (the 2026-07-29 hand-run number, which that
    #                             journal entry attributes to the tolerance)
    #     amp 0.5 -> 0.6549 mm
    #     amp 0.3 -> 0.3236 mm  <-- CHOSEN
    #     amp 0.2 -> 0.3236 mm   (identical: the floor is reached at 0.3)
    # 0.3236 mm IS THE PRIZE AND IT IS NOT AN ARBITRARY MINIMUM: nets.yaml
    # derives a 0.3238 mm EUCLIDEAN pad-spread residue from the fact that the
    # jacks sit on a CIRCLE and the QFN's lands on a SQUARE (three switch-pad
    # radii, three arm lengths). The meandered copper lands 0.0002 mm off that
    # geometric residue, i.e. the elongation has recovered the ENTIRE
    # octilinear penalty and left only the irreducible term ADR-0006's
    # published table calibrates out. 0.3236 mm = 4.27 deg at 6 GHz against a
    # 1.0 mm ceiling — 3.1x margin.
    # 0.3 IS CHOSEN OVER 0.2 THOUGH THEY TIE, on RF grounds rather than on the
    # spread: they reach the same floor, so take the LARGER amplitude, which
    # needs FEWER trombone teeth and leaves MORE transverse separation between
    # adjacent meander legs. A meander's error term is the coupling between
    # its own parallel runs, and 0.2 mm of amplitude against a 0.36 mm trace
    # would put those runs closer together than the line is wide for no
    # measured gain.
    #
    # clearance 0.14 and grid_step 0.05 ARE THE W1 FIX AND THEY ARE ONE
    # DECISION. See the block above `- {name: rf ...}` — this override is the
    # ONLY place on the board where clearance goes DOWN, it is scoped to this
    # wave, and stitch.clearance stays 0.2 so the via fence — the gap that is
    # actually electrical — is unaffected.
    - {name: rf,   group: rf,   layers: [F.Cu], max_iterations: 400000,
       clearance: 0.14, grid_step: 0.05, meander_amplitude: 0.3,
       length_match_group: [ANT1, ANT2, ANT3, ANT4, ANT5, ANT6, ANT7, RX2_OUT],
       length_match_tolerance: 0.15}
    - {name: pwr,  group: pwr,  max_iterations: 400000}
    - {name: usb,  group: usb,  layers: [F.Cu], max_iterations: 400000}
    - {name: ctrl, group: ctrl, keepout_layer: User.3, max_iterations: 600000}
    - {name: qspi, group: qspi, keepout_layer: User.3, max_iterations: 600000}
    - {name: sig,  group: sig,  keepout_layer: User.3, max_iterations: 800000,
       max_probe_iterations: 60000, max_ripup: 30}
  # canon M3: the shipped board imports the PROMOTED chain file, not a fresh
  # stochastic route.
  #
  # PROMOTED 2026-07-30 from `route --race 4`, and the choice is JUDGED against
  # the MEASURED length spread rather than taken from the race's own tie-break.
  # THE FINDING IS THAT THERE WAS NOTHING TO CHOOSE BETWEEN: all four
  # candidates returned the SAME RF geometry — 158.237 mm of arm copper, 100%
  # of it at 0.36 mm, three arm lengths 19.6369 / 19.8018 / 19.9604 mm, group
  # spread 0.3236 mm — and the same digital metrics (26 unconnected, 88
  # violations pre-stitch, all four). The rf wave is EFFECTIVELY DETERMINISTIC
  # here: it runs first on a track-free board and the length matcher converges
  # on one solution, so the number this board PUBLISHES does not depend on
  # which lane won. c0 is the lowest index of four indistinguishable chains,
  # and that is the whole of the judgement — recorded because "the first chain
  # that reached 0 unconnected" would have been a different and worse reason.
  final: 03_src/route/r6.kicad_pcb

stitch:
  # 0.2, raised from 0.15 on 2026-07-28: tier_preflight PF-STITCH-CLR — rescue
  # and tap copper must be VERIFIED at the clearance the DRC gate will JUDGE
  # it at, and route.common.clearance is 0.2 on this board.
  clearance: 0.2
  # via size/drill OMITTED -> tier floors (jlc_4layer_advanced). `spacing` is
  # centre-to-centre and must leave more than the tier's hole_to_hole (0.25)
  # of drill-edge gap.
  # `tiers` IS declared: tier_preflight PF-HTC (2026-07-28) measured that the
  # unset default hole-to-copper of 0.205 is 0.055 mm STRICTER than this
  # board's own hole_clearance floor (0.15, set in floorplan.yaml for the
  # J_USB vendor land), which makes try_via refuse sites that are DRC-legal —
  # a FALSE placement wall that cost crow-rv2 a misdiagnosed D-BACK.
  via:
    spacing: 0.85
    pth_margin: 0.3
    tiers: [{size: 0.25, drill: 0.15, hole_to_copper: 0.155}]
  keepin: {inset: 0.8}
  passes: [dedupe_vias, normalize_vias, drop_micro_fragments, drop_dangling,
           split_t_junctions, reload, hole_to_hole, pad_rescue, stub_fallback,
           astar_fallback, stitch_grid, fill, island_rescue, fill,
           unify_zone_priorities, heal_islands, prune_stitch_dangling, gate]
  unify_zone_priorities: {min_bbox: 0.8}
  dedupe_vias: {radius: 0.5, metric: box}
  normalize_vias: {below_width: 0.249, size: 0.25, drill: 0.15}
  drop_micro_fragments: {max_length: 0.12, require_free_end: true}
  drop_dangling: {max_length: 1.0, tol: 0.05, sweeps: 4}
  split_t_junctions: {tol: 0.05}
  hole_to_hole: {min_gap: 0.25, mode: nudge, prefer_keep: [GND]}
  pad_rescue:
    # Four-layer board with ONE inner plane net (In1.Cu = GND) plus a B.Cu GND
    # pour. Every SMA ground post, U_SW's exposed pad, U_MCU's centre pad
    # (its ONLY ground connection — 56 leads and not one is GND) and U_ESD's
    # single ground pin need a via to L2 AT the pad, not a neck to a stitch.
    nets:
      - {net: GND, layer: In1.Cu}
    via_in_pad: true
    served_within: 1.6
    # 0.15 PREPENDED 2026-07-30. THE RESCUE STARTED OUTSIDE THE BOUND IT HAS
    # TO SATISFY. `rings` is measured from the pad BOUNDING-BOX EDGE, not from
    # its centre (route_and_stitch_generic._rescue_one_net:
    # vx = px + (w2 + r)*cos(ang)), so on U_SW.1 — a 0.60 x 0.30 land, w2 0.30
    # / h2 0.15 — the FIRST candidate ring 0.6 puts the barrel between 0.75 mm
    # (at 90 deg) and 0.90 mm (at 0 deg) from the pad centre, against
    # audit_board I8's 0.5 mm bound. MEASURED before this change: 0.863 mm,
    # which is exactly ring 0.6 at the default 30 deg angle_step
    # (sqrt((0.9*cos30)^2 + (0.75*sin30)^2) = 0.865, rounded to the 0.01 mm
    # grid). So the first site the pass could ever propose was already a FAIL:
    # no ordering of the remaining rings could have satisfied it, and the
    # pass reported success while the check reported failure.
    # WHY 0.15 AND NOT 0.2: at 0.2 the 0 deg site lands at w2 + r = 0.500 mm,
    # equal to the bound with zero margin. 0.15 bounds every angle at
    # <= 0.45 mm (0.45 at 0/180 deg, 0.30 at 90/270 deg). It is a CANDIDATE,
    # not a forcing: try_via still refuses any site that breaks hole-to-copper
    # or hole-to-hole, and the pass falls through to 0.6 exactly as before.
    rings: [0.15, 0.6, 0.8, 1.0, 1.4, 1.9, 2.5]
    stub_width: 0.3
    require: none
  stub_fallback: {net: GND, min_dist: 0.2, max_dist: 8.0, width: 0.3}
  astar_fallback: {net: GND, width: 0.25, window: 3.0, attempts: 3}
  stitch_grid:
    # THE FENCE IS THE PRODUCT, NOT HOUSEKEEPING. ARCHITECTURE sec 6 requires
    # ground vias flanking every RF arm at <= 1.37 mm (lambda_g/20 at 6 GHz)
    # and between adjacent SMA barrels; the 2.39 mm flange-to-flange gap the
    # R = 20 ring buys EXISTS to hold that fence. A uniform grid does NOT
    # discharge that obligation — the fence is per-arm geometry and is stage-6
    # work (a seed_stubs-style explicit plan, or a fence pass). This grid is
    # the BACKGROUND stitching only.
    net: GND
    x: [24, 68, 4]
    y: [24, 88, 4]
  # In1.Cu ADDED 2026-07-28: tier_preflight PF-LAYER measured that the
  # declared plane layer was NOT in the rescue scan, i.e. an island on the one
  # SOLID reference plane this board's whole phase argument depends on would
  # have been invisible (crow-rv2: 200 shorting + 501 clearance findings).
  island_rescue: {min_bbox: 0.8, layers: [B.Cu, F.Cu, In1.Cu, In2.Cu], require: all}
  heal_islands: {min_bbox: 0.8}
  prune_stitch_dangling: {tol: 0.05, min_layers: 2}
