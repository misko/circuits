# pluto-rx2-8way — route + stitch config for
# skills/kicad-pcb/scripts/route_and_stitch_generic.py.
#
# ============================================================================
# WHY THIS FILE WAS REWRITTEN, 2026-07-28 (stage 4). WHAT WAS HERE BEFORE WAS
# THE SKILL'S SCHEMA EXAMPLE, UNEDITED — cook-loadcell's config, verbatim,
# down to
#     project: {name: cook_loadcell, board: 04_kicad/cook_loadcell.kicad_pcb}
# and a 2-layer `layers: [F.Cu, B.Cu]` with `fab_tier: standard`.
# `rebuild_reuse.sh` derives BOARD from floorplan.yaml (correctly,
# `pluto_rx2_8way`) but EVERY route/stitch step reads THIS file, so the
# routing stage would have opened, routed, stitched and gated a board file
# that does not exist — or, worse on a shared tree, a DIFFERENT board's.
# The same class of leftover was caught on a sibling board a day earlier
# (a stale `project.name` that would have emitted the wrong .kicad_pcb).
#
# ============================================================================
# WHAT IS AUTHORITATIVE HERE AND WHAT IS NOT — read this before trusting a
# number below.
#
#   AUTHORITATIVE (derived at stages 1-3, gated, and NOT to be "tuned"):
#     * project identity + the board path
#     * fab_tier `jlc_4layer_advanced` (ADR-0003; via/drill floors DERIVE
#       from it — explicit sub-floor values are a hard error naming the tier)
#     * the four-layer role assignment: L1 = F.Cu routing, L2 = In1.Cu SOLID
#       GND and NOTHING ELSE, L3 = In2.Cu the digital escape layer,
#       L4 = B.Cu GND (ARCHITECTURE sec 5/6)
#     * the RF wave runs FIRST and on F.Cu ONLY, with NO VIAS anywhere in an
#       arm (nets.yaml RF50 `intent:` — "a via's inductance depends on drill
#       and plating, which are not specified per hole", and ADR-0006 sells
#       CONSTANCY). Widening an RF50 track is as wrong as narrowing it.
#     * track widths are OMITTED so they DERIVE from each wave's member
#       netclass floors in rules/nets.yaml — the same source the .kicad_dru
#       gate is generated from. An explicit width below a member's class
#       floor is a hard error at prep; a silent ride-under is what cost
#       usb-hub-3s 157 track_width findings on its first DRC.
#
#   NOT YET MEASURED — STAGE 6 OWNS THESE, and nothing below has been run:
#     keepout rects, per-wave iteration budgets, the stitch pass ORDER and
#     its per-pass parameters, seed stubs, taps, and the stitch grid extent.
#     They are seeded from the schema example's SHAPE with this board's
#     geometry substituted. Treat every one as a hypothesis until
#     `route_and_stitch_generic.py quick` has measured it.
# ============================================================================

project:
  name: pluto_rx2_8way
  board: 04_kicad/pluto_rx2_8way.kicad_pcb
  build_dir: 06_build/route

prep:
  out: r0.kicad_pcb
  keepouts:
    # User.2 = the normal keepout layer. User.3 = User.2 PLUS the RF fan, used
    # by the DIGITAL waves only: the control bus and the QSPI bus must descend
    # through the 225-315 degree escape sector on L3 and must never run
    # parallel to an RF arm (nets.yaml CTRL/QSPI `routing:`).
    layers: [User.2, User.3]
    mounting_holes: {radius: 3.0}       # M3 head + margin, four at the corners
    edge_band: 0.7                      # KRT has no edge concept; dru floor 0.3
    rects:
      # THE RECEIVE FAN IS KEEPOUT FOR THE DIGITAL WAVES. The star centre is
      # (46, 46) and the jack ring radius is 20.0, so the fan occupies
      # roughly x 21..71, y 21..66. The digital strip starts at y ~ 65
      # (below the lowest flange edge at y = 60.14 + 3.25).
      - {x0: 21.0, y0: 21.0, x1: 71.0, y1: 65.0, layer: User.3}
  waves:
    exclude: ["GND", "unconnected-*"]
    groups:
      # HARDEST FIRST (golden rule 4). The nine radial arms plus the pickoff
      # cell claim the board before anything else is allowed to exist.
      rf:   [ANT1, ANT2, ANT3, ANT4, ANT5, ANT6, ANT7,
             RX1_MAIN, RX1_TAP_MID, RX1_TAP, RX2_OUT]
      pwr:  [VBUS, VBUS_F, VBUS_LDO, 3V3, DVDD_1V1]
      usb:  [USB_DP, USB_DM, USB_DP_MCU, USB_DM_MCU]
      ctrl: [SEL_V1, SEL_V2, SEL_V3, SEL_V4, SW_V1, SW_V2, SW_V3, SW_V4]
      qspi: [QSPI_SCLK, QSPI_CSN, QSPI_SD0, QSPI_SD1, QSPI_SD2, QSPI_SD3]
      sig:  rest

route:
  krt: ~/gits/KiCadRoutingTools
  common:
    # L2 (In1.Cu) IS ABSENT FROM THIS LIST ON PURPOSE. It is the solid,
    # unbroken reference under every RF arm and under the USB pair, and
    # ARCHITECTURE sec 6 makes that the single most important routing rule on
    # the board: nine arms sharing ONE reference is what makes their phases
    # comparable at all. L4 (B.Cu) is a GND pour and is likewise not a
    # routing layer here.
    layers: [F.Cu, In2.Cu]
    # via_size / via_drill / clearance OMITTED -> they default to the
    # jlc_4layer_advanced floors published in fab_tiers.yaml (ADR-0003).
    fab_tier: jlc_4layer_advanced
    no_stub_layer_swap: true
    keepout: true
    keepout_layer: User.2
  waves:
    # RF FIRST, F.Cu ONLY, NO VIAS. Equal length is equal phase by
    # construction (ADR-0007); a layer change inside an arm destroys the one
    # property this board sells.
    - {name: rf,   group: rf,   layers: [F.Cu], max_iterations: 400000}
    - {name: pwr,  group: pwr,  max_iterations: 400000}
    - {name: usb,  group: usb,  layers: [F.Cu], max_iterations: 400000}
    - {name: ctrl, group: ctrl, keepout_layer: User.3, max_iterations: 600000}
    - {name: qspi, group: qspi, keepout_layer: User.3, max_iterations: 600000}
    - {name: sig,  group: sig,  keepout_layer: User.3, max_iterations: 800000,
       max_probe_iterations: 60000, max_ripup: 30}
  # canon M3: the shipped board imports the PROMOTED chain file, not a fresh
  # stochastic route. NO CHAIN HAS BEEN PROMOTED YET — this key stays absent
  # until stage 6 promotes one into 03_src/route/ and commits it. Its absence
  # is what makes `import` a no-op today rather than a silent wrong replay.
  # final: 03_src/route/rN.kicad_pcb

stitch:
  clearance: 0.15
  # via size/drill OMITTED -> tier floors (jlc_4layer_advanced). `spacing` is
  # centre-to-centre and must leave more than the tier's hole_to_hole (0.25)
  # of drill-edge gap.
  via: {spacing: 0.85, pth_margin: 0.3}
  keepin: {inset: 0.8}
  passes: [dedupe_vias, normalize_vias, drop_micro_fragments, drop_dangling,
           split_t_junctions, reload, hole_to_hole, pad_rescue, stub_fallback,
           astar_fallback, stitch_grid, fill, island_rescue, fill,
           unify_zone_priorities, heal_islands, prune_stitch_dangling, gate]
  unify_zone_priorities: {min_bbox: 0.8}
  dedupe_vias: {radius: 0.5, metric: box}
  normalize_vias: {below_width: 0.249, size: 0.25, drill: 0.15}
  drop_micro_fragments: {max_length: 0.12, require_free_end: true}
  drop_dangling: {max_length: 1.0, tol: 0.05, sweeps: 4}
  split_t_junctions: {tol: 0.05}
  hole_to_hole: {min_gap: 0.25, mode: nudge, prefer_keep: [GND]}
  pad_rescue:
    # Four-layer board with ONE inner plane net (In1.Cu = GND) plus a B.Cu GND
    # pour. Every SMA ground post, U_SW's exposed pad, U_MCU's centre pad
    # (its ONLY ground connection — 56 leads and not one is GND) and U_ESD's
    # single ground pin need a via to L2 AT the pad, not a neck to a stitch.
    nets:
      - {net: GND, layer: In1.Cu}
    via_in_pad: true
    served_within: 1.6
    rings: [0.6, 0.8, 1.0, 1.4, 1.9, 2.5]
    stub_width: 0.3
    require: none
  stub_fallback: {net: GND, min_dist: 0.2, max_dist: 8.0, width: 0.3}
  astar_fallback: {net: GND, width: 0.25, window: 3.0, attempts: 3}
  stitch_grid:
    # THE FENCE IS THE PRODUCT, NOT HOUSEKEEPING. ARCHITECTURE sec 6 requires
    # ground vias flanking every RF arm at <= 1.37 mm (lambda_g/20 at 6 GHz)
    # and between adjacent SMA barrels; the 2.39 mm flange-to-flange gap the
    # R = 20 ring buys EXISTS to hold that fence. A uniform grid does NOT
    # discharge that obligation — the fence is per-arm geometry and is stage-6
    # work (a seed_stubs-style explicit plan, or a fence pass). This grid is
    # the BACKGROUND stitching only.
    net: GND
    x: [24, 68, 4]
    y: [24, 88, 4]
  island_rescue: {min_bbox: 0.8, layers: [F.Cu, In2.Cu, B.Cu], require: all}
  heal_islands: {min_bbox: 0.8}
  prune_stitch_dangling: {tol: 0.05, min_layers: 2}
