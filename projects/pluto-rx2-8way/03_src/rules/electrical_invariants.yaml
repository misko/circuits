# pluto-rx2-8way — ELECTRICAL INVARIANTS (canon E-INV, phase E1 = netlist-only).
#
# Design INTENT made EXECUTABLE against the exported netlist. Every other gate
# on this board proves SELF-CONSISTENCY; this one proves the netlist matches
# what the ADRs decided. The D1 reverse-polarity defect (usb-hub-3s v1.0)
# passed ERC, DRC, parity, jlc_twin AND pin review because symbol, footprint,
# netlist and board were consistently WRONG together — only intent disagreed,
# and intent was not machine-checkable.
#
# THIS BOARD HAS AN UNUSUALLY LARGE SHARE OF FACTS THAT NO ELECTRICAL CHECK CAN
# SEE, which is why the list below is long for a board of ~40 parts:
#   * the V1-MSB / V3-LSB mapping — swapping them reverses the antenna sweep,
#     and an AoA solver absorbs a reversed sweep as a ROTATED ARRAY (ADR-0005);
#   * the pickoff resistor VALUES — the netlist, DRC, ERC and parity are
#     IDENTICAL for any resistance, while the value sets the published tap
#     ratio, the RX1 insertion loss and the return loss (ADR-0002);
#   * which RF port carries the reference — RF8 was chosen by an isolation
#     argument that is invisible in copper (ADR-0006).
#
# Graded by: electrical_invariants.py PROJECT_DIR (exit 1 names the assertion
# and the actual net or value found), and --adr-coverage for E-ADR.
# NOTE `adr:` is QUOTED throughout: a bare zero-padded 0011 is a YAML 1.1 OCTAL
# literal and is REJECTED at load.

invariants:

  # ===================================================================
  # ADR-0004 — input-protection posture
  # ===================================================================
  - assert: series_chain
    chain: [VBUS, F_IN, VBUS_F]
    adr: "0004"
    why: "the PPTC sits between the USB-C VBUS pin and the protected node, so a
      board fault (or a TVS that fails short) opens the fuse instead of burning
      on the host's current budget. Fuse UPSTREAM of clamp is the ordering, and
      it is only checkable as a chain"

  - assert: pin_on_net
    pin: "D_TVS.1"
    net: VBUS_F
    adr: "0004"
    why: "THE D1 CLASS, EXACTLY. D_TVS's CATHODE must clamp the PROTECTED node
      downstream of F_IN, not the raw VBUS pin upstream of it. usb-hub-3s v1.0
      shipped this backwards and passed ERC, DRC, parity, twin and pin review
      because every artifact agreed with every other artifact.
      CORRECTED 2026-07-28 AT THE STAGE-2 MERGE — this assertion said `D_TVS.2`
      and gave as its reason 'Pad 2 is the cathode on the SMA/SMAJ land pattern
      (banded end)'. THAT IS BACKWARDS. Pad 1 is the cathode. Three independent
      legs: (a) the repo's own 03_src contract, hard rule 5 — 'KiCad footprints
      put the cathode on pad 1'; (b) the KiCad footprint itself, read as text —
      `Diode_SMD:D_SMB` puts pad 1 at x = -2.15 mm with the F.Fab cathode bar at
      x = -0.649 mm and the F.SilkS polarity band at the pad-1 end; (c) five
      sibling boards' dossiers all say pad 1 = K (usb-hub-3s-v3 SMBJ6.0A,
      crow-mic-pod-v2 SMAJ6.0A, crow-recorder-central SMBJ5.0A,
      crow-recorder-central-v2 SMAJ5.0A, usb-hub-3s SMAJ24A).
      The severity is the point: E-INV cannot run before a netlist exists, so
      this would have first fired at STAGE 4 and demanded the author wire the
      TVS BACKWARDS to turn it green. A gate that asserts the defect it was
      written to prevent is worse than no gate. The part fact now also lives in
      `02_parts/SMBJ6.0A/part.yaml` as a `pad1_net_polarity` assert, so
      part_facts_check grades it against the exported netlist independently"

  - assert: net_has_part
    net: VBUS_F
    part_type: capacitor
    min: 1
    adr: "0004"
    why: "the clamped node carries the bulk bypass. USB 2.0 caps a device's
      downstream VBUS bypass at 10 uF to bound inrush; the design budget is
      ~6.1 uF, which is what makes 'no inrush limiter' a decision rather than
      an omission"

  - assert: part_value
    part: R_CC1
    equals: 5.1k
    tolerance_pct: 5
    adr: "0004"
    why: "5.1k on CC1/CC2 is what advertises this board as a plain 5 V sink, so
      a PD source never negotiates 9/15/20 V onto VBUS. It is the part that
      makes sustained overvoltage UNREACHABLE rather than survivable — a
      PROTECTION part whose wrong value is electrically undetectable on the
      bench until a PD charger is plugged in"

  - assert: part_value
    part: R_CC2
    equals: 5.1k
    tolerance_pct: 5
    adr: "0004"
    why: "as R_CC1. Both are required — a single CC pull-down advertises a sink
      on one orientation only, so the board would behave differently depending
      on which way the cable was inserted"

  # ===================================================================
  # ADR-0002 — the split-arm resistive pickoff (D3, user-confirmed)
  # ===================================================================
  - assert: series_chain
    chain: [RX1_MAIN, R_T1, RX1_TAP_MID, R_T2, RX1_TAP]
    adr: "0002"
    why: "the pickoff arm is a SERIES pair by decision, not a convenience: two
      220 ohm 0402s put their ~0.04 pF parasitics in SERIES, halving the
      effective shunt C and cutting the 6 GHz tap tilt from +1.69 dB to
      +0.43 dB — and, more importantly, narrowing the UNKNOWN band from 2.73 dB
      to 0.83 dB. A single 440 ohm part, or a parallel arrangement, satisfies
      the topology in spirit and destroys the property"

  - assert: part_value
    part: R_T1
    equals: 220
    tolerance_pct: 1
    adr: "0002"
    why: "tap = Z0/(Rs+Z0), IL = 20log10(1 + Z0/(2*(Rs+Z0))) and RL = f(Rs) are
      ALL set by this value. At Rs = 440 the published numbers are -19.83 dB
      tap / 0.432 dB main-line loss / 26.3 dB return loss. The netlist, DRC,
      ERC and parity are IDENTICAL for any resistance, so nothing else on this
      board can detect a substitution that moves the RX1 tap calibration"

  - assert: part_value
    part: R_T2
    equals: 220
    tolerance_pct: 1
    adr: "0002"
    why: "as R_T1, and this is the one the DEFAULT BUILD pins. ADR-0002 records
      a deliberate alternate build in which R_T2 is populated as 0 ohm (Rs =
      220): +4.84 dB of reference-dwell SIR for 0.337 dB more RX1 loss, a BOM
      change with no board change. If that alternate is ever selected, this
      assertion is the thing that must change WITH it — which is the point"

  # ===================================================================
  # ADR-0006 — port assignment (the reference is on RF8, not on a
  # 'best isolation' port). Unobservable in copper; asserted here.
  # ===================================================================
  - assert: pin_on_net
    pin: "U_SW.19"
    net: RX1_TAP
    adr: "0006"
    why: "RF8 (pin 19) carries the RX1 pickoff. Two independent arguments pick
      RF1/RF8: best insertion loss (1.9 dB max at 4-6 GHz vs 2.2-2.3), and —
      the counter-intuitive one — the isolation column grades the LEAKING port,
      so putting the reference on the WORST-isolation port REMOVES the largest
      term from the seven-leaker sum (-23.4 dB vs -22.5 dB for the naive
      'best isolation' choice). RF8 over RF1 puts the X/2 marker at code 111,
      the end of a straight 0..7 count"

  - assert: pin_on_net
    pin: "U_SW.22"
    net: RX2_OUT
    adr: "0006"
    why: "RFC (pin 22) is the single common port to Pluto RX2. Every one of the
      eight measured paths runs through it, so it is the one net whose
      misassignment would be invisible per-path and fatal overall"

  - assert: pin_on_net
    pin: "U_SW.24"
    net: ANT1
    adr: "0006"
    why: "RF1 (pin 24) is array element 1 and the DELTA REFERENCE for the whole
      published phase/loss table (every delta in ADR-0006's artifact is quoted
      against RF1, matching the datasheet's own RFx-RF1 convention, Table 3
      note 2, PDF p8). If element 1 is not on RF1 the published table is
      referenced to the wrong port and every delta is wrong by a constant"

  # ===================================================================
  # ADR-0005 — control plane, defaults, LS ground, source termination
  # ===================================================================
  - assert: pin_on_net
    pin: "U_SW.1"
    net: GND
    adr: "0005"
    why: "LS has a 1 Mohm INTERNAL PULL-UP (Table 5 fn 1, PDF p10). Left
      floating it reads as logic 1 and selects the COMPLEMENTED half of the
      truth table — RF1<->RF8, RF2<->RF3, RF4<->RF7, RF5<->RF6 — so the board
      still sweeps eight antennas in a plausible order and NOTHING detects it.
      Table 3 fn 1 additionally makes LS an RF ground that moves IL and
      isolation, which is why it is on GND rather than on a pulled-down net"

  - assert: pin_on_net
    pin: "U_SW.9"
    net: SW_V1
    adr: "0005"
    why: "V1 is the MSB (n-1 = 4*V1 + 2*V2 + 1*V3, Table 5, PDF p10). Swapping
      V1 and V3 reverses the antenna sweep order, and an AoA solution absorbs a
      reversed sweep as a rotated array — a silently wrong answer, not a
      failure. The three select assertions exist for this one reason"

  - assert: pin_on_net
    pin: "U_SW.11"
    net: SW_V3
    adr: "0005"
    why: "V3 is the LSB. See U_SW.9 — the pair is what pins the bit order"

  - assert: pin_on_net
    pin: "U_SW.12"
    net: SW_V4
    adr: "0005"
    why: "V4 = 1 with V1..V3 = 0 is the ALL-PORTS-TERMINATED state (Table 5 last
      row, PDF p10) — the DARK FRAME the leakage-matrix and SMA port-to-port
      isolation measurements depend on (ADR-0002 T3, ADR-0006). It is also the
      pin whose float silently MUTES the receiver, which is why the part's own
      layout block budgets its pull-down at <= 4 mm from the pad"

  - assert: series_chain
    chain: [SEL_V1, R_S1, SW_V1]
    adr: "0005"
    why: "the 47 ohm source resistor must be IN SERIES between the MCU pad and
      the switch pin — not a shunt, not at the switch end. It sizes the source
      impedance to >= the 67 ohm line so the far-end reflection stays inside
      PE42482A-X's 3.6 V digital absolute maximum at the RP2040's STRONGEST
      drive setting: 4.81 V without it, 3.18 V with it. Protection that lives
      in a firmware register is not protection"

  - assert: series_chain
    chain: [SEL_V4, R_S4, SW_V4]
    adr: "0005"
    why: "as R_S1, on the line whose failure mode is silent (see U_SW.12)"

  - assert: net_has_part
    net: SW_V4
    part_type: resistor
    min: 2
    adr: "0005"
    why: "SW_V4 must carry BOTH its series source resistor and its 10 kohm
      pull-down. V1-V4 have NO internal pull of any kind (5 uA max input
      current, Table 2, PDF p3), so all four float during reset and supply
      ramp; a floating V4 selects the mute state. min: 2 is what distinguishes
      'the pull-down exists' from 'the series resistor exists'"

  - assert: part_value
    part: R_PD4
    equals: 10k
    tolerance_pct: 5
    adr: "0005"
    why: "10k against 5 uA of input leakage holds the pin at 50 mV — 92% margin
      to V_IL(max) 0.6 V. 100k would sit at 500 mV, 100 mV from reading as a
      logic 1 and therefore from muting the receiver; 1k would burn 13 mA
      across the four lines to solve a 5 uA problem. The value is a margin, not
      a convention"

  - assert: part_value
    part: R_S1
    equals: 47
    tolerance_pct: 5
    adr: "0005"
    why: "47 ohm is the smallest E24 value satisfying Z_drv + R_S >= Z_line
      (67 ohm) at the RP2040's strongest drive (Z_drv ESTIMATED 25 +/- 10 ohm).
      A smaller value re-opens a 4.81 V far-end peak against a 3.6 V absolute
      maximum; a much larger one is harmless electrically but is no longer the
      derived number"

# ---------------------------------------------------------------------------
# label_survival — the schematic NET-MERGE gate (S-NETMERGE), graded by
# net_label_survival.py. The GENERIC check (every schematic global_label must
# exist as a netlist net) is ALWAYS ON and needs no config; this block carries
# only the optional extras. NOTHING IS EXEMPTED ON THIS BOARD, deliberately —
# every declared net is intended to reach copper.
#
# A `pin_map:` for U_SW's nine RF ports is the natural extension here (the
# crow-recorder 8-port RJ45 shape) and is NOT written yet: the pin-to-net map
# is currently pinned by the four pin_on_net assertions above, and a second
# home for the same fact would drift. Revisit when the schematic exists.
label_survival: {}

# DEFERRED to E2 (geometric — need footprint/geometry, not just the netlist):
#   clamp_le_rating  — D_TVS's clamp voltage vs U_LDO's V_IN absolute maximum,
#                      the pairing ADR-0004 currently enforces by a SELECTION
#                      CONSTRAINT (V_IN abs max >= 10 V) and a human read
#   kelvin_within    — not applicable on this board
