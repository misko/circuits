# pluto-rx2-8way — policy_audit waivers. Written at the PLACEMENT gate
# 2026-07-28, rewritten 2026-07-29 when three gate fixes changed WHAT IS
# MEASURED without changing a single track or pad.
#
# THE RULE THIS FILE IS HELD TO (repo CLAUDE.md): "Waivers need evidence, not
# rationale. A waiver copied from another board is not a judgement — it is an
# inherited defect." Nothing here is copied. Every entry carries the MEASURED
# number the gate itself printed, and every entry says what the property WOULD
# have to be for the waiver to become unnecessary.
#
# ============================================================================
# THE P-ADJ WAIVER IS RETIRED. IT WAS THREE-QUARTERS ARGUMENT FOR A FIX THAT
# HAS NOW LANDED, WHICH IS NOT A JUDGEMENT ANY MORE.
# ============================================================================
# It carried three exceeding budgets and, in its own closing paragraph, asked
# for exactly the change that arrived on 2026-07-29: "the budget would be
# gradeable as written if keep_short could name pins rather than a net".
# P-ADJ now grades the ANCHOR PIN of the DECLARING part against its nearest
# qualifying partner, and all three entries dissolved rather than moved:
#   * RP2040 `DVDD_1V1 <= 10 mm` — was 13.167 mm as a whole-net maximum
#     (U_MCU.23 -> C_VREG_OUT.1, a pair the sentence is not about). The anchor
#     metric reads 8.787 mm (U_MCU.23 -> C_MCU7.1): PASS, and it NAMES the
#     tight pair instead of burying it under a board-scale number. Nothing was
#     re-placed for this; the same copper now grades correctly.
#   * PE42482A-X `SW_V4 <= 4 mm` — was 21.64 mm because R_S4, the source
#     termination ADR-0005 deliberately puts at the DRIVER end, is the third
#     pad on the net. Now 3.057 mm (U_SW.12 -> R_PD4.1): PASS. The topology the
#     board's own ADR chose is no longer scored as a placement error.
#   * ABM8-272-T3 `GND <= 3 mm` — was 67.24 mm, which was the BOARD DIAGONAL.
#     The anchor metric read 3.233 mm (Y_XTAL.4 -> C_XTAL1.2), a real 0.233 mm
#     miss of a real property, and THAT WAS FIXED IN COPPER rather than waived:
#     both load capacitors were rotated 180 degrees so their GND pad faces the
#     can instead of their live pad, and the pair now measures 2.457 mm
#     (Y_XTAL.4 -> C_XTAL1.2) and 2.291 mm (Y_XTAL.2 -> C_XTAL2.2). The cost is
#     stated in 03_src/floorplan.yaml: the live legs lengthen 1.821 -> 2.780 mm
#     (XIN) and 2.011 -> 2.915 mm (XOUT_XTAL), which is +0.153 pF total against
#     the part.yaml's own 3 pF stray allowance, while the ground return that the
#     same sentence says is IN the oscillator loop shortens by 0.78/0.85 mm.
#   P-ADJ is now PASS: 30 of 36 declared keep_short budgets graded, 0 exceeded,
#   tightest margin +0.161 mm (QSPI_SD2, U_MCU.54 -> U_FLASH.3, 11.839 of 12.0).
#
# P-ADJ-PAIR NEEDS NO WAIVER EITHER, AND IT IS THE ONE HONEST NEW RED THIS
# ROUND. `layout.adjacency` had been in the 02_parts contract, in the
# part.yaml files, and READ BY NOTHING; graded for the first time it reported
# MCP1755S-3302E-DB U_LDO~C_LDO at 4.879 mm and U_LDO~C_LDI at 10.781 mm of
# copper gap against the 3 mm its own datasheet sec 4.3/4.4 asks for. NOT
# waived, because the cause was an ORIENTATION and not a shortage of room:
# U_LDO sat at rotation 0, pointing pins 1/2/3 at a board edge 1.29 mm away, so
# no capacitor could ever be placed at VIN or VOUT. Rotation 180 turns the pin
# row inboard and the two gaps become 0.860 mm and 1.200 mm. P-ADJ-PAIR is now
# PASS, 7/7 graded, tightest +0.311 mm (J_USB~U_ESD on USB_DM, 1.689 of 2.0).
# INDEPENDENT CONFIRMATION WORTH RECORDING (canon M1): that 1.689 mm is the
# same number this board's own 03_src/audit_board.py hand-measures for the D+/D-
# pair, reached by a different method in a different script — so ST DocID11265
# sec 2.2's 6 nH/10 mm -> 305 V clamp-overshoot hazard is closed by two lenses.
#
# WHAT IS DELIBERATELY *NOT* WAIVED, so the absence is a decision and not an
# oversight: R-DRC (4 violations / 99 unconnected / 0 parity) and R-THERM
# (U_LDO.4, U_SW.25, U_MCU.57 with zero thermal vias) are STRUCTURAL FAILS —
# there are no tracks and no stitch vias on this board yet, because stage 5
# stops before routing. They close when stage 6 routes and stitches. Waiving a
# gate because its stage has not run yet would be the worst thing in this file.
# (Those R-DRC numbers were 24 / 100 / 12 when this file was first written and
# three of the four classes behind them were authoring defects hiding behind a
# fail the reader had been told to expect: 12 parity -> 0 by clearing Datasheet
# and Description properties in the three AUTHORED .kicad_mod, whose citations
# live in each footprint's `descr` where parity does not compare them; 7
# text_thickness -> 0 by REGENERATION ALONE, a stale artifact from before
# fab_tiers' min_silk_stroke moved 0.15 -> 0.1125; 2 silk_edge_clearance -> 0 by
# trimming J_USB's flank silk to local +2.95 and DELETING the cross line rather
# than moving it inboard, because a line drawn where the body does not end
# misplaces the part it is meant to align; 15 starved_thermal -> 4 by pad-level
# zone_connection: full on the GND pads of U_SW / J_USB / U_MCU.)

- id: P-ADJ-UNREACHED
  refs: [KH-SMA-KE-Z, MCP1755S-3302E-DB, USBLC6-2SC6]
  why: >
    THREE of the 42 declared layout budgets are graded by NOTHING. IT WAS SIX
    OF 43 ON 2026-07-29 AT STAGE 5, AND THE OTHER THREE ARE NOW CLOSED IN
    SOURCE RATHER THAN WAIVED — stage 6 opened by fixing the DECLARATIONS
    instead of re-asserting the hand measurements. What follows is the
    correction of this file's own reasoning, because the previous revision
    stated a general claim that is FALSE:

      "The new optional `anchor_pins:` key CANNOT rescue any of the six: it
       filters among the pads the declaring part already has ON the named net,
       and in every case here the declaring part has NO pad on that net at all"

    The mechanism is right and the survey behind it was wrong. It is true of
    (a), (b) and (c) below. It was FALSE for two of the three that have gone,
    and E-NETREF had already printed the evidence as a NEAR MISS: `SW_VDD`
    resolved to nothing while its nearest existing name was `SW_V4`, and
    `SW_LS` near-missed the whole `SW_V1..V4` family — a near miss on a name
    that does not exist is a sign the budget is pointed at a DATASHEET PIN
    FUNCTION rather than at a board node, and the board node is usually right
    there. What was actually needed was to ask which NODE each datasheet
    sentence is about:

      * PE42482A-X `SW_VDD <= 3 mm` -> `{net: 3V3, anchor_pins: ["8"]}`.
        U_SW DOES have a pad on 3V3: pin 8, the pin the sentence is about. The
        old objection ("the budget as written would grade the whole rail") was
        true of the WHOLE-NET metric and stopped being true when P-ADJ moved to
        the anchor metric on 2026-07-29 — the whole-rail reading is 21.669 mm
        (U_SW.8 -> U_MCU.22), the anchor reading is U_SW.8 -> C_SW1.1 =
        2.873 mm of 3.0. This entry's own (b) had already MEASURED that
        2.873 mm by hand; the fix was to let the gate read it. It is now
        P-ADJ's TIGHTEST GRADED MARGIN on the board (+0.127 mm).
      * ABM8-272-T3 `XOUT <= 6 mm` -> `{net: XOUT_XTAL, anchor_pins: ["3"]}`.
        The old entry (d) named the gradeable version correctly — "a XOUT_XTAL
        declaration ... a SOURCE change owed at the next schematic revision" —
        and then deferred it. `XOUT_XTAL` was ALREADY on the board
        ([R_XTAL.2, Y_XTAL.3, C_XTAL2.1]), so no schematic revision was owed:
        the budget is SPLIT AT THE PART BOUNDARY, MCU leg graded by RP2040's
        own `XOUT` at 3.062 mm (U_MCU.21 -> R_XTAL.1) and crystal leg graded
        here at Y_XTAL.3 -> R_XTAL.2 = 3.618 mm of 6.0. The 6.680 mm
        pin-to-pin path across both nets stays REPORTED, not compared: 6 mm was
        written against a single span and no single span exists.
      * PE42482A-X `SW_LS <= 2 mm` -> DELETED, and this is the one where
        re-pointing was REFUSED. Pin 1 is on `GND` (ADR-0005), so unlike the
        other two a name was available that P-ADJ would have accepted — and it
        would have graded the wrong quantity: nearest other-footprint GND pad
        MEASURED at 6.956 mm (C_SW1.2), a 4.956 mm "miss" of a budget about a
        BARREL. The obligation moved to the instrument that can see it,
        03_src/audit_board.py **I8**: nearest GND via centre within 0.5 mm of
        the pin-1 pad centre, on the stitched board, with the same treatment
        extended to Y_XTAL pads 2 and 4 (own via each, <= 1.0 mm, distinct).
        Raising 2 mm to 7 mm to make the declaration green would have been the
        exact defect this row exists to catch.

    THE LINE THIS ENTRY STILL WILL NOT CROSS: for (b) and (c) there IS a board
    net whose name would make the budget graded and passing. Re-pointing a
    budget at a net BECAUSE it passes is not a fix. The test applied to all
    three closures above was "is this the node the datasheet sentence is
    about?", and it is why one of them was deleted instead.

    (a) KH-SMA-KE-Z `RF_ANT_LAUNCH <= 3 mm` — a GENERIC name from the dossier's
    reference design, not a board net: 0 pads carry it. Its real subjects are
    the ten launches, and they are graded by 03_src/audit_board.py I2 (all ten
    SMA centre pins carry the >= D3.5 mm L2 antipad override) and I3 (nine
    radial arms, pad-to-pad 17.778..18.102 mm, spread 0.3238 mm). UNCHANGED
    from 2026-07-28 and re-verified today.

    (b) MCP1755S-3302E-DB `VBUS_F <= 15 mm`: U_LDO carries NO pad on
    `VBUS_F`. BLM21SP601SN1D (FB_IN) sits between them, so the LDO's pin 1 is
    on `VBUS_LDO` and VBUS_F is the node upstream of the ferrite. THIS ONE WAS
    ACTUALLY FAILING WHILE UNGRADED, which is the reason this row exists: hand
    measured on the 2026-07-28 placement, U_LDO.1 -> FB_IN.2 was 17.194 mm and
    U_LDO.1 -> F_IN.2 (the real VBUS_F pad) was 16.808 mm — both OVER the
    datasheet's 15 mm, with no gate able to say so. The rotation-180 fix made
    for P-ADJ-PAIR closed it as a side effect: the same pairs now measure
    9.395 mm and 10.602 mm. Inside 15 mm on both readings.

    (c) USBLC6-2SC6 `VBUS <= 25 mm`: U_ESD carries NO pad on `VBUS`. That
    is ADR-0008 working as designed — the ESD array's VBUS leg is deliberately
    tied to `VBUS_F`, DOWNSTREAM of the 0.5 A fuse, so a clamp event is
    current-limited. HAND MEASURED against the node the sentence means:
    U_ESD.5 -> J_USB.A9 = 5.707 mm centre-to-centre, 4.336 mm of copper gap,
    inside the 25 mm by more than 19 mm. The property the ST sentence is
    actually about — the array close to the connector — is graded, twice, by
    the adjacency budgets U_ESD~J_USB (1.689 mm of 2.0) from both part.yamls.

- id: P-SILK-REF
  refs: [C_MCU7, R_CC1]
  why: >
    CARRIED FOR THE RECORD, NOT TO CHANGE A VERDICT: P-SILK-REF reports PASS
    today, and it reports PASS *because it reads a waiver file the generator
    writes for itself*. generate_board_generic drops a refdes to F.Fab when its
    ownership-and-collision search finds no slot, lists it in
    04_kicad/refdes_waiver.json, and policy_audit's P-SILK-REF skips every
    refdes in that list. Checker and checked share a method there (canon M1),
    so the gate cannot demand evidence for those two and this entry supplies it
    anyway; it is handed up as a proposed skill change (the gate should require
    a project-side evidenced entry per machine-waived refdes, not just the
    machine's own list).
    THE MEASURED REGRESSION, STATED AS A REGRESSION: this board printed 64/64
    refdes on silk with ZERO waived on 2026-07-28. It now prints 62/64, and
    C_MCU7 and R_CC1 are on F.Fab only. The cause is the ownership term added
    to the placer on 2026-07-29: the search now insists a refdes land nearer
    its own part than any other, which consumes different real estate, and two
    labels lose. That is a real loss in one metric bought with a larger gain in
    another, and both numbers belong in the same sentence: refdes ownership went
    24/64 -> 39/64 (the first measurement of the property at all), silk
    ownership overall is 50 of 74 labels owned with 22 degraded and 2 unplaced,
    and ALL SEVENTEEN CAPTIONS ARE NOW OWNED where five were not.
    WHY THESE TWO CAN AFFORD IT, per part:
      * C_MCU7 is one of ten identical 100 nF 0402 MCU decouplers, sitting in
        the sub-MCU row of EIGHT parts at 2.2 mm pitch inside a 1.92 mm band —
        the tightest silk real estate on the board. A hand-fitting operator
        never places it: it is a JLC-assembled 0402 on a CPL row.
      * R_CC1 is one of two identical 5.1 k CC pull-downs sitting under the
        USB-C connector's bounding box (J_USB occupies y >= 83.54 across
        x 40.68..51.32), where its own courtyard is 2.87 mm from the C_ESD
        refdes that beat it to the slot. Same story: 0402, machine-placed.
    THE MITIGATION, and it is a mitigation and not a reason the check does not
    apply: both refdes are PRESENT on F.Fab at 0.45 mm, both parts are on the
    fab CPL with their own x/y/rotation, and the CPL — not the silkscreen — is
    what positions a machine-assembled 0402. A silk refdes on these two would
    only serve rework, and rework on a 0402 in a 2.2 mm row is done against the
    fab drawing anyway. THIS BECOMES UNNECESSARY when the placer can shrink or
    rotate into the gaps those two rows leave; the honest statement today is
    that 0.45 mm text at 0.16 mm clearance does not fit beside them.

- id: S-OCCL
  refs: [pluto_rx2_8way.kicad_sch]
  why: >
    16 text occlusions in 04_kicad/pluto_rx2_8way.kicad_sch, all of one class:
    a tscircuit net label overlapping a component Reference in the CONVERTER's
    auto-layout ('label 3V3 x Reference C_MCU10', 'label SW_V2 x label SEL_V2',
    and 13 more of the same shape). This file is the CONVERTER output, and
    repo ADR-0002 Phase A makes it the MACHINE artifact only: "the human
    schematic document = tscircuit's OWN render (build/schematic.pdf, shipped
    in the release); the converter .kicad_sch is the machine artifact only
    (ERC/netlist/parity, need not be pretty)". It is here because
    --schematic-parity SILENTLY SKIPS without a .kicad_sch beside the board.
    HONESTLY STATED: this check was N-A at stage 4 only because no schematic
    had been copied into 04_kicad yet, so these 16 are a genuinely NEW finding
    and not a pre-existing waiver — the defect is in the converter's label
    placement, it affects every board on the tscircuit path, and it is carried
    up as a proposed skill fix rather than absorbed here. The reader-facing
    schematic (03_tscircuit/build/schematic.pdf) is unaffected.
