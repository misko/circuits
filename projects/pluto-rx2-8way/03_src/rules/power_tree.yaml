# pluto-rx2-8way — power tree. The input to E-TOPO / E-MARGIN / E-OFF
# (skills/kicad-pcb/scripts/power_topology.py). Authored at stage 3; see
# 01_docs/ARCHITECTURE.md "Power tree" and 01_docs/decisions/0004-*.md.

# ---- E-OFF: de-energization + stored draw (ADR-0004) ----
# This board carries NO self-contained energy source. It is bus-powered from a
# USB-C host and is de-energized by unplugging the cable. Declared rather than
# omitted: E-OFF must grade this as N-A FOR A STATED REASON, not because the
# file is silent (canon M-COVER — a gate that passes while grading nothing).
source_type: usb_bus_powered_5v
off_control: "unplug the USB-C cable — no self-contained energy source is
              present on the board (ADR-0004)"
quiescent_ua: 0
# Unplugged the board holds <= 6.1 uF of ceramic bypass (held under the USB 2.0
# 10 uF downstream-bypass limit by design, ADR-0004), which the regulator's own
# path bleeds in milliseconds. There is no storage self-drain question.

input_trunk_class: PWR

rails: []
# ================= WHY `rails:` IS EMPTY, AND WHAT MAKES IT HONEST ==========
#
# The board HAS one converted rail — 5 V VBUS -> 3.3 V for the RP2040, the
# QSPI flash and PE42482A-X's VDD. Its ENVELOPE is already fixed and lives in
# 01_docs/ARCHITECTURE.md and DETAIL_DESIGN.md:
#
#     name        3V3
#     vin_min     4.75 V   (USB 2.0 low limit at the device end)
#     vin_max     5.25 V   (USB 2.0 high limit)
#     vout_min    3.20 V   (3.3 V nominal, -3% worst case)
#     vout_max    3.40 V   (3.3 V nominal, +3% worst case)
#     iout_max_A  0.15     (design envelope; ~0.06 A typical — see nets.yaml PWR)
#     converter   <OWED — the LDO has no 02_parts dossier yet>
#
# Derived topology: vout_max (3.40) < vin_min (4.75) => step-down => a LINEAR
# regulator MEETS the requirement (E-TOPO's 2026-07-27 amendment). Its dropout
# and dissipation bounds are the numbers that matter and both are already
# constrained in DETAIL_DESIGN section 5:
#     dropout at 0.15 A must be <= 4.75 - 3.40 = 1.35 V
#     PD = (5.25 - 3.20) * 0.15 = 308 mW  -> the package rating must exceed it
#     and ADR-0004 additionally binds V_IN(abs max) >= 10 V so the TVS clamp
#     (~9.2 V at 43.5 A for the SMAJ5.0A class) sits INSIDE the regulator's
#     rating rather than outside it.
#
# `converter:` must name a part that exists in 02_parts, and the LDO dossier is
# a stage-2 continuation item (02_parts/README.md). Naming a part that is not
# there is a LoadError FAIL — strictly worse than the N-A this file earns
# today, because a LoadError says nothing about coverage.
#
# THE N-A IS EARNED, NOT ASSERTED. power_topology.py checks `rails: []` against
# 02_parts DIRECTLY (converter_census(), canon M1: "checked against 02_parts,
# not against the power tree's own say-so"). 02_parts currently declares three
# parts — an SP8T switch, an SMA jack and a thick-film resistor — and no
# converter of any kind, so E-TOPO reports:
#
#     E-TOPO N-A: 0/0 — power_tree.yaml has no rails, and 02_parts declares no
#     buck/boost/buck_boost/linear converter, so there is genuinely nothing to
#     derive
#
# and THE MOMENT the LDO dossier lands this file turns E-TOPO RED until the
# rail above is uncommented with its `converter:` filled. That is the intended
# failure mode: the gap is held open by the gate, not by a TODO.
#
# E-MARGIN: N-A by construction. No rail on this board feeds a load with a
# published brownout threshold — the RP2040, the flash and the switch are all
# ordinary 3.3 V parts with no external undervoltage-detect behaviour, so there
# is no `load_uv_threshold` to declare. Stated rather than left blank.
