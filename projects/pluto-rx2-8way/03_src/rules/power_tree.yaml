# pluto-rx2-8way — power tree. The input to E-TOPO / E-MARGIN / E-OFF
# (skills/kicad-pcb/scripts/power_topology.py). Authored at stage 3; see
# 01_docs/ARCHITECTURE.md "Power tree" and 01_docs/decisions/0004-*.md.

# ---- E-OFF: de-energization + stored draw (ADR-0004) ----
# This board carries NO self-contained energy source. It is bus-powered from a
# USB-C host and is de-energized by unplugging the cable. Declared rather than
# omitted: E-OFF must grade this as N-A FOR A STATED REASON, not because the
# file is silent (canon M-COVER — a gate that passes while grading nothing).
source_type: usb_bus_powered_5v
off_control: "unplug the USB-C cable — no self-contained energy source is
              present on the board (ADR-0004)"
quiescent_ua: 0
# Unplugged the board holds <= 6.1 uF of ceramic bypass (held under the USB 2.0
# 10 uF downstream-bypass limit by design, ADR-0004), which the regulator's own
# path bleeds in milliseconds. There is no storage self-drain question.

input_trunk_class: PWR

rails:
  - name: 3V3
    # ---- vin: the LDO's OWN input, not the USB connector's ----------------
    # 4.75 V is the USB 2.0 low limit at the DEVICE end. It is NOT what the
    # regulator sees, because two series elements sit between the VBUS pin and
    # VIN and both were selected AFTER this envelope was written:
    #   F_IN  1206L050/24WR  R_1max 0.75 ohm  (Littelfuse 1206L table, PDF p2)
    #   FB_IN BLM21SP601SN1D DCR max 0.06 ohm (Murata PSDS, DC resistance row)
    #   0.15 A x 0.81 ohm = 121.5 mV
    # so vin_min at the pass element is 4.75 - 0.1215 = 4.63 V. Declaring 4.75
    # here would grade the dropout at a node the regulator is not connected to
    # and hand the rail 121 mV of headroom it does not have. The R_1max figure
    # is the CONSERVATIVE reading (post-reflow / post-trip), not R_min 0.15.
    vin_min: 4.63
    # vin_max stays the RAW 5.25 V on purpose, asymmetrically: E-TOPO computes
    # dissipation as (vin_max - vout_min) x iout, so the worst case for HEAT is
    # the highest input. Subtracting the same IR drop at the high corner
    # (5.13 V) would UNDER-state PD by 18 mW. Worst case at both ends, and the
    # asymmetry is deliberate rather than an oversight.
    vin_max: 5.25
    vout_min: 3.20            # 3.3 V nominal, -3% worst case
    vout_max: 3.40            # 3.3 V nominal, +3% worst case
    iout_max_A: 0.15          # design envelope; ~0.06 A typical (nets.yaml PWR)
    converter: MCP1755S-3302E-DB
    # eff: is IGNORED for a LINEAR rail by power_topology.py — a pass element
    # draws Iin = Iout whatever Vin does, so the derived input-trunk current is
    # 0.15 A and matches nets.yaml's PWR class declaration exactly. Left unset
    # rather than set to a decorative 1.0 (pluto-cal-switch wrote `eff: 1.0`
    # with a comment claiming it made the trunk current correct; it does not).

# ================= WHAT THIS RAIL IS GRADED ON, AND WHY IT IS GREEN =========
#
# Derived topology: vout_max (3.40) < vin_min (4.63) => step-down => BUCK
# required, and a LINEAR pass element IMPLEMENTS that requirement (E-TOPO's
# 2026-07-27 amendment). A switcher is refused on RF grounds regardless of
# efficiency (ARCHITECTURE section 3), so LINEAR is the CHOSEN implementation
# of a step-down, not a compromise.
#
# The two bounds the Vin-vs-Vout derivation is blind to, both from
# 02_parts/MCP1755S-3302E-DB/part.yaml, both CITED:
#   dropout_mv    500   Microchip DS20005160B AC/DC Characteristics: V_DROPOUT
#                       300 mV typ / 500 mV MAX at IL = 300 mA — the datasheet
#                       MAX at the part's RATED current, i.e. the conservative
#                       reading, and 2x our actual load. Headroom is
#                       (4.63 - 3.40) = 1230 mV against it.
#   pdiss_max_mw  968   DERIVED, not published: Microchip states "Internal
#                       Power Dissipation ... Internally Limited", so the
#                       package rating is computed from theta_JA 62 C/W
#                       (SOT-223-3, Temperature Characteristics table) at the
#                       DETAIL_DESIGN section 7 datum Tj <= 0.8*Tj_max = 100 C
#                       and Ta = 40 C: (100-40)/62 = 968 mW. PD at the envelope
#                       is (5.25 - 3.20) x 0.15 = 308 mW = 32% of it.
#
# ADR-0004's third constraint is NOT machine-graded here and that is stated
# rather than implied: V_IN(abs max) >= the TVS clamp. It is DEFERRED as
# `clamp_le_rating` in electrical_invariants.yaml because it needs both parts'
# facts, not the netlist. The pairing as actually selected:
#   D_TVS  SMBJ6.0A   V_C = 10.3 V at I_PP 58.3 A (Littelfuse SMBJ table)
#   U_LDO  MCP1755S   V_IN absolute maximum = +17.6 V (DS20005160B p6)
# 17.6 > 10.3 with 7.3 V to spare. NOTE THE CONSTRAINT MOVED: ADR-0004 wrote
# ">= 10 V" against a 5.0 V-standoff part clamping at 9.2 V, and the part
# actually selected is a 6.0 V standoff clamping at 10.3 V (the 5.0 V standoff
# was rejected because VBUS_max 5.25 V sits ABOVE its 5.0 V working voltage).
# A regulator rated exactly 10 V would now be OUT of spec. See DETAIL_DESIGN
# section 5.
#
# THE N-A THIS FILE USED TO EARN IS GONE, AND THAT WAS THE DESIGN. Until
# 2026-07-28 this file carried `rails: []` and E-TOPO reported an N-A that
# power_topology.py checked against 02_parts DIRECTLY (converter_census(),
# canon M1 — "checked against 02_parts, not against the power tree's own
# say-so"), so the N-A would turn RED the moment any converter dossier landed.
# It landed; the rail above is why the gate is green instead. The gap was held
# open by the gate, not by a TODO, and it closed by being filled.
#
# E-MARGIN: N-A by construction. No rail on this board feeds a load with a
# published brownout threshold — the RP2040, the flash and the switch are all
# ordinary 3.3 V parts with no external undervoltage-detect behaviour, so there
# is no `load_uv_threshold` to declare. Stated rather than left blank.
