# pluto-rx2-8way floorplan — the per-board input to
# skills/kicad-pcb/scripts/generate_board_generic.py (no board-specific
# generation Python; ADR-0002 of the repo).
#
# THIS FILE IS INTENT, NOT COPPER. Every number below is DERIVED in
# 01_docs/decisions/0007-radial-star-floorplan.md and 01_docs/DETAIL_DESIGN.md;
# nothing here has been measured, legalized or gated yet. At stage 5 the
# legalizer may move SEEDS (never ANCHORS), and placement_gates.py (P-OUT pads
# inside the outline polygon, P-CAP corridor demand) plus P-COLLIDE grade the
# result.
#
# THE SHAPE, IN ONE SENTENCE: PE42482A-X sits at the geometric centre of a
# 20.0 mm ring carrying ten vertical SMA jacks at 30 degree spacing over 270
# degrees, with the remaining 90 degree sector (centred straight down, off the
# package's pins-7..12 edge) reserved as the digital escape corridor into a
# 24 mm strip along the bottom of the board. Nine equal-length 50 ohm arms —
# EQUAL LENGTH IS EQUAL PHASE BY CONSTRUCTION, which is the whole AoA
# requirement (ADR-0006).
#
# WHY THE OUTLINE IS A RECTANGLE AND NOT pSemi's OCTAGON: the EVK (Figure 21,
# PDF p19) uses EDGE-LAUNCH jacks, which must sit on an edge, so nine of them
# force a nine-sided outline. KH-SMA-KE-Z is a VERTICAL THT FLANGE jack that
# mounts on the board FACE. The polygon was the connector style's shadow, not
# the requirement — and dropping it keeps this board inside the SHARED generic
# backend, which supports a rectangle (+ corner radius, + edge notches) and has
# no polygon outline at all.

project:
  name: pluto_rx2_8way
  netlist: 06_build/netlists/pluto_rx2_8way.net
  output: 04_kicad/pluto_rx2_8way.kicad_pcb
  parts_dir: 02_parts

board:
  # 50.0 x 68.0 mm. Star centre C = (46.0, 46.0), ring radius R = 20.0 mm.
  outline: {x0: 21.0, y0: 21.0, x1: 71.0, y1: 89.0}
  edge_width: 0.1
  layers: 4
  mounting_holes:
    # Ten cabled SMA ports are ten torque paths into one laminate; these are
    # structural. All four sit >= 10.4 mm from the nearest flange centre.
    footprint: MountingHole:MountingHole_3.2mm_M3
    at: [[24.5, 24.5], [67.5, 24.5], [24.5, 84.5], [67.5, 84.5]]

libraries: [03_src/lib, /usr/share/kicad/footprints]
# PROJECT LIBRARY FIRST, deliberately. Both OWED footprints were AUTHORED on
# 2026-07-28 into 03_src/lib/pluto_rx2_8way.pretty/ — QFN-24_4x4_P0.5_EP2.7_PE42482
# from pSemi Figure 23's RECOMMENDED LAND PATTERN inset (DOC-75785-4 p21) and
# SMA_Vertical_5.08sq_D1.4 from the Kinghelm sheet-2/2 PCB inset (2021.08.10).
# Neither was copied; neither existed anywhere in this repo.
# WHY THE ORDER MATTERS AND IS NOT COSMETIC: KiCad ships
# Package_DFN_QFN:QFN-24-1EP_4x4mm_P0.5mm_EP2.65x2.65mm, an IPC-GENERATED land
# for the same package outline with 0.85 mm pads at r = 1.95 and a 2.65 mm EP,
# against the vendor's 0.60 mm pads at r = 1.90 and a 2.75 mm EP. Resolving to
# the stock library would move every RF land 0.05 mm outward and shrink the
# RF-ground exposed pad by 0.10 mm on a 4.00 mm package — a substitution no
# DRC, parity or netlist check can see.

placement:
  # ANCHORS are PINNED — the legalizer never moves them. Everything here is a
  # position the RF derivation produced, so moving it changes an electrical
  # claim, not a convenience.
  anchors:
    # ---- the switch, at the geometric centre, rotation 0 so that pins 7..12
    #      (GND, VDD, V1..V4 — the only side with no RF on it) face DOWN into
    #      the escape sector. Every RF port then exits toward its own slot and
    #      NO ARM CROSSES ANOTHER ARM (ADR-0007).
    U_SW: [46.0, 46.0, 0]

    # ---- the ring: x = 46 + 20*cos(theta), y = 46 - 20*sin(theta), with theta
    #      in the usual math convention (y-up) and the KiCad angle taken as
    #      (-theta) mod 90. The 5.08 mm post square is 4-fold symmetric, so the
    #      rotation is electrically irrelevant and is chosen only to maximise
    #      the flange-to-flange gap; at R = 20 that gap is 2.39 mm (support
    #      bound), against 1.36 mm at R = 18 and 0.09 mm — i.e. touching — at
    #      R = 18 with axis-aligned flanges. THAT GAP IS THE GROUND-VIA FENCE,
    #      and the fence is the port-to-port isolation budget.
    J_RX2:  [40.824, 26.681, 75]   # theta 105  <- RFC  (pin 22) -> Pluto RX2
    J_ANT1: [31.858, 31.858, 45]   # theta 135  <- RF1  (pin 24)
    J_ANT2: [26.681, 40.824, 15]   # theta 165  <- RF2  (pin 2)
    J_ANT3: [26.681, 51.176, 75]   # theta 195  <- RF3  (pin 4)
    J_ANT4: [31.858, 60.142, 45]   # theta 225  <- RF4  (pin 6)
    J_ANT5: [60.142, 60.142, 45]   # theta 315  <- RF5  (pin 13)
    J_ANT6: [65.319, 51.176, 15]   # theta 345  <- RF6  (pin 15)
    J_ANT7: [65.319, 40.824, 75]   # theta 15   <- RF7  (pin 17)
    J_ANT8: [51.176, 26.681, 15]   # theta 75   <- RF8  (pin 19) = the RX1 antenna
    J_RX1:  [60.142, 31.858, 45]   # theta 45   -> Pluto RX1 (off-switch)

    # ---- the pickoff cell, ON the 75 degree radius so the RX1 arm is the same
    #      radial run as the other eight. IDENTICAL rotation on both, never
    #      mirrored: mounting-inductance asymmetry is ~0.1 nH ~= 2 deg at
    #      6 GHz and mirroring converts fillet asymmetry into calibration
    #      error (ADR-0006(d)). This is a CPL fact.
    #      r is bounded ABOVE by the J_ANT8 flange, whose inner edge sits at
    #      r = 20.0 - 3.25 = 16.75: at r = 15.0 the outer pad of R_T1 reaches
    #      r = 15.48, leaving 1.27 mm. Pad-to-pad span across RX1_TAP_MID is
    #      then 1.04 mm, inside the lambda_g/20 = 1.37 mm lumped bound.
    R_T1: [49.882, 31.511, 15]     # r = 15.0 on theta 75 (antenna side)
    R_T2: [49.365, 33.443, 15]     # r = 13.0 on theta 75 (switch side)

  # SEEDS are starting points the legalizer may walk outward from.
  #
  # REVISED 2026-07-28 AT STAGE 4, and the revision is not cosmetic. Three
  # things changed and each has a reason a reader must not undo:
  #
  # 1. U_ESD MOVED FROM [54.0, 84.0] TO THE D+/D- ESCAPE, AND C_ESD IS NEW.
  #    Both stage-2 dossiers (USBLC6-2SC6 and TYPE-C-31-M-12A) independently
  #    recorded the SAME finding against this file: an `adjacency:` budget of
  #    2.0 mm from ST DocID11265 sec 2.2, against ~8 mm as seeded. The
  #    arithmetic is the part: 6 nH per 10 mm x 0.5 mm at dI/dt = 24 A/ns is
  #    +144 V PER LEG, so a 17 V clamp becomes 305 V and the port is protected
  #    only in the designer's belief. At 2 mm the adder is ~29 V/leg. See
  #    01_docs/decisions/0008-esd-array-vbus-leg-node.md, which also settles
  #    which node pin 5 sits on (VBUS_F) and adds the Figure-18 CBUS = C_ESD.
  #    NOTE: `adjacency:` is NOT graded by P-ADJ (which grades keep_short net
  #    SPANS only) - so this placement is held by the ADR and by CHECKLIST.md,
  #    not by a gate. Stated rather than assumed.
  #
  # 2. TWENTY-FOUR SEEDS ARE NEW because the parts are new to this file, not
  #    to the design: C_MCU5..C_MCU10 (DETAIL_DESIGN sec 5 corrected the RP2040
  #    decoupling count from four to TEN), C_VREG_IN/C_VREG_OUT and R_XTAL and
  #    R_USB1/R_USB2 and C_XTAL1/C_XTAL2 (the four mandatory RP2040 passive
  #    groups), C_ESD, C_FLASH, R_BOOT, R_CSPU, SW_RUN.
  #
  # 3. U_MCU IS ROTATED 180. The RP2040 dossier's DERIVED layout note: pins
  #    43-56 (QSPI + all four supply domains + the USB pair) and pins 15-28
  #    (XIN/XOUT/SWCLK/SWDIO/RUN + the select GPIOs) are OPPOSITE sides, and
  #    "the MCU's crystal side should point at the switch, not its QSPI side".
  #    At rotation 0 the QSPI side faces -y, i.e. straight at the nine-arm
  #    receive fan - and nets.yaml calls QSPI "the only CONTINUOUS in-band spur
  #    source" on this board. 180 turns the spur source away from the fan and
  #    sends the four select lines up the escape corridor toward U_SW.
  #
  # THE DIGITAL-STRIP SEEDS ARE INTENT AT CLUSTER RESOLUTION, not measured
  # geometry - the file's own banner. What stage 5 must MEASURE (the
  # keep_short budgets P-ADJ will grade, from the 02_parts layout: blocks):
  #    VBUS <= 8 mm | VBUS_F <= 12 mm | USB_CC1/USB_CC2 <= 5 mm
  #    USB_DP/USB_DM <= 20 mm | QSPI_SD* + QSPI_SCLK <= 12 mm
  #    QSPI_CSN <= 15 mm | XIN/XOUT <= 6 mm | SW_V4 <= 4 mm
  # and three budgets that will land in P-ADJ-UNREACHED rather than P-ADJ,
  # because they name nets this board does not carry: PE42482A-X's SW_LS (LS
  # is ON GND by ADR-0005, already recorded in nets.yaml), PE42482A-X's
  # SW_VDD (pin 8 is on 3V3 - there is no series element to make a second
  # node), and KH-SMA-KE-Z's RF_ANT_LAUNCH (a generic name, not a board net).
  # ABM8-272-T3's `keep_short: GND <= 3 mm` will FAIL as written: GND is a
  # four-layer pour with hundreds of pads. All four are 02_parts one-line
  # fixes, listed here so stage 5 does not rediscover them.
  seeds:
    # ---- the switch cell: bypass at pin 8, pull-downs at pins 9..12 --------
    C_SW1: [44.6, 49.4]            # part.yaml budgets SW_VDD <= 3 mm
    C_SW2: [47.4, 49.4]
    R_PD1: [43.4, 50.6]
    R_PD2: [45.0, 50.6]
    R_PD3: [46.6, 50.6]
    R_PD4: [48.2, 50.6]            # V4: part.yaml budgets SW_V4 <= 4 mm

    # ---- the MCU cell (rotation 180, see note 3 above) ---------------------
    U_MCU:   [46.0, 73.5, 180]
    # source terminations at the DRIVER end (ADR-0005), by pins 15-18 =
    # GPIO12..15 = SEL_V1..SEL_V4, which rotation 180 puts on the -y side
    R_S1: [49.0, 69.6]
    R_S2: [50.2, 69.6]
    R_S3: [51.4, 69.6]
    R_S4: [52.6, 69.6]
    # crystal cell at XIN/XOUT (pins 20/21), same -y side, inboard of the
    # select group. R_XTAL is IN the XOUT net and C_XTAL2 sits on the CRYSTAL
    # side of it (RP2040 HD guide sec 2.3, Figure 8, PDF p11).
    Y_XTAL:  [46.6, 68.4]
    R_XTAL:  [48.4, 69.2]
    C_XTAL1: [44.6, 67.4]
    C_XTAL2: [48.6, 67.4]
    # the ten 100 nF, one per RP2040 power pin (six IOVDD, two DVDD,
    # USB_VDD, ADC_AVDD) - distributed AROUND the package, which is what
    # Raspberry Pi's own routed reference does (Figure 6, PDF p9)
    C_MCU1:  [41.6, 71.0]
    C_MCU2:  [50.4, 71.0]
    C_MCU3:  [41.6, 76.0]
    C_MCU4:  [50.4, 76.0]
    C_MCU5:  [43.4, 69.6]
    C_MCU6:  [47.0, 78.4]
    C_MCU7:  [45.0, 78.4]          # DVDD pin 23 -> on DVDD_1V1
    C_MCU8:  [48.6, 78.4]          # DVDD pin 50 -> on DVDD_1V1
    C_MCU9:  [42.6, 78.4]          # USB_VDD pin 48
    C_MCU10: [40.4, 76.8]          # ADC_AVDD pin 43
    # the on-die 1.1 V regulator's two MANDATORY capacitors (RP2040 sec
    # 2.10.1, PDF p157) at pins 44 and 45, which rotation 180 puts at the
    # -x end of the +y side
    C_VREG_IN:  [41.4, 78.4]
    C_VREG_OUT: [40.2, 78.4]
    # USB series terminations (RP2040 Table 620) between pins 46/47 and U_ESD
    R_USB2: [43.6, 80.0]           # USB_DM
    R_USB1: [44.8, 80.0]           # USB_DP

    # ---- flash + boot straps (QSPI side, +x end of the +y row) ------------
    U_FLASH: [53.5, 76.5]
    C_FLASH: [53.5, 79.2]
    R_CSPU:  [53.5, 73.8]          # 10 k /CS pull-up, AT the flash (sec 9.3)
    R_BOOT:  [57.0, 76.5]          # 1 k QSPI_CSN -> BOOTSEL_N
    SW_BOOT: [60.5, 76.5]
    SW_RUN:  [64.5, 76.5]

    # ---- USB entry + protection, hugging J_USB (ADR-0008) -----------------
    J_USB:  [46.0, 87.0]
    # U_ESD straddles the D+/D- escape immediately behind the connector pad
    # row (which the authored footprint puts at y = 87 - 3.67 = 83.33). The
    # rotation intent: pins 1/2/3 (D+ in, GND, D- in) face the CONNECTOR and
    # pins 6/4 (D+ out, D- out) face the MCU, so the pair physically passes
    # THROUGH the clamp with a zero-length stub (ST Figure 7). Pins 1+6 and
    # 3+4 are the same node, so no ERC, DRC, netlist or parity check can tell
    # this dress from a stub - it is intent someone has to hold.
    U_ESD:  [46.2, 81.4, 90]
    R_CC1:  [43.4, 81.4]           # A5 pad lands at x = 44.75
    R_CC2:  [49.0, 81.4]           # B5 pad lands at x = 47.75
    C_ESD:  [46.2, 79.5]           # CBUS 100 nF AT pin 5 (ST Figure 18)
    F_IN:   [43.2, 79.5]           # pad 1 (VBUS) toward the connector
    D_TVS:  [40.6, 79.5]           # cathode = pad 1 -> VBUS_F
    C_BULK: [38.2, 79.5]
    FB_IN:  [36.0, 79.5]
    C_LDI:  [33.6, 79.5]           # regulator INPUT cap, on VBUS_LDO
    U_LDO:  [30.4, 80.4]
    C_LDO:  [30.4, 83.4]

    # ---- indicators (clear of the M3 keepout at [67.5, 84.5]) -------------
    LED_PWR: [58.0, 85.0]
    R_LED1:  [58.0, 82.5]
    LED_ST:  [61.5, 85.0]
    R_LED2:  [61.5, 82.5]

  legalize: {enable: true, clearance: 0.25, edge_margin: 1.0, hole_keepout: 2.6, ring_max: 40}

# ESCAPE CORRIDOR — the reserved lane off the ONE side of U_SW that carries no
# RF (pins 7..12: GND, VDD, V1..V4, escape budget 5, recorded in the part.yaml
# escape block). Expands to a named rule area denying footprints and pours
# while leaving tracks and vias allowed.
escape_corridors:
  - {ref: U_SW, side: S, depth_mm: 4.0}

design_rules:
  # jlc_4layer_advanced floors (ADR-0003 / fab_tiers.yaml). These are FLOORS —
  # RF50 runs at 0.36 mm because that is 50 ohm, not because of a DRC minimum.
  track_min_width: 0.09
  min_clearance: 0.09
  via_min_size: 0.25
  min_through_drill: 0.15
  via_min_annulus: 0.05
  hole_clearance: 0.20
  hole_to_hole: 0.25
  copper_edge_clearance: 0.3
  solder_mask_min_width: 0.0
  solder_mask_expansion: 0.0

zones:
  # L2 (In1.Cu) is the SOLID reference under every RF arm and under the USB
  # pair — no split, no slot, anywhere. L1/L4 are filled GND around the arms
  # and carry the via fences. The 3V3 pour on L3 (In2.Cu) is deliberately NOT
  # declared here yet: it belongs to the digital strip only, and a board-wide
  # 3V3 pour on L3 would sit under the RF fan. It is added as a REGION at
  # stage 5 once the strip is legalized; until then 3V3 is the PWR netclass at
  # 0.4 mm, which carries the 0.15 A envelope with enormous margin.
  - {net: GND, layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], priority: 0, min_thickness: 0.2, clearance: 0.25, connect: thermal}

asserts:
  # pad_net checks the GENERATOR runs after placement — the board-side twin of
  # 03_src/rules/electrical_invariants.yaml (which reads the NETLIST; canon M1,
  # two artifacts, two methods, one claim).
  pad_net:
    - {ref: U_SW, pad: 1,  net: GND}       # LS — a via at the pad, ADR-0005
    - {ref: U_SW, pad: 9,  net: SW_V1}     # MSB
    - {ref: U_SW, pad: 11, net: SW_V3}     # LSB
    - {ref: U_SW, pad: 12, net: SW_V4}     # the mute line
    - {ref: U_SW, pad: 19, net: RX1_TAP}   # RF8 = the reference, ADR-0006
    - {ref: U_SW, pad: 22, net: RX2_OUT}   # RFC
    - {ref: U_SW, pad: 24, net: ANT1}      # RF1 = the delta reference
    - {ref: U_SW, pad: 25, net: GND}       # exposed pad — the RF ground return

silk:
  min_text_height: 0.6
  refdes: {size: 0.6, min_size: 0.45, fab_copy: true, clearance: 0.16, priority_prefixes: "UJQ"}
  captions:
    # THE PORT CONTRACT IS A SILKSCREEN OBLIGATION (ADR-0004), not
    # documentation: this board carries no ESD device and no DC block on any
    # of its ten RF ports, and V_RFDC(max) on the switch is 0 V.
    - ["RX ONLY - PASSIVE ANTENNAS - 0 VDC - NO BIAS TEE - NO TRANSMIT", 46.0, 64.0, 0.7]
    - ["pluto-rx2-8way  8-WAY AoA SELECTOR  70 MHz - 6 GHz", 46.0, 86.0, 0.7]
    - ["ANT8 = RX1 ANTENNA (-19.8 dB TAP)", 56.0, 24.0, 0.55]
    - ["RX1 -> PLUTO RX1", 62.0, 35.5, 0.55]
    - ["RX2 -> PLUTO RX2", 38.0, 23.5, 0.55]
