sourcing:
  lcsc: C5350143
  alternates:
    - {lcsc: C9900173620, mpn: RP2040-Zero-NoLogo}
      # NOT AN EQUIVALENT PART AND NOT A SECOND SUPPLIER — it is the JLCPCB
      # Assembly consigned-sourcing placeholder for the same module with the
      # Waveshare logo omitted, package string LCC-23(18x23.5), and it is the
      # only place that string is published. MAPPING FORM, NOT BARE: a bare code
      # declares no MPN, F-MPN would fail the row by name, and the parent mpn:
      # is NOT its mpn (it is the NoLogo variant). Recorded so the code stays
      # resolvable if it ever reaches a BOM; see the `not_on_assembly_bom`
      # assert for why it should not.
  note: "USER-SUPPLIED, NOT CONSIGNED. Buy from Waveshare direct or a
    distributor, without pre-soldered headers. The builder fits it after the
    carrier is assembled; it is off the CPL and has no paste apertures."
asserts:
  - assert: value
    equals: RP2040-Zero
    why: "the BOM Comment must NAME the module, because the outline is the only
      thing a footprint, a netlist or a DRC run can see, and Waveshare's whole
      '-Zero' line shares it. VERIFIED: the RP2350-Zero is 23.5 x 18 mm,
      castellated, 29 GPIO with 20 on the headers — the same board, a different
      die (waveshare.com/wiki/RP2350-Zero, and its product page). It would fit
      this land, power up and enumerate, while differing in GPIO mapping and
      carrying the RP2350-E9 pad-pull-down erratum that our RP2040 dossier
      already records as a do-not-substitute. The RP2040-Zero-NoLogo
      (C9900173620) is the same module with the silk logo removed, and the rest
      of the '-Zero' family (ESP32-S3-Zero and siblings) is marketed in the same
      shape — NOT dimension-verified here, and named as a caution rather than a
      measurement. A sibling in the same land is not a substitution risk that
      assembly catches; it is one that boots."
  - assert: not_on_assembly_bom
    why: "three independent reasons, any one sufficient. (1) MECHANICAL: the
      module cannot sit flat on the carrier — 1.000 mm of bottom-side components
      (MEASURED, vendor STEP) — so there is no reflowable joint to place and no
      pick-and-place nozzle target. (2) THERMAL: it is a populated PCBA with no
      published MSL and no second-reflow profile, and its own bottom-side parts
      would face DOWN through the oven. (3) SOURCING, live query 2026-07-30:
      C9900173620 is the C99* consigned placeholder (stock 0 by construction,
      MOQ 444, and now flagged 'This product is no longer manufactured') and
      C5350143 is a Development-Boards-&-Kits catalogue line JLC marks 'SMT
      Assembly (Fixture Required)'. Hand-solder it, and keep the code off the
      assembly BOM and off the CPL."

# ============================================================================
# BOARD-LEVEL NOTES — pluto-rx2-8way-v4. Everything above this line is the
# independent module dossier (STEP-derived, sha256'd artifacts); everything
# below is what THIS board does with it.
# ============================================================================
notes:
  - "THE PAD MAP WAS CROSS-CHECKED TWICE, INDEPENDENTLY, AND THE TWO READS
     DISAGREED — canon M1, and the disagreement is the finding. The schematic
     gate closed on a numbering this project INVENTED (a counter-clockwise
     perimeter walk from the top-left, 1=5V .. 23=GP0) on the stated premise
     that `Waveshare labels the pads by FUNCTION and does not number them`.
     THAT PREMISE IS FALSE. Waveshare numbers them twice: the schematic's
     `Pin Out` sheet draws the castellations as header P1 `Header 23` with pins
     1..23, and the wiki FAQ calls VSYS `Pin23` and 3V3 `Pin 21`. The vendor
     numbering is the EXACT REVERSE of the invented one — ours_n = 24 -
     vendor_n on all 23 pads — which is the worst possible collision, because
     every number is valid in both systems and means a different pad. The
     invented numbering was WITHDRAWN 2026-07-30 and the vendor's adopted.
     The PHYSICAL map (function <-> position) survived both reads unchanged and
     is confirmed by four artifacts: silkscreen in the dimension drawing, the
     schematic P1 order, the vendor pinout figure, and the STEP."
  - "DERIVED: this module is a 3D OBSTRUCTION ON BOTH FACES. An earlier
     revision of this file said it `stands on castellations with components on
     its top face` — that is WRONG about the face that matters. 23 components
     sit on the CARRIER-FACING face (crystal 1.000 mm proud, RP2040 QFN-56
     0.850, RT9013 0.700, twenty 0201s 0.300, all MEASURED off the vendor
     STEP), which is why this part is hand-soldered on a 1.1 mm standoff and
     not reflowed. The two carrier keepouts it imposes are drawn into the
     footprint (Dwgs.User = height, User.Comments = copper) and are placed
     obligations, not budgets: nothing in the pipeline grades them."
  - "DERIVED: the 15 unconnected GPIO castellations and the 10 underside pads
     are SOLDERED DOWN or FACING DOWN and cannot be probed. BOOT and RESET are
     the ONLY hardware route into the bootloader — verified against the
     schematic, neither they nor SWD reach any castellation — so a revision
     wanting debug access must bring pads out at layout time."
