    # ONLY ONE BUDGET IS DECLARED, AND THE NET NAME IS THE RISK. `net:` must
    # name a net THAT EXISTS ON THE CARRIER carrying >= 2 pads, one of them
    # this module's — a name that resolves to nothing is P-ADJ-UNREACHED and
    # E-NETREF K7, which is where 64 of the fleet's 181 declared budgets landed
    # when measured on 2026-07-29. `3V3` is used because it is BOTH this
    # module's own silkscreen pad name AND the fleet's canonical rail name.
    # RUN `net_reference_audit.py` THE MOMENT THIS DOSSIER LANDS ON A BOARD,
    # BEFORE COMMITTING — if the carrier calls its rail anything else, re-point
    # this entry rather than deleting it.
    # RE-POINTED 2026-07-30 ON LANDING, exactly as this block instructs. On THIS
    # carrier `3V3` is the FILTERED rail downstream of FB_3V3; the module's own
    # pad-21 node is `3V3_MOD`, and that is the node this budget is about. The
    # dossier's 5 mm is kept over the 10 mm this project previously declared —
    # the tighter of two budgets on one node binds, which is intended.
    - {net: 3V3_MOD, max_span_mm: 5, anchor_pins: ["21"], why: "the module puts a
       single 1 uF (C5) on the RT9013's output and nothing else, AND NEITHER IS
       AT THE PAD. MEASURED off the STEP, in the module's own frame: pad 21 sits
       at (1.38, 16.83) — left edge, third from the top — while U1 (RT9013)
       is centred at (8.97, 20.47) and C5 at (7.68, 15.39), i.e. 8.4 mm and
       6.5 mm away, on the far side of the board and through the module's
       internal routing. So a carrier load on 3V3 sees that whole run as its
       supply impedance and there is no high-frequency bypass anywhere near the
       pad it draws from. 5 mm is a PLACEMENT-INTENT budget for the carrier's
       own cap, not an SI limit. ANCHORED AT PAD 21 deliberately: 3V3 is a
       board-wide poured rail, and without the anchor P-ADJ grades the rail's
       diameter instead of this pin's decoupling — the exact metric error
       retired on 2026-07-29"}
  notes:
    - "THE 1.0 mm STANDOFF IS THE GOVERNING PLACEMENT FACT AND NO SPAN BUDGET
       CAN EXPRESS IT. THE CARRIER OWES TWO DIFFERENT KEEPOUTS UNDER THIS
       MODULE, and they are different shapes for different reasons.
       (1) HEIGHT KEEPOUT, X 4.0..14.0 by Y 2.5..22.5 in the module's own frame:
       MEASURED off the STEP, the twenty-three bottom-side components (X1 the
       12 MHz crystal, the RP2040 QFN-56, the RT9013, fifteen 0201 capacitors
       and five 0201 resistors) span X 4.147..13.921, Y 3.320..21.964 and
       protrude 1.000 / 0.850 / 0.700 / 0.300 mm respectively. Nothing with
       height may live under that rectangle on the carrier's top layer —
       components, tall soldermask ridges, silk build-up, vias with proud
       plating. If a REFLOWABLE joint is wanted this becomes a CUTOUT of the
       same rectangle.
       (2) COPPER KEEPOUT, X 2.4..3.6 by Y 4.8..17.0: the ten underside pads.
       They have no height (0.010 mm) so the height keepout does not cover them
       and they sit OUTSIDE it — but they are bare copper carrying GP17..GP25
       and GND, facing the carrier at a ~1.1 mm standoff, and a solder ball or a
       flexed board shorts nine live GPIO to whatever is beneath. Keep carrier
       copper and vias out of that strip, or mask it.
       BOTH are board-outline/keepout obligations, graded by nothing today, and
       they are stated here rather than dressed up as keep_short budgets."
    - "THE CARRIER OWNS THE INPUT BULK. The module carries 3 x 2.2 uF on VSYS
       (C6/C1/C2) and 1 uF plus a 100 nF bypass-pin cap on 3V3 (C5/C4). That is
       all. If the carrier feeds 5 V into pad 23, it supplies the input bulk and
       the reverse/OR-ing protection the module does not have. Written as prose
       and not as a keep_short entry BECAUSE THE NET NAME IS UNKNOWN — the fleet
       uses a `5V_*` family and guessing a member of it is how ghost nets get
       written. Re-point it here as `{net: <the board's 5V rail>,
       max_span_mm: 6, anchor_pins: [\"23\"]}` once the board exists."
    - "DERIVED (mine, not the vendor's): the natural carrier orientation is
       USB-C edge AT the carrier's own board edge. That single choice discharges
       three obligations at once — the plug clears the carrier (see the USB
       gotcha), the receptacle's 1.21 mm overhang lands over air rather than
       over copper, and the two buttons at Y = 7.60 end up on the far side from
       the connector where a bezel or lid can reach them."
    - "DERIVED: pad 22 (GND) is the module's ONLY ground castellation, and it
       sits at the top of the LEFT edge, diagonally opposite most of the signal
       pads. Every return current from the 20 GPIO shares that one pad. For an
       RF carrier that is a real constraint: put the ground pad's land on a
       direct via drop to the plane, and expect the module's ground reference to
       be worse than the carrier's everywhere else. The underside GND pad (U10)
       is on the mounting face and can only help if the carrier is cut away."
    - "OWED: no physical module has been measured. Three numbers in this dossier
       would be upgraded from ESTIMATED to MEASURED by ten minutes with calipers
       and a module on the bench — the 1.38 mm castellation inset (currently a
       CITED number with an inferred datum), the castellation land WIDTH
       (currently unrecoverable), and the USB-C plug overmould height (currently
       a class estimate). Canon M-IMPORT: the object beats its drawing."
