# RP2040-Zero part dossier — researched 2026-07-30 from vendor artifacts.
#
# SOURCE ARTIFACTS (same directory):
#   RP2040_Zero.pdf            vendor schematic, 1 page   sha256 bab8e6fe…1362e
#   RP2040-Zero-details-size.jpg  dimension drawing        sha256 42245fe5…cc5b9
#   RP2040-Zero-details-7.jpg     vendor pinout figure     sha256 b2fc9115…5f921a
#   stp/RP2040_Zero.stp           Creo STEP assembly       sha256 ce8a34fc…c14764
#   RP2040-Zero-FAQ02.png         underside-pad screenshot
#   LCSC_C5350143.pdf             NOT a datasheet — a print of the wiki page
#
# THE PROJECT COPY MUST CARRY the schematic, the dimension drawing AND the
# pinout figure: the wiki is the only home of the latter two and neither is
# inside the PDF.
#
# ============================================================================
# READ THIS FIRST — five facts that change the carrier, not just the dossier
# ============================================================================
#
# 1. THE MODULE IS NOT FLAT-BACKED. 23 components sit on the CARRIER-FACING
#    face: the 12 MHz crystal 1.000 mm proud, the RP2040 QFN-56 0.850, the
#    RT9013 0.700, twenty 0201s 0.300 (all MEASURED off the vendor STEP).
#    A castellated pad and a 1.0 mm standoff are not compatible. Waveshare's
#    "solder directly to carrier boards" is marketing that is wrong.
#
# 2. PAD NUMBERING IS CLOCKWISE FROM TOP-RIGHT — the mirror of every IC.
#    Get it wrong and the board is a perfect mirror image that assembles,
#    powers up, and reads every GPIO on the wrong pad.
#
# 3. THE SILKSCREEN PRINTS GPIO NUMBERS, NOT PAD NUMBERS, and they diverge at
#    pad 17. Pads 1-16 carry GP0-GP15, so the two systems agree for sixteen
#    consecutive pads and then stop.
#
# 4. NO VENDOR LAND PATTERN EXISTS. The footprint must be AUTHORED.
#
# 5. THE WS2812 IS HARD-WIRED TO 3V3 WITH NO POWER-ENABLE, has a free-running
#    internal oscillator, and sits DIRECTLY OVER the RP2040 with 1.091 mm of
#    laminate between them. On a receiver board that is the headline risk.
# ============================================================================

mpn: RP2040-Zero
manufacturer: Waveshare Electronics
type: rp2040_module_with_onboard_ldo_3v3
# ^ THE `type:` STRING IS DOING TWO JOBS AND BOTH ARE INTENDED. The dossier
#   arrives with `type: mcu_module_rp2040`, which is the more honest DESCRIPTION
#   and is recorded here as such — but this board's `type:` field is also read by
#   `power_topology.py`'s _LINEAR_RE, which classifies the 3V3 rail's converter
#   by matching `ldo` in this string. The rail's real regulator is an RT9013-33
#   INSIDE this module: we never order it, it has no BOM line and no LCSC code,
#   so giving it its own dossier would invent a sourcing relationship that does
#   not exist. The alternative — declaring no rails and collecting a clean
#   E-TOPO N-A — is the exact failure power_topology.py's own docstring names on
#   three boards in this fleet. Argued in 01_docs/journal/03_schematic and
#   learnings L5. `dropout_mv` and `pdiss_max_mw` below are the dossier's, and
#   03_src/rules/power_tree.yaml carries the PER-RAIL overrides.
value: RP2040-Zero
status: active
function: >
  The board's entire MCU subsystem in one part: RP2040 + 2 MB QSPI flash +
  12 MHz crystal + 3V3 LDO + USB-C + BOOT/RESET, on a 23-pad castellated
  carrier. It exists on this board to run a free-running PIO 3-bit sequencer
  that walks four select lines into a PE42482A-X SP8T. Five of its 23 pads are
  used. HAND-SOLDERED, not placed — see 03_src/rules/assembly.yaml.
# `type:` DELIBERATELY DOES NOT CONTAIN "linear". The module EMBEDS an RT9013-33
# LDO and its `3V3` pad IS that LDO's output, so it is tempting to name this a
# LINEAR converter and hang a 3V3 rail off it in 03_src/rules/power_tree.yaml.
# DO NOT, unless you also intend E-TOPO to grade it: `normalize_type()` keys on
# the substrings buck / boost / ldo|linear|low-dropout, and a rail whose
# converter classifies as NOTHING is a FAIL, not a skip. `dropout_mv:` and
# `pdiss_max_mw:` below are populated with the RT9013's own numbers so the
# choice is available and costed rather than blocked — but the primary class of
# this part is an MCU MODULE, and the 3V3 pad is better modelled as a SOURCE
# with a stated budget (see limits.i_3v3_headroom_* and the arithmetic there).
dropout_mv: 400            # RT9013 datasheet DS9013-10, Electrical
                           # Characteristics: V_DROP MAX at IOUT = 500 mA,
                           # 2.7 V <= VIN <= 5.5 V (typ 250 mV). The
                           # conservative reading at the part's RATED current.
                           # ONLY LOAD-BEARING if a rail names this module as a
                           # LINEAR converter — see the `type:` note.
pdiss_max_mw: 500          # DERIVED, not quoted: RT9013 SOT-23-5 theta_JA
                           # 250 C/W and TJ(max) 150 C (DS9013-10 Absolute
                           # Maximum Ratings) => (150-25)/250 = 0.500 W AT
                           # TA = 25 C ON THE JEDEC TEST BOARD. THE DATUM IS
                           # STATED BECAUSE IT MOVES: at TA = 70 C the same
                           # arithmetic gives 320 mW, and the RP2040-Zero's own
                           # 18 x 23.5 mm laminate is nothing like a JEDEC
                           # thermal board, so treat 500 mW as an upper bound
                           # (canon M-IMPORT: a rating whose datum is unstated
                           # is ESTIMATED, not CITED).
datasheet:
  doc_id: RP2040_Zero
  revision: "20211012"     # OWED-BY-THE-VENDOR: the schematic sheet carries NO
                           # title block, NO document number and NO revision
                           # letter (title block region rendered at 300 dpi and
                           # read, 2026-07-30 — it is empty). "20211012" is the
                           # PDF's own CreationDate (Altium Designer /
                           # llPDFLib, 2021-10-12), which is the only version
                           # token the document contains. PIN THE sha256; the
                           # revision string cannot do that job here.
  url: https://files.waveshare.com/upload/4/4c/RP2040_Zero.pdf
  local: RP2040_Zero.pdf
  sha256: bab8e6fecb8b1da565392a7510eaa8921529c4121f43a0505f708a06f1c1362e
  fetched: 2026-07-30
  pages: 1
  product_page: https://www.waveshare.com/rp2040-zero.htm
  provenance: "THERE IS NO DATASHEET. Waveshare publishes, for this part, EXACTLY
    four artifacts and this dossier fetched all four: (1) the one-page schematic
    above; (2) a dimensioned photo-overlay drawing,
    https://www.waveshare.com/w/upload/f/f4/900px-RP2040-Zero-details-size.jpg
    (sha256 42245fe55e0cb9a97fb0538029322cc03d31b4a1ef672b37b89cd93e6b3cc5b9);
    (3) a pinout figure,
    https://www.waveshare.com/w/upload/1/1f/900px-RP2040-Zero-details-7.jpg
    (sha256 b2fc91157b61b92ba29fad8cbd0307baf1a924b93e906a3780642691a85f921a);
    (4) a Creo STEP assembly,
    https://files.waveshare.com/upload/f/f7/RP2040_Zero_stp.zip
    (sha256 b3f427a30da1c4a2d17fb28470c503189ad5d2c071b1c08b8d66b1d7c1031548,
    inner RP2040_Zero.stp
    ce8a34fcf9417c91c86141acea7cd3e6a2145f3146e7f9e426cfe5c7e3c14764,
    FILE_NAME 'RP2040_ZERO_ASM' 2022-01-08). THE PROJECT COPY MUST CARRY (1),
    (2) AND (3): the wiki is the only home of the mechanical drawing and the
    pinout, and neither is inside the PDF. The LCSC 'datasheet' for C5350143
    (wmsc.lcsc.com/.../2303281130_Waveshare-RP2040-Zero_C5350143.pdf) is a
    browser print of the Chinese wiki page and contains no engineering data —
    do NOT vendor it as a datasheet."
package: >-
  LCC-23 castellated module, 18.00 x 23.50 mm outline, R1.00 corners, 23
  half-hole ("stamp hole") pads on 2.54 mm pitch across three edges (9 left,
  9 right, 5 bottom; the top edge carries the USB-C and no pads), plus a
  1.27 mm-pitch row of 10 SMD pads on the UNDERSIDE. PCB 1.091 mm thick
  (MEASURED off the vendor STEP). NOT A FLAT-BACKED MODULE — see gotchas.
footprint: pluto_rx2_8way_v4:RP2040_Zero_LCC23_18x23.5
  # RESOLVED 2026-07-30 -> 03_src/lib/pluto_rx2_8way_v4.pretty/. The dossier
  # shipped this DELIBERATELY UNRESOLVABLE, and the two facts it encoded still
  # hold; they are kept below because discharging an obligation does not delete
  # the reason it existed. The footprint was AUTHORED from `land_pattern:` on
  # this date; the name keeps the underscore form the rest of the tree uses.
  # ORIGINAL NOTE: Two facts are encoded in that:
  #   1. WAVESHARE PUBLISHES NO LAND PATTERN (see layout.source), so this
  #      footprint MUST BE AUTHORED. There is nothing to adopt, and the KiCad
  #      stock library has no LCC-23 18x23.5. `land_pattern:` below is the
  #      derivation to draw it from.
  #   2. The library prefix is the BOARD's, and this dossier does not know the
  #      board. Edit it when you place the dossier; an FPID that fails to
  #      resolve fails LOUDLY, which is the correct failure for an obligation
  #      that has not been discharged (a plausible-looking wrong FPID is not).
escape:                      # emitted by escape_check.py --style module
  style: module              # --pitch 2.54 --escapes-worst-side 9 --pins 23,
  pitch: 2.54                # run 2026-07-30: all five tiers ok.
  escapes_worst_side: 9      # the RIGHT edge, GP0..GP8 — nine signal nets, no
                             # GND among them. The LEFT edge carries nine pads
                             # but only eight nets leave it (GND is excluded).
  tier_required: jlc_2layer_default
  checked: escape_check 2026-07-30
pins:                        # VENDOR-NUMBERED. The schematic's "Pin Out" block
  1:  GP0                    # draws the castellations as connector P1,
  2:  GP1                    # "Header 23", with pins numbered 1..23 — these are
  3:  GP2                    # WAVESHARE'S OWN pad numbers, not ours. The
  4:  GP3                    # SILKSCREEN, by contrast, prints GPIO numbers
  5:  GP4                    # (0..29) and the rail names, NOT pad numbers, so
  6:  GP5                    # the two numbering systems coexist on the same
  7:  GP6                    # part and DO NOT AGREE: pad 17 is GP26.
  8:  GP7
  9:  GP8
  10: GP9
  11: GP10
  12: GP11
  13: GP12
  14: GP13
  15: GP14
  16: GP15
  17: GP26                   # ADC0
  18: GP27                   # ADC1
  19: GP28                   # ADC2
  20: GP29                   # ADC3
  21: {name: 3V3,  note: "OUTPUT of the on-board RT9013-33 (U1 pin 5). Also a
        legal INPUT — see gotchas 'BACK-DRIVING 3V3'. Never both."}
  22: {name: GND,  tie: GND}
  23: {name: 5V,   note: "net VSYS on the schematic. USB-C VBUS (contacts A4/B9
        and A9/B4) reaches this pad with NO diode, NO fuse and NO series
        element of any kind — it IS VBUS. See gotchas 'THE 5V PAD IS VBUS'."}
  # ---- NOT CASTELLATED. The remaining nine GPIO leave on a 1.27 mm-pitch row
  # of ten SMD pads on the module's UNDERSIDE (schematic P2 "Header 5" =
  # GP17..GP21, P3 "Header 5" = GP22..GP25 + GND). They are on the face that
  # meets the carrier, so on a soldered-down module they are unusable AND they
  # are a SHORTING HAZARD against carrier copper. Numbered here as U1..U10 —
  # OUR numbering, the vendor gives none for the row as a whole.
  #   U1: GP17   U2: GP18   U3: GP19   U4: GP20   U5: GP21
  #   U6: GP22   U7: GP23   U8: GP24   U9: GP25   U10: GND
  # The tenth castellated GPIO of the 29 is GP16, which is NOT brought out at
  # all: it drives the on-board WS2812 and nothing else.
land_pattern:
  status: "AUTHORED-BY-US. Waveshare publishes NO recommended land pattern, NO
    layout section and NO footprint library — this is the KH-SMA-KE-Z class
    (proven-parts.yaml): the absence is RECORDED, not papered over. Every number
    below is either a vendor DIMENSION or OUR derivation, and each is graded."
  outline_mm: {x: 18.00, y: 23.50, corner_radius: 1.00}
    # CITED (dimension drawing, the three labelled envelope dimensions).
    # CORROBORATED, MEASURED: the STEP's BOARD solid bounds
    # X -0.059..17.959 (18.018) and Y 0.092..23.609 (23.517), i.e. +0.02 mm on
    # both axes — inside any land-pattern tolerance. Two independent artifacts.
  pitch_mm: 2.54
    # CITED (drawing) and MEASURED: seven left-column pad centres read off the
    # drawing at 13.722 px/mm give a mean spacing of 2.56 mm (spread 2.40-2.70,
    # +/-1 px = +/-0.07 mm), consistent with 2.54.
  side_first_pad_from_top_edge_mm: 1.59
    # CITED (drawing). THIS ONE IS SELF-PROVING and that is why it is trusted
    # over everything else on the drawing: 1.59 + 8 x 2.54 = 21.91, and
    # 23.50 - 21.91 = 1.59. The nine side pads are exactly symmetric about the
    # module's mid-height. A wrong datum would not close like that.
  bottom_first_pad_from_side_edge_mm: 3.92
    # CITED (drawing). Same symmetry proof: 3.92 + 4 x 2.54 = 14.08 and
    # 18.00 - 14.08 = 3.92. The middle bottom pad (GP11) sits at x = 9.000,
    # the exact centreline.
  hole_centre_inset_from_edge_mm: 1.38
    # THE NUMBER IS CITED (drawing); THE DATUM IS OURS, AND THE ALTERNATIVE WAS
    # TESTED AND REJECTED. Waveshare labels "1.38" between the module's left
    # edge and an unnamed feature. Photogrammetry on the same drawing at
    # 13.722 px/mm: the half-hole's white barrel centre sits 1.2 +/- 0.1 mm
    # inboard of the edge (matches), while the gold land's INNER END sits
    # 1.95 +/- 0.1 mm inboard (does not). So 1.38 mm is the CASTELLATION HOLE
    # CENTRE, inset from the module outline. Grade: ESTIMATED-datum on a CITED
    # number. If a physical module is ever on the bench, MEASURE it: this is
    # the one drawing number the whole footprint hangs on.
  vendor_land_mm: {length: 1.95, width: "OWED"}
    # ESTIMATED, +/-0.10 mm: gold-land extent measured along seven left-column
    # pads on the drawing. WIDTH IS NOT RECOVERABLE from this artifact — the
    # render's specular highlight on the plated barrel makes the along-edge
    # extent read anywhere from 0.51 to 1.38 mm, which is not a measurement.
    # Do not put a number here that came from that read.
  ours:
    pad: {shape: rect, length_mm: 2.60, width_mm: 1.20}
    straddle: {outboard_mm: 1.00, inboard_mm: 1.60}
    pitch_mm: 2.54
    mask: "IPC default expansion; no mask web between adjacent pads is needed at
      2.54 mm pitch (1.34 mm gap)"
    paste: "100% of the INBOARD 1.60 mm only. Paste under the outboard tail
      pulls the module edgewise; the fillet up the barrel is what makes the
      joint, and it is fed from the inboard reservoir."
    why: >-
      DERIVED, and each term has a reason. (a) INBOARD 1.60 mm: the copper must
      reach past the half-hole centre at 1.38 mm so the barrel is wetted along
      its whole exposed height, with 0.22 mm of margin for module-to-pad
      placement error. (b) OUTBOARD 1.00 mm: the ONLY inspectable feature of a
      castellated joint is the fillet OUTSIDE the module outline — with no tail,
      a joint that never wetted looks identical to one that did, from every
      angle. 1.00 mm is a compromise between inspectability and the 2.54 mm
      pitch's tolerance for a solder bridge along the edge. (c) WIDTH 1.20 mm:
      wider than the ~1.0-1.1 mm barrel so the pad is not a knife edge under
      the hole, and it leaves 1.34 mm of gap at 2.54 mm pitch, which is four
      times any JLC minimum and is what keeps hand-soldering forgiving.
      (d) RECTANGULAR, not oblong/oval: the fillet's shape is set by the barrel,
      not by the pad end, and a rectangle is what every reviewer can measure.
      NONE OF THIS IS A VENDOR RECOMMENDATION. It is engineering, it is written
      down so it can be argued with, and it MUST be paired with the standoff
      problem in gotchas — the pad geometry is the easy half.
  underside_row:
    count: 10
    pitch_mm: 1.270
    pad_mm: [1.01, 0.61]
    x_centre_mm: 2.99
    y_centres_mm: [5.181, 6.451, 7.721, 8.991, 10.261, 11.531, 12.801, 14.071,
                   15.341, 16.611]
    order: "lowest Y first: GP17, GP18, GP19, GP20, GP21, GP22, GP23, GP24,
      GP25, GND — i.e. GND is the pad nearest the USB-C end"
    # MEASURED, not estimated. The vendor STEP models these ten pads explicitly
    # (FREE-MODELS_ASM/618705424_ASM/EXTRUDED-374538 x10, each 1.01 x 0.61 mm,
    # z -1.101..-1.091, i.e. 0.010 mm of copper on the board's bottom face) and
    # their centre-to-centre spacing is 1.270 mm on every one of the nine steps.
    # THEY RUN AS A COLUMN UP THE LEFT SIDE IN TOP VIEW, X centre ~2.99, which
    # is why the vendor's bottom-view pinout figure shows them on the right.
    # This SUPERSEDES the reading of Waveshare's FAQ figure
    # (https://www.waveshare.com/w/upload/6/61/RP2040-Zero-FAQ02.png), an
    # unlabelled CAD screenshot answering "What is the spacing on the 10 pads
    # underneath?" with four bare numbers — 3.01 / 6.99 / 1.27 / 5.09. Its 1.27
    # AGREES with the STEP, which is the useful part: two independent artifacts,
    # one of them machine-readable. The other three remain unattributable
    # because the screenshot crops off its own origin, and they are not needed.
    # NET ASSIGNMENT is from the vendor pinout figure's bottom view read against
    # this geometry (bottom view is mirrored in X, and its USB-C is still up),
    # cross-checked against the schematic's P2/P3 "Header 5" blocks.
mechanical:                  # ALL MEASURED off the vendor STEP assembly by
                             # resolving the AP203 placement chain and taking
                             # VERTEX_POINT bounds only (control points of
                             # conics lie off the solid and inflate a naive
                             # bbox by >2x — the first pass did exactly that).
                             # Frame: z = 0 is the PCB TOP face; +Y is toward
                             # the USB-C; origin at the bottom-left corner in
                             # top view. Script kept out of tree; rerunnable
                             # from RP2040_Zero.stp.
  pcb_thickness_mm: 1.091
  top_side_max_height_mm: 3.250          # the USB-C shell
  bottom_side_max_protrusion_mm: 1.000   # X1, the 12 MHz crystal
  total_thickness_mm: 5.341              # 1.000 + 1.091 + 3.250
  usb_c:
    shell_x_mm: [4.150, 13.730]          # 9.580 wide incl. the board-lock legs
    shell_body_x_mm: [4.770, 13.110]     # 8.340 wide, the plain shell
    centred: "yes — 4.209 mm of board to the left of the shell and 4.229 mm to
      the right, i.e. centred to within 0.02 mm on the 18.00 mm width"
    z_mm: [-0.910, 3.250]                # the -0.910 is the THROUGH-HOLE shell
                                         # posts inside the 1.091 mm laminate;
                                         # the connector is top-mount SMD with
                                         # THT shell anchors, not mid-mount
    mating_face_y_mm: 24.816             # THE MODULE OUTLINE ENDS AT 23.50.
                                         # The receptacle OVERHANGS the top edge
                                         # by 1.21 mm (1.32 against nominal).
    cavity_centreline_above_pcb_top_mm: 1.17   # (2.950 + -0.610) / 2
    # The drawing's own "4.67" is the shell-to-right-edge setback; it disagrees
    # with the STEP's 4.21-4.23 mm by ~0.25 mm. WHERE THE GRADES DISAGREE, THE
    # MACHINE-READABLE SOURCE WINS (canon M-IMPORT): the drawing is a
    # photo-overlay whose photo has visible perspective, the STEP is CAD. The
    # drawing's number is recorded here so nobody re-derives the conflict.
  buttons:                               # both TOP side, both 3.00 x 4.65 mm,
    boot:  {centre_mm: [4.45, 7.60], height_mm: 2.500}   # 2.500 mm proud
    reset: {centre_mm: [13.45, 7.60], height_mm: 2.500}
    part: "TS-1185EC-A-E-A (the STEP's own component name)"
  ws2812:  {centre_mm: [8.95, 8.13], body_mm: [1.50, 1.80], height_mm: 1.000}
  rp2040:  {side: bottom, extent_mm: [[5.430, 12.470], [7.992, 15.032]], protrusion_mm: 0.850}
  crystal: {side: bottom, extent_mm: [[6.975, 10.925], [3.320, 6.420]], protrusion_mm: 1.000}
  rt9013:  {side: bottom, extent_mm: [[8.256, 9.680], [18.980, 21.964]], protrusion_mm: 0.700}
  flash:   {side: top, extent_mm: [[7.432, 10.452], [10.379, 12.379]], height_mm: 0.600}
limits:
  vsys_in: "5 V nominal via the 5V pad (= USB VBUS). ABS-MAX IS THE RT9013's
    6 V SUPPLY INPUT RATING (DS9013-10 Absolute Maximum Ratings) — there is no
    other protection in the path, so 6 V is the module's input abs-max and there
    is no margin above USB VBUS's own 5.25 V tolerance"
  vsys_min: "RT9013 operates from 2.2 V, but 3.3 V out needs 3.3 + dropout;
    at a 50 mA module load the dropout is far below the 250 mV/500 mA figure,
    so ~3.5 V is the practical floor for a regulated 3V3"
  v_3v3_out: "3.3 V +/-2% (RT9013 output voltage accuracy, DS9013-10)"
  i_3v3_rated_ma: 500        # RT9013 headline rating, DS9013-10 p1
  i_3v3_current_limit_a: "0.5 min / 0.6 typ / 0.85 max at 2.7 V <= VIN <= 5.5 V"
  i_3v3_thermal_ceiling_ma: >-
    294 at TA = 25 C, 188 at TA = 70 C — DERIVED, and it is the number that
    actually binds. At VIN = 5.0 V the RT9013 drops 1.7 V, so the 500 mW /
    320 mW package budgets (see pdiss_max_mw) buy 294 mA / 188 mA, not 500 mA.
    The 500 mA headline is unreachable on this module from USB.
  i_module_own_typ_ma: >-
    ~35-45 with the RGB LED dark, ~110 with it at full white. DERIVED
    COMPOSITION, each term cited: RP2040 DVDD ~28 mA at 125 MHz (RP2040
    datasheet Figure 172, PDF p624, typical device, room temperature, DVDD
    1.1 V, both cores running FFT continuously — a near-worst-case CPU load,
    read off the graph at 125 MHz between its 100 MHz and 150 MHz points, so
    +/-1 mA) and DVDD comes from the RP2040's own core regulator, which
    Figure 20's application circuit shows with NO inductor and which is
    specified 1.8-3.3 V in / 0.80-1.30 V out at up to 100 mA (sec 2.10,
    p155) — a LINEAR regulator, so 28 mA of DVDD is 28 mA off 3V3, one for one;
    IOVDD 1.2 mA typ idle / 24.8 mA typ under heavy IO (Table 637, p623);
    USB_VDD 1.4 mA typ enumerated (Table 637); flash a few mA in XIP;
    WS2812 ~1 mA quiescent and ~60 mA at full white; RT9013 Iq 25 uA typ /
    50 uA max. THE MODULE PUBLISHES NO CURRENT FIGURE OF ITS OWN — the wiki's
    only number is a bare "The power consumption is 2mA" in a sleep-current FAQ
    answer, with no conditions, and it is not usable.
  i_3v3_headroom_for_external_load_ma: >-
    ~145 at TA = 70 C with the LED dark (188 thermal ceiling - ~43 module).
    FOR A PE42482A-X AT 120 uA TYP / 200 uA MAX (its Table 2, PDF p3) THAT IS
    A FACTOR OF ~700. The switch is not a load this rail can notice; the rail's
    real constraint is the RT9013's thermals under the MODULE's own draw plus
    anything else the carrier hangs on 3V3, and the RF-relevant question is
    NOISE, not headroom (an LDO's PSRR and the WS2812 sharing the same 1 uF
    output cap — see gotchas).
  gpio_vih_min_at_3v3: "2.0 V — FLAT, not 0.65 x IOVDD (RP2040 Table 625, p616)"
  gpio_vil_max_at_3v3: "0.8 V (RP2040 Table 625, p616)"
  gpio_voh_min_at_3v3: "2.62 V (RP2040 Table 625, p616)"
  gpio_vol_max_at_3v3: "0.5 V (RP2040 Table 625, p616)"
  gpio_rpd: "50-80 kohm, and every GPIO resets to pull-down/not-driven
    (RP2040 Table 615 Reset State + Table 341 PADS_BANK0 reset)"
  i_iovdd_total_max_ma: 50   # RP2040 Table 625: summed over ALL GPIO + QSPI
  clk_sys_max_mhz: 133       # Waveshare Features list; RP2040 datasheet also
                             # specifies 133 MHz, and 125 MHz is the SDK default
  flash: "W25Q16JVUXIQ, Winbond, 16 Mbit = 2 MByte, USON-8 2x3 mm, 133 MHz max
    clock. MPN read off the schematic's Flash block (U2); the package is
    CORROBORATED MEASURED — the STEP puts U2's body at 3.02 x 2.00 x 0.60 mm,
    which is USON-8 2x3 and not the SOIC-8 that the -SSIQ suffix would give"
  qspi_sclk_mhz: "31.25 in normal XIP = clk_sys / 4, and 8 in the USB
    bootloader. NOT A GUESS: the RP2040 datasheet's XIP section (sec 2.6.3,
    printed p122) states 'The serial flash interface is configured by the flash
    second stage ... defaulted to 4 in ... boot2_w25q080.S to make the default
    interface speed 125/4 = 31.25MHz'; the bootrom's EXIT_XIP (sec 2.8.5.4.6)
    'is configured with a fixed clock divisor of /6, so the USB bootloader will
    drive SCLK at 8MHz'. Overridable per board via PICO_FLASH_SPI_CLKDIV"
  msl: "NOT PUBLISHED — see gotchas 'MSL IS OWED, NOT ABSENT'"
  operating_temperature: "NOT PUBLISHED for the module. The RP2040 die is
    -40 to +85 C; the RT9013 is -40 to +125 C junction; nobody states a module
    figure and the tact switches and USB-C are unrated here. OWED"
electrical:
  source: "RP2040 datasheet RP-008371-DS-1 Table 625 'Digital IO
    characteristics', PDF p616 — the castellated GPIO are RP2040 IOVDD pads and
    the module ties IOVDD to its own 3V3"
  vdd: 3.3
  vdd_net: 3V3
  defaults:
    v_ih_min: 2.0
    v_il_max: 0.8
gotchas:
  - "IT CANNOT BE SOLDERED FLAT ONTO A CARRIER, AND THAT IS THE FIRST FACT ABOUT
     THIS PART. The RP2040 QFN-56, the 12 MHz crystal, the RT9013, fifteen 0201
     capacitors and five 0201 resistors — twenty-three parts — are all on the
     module's BOTTOM face, the face that meets the carrier. MEASURED off the
     vendor STEP: the crystal stands 1.000 mm proud of the laminate, the RP2040
     0.850 mm, the RT9013 0.700 mm, the 0201s 0.300 mm.
     A castellated pad and a 1.0 mm standoff are not compatible: reflow cannot
     bridge that gap on a 2.54 mm pitch, so the joint has to be made by hand,
     with the module resting on its own crystal. Raspberry Pi's own forum thread
     on this board (forums.raspberrypi.com/viewtopic.php?t=324718) is entirely
     about it — 'castellated edges on a PCB that can't be soldered flat onto a
     carrier', with the standard fix 'you could solder it to a carrier with a
     hole in it'. Waveshare's marketing says the opposite in three places
     ('Castellated module allows soldering directly to carrier boards'), and the
     marketing is the thing that is wrong. CARRIER OPTIONS, ALL OF THEM
     DELIBERATE: (a) a cutout or milled pocket under X 4.0..14.0, Y 2.5..22.5
     (module frame), which is the only route to a reflowable joint; (b) accept
     the ~1.1 mm standoff and HAND-SOLDER, which is what this dossier assumes;
     (c) don't solder it at all — 2.54 mm headers. There is no fourth option
     and there is no option in which JLC PCBA does it."
  - "SECOND REFLOW WOULD RE-MELT THE MODULE'S OWN BOTTOM-SIDE JOINTS WITH THE
     PARTS FACING DOWN. Even with a carrier cutout, putting this module through
     a reflow oven re-melts the RP2040's, the crystal's and the LDO's solder
     while gravity is pulling them off the board. The module is a populated PCBA
     and the vendor publishes no second-reflow profile, no peak temperature and
     no MSL. Treat 'reflow this module' as unproven, not as merely undocumented."
  - "MSL IS OWED, NOT ABSENT, AND IT MAY NOT BE GUESSED. Waveshare publishes no
     moisture-sensitivity level and no reflow profile for the RP2040-Zero —
     checked the wiki, the product page, the LCSC C5350143 datasheet (which is a
     print of the wiki page), and both published archives. Do NOT copy a level
     off a constituent part: J-STD-020 classifies packaged DEVICES, and a
     populated FR-4 assembly is not one — the RP2040 die's own MSL 1 (RP2040
     datasheet sec 5.2, and the storage recommendation <30 C / 85% RH) says
     nothing about the laminate the module is made of. THE ROUTE TO CLOSING
     THIS: it only matters if you ever reflow the module, and per the two
     gotchas above you should not; if a batch is nevertheless to see an oven,
     ask Waveshare support for the level in writing, and until that arrives bake
     per J-STD-033 at a temperature all the module's parts survive (NOT 125 C —
     the tact-switch and USB-C plastics are unrated here). THIS IS WHY THERE IS
     NO `msl` ENTRY IN `asserts:` BELOW: an MSL assert grades the ORDER
     paperwork, and asserting a level we invented would put a fabricated
     moisture obligation into a release."
  - "THE 5V PAD IS USB VBUS, WITH NOTHING IN BETWEEN. The schematic's Type-C
     block wires contacts A4/B9 and A9/B4 straight onto net VSYS, and VSYS is
     pad 23 — no Schottky, no ideal diode, no fuse, no ferrite. Waveshare say so
     themselves in the wiki FAQ: 'The VSYS pin of the RP2040 is connected to the
     VUSB pin directly in RP2040-zero (named Pin23). If you want to connect the
     battery directly to the VSYS pin, you need to add a diode to avoid
     backflow.' CONSEQUENCES, BOTH DIRECTIONS: (a) you may power the module by
     feeding 5 V into pad 23 and it is the supported way to do it ('If you do
     not use USB for power supply, you can use the 5V pin for power supply' —
     same FAQ); (b) if a USB cable is ALSO plugged in, your 5 V supply and the
     host's VBUS are shorted together through the module, so the carrier MUST
     provide the OR-ing the module does not. There are only 3 x 2.2 uF of bulk
     on VSYS, so the carrier owns the input bulk as well."
  - "BACK-DRIVING 3V3 IS SUPPORTED, AND IT BACK-FEEDS THE LDO'S OUTPUT. Pad 21
     is the RT9013's VOUT with 1 uF on it. Waveshare's FAQ: 'You can also
     directly connect the battery to Pin 21 (the 3V3) of the RP2040-zero if the
     voltage of the battery is 3.3V.' What the schematic ADDS to that: the
     RT9013's EN is strapped to its own VIN, so the regulator is on whenever
     VSYS is present and CANNOT BE DISABLED — driving 3V3 while USB is plugged
     in puts your supply in parallel with a live LDO output. Feed 3V3 or feed
     5V/USB, never both."
  - "THE WS2812 IS HARD-WIRED TO 3V3. THERE IS NO POWER-ENABLE GPIO. This is the
     Seeed XIAO RP2040 comparison and the answer is the opposite one: the XIAO
     gates its NeoPixel supply from a GPIO, the RP2040-Zero does not. The
     schematic's RGB block is four nets and nothing else — L1 VDD to 3V3, DIN to
     GPIO16, VSS to GND, DOUT unconnected. So the LED's controller is powered
     from the instant VSYS rises and cannot be turned off in firmware; only its
     LEDs can be commanded dark. FOR AN RF FRONT-END THAT IS THE WHOLE POINT:
     the WS2812B datasheet's own General Description says the device includes
     'a precision internal oscillator', and its Features specify 'scan frequency
     not less than 400Hz/s' and an 800 kbit/s data port with a 1.25 us bit
     cell — i.e. a free-running clock and hard-edged PWM current switching,
     inside the module and permanently energised. MEASURED, and it is worse than
     'nearby': L1's centre is (8.95, 8.13) on the TOP face and the RP2040's
     QFN-56 occupies X 5.430..12.470, Y 7.992..15.032 on the BOTTOM face, so the
     LED sits DIRECTLY OVER THE MCU with 1.091 mm of laminate between them —
     there is no plane you can add and no distance you can buy. IT RUNS EVEN
     WITH THE LED BLACK. Mitigations available to a carrier, in order
     of strength: (1) don't use this module in the receiver's near field;
     (2) power the whole module down between measurements (the only real off
     switch is VSYS itself); (3) blanking — hold measurements off during the
     WS2812's own refresh, which is bounded but not published; (4) shield. NOTE
     ALSO THAT THE PART IS NOT A 5050 WS2812B: the schematic labels it WS2812B,
     but the STEP's L1 body is 1.50 x 1.80 x 1.00 mm, not the 5.0 x 5.0 mm PLCC-4
     the WS2812B datasheet describes, so the fitted device is a miniature
     variant (WS2812B-1615 class). ITS EXACT MPN IS OWED — and it matters,
     because the oscillator frequency and the current-switching edge rate are
     variant-specific and this is a receiver."
  - "BOOTSEL AND RESET CANNOT BE REACHED FROM THE CARRIER — VERIFIED AGAINST THE
     SCHEMATIC, NOT ASSUMED. The Key block wires QSPI_SS_N through R2 (1 kohm)
     to Key1 (BOOT) to GND, and RUN straight through Key2 (RESET) to GND.
     NEITHER QSPI_SS_N NOR RUN APPEARS ANYWHERE IN THE 23-PAD LIST, and neither
     does SWCLK or SWDIO — Waveshare confirm the latter twice in the wiki FAQ
     ('This board doesn't pin out the SWD pins' / 'Debugging is not possible').
     So once the module is soldered down: (a) the two buttons on its TOP face
     are the ONLY hardware route into the UF2 bootloader, and the documented
     sequence is Waveshare's own — 'Press RESET first, then press BOOT. Release
     RESET first, then release BOOT to enter the flashing mode'; (b) THE CARRIER
     MUST LEAVE BOTH BUTTONS PHYSICALLY ACCESSIBLE — they are 2.500 mm tall at
     (4.45, 7.60) and (13.45, 7.60), so nothing may overhang the module's top
     face there; (c) there is no in-circuit debug at all, ever. SOFTWARE
     MITIGATION, and it should be a firmware requirement rather than an
     afterthought: build with USB stdio so `picotool reboot -f -u` can force
     BOOTSEL over the module's own USB — INFERRED from SDK capability, not from
     any Waveshare statement, and it only works while the resident firmware
     still enumerates."
  - "THE USB PLUG WILL FOUL THE CARRIER UNLESS THE MODULE OVERHANGS ITS EDGE.
     MEASURED: the receptacle's mating cavity centreline sits 1.17 mm above the
     module's PCB TOP face, i.e. ~2.26 mm above its BOTTOM face; the receptacle
     itself already overhangs the module outline by 1.21 mm. A USB-C plug's
     overmould is roughly 6.5 mm tall (ESTIMATED — MEASURE THE ACTUAL CABLE,
     this is the one number in the sentence that is not from CAD), centred on
     that cavity, so its underside runs about 1.0 mm BELOW the module's bottom
     face. Even riding on its crystal at a ~1.1 mm standoff the plug only just
     clears. PRACTICAL RULE: the module's USB edge must sit at or beyond the
     carrier's own board edge, or the carrier must be relieved under the plug
     for at least the plug's insertion length. Related: the receptacle is
     CENTRED on the 18.00 mm width to within 0.02 mm (MEASURED), shell 9.580 mm
     wide over the board-lock legs and 8.340 mm over the plain shell, so the
     plug's centreline is on the module's centreline."
  - "PAD NUMBERING RUNS CLOCKWISE FROM THE TOP-RIGHT, WHICH IS BACKWARDS FROM
     EVERY IC YOU HAVE EVER DRAWN. Top view, USB-C at the top: pad 1 (GP0) is
     the TOPMOST pad of the RIGHT edge; 1..9 run DOWN the right edge to GP8 at
     the bottom-right corner; 10..14 run RIGHT-TO-LEFT along the bottom edge
     (GP9 nearest the right, GP13 nearest the left); 15..23 run UP the left edge
     from GP14 at the bottom-left corner to 5V at the top-left. An IC's pin 1 is
     at the top LEFT and its numbering is counter-clockwise; this module's is
     the mirror. Get it wrong and the board is a perfect mirror image that
     assembles, powers up and reads every GPIO on the wrong pad."
  - "THE SILKSCREEN NUMBERS ARE GPIO NUMBERS, NOT PAD NUMBERS, AND THEY DIVERGE
     AT PAD 17. Pads 1-16 happen to carry GP0-GP15, so the two systems agree for
     the first sixteen and then stop: pad 17 is GP26, pad 18 GP27, pad 19 GP28,
     pad 20 GP29, pad 21 3V3, pad 22 GND, pad 23 5V. Sixteen consecutive
     agreements is exactly long enough to convince a reviewer that the mapping
     is the identity."
  - "GP16 IS NOT BROUGHT OUT ANYWHERE. Twenty-nine RP2040 GPIO exist; twenty
     reach the castellations, nine reach the underside row, and GP16 reaches
     neither — it drives the WS2812 and only the WS2812. Waveshare's own feature
     bullet ('29 GPIO pins of RP2040 (20 can be led out through pin headers, the
     rest can be led out only by soldering)') papers over this: 20 + 9 = 29 only
     if you count GP16 as one of the nine, and it is not."
  - "TWO JLC CODES EXIST AND NEITHER IS ORDERABLE (live query 2026-07-30, so
     this is a SOURCING SHAPE, not a stock claim — stock belongs in
     06_build/cache/). C9900173620 is 'RP2040-Zero-NoLogo', brand 'JLCPCB
     Assembly', package string LCC-23(18x23.5) — the C99* consigned-sourcing
     placeholder shape, permanently stock 0 by construction, minimum order 444,
     and it now additionally carries 'This product is no longer manufactured.'
     C5350143 is the real catalogue entry, 'RP2040-Zero' by Waveshare, but it is
     filed under 'Development Boards & Kits' with no package string at all and
     JLC's own part page marks it 'SMT Assembly (Fixture Required)'. THE
     CONCLUSION IS THE SAME EITHER WAY: this part does not go on a JLC assembly
     BOM — see the `not_on_assembly_bom` assert."
  - "ORDER THE ONE WITHOUT THE HEADERS. Waveshare sell 'RP2040-Zero' and
     'RP2040-Zero, with pre-soldered header' under names that differ by a
     trailing clause, and the resellers mix them freely. The pre-soldered
     variant has 2.54 mm pin headers SOLDERED INTO THE CASTELLATIONS — the exact
     pads a carrier needs. It is not a variant, it is a different mechanical
     part, and de-soldering 23 header pins out of half-holes damages them."
  - "IT IS AN IN-BAND SPUR SOURCE AND THE COMB IS KNOWN. Continuously running,
     inside a module you cannot re-lay-out: QSPI SCLK at 31.25 MHz with
     sub-nanosecond edges (clk_sys/4, RP2040 sec 2.6.3 p122) executing in place
     forever, a 12 MHz crystal comb, a 48 MHz USB PLL, clk_sys at 125 MHz, and
     the WS2812's own free-running oscillator and PWM current switching. All of
     it lands inside 70 MHz - 6 GHz with harmonics well past. Unlike a bare
     RP2040 design there is NO placement mitigation available — the module's
     internal layout is fixed, so the only levers are module-to-antenna
     distance, shielding, and powering the module down between measurements."
  - "NO VENDOR LAND PATTERN EXISTS. See `land_pattern:` and `layout_refs:`. This
     is the KH-SMA-KE-Z class: every footprint rule for this part is DERIVED
     ENGINEERING and cannot be waived by citing the vendor, because the vendor
     is silent."
verified: >-
  Pad map read from the VENDOR PINOUT FIGURE, and then confirmed against two
  further vendor artifacts that were produced independently of it.
  (1) PRIMARY, for the pad-to-GPIO map: Waveshare schematic RP2040_Zero.pdf
  (sha256 bab8e6f...), sheet 1 of 1, the block titled "Pin Out", connector P1
  "Header 23" — PDF page RENDERED AT 300 dpi AND READ VISUALLY, pin by pin,
  1..23. That block is the only place Waveshare NUMBERS the pads.
  (2) PHYSICAL ORDER AND EDGE ASSIGNMENT, which (1) does not give: the wiki's
  "Pinout Definition" figure, https://www.waveshare.com/w/upload/1/1f/
  900px-RP2040-Zero-details-7.jpg (sha256 b2fc911...), which labels every pad on
  a top view and a bottom view and additionally states the WS2812B's pin
  ("WS2812 RGB LED used pin: GP16 / DIN").
  (3) INDEPENDENT CROSS-CHECK: the silkscreen legends legible on the dimension
  drawing, https://www.waveshare.com/w/upload/f/f4/900px-RP2040-Zero-details-
  size.jpg (sha256 42245fe...) — left edge top-to-bottom 5V, GND, 3V3, 29, 28,
