layout:
  source: >-
    WAVESHARE PUBLISHES NO LAYOUT SECTION, NO LAND PATTERN AND NO APPLICATION
    NOTE. Reported as an ABSENCE — this is the KH-SMA-KE-Z entry's class in
    proven-parts.yaml, and the absence is the finding. What was searched, so the
    claim is falsifiable: the wiki's entire Resources > Documents section
    (which lists exactly two files, the schematic and the STEP), the product
    page, the LCSC C5350143 datasheet PDF (a browser print of the Chinese wiki
    page, zero engineering content), RP2040-Zero.zip (demo C and MicroPython
    only) and RP2040_Zero_stp.zip (the STEP only). WHAT DOES EXIST AND IS USED
    HERE: (a) the dimensioned drawing, which gives outline, corner radius,
    pitch, both first-pad datums and the 1.38 mm castellation inset; (b) the
    STEP assembly, which is the manufacturer's own machine-readable geometry and
    is the ONLY source for the fact that governs this part's placement — the
    module's bottom face carries 1.000 mm of components; (c) the schematic,
    which fixes what the carrier must supply (input bulk on VSYS, decoupling at
    3V3) because the module supplies so little. THE THREE PLACEMENT RULES THIS
    PART IMPOSES ON A CARRIER ARE THEREFORE MECHANICAL, NOT ELECTRICAL, AND ARE
    IN `notes:` BELOW, where they can be read; the one budget a machine can
    grade is the 3V3 decoupling.
  reviewed: "2026-07-30"
  keep_short:
    - {net: SEL_V1, max_span_mm: 25, anchor_pins: ["1"], why: "BOARD-SPECIFIC,
       and NOT from the module dossier — restored here after the dossier landed,
       because a dossier that does not know the board cannot carry it. The select
       lines run from this module to R_S1 and on to the switch. 25 mm is NOT a
       timing constraint (at ~6.1 ps/mm it is 0.15 ns against a 4.267 us blanking
       allowance) — it is a COUPLING constraint: these are the only switching
       edges on a board whose product is a phase measurement, and a long select
       line beside an RF arm couples an edge into the dwell it is meant to start.
       Per line, because a budget on one leaves three ungraded. NOTE THE PAD
       NUMBERS ARE THE VENDOR'S: SEL_V1=GP0=pad 1 .. SEL_V4=GP3=pad 4, and under
       the withdrawn house numbering these same four nets were pads 23..20."}
