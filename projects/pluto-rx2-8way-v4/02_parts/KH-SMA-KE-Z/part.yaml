gotchas:
  - "GROUND HOLES MUST BE D1.4 mm, NOT D1.3. The drawing's own PCB-layout inset
     says 5-D1.4 and the arithmetic backs it: a 0.9 mm SQUARE post has a
     1.273 mm diagonal, so a D1.3 hole leaves 0.014 mm radial clearance —
     inside JLC's plated-hole tolerance. D1.4 gives 0.064 mm. Some vendor
     sheets in this class recommend D1.3; this one does not, and the number is
     arithmetically justified rather than inherited."
  - "RP-SMA LANDMINE ONE CHARACTER AWAY, AND IT IS LIVE. DreamLNK SMA-KE-P901
     (C914556, 1287 in stock 2026-07-27) and SMA-KWE901 (C914553, 5088) are
     listed by LCSC as RP-SMA / 'Male Pin' in an external-thread shell. They
     will not mate with a standard SMA male cable. A price-driven substitution
     yields a board that assembles cleanly and CANNOT BE CONNECTED — on this
     board, ten times over."
  - "DO NOT SUBSTITUTE ON APPEARANCE. C914559 SMA-KE901 has a 4.90 mm post
     square, not 5.08 — the legs will not enter. C5250058 BWSMA-KE11,
     C530661 KH-SMA-KE8-G and C496550 BWSMA-KE-P001 all have an OFFSET pin
     (centre pin not on the flange axis). C53133521 XY-SMA-KE-Z001 is rated
     3 GHz. The '5.08' belongs in the footprint NAME."
  - "MECHANICAL LEVER ARM is the reason this part wins its class: 13.5 mm
     overall on four 0.9 mm posts, against 28.6 mm for BWSMA-KE23 (C5250061)
     on the identical post pattern. Ten cabled ports on one board is ten torque
     paths into the same laminate."
  - "THT: this part DISQUALIFIES the board from JLC Economic PCBA and adds a
     per-order THT surcharge (~$3.50 setup + ~$0.0173/joint + $3.00 extended-
     component fee). At 10 jacks x 5 pins = 50 joints that is ~$0.87/board of
     joint fee alone, before the connectors themselves."
  - "THE VENDOR PUBLISHES NO APPLICATION OR LAYOUT SECTION. No via-fence rule,
     no antipad rule, no board-thickness requirement, no VSWR-vs-launch curve.
     Every launch rule in layout: below is DERIVED ENGINEERING and cannot be
     waived by citing the datasheet."
  - "LCSC'S PARAMETRIC RECORD FOR C504007 CARRIES NEITHER THE FREQUENCY NOR THE
     IMPEDANCE (both show '-', live 2026-07-27), and it contradicts the PDF on
     temperature range. Only the PDF counts for this vendor class."
