layout:
  source: "NO vendor layout section exists (see gotchas). Every rule here is
    DERIVED from the geometry plus the 6 GHz / VSWR<=1.35 claim on sheet 1/2,
    and is labelled as such. The single vendor-sourced constraint is the
    5-D1.4 hole pattern itself."
  reviewed: "2026-07-27"
  keep_short:
    # ONE ENTRY PER REAL LAUNCH NET. The dossier arrived from pluto-rx2-8way
    # carrying a single entry on `RF_ANT_LAUNCH`, which is a PLACEHOLDER NAME
    # and is not a net on that board either — E-NETREF classes it a GHOST, and
    # a ghost keep_short does not fail loudly, it makes P-ADJ grade NOTHING for
    # this part while still counting as a declared budget. (Canon E-NETREF was
    # written after exactly this: 64 of 908 fleet references were ghosts and
    # EVERY ONE was a keep_short.)
    # The budget below is the SAME derived 3 mm, applied to each of the nine
    # launches this board actually has. Ten jacks, nine nets: J_ANT8 and J_RX1
    # share RX1_MAIN, which is the pickoff node and is the whole point of the
    # board.
    # CORRECTED 2026-07-30 AT THE RELEASE GATE, AND THE CORRECTION IS THE
    # INTERESTING PART. The block below used to carry a `max_span_mm: 3` entry
    # for ANT1..ANT7 and RX2_OUT as well. P-ADJ measured them and FAILED ALL
    # EIGHT at 14.00 mm of 3.0 mm — and P-ADJ was right about the number and
    # the budget was wrong about the constraint.
    #
    # READ THE `why:` THAT SHIPPED WITH THOSE ENTRIES: "Any SERIES PART belongs
    # inside 3 mm of the launch or it adds a second discontinuity at a different
    # reference plane." That is a statement about where a SERIES PART may sit.
    # P-ADJ grades a NET SPAN — the anchor pad to its nearest qualifying partner
    # — so on a TWO-PAD net the only span there is IS the whole arm, and the
    # budget silently became "this arm must be 3 mm long".
    #
    # THE ARM IS 14.00 mm BY ARCHITECTURE AND CANNOT BE 3. It is the equalised
    # radius of a ten-jack radial star around a 4x4 mm QFN; the equal radii ARE
    # the board's published property (ARCHITECTURE sec 7, ADR-0003). A 3 mm arm
    # is not tight, it is geometrically impossible — the switch body alone is
    # 4 mm across. A budget whose only admissible value cannot exist is a
    # mis-encoding, not a finding, and grading it as a finding is how a real
    # gate gets waived into furniture.
    #
    # So the budget is kept EXACTLY where the constraint it states can bind —
    # the three RX1-chain nets, which are the only RF nets on this board that
    # carry a series part — and the eight pure arms get the constraint stated
    # as what it actually is: a prohibition, in notes:, not a span.
    # MEASURED at this gate: ANT1..ANT7 and RX2_OUT each carry exactly TWO pads
    # (J_ANTn.1 -> U_SW.k), so there is no series part on any of them to be
    # 3 mm from, and the budget was vacuous as intent and false as arithmetic.
    # RX1_MAIN IS REMOVED HERE TOO, 2026-07-30, AT THE SECOND RELEASE GATE —
    # AND IT IS THE SAME CORRECTION AS THE ONE ABOVE, WITH A HARDER PROOF.
    #
    # The entry that stood here read: "a series part belongs inside 3 mm of the
    # launch or it adds a second discontinuity at a different reference plane.
    # THIS net is where that can actually happen: it carries THREE pads
    # (J_ANT8.1, J_RX1.1, R_T1.1)". The sentence is right. The METRIC is not.
    # P-ADJ anchors at each KH-SMA-KE-Z pad and takes its NEAREST qualifying
    # partner, and on a straight through line the nearest partner of each jack
    # is THE OTHER JACK. So the budget grades `J_RX1.1 <-> J_ANT8.1` — the
    # THROUGH PATH BETWEEN TWO PANEL CONNECTORS — and reads "the RX1 through
    # line must be 3 mm long".
    #
    # THAT VALUE CANNOT EXIST, AND THE PROOF IS THIS PART'S OWN BODY. A 5/16 in
    # SMA coupling nut measures 7.9375 mm across flats and **9.1656 mm across
    # corners**. Two KH-SMA-KE-Z on one net can therefore never be closer than
    # 9.1656 mm without their mated nuts interfering, so the largest admissible
    # value of this budget is 9.1656 and the declared 3 is 3.06x below it. Canon
    # M-BOUND: a bound whose only admissible value fails is a FAIL, not a
    # rounding note. It is the ANT1..ANT7 mis-encoding above in a second guise —
    # there the arm could not be 3 mm because the switch body is 4 mm across;
    # here the through line cannot be 3 mm because the CONNECTOR'S OWN NUT is
    # 9.17 mm across. Both times the part's own geometry refutes the number.
    # MEASURED at this gate: 8.000 mm on the first cut (a P-ADJ FAIL, and a real
    # mechanical defect for a different reason — the nuts DID interfere), and
    # 11.000 mm as shipped, which is 1.834 mm of nut clearance and a WORSE score
    # against a budget that was grading the wrong quantity in both directions.
    #
    # THE CONSTRAINT THE SENTENCE MEANT IS REAL, IS TIGHTER THAN 3 mm, AND IS
    # NOT A PAD SPAN. What must be short is the BRANCH: the copper from the
    # through line to the first series element of the shunt tap. Derived from
    # this board's own stackup, tuple (JLC04161H-7628 h 0.2104 / er 4.4 /
    # t 0.035, w 0.360, AS-FABBED conformal mask, Hammerstad-Jensen with H-J's
    # own dual thickness correction x the MEASURED 1.0628 mask factor of
    # rf-design.md 4A(iii)): eps_eff 3.5314, lambda_g(5.5 GHz) 29.0057 mm,
    # **branch <= lambda_g/16 = 1.8129 mm**. At the first cut's 10.107 mm the
    # branch was lambda_g/4 at 4.06 GHz and shorted the antenna node to 5.1 ohm.
    # A pad-to-pad span cannot express it — the partner is a TRACK, not a pad,
    # exactly as pin 1's ground obligation on the PE42482A-X could not be a span
    # because its partner is a plane. The obligation is therefore moved to an
    # instrument that can measure it: `06_build/verify/tap_branch.py`, which
    # reads the routed .kicad_pcb and reports the perpendicular distance from
    # R_T1's RX1_MAIN pad to the J_ANT8 <-> J_RX1 through path. See notes:.
    # RX1_TAP AND RX1_TAP_MID WERE ADDED HERE IN THE SAME CORRECTION AND
    # REMOVED AGAIN TWENTY MINUTES LATER, BY THE GATE. P-ADJ-UNREACHED fired:
    # "budgets DECLARED but graded by NOTHING". It is right — those two nets
    # carry NO KH-SMA-KE-Z pad (RX1_TAP is R_T2.2 -> U_SW.19, RX1_TAP_MID is
    # R_T1.2 -> R_T2.1), and P-ADJ anchors a part's budget at THAT PART's pads.
    # A budget declared on a net the part does not touch is not a stricter
    # board, it is an ungraded line that reads like one — the same shape as the
    # `RF_ANT_LAUNCH` ghost this block was already written against. If those two
    # nets want a budget, its home is the dossier of a part that sits on them.
    # MEASURED for the record while they were briefly declared:
    # RX1_TAP U_SW.19 <-> R_T2.2 = 9.741 mm; RX1_TAP_MID R_T2.1 <-> R_T1.2 =
    # 1.180 mm (routed copper 10.553 and 1.200 mm).
  notes:
    - "DERIVED: a D1.4 plated barrel in a 1.6 mm board is a ~1.6 mm-long,
       1.4 mm-diameter conductor — electrically short (lambda/20 at 6 GHz is
       ~1.5 mm on this laminate) but only if the ground return is equally
       short. The four corner posts ARE that return, so all four must land on
       plane copper with their own via cluster, not on a single shared pour
       neck."
    - "DERIVED: the bottom-plane antipad under the centre barrel should be
       >= D3.5 mm, not the D2.6 that DRC would accept — the barrel plus a tight
       antipad is a capacitive discontinuity that shows up as return loss at
       6 GHz, and the correction is geometric, not tunable later."
    - "PROHIBITION + A DERIVED BOUND, replacing the RX1_MAIN span budget
       (keep_short above, removed 2026-07-30 at the second release gate): THE
       RX1 PICKOFF IS A LUMPED SHUNT AT THE ANTENNA NODE, NOT A BRANCH LINE.
       The tap resistor's RX1_MAIN pad must sit ON the J_ANT8 <-> J_RX1 through
       path: branch <= lambda_g/16 = 1.8129 mm at the 5.5 GHz band edge, from
       eps_eff 3.5314 as-fabbed (see the keep_short comment for the full tuple).
       MEASURED as shipped: 0.010 mm. WHY THE BOUND IS NOT THE REAL SAFEGUARD:
       with the whole 440 ohm lumped at the junction, Z_node = 440 + Z_x for any
       passive Z_x, so |Z_node| >= 440 ohm and return loss >= 25.5 dB whatever
       the tap arm's length and whatever the switch presents at RF8 in its seven
       OFF states. Length-sensitivity is a property of the OLD topology, not of
       this one. Graded by 06_build/verify/tap_branch.py off the routed board."
    - "PROHIBITION, and it replaces a mis-encoded span budget (see keep_short
       above, corrected 2026-07-30): NO SERIES PART MAY SIT ON A PURE ARM.
       ANT1..ANT7 and RX2_OUT run launch-pad to switch-pad with two pads and
       nothing between them, and that is the requirement — not a 3 mm length,
       which the equalised 14.00 mm radial star cannot have and must not be
       graded against. The 3 mm launch-proximity budget belongs only to the
       three RX1-chain nets, which are the only RF nets here that carry a
       series part, and it is declared on exactly those."
    - "CORRECTED 2026-07-30: the ground-via fence pitch is the GUIDED
       lambda_g/20, not the free-space lambda/20. This note used to read
       '<= 2.0 mm pitch (lambda/20 at 6 GHz)' — 2.0 mm is roughly the
       FREE-SPACE figure (50/20 = 2.5 mm), and rf-design.md 3(b) settles that a
       fence sitting in the substrate beside a microstrip must sample the wave
       ON THE LINE, whose wavelength is lambda_0/sqrt(eps_eff). The two are
       sqrt(3.3286) = 1.82x apart, so satisfying the free-space one proves
       nothing about the guided one. On JLC04161H-7628 at 6 GHz the bound is
       lambda_g/20 = 1.3693 mm (ADR-0003), the board declares <= 1.35, and it
       ships a 0.95 mm lattice because a SQUARE lattice at pitch p projects at
       p*sqrt(2) along the 45-degree arms. The fence continues >= 10 mm down
       BOTH sides of each RF trace out of the launch. Left uncorrected, this
       note was exactly the re-citation path rf-design.md 3(b) was written
       against: a number with a parenthetical that does not derive it."
    - "OWED, and this is the biggest open item on this part: TEN jacks on one
       board is a port-to-port isolation question the vendor sheet does not
       touch. Two adjacent SMA barrels 10 mm apart share a laminate; the
       coupling floor that sets is unmeasured. It bounds the AoA leakage budget
       from below independently of the switch, and must be measured, not
       assumed."
