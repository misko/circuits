gotchas:
  - "TAB IS VOUT, NOT GND — copper pour under the tab is at 3V3; a ground pour touching the tab shorts the rail"
  - "Fixed-version pin 1 is GND; on the adjustable AMS1117 the same pin is ADJ — schematic symbols for the two variants must not be mixed"
  - "Needs output capacitance for stability (part of frequency compensation): datasheet asks 22uF tantalum; we use 22uF MLCC per brief's 10-22uF prescription — MLCC's low ESR is outside the datasheet's stated condition but is the standard modern usage for this part"
  - "Dropout 1.1-1.3V: 5V input gives clean 3.3V (1.7V headroom); 3.7-4.2V battery input does NOT regulate"
  - "Datasheet warns: with large output caps (1000uF+) and input instantaneously shorted, die damage possible — a reverse diode VOUT->VIN is only needed in that crowbar case, not on this board"
