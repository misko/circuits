# Policy-audit waivers — evidence-backed per canon M4 (cook-hub v1.0).
- id: R-POUR
  refs: [5V_IN, 5V_D, VSYS, RELAY_5V]
  why: >-
    MEASURED currents are far below pour territory: worst-case whole-board
    load is 0.61A on 5VP (all-16-coil fault + logic, nets.yaml); 5V_IN/5V_D
    carry the same <=0.61A through a <=25mm entry run (J1 -> F1 -> Q3 -> D2)
    at 0.5mm minimum width (PWR netclass DRU floor, ~1.5A-class on outer
    copper at 10C rise); VSYS feeds only the Pico module (<=0.35A) through
    D1/C10 stubs; RELAY_5V's trunk IS engineered copper — the 0.8mm F.Cu
    bank bus drawn by route_bank.py plus 0.5mm spurs, carrying <=0.16A
    (16 coils x 10mA worst-case fault, one-at-a-time by firmware). The
    PWR-class DRU width floor (0.50mm) is enforced by the DRC gate on every
    one of these nets; ampacity margin is >=2.4x on the worst net.
- id: R-THERM
  refs: [U12.2]
  why: >-
    The AMS1117 VOUT tab carries ONE in-pad 0.6/0.3 via to the In2 3V3
    pour (pcbnew-verified at seal). A second in-pad via is geometrically
    impossible on this route: the KRT 5VP/SR vias crowding the pocket
    leave no second site >=0.82mm (the 0.5mm hole-to-hole fab floor) from
    the first — stitch grid-probes the whole 2x3.8mm tab and places the
    best-separated pair when one exists. Thermal budget makes 1 via
    acceptable: worst dissipation is (5V-3.3V) x 0.35A = 0.6W; SOT-223
    tab soldered to a 3V3 F.Cu island + one 0.3mm barrel into the In2
    pour holds theta-JA ~45C/W-class => ~27C rise, inside the AMS1117
    125C junction limit with >3x margin at 40C ambient.
- id: S-VER
  refs: [2N7002, AO3401A, DC-005-20A, GZ2012D601TF, LTV-817S-TA1, SN74HC14DR,
         SN74HC595DR, ULN2803ADWR, USBLC6-2SC6, SS34, SMBJ5.0A]
  why: >-
    Jellybean two/three-terminal parts and industry-fixed pinouts whose
    part.yaml facts lack per-figure citations. Compensating control: the
    v1.0 fresh-context pin reviews (release verification/pin_review.md,
    2026-07-19) independently derived every one of these parts' pinouts
    from datasheet knowledge and PASSED all pads (relay/watchdog chain
    review: U5/U6 ULN2803 IN/OUT rows, U11 HC14, Q1/Q2 FET pinouts, K1
    reed relay winding vs the stored Standex PDF; sensor review: D1/D2
    polarity electrically; connector review: J1 barrel tip/sleeve).
