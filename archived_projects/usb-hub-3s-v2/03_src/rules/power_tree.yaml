# usb-hub-3s-v2 POWER-TREE TOPOLOGY (canon E-TOPO).
#
# The founding correction of v2 (D1): the USB-C port is 5 V ONLY. Every rail is
# therefore a step-DOWN buck (Vout 5 < Vin_min 9). v1 built a buck-boost SoC +
# 16 A trunk for the USB-C rail; the physics below say a buck suffices.
#
# THE PHYSICS: Vout_max < Vin_min -> BUCK. Both rails: 5 < 9 -> BUCK. PASS.
#
# ARCHITECTURE (ADR-0010): TWO separate 5 V bucks, one per rail, each at the
# proven LM5116 5 V/7 A design point (USB-A ~6 A, USB-C ~5 A, both < 7 A). The
# PD source controller sits DOWNSTREAM of the USB-C buck on its 5 V output — it
# is not itself a converter, so it does not appear here.

input_trunk_class: PWR_IN   # nets.yaml class carrying the shared battery trunk

rails:
  # USB-A rail: LM5116 buck -> 5VA -> 3x TPS2557 (2 A cont each) -> 3x USB-A.
  # 3x2 A continuous = 6 A; 2.5 A burst is short (not continuous), so 6 A is
  # the sizing current (each TPS2557 ILIM caps the branch).
  - name: USB-A
    vin_min: 9.0
    vin_max: 12.6
    vout_min: 5
    vout_max: 5
    iout_max_A: 6
    converter: LM5116MHX-NOPB
    eff: 0.9

  # USB-C rail: LM5116 buck -> 5VC -> PD source controller (fixed 5 V PDO,
  # 5 A advertised with e-marked cable) -> USB-C VBUS. Fixed 5 V out => BUCK.
  - name: USB-C
    vin_min: 9.0
    vin_max: 12.6
    vout_min: 5
    vout_max: 5
    iout_max_A: 5
    converter: LM5116MHX-NOPB
    eff: 0.9
