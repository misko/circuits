# Policy-audit waivers for lipo3s-usb-hub — evidence-backed per canon M4.
# This board is a tscircuit-native from-scratch build (ADR-0002) whose independent
# netlist converges node-for-node on the sealed usb-power-3s (board parity 0, 303
# nodes / 56 nets); it therefore reuses that board's certified copper/floorplan/route
# verbatim (ADR-0006). Waivers below are honest for THIS board — NOT grandfather
# clauses. The silk waivers are recorded as REAL next-spin defects, not evidence of
# adequacy.

- id: S-OCCL
  derived_from: usb-power-3s
  why: >-
    ARCHITECTURAL DISPOSITION (ADR-0002 Phase A / kicad-pcb tscircuit-folder.md), not a
    defect. For a tscircuit-native board the HUMAN schematic document is tscircuit's OWN
    render, shipped as pdf/schematic.pdf (build/schematic.pdf) — clean, collision-free,
    real symbols. The .kicad_sch that policy_audit scans is the CONVERTER output: a
    machine-only artifact that feeds ERC / netlist / parity / the backend, and is "never
    required to be pretty" (ADR-0002). Nobody reads it in a tscircuit-native flow — you
    edit the TSX and view tscircuit's render. The 39 S-OCCL hits are label-vs-refdes text
    overlaps on that machine sheet; they do not affect the human schematic. The S6
    human-readability item is graded on tscircuit's schematic.pdf by the fresh-context
    render review (verification/render_review.md), which is the correct consumer.

- id: R-POUR
  derived_from: usb-power-3s
  refs: [VBUS1, VBUS2, VBUS3]
  why: >-
    MEASURED (pcbnew) on THIS board — identical copper to the reviewed/ordered
    usb-power-3s (board parity 0): each VBUS net is a continuous 0.8 mm F.Cu run (1 oz),
    ~9 mm TPS2557 -> USB-A THT pad, all segments 0.8 mm; the two small vias per net feed
    only the port-cap spur on B.Cu, not the load path. IPC-2221 external ampacity for
    0.8 mm/1 oz: 2.03 A @10C rise, 2.76 A @20C, 3.30 A @30C. At the ILIM-bounded worst
    case 2.51 A the rise is ~16C. HONEST VERDICT: functional (modest rise, current
    hard-limited by the TPS2557) but the 1.5x ampacity-margin bar (canon R2) is NOT met
    at a reasonable rise budget (1.10x @20C, 1.32x @30C). Recorded as a NEXT-SPIN DEFECT,
    not evidence of adequacy: rev-next must carry VBUS1-3 as priority pours or >=1.5 mm
    trunks. The board is orderable and safe as-is (hard-limited, small rise).

- id: P-SILK-REF
  derived_from: usb-power-3s
  why: >-
    REAL DEFECT, deferred with mitigation. The reused generate_board floorplan places
    every refdes on F.Fab (assembly drawing) but not F.SilkS (physical board).
    Retrofitting refdes-on-silk onto this DENSELY ROUTED board is not free: silk_over_copper
    / silk_overlap are warning-severity DRC items the --severity-all gate counts, so ~100
    added silk texts introduce dozens of violations and break the proven DRC 0/0/0
    (verified empirically 2026-07-20). The functional/assembly information is fully carried
    by pdf/assembly_top.pdf (F.Fab refdes + sketch pads) and the ORDER_README. NEXT-SPIN
    remediation: a generator refdes-on-silk + de-collision pass ported into the
    tscircuit-native flow, gated by audit I8/P-SILK-REF, run on a PRE-ROUTE board so silk
    is placed before copper density forbids it.

- id: P-SILK-FN
  derived_from: usb-power-3s
  refs: [F1, J1, J2, J3, J4, J5]
  why: >-
    REAL DEFECT, deferred with mitigation (same root cause as P-SILK-REF: reused floorplan
    predates the tscircuit-native silk pass, and this routed board cannot take added silk
    without breaking DRC 0/0/0). No plain-word labels sit near the fuse/connectors on the
    physical board. This IS the P5 incident class (a 3S battery input with unmarked
    terminals), so it is logged as a defect, not excused. MITIGATION shipped in this
    release: (a) the ORDER_README documents XT60 polarity (pad1=- / pad2=+), the 15 A ATO
    fuse, per-port 2.5 A USB-A limits, and the USB-C 3 A advertisement / 6 A copper; (b) the
    first-power multimeter ritual is mandatory in the ORDER_README; (c) the assembly PDF
    identifies every connector by refdes. NEXT-SPIN remediation: generator functional-silk
    pass (BATT 3S +/-, FUSE 15A, USB-A 2.5A, USB-C) run pre-route.
