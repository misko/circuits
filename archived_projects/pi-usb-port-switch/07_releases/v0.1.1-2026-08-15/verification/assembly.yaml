    disposition: "Buy the exact Wurth Type-A receptacles from an authorized distributor and hand-solder J4/J6/J8/J10 after JLC PCBA; inspect shell stakes and every USB contact before powered test."
  - refs: [F1]
    reason: mechanical
    lcsc: C5249699
    evidence: "Keystone 3568 is a two-clip MINI-blade fuse holder represented by one electrical footprint. JLC C5249699 identifies one physical clip, while F1 requires two separately located clips; a single CPL centroid cannot express the assembly. Confirmed from the Keystone M65 p.42 drawing and exact board land pattern on 2026-08-15."
    disposition: "Purchase two Keystone 3568 clips per board, hand-solder both after PCBA, then fit the separate Littelfuse 029707.5WXNV 7.5 A MINI fuse before first power."
