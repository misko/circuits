through_hole:
  process: "JLCPCB through-hole / wave-selective connector assembly, selected at order time"
  refs: [J1, J2, J3, J5, J7, J9]
  evidence: "Measured 2026-08-15: J1 C3819953 has 2 plated drilled paste-free pads; J2 C5364405 has 40; each of J3/J5/J7/J9 exact Wurth 692221030100 / C5334230 has 11 physical plated holes (the board electrically merges the two shell posts as pad 10). Live JLC catalog stock was 1050, 591, and 47 respectively. C5334230's numbering-free pad-cloud fit against the manufacturer land is 0.0039mm at offset 0 versus 2.9893mm next best. These refs stay on the CPL only if the uploader assigns the bought through-hole process and the preview is accepted before payment."
