    current: "signal only"
    min_width: 0.18mm
    clearance: 0.17mm
    routing: >
      One outer layer above uninterrupted L2 ground; ESD first at each
      connector, symmetric 2.2 ohm resistor and capacitor launches, no stubs,
      zero-via preference, and at least five trace widths between unrelated
      pairs where the connector fanout permits.
    verify: >
      Direction/pin-map invariant, schematic pair inventory, order-time JLCPCB
      90 ohm differential solve, realized-copper skew/uncoupled-length audit,
      DRC, then first-article USB 3 enumeration and sustained-throughput test.

  USB_HS:
    intent: >
      Four independent 480 Mbit/s USB 2 D+/D- pass-through channels, each split
      into an upstream and downstream segment by its fail-safe data switch.
    nets:
      - USB1_HS_UP_P
      - USB1_HS_UP_N
      - USB1_HS_DN_P
      - USB1_HS_DN_N
      - USB2_HS_UP_P
      - USB2_HS_UP_N
      - USB2_HS_DN_P
      - USB2_HS_DN_N
      - USB3_HS_UP_P
      - USB3_HS_UP_N
      - USB3_HS_DN_P
      - USB3_HS_DN_N
      - USB4_HS_UP_P
      - USB4_HS_UP_N
      - USB4_HS_DN_P
      - USB4_HS_DN_N
    current: "signal only"
    min_width: 0.18mm
    clearance: 0.17mm
    routing: >
      Short, direct, stub-free differential routes above uninterrupted L2
      ground; the unused TS3USB221E throw is left electrically and physically
      unbranched.
    verify: >
      Schematic pair inventory, order-time 90 ohm differential solve,
      realized-copper pair-skew audit, DRC and first-article USB 2 enumeration.

  PWR_INPUT:
    intent: >
      External 5.2 V input from the removable terminal through the user-fit
      fuse and reverse-polarity P-FET to the shared protected trunk.  The width
      is a track floor; broad copper and via arrays carry the simultaneous load.
    nets: [EXT_5V_RAW, EXT_5V_FUSED, P5V_PROTECTED]
    current: "4.05 A continuous design trunk; 7.5 A user-fit fuse"
    min_width: 2.50mm
    clearance: 0.20mm
    routing: >
      Short broad top-layer trunk/pour with immediate widening after component
      pads and parallel return copper; keep the protection loop away from USB.
    verify: >
      DRC, filled-copper extraction, complete-path resistance budget, hot
      four-wire voltage-drop measurement and simultaneous four-port thermal test.

  PWR_PORT:
    intent: >
      Four independently current-limited switched VBUS outputs from the
      protected trunk to the downstream USB-A receptacles.
    nets: [VBUS1_SW, VBUS2_SW, VBUS3_SW, VBUS4_SW]
    current: "0.9 A continuous per port"
    min_width: 0.50mm
    clearance: 0.20mm
    routing: >
      Short top-layer branches/pours using both TPS2557 IN and OUT pins; widen
      immediately after any unavoidable package-pad neckdown.
    verify: >
      DRC, per-port copper resistance, 0.9 A hot voltage-drop test and
      simultaneous four-port thermal test.

  PWR_3V3:
    intent: >
      Local logic, USB 2 switch and four-redriver rail from the TLV76133;
      never connected to a Raspberry Pi 3.3 V pin.
    nets: [3V3]
    current: "0.45 A maximum design load"
    min_width: 0.40mm
    clearance: 0.17mm
    routing: >
      Compact branches from the LDO with a direct bypass at every IC supply;
      keep the regulator thermal land and return free of USB pair crossings.
    verify: >
      DRC, loaded voltage, startup/brownout behavior, ripple and worst-mode LDO
      thermal measurement.

  GPIO_CONTROL:
    intent: >
      Eight Raspberry Pi commands, their protected local copies, four hardware
      PWR_EN AND DATA_EN interlock outputs, USB 2 active-high disconnect nodes,
      fault test nodes and deterministic three-level redriver straps.
    nets:
      - GPIO17_RAW
      - GPIO27_RAW
      - GPIO22_RAW
      - GPIO23_RAW
      - GPIO24_RAW
      - GPIO25_RAW
      - GPIO5_RAW
      - GPIO6_RAW
      - PWR_EN1
      - DATA_EN1
      - DATA_OK1
      - USB2_OE1
      - VBUS_FAULT1_N
      - PWR_EN2
      - DATA_EN2
      - DATA_OK2
      - USB2_OE2
      - VBUS_FAULT2_N
      - PWR_EN3
      - DATA_EN3
      - DATA_OK3
      - USB2_OE3
      - VBUS_FAULT3_N
      - PWR_EN4
      - DATA_EN4
      - DATA_OK4
      - USB2_OE4
      - VBUS_FAULT4_N
      - TUSB_EQ1
      - TUSB_EQ2
      - TUSB_DE1
      - TUSB_DE2
      - TUSB_OS1
      - TUSB_OS2
    current: "signal only"
    min_width: 0.18mm
    clearance: 0.17mm
    routing: >
      Ordinary short control routing outside differential-pair corridors; each
      raw GPIO reaches its 1 kohm series resistor before any local branch.
    verify: >
      ERC, exact-net and truth-table audit proving DATA_OK equals PWR_EN AND
      DATA_EN, plus unpowered-Pi and boot-time fail-safe bench tests.

  GND_RETURN:
    intent: >
      Common signal, power, ESD and connector reference.  Ground is never
      switched, and no Raspberry Pi supply pin is used.
    nets: [GND]
    current: "return (planes)"
    min_width: 0.30mm
    clearance: 0.17mm
    routing: >
      Solid L2 ground plane with top/bottom return pours, connector and ESD
      stitching, and no split or void beneath any USB 2 or USB 3 route.
    verify: >
      Plane-continuity and return-path review, stitch-via census, DRC and
      loaded ground-offset measurement at each upstream/downstream connector.

# Pair matching is graded on realized copper after the schematic/netlist has
# fixed every series boundary.  The source gate must not claim measurements or
# an impedance geometry that does not yet exist.
length_match: []
