# The 0.5 mm-pitch USB 3 redriver and 0.4 mm-pitch USB 2 switch require the
# JLCPCB four-layer advanced tier selected by ADR-0005.  This file establishes
# executable net ownership before schematic capture. It uses a 0.17 mm
# ordinary-net clearance so the exact TI RSE land's 0.175 mm
# diagonal pad spacing is legal. Differential geometry remains independently
# fixed at 0.25 mm width / 0.18 mm gap by the routed-pair contract and retained
# stackup solve; the JLC order-time calculator/process echo remains mandatory.
fab_tier: jlc_4layer_advanced
default_clearance: 0.17mm
default_track_width: 0.18mm

# Package-local 3V3 necks.  These relax the 0.40 mm robustness floor only
# where the actual 0.50/0.40 mm-pitch lands cannot accept it at the retained
# clearance; all downstream copper remains 0.40 mm.  The loads are bypass-
# branch currents, far below the ampacity of even the narrowest 0.30 mm neck.
scoped_floors:
  - {zone: u2_3v3_pin1_neck, nets: [3V3], min_width: 0.35mm, why: "U2 pin 1 is a 0.25 mm-high land on 0.50 mm pitch; a 0.50 mm-long 0.35 mm neck bonds directly to C15 before widening to 0.40 mm."}
  - {zone: u8_3v3_pin1_neck, nets: [3V3], min_width: 0.35mm, why: "Channel-2 translation of the measured U2 pin-1 package neck, directly into C31."}
  - {zone: u14_3v3_pin1_neck, nets: [3V3], min_width: 0.35mm, why: "Channel-3 translation of the measured U2 pin-1 package neck, directly into C47."}
  - {zone: u20_3v3_pin1_neck, nets: [3V3], min_width: 0.35mm, why: "Channel-4 translation of the measured U2 pin-1 package neck, directly into C63; prevents the router's former 0.25/0.15 mm via-in-pad escape."}
  - {zone: u2_3v3_pin13_neck, nets: [3V3], min_width: 0.349mm, why: "U2 pin 13 uses the router-measured 0.3498 mm package exit, widening to 0.40 mm within 0.15 mm of the land."}
  - {zone: u8_3v3_pin13_neck, nets: [3V3], min_width: 0.349mm, why: "Channel-2 translation of the measured U2 pin-13 package exit."}
  - {zone: u14_3v3_pin13_neck, nets: [3V3], min_width: 0.349mm, why: "Channel-3 translation of the measured U2 pin-13 package exit."}
  - {zone: u20_3v3_pin13_neck, nets: [3V3], min_width: 0.349mm, why: "Channel-4 translation of the measured U2 pin-13 package exit."}
  - {zone: u3_3v3_pin10_neck, nets: [3V3], min_width: 0.29mm, why: "U3 pin 10 is 0.35 mm wide on 0.40 mm pitch; the router-measured 0.30 mm neck is 0.24 mm long before widening to 0.40 mm."}
  - {zone: u9_3v3_pin10_neck, nets: [3V3], min_width: 0.29mm, why: "Channel-2 translation of the measured U3 pin-10 package neck."}
  - {zone: u15_3v3_pin10_neck, nets: [3V3], min_width: 0.29mm, why: "Channel-3 translation of the measured U3 pin-10 package neck."}
  - {zone: u21_3v3_pin10_neck, nets: [3V3], min_width: 0.29mm, why: "Channel-4 translation of the measured U3 pin-10 package neck."}
  - {zone: u7_3v3_pin5_escape, nets: [3V3], min_width: 0.18mm, why: "U7 pin 5 is boxed between USB1_HS_DN and DATA_EN1; this short local logic-supply escape clears the package, then joins the 0.40 mm rail. At 0.45 A, 0.18 mm remains above the independent 0.10 mm ampacity screen."}
  - {zone: u25_3v3_pin5_escape, nets: [3V3], min_width: 0.18mm, why: "Channel-4 U25 pin 5 is boxed between USB4_HS_DN and DATA_EN4; this short local logic-supply escape clears the package, then joins the 0.40 mm rail. At 0.45 A, 0.18 mm remains above the independent 0.10 mm ampacity screen."}

classes:
  USB_SS:
    intent: >
      All board-owned 5 Gbit/s SuperSpeed segments.  TX names follow host-to-
      device flow and RX names follow device-to-host flow; UP is the USB-B/Pi
      side and DN is the USB-A/device side.  CONN and IC suffixes preserve the
      AC-coupling-capacitor boundaries instead of pretending each conductor is
      one continuous net.
    nets:
      - USB1_SS_TX_UP_CONN_P
      - USB1_SS_TX_UP_CONN_N
      - USB1_SS_TX_UP_MID_P
      - USB1_SS_TX_UP_MID_N
