gotchas:
  - "EN_RXD is active high. The internal 660kOhm pulldown makes loss of control fail-safe disconnected, but the board also drives it only from the hardware PWR_EN AND DATA_EN interlock."
  - "Follow Figure 8-2 rather than generic transmitter folklore: fit 100nF in series with RX1P/N, TX1P/N and TX2P/N. For the USB-A-side RX2P/N pair, fit the optional 330nF plus one 220kOhm-to-ground resistor per conductor from Figure 8-1 so a sustained short to VBUS is blocked. That is eight AC capacitors per redriver."
  - "EQ1/EQ2, DE1/DE2 and OS1/OS2 are three-level analog strap inputs, not ordinary binary GPIO. The board provides deterministic, documented population straps and never leaves them floating."
  - "TI warns that external ESD protection with a clamp voltage above 4V can require series resistance. Both board connectors are externally touchable, so this design places 2.2Ohm on every SuperSpeed conductor between the redriver-side coupling network and each connector-side ESD array: eight resistors per channel. This is a first-article SI item, not a USB-IF compliance claim."
  - "Do not swap channel directions from the part number or symbol intuition. Figure 5-1 is the authority for RX1->TX1 and RX2->TX2 pin numbering."
verified: "TI SLLSEV9E Figure 5-1 RGE top view and Table 5-1, printed pp.3-4, independently read 2026-08-14; supply, enable and tuning behavior re-read from sections 6-8."
layout:
  source: "TI SLLSEV9E sections 10.1-10.2 and Figure 10-1"
  reviewed: 2026-08-14
  keep_short:
    - {net: 3V3, max_span_mm: 3.5, partner_refs: [C14, C15, C16, C30, C31, C32, C46, C47, C48, C62, C63, C64], why: "three local rail capacitors are reserved at each redriver VCC pin pair; 3.5mm is the package-local pin-centre budget of the realized symmetric placement"}
  notes:
    - "Keep each redriver inside its channel's straight connector-to-connector corridor. Connector-to-redriver proximity is a multi-segment routed-path requirement across series ESD resistors and AC-coupling capacitors, not a direct shared-net adjacency; grade it through the explicit differential-pair route and realized-length contracts."
    - "Route each pair on one layer over continuous ground, 90Ohm differential, intra-pair mismatch <=0.05mm, no plane split, no stubs, and no more than two vias per conductor."
    - "Use bends of at least 135 degrees or arcs; separate unrelated high-speed pairs by at least five trace widths where the floorplan permits."
    - "Keep each required AC-coupling capacitor somewhere between its connector and redriver, preserving pair symmetry. Keep the ESD array connector-close and its 2.2Ohm series resistors adjacent to the ESD boundary; TI confirms capacitor physical location is not critical when the correct value and body size are used."
