gotchas:
  - "One array protects exactly the three differential pairs at each exposed USB3 connector: D+/D-, SSTX and SSRX. VBUS needs separate power-path protection."
  - "The array clamps an ESD event but is not an overvoltage protector for a sustained miswire."
  - "The roughly 10V high-current clamp is above TUSB522P's 4V external-clamp guidance; the board therefore includes 2.2Ohm on SuperSpeed conductors between each redriver I/O and connector-side array. Validate this choice on the first article."
  - "RVZ pins 1-4, 6 and 7 are internally NC but TI explicitly reserves them for optional straight-through routing. On the PCB, route continuously from each protected I/O land to the opposite NC land and assign both lands to the same external net; do not leave the opposite land on an autogenerated unconnected net."
verified: "TI SLVSBO7O RVZ top-view pin figure and Table 5-1, printed pp.3-4, plus electrical and IEC tables, independently read 2026-08-14."
