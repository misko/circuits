          - {layer: F.Cu, width: 0.25, pts: [[147.500, 67.150], [149.800, 67.150], [150.925, 67.500], [152.275, 67.500], [153.200, 67.500], [153.200, 64.500], [154.700, 64.500]]}
        vias: [[140.500, 72.600], [147.500, 67.150]]
      - net: USB2_SS_RX_DN_CONN_P
        pin: J6.6
        segments:
