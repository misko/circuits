      # Channel 1 downstream RX: cross after the 5 V B.Cu spine, return to F.Cu
      # immediately before the board-side NC lands, then flow through U6.
      - net: USB1_SS_RX_DN_CONN_N
        pin: J4.5
        segments:
          - {layer: F.Cu, width: 0.25, pts: [[136.510, 44.600], [140.500, 44.600]]}
          - {layer: B.Cu, width: 0.25, pts: [[140.500, 44.600], [147.500, 39.150]]}
          - {layer: F.Cu, width: 0.25, pts: [[147.500, 39.150], [149.800, 39.150], [150.925, 39.500], [152.275, 39.500], [153.200, 39.500], [153.200, 36.500], [154.700, 36.500]]}
        vias: [[140.500, 44.600], [147.500, 39.150]]
      - net: USB1_SS_RX_DN_CONN_P
