          - {layer: F.Cu, width: 0.25, pts: [[147.500, 67.850], [149.800, 67.850], [150.925, 68.000], [152.275, 68.000], [153.800, 68.000], [153.800, 66.500], [154.700, 66.500]]}
        vias: [[140.500, 73.800], [147.500, 67.850]]
      - {net: GND, why: "USB2 upstream RX first layer transition return", vias: [[42.200, 68.300], [44.000, 68.500]]}
