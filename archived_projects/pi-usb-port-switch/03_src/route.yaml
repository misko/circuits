stitch:
  clearance: 0.20
  via:
    size: 0.45
    drill: 0.20
    spacing: 0.50
    pth_margin: 0.25
    tiers:
      - {size: 0.45, drill: 0.20, hole_to_copper: 0.205}
  keepin: {inset: 0.8}
  passes: [dedupe_vias, normalize_vias, protect_via_in_pad, drop_micro_fragments, drop_dangling,
           split_t_junctions, reload, hole_to_hole, stitch_grid, fill, island_rescue,
           dedupe_vias, hole_to_hole, prune_stitch_dangling, fill, fresh_reload,
           prune_stitch_dangling, fill, fresh_reload, heal_islands, gate]
  dedupe_vias: {radius: 0.35, metric: box}
  normalize_vias: {below_width: 0.24, size: 0.25, drill: 0.15}
  # Every realized barrel beneath an SMT paste land is assigned to the same
  # fabricator-visible Type-VII drill family as the source-owned thermal vias.
  protect_via_in_pad:
    via: {size: 0.35, drill: 0.25}
    via_protection: {capping: yes, filling: yes}
    min: 36
  # A 5 um anchor tolerance distinguishes a true endpoint join from the
  # router's 14 um rounding whiskers; the legacy 50 um tolerance incorrectly
  # treated those whiskers as served by a nearby, but disjoint, endpoint.
  drop_micro_fragments: {max_length: 0.12, require_free_end: true, anchor_tol: 0.005}
  drop_dangling: {max_length: 1.0, tol: 0.05, sweeps: 4}
  split_t_junctions: {tol: 0.05}
  hole_to_hole: {min_gap: 0.25, mode: nudge, prefer_keep: [GND, P5V_PROTECTED, VBUS1_SW, VBUS2_SW, VBUS3_SW, VBUS4_SW]}
  # GND pads connect through the continuous F/B pours into the stitched inner
  # planes.  Do not run per-pad A* rescue here: dense USB packages create many
  # equivalent candidate paths and make that fallback effectively unbounded.
  # The filled-board DRC names any genuinely starved thermal; those pads receive
  # explicit floorplan pad_overrides instead of speculative rescue tracks.
  island_rescue: {min_bbox: 0.8, layers: [F.Cu, B.Cu, In1.Cu, In2.Cu], require: all}
  heal_islands: {min_bbox: 0.1, layers: [F.Cu, B.Cu], sample_step: 0.05, max_gap_candidates: 2500, clear_rescue_failures: true}
  prune_stitch_dangling: {tol: 0.05, min_layers: 2}
  stitch_grid:
    net: GND
    x: [22.0, 168.0, 6.0]
    y: [22.0, 138.0, 6.0]
