# Hardware-only routing contract for the Pi-controlled four-port USB fixture.
# Every one of the 96 SuperSpeed nets and 16 USB2 nets is inventoried as a
# polarity-aware differential pair. SuperSpeed core/TX paths remain F.Cu and
# zero-via. Eight connector-side SuperSpeed RX pairs and all eight USB2 pairs
# use short, matched B.Cu bypasses
# between paired signal transitions with nearby GND return vias; B.Cu is
# referenced to continuous In2.Cu in the symmetric four-layer stackup.
# Geometry is solved for JLC04161H-7628: 0.25 mm width / 0.18 mm gap gives
# 89.53 ohm in the retained coated finite-difference solve (dx=0.004 mm).
project:
  name: pi_usb_port_switch
  board: 04_kicad/pi_usb_port_switch.kicad_pcb
  build_dir: 06_build/route

flow:
  heartbeat_s: 10
  rebuild_args: [--resume-after-schematic-review]
  pre_route_reviews:
    board: 04_kicad/pi_usb_port_switch.kicad_pcb
    netlist: 06_build/netlists/pi_usb_port_switch.net
    topology: 08_reviews/pre-route_topology.md
    schematic_pdf: 03_tscircuit/build/schematic.pdf
    schematic_render: 08_reviews/pre-route_schematic_render.md
    pin: 08_reviews/pre-route_pin.md
    layout: 08_reviews/pre-route_layout.md
    render: 08_reviews/pre-route_render.md
    a_render: 06_build/pre_route/twin_overlay.md
  owner:
    stage: placement
    files: [03_src/floorplan.yaml, 03_src/route.yaml]
  copper:
    deterministic: [prep.seed_stubs, taps.connections, stitch.seed_stubs, route.final]
    stochastic: [route.waves]
  budgets_s:
    placement_review_prepare: 180
    route_import: 300
    stitch: 900
    rebuild: 1800
    layout_drc: 240
  timeouts_s:
    default: 600
    source_schema_governance: 60
    adr_bound_governance: 60
    placement_review_prepare: 420
    route_wave: 1200
    route_race: 3600
    route_evaluate: 240
    route_import: 300
    stitch: 1200
    rebuild: 1800
    layout_drc: 240
  blockers:
    - "Exact placement pin/layout/render review must pass before routing"
    - "All 56 physical differential pairs must preserve polarity, coupling, and continuous adjacent-plane reference; only the eight contracted connector RX pairs and eight USB2 pairs may use matched F.Cu/B.Cu transitions with explicit nearby GND return vias"
    - "Power copper, JLC assembly preview, controlled-impedance acknowledgement, and first-article USB qualification remain mandatory"

prep:
  out: r0.kicad_pcb
  keepouts:
    layers: [User.2, User.3]
    mounting_holes: {radius: 3.0}
    edge_band: 0.7
    rects: []
  # TI SLVSBO7O Table 4-3 and Figure 7-11 define the opposite NC lands as
  # optional straight-through routing lands.  Each connector net therefore
  # runs continuously through its protected I/O land and the same-net NC land.
  # The connector and TUSB522 lane groups have opposite physical Y order, so
  # RX crosses on B.Cu between matched via pairs over continuous In2.Cu while
  # TX remains on F.Cu over In1.Cu.  Channel 1 is the geometry pilot; translated
  # launches are added only after its saved-board DRC and visual route review.
  seed_stubs:
    clearance: 0.20
    # Localized advanced-tier signal transitions: the 0.30/0.20 mm geometry
    # clears the 0.5 mm protection/switch escape while retaining a practical
    # 7.9:1 through-hole aspect ratio. General router vias remain 0.45/0.20.
    via: {size: 0.30, drill: 0.20}
    stubs:
      # Channel 1 upstream RX: flow through U5, then make the layer crossover.
      - net: USB1_SS_RX_UP_CONN_N
        pin: J3.5
        segments:
          - {layer: F.Cu, width: 0.25, pts: [[37.000, 38.500], [38.000, 39.500], [39.525, 41.500], [40.875, 41.500], [41.600, 41.500], [43.000, 41.000]]}
          - {layer: B.Cu, width: 0.25, pts: [[43.000, 41.000], [48.100, 44.600], [54.500, 44.600]]}
          - {layer: F.Cu, width: 0.25, pts: [[54.500, 44.600], [55.490, 44.600]]}
        vias: [[43.000, 41.000], [54.500, 44.600]]
      - net: USB1_SS_RX_UP_CONN_P
        pin: J3.6
        segments:
          - {layer: F.Cu, width: 0.25, pts: [[37.000, 40.250], [37.800, 42.000], [39.525, 42.000], [40.875, 42.000], [41.600, 42.000], [43.000, 42.200]]}
          - {layer: B.Cu, width: 0.25, pts: [[43.000, 42.200], [48.000, 45.800], [54.500, 45.800]]}
          - {layer: F.Cu, width: 0.25, pts: [[54.500, 45.800], [55.490, 45.800]]}
        vias: [[43.000, 42.200], [54.500, 45.800]]
      # Channel 1 upstream TX: true top-layer flow-through path across U5.
      - net: USB1_SS_TX_UP_CONN_N
        pin: J3.8
        segments:
          - {layer: F.Cu, width: 0.25, pts: [[37.000, 45.250], [38.300, 44.000], [39.525, 44.000], [40.875, 44.000], [43.000, 44.000], [44.800, 42.200], [55.490, 42.200]]}
      - net: USB1_SS_TX_UP_CONN_P
        pin: J3.9
        segments:
          - {layer: F.Cu, width: 0.25, pts: [[37.000, 47.000], [38.000, 47.000], [38.500, 45.000], [39.525, 44.500], [40.875, 44.500], [43.000, 45.200], [46.000, 45.200], [48.000, 43.400], [55.490, 43.400]]}
      # Channel 1 downstream TX: true top-layer flow-through path across U6.
      - net: USB1_SS_TX_DN_CONN_N
        pin: J4.8
        segments:
          - {layer: F.Cu, width: 0.25, pts: [[136.510, 42.200], [149.000, 42.200], [150.925, 42.000], [152.275, 42.000], [153.400, 42.000], [154.700, 42.500]]}
      - net: USB1_SS_TX_DN_CONN_P
