route:
  krt: ~/gits/KiCadRoutingTools
  # KRT's isolated environment carries numpy/scipy/shapely; the system KiCad
  # interpreter can import pcbnew but cannot execute the coupled router.
  kicad_python: /home/mouse9911/gits/KiCadRoutingTools/.venv/bin/python
  import_source: build
  race: 1
  preflight_critical_pairs:
