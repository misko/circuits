via_ampacity:
  source: "Texas Instruments SLVA959B Rev B, Table 3-1 (IPC-2152): https://www.ti.com/lit/an/slva959b/slva959b.pdf"
  method: "sum published 10 C-rise capacity by finished hole; no credit for fill material"
  temperature_rise_c: 10
  capacity_by_finished_hole_mm: {0.20: 0.55, 0.25: 0.81, 0.30: 0.84}
  transfers:
    - {name: protected_5v_header_bank, net: P5V_PROTECTED,
       rect: [90.0, 24.8, 94.0, 29.9], minimum_vias: 8,
       required_continuous_a: 4.05,
       why: "all four 0.9 A ports plus 0.45 A local logic cross from the F.Cu protection island to the B.Cu distributor"}
    - {name: port1_input_drop, net: P5V_PROTECTED, rect: [135.2, 52.1, 136.8, 52.8], minimum_vias: 2, required_continuous_a: 0.9, why: "TPS2557 channel-1 input island to protected distributor"}
    - {name: port2_input_drop, net: P5V_PROTECTED, rect: [135.2, 80.1, 136.8, 80.8], minimum_vias: 2, required_continuous_a: 0.9, why: "TPS2557 channel-2 input island to protected distributor"}
    - {name: port3_input_drop, net: P5V_PROTECTED, rect: [135.2, 108.1, 136.8, 108.8], minimum_vias: 2, required_continuous_a: 0.9, why: "TPS2557 channel-3 input island to protected distributor"}
    - {name: port4_input_drop, net: P5V_PROTECTED, rect: [135.2, 136.1, 136.8, 136.8], minimum_vias: 2, required_continuous_a: 0.9, why: "TPS2557 channel-4 input island to protected distributor"}
    - {name: port1_output_drop, net: VBUS1_SW, rect: [142.0, 53.0, 143.5, 53.8], minimum_vias: 2, required_continuous_a: 0.9, why: "channel-1 F.Cu output collector to B.Cu connector branch"}
    - {name: port2_output_drop, net: VBUS2_SW, rect: [142.0, 81.0, 143.5, 81.8], minimum_vias: 2, required_continuous_a: 0.9, why: "channel-2 F.Cu output collector to B.Cu connector branch"}
    - {name: port3_output_drop, net: VBUS3_SW, rect: [142.0, 109.0, 143.5, 109.8], minimum_vias: 2, required_continuous_a: 0.9, why: "channel-3 F.Cu output collector to B.Cu connector branch"}
    - {name: port4_output_drop, net: VBUS4_SW, rect: [142.0, 137.0, 143.5, 137.8], minimum_vias: 2, required_continuous_a: 0.9, why: "channel-4 F.Cu output collector to B.Cu connector branch"}

taps:
  clearance: 0.20
  via: {size: 0.60, drill: 0.30, hole_to_copper: 0.205}
  connections:
    # U7.5 and U25.5 are boxed between the USB2 pair and GPIO-control escape
    # on F.Cu.  Two narrow package-neck taps cross that local fence on B.Cu
    # and rejoin already-connected 3V3 copper; this is deterministic instead
    # of asking the general multi-point router to rediscover a zero-slack exit.
    - {net: 3V3, from: U7.5, to: [118.25, 52.75], width: 0.18,
       layer: F.Cu, hop_layer: B.Cu,
       via: {size: 0.45, drill: 0.20, hole_to_copper: 0.205}}
    - {net: 3V3, from: U25.5, to: [118.75, 136.25], width: 0.18,
       layer: F.Cu, hop_layer: B.Cu,
       via: {size: 0.45, drill: 0.20, hole_to_copper: 0.205}}
    # R50.2 is pinched into a second small F.Cu GND island after the complete
    # high-speed/control route is refilled.  This measured off-pad location is
    # inside that island and clears the B.Cu signal field, so an ordinary via
    # joins it to both internal GND planes without creating via-in-pad solder
    # wicking on the 0402 land.
    - {net: GND, from: [107.05, 32.70], width: 0.30, layer: F.Cu, plane: true, drop: true, via: {size: 0.45, drill: 0.20, hole_to_copper: 0.205, exact: true}}
    # R53.2 is the only other pad-bearing F.Cu GND island that cannot accept
    # an automatically placed legal rescue via after the complete refill.
    # This off-pad point is inside its island and clears every routed layer.
    - {net: GND, from: [112.96, 32.65], width: 0.30, layer: F.Cu, plane: true, drop: true, via: {size: 0.45, drill: 0.20, hole_to_copper: 0.205, exact: true}}
    # R51.2's local F.Cu ground island cannot accept a via-in-pad because the
    # plated barrel would intersect the deterministic TUSB_OS1 route on B.Cu.
    # This measured off-pad point lies in the same island and has full-stack
    # copper/hole clearance, so one ordinary via joins it to both GND planes.
    - {net: GND, from: [108.892, 33.066], width: 0.30, layer: F.Cu, plane: true, drop: true, via: {size: 0.45, drill: 0.20, hole_to_copper: 0.205, exact: true}}
    # Aggregate F.Cu-to-B.Cu transfer: eight ordinary off-pad barrels provide
    # 6.72 A at the retained 10 C-rise screen versus 4.05 A required.
    - {net: P5V_PROTECTED, from: [90.5, 25.2], width: 1.0, layer: F.Cu, plane: true, drop: true, via: {size: 0.60, drill: 0.30, hole_to_copper: 0.205, exact: true}}
    - {net: P5V_PROTECTED, from: [91.5, 25.2], width: 1.0, layer: F.Cu, plane: true, drop: true, via: {size: 0.60, drill: 0.30, hole_to_copper: 0.205, exact: true}}
