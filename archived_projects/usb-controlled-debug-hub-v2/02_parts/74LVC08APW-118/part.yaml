gotchas:
  - "U_PWR_AND is a hardware policy interlock: every external TPS259470A EN is HUB_PRTPWR AND PWR_CMD. U_DATA_AND further requires PWR_EN AND DATA_CMD before the data switch can connect. Do not replace either condition with host-software-only sequencing."
  - "The expander command inputs must not float. One external 10k pulldown on each PWR_CMD and DATA_CMD holds all external ports fully off while the management path is unpowered or resetting."
  - "Use the PW TSSOP-14 suffix. Other package suffixes have the same logic but different land patterns."

