gotchas:
  - "The complete TPS259804O suffix matters: 4 selects the fixed 16.9V OVLO family and O selects circuit-breaker response. RETRY_DLY tied to GND selects latch-off."
  - "R_AGG_ILIM=300 ohm 1% and 100ppm/C. Charging TI's characterized 300-ohm row for 1% initial tolerance and a 100C temperature excursion gives 4.2745 to 5.7755A."
  - "C_AGG_TIMER=6.8nF C0G, Delta-VITIMER=0.7..1.3V and IITIMER=1.4..2.8uA give a charged 1.61..6.65ms blanking interval."
  - "C_AGG_DVDT=3.3nF C0G and TI CdVdt(pF)=4600/SR(V/ms) give about 1.394V/ms nominal slew and about 0.351A into the declared 251.86uF maximum effective bank."
  - "Tie EN/UVLO directly to IN for this 5V-only stage. Tie RETRY_DLY, NRETRY and LDSTRT to GND; leave IMON and open-drain PG unconnected."
