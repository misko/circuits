gotchas:
  - "TPS2557 EN is active HIGH. The AND-gate output PWR_EN drives it, with a physical pulldown so an unpowered management path defaults VBUS off. TPS2556 is the active-low sibling and must not be substituted silently."
  - "U_PWR_CTRL uses 187kOhm 1% at ILIM, the maximum TI-recommended value. TI section 10.2.1.2.2 equations and resistor tolerance give approximately 468-706mA; 210kOhm is outside the recommended 20-187kOhm programming range and must not be used."
  - "At 0.5A, guaranteed 35mOhm consumes 17.5mV. Use all IN/OUT pins and the full PowerPAD land."
  - "FAULT is active-low open-drain and connects directly to the matching USB2517 OCS input. It does not cross into the separately powered management-expander domain."
verified: "TI SLVS931B DRB top-view figure and pin table, printed p.3, confirm pins 1 GND, 2-3 IN, 4 active-high EN, 5 ILIM, 6-7 OUT, 8 FAULT and PowerPAD GND; electrical table and current-limit row re-read 2026-08-14."
layout:
  source: "TI SLVS931B sections 12.1-12.3 and Figure 39"
  reviewed: 2026-08-14
  keep_short:
    - {net: ILIM_CTRL, max_span_mm: 2, partner_refs: [R_ILIM_CTRL], why: "internal management-port current-setting resistor adjacent to pin 5"}
    - {net: P5V_PROTECTED, max_span_mm: 4, partner_refs: [C_PWR_CTRL_IN], why: "the retained TPS2557 management switch requires its 100nF input bypass directly at IN/GND"}
  notes:
  - "Use broad copper across both IN and both OUT lands, place the management input/output capacitors and ILIM resistor locally, and connect PowerPAD to ground using the advanced-tier filled/capped via process."
layout_refs:
  - "TI SLVS931B section 12 and Figure 39"
