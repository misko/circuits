  source: "Amphenol RJHSE-538X recommended PCB layout (catalogue p.6) + proven-parts ledger: mating face on the SNAP-POST side; board-lock NPTH posts fenced with hole keepouts before routing; dense GND tail field set to SOLID zone connection (2-layer thermal starvation lesson carried to inner planes)."
  reviewed: "2026-07-23"
  notes: "8x port bank on the NORTH edge, mouths outward; per-port ESD (TPD2E2U06) + PTC (MINISMDC050) hard behind each jack; board-lock posts get hole keepouts; GND tails SOLID zone connection; NOT-ETHERNET custom pinout silk-labelled at each jack."
