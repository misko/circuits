datasheet:
  doc_id: Littelfuse-SMAJ-series
  revision: BA-102120          # datasheet "Revised BA-10/21/20" (in PDF filename)
  url: https://www.littelfuse.com/assetdocs/tvs-diodes-smaj-datasheet
