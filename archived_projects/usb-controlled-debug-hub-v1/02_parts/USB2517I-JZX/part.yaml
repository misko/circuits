gotchas:
  - "PRTPWR1..7 are active-high outputs; the external port switch must accept 3.3 V active-high enable. OCS1_N..7_N expect an active-low open-drain fault and have internal pull-ups."
  - "Port numbering is non-monotonic around the package. Use Figure 3-1/Table 5-1, not geometric intuition: PRTPWR5 is pin 30, PRTPWR6 pin 39, and PRTPWR7 pin 36."
  - "The 2021 checklist text contains two editorial errors: its Figure 3-1 and the datasheet correctly place VDD18PLL on pin 62 (not checklist prose pin 23), and its PRTPWR paragraph repeats 'drives low' for ON although the datasheet and Figure 5-2 require active-high enable."
  - "Pin 19 TEST has an internal pulldown; leave it unconnected. Unused downstream ports must be disabled through SMBus configuration or reset straps."
  - "For SMBus-slave configuration use CFG_SEL[2:0]=001 and address 0b0101100 (0x2C 7-bit). Configuration must complete before hub attach; EEPROM/SMBus/default methods cannot be mixed."
  - "VBUS_DET should sense upstream VBUS through the checklist's high-impedance 100k/100k divider; tying it to 3.3 V loses host-VBUS disconnect/reset detection."
  - "Each VDDA33 pin (5,10,52,57) needs 100 nF locally plus one shared 1 uF; VDD33CR needs 1 uF plus 100 nF; VDD33 and VDD33PLL each need 100 nF; VDD18 and VDD18PLL each need 1 uF low-ESR to VSS. Do not power loads from the 1.8 V regulator outputs."
  - "The USB protection/connector capacitance budget is 5 pF total. Put low-capacitance ESD directly in-line at each connector with no branch stub and a very short plane return."

verified: "CITED: complete 1-64 map read from DS00001598C Figure 3-1 PDF p7 and cross-checked against Table 5-1 PDF pp11-16 plus Microchip EVB-USB2517 schematic sheet 2; pad 65 realization cross-checked against the EVB symbol VSS(FLAG) and selected footprint. 2026-07-31."

layout:
  source: "Microchip DS00004211A Sections 3-7 and Figures 3-1/4-1/5-1/5-2/6-1; EVB-USB2517 Rev A Gerber + IPC netlist inspected 2026-07-31"
  reviewed: 2026-07-31
  notes:
    - "Use four layers with an unbroken ground reference immediately below the USB routing; route each 90 ohm differential pair without stubs and keep pair members symmetric."
    - "Reserve all four QFN sides for outward escape. Put the four VDDA33 100 nF capacitors at pins 5/10/52/57 and the other regulator capacitors at their named supply pins before routing signals."
    - "Place the 12 k RBIAS resistor directly at pin 63 with a dedicated low-impedance ground return; keep the 24 MHz crystal, 1 M parallel resistor, and load capacitors tight to pins 60/61 and isolated from USB traces."
    - "Tie exposed pad 65 to the ground plane with the selected footprint's thermal-via array."
    - "Orient the controller so downstream pair pin groups face their connector/switch banks; use PortSwap only as an explicit configured decision, never to mask an undocumented footprint error."
    - "PRT_SWPn is sampled only when CFG_SEL enables strap options. When asserted, logical D+ belongs on the physical DM pad and logical D- on the physical DP pad; bind the pad-net inversion and the matching PRT_SWP resistor in executable invariants so a routing convenience cannot become an unconfigured USB polarity reversal."
    - "DS00004211A Section 8.8 specifies 100 kOhm for the PRT_SWP strap: pull to 3.3 V for swapped polarity and to GND for normal polarity. The current CFG_SEL[2:0]=000 mode enables these hardware straps."

