electrical:
  source: "DS20005565D Table 4-1 and Sections 1.6/1.13"
  vdd: 5.0
  vdd_net: VBUS_CTRL
gotchas:
  - "MCP2221A is already a programmed USB bridge; do not create or flash project firmware. The HID function transports I2C operations using the manufacturer protocol."
  - "At VDD=5 V the SDA/SCL and GPIO high levels are in the 5 V domain. The receiving 74LVC08 inputs are explicitly 5.5 V tolerant while powered at 3.3 V."
  - "VUSB is the internal USB-transceiver regulator output and requires 0.22-0.47 uF locally. It is not a general-purpose 3.3 V rail."
  - "Factory USB attributes are bus-powered and 100 mA. Powering VDD from physical hub port 1 VBUS keeps that descriptor electrically truthful."
  - "Unused UART/GPIO pins remain unconnected; the command path uses only SCL and SDA."
verified: "CITED: 14-pin PDIP/SOIC/TSSOP top-view map and Table 1-1, DS20005565D pp2-4; factory bus-power and 100 mA fields from Registers 1-9/1-10, pp10-11; checked 2026-08-15."
layout:
  source: "Microchip DS20005565D Sections 1.6 and 1.13 plus the 14-pin package drawing"
  reviewed: 2026-08-15
  keep_short:
    - {net: VBUS_CTRL, max_span_mm: 4, anchor_pins: ["1"], partner_refs: [C_CTRL_VDD], why: "Place the VDD bypass directly between VDD(1) and VSS(14)."}
    - {net: CTRL_VUSB_3V3, max_span_mm: 4, anchor_pins: ["11"], partner_refs: [C_CTRL_VUSB], why: "DS20005565D Section 1.6 requires a local high-quality 0.22-0.47 uF ceramic at VUSB."}
  notes:
    - "Keep the internal full-speed D+/D- pair direct from hub port 1; there is no connector branch or test-point stub."
    - "Keep SCL/SDA together with one pull-up pair to VBUS_CTRL and no unused long branches."
layout_refs:
  - {tier: 1, reached: true, artifact: "Microchip DS20005565D application connections, pin map, USB power, and I2C sections"}
  - {tier: 2, reached: true, artifact: "Microchip ADM00559 MCP2221A Breakout Module official schematic/layout precedent"}
  - {tier: 3, reached: false, artifact: "Community exact-MPN routed reference", why: "The official breakout and complete manufacturer application connections were sufficient for this low-density bridge."}
sourcing:
  lcsc: C640876
  digikey: MCP2221A-I/SL-ND
  note: "Exact SOIC-14 part is currently available from both JLC/LCSC and DigiKey; live quantities remain release-time evidence."
asserts:
  - assert: value
    equals: MCP2221A-I/SL
    why: "The A revision and /SL SOIC package are both load-bearing identities; the older MCP2221 has a different maximum UART rate."
