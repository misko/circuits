no_surge_exposed_paths: >-
  The admitted input is a bounded regulated SELV 5.20-5.25 V source; sustained
  overvoltage and cable-surge waveforms are outside the interface boundary.
  PESD2USB3UX-TR shunt arrays handle connector IEC ESD under datasheet placement and
  first-article obligations, not a sustained power-surge claim.
