  why: "Hand-solder THT barrel jack (not JLC-assembled; MANIFEST not_assembled). Our vendored DCJack_DC005_Horizontal holes sit at the exact Hroparts drawing Rev A positions (pin1 tip 0,0; pin2 sleeve 6.65,0; pin3 switch 2.55,4.70 - verified in board: pad2 6.65mm & pad3 2.55/4.70mm from pad1). Polarity verified: pad1=TIP=VIN_RAW(+12V), pad2=SLEEVE=GND, pad3=SWITCH=GND (center-positive convention). The twin 'mirror' vs JLC's EasyEDA is a THT top-vs-copper-side VIEW convention, not a land defect; the jack inserts into the 3 datasheet-positioned holes either way. First-power ritual multimeters polarity."
