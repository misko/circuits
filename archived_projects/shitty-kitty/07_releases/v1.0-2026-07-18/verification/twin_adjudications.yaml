# Reviewed jlc_twin findings, accepted with evidence. Each entry silences ONE
# (lcsc, status) finding class - never add one without the verification note.
# Populated 2026-07-18 during the twin stage.

# --- U9 AMS1117-3.3, SOT-223 --------------------------------------------------
# JLC footprint: pads 1,2,3 leads + pad 4 = tab. KiCad SOT-223-3_TabPin2 merges
# the tab into lead pad "2" (part.yaml: pad4=TAB=VOUT=electrically pin2).
# pad_alias 4->2 renames JLC's tab pad to ours, restoring correspondence
# (documented AMS1117 case in the jlcpcb-fab skill).
- lcsc: C6186
  refs: [U9]
  status: PAD-MISMATCH
  pad_alias: {'4': '2'}
  why: "SOT-223 tab convention: KiCad SOT-223-3_TabPin2 merges the tab into lead pad 2; JLC numbers the tab pad 4. pad_alias 4->2 restores the fit. part.yaml verified: pad4=TAB=VOUT electrically = pin2."
- lcsc: C6186
  refs: [U9]
  status: PAD-GEOM
  why: "Tab-naming artifact: 'pad1<->2 3.90 vs 2.30' compared our lead-2 to JLC's tab-2 before the 4->2 alias. Our SOT-223-3_TabPin2 is the KiCad standard IPC pattern; the 2.30mm lead pitch matches JLC exactly (pads 1,2,3 at x=2.97, 2.30mm spacing)."

# --- SW1/SW2 TS-1187A, 4-pad tact switch, 2 nets ------------------------------
# JLC 4 pads: 1,2 top edge (y=-1.85), 3,4 bottom edge (y=1.85). KiCad
# SW_Push_1P1T_XKB_TS-1187A merges the top rail (A-B) into pad "1" and the
# bottom rail (C-D) into pad "2" (part.yaml: A-B one contact, C-D the other;
# nets on OPPOSITE edges). alias JLC {1,2}->1, {3,4}->2.
- lcsc: C318884
  refs: [SW1, SW2]
  status: PAD-MISMATCH
  pad_alias: {'2': '1', '3': '2', '4': '2'}
  why: "TS-1187A 4-pad/2-net convention: JLC lists 4 corner pads (1,2 top rail; 3,4 bottom rail); KiCad merges each internally-shorted rail to one pad (1=top A-B, 2=bottom C-D, per part.yaml drawing rev A0). alias {1,2}->1,{3,4}->2 restores the fit; pairing verified (A-B & C-D each shorted, nets on opposite edges)."
- lcsc: C318884
  refs: [SW1, SW2]
  status: PAD-GEOM
  why: "Same 4-vs-2 pad merge: 'pad1<->2 3.75 vs 6.00' compared our merged-rail centroid to JLC's corner-pad diagonal before the alias. Our pad columns ARE 6.00mm apart in x (67<->73mm), matching JLC's L6.5 body; the y-rail spacing 3.76mm matches JLC's P3.70."

