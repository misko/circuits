schema: 1
source_type: external 12-24 V SELV DC supply
off_control: "remove or switch the external feed (BRIEF A2); no battery is present"
quiescent_ua: 0
input_trunk_class: PWR_IN
ir_floor_mohm: 70

rails:
  - &usb_port
    name: USB_PORT_1
    vin_min: 12.0
    vin_max: 24.0
    vout_min: 5.183925
    vout_max: 5.246075
    iout_max_A: 2.0
    converter: LTC3889IUKG#PBF
    eff: 0.88
    external_output: true
    claim_id: usb_downstream_ports
    load_uv_threshold: 4.75
    ir_budget_mohm: 135.0
    margin: 0.20
    ir_budget_components_mohm: &port_path
      protection_switch:
        value: 45.0
        basis: maximum
        evidence: "TPS259470A maximum RON over -40 to 125 C"
      pcb_copper_vias_joints:
        value: 10.0
        basis: budgeted_max
        evidence: "four-layer pours and via arrays; confirm by extraction and hot four-wire first-article measurement"
      mated_power_contacts:
        value: 80.0
        basis: qualified_max
        evidence: "USB1130 maximum 40 mOhm for each VBUS and GND mated contact"

  - <<: *usb_port
    name: USB_PORT_2
    ir_budget_components_mohm: *port_path
  - <<: *usb_port
    name: USB_PORT_3
    ir_budget_components_mohm: *port_path
  - <<: *usb_port
    name: USB_PORT_4
    ir_budget_components_mohm: *port_path

  - name: AUX_6V
    vin_min: 12.0
    vin_max: 24.0
    vout_min: 5.87
    vout_max: 6.13
    iout_max_A: 0.8
    converter: LMR36510FADDAR
    eff: 0.85
    external_output: false

  - name: LOGIC_3V3
    vin_min: 5.87
    vin_max: 6.13
    vout_min: 3.27
    vout_max: 3.33
    iout_max_A: 0.8
    converter: AP63203QWU-7
    input_parent: AUX_6V
    eff: 0.90
    external_output: false

# LTC3889 command 0x14DC represents 5.21484375 V. The declared 5 V window
# applies a conservative +/-0.6% full-temperature/programming allowance.
# At the worst-low rail, the complete 135 mOhm path at 2 A plus 20% residual
# margin drops 324 mV, leaving 4.860 V at the mated plug.
