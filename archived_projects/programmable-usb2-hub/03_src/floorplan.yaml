project:
  name: programmable_usb2_hub
  netlist: 06_build/netlists/programmable_usb2_hub.net
  output: 04_kicad/programmable_usb2_hub.kicad_pcb
  parts_dir: 02_parts
  fp_lib_table: 04_kicad/fp-lib-table

board:
  outline: {x0: 20.0, y0: 20.0, x1: 150.0, y1: 110.0}
  edge_width: 0.1
  layers: 4
  stackup:
    # JLCPCB JLC04161H-7628, 4-layer / 1.6 mm construction.  Keep the
    # published 0.2104 mm 7628 outer dielectrics in the native KiCad board so
    # the 0.25/0.15 mm USB geometry and its L2 reference-plane assumption are
    # tied to the order contract instead of prose alone.
    nominal_thickness_mm: 1.6
    thickness_tolerance_mm: 0.10
    copper_finish: ENIG
    dielectric_constraints: true
    mask_thickness_mm: 0.01
    copper_thickness_mm: [0.035, 0.0152, 0.0152, 0.035]
    dielectrics:
      - {type: prepreg, thickness_mm: 0.2104, material: "7628", epsilon_r: 4.4, loss_tangent: 0.02}
      - {type: core, thickness_mm: 1.0650, material: "FR4", epsilon_r: 4.4, loss_tangent: 0.02}
      - {type: prepreg, thickness_mm: 0.2104, material: "7628", epsilon_r: 4.4, loss_tangent: 0.02}
  mounting_holes:
    footprint: MountingHole:MountingHole_3.2mm_M3
    refdes_prefix: H
    at: [[24.0, 24.0], [146.0, 72.0], [24.0, 106.0], [146.0, 106.0]]
  fiducials:
    footprint: Fiducial:Fiducial_1mm_Mask2mm
    refdes_prefix: FID
    # FID2 is kept east of the port-4 connector courtyard while retaining
    # 4 mm nominal board-edge clearance for assembly vision access.
    at: [[28.0, 28.0], [146.0, 28.0], [28.0, 102.0]]

libraries: [03_src/lib, /usr/share/kicad/footprints]

placement:
  anchors:
    # North edge, connector mouths facing out.
    J3: [50.0, 24.0, 0]
    J4: [80.0, 24.0, 0]
    J5: [110.0, 24.0, 0]
    J6: [136.0, 24.0, 0]
    U17: [50.0, 32.0, 0]
    U18: [80.0, 32.0, 0]
    U19: [110.0, 32.0, 0]
    U20: [136.0, 32.0, 0]
    U13: [50.0, 38.0, 0]
    U14: [80.0, 38.0, 0]
    U15: [110.0, 38.0, 0]
    U16: [136.0, 38.0, 0]
    U9: [50.0, 45.0, 0]
    U10: [80.0, 45.0, 0]
    U11: [110.0, 45.0, 0]
    U12: [136.0, 45.0, 0]
    D4: [54.0, 46.5, 0]
    D5: [84.0, 46.5, 0]
    D6: [114.0, 46.5, 0]
    D7: [140.0, 46.5, 0]
    # Rail-side bypass for port 1 is pinned below U9.  Its former legalized
    # location at (55.5,39) sat inside the P1 USB pair corridor and boxed the
    # only remaining 5V_A terminal during routing.
    R429: [84.0, 39.0, 0]

    # Low-noise USB/control island.
    J2: [24.5, 53.0, 90]
    U5: [34.0, 53.0, 90]
    U6: [96.0, 59.0, 0]
    # USB2517 supply bypass ring.  These are intentionally anchored beside
    # the matching power-pin banks instead of legalized into the wider
    # control region.
    C32: [102.5, 68.0, 180]
    C33: [107.5, 68.0, 180]
    C34: [92.5, 66.4, 90]
    C35: [103.4, 62.3, 0]
    C36: [103.4, 59.8, 0]
    C37: [103.4, 56.25, 0]
    # Pad 1 faces north toward the matching bottom-edge supply pin.
    C38: [98.25, 51.7, 90]
    C39: [92.25, 51.7, 90]
    # PLL bypass is kept at the PLL supply pin rather than legalized into the
    # broad control region.
    C41: [94.5, 51.7, 90]
    C43: [82.1, 68.05, 0]
    # Keep the SDA pull-up out of the MCU west-side escape fanout.  Its
    # supply pad remains beside C43/3V3 while the signal pad faces south.
    R34: [82.1, 70.8, 90]
    # Crystal is immediately south of the hub XTAL pins, below the bypass
    # row, rather than across the control island.
    Y1: [95.5, 47.7, 0]
    # Keep the crystal load network inside the same compact island.  Leaving
    # these parts to the broad control-region legalizer produced 35--40 mm
    # XTAL detours; the pinned placements keep both load capacitors beside Y1
    # and the 1 MOhm feedback resistor between the hub bypass capacitors.
    C30: [91.2, 47.7, 90]
    C31: [99.4, 47.7, 90]
    R30: [96.375, 51.7, 90]
    # Rotate the MCU so its fixed USB D-/D+ pad order matches the hub's port-5
    # pad order.  Without this, two no-via F.Cu conductors have reversed
    # boundary endpoints and cannot be routed without a topological crossing.
    U7: [68.0, 59.0, 180]
    U8: [76.0, 70.0, 0]
    # Reset-state command pull-downs stay immediately south of U8. Keeping the
    # four parts together makes the hardware-off default visually auditable.
    R38: [70.0, 74.5, 0]
    R39: [73.5, 74.5, 0]
    R40: [78.5, 74.5, 0]
    R41: [82.0, 74.5, 0]
    J7: [25.5, 70.0, 90]

    # Protected input and logic supply, south-west.
    J1: [25.5, 97.0, 90]
    F1: [36.0, 98.0, 0]
    Q1: [55.0, 99.0, 0]
    Q2: [63.0, 99.0, 180]
    U1: [59.0, 91.0, 0]
    # LM74810 timing and threshold network is pin-local; long legalizer runs
    # on CAP/OV/UV would defeat the controller's transient behavior.
    C1: [62.5, 90.25, 0]
    R1: [53.5, 91.25, 0]
    R3: [55.5, 93.5, 0]
    R4: [54.0, 95.0, 0]
    R5: [57.56, 94.0, 90]
    D1: [70.0, 99.0, 90]
    # Keep the logic buck clear of the LM74810/FET gate-drive escape field.
    U4: [67.0, 82.0, 0]
    L3: [75.0, 82.0, 0]
    # Logic-buck output ceramics stay at the inductor output, clear of the
    # MCU reset-state command pull-down row (which the old manifest omitted).
    C23: [81.5, 77.8, 90]
    C24: [80.0, 82.8, 90]
    # AP63203 bootstrap capacitor bridges the adjacent BST/SW pins locally;
    # a remote bootstrap loop both boxed FB/3V3 and increased switch noise.
    C22: [69.9, 81.5, 90]

    # Dual LTC3889 power stage.  The controller sits between two compact,
    # mirrored FET/inductor/shunt cells; high-current and switch-node parts are
    # explicit anchors because generic legalization cannot infer loop area.
    U2: [107.0, 88.0, 0]
    Q3: [82.0, 89.5, 0]
    Q4: [90.0, 89.5, 0]
    L1: [82.0, 99.0, 0]
    R14: [93.0, 99.0, 0]
    Q5: [119.0, 89.5, 0]
    Q6: [127.0, 89.5, 0]
    L4: [121.0, 99.0, 0]
    R16: [131.0, 99.0, 0]
    C101: [98.0, 99.0, 0]
    C102: [103.0, 99.0, 0]
    C103: [98.0, 103.0, 0]
    C104: [103.0, 103.0, 0]
    C105: [136.0, 84.0, 0]
    C106: [136.0, 89.0, 0]
    C107: [136.0, 94.0, 0]
    C108: [136.0, 99.0, 0]
    C9: [106.0, 105.5, 0]
    C10: [110.0, 105.5, 0]
    C11: [106.0, 101.5, 0]
    C12: [110.0, 101.5, 0]
    C13: [108.0, 96.0, 0]
    C14: [112.0, 96.0, 0]
    C15: [102.0, 95.5, 0]
    C16: [105.0, 95.5, 0]
    C17: [99.0, 81.0, 0]
    C18: [102.0, 81.0, 0]
    C19: [110.0, 81.0, 0]
    C20: [113.0, 81.0, 0]
    C25: [96.0, 78.0, 0]
    C26: [114.0, 78.0, 0]
    D2: [101.0, 83.0, 0]
    C7: [104.0, 82.0, 0]
    D3: [113.0, 83.0, 0]
    C8: [110.0, 83.0, 0]
    R6: [96.0, 95.0, 90]
    R7: [96.0, 97.0, 90]
    C4: [99.0, 96.0, 90]
    R8: [116.0, 95.0, 90]
    R9: [116.0, 97.0, 90]
    C5: [113.0, 94.0, 90]

    # The independent auxiliary 6 V buck occupies the open south-east control
    # band, away from both LTC3889 hot loops and the USB2517 crystal island.
    U3: [121.0, 69.0, 0]
    L6: [133.0, 73.0, 90]
    C200: [115.0, 68.0, 90]
    C201: [115.0, 72.0, 90]
    C202: [142.0, 58.0, 0]
    C203: [142.0, 62.0, 0]
    C204: [142.0, 66.0, 0]
    C205: [118.0, 64.0, 0]
    C206: [127.0, 62.0, 0]
    R200: [129.0, 81.0, 0]
    R201: [132.5, 81.0, 0]
    R202: [121.0, 78.0, 0]

  pin:
    - "J*"
    - "U1"
    - "U2"
    - "U3"
    - "U4"
    - "U5"
    - "U6"
    - "U7"
    - "U8"
    - "U9"
    - "U10"
    - "U11"
    - "U12"
    - "U13"
    - "U14"
    - "U15"
    - "U16"
    - "U17"
    - "U18"
    - "U19"
    - "U20"
    - "Q*"
    - "L*"
    - "RS*"
    - "D1"
    - "F1"
    - "Y1"
    - "C30"
    - "C31"
    - "R30"
    - "C32"
    - "C33"
    - "C34"
    - "C35"
    - "C36"
    - "C37"
    - "C38"
    - "C39"
    - "C41"
    - "C43"
    - "C22"
    - "R34"
    - "C10*"
    - "C20*"
    - "R20*"

  # Preserve the original legalizer sequence (and therefore every other
  # promoted-route pad), then apply only these reviewed local placements.
  post_anchors:
    # Preserve the legalizer sequence, then correct the AP63203 cell. DS41326
    # requires C21 directly across U4 VIN/GND and output ceramics after L3.
    # P-ADJ names L3 explicitly: a same-net bootstrap capacitor is not the
    # inductor required by the AP63203 layout guide.  The vertical cell puts
    # L3.1 2.9 mm below U4.5 without crowding the pin-local bootstrap cap.
    L3: [68.0, 87.2, 270]
    C21: [63.1, 82.5, 90]
    C1: [62.8, 90.2, 0]
    C23: [73.2, 87.0, 90]
    C24: [77.2, 87.0, 90]
    # TPS259470 support parts are placed from the datasheet electrical
    # budgets before routing.  Cx2 is the local IN bypass, and Rx4 is the
    # ILIM programming resistor; all four repeated cells must satisfy the
    # shared 5V_A/5V_B and ILIM P-ADJ rows, not merely the worst old instance.
    C422: [49.75, 48.0, 270]
    R422: [46.0, 48.0, 90]
    R421: [43.5, 43.0, 90]
    R423: [40.0, 39.0, 90]
    R425: [43.0, 47.0, 90]
    R424: [54.5, 44.5, 0]
    C442: [79.75, 48.0, 270]
    R442: [76.0, 48.0, 90]
    R440: [73.5, 43.0, 90]
    R441: [71.5, 39.5, 90]
    # Keep the P2 current-monitor filter clear of U6's P1 USB launch bank.
    # The former 90.0,54.5 placement put R445.1 directly in front of U6.1/.2
    # and left no 0.25/0.15 mm F.Cu escape for the differential pair.
    R445: [89.0, 49.5, 90]
    R448: [72.0, 48.0, 90]
    R444: [84.5, 44.5, 0]
    C462: [109.75, 48.0, 270]
    R462: [106.0, 48.0, 90]
    R461: [103.5, 43.0, 90]
    R463: [100.0, 39.0, 90]
    R465: [103.0, 47.0, 90]
    R464: [114.5, 44.5, 0]
    C482: [135.75, 48.0, 270]
    R482: [132.0, 48.0, 90]
    R483: [145.0, 34.0, 90]
    R486: [128.0, 56.0, 90]
    R487: [131.0, 56.0, 90]
    R488: [134.0, 56.0, 90]
    R484: [140.5, 44.5, 0]
    # Repack the four eFuse quiet-side networks.  Each >=1 uF OUT bypass is
    # now the named P-ADJ partner and the ITIMER/DVDT capacitors sit directly
    # at their pins while the legalizer retains the clamp-diode clearances.
    C420: [53.0, 47.0, 0]
    C421: [50.0, 41.5, 0]
    C423: [54.0, 41.5, 0]
    C440: [83.0, 47.0, 0]
    C441: [80.0, 41.5, 0]
    C443: [84.0, 41.5, 0]
    C460: [113.0, 47.0, 0]
    C461: [110.0, 41.5, 0]
    C463: [114.0, 41.5, 0]
    C480: [139.0, 47.0, 0]
    C481: [136.0, 41.5, 0]
    C483: [140.0, 41.5, 0]
    D4: [58.2, 47.2, 0]
    # Port 2's clamp drops below the repeated row to clear the hub crystal
    # load capacitor at x=91.2; the other clamps remain on the east edge.
    D5: [90.0, 42.5, 0]
    D6: [118.2, 47.2, 0]
    D7: [144.4, 47.2, 0]
    R24: [75.0, 53.0, 0]

    # LMR36510 Figure 8-24 cell: VIN ceramics at the left pin bank, BOOT and
    # VCC capacitors at the right pin bank, SW-facing L6 immediately east,
    # followed by output ceramics.  The divider is kept below the FB pin and
    # away from the switch land.
    C200: [115.4, 67.7, 90]
    C201: [115.4, 72.5, 90]
    C206: [123.8, 64.65, 90]
    L6: [132.1, 69.0, 0]
    C205: [124.35, 73.35, 270]
    R200: [121.2, 73.35, 90]
    R201: [124.0, 76.8, 90]
    R202: [118.0, 74.0, 0]
    C202: [143.2, 62.0, 90]
    C203: [143.2, 68.0, 90]
    C204: [143.2, 80.0, 90]

    # LTC3889 dual-stage repack.  In each mirrored half bridge the high- and
    # low-side FET SW lands face each other, the inductor begins immediately
    # below that shared edge, and the Kelvin shunt follows the inductor.  U2
    # is centered between the gate edges instead of across the power field.
    U2: [104.0, 88.0, 0]
    Q3: [86.3, 85.5, 180]
    Q4: [93.2, 85.5, 180]
    L1: [89.75, 96.0, 270]
    R14: [97.3, 106.0, 0]
    Q6: [114.8, 85.5, 0]
    Q5: [121.7, 85.5, 0]
    L4: [118.75, 96.0, 270]
    R16: [126.3, 106.0, 0]
    C9: [86.0, 78.0, 0]
    C11: [91.0, 78.0, 0]
    C10: [112.3, 78.0, 180]
    C12: [117.0, 78.0, 180]
    # U2 supply/bootstrap support above the package and compensation/sense
    # networks in the clear center corridor between the two inductors.
    C13: [103.0, 81.8, 90]
    C14: [105.0, 81.8, 90]
    C15: [109.7, 94.2, 0]
    C16: [109.7, 92.5, 0]
    C7: [100.2, 81.8, 270]
    D2: [101.5, 78.8, 0]
    D3: [106.5, 78.8, 180]
    C8: [108.0, 81.8, 90]
    C25: [96.5, 81.5, 0]
    C26: [110.0, 75.5, 0]
    C17: [98.3, 93.1, 0]
    C18: [98.3, 91.4, 0]
    C19: [109.7, 90.8, 0]
    C20: [109.7, 89.1, 0]
    R6: [98.3, 84.6, 0]
    R7: [98.3, 86.3, 0]
    R8: [98.3, 88.0, 0]
    R9: [98.3, 89.7, 0]
    C4: [100.0, 95.6, 270]
    C5: [107.0, 95.0, 270]
    C101: [106.3, 106.5, 0]
    C102: [111.3, 106.5, 0]
    C103: [80.5, 96.0, 0]
    C104: [80.5, 100.0, 0]
    C105: [132.7, 106.5, 0]
    C106: [137.5, 106.5, 0]
    C107: [130.3, 97.0, 0]
    C108: [135.3, 97.0, 0]
  regions:
    port1: [39.0, 28.0, 61.0, 50.0]
    port2: [69.0, 28.0, 91.0, 50.0]
    port3: [99.0, 28.0, 121.0, 50.0]
    port4: [126.0, 28.0, 145.0, 50.0]
    control: [42.0, 50.0, 115.0, 78.0]
    input: [25.0, 81.0, 77.0, 106.0]
    buck_a: [79.0, 79.0, 113.0, 106.0]
    buck_b: [113.0, 79.0, 147.0, 106.0]
  patterns:
    # assembly.yaml declares these exact 3 A receptacles post-assembly; carry
    # that decision on the generated footprints so every exporter agrees.
    - {match: ["J3", "J4", "J5", "J6"], attrs: [exclude_from_pos_files]}
    # F1 is a composite two-clip fuse holder represented by one electrical
    # reference.  JLC C5249699 is one physical Keystone 3568 clip, so a single
    # CPL centroid cannot express the two required placements.  Keep the
    # electrical footprint, but install two clips after PCBA as declared in
    # assembly.yaml.
    - {match: F1, attrs: [exclude_from_pos_files]}
    - {match: ["C42?", "R42?"], region: port1}
    - {match: ["C44?", "R44?"], region: port2}
    - {match: ["C46?", "R46?"], region: port3}
    - {match: ["C48?", "R48?"], region: port4}
    - {match: ["C101", "C102", "C103", "C104", "D2"], region: buck_a}
    - {match: ["C105", "C106", "C107", "C108", "D3"], region: buck_b}
    - {match: ["C20?", "R20?"], region: buck_b}
    - {match: ["C1", "C2", "C3", "R1", "R3", "R4", "R5", "C21", "C22", "C23", "C24"], region: input}
    - {match: ["C3?", "C4?", "R3?"], region: control}
  legalize: {enable: true, clearance: 0.65, edge_margin: 0.7, hole_keepout: 2.8, ring_max: 120}
  escape_corridors:
    - {ref: U6, side: N, depth_mm: 4.0, layers: [F.Cu]}
    - {ref: U6, side: E, depth_mm: 4.0, layers: [F.Cu]}
    - {ref: U6, side: S, depth_mm: 4.0, layers: [F.Cu]}
    - {ref: U6, side: W, depth_mm: 4.0, layers: [F.Cu]}
    - {ref: U7, side: E, depth_mm: 3.0, layers: [F.Cu]}
    - {ref: U1, side: E, depth_mm: 2.5, layers: [F.Cu]}

design_rules:
  track_min_width: 0.09
  min_clearance: 0.09
  # The paid advanced-tier POFV option is needed only for the eight capped
  # 0.25/0.15 mm vias inside each TPS259470 IN/OUT land. Routed vias remain
  # larger in route.yaml.
  via_min_annulus: 0.05
  hole_clearance: 0.25
  hole_to_hole: 0.25
  copper_edge_clearance: 0.3
  via_min_size: 0.25
  min_through_drill: 0.15
  solder_mask_min_width: 0.0
  solder_mask_expansion: 0.0

zones:
  # Dense 0.50 mm hub/eFuse ground pins starve when the whole-board plane
  # uses thermal spokes: an authoritative KiCad refill left 60 starved
  # thermals and 72 opens.  Solid attachment is intentional on this
  # high-current, POFV assembly; local escape copper is still DRC-gated.
  - {net: GND, layers: [F.Cu, In1.Cu, B.Cu], priority: 0, min_thickness: 0.25, clearance: 0.2, connect: full}

silk:
  min_text_height: 0.7
  refdes: {size: 0.65, min_size: 0.45, fab_copy: true, clearance: 0.16, priority_prefixes: "UJQF"}
  captions:
    - ["PORT 1  5V / 2A", 50.0, 27.0, 0.8]
    - ["PORT 2  5V / 2A", 80.0, 27.0, 0.8]
    - ["PORT 3  5V / 2A", 110.0, 27.0, 0.8]
    - ["PORT 4  5V / 2A", 136.0, 27.0, 0.8]
    - ["USB HOST", 24.5, 46.5, 0.75]
    - ["SWD", 25.5, 75.5, 0.75]
    - ["12-24V + -", 25.5, 104.0, 0.6]
    - ["FIT 10A MINI FUSE", 40.0, 107.0, 0.7]
    - ["PROGRAMMABLE USB2 HUB  REV A", 75.0, 109.4, 0.8]
    - ["USB-A 2A IS PROPRIETARY POWER MODE", 105.0, 109.5, 0.6]

asserts:
  pad_net:
    - {ref: J1, pad: 1, net: VIN_RAW}
    - {ref: F1, pad: 1, net: VIN_RAW}
    - {ref: F1, pad: 2, net: VIN_FUSED}
    - {ref: D1, pad: 1, net: VIN_PROTECTED}
    - {ref: Q1, pad: 1, net: VIN_FUSED}
    - {ref: Q2, pad: 1, net: VIN_PROTECTED}
    - {ref: U1, pad: 13, net: unconnected-(U1-RTN_FLOAT-Pad13)}
    - {ref: U6, pad: 65, net: GND}
    - {ref: U6, pad: 58, net: UP_HUB_N}
    - {ref: U6, pad: 59, net: UP_HUB_P}
    - {ref: U7, pad: 33, net: MGMT_N}
    - {ref: U7, pad: 34, net: MGMT_P}
    - {ref: J3, pad: 1, net: P1_VBUS}
    - {ref: J4, pad: 1, net: P2_VBUS}
    - {ref: J5, pad: 1, net: P3_VBUS}
    - {ref: J6, pad: 1, net: P4_VBUS}
