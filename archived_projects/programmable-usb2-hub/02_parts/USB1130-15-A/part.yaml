gotchas:
  - "The 3.0 A rating is an exact USB1130 rating, not a generic USB-A assumption. USB1130-15-A is the 15-microinch-gold, tape-and-reel ordering option."
  - "No current LCSC/JLC catalog code was found in the bounded 2026-07-31 search. Exact-MPN consignment must be accepted by JLC before release, or the connector must be deliberately moved to post-assembly. Do not substitute a common 1.0/1.5 A USB-A receptacle."
  - "The custom footprint must be redrawn from GCT drawing A2: four 0.92 mm contact holes, 2.00 mm contact pitch, two 2.26 mm shell holes on 7.00 mm centers, and the stated PCB-edge datum."
  - "The vendor drawing specifies the shell-hole diameter but not a copper-land diameter. The footprint uses a 3.30 mm shell land (0.52 mm radial annulus) so the adjacent VBUS land clears the advanced-tier 0.09 mm copper rule with margin."
verified: "GCT drawing USB1130 rev A2 sheet 1/2 fixes the mating and PCB views; USB-IF Universal Serial Bus Specification rev 2.0 sections 6.5.1, Figure 6-7 and Table 6-1 independently assign Standard-A receptacle contacts 1=VBUS, 2=D-, 3=D+, 4=GND. Electrical limits are from GCT USB1130 product specification rev A1 sections 4 and 6; checked 2026-08-01."
