gotchas:
  - "The project-local TDSON-8-1_PhysicalPins footprint tiles the same continuous 4.55 x 4.41 mm Infineon drain copper into touching logical pads 5-8. The copper union is unchanged while P-PINMAP can prove every package identity."
  - "Use two identical devices in the LM74810 back-to-back topology and four more as the Q3-Q6 LM5116 synchronous switches. At 6.25 A, each input-stage FET dissipates about 0.063 W using the 25 C 1.6 mOhm maximum; hot resistance and shared copper heating still require thermal validation."
  - "The headline 234 A is case-temperature limited. The vendor's actual board example is 31 A at 25 C on 6 cm2 of 70 um drain copper and RthetaJA=50 K/W; board copper, not the package current headline, governs this design."
  - "60 V VDS has 21.1 V static margin above SMBJ24A's 38.9 V specified clamp. The TVS and short low-inductance loop are mandatory; no automotive load-dump capability is claimed."
  - "LM5116 VCC gate drive is 7.4 V while the exact RDS(on) maximum is specified at 10 V. The transfer/output graphs support enhancement below 10 V but do not create a 7.4 V resistance guarantee; first-board switch loss, temperature and ringing at 12 V / 6 A and 24 V / 6 A remain mandatory qualification gates."
  - "OPEN BLOCKER — the present 12.4 kOhm RT sets 250 kHz. Conservatively using the datasheet's 10 V charges gives Qgh+Qgl = 58+49 = 107 nC and IGC = 107 nC x 250 kHz = 26.75 mA per LM5116. That exceeds the controller's 15 mA minimum internal-VCC current limit during startup with VCCX grounded. Gate-drive power alone is 7.4 V x 26.75 mA = 0.198 W; a conservative 24 V internal-bias input bound including the LM5116's 7 mA maximum operating current is 24 V x (26.75+7) mA = 0.810 W, about 33 C rise at 40.6 C/W before board/environment derating. Select lower-Qg 60 V switches or add a datasheet-compliant external VCC/VCCX startup supply and re-run loss/thermal calculations before release."
verified: "Infineon rev 2.6 p.1 pin diagram: pins 1-3 Source, 4 Gate, 5-8 Drain; maximum ratings p.3; and PG-TDSON-8 package outline plus Figure 2 Boardpads & Apertures pp.11-13. The project footprint preserves pins 5-8 while their touching pad union exactly equals KiCad TDSON-8-1's verified 4.55 x 4.41 mm fused drain copper; checked 2026-08-01."
