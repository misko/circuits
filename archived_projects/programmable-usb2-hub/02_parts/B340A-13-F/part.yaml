  2.50 x 1.80 mm pads, a conservative 0.10 mm extension in the lead-width
  direction.

gotchas:
  - "This is a transient clamp, not a series rectifier: cathode goes to Pn_VBUS and anode to GND."
  - "Place adjacent to TPS259470 OUT and its ceramic output capacitor; a long trace defeats the inductive-clamp purpose."

layout:
  source: "TPS25947 SLVSFC9C Section 8.4 plus Diodes Incorporated SMA land pattern"
  notes:
    - "Keep the VBUS-to-diode-to-GND loop short and broad."
    - "Do not place diode capacitance on D+/D-."

