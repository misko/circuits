verified: >
  Polarity, SMA package, 3 A rating, 40 V reverse rating, 80 A surge rating,
  MSL 1, B340A-13-F ordering suffix, and suggested SMA land (4.00 mm pad
  centers, 2.50 x 1.70 mm pads) read from Diodes Incorporated DS30891
