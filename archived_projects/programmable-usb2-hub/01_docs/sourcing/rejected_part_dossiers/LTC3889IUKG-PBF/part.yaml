gotchas:
  - "Factory OPERATION is PWM off, but release safety also requires hardware RUN0/RUN1 inhibition; EEPROM state is not the sole safety control."
  - "5.215 V is not exactly representable: encode and verify Linear16 word 0x14DC = 5.21484375 V."
  - "AUX_6V must supply EXTVCC above the 5.6 V maximum takeover threshold; do not credit takeover at the 5.215 V output."
  - "Each rail uses two symmetric 6.8 uH inductors in parallel. At the -20% inductance corner the effective 2.72 uH gives about 6 A peak-to-peak ripple at 24 V; preserve symmetric copper and verify current sharing."
  - "Use 100 ohm/1 nF differential current-sense filters and true Kelvin routing to the parallel 10 mOhm shunts."
  - "Bootstrap capacitance is at least 330 nF per phase and each external bootstrap diode is rated at least 60 V."
  - "Unused TSNS pins go to ground; unused input-current-sense pins IIN+/IIN- are shorted to VIN as specified."
