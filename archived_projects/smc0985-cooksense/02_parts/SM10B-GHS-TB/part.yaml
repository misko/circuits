  MP: {name: MP, note: "two tin-plated reinforcement/solder tabs (footprint pad 'MP' x2 = one common node); carry no signal current. DELIBERATELY has NO tie annotation -- this is the ISOLATED keypad-matrix connector and NO GND_ISO net exists on this design (the matrix is a floating KP_*/SEL_BUS signal domain), so the MP tabs must FLOAT. Binding these tabs to GND bridges SELV GND into the isolated keypad zone (the converter tie-emission surfaced exactly this -> J_KEY_MATRIX.MP=GND at y12.5 inside the keypad strip, a 0.43mm creepage isolation break caught by the fixed I-ISO). Reflow the tabs for mechanical retention only. IMPORTANT for maintainers: the converter load_part_ties scans this whole inline map body with a regex for the literal tie annotation, so this note must NEVER contain that annotation as prose (colon form) or MP would be re-bridged to GND. Corrected 2026-07-23 (the GND binding was removed)."}
