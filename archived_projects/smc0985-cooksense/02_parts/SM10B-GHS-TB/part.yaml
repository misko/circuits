  notes: "Passive interconnect - layout-agnostic for signal timing, but it sits ON the isolation boundary of the key-control domain: keep the creepage/clearance barrier under and around the footprint UNBROKEN (no copper pour, plane, or via bridging primary<->isolated), and route every isolated-domain return to the isolated ground only. The MP mechanical tabs FLOAT (see the pins.MP note, corrected 2026-07-23): no GND_ISO net exists on these designs — the keypad matrix is a floating signal domain, and bonding the tabs to ANY ground bridges the barrier. Reflow the tabs for retention only. (Stale tie-to-isolated-ground sentence removed 2026-07-24, interposer pin-review finding.)"
