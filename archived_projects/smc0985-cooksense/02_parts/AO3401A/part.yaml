mpn: AO3401A
manufacturer: Alpha & Omega
type: pfet_30v_4a
datasheet:
  # PDF committed 2026-07-28 (v1.7): Q_REV's on-resistance is an E-TOPO term
  # (it is one of the three series elements between J_PWR and the LDO input) and
  # this dossier previously carried only a URL, so the v1.6 audit had to
  # ESTIMATE the drop (~38 mV at ~0.45 A) with nothing to cite.
  url: https://aosmd.com/res/data_sheets/AO3401A.pdf
  local: AO3401A_Rev3.1.pdf
  sha256: 0d8e3261ae280e007b5837fff60c55142f2d92af71edc4d02aee6f7a760a785c
  fetched: 2026-07-28
package: SOT-23
footprint: Package_TO_SOT_SMD:SOT-23
escape: {style: leaded, pitch: 0.95, tier_required: jlc_2layer_default, checked: escape_check 2026-07-22}
pins:
  1: GATE
  2: SOURCE
  3: DRAIN
limits:                       # AOS AO3401A Rev3.1 Electrical Characteristics, TJ = 25 C unless noted
  vds: "-30 V"
  vgs: "+-12 V"
  id: "-4.0 A continuous (at VGS = -10 V)"
  vgs_th: "-0.5 / -0.9 / -1.3 V at VDS = VGS, ID = -250 mA"
  rds_on: "60 mOhm MAX at VGS = -4.5 V / ID = -3.5 A (typ 47); 50 mOhm MAX at VGS = -10 V / ID = -4.0 A (typ 41)"
  rds_on_hot: "75 mOhm MAX at VGS = -10 V, TJ = 125 C (typ 62) - i.e. the SAME table publishes a 1.50x hot ratio (50 -> 75 mOhm). Interpolated to a 70 C junction that is 1.225x, so the -4.5 V figure this board runs at becomes 73.5 mOhm max."
  pd: "1.4 W (Note A, t <= 10 s, TA = 25 C) / 0.9 W (Note B, TA = 70 C)"
  theta_ja: "70 C/W (t <= 10 s) / 100 C/W steady state, on 1 in^2 of 2 oz Cu"
gotchas:
  - "SOT-23 FET: 1=G 2=S 3=D (AOS ds p.1); Vgs max +-12V, Vds -30V"
  - "Q_REV's RDS(on) IS AN E-TOPO TERM, AND THE HOT NUMBER IS THE ONE TO USE. The reverse-polarity guard carries the whole board current, so it sits in the F1 + Q_REV + U_EFUSE chain (70.0 + 73.5 + 47.0 = 190.5 mOhm) whose 95.2 mV drop at 0.50 A is what separates the AMS1117's 1355 mV of headroom from its 1300 mV dropout (ADR-0021). The 60 mOhm on the front page is a 25 C number; the datasheet's own VGS=-10 V rows publish the 125 C max, and that ratio is what derates the -4.5 V figure. VGS here is -(5V_FUSED) ~ -4.8 V, so the -4.5 V row is the conservative one to read."
verified: "pin map + EC table (RDS(on) 60 mOhm max @VGS -4.5V/25C, 50 -> 75 mOhm max @VGS -10V 25 -> 125 C, VGS(th) -0.5/-0.9/-1.3 V, PD/theta_JA notes A+B) read from the committed AO3401A Rev3.1 PDF, 2026-07-28; polarity/pad-1 asserted in board generator + audit I9"
layout:                     # P-LAYOUT: P-FET load switch (type matches 'fet'). Datasheet has NO
                            # placement section - only thermal (theta_JA vs board copper area).
  source: "AOS AO3401A Rev3.1 Thermal Characteristics + Note A: theta_JA 70C/W (t<=10s) / 100C/W
    steady-state, MEASURED on a 1in^2 FR-4 / 2oz-Cu board in still air, TA=25C - 'the value in any given
    application depends on the user's specific board design'; PD 1.4W (Note A, t<=10s @25C) / 0.9W
    (Note B @70C); RDS(on) <60mOhm @Vgs=-4.5V. No dedicated PCB-layout section (general load switch)."
  reviewed: "2026-07-22"
  keep_short:
    - {net: HS_GATE, max_span_mm: 6, why: "gate pull-up R (to SOURCE) + the 2N7002 pulldown placed local to the gate, keeping the high-side switching node compact"}
  notes: >
    High-side P-FET load switches (Q1 = coil rail / 5V_KEY_RELAY, plus per-sensor switched 3V3 highs)
    and the Q3 reverse-polarity guard on the 5V input. Loads are small - the coil rail is ~120mA worst
    (12 reed coils), sensor rails less - all far under the -4A rating, so with RDS(on)<60mOhm the
    dissipation is <~15mW: the theta_JA-vs-copper table (Note A) is effectively non-binding and NO thermal
    via array is needed (matches crow-recorder AO3401A). Keep the source<->drain switched path short with a
    modest local drain pour; place the gate pull-up R and its 2N7002 pulldown adjacent to the gate (HS_GATE).
    Source/drain-to-rail orientation differs by role (load-switch vs reverse-guard) - that is the
    schematic / E-INV call, not a copper rule. All-linear board: no switching-node budget.
sourcing:
  lcsc: C15127
  note: "BASIC, 455k stock. Q1 coil-rail high-side + Q3 reverse protection."
