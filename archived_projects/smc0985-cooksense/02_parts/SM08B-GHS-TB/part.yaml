layout:                           # in P-LAYOUT scope (npins>2); honest layout-agnostic notes
  source: "JST eGH SMD land pattern + solder-tab retention (mechanical). This header is the THERMAL-HEAD POD input: switched 3V3, GND, one I2C bus, three NTC sense lines, shield drain."
  reviewed: "2026-07-22; layout.source + layout.notes CORRECTED 2026-07-31 (ADR-0031)"
  # *** CORRECTED 2026-07-31 - THIS BLOCK DESCRIBED **J_TC's** SIGNALS ON
  # *** **J_THERM's** PART PAGE. It read: "Carries the thermocouple pairs to
  # *** the MAX31856: route each TC+/TC- pad pair as a tight differential".
  # *** THERE IS NO TC PAIR ON THIS CONNECTOR - not one thermocouple net
  # *** touches either ref. MEASURED with pcbnew over every pad of both refs on
  # *** the SEALED v1.7 board (07_releases/cooksense-v1.7-2026-07-30/source/
  # *** cooksense.kicad_pcb):
  # ***   J_THERM_A  1=3V3_SW_A 2=GND 3=SDA_A 4=SCL_A
  # ***              5=TH_CAM_A 6=TH_MOUNT_A 7=TH_PORT_A 8=SHIELD_DRAIN  MPx2=GND
  # ***   J_THERM_B  1=3V3_SW_B 2=GND 3=SDA_B 4=SCL_B
  # ***              5=TH_CAM_B 6=TH_MOUNT_B 7=TH_PORT_B 8=SHIELD_DRAIN  MPx2=GND
  # *** The thermocouple is on **J_TC** (Omega_PCC-SMP-K_TypeK_PCpin, pad 1 =
  # *** TC_POS_IN, pad 2 = TC_NEG_IN) - a different, self-supplied,
  # *** DO-NOT-SUBSTITUTE part with its own dossier in 02_parts/PCC-SMP-K/.
  # ***
  # *** WRITTEN AS A DATED CORRECTION, NOT A SILENT REWORD, BECAUSE IT WAS
  # *** PROPAGATING: an agent brief dated 2026-07-30 opened by calling
  # *** J_THERM_A/J_THERM_B "thermocouple connectors on a board with a
  # *** mains-adjacent isolation barrier" and reasoned about the C265111
  # *** substitution risk from there.
  # *** IT MATTERS BECAUSE THE TWO PARTS FAIL DIFFERENTLY. On a real TC
  # *** connector the governing substitution risk is CONTACT METALLURGY -
  # *** dissimilar metals at the junction form a parasitic thermocouple in
  # *** series with a microvolt signal, so a clone with a different contact
  # *** alloy is disqualifying (which is exactly why J_TC is DO-NOT-SUBSTITUTE).
  # *** On THIS connector the signals are 3.3 V logic, I2C, and three
  # *** RATIOMETRIC NTC divider taps, so the governing term is contact
  # *** RESISTANCE, not EMF. DERIVED against this board's own divider legs
  # *** (R_REF0 10k, R_CLMPA 22k, R_OPENT 62k, R_OPENB 100k): even JST's worst
  # *** published AFTER-TEST contact resistance, 50 mOhm, is 0.050/10000 =
  # *** 5.0e-6 of the 10k leg. Negligible by four orders. These are also all
  # *** SELV nets - nothing here crosses the isolation barrier, so the
  # *** connector's voltage rating is not a barrier term either.
  notes: "Passive interconnect - layout-agnostic, no self net-span budget. Carries the THERMAL-HEAD POD harness: switched 3V3, GND, one I2C bus (SDA/SCL, shared with that side's camera), THREE NTC thermistor sense lines (TH_CAM / TH_MOUNT / TH_PORT) and SHIELD_DRAIN. Keep the three NTC sense lines clear of heater/contactor/switching nodes - they are high-impedance divider taps (10k-100k class) and the open-thermistor detect trips on them. Tie both MP tabs to GND (retention/strain-relief + shield return). NOT the thermocouple path: that is J_TC -> R_TCP/R_TCN -> MAX31856, and the TC input RC filter and cold-junction sense belong AT the MAX31856 (see that part's keep_short), never here."
