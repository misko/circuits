# ##########################################################################
# ELECTRICAL FACTS (ADR-0007 item 2). Added 2026-07-29 to close red-team
# finding TOPO P1-2. Until this block existed the ONE number that decides
# whether twelve reed relays pull in — this part's V_CE(sat) at the coil
# current — was recorded NOWHERE in the tree, so the pull-in margin could not
# be computed by anyone, and it is NEGATIVE. See the V_CE(sat) gotcha.
# ##########################################################################
electrical:
  vdd: 5.0                       # coil rail 5V_KEY_RELAY (COM), not a logic VDD
  defaults: {drive: open_collector_darlington_sink}
  # LOW-SIDE SATURATION. There is no single datasheet number at 10 mA — the EC
  # table's lowest specified point is 100 mA — so three figures are carried,
  # each labelled with what it actually is. All at TA = 25 C.
  v_ce_sat_typ_at_10mA: 0.67     # Fig.1 (p.5) digitized, see gotcha; TYPICAL
  v_ce_sat_max_at_10mA: 0.88     # DERIVED (Fig.1 typ x the EC table's own worst
                                 # max/typ ratio 1.30); NOT a datasheet guarantee
  v_ce_sat_max_guaranteed: 1.10  # EC table p.5, II=250uA / IC=100 mA, MAX. A hard
                                 # bound at 10 mA only because V_CE(sat) rises
                                 # monotonically with IC (Fig.1)
  i_coil_design_mA: 7.0          # one DIP05-1A72-13L 5 V coil, 500R nom, at 25 C
  tc_note: "TI specifies V_CE(sat) at TA=25 C ONLY; no tempco is given, so the
    25 C figure is carried unchanged at every corner (no thermal credit taken)."
  source: "SLRS049G p.5 Sec.7.5 Electrical Characteristics + Sec.7.7 Fig.1
    'Collector-Emitter Saturation Voltage vs Collector Current (One Darlington)';
    Sec.10.2.2.1 Eq.1 ICOIL = (VSUP - VCE(SAT)) / RCOIL is TI's own coil-current
    equation and names VOL == VCE(SAT)."

gotchas:
  - "*** V_CE(sat) AT THE COIL CURRENT — THE NUMBER THAT MAKES THE REED PULL-IN
     MARGIN GO NEGATIVE (TOPO P1-2, 2026-07-29). *** SLRS049G Sec.7.5 specifies
     V_CE(sat) at IC = 100 / 200 / 350 mA ONLY (0.9/1.1, 1.0/1.3, 1.3/1.6 typ/max,
     at II = 250/350/500 uA). The DIP05 coil draws ~7 mA, two orders below the
     lowest table row, so the number must come from Fig.1 (p.5, TA = 25 C, three
     II curves). Fig.1 DIGITIZED at 900 dpi against its own gridlines (x: 0 mA at
     the axis, 288 px per 100 mA; y: 0 V at the axis, 230.28 px per 0.25 V): at
     IC = 10 mA the three-curve band spans 0.629-0.674 V, i.e. TYP ~= 0.67 V at
     the band's upper edge. Fig.1 IS A TYPICAL CURVE — it carries no max. The
     honest max is either (a) the EC table's own worst max/typ ratio, 1.3/1.0 at
     200 mA = 1.30, applied to 0.674 -> 0.88 V, or (b) the hard monotonic bound
     1.10 V (the 100 mA MAX). BOTH are carried in `electrical:` because the
     verdict differs between them: at the 0.67 V TYPICAL the reed margin is
     already -130 mV at 70 C, and at 0.88 V it is negative from 50 C up.
     DO NOT quote '1.1 V' as if it were the 10 mA max — it is a bound four times
     the real drop — and DO NOT quote 0.67 V as if it were a worst case."
  - "V_CE(sat) HAS NO TEMPCO IN THIS DATASHEET. Sec.7.5 is headed 'at TA = 25 C
     free-air temperature' and there is no V_CE(sat)-vs-temperature figure
     anywhere in SLRS049G. A Darlington's two V_BE drops fall ~-4 mV/K while its
     series resistance rises, and TI declines to net them, so NO thermal credit
     is taken: the 25 C figure is used at -20 C and at +70 C alike. That is the
     conservative direction for the pull-in margin (any real fall in V_CE(sat)
     helps), so the negative verdict does not depend on it."
  - "OUTn pairs with INn on the OPPOSITE corner (1<->18): straight-across netting is a classic bug - audit asserts IN1/OUT1 pairing"
  - "internal flyback diodes to COM; COM MUST tie to RELAY_5V (switched rail), not 5VP, so a gated-off rail still clamps coil kick"
verified: "TI SLRS049 DW pin table (IN1-8 = 1-8, GND=9, COM=10, OUT8-1 = 11-18); pin review re-checks - 2026-07-19"
layout:                          # P-LAYOUT: 8ch Darlington relay-coil driver (ADR-0003 safety chain)
  source: "TI ULN2803A datasheet SLRS049G sec.11 Power Supply Recommendations (COM is
    tied to the coil supply; the OUTn voltage must NOT heavily exceed COM or the
    internal fly-back diodes forward-bias and dump large current into COM, damaging
    on-chip metal / over-heating the part) + sec.12.1 Layout Guidelines (SEPARATE the
    input channels as much as possible to kill cross-talk; thin input traces OK, THICK
    output traces for the coil current; the common-emitter GND(9) return carries ALL
    channel currents so make that trace VERY WIDE, some apps up to 2.5A) + sec.10.2.2.3
    Power Dissipation (PD = SUM VOLi*ILi must keep TJ < 125C; theta_JA(DW) = 66.4 C/W)"
  reviewed: "2026-07-22"
  notes: |
    The ULN Layout section is about TRACE WIDTH + CHANNEL SEPARATION, not keep-short
    spans, so no keep_short budget (the honest form):
    (1) COM(10) ties to RELAY_5V (the SWITCHED coil rail, per gotcha) - keep COM and
        each OUTn->coil fly-back loop area SMALL so the internal clamp diode sees low
        loop inductance; never let OUTn exceed COM (sec.11).
    (2) GND(9) common-emitter return sinks all 8 channels (~2.5A aggregate worst case)
        - give it a WIDE pour/trace straight to the plane at the pin (sec.12.1).
    (3) Keep IN1-8 (from the 595 outputs) separated and short to limit cross-talk;
        the OUTn to the relay coils get thick copper.
    (4) Thermal: 8 coils energised together is the PD(MAX) case - honour sec.10.2.2.3
        (TJ < 125C) with copper around the DW package. SOIC-18W 1.27mm - no escape wall.
