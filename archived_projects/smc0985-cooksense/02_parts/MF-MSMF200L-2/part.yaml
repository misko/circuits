datasheet:
  # SERIES sheet — the Bourns MF-MSMF family document.
  #
  # *** CORRECTED 2026-07-30 (v1.7 seal). THE VOLTAGE ROW WAS ASSERTED AND IT IS
  # *** NOT ESTABLISHED BY THIS DOCUMENT. The line above used to read
  # *** `type: polyfuse_2a_16v` and this comment used to read "the ELECTRICAL row
  # *** is MF-MSMF200/16X (16 V)". A v1.7 re-gate-4 topology lens read the same
  # *** committed PDF and concluded the opposite — that `L` maps to the /8X (8 V)
  # *** row. MEASURED BY ME from this file's own committed PDF (sha256 below,
  # *** `pdftotext -layout`): **NEITHER IS ESTABLISHED.** The "How to Order"
  # *** scheme is `MF - MSMF <Ihold> / <Voltage> X - <packaging>` with the voltage
  # *** vocabulary {6, 8, 12, 16}; `L` IS NOT IN IT. `MF-MSMF200L-2` is an LCSC
  # *** catalog string, not a Bourns order code in this scheme, so the committed
  # *** evidence does not name a voltage row for the fitted part at all.
  #
  # WHAT IS ESTABLISHED, AND IT IS THE PART THAT IS LOAD-BEARING: the electrical
  # table lists MF-MSMF200/8X, /12X and /16X and **all three carry R Min 0.020 Ohm
  # and R1 Max 0.070 Ohm**, verbatim. So the 70 mOhm that ADR-0027's 328.29 mOhm
  # series sum, ADR-0028's dropout ladder and E-TOPO's headroom all depend on is
  # INVARIANT under the ambiguity — no margin on this board moves either way.
  # Only the voltage rating is in dispute, the LOWEST candidate is 8 V, and the
  # rail it protects is 5.250 V max (ADR-0021) with D_TVS clamping at 6.40-7.00 V,
  # i.e. inside 8 V with margin. The exposure is therefore bounded and small, and
  # it is recorded rather than resolved by assertion.
  #
  # Committed 2026-07-28 (v1.7): this dossier previously held only an LCSC URL, so
  # the series resistance E-TOPO's dropout headroom depends on had NO cited value
  # and the v1.6 adversarial audit had to ESTIMATE it (~34 mV at ~0.45 A).
  # Committed 2026-07-28 (v1.7): this dossier previously held only an LCSC URL, so
  # the series resistance E-TOPO's dropout headroom depends on had NO cited value
  # and the v1.6 adversarial audit had to ESTIMATE it (~34 mV at ~0.45 A).
