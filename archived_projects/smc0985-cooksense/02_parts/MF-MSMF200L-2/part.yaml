limits:
  vmax: "NOT ESTABLISHED for the fitted MPN — 8 V is the LOWEST candidate row and
         is the number to design against. See the datasheet block above: the
         committed PDF's ordering scheme has no `L` voltage option, so neither
         the /8X (8 V) nor the /16X (16 V) row is citable for MF-MSMF200L-2.
         OWED (canon M-OWED): a vendor confirmation of what LCSC's `L` suffix
         maps to. BOUNDED MEANWHILE: the protected rail is 5.250 V max
         (ADR-0021) and D_TVS clamps at 6.40-7.00 V, both inside 8 V."
  imax: "100 A fault current"
  r_min_ohm: 0.020        # CITED, MF-MSMF electrical table. IDENTICAL across the
  r1_max_ohm: 0.070       # /8X, /12X and /16X rows, so the 70 mOhm every series
                          # sum on this board spends is INVARIANT under the
                          # voltage-row ambiguity above. This is the number
                          # ADR-0027/ADR-0028/E-TOPO actually depend on.
  t_op: "-40..+85 C"      # CITED, operating range. NOT the board's binding
                          # thermal limit — DIP05-1A72-13L is -20..+70 C and
                          # twelve of them are fitted. See ADR-0030.
  tempco: "NOT PUBLISHED — Bourns gives no resistance-vs-temperature data for
