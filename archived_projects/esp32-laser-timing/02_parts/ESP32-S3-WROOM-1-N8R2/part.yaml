limits:
  vdd33_abs_max: 3.6V        # Table 6-1: -0.3 ~ 3.6 V absolute max
  vdd33_operating: 3.0-3.6V  # Table 6-2: recommended 3.0 ~ 3.6 V, typ 3.3 V
  supply_current_min: 0.5A   # Table 6-2: external supply must deliver >= 0.5 A
  peak_tx_current: 355mA     # Table 6-4: 802.11b 1 Mbps @20.5 dBm
  ta_operating: "-40..85C"   # N8R2 is an 85C variant (Table 1-1)
  t_storage: "-40..105C"
gotchas:
  - "ANTENNA KEEPOUT: PCB antenna occupies the top 6 mm of the module, at the
     pin1/pin40 end (Fig 3-1 keepout zone, Fig 11-1 'Antenna Area' 18x6 mm).
     Overhang it off the board edge or keep all copper/ground off that area on
     every layer; details per ESP32-S3 Hardware Design Guidelines."
  - "Strapping pins IO0 (pad 27), IO3 (pad 15), IO45 (pad 26), IO46 (pad 16) —
     do not load at reset. IO0 weak pull-up, IO45/IO46 weak pull-down, IO3
     floating (Table 4-1)."
  - "GPIO19 (pad 13) = USB_D-, GPIO20 (pad 14) = USB_D+ — native USB / JTAG."
  - "N8R2 has QUAD PSRAM: IO35/IO36/IO37 (pads 28-30) ARE available. On octal
     PSRAM variants (R8/R16V) they are consumed by the PSRAM (Table 3-1 note b)
     — do not port a design from an N8R8 pinout without checking."
  - "EPAD is pad 41, not implicit — a generator that omits it floats the pad.
     Ground it with thermal vias (Fig 11-1 shows via-in-pad grid)."
  - "EN (pad 3) must not float — RC delay (10k + 1 uF typical) or supervisor."
  - "Bottom-row pads 15-26 are numbered LEFT to RIGHT viewed from top —
     mirror-error source when hand-building the footprint from the bottom view."
