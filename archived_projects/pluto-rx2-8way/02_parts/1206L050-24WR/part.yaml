asserts:
  # DECLARED BUT NOT ACTUALLY GRADED TODAY, AND SAYING SO IS THE POINT OF THIS
  # BLOCK. part_facts_check.py decodes `equals:` through parse_si(), which is
  # NUMERIC-ONLY; an MPN string returns None and the assertion is reported
  # P-FACT-CONFIG ("value assert has no decodable `equals:`") and grades
  # NOTHING. Measured 2026-07-28 on this project: six of nine dossiers are in
  # that state, INCLUDING both parts this board holds up as exemplars
  # (PE42482A-X, KH-SMA-KE-Z). The pattern is kept here for consistency with
  # them and because the fact is the right one to record — but it is a
  # WRITTEN-DOWN fact that nothing reads, which is the exact failure mode the
  # 02_parts contract's P-FACT section exists to kill. The fix belongs in
  # part_facts_check.py (literal-string fallback, or a distinct `mpn:` kind),
  # not here, and is reported rather than applied.
  - assert: value
    equals: 1206L050/24WR
    why: "the BOM Comment must name the exact ordering number, because every
      failure this part has is invisible to every electrical check on the
      board. The 1206L family puts nineteen variants on ONE footprint with ONE
      datasheet: 1206L035 (0.35 A hold) nuisance-trips the RP2040's worst case,
      1206L110TH (1.10 A hold) lets a 1 A board-side fault sit on the host's
      budget indefinitely, and 1206L050 (the 6 V sibling, one character
      shorter) is outside rating the moment the device latches against anything
      above 6 V. All four assemble, reflow, pass DRC, pass parity and power the
      board up identically."
