                               # appear in a path). Fleet precedent and the
                               # machine handling for it are explicit:
                               # bom_legibility_check.py load_part_mpns() names
                               # 02_parts/SMD2920-700/ -> mpn SMD2920-700/16N and
                               # 02_parts/LM5116MHX-NOPB/ -> mpn LM5116MHX/NOPB,
                               # and treats the `mpn:` FIELD as authoritative
                               # with the directory name only as fallback. The
                               # ORDERABLE string is the one above; it is what
                               # LCSC C2154056 lists and what Littelfuse's own
                               # Packaging Options table (PDF p6) gives for part
                               # number 1206L050/24 ("/24" = the 24 V rating,
                               # "WR" = tape and reel, 3000).
manufacturer: Littelfuse
type: pptc_resettable_fuse     # PPTC, not a fuse: it RESETS. Nothing on this
                               # board opens permanently, and the CHECKLIST must
                               # say so or a bring-up tech will replace a part
                               # that is merely latched hot (ADR-0004).
