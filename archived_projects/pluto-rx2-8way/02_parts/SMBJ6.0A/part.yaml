sourcing:
  lcsc: C83270
  alternates: [C113976]        # C113976 = MDD SMBJ6.0A, DO-214AA, catalog row
                               # reads 'TVS Unidirectional' (checked live
                               # 2026-07-28) with 74443 in stock — this is the
                               # part the fleet ledger's tvs-clamp-5v-vbus entry
                               # already carries as catalog-verified. DELIBERATELY
                               # NOT LISTED: C140903 (LRC), same MPN string,
                               # catalog-BIDIRECTIONAL. Any substitution must
                               # re-read the DIRECTION column of the specific
                               # code, and MDD's own datasheet (2010, Freelance
                               # Graphics) was NOT the document these facts came
                               # from — swapping to it means re-verifying V_C
                               # and I_R against MDD's sheet, not inheriting
                               # Littelfuse's.
                               # ST SMBJ6.0A-TR (C130396) was CONSIDERED AND
                               # REJECTED: ST specifies it on an 8/20 us basis
                               # at V_C 13.7 V / 61 A (a different, more
                               # energetic waveform, so the numbers are not
                               # comparable term by term) with a much better
                               # 20 uA leakage — but a 13.7 V clamp would push
                               # U_LDO's V_IN abs max requirement to >= 16 V.
asserts:
  - assert: pad1_net_polarity
    pad: 1
    polarity: positive
    why: "pad 1 is the CATHODE — 'Uni-directional products are denoted with a
      cathode band', Physical Specifications PDF p5, and Diode_SMD:D_SMB puts
      its silk bar and F.Fab cathode line at the pad-1 end. A reversed
      unidirectional TVS is a forward diode across the rail: ~0.9 V, a dead
      short on 5 V, F_IN trips on first power-up and the board never runs. The
      netlist is self-consistent either way, so no ERC, DRC or parity check can
      see it — this is the XT60 class, and ADR-0004 names the sibling defect
      (usb-hub-3s v1.0 D1) that passed ERC, DRC, parity, twin AND pin review.
      NOTE THE LIMIT OF THIS ASSERT: it grades pad 1's net as POSITIVE, which
      VBUS and VBUS_F both are, so it does NOT enforce cathode-on-VBUS_F. That
      is the `pin_on_net` invariant in 03_src/rules/electrical_invariants.yaml."
  # THE `value` ASSERT BELOW IS DECLARED BUT NOT ACTUALLY GRADED TODAY.
  # part_facts_check.py decodes `equals:` through parse_si(), which is
  # NUMERIC-ONLY; an MPN string returns None and the entry is reported
  # P-FACT-CONFIG and grades NOTHING (measured 2026-07-28: six of nine dossiers
  # on this board are in that state, both exemplars included). The
  # `pad1_net_polarity` assert above IS a graded kind and will bite the moment
  # a netlist exists. Reported, not fixed — part_facts_check.py lives under
  # skills/ and needs a literal-string fallback or a distinct `mpn:` kind.
  - assert: value
    equals: SMBJ6.0A
    why: "the BOM Comment must name the exact standoff and directionality,
      because both failures are electrically invisible. SMBJ6.0CA — ONE
      CHARACTER longer — is the bi-directional die: it never clamps in reverse,
      so the board powers up, passes every gate and has no clamp. SMBJ5.0A is
      the standoff DETAIL_DESIGN section 5 currently specifies and it sits
      BELOW the 5.25 V (USB 2.0) / 5.5 V (USB-C vSafe5V) rail ceiling, leaking
      ~1.26 mA continuously with no published behaviour at temperature.
      SMBJ6.5A and SMBJ7.0A clamp at 11.2 V and 12.0 V and would silently
      invalidate whatever V_IN abs max U_LDO was selected against. All four fit
      the same DO-214AA land and all four reflow identically."
