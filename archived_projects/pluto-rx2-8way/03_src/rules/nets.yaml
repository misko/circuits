# pluto-rx2-8way — net architecture: netclasses + DRU floors source.
#
# Read alongside 01_docs/ARCHITECTURE.md §Net domains and §Critical geometries.
# Widths live HERE, not in the prose; the prose links back.
#
# TWO THINGS THAT MAKE THIS BOARD UNLIKE A POWER BOARD:
#
# 1. THE DOMINANT WIDTH CONSTRAINT IS IMPEDANCE, NOT AMPACITY. RF50 is
#    0.36 mm because that is 50 ohm on the ordered stackup (JLC04161H-7628,
#    0.2104 mm top prepreg, Dk 4.4 — DETAIL_DESIGN section 1), NOT because of
#    current. A "safety" widening of an RF class is a DEFECT, not a
#    conservative choice: it detunes the line. Both directions are wrong.
#    Every such class declares `current: signal` EXPLICITLY and says in
#    `intent:` what the width really is.
#
# 2. `current:` IS A TYPED DECLARATION, NOT PROSE (canon A-AMP / M-COVER).
#    rules_audit.py FAILS an unreadable value instead of filing it under OKS:
#    measured 2026-07-27, A-AMP had been grading 10 of 57 declared currents
#    fleet-wide because any qualifier made the parser return None. Every class
#    here reads as a bare "<n> A" or the literal word "signal"; qualifying
#    prose goes in `intent:`, where it cannot silence the gate.

# THE BOARD'S ISOLATION NUMBER, SAID FROM SOURCE (2026-07-30). 0.2 mm was
# already the effective DRC clearance on every class — but only because
# generate_rules_generic HARDCODES 0.2 as its default, which is not the same
# thing as this board having decided it. The prose in the RF50 block has
# claimed since stage 3 that "the board declares 0.2 UP from its 0.09 tier
# floor ON PURPOSE, because on it clearance is ISOLATION between nine arms,
# not a routability tax" — and nothing in the file said so where a gate could
# read it. tier_preflight PF-RULES-CLR is the gate that asks: it flags every
# class riding the hardcode while a router wave packs to 0.14, because an
# undeclared floor is one nobody chose. Declaring 0.2 explicitly changes NO
# emitted number (verified: DRC identical across the change); it changes who
# owns it, and it is the half of R-SCOPE that has to come BEFORE the
# relaxation — you cannot bound a relaxation of a floor you never declared.
default_clearance: 0.2mm

fab_tier: jlc_4layer_advanced
# D-TIER (ADR-0003). Raised from the template default jlc_2layer_default,
# which FAILED P-TIER on 2026-07-28:
#   FAIL P-TIER: parts exceed fab_tier 'jlc_2layer_default':
#                ['PE42482A-X needs jlc_4layer_advanced']
# MECHANISM, one line: PE42482A-X is a QFN-24 at 0.50 mm pitch, and a
# standard-tier escape via (0.30 mm drill) between adjacent pins leaves
# 0.50 - 0.30 = 0.20 mm of hole-to-hole gap against a 0.50 mm floor. No via
# fits. At advanced (0.15 mm drill, 0.25 mm floor) 0.50 - 0.15 = 0.35 mm does,
# with 0.10 mm to spare. escape_check.py independently returns the same five
# per-tier verdicts (ADR-0003, canon M1).
#
# ORDER_README line required by D-TIER — the `order_readme` string from
# skills/kicad-pcb/references/fab_tiers.yaml with its <reason> filled. COPY
# THIS VERBATIM into 07_releases/<rel>/ORDER_README.md at the seal; it is also
# a checkable line in 01_docs/CHECKLIST.md until a release exists:
#
#   "ADVANCED option REQUIRED: min via 0.25/0.15 mm (PE42482A-X QFN-24 at
#    0.50 mm pitch - at the standard-tier 0.30 mm drill the adjacent-pin
#    hole-to-hole gap is 0.50 - 0.30 = 0.20 mm against a 0.50 mm floor, so no
#    escape via fits). 4-layer JLC04161H-7628, IMPEDANCE CONTROL REQUESTED."

classes:
  RF50:
    intent: >
      Every 50 ohm single-ended RF net: the nine radial arms of the switch
      star (ADR-0007), the RX1 main line and the pickoff tap. 0.36 mm on L1
      over a SOLID L2 ground is 50.5 ohm on the ordered stackup
      (Hammerstad-Jensen with the thickness correction: 0.35 -> 51.3 ohm,
      0.36 -> 50.5, 0.37 -> 49.7; at Dk 4.2 instead of 4.4 the same 0.36 mm
      line is 51.6 ohm). THIS IS AN IMPEDANCE WIDTH, NOT AN AMPACITY WIDTH -
      widening it is as wrong as narrowing it. Constraints that are not
      preferences, because ADR-0006 sells CONSTANCY: L1 only, NO VIAS and no
      layer changes anywhere in an arm (a via's inductance depends on drill
      and plating, which are not specified per hole); L2 unbroken underneath
      everywhere; ground-via fence at <= 1.37 mm (lambda_g/20 at 6 GHz,
      lambda_g = 27.41 mm). Current is negligible and is NOT what sets this
      width: these are receive paths at antenna level.
      RX1_TAP_MID IS THE ONE MEMBER WHOSE WIDTH IS INHERITED RATHER THAN
      IMPEDANCE-DERIVED. It is the interior of a LUMPED element - the node
      between the two 220 ohm pickoff resistors - and it is bounded to
      <= 1.37 mm (lambda_g/20) so that it stays lumped. Longer than that and
      the two-resistor arm becomes a transmission line with its own delta.
    nets: [ANT1, ANT2, ANT3, ANT4, ANT5, ANT6, ANT7,
           RX1_MAIN, RX1_TAP_MID, RX1_TAP, RX2_OUT]
    current: signal
    clearance: 0.2mm    # EXPLICIT, see default_clearance above
    min_width: 0.36mm
    routing: KRT, L1 only, no vias, radial star per ADR-0007
    verify: DRC floor + P-ADJ spans + the published VNA sweep (ADR-0006)

  CTRL:
    intent: >
      The four switch-select nets and their MCU-side stubs. 0.20 mm is 67 ohm
      on this stackup, and that number is LOAD-BEARING rather than decorative:
      PE42482A-X's digital absolute maximum is 3.6 V on a 3.3 V rail (300 mV
      of headroom), so the 47 ohm source resistors are sized to make
      Z_drv + R_S >= Z_line at the RP2040's STRONGEST drive setting, which is
      what keeps the far-end reflection inside absolute maximum without
      relying on a firmware register (ADR-0005). Routed on L3 UNDER the L2
      ground plane wherever they cross the RF region, descending through the
      225-315 degree escape sector (ADR-0007) - never parallel to an RF arm.
      NO SHUNT CAPACITANCE ANYWHERE ON THIS CLASS: a 1 kohm + 1 nF RC is
      4.6 us to 99%, more than the entire 4.267 us blanking allowance.
      Current: signal - V1..V4 draw 5 uA max each (Table 2, PDF p3); the only
      real current is 1.3 mA into the four 10 kohm pull-downs when driven high.
    nets: [SEL_V1, SEL_V2, SEL_V3, SEL_V4, SW_V1, SW_V2, SW_V3, SW_V4]
    current: signal
    clearance: 0.2mm    # EXPLICIT, see default_clearance above
    min_width: 0.2mm
    routing: KRT, L3 under ground across the RF region
    verify: DRC floor + no RF-arm parallelism (R-PLANE / design review)

  USB_D:
    intent: >
      USB 2.0 full-speed differential pair. 0.28 mm / 0.18 mm gap is ESTIMATED
      at ~90 ohm differential on this stackup (2*Z0*(1 - 0.48*exp(-0.96*s/h))
      with Z0 = 57.4 ohm at 0.28 mm) - a closed-form approximation, not a
      field solve, and flagged as such. Full speed does NOT require a
      controlled pair over this run (critical length at a ~4 ns edge is
      ~170 mm; this run is under 30 mm), but the stackup the RF forces
      delivers it at essentially the same width, so it is routed properly for
      free. THE BINDING RULE IS THE REFERENCE, NOT THE IMPEDANCE: solid,
      uninterrupted L2 ground for the ENTIRE length, never crossing an RF arm
      or a plane split. Current: signal.
    nets: [USB_DP, USB_DM, USB_DP_MCU, USB_DM_MCU]
    current: signal
    clearance: 0.2mm    # EXPLICIT, see default_clearance above
    min_width: 0.28mm
    routing: KRT, L1, matched pair, inside the digital strip
    verify: DRC floor + no plane split under the pair (R-PLANE)

  PWR:
    intent: >
      VBUS in, the protected node downstream of the fuse, and the 3V3 rail.
      0.4 mm is far above the ampacity need - it is chosen for IR drop and
      robustness. The declared current is the DESIGN ENVELOPE, not the
      typical: RP2040 ~50 mA worst case + QSPI flash ~5 mA + PE42482A-X
      200 uA max + two indicator LEDs ~4 mA + the four pull-downs 1.3 mA is
      ~60 mA typical, and 0.15 A is declared so the LDO's thermal margin is
      graded against the envelope rather than against the hope (ADR-0004
      binds U_LDO to V_IN abs max >= the TVS clamp; the clamp as SELECTED is
      SMBJ6.0A at 10.3 V, not the 9.2 V the ADR derived from a 5.0 V standoff
      that was rejected at selection - see power_tree.yaml and DETAIL_DESIGN
      section 5).
      VBUS_LDO IS THE FOURTH MEMBER AND IT WAS MISSING UNTIL 2026-07-28. A
      ferrite is a SERIES element, so FB_IN's output - the node feeding
      U_LDO.VIN - is a distinct net from VBUS_F. With only three names
      declared it would have fallen to the DEFAULT 0.25 mm class and been
      graded by A-AMP as a signal net while carrying the board's entire
      0.15 A supply current. Found at the stage-2 merge by the part dossier
      that owns the ferrite, not by any gate: nothing cross-checks a
      netclass's member list against the series elements the invariants
      declare.
    nets: [VBUS, VBUS_F, VBUS_LDO, 3V3]
    current: 0.15 A
    clearance: 0.2mm    # EXPLICIT, see default_clearance above
    min_width: 0.4mm
    routing: KRT, L1 stubs onto an L3 pour
    verify: DRC floor + A-AMP

  QSPI:
    intent: >
      RP2040 execute-in-place bus. Short and direct, flash hugging the MCU.
      On this board it is also the only CONTINUOUS in-band spur source (tens
      of MHz with sub-ns edges, harmonics past 6 GHz) sitting 25 mm from a
      nine-arm receive fan, so "short" is an EMI rule here, not only a
      signal-integrity one. Kept entirely inside the digital strip, below the
      lowest RF flange. Current: signal.
    nets: [QSPI_SCLK, QSPI_CSN, QSPI_SD0, QSPI_SD1, QSPI_SD2, QSPI_SD3]
    current: signal
    clearance: 0.2mm    # EXPLICIT, see default_clearance above
    min_width: 0.2mm
    routing: KRT, inside the digital strip only
    verify: DRC floor + P-ADJ span budget from the MCU layout block

  DVDD_1V1:
    intent: >
      THE 1.1 V CORE RAIL, AND IT IS REAL COPPER THAT NO GATE GRADES. RP2040's
      1.1 V core supply is generated by an ON-DIE regulator whose output leaves
      the package at VREG_VOUT (pin 45) and must be wired back IN COPPER to
      DVDD (pins 23 and 50) - datasheet section 2.9.2. The link is off-chip and
      the boot sequence waits on it, so a board that omits it looks correct in
      every artifact: VREG_VOUT reads as an unused output and DVDD as an
      undriven supply, and neither ERC nor DRC nor parity can object.
      MISSING FROM THIS FILE UNTIL 2026-07-28. Declared at 0.4 mm for the same
      reason as PWR - IR drop and robustness, not ampacity; the core draws
      ~100 mA at 125 MHz, which on 0.4 mm x 35 um is a ~1 C rise.
      E-TOPO CANNOT GRADE THIS RAIL AND THAT IS STATED RATHER THAN HIDDEN: the
      converter is inside the MCU, and typing an MCU as a converter in
      power_tree.yaml to make a rail appear would be worse than the gap - it
      would put a false LINEAR/BUCK class on a part that is neither. The
      obligation this leaves is a HUMAN one: C_VREG_IN and C_VREG_OUT
      (DETAIL_DESIGN section 5) are the whole of the design here.
    nets: [DVDD_1V1]
    current: 0.1 A
    clearance: 0.2mm    # EXPLICIT, see default_clearance above
    min_width: 0.4mm
    routing: KRT, inside the digital strip only
    verify: DRC floor + A-AMP

# Default class (0.25 mm): LED_PWR, LED_STAT, LED_STAT_A, RUN_N, BOOTSEL_N,
# XIN, XOUT, XOUT_XTAL, USB_CC1, USB_CC2.
#
# LED_STAT_A ADDED 2026-07-28 AT SCHEMATIC CAPTURE, and it is here because a
# series resistor between a driver and an LED needs TWO nets and there is no
# arrangement that needs one: LED_STAT is the GPIO25 node, LED_STAT_A the
# ballasted anode node between R_LED2 and LED_ST. LED_PWR needs only one name
# because its cathode is on GND. 0.25 mm carries 1.91 mA with absurd margin.
# SWCLK / SWDIO ARE DELIBERATELY ABSENT FROM THIS LIST AND FROM THE BOARD.
# The two SWD pins carry no net; the converter emits an explicit ERC
# no-connect for each. The firmware path is UF2 over USB-C (BOOTSEL_N +
# RUN_N), and both pins have specified 50-80 kohm internal pull-ups at reset,
# so an open pin is a defined state rather than a float. Reversing it costs
# two test pads (in_bom no, no BOM or CPL row) and one line here - recorded so
# that a future reader can price it instead of rediscovering it. What it buys
# back is bench debugging of the PIO frame itself, which is the one thing on
# this board that printf-over-USB perturbs.
#
# XOUT_XTAL IS THE NODE BETWEEN R_XTAL (1 kohm) AND THE CRYSTAL, and it exists
# because the resistor does: the RP2040 Hardware Design guide requires a 1 kohm
# series resistor on XOUT when the crystal's ESR max is <= 50 ohm at IOVDD
# 3.3 V, and ABM8-272-T3 is a 50 ohm part. XOUT is the PIN side, XOUT_XTAL the
# crystal side, and the XOUT-side load capacitor sits on the CRYSTAL side of
# the resistor. Both were missing until 2026-07-28 along with the resistor.
#
# USB_DP_MCU / USB_DM_MCU are in the USB_D class above: R_USB1/R_USB2 (27.4 ohm,
# RP2040 Table 620) split each data line, so the pair is FOUR nets, not two -
# connector side USB_DP/USB_DM through U_ESD, die side USB_DP_MCU/USB_DM_MCU. GND is pours + stitching on L2/L4 and carries no netclass
# width. U_SW pin 1 (LS) is ON THE GND NET by decision (ADR-0005): it is an RF
# ground per Table 3 fn 1, so it takes a via AT the pad rather than a trace to
# a named net. CONSEQUENCE, recorded rather than discovered: the part.yaml
# `keep_short: SW_LS <= 2 mm` budget then has no net to measure and P-ADJ
# SKIPS it silently. It is discharged geometrically instead - ground-via
# centre within 0.5 mm of the LS pad centre - and that is a CHECKLIST.md line.

# NO SCOPED FLOORS, DELIBERATELY. A width relaxation inside a zone would break
# the impedance of any RF class it touched, and canon M4 requires evidence for
# one anyway. Declared absent rather than omitted.

# ============================================================================
# scoped_clearances — canon R-SCOPE. THE ISOLATION TWIN OF scoped_floors, and
# the thing this board could not say from source until 2026-07-30.
#
# WHAT IT BUYS AND WHAT IT COSTS. The board's 0.2 mm clearance is declared UP
# from the jlc_4layer_advanced floor of 0.09 ON PURPOSE: on a nine-arm receive
# fan, clearance is ISOLATION between arms, not a routability tax, so lowering
# the BOARD-WIDE floor to route one launch would spend the whole reason the
# number exists. What is relaxed here is 49 measured pairs, each of which has
# an RF arm on one side and GROUND on the other — never arm-to-arm, which is
# the isolation that matters and which is untouched at 0.2 mm everywhere.
#
# WHY 0.14 AND NOT 0.145. 0.145 is the ROUTABILITY threshold (the 20-point
# width x clearance sweep on r0: 11/11 at 0.145, 6/11 at 0.15, a 0.005 mm grid
# quantisation cliff). The router was given 0.14 and PACKED TO IT, so a 0.145
# DRC floor would fail the copper it just laid by 5 um. The floor has to be
# the router's budget, not the threshold that motivated it — R-SCOPE's own
# PF-ROUTE-CLR ordering rule, one level down. Measured worst approach across
# all 49 findings is 0.1659 mm (RX1_MAIN vs J_RX1 post 2), so 0.14 clears the
# tightest pair on the board by 0.0259 mm and sits 0.05 mm above the fab
# tier's 0.09 min_space, which a scope may never relax.
#
# WHY SEVEN REGIONS AND NOT ONE — THIS IS THE WHOLE OF THE JUDGEMENT.
# The 49 findings were predicted to be QFN-land findings and they are NOT.
# Classified off 06_build/drc (this session, from the promoted board):
#     9  arm vs a U_SW GND LAND, all at 0.1700 mm, one per RF pin
#          (ANT1..ANT7, RX2_OUT, RX1_TAP)
#    40  arm vs an SMA PTH GROUND POST at the far end of the arm, 20 mm away,
#          0.1659..0.1936 mm — J_ANT2/J_ANT3/J_ANT6/J_ANT7/J_RX2 seven each,
#          J_RX1 five
# A launch-only region therefore licenses 9 of 49 and leaves 79 violations
# standing. The post findings are a DIFFERENT geometry with the same cause:
# the arm arrives at a 1.90 mm square post ring that the KH-SMA-KE-Z land
# fixes at 3.592 mm pitch, and 0.36 mm of impedance copper cannot pass it at
# 0.2 mm. Each jack gets its own region keyed on its OWN arm net, so the
# relaxation cannot travel: nothing in rf_jack_ant6 is licensed for ANT2.
#
# WHAT IS DELIBERATELY *NOT* HERE. J_ANT1, J_ANT4, J_ANT5 and J_ANT8 measure
# clean and get no region — an isolation relaxation has NO downstream grader
# (DRC simply stops reporting what it permits), so a region declared for
# symmetry rather than for a measurement is the inherited-waiver defect. The
# GND POUR is likewise untouched: it holds its own 0.25 mm zone clearance,
# which a DRC floor of 0.14 does not lower.
#
# THE ITEM-vs-POINT CAVEAT, recorded because it bounds how much this really
# licenses: KiCad's insideArea is true for an item that OVERLAPS the area, so
# a 13 mm arm poking into rf_launch is "inside" along its whole length. The
# regions are drawn as tightly as the measured pair allows (see the keepouts
# block in 03_src/floorplan.yaml for the derivation of every coordinate), and
# the SYMMETRIC net clause does the rest: a licensed pair must still have one
# of these arm nets on one side of it.
scoped_clearances:
  - zone: rf_launch
    nets: [ANT1, ANT2, ANT3, ANT4, ANT5, ANT6, ANT7, RX2_OUT, RX1_TAP]
    clearance: 0.14
    why: >
      MEASURED, 9 DRC findings on the promoted board (r6, 2026-07-30), one per
      RF land of U_SW: every arm leaves its PE42482A-X land 0.1700 mm from the
      neighbouring GND land, against the board's 0.2 mm floor. The gap is
      GEOMETRIC, not a router choice — the vendor land from the Figure 23
      inset is 0.30 x 0.60 mm on a 0.50 mm pitch, so a 0.36 mm impedance trace
      centred on the land leaves (0.50 - 0.36)/2 = 0.070 mm of nominal gap to
      the next land edge and 0.170 mm to the next land's copper. The three
      alternatives were each measured and each is worse: a 0.30 mm arm is
      54.5 ohm and detunes a line the board PUBLISHES a phase table for;
      KRT neck-down delivers 149.832 mm at 0.25 mm and 0.000 mm at 0.36 mm
      (the re-widen pass only restores width where the narrow path had wide
      clearance, which leaving a QFN it never does); and dropping the
      board-wide floor to 0.14 would relax arm-to-arm isolation across the
      whole fan, which is the one thing the 0.2 mm number exists to buy.
      0.14 is the value the rf wave was actually routed at, so this rule
      states the copper that exists rather than a target it must be re-cut to.
  - zone: rf_jack_ant2
    nets: [ANT2]
    clearance: 0.14
    why: >
      MEASURED, 7 findings, ANT2 track vs J_ANT2 PTH pad 4 (GND post at
      29.792, 42.620), worst 0.1692 mm. The arm's last 3.2 mm approach to the
      centre pin passes the post ring; KH-SMA-KE-Z fixes the post-to-pin
      pitch at 3.592 mm and the posts are 1.90 mm square, so the aperture is
      not a placement variable. Relaxed for ANT2 only, inside the box
      containing exactly that pin and that post.
  - zone: rf_jack_ant3
    nets: [ANT3]
    clearance: 0.14
    why: >
      MEASURED, 7 findings, ANT3 track vs J_ANT3 PTH pad 4 (GND post at
      29.792, 49.380), worst 0.1687 mm. Same fixed KH-SMA-KE-Z aperture as
      rf_jack_ant2, rotated to this jack's angle on the r = 20 mm ring.
  - zone: rf_jack_ant6
    nets: [ANT6]
    clearance: 0.14
    why: >
      MEASURED, 7 findings, ANT6 track vs J_ANT6 PTH pad 2 (GND post at
      62.208, 49.380), worst 0.1687 mm. Same fixed KH-SMA-KE-Z aperture.
  - zone: rf_jack_ant7
    nets: [ANT7]
    clearance: 0.14
    why: >
      MEASURED, 7 findings, ANT7 track vs J_ANT7 PTH pad 2 (GND post at
      62.208, 42.620), worst 0.1687 mm. Same fixed KH-SMA-KE-Z aperture.
  - zone: rf_jack_rx1
    nets: [RX1_MAIN]
    clearance: 0.14
    why: >
      MEASURED, 5 findings, RX1_MAIN track vs J_RX1 PTH pad 2 (GND post at
      56.550, 31.858), worst 0.1659 mm — the TIGHTEST pair on the board, and
      the one that sets the 0.14 value's 0.0259 mm margin. RX1_MAIN is the
      main-line output, not a star member, so this region touches nothing the
      RF_RADIAL_STAR length_match group grades.
  - zone: rf_jack_rx2
    nets: [RX2_OUT]
    clearance: 0.14
    why: >
      MEASURED, 7 findings, RX2_OUT track vs J_RX2 PTH pad 3 (GND post at
      42.620, 29.792), worst 0.1687 mm. RX2_OUT is the RFC radial and IS a
      star member; the relaxation is on its ISOLATION, not on its length or
      width, and copper_length_audit still grades its realized copper against
      the group's 1.0 mm ceiling from the board.

# ============================================================================
# length_match — canon R-LEN, graded by
# skills/kicad-pcb/scripts/copper_length_audit.py. AUTHORED 2026-07-29 at the
# START of stage 6, before a single track existed, because the obligation it
# replaces was IMPOSSIBLE AS WRITTEN.
#
# WHAT WAS HERE BEFORE: nothing. The intent lived in ADR-0007 prose ("nine
# EQUAL-LENGTH 50 ohm traces ... equal trace length is equal phase BY
# CONSTRUCTION") and in 03_src/audit_board.py's I3, which measures PAD-CENTRE
# RADIUS. Phase is a property of COPPER, and R-LEN in policy_audit.py passed
# this board on the WORD "length" appearing in that file. So the board whose
# release artifact is a per-path phase table had no gate on the quantity.
#
# THE +/-0.10 mm OBLIGATION IS WITHDRAWN, AND HERE IS THE ARITHMETIC.
# CHECKLIST section D and I3's own note asked for "equalise ROUTED length to
# +/-0.10 mm". MEASURED on the ordered stackup JLC04161H-7628 (h = 0.2104 mm
# top prepreg, Dk 4.4, RF50 w = 0.36 mm): Hammerstad eps_eff = 3.350,
# t_pd = 6.105 ps/mm, lambda_g(6 GHz) = 27.29 mm, and phase runs at
# 13.19 deg/mm. So 0.10 mm is 1.3 deg at 6 GHz. Three independent reasons it
# is the wrong number, none of them "it is hard":
#   1. IT IS BELOW THE PART'S OWN WINDOW. PE42482A-X publishes relative
#      insertion phase with min/typ/max (Table 3, PDF p8). At 6 GHz RF2-RF1 is
#      -9.4 / -2.8 / +3.8 deg — a 13.2 deg window = 1.00 mm of copper, part to
#      part, on the very paths whose difference this board publishes. Copper
#      matched to 0.10 mm buys a quantity that cannot be distinguished from the
#      switch that was bought.
#   2. IT IS BELOW THE ASSEMBLY TERM. ADR-0006(d): mounting-inductance
#      asymmetry is ~0.1 nH ~ 3.8 ohm ~ 2 deg at 6 GHz per solder fillet,
#      = 0.15 mm of copper, and it is a CPL/reflow property no router controls.
#   3. NOTHING IN THE SYSTEM CAN DELIVER IT. KRT's length-matching machinery
#      (diff_pair_loop.py, diff_xnet.py) is DIFF-PAIR shaped — intra/inter-pair
#      P/N equalisation. These are single-ended 50 ohm traces that must match
#      EACH OTHER ACROSS NETS, which is inter-net skew, and there is no tool
#      behind it here. A ceiling nobody can hold is waived within a week, and a
#      waived ceiling is weaker than an honest number.
# ADR-0006 ALREADY SAID SO IN PROSE and was not being read: "Treat it as a
# routing tolerance ('match all eight to within X mm'). REJECTED: ... a
# tolerance band is not a number ... what the board owes is CONSTANCY."
#
# WHAT REPLACES IT — TWO FIELDS WITH TWO DIFFERENT JOBS:
#   max_spread_mm: 1.0 is a DRIFT ceiling, not a matching target. The static
#     delta is calibrated out by the published table; what cannot be calibrated
#     out is how the delta MOVES, and ADR-0006(b) shows that term is
#     proportional to the length DIFFERENCE: dtau = TC * dT * dL * t_pd. At
#     +100 ppm/degC (ESTIMATED, +-100, ADR-0006(b)) over 40 degC: dL = 1 mm is
#     0.024 ps = 0.05 deg at 6 GHz, and dL = 20 mm (the rejected rectangular
#     fan-out) is 1.05 deg, comparable to the whole AoA budget. 1.0 mm is
#     therefore derived twice over — from the drift arithmetic, and as ~1x the
#     vendor's own part-to-part window — and it is what the by-construction
#     geometry already delivers with 3x margin.
#   pin: is the check that actually guards the release. The router is
#     STOCHASTIC and a published picosecond is invalidated by any re-route that
#     moves copper. pin.spread_mm records the measured number the artifact
#     claims and FAILS when the board drifts off it by more than tol_mm.
#     tol_mm 0.05 = 0.66 deg, chosen because it is FREE: copper length in the
#     .kicad_pcb is a file property, deterministic to the nanometre.
# ============================================================================

length_match:
  RF_RADIAL_STAR:
    adr: "0007"        # QUOTED: YAML 1.1 reads a leading-zero scalar as
                       # OCTAL, so bare 0007 rendered as "ADR-7" in the gate's
                       # own output. Found on pluto-cal-switch the same day with
                       # `adr: 0011` -> 9; the two boards are the two strikes.
    intent: >
      THE EIGHT CONGRUENT 50 OHM RADIALS OF THE SWITCH STAR - seven antenna
      arms plus the RFC output - each a single two-pad net from a PE42482A-X RF
      land at r ~ 2.1 mm to an SMA centre pin on the r = 20.0 mm jack ring
      (ADR-0007 section 3). What the match buys is the ONE property this board
      sells: the eight per-path phase deltas are a PUBLISHED, per-unit measured
      artifact (ADR-0006 section 3), and a published constant is only worth the
      stability of the geometry behind it. Equal copper is what bounds the
      THERMAL DIFFERENTIAL drift of those deltas (ADR-0006(b)) and it is why
      the radial star beat the rectangular fan-out, which spread arms by
      ~20 mm.
      THE SPREAD IS NOT ZERO AND CANNOT BE, and the reason is geometric rather
      than a routing failure: the jacks sit on a CIRCLE and the QFN's lands sit
      on a SQUARE, so the switch-pad radius takes exactly three values -
      2.2743 mm (corner pins 24/6/13/19), 2.0427 (pins 2/17) and 1.9164 (pins
      4/15/22) - and the pad-to-pad arm length takes the three matching values
      17.7784 / 17.9725 / 18.1021 mm. 0.324 mm of residue, 4.27 deg at 6 GHz,
      which ADR-0006's published table CALIBRATES OUT and whose 40 degC drift
      contribution is 0.016 deg.
      RX2_OUT (RFC, pin 22) IS INCLUDED AND ITS TERM IS COMMON-MODE. RFC is in
      series with all eight signal paths, so its length adds equally to every
      one and contributes NOTHING to any published delta. It is graded anyway
      because ADR-0007's by-construction claim covers it at zero cost and
      because it independently tests that the router treated one more radial
      the same way. IF THIS GROUP EVER FAILS ON RX2_OUT ALONE, the finding is
      about construction, not about a delta, and must be reported that way.
      WHAT IS EXCLUDED, AND WHY THAT IS PHYSICS AND NOT CONVENIENCE: the ninth
      radial - RF8 (pin 19) out to J_ANT8 - is NOT a member. ADR-0006 says so
      in its own rejected-options paragraph: "the tapped path (ADR-0002)
      contains two resistors and a different topology, so it is unequal by
      construction". Three separate facts each disqualify it from a spread
      comparison: (i) it is not one net but three in series through the pickoff
      (RX1_TAP -> RX1_TAP_MID -> RX1_MAIN) so its copper is not congruent with
      a two-pad arm; (ii) `RX1_MAIN` additionally carries J_RX1.1, the RX1
      main-line output, so its copper is a T and `total_mm` on it is not a path
      length; (iii) its insertion phase is dominated by a LUMPED 2 x 220 ohm
      resistive cell (ADR-0002), not by transmission-line length, which is why
      RX1_TAP_MID carries a lambda_g/20 bound instead of a match. Its radial
      geometry IS still graded, as geometry: 03_src/audit_board.py I3 measures
      all NINE pad-to-pad radials and I4 the pickoff, and stage 6 reports its
      realized copper alongside this group's rather than inside it.
    members:
      ARM_RF1: [ANT1]
      ARM_RF2: [ANT2]
      ARM_RF3: [ANT3]
      ARM_RF4: [ANT4]
      ARM_RF5: [ANT5]
      ARM_RF6: [ANT6]
      ARM_RF7: [ANT7]
      ARM_RFC: [RX2_OUT]
    topology: chain
    # VERIFIED by the gate from the copper, not asserted: 0 branch vertices and
    # 0 cycles on every member. Each is a two-pad net with no stub, no shunt
    # and no fence tap - the ground fence is on GND, not on the arm.
    congruent_pads: true
    # THE CLAIM, stated so it can be attacked: the unmeasured pad-entry copper
    # is IDENTICAL across members and cancels in the delta. It holds here by
    # ROTATIONAL congruence - all ten jacks are the same KH-SMA-KE-Z footprint,
    # each rotated to its own theta (the 4-fold post square makes theta mod 90
    # equivalent), and all eight switch lands are the same 0.30 x 0.60 mm
    # vendor land from the Figure 23 inset. Every arm is therefore the SAME
    # radial pad geometry rotated, which is exactly the congruence ADR-0006(d)
    # and audit_board I3's ring check already require independently.
    no_vias: true
    # ADR-0006(c), and this is the ONLY place it is graded. Nothing in the
    # router enforces a per-NET via ban: route.yaml's `layers: [F.Cu]` is a
    # per-WAVE restriction and nothing re-checks it afterwards. A via's
    # inductance depends on drill and plating, which are not specified per
    # hole, so ONE via on ONE arm is a pure DIFFERENTIAL error on a published
    # delta.
    max_spread_mm: 1.0
    elongation: meander
    # ADDED 2026-07-30, AND IT IS NOT A WAIVER — it changes WHICH question
    # R-LEN-OCT asks, and the realized-spread check below is untouched.
    # THE PROBLEM: KRT is OCTILINEAR (45-degree multiples), so the shortest
    # copper it can lay between two pads is max(dx,dy) + 0.4142*min(dx,dy),
    # not the Euclidean distance. Only three of the nine radials (135/225/315
    # deg) sit on a legal move direction; the other six pay ~7.3% of their
    # radius. MEASURED FROM PADS ALONE, before any router ran: Euclidean pad
    # spread 0.3238 mm, OCTILINEAR FLOOR spread 1.4966 mm = 19.74 deg at
    # 6 GHz. The 1.0 mm ceiling above is BELOW that floor.
    # WHY THE CEILING DOES NOT MOVE. 1.0 mm was derived twice over — from
    # dtau = TC*dT*dL*t_pd (ADR-0006(b)) and as ~1x PE42482A-X's own 13.2 deg
    # part-to-part window — and raising it to 1.4966 mm to clear the gate
    # would be a DRIFT claim bought with a router limitation. The floor is a
    # statement about the router's move set, not about the physics the ceiling
    # encodes, and the two must not be traded.
    # WHY MEANDERING IS THE HONEST ANSWER: the octilinear floor bounds the
    # SHORTEST path, not the ACHIEVABLE SPREAD. A router can always LENGTHEN a
    # short member, and KRT's length_matching.py does exactly that — trombone
    # meanders at the longest straight segment, driven by
    # `--length-match-group`. So the fix is to equalise UP to the longest
    # member's floor rather than to demand a shortest path nobody can lay.
    # THE CLAIM IS CROSS-CHECKED, NOT TRUSTED: copper_length_audit refuses
    # `elongation:` unless 03_src/route.yaml carries a real
    # `length_match_group` (R-LEN-OCT-RECIPE), and the members' REALIZED
    # copper is still graded against max_spread_mm 1.0 off the board. This key
    # buys exactly one thing — it stops the gate from failing a ceiling on
    # PAD geometry that the recipe deliberately does not route to.
    stackup_mm: [0.2104, 0.9792, 0.2104]   # ADR-0003, JLC04161H-7628.
    # Documentation only: `no_vias: true` means a via is a FAIL before a barrel
    # is ever priced. Declared so that a future reader who relaxes no_vias does
    # not inherit an UNREACHED group.
    phase:
      t_pd_ps_per_mm: 6.105
      f_ghz: 6.0
      stackup: JLC04161H-7628
      # 6.105 is re-derived from the stackup (Hammerstad eps_eff 3.350) and
      # agrees with ADR-0003's 6.09 to 0.25%. ADR-0006 section 3 pins the
      # PUBLISHED conversion constant at 6.09 ps/mm and the release ships that
      # number with the table; both are stated rather than silently merged.
