# crow-recorder-central — ELECTRICAL INVARIANTS (canon E-INV, phase E1 =
# netlist-only). Design INTENT made EXECUTABLE against the exported netlist.
# Every other gate proves SELF-CONSISTENCY; this one proves the netlist matches
# what the ADRs decided — the gate the usb-hub-3s D1 reverse-polarity defect
# needed (it passed ERC/DRC/parity/twin/pin-review because every artifact was
# consistently WRONG together, and only INTENT disagreed).
#
# Graded by: electrical_invariants.py <project>            (exit 0 = all hold)
#            electrical_invariants.py <project> --adr-coverage   (E-ADR)
# Protection/topology ADRs on this board that E-ADR requires an invariant for:
#   0002 (input protection chain), 0005 (beeper return topology),
#   0007 (reverse-polarity FET orientation) — all cited below.

invariants:

  # ============================================================= #
  # 5V INPUT PROTECTION CHAIN  (ADR-0002)                          #
  # entry J9 -> PTC F1 -> TVS D9 -> reverse-FET Q9 -> 5V rail      #
  # ============================================================= #
  - assert: series_chain
    chain: [5V_IN, F1, 5V_P]
    adr: "0002"
    why: >
      F1 (SMD1812P200TF16 2A PTC) must be the FIRST series element after the
      barrel jack: 5V_IN -> 5V_P. Fault-current limit sits ahead of everything.
  - assert: pin_on_net
    pin: "D9.1"
    net: 5V_P
    adr: "0002"
    why: >
      D9 (SMBJ5.0A unidirectional TVS) CATHODE (pad1) clamps the protected
      input node 5V_P (after the PTC, before the reverse FET); a reversed
      cathode would forward-conduct the rail into GND.
  - assert: pin_on_net
    pin: "D9.2"
    net: GND
    adr: "0002"
    why: D9 anode (pad2) to GND — the clamp return.

  # ============================================================= #
  # REVERSE-POLARITY P-FET ORIENTATION  (ADR-0007)                 #
  # the D1-class intent: orientation decided by the body-diode     #
  # figure, not by prose. DRAIN=input(5V_P), SOURCE=load(5V).      #
  # ============================================================= #
  - assert: pin_on_net
    pin: "Q9.3"
    net: 5V_P
    adr: "0007"
    why: >
      Q9 (AO3401A P-FET) DRAIN (pad3) faces the INPUT (5V_P). At power-up the
      body diode (drain->source) conducts input->load through ~0.7V, then the
      channel enhances and shorts it. DRAIN-on-output would be the reversed-
      Schottky failure class no ERC/DRC/parity can see.
  - assert: pin_on_net
    pin: "Q9.2"
    net: 5V
    adr: "0007"
    why: Q9 SOURCE (pad2) is the LOAD rail 5V (the output of the guard).
  - assert: series_chain
    chain: [5V_P, Q9, 5V]
    through: {Q9: [3, 2]}
    adr: "0007"
    why: >
      The conduction path runs drain(pad3, 5V_P) -> source(pad2, 5V); reverse
      input leaves Vgs>=0 and the body diode reverse-biased -> blocks.

  # ============================================================= #
  # BEEPER DRIVER: LOW-SIDE FET + SEPARATE RETURN  (ADR-0005)      #
  # (asserted on port 1 as the representative of 8 identical ports)#
  # ============================================================= #
  - assert: pin_on_net
    pin: "Q1.2"
    net: GND
    adr: "0005"
    why: >
      Q1 (AO3400A N-FET) is LOW-SIDE: SOURCE (pad2) to GND. The beeper sits
      between 5V and the FET drain, switched on the ground-return side.
  - assert: pin_on_net
    pin: "Q1.3"
    net: BEEP_RET1
    adr: "0005"
    why: >
      The switched return is a SEPARATE per-port net BEEP_RET1 on Q1 DRAIN
      (pad3) — NOT shared GND — so beeper switching current never shares the
      audio-ground path (the crosstalk-isolation intent of ADR-0005).
  - assert: series_chain
    chain: [BEEP_G1, R101, BG_1]
    adr: "0005"
    why: >
      The XU316 gate signal drives the FET THROUGH R101 (1k) into BG_1 (with a
      4n7 + 100k slow network) — never direct — to slow the beeper edge.

  # ============================================================= #
  # SHARED CLOCK SERIES-TERMINATION LINKS R40-R43  (ADR-0006)      #
  # the topology the fresh-context pin review flagged: each *_X/*0 #
  # source net reaches the *_ ADC-side net only THROUGH its 33R.   #
  # ============================================================= #
  - assert: series_chain
    chain: [MCLK_A0, R40, MCLK_A]
    adr: "0006"
    why: MCLK buffer branch A reaches ADC1 MCLK only through R40 (33R source term).
  - assert: series_chain
    chain: [MCLK_B0, R41, MCLK_B]
    adr: "0006"
    why: MCLK buffer branch B reaches ADC2 MCLK only through R41 (33R source term).
  - assert: series_chain
    chain: [BCLK_X, R42, BCLK]
    adr: "0006"
    why: XU316 BCLK source reaches both ADCs' shared BCLK only through R42 (33R).
  - assert: series_chain
    chain: [LRCK_X, R43, LRCK]
    adr: "0006"
    why: XU316 LRCK source reaches both ADCs' shared LRCK only through R43 (33R).

  # ============================================================= #
  # ADC ANALOG/DIGITAL POWER-DOMAIN SPLIT  (ADR-0006 / §5)         #
  # AVDD on the QUIET analog LDO rail 3V3A; DVDD on 3V3 digital.   #
  # ============================================================= #
  - assert: pin_on_net
    pin: "U2.8"
    net: 3V3A
    adr: "0006"
    why: >
      ADC1 (U2 PCM1865) AVDD (pin8) on the quiet analog rail 3V3A (XC6227 LDO),
      isolated from the switching-buck digital rail — the mixed-signal split.
  - assert: pin_on_net
    pin: "U2.13"
    net: 3V3
    adr: "0006"
    why: ADC1 DVDD (pin13) on the 3V3 digital rail.
  - assert: pin_on_net
    pin: "U3.8"
    net: 3V3A
    adr: "0006"
    why: ADC2 (U3 PCM1865) AVDD (pin8) on the quiet analog rail 3V3A.
  - assert: pin_on_net
    pin: "U3.13"
    net: 3V3
    adr: "0006"
    why: ADC2 DVDD (pin13) on the 3V3 digital rail.
  - assert: net_has_part
    net: 3V3A
    part_type: capacitor
    min: 2
    adr: "0006"
    why: >
      The analog rail 3V3A carries its own bulk+HF decoupling (>=2 caps) at the
      LDO and each ADC AVDD pin — the isolation is only as good as its bypass.

  # ============================================================= #
  # RJ45 POD-PORT PINOUT  (interop authority: crow-mic-pod ADR-0004#
  # = central v1.0 D28, adopted here under ADR-0011). Port 1 is    #
  # the representative of the 8 contact-for-contact identical ports#
  # A straight-through T568B cable is correct end-to-end ONLY if    #
  # this map holds.                                                #
  # ============================================================= #
  - assert: pin_on_net
    pin: "J1.1"
    net: AUD_P1
    adr: pod-0004
    why: RJ45 contact 1 = AUDIO+ (orange) -> AUD_P1.
  - assert: pin_on_net
    pin: "J1.2"
    net: AUD_N1
    adr: pod-0004
    why: RJ45 contact 2 = AUDIO- (orange) -> AUD_N1.
  - assert: pin_on_net
    pin: "J1.3"
    net: BEEP_5V1
    adr: pod-0004
    why: RJ45 contact 3 = +5V_BEEP (green) -> BEEP_5V1 (after its PTC).
  - assert: pin_on_net
    pin: "J1.4"
    net: 5V_AUD1
    adr: pod-0004
    why: RJ45 contact 4 = +5V_AUDIO (blue) -> 5V_AUD1 (after its PTC).
  - assert: pin_on_net
    pin: "J1.5"
    net: GND
    adr: pod-0004
    why: RJ45 contact 5 = GND_AUDIO (blue) -> GND.
  - assert: pin_on_net
    pin: "J1.6"
    net: BEEP_RET1
    adr: pod-0004
    why: RJ45 contact 6 = BEEP_SWITCHED_RETURN (green) -> BEEP_RET1 (FET drain).
  - assert: pin_on_net
    pin: "J1.7"
    net: 5V_AUD1
    adr: pod-0004
    why: RJ45 contact 7 = +5V_AUDIO (brown) -> 5V_AUD1 (feed pair with 8).
  - assert: pin_on_net
    pin: "J1.8"
    net: GND
    adr: pod-0004
    why: RJ45 contact 8 = GND_AUDIO (brown) -> GND.

  # ============================================================= #
  # USB-C CC Rd SINK PRESENTATION  (Type-C spec: a device presents #
  # 5.1k Rd on each CC to advertise as a UFP/sink)                 #
  # ============================================================= #
  - assert: series_chain
    chain: [CC1, R31, GND]
    adr: usb-c-rd
    why: >
      R31 (5.1k) pulls CC1 to GND — the Type-C sink Rd presentation. Missing/
      wrong-value Rd = the port never enumerates or over-advertises current.
  - assert: series_chain
    chain: [CC2, R32, GND]
    adr: usb-c-rd
    why: R32 (5.1k) pulls CC2 to GND — the second CC's sink Rd (flip symmetry).
