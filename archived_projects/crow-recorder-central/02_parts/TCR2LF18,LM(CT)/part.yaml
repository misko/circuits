mpn: TCR2LF18,LM(CT)
manufacturer: Toshiba
type: ldo_regulator_fixed_1v8
datasheet:
  doc_id: TCR2LF series / TCR2LE series
  revision: 2014-11-06
  url: https://datasheet.lcsc.com/datasheet/pdf/bbb455d297164b418c39299f8da1bd79.pdf?productCode=C150173   # Toshiba direct download is session-gated; LCSC-hosted copy of the Toshiba sheet
  sha256: 453be8cde2d54520d51dfa1249ae474dcb801d4002317582afd0d2c88ee29c99
  fetched: 2026-07-17
package: SMV (SOT-25)(SC-74A), 2.8x2.9x1.1mm body, 0.95mm pitch   # ",LM" suffix = SMV/SOT-25; the SOT-553 variant is TCR2LE18. NOT DFN4, NOT SOT-553F.
footprint: Package_TO_SOT_SMD:SOT-23-5   # SOT-25 == SOT-23-5 land; Toshiba SMV body 2.8x2.9 fits the standard SOT-23-5 pattern
pins:                       # from "Pin Assignment (top view)" figure, SMV(SOT-25)(SC-74A) drawing, p.2
  1: VIN                    # bottom-left
  2: GND                    # bottom-center
  3: CONTROL                # bottom-right; enable, active high; internal ~0.1uA pull-down -> open = OFF
  4: NC                     # top-right
  5: VOUT                   # top-left
limits:
  vin_abs_max: 6.0V
  vin_operating: 1.5-5.5V
  vout: 1.8V +/-1.0% (marking "1L8")
  iout_max: 200mA
  dropout_1v8: 370mV typ / 620mV max at IOUT=150mA (Tj -40..85C)
  iq: 1.0uA typ / 2.0uA max (IOUT=0)
  istandby: 0.1uA typ (VCT=0)
  vct_on: ">= 1.0V"
  vct_off: "<= 0.4V"
  pd_smv: 580mW on 25.4mm sq FR4 board
  caps: "CIN = COUT = 0.1uF ceramic minimum, ESR < 10 Ohm, mount close to pins (App Note p.6-7); larger COUT fine"
gotchas:
  - "From 3.3V rail: 3.3 - 1.8 = 1.5V headroom >> 620mV max dropout at 150mA — fine; from a 2.3V rail also fine at <=150mA"
  - "CONTROL has only a ~0.1uA internal pull-down: floating = OFF. Tie CONTROL to VIN (or drive it) or the rail never comes up"
  - "Auto-discharge: VOUT is actively discharged (~20 Ohm) when disabled — do not parallel another supply into the 1.8V net"
  - "Toshiba warns VOUT-to-GND short can destroy the part (no foldback for hard shorts, p.7 note)"
  - "SOT-553 sibling (TCR2LE18) has a DIFFERENT pin order (1 CONTROL, 2 GND, 3 VIN, 4 VOUT, 5 NC) — do not reuse this pin map if the package ever changes"
verified: "pin map read from datasheet 'Pin Assignment (top view)' figure, SMV(SOT-25)(SC-74A) drawing, page 2 (page image rendered), rev 2014-11-06 — 2026-07-17"
sourcing:
  lcsc: C150173
  alternates: [C92498, C236671, C59969]
  note: >-
    C150173 (exact MPN) had 0 stock at JLC/LCSC on 2026-07-17 — DO NOT order without restock or an approved swap.
    Pin-compatible in-catalog exact-function alternates (fixed 1.8V, SOT-23-5, pinout IN/GND/EN/NC/OUT):
    C92498 LP5907MFX-1.8/NOPB (TI, 250mA, low-noise 6.5uVrms, 6075 stock),
    C236671 ME6211C18M5G-N (Microne, 300mA, 50144 stock),
    C59969 RT9013-18GB (Richtek, 500mA, 34283 stock). All checked 2026-07-17.
    Any substitution is a BOM decision — record it in 01_docs, do not silently swap.

# D-ESC escape feasibility (escape_check v2, 2026-07-21, ADR-0012 tier context)
escape: {style: leaded, pitch: 0.95, tier_required: jlc_2layer_default, checked: escape_check}
layout:
  source: >-
    Toshiba TCR2LF/TCR2LE datasheet (2014-11-06) recommended configuration:
    insert CIN=0.1uF and COUT=0.1uF ceramic at the VIN/VOUT pins for stable
    input/output operation. SOT-23-5. Digi-Key hand-solder FALLBACK for the BOM
    LDO TLV70018DDCR (ADR-0015) — same SOT-23-5 land + config.
  notes: >-
    0.1uF Cin/Cout ceramics hard against VIN/VOUT pins; 1V8 output kept short
    to the XU316 VDDIOB18 pins. No P-ADJ keep_short (VIN/VOUT are board rails).
