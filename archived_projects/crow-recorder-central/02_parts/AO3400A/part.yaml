limits:
  vds_max: 30V
  vgs_max: ±12V
  id_continuous: "5.7A at TA=25C (4.7A at 70C)"
  id_pulsed: 30A
  vgs_th: "0.65V min / 1.05V typ / 1.45V max (ID=250uA)"
  rds_on_2v5: "24mOhm typ / 48mOhm max (VGS=2.5V, ID=3A)"
  rds_on_4v5: "19mOhm typ / 32mOhm max (VGS=4.5V, ID=5A)"
