# pluto-cal-switch — the E-TOPO / E-MARGIN / E-OFF input.
#
# Graded by skills/kicad-pcb/scripts/power_topology.py.
#
# ============================================================================
# A GATE GAP THIS BOARD REPORTED — AND WHICH IS NOW CLOSED (2026-07-27)
# ============================================================================
# E-TOPO COULD NOT EXPRESS A LINEAR REGULATOR, AND THIS BOARD'S ONLY CONVERTER
# IS ONE. `normalize_type()` mapped a part.yaml `type:` to exactly one of
# buck / boost / buck_boost by substring; anything else returned None and
# resolve_converter() raised LoadError, which power_topology.py reported as a
# CONFIG error and exited 2. `converter:` is REQUIRED per rail, so the rail
# could not be declared without naming one.
#
# THE THREE WAYS OUT, AND WHY ONLY ONE WAS HONEST:
#   (a) omit power_tree.yaml entirely -> the checker returned N-A and exit 0.
#       REJECTED: that is the M-COVER silent-skip class. The board would have
#       an ungraded, undeclared power tree and the gate would print OK.
#       THREE OTHER FLEET BOARDS TOOK THIS ROUTE (smc0985-cooksense with
#       `rails: []` plus an ignored `linear_rails:` key, and both
#       crow-recorder-central revisions with their LDO rails in a comment).
#   (b) label the LDO `..._buck` so the substring match fires. REJECTED: it is
#       a false statement in a part.yaml, and canon M4 calls a rationale
#       without evidence an inherited defect. It would also make E-TOPO grade
#       the wrong thing — a linear regulator is not a switching buck.
#   (c) DECLARE THE RAIL TRUTHFULLY, let the gate fail on ITS OWN gap, and
#       report the gap upstream. CHOSEN — and it is why the gap got fixed.
#
# THE FIX, LANDED 2026-07-27. normalize_type() now returns LINEAR for a linear
# pass element. LINEAR is NOT a fourth topology: it is one IMPLEMENTATION of a
# step-down requirement, so the Vin-vs-Vout derivation is unchanged and the
# over-engineering verdict still fires exactly as before —
#   Vout_max (3.366) < Vin_min (4.40) ALWAYS  =>  STEP-DOWN REQUIRED,
# and a boost or buck-boost stage here would still be over-engineering (the
# usb-hub-3s class). What LINEAR adds is the two failure modes the topology
# derivation is BLIND to, now graded from typed part.yaml fields:
#   headroom = Vin_min - Vout_max = 1034 mV  >=  dropout_mv 120     -> PASS
#   PD = (Vin_max - Vout_min) x Iout = 202 mW  <=  pdiss_max_mw 300 -> PASS (67%)
# Those two numbers were already in this repo, in `gotchas:` prose that nothing
# could read. Turning them into fields is the ADR-0004 shift-left move.
#
# The engineering argument for choosing linear here is unchanged and is a
# JUDGEMENT the gate does not make: at 60 mA and 1.7 V of drop a switcher's
# inductor, switching-node radiation and spurs would be the WORSE choice on a
# board whose entire product is a clean 70 MHz-6 GHz measurement.
# ============================================================================

# ---- E-OFF: N-A, and stated deliberately rather than omitted ---------------
# The board's ONLY energy source is the USB host. Unplugging the cable
# de-energizes it completely: no cell, no pack, no stored charge beyond
# ~6.8 uF of ceramic. There is nothing to self-drain in storage, so E-OFF's
# battery-detection path does not fire and no off_control/quiescent_ua
# declaration is required. See ADR-0009.
source_type: usb

# OPTIONAL: the shared input trunk's netclass. Declared so an under-built
# trunk is a FAIL rather than an advisory.
input_trunk_class: PWR

rails:
  - name: 3V3
    # Vin is the USB VBUS envelope at OUR connector, taken from the SPEC and
    # not from "5 V": USB 2.0 Table 7-7 "DC Electrical Characteristics" p.178
    # gives 4.75-5.25 V at a high-power port and 4.40-5.25 V at a low-power
    # port. 4.40 V is the worst realistic steady state. (The 4.070 V transient
    # floor is NOT used as vin_min — it is a transient, and the LDO still has
    # 0.77 V of headroom there.)
    vin_min: 4.40
    vin_max: 5.25
    # Fixed 3.3 V output. The window is the regulator's own +/-2% accuracy.
    # NOTE the E-MARGIN `feedback:` block does NOT apply: this is a FIXED
    # output with no external divider, so there are no divider tolerances to
    # stack. Declared absent deliberately.
    vout_min: 3.234
    vout_max: 3.366
    # THE DESIGN ENVELOPE, not the typical. RP2040 ~50 mA worst case + flash
    # ~5 mA + two BGS12WN6 at 125 uA max + two LEDs at 1.9 mA ~= 60 mA typical.
    iout_max_A: 0.10
    converter: ME6211C33M5G-N
    eff: 1.0    # A LINEAR RAIL'S `eff` IS NOW IGNORED BY THE INPUT-CURRENT
                # MODEL, and this comment used to be wrong about why it was
                # set. A switching rail draws CONSTANT POWER (Iin = Pout/eff /
                # Vin); a linear rail draws CONSTANT CURRENT (Iin = Iout + Iq,
                # whatever Vin does). Feeding a linear rail through the
                # switching formula at eff 1.0 gave 3.3 x 0.1 / 4.4 = 0.075 A
                # for a rail that draws 0.100 A — 25% LIGHT, in the direction
                # that under-states trunk copper. power_topology.py now sums
                # Iout directly for a LINEAR rail and reports 0.1 A. Kept at
                # 1.0 because the schema requires the field.
    # E-MARGIN: `load_uv_threshold` is DELIBERATELY ABSENT. The 3V3 loads are
    # an MCU, a flash and two RF switches with no published brownout voltage
    # that this rail must clear — unlike the Pi5-on-5V case that motivated
    # E-MARGIN.
    # DISSIPATION IS NOW A GRADED NUMBER, not a comment. E-TOPO computes it
    # from the part.yaml `pdiss_max_mw:` field:
    #   PD = (Vin_max - Vout_min) * Iout = (5.25 - 3.234) * 0.10 = 202 mW
    #   SOT-23 rating 300 mW (no ambient stated) => 67% at the envelope.
    # (This block previously used Vout 3.30 and got 195 mW; the gate takes the
    # WORST corner, Vout_min, which is the larger drop.)
    # ABOVE ~120 mA THIS PART IS WRONG and must escalate to SOT-89
    # (XC6227C331PR-G, C6035451, 500 mW) or to a buck. See ADR-0009 — and note
    # the gate now enforces the boundary rather than trusting this note.

# ---- THE ONE MARGIN THAT IS NOT ON THIS RAIL ------------------------------
# The tightest supply-vs-part margin on the board is NOT a brownout, it is an
# OVER-voltage against an absolute maximum, and it is the reason ADR-0002
# picked BGS12WN6 over BGS12P2L6:
#   this rail's worst-case HIGH corner            3.366 V
#   BGS12P2L6 VDD operating maximum               3.400 V   =>  34 mV margin
#   BGS12WN6  VDD operating maximum               3.600 V   =>  234 mV margin
# E-MARGIN grades the LOW corner against a load's brownout; nothing in the
# power-tree schema grades the HIGH corner against a load's rated maximum.
# Recorded here so it is visible, and asserted in electrical_invariants.yaml
# as far as a netlist gate can reach it.
