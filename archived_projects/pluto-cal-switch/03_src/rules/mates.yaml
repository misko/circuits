# pluto-cal-switch — the foreign facts this board's design SPENDS.
# Canon D-MATE / M-IMPORT (ADR-0005). Graded by
#   skills/kicad-pcb/scripts/import_provenance_check.py .
#
# THIS FILE HOLDS NO NUMBERS, ON PURPOSE. The facts live once, in
# `spf/plutoplus_hardware/` (README.md is the record, facts.yaml its machine
# index); this file names the ones this board consumes and says WHERE each is
# spent. Boards reference; they never restate — the same rule, for the same
# reason, as `assembly.yaml` being the single home for "who gets placed"
# (cooksense v1.1 shipped 13 CPL rows contradicting its own MANIFEST because
# two files held one fact and drifted).
#
# The human-facing twin is the BRIEF's `## Mating fact-lock` table, which
# states each grade for a reader; this is the machine copy — exactly the
# relationship `power_tree.yaml` has with the Commission fact-lock.
#
# ---------------------------------------------------------------------------
# 2026-07-27, A8 — THIRTEEN OF THESE CONSUMPTIONS ARE NOW RETIRED, AND THAT IS
# THE MOST INTERESTING THING IN THE FILE.
#
# The board no longer bolts onto the PlutoPlus. It connects with SMA CABLES
# (ADR-0015), so the two boards' connector positions no longer have to agree
# about anything: the span, the seven pitches, the barrel OD, the connector
# keep-out envelope, the superseded CAD span, the RF-axis height and the
# mounting-hole positions are consumed by NOTHING on this design any more.
#
# They are kept here, marked RETIRED with the date and the cause, rather than
# deleted — because a consumption that vanishes silently is indistinguishable
# from one that was never declared, and this board is the reason M-IMPORT
# exists. `use:` still describes the FACT's honest status (an OWED fact stays
# `owed`: retiring OUR need for a number does not give anybody the number),
# and `where:` now says the site is retired instead of naming one.
#
# What SURVIVES the cable decision is the short list at the top: the port
# ORDER, the connector GENDER — and, newly, the two TRANSCEIVER limits the
# 40 dB pad is sized against (ADR-0016), which were living as ungraded prose
# in DETAIL_DESIGN and belonged here all along.
# ---------------------------------------------------------------------------

device: plutoplus_hardware

why: >-
  This board connects to an ADALM-PlutoPlus — hardware this repo did not
  design and for which the vendor publishes no PCB source, no DXF, no STEP and
  no dimensioned drawing. What it consumes from that device changed shape on
  2026-07-27: with SMA cables between the two, no GEOMETRY crosses the
  boundary at all, and what crosses instead is ELECTRICAL — the receiver's
  damage threshold and the transmitter's maximum, which are what a 40 dB
  protective pad is sized against.

consumes:

  # ======================================================= ACTIVE (5)

  - fact: port_order
    use: informational
    where: >-
      net assignment: which cable goes to RX1 / RX2 / TX, and therefore which
      of this board's five SMA jacks carries which net. The two RX ports being
      adjacent no longer buys the layout anything (the mirror axis is now ours
      to place freely), but the ORDER still has to be right or the two channels
      report transposed — which is invisible to every gate on this board.

  - fact: sma_gender
    use: informational
    where: >-
      ADR-0015's gender chain. Pluto ports are JACKS (female) => the cables are
      MALE-MALE => this board's five ports are JACKS (female). NOTE WHAT THE
      CABLE DID TO THIS FACT'S EXPOSURE: under ADR-0006 it decided a $101
      adapter order and getting it wrong meant buying the wrong adapters twice.
      With a cable in the path it decides only WHICH CABLE TO BUY — our own
      port gender is set by convention and by what a standard male cable end
      mates with, not by the Pluto. The fact is still consumed; the money is
      no longer riding on it.

  - fact: ad936x_rx_abs_max_input
    use: informational
    where: >-
      the SURVIVAL side of the pad sizing (ADR-0016, DETAIL_DESIGN 6.1). It is
      the number the >=40 dB minimum defends: worst-case RX level must sit
      below it with the whole TX attenuator commanded to 0 dB by mistake. It
      is a PEAK rating, and the calibration stimulus is a CW tone, so peak =
      average here.

  - fact: ad936x_tx_max_output_power
    use: informational
    where: >-
      the DRIVE side of the same sizing. The pad is sized against TX MAXIMUM,
      never TX intended — the whole point is surviving a misconfiguration. This
      fact is why the BRIEF's TX row moved from "~+7 dBm, unlocked" to
      "+8 dBm, cited": +7 dBm is the WORST of the three characterized bands and
      was being carried as if it were the ceiling.

  - fact: plutoplus_tx_frontend_active
    use: owed
    where: >-
      the gap between the two facts above and the actual TX PORT. The cited
      +8 dBm is the TRANSCEIVER's maximum; it bounds the SMA port only if the
      path between them is passive, and nobody has established that on a
      PlutoPlus. DETAIL_DESIGN 6.1 states what the design assumes meanwhile and
      how much gain the >=40 dB minimum would absorb before the RX rating is
      reached (+27 dBm at the port, i.e. 19 dB of undiscovered TX gain).

  # ======================================================= RETIRED (13)
  # All retired 2026-07-27 by A8 (SMA cables, ADR-0015). Each entry keeps its
  # id and its grade; only the SITE is gone.

  - fact: sma_span_genuine
    use: informational
    where: >-
      RETIRED 2026-07-27 (A8 / ADR-0015). Was: one half of the 34.88 mm
      midpoint the three SMP anchor X coordinates were built to (D6/ADR-0014).
      Cables mean this board's connector positions are no longer referenced to
      the Pluto's at all, so the midpoint, the anchors and D6 are all moot.
      The 0.32 mm disagreement between the two units — the headline finding of
      the device record — now costs this design nothing.

  - fact: sma_span_clone
    use: informational
    where: >-
      RETIRED 2026-07-27 (A8 / ADR-0015). Was: the other half of the midpoint.
      Same reason as `sma_span_genuine`.

  - fact: pitch_tx2_rx2_genuine
    use: informational
    where: "RETIRED 2026-07-27 (A8 / ADR-0015). Was: floorplan SMP anchor spacing, genuine unit."

  - fact: pitch_rx2_rx1_genuine
    use: informational
    where: >-
      RETIRED 2026-07-27 (A8 / ADR-0015). Was: the D-free middle pitch, and the
      number that proved the pitch is NOT uniform — the fact that would have
      made a uniform-pitch floorplan fail to mate. With cables there is no
      pitch to match.

  - fact: pitch_rx1_tx1_genuine
    use: informational
    where: "RETIRED 2026-07-27 (A8 / ADR-0015). Was: floorplan SMP anchor spacing, genuine unit (D-free)."

  - fact: pitch_tx2_rx2_clone
    use: informational
    where: "RETIRED 2026-07-27 (A8 / ADR-0015). Was: floorplan SMP anchor spacing, clone unit."

  - fact: pitch_rx2_rx1_clone
    use: informational
    where: "RETIRED 2026-07-27 (A8 / ADR-0015). Was: floorplan SMP anchor spacing, clone unit (D-free)."

  - fact: pitch_rx1_tx1_clone
    use: informational
    where: "RETIRED 2026-07-27 (A8 / ADR-0015). Was: floorplan SMP anchor spacing, clone unit (D-free)."

  - fact: barrel_od
    use: informational
    where: >-
      RETIRED 2026-07-27 (A8 / ADR-0015). Was: the D-subtraction behind the two
      outer pitches, so it was spent wherever they were. Retired with them.

  - fact: connector_outline_width
    use: informational
    where: >-
      RETIRED 2026-07-27 (A8 / ADR-0015). Was: the keep-out envelope around
      each Pluto-side connector body — how close this board's own parts could
      come to the mating face. There is no mating face now; a cable's own
      bend radius is the only clearance question left, and it is the user's.
      NOTE this retirement also retires the file's only ESTIMATED-used-
      DIMENSIONALLY row, i.e. the only place M-BAR had anything to grade.

  - fact: cad_span_plot
    use: informational
    where: >-
      RETIRED 2026-07-27 (A8 / ADR-0015) as a consumption, but it is the one
      row worth keeping VISIBLE for its own sake: it is the 35.60 mm number
      that three independent extractions agreed on to 0.003 mm and that the
      caliper then put 0.56 mm wrong, against a +-0.05 mm window. It is the
      incident this whole gate exists for. Referenced so that the number that
      was almost built on keeps its grade attached instead of quietly
      disappearing from the record.

  - fact: rf_axis_height_above_pcb
    use: owed
    where: >-
      RETIRED 2026-07-27 (A8 / ADR-0015). Was: the board's Z position relative
      to the Pluto, and the ONE BLOCKING mechanical item on this design. Cables
      mean the two boards have no Z relationship — and the Pluto is in a
      two-part aluminium case, so its PCB was never the mating reference in the
      first place. `use:` stays `owed` deliberately: the fact is still OWED in
      the device record. This board ceasing to need a number is not the same
      as somebody obtaining it.

  - fact: mounting_hole_positions
    use: owed
    where: >-
      RETIRED 2026-07-27 (A8 / ADR-0015). Was: the optional bracket that would
      have taken load off the push-on connectors. With cables there is no
      engagement force to relieve (135 N of push-on is gone), so there is no
      bracket. Stays `owed` for the same reason as the row above.
