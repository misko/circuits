# pluto-cal-switch — the AUTHOR'S declared refdes set (canon S-COUNT base).
#
# Hand-authored ALONGSIDE src/pluto_cal_switch.tsx, not derived from it.
# count_parity.py checks this set against every GENERATED artifact
# (circuit.json / kicad_sch / netlist / board). That asymmetry is the whole
# point: after a silent tsci drop every generated artifact AGREES WITH ITSELF,
# and only declared intent disagrees.
#
# 73 components. Holes are non-electrical and excluded (count_parity SKIPs ^H\d);
# they come from 03_src/floorplan.yaml `mounting_holes:`, not from the tsx.
#
# Blocks: 7 J (5 SMA + micro-USB + 1x4 header) · 16 U (9 YAT attenuator chips,
# 2 SPDT, MCU, flash, LDO, 2 ESD arrays) · 16 R · 27 C · 2 FB · 1 F · 2 D ·
# 1 Y · 1 SW.
#
# THE NINE YAT CHIPS ARE THE HEADLINE COUNT AND THEY ARE NOT PADDING.
# A9/ADR-0016 raised the cal-path spec to a >=40 dB MINIMUM, which is sized
# against DATASHEET MIN COLUMNS: 3x YAT-10A+ + 4x YAT-2A+ in the TX->RX path
# gives 34.1 dB guaranteed at 5-15 GHz, plus the splitter theorem's 5.97 dB
# = 40.07 dB. One chip less (3x10 + 3x2) is 38.67 dB and FAILS. On the board
# that is 4x YAT-10A+ and 5x YAT-2A+, because PAD_A1 is crossed once and each
# arm pad only by its own arm.
