     industry-standard 5.08 mm pattern, used as the footprint starting point"
sourcing:
  lcsc: C504007
  alternates: [C496549, C411575]  # BWSMA-KE-Z001 (113k stock, same pattern);
                                  # KH-SMA-K513-G right-angle (28k, same pattern)
asserts:
  - assert: value
    equals: KH-SMA-KE-Z
    why: "the 5.08 mm square is an industry-standard pattern shared by parts that
      are NOT interchangeable — including an RP-SMA variant one character away in
      the same vendor range that fits the footprint and cannot mate with a
      standard SMA cable. Code identity is not sufficient here; the BOM Comment
      must name the exact model."
