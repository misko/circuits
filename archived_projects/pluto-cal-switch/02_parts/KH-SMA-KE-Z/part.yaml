mpn: KH-SMA-KE-Z
manufacturer: Shenzhen Kinghelm
type: connector_sma_jack_vertical_tht
mates: receptacle             # SMA JACK (female shell, female socket contact).
                              # Read from PRINTED DATASHEET FIELDS, never from
                              # the part-number suffix — see the verification
                              # note below, and the RP-SMA gotcha. Used x5 on this board (ADR-0015):
                              # 2 antenna ports + 3 cable ports to the Pluto.
datasheet:
  doc_id: KH-SMA-KE-Z
  revision: "C504007"         # vendor publishes no revision string; LCSC code
  url: https://www.lcsc.com/product-detail/C504007.html
  sha256: 05257621aa124d9a077a47230c4ffc0030b23477c0e5c5e694abffa5f8daee08
  fetched: 2026-07-27
  pages: 2
package: Vertical through-hole square-flange SMA jack, 1/4-36 UNEF, 13.5 mm overall
footprint: pluto_cal_switch:SMA_Vertical_5.08sq_D1.4
escape:
  style: connector
  pitch: 5.08
  escapes_worst_side: 1
  tier_required: jlc_2layer_default
  checked: escape_check 2026-07-27
pins:                         # drawing sheet 2/2 'PCB layout': 5 x D1.4 mm holes,
  1: RF                       # four on a 5.08 x 5.08 mm square plus one at the
  2: {name: GND, tie: GND}    # CENTRE. Centre hole = signal; the four corner
  3: {name: GND, tie: GND}    # posts = ground.
  4: {name: GND, tie: GND}
  5: {name: GND, tie: GND}
limits:
  frequency: DC to 6 GHz      # datasheet p.1
  impedance: 50 ohm
  vswr: "<=1.35 over DC-6 GHz"   # p.1 — the reason this part was chosen
  dielectric_withstanding: ">=1500 V"
  durability: ">=500 mating cycles"
  mating_torque: 0.8-1.13 N.m
gotchas:
  - "GROUND HOLES ARE D1.4 mm, NOT D1.3. A 0.9 mm SQUARE post has a 1.273 mm
     diagonal; a D1.3 hole leaves 0.014 mm radial clearance, INSIDE JLC's
     plated-hole tolerance. D1.4 gives 0.064 mm. This is a deliberate,
     arithmetically justified override of some vendors' own recommended D1.3."
  - "THE KiCad STOCK FOOTPRINT IS TOO LOOSE. Connector_Coaxial:
     SMA_Wurth_60312002114503_Vertical is the right PATTERN (pad 1 circle 2.05 /
     drill 1.5 at 0,0; pad 2 x4 circle 2.25 / drill 1.7 at +/-2.54,+/-2.54) but
     its drills are 0.1-0.3 mm looser than D1.4. Tighten them for a repeatable
     launch."
  - "RP-SMA LANDMINE, ONE CHARACTER AWAY IN THE SAME VENDOR RANGE. DreamLNK
     SMA-KE-P901 (C914556) and SMA-KWE901 (C914553) are described as 'Male Pin'
     in an external-thread shell, i.e. REVERSE-POLARITY SMA — they will not mate
     with a standard SMA male cable. C914556's own datasheet says inner-needle
     where the correct part says inner-hole. A price-driven substitution yields a
     board that assembles cleanly and CANNOT BE CONNECTED."
  - "DO NOT SUBSTITUTE ON APPEARANCE: C914559 SMA-KE901 has a 4.90 mm post
     square, not 5.08 — the legs will not enter. C5250058 BWSMA-KE11 has an
     OFFSET pin pattern (centre pin not on the flange axis). Pin '5.08' in the
     footprint NAME."
  - "EVERY LAUNCH RULE IS DERIVED ENGINEERING, NOT VENDOR INSTRUCTION. The
     datasheet has no Application/Layout section, no via-fence rule, no antipad
     rule, no board-thickness requirement and no VSWR curve. It cannot be waived
     by citing the datasheet. See ADR-0007."
  - "MECHANICAL LEVER ARM is why this part beat BWSMA-KE23: 13.5 mm overall
     versus 28.6 mm, on the same four 0.9 mm posts. The rejected part also has
     NO VSWR spec at all, and its single HF number (0.15 dB at 6 GHz) is
     0.06*sqrt(6) = 0.147 — the industry-standard SMA insertion-loss FORMULA
     evaluated at 6 GHz, i.e. transcribed boilerplate, not a measurement."
  - "THT: this part DISQUALIFIES the board from JLC Economic PCBA and adds
     ~$6.93/order ($3.50 setup + ~$0.0173/joint + $3.00 extended-component)."
  - "The datasheet contradicts LCSC's parametrics on temperature range. Only the
     PDF counts for this vendor class."
verified: "pin/hole map read from the drawing on sheet 2/2, which states the
  recommended PCB layout explicitly as 5-D1.4 on 5.08 +/-0.05 x 5.08 +/-0.05 mm
  with the centre hole at the square's centre; centre pin D1.00 +/-0.05.
  GENDER, RE-VERIFIED 2026-07-27 AND THE EARLIER CLAIM CORRECTED: this field
  previously said the gender was read from 'the part-number decode on p.1'.
  THERE IS NO PART-NUMBER DECODE ON p.1 - p.1 carries the model string in the
  型号 field and nothing else, so that claim named a source that does not
  exist. What IS printed: (a) p.1 产品名称 (product-name) field reads
  'SMA 直式印制面板插座' - 插座 is receptacle/socket, i.e. JACK; (b) sheet 2/2
  outline shows the mating end as a FIXED barrel with an EXTERNAL 1/4-36UNEF
  thread at D6.2 and NO coupling nut, which is the jack shell form (a plug's
  shell sits inside a rotating internal-thread coupling nut). NEITHER PAGE
  STATES THE CENTRE-CONTACT POLARITY IN WORDS, so (a)+(b) prove FEMALE SHELL
  and do not by themselves exclude RP-SMA. That residual is closed by a SECOND,
  INDEPENDENT source (canon M-QUOTE, CITED): LCSC product page C504007,
  https://www.lcsc.com/product-detail/C504007.html, read 2026-07-27 -
  'CONN RCPT SMA TH', interface type 'Inner hole'. Two sources, two different
  properties, and the gap between them named rather than papered over."
layout:
  source: "Datasheet sheet 2/2 states ONE layout demand — the 5-D1.4 @ 5.08 hole
    pattern. There is NO Application or Layout Information section anywhere.
    Everything below is DERIVED and is labelled as such. Contrast Amphenol
    132289 (dwg rev B), whose drawing DOES carry a RECOMMENDED PCB LAYOUT down
    to note 7 'BOARD THICKNESS = 1.57 MM' — that is what a real launch spec
    looks like, and this part does not have one."
  reviewed: "2026-07-27"
  keep_short:
    # RE-POINTED 2026-07-29, AND IT WAS NEVER A PASS. These two entries used to
    # name SW1_ANT / SW2_ANT with a single 25 mm budget. This part is placed as
    # the five SMA jacks and NONE of them carries a pad on SW1_ANT/SW2_ANT: the
    # DC block (ADR-0005) is a SERIES element that splits the antenna node into
    # TWO nets, and the jack sits on the OTHER one. P-ADJ's old whole-net metric
    # graded the budget anyway, off C_DCBLK1.2 -> U_SW1.3 — two pads belonging
    # to parts that are not this part — and printed PASS. P-ADJ-UNREACHED now
    # says so ("carries NO pad on it, so the budget's own part is not in it").
    #
    # THE PHYSICAL QUANTITY the 25 mm was about is the WHOLE jack->switch run,
    # which is two nets and therefore not expressible as one budget. MEASURED on
    # the regenerated board, by an independent pcbnew script:
    #     J_SMA_ANT1.1 -> C_DCBLK1.1  13.300 mm   (RX_ANT1, the jack's own leg)
    #     C_DCBLK1.2   -> U_SW1.3      5.800 mm   (SW1_ANT, the switch's leg)
    #     J_SMA_ANT1.1 -> U_SW1.3     20.000 mm   TOTAL = 0.72 dB at 6 GHz
    # and the arm-2 numbers are 13.300 / 5.800 / 20.000 — IDENTICAL to 0.000 mm,
    # which is the "identical on both channels so the loss is common-mode" half
    # of the original why, now measured instead of asserted.
    # The 25 mm total is SPLIT AT THE PART BOUNDARY so each leg is graded by the
    # part that actually owns a pad on it: 16 mm here + 9 mm on BGS12WN6 = the
    # same 25 mm ceiling, no loosening. anchor_pins: ["1"] states the anchor —
    # pin 1 is the centre contact, and an unstated anchor is a hidden assumption.
    - {net: RX_ANT1, max_span_mm: 16, anchor_pins: ["1"], why: "the jack's own
       leg of the antenna run, jack centre pin to the DC block. Kept short for
       FR4 loss (0.036 dB/mm at 6 GHz on this stackup); 16 mm + BGS12WN6's 9 mm
       on SW1_ANT is the 25 mm total this entry used to claim as one number"}
    - {net: RX_ANT2, max_span_mm: 16, anchor_pins: ["1"], why: "the mirror of
       the above, and it must stay the mirror: the two legs are 13.300 mm each,
       so the FR4 loss is common-mode and cancels in the D4 arm comparison"}
    - {net: TX_PLUTO, max_span_mm: 15, why: "ADR-0015: this port is now an SMA
       jack, not an SMP edge launch. It feeds PAD_A1 directly and every mm of
       it is 0.036 dB at 6 GHz that lands in the published loss curve"}
    - {net: RX_PLUTO1, max_span_mm: 15, why: "ADR-0015: SMA jack into SW1.RFin.
       Must be IDENTICAL to RX_PLUTO2 - this pair is inside the D4 arm-to-arm
       comparison, so an asymmetry here is indistinguishable from an arm
       mismatch"}
    - {net: RX_PLUTO2, max_span_mm: 15, why: "the mirror of the above, and the
       other half of the same pair"}
  notes:
    - "BOTTOM-PLANE ANTIPAD >= D3.5 mm, opening OUTWARD toward the 5.08 mm post
       square — NOT the D2.6 mm minimum-DRC value. For a THROUGH-HOLE jack the
       launch's dominant terms are the ~1.4 mm barrel crossing the board
       (+0.425 pF as a low-Z coax section) and the bottom pad sitting inside the
       antipad (0.192 pF annular gap), which are 2-5x the top-pad term (0.081 pF).
       Opening D2.6 -> D3.5 buys ~9 dB of return loss at 6 GHz for free. The
       sourcing spike derived this rule BACKWARDS — computing a top-pad
       capacitance to SOLID copper and then specifying an antipad that deletes
       100% of that copper — and it would have been frozen into the footprint."
    - "PER-PORT LAUNCH RETURN LOSS AT 6 GHz IS ~11-15 dB, not 22.3 dB. Two
       independent lumped models agree once the barrel is included. Carry the
       pessimistic figure or MEASURE it; do not carry 22.3 dB."
    - "GROUND-VIA FENCE at <=2.0 mm pitch (lambda_g/12 at 6 GHz) immediately
       outside the 5.08 mm square, continuing down BOTH sides of the RF trace for
       at least the first 10 mm. lambda_g in bulk FR4 at 6 GHz is 24.1 mm and the
       four posts sit at 5.08 mm (lambda_g/4.7) — THE POSTS ARE NOT A SHIELD.
       Omitting the fence produces both poor return loss and poor port-to-port
       isolation, and the connector will get the blame."
    - "Keep the top-side pour CONTINUOUS right up to the four ground pads — that
       is where the connector's return current wants to land."
    - "The 50 ohm line on this stackup is 0.35 mm wide, so it clears the ground
       pads comfortably. On the 1.6 mm 2-layer stackup the spike proposed, a
       50 ohm microstrip is 3.112 mm wide against a ground-pad edge at
       1.415-1.540 mm — NEGATIVE clearance. That is one of the reasons 2-layer
       is refuted (ADR-0010)."
