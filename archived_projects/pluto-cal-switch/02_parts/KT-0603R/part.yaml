gotchas:
  - "FOOTPRINT ADOPTED FROM THE KiCad STOCK LIBRARY, WITH THE COMPARISON
     DECLARED PARTIAL (2026-07-28). No manufacturer PDF is vendored for this
     SKU (see datasheet:/verified:), so NO vendor land drawing was compared --
     the adoption rests on the 1608-metric chip envelope in the LCSC record
     (1.6 x 0.8 mm) and KiCad's IPC-7351 nominal land (0.875 x 0.95 at
     +/-0.7875), which is the same land the 22 stock 0402/0805 passives on
     this board already use. Closing gate: jlc_twin PAD-GEOM at stage 7
     against JLC's own model for C2286."
  - "THE 680 ohm SERIES VALUE WAS DERIVED AGAINST Vf = 2.0 V (DETAIL_DESIGN
     sec.9: (3.3 - 2.0)/2 mA = 650 ohm -> E24 680 ohm => 1.9 mA). This part's Vf
     window is 1.8-2.4 V, so the real current runs 1.32-2.21 mA across the
     window — the design point sits INSIDE it, and the power-tree envelope
     (2 x 1.9 mA = 3.8 mA against a declared 4 mA) holds at the worst corner."
  - "POLARITY IS THE ONLY THING AN LED CAN GET WRONG AND IT IS SILENT ON A
     RENDER. Pad 1 = CATHODE here; the board drives D_LED_MODE's ANODE from a
     GPIO and returns its cathode through the resistor to GND, and ties
     D_LED_PWR's anode to 3V3. A reversed LED simply never lights, which on a
     STATUS indicator reads as 'the feature is broken', not 'the LED is
     backwards'."
  - "TWO PER BOARD, SAME PART, DIFFERENT MEANING: D_LED_PWR (3V3 present) and
     D_LED_MODE (RF path is in LOOPBACK). They are the same red device, so the
     SILK is what distinguishes them — that is a functional-caption obligation,
     not decoration."
  - "JLC BASIC (componentLibraryType `base`), stockCount 7 594 081 read
     2026-07-28."
verified: "2-terminal passive — exempt from the datasheet-FIGURE pin-map rule
  (S-VER). Vf window, current rating, viewing angle, package and temperature
  read from the JLCPCB catalog record for C2286 (selectSmtComponentList, exact
  componentModelEn match, describe '1.6mm x 0.8mm square LED 1.8V~2.4V 120deg
  20mA ... 0603'), read 2026-07-28. THE CATHODE-ON-PAD-1 CONVENTION IS THE
  KiCad FOOTPRINT'S, not a vendor statement — it is the convention this repo's
  generators and the placement audit's polarity check both key on, and it is
  recorded here because part.yaml is where generators look (03_src/lib
  contract)."
