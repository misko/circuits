  reviewed: "2026-07-28"
  notes:
    - "KEEP BOTH LEDs AND THEIR RESISTORS OUT OF THE RF SECTION. An LED is a
       DC part but its trace from a switching GPIO is not, and ARCHITECTURE
       sec.10.5 puts every digital thing at the far end from the SMA jacks."
    - "Silk must name WHICH is which (PWR / LOOPBACK) — see gotchas."
