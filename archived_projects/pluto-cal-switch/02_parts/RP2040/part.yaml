gotchas:
  - "FOOTPRINT ADOPTED FROM THE KiCad STOCK LIBRARY AND IT IS AN EXACT MATCH
     -- COMPARED DATUM BY DATUM AGAINST FIGURE 167 'Recommended PCB Footprint'
     (PDF p609 / printed p608), RENDERED AND READ (2026-07-28). Figure 167:
     pad 0.875 x 0.200, pitch 0.400, land inner edge at 3.000 and outer at
     3.875 from centre (overall 7.75), per-row outer span 5.40, corner offset
     1.175, EP 3.20 x 3.20. KiCad
     Package_DFN_QFN:QFN-56-1EP_7x7mm_P0.4mm_EP3.2x3.2mm: pads 0.875 x 0.200
     at +/-3.4375 (inner 3.000, outer 3.875), pitch 0.400, pad 1 at -2.600 and
     pad 14 at +2.600 (5.20 centre-to-centre, 5.40 outer), pad 57 = EP 3.20 x
     3.20 with pad_prop_heatsink, plus four 1.29 x 1.29 F.Paste windows (65%
     EP coverage). Every datum agrees to 0.000 mm; KiCad's own descr cites
     this datasheet. Do NOT take the EP4x4 or EP5.6x5.6 variants -- Figure 167
     says 3.20."
  - "THE POWER-ON GPIO STATE IS THE REASON THIS PART IS HERE (ADR-0001), and it
     is documented THREE independent ways: PADS_BANK0 resets PDE=1 / PUE=0
     (Table 341, sec 2.19.6.3, p.301); SIO GPIO_OE resets to 0x00000000 so
     nothing is DRIVEN (Table 24, p.46); and Table 615 states the per-pin
     Reset State as the single word 'Pull-Down' for GPIO0..GPIO29. RPD is
     50-80 kohm (Table 625). A blank board from JLCPCB falls into the USB
     mass-storage bootloader (sec 2.8.1, p.129) whose bootrom touches only the
     QSPI pads, so the pull-down survives indefinitely."
  - "Table 614 (Pin Types) gives a BETTER citation than the pull-down for the
     USB-unplugged case: Digital IO (FT) pins are Fault Tolerant, meaning 'very
     little current flows into the pin whilst it is below 3.63V and IOVDD is
     0V'."
  - "VIH IS A FLAT 2.0 V AT IOVDD=3.3 V (Table 625) — NOT 0.65*IOVDD. PlutoPlus
     IO is 1.8 V, worst-case VOH = VCCO-0.45 = 1.35 V. A 1.8 V header wired
     directly to a digital input READS PERMANENTLY LOW, and the failure is
     FAIL-SAFE so no 'can it spuriously enter loopback' test finds it. The header
     therefore lands on GPIO28 as an ADC input through a /2.5 divider (ADR-0008)."
  - "REVERSE HAZARD: VOH is 2.62-3.3 V and a Zynq HR bank at VCCO=1.8 V has an
     IO absolute max of ~2.35 V. The reset state protects at power-on but NOT at
     runtime. An ADC-configured pin has its digital output DISABLED, which is why
     the header input is analog by construction, and the 2.2 kohm series bounds
     any fault to 0.45 mA regardless."
  - "DO-NOT-SUBSTITUTE: a 'pin-compatible upgrade' to a pre-A4 RP2350 DESTROYS
     the ADR-0001 safety argument — RP2350-E9 is the erratum where the pad
     pull-down cannot hold a floating input below ~2.2 V. (RP2040-E9 is a
     different, unrelated bootloader erratum; the two are easily confused.)"
  - "PIN CHOICE CONSTRAINTS: keep RF_CTRL off GPIO15 (errata RP2040-E5, the SDK's
     USB enumeration workaround uses it during bus reset); off GPIO0/1 if a debug
     UART is wanted; off QSPI_CSn (the BOOTSEL strap). The header input MUST be
     on GPIO26-29 (the only ADC-capable pins)."
  - "~29 OF 57 PINS ARE ELECTRICALLY LIVE, not the ~14 an early estimate assumed:
     12 power pins ALONE (IOVDD x6, DVDD x2, VREG_VIN, VREG_VOUT, USB_VDD,
     ADC_AVDD) plus the centre pad, each carrying a mandated capacitor. Plan the
     escape as a dense power ring plus a 6-bit bus, not a sparse fanout."
  - "WITH NO POWER PLANE (this board's L2 and L4 are both GND, which the RF and
     the USB pair both require), 3.3 V must reach six scattered IOVDD pins on L1
     and L3 through that escape. A PLACEMENT problem, not a routing problem."
  - "IT IS THE BOARD'S ONLY CONTINUOUS IN-BAND SPUR SOURCE. RP2040 executes in
     place from external QSPI flash, so a tens-of-MHz bus with sub-ns edges runs
     forever, plus a 12 MHz crystal comb, a 48 MHz USB PLL and clk_sys at
     125 MHz — all inside 70 MHz-6 GHz with harmonics past it. Mitigation is
     PLACEMENT: RP2040 + micro-USB at the far end from every SMA/SMP, QSPI short
     and local. Unquantified; recorded in ADR-0012 as a surviving objection."
  - "MSL: the DATASHEET classifies the bare device MSL 1 (sec 5.4, PDF p612).
     JLCPCB's part page for C2040 lists MSL 3 for the reeled part. The ORDER
     paperwork must state what JLC needs to bake to, not what the die is rated."
  - "FIRMWARE IS A RELEASE DELIVERABLE. A board with blank flash is SAFE
     (antenna mode) but not USABLE. 05_firmware/ is on the critical path and the
     release needs a built, versioned UF2 and its hash."
verified: "pin map read from section 5.5.2.2 'Pin List' — Table 615 (GPIO pins,
  PDF p612-613), Table 616 (QSPI, p613), Table 617 (crystal, p613), Table 618
  (SWD, p613), Table 619 (miscellaneous, p613-614), Table 620 (USB, p614) and
  Table 621 (power supply pins, p614) — extracted from the vendored PDF, and
  cross-checked for completeness: pins 1-56 plus the pad account for every
  number with no gaps and no duplicates. Reset states from the same Table 615
  Reset State column. 2026-07-27"
layout:
  source: "RP2040 datasheet sec 2.9.1 p.151 ('IOVDD should be decoupled with a
    100nF capacitor close to each of the chip's IOVDD pins'), sec 2.9.7.1 +
    Figure 16 p.152 (single-3.3 V scheme: VREG_VOUT must be connected to the
    DVDD pins OFF-CHIP), and Figure 167 'Recommended PCB Footprint' PDF p609.
    PLUS the vendor's own reference design, 'Hardware design with RP2040'
    Chapter 2 'Minimal design example': sec 2.1.2 pp.7-8 (one 100 nF per power
    pin), sec 2.1.3 p.8 ('We must place 1uF capacitors close to both the input
    (VREG_IN) and the output (VREG_OUT)'), sec 2.2 p.9 (QSPI 'wired directly to
    the flash, using short connections to maintain the signal integrity, and to
    also reduce crosstalk in surrounding circuits'; 1 kohm QSPI_SS-to-USB_BOOT
    and a DNF 10 kohm pull-up, both 'placed close to the flash chip'), sec 2.3
    p.10 + Table 1 sec 2.3.1 p.11 (12 MHz crystal, CL 10 pF, ESR <= 50 ohm,
    1 kohm series on XOUT), sec 2.4.1 pp.11-12 (27 ohm USB series termination
    'placed close to the chip'; 90 ohm differential; and 'we need to make sure
    that directly below these lines is a ground. A solid, uninterrupted area of
    ground copper, stretching the entire length of the track')."
  reviewed: "2026-07-27"
  keep_short:
    - {net: "3V3", max_span_mm: 4, why: "100 nF within a few mm of EACH of the
       six IOVDD pins and both DVDD pins — the vendor's reference design calls
       its own single violation (pins 48/49 sharing one cap) a compromise that
       'could have the effect of limiting the maximum speed'"}
    - {net: VREG_VOUT, max_span_mm: 5, why: "1 uF at the regulator output, and
       the OFF-CHIP link to both DVDD pins (sec 2.9.7.1)"}
    # WAS `net: VREG_VIN`, WHICH IS A PIN NAME AND NOT A NET NAME ON THIS BOARD
    # (2026-07-29). A-PROX reported it NOT EVALUATED — "no net on this board is
    # named 'VREG_VIN'" — and an unevaluated budget is a budget that cannot fail.
    # Pin 44 (VREG_VIN) is fed straight from the main rail here, so the net is
    # 3V3. The budget is kept at 5 mm rather than folded into the 4 mm 3V3 entry
    # above: they are different claims (that entry is about the IOVDD/DVDD
    # decoupling ring, this one is about C_VREGI specifically) and A-PROX dedupes
    # on (mpn, net, budget), so both are measured and the tighter one binds.
    - {net: "3V3", max_span_mm: 5, why: "1 uF at the regulator INPUT pin 44.
       Named 3V3 because that is the net pin 44 carries on this board; the pin
       is VREG_VIN"}
    - {net: QSPI_SCLK, max_span_mm: 12, why: "'short connections to maintain
       signal integrity and reduce crosstalk in surrounding circuits' — and on
       THIS board the surrounding circuit is a 70 MHz-6 GHz calibration path"}
    - {net: XIN, max_span_mm: 6, why: "crystal parasitics are budgeted at ~3 pF;
       'Try and keep the layout as short as possible'"}
    - {net: XOUT, max_span_mm: 6, why: "same, plus the 1 kohm damping resistor"}
    # RE-POINTED 2026-07-29, AND IT WAS NEVER A PASS. These two named USB_DP /
    # USB_DM with a 30 mm budget, and U_MCU carries NO pad on either: the 27 ohm
    # series terminator SPLITS the node, so the chip pins are on USB_DP_MCU /
    # USB_DM_MCU and USB_DP/USB_DM are the CONNECTOR side. P-ADJ's old whole-net
    # metric graded the budget off J_USB/U_ESD/R_USBP pads — three parts, none of
    # them this one — and printed PASS; P-ADJ-UNREACHED now says so.
    # THE DATASHEET SENTENCE IS ABOUT THE MCU-SIDE LEG. "27 ohm series
    # termination placed close to the chip" (hardware-design sec 2.4.1) is
    # exactly pin -> resistor, i.e. USB_D*_MCU, so that is what is now graded,
    # with the anchor pin NAMED. MEASURED on the regenerated board by an
    # independent pcbnew script:
    #     U_MCU.47 -> R_USBP.2   5.072 mm   (USB_DP_MCU)
    #     U_MCU.46 -> R_USBM.2   5.437 mm   (USB_DM_MCU)
    # 8 mm is the budget, DERIVED not copied: at USB FS the minimum specified
    # rise time is 4 ns and 8 mm of this stackup's microstrip is ~53 ps, i.e.
    # 1.3% of the edge, so the un-terminated chip-side stub is electrically
    # invisible at any length this board could plausibly use. The budget is a
    # PLACEMENT-INTENT floor that makes "close to the chip" falsifiable, and it
    # is not an SI limit — stated so nobody later reads 8 mm as a physics number.
    # NOTHING WAS DROPPED BY THE RE-POINT: the connector-side leg is already
    # graded, tighter, by USBLC6-2SC6's own 6 mm USB_DP/USB_DM budgets (ST
    # DocID11265 sec 2.2) — measured U_ESD.1 -> J_USB.3 5.186 mm and
    # U_ESD.4 -> R_USBM.1 4.832 mm. The end-to-end chip->connector run is a
    # TWO-NET quantity that no single-net budget can express; hand-measured here
    # for the record as U_MCU.47 -> J_USB.3 14.098 mm and U_MCU.46 -> J_USB.2
    # 13.607 mm, both well inside the 30 mm the old entries claimed.
    - {net: USB_DP_MCU, max_span_mm: 8, anchor_pins: ["47"], why: "27 ohm series
       'placed close to the chip' (sec 2.4.1) — pin 47 to R_USBP. The unbroken-L2
       requirement for the ENTIRE length, and never crossing an RF trace or a
       plane split, is a ROUTING rule and lives in notes: + zones:, not here"}
    - {net: USB_DM_MCU, max_span_mm: 8, anchor_pins: ["46"], why: "the mirror of
       the above, pin 46 to R_USBM"}
  notes:
    - "The 0.8 mm / 0.15 mm 90-ohm geometry in the vendor guide is specified for
       a 1 mm two-layer board and MUST be re-solved for this stackup — on
       JLC04161H-7628 it is 0.33 mm / 0.25 mm gap (DETAIL_DESIGN sec 1)."
    - "Centre pad to L2 with a via array."
    - "Recommended footprint (Figure 167, PDF p609): 7.75 / 6.00 / 5.40 / 3.20 mm
       reference spans, 0.40 mm pitch, 0.20 mm land width, 0.875 / 1.175 mm
       offsets. Thermal data Table 611: theta_JA 48.0 C/W."
layout_refs:
  - "RP2040 datasheet Figure 167 'Recommended PCB Footprint', PDF p609"
  - "'Hardware design with RP2040' Chapter 2, the vendor's own Minimal Design
     Example — an EXISTENCE PROOF that the full 56-pin escape closes on TWO
     copper layers with top-side-only components ('The relatively large minimum
     track width, clearances and hole sizes should make this design easily and
     cheaply manufacturable from a range of PCB suppliers', Ch.2 p.6). This
     board has 4 layers, so strictly more room than the reference"
  - "Raspberry Pi Pico open-source design files (the fabricated instance of the
     same reference)"
sourcing:
  lcsc: C2040
  alternates: []              # none: ADR-0012 datasheet-verified CH32X035F8U6
                              # and BLOCKED it; MCP2221A is DISQUALIFIED by
                              # ADR-0001; CH340C rejected on an unspecified
                              # DTR/RTS reset state
asserts:
  - assert: msl
    level: 3
    floor_life_h: 168
    why: "JLCPCB's part page for C2040 lists MSL 3 for the reeled part even
      though the datasheet classifies the bare device MSL 1 (sec 5.4). An
      assembler cannot INFER a moisture obligation, and a popcorned 0.4 mm-pitch
      QFN-56 is not recoverable. The order paperwork must STATE it."
