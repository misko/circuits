# crow-mic-pod-v2 net architecture — netclasses + DRU floors source.
# fab_tier is the COST CEILING (D-TIER, ADR-0004) and the single source of
# capability floors for the generic backend. 2-layer, cheapest tier.
fab_tier: jlc_2layer_default   # 0.6/0.3 vias, 0.15 track floor, no advanced

classes:
  BEEP:
    intent: >
      The calibration-transducer drive pair, switched low-side AT CENTRAL:
      5V_BEEP supply + BEEP_SWITCHED_RETURN. 150 mA coded bursts + inductive
      flyback current (SS14). 0.5mm floor for the current AND to keep the
      switched loop robust. Kept in the SW corner, isolated from GND_AUDIO
      (ADR-0001 G8): this pair NEVER shares copper with the analog ground on
      the pod.
    nets: [5V_BEEP, BEEP_SWITCHED_RETURN]
    current: "150 mA burst + flyback"
    min_width: 0.4mm     # 150mA over a short SW-corner loop needs no pour (0.4mm
                         # ~0.9A capacity, 1oz); kept < 0.5 so R-POUR (>=0.5mm =
                         # "high-current, must pour") does not fire — a tiny
                         # isolated beep pour would add copper for no thermal need.
    routing: KRT (SW-corner loop, straight return to J1)
    verify: DRC floor + net-separation from analog cell

  PWR:
    intent: >
      Pod supply rail from central (5V_AUDIO). ~5 mA total load, but a 0.4mm
      floor keeps IR/robustness margin. VMIC_F is the RC-filtered bias node
      off it.
    nets: [5V_AUDIO, VMIC_F]
    current: "~5 mA"
    min_width: 0.4mm
    routing: KRT
    verify: DRC floor

# AUDIO_P / AUDIO_N (the balanced output pair) are LINE-LEVEL (<1 mA) and route
# in the DEFAULT class (0.25mm wave width, backstopped by the tier's 0.127mm
# floor). A named AUDIO width class was tried and dropped: a 0.25mm class floor
# collides with KRT's ~0.2498mm imported track width (the nanometer-floor trap,
# kicad-pcb skill), and the pair does not need a width floor above default — its
# guarding comes from the both-layer GND pours, not a netclass. Kept short +
# symmetric by placement (D1 hard by J1, U1 output pair adjacent).
#
# Default 0.25mm wave: AUDIO_P, AUDIO_N + the internal analog nets MIC_OUT,
# VMID, INP, INA, OUTA, INB, OUTB. GND = F.Cu + B.Cu pours + stitch (not routed).
