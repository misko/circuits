  refs: [MK1]
  status: NO-CAD
  why: >
    "AOM-5024L-HD-R" is not a valid LCSC id (doesn't start with "C") — it is
    the part's MPN, carried into the BOM's LCSC column by the v1.0 export.
    Fails closed as FETCH-FAILED (the fetcher's "should start with C" never
    matches the NOCAD/transient patterns) until adjudicated here.

    CORRECTED 2026-07-25 — the old justification was FALSE. This entry, the
    part.yaml gotcha and ORDER_README section 3 all asserted the capsule is
    "not in the JLC catalog". A live parts-library query that day returns
    the EXACT MPN as C3273706 (Extended tier), plus siblings C3273730 and
    C20107634. What is true is that all three are at STOCK 0, and that the
    footprint is through_hole while this order is SMT-only. "Searched and
    absent" and "catalogued and unbuyable" are different facts with
    different expiry dates, and only the second one is ours. The measured
    version now lives in 03_src/rules/assembly.yaml (MK1, reason
    user_supplied), which is the one machine-readable home for it.

    RESOLVED IN v1.1, NOT ADJUDICATED AWAY: MK1 no longer appears in
    fab/bom.csv at all, so nothing asks the twin to fetch it. This entry is
    retained as the record of a corrected claim.

