# policy_audit waivers — reviewed policy findings accepted WITH measurement
# evidence (canon M4 / M-WAIV). YAML list; each entry names the WAIVED check ID
# + refs + a why carrying the measured value and why it is acceptable. An entry
# without evidence is itself a FAIL (policy_audit grade()).
#
# AUTHORED 2026-07-22 during the v1.1 source-compliance pass on sealed v1.0.
# The sealed board is IMMUTABLE — these dispositions record that the v1.0
# PLACEMENT predates the P-LAYOUT/P-ADJ gates (added 2026-07-22) and that the
# over-budget spans are audio-band-negligible, cross-referenced to the sealed
# red-team release review (08_reviews/DISPOSITIONS.md). No board edit is implied;
# a v1.1 RE-SEAL would tighten these at re-route (remediation list, regrade report).

- id: P-ADJ
  refs: [OPA1678IDR/FB_A, OPA1678IDR/FB_B, CMT-8504-100-SMT-TR/BZ_P]
  measured:
    FB_A: "13.0mm (U1.2 -> R7.1) vs 8mm budget"
    FB_B: "15.2mm (R8.2 -> U1.6) vs 8mm budget"
    BZ_P: "16.1mm (D3.1 -> R12.2) vs 10mm budget"
  why: >-
    Three datasheet/ADR keep_short budgets backfilled 2026-07-22 are exceeded by
    the SEALED v1.0 placement, which predates P-LAYOUT/P-ADJ (04_kicad is immutable,
    so no re-place is possible without a v1.1 re-seal). Each over-span is
    audio-band-negligible and was independently confirmed benign by the sealed
    release red-team review:
    (1) FB_A 13.0mm and FB_B 15.2mm vs the OPA1678 8mm feedback-cluster target
    (SBOS855E 8.4.1, "keep RF/RG close to the inverting input to minimize parasitic
    C"): at 16MHz GBW the ~1pF added by a ~13-15mm 0.2mm trace forms a pole far above
    the audio band and the loop crossover — no THD/stability impact. Matches red-team
    L4 (op-amp C6-U1 loop, waived as audio-band-negligible). See the v1.0
    adopted-forward regrade report in 08_reviews/ and DISPOSITIONS.md.
    (2) BZ_P 16.1mm vs the ADR-0002 flyback-loop ~10mm framing: the SS14 clamp (D2)
    still freewheels the 150mA/4kHz coil-kick; the extra loop area raises radiated
    coupling slightly but D2 is populated and the beeper is a coded diagnostic burst,
    not an audio-critical path. Matches red-team L2 (D2-BZ1 anode leg 15.89mm, deferred
    as a next-rev routing optimization, explicitly "not a defect", DRC-clean).
    All three are on the v1.1 remediation list (re-route to honour the budgets); none
    is an electrical defect in the sealed v1.0 board.
