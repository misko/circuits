mpn: CMT-8504-100-SMT-TR
manufacturer: Same Sky (formerly CUI Devices)
type: magnetic_transducer_ext_drive
datasheet:
  doc_id: cmt-8504-100-smt-tr
  revision: 2024-09-11
  url: https://www.sameskydevices.com/product/resource/cmt-8504-100-smt-tr.pdf
  sha256: 8d99f06fac3fc94c0653506604168ba46390c59c5ccbc561bf3a82c316d2410b
  fetched: 2026-07-18
package: SMT 8.5x8.5x4.0mm, 4 corner castellated pads
footprint: pod:CMT-8504  # vendored (03_src/make_lib.py) from the datasheet recommended layout
pins:                     # from Mechanical Drawing p.2: top-view + recommended PCB layout
  1: "+"                  # POLARITY PAD (+) — top-left corner in the recommended-layout top view
  2: "-"                  # POLARITY PAD (-) — bottom-left corner (same side as +)
  3: DUMMY                # 2-DUMMY PAD bottom-right, mechanical only (3/4 numbered to match JLC C22359707 CAD: 1 TL, 2 BL, 3 BR, 4 TR)
  4: DUMMY                # dummy top-right, mechanical only
land_pattern:             # Recommended PCB Layout p.2: 9.5mm outer span, 4.5mm inner span
  pad_size: 2.5x2.5mm     # (9.5-4.5)/2 per side
  pad_centers: ±3.5mm both axes (corners)
limits:
  rated_voltage: 5.0 Vo-p
  operating_voltage: 1.0-6.0 Vo-p
  current: 150mA max at rated voltage, 4kHz, 1/2-duty square wave
  rated_frequency: 4000Hz
  spl: 100dB min at 10cm, rated drive
  coil_resistance: 12-18 ohm (15 typ)
  temp: -40 to +85C
gotchas:
  - "EXTERNALLY DRIVEN magnetic transducer (no internal oscillator): the central board's AO3400A low-side switch provides the 4kHz square wave over the dedicated pair — this pod carries no driver"
  - "Inductive load: needs the flyback clamp (SS14 populated) across the pair at the pod; TVS footprint provided empty as the doc's alternative clamp"
  - "Polarity pads are BOTH on one side (left column in the layout top view): + top-left, - bottom-left; the right-column pads are dummies — do not net them"
  - "Sound port is a 2.0mm hole in the TOP face: no PCB hole needed, but keep the port unobstructed in the enclosure"
  - "Reflow within 48h of opening vacuum pack; 260C max"
verified: "pad polarity + land pattern read from datasheet Mechanical Drawing (top/bottom views) and 'Recommended PCB Layout Top View', page 2, rev 2024-09-11 — 2026-07-18"
sourcing: {lcsc: C22359707, alternates: [], note: 'extended; exact MPN; stock 182 on 2026-07-18 (THIN - need 10; re-check order day, hand-solder Digi-Key fallback documented in ORDER_README)'}
escape: {style: connector, pitch: 3.0, tier_required: jlc_2layer_default, checked: escape_check}

# Datasheet LAYOUT-section compliance (P-LAYOUT / P-ADJ). Adopted-forward backfill 2026-07-22.
layout:
  source: "Same Sky CMT-8504-100-SMT-TR datasheet (2024-09-11): 'Recommended PCB Layout'
    (land pattern, p.2-3) + 'Application Circuit' (externally-driven low-side transistor from
    +VDC, p.4). The transducer datasheet gives a land pattern and a drive circuit only, NO
    PCB signal/net-span layout guidelines. Its layout-critical property is that it is an
    INDUCTIVE coil (12-18 ohm winding) driven with 4kHz current bursts -> the flyback clamp
    must sit close so the coil-kick freewheel loop stays short (this board: ADR-0002)."
  reviewed: "2026-07-22 — datasheet reviewed; confirmed no electrical Layout section (land pattern + external drive circuit only)"
  keep_short:                       # P-ADJ measures this net pad-span on the board
    - {net: BZ_P, max_span_mm: 10, why: "flyback clamp loop D2(SS14)/BZ1 kept short per ADR-0002 (~10mm framing): the coil-kick freewheel path must be local to the transducer, not routed away"}
  notes: "Externally driven (no internal oscillator) -> the pod carries no driver, only the
    transducer + its flyback clamp; the transducer itself imposes NO datasheet net-span budget.
    The BZ_P keep_short above is the ADR-0002 flyback-loop rule made mechanical (M2), NOT a
    transducer-datasheet number. On sealed v1.0 BZ_P measures 16.1mm (D2/D3 clamp cluster to
    R12) — over the 10mm target; dispositioned in policy_waivers.yaml (P-ADJ), consistent with
    red-team L2 (D2-BZ1 anode leg 15.89mm, deferred as a next-rev optimization, not a defect)."
