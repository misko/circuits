gotchas:
  - "Two-terminal electret: + pad is BOTH bias input and signal output — the 3.9k bias resistor from the filtered 5V rail sets the ~3V operating point (5V - 3.9k x ~0.5mA)"
  - "The (-) pad is tied to the metal case: connect to GND, and note case = GND when mounting near other metal"
  - "Soldering: iron < 90W, <= 360C, <= 2s per terminal — this is the reason the board carries wire pads / header rather than direct capsule reflow"
  - "Board footprint is a 2.54mm 2-pin pad pair (D6): capsule mounts in the enclosure acoustic cavity and connects by short twisted leads"
  - "NOT conformal-coated (project rule): coating blocks the acoustic port"
