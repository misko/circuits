sourcing:
  lcsc: C2286
  alternates: []               # DELIBERATELY EMPTY, and the reason is the
                               # opposite of the usual one. Red 0603 indicators
                               # are the most substitutable part on any BOM —
                               # C84263 (NCD0603R1, 2.5M stock), C157741
                               # (LTST-C193KRKT-5A, 964k), C94869 (LTST-C190KRKT)
                               # and dozens more drop into the identical land.
                               # Listing them would imply they are equivalent,
                               # and on the axis that matters they are NOT
                               # CHECKED: every one is `extended` tier, and each
                               # has its OWN Vf band that the 680 ohm ballast was
                               # not sized against. A substitution here is a
                               # re-derivation of R_LED1/R_LED2 (gotcha 2 and 3),
                               # cheap but not free. If C2286 ever goes short,
                               # pick the replacement by reading its Vf table,
                               # not by reading this line.
asserts:
  # DECLARED BUT NOT ACTUALLY GRADED TODAY — the same limitation the
  # ../SMBJ6.0A and ../BLM21SP601SN1D dossiers record: part_facts_check.py
  # decodes `equals:` through parse_si(), which is NUMERIC-ONLY, so an MPN
  # string returns None and the entry reports P-FACT-CONFIG and grades NOTHING.
  # Reported, not fixed — part_facts_check.py lives under skills/.
  #
  # AND A SECOND, BOARD-LEVEL DIVERGENCE FOUND WHILE WRITING THIS DOSSIER, WHICH
  # THE FIRST ONE IS CURRENTLY HIDING. `equals:` below names the MPN, because
  # that is what all thirteen sibling dossiers on this board do. But this board's
  # schematic does NOT put the MPN in `value` — it puts the LCSC CODE. Measured
  # 2026-07-28 from 06_build/netlists/pluto_rx2_8way.net:
  #     U_ESD  value "C7519"      U_LDO   value "C638611"
  #     D_TVS  value "C83270"     Y_XTAL  value "C20625731"
  #     FB_IN  value "C3716677"   U_FLASH value "C97521"
  #     F_IN   value "C2154056"   (passives carry the value: R_T1 "220Ω")
  # and the placeholders this dossier exists to fill read literally
  # `__LED_LCSC__` / `__SW_LCSC__`. So if part_facts_check.py ever gains the
  # literal-string fallback, EVERY MPN-asserting dossier on this board goes red
  # at once — not because a part is wrong, but because the assert convention and
  # the board convention disagree. That is ONE decision for the board owner
  # (move the asserts to C-codes, or make the BOM Comment carry the MPN), not
  # fifteen. Recorded here rather than silently diverging in this one file.
  - assert: value
    equals: KT-0603R
    why: "the BOM Comment must name the full order code, because on this part it
      is the ONLY identity that exists: section 2 shows no marking of any kind on
      the body — no printed code, nothing but the moulded cathode chamfer — so
      once the reel is loaded there is no way to tell a red 0603 from a green one
      except by powering it. And the near-miss is not exotic, it is the default:
      every 0603 indicator in the JLC library fits this land, and a green or blue
      substitution silently re-scales the current through the fixed 680 ohm
      ballast from 1.91 mA to between 1.03 and 0.29 mA (gotcha 2). The board
      assembles, passes DRC, parity and twin, and the indicators are dim or dark."
  # ~~NO `pad1_net_polarity` ASSERT, AND THE OMISSION IS DELIBERATE.~~
  # SUPERSEDED 2026-07-28 AT SCHEMATIC CAPTURE — the condition below is now
  # RESOLVED and the assert IS shipped, at the end of this block. The
  # reasoning is kept verbatim rather than deleted, because it is the record
  # of WHY the gate waited for a decision instead of guessing at one.
  # The graded kind reads pad 1's NET from the exported netlist and matches it
  # against a negative-net regex (GND|VSS|*_N|...). Whether pad 1 lands on a
  # negative net depends on WHERE THE BALLAST SITS, which is a schematic
  # decision this dossier does not own and which was not yet made on 2026-07-28:
  #   ballast on the ANODE side  (3V3/GPIO -> R -> A(pad 2); K(pad 1) -> GND)
  #     -> pad 1's net is GND -> the assert would PASS and would be a real gate
  #   ballast on the CATHODE side (3V3/GPIO -> A(pad 2); K(pad 1) -> R -> GND)
  #     -> pad 1's net is LED_PWR / LED_STAT -> the assert would FAIL on a
  #        CORRECTLY ORIENTED board
  # Shipping it now would be a coin-flip gate, and a gate that fires on a correct
  # board is how waiving becomes a habit (canon: a waiver copied is an inherited
  # defect). It is registered as OWED in 02_parts/README.md instead, with the
  # one-line change that closes it once the topology is fixed. The unconditional
  # half of the fact — pad 1 IS the cathode — is in pins: and gotcha 1, where it
  # cannot be conditional on anything.

  # ---- ENABLED 2026-07-28, and it could not have been enabled before. The
  # block above withheld this assert because it grades pad 1's NET, and which
  # net that is depends on which side of the LED the ballast sits — an open
  # schematic decision. THE TOPOLOGY IS NOW FIXED, in
  # 03_tscircuit/src/pluto_rx2_8way.tsx:
  #   R_LED1: 3V3 -> LED_PWR    ; LED_PWR.2 (A) = LED_PWR    , LED_PWR.1 (K) = GND
  #   R_LED2: LED_STAT -> LED_STAT_A ; LED_ST.2 (A) = LED_STAT_A , LED_ST.1 (K) = GND
  # The BALLAST IS ON THE ANODE SIDE of both indicators, so pad 1 is on GND on
  # both — the arm this block calls "a real gate". Read back off
  # 06_build/netlists/pluto_rx2_8way.net, not assumed.
  - assert: pad1_net_polarity
    pad: 1
    polarity: negative
    why: "pad 1 is the CATHODE in KiCad's numbering (Device:LED `Sim.Pins`
      1=K 2=A; LED_0603_1608Metric puts its F.Fab chamfer and its F.SilkS closed
      bar at the pad-1 end) and on both indicators the cathode goes straight to
      GND. WHY THIS PART SPECIFICALLY NEEDS IT: the VENDOR DRAWING NUMBERS ITS
      TERMINALS THE OTHER WAY ROUND — section 2's internal-circuit inset prints
      '+' at terminal 1 and '-' at terminal 2, with the diode bar and the
      moulded chamfer at terminal 2. Transcribing that figure FAITHFULLY, which
      is exactly what the 02_parts contract asks for, yields `1: A, 2: K` and
      reverses both indicators against the board's own silkscreen. Nothing else
      catches it: the netlist stays self-consistent, ERC/DRC/parity all pass,
      and a reversed indicator at V_R 5 V on a 3.3 V rail sits DARK AND
      UNDAMAGED — so the board arrives, works, and has two dead lights nobody
      can explain. This assert reads the net off the exported NETLIST; canon
      P2/P-POL grades the same fact off the BOARD. Two artifacts, one claim."
