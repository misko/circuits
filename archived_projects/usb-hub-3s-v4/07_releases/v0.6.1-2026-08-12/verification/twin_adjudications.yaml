- lcsc: C7125816
  refs: [U1]
  status: PAD-GEOM
  why: >-
    Measured 2026-08-12 against TI's official TPSM63610EVM design archive
    SLVRBM6.zip (download SHA-256
    18ab70a0bf3283c87f86ea359f08dd906483224ffb882bf54997180dce9b6405).
    Its ODB++ BSR234A U1 terminal coordinates independently reproduce the
    board land: relative to U1 centre and normalized for the 270-degree EVM
    placement, pads 1/9 are at x=-2.925mm,y=+/-2.688mm and pads 10/18 at
    x=+2.925mm,y=+/-2.504mm. JLC's generic catalog CAD instead places the
    four corners at +/-2.75mm, yielding the reported 0.31mm pad-1-to-pad-18
    span delta. The board follows TI's exact functioning EVM land; this row
    accepts that source-specific land difference, not a rotation guess. The
    independently measured offset-0 rotation remains on the JLC order-preview
    human gate.

- lcsc: C3020560
  refs: [J5]
  status: PAD-GEOM
  why: >-
    Measured 2026-08-12 against the pinned GCT USB4105 Revision B drawing,
    local SHA-256
    fb331fbabee8392ed2937ed757c1610cb0f174b84625147c0b580a18eea8c0e5.
    Its exact recommended PCB layout places the coincident A/B ground lands at
    x=+/-3.20mm and the coincident A/B VBUS lands at x=+/-2.40mm, so B4-to-B9
    is 4.80mm exactly as implemented. JLC's catalog CAD is the generic
    SBC-160S1A-20-S412 land and separates those paired contacts at x=+/-2.25mm,
    producing the reported 0.30mm span delta. Preserve the GCT exact-part land;
    the independently measured offset-0 placement remains subject to the JLC
    order-preview body-registration check.

