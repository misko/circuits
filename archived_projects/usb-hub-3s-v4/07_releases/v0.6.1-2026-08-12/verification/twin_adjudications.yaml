# USB Hub 3S v4 — machine-readable JLC twin dispositions.
#
# Every row below is an evidence-bound exception to one named finding. No row
# accepts a placement rotation. Machine-placed land differences prefer pinned
# manufacturer design data; genuine library absences require same-run working
# controls. Manual-part NO-BODY rows retain explicit first-article fit duties.

- lcsc: C5249699
  refs: [F1]
  status: PAD-MISMATCH
  why: >-
    Measured 2026-08-12: JLC's two-pad 3.40 mm CAD is not the complete Keystone
    3568 holder. Keystone M65 p.42 specifies the complete holder's four-hole,
    9.9 mm-terminal-spacing land used by this board. F1 is excluded from the
    CPL and hand-soldered; this accepts the catalog-CAD mismatch, not the land.
- lcsc: C5249699
  refs: [F1]
  status: PAD-GEOM
  why: >-
    The reported 6.52 mm delta is the measured difference between JLC's
    single-clip representation and the exact four-terminal Keystone 3568 land.
    The board land is independently fixed by the pinned manufacturer drawing,
    and F1 is not a JLC placement instruction.
- lcsc: C5249699
  refs: [F1]
  status: PAD-MULTIPLICITY
  why: >-
    Keystone M65 p.42 requires two plated holes for each of the holder's two
    terminals; duplicate pad numbers {1:2, 2:2} intentionally model those four
    barrels. JLC's CAD supplies one pad per terminal. F1 is hand-soldered.
- lcsc: C5249699
  refs: [F1]
  status: MODEL-REG
  why: >-
    A body registered to JLC's 3.40 mm two-pad CAD cannot align to the exact
    9.9 mm four-hole complete-holder land. assembly.yaml replaces that visual
    body with the board's complete Keystone 3568 model; F1 remains off the CPL.

- lcsc: C264098
  refs: [Q1]
  status: PAD-MISMATCH
  model_rot_z: 270
  why: >-
    Measured 2026-08-12 against pinned Diodes DS40141 Rev. 5-2 p.6. The board
    implements the exact PowerDI3333-8 Type UX suggested land: four 0.42 x
    0.70 mm source/gate lands on 0.65 mm pitch and the manufacturer X3/Y3
    continuous drain copper with physical identities 5-8 retained. JLC's
    POWERPAK-1212 CAD instead assigns its generic 2.60 x 2.20 mm paddle to pad
    8, producing 0.892 mm twin residual. The independently pcbnew-verified
    terminal fit is unambiguous at 270 (0.4991 mm vs 2.2701 mm next), and the
    function-tied drain-paddle side agrees with DS40141 Bottom View. Rotate the
    visual body 270; do not substitute JLC's generic land for the manufacturer
    land.
- lcsc: C264098
  refs: [Q1]
  status: PAD-GEOM
  why: >-
    Measured 2026-08-12: JLC's generic POWERPAK centroids make pad 2-to-7
    3.00 mm versus 2.52 mm on the board (0.48 mm delta). Pinned manufacturer
    DS40141 p.6 specifies 0.65 mm pitch, 0.42 x 0.70 mm perimeter lands and the
    X3/Y3 continuous drain land implemented by the project footprint. This is
    an exact-manufacturer-land versus generic-catalog-CAD preference, not an
    unevidenced waiver; the order preview must still confirm Q1 rotation.

- lcsc: C83846
  refs: [D1]
  status: PAD-GEOM
  why: >-
    Measured 2026-08-12: exact SMBJ15A in DO-214AA/SMB, with locally pinned
    Littelfuse JC.07/04/25 v4 series sheet SHA-256
    d7df155be4b1f612085401e8c946f065e284d65a0e7de22b9225a7b73946e51b.
    The reported 0.42 mm pad-1-to-pad-2 span delta is a fillet/land-extent
