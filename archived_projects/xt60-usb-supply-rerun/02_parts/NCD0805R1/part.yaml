pins:
  "1":
    name: K
    note: >
      CATHODE = the end carrying the GREEN silkscreen marks (two green
      corner squares in the p.2 outline drawing, legend "Solder Area /
      bottom silkscreen"). Verified via the p.2 carrier-tape figure: the
      diode symbol beside the tape points its cathode bar toward the same
      edge where the green marks sit on the pocketed parts. Numbered "1"
      here to match KiCad pad 1 = cathode; the vendor drawing itself does
      not print pin numbers.
  "2":
    name: A
    note: anode, unmarked end
limits:
  if_max: 25mA DC
  ifp_max: 50mA (0.1ms, 1/10 duty)
  vf: 1.5-2.6V typ 2.0V
  vr_max: 5V
  pd_max: 65mW
  temp_range: -30C to +85C
gotchas:
  - >
    KiCad LED_0805_2012Metric pad 1 = cathode (footprint silkscreen bar and
    F.Fab chamfer on the pad-1 side) - orient the green-marked end of this
    part onto pad 1.
  - Red Vf (~2.0V) is a volt below the green KT-0805G (~2.8V); if both LEDs
    share a series-resistor value the red will draw noticeably more current.
verified: >
  Electro-optical and absolute-max tables from p.1; polarity from p.2
  outline + carrier-tape figures (green mark = cathode end). 2026-07-16.
