mpn: TYPE-C-31-M-12A
manufacturer: Korean Hroparts Elec (HRO)
type: usb_c_receptacle
description: >
  USB Type-C 16-pin SMD+THT receptacle, high-conductivity-copper 6 A
  high-current variant (drawing title "gao dao tong, guo 6A da dian liu
  kuan"). 16 signal contacts, stainless shell with 4 THT legs, 2 locating
  pegs. Power-only / USB 2.0 class (no SuperSpeed pins).
datasheet:
  doc_id: TYPE-C-31-M-12A
