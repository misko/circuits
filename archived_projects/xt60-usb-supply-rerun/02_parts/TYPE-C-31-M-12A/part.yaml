  url: https://datasheet.lcsc.com/datasheet/pdf/12a90887c690607bfae27dd23b7920e4.pdf?productCode=C5337088
  sha256: fd8a23ee5f8bad1c98f53d3269d70d727d342216a4de7abc438f099b21ca62f5
