package: USB-C 16P hybrid SMD signal / THT shell, 8.94 x 7.35 mm body
footprint: Connector_USB:USB_C_Receptacle_HRO_TYPE-C-31-M-12
footprint_note: >
  Mechanical match verified against the -12A drawing: locating holes Dia0.60
  on 5.78 mm centers (KiCad NPTH Dia0.65 at x=+/-2.89 - same centers, +0.05
  clearance), 4 shell oval slots at x=+/-4.32 with 4.18 mm front/rear row
  spacing (KiCad slots 0.6x1.7 front / 0.6x1.2 rear at y spacing 4.18 -
  drawing shows the same 1.70/1.20 slots). Signal pad x-positions identical
  (A5-A8 at +/-0.25,+/-1.25; B5-B8 at +/-0.75,+/-1.75; outer pads at
  +/-2.4(5),+/-3.2(5)). KiCad uses slightly longer pads (1.45 vs 1.14 mm)
  and separate overlapping A/B pads where the LCSC vendor footprint
  (easyeda2kicad C5337088) merges A1/B12, A4/B9, B1/A12, B4/A9 - both fine.
  HRO -12 and -12A share the land pattern; confirmed empirically here.
