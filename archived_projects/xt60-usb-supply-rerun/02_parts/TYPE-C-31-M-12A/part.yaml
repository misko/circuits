gotchas:
  - >
    6 A is the CONNECTOR total across the 4 VBUS pads (A4,A9,B4,B9) - route
    all four VBUS and all GND pads with copper sized for 6 A.
  - CC1 AND CC2 both need their own 5.1k pulldown (sink) - do not share one
    resistor, or one plug orientation loses power negotiation.
  - D+/D- appear twice (A6/A7 and B6/B7); short A/B pairs together for
    USB 2.0 data in either plug orientation.
  - Shell legs are THT slots (oval 0.6x1.7 and 0.6x1.2); board must be
    fabbed with plated slots, not round holes.
verified: >
  Pin table transcribed from the datasheet's PIN/SIGNAL NAME table (sheet 1,
  Rev A drawn 2022.10.26); 6A/20V from note 4 ELECTRICAL PERFORMANCE;
  land-pattern match measured pad-by-pad between the drawing's RECOMMEND
  P.C.B LAYOUT, KiCad USB_C_Receptacle_HRO_TYPE-C-31-M-12, and easyeda2kicad
  C5337088. 2026-07-16.
