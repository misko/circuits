# Twin adjudications — known-different findings between our footprints and
# JLC's EasyEDA CAD, each with verification evidence. Gate: zero
# UNadjudicated criticals. Format (top-level YAML list):
#   - {lcsc: Cxxxx, refs: [U1], status: <finding status>, why: "<evidence>"}
# Optional per-part render override: model_rot_z.
- lcsc: C400894
  refs: [Q1]
  status: MODEL-REG
  why: >
    DPAK body-bbox asymmetry, not a mis-mount. Pixel-measured twin_top.png
    against the 4 mounting holes (10.487 px/mm, H4 cross-check exact,
    2026-07-16): tab metal centered x=124.1mm on our 6.4mm tab pad
    (center 124.0), both gull-wing lead groups on the pin pads
    (121.35/125.95 vs pads 121.72/126.28 — the 0.4mm is the reported
    pad-fit residual, fit=0.43mm), pin-1 dot at pad 1 (PFET_G). Rendered
    body 6.3x5.7mm matches the TO-252 6.6x6.1 spec, so not a wrong-model
    swap. The 1.3mm bbox-center delta decomposes as the WRL bbox's
    inherent lead-axis asymmetry (x range -4.19..+2.39mm, 0.9mm
    off-center: leads protrude one side, exposed tab the other) plus the
    courtyard center sitting between tab and lead spans; the script's own
    180-flip probe did NOT bring it under 1mm, confirming it is not a
    flipped model.
    ADDENDUM 2 (2026-07-16, supersedes addendum 1): the true decomposition
    is in the C400894 PAD-GEOM entry below - a land-pattern delta ALONG
    the tab-lead axis plus a ~0.95mm MODEL-INTERNAL offset TRANSVERSE to
    it (EasyEDA model drawn off JLC's own footprint). Addendum 1's
    "0.9 bbox + 0.4 land" split and the v1.0.1 model_dx nudge were both
    wrong (nudge applied in the rotated frame moved the model north).
    After the correct model_dy fix the bbox-based MODEL-REG reads 2.0mm
    by construction - metal-vs-pad pixel measurement is authoritative.
- lcsc: C400894
  refs: [Q1]
  status: PAD-GEOM
  model_dy: 0.92
  why: >
    Two INDEPENDENT defects, separated by pixel measurement (2026-07-16):
    (1) land-pattern style delta ALONG the tab-lead axis: our TO-252-2
    tab<->lead pad distance 6.70mm vs JLC 7.31mm - pads differ in extents,
    physical DPAK foot lands on our lead pads under either reading;
    (2) the JLC 3D MODEL is drawn ~0.95mm off JLC's OWN footprint
    TRANSVERSE to that axis (both gull leads measured 0.92mm west of pad
    centers in the v1.0 render while transverse pad centroids of both
    footprints are symmetric - so the offset is model-internal, an
    EasyEDA model defect, not a mount or land-pattern error).
    model_dy +0.92 (footprint-LOCAL frame, rot 0: +y = board +x only
    for THIS part's 90deg board rotation) re-seats the metal: measured
    after nudge, gate lead 121.65 vs pad 121.72, source 126.25 vs
    126.28, body centerline 124.01 vs 124.0. CAUTION: an earlier
    model_dx nudge (v1.0.1) was wrong - it moved the model NORTH
    because local +x rotates to board -y at rot 90; always convert
    board-frame corrections to footprint-local through the part
    rotation, and verify by diffing renders (a static bright board
    feature near the gate pad polluted color-only measurements twice).
    MODEL-REG reads 2.0mm AFTER the fix and its 180-flip hint is a red
    herring: the WRL bbox center is doubly confounded here (lead-axis
    bbox asymmetry + the model-internal transverse offset), so the
    metal-vs-pad pixel measurement above is authoritative for this part.
